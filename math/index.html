<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>123 小島</title>
<meta name="theme-color" content="#fff4d6">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fff4d6;      /* 算術簿的淡黃 */
  --grid:#f3d78f;
  --ink:#4a3322;
  --orange:#f08a24;
  --deep:#c4600c;
  --green:#3aa65c;
  --sun:#ffc93c;
  --card:#ffffff;
  --shadow:#ecc979;
  --mute:#8a6f52;
  --num:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:36px 36px;background-position:-1px -1px;
  color:var(--ink);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hide{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 上方列 */
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:76px}
.round{width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 var(--shadow);font-size:30px;display:grid;place-items:center;flex:none}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
#hall{font-size:15px;font-weight:700;width:auto;padding:0 18px;border-radius:32px;height:52px;text-decoration:none;color:inherit}
#ltag{font-weight:900;font-size:20px;background:var(--card);border-radius:30px;padding:8px 16px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
#stars{margin-left:auto;font-weight:900;font-size:22px;background:var(--card);border-radius:30px;padding:8px 16px;box-shadow:0 3px 0 var(--shadow)}
#gear{position:relative;overflow:hidden}
#gear .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(240,138,36,.3)}

/* 小黑與對話泡泡 */
#stage{display:flex;align-items:center;gap:10px;padding:0 14px 6px;min-height:108px}
#bear{width:100px;height:100px;flex:none}
#bear svg,.bearbig svg{width:100%;height:100%;overflow:visible}
.mouth{transform-origin:60px 70px;transition:transform .08s}
#bear.talk .mouth{transform:scaleY(2.1)}
#bear.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}}
#bubble{position:relative;background:var(--card);border-radius:22px;padding:14px 20px;font-size:22px;font-weight:700;line-height:1.4;max-width:640px;box-shadow:0 3px 0 var(--shadow)}
#bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--card);border-left:0}
#bubble:empty{visibility:hidden}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 14px 24px;-webkit-overflow-scrolling:touch}

/* 首頁 */
.ghead{max-width:920px;margin:6px auto 12px;font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px}
.ghead b{background:var(--orange);color:#fff;border-radius:12px;padding:2px 12px;font-size:18px}
#home{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:920px;margin:0 auto}
.tile{position:relative;background:var(--card);border-radius:26px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 var(--shadow);min-height:150px;justify-content:center}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--shadow)}
.tile .emo{font-family:var(--emoji);font-size:54px;line-height:1.1}
.tile .lab{font-size:21px;font-weight:900}
.tile .no{position:absolute;left:10px;top:8px;font-family:var(--num);font-size:20px;color:var(--orange)}
.tile .st{font-size:18px;letter-spacing:2px;color:#e8dcc4}.tile .st .on{color:var(--sun);text-shadow:0 1px 0 #d9a400}
.tile.book .emo{font-size:54px}
@media (max-width:760px){#home{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){#home{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:132px}.tile .emo{font-size:46px}}

/* 題目共用 */
.qa{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:1100px;margin:0 auto}
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--grid)}
.dots span.done{background:var(--sun);border-color:#e3a800}
.main{display:flex;flex-direction:column;align-items:center;gap:18px}
.card{background:var(--card);border-radius:28px;box-shadow:0 5px 0 var(--shadow);padding:16px 20px}
.opts{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.num{min-width:132px;height:132px;padding:0 14px;border-radius:28px;background:var(--card);box-shadow:0 5px 0 var(--shadow);border:4px solid var(--grid);
  font-family:var(--num);font-weight:700;font-size:92px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
.num:active{transform:translateY(3px)}
.num .hint{font-size:14px;letter-spacing:1px;color:var(--orange);line-height:1;margin-top:2px;height:14px}
.ok{border-color:var(--green)!important;background:#e6f7ec!important;animation:pop .45s}
.no{animation:shake .4s;opacity:.45}
.glow{border-color:var(--sun)!important;box-shadow:0 0 0 8px rgba(255,201,60,.6),0 5px 0 var(--shadow)!important;animation:pulse 1.2s infinite}
.dim{opacity:.35;pointer-events:none}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes pulse{50%{transform:scale(1.05)}}
.say{background:var(--orange);color:#fff;border-radius:40px;padding:14px 28px;font-size:24px;font-weight:900;box-shadow:0 4px 0 var(--deep);min-height:64px;display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 var(--deep)}
.say.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--shadow)}

/* 東西：一格一個，五個一排（像十格框） */
.tray{display:grid;grid-template-columns:repeat(var(--cols,5),auto);gap:8px;justify-content:center}
.ob{position:relative;width:var(--s,96px);height:var(--s,96px);border-radius:20px;background:#fffaf0;border:3px dashed #f1e1bd;
  display:grid;place-items:center;font-family:var(--emoji);font-size:calc(var(--s,96px)*.68);line-height:1}
.ob.empty{background:transparent}
.tray.small .ob.empty,.boxwrap>.tray .ob.empty{border-color:transparent}
.ob.cnt{border:3px solid var(--orange);background:#fff1dc;animation:pop .3s}
.ob .bd{position:absolute;right:-6px;top:-8px;min-width:30px;height:30px;padding:0 6px;border-radius:15px;background:var(--orange);color:#fff;font:700 20px/30px var(--num);text-align:center;display:none}
.ob.cnt .bd{display:block}
.tray.small{gap:4px}.tray.small .ob{border-radius:12px;border-width:2px}.tray.small .ob .bd{min-width:22px;height:22px;font-size:14px;line-height:22px;right:-4px;top:-6px;border-radius:11px}
.plate{background:var(--card);border-radius:30px;border:4px solid var(--grid);box-shadow:0 5px 0 var(--shadow);padding:12px}
.plate:active{transform:translateY(3px)}
.plate.target{border-color:var(--orange);pointer-events:auto}
.plates{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.plates.col{flex-direction:column;align-items:center;gap:14px}
.bignum{font-family:var(--num);font-weight:700;font-size:150px;line-height:1;color:var(--orange);background:var(--card);border-radius:30px;box-shadow:0 5px 0 var(--shadow);padding:6px 40px;min-width:180px;text-align:center}
.speak{font-size:68px;width:150px;height:150px;border-radius:50%;background:var(--card);box-shadow:0 5px 0 var(--shadow)}
.speak:active{transform:translateY(3px)}

/* 小火車 */
.train{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;justify-content:center}
.loco{font-family:var(--emoji);font-size:96px;line-height:1}
.car{width:104px;height:104px;border-radius:18px 18px 10px 10px;background:#ffd36a;border:4px solid #e3a800;position:relative;
  font:700 72px/1 var(--num);display:grid;place-items:center;color:var(--ink);margin-bottom:12px}
.car::before,.car::after{content:"";position:absolute;bottom:-16px;width:26px;height:26px;border-radius:50%;background:#555;border:4px solid #888}
.car::before{left:12px}.car::after{right:12px}
.car:nth-child(odd){background:#9fd4ff;border-color:#4a9be0}
.car.blank{background:#fff;border-style:dashed;color:var(--orange)}
.car.cnt{box-shadow:0 0 0 6px rgba(255,201,60,.7)}
.car.wait{background:#f6efe2;border-color:#e3d3b4;color:transparent}
.train.go{animation:goo 1.4s ease-in forwards}
@keyframes goo{to{transform:translateX(120vw)}}

/* 十格盒 */
.boxwrap{display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
.tenbox{position:relative;cursor:pointer;border:5px solid var(--orange);border-radius:22px;background:#fff1dc;padding:8px}
.tenbox .tray{gap:4px}
.tenbox .lbl{position:absolute;left:50%;top:-22px;transform:translateX(-50%);background:var(--orange);color:#fff;border-radius:14px;padding:0 12px;font:700 26px/36px var(--num)}
.tenbox.cnt{box-shadow:0 0 0 8px rgba(255,201,60,.6)}

/* 貼紙簿 */
.bk{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;max-width:960px;margin:0 auto}
.stk{aspect-ratio:1;border-radius:50%;background:var(--card);border:3px dashed var(--grid);display:grid;place-items:center;font-size:58px;font-family:var(--emoji)}
.stk.got{border:3px solid var(--sun);box-shadow:0 4px 0 #e3a800}

/* 完成、開始、家長、休息 */
#reward{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(74,51,34,.35)}
#reward .card{text-align:center;padding:30px 40px}
#reward .stk{width:180px;margin:0 auto 18px;font-size:110px;animation:spinIn .8s}
@keyframes spinIn{from{transform:scale(0) rotate(-200deg)}}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center}
.overlay{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:36px 36px}
#start h1{font-size:clamp(52px,10vw,104px);margin:0;letter-spacing:.06em;font-weight:900}
#start h1 span{font-family:var(--num);color:var(--orange)}
.bearbig{width:180px;height:180px}
#parent{z-index:45;justify-content:flex-start;overflow-y:auto}
.panel{background:var(--card);border-radius:24px;padding:20px 22px;width:min(760px,100%);box-shadow:0 4px 0 var(--shadow)}
.panel h2{margin:0 0 12px;font-size:22px}
.panel .row{justify-content:flex-start;margin:8px 0}
.chip{background:#fbf1de;border-radius:30px;padding:10px 18px;font-weight:700;font-size:17px;min-height:48px;display:inline-flex;align-items:center}
.chip.on{background:var(--orange);color:#fff}
.note{color:var(--mute);font-size:14px;line-height:1.6}
.ptab{width:100%;border-collapse:collapse;font-size:16px}.ptab td{padding:6px 4px;border-bottom:1px solid #f3e6c9}.ptab td.w{color:#c33}
.gate{font-size:34px;font-weight:900;font-family:var(--num)}

/* 大小螢幕 */
@media (min-width:900px) and (min-height:760px){.num{min-width:150px;height:150px;font-size:104px}}
@media (max-width:520px){
  #bubble{font-size:18px;padding:10px 14px}#bear{width:78px;height:78px}#stage{min-height:84px}#hall{padding:0 12px}#ltag{font-size:15px;padding:6px 10px}
  .num{min-width:96px;height:96px;font-size:66px;border-radius:22px}.opts{gap:10px}
  .bignum{font-size:110px;padding:4px 24px;min-width:130px}.speak{width:120px;height:120px;font-size:54px}
  .loco{font-size:60px}.car{width:62px;height:62px;font-size:42px;border-radius:12px 12px 8px 8px;margin-bottom:10px}.car::before,.car::after{width:16px;height:16px;bottom:-11px;border-width:3px}.car::before{left:6px}.car::after{right:6px}
  .plate{padding:8px;border-radius:22px}.plates{gap:10px}.say{font-size:20px;padding:12px 20px;min-height:56px}}
/* 平板、手機橫放：矮的螢幕把題目和答案並排 */
@media (max-height:600px) and (min-width:600px){
  #bar{min-height:58px;padding:6px 12px}.round{width:52px;height:52px;font-size:24px}#hall{height:44px}
  #stage{min-height:60px;padding-bottom:2px}#bear{width:58px;height:58px}#bubble{font-size:18px;padding:8px 16px}
  .qa{gap:10px}.qa.side{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 28px}
  .qa.side>.dots{flex-basis:100%}
  .qa.side .opts{flex-direction:column;gap:10px}
  .num{min-width:92px;height:92px;font-size:62px;border-radius:22px}
  .bignum{font-size:96px;padding:2px 26px;min-width:120px}.speak{width:110px;height:110px;font-size:50px}
  .loco{font-size:60px}.car{width:66px;height:66px;font-size:44px;margin-bottom:10px}.car::before,.car::after{width:16px;height:16px;bottom:-11px;border-width:3px}
  .main{gap:10px}.plates{gap:12px}.plate{padding:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="round" id="homeBtn" aria-label="回首頁">🏠</button>
    <a class="round" id="hall" href="../index.html">← 遊戲大廳</a>
    <span id="ltag" class="hide"></span>
    <span id="stars" aria-label="貼紙數">⭐ 0</span>
    <button class="round" id="gear" aria-label="家長區（按住兩秒）"><span class="fill"></span>⚙️</button>
  </div>
  <div id="stage">
    <button id="bear" aria-label="小黑，再說一次"></button>
    <div id="bubble" aria-live="polite"></div>
  </div>
  <div id="view"></div>
</div>

<div class="overlay" id="start">
  <div class="bearbig" id="startBear"></div>
  <h1><span>123</span> 小島</h1>
  <button class="say" id="go">▶ 點一下開始</button>
</div>

<script src="data.js"></script>
<script>
'use strict';
const { CN, ITEMS, BOXABLE, LESSONS, GROUPS, P, hash } = M;
const $ = (s, el = document) => el.querySelector(s);
const view = $('#view');
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);

/* ---------- 小黑（台灣黑熊）---------- */
const BEAR = `<svg viewBox="0 0 120 120" aria-hidden="true">
  <circle cx="26" cy="26" r="16" fill="#26221f"/><circle cx="94" cy="26" r="16" fill="#26221f"/>
  <circle cx="26" cy="26" r="8" fill="#6b5546"/><circle cx="94" cy="26" r="8" fill="#6b5546"/>
  <ellipse cx="60" cy="108" rx="34" ry="18" fill="#26221f"/>
  <path d="M40 98 L60 112 L80 98 L74 96 L60 105 L46 96 Z" fill="#fff6e0"/>
  <circle cx="60" cy="58" r="42" fill="#2e2925"/>
  <ellipse cx="60" cy="72" rx="22" ry="17" fill="#d9b48a"/>
  <ellipse cx="60" cy="62" rx="8" ry="5.5" fill="#1a1715"/>
  <path d="M60 67 L60 70" stroke="#1a1715" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse class="mouth" cx="60" cy="74" rx="7" ry="2.6" fill="#8a3b2e"/>
  <circle cx="44" cy="46" r="7" fill="#fff"/><circle cx="76" cy="46" r="7" fill="#fff"/>
  <circle cx="45.5" cy="47" r="4" fill="#1a1715"/><circle cx="77.5" cy="47" r="4" fill="#1a1715"/>
  <circle cx="47" cy="45.5" r="1.4" fill="#fff"/><circle cx="79" cy="45.5" r="1.4" fill="#fff"/>
  <circle cx="34" cy="64" r="6" fill="#ff8a8a" opacity=".45"/><circle cx="86" cy="64" r="6" fill="#ff8a8a" opacity=".45"/>
</svg>`;
$('#bear').innerHTML = BEAR; $('#startBear').innerHTML = BEAR;

/* ---------- 進度 ---------- */
const KEY = 'math-v1';
const today = () => new Date().toISOString().slice(0, 10);
const fresh = () => ({ rounds: {}, score: {}, stickers: [], day: today(), sec: 0, rest: 15 });
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S = Object.assign(fresh(), S);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
function mark(k, ok) { const v = S.score[k] || (S.score[k] = [0, 0]); v[ok ? 0 : 1]++; save(); }
function weight(k) { const v = S.score[k] || [0, 0]; return Math.max(.3, 1 + v[1] * 1.5 - Math.min(v[0], 4) * .2); }
function wpick(list, key) {
  const ws = list.map(x => weight(key(x))); let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; } return list[list.length - 1];
}
const STICKERS = ['🐻','🐼','🦊','🐸','🐙','🦄','🐳','🦋','🐞','🐢','🦒','🦁','🐧','🐬','🦉','🐨','🐹','🐰','🦕','🐝',
  '🌈','🌻','🍉','🍓','🍩','🧁','🍭','🚀','🚂','🎈','🪁','⚽','🎨','🎸','🏰','⛵','🌟','🌙','☀️','🍀'];
const updStars = () => { $('#stars').textContent = '⭐ ' + S.stickers.length; };

/* ---------- 聲音（預錄音檔，沒有才用瀏覽器語音）---------- */
let AC = null;
const bufs = new Map();
let cur = null, token = 0;
function ctx() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } return AC; }
function load(text) {
  const id = hash(text);
  if (!bufs.has(id)) bufs.set(id, fetch('audio/' + id + '.mp3').then(r => r.ok ? r.arrayBuffer() : null)
    .then(ab => ab && ctx() ? new Promise((ok, no) => ctx().decodeAudioData(ab, ok, no)) : null).catch(() => null));
  return bufs.get(id);
}
function stopAll() { token++; if (cur) { try { cur.stop(); } catch (e) {} cur = null; } if (window.speechSynthesis) speechSynthesis.cancel(); mouth(false); }
let mt = null;
function mouth(on) { clearInterval(mt); $('#bear').classList.remove('talk'); if (on) { let o = false; mt = setInterval(() => { o = !o; $('#bear').classList.toggle('talk', o); }, 140); } }
async function play(text) {
  const my = token;
  const buf = await load(text);
  if (my !== token) return false;
  mouth(true);
  try {
    if (buf) await new Promise(res => { const src = ctx().createBufferSource(); src.buffer = buf; src.connect(ctx().destination); src.onended = res; cur = src; src.start(); });
    else await fallback(text);
  } finally { mouth(false); }
  return my === token;
}
function fallback(text) {
  return new Promise(res => {
    if (!window.speechSynthesis) return setTimeout(res, 500);
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)); if (v) u.voice = v;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 800 + text.length * 350);
    speechSynthesis.speak(u);
  });
}
let lastLines = [];
async function say(...lines) {
  lines = lines.filter(Boolean); stopAll(); const my = token; lastLines = lines;
  for (const l of lines) {
    if (my !== token) return false;
    $('#bubble').textContent = l;
    if (!(await play(l))) return false;
    await sleep(140);
  }
  return my === token;
}
// 不換泡泡文字的短句（數數、點到的數字）

const ROUND = 6;
SCREENS.lesson = id => {
  const L = LESSONS.find(x => x.id === id), my = sess;

async function runRound(L, my) {
  const G = GEN[L.id];
  const qs = G.plan(ROUND);
  let retries = 0, done = 0, first = true;
  while (qs.length) {
    const q = qs.shift();
    const ok = await G.ask(q, { my, dots: dotsHTML(ROUND, done), intro: first ? P.intro[L.id] : null });
    first = false; done++;
    mark(`${L.id}:${G.key(q)}`, ok);
    // 答錯的題目，晚一點用新的樣子再出一次（最多 2 題）
    if (!ok && retries < 2) { retries++; qs.splice(Math.min(qs.length, 2), 0, G.again ? G.again(q) : q); }
    await W(my, sleep(500));
  }
  S.rounds[L.id] = (S.rounds[L.id] || 0) + 1; save();
  finishRound(L.id);
}
function dotsHTML(n, i) { return `<div class="dots">${Array.from({ length: n }, (_, k) => `<span class="${k < i ? 'done' : ''}"></span>`).join('')}</div>`; }

  const left = STICKERS.filter(x => !S.stickers.includes(x));
  const st = left.length ? pick(left) : pick(STICKERS);
  S.stickers.push(st); save(); updStars();
  const r = h(`<div id="reward"><div class="card"><div class="stk got">${st}</div>
    <div class="row"><button class="say" data-a="again">🔁 再玩一次</button><button class="say alt" data-a="home">🏠 回首頁</button></div></div></div>`);
  document.body.appendChild(r);
  r.querySelector('[data-a=again]').onclick = () => go('lesson', id);
  r.querySelector('[data-a=home]').onclick = () => go('home');

}

/* ---------- 共用元件 ---------- */
// 數字按鈕；hint=true 時數字下面加小圓點
function numBtn(n, hint) { return `<button class="num" data-v="${n}">${n}${hint ? `<span class="hint">${'●'.repeat(n)}</span>` : ''}</button>`; }
function numOpts(ans, lo, hi, n = 3, near = 2) {
  const pool = range(Math.max(lo, ans - near), Math.min(hi, ans + near)).filter(x => x !== ans);
  const out = shuffle(pool).slice(0, n - 1);
  while (out.length < n - 1) { const x = lo + rand(hi - lo + 1); if (x !== ans && !out.includes(x)) out.push(x); }
  return shuffle([ans, ...out]).sort((a, b) => a - b);
}
// 一盤東西：n 個，排在 rows 列 × 5 格裡；scatter 時隨機放在格子裡
function trayHTML(it, n, o = {}) {
  const cols = o.cols || 5, cells = o.cells || Math.max(cols, Math.ceil(n / cols) * cols);
  let pos = range(0, n - 1);
  if (o.scatter) pos = shuffle(range(0, cells - 1)).slice(0, n).sort((a, b) => a - b);
  const set = new Set(pos);
  return `<div class="tray ${o.small ? 'small' : ''}" style="--cols:${cols};--s:${o.size || 96}px">${range(0, cells - 1).map(i =>
    set.has(i) ? (o.static ? `<span class="ob">${it.e}<span class="bd"></span></span>` : `<button class="ob" aria-label="${it.n}">${it.e}<span class="bd"></span></button>`) : `<span class="ob empty"></span>`).join('')}</div>`;
}
// 依螢幕大小決定東西的尺寸
function objSize(n, cols, frac = 1) {
  const rows = Math.ceil(n / cols);
  const w = Math.min(view.clientWidth - 40, 1000) * frac, hgt = view.clientHeight - 200;
  return Math.max(36, Math.min(110, Math.floor(Math.min((w - cols * 10) / cols, (hgt - rows * 10) / rows / 1.1))));
}
// 盤子裡東西的大小；直立的螢幕把盤子上下排
const tall = () => view.clientHeight > view.clientWidth * 1.15;
function plateSize(nPlates, extra = 200) {
  const W = Math.min(view.clientWidth - 40, 1100), H = view.clientHeight - extra;
  const s = tall() ? Math.min((W - 60) / 5.3, H / (nPlates * 2) / 1.35) : Math.min((W - nPlates * 46) / nPlates / 5.5, H / 2 / 1.45);
  return Math.max(28, Math.min(88, Math.floor(s)));
}
// 點東西一個一個數；回傳 { reset, count, demo }
function counter(objs, o = {}) {
  let n = 0; const base = o.base || 0;
  const tap = async el => {
    if (el.classList.contains('cnt')) return;
    if (o.before) await o.before();
    n++; el.classList.add('cnt'); el.querySelector('.bd').textContent = base + n;
    blip(CN(base + n));
    if (n === objs.length && o.all) o.all();
  };
  objs.forEach(el => el.onclick = () => tap(el));
  return {
    get n() { return n; },
    reset() { n = 0; objs.forEach(el => el.classList.remove('cnt')); },
    lock() { objs.forEach(el => el.onclick = null); },
    // 示範：一個一個亮起來、念出來
    async demo(my) {
      this.reset();
      for (const el of objs) { n++; el.classList.add('cnt'); el.querySelector('.bd').textContent = base + n; stopAll(); await W(my, play(CN(base + n))); await W(my, sleep(120)); }
    },
  };
}
const praise = () => pick(P.praise);
const T = {};   // 測試用：目前的正確／錯誤答案
// 選答案：答對回傳 true（第一次就對）或 false（錯了以後再點發亮的答案）
async function choose(my, btns, isRight, onWrong, onRight) {
  let firstTry = true;
  T.right = () => btns.find(isRight); T.wrong = () => btns.find(b => !isRight(b));
  return new Promise((resolve, reject) => {
    let busy = false;
    btns.forEach(b => b.onclick = async () => {
      if (busy) return;
      try {
        if (isRight(b)) {
          busy = true; chime(true); b.classList.remove('glow'); b.classList.add('ok');
          btns.forEach(x => { if (x !== b) x.classList.add('dim'); });
          if (onRight) await W(my, onRight(b)); else await W(my, say(praise()));
          resolve(firstTry);
        } else {
          if (!firstTry) { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); return; }
          busy = true; firstTry = false; chime(false); b.classList.add('no');
          btns.forEach(x => x.style.pointerEvents = 'none');
          await W(my, onWrong(b));
          const right = btns.find(isRight);
          btns.forEach(x => { x.style.pointerEvents = ''; if (x !== right) x.classList.add('dim'); });
          right.classList.add('glow'); busy = false;
        }
      } catch (e) { if (e !== STOP) console.error(e); reject(e); }
    });
  });
}

  while (out.length < n) { const x = wpick(list.filter(v => v !== last || list.length < 2), key); out.push(x); last = x; }

}

  again: q => ({ n: q.n, it: pickItem({ box: true }) }),
  async ask(q, c) {
    const { my } = c, loose = q.n - 10;
    const size = Math.min(72, objSize(10, 5, .4));
    const qa = frame({
      main: `<div class="card boxwrap"><div class="tenbox" role="button" aria-label="一盒十個"><span class="lbl">10</span>${trayHTML(q.it, 10, { cols: 5, small: true, static: true, size })}</div>
        ${trayHTML(q.it, loose, { cols: 5, cells: loose <= 5 ? 5 : 10, small: true, size })}</div>`,
      opts: numOpts(q.n, 11, 20, 3, 2).map(v => numBtn(v)).join(''),
    }, c.dots);
    const box = qa.querySelector('.tenbox');
    box.querySelectorAll('.ob').forEach(o => o.style.pointerEvents = 'none');
    const objs = [...qa.querySelectorAll('.boxwrap > .tray .ob:not(.empty)')];
    let boxed = false;
    const openBox = async () => { if (boxed) return; boxed = true; box.classList.add('cnt'); stopAll(); await W(my, play(P.box)); };
    box.onclick = () => { if (!boxed) openBox().catch(() => {}); };
    const cn = counter(objs, { base: 10, before: openBox, all: () => setTimeout(() => { if (my === sess) say(P.total(q.it, q.n)); }, 650) });
    const btns = [...qa.querySelectorAll('.num')];
    preload(P.howMany(q.it), P.total(q.it, q.n), P.box, ...range(11, q.n).map(CN));
    if (c.intro) await W(my, say(c.intro));
    say(P.howMany(q.it));
    return choose(my, btns, b => +b.dataset.v === q.n,
      async () => {
        await say(P.together); cn.lock(); box.onclick = null;
        box.classList.remove('cnt'); await W(my, sleep(200)); box.classList.add('cnt'); stopAll(); await W(my, play(P.box));
        await cn.demo(my); await say(P.total(q.it, q.n)); say(P.tapGlow);
      },
      async () => { cn.lock(); box.onclick = null; await say(praise(), P.total(q.it, q.n)); });
  },
};

/* ---------- 家長區 ---------- */
(function () {
  const g = $('#gear'), f = g.querySelector('.fill'); let t0 = 0, raf = 0;
  const down = e => { e.preventDefault(); t0 = performance.now(); const tick = () => { const p = (performance.now() - t0) / 2000; f.style.height = Math.min(100, p * 100) + '%'; if (p >= 1) { up(); gate(); } else raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); };
  const up = () => { cancelAnimationFrame(raf); f.style.height = '0'; };
  g.addEventListener('pointerdown', down); g.addEventListener('pointerup', up); g.addEventListener('pointerleave', up); g.addEventListener('pointercancel', up);
  g.addEventListener('contextmenu', e => e.preventDefault());
})();
function gate() {
  stopAll();
  const a = 12 + rand(30), b = 6 + rand(9), ans = a + b;
  const opts = shuffle([ans, ans + 1 + rand(3), ans - 1 - rand(3)]);
  const o = h(`<div class="overlay" id="parent"><div class="panel" style="text-align:center"><h2>家長區</h2>
    <p class="gate">${a} + ${b} = ?</p><div class="row">${opts.map(x => `<button class="say alt" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="chip" data-a="x">取消</button></div></div></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('[data-v]').forEach(btn => btn.onclick = () => { o.remove(); if (+btn.dataset.v === ans) parentPanel(); });
  o.querySelector('[data-a=x]').onclick = () => o.remove();
}
const TYPE = { more: '比較多', less: '比較少', same: '一樣多', next: '下一個', missing: '少了哪個', order: '照順序排' };
function parentPanel() {
  const rows = LESSONS.map(L => {
    const ks = Object.keys(S.score).filter(k => k.startsWith(L.id + ':'));
    let ok = 0, miss = 0; const weak = [];
    for (const k of ks) { const [a, b] = S.score[k]; ok += a; miss += b; if (b >= 2 && b >= a / 2) { const t = k.split(':')[1]; weak.push(TYPE[t] || t); } }
    return `<tr><td>${L.e} ${L.t}</td><td>${S.rounds[L.id] || 0} 輪</td><td>答對 ${ok}・答錯 ${miss}</td><td class="w">${weak.join('、')}</td></tr>`;
  }).join('');
  const o = h(`<div class="overlay" id="parent">
    <div class="panel"><h2>進度</h2>
      <div class="row"><span>今天玩了 <b>${Math.round(S.sec / 60)}</b> 分鐘</span><span>・貼紙 <b>${S.stickers.length}</b> 張</span></div>
      <table class="ptab">${rows}</table>
      <p class="note">紅字是常答錯的數字或題型（答錯 2 次以上、而且答錯比答對的一半還多）。答錯的題目會比較常出現。</p>
    </div>
    <div class="panel"><h2>設定</h2>
      <div class="row">休息提醒：${[0, 10, 15, 20, 30].map(m => `<button class="chip ${S.rest === m ? 'on' : ''}" data-rest="${m}">${m ? m + ' 分鐘' : '關閉'}</button>`).join('')}</div>
      <div class="row"><button class="chip" data-a="fs">全螢幕</button><button class="chip" data-a="reset">清除進度</button><a class="chip" href="../index.html" style="text-decoration:none;color:inherit">回遊戲大廳</a></div>
      <p class="note">聲音：微軟台灣中文神經語音（曉臻 HsiaoChen）預錄。進度只存在這台裝置的瀏覽器裡。</p>
    </div>
    <button class="say" data-a="close">✔ 回到遊戲</button></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('[data-rest]').forEach(b => b.onclick = () => { S.rest = +b.dataset.rest; save(); o.remove(); parentPanel(); });
  o.querySelector('[data-a=fs]').onclick = () => fullscreen();
  o.querySelector('[data-a=reset]').onclick = e => {
    if (e.target.dataset.sure) { const r = S.rest; S = fresh(); S.rest = r; save(); updStars(); o.remove(); go('home'); }
    else { e.target.dataset.sure = 1; e.target.textContent = '再按一次確定清除'; }
  };
  o.querySelector('[data-a=close]').onclick = () => { o.remove(); if (screen === 'home') go('home'); };
}
function fullscreen() { const d = document.documentElement; const f = d.requestFullscreen || d.webkitRequestFullscreen; if (f && !document.fullscreenElement) try { f.call(d).catch(() => {}); } catch (e) {} }

/* ---------- 遊玩時間與休息提醒 ---------- */
let restShown = 0;
setInterval(() => {
  if (document.hidden || !$('#start').classList.contains('hide')) return;
  if (S.day !== today()) { S.day = today(); S.sec = 0; restShown = 0; }
  S.sec += 5; if (S.sec % 30 === 0) save();
  if (S.rest && S.sec >= S.rest * 60 * (restShown + 1) && !$('#rest')) {
    restShown++; stopAll();
    const o = h(`<div class="overlay" id="rest"><div class="bearbig">${BEAR}</div><p style="font-size:30px;font-weight:900">${P.rest}</p><button class="say alt">我休息好了</button></div>`);
    document.body.appendChild(o); play(P.rest);
    o.querySelector('button').onclick = () => o.remove();
  }
}, 5000);

/* ---------- 開始 ---------- */
$('#go').onclick = () => {
  const c = ctx(); if (c && c.state === 'suspended') c.resume();
  if (matchMedia('(pointer:coarse)').matches) fullscreen();
  $('#start').classList.add('hide'); updStars(); go('home');
};
preload(P.hello, P.pickOne);
window.__m = { S: () => S, go, GEN, T };   // 測試用
</script>
