<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>夜市小吃王 · Night Market Tycoon</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/offline/offline.js" data-game="shop" defer></script>
<meta name="theme-color" content="#1a1430">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#1a1430; --panel:#fff7e6; --panel2:#fdecc8; --ink:#3a2418; --mute:#8a6a4a; --line:#e8cfa0; --edge:#5a3422;
  --accent:#ff8a3d; --red:#e8473b; --green:#35b862; --blue:#3a8ad8; --gold:#ffc020;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --pixel:"Silkscreen",ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.ov{position:fixed;left:0;top:0;display:block;pointer-events:none}
#bl{mix-blend-mode:screen}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
img.sil{filter:brightness(0) opacity(.35)}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(6px + var(--sat)) 8px 6px;display:flex;flex-wrap:wrap;gap:5px 6px;align-items:center;z-index:10;pointer-events:none;
  background:linear-gradient(180deg,rgba(26,20,48,.92),rgba(26,20,48,.7) 70%,rgba(26,20,48,0))}
#hud>*{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px 0 6px;border-radius:999px;background:rgba(255,247,230,.96);color:var(--ink);
  font-weight:900;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 2px #f1d9a8;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip img{width:18px;height:18px}
.chip.neg span{color:var(--red)}
#hudDate{background:#ff8a3d;color:#fff;box-shadow:0 2px 0 #a84a14,inset 0 0 0 2px #ffb070;padding:0 11px;font-weight:700}
#hudDate b{font-weight:900}
#hudDate .clk{font-size:12px;opacity:.9;margin-left:2px;font-variant-numeric:tabular-nums}
#hudEv{position:absolute;left:12px;top:100%;margin-top:-2px;font-size:12px;color:#ffe2b0;font-weight:700;text-shadow:0 1px 2px #000;pointer-events:none}
#hudEv:empty{display:none}
.sp{flex:1}
#speed{display:flex;gap:3px;background:rgba(0,0,0,.35);padding:3px;border-radius:999px}
#speed button,#btnMute{height:28px;min-width:34px;border-radius:999px;color:#fff;font-size:12.5px;font-weight:900;background:rgba(255,255,255,.1)}
#speed button.on{background:#ffc020;color:#3a2418;box-shadow:0 2px 0 #a86a10}
#btnMute{background:rgba(0,0,0,.35);font-family:var(--sans);font-size:15px;min-width:36px;height:34px}
#btnMute.off{opacity:.5;text-decoration:line-through}
@media (max-width:620px){
  #hud{gap:4px 4px}
  .chip{height:27px;font-size:12.5px;padding:0 8px 0 5px}
  .chip img{width:15px;height:15px}
  #hudDate{order:0}
  .sp{order:1}
  #speed{order:2} #btnMute{order:3;height:30px}
  #hudMoney,#hudPop,#hudIdea,#hudRank{order:5}
  #speed button{min-width:30px;height:25px}
}

/* ---------- 底部工具列 ---------- */
#bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + var(--sab));display:flex;gap:4px;padding:5px;z-index:10;
  background:#5a3422;border-radius:18px;box-shadow:0 4px 0 #3a1e12,0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 12px)}
#bar button{width:62px;height:54px;border-radius:13px;background:linear-gradient(#fff7e6,#f6e2bc);box-shadow:0 3px 0 #c8a070;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;font-weight:900;color:var(--ink)}
#bar button img{height:26px;width:auto}
#bar button:active{transform:translateY(2px);box-shadow:0 1px 0 #c8a070}
@media (max-width:480px){#bar{gap:3px;padding:4px}#bar button{width:calc((100vw - 44px)/7);height:52px;font-size:11.5px;border-radius:11px}#bar button img{height:24px}}
@media (max-height:500px) and (min-aspect-ratio:4/3){
  #bar{left:calc(6px + env(safe-area-inset-left,0px));top:calc(50% + 20px);bottom:auto;transform:translateY(-50%);flex-direction:column;padding:4px;gap:3px;border-radius:14px}
  #bar button{height:calc((100vh - 84px)/7);max-height:48px;min-height:34px;width:52px;font-size:11px;border-radius:10px}
  #bar button img{height:18px}
  #buildbar,#info,#review,#lvcard{bottom:8px}
  body #review{left:70px}
  #hudEv{left:72px}
  #hud{padding-top:4px;padding-bottom:4px}
}

/* ---------- 面板 ---------- */
#panel{position:fixed;z-index:20;display:flex;flex-direction:column;background:var(--panel);border:3px solid var(--edge);border-radius:18px;
  box-shadow:0 6px 0 #3a1e12,0 14px 40px rgba(0,0,0,.5);overflow:hidden;
  left:8px;right:8px;bottom:calc(8px + var(--sab));max-height:min(64vh,640px);height:64vh}
@media (min-aspect-ratio:1/1){#panel{left:auto;right:10px;top:calc(52px + var(--sat));bottom:calc(10px + var(--sab));width:min(430px,52vw);height:auto;max-height:none}}
.ph{display:flex;align-items:center;justify-content:space-between;padding:7px 8px 7px 14px;background:linear-gradient(#ff9a4d,#f07a30);color:#fff;border-bottom:3px solid var(--edge)}
.ph h3{margin:0;font-size:18px;font-weight:900;letter-spacing:.2em;text-shadow:0 2px 0 #a84a14}
.x{width:34px;height:34px;border-radius:50%;background:#fff7e6;color:var(--ink);font-weight:900;font-size:16px;box-shadow:0 2px 0 #a84a14}
.tabs{display:flex;gap:4px;padding:7px 8px 0;background:var(--panel2);border-bottom:2px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding:7px 11px;border-radius:10px 10px 0 0;font-weight:900;font-size:13.5px;color:var(--mute);background:#f6deb0}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 2px 0 var(--panel)}
.pb{flex:1;overflow-y:auto;padding:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sum{margin:0 0 9px;font-size:13px;color:var(--mute);font-weight:700;line-height:1.5}
.tip{margin:10px 2px 4px;font-size:12.5px;color:var(--mute);line-height:1.6}
.lbl{margin:12px 0 6px;font-size:12px;font-weight:900;letter-spacing:.15em;color:#c0602a}
.good{color:#1f9a4a!important;font-weight:700}.bad{color:#d8302a!important;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 14px;border-radius:11px;background:#fff;color:var(--ink);font-weight:900;font-size:14px;
  box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);text-decoration:none;white-space:nowrap}
.btn.go{background:linear-gradient(#5ad884,#2fb562);color:#fff;box-shadow:0 3px 0 #1f7a40;text-shadow:0 1px 0 #1f7a40}
.btn.dis{background:#e8dcc8;color:#a8987a;box-shadow:0 3px 0 #c8b898}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45}
.btn.big{padding:12px 22px;font-size:17px;border-radius:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:7px}
.grid.ing{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.card{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 5px 7px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);text-align:center}
.card:active{transform:translateY(2px)}
.card .pic{height:58px;display:flex;align-items:flex-end;justify-content:center;position:relative;width:100%}
.card .pic img{max-height:58px}
.card .cnt{position:absolute;right:4px;top:0;font-style:normal;font-size:11px;font-weight:900;background:#ffe2b0;border-radius:6px;padding:0 5px}
.card b{font-size:14px;font-weight:900;margin-top:2px}
.card .pr{font-size:13px;font-weight:900;color:#d8702a}
.card small{font-size:11px;color:var(--mute);line-height:1.35}
.card small.d{font-size:10.5px;opacity:.85}
.card.lock{opacity:.5;filter:grayscale(.7)}
.card.poor .pr{color:#d8302a}
.card.sm .pic{height:34px}.card.own{background:#eaf8ee;box-shadow:inset 0 0 0 2px #a8e0b8}.card.own .pr{color:#1f9a4a}
.expand{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 12px;margin-bottom:10px;border-radius:12px;background:linear-gradient(#fff4d0,#ffe6a8);box-shadow:inset 0 0 0 2px #f0c860}
.expand b{display:block;font-size:15px}.expand small{display:block;font-size:12px;color:var(--mute);line-height:1.5}
.staff,.dish{display:flex;gap:10px;padding:9px;margin-bottom:8px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.staff .pic,.dish .pic{flex:none;width:52px;display:flex;align-items:flex-start;justify-content:center;padding-top:3px}
.si,.di{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.si>b,.di>b{font-size:15px;font-weight:900}
.si small,.di small{font-size:12px;color:var(--mute)}
.lv{font-family:var(--pixel);font-size:11px;background:#3a2418;color:#ffe070;border-radius:5px;padding:0 5px;vertical-align:2px}
.rare{color:#fff;background:linear-gradient(90deg,#ff6fa8,#ff8a3d);border-radius:6px;padding:0 6px;font-size:12px}
.exp{height:4px;background:#f0e2c8;border-radius:3px;overflow:hidden}.exp i{display:block;height:100%;background:#7ad8a0}
.sb{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
.sb span{width:28px;color:var(--mute)}.sb i{flex:1;height:7px;background:#f0e2c8;border-radius:4px;overflow:hidden}.sb i b{display:block;height:100%;border-radius:4px}
.sb em{width:24px;text-align:right;font-style:normal;font-variant-numeric:tabular-nums}
.jobs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:3px}
.jobs button{padding:5px 10px;border-radius:9px;background:#fbefd8;font-size:12.5px;font-weight:900;box-shadow:inset 0 0 0 1.5px var(--line)}
.jobs button.on{background:var(--accent);color:#fff;box-shadow:0 2px 0 #b8581a}
.jobs button[disabled]{opacity:.5}
.jobs.tr span{font-size:11.5px;color:var(--mute);font-weight:700;margin-right:2px}
.jobs .fire{margin-left:auto;color:#c8302a;background:#fff0ee}
.staff .btn{align-self:flex-start;margin-top:4px}
.cat{font-style:normal;font-size:10.5px;color:#fff;padding:1px 6px;border-radius:6px;vertical-align:2px}
.stars{color:#ffb020;letter-spacing:-1px}.stars s{color:#e8dcc8;text-decoration:none}
.dish.off{opacity:.6}
.price{display:flex;align-items:center;gap:6px}
.price button{width:30px;height:28px;border-radius:8px;background:#fbefd8;font-weight:900;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.price span{min-width:56px;text-align:center;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.price span.bad{color:#d8302a}.price span.cheap{color:#3a8ad8}
.lab{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 10px}
.slot{width:76px;height:76px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 3px dashed var(--line);border:3px dashed #e0c08a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;color:#e0c08a;font-weight:900}
.slot.full{border-style:solid;border-color:var(--accent);color:var(--ink)}
.slot.full b{font-size:12px}.slot.q{border-color:#ffd040;background:#fffbe0}
.plus{font-size:20px;font-weight:900;color:var(--mute)}
.labgo{display:flex;gap:8px;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip2,.chips .chip{height:auto;padding:4px 9px 4px 5px;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 2px var(--line);background:#fff}
.chips .chip.on{background:#ffe2b0;box-shadow:inset 0 0 0 2px var(--accent)}
.chips .chip img{width:18px;height:18px}
.chips .chip.hint{background:#f0f4ff;box-shadow:inset 0 0 0 2px #a8c0f0;padding:5px 10px}
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.bk{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;background:#f4ead6;color:#a8987a}
.bk.got{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.bk b{display:block;font-size:13.5px}.bk small{display:block;font-size:11.5px;line-height:1.45}
.bk .cp{display:flex;gap:1px;flex:none}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;margin-bottom:3px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px}
.ladder li span{width:28px;font-family:var(--pixel);font-weight:700;color:#c0602a}.ladder li b{flex:1}.ladder li em{font-style:normal;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.ladder li.me{background:linear-gradient(90deg,#ffe2b0,#fff4d8);box-shadow:inset 0 0 0 2px var(--accent)}
.ladder li:nth-child(1) span{color:#e8a000}
.ladder li.gap{background:none;box-shadow:none;justify-content:center;color:var(--mute)}
.awards div{font-size:13px;padding:4px 2px;border-bottom:1px dashed var(--line)}
.goal{padding:8px 10px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);margin-bottom:5px}
.goal b{display:block;font-size:14px}.goal small{display:block;font-size:12px;color:var(--mute)}
.goal i{display:block;height:6px;border-radius:3px;background:#f0e2c8;margin-top:5px;overflow:hidden}.goal i b{height:100%;background:var(--accent)}
.goal.done{background:#eaf8ee;box-shadow:inset 0 0 0 1.5px #a8e0b8}.goal.done b{color:#1f8a40}
.rev{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:10px;background:#fff;margin-bottom:4px;font-size:13.5px;box-shadow:inset 0 0 0 1.5px var(--line)}
.rev b{color:var(--mute);font-size:12px;margin-right:4px}
.chart{display:flex;align-items:flex-end;gap:2px;height:130px;padding:6px;background:#fff;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--line)}
.chart .col{flex:1;display:flex;gap:1px;align-items:flex-end;height:100%}
.chart i{flex:1;border-radius:2px 2px 0 0;min-height:1px}
i.s{background:#ffb070}i.p{background:#35b862}i.p.neg{background:#e8473b}
.legend{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}.legend i{display:inline-block;width:12px;height:10px;border-radius:2px}
.kv{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}.kv td{padding:5px 4px;border-bottom:1px dashed var(--line)}.kv td:last-child{text-align:right;font-weight:900}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.shopname{font-size:18px;font-weight:900}
.slotrow{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:11px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);margin-bottom:6px}
.slotrow>div{flex:1;min-width:0}.slotrow b{display:block;font-size:14px}.slotrow small{display:block;font-size:12px;color:var(--mute)}
.slotrow.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.slotrow .btn{padding:6px 10px;font-size:13px}

/* ---------- 建造列、資訊卡 ---------- */
#buildbar,#info{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--sab));z-index:12;display:flex;align-items:center;gap:10px;
  background:var(--panel);border:3px solid var(--edge);border-radius:16px;padding:7px 8px 7px 10px;box-shadow:0 4px 0 #3a1e12,0 10px 26px rgba(0,0,0,.45);width:min(440px,calc(100% - 16px))}
#buildbar>div,#info .ii{flex:1;min-width:0}
#buildbar b,#info b{display:block;font-size:15px;font-weight:900}
#buildbar small,#info small{display:block;font-size:12px;color:var(--mute);line-height:1.45}
#info img{flex:none;align-self:flex-start}

/* ---------- 提示、評論 ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + var(--sat));z-index:30;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;width:min(520px,94vw)}
.toast{padding:7px 15px;border-radius:999px;background:rgba(40,24,18,.92);color:#fff;font-weight:700;font-size:13.5px;box-shadow:0 3px 10px rgba(0,0,0,.3);animation:tin .25s;text-align:center;line-height:1.4}
.toast.good{background:rgba(31,138,64,.95)}.toast.bad{background:rgba(200,48,42,.95)}.toast.goal{background:linear-gradient(90deg,#ff8a3d,#ff5a8a)}.toast.fest{background:rgba(120,60,200,.95)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#review{position:fixed;left:10px;bottom:calc(76px + var(--sab));z-index:9;display:flex;gap:6px;align-items:center;max-width:min(330px,70vw);padding:5px 10px 5px 6px;border-radius:12px;
  background:rgba(255,247,230,.92);font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.3)}
#review b{color:var(--mute);margin-right:3px;font-size:11.5px}
#review.show{animation:rev 4.5s forwards}
#lvcard{position:fixed;right:10px;bottom:calc(76px + var(--sab));z-index:9;display:flex;gap:7px;align-items:center;padding:5px 12px 5px 5px;border-radius:14px;opacity:0;pointer-events:none;
  background:linear-gradient(90deg,#3a2a5a,#5a3a7a);border:2px solid #7affb0;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(122,255,176,.35)}
#lvcard .pt img{width:40px;height:40px}
#lvcard small{display:block;font-size:10.5px;letter-spacing:.15em;color:#7affb0;font-weight:900}#lvcard b{display:block;font-size:14px}#lvcard em{display:block;font-style:normal;font-size:11.5px;color:#ffe8b0}
#lvcard.show{animation:lvc 3.4s forwards}
@keyframes lvc{0%{opacity:0;transform:translateX(30px) scale(.9)}10%{opacity:1;transform:none}16%{transform:scale(1.06)}22%,82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(6px)}}
body.pnl #lvcard{display:none}
@keyframes rev{0%{opacity:0;transform:translateY(6px)}8%,80%{opacity:1;transform:none}100%{opacity:0}}

/* ---------- 彈出視窗 ---------- */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(20,12,30,.55);overflow-y:auto;touch-action:pan-y}
.mc{margin:auto;width:min(440px,100%);background:var(--panel);border:3px solid var(--edge);border-radius:20px;padding:16px 18px 18px;text-align:center;box-shadow:0 6px 0 #3a1e12,0 20px 50px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mc .lbl{margin:0 0 4px}
.mc h2{margin:2px 0 6px;font-size:26px;font-weight:900;color:#c8402a;letter-spacing:.05em}
.mc p{margin:6px 0;font-size:14.5px;line-height:1.65}
.mc .btn.big{margin-top:10px;min-width:60%}
.bigpic{display:flex;justify-content:center;margin:6px 0}
.bigpic.glow img{filter:drop-shadow(0 0 12px rgba(255,200,60,.8))}
.mc.discover{background:linear-gradient(#fffbe8,#fff0c0)}
.mc.award,.mc.ending{background:radial-gradient(circle at 50% 20%,#fff8d0,#ffe6a0)}
.clist{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.clist button{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);text-align:left}

/* 目前目標 */

.gh{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}

#goal li{display:grid;grid-template-columns:16px 1fr;gap:0 4px;align-items:start;font-weight:700;line-height:1.4}
