<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>曉鐘傳說 · Legend of the Dawn Bell</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Serif+TC:wght@900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070a1c; --panel:rgba(11,16,48,.88); --line:rgba(255,255,255,.18); --ink:#f4f2ff; --mute:#9aa6d8;
  --accent:#ffcf5a; --gold2:#ff9a3a;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
  --pixel:"Silkscreen",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;background:#05060f}
button{font:inherit;color:inherit;cursor:pointer}

/* 觸控按鈕 */
#pad,.tbtn{position:fixed;display:none;z-index:5}
body.touch.ingame #pad,body.touch.ingame .tbtn{display:block}
#pad{border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.03) 70%);border:2px solid rgba(255,255,255,.16)}
#pad i{position:absolute;width:34%;height:34%;border-radius:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28)}
#pad i::after{content:"";position:absolute;inset:0;margin:auto;width:0;height:0;border:9px solid transparent}
#pad .u{left:33%;top:2%}#pad .u::after{border-bottom-color:rgba(255,255,255,.85);border-top-width:0;top:-4px}
#pad .d{left:33%;bottom:2%}#pad .d::after{border-top-color:rgba(255,255,255,.85);border-bottom-width:0;bottom:-4px}
#pad .l{top:33%;left:2%}#pad .l::after{border-right-color:rgba(255,255,255,.85);border-left-width:0;left:-4px}
#pad .r{top:33%;right:2%}#pad .r::after{border-left-color:rgba(255,255,255,.85);border-right-width:0;right:-4px}
#pad i.on{background:rgba(255,207,90,.45)}
.tbtn{border-radius:50%;border:2px solid rgba(255,255,255,.55);font-family:var(--sans);font-weight:900;font-size:22px;line-height:1;color:#fff;display:none;place-items:center;
  box-shadow:0 4px 0 rgba(0,0,0,.35)}
body.touch.ingame .tbtn{display:grid}
#btnA{background:radial-gradient(circle at 35% 30%,#ffd77a,#e0902a)}
#btnB{background:radial-gradient(circle at 35% 30%,#8ab0ff,#3a5ad8)}
.tbtn.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.2)}
.tbtn small{display:block;font-family:var(--sans);font-size:11px;font-weight:700;opacity:.85;margin-top:-4px}
#btnMute{position:fixed;z-index:6;display:none;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:15px;padding:0}
body.ingame:not(.inbattle) #btnMute{display:block}
#ctrlBg{position:fixed;display:none;z-index:1;background:linear-gradient(180deg,#0e1436,#070a1c);border-top:1px solid rgba(255,255,255,.08)}
body.touch.ingame #ctrlBg{display:block}

/* 標題畫面 */
.ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:22px 18px;text-align:center;overflow-y:auto}
.ov[hidden]{display:none}
.ov>:first-child{margin-top:auto}.ov>:last-child{margin-bottom:auto}
@media (max-height:520px){.bellico{display:none}.logo h1{font-size:44px}.ov{gap:9px;padding:12px}.big{padding:9px 0;font-size:17px}.btn2{padding:8px 0}}
#title{background:radial-gradient(900px 500px at 50% 0%,rgba(255,180,80,.12),transparent 60%),linear-gradient(180deg,rgba(7,10,28,.15),rgba(7,10,28,.55) 45%,rgba(7,10,28,.85))}
.logo small{display:block;font-family:var(--pixel);font-size:11px;letter-spacing:.3em;color:var(--mute)}
.logo h1{margin:6px 0 0;font-family:var(--serif);font-weight:900;font-size:clamp(46px,12vw,92px);letter-spacing:.22em;margin-right:-.22em;line-height:1.08;
  background:linear-gradient(180deg,#fff 0%,#ffe9a8 45%,#ff9a3a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(90,30,0,.85)) drop-shadow(0 0 18px rgba(255,170,60,.35))}
.logo .en{margin:6px 0 0;font-family:var(--pixel);font-size:clamp(11px,2.6vw,15px);letter-spacing:.3em;color:#ffd77a}
.bellico{width:54px;height:54px;margin:0 auto 4px;filter:drop-shadow(0 0 14px rgba(255,200,80,.6))}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,86vw)}
.big{width:100%;padding:13px 0;border:0;border-radius:12px;font-size:20px;font-weight:900;letter-spacing:.25em;
  background:linear-gradient(180deg,#ffd75a,#ff9a2e);color:#3a1a00;box-shadow:0 4px 0 #a2520d,0 8px 20px rgba(255,150,40,.3)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a2520d}
.btn2{width:100%;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:rgba(11,16,48,.75);font-size:16px;font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:.12em}
.btn2:disabled{opacity:.35;cursor:default}
.btn2.sel,.btn2:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.big.sel,.big:focus-visible{outline:3px solid #fff;outline-offset:3px}
.opts{display:flex;gap:8px;width:min(320px,86vw)}
.tog{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:13px}
.tog b{margin-left:.3em;color:var(--mute)}
.tog.on b{color:#7dffb0}
.hall{color:var(--mute);text-decoration:none;font-size:13px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35)}
.hall:hover{color:var(--ink)}
.tip{color:var(--mute);font-size:12px;line-height:1.7;margin:0;max-width:440px}
.tip kbd{font-family:var(--pixel);font-size:.9em;border:1px solid var(--line);border-radius:3px;padding:0 .35em;color:#dfe6ee}
.touch .kb{display:none}
body:not(.touch) .tc{display:none}
.card{width:min(380px,90vw);background:var(--panel);border:2px solid #f4f2ff;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:inset 0 0 0 3px #0b1030,inset 0 0 0 4px rgba(120,140,220,.45)}
.card h2{margin:0;font-size:17px;color:var(--accent);letter-spacing:.15em}
.slot{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.slot b{font-size:15px}.slot span{font-size:12px;color:var(--mute);line-height:1.5}
.slot.empty span{font-style:italic}
.slot:disabled{opacity:.4}
.diff{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.diff b{display:block;font-size:16px}.diff span{font-size:12px;color:var(--mute)}
.diff.on{border-color:var(--accent);background:rgba(255,207,90,.14)}
.diff.on b{color:var(--accent)}
.row{display:flex;gap:8px}.row>*{flex:1}
.del{font-size:12px;color:#ff9a9a;background:none;border:0;text-decoration:underline;padding:4px}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px;z-index:20;background:var(--bg)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ctrlBg"></div>
<div id="pad" aria-label="方向鍵"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
<button id="btnA" class="tbtn" aria-label="確定">A<small>確定</small></button>
<button id="btnB" class="tbtn" aria-label="取消">B<small>選單</small></button>
<button id="btnMute" aria-label="靜音">♪</button>

<section id="title" class="ov">
  <div class="logo">
    <svg class="bellico" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset="1" stop-color="#e0902a"/></linearGradient></defs>
      <rect x="29" y="3" width="6" height="8" rx="2" fill="#c07a20"/><path d="M32 9c-12 0-17 10-17 24v9l-5 7h44l-5-7v-9c0-14-5-24-17-24z" fill="url(#bg1)" stroke="#5a2a00" stroke-width="2"/><circle cx="32" cy="55" r="5" fill="#c07a20" stroke="#5a2a00" stroke-width="2"/><path d="M22 22c2-6 5-8 8-9" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/></svg>
    <small>MW · CLASSIC RPG</small><h1>曉鐘傳說</h1><p class="en">LEGEND OF THE DAWN BELL</p>
  </div>
  <div class="menu">
    <button id="btnContinue" class="big">繼續冒險</button>
    <button id="btnNew" class="btn2">新的冒險</button>
  </div>
  <div class="opts">
    <button class="tog" data-opt="music">音樂<b>開</b></button>
    <button class="tog" data-opt="sfx">音效<b>開</b></button>
  </div>
  <p class="tip kb"><kbd>↑↓←→</kbd>／<kbd>WASD</kbd> 移動　<kbd>Z</kbd>／<kbd>Enter</kbd> 確定・對話　<kbd>X</kbd>／<kbd>Esc</kbd> 取消・選單　<kbd>M</kbd> 靜音</p>
  <p class="tip tc">左下方向鍵移動，A 確定與對話，B 取消與打開選單。選單也可以直接點。</p>
  <a class="hall" href="../index.html">← 大廳</a>
</section>

<section id="slots" class="ov" hidden>
  <div class="card">
    <h2 id="slotsTitle">選擇記錄</h2>
    <div id="slotList" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="btn2" id="slotsBack">返回</button>
  </div>
</section>

<section id="diffs" class="ov" hidden>
  <div class="card">
    <h2>選擇難度</h2>
    <div id="diffList" style="display:flex;flex-direction:column;gap:8px"></div>
    <p class="tip" style="margin:0">難度之後也可以在遊戲中的「設定」裡更改。</p>
    <div class="row"><button class="btn2" id="diffBack">返回</button><button class="big" id="diffGo" style="font-size:17px;padding:10px 0">開始</button></div>
  </div>
</section>
<div id="loading">載入中……</div>

<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/mart.js"></script>
<script src="js/data.js"></script>
<script src="js/maprows.js"></script>
<script src="js/ui.js"></script>
<script src="js/party.js"></script>
<script src="js/battle.js"></script>
<script src="js/field.js"></script>
<script src="js/menu.js"></script>
<script src="js/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
