<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>捏臉工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  --paper:#fbf3e8;--card:#fffaf3;--ink:#33261f;--mute:#8a7768;--line:#eadfcf;
  --accent:#ff7a59;--accent-soft:#fff0ea;--shadow:0 10px 30px rgba(80,50,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{color:var(--mute);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:#fff}
.back:hover{color:var(--ink)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand small{font-size:10px;letter-spacing:.3em;color:var(--mute);font-weight:500}
.brand b{font-size:20px;font-weight:900;letter-spacing:.14em}
.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;
  display:inline-flex;align-items:center;gap:6px;transition:transform .1s,border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:default;transform:none;border-color:var(--line)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn .i{font-size:15px;line-height:1}

/* ---------- layout ---------- */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,1fr) minmax(340px,480px);
  gap:20px;padding:20px;max-width:1200px;width:100%;margin:0 auto}
.stage{min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.mirror{background:var(--card);border-radius:30px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--line);
  display:flex;justify-content:center;max-width:100%}
#stage{display:block;height:min(calc(100dvh - 200px),720px);width:auto;max-width:100%;aspect-ratio:4/5;border-radius:20px;touch-action:none}
.namebar{display:flex;align-items:center;gap:8px}
.namebar input{font:inherit;font-weight:700;font-size:18px;text-align:center;border:none;border-bottom:2px dashed var(--line);
  background:transparent;color:var(--ink);width:10em;padding:4px}
.namebar input:focus{outline:none;border-bottom-color:var(--accent)}

.panel{min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;border:none;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.content{flex:1;overflow-y:auto;padding:4px 16px 24px}
.phead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 2px}
.phead h2{margin:0;font-size:18px;font-weight:900;letter-spacing:.08em}
.group{margin-top:16px}
.group.tight{margin-top:4px}
.glabel{font-size:13px;color:var(--mute);font-weight:500;margin-bottom:8px;letter-spacing:.06em}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:16px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:border-color .15s,transform .1s}
.opt:hover{border-color:#d6c4ad}
.opt:active{transform:scale(.95)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt svg{width:100%;aspect-ratio:1;border-radius:11px;display:block}
.opt span{font-size:12.5px;font-weight:500}
.range{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:10px;margin:6px 0}
.range span{font-size:14px}
.range input{width:100%;accent-color:var(--accent);height:28px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.sw.auto{width:auto;border-radius:999px;padding:0 12px;font-size:12px;font-weight:500;background:#fff}
.sw.custom{background:conic-gradient(#ff6b6b,#ffd93d,#6bcB77,#4d96ff,#c77dff,#ff6b6b);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent)}

/* ---------- gallery ---------- */
dialog{border:none;border-radius:24px;padding:0;width:min(720px,calc(100vw - 32px));max-height:calc(100dvh - 48px);
  background:var(--card);color:var(--ink);box-shadow:0 30px 80px rgba(40,20,10,.35)}
dialog::backdrop{background:rgba(51,38,31,.45)}
.galhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.galhead h2{margin:0;font-size:18px;font-weight:900;letter-spacing:.08em}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;padding:16px 20px 20px}
.gcard{position:relative;border:2px solid var(--line);border-radius:18px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.gcard:hover{border-color:var(--accent)}
.gcard svg{width:100%;aspect-ratio:4/5;border-radius:12px;display:block}
.gcard b{font-size:14px}
.gcard small{font-size:11px;color:var(--mute)}
.gdel{position:absolute;top:2px;right:2px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:13px;line-height:1}
.empty{padding:28px 20px;color:var(--mute);text-align:center;margin:0}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
  font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* eye blink (main stage only) */
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

/* ---------- phone / portrait ---------- */
@media (max-width:760px){
  .top{padding:8px 12px;gap:8px}
  .brand small{display:none}
  .brand b{font-size:17px}
  .btn{padding:6px 10px}
  .btn .t{display:none}
  .btn .i{font-size:17px}
  .layout{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:10px 12px 12px;gap:10px}
  .mirror{padding:6px;border-radius:22px}
  #stage{height:min(36dvh,420px);border-radius:16px}
  .namebar input{font-size:16px}
  .panel{border-radius:20px}
  .tabs{padding:8px;flex-wrap:nowrap}
  .top{flex-wrap:nowrap}
  .back .bt{display:none}
  .actions{gap:4px}
  .opts{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">←<span class="bt"> 大廳</span></a>
  <div class="brand"><small>FACE STUDIO</small><b>捏臉工坊</b></div>
  <div class="actions">
    <button class="btn" id="undo" title="復原 (Ctrl+Z)"><span class="i">↶</span><span class="t">復原</span></button>
    <button class="btn" id="rand" title="全部隨機 (R)"><span class="i">🎲</span><span class="t">隨機</span></button>
    <button class="btn" id="openGal"><span class="i">📁</span><span class="t">我的角色</span></button>
    <button class="btn" id="save"><span class="i">★</span><span class="t">存檔</span></button>
    <button class="btn primary" id="dl"><span class="i">⬇</span><span class="t">下載圖片</span></button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="mirror"><svg id="stage" viewBox="0 0 400 500" role="img" aria-label="你捏的角色"></svg></div>
    <div class="namebar"><input id="name" maxlength="16" aria-label="角色名字" placeholder="角色名字"></div>
  </section>
  <section class="panel">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="content" id="content"></div>
  </section>
</main>

<dialog id="gal">
  <div class="galhead"><h2>我的角色</h2><button class="btn" id="closeGal">關閉</button></div>
  <div class="galgrid" id="galGrid"></div>
  <p class="empty" id="galEmpty">還沒有存檔。按「存檔」把現在的角色收進來。</p>
</dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================
   Data
   ========================================================= */
const CX = 200, CY = 250;
const INK = '#2a1d18';

const SKINS = ['#fde7d6','#f6d3b8','#ecbc96','#d9a074','#b97a50','#8d5a3b','#5e3b26','#cdeccf','#d3dcff'];
const HAIRS = ['#2b1d17','#5a3a24','#8b5a2b','#d9a441','#f1dca4','#b8482a','#9aa0a6','#f6f1ea','#f48fb1','#8e6cd8','#4fb3e8','#5dbb7a'];
const IRISES = ['#3b2618','#6d4c2f','#2e7d9a','#4a8f5b','#7d8a96','#7b4fb5','#c0392b','#d4a017'];
const LIPS = ['#d9706b','#e05a6d','#c2185b','#b5655a','#f29b9b','#8e3b46'];
const CLOTHES = ['#7fb3d5','#f4a261','#e76f51','#2a9d8f','#e9c46a','#9b5de5','#f7f3ea','#3d3d4e','#ff8fab','#90be6d'];

const FACE_SHAPES = {
  oval:{label:'鵝蛋臉',w:118,h:150,jaw:.74,chin:.34},
  round:{label:'圓臉',w:128,h:140,jaw:.86,chin:.5},
  v:{label:'瓜子臉',w:116,h:154,jaw:.62,chin:.1},
  square:{label:'方臉',w:124,h:146,jaw:.95,chin:.56},
  long:{label:'長臉',w:108,h:166,jaw:.78,chin:.36},
  heart:{label:'心形臉',w:130,h:148,jaw:.6,chin:.06},
};
const EYES = {
  almond:{label:'杏眼',uh:14,lh:9,lift:3,ir:.3},
  round:{label:'圓眼',uh:16,lh:15,lift:0,ir:.3},
  phoenix:{label:'丹鳳眼',uh:9,lh:6,lift:9,ir:.27},
  droopy:{label:'下垂眼',uh:13,lh:10,lift:-7,ir:.3},
  sparkle:{label:'閃亮大眼',uh:21,lh:17,lift:1,ir:.36,big:true},
  sleepy:{label:'瞇瞇眼',line:'closed'},
  happy:{label:'笑眼',line:'happy'},
};
const BROWS = {
  natural:{label:'自然眉',arch:6,pos:.6,ti:6.5,to:3,iy:0,oy:3},
  straight:{label:'平眉',arch:1,pos:.5,ti:6.5,to:5,iy:0,oy:0},
  thick:{label:'粗眉',arch:4,pos:.55,ti:11,to:8,iy:0,oy:2},
  arched:{label:'挑眉',arch:12,pos:.68,ti:6,to:2.5,iy:2,oy:4},
  thin:{label:'細眉',arch:8,pos:.6,ti:3,to:1.6,iy:0,oy:3},
  worried:{label:'八字眉',arch:2,pos:.4,ti:6,to:3,iy:-9,oy:6},
  angry:{label:'生氣眉',arch:1,pos:.5,ti:7,to:4,iy:7,oy:-6},
  dot:{label:'麻呂眉',dot:true},
};
const NOSES = {button:'小鼻子',dot:'鼻孔點',round:'圓鼻頭',tall:'高挺鼻',wide:'寬鼻翼',line:'線條鼻'};
const MOUTHS = {smile:'微笑',grin:'大笑',neutral:'抿嘴',cat:'貓咪嘴',o:'驚訝',pout:'嘟嘴',tongue:'吐舌',lips:'紅唇',sad:'難過'};
const HAIR_BACK = {bald:'光頭',buzz:'平頭',short:'短髮',spiky:'刺刺頭',bob:'鮑伯頭',long:'長直髮',wavy:'波浪長髮',twin:'雙馬尾',pony:'馬尾',bun:'丸子頭',afro:'爆炸頭'};
const BANGS = {none:'無',blunt:'齊瀏海',swept:'斜瀏海',center:'中分',choppy:'碎瀏海',ahoge:'呆毛'};
const GLASSES = {none:'無',round:'圓框',square:'方框',sun:'墨鏡'};
const OUTFITS = {tee:'圓領T',v:'V領',shirt:'襯衫',hoodie:'帽T',stripe:'條紋T',turtle:'高領毛衣'};
const BGS = {
  peach:{label:'蜜桃',c:['#ffe6d6','#ffc9b3']}, mint:{label:'薄荷',c:['#e0f5ec','#b4e4d0']},
  sky:{label:'天空',c:['#e3f0ff','#b9d6ff']}, lilac:{label:'紫丁香',c:['#f0e8ff','#d3c2ff']},
  lemon:{label:'檸檬',c:['#fff7d1','#ffe489']}, night:{label:'夜晚',c:['#3a3560','#211d3a']},
};

const DEFAULT = {
  name:'小捏',
  face:{shape:'oval',w:118,h:150,jaw:.74,chin:.34,ear:1,skin:'#f6d3b8',blush:true},
  eyes:{style:'almond',size:1,gap:0,y:0,tilt:0,iris:'#6d4c2f',lashes:true},
  brows:{style:'natural',thick:1,len:1,y:0,tilt:0,color:null},
  nose:{style:'button',size:1,y:0},
  mouth:{style:'smile',size:1,y:0,lip:'#d9706b'},
  hair:{back:'bob',bangs:'swept',color:'#5a3a24'},
  extra:{glasses:'none',freckles:false,mole:false,beard:false,earring:false,bow:false},
  outfit:{style:'tee',color:'#7fb3d5',bg:'peach'},
};

/* =========================================================
   Helpers
   ========================================================= */
const f1 = n => Math.round(n*10)/10;
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const clone = o => JSON.parse(JSON.stringify(o));
function rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255];}
function shade(h,p){const t=Math.abs(p)/100,f=p<0?0:255;return '#'+rgb(h).map(c=>Math.round(c+(f-c)*t).toString(16).padStart(2,'0')).join('');}
const getK = (o,k) => k.split('.').reduce((a,b)=>a[b],o);
function setK(o,k,v){const p=k.split('.');let a=o;for(let i=0;i<p.length-1;i++)a=a[p[i]];a[p[p.length-1]]=v;}
const label = v => typeof v==='string' ? v : v.label;
// mirror an absolute path made only of x,y pairs across x=200
const mir = d => {let i=0;return d.replace(/-?\d+(\.\d+)?/g,m=>(i++%2===0)?String(f1(400-parseFloat(m))):m);};
const both = d => d + mir(d);
const cub = (a,b,c,d,t) => (1-t)**3*a + 3*(1-t)**2*t*b + 3*(1-t)*t*t*c + t**3*d;
function merge(base,over){const out=clone(base);if(!over)return out;for(const k in out){if(over[k]===undefined)continue;
  if(out[k]&&typeof out[k]==='object'&&!Array.isArray(out[k]))Object.assign(out[k],over[k]);else out[k]=over[k];}return out;}

function geo(st){
  const W=st.face.w,H=st.face.h,e=st.eyes;
  const eyeY=CY+H*.08+e.y;
  return {W,H,eyeY,gap:W*.42+e.gap,browY:eyeY-22-14*e.size+st.brows.y,
    noseY:CY+H*.33+st.nose.y,mouthY:CY+H*.56+st.mouth.y,earY:CY+H*.12,chinY:CY+H};
}

/* =========================================================
   Part renderers  (all return SVG markup strings)
   ========================================================= */
function facePath(W,H,jaw,chin){
  const top=CY-H, t=CY-H*.12, jy=CY+H*.58;
  const r=`M${CX} ${f1(top)} C${f1(CX+W*.56)} ${f1(top)} ${f1(CX+W)} ${f1(top+H*.36)} ${f1(CX+W)} ${f1(t)}`
    +` C${f1(CX+W)} ${f1(CY+H*.25)} ${f1(CX+W*(jaw+(1-jaw)*.35))} ${f1(jy-H*.12)} ${f1(CX+W*jaw)} ${f1(jy)}`
    +` C${f1(CX+W*jaw*.85)} ${f1(jy+H*.2)} ${f1(CX+W*chin)} ${f1(CY+H)} ${CX} ${f1(CY+H)}`;
  const l=` C${f1(CX-W*chin)} ${f1(CY+H)} ${f1(CX-W*jaw*.85)} ${f1(jy+H*.2)} ${f1(CX-W*jaw)} ${f1(jy)}`
    +` C${f1(CX-W*(jaw+(1-jaw)*.35))} ${f1(jy-H*.12)} ${f1(CX-W)} ${f1(CY+H*.25)} ${f1(CX-W)} ${f1(t)}`
    +` C${f1(CX-W)} ${f1(top+H*.36)} ${f1(CX-W*.56)} ${f1(top)} ${CX} ${f1(top)}Z`;
  return r+l;
}

function ear(st,g,side,line,withRing){
  const s=st.face.ear,x=CX+side*g.W*.96,skin=st.face.skin;
  let m=`<g transform="translate(${f1(x)} ${f1(g.earY)}) scale(${f1(side*s*100)/100} ${s})">`
    +`<path d="M-4 -20 C14 -27 23 -6 16 8 C12 18 4 22 -3 18 Z" fill="${skin}" stroke="${line}" stroke-width="3" stroke-linejoin="round"/>`
    +`<path d="M2 -12 C12 -14 14 0 8 8" fill="none" stroke="${shade(skin,-25)}" stroke-width="2.5" stroke-linecap="round"/>`;
  if(withRing) m+=`<path d="M4 21 L4 30" stroke="#c9952b" stroke-width="2"/><circle cx="4" cy="21" r="3.2" fill="#f2c14e"/><circle cx="4" cy="35" r="5.5" fill="#f2c14e" stroke="#c9952b" stroke-width="1.5"/>`;
  return m+'</g>';
}

function eye(st,g,P,side,anim){
  const e=st.eyes,d=EYES[e.style],s=e.size,ew=44*s*(d.big?1.08:1),hw=ew/2;
  const lift=(d.lift||0)+e.tilt;
  const tf=`translate(${f1(CX+side*g.gap)} ${f1(g.eyeY)}) scale(${side} 1)`;
  const cls=anim?' class="blink"':'';
  if(d.line){
    const p=d.line==='closed'
      ? `M${f1(-hw)} 0 Q0 ${f1(8*s)} ${f1(hw)} ${f1(-lift*.6)}`
      : `M${f1(-hw)} ${f1(5*s)} Q0 ${f1(-13*s)} ${f1(hw)} ${f1(5*s-lift*.6)}`;
    let lash='';
    if(e.lashes&&d.line==='closed') lash=`<path d="M${f1(hw-3)} ${f1(-lift*.6+2)} l7 4 M${f1(hw-9)} ${f1(-lift*.4+4)} l5 6" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/>`;
    return `<g transform="${tf}"><path d="${p}" fill="none" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>${lash}</g>`;
  }
  const uh=d.uh*s,lh=d.lh*s;
  const P0=[-hw,2],P1=[-hw*.5,-uh*1.3],P2=[hw*.45,-uh*1.3-lift*.4],P3=[hw,-lift];
  const upper=`M${f1(P0[0])} ${P0[1]} C${f1(P1[0])} ${f1(P1[1])} ${f1(P2[0])} ${f1(P2[1])} ${f1(P3[0])} ${f1(P3[1])}`;
  const full=upper+` C${f1(hw*.5)} ${f1(lh*1.15-lift*.3)} ${f1(-hw*.5)} ${f1(lh*1.25)} ${f1(-hw)} 2Z`;
  const r=ew*d.ir, icy=f1((lh-uh)*.2), cid=`${P}ec${side>0?'r':'l'}`;
  let lash='';
  if(e.lashes){
    for(const t of [.72,.86,1]){
      const x=cub(P0[0],P1[0],P2[0],P3[0],t),y=cub(P0[1],P1[1],P2[1],P3[1],t);
      lash+=`<path d="M${f1(x)} ${f1(y)} l${f1(4+t*4)} ${f1(-7+t*2)}" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>`;
    }
  }
  return `<g transform="${tf}"><g${cls}>`
    +`<clipPath id="${cid}"><path d="${full}"/></clipPath>`
    +`<path d="${full}" fill="#fff"/>`
    +`<g clip-path="url(#${cid})"><g id="${P}iris${side>0?'R':'L'}">`
      +`<circle cy="${icy}" r="${f1(r)}" fill="${e.iris}"/>`
      +`<circle cy="${icy}" r="${f1(r)}" fill="url(#${P}ig)"/>`
      +`<circle cy="${icy}" r="${f1(r*.48)}" fill="${INK}"/>`
      +`<circle cx="${f1(-r*.36)}" cy="${f1(icy-r*.38)}" r="${f1(r*.27)}" fill="#fff"/>`
      +`<circle cx="${f1(r*.38)}" cy="${f1(icy+r*.32)}" r="${f1(r*.12)}" fill="#fff" opacity=".9"/>`
      +(d.big?`<circle cx="${f1(r*.15)}" cy="${f1(icy-r*.5)}" r="${f1(r*.1)}" fill="#fff"/>`:'')
    +`</g><path d="${upper}" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="7" transform="translate(0 3)"/></g>`
    +`<path d="${full}" fill="none" stroke="${INK}" stroke-width="1.3" stroke-opacity=".35"/>`
    +`<path d="${upper}" fill="none" stroke="${INK}" stroke-width="3.6" stroke-linecap="round"/>`
    +lash+`</g></g>`;
}

function brow(st,g,side,color){
  const b=st.brows,d=BROWS[b.style],L=46*b.len;
  const tf=`translate(${f1(CX+side*(g.gap+2))} ${f1(g.browY)}) scale(${side} 1) rotate(${-b.tilt})`;
  if(d.dot) return `<ellipse transform="${tf}" cx="${f1(-L*.12)}" rx="${f1(8*b.thick)}" ry="${f1(5.5*b.thick)}" fill="${color}"/>`;
  const p0=[-L/2,d.iy],p2=[L/2,d.oy],p1=[-L/2+L*d.pos,(d.iy+d.oy)/2-d.arch*2];
  const top=[],bot=[];
  for(let i=0;i<=16;i++){
    const t=i/16,u=1-t;
    const x=u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0], y=u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1];
    const dx=2*u*(p1[0]-p0[0])+2*t*(p2[0]-p1[0]), dy=2*u*(p1[1]-p0[1])+2*t*(p2[1]-p1[1]);
    const len=Math.hypot(dx,dy)||1, nx=-dy/len, ny=dx/len;
    let th=(d.ti+(d.to-d.ti)*t)*b.thick;
    th*=Math.min(1,.5+t*4);
    th*=1-Math.max(0,t-.8)/.2*.55;
    top.push(`${f1(x-nx*th/2)} ${f1(y-ny*th/2)}`); bot.push(`${f1(x+nx*th/2)} ${f1(y+ny*th/2)}`);
  }
  const p='M'+top.join(' L')+' L'+bot.reverse().join(' L')+'Z';
  return `<path transform="${tf}" d="${p}" fill="${color}" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>`;
}

function nose(st,g){
  const n=st.nose,c=shade(st.face.skin,-38);
  const a=`fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"`;
  let m='';
  switch(n.style){
    case 'button': m=`<path d="M-8 -1 Q0 7 8 -1" ${a}/>`;break;
    case 'dot': m=`<ellipse cx="-5" cy="2" rx="2.5" ry="1.9" fill="${c}"/><ellipse cx="5" cy="2" rx="2.5" ry="1.9" fill="${c}"/>`;break;
    case 'round': m=`<ellipse cx="0" cy="-2" rx="9" ry="6" fill="#fff" opacity=".28"/><path d="M-11 -6 Q-15 6 -5 5" ${a}/><path d="M11 -6 Q15 6 5 5" ${a}/><ellipse cx="-4" cy="5" rx="2" ry="1.5" fill="${c}"/><ellipse cx="4" cy="5" rx="2" ry="1.5" fill="${c}"/>`;break;
    case 'tall': m=`<path d="M3 -42 Q6 -14 10 0 Q6 7 -3 5" ${a}/>`;break;
    case 'wide': m=`<path d="M-18 -3 Q-21 7 -10 6 Q0 11 10 6 Q21 7 18 -3" ${a}/>`;break;
    case 'line': m=`<path d="M0 -30 L-7 2 L5 4" ${a}/>`;break;
  }
  return `<g transform="translate(${CX} ${f1(g.noseY)}) scale(${n.size})">${m}</g>`;
}

function mouth(st,g,P){
  const m=st.mouth,w=26*m.size,lip=m.lip,ink=shade(lip,-48);
  const ln=(d,sw=4)=>`<path d="${d}" fill="none" stroke="${ink}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`;
  let s='';
  switch(m.style){
    case 'smile': s=ln(`M${f1(-w)} -3 Q0 ${f1(w*.75)} ${f1(w)} -3`);break;
    case 'grin':{
      const d=`M${f1(-w)} -4 Q0 2 ${f1(w)} -4 Q0 ${f1(w*1.15)} ${f1(-w)} -4Z`;
      s=`<clipPath id="${P}mc"><path d="${d}"/></clipPath><path d="${d}" fill="#6e2730"/>`
       +`<g clip-path="url(#${P}mc)"><rect x="${f1(-w)}" y="-8" width="${f1(w*2)}" height="9" fill="#fff"/><ellipse cy="${f1(w*.8)}" rx="${f1(w*.55)}" ry="${f1(w*.35)}" fill="#ef7f8a"/></g>`
       +`<path d="${d}" fill="none" stroke="${ink}" stroke-width="3.5" stroke-linejoin="round"/>`;break;}
    case 'neutral': s=ln(`M${f1(-w*.7)} 0 Q0 3 ${f1(w*.7)} 0`);break;
    case 'cat': s=ln(`M${f1(-w*.85)} -5 Q${f1(-w*.42)} 9 0 -1 Q${f1(w*.42)} 9 ${f1(w*.85)} -5`,3.6);break;
    case 'o': s=`<ellipse rx="${f1(w*.32)}" ry="${f1(w*.42)}" cy="2" fill="#6e2730" stroke="${ink}" stroke-width="3"/><ellipse cy="${f1(2+w*.22)}" rx="${f1(w*.18)}" ry="${f1(w*.12)}" fill="#ef7f8a"/>`;break;
    case 'pout': s=`<g transform="scale(${m.size})"><path d="M-9 -2 Q-10 -9 0 -7 Q10 -9 9 -2 Q10 7 0 7 Q-10 7 -9 -2Z" fill="${lip}" stroke="${ink}" stroke-width="2.5"/><path d="M-6 0 Q0 2 6 0" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"/></g>`;break;
    case 'tongue': s=`<path d="M${f1(w*.02)} ${f1(w*.22)} Q${f1(w*.06)} ${f1(w*.95)} ${f1(w*.32)} ${f1(w*.85)} Q${f1(w*.55)} ${f1(w*.72)} ${f1(w*.46)} ${f1(w*.12)}" fill="#ef7f8a" stroke="${ink}" stroke-width="2.5"/>`+ln(`M${f1(-w)} -3 Q0 ${f1(w*.6)} ${f1(w)} -3`);break;
    case 'lips':{const v=w*.8;
      s=`<path d="M${f1(-v)} 0 Q${f1(-v*.5)} ${f1(-v*.42)} ${f1(-v*.12)} ${f1(-v*.32)} Q0 ${f1(-v*.2)} ${f1(v*.12)} ${f1(-v*.32)} Q${f1(v*.5)} ${f1(-v*.42)} ${f1(v)} 0 Q${f1(v*.5)} ${f1(v*.58)} 0 ${f1(v*.58)} Q${f1(-v*.5)} ${f1(v*.58)} ${f1(-v)} 0Z" fill="${lip}" stroke="${ink}" stroke-width="2.5" stroke-linejoin="round"/>`
       +ln(`M${f1(-v)} 0 Q0 ${f1(v*.12)} ${f1(v)} 0`,2.5)+`<ellipse cx="${f1(v*.25)}" cy="${f1(v*.3)}" rx="${f1(v*.2)}" ry="${f1(v*.08)}" fill="#fff" opacity=".4"/>`;break;}
    case 'sad': s=ln(`M${f1(-w*.75)} 6 Q0 ${f1(-w*.45)} ${f1(w*.75)} 6`);break;
  }
  return `<g transform="translate(${CX} ${f1(g.mouthY)})">${s}</g>`;
}

/* ---------- hair (drawn in a 120x150 base head, then scaled to the face) ---------- */
const CAP='M76 258 C66 150 128 90 200 90 C272 90 334 150 324 258 C318 258 313 252 311 242 C302 192 262 166 200 164 C138 166 98 192 89 242 C87 252 82 258 76 258 Z';
const HAIRLINE=' L311 242 C302 192 262 166 200 164 C138 166 98 192 89 242 Z';
const SHORT_BACK='M70 272 C58 140 126 80 200 80 C274 80 342 140 330 272 C324 292 306 292 300 272 L100 272 C94 292 76 292 70 272 Z';
const BOB_BACK='M66 250 C56 120 126 74 200 74 C274 74 344 120 334 250 C338 300 346 340 344 372 C330 386 300 384 286 370 L114 370 C100 384 70 386 56 372 C54 340 62 300 66 250 Z';
const BOB_SIDE='M84 196 C70 260 72 330 64 372 C78 382 98 380 106 368 C98 320 96 262 104 212 Z';
const LONG_BACK='M66 250 C54 116 126 72 200 72 C274 72 346 116 334 250 C340 340 352 430 362 520 L38 520 C48 430 60 340 66 250 Z';
const LONG_SIDE='M84 196 C70 280 68 380 58 476 C74 486 96 484 106 472 C96 380 96 280 104 212 Z';
const TWIN='M98 176 C44 172 18 236 26 304 C32 366 20 404 44 446 C56 404 72 362 74 302 C76 252 84 214 108 194 Z';

function wave(x0,y0,x1,y1,n,amp){ // Q-segments with alternating bulge
  let d='';
  for(let i=1;i<=n;i++){
    const ax=x0+(x1-x0)*(i-1)/n, ay=y0+(y1-y0)*(i-1)/n, bx=x0+(x1-x0)*i/n, by=y0+(y1-y0)*i/n;
    const mx=(ax+bx)/2, my=(ay+by)/2, len=Math.hypot(bx-ax,by-ay)||1, k=(i%2?1:-1)*amp;
    d+=` Q${f1(mx+(by-ay)/len*k)} ${f1(my-(bx-ax)/len*k)} ${f1(bx)} ${f1(by)}`;
  }
  return d;
}
function jag(x0,x1,y,amp,n){let d='';for(let i=0;i<=n;i++)d+=` L${f1(x0+(x1-x0)*i/n)} ${f1(y+(i%2?amp:-amp*.2))}`;return d;}
function spiky(){
  let d='';
  for(let i=0;i<=18;i++){const a=Math.PI*(1+i/18), r=(i%2&&i>0&&i<18)?1.2:1;
    d+=(i?' L':'M')+f1(200+128*r*Math.cos(a))+' '+f1(240+148*r*Math.sin(a));}
  return d+HAIRLINE;
}
function afroBack(){
  const cs=[];for(let i=0;i<=13;i++){const a=Math.PI*(.78+1.44*i/13);cs.push([200+150*Math.cos(a),222+150*Math.sin(a)]);}
  return `<g stroke-width="5">${cs.map(c=>`<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="50"/>`).join('')}</g>`
    +`<g stroke="none">${cs.map(c=>`<circle cx="${f1(c[0])}" cy="${f1(c[1])}" r="50"/>`).join('')}<ellipse cx="200" cy="222" rx="150" ry="150"/></g>`;
}

function hairParts(st,hl){
  const h=st.hair,b=h.back;let back='',front='';
  const tie=(x,y)=>`<circle cx="${x}" cy="${y}" r="10" fill="#ff6f91" stroke="#d9476b" stroke-width="2.5"/>`;
  switch(b){
    case 'short': case 'spiky': back=`<path d="${SHORT_BACK}"/>`;break;
    case 'bob': back=`<path d="${BOB_BACK}"/>`;front=`<path d="${both(BOB_SIDE)}"/>`;break;
    case 'long': back=`<path d="${LONG_BACK}"/>`;front=`<path d="${both(LONG_SIDE)}"/>`;break;
    case 'wavy':
      back=`<path d="M66 250 C54 116 126 72 200 72 C274 72 346 116 334 250${wave(334,250,364,500,6,10)}${wave(364,500,36,500,8,7)}${wave(36,500,66,250,6,10)}Z"/>`;
      front=`<path d="M84 196${wave(84,196,56,478,6,7)} L106 470${wave(106,470,104,212,5,5)}Z"/><path d="M316 196${wave(316,196,344,478,6,7)} L294 470${wave(294,470,296,212,5,5)}Z"/>`;break;
    case 'twin': back=`<path d="${both(TWIN)}"/>${tie(96,184)}${tie(304,184)}`;break;
    case 'pony': back=`<path d="${SHORT_BACK}"/><path d="M246 104 C326 92 364 166 354 260 C348 330 366 384 344 436 C326 384 314 326 318 262 C322 204 304 150 252 136 Z"/>${tie(262,118)}`;break;
    case 'bun': back=`<circle cx="200" cy="78" r="42"/><path d="M182 70 Q200 50 218 72 Q206 92 190 80" fill="none" stroke-width="2.5"/>`;break;
    case 'afro': back=afroBack();break;
  }
  // Front hair is drawn twice: stroked, then fill-only on top, so only the outline of the
  // union shows and overlapping pieces don't leave lines inside the hair.
  const hasCap = b!=='bald' || h.bangs!=='none';
  const covered = ['short','spiky','bob','long','wavy','pony','afro'].includes(b); // back hair hides the cap's outer edge
  let shapes='', outline='';
  if(hasCap){
    if(b==='spiky') shapes+=`<path d="${spiky()}"/>`;
    else if(b==='buzz') front+=`<path d="${CAP}" fill-opacity=".55" stroke-opacity=".4"/>`;
    else{
      shapes+=`<path d="${CAP}"/>`;
      outline+= covered
        ? `<path d="M76 258 C82 258 87 252 89 242 C98 192 138 166 200 164 C262 166 302 192 311 242 C313 252 318 258 324 258" fill="none"/>`
        : `<path d="${CAP}"/>`;
    }
  }
  switch(h.bangs){
    case 'blunt': shapes+=`<path d="M84 238 C80 150 130 98 200 98 C270 98 320 150 316 238 L304 238${jag(302,98,212,7,10)} L96 238 Z"/>`;break;
    case 'swept': shapes+=`<path d="M82 242 C76 150 130 98 200 98 C272 98 326 150 320 248 C304 238 288 222 274 206 C240 196 190 182 150 170 C124 166 106 178 96 200 C92 214 90 228 90 242 Z"/>`;break;
    case 'center': shapes+=`<path d="${both('M200 100 C146 104 92 146 84 244 L98 246 C104 196 138 150 198 124 Z')}"/>`;break;
    case 'choppy': shapes+=`<path d="M84 238 C80 150 130 98 200 98 C270 98 320 150 316 238 L306 238${jag(304,96,204,14,10)} L94 238 Z"/>`;break;
    case 'ahoge': shapes+=`<path d="M198 94 C176 54 206 30 236 44 C212 46 200 62 208 94 Z"/>`;break;
  }
  front+=`<g stroke-width="5">${outline}${shapes.replace(`<path d="${CAP}"/>`,'')}</g><g stroke="none">${shapes}</g>`;
  if(hasCap && b!=='buzz') front+=`<path d="M138 124 Q166 104 196 101" fill="none" stroke="${hl}" stroke-width="7" stroke-linecap="round" opacity=".55"/>`;
  if(b==='bald') front+=`<ellipse cx="160" cy="130" rx="22" ry="10" fill="#fff" stroke="none" opacity=".35" transform="rotate(-25 160 130)"/>`;
  if(st.extra.bow) front+=`<g transform="translate(266 116) rotate(18)" stroke="#c2385d" stroke-width="2.5"><path d="M0 0 L-24 -14 L-24 14 Z M0 0 L24 -14 L24 14 Z" fill="#ff6f91" stroke-linejoin="round"/><circle r="7" fill="#ff8fab"/></g>`;
  return {back,front};
}

function outfit(st,P,g){
  const o=st.outfit,c=o.color,dk=shade(c,-25),skin=st.face.skin,sk=shade(skin,-10),line=shade(skin,-48);
  const body='M36 500 C42 452 100 430 166 424 L234 424 C300 430 358 452 364 500 Z';
  let s='';
  if(o.style==='hoodie') s+=`<path d="M124 472 C112 418 150 388 200 388 C250 388 288 418 276 472 Z" fill="${dk}" stroke="${shade(c,-40)}" stroke-width="2.5"/>`;
  s+=`<path d="M170 300 L170 436 Q200 456 230 436 L230 300 Z" fill="${sk}" stroke="${line}" stroke-width="3"/>`;
  s+=`<ellipse cx="200" cy="${f1(g.chinY-4)}" rx="31" ry="22" fill="${shade(skin,-24)}" opacity=".55"/>`;
  s+=`<path d="${body}" fill="${c}"/><path d="M36 500 C42 452 100 430 166 424 M234 424 C300 430 358 452 364 500" fill="none" stroke="${shade(c,-40)}" stroke-width="2.5"/>`;
  if(o.style==='stripe') s+=`<path d="${body}" fill="url(#${P}st)"/>`;
  const U=`<path d="M168 424 Q200 458 232 424 Z" fill="${sk}"/><path d="M166 424 Q200 462 234 424" fill="none" stroke="${dk}" stroke-width="6" stroke-linecap="round"/>`;
  switch(o.style){
    case 'tee': case 'stripe': s+=U;break;
    case 'v': s+=`<path d="M170 424 L200 474 L230 424 Z" fill="${sk}"/><path d="M168 424 L200 478 L232 424" fill="none" stroke="${dk}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`;break;
    case 'shirt': {const cl=shade(c,55);
      s+=`<path d="M172 424 L200 470 L228 424 Z" fill="${sk}"/><path d="M200 470 L200 500" stroke="${dk}" stroke-width="2.5"/>`
       +`<path d="${both('M166 420 L200 470 L178 478 L154 432 Z')}" fill="${cl}" stroke="${dk}" stroke-width="2.5" stroke-linejoin="round"/>`
       +`<circle cx="200" cy="486" r="3.5" fill="${cl}" stroke="${dk}" stroke-width="1.5"/>`;break;}
    case 'hoodie': s+=U+`<path d="M186 444 L182 488 M214 444 L218 488" stroke="${shade(c,55)}" stroke-width="3.5" stroke-linecap="round"/><circle cx="182" cy="490" r="4" fill="${shade(c,55)}"/><circle cx="218" cy="490" r="4" fill="${shade(c,55)}"/>`;break;
    case 'turtle': s+=`<path d="M166 384 L166 430 Q200 448 234 430 L234 384 Q200 398 166 384Z" fill="${c}" stroke="${shade(c,-40)}" stroke-width="2.5"/>`
      +[178,190,200,210,222].map(x=>`<path d="M${x} ${x===200?396:394} L${x} ${x===200?440:436}" stroke="${dk}" stroke-width="2" opacity=".6"/>`).join('');break;
  }
  return s;
}

function glasses(st,g){
  const t=st.extra.glasses;if(t==='none')return '';
  const r=24*st.eyes.size+2,y=g.eyeY+1,gc=INK,rr=t==='round'?r:r*1.15;
  let s='';
  for(const side of [-1,1]){
    const x=CX+side*g.gap;
    if(t==='round') s+=`<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="#fff" fill-opacity=".14" stroke="${gc}" stroke-width="3.5"/>`;
    if(t==='square') s+=`<rect x="${f1(x-r*1.15)}" y="${f1(y-r*.8)}" width="${f1(r*2.3)}" height="${f1(r*1.6)}" rx="9" fill="#fff" fill-opacity=".14" stroke="${gc}" stroke-width="3.5"/>`;
    if(t==='sun') s+=`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(r*1.15)}" ry="${f1(r*.92)}" fill="#1f1b2e" fill-opacity=".92" stroke="${gc}" stroke-width="3"/><path d="M${f1(x-r*.6)} ${f1(y-r*.2)} Q${f1(x-r*.4)} ${f1(y-r*.6)} ${f1(x)} ${f1(y-r*.62)}" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".5"/>`;
    s+=`<path d="M${f1(x+side*rr)} ${f1(y-3)} L${f1(CX+side*g.W*.97)} ${f1(y-7)}" stroke="${gc}" stroke-width="3.5" stroke-linecap="round"/>`;
  }
  s+=`<path d="M${f1(CX-g.gap+rr)} ${f1(y-4)} Q${CX} ${f1(y-13)} ${f1(CX+g.gap-rr)} ${f1(y-4)}" fill="none" stroke="${gc}" stroke-width="3.5" stroke-linecap="round"/>`;
  return s;
}

/* ---------- full character ---------- */
function renderFace(st,P,anim=false){
  const g=geo(st),f=st.face,skin=f.skin,line=shade(skin,-48);
  const hc=st.hair.color,hdk=shade(hc,-38),hl=shade(hc,30);
  const bg=(BGS[st.outfit.bg]||BGS.peach).c;
  const hairTf=`translate(${CX} ${CY}) scale(${f1(g.W/120*1000)/1000} ${f1(g.H/150*1000)/1000}) translate(${-CX} ${-CY})`;
  const hair=hairParts(st,hl);
  const hg=inner=>`<g transform="${hairTf}" fill="${hc}" stroke="${hdk}" stroke-width="2.5" stroke-linejoin="round">${inner}</g>`;
  const browC=st.brows.color||shade(hc,-14);
  let s=`<defs>`
    +`<linearGradient id="${P}bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></linearGradient>`
    +`<radialGradient id="${P}bl"><stop offset="0" stop-color="#ff6f6f" stop-opacity=".5"/><stop offset="1" stop-color="#ff6f6f" stop-opacity="0"/></radialGradient>`
    +`<linearGradient id="${P}ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset=".55" stop-color="#000" stop-opacity="0"/></linearGradient>`
    +`<pattern id="${P}st" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="10" fill="#fff" opacity=".55"/></pattern>`
    +`</defs>`;
  s+=`<rect width="400" height="500" fill="url(#${P}bg)"/><circle cx="200" cy="232" r="178" fill="#fff" opacity="${st.outfit.bg==='night'?.08:.3}"/>`;
  if(st.outfit.bg==='night') s+=[[52,60],[340,90],[300,40],[80,150],[360,190],[30,240]].map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="${i%2?2:3}" fill="#fff" opacity=".8"/>`).join('');
  s+=hg(hair.back);
  s+=outfit(st,P,g);
  s+=ear(st,g,-1,line,st.extra.earring)+ear(st,g,1,line,st.extra.earring);
  s+=`<path d="${facePath(g.W,g.H,f.jaw,f.chin)}" fill="${skin}" stroke="${line}" stroke-width="3" stroke-linejoin="round"/>`;
  if(f.blush) for(const sd of [-1,1]) s+=`<ellipse cx="${f1(CX+sd*(g.gap+8))}" cy="${f1(g.eyeY+30)}" rx="24" ry="14" fill="url(#${P}bl)"/>`;
  if(st.extra.freckles) for(const sd of [-1,1]) for(const [dx,dy] of [[-9,22],[0,26],[9,21],[-4,32],[6,33]])
    s+=`<circle cx="${f1(CX+sd*(g.gap+dx))}" cy="${f1(g.eyeY+dy)}" r="1.9" fill="${shade(skin,-32)}" opacity=".7"/>`;
  if(st.extra.mole) s+=`<circle cx="${f1(CX+g.gap+12)}" cy="${f1(g.eyeY+24)}" r="2.3" fill="${shade(skin,-60)}"/>`;
  s+=nose(st,g);
  if(st.extra.beard){const ms=st.mouth.size;
    s+=`<g transform="translate(${CX} ${f1(g.mouthY-11)}) scale(${ms})"><path d="${both('M200 0 C208 -7 222 -7 232 3 C222 -1 210 4 200 6 Z')}" transform="translate(-200 0)" fill="${shade(hc,-6)}" stroke="${hdk}" stroke-width="1.5"/></g>`;}
  s+=mouth(st,g,P);
  s+=eye(st,g,P,-1,anim)+eye(st,g,P,1,anim);
  s+=brow(st,g,-1,browC)+brow(st,g,1,browC);
  s+=glasses(st,g);
  s+=hg(hair.front);
  return s;
}

/* =========================================================
   Thumbnails
   ========================================================= */
const sq=(x,y,side)=>`${f1(x-side/2)} ${f1(y-side/2)} ${side} ${side}`;
function viewFor(v,st){
  const g=geo(st);
  switch(v){
    case 'eyes': return sq(CX+g.gap,g.eyeY-4,86);
    case 'brows': return sq(CX+g.gap,g.browY+8,86);
    case 'nose': return sq(CX,g.noseY-8,80);
    case 'mouth': return sq(CX,g.mouthY,92);
    case 'hair': return '-20 0 440 440';
    case 'extra': return sq(CX,g.eyeY+20,220);
    case 'outfit': return '10 190 380 310';
    case 'full': return '0 0 400 500';
    default: return '30 70 340 360';
  }
}

/* =========================================================
   Controls definition
   ========================================================= */
const TABS=[
  {id:'face',label:'臉型',view:'face',controls:[
    {t:'opts',k:'face.shape',label:'臉型',map:FACE_SHAPES,apply:(s,id)=>{const p=FACE_SHAPES[id];Object.assign(s.face,{shape:id,w:p.w,h:p.h,jaw:p.jaw,chin:p.chin});}},
    {t:'range',k:'face.w',label:'臉寬',min:100,max:140,step:1,jitter:true},
    {t:'range',k:'face.h',label:'臉長',min:125,max:175,step:1,jitter:true},
    {t:'range',k:'face.jaw',label:'下顎寬度',min:.55,max:1,step:.01,jitter:true},
    {t:'range',k:'face.chin',label:'下巴圓潤',min:.04,max:.6,step:.01,jitter:true},
    {t:'range',k:'face.ear',label:'耳朵大小',min:.6,max:1.4,step:.01},
    {t:'color',k:'face.skin',label:'膚色',colors:SKINS,common:7},
    {t:'toggles',label:'臉上細節',items:[['face.blush','腮紅',.6],['extra.freckles','雀斑',.2],['extra.mole','美人痣',.15]]},
  ]},
  {id:'eyes',label:'眼睛',view:'eyes',controls:[
    {t:'opts',k:'eyes.style',label:'眼型',map:EYES},
    {t:'range',k:'eyes.size',label:'大小',min:.75,max:1.3,step:.01},
    {t:'range',k:'eyes.gap',label:'眼距',min:-14,max:18,step:.5},
    {t:'range',k:'eyes.y',label:'高低',min:-16,max:16,step:.5},
    {t:'range',k:'eyes.tilt',label:'眼角角度',min:-8,max:10,step:.5},
    {t:'color',k:'eyes.iris',label:'瞳孔顏色',colors:IRISES,common:4},
    {t:'toggles',label:'細節',items:[['eyes.lashes','睫毛',.6]]},
  ]},
  {id:'brows',label:'眉毛',view:'brows',controls:[
    {t:'opts',k:'brows.style',label:'眉型',map:BROWS},
    {t:'range',k:'brows.thick',label:'粗細',min:.6,max:1.6,step:.01},
    {t:'range',k:'brows.len',label:'長度',min:.7,max:1.3,step:.01},
    {t:'range',k:'brows.y',label:'高低',min:-12,max:12,step:.5},
    {t:'range',k:'brows.tilt',label:'角度',min:-15,max:15,step:.5},
    {t:'color',k:'brows.color',label:'眉色',colors:HAIRS,auto:true},
  ]},
  {id:'nose',label:'鼻子',view:'nose',controls:[
    {t:'opts',k:'nose.style',label:'鼻型',map:NOSES},
    {t:'range',k:'nose.size',label:'大小',min:.7,max:1.5,step:.01},
    {t:'range',k:'nose.y',label:'高低',min:-14,max:14,step:.5},
  ]},
  {id:'mouth',label:'嘴巴',view:'mouth',controls:[
    {t:'opts',k:'mouth.style',label:'嘴型',map:MOUTHS},
    {t:'range',k:'mouth.size',label:'寬度',min:.7,max:1.5,step:.01},
    {t:'range',k:'mouth.y',label:'高低',min:-16,max:16,step:.5},
    {t:'color',k:'mouth.lip',label:'唇色',colors:LIPS},
  ]},
  {id:'hair',label:'髮型',view:'hair',controls:[
    {t:'opts',k:'hair.back',label:'髮型',map:HAIR_BACK},
    {t:'opts',k:'hair.bangs',label:'瀏海',map:BANGS},
    {t:'color',k:'hair.color',label:'髮色',colors:HAIRS,common:7},
  ]},
  {id:'extra',label:'配件',view:'extra',controls:[
    {t:'opts',k:'extra.glasses',label:'眼鏡',map:GLASSES,noneBias:.7},
    {t:'toggles',label:'小東西',items:[['extra.bow','蝴蝶結',.2],['extra.earring','耳環',.2],['extra.beard','小鬍子',.12]]},
  ]},
  {id:'outfit',label:'衣服',view:'outfit',controls:[
    {t:'opts',k:'outfit.style',label:'上衣',map:OUTFITS},
    {t:'color',k:'outfit.color',label:'衣服顏色',colors:CLOTHES},
    {t:'opts',k:'outfit.bg',label:'背景',map:BGS,view:'full'},
  ]},
];

/* =========================================================
   State, history, storage
   ========================================================= */
const LS_CUR='faceStudio.v1.current', LS_SAVES='faceStudio.v1.saves';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};
let state=merge(DEFAULT,store.get(LS_CUR,null));
let last=JSON.stringify(state);
const hist=[];
function commit(){const now=JSON.stringify(state);if(now!==last){hist.push(last);if(hist.length>80)hist.shift();last=now;}
  store.set(LS_CUR,state);$('#undo').disabled=!hist.length;}
function undo(){if(!hist.length)return;state=JSON.parse(hist.pop());last=JSON.stringify(state);store.set(LS_CUR,state);$('#undo').disabled=!hist.length;render();}

/* =========================================================
   Random
   ========================================================= */
const pick=a=>a[Math.floor(Math.random()*a.length)];
function randomControl(st,c){
  if(c.t==='opts'){
    const keys=Object.keys(c.map);
    const id=(c.noneBias&&Math.random()<c.noneBias)?keys[0]:pick(keys);
    c.apply?c.apply(st,id):setK(st,c.k,id);
  }else if(c.t==='range'){
    let v;
    if(c.jitter) v=getK(st,c.k)+(Math.random()-.5)*(c.max-c.min)*.25;
    else v=c.min+(c.max-c.min)*(Math.random()+Math.random())/2;
    setK(st,c.k,+clamp(Math.round(v/c.step)*c.step,c.min,c.max).toFixed(3));
  }else if(c.t==='color'){
    if(c.auto){setK(st,c.k,Math.random()<.75?null:pick(c.colors));return;}
    const pool=(c.common&&Math.random()<.8)?c.colors.slice(0,c.common):c.colors;
    setK(st,c.k,pick(pool));
  }else if(c.t==='toggles'){
    for(const [k,,p] of c.items) setK(st,k,Math.random()<(p??.25));
  }
}
function randomTab(tab){for(const c of tab.controls) randomControl(state,c);}
function randomAll(){const name=state.name;for(const t of TABS) randomTab(t);state.name=name;commit();render();}

/* =========================================================
   UI
   ========================================================= */
const $=s=>document.querySelector(s);
const stage=$('#stage'),tabsEl=$('#tabs'),content=$('#content');
let curTab=store.get('faceStudio.v1.tab','face');
if(!TABS.find(t=>t.id===curTab)) curTab='face';
let uid=0;

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}

function buildTabs(){
  tabsEl.innerHTML='';
  for(const t of TABS){
    const b=el('button','tab',t.label);b.setAttribute('role','tab');b.setAttribute('aria-selected',t.id===curTab);
    b.onclick=()=>{curTab=t.id;store.set('faceStudio.v1.tab',curTab);buildTabs();buildPanel();};
    tabsEl.append(b);
  }
}

let bound=[];   // [{c, sync()}]
function buildPanel(){
  const tab=TABS.find(t=>t.id===curTab);
  content.innerHTML='';bound=[];content.scrollTop=0;
  const head=el('div','phead');head.append(el('h2','',tab.label));
  const rb=el('button','btn','<span class="i">🎲</span><span>隨機這部分</span>');
  rb.onclick=()=>{randomTab(tab);commit();render();};
  head.append(rb);content.append(head);

  for(const c of tab.controls){
    const g=el('div','group');
    if(c.label&&c.t!=='range') g.append(el('div','glabel',c.label));
    if(c.t==='range') g.classList.add('tight');
    if(c.t==='opts'){
      const wrap=el('div','opts');const btns=[];
      for(const [id,o] of Object.entries(c.map)){
        const b=el('button','opt',`<svg viewBox="0 0 400 500" aria-hidden="true"></svg><span>${label(o)}</span>`);
        b.onclick=()=>{c.apply?c.apply(state,id):setK(state,c.k,id);commit();render();};
        wrap.append(b);btns.push([id,b]);
      }
      g.append(wrap);
      bound.push({sync(){
        const cur=getK(state,c.k);
        for(const [id,b] of btns){
          b.setAttribute('aria-pressed',cur===id);
          const v=clone(state);c.apply?c.apply(v,id):setK(v,c.k,id);
          const svg=b.firstChild;svg.setAttribute('viewBox',viewFor(c.view||tab.view,v));
          svg.innerHTML=renderFace(v,'t'+(uid++)+'_');
        }
      }});
    }else if(c.t==='range'){
      const r=el('label','range',`<span>${c.label}</span>`);
      const inp=el('input');Object.assign(inp,{type:'range',min:c.min,max:c.max,step:c.step});
      inp.oninput=()=>{setK(state,c.k,+inp.value);render(true);};
      inp.onchange=()=>{commit();render();};
      r.append(inp);g.append(r);
      bound.push({sync(){if(document.activeElement!==inp||true)inp.value=getK(state,c.k);}});
    }else if(c.t==='color'){
      const wrap=el('div','sws');const sws=[];
      if(c.auto){const a=el('button','sw auto','同髮色');a.onclick=()=>{setK(state,c.k,null);commit();render();};wrap.append(a);sws.push([null,a]);}
      for(const col of c.colors){
        const b=el('button','sw');b.style.setProperty('--c',col);b.setAttribute('aria-label',col);
        b.onclick=()=>{setK(state,c.k,col);commit();render();};wrap.append(b);sws.push([col,b]);
      }
      const cu=el('label','sw custom');cu.title='自訂顏色';const ci=el('input');ci.type='color';
      ci.oninput=()=>{setK(state,c.k,ci.value);render(true);};ci.onchange=()=>{commit();render();};
      cu.append(ci);wrap.append(cu);g.append(wrap);
      bound.push({sync(){
        const cur=getK(state,c.k);let hit=false;
        for(const [col,b] of sws){const on=(col===null?cur===null:(cur||'').toLowerCase()===col.toLowerCase());b.setAttribute('aria-pressed',on);hit=hit||on;}
        cu.setAttribute('aria-pressed',!hit);
        const shown=cur||shade(state.hair.color,-14);ci.value=shown;
      }});
    }else if(c.t==='toggles'){
      const wrap=el('div','chips');const chips=[];
      for(const [k,lb] of c.items){
        const b=el('button','chip',lb);b.onclick=()=>{setK(state,k,!getK(state,k));commit();render();};
        wrap.append(b);chips.push([k,b]);
      }
      g.append(wrap);
      bound.push({sync(){for(const [k,b] of chips)b.setAttribute('aria-pressed',!!getK(state,k));}});
    }
    content.append(g);
  }
  syncPanel();
}
function syncPanel(){for(const b of bound)b.sync();}

/* ---------- render ---------- */
let raf=0,thumbTimer=0;
function render(fast){
  if(raf)cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{
    raf=0;
    stage.innerHTML=renderFace(state,'m',true);
    look();
    $('#name').value!==state.name&&($('#name').value=state.name);
    // thumbnails are cheap but no need to rebuild them on every slider tick
    clearTimeout(thumbTimer);
    if(fast) thumbTimer=setTimeout(syncPanel,120); else syncPanel();
  });
}

/* ---------- eyes follow the pointer ---------- */
let ptr=null;
function look(){
  const g=geo(state),max=44*state.eyes.size*.1;
  for(const side of [-1,1]){
    const iris=document.getElementById('miris'+(side>0?'R':'L'));if(!iris)continue;
    let ox=0,oy=0;
    if(ptr){const dx=ptr.x-(CX+side*g.gap),dy=ptr.y-g.eyeY,d=Math.hypot(dx,dy)||1,k=Math.min(1,d/160)*max;ox=dx/d*k;oy=dy/d*k*.7;}
    iris.setAttribute('transform',`translate(${f1(ox*side)} ${f1(oy)})`);
  }
}
addEventListener('pointermove',e=>{
  const m=stage.getScreenCTM();if(!m)return;
  const p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());
  ptr={x:p.x,y:p.y};look();
});
document.addEventListener('pointerleave',()=>{ptr=null;look();});

/* ---------- name ---------- */
$('#name').addEventListener('input',e=>{state.name=e.target.value;store.set(LS_CUR,state);});
$('#name').addEventListener('change',()=>commit());

/* ---------- toast ---------- */
let tt=0;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- gallery ---------- */
function saves(){return store.get(LS_SAVES,[]);}
function saveCurrent(){
  const list=saves();
  list.unshift({id:Date.now(),name:state.name||'無名',time:Date.now(),state:clone(state)});
  if(list.length>30)list.length=30;
  toast(store.set(LS_SAVES,list)?`已存檔：${state.name||'無名'}`:'這個瀏覽器無法存檔');
}
function buildGallery(){
  const list=saves(),grid=$('#galGrid');grid.innerHTML='';
  $('#galEmpty').style.display=list.length?'none':'';
  for(const it of list){
    const card=el('button','gcard');
    const d=new Date(it.time);
    card.innerHTML=`<svg viewBox="0 0 400 500">${renderFace(merge(DEFAULT,it.state),'g'+(uid++)+'_')}</svg><b></b><small>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</small>`;
    card.querySelector('b').textContent=it.name;
    card.onclick=()=>{state=merge(DEFAULT,it.state);commit();render();$('#gal').close();toast(`載入：${it.name}`);};
    const del=el('span','gdel','✕');del.setAttribute('role','button');del.setAttribute('aria-label','刪除');
    del.style.display='grid';del.style.placeItems='center';
    del.onclick=e=>{e.stopPropagation();store.set(LS_SAVES,saves().filter(x=>x.id!==it.id));buildGallery();};
    card.append(del);grid.append(card);
  }
}

/* ---------- download PNG ---------- */
function download(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="800" height="1000">${renderFace(state,'x')}</svg>`;
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=800;c.height=1000;
    c.getContext('2d').drawImage(img,0,0,800,1000);URL.revokeObjectURL(url);
    c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(state.name||'face')+'.png';
      document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('圖片已下載');},'image/png');
  };
  img.onerror=()=>toast('下載失敗，請再試一次');
  img.src=url;
}

/* ---------- wire up ---------- */
$('#undo').onclick=undo;
$('#rand').onclick=randomAll;
$('#save').onclick=saveCurrent;
$('#dl').onclick=download;
$('#openGal').onclick=()=>{buildGallery();$('#gal').showModal();};
$('#closeGal').onclick=()=>$('#gal').close();
$('#gal').addEventListener('click',e=>{if(e.target===$('#gal'))$('#gal').close();});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='r'||e.key==='R')randomAll();
});

$('#undo').disabled=true;
$('#name').value=state.name;
buildTabs();buildPanel();render();
</script>
