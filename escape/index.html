<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>八音盒謎屋 · Music Box Manor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#2b1d16">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg id="gdefs" width="0" height="0" style="position:absolute;left:0;top:0" aria-hidden="true"><defs id="defs"></defs></svg>
<svg id="meas" class="meas" viewBox="0 0 1000 625" width="1000" height="625" style="position:absolute;left:-3000px;top:0;visibility:hidden" aria-hidden="true"></svg>
<div id="app">
  <!-- 遊戲畫面 -->
  <div id="play" hidden>
    <header id="bar">
      <button class="ib" id="bMenu" aria-label="選單"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div id="rTitle"><small id="rNo"></small><b id="rName"></b></div>
      <div id="hearts" hidden></div>
      <span id="clock">00:00</span>
      <button class="ib" id="bHint" aria-label="提示"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><i id="hintN">0</i></button>
      <button class="ib" id="bMemo" aria-label="手帳"><svg viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6zM6 3v18M9 8h6M9 12h6"/></svg><i id="memoDot" hidden></i></button>
      <button class="ib mute" aria-label="聲音"><svg viewBox="0 0 24 24"><path class="on" d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="off" d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/></svg></button>
    </header>
    <div id="main">
      <div id="sceneWrap">
        <svg id="scene" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid meet">
          <g id="art"></g>
          <g id="hs"></g>
        </svg>
        <div id="fxs" aria-hidden="true"></div>
        <div id="panBar" hidden><i></i></div>
        <button class="nav L" id="nL" aria-label="向左轉"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="nav R" id="nR" aria-label="向右轉"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        <button class="nav B" id="nB" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg><span>返回</span></button>
        <div id="compass"></div>
        <div id="toast" hidden></div>
      </div>
      <aside id="inv">
        <div id="invHead"><b id="invTitle">道具</b><span id="invTip"></span></div>
        <div id="slots"></div>
        <div id="invInfo"><span id="heldName">點道具可以拿在手上，再點畫面使用。</span><button id="bInspect" hidden>查看</button></div>
        <div id="logWrap"><b>紀錄</b><ol id="log"></ol></div>
        <div id="tActs" hidden>
          <button id="bPrev">‹ 上一句</button><button id="bPress">追問</button><button id="bPresent" class="hot">出示證物</button><button id="bNext">下一句 ›</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- 對話 -->
  <div id="dlg" hidden>
    <div id="dlgPic"></div>
    <div id="dlgBox"><b id="dlgWho"></b><p id="dlgText"></p><span id="dlgMore">▼</span></div>
  </div>

  <!-- 大字特效、章節卡、成就 -->
  <div id="bang" hidden></div>
  <div id="ovl" hidden></div>
  <div id="achT" hidden></div>

  <!-- 視窗（謎題、道具、提示） -->
  <div id="modal" hidden><div id="panel"><button class="x" id="mClose" aria-label="關閉">✕</button><div id="mBody"></div></div></div>

  <!-- 標題 -->
  <section id="title" class="screen">
    <svg id="titleArt" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice"></svg><div id="titleFx" aria-hidden="true"></div>
    <div class="tWrap">
      <div class="logo"><small>MW · ESCAPE &amp; DEDUCE</small><h1>八音盒謎屋</h1><p class="en">Music Box Manor</p></div>
      <div class="tBtns">
        <button class="big" id="bStart">開始解謎</button>
        <button class="btn2" id="bChapters">章節選擇</button>
        <button class="btn2" id="bCases">小鎮推理事件簿</button>
        <div class="tPair"><button class="btn2 daily" id="bDaily" hidden></button><button class="btn2" id="bAlbum">收藏與成就</button></div>
      </div>
      <div class="tRow">
        <button class="pill mute" aria-label="聲音"><svg viewBox="0 0 24 24"><path class="on" d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/><path class="off" d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6"/></svg><span class="lbOn">聲音開</span><span class="lbOff">聲音關</span></button>
        <a class="pill" href="../index.html">← 大廳</a>
      </div>
      <p id="tStars"></p>
    </div>
  </section>

  <!-- 章節 -->
  <section id="chap" class="screen" hidden>
    <div class="sHead"><button class="pill" id="bChapBack">‹ 回標題</button><h2 id="chapH">章節選擇</h2><span></span></div>
    <div id="chapTabs"><button data-tab="rooms" class="on">謎屋章節</button><button data-tab="cases">推理事件簿</button></div>
    <div id="chapList"></div>
  </section>

  <!-- 收藏與成就 -->
  <section id="album" class="screen" hidden>
    <div class="sHead"><button class="pill" id="bAlbBack">‹ 回標題</button><h2>收藏與成就</h2><span></span></div>
    <div class="sBody" id="albBody"></div>
  </section>

  <!-- 過關 -->
  <section id="clear" class="screen dim" hidden>
    <svg id="clearArt" viewBox="0 0 1000 625" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
    <div class="cCard">
      <p class="lbl" id="cLbl">CHAPTER CLEAR</p>
      <h2 id="cName"></h2>
      <div id="cStars"></div>
      <div id="cStats"></div>
      <div id="cExtra"></div>
      <p id="cNote"></p>
      <div class="col">
        <button class="big" id="bNextCh">下一章</button>
        <button class="btn2" id="bToChap">章節選擇</button>
      </div>
    </div>
  </section>
</div>

<script src="js/util.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/icons.js"></script>
<script src="js/items.js"></script>
<script src="js/people.js"></script>
<script src="js/engine.js"></script>
<script src="js/widgets.js"></script>
<script src="js/room1.js"></script>
<script src="js/room2.js"></script>
<script src="js/room3.js"></script>
<script src="js/room4.js"></script>
<script src="js/room5.js"></script>
<script src="js/room6.js"></script>
<script src="js/room7.js"></script>
<script src="js/room8.js"></script>
<script src="js/cases.js"></script>
<script src="js/case1.js"></script>
<script src="js/case2.js"></script>
<script src="js/case3.js"></script>
<script src="js/room9.js"></script>
<script src="js/room10.js"></script>
<script src="js/case4.js"></script>
<script src="js/case5.js"></script>
<script src="js/decor.js"></script>
<script src="js/main.js"></script>
</body>
</html>
