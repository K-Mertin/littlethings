<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>寫實捏臉 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#16181c;--panel:#1f2227;--panel2:#262a30;--ink:#eceae6;--mute:#9a9790;--line:#33373e;--accent:#e8b27a;--accent-soft:rgba(232,178,122,.14)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.back{color:var(--mute);text-decoration:none;font-size:14px;padding:6px 10px;border-radius:999px;border:1px solid var(--line)}
.back:hover{color:var(--ink)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand small{font-size:10px;letter-spacing:.3em;color:var(--mute);font-weight:500}
.brand b{font-size:19px;font-weight:900;letter-spacing:.12em}
.actions{margin-left:auto;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:7px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--mute)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1610}
.btn .i{font-size:15px;line-height:1}

.layout{flex:1;min-height:0;overflow:hidden;display:grid;grid-template-columns:1fr minmax(340px,440px)}
.view{position:relative;min-height:0;background:radial-gradient(120% 90% at 50% 30%,#3a3f47 0%,#24272d 55%,#16181c 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vmodes{position:absolute;right:12px;top:12px;display:flex;gap:4px}
.vmodes .btn{padding:5px 11px;font-size:13px;background:rgba(31,34,39,.78)}
.vmodes .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--mute);pointer-events:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);font-size:14px;letter-spacing:.1em}
.namebar{position:absolute;left:50%;top:14px;transform:translateX(-50%)}
.namebar input{font:inherit;font-weight:700;font-size:17px;text-align:center;border:none;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);width:10em;padding:4px}
.namebar input:focus{outline:none;border-bottom-color:var(--accent)}

.panel{min-height:0;min-width:0;overflow:hidden;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tab{border:none;background:transparent;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;color:var(--mute)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.content{flex:1;overflow-y:auto;padding:4px 16px 28px}
.phead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.phead h2{margin:0;font-size:17px;font-weight:900;letter-spacing:.08em}
.glabel{font-size:12.5px;color:var(--mute);font-weight:500;margin:16px 0 8px;letter-spacing:.06em}
.range{display:grid;grid-template-columns:6.2em 1fr 2.6em;align-items:center;gap:10px;margin:2px 0}
.range span{font-size:14px}
.range output{font-size:11px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.range input{width:100%;accent-color:var(--accent);height:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 13px;font-weight:500;font-size:13.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--panel);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0;position:relative}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.sw.custom{background:conic-gradient(#ff6b6b,#ffd93d,#6bcb77,#4d96ff,#c77dff,#ff6b6b);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:none;padding:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.pitem{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:5px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px}
.pitem img,.pitem .noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:grid;place-items:center;background:#2c3036;color:var(--mute);font-size:22px}
.pitem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sw.auto{width:auto;border-radius:999px;padding:0 12px;font-size:12px;font-weight:500;background:var(--panel2);color:var(--ink)}
.note{font-size:12.5px;color:var(--mute);line-height:1.6;margin:12px 0 0}

dialog{border:1px solid var(--line);border-radius:20px;padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100dvh - 48px);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.galhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.galhead h2{margin:0;font-size:17px}
.galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:16px 18px 20px}
.gcard{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--panel2);padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.gcard:hover{border-color:var(--accent)}
.gcard img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block}
.gcard b{font-size:14px}.gcard small{font-size:11px;color:var(--mute)}
.gdel{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:12px}
.empty{padding:28px 18px;color:var(--mute);text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .top{padding:8px 12px;gap:8px}
  .brand small{display:none}.brand b{font-size:16px}
  .btn{padding:6px 10px}.btn .t{display:none}.btn .i{font-size:17px}
  .back .bt{display:none}
  .layout{grid-template-columns:1fr;grid-template-rows:42dvh minmax(0,1fr)}
  .panel{border-left:none;border-top:1px solid var(--line)}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .tab{flex-shrink:0}
  .hint{display:none}
  .namebar{top:8px}
}
</style>

    <button class="btn" id="rand" title="隨機 (R)"><span class="i">🎲</span><span class="t">隨機</span></button>

</main>

  <p class="empty" id="galEmpty">還沒有存檔。按「存檔」把現在的角色收進來。</p>
</dialog>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));

/* =====================================================================
   Load data (MakeHuman CC0 base mesh, targets, proxies – see tools/build.py)
   ===================================================================== */
const meta=await (await fetch('data/head.json')).json();
const buf=await (await fetch('data/head.bin')).arrayBuffer();
const view=(name,T)=>{const [o,l]=meta.sect[name];return new T(buf,o,l/T.BYTES_PER_ELEMENT);};
const nK=meta.nK,nS=meta.nS,nR=meta.nR;
const base=view('base',Float32Array),sPtr=view('sPtr',Uint32Array),sIdx=view('sIdx',Uint16Array),sW=view('sW',Float32Array);
const rSrc=view('rSrc',Uint32Array),rUV=view('rUV',Float32Array),tri=view('tri',Uint32Array);
const mIdx=view('mIdx',Uint16Array),mD=view('mD',Int16Array);
const MI=new Map(meta.morphs.map((m,i)=>[m.name,i]));
const triS=new Uint32Array(tri.length);for(let i=0;i<tri.length;i++)triS[i]=rSrc[tri[i]];

/* =====================================================================
   Morph engine
   ===================================================================== */
const P=new Float32Array(nK*3);                 // morphed base verts
const S=new Float32Array(nS*3),SN=new Float32Array(nS*3);
function applyMorphs(W){
  P.set(base);const inv=1/meta.QS;
  for(const [name,w] of W){
    if(Math.abs(w)<1e-4)continue;const mi=MI.get(name);if(mi===undefined)continue;
    const m=meta.morphs[mi],k=w*inv*(m.s||1);
    for(let j=m.off,e=m.off+m.n;j<e;j++){const v=mIdx[j]*3,d=j*3;P[v]+=mD[d]*k;P[v+1]+=mD[d+1]*k;P[v+2]+=mD[d+2]*k;}
  }
}
function subdivide(src,dst,n,dim){
  for(let r=0;r<nS;r++){
    for(let c=0;c<dim;c++){let s=0;for(let j=sPtr[r];j<sPtr[r+1];j++)s+=src[sIdx[j]*dim+c]*sW[j];dst[r*dim+c]=s;}
  }
}
function subdividePos(){
  for(let r=0;r<nS;r++){let x=0,y=0,z=0;
    for(let j=sPtr[r],e=sPtr[r+1];j<e;j++){const w=sW[j],v=sIdx[j]*3;x+=P[v]*w;y+=P[v+1]*w;z+=P[v+2]*w;}
    S[r*3]=x;S[r*3+1]=y;S[r*3+2]=z;}
}
function computeNormals(pos,tris,out){
  out.fill(0);
  for(let t=0;t<tris.length;t+=3){
    const a=tris[t]*3,b=tris[t+1]*3,c=tris[t+2]*3;
    const ux=pos[b]-pos[a],uy=pos[b+1]-pos[a+1],uz=pos[b+2]-pos[a+2];
    const vx=pos[c]-pos[a],vy=pos[c+1]-pos[a+1],vz=pos[c+2]-pos[a+2];
    const nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    for(const i of [a,b,c]){out[i]+=nx;out[i+1]+=ny;out[i+2]+=nz;}
  }
  for(let i=0;i<out.length;i+=3){const l=Math.hypot(out[i],out[i+1],out[i+2])||1;out[i]/=l;out[i+1]/=l;out[i+2]/=l;}
}

/* fallback eyebrows: a soft arched band above each eye, in rest-pose coordinates */
function browBand(){
  const m=new Float32Array(nK);
  for(let i=0;i<nK;i++){
    const x=Math.abs(base[i*3]),y=base[i*3+1],z=base[i*3+2];
    if(z<.75||x<.07||x>.66)continue;
    const t=(x-.07)/.59;                                   // 0 inner .. 1 outer
    const yc=7.43+.075*Math.sin(Math.PI*Math.min(1,t*1.25))-.05*t; // arch
    const th=.052*(1-.55*t);                               // thicker at the inner end
    const ends=Math.min(1,t*6)*Math.min(1,(1-t)*5);
    m[i]=Math.exp(-(((y-yc)/th)**2))*ends;
  }
  const s=new Float32Array(nS);subdivide(m,s,nS,1);return s;
}
/* scalp under the hair: painted hair-coloured so gaps between hair cards and skin don't show bare skin */
function scalpMask(){
  const m=new Float32Array(nK);const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
  for(let i=0;i<nK;i++){const x=base[i*3],y=base[i*3+1],z=base[i*3+2];
    const front=sm(.55,1.0,z);                       // 1 at the forehead, 0 at sides/back
    const line=7.84+.08*Math.min(1,Math.abs(x)/.5)-.5*(1-front); // hairline drops towards temples/back
    const ear=Math.abs(x)>.62&&y<7.6&&z>-.35?1:0;    // keep ears clear
    m[i]=(.55*sm(line-.12,line,y)+.45*sm(line,line+.1,y))*(1-ear);}
  const s=new Float32Array(nS);subdivide(m,s,nS,1);return s;
}
/* region masks from how much a target moves each vertex (lips, cheeks, brows…) */
function maskOf(names,pow=1){
  const m=new Float32Array(nK);
  for(const n of names){const mi=MI.get(n);if(mi===undefined)continue;const mm=meta.morphs[mi];
    for(let j=mm.off;j<mm.off+mm.n;j++){const d=j*3;m[mIdx[j]]+=Math.hypot(mD[d],mD[d+1],mD[d+2]);}}
  let mx=0;for(const v of m)mx=Math.max(mx,v);
  for(let i=0;i<nK;i++)m[i]=Math.pow(m[i]/(mx||1),pow);
  const s=new Float32Array(nS);subdivide(m,s,nS,1);return s;
}

/* =====================================================================
   Character model
   ===================================================================== */
const DEFAULT={name:'新角色',
  macro:{gender:.3,age:25,af:.12,as:.58,ca:.3,weight:.5,height:.5,muscle:.5},
  shape:{id:'oval',amt:.4},
  mods:{},                         // slider id -> -1..1
  skin:'#ffffff', skinTex:'auto', lip:'#b8615a', lipAmt:.3, iris:'#5a3a22', brow:'#3b2a20', blush:.25,
  hair:'long01', hairColor:'#2e1f16', brows:'eyebrow003', lashes:'eyelashes02',
  outfit:'female_casualsuit01', top:'', bottom:'', shoes:'shoes01', hat:'', glasses:'', gloves:'', mask:'', socks:'', acc:'', clothColors:{},
  expr:'neutral', blink:true, gaze:true};
const HEAD_SHAPES={oval:'鵝蛋臉',round:'圓臉',rectangular:'長方臉',square:'方臉',triangular:'三角臉',invertedtriangular:'倒三角',diamond:'菱形臉'};

// slider id -> [minTarget, maxTarget] (sym: l-/r- pair)
const S_=(label,t,lo,hi,sym)=>({label,t,lo,hi,sym});
const TABS=[
 {id:'base',label:'基本',groups:[
  {label:'身分',macro:[['gender','性別（女 ↔ 男）',0,1,.01],['age','年齡',11,90,1]]},
  {label:'族裔外觀（自動加總為 100%）',macro:[['af','非洲',0,1,.01],['as','亞洲',0,1,.01],['ca','歐洲',0,1,.01]]},
  {label:'皮膚質感（MakeHuman 寫實皮膚）',skins:true},
  {label:'膚色微調',color:'skin',colors:['#ffffff','#fff1ea','#ffe6d2','#f3d2b8','#e0b493','#c4977a','#9c7660']},
  {label:'腮紅',range:['blush','紅潤度',0,1,.01]},
 ]},
 {id:'body',label:'身體',view:'body',groups:[
  {label:'身材',macro:[['height','身高',0,1,.01],['weight','胖瘦',0,1,.01],['muscle','肌肉',0,1,.01]]},
  {label:'軀幹',mods:[S_('肩寬','torso-scale-horiz','decr','incr'),S_('軀幹長','torso-scale-vert','decr','incr'),S_('胸腔厚度','torso-scale-depth','decr','incr'),
    S_('倒三角','torso-vshape','decr','incr'),S_('胸肌','torso-muscle-pectoral','decr','incr'),S_('背肌','torso-muscle-dorsi','decr','incr'),S_('腹部','stomach-tone','decr','incr')]},
  {label:'腰臀',mods:[S_('臀寬','hip-scale-horiz','decr','incr'),S_('腰線','hip-waist','down','up'),S_('骨盆高','hip-scale-vert','decr','incr'),S_('骨盆厚','hip-scale-depth','decr','incr')]},
  {label:'手臂與手',mods:[S_('上臂長','upperarm-scale-vert','decr','incr',1),S_('前臂長','lowerarm-scale-vert','decr','incr',1),S_('手臂粗細','upperarm-scale-horiz','decr','incr',1),
    S_('手臂肉感','upperarm-fat','decr','incr',1),S_('手臂肌肉','upperarm-muscle','decr','incr',1),S_('肩膀肌肉','upperarm-shoulder-muscle','decr','incr',1),
    S_('手掌大小','hand-scale','decr','incr',1),S_('手指長','hand-fingers-length','decr','incr',1)]},
  {label:'腿與腳',mods:[S_('大腿長','upperlegs-height','decr','incr'),S_('小腿長','lowerlegs-height','decr','incr'),S_('大腿粗細','upperleg-scale-horiz','decr','incr',1),
    S_('大腿肉感','upperleg-fat','decr','incr',1),S_('大腿肌肉','upperleg-muscle','decr','incr',1),S_('小腿肉感','lowerleg-fat','decr','incr',1),
    S_('小腿肌肉','lowerleg-muscle','decr','incr',1),S_('O 型 ↔ X 型腿','leg-valgus','decr','incr',1),S_('腳掌大小','foot-scale','decr','incr',1)]},
 ]},
 {id:'head',label:'臉型',groups:[
  {label:'臉型',shapes:true},
  {label:'',range:['shapeAmt','臉型強度',0,1,.01]},
  {label:'頭部',mods:[S_('頭寬','head-scale-horiz','decr','incr'),S_('頭長','head-scale-vert','decr','incr'),S_('頭深','head-scale-depth','decr','incr'),
    S_('臉部肉感','head-fat','decr','incr'),S_('額頭高度','forehead-scale-vert','decr','incr'),S_('額頭前後','forehead-trans','backward','forward'),S_('太陽穴','forehead-temple','decr','incr')]},
  {label:'下巴與下顎',mods:[S_('下巴寬','chin-width','decr','incr'),S_('下巴長','chin-height','decr','incr'),S_('下巴前突','chin-prominent','decr','incr'),
    S_('下顎骨','chin-bones','decr','incr'),S_('戽斗','chin-prognathism','decr','incr'),S_('下巴溝','chin-cleft','decr','incr')]},
  {label:'臉頰與脖子',mods:[S_('顴骨','cheek-bones','decr','incr',1),S_('臉頰飽滿','cheek-volume','decr','incr',1),S_('臉頰內凹','cheek-inner','decr','incr',1),
    S_('脖子粗細','neck-scale-horiz','decr','incr'),S_('雙下巴','neck-double','decr','incr')]},
 ]},
 {id:'eyes',label:'眼睛',groups:[
  {label:'眼型',mods:[S_('眼睛大小','eye-scale','decr','incr',1),S_('眼距','eye-trans','in','out',1),S_('高低','eye-trans','down','up',1),

  for(const g in G)for(const a in A){const w=G[g]*A[a]*ht[1];if(w)add(`height-${g}-${a}-${ht[0]}`,w);}

  for(let k=0;k<900;k++){const x=Math.random()*N|0,y=Math.random()*N|0;h[y*N+x]-=.35;} // pores
  const img=g.createImageData(N,N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const dx=(h[y*N+(x+1)%N]-h[y*N+(x-1+N)%N])*4,dy=(h[((y+1)%N)*N+x]-h[((y-1+N)%N)*N+x])*4;

   History + storage
   ===================================================================== */
const LS_CUR='face3d.v1.current',LS_SAVES='face3d.v1.saves';
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}};
function merge(o){const s=clone(DEFAULT);if(!o)return s;for(const k in s){if(o[k]===undefined)continue;if(s[k]&&typeof s[k]==='object')Object.assign(s[k],o[k]);else s[k]=o[k];}return s;}
state=merge(store.get(LS_CUR,null));
let last=JSON.stringify(state);const hist=[];
function commit(){const now=JSON.stringify(state);if(now!==last){hist.push(last);if(hist.length>80)hist.shift();last=now;}store.set(LS_CUR,state);$('#undo').disabled=!hist.length;}
function setState(s){state=s;invalidate(true);$('#name').value=state.name;syncPanel();}
function undo(){if(!hist.length)return;setState(JSON.parse(hist.pop()));last=JSON.stringify(state);store.set(LS_CUR,state);$('#undo').disabled=!hist.length;}

/* =====================================================================
   Panel UI
   ===================================================================== */
const tabsEl=$('#tabs'),content=$('#content');
let curTab=store.get('face3d.v1.tab','base');if(!TABS.find(t=>t.id===curTab))curTab='base';
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
let bound=[];
function buildTabs(){tabsEl.innerHTML='';for(const t of TABS){const b=el('button','tab',t.label);b.setAttribute('role','tab');b.setAttribute('aria-selected',t.id===curTab);
  b.onclick=()=>{curTab=t.id;store.set('face3d.v1.tab',curTab);buildTabs();buildPanel();const v=t.view==='body'?'body':(['base','expr'].includes(t.id)?null:'face');if(v&&v!==viewMode)setView(v);};tabsEl.append(b);}}
function rangeRow(label,min,max,step,get,set,fmt=v=>v){
  const r=el('label','range',`<span>${label}</span>`),inp=el('input'),out=el('output');
  Object.assign(inp,{type:'range',min,max,step});
  inp.oninput=()=>{set(+inp.value);out.textContent=fmt(+inp.value);invalidate();};
  inp.onchange=()=>commit();
  inp.ondblclick=()=>{set(Math.min(max,Math.max(min,0)));commit();syncPanel();invalidate();};
  r.append(inp,out);bound.push(()=>{inp.value=get();out.textContent=fmt(get());});return r;
}
function buildPanel(){
  const tab=TABS.find(t=>t.id===curTab);content.innerHTML='';bound=[];content.scrollTop=0;
  const head=el('div','phead');head.append(el('h2','',tab.label));
  const rb=el('button','btn','<span class="i">🎲</span><span>隨機這部分</span>');rb.onclick=()=>{randomTab(tab);commit();setState(state);};
  const zb=el('button','btn','歸零');zb.onclick=()=>{resetTab(tab);commit();setState(state);};
  const box=el('div','');box.style.display='flex';box.style.gap='6px';box.append(zb,rb);head.append(box);content.append(head);
  for(const g of tab.groups){
    if(g.label)content.append(el('div','glabel',g.label));
    if(g.macro)for(const [k,lb,mn,mx,st] of g.macro)
      content.append(rangeRow(lb,mn,mx,st,()=>state.macro[k],v=>state.macro[k]=v,v=>k==='age'?v+'歲':k==='gender'?(v<.35?'女':v>.65?'男':'中性'):Math.round(v*100)+'%'));
    if(g.mods)for(const m of g.mods){const id=modId(m);if(!MI.has((m.sym?'l-':'')+m.t+'-'+m.hi))continue;
      content.append(rangeRow(m.label,-1,1,.01,()=>state.mods[id]||0,v=>{if(v)state.mods[id]=v;else delete state.mods[id];},v=>(v>0?'+':'')+Math.round(v*100)));}
    if(g.range){const [k,lb,mn,mx,st]=g.range;
      if(k==='shapeAmt')content.append(rangeRow(lb,mn,mx,st,()=>state.shape.amt,v=>state.shape.amt=v,v=>Math.round(v*100)+'%'));
      else content.append(rangeRow(lb,mn,mx,st,()=>state[k],v=>{state[k]=v;},v=>Math.round(v*100)+'%'));}
    if(g.shapes){const w=el('div','chips');const cs=[];
      for(const [id,lb] of Object.entries(HEAD_SHAPES)){const b=el('button','chip',lb);b.onclick=()=>{state.shape.id=id;if(state.shape.amt<.2)state.shape.amt=.5;commit();invalidate();syncPanel();};w.append(b);cs.push([id,b]);}
      content.append(w);bound.push(()=>cs.forEach(([id,b])=>b.setAttribute('aria-pressed',state.shape.id===id)));}
    if(g.color){const k=g.color,w=el('div','sws');const sws=[];
      for(const c of g.colors){const b=el('button','sw');b.style.setProperty('--c',c);b.setAttribute('aria-label',c);b.onclick=()=>{state[k]=c;commit();invalidate(true);syncPanel();};w.append(b);sws.push([c,b]);}
      const cu=el('label','sw custom');cu.title='自訂顏色';const ci=el('input');ci.type='color';ci.oninput=()=>{state[k]=ci.value;dirtyColor=true;syncPanel();};ci.onchange=()=>commit();cu.append(ci);w.append(cu);
      content.append(w);bound.push(()=>{let hit=false;for(const [c,b] of sws){const on=c.toLowerCase()===state[k].toLowerCase();b.setAttribute('aria-pressed',on);hit||=on;}cu.setAttribute('aria-pressed',!hit);ci.value=state[k];});}
    if(g.skins){const w=el('div','chips');const cs=[];
      const opts=[['auto','自動（依年齡性別族裔）'],...meta.skins.map(x=>[x.id,skinLabel(x.id)])];
      for(const [id,lb] of opts){const b=el('button','chip',lb);b.onclick=()=>{state.skinTex=id;commit();invalidate();syncPanel();};w.append(b);cs.push([id,b]);}
      if(!meta.skins.length)w.append(el('p','note','（沒有皮膚貼圖素材）'));
      content.append(w);bound.push(()=>cs.forEach(([id,b])=>b.setAttribute('aria-pressed',state.skinTex===id)));}
    if(g.proxy){const k=g.proxy,key=PROXY_KEY[k],w=el('div','pgrid');const cs=[];
      const list=meta.proxies.filter(x=>x.kind===k);
      const opts=(g.none?[['', g.none,null]]:[]).concat(list.map(x=>[x.id,PROXY_LABEL[x.id]||x.id,x.tex.thumb]));
      for(const [id,lb,th] of opts){const b=el('button','pitem',(th?`<img src="data/${th}" alt="">`:'<span class="noimg">∅</span>')+`<span>${lb}</span>`);
        b.onclick=()=>{state[key]=id;commit();invalidate();syncPanel();};w.append(b);cs.push([id,b]);}
      content.append(w);bound.push(()=>cs.forEach(([id,b])=>b.setAttribute('aria-pressed',state[key]===id)));}
    if(g.cloth){const cat=g.cloth,list=CLOTH[cat]||[];
      if(!list.length&&!(cat==='outfit')){content.lastChild.remove();continue;}
      const w=el('div','pgrid');const cs=[];
      const opts=list.map(x=>[x.id,clothLabel(x),x.tex.thumb]);
      if(g.none)opts.unshift(['',g.none,null]);
      if(cat==='outfit'&&(CLOTH.top||[]).length&&(CLOTH.bottom||[]).length)opts.unshift(['','上衣＋下身',null]);
      for(const [id,lb,th] of opts){const b=el('button','pitem',(th?`<img src="data/${th}" alt="" loading="lazy">`:'<span class="noimg">∅</span>')+`<span>${lb}</span>`);
        b.onclick=()=>{state[cat]=id;if(cat==='outfit'&&id){state.top='';state.bottom='';}if((cat==='top'||cat==='bottom')&&id)state.outfit='';
          ensureCovered(state);commit();invalidate();syncPanel();};
        w.append(b);cs.push([id,b]);}
      content.append(w);bound.push(()=>cs.forEach(([id,b])=>b.setAttribute('aria-pressed',state[cat]===id)));
      if(['outfit','top','bottom','shoes','hat'].includes(cat)&&list.length){
        const cw=el('div','sws');cw.style.marginTop='8px';const sws=[];
        const o=el('button','sw auto','原色');o.onclick=()=>{(state.clothColors??={})[cat]='';commit();invalidate();syncPanel();};cw.append(o);sws.push(['',o]);
        for(const c of ['#1d1f24','#f2efe8','#7a1f2b','#c0392b','#e67e22','#f1c40f','#3d6b3a','#1f4e79','#5dade2','#6c3483','#d98fa6','#8d6e63'])
          {const b=el('button','sw');b.style.setProperty('--c',c);b.onclick=()=>{(state.clothColors??={})[cat]=c;commit();invalidate();syncPanel();};cw.append(b);sws.push([c,b]);}
        content.append(cw);bound.push(()=>{const cur=(state.clothColors||{})[cat]||'';sws.forEach(([c,b])=>b.setAttribute('aria-pressed',c===cur));});
      }
    }
    if(g.hairColor){const w=el('div','sws');const sws=[];
      const o=el('button','sw auto','原色');o.onclick=()=>{state.hairColor='';commit();invalidate();syncPanel();};w.append(o);sws.push(['',o]);
      for(const c of g.hairColor){const b=el('button','sw');b.style.setProperty('--c',c);b.onclick=()=>{state.hairColor=c;commit();invalidate();syncPanel();};w.append(b);sws.push([c,b]);}
      const cu=el('label','sw custom');const ci=el('input');ci.type='color';ci.oninput=()=>{state.hairColor=ci.value;invalidate();syncPanel();};ci.onchange=()=>commit();cu.append(ci);w.append(cu);
      content.append(w);bound.push(()=>{let hit=false;for(const [c,b] of sws){const on=c===state.hairColor;b.setAttribute('aria-pressed',on);hit||=on;}cu.setAttribute('aria-pressed',!hit);if(state.hairColor)ci.value=state.hairColor;});}
    if(g.expr){const w=el('div','chips');const cs=[];
      for(const [id,e] of Object.entries(EXPR)){const b=el('button','chip',e.label);b.onclick=()=>{state.expr=id;commit();invalidate();syncPanel();};w.append(b);cs.push([id,b]);}
      content.append(w);bound.push(()=>cs.forEach(([id,b])=>b.setAttribute('aria-pressed',state.expr===id)));}
    if(g.toggles){const w=el('div','chips');const cs=[];
      for(const [k,lb] of g.toggles){const b=el('button','chip',lb);b.onclick=()=>{state[k]=!state[k];commit();syncPanel();};w.append(b);cs.push([k,b]);}
      content.append(w);bound.push(()=>cs.forEach(([k,b])=>b.setAttribute('aria-pressed',!!state[k])));}
  }
  if(curTab==='base')content.append(el('p','note','人體網格、變形目標與眼睛素材來自 MakeHuman（CC0）。雙擊滑桿可以歸零。'));
  syncPanel();
}
function syncPanel(){for(const f of bound)f();}

/* ---------- random ---------- */
const rnd=(a,b)=>a+(b-a)*(Math.random()+Math.random())/2;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function resetTab(tab){
  for(const g of tab.groups){
    if(g.macro)for(const [k] of g.macro)state.macro[k]=DEFAULT.macro[k];
    if(g.mods)for(const m of g.mods)delete state.mods[modId(m)];
    if(g.shapes){state.shape=clone(DEFAULT.shape);}
    if(g.color)state[g.color]=DEFAULT[g.color];
    if(g.range){const k=g.range[0];if(k!=='shapeAmt')state[k]=DEFAULT[k];}
    if(g.expr)state.expr='neutral';
    if(g.skins)state.skinTex='auto';
    if(g.proxy)state[PROXY_KEY[g.proxy]]=DEFAULT[PROXY_KEY[g.proxy]];
    if(g.hairColor)state.hairColor='';
    if(g.cloth){state[g.cloth]=DEFAULT[g.cloth];if(state.clothColors)delete state.clothColors[g.cloth];}
  }
  ensureCovered(state);
}
function randomTab(tab){
  for(const g of tab.groups){
    if(g.macro)for(const [k,,mn,mx] of g.macro){
      if(k==='age')state.macro.age=Math.round(18+Math.random()*Math.random()*62);
      else if(k==='gender')state.macro.gender=Math.random()<.5?rnd(0,.25):rnd(.75,1);
      else if(k==='weight')state.macro.weight=rnd(.25,.75);
      else state.macro[k]=Math.random()<.6?Math.random()*.25:rnd(.4,1);
    }
    if(g.mods)for(const m of g.mods){const v=Math.random()<.55?+(rnd(-.7,.7)).toFixed(2):0;if(v)state.mods[modId(m)]=v;else delete state.mods[modId(m)];}
    if(g.shapes){state.shape.id=pick(Object.keys(HEAD_SHAPES));state.shape.amt=+rnd(.2,.8).toFixed(2);}
    if(g.color)state[g.color]=pick(g.colors);
    if(g.range&&g.range[0]==='blush')state.blush=+rnd(.1,.6).toFixed(2);
    if(g.expr)state.expr=pick(Object.keys(EXPR));
    if(g.proxy){const ids=meta.proxies.filter(x=>x.kind===g.proxy).map(x=>x.id);
      let id=pick(ids);
      if(g.proxy==='hair'){const fem=state.macro.gender<.5;const pool=ids.filter(x=>fem?!/short0[34]/.test(x):/short|afro/.test(x));id=Math.random()<.06?'':pick(pool.length?pool:ids);}
      state[PROXY_KEY[g.proxy]]=id;}
    if(g.hairColor)state.hairColor=Math.random()<.35?'':pick(g.hairColor.slice(0,8));
    if(g.cloth){const list=CLOTH[g.cloth]||[];if(!list.length)continue;
      const fem=state.macro.gender<.5,fit=list.filter(x=>{const t=(x.id+' '+(x.tags||[]).join(' ')).toLowerCase();return fem?!/\bmale|^male/.test(t)||/female/.test(t):!/female/.test(t);});
      const pool=fit.length?fit:list;
      if(g.cloth==='outfit'){const useSep=(CLOTH.top||[]).length&&(CLOTH.bottom||[]).length&&Math.random()<.5;state.outfit=useSep?'':pick(pool).id;}
      else if(g.cloth==='top'||g.cloth==='bottom'){state[g.cloth]=state.outfit?'':pick(pool).id;}
      else state[g.cloth]=Math.random()<(g.cloth==='shoes'?.9:.25)?pick(pool).id:'';
      if(state.clothColors)state.clothColors[g.cloth]=Math.random()<.4?pick(['#1d1f24','#f2efe8','#7a1f2b','#1f4e79','#3d6b3a','#8d6e63']):'';}
  }
  ensureCovered(state);
}
function randomAll(){for(const t of TABS)if(t.id!=='expr')randomTab(t);commit();setState(state);}

/* ---------- name / toast ---------- */
$('#name').value=state.name;
$('#name').addEventListener('input',e=>{state.name=e.target.value;store.set(LS_CUR,state);});
$('#name').addEventListener('change',()=>commit());
let tt=0;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- snapshot / gallery ---------- */
function snapshot(w,h,type='image/jpeg',q=.85){
  // render a portrait-framed image regardless of current window shape
  const oldSize=renderer.getSize(new THREE.Vector2()),oldPR=renderer.getPixelRatio(),oldAspect=camera.aspect;
  renderer.setPixelRatio(1);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.render(scene,camera);const url=canvas.toDataURL(type,q);
  renderer.setPixelRatio(oldPR);renderer.setSize(oldSize.x,oldSize.y,false);camera.aspect=oldAspect;camera.updateProjectionMatrix();renderer.render(scene,camera);
  return url;
}
function saveCurrent(){
  const list=store.get(LS_SAVES,[]);
  list.unshift({id:Date.now(),name:state.name||'無名',time:Date.now(),state:clone(state),img:snapshot(240,300,'image/jpeg',.8)});
  while(list.length>24)list.pop();
  let ok=store.set(LS_SAVES,list);
  while(!ok&&list.length>1){list.pop();ok=store.set(LS_SAVES,list);}
  toast(ok?`已存檔：${state.name||'無名'}`:'這個瀏覽器無法存檔');
}
function buildGallery(){
  const list=store.get(LS_SAVES,[]),grid=$('#galGrid');grid.innerHTML='';$('#galEmpty').style.display=list.length?'none':'';
  for(const it of list){
    const c=el('button','gcard'),d=new Date(it.time);
    c.innerHTML=`<img alt=""><b></b><small>${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</small>`;
    c.querySelector('img').src=it.img;c.querySelector('b').textContent=it.name;
    c.onclick=()=>{setState(merge(it.state));commit();$('#gal').close();toast(`載入：${it.name}`);};
    const del=el('span','gdel','✕');del.setAttribute('role','button');del.setAttribute('aria-label','刪除');
    del.onclick=e=>{e.stopPropagation();store.set(LS_SAVES,store.get(LS_SAVES,[]).filter(x=>x.id!==it.id));buildGallery();};
    c.append(del);grid.append(c);
  }
}
function download(){
  const url=snapshot(1200,1500,'image/png');
  const a=document.createElement('a');a.href=url;a.download=(state.name||'face')+'.png';document.body.append(a);a.click();a.remove();toast('截圖已下載');
}

$('#viewReset').onclick=resetView;
document.querySelectorAll('.vm').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('#undo').onclick=undo;$('#rand').onclick=randomAll;$('#save').onclick=saveCurrent;$('#dl').onclick=download;
$('#openGal').onclick=()=>{buildGallery();$('#gal').showModal();};$('#closeGal').onclick=()=>$('#gal').close();
$('#gal').addEventListener('click',e=>{if(e.target===$('#gal'))$('#gal').close();});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='r'||e.key==='R')randomAll();
});
$('#undo').disabled=true;
buildTabs();buildPanel();invalidate(true);
window.__face3d={get state(){return state},setState,commit,camera,controls,renderer,scene};
</script>
</body>
