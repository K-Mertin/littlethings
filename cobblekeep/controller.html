<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1d1626">
<title>Cobble Keep · Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Noto+Sans+TC:wght@500;700;800&display=swap">
<style>
  :root{--ink:#f3e7cf;--ink2:#c9b79a;--gold:#e8c172;--plum:#2a1f38;--bg:#140f1c;--head:"Cinzel","Noto Sans TC",Georgia,serif;--body:"Noto Sans TC","PingFang TC",system-ui,sans-serif;color-scheme:dark}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% 30%,#2e2240,#120d18 75%);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
  button{font:inherit;font-family:var(--head);font-weight:800;color:#2a1808;background:linear-gradient(180deg,#f8dc98,#e0a848 55%,#b8782a);border:0;border-radius:12px;padding:10px 18px;box-shadow:0 4px 0 #6a4214,0 8px 18px rgba(0,0,0,.35);cursor:pointer;touch-action:none}
  button.ghost{background:linear-gradient(180deg,rgba(58,44,76,.95),rgba(36,27,48,.95));color:var(--ink);border:1px solid rgba(232,193,114,.4);box-shadow:0 3px 0 rgba(0,0,0,.45)}
  button.on,button:active{transform:translateY(2px);filter:brightness(1.15)}
  /* top bar */
  #bar{position:fixed;left:0;right:0;top:0;height:calc(46px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(10,6,14,.9),rgba(10,6,14,.55));border-bottom:1px solid rgba(232,193,114,.25);z-index:5;box-sizing:border-box}
  #dot{width:10px;height:10px;border-radius:50%;background:#c0504a;box-shadow:0 0 8px #c0504a;flex:none}
  #dot.ok{background:#6fd06a;box-shadow:0 0 8px #6fd06a}
  #stat{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .hud{display:flex;gap:6px;align-items:center}
  .hud span{font-family:var(--head);font-weight:800;font-size:14px;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid rgba(232,193,114,.3);white-space:nowrap}
  .hud .hp{color:#ff8a8a}.hud .ar{color:#9fd4ff}.hud .am{color:var(--gold)}
  #bar button{padding:6px 10px;font-size:14px;border-radius:9px}
  /* play pad */
  #play{position:fixed;inset:0;top:calc(46px + env(safe-area-inset-top,0px))}
  #left{position:absolute;left:0;top:0;bottom:0;width:50%}
  #right{position:absolute;right:0;top:0;bottom:0;width:50%}
  #stick,#stickHome{position:absolute;width:var(--st);height:var(--st);border-radius:50%;margin:calc(var(--st)/-2) 0 0 calc(var(--st)/-2);pointer-events:none;box-sizing:border-box}
  :root{--st:clamp(120px,34vmin,190px)}
  #stickHome{left:calc(28px + var(--st)/2 + env(safe-area-inset-left,0px));top:62%;border:3px dashed rgba(232,193,114,.55);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--head);font-size:14px;color:var(--ink2);line-height:1.3}
  #stick{border:3px solid rgba(232,193,114,.8);background:rgba(20,14,28,.35);display:none}
  #knob{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:linear-gradient(180deg,#f8dc98,#c08a36);box-shadow:0 4px 10px rgba(0,0,0,.5)}
  #lookPad{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:13px;color:var(--ink2);pointer-events:none}
  #lookPad.off{opacity:0}
  .pb{position:absolute;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px}
  #bFire{width:clamp(96px,27vmin,150px);height:clamp(96px,27vmin,150px);right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));background:radial-gradient(circle at 50% 35%,#ea5a5a,#8c1830);color:#fff4dc;font-size:20px;box-shadow:0 5px 0 #4a0a18,0 10px 24px rgba(0,0,0,.45)}
  #bUse{width:clamp(64px,17vmin,94px);height:clamp(64px,17vmin,94px);right:calc(clamp(96px,27vmin,150px) + 40px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px))}
  #bSwap{width:clamp(58px,15vmin,84px);height:clamp(58px,15vmin,84px);right:calc(32px + env(safe-area-inset-right,0px));bottom:calc(clamp(96px,27vmin,150px) + 40px + env(safe-area-inset-bottom,0px))}
  #bTurn{width:clamp(54px,14vmin,78px);height:clamp(54px,14vmin,78px);right:calc(clamp(96px,27vmin,150px) + 46px + env(safe-area-inset-right,0px));bottom:calc(clamp(64px,17vmin,94px) + 44px + env(safe-area-inset-bottom,0px));font-size:13px}
  #weap{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:5px}
  #weap i{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--head);font-weight:800;font-size:13px;background:rgba(0,0,0,.4);color:#6a5a74;border:1px solid rgba(232,193,114,.2)}
  #weap i.have{color:var(--ink)}#weap i.cur{background:linear-gradient(180deg,#f2cf82,#c08a36);color:#2a1808}
  #title{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:12px;color:var(--ink2);white-space:nowrap;pointer-events:none}
  /* menu pad */
  #menu{position:fixed;inset:0;top:calc(46px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-around;gap:20px;padding:12px calc(16px + env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));box-sizing:border-box}
  .dpad{display:grid;grid-template-columns:repeat(3,var(--d));grid-template-rows:repeat(3,var(--d));gap:6px;--d:clamp(58px,17vmin,86px)}
  .dpad button{padding:0;font-size:24px;border-radius:14px}
  .dpad .u{grid-area:1/2}.dpad .l{grid-area:2/1}.dpad .r{grid-area:2/3}.dpad .d{grid-area:3/2}
  .acts{display:flex;flex-direction:column;gap:14px;align-items:center}
  #mOk{width:clamp(110px,30vmin,160px);height:clamp(110px,30vmin,160px);border-radius:50%;font-size:24px}
  #mBack{min-width:120px}
  #mHint{font-size:13px;color:var(--ink2);text-align:center;max-width:22em}
  /* join + settings sheets */
  .sheet{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,6,14,.72)}
  .box{width:min(460px,100%);max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(180deg,rgba(42,31,56,.98),rgba(24,18,32,.98));border:1.5px solid rgba(232,193,114,.65);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center}
  .box h1{margin:0;font-family:var(--head);font-size:26px;background:linear-gradient(180deg,#fff2c4,#e0a848);-webkit-background-clip:text;background-clip:text;color:transparent}
  .box p{margin:0;color:var(--ink2);font-size:14px}
  .box input{font:inherit;font-family:var(--head);font-size:26px;letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:8px;border-radius:10px;border:1.5px solid rgba(232,193,114,.6);background:#140f1c;color:var(--ink);-webkit-user-select:text;user-select:text}
  .opts{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;text-align:left;font-size:15px}
  .seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .seg button{font-size:13px;padding:6px 10px;border-radius:9px}
  .opts small{display:block;color:var(--ink2);font-size:12px}
  #rot{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#120d18;font-family:var(--head);font-size:20px;line-height:1.6}
  @media (orientation:portrait) and (max-width:600px){#rot{display:flex}}
</style>

<div id="bar"><i id="dot"></i><span id="stat"></span><span class="hud" id="hud" hidden><span class="hp" id="hHp">100</span><span class="ar" id="hAr">0</span><span class="am" id="hAm">∞</span></span>
  <button type="button" class="ghost" id="bMap">🗺</button><button type="button" class="ghost" id="bPause">II</button><button type="button" class="ghost" id="bSet">⚙</button></div>

<div id="play" hidden>
  <div id="left"><div id="stickHome"></div><div id="stick"><div id="knob"></div></div></div>
  <div id="right"><div id="lookPad"></div></div>
  <span id="title"></span>
  <button type="button" class="pb" id="bFire" data-b="fire"></button>
  <button type="button" class="pb ghost" id="bUse" data-b="0"></button>
  <button type="button" class="pb ghost" id="bSwap" data-b="1"></button>
  <button type="button" class="pb ghost" id="bTurn" data-b="2">180°</button>
  <div id="weap"><i>1</i><i>2</i><i>3</i><i>4</i></div>
</div>

<div id="menu" hidden>
  <div class="dpad"><button type="button" class="u ghost" data-n="up">▲</button><button type="button" class="l ghost" data-n="left">◀</button><button type="button" class="r ghost" data-n="right">▶</button><button type="button" class="d ghost" data-n="down">▼</button></div>
  <div class="acts"><button type="button" id="mOk">OK</button><button type="button" class="ghost" id="mBack"></button><p id="mHint"></p></div>
</div>

<div class="sheet" id="join" hidden><div class="box"><h1>Cobble Keep</h1><p id="jHow"></p><input id="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="button" id="jGo"></button><p id="jErr"></p></div></div>

<div class="sheet" id="sets" hidden><div class="box"><h1 id="sTitle"></h1><div class="opts" id="opts"></div><button type="button" id="sDone">OK</button></div></div>
<div id="rot"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), LOCAL = Q.get('net') === 'local';
let ROOM = (Q.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
const store = { get(k, d) { try { const v = localStorage.getItem('cobblekeep.pad.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('cobblekeep.pad.' + k, JSON.stringify(v)); } catch (e) { } } };
let LANG = store.get('lang', /^zh/i.test(navigator.language || '') ? 'zh' : 'en');
const SET = Object.assign({ drag: true, dragSens: 1, gyro: false, gyroSens: 1, vib: true, auto: true }, store.get('set', {}));
const T = {
  zh: { conn: '連線中…', ok: '已連上遊戲', lost: '斷線了，重新連線中…', closed: '大螢幕關掉了房間', replaced: '另一支手機接手了', noRoom: '找不到這個房間', fire: '攻擊', use: '使用', swap: '換武器', walk: '移動', drag: '在這半邊拖曳轉向', dragOff: '拖曳轉向已關閉', how: '輸入大螢幕上的 5 碼房號', join: '加入', back: '返回', skip: '略過', hintMenu: '用方向鍵選，OK 確定', hintStory: 'OK 下一頁', set: '手把設定',
    oDrag: '拖曳瞄準', oDragS: '在右半邊拖曳轉向', oDragSp: '拖曳靈敏度', oGyro: '陀螺儀瞄準', oGyroS: '左右轉動手機來瞄準', oGyroSp: '陀螺儀靈敏度', oVib: '震動', oVibS: '受傷時震動（iPhone 不支援）', oAuto: '自動攻擊', oAutoS: '準心對到敵人時自動出手', oLang: '語言', slow: '慢', mid: '普通', fast: '快', on: '開', off: '關', gyroNo: '這支手機不能用陀螺儀', rot: '請把手機橫過來 ↻' },
  en: { conn: 'Connecting…', ok: 'Connected to the game', lost: 'Connection lost, reconnecting…', closed: 'The big screen closed the room', replaced: 'Another phone took over', noRoom: 'Room not found', fire: 'ATTACK', use: 'USE', swap: 'SWAP', walk: 'MOVE', drag: 'Drag on this half to turn', dragOff: 'Drag to turn is off', how: 'Type the 5-letter room code from the big screen', join: 'Join', back: 'Back', skip: 'Skip', hintMenu: 'Use the arrows to choose, OK to confirm', hintStory: 'OK for the next page', set: 'Controller settings',
    oDrag: 'Drag aim', oDragS: 'Drag on the right half to turn', oDragSp: 'Drag speed', oGyro: 'Gyro aim', oGyroS: 'Turn the phone left and right to aim', oGyroSp: 'Gyro speed', oVib: 'Vibration', oVibS: 'Buzz when you get hurt (not on iPhone)', oAuto: 'Auto-attack', oAutoS: 'Attacks when the crosshair is on a foe', oLang: 'Language', slow: 'Slow', mid: 'Normal', fast: 'Fast', on: 'On', off: 'Off', gyroNo: 'This phone has no gyro', rot: 'Turn your phone sideways ↻' },
};
const t = k => (T[LANG] || T.en)[k] || k;
let cid = null; try { cid = sessionStorage.getItem('cobblekeep.pad.cid'); } catch (e) { }
if (!cid) { cid = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('cobblekeep.pad.cid', cid); } catch (e) { } }
const vib = ms => { if (!SET.vib) return; try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };
let mode = 'wait';
function status(s, ok) { $('stat').textContent = s; $('dot').classList.toggle('ok', !!ok); }

/* ---------------- connection ---------------- */
const Net = {
  peer: null, conn: null, bc: null, ok: false, me: null,
  send(d) { if (this.bc) this.bc.postMessage({ to: 'host', from: this.me, d }); else if (this.conn && this.conn.open) try { this.conn.send(d); } catch (e) { } },
  hello() { this.send({ t: 'hello', cid, c: st.c.slice() }); },
  start() {
    status(t('conn'));
    if (LOCAL) {
      this.me = cid + '-' + Math.random().toString(36).slice(2, 6); this.bc = new BroadcastChannel('cobblekeep-' + ROOM);
      this.bc.onmessage = e => { const m = e.data; if (m.to === this.me || m.to === '*') this.onData(m.d); };
      this.hello(); return;
    }
    const go = () => {
      if (typeof Peer === 'undefined') return setTimeout(go, 200);
      this.peer = new Peer({ debug: 0 });
      this.peer.on('open', () => this.connect());
      this.peer.on('error', e => { if (e && e.type === 'peer-unavailable') { status(t('noRoom')); $('jErr').textContent = t('noRoom'); setTimeout(() => this.connect(), 3000); } else { status(t('lost')); setTimeout(() => this.peer && this.connect(), 2500); } });
      this.peer.on('disconnected', () => setTimeout(() => this.peer && !this.peer.destroyed && this.peer.reconnect(), 1000));
    };
    go();
  },
  connect() {
    if (!this.peer || this.peer.destroyed) return;
    const c = this.conn = this.peer.connect('cobblekeep-' + ROOM, { reliable: true });
    c.on('open', () => { if (this.conn === c) this.hello(); });
    c.on('data', d => this.onData(d));
    c.on('close', () => { if (this.conn !== c || !this.peer) return; this.ok = false; status(t('lost')); setTimeout(() => this.connect(), 1500); });
  },
  onData(d) {
    if (!d || !d.t) return;
    if (d.t === 'welcome') { this.ok = true; status(t('ok'), true); $('join').hidden = true; vib(20); }
    else if (d.t === 'who') this.hello();
    else if (d.t === 'st') onState(d);
    else if (d.t === 'buzz') vib(d.ms || 60);
    else if (d.t === 'closed') { this.ok = false; status(t('closed')); setMode('wait'); }
    else if (d.t === 'replaced') { this.ok = false; status(t('replaced')); setMode('wait'); }
  },
};
setInterval(() => { if (Net.ok && mode !== 'play') Net.send({ t: 'ping' }); }, 1500);
addEventListener('pagehide', () => Net.send({ t: 'bye' }));

/* ---------------- state from the game ---------------- */
function onState(s) {
  if (s.lang && s.lang !== LANG) { LANG = s.lang; store.set('lang', LANG); labels(); }
  setMode(s.mode);
  $('hud').hidden = s.mode !== 'play';
  $('hHp').textContent = '❤ ' + s.hp; $('hAr').textContent = '🛡 ' + s.ar; $('hAm').textContent = (s.ammo < 0 ? '∞' : s.ammo) + ' ' + s.ammoL;
  $('title').textContent = s.title || '';
  [...$('weap').children].forEach((el, i) => { el.className = (s.has[i] ? 'have' : '') + (s.w === i ? ' cur' : ''); });
  if (prevHp !== null && s.hp < prevHp) vib(s.hp <= 0 ? 300 : 70);
  prevHp = s.hp;
}
let prevHp = null;
function setMode(m) {
  if (m === mode) return; mode = m;
  $('play').hidden = m !== 'play'; $('menu').hidden = !(m === 'menu' || m === 'story');
  $('mHint').textContent = t(m === 'story' ? 'hintStory' : 'hintMenu'); $('mBack').textContent = t(m === 'story' ? 'skip' : 'back');
  releaseAll();
}

/* ---------------- play controls ---------------- */
// held state plus running press counters (0 use, 1 swap, 2 turn, 3 map, 4 pause): a lost or merged message never loses a press
const st = { mx: 0, my: 0, f: false, look: 0, auto: true, c: [0, 0, 0, 0, 0] };
let dirty = false;
function press(k) { st.c[k]++; dirty = true; vib(12); }
const STICK = $('stick'), KNOB = $('knob'); let stickId = null, sx = 0, sy = 0, lookId = null, lx = 0, fireId = null;
const R = () => STICK.offsetWidth * .36 || 50;
function releaseAll() { stickId = lookId = fireId = null; st.mx = st.my = 0; st.f = false; STICK.style.display = 'none'; $('stickHome').hidden = false; document.querySelectorAll('.on').forEach(b => b.classList.remove('on')); dirty = true; }
$('play').addEventListener('touchstart', e => {
  e.preventDefault();
  for (const tc of e.changedTouches) {
    const b = tc.target.closest && tc.target.closest('[data-b]');
    if (b) { b.classList.add('on'); if (b.dataset.b === 'fire') { fireId = tc.identifier; lx = tc.clientX; st.f = true; dirty = true; vib(10); } else press(+b.dataset.b); continue; }
    if (tc.clientX < innerWidth / 2 && stickId === null) { stickId = tc.identifier; sx = tc.clientX; sy = tc.clientY; STICK.style.left = sx + 'px'; STICK.style.top = (sy - $('play').getBoundingClientRect().top) + 'px'; STICK.style.display = 'block'; KNOB.style.transform = ''; $('stickHome').hidden = true; }
    else if (lookId === null) { lookId = tc.identifier; lx = tc.clientX; }
  }
}, { passive: false });
$('play').addEventListener('touchmove', e => {
  e.preventDefault();
  for (const tc of e.changedTouches) {
    if (tc.identifier === stickId) {
      let dx = tc.clientX - sx, dy = tc.clientY - sy; const m = Math.hypot(dx, dy), r = R(); if (m > r) { dx *= r / m; dy *= r / m; }
      KNOB.style.transform = `translate(${dx}px,${dy}px)`; const mag = Math.min(1, m / r), dz = mag < .15 ? 0 : (mag - .15) / .85;
      st.mx = m ? dx / Math.min(m, r) * dz : 0; st.my = m ? dy / Math.min(m, r) * dz : 0; dirty = true;
    } else if ((tc.identifier === lookId || tc.identifier === fireId) && SET.drag) {
      st.look += (tc.clientX - lx) * Math.PI / (innerWidth * .5) * SET.dragSens; lx = tc.clientX; dirty = true;
    }
  }
}, { passive: false });
function tEnd(e) {
  for (const tc of e.changedTouches) {
    if (tc.identifier === stickId) { stickId = null; st.mx = st.my = 0; STICK.style.display = 'none'; $('stickHome').hidden = false; dirty = true; }
    if (tc.identifier === lookId) lookId = null;
    if (tc.identifier === fireId) { fireId = null; st.f = false; dirty = true; }
    const b = tc.target.closest && tc.target.closest('[data-b]'); if (b) b.classList.remove('on');
  }
}
$('play').addEventListener('touchend', tEnd); $('play').addEventListener('touchcancel', tEnd);
// mouse fallback (testing on a computer)
document.querySelectorAll('#play [data-b]').forEach(b => { b.addEventListener('mousedown', () => { if (b.dataset.b === 'fire') { st.f = true; dirty = true; } else press(+b.dataset.b); }); b.addEventListener('mouseup', () => { if (b.dataset.b === 'fire') { st.f = false; dirty = true; } }); });
$('bMap').onclick = () => press(3); $('bPause').onclick = () => { if (mode === 'play') press(4); else { Net.send({ t: 'back' }); vib(12); } };

/* ---------------- gyro aim ---------------- */
// turning the phone around the world's vertical axis turns the hero; gravity tells us which way is up
let up = null, gyroOn = false;
function onMotion(e) {
  const g = e.accelerationIncludingGravity, r = e.rotationRate; if (!g || !r) return;
  const n = Math.hypot(g.x, g.y, g.z) || 1, u = [g.x / n, g.y / n, g.z / n];
  up = up ? up.map((v, i) => v * .9 + u[i] * .1) : u;
  if (!SET.gyro || mode !== 'play') return;
  const yaw = (r.beta || 0) * up[0] + (r.gamma || 0) * up[1] + (r.alpha || 0) * up[2];   // deg/s about "up"
  const dt = Math.min(.1, (e.interval > 1 ? e.interval / 1000 : e.interval) || .016);
  if (Math.abs(yaw) > 1.2) { st.look -= yaw * Math.PI / 180 * dt * 1.6 * SET.gyroSens; dirty = true; }
}
async function enableGyro() {
  try { if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) { const p = await DeviceMotionEvent.requestPermission(); if (p !== 'granted') throw 0; } } catch (e) { SET.gyro = false; return false; }
  if (typeof DeviceMotionEvent === 'undefined') { SET.gyro = false; return false; }
  if (!gyroOn) { addEventListener('devicemotion', onMotion); gyroOn = true; } return true;
}
if (SET.gyro) addEventListener('touchend', function once() { enableGyro(); removeEventListener('touchend', once); });

/* ---------------- sending ---------------- */
function flush() { if (!Net.ok || mode !== 'play') return; st.auto = SET.auto; Net.send({ t: 'in', ...st }); st.look = 0; dirty = false; }
setInterval(() => { if (dirty) flush(); }, 33);
setInterval(() => { if (Net.ok && mode === 'play') flush(); }, 500);   // keep-alive with the held state

/* ---------------- menus ---------------- */
document.querySelectorAll('[data-n]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); Net.send({ t: 'nav', dir: b.dataset.n }); vib(8); }));
$('mOk').addEventListener('pointerdown', e => { e.preventDefault(); Net.send({ t: 'ok' }); vib(14); });
$('mBack').addEventListener('pointerdown', e => { e.preventDefault(); Net.send({ t: 'back' }); vib(10); });

/* ---------------- settings ---------------- */
function seg(k, opts) { return `<div class="seg">${opts.map(([v, l]) => `<button type="button" class="${SET[k] === v ? '' : 'ghost'}" data-k="${k}" data-v='${JSON.stringify(v)}'>${l}</button>`).join('')}</div>`; }
function renderSets() {
  $('sTitle').textContent = t('set');
  $('opts').innerHTML = `<span>${t('oDrag')}<small>${t('oDragS')}</small></span>${seg('drag', [[true, t('on')], [false, t('off')]])}
    <span>${t('oDragSp')}</span>${seg('dragSens', [[.6, t('slow')], [1, t('mid')], [1.6, t('fast')]])}
    <span>${t('oGyro')}<small>${t('oGyroS')}</small></span>${seg('gyro', [[true, t('on')], [false, t('off')]])}
    <span>${t('oGyroSp')}</span>${seg('gyroSens', [[.6, t('slow')], [1, t('mid')], [1.6, t('fast')]])}
    <span>${t('oAuto')}<small>${t('oAutoS')}</small></span>${seg('auto', [[true, t('on')], [false, t('off')]])}
    <span>${t('oVib')}<small>${t('oVibS')}</small></span>${seg('vib', [[true, t('on')], [false, t('off')]])}
    <span>${t('oLang')}</span><div class="seg"><button type="button" class="${LANG === 'zh' ? '' : 'ghost'}" data-lang="zh">中文</button><button type="button" class="${LANG === 'en' ? '' : 'ghost'}" data-lang="en">EN</button></div>`;
  $('opts').querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
    const k = b.dataset.k, v = JSON.parse(b.dataset.v); SET[k] = v;
    if (k === 'gyro' && v && !(await enableGyro())) { alertGyro(); }
    store.set('set', SET); renderSets(); labels(); vib(10);
  });
  $('opts').querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { LANG = b.dataset.lang; store.set('lang', LANG); renderSets(); labels(); });
}
function alertGyro() { SET.gyro = false; $('sTitle').textContent = t('gyroNo'); }
$('bSet').onclick = () => { renderSets(); $('sets').hidden = false; };
$('sDone').onclick = () => { $('sets').hidden = true; };

/* ---------------- labels, join, start ---------------- */
function labels() {
  document.documentElement.lang = LANG === 'zh' ? 'zh-Hant' : 'en';
  $('bFire').textContent = t('fire'); $('bUse').textContent = t('use'); $('bSwap').textContent = t('swap');
  $('stickHome').textContent = t('walk'); $('lookPad').textContent = SET.drag ? t('drag') : t('dragOff');
  $('jHow').textContent = t('how'); $('jGo').textContent = t('join'); $('rot').textContent = t('rot');
  $('mHint').textContent = t(mode === 'story' ? 'hintStory' : 'hintMenu'); $('mBack').textContent = t(mode === 'story' ? 'skip' : 'back');
}
labels(); setMode('menu'); setMode('wait');
$('jGo').onclick = () => { const v = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (v.length !== 5) return; ROOM = v; history.replaceState(null, '', '?room=' + v + (LOCAL ? '&net=local' : '')); Net.start(); };
if (ROOM.length === 5) { $('join').hidden = true; Net.start(); } else { $('join').hidden = false; status(t('how')); }
// keep the phone awake while it is a controller
let lock = null; async function wake() { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) { } }
addEventListener('touchend', wake); document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); if (Net.ok) Net.hello(); } });
window.PAD = { st, get mode() { return mode; }, get ok() { return Net.ok; }, SET, press };
</script>
</html>
