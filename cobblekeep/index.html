<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Cobble Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap">
<style>
  :root{
    color-scheme: dark;
    --stone:#141211; --stone-2:#23201d; --line:#3a3530;
    --parch:#ecdfc2; --dim:#9c907a; --torch:#f2a93b; --lava:#ff5b1f; --moss:#7fa04a;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:var(--stone);color:var(--parch);overflow:hidden}
  body{font-family:"Silkscreen",ui-monospace,Menlo,Consolas,monospace}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--stone)}
  #game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#000;cursor:crosshair;max-width:100%}
  #ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,rgba(20,14,10,.55),rgba(8,6,5,.92))}
  .card{max-width:560px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--torch);text-transform:uppercase}
  h1{margin:0;font-weight:700;font-size:clamp(34px,8vw,64px);line-height:1;letter-spacing:.02em;color:var(--parch);
     text-shadow:4px 4px 0 #5a2a10,8px 8px 0 rgba(0,0,0,.6);text-wrap:balance}
  .sub{margin:0;font-size:14px;color:var(--dim)}
  button{font:inherit;font-size:16px;letter-spacing:.08em;color:#1a0e06;background:var(--torch);border:0;padding:12px 22px;cursor:pointer;
         box-shadow:0 4px 0 #8a4f12,0 8px 0 rgba(0,0,0,.5)}
  button:hover{background:#ffc15c}
  button:focus-visible{outline:3px solid var(--parch);outline-offset:3px}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a4f12}
  .keys{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:11px;color:var(--dim);text-align:left;margin-top:6px}
  .keys b{color:var(--parch);font-weight:400}
  .stats{display:grid;grid-template-columns:auto auto;gap:6px 24px;font-size:14px;text-align:left;font-variant-numeric:tabular-nums}
  .stats span:nth-child(odd){color:var(--dim)}
  .hall{position:absolute;top:16px;left:16px;font-size:12px;letter-spacing:.08em;color:var(--dim);text-decoration:none;padding:6px 10px;border:1px solid var(--line);background:rgba(0,0,0,.35)}
  .hall:hover,.hall:focus-visible{color:var(--parch);border-color:var(--torch);outline:none}
  .note{font-size:10px;color:var(--dim);max-width:44ch}
</style>

<div id="wrap">
  <canvas id="game" width="400" height="225"></canvas>
  <div id="ov">
    <a class="hall" href="../index.html">&larr; Game Hall</a>
    <div class="card" id="card">
      <div class="eyebrow">Level 1 · The Undercroft</div>
      <h1>Cobble Keep</h1>
      <p class="sub">Find the red key. Throw the exit switch.</p>
      <button id="btn" type="button">Click to play</button>
      <div class="keys">
        <b>WASD</b><span>move · Shift run</span>
        <b>Mouse</b><span>look · click to fire</span>
        <b>E / Space</b><span>open doors, use switch</span>
        <b>1 2 3</b><span>pickaxe · blaster · scattergun</span>
        <b>Tab / M</b><span>map</span>
        <b>Arrows</b><span>turn without a mouse</span>
      </div>
      <p class="note">Some walls are not what they seem.</p>
    </div>
  </div>
</div>

<script>
'use strict';
/* ================= CORE SETUP ================= */
const W = 400, H = 225, VH = 192, HALF = VH / 2, TS = 16;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(W, VH);
const buf = new Uint32Array(img.data.buffer);
const zbuf = new Float32Array(W);

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const k = s >= 2 ? Math.floor(s) : s; // integer scale when big enough
  cv.style.width = Math.floor(W * k) + 'px';
  cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit); fit();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rgb = (r, g, b, a = 255) => ((a << 24) | (clamp(b | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(r | 0, 0, 255)) >>> 0;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a);

/* ================= TEXTURES (16x16, procedural) ================= */
const TX = {};
function build(name, seed, maker) {
  const R = rng(seed), px = maker(R), t = new Uint32Array(256);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const c = px(x, y); t[y * 16 + x] = rgb(c[0], c[1], c[2], c[3] ?? 255); }
  TX[name] = t; return t;
}
const nz = (R, a) => (R() * 2 - 1) * a;
function voronoi(R, count) {
  const pts = []; for (let i = 0; i < count; i++) pts.push([R() * 16, R() * 16, R()]);
  return (x, y) => {
    let d1 = 1e9, d2 = 1e9, cell = pts[0];
    for (const p of pts) for (const ox of [-16, 0, 16]) for (const oy of [-16, 0, 16]) {
      const d = Math.hypot(x + .5 - p[0] - ox, y + .5 - p[1] - oy);
      if (d < d1) { d2 = d1; d1 = d; cell = p; } else if (d < d2) d2 = d;
    }
    return { edge: d2 - d1, cell, d1 };
  };
}
build('stone', 11, R => (x, y) => { let v = 122 + nz(R, 12); if (R() < .07) v -= 28; return [v, v, v + 3]; });
build('cobble', 12, R => { const v = voronoi(R, 9); return (x, y) => { const o = v(x, y); if (o.edge < 1.0) { const d = 52 + nz(R, 8); return [d, d, d]; } let b = 92 + o.cell[2] * 60 + nz(R, 9) - o.d1 * 3; return [b, b, b + 2]; }; });
build('mossy', 13, R => { const v = voronoi(R, 9); return (x, y) => { const o = v(x, y); const moss = Math.sin(x * .8 + 1) + Math.cos(y * .7) + nz(R, .9) > .7; if (o.edge < 1.0) { const d = 48 + nz(R, 8); return moss ? [40, 62, 26] : [d, d, d]; } let b = 88 + o.cell[2] * 55 + nz(R, 9) - o.d1 * 3; return moss ? [70 + nz(R, 12), 104 + nz(R, 14), 42 + nz(R, 8)] : [b, b, b + 2]; }; });
build('bricks', 14, R => { const shade = []; for (let i = 0; i < 16; i++) shade.push(nz(R, 22)); return (x, y) => { const row = y >> 2, off = (row & 1) * 4; if (y % 4 === 3 || (x + off) % 8 === 7) { const m = 150 + nz(R, 10); return [m, m - 4, m - 12]; } const s = shade[(row * 2 + (((x + off) >> 3) & 1)) & 15]; return [146 + s + nz(R, 10), 66 + s * .5 + nz(R, 6), 52 + nz(R, 6)]; }; });
function plankMaker(base, dark) { return R => { const sh = []; for (let i = 0; i < 4; i++) sh.push(nz(R, 14)); return (x, y) => { const row = y >> 2; if (y % 4 === 3) return [dark[0], dark[1], dark[2]]; if (x === (row * 5 + 3) % 16) return [dark[0] + 10, dark[1] + 8, dark[2] + 4]; const g = sh[row] + nz(R, 8) + ((x + row * 3) % 5 === 0 ? -10 : 0); return [base[0] + g, base[1] + g * .8, base[2] + g * .5]; }; }; }
build('planks', 15, plankMaker([162, 126, 76], [86, 62, 36]));
build('floorPlanks', 16, plankMaker([140, 104, 60], [70, 50, 28]));
build('ceilPlanks', 17, plankMaker([88, 66, 40], [40, 28, 16]));
build('bookshelf', 18, R => { const cols = [[150, 40, 36], [48, 76, 150], [60, 120, 56], [170, 140, 50], [110, 50, 120], [60, 60, 60], [160, 90, 40]]; const book = []; for (let i = 0; i < 32; i++) book.push(cols[(R() * cols.length) | 0]); const pl = plankMaker([160, 124, 74], [84, 60, 34])(R); return (x, y) => { if (y < 2 || y > 13 || y === 7 || y === 8) return pl(x, y); const shelf = y < 7 ? 0 : 16; const bi = shelf + (x >> 1); const top = (y < 7 ? 2 : 9) + ((bi * 7) % 3 === 0 ? 1 : 0); if (x % 2 === 1 && (bi % 3 === 0)) return [34, 24, 14]; if (y < top) return [34, 24, 14]; const c = book[bi]; const hl = (y === top + 1) ? 30 : 0; return [c[0] + hl + nz(R, 6), c[1] + hl + nz(R, 6), c[2] + hl + nz(R, 6)]; }; });
build('door', 19, R => (x, y) => { if (x === 0 || x === 15 || y === 0 || y === 15) return [52, 38, 24]; if (((x === 1 || x === 2 || x === 3) && (y === 3 || y === 4 || y === 11 || y === 12))) return [120 + nz(R, 10), 120, 126]; if (x === 12 && (y === 7 || y === 8)) return [150, 150, 160]; const g = nz(R, 9) + (x % 4 === 3 ? -40 : 0); return [150 + g, 108 + g * .8, 62 + g * .5]; });
build('reddoor', 20, R => { const d = TX.door; return (x, y) => { const inB = x >= 1 && x <= 14 && y >= 1 && y <= 14; if (inB && (x === 1 || x === 14 || y === 1 || y === 14)) return [190 + nz(R, 14), 30, 26]; if (x >= 6 && x <= 9 && y >= 5 && y <= 10) { if ((x === 7 || x === 8) && (y === 7 || y === 8)) return [40, 10, 8]; return [210 + nz(R, 12), 40, 30]; } const c = d[y * 16 + x]; return [c & 255, c >> 8 & 255, c >> 16 & 255]; }; });
build('obsidian', 21, R => (x, y) => { if (R() < .1) return [70 + nz(R, 12), 36, 104 + nz(R, 14)]; const v = 20 + nz(R, 8); return [v + 4, v, v + 16]; });
function exitTex(on) { return R => (x, y) => { if (x === 0 || x === 15 || y === 0 || y === 15) return [110, 84, 20]; if (x >= 4 && x <= 11 && y >= 3 && y <= 12) { if (x >= 6 && x <= 9 && y >= 5 && y <= 10) return on ? [70, 240, 110, 254] : [230, 40, 30, 254]; if (x === 4 || x === 11 || y === 3 || y === 12) return [40, 36, 30]; return [70, 66, 60]; } const g = nz(R, 16); return [226 + g, 184 + g, 52 + g * .5]; }; }
build('exitOff', 22, exitTex(false));
build('exitOn', 22, exitTex(true));
build('leaves', 23, R => (x, y) => { if (R() < .22) return [22 + nz(R, 6), 56 + nz(R, 10), 18]; return [52 + nz(R, 14), 112 + nz(R, 20), 36 + nz(R, 8)]; });
build('lava', 24, R => (x, y) => { const s = Math.sin(x * .9 + y * .4) + Math.cos(y * 1.1 - x * .3) + nz(R, .6); if (s > 1.1) return [255, 214, 90, 254]; if (s > .2) return [245, 120 + nz(R, 20), 24, 254]; return [196, 60 + nz(R, 14), 16, 254]; });
build('grass', 25, R => (x, y) => { const v = nz(R, 16); if (R() < .08) return [104 + v, 164 + v, 64]; return [74 + v, 128 + v, 44 + v * .5]; });
build('stoneFloor', 26, R => (x, y) => { if (x % 8 === 0 || y % 8 === 0) { const m = 78 + nz(R, 6); return [m, m, m]; } const tile = ((x >> 3) + (y >> 3) * 2); const v = 116 + tile * 3 + nz(R, 10); return [v, v - 2, v - 4]; });
build('ceilStone', 27, R => (x, y) => { const v = 58 + nz(R, 8) + (R() < .08 ? -14 : 0); return [v, v, v + 4]; });
build('ceilBrick', 28, R => (x, y) => { const row = y >> 2, off = (row & 1) * 4; if (y % 4 === 3 || (x + off) % 8 === 7) return [44, 40, 38]; return [80 + nz(R, 8), 40 + nz(R, 5), 34]; });

// Sky: wraps 360 degrees
const SKYW = 1024, SKYH = HALF;
const sky = new Uint32Array(SKYW * SKYH);
(function () {
  const R = rng(99), cells = new Float32Array(128 * 24);
  for (let i = 0; i < cells.length; i++) cells[i] = R();
  const cl = (cx, cy) => cells[((cy + 24) % 24) * 128 + ((cx + 128) % 128)];
  for (let y = 0; y < SKYH; y++) for (let x = 0; x < SKYW; x++) {
    const t = y / SKYH;
    let r = 84 + t * 80, g = 128 + t * 70, b = 214 + t * 26;
    const cx = x >> 3, cy = y >> 2;
    if (cy < 16) {
      const c = cl(cx, cy) * .5 + (cl(cx - 1, cy) + cl(cx + 1, cy) + cl(cx, cy - 1) + cl(cx, cy + 1)) * .125;
      if (c > .64) { const w = c > .72 ? 245 : 222; r = w; g = w; b = w + 8; }
    }
    sky[y * SKYW + x] = rgb(r, g, b);
  }
})();

/* ================= SPRITES ================= */
const PAL = {
  ghoul: { h: [106, 138, 78], e: [230, 40, 30, 254], m: [40, 50, 26], b: [96, 78, 58], r: [64, 50, 36], a: [106, 138, 78], l: [58, 60, 82], f: [34, 30, 30], x: [120, 14, 12] },
  mage: { h: [222, 216, 200], e: [255, 150, 30, 254], m: [50, 45, 40], b: [206, 200, 184], r: [64, 60, 56], a: [222, 216, 200], l: [196, 190, 174], f: [150, 144, 130], x: [160, 154, 142] },
  brute: { h: [124, 122, 116], e: [70, 210, 255, 254], m: [40, 40, 44], b: [98, 96, 92], r: [66, 64, 62], a: [136, 134, 128], l: [84, 82, 78], f: [50, 50, 52], x: [96, 94, 90] },
};
const FR = {
  walk1: ["................", ".....hhhhhh.....", ".....hhhhhh.....", ".....hehheh.....", ".....hhhhhh.....", ".....hhmmhh.....", "....bbbbbbbb....", "...abbrbbrbba...", "...abrbbbbrba...", "...abbrbbrbba...", "...a.bbbbbb.a...", "...a.llllll.a...", ".....ll..ll.....", ".....ll...ll....", ".....ll....ll...", ".....ff....ff..."],
  walk2: ["................", ".....hhhhhh.....", ".....hhhhhh.....", ".....hehheh.....", ".....hhhhhh.....", ".....hhmmhh.....", "....bbbbbbbb....", "...abbrbbrbba...", "...abrbbbbrba...", "...abbrbbrbba...", "...a.bbbbbb.a...", "...a.llllll.a...", ".....ll..ll.....", "....ll...ll.....", "....ll....ll....", "...ff.....ff...."],
  attack: ["................", ".a...hhhhhh...a.", ".a...hhhhhh...a.", ".aa..hehheh..aa.", "..a..hhhhhh..a..", "..aa.hhmmhh.aa..", "...abbbbbbbba...", "....bbrbbrbb....", "....brbbbbrb....", "....bbrbbrbb....", ".....bbbbbb.....", ".....llllll.....", ".....ll..ll.....", ".....ll..ll.....", ".....ll..ll.....", "....fff..fff...."],
  dead: ["................", "................", "................", "................", "................", "................", "................", "................", "................", "................", "................", "................", ".hhhh...........", ".hehhbbbbbbbll..", ".hhhhbrbbrbbllff", "xxxxxxxxxxxxxxx."],
};
const SPR = {};
for (const k in PAL) {
  SPR[k] = {};
  const R = rng(k.length * 31);
  for (const f in FR) {
    const t = new Uint32Array(256);
    FR[f].forEach((row, y) => { for (let x = 0; x < 16; x++) { const ch = row[x]; if (ch === '.') continue; const c = PAL[k][ch]; const n = nz(R, 7); t[y * 16 + x] = rgb(c[0] + n, c[1] + n, c[2] + n, c[3] ?? 255); } });
    SPR[k][f] = t;
  }
}
function spr(seed, draw) {
  const t = new Uint32Array(256), R = rng(seed);
  const r = (x, y, w, h, c, n = 6) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) if (xx >= 0 && yy >= 0 && xx < 16 && yy < 16) { const v = nz(R, n); t[yy * 16 + xx] = rgb(c[0] + v, c[1] + v, c[2] + v, c[3] ?? 255); } };
  draw(r); return t;
}
const P = {
  health: spr(1, r => { r(6, 2, 4, 2, [120, 80, 40]); r(7, 4, 2, 2, [180, 210, 220]); r(5, 6, 6, 1, [180, 210, 220]); r(4, 7, 8, 1, [180, 210, 220]); r(3, 8, 10, 5, [180, 210, 220]); r(4, 7, 8, 6, [210, 30, 40, 254]); r(4, 13, 8, 1, [180, 210, 220]); r(5, 8, 2, 2, [255, 170, 170, 254], 2); }),
  armor: spr(2, r => { r(3, 4, 10, 9, [60, 100, 190]); r(2, 4, 3, 3, [80, 130, 220]); r(11, 4, 3, 3, [80, 130, 220]); r(6, 4, 4, 2, [20, 20, 30]); r(7, 7, 2, 5, [140, 180, 250]); r(3, 12, 10, 1, [40, 70, 140]); }),
  bullets: spr(3, r => { for (let i = 0; i < 4; i++) { r(4 + i * 2, 6, 1, 3, [220, 180, 60]); r(4 + i * 2, 5, 1, 1, [170, 120, 70]); } r(3, 9, 10, 5, [96, 104, 56]); r(3, 9, 10, 1, [60, 66, 34]); r(6, 11, 4, 1, [180, 190, 120]); }),
  shells: spr(4, r => { for (let i = 0; i < 4; i++) { r(3 + i * 3, 6, 2, 4, [200, 34, 30]); r(3 + i * 3, 9, 2, 1, [220, 180, 60]); } r(2, 10, 12, 4, [110, 60, 30]); r(2, 10, 12, 1, [70, 40, 20]); }),
  key: spr(5, r => { r(3, 5, 4, 5, [220, 30, 30, 254]); r(4, 6, 2, 3, [0, 0, 0, 0], 0); r(7, 7, 7, 1, [220, 30, 30, 254]); r(11, 8, 1, 2, [220, 30, 30, 254]); r(13, 8, 1, 3, [220, 30, 30, 254]); }),
  gun: spr(6, r => { r(1, 7, 11, 2, [70, 70, 78]); r(1, 7, 11, 1, [120, 120, 130]); r(6, 9, 5, 1, [120, 80, 40]); r(10, 8, 5, 3, [110, 72, 36]); r(12, 11, 3, 2, [110, 72, 36]); }),
  torchA: spr(7, r => { r(7, 9, 2, 7, [50, 44, 40]); r(5, 8, 6, 2, [80, 70, 60]); r(6, 4, 4, 4, [250, 140, 30, 254]); r(7, 2, 2, 3, [255, 220, 90, 254]); r(7, 6, 2, 2, [255, 250, 200, 254], 2); }),
  torchB: spr(8, r => { r(7, 9, 2, 7, [50, 44, 40]); r(5, 8, 6, 2, [80, 70, 60]); r(6, 5, 4, 3, [250, 140, 30, 254]); r(6, 3, 3, 3, [255, 200, 70, 254]); r(7, 6, 2, 2, [255, 250, 200, 254], 2); }),
  orb: spr(9, r => { r(5, 5, 6, 6, [255, 120, 20, 254]); r(4, 6, 8, 4, [255, 120, 20, 254]); r(6, 4, 4, 8, [255, 120, 20, 254]); r(6, 6, 4, 4, [255, 230, 120, 254], 3); }),
  blood: spr(10, r => r(0, 0, 16, 16, [150, 12, 10], 20)),
  spark: spr(11, r => r(0, 0, 16, 16, [255, 220, 120, 254], 20)),
  dust: spr(12, r => r(0, 0, 16, 16, [190, 184, 170], 20)),
  rubble: spr(13, r => r(0, 0, 16, 16, [110, 108, 104], 20)),
};

/* ================= LEVEL ================= */
const MAP = [
  "CCCCCCCCCCCCCCCCMMMMMMMMMMMMMMMM",
  "C..a..tC,,,,,,e,M~~~~~~~~~~~~~~M",
  "C......C,,s,,,,,M~~~~z~~~~~~~~~M",
  "C......K,,,,,,g,M~~~~~~~~~~~~z~M",
  "C..p...D,,,,,,,,D~~~~~~~T~~~~~~M",
  "C......K,,,,z,,,M~~~T~~~~~~~~~~M",
  "C..h...C,,,,,,,,M~~~~~~~~~~h~~~M",
  "CCCDCCCCKKKKKKKKM~~z~~~~~~~~~~~M",
  "CC...CCCCCCCCCCCM~~~~~~~~~~~~~aM",
  "CC.z.CCCCCCCCCCCMMMMMMMDMMMMMMMM",
  "CC...S..ACCCCCCCCCCCCCC.CCCCCCCC",
  "CC.a.C.h.CCCCCCCCCCCCCC.CCCCCCCC",
  "CC...BBBBBBBBBBBBBBBBBB.BBBBBBBC",
  "CC...D......=========......s..BC",
  "CCCCCB..z...=========.........BC",
  "CCCCCB......==.....==....s....BC",
  "CCCCCBt.....==..k..==........tBC",
  "CCCCCB......==.....==.....e...BC",
  "CCCCCB......====.====....z....BC",
  "CCCCCBs.....====.====.........BC",
  "CCCCCB..........h......a......BC",
  "CCCCCBBBBBBBBBBBRBBBBBBBBBBBBBBC",
  "CCCCCCCCCCOt.........tOCCCCCCCCC",
  "CCCCCCCCCCO..z.....z..OCCCCCCCCC",
  "CCCCCCCCCCO.....b.....OCCCCCCCCC",
  "CCCCCCCCCCO..e.....a..OCCCCCCCCC",
  "CCCCCCCCCCO...........OCCCCCCCCC",
  "CCCCCCCCCCOOOOOOXOOOOOOCCCCCCCCC",
  "CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC",
];
const MW = 32, MH = MAP.length;
const WALLTEX = { C: 'cobble', M: 'mossy', K: 'bookshelf', B: 'bricks', O: 'obsidian', T: 'leaves', D: 'door', R: 'reddoor', S: 'cobble', X: 'exitOff' };
const FLOORS = { '.': ['stoneFloor', 'ceilStone'], ',': ['floorPlanks', 'ceilPlanks'], '~': ['grass', null], '=': ['lava', 'ceilBrick'] };
const DOORCH = 'DRS';

let wall, wallTex, floorT, ceilT, isLava, doors, seen, ents, pickups, decor, projs, parts, player, stats, msgs, exitUsed;

function loadLevel() {
  wall = new Uint8Array(MW * MH); wallTex = new Array(MW * MH); floorT = new Array(MW * MH); ceilT = new Array(MW * MH);
  isLava = new Uint8Array(MW * MH); seen = new Uint8Array(MW * MH); doors = new Map();
  ents = []; pickups = []; decor = []; projs = []; parts = []; msgs = [];
  stats = { kills: 0, killsT: 0, items: 0, itemsT: 0, secrets: 0, secretsT: 0, time: 0 };
  exitUsed = false;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const ch = MAP[y][x], i = y * MW + x;
    let fl = null;
    if (WALLTEX[ch]) { wall[i] = ch.charCodeAt(0); wallTex[i] = TX[WALLTEX[ch]]; if (DOORCH.includes(ch)) { doors.set(i, { open: 0, opening: false, type: ch }); if (ch === 'S') stats.secretsT++; } }
    else if (FLOORS[ch]) fl = ch;

    <button id="btn" type="button">${won ? 'Play again' : 'Try again'}</button>`;
  ov.hidden = false; document.getElementById('btn').onclick = start; document.getElementById('btn').focus();
}
function showCard(eyebrow, title, sub, btn) {
  card.innerHTML = `<div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p><button id="btn" type="button">${btn}</button>`;
  ov.hidden = false; const b = document.getElementById('btn'); b.onclick = start; b.focus();
}
document.getElementById('btn').onclick = start;

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (state === 'play') {
    time += dt; stats.time += dt;
    updatePlayer(dt); updateDoors(dt); updateEnemies(dt); updateProjs(dt);
    muzzle = Math.max(0, muzzle - dt * 9); lightBoost = muzzle; shake = Math.max(0, shake - dt);
  }
  if (player) {
    const sx = shake > 0 ? rnd(-2, 2) * shake * 8 : 0, sy = shake > 0 ? rnd(-2, 2) * shake * 8 : 0;
    ctx.save(); ctx.translate(sx | 0, sy | 0);
    render(); drawWeapon(); drawOverlay(state === 'play' ? dt : 0);
    ctx.restore();
    drawHUD();
  }
  requestAnimationFrame(frame);
}
// draw a live scene behind the title card
loadLevel(); player.a = .35; time = 0;
requestAnimationFrame(frame);
</script>
