<!doctype html>
<html lang="en">
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cobble Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    color-scheme: light;
    --sky:#9fd6ff; --sky2:#ffe6f2; --ink:#43275f; --ink-2:#8a6aa8;
    --card:#fffaf3; --round:"Fredoka",ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif; --pink:#ff7fb0; --pink-dk:#d9487f; --sun:#ffd23f; --mint:#7fe0b8; --glass:rgba(255,255,255,.72);
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);overflow:hidden}
  body{font-family:"Nunito",ui-rounded,"Trebuchet MS",system-ui,sans-serif}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;background:linear-gradient(180deg,var(--sky),var(--sky2));cursor:crosshair}
  /* ---------- HUD ---------- */
  #hud{position:fixed;left:0;right:0;bottom:0;padding:0 calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-end;justify-content:center;pointer-events:none;z-index:1}
  .pnl{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(67,39,95,.18);border-radius:16px;padding:6px 14px 5px;display:flex;flex-direction:column;align-items:center;min-width:64px;box-shadow:0 6px 18px rgba(67,39,95,.14)}
  .pnl b{font-family:var(--round);font-weight:700;font-size:28px;line-height:1;color:#6a34b8;font-variant-numeric:tabular-nums}
  .pnl span{font-size:10px;letter-spacing:.12em;color:#c2407e;font-weight:800;margin-top:3px}
  .pnl.hp b.low{color:#e8264f}
  .pnl.sh b{color:#2f8fd8}
  .bar{display:block;width:100%;height:5px;border-radius:3px;background:rgba(67,39,95,.12);margin-top:4px;overflow:hidden}
  .bar>i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#ff5a8a,#ffb03f)}
  #face{width:64px;height:64px;border-radius:20px;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:2px solid rgba(67,39,95,.18);box-shadow:0 6px 18px rgba(67,39,95,.14);display:flex;align-items:center;justify-content:center}
  #face svg{width:54px;height:54px}
  .toys{flex-direction:row;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:132px}
  .toys .slot{width:24px;height:24px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--round);font-weight:700;font-size:15px;color:#d9b6cc;background:rgba(255,255,255,.6);margin:0;letter-spacing:0}
  .toys .slot.have{color:#6a34b8}
  .toys .slot.cur{background:#6a34b8;color:#fff}
  .toys .lab{width:100%;text-align:center}
  .keys{flex-direction:row;gap:6px;flex-wrap:wrap;justify-content:center;max-width:100px}
  .keys .key{width:22px;height:22px;border-radius:50%;background:rgba(67,39,95,.1);display:inline-block;position:relative}
  .keys .key.on::after{content:"";position:absolute;inset:4px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  .keys .key.r{color:#ff5064}.keys .key.e{color:#4a96ff}.keys .key.y{color:#ffc21a}
  .keys .lab{width:100%;text-align:center}
  @media (max-width:640px),(max-height:430px){ .pnl{padding:4px 9px 3px;min-width:48px;border-radius:12px} .pnl b{font-size:20px} .pnl span{font-size:8px} #face{width:48px;height:48px;border-radius:14px} #face svg{width:40px;height:40px} .toys{max-width:96px} .toys .slot{width:18px;height:18px;font-size:12px;border-radius:6px} .keys .key{width:16px;height:16px} #hud{gap:5px} }
  @media (max-width:480px){ #hud{gap:4px;padding-left:6px;padding-right:6px} .pnl{min-width:0;padding:4px 6px 3px;border-radius:10px} .pnl b{font-size:17px} .pnl span{font-size:7px;letter-spacing:.06em} #face{width:42px;height:42px;border-radius:12px} #face svg{width:34px;height:34px} .toys,.keys{flex-wrap:nowrap;max-width:none;gap:3px} .toys .lab,.keys .lab{display:none} .toys .slot{width:15px;height:15px;font-size:10px;border-radius:5px} .keys .key{width:13px;height:13px} }
  body.touch .toast{font-size:14px;padding:5px 10px}
  #cross{position:fixed;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;pointer-events:none;z-index:1}
  #cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1.5px rgba(67,39,95,.7);border-radius:2px}
  #cross::before{left:10px;top:2px;width:2px;height:18px}
  #cross::after{left:2px;top:10px;width:18px;height:2px}
  #cross.hot::before,#cross.hot::after{background:#ff5a9a}
  #msgs{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:1;max-width:min(560px,70vw)}
  .toast{font-family:var(--round);font-weight:600;font-size:16px;color:#fff;background:rgba(67,39,95,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 12px;border-radius:12px;animation:tin .25s ease-out;transition:opacity .5s}
  .toast.old{opacity:.75;font-size:14px}
  .toast.out{opacity:0}
  @keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
  #boss{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(380px,56vw);text-align:center;pointer-events:none;z-index:1}
  #boss b{font-family:var(--round);font-weight:700;color:#fff;font-size:16px;text-shadow:0 2px 0 rgba(67,39,95,.6);letter-spacing:.06em}
  #boss .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.55);border:2px solid rgba(67,39,95,.5)}
  #boss .bar>i{background:linear-gradient(90deg,#ff5ab0,#ff9ad0)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;background:radial-gradient(ellipse at center,rgba(255,60,110,0) 45%,rgba(255,60,110,.55) 100%)}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;background:rgba(255,236,140,.6)}
  #mini{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));border-radius:14px;background:rgba(255,250,243,.82);box-shadow:0 6px 18px rgba(67,39,95,.18);pointer-events:none;z-index:1}
  body.touch #mini{top:calc(66px + env(safe-area-inset-top,0px))}
  #hint{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--round);font-weight:600;color:#fff;background:rgba(67,39,95,.55);padding:6px 14px;border-radius:12px;pointer-events:none;z-index:1}
  #rush{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--round);font-weight:700;font-size:16px;color:#fff;padding:6px 16px;border-radius:999px;background:linear-gradient(90deg,#ff6fae,#ffb03f,#7fd8ff,#a274ff);box-shadow:0 4px 14px rgba(255,111,174,.5);pointer-events:none;z-index:1;animation:rushp 1s ease-in-out infinite alternate}
  @keyframes rushp{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.06)}}
  @media (prefers-reduced-motion:reduce){#rush{animation:none}}
  .worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
  .world{display:flex;flex-direction:column;gap:5px;background:#fff1f7;border-radius:16px;padding:8px}
  .world .wn{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--pink-dk);text-transform:uppercase;text-align:left;padding-left:2px}
  .world button{font-size:14px;padding:7px 10px;border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(67,39,95,.16);text-align:left;display:flex;flex-direction:column;gap:1px}
  .world button small{font-family:"Nunito",system-ui,sans-serif;font-size:11px;font-weight:700;color:var(--ink-2)}
  .world button.cur{background:var(--mint);color:#1f5b45}
  .world button.done small{color:#2f9a6b}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  @media (max-height:460px){.worlds{grid-template-columns:repeat(5,1fr);gap:5px}.world{padding:5px}.world button{font-size:11px;padding:4px 6px}.world button small{display:none}.world .wn{font-size:9px}}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--round);font-size:22px;color:var(--ink);z-index:5;background:linear-gradient(180deg,var(--sky),var(--sky2))}
  /* ---------- overlay card ---------- */
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(150,200,255,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:3}
  .card{max-width:600px;width:100%;box-sizing:border-box;background:var(--card);border-radius:28px;box-shadow:0 24px 60px rgba(67,39,95,.28),0 0 0 4px rgba(255,255,255,.7) inset;padding:26px 26px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-height:calc(100% - 8px);overflow:auto}
  .eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;color:var(--pink-dk);text-transform:uppercase}
  h1{margin:0;font-family:var(--round);font-weight:700;font-size:clamp(38px,8vw,64px);line-height:1;background:linear-gradient(180deg,#ffd84f,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6a34b8) drop-shadow(0 8px 14px rgba(255,127,176,.45));text-wrap:balance;padding:4px 0}
  .sub{margin:0;font-size:16px;color:var(--ink-2)}
  button{font:inherit;font-family:var(--round);font-size:19px;font-weight:600;color:#fff;background:linear-gradient(180deg,#ff8fbd,#ff5f9e);border:0;border-radius:16px;padding:11px 26px;cursor:pointer;box-shadow:0 5px 0 #c9407a,0 10px 20px rgba(255,95,158,.35)}
  button:hover{filter:brightness(1.06)}
  button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #c9407a}
  button:disabled{background:#efe6f3;color:#b4a3c2;box-shadow:none;cursor:not-allowed}
  button.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(67,39,95,.18);font-size:15px;padding:8px 18px}
  .stages{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .stages button{font-size:14px;padding:7px 12px;border-radius:12px;background:#fff;color:var(--ink);box-shadow:0 3px 0 rgba(67,39,95,.18)}
  .stages button.cur{background:var(--mint);color:#1f5b45}
  .stages button:disabled{background:#f5eff8;color:#b9a9c6}
  .keyshelp{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:13px;color:var(--ink-2);text-align:left}
  .keyshelp b{color:var(--ink)}
  .stats{display:grid;grid-template-columns:auto auto;gap:4px 28px;font-size:17px;text-align:left;font-variant-numeric:tabular-nums}
  .stats span:nth-child(odd){color:var(--ink-2)}
  .note{font-size:12px;color:var(--ink-2);margin:0}
  .hall{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:calc(14px + env(safe-area-inset-left,0px));z-index:4;font-size:14px;font-weight:800;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:14px;background:var(--card);box-shadow:0 4px 0 rgba(67,39,95,.15)}
  .hall:hover,.hall:focus-visible{background:var(--sun);outline:none}
  .tset{display:grid;grid-template-columns:auto auto;gap:6px 12px;align-items:center;font-size:14px;text-align:left}
  .tset > span{color:var(--ink-2)}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{font-size:13px;padding:5px 11px;border-radius:10px;background:#fff;color:var(--ink);box-shadow:0 2px 0 rgba(67,39,95,.18)}
  .seg button.cur{background:var(--mint);color:#1f5b45}
  @media (max-width:520px){.keyshelp{font-size:12px}.card{padding:18px} #ov{padding-top:calc(66px + env(safe-area-inset-top,0px))}}
  @media (max-height:460px){.card{gap:8px;padding:14px}.card h1{font-size:36px}.note,.intro,.tdesc,.keyshelp{display:none}.sub{font-size:14px}.stages button{font-size:12px;padding:4px 9px}.tset{font-size:13px;gap:4px 10px}.seg button{padding:3px 8px}}
  /* ---------- touch controls ---------- */
  body.touch, body.touch #game, #touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.touch #game, #touch{touch-action:none}
  #touch{position:fixed;inset:0;z-index:2;--stick:clamp(116px,24vmin,180px);--btn:clamp(80px,16vmin,128px);--lift:calc(78px + env(safe-area-inset-bottom,0px))}
  #stick,#stickHint{position:absolute;width:var(--stick);height:var(--stick);border-radius:50%;pointer-events:none;box-sizing:border-box}
  #stick{margin:calc(var(--stick) / -2) 0 0 calc(var(--stick) / -2);border:3px solid rgba(255,255,255,.8);background:rgba(255,255,255,.22);display:none;box-shadow:0 4px 18px rgba(67,39,95,.2)}
  #knob{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 10px rgba(67,39,95,.3)}
  #stickHint{left:calc(24px + env(safe-area-inset-left,0px));bottom:var(--lift);border:3px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--round);font-size:14px;font-weight:600;color:#fff;text-shadow:0 1px 3px rgba(67,39,95,.6);line-height:1.25}
  #lookHint{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));top:26%;font-family:var(--round);font-size:14px;font-weight:600;color:#fff;background:rgba(67,39,95,.4);padding:5px 12px;border-radius:12px;border:2px dashed rgba(255,255,255,.7);pointer-events:none;transition:opacity .6s}
  #stickHint.off,#lookHint.off{opacity:0}
  #stickHint.off{display:none}
  .tb{position:absolute;border-radius:50%;padding:0;font-size:15px;color:var(--ink);background:rgba(255,255,255,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 4px 12px rgba(67,39,95,.25);touch-action:none}
  .tb.on{background:var(--sun);transform:scale(.94)}
  #tFire{width:var(--btn);height:var(--btn);right:calc(20px + env(safe-area-inset-right,0px));bottom:var(--lift);background:linear-gradient(180deg,rgba(255,143,189,.95),rgba(255,95,158,.95));color:#fff;font-size:18px}
  #tUse{width:calc(var(--btn) * .64);height:calc(var(--btn) * .64);right:calc(var(--btn) + 34px + env(safe-area-inset-right,0px));bottom:calc(var(--lift) + var(--btn) * .06)}
  #tTurn{width:calc(var(--btn) * .58);height:calc(var(--btn) * .58);right:calc(var(--btn) + 40px + env(safe-area-inset-right,0px));bottom:calc(var(--lift) + var(--btn) * .72 + 12px);font-size:13px}
  #tToy{width:calc(var(--btn) * .58);height:calc(var(--btn) * .58);right:calc(var(--btn) * .21 + 20px + env(safe-area-inset-right,0px));bottom:calc(var(--lift) + var(--btn) + 12px)}
  .tb.sm{width:46px;height:46px;font-size:12px;top:calc(12px + env(safe-area-inset-top,0px))}
  #tPause{right:calc(14px + env(safe-area-inset-right,0px))}
  #tMap{right:calc(70px + env(safe-area-inset-right,0px))}
  body.touch #msgs{max-width:min(420px,56vw)}
  /* ================= fantasy theme (dark plum, gold leaf, parchment) ================= */
  :root{
    --ink:#f3e7cf; --ink-2:#c9b79a; --card:#1d1626; --gold:#e8c172; --gold-dk:#a8782e; --plum:#2a1f38; --plum-2:#3a2c4c; --crimson:#b8324a;
    --round:"Cinzel","Noto Serif TC",Georgia,serif; --body:"Nunito","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    --pink-dk:var(--gold); --mint:var(--gold); --glass:rgba(24,18,32,.72);
  }
  body{font-family:var(--body)}
  body.zh{--round:"Noto Serif TC","Cinzel",Georgia,serif}
  html,body{background:#120d18}
  #game{background:linear-gradient(180deg,#2a1f38,#120d18)}
  #loading{background:radial-gradient(ellipse at 50% 40%,#3a2c4c,#120d18 70%);color:var(--gold);letter-spacing:.08em}
  /* HUD */
  .pnl{background:linear-gradient(180deg,rgba(42,31,56,.86),rgba(20,14,28,.86));border:1.5px solid rgba(232,193,114,.55);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,236,190,.15)}
  .pnl b{color:#fff4dc;font-family:"Cinzel",Georgia,serif;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  .pnl span{color:var(--gold);font-family:var(--body);letter-spacing:.14em}
  body.zh .pnl span{letter-spacing:.2em}
  .pnl.hp b.low{color:#ff6a6a}
  .pnl.sh b{color:#9fd4ff}
  .bar{background:rgba(0,0,0,.4)}
  .bar>i{background:linear-gradient(90deg,#b8324a,#ff7a5a)}
  #face{background:radial-gradient(circle at 50% 40%,#4a3a5e,#1d1626);border:2px solid var(--gold);border-radius:50%;box-shadow:0 0 0 3px rgba(20,14,28,.8),0 6px 18px rgba(0,0,0,.4)}
  #face svg{width:58px;height:58px}
  .toys .slot{background:rgba(0,0,0,.35);color:#6a5a74;border:1px solid rgba(232,193,114,.2)}
  .toys .slot.have{color:#f3e7cf}
  .toys .slot.cur{background:linear-gradient(180deg,#f2cf82,#c08a36);color:#2a1808;border-color:transparent}
  .keys .key{background:rgba(0,0,0,.35);border:1px solid rgba(232,193,114,.25)}
  .toast{font-family:var(--body);font-weight:700;background:linear-gradient(90deg,rgba(20,14,28,.86),rgba(42,31,56,.7));border-left:3px solid var(--gold);border-radius:6px;color:#f6ead2}
  #boss b{font-family:var(--round);color:#ffe6b0;text-shadow:0 2px 4px rgba(0,0,0,.8);letter-spacing:.12em}
  #boss .bar{background:rgba(10,6,14,.7);border:1.5px solid var(--gold);height:11px}
  #boss .bar>i{background:linear-gradient(90deg,#7a1a3a,#d8325a,#ff8a6a)}
  #mini{background:rgba(20,14,28,.82);border:1.5px solid rgba(232,193,114,.5)}
  #hint{background:rgba(20,14,28,.75);border:1px solid rgba(232,193,114,.4);font-family:var(--body)}
  #rush{background:linear-gradient(90deg,#c08a36,#ffd36a,#c08a36);color:#2a1808;box-shadow:0 4px 14px rgba(255,190,90,.45);font-family:var(--round)}
  #cross.hot::before,#cross.hot::after{background:#ffcf6a}
  /* overlay + cards */
  #ov{background:radial-gradient(ellipse at center,rgba(18,12,26,.35),rgba(10,6,14,.72));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .card{background:linear-gradient(180deg,rgba(42,31,56,.97),rgba(24,18,32,.97));border-radius:18px;border:1.5px solid rgba(232,193,114,.65);box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 4px rgba(20,14,28,.9),inset 0 0 0 5px rgba(232,193,114,.25);color:var(--ink)}
  .eyebrow{color:var(--gold);font-family:var(--body);letter-spacing:.2em}
  h1{font-family:var(--round);font-weight:800;background:linear-gradient(180deg,#fff2c4 0%,#f2c46b 45%,#b0782a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #3a2410) drop-shadow(0 8px 18px rgba(232,170,80,.3));letter-spacing:.02em}
  .logo-sub{margin:-6px 0 0;font-family:var(--round);font-size:15px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase}
  .sub{color:var(--ink-2)}
  button{font-family:var(--round);font-weight:700;color:#2a1808;background:linear-gradient(180deg,#f8dc98,#e0a848 55%,#b8782a);border-radius:10px;box-shadow:0 4px 0 #6a4214,0 10px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5);letter-spacing:.03em}
  button:active{box-shadow:0 1px 0 #6a4214}

  let seed = [...key].reduce((a, c) => a * 31 + c.charCodeAt(0) | 0, 11); const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const W = 400, Hh = 225;
  const ridge = (y, amp, step, jag) => { let d = `M0 ${Hh} L0 ${y}`; for (let x = 0; x <= W; x += step) d += ` L${x} ${y - amp * (.4 + R() * .6) * (jag ? (x / step % 2 ? 1 : .35) : 1)}`; return d + ` L${W} ${Hh}Z`; };
  const hills = (y, amp, col) => { let d = `M0 ${Hh} L0 ${y}`; for (let x = 0; x <= W; x += 50) d += ` Q${x + 25} ${y - amp * (.5 + R() * .5)} ${x + 50} ${y - amp * .2 * R()}`; return `<path d="${d} L${W} ${Hh}Z" fill="${col}"/>`; };
  const stars = n => Array.from({ length: n }, () => { const x = R() * W, y = R() * 120, r = .5 + R() * 1.1, d = (1.5 + R() * 2.5).toFixed(1); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="#fff"><animate attributeName="opacity" values="1;.25;1" dur="${d}s" repeatCount="indefinite"/></circle>`; }).join('');
  const sky = (a, b, c) => `<defs><linearGradient id="sk${key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient><radialGradient id="gl${key}"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="${W}" height="${Hh}" fill="url(#sk${key})"/>`;
  const glowAt = (x, y, r, col, op = .6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gl${key})" style="mix-blend-mode:screen" opacity="${op}"/><circle cx="${x}" cy="${y}" r="${r * .22}" fill="${col}"/>`;
  const castle = (x, y, s, col, win, flag) => { const t = (dx, w, h) => `<rect x="${x + dx * s}" y="${y - h * s}" width="${w * s}" height="${h * s}" fill="${col}"/><path d="M${x + dx * s - 2 * s} ${y - h * s} L${x + (dx + w / 2) * s} ${y - (h + 14) * s} L${x + (dx + w) * s + 2 * s} ${y - h * s}Z" fill="${col}"/>`;
    let o = `<rect x="${x}" y="${y - 30 * s}" width="${90 * s}" height="${30 * s}" fill="${col}"/>` + t(-10, 16, 52) + t(84, 16, 52) + t(30, 30, 72) + t(14, 12, 44) + t(64, 12, 44);
    for (let i = 0; i < 9; i++) o += `<rect x="${x + i * 10 * s}" y="${y - 34 * s}" width="${6 * s}" height="${5 * s}" fill="${col}"/>`;
    if (win) for (const [dx, dy] of [[40, 50], [48, 50], [-4, 36], [90, 36], [42, 22]]) o += `<rect x="${x + dx * s}" y="${y - dy * s}" width="${3 * s}" height="${5 * s}" rx="${1.5 * s}" fill="${win}"/>`;
    if (flag) o += `<path d="M${x + 45 * s} ${y - 86 * s} v-14 l12 4 -12 4" stroke="${col}" stroke-width="${1.5 * s}" fill="${flag}"/>`;
    return o; };
  const heroSil = (x, y, s, col, pose = 'stand') => { const girl = heroKey === 'girl';
    let o = `<g transform="translate(${x} ${y}) scale(${s})" fill="${col}"><path d="M-7 -30 L7 -30 L9 -6 L4 -6 L3 0 L-3 0 L-4 -6 L-9 -6Z"/><path d="M-6 -30 L-13 -2 L-2 -8Z" opacity=".85"/><circle cx="0" cy="-36" r="6"/>`;
    o += girl ? `<path d="M4 -40 Q14 -38 12 -26 Q9 -32 5 -34Z"/>` : `<path d="M-6 -39 L-3 -44 L0 -40 L3 -45 L5 -39Z"/>`;
    o += pose === 'raise' ? `<path d="M6 -28 L12 -40 L13.5 -39 L8 -27Z"/><path d="M11 -40 L18 -66 L20 -65.5 L13 -39.5Z"/><path d="M8 -42 L16 -39" stroke="${col}" stroke-width="2"/>` : `<path d="M7 -26 L10 -14 L8 -13 L5 -25Z"/><path d="M8 -14 L13 8 L11 8.6 L6 -13.6Z"/>`;
    return o + '</g>'; };
  const wizardSil = (x, y, s, col, orb) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-18 0 Q-14 -40 -6 -52 L0 -78 Q4 -66 12 -60 L6 -52 Q14 -40 18 0Z" fill="${col}"/><path d="M-12 -52 Q0 -58 14 -52 Q2 -49 -12 -52Z" fill="${col}"/><path d="M14 -40 L24 -86" stroke="${col}" stroke-width="3"/>${orb ? `<circle cx="25" cy="-90" r="7" fill="${orb}"/><circle cx="25" cy="-90" r="16" fill="${orb}" opacity=".25"/>` : ''}<path d="M-3 -46 l2 1 M3 -46 l2 -1" stroke="${orb || '#c46bff'}" stroke-width="1.6"/></g>`;
  const crystal = (x, y, s, col) => `<g transform="translate(${x} ${y}) scale(${s})"><path d="M0 -24 L9 -6 L0 14 L-9 -6Z" fill="${col}"/><path d="M0 -24 L9 -6 L0 -2Z" fill="#fff" opacity=".5"/><path d="M-9 -6 L0 14 L0 -2Z" fill="#000" opacity=".15"/></g>`;
  const particles = (n, col, kind) => Array.from({ length: n }, () => { const x = R() * W, y = R() * Hh, r = .8 + R() * 1.6, d = (4 + R() * 6).toFixed(1); const dy = kind === 'rise' ? -60 : 70, dx = kind === 'drift' ? 40 : (R() - .5) * 20; return `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${r.toFixed(1)}" fill="${col}" opacity=".85"><animateTransform attributeName="transform" type="translate" from="0 0" to="${dx.toFixed(0)} ${dy}" dur="${d}s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="${d}s" repeatCount="indefinite"/></circle>`; }).join('');
  let o = '';
  switch (key) {
    case 'kingdom': o = sky('#5aa8f0', '#bfe2ff', '#fff2d6') + glowAt(320, 50, 70, '#fff6c8', .7) + `<path d="${ridge(140, 40, 40)}" fill="#8fb8d8" opacity=".7"/>` + hills(170, 30, '#7fbf6a') + castle(150, 168, 1.05, '#e8e2d6', '#5a7ab0', '#c8324a') + hills(200, 24, '#5fa04c') + hills(222, 12, '#4f8a3e')
      + Array.from({ length: 4 }, (_, i) => `<path d="M${60 + i * 26} ${40 + i * 8} q4 -4 8 0 q4 -4 8 0" stroke="#3a4a6a" stroke-width="1.4" fill="none"/>`).join(''); break;
    case 'curse': o = sky('#1c1036', '#4a2a6e', '#a04a8a') + stars(30) + wizardSil(300, 210, 2.3, 'rgba(12,6,22,.75)', '#e2a6ff') + `<path d="${ridge(170, 24, 30)}" fill="#2a1a40"/>` + castle(120, 196, 1.15, '#1a1026', '#c46bff', '#6a2a8a')
      + `<path d="M210 30 L196 70 L208 70 L190 112" stroke="#e6c8ff" stroke-width="2" fill="none" opacity=".9"><animate attributeName="opacity" values="0;1;0;0" dur="2.6s" repeatCount="indefinite"/></path>` + hills(220, 16, '#140a20') + particles(18, '#c46bff', 'rise'); break;
    case 'squire': o = sky('#0e1a3a', '#24386a', '#4a5a8a') + stars(50) + glowAt(70, 46, 40, '#f4f0dc', .55) + `<path d="${ridge(160, 30, 36)}" fill="#1c2a50"/>` + castle(270, 160, .55, '#2a1a3e', '#c46bff') + glowAt(295, 130, 40, '#c46bff', .35)
      + `<path d="M0 225 L0 190 Q120 160 200 176 Q260 186 400 200 L400 225Z" fill="#101a34"/>` + heroSil(150, 172, 1.35, '#0a1024') + particles(10, '#fff3b0', 'drift'); break;
    case 'journey': { o = `<defs><radialGradient id="pm"><stop offset="0" stop-color="#f6e7c4"/><stop offset="1" stop-color="#d9bf8a"/></radialGradient></defs><rect width="${W}" height="${Hh}" fill="url(#pm)"/><rect x="8" y="8" width="384" height="209" fill="none" stroke="#8a6a3a" stroke-width="2" stroke-dasharray="2 4"/>`;
      const pts = [[50, 170], [120, 110], [200, 160], [270, 80], [350, 120]], ic = ['#5f9a4c', '#8a8a96', '#d9a85a', '#9fc8e8', '#7a3aa8'];
      o += `<path d="M${pts.map(p => p.join(' ')).join(' L')}" stroke="#8a2a2a" stroke-width="2.5" stroke-dasharray="6 6" fill="none"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>`;
      pts.forEach(([x, y], i) => { o += `<circle cx="${x}" cy="${y}" r="16" fill="${ic[i]}" stroke="#5a3a1a" stroke-width="2"/><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Cinzel,serif">${i + 1}</text>`; });
      o += crystal(372, 70, 1, '#c79bff') + heroSil(42, 205, .9, '#3a2a1a'); break; }
    case 'meadow': o = sky('#ffb070', '#ffd9a0', '#fff0d0') + glowAt(90, 120, 80, '#fff2c0', .8) + `<path d="${ridge(150, 30, 50)}" fill="#c89a7a" opacity=".6"/>` + hills(176, 26, '#8ab060')
      + `<g transform="translate(270 160)" fill="#5a3a2a"><path d="M-10 0 L-6 -50 L6 -50 L10 0Z"/><path d="M-4 -60 L4 -60 L4 -44 L-4 -44Z"/><g><animateTransform attributeName="transform" type="rotate" from="0 0 -52" to="360 0 -52" dur="8s" repeatCount="indefinite"/><path d="M0 -52 L-4 -92 L4 -92Z M0 -52 L40 -56 L40 -48Z M0 -52 L4 -12 L-4 -12Z M0 -52 L-40 -48 L-40 -56Z"/></g></g>`
      + Array.from({ length: 6 }, (_, i) => `<circle cx="${112 + i * 3}" cy="${150 - i * 12}" r="${4 + i * 1.6}" fill="#8a8088" opacity="${(.5 - i * .06).toFixed(2)}"><animate attributeName="cy" values="${150 - i * 12};${140 - i * 12};${150 - i * 12}" dur="${3 + i * .4}s" repeatCount="indefinite"/></circle>`).join('') + hills(205, 18, '#6a9a48') + hills(225, 10, '#56843a'); break;
    case 'castle': o = sky('#2a3a6a', '#7a6a9a', '#e0a08a') + glowAt(200, 150, 90, '#ffd0a0', .4) + castle(110, 200, 2, '#3a3046', '#ffcf7a', '#8a1a2a')
      + Array.from({ length: 7 }, (_, i) => { const x = 60 + R() * 280, y = 30 + R() * 70; return `<path d="M${x} ${y} q5 -6 10 0 q5 -6 10 0 q-5 2 -10 0 q-5 2 -10 0Z" fill="#1a1022"><animateTransform attributeName="transform" type="translate" values="0 0;${(R() * 20 - 10).toFixed(0)} -6;0 0" dur="${(2 + R() * 2).toFixed(1)}s" repeatCount="indefinite"/></path>`; }).join('') + hills(222, 8, '#1e1828'); break;
    case 'desert': o = sky('#4a8ee0', '#f4c27a', '#ffe0a8') + glowAt(320, 60, 70, '#fff6d0', .8) + `<path d="M150 180 L220 100 L290 180Z" fill="#c8964e"/><path d="M220 100 L290 180 L250 180Z" fill="#a8763a"/><rect x="208" y="150" width="24" height="30" fill="#3a2410"/>`
      + `<path d="M0 225 L0 180 Q80 160 160 182 Q260 200 400 172 L400 225Z" fill="#e8b46a"/><path d="M0 225 L0 205 Q120 190 240 210 Q330 222 400 205 L400 225Z" fill="#d49a52"/>` + particles(14, '#fff0c0', 'drift'); break;
    case 'ice': o = sky('#8ab8e8', '#d0e6f8', '#f4f8ff') + `<path d="${ridge(130, 70, 40, true)}" fill="#b8d0e8"/><path d="${ridge(170, 60, 50, true)}" fill="#e8f2ff"/>`
      + `<g fill="#6a7a90"><rect x="170" y="150" width="60" height="40"/><path d="M168 150 L200 128 L232 150Z"/><rect x="192" y="166" width="16" height="24" fill="#3a4a60"/></g>` + hills(222, 12, '#f8fbff') + particles(40, '#fff', 'fall'); break;
    case 'capital': o = sky('#2a1a4a', '#6a3a7a', '#e08a7a') + stars(16) + glowAt(200, 60, 60, '#e2a6ff', .5) + crystal(200, 62, .9, '#d6aaff')
      + `<g fill="#1c1228"><path d="M160 200 L170 90 L180 200Z"/><path d="M190 200 L200 72 L210 200Z"/><path d="M220 200 L230 96 L240 200Z"/><rect x="140" y="150" width="120" height="50"/></g>`
      + `<path d="${ridge(196, 26, 22)}" fill="#24182e"/>` + hills(224, 10, '#140c1c') + particles(16, '#c46bff', 'rise'); break;
    case 'dawn': o = sky('#ffcf7a', '#ffe8b8', '#fff6e0') + glowAt(200, 70, 120, '#ffffff', .9) + crystal(200, 70, 1.2, '#bfe8ff')
      + Array.from({ length: 12 }, (_, i) => { const a = i / 12 * Math.PI * 2; return `<path d="M200 70 L${(200 + Math.cos(a) * 300).toFixed(0)} ${(70 + Math.sin(a) * 300).toFixed(0)}" stroke="#fff6d0" stroke-width="6" opacity=".25"/>`; }).join('')
      + `<g fill="#8a7a9a"><path d="M160 200 L170 110 L180 200Z"/><path d="M190 200 L200 96 L210 200Z"/><path d="M220 200 L230 116 L240 200Z"/><rect x="140" y="160" width="120" height="40"/></g>` + hills(224, 14, '#9ab070') + particles(14, '#fff', 'rise'); break;
    case 'knight': o = sky('#ffb060', '#ffd9a0', '#fff0d0') + glowAt(200, 140, 120, '#fff6d0', .7) + castle(60, 222, 2.2, '#b8a890', '#ffe0a0', '#c8324a')
      + `<rect x="0" y="190" width="400" height="35" fill="#8a6a50"/>` + heroSil(200, 192, 1.6, '#2a1a10', 'raise')
      + Array.from({ length: 30 }, () => `<rect x="${(R() * W).toFixed(0)}" y="${(R() * 120).toFixed(0)}" width="3" height="5" fill="${['#ffd36a', '#c8324a', '#5fb0ff', '#fff'][(R() * 4) | 0]}"><animateTransform attributeName="transform" type="translate" from="0 -20" to="${(R() * 30 - 15).toFixed(0)} 120" dur="${(3 + R() * 3).toFixed(1)}s" repeatCount="indefinite"/></rect>`).join(''); break;
    default: o = sky('#0e1430', '#1e2448', '#2a2a56') + stars(80) + glowAt(200, 150, 60, '#c79bff', .5) + crystal(200, 150, 1.4, '#c79bff');
  }
  return `<svg viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${o}</svg>`;
}

/* ---------- story player: illustrated panels with a typewriter text box ---------- */
let storyRun = null;
function playStory(panels, done, opts = {}) {
  const el = $('story'); state = 'story'; showUI(false); ov.hidden = true; if (document.pointerLockElement) document.exitPointerLock(); mouseDown = false;
  let i = -1, typing = null;
  const vars = { name: heroName() };
  const next = () => {
    if (typing) { typing.finish(); return; }
    i++; if (i >= panels.length) { close(); return; }
    const p = panels[i], txt = L2({ en: p.en, zh: p.zh }).replace(/\{(\w+)\}/g, (_, n) => vars[n] ?? '');
    el.innerHTML = `<div class="sp-art">${sceneSVG(p.scene)}</div><div class="sp-veil"></div>
      ${p.big ? `<div class="sp-big">${L2(p.big)}</div>` : ''}${opts.chapter ? `<div class="sp-ch"><span>${t('chapterOf', { n: opts.chapter.n })}</span><b>${L2(opts.chapter.title)}</b></div>` : ''}
      <div class="sp-box"><p class="sp-text"></p><div class="sp-foot"><span class="sp-dots">${panels.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</span><span class="sp-tap">${t('tapNext')} ▸</span></div></div>
      <button type="button" class="sp-skip ghost">${t('skip')}</button>`;
    el.querySelector('.sp-skip').onclick = ev => { ev.stopPropagation(); close(); };
    const out = el.querySelector('.sp-text'); let n = 0; const chars = [...txt];
    const step = () => { n = Math.min(chars.length, n + (LANG === 'zh' ? 1 : 2)); out.textContent = chars.slice(0, n).join(''); if (n >= chars.length) { typing = null; return; } typing.h = setTimeout(step, LANG === 'zh' ? 42 : 22); };
    typing = { h: 0, finish() { clearTimeout(this.h); out.textContent = txt; typing = null; } }; step();
  };
  const close = () => { if (typing) clearTimeout(typing.h); typing = null; el.hidden = true; el.onclick = null; storyRun = null; done && done(); };
  el.hidden = false; el.onclick = next; storyRun = { next, close }; next();
}
// a short cinematic banner over gameplay (boss arrives / boss defeated)
let bannerT = 0;
function bossBanner(T, line) {
  const b = BOSSLORE[T.key]; if (!b) return; const el = $('bossIntro');
  el.innerHTML = `<div class="bi-bar top"></div><div class="bi-bar bot"></div><div class="bi-card"><span class="bi-epi">${L2(b.epi)}</span><b class="bi-name">${L2(b.name)}</b><p class="bi-line">${LANG === 'zh' ? '「' : '“'}${L2(b[line])}${LANG === 'zh' ? '」' : '”'}</p></div>`;
  el.hidden = false; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); bannerT = line === 'hi' ? 3.6 : 3;
}
function tickBanner(dt) { if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('bossIntro').hidden = true; } }

/* ================= PHONE AS CONTROLLER =================
   The big screen opens a room and shows a QR code; a phone opens controller.html?room=CODE and
   becomes the gamepad. Transport: PeerJS (WebRTC data channel; the free PeerJS broker only
   introduces the two sides). ?net=local uses a BroadcastChannel so two tabs can test it offline. */
const PAD_CDN = { peer: 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js', qr: 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js' };
const NET_LOCAL = new URLSearchParams(location.search).get('net') === 'local';
function loadScript(src) { return new Promise((ok, bad) => { if (document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => bad(new Error('load ' + src)); document.head.appendChild(s); }); }
const roomCode = () => { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.random() * A.length | 0]; return s; };
// what the phone is doing right now (read by updatePlayer)
const pad = { on: false, mx: 0, my: 0, fire: false, turn: 0, auto: true, seen: [0, 0, 0, 0, 0], peer: null, cid: null, last: 0 };
const Pad = {
  room: null, peer: null, bc: null, conns: new Map(), status: '', opening: null, sentKey: '', wake: null,
  url() { return new URL('controller.html?room=' + this.room + (NET_LOCAL ? '&net=local' : ''), location.href).href; },
  async open() {
    if (this.room) return;
    if (this.opening) return this.opening;
    this.opening = (async () => {
      let saved = null; try { saved = localStorage.getItem('cobblekeep.room'); } catch (e) { }
      if (NET_LOCAL) {
        this.room = saved || roomCode(); this.bc = new BroadcastChannel('cobblekeep-' + this.room);
        this.bc.onmessage = e => { const m = e.data; if (m.to !== 'host') return; if (m.d && m.d.t === 'bye') this.onClose(m.from); else this.onMsg(m.from, m.d); };
      } else {
        await loadScript(PAD_CDN.peer);
        for (let tries = 0; tries < 4 && !this.room; tries++) {
          const id = tries === 0 && saved || roomCode();
          try { await this.listen(id); this.room = id; } catch (e) { if (!(e && e.type === 'unavailable-id')) throw e; }
        }
        if (!this.room) throw new Error('no room');
      }
      try { localStorage.setItem('cobblekeep.room', this.room); } catch (e) { }
      this.keepAwake();
    })();
    try { await this.opening; } finally { this.opening = null; }
  },
  listen(id) {
    return new Promise((ok, bad) => {
      let opened = false; const peer = new Peer('cobblekeep-' + id, { debug: 0 });
      peer.on('open', () => { opened = true; this.peer = peer; ok(); });
      peer.on('error', e => { if (!opened) { peer.destroy(); bad(e); } });
      peer.on('disconnected', () => { if (!peer.destroyed) setTimeout(() => peer.reconnect(), 1000); });
      peer.on('connection', conn => {
        conn.on('open', () => this.conns.set(conn.peer, conn));
        conn.on('data', d => { this.conns.set(conn.peer, conn); if (d && d.t === 'bye') this.onClose(conn.peer); else this.onMsg(conn.peer, d); });
        conn.on('close', () => { if (this.conns.get(conn.peer) === conn) this.conns.delete(conn.peer); this.onClose(conn.peer); });
      });
    });
  },
  send(peer, d) { if (!peer) return; if (this.bc) return this.bc.postMessage({ to: peer, from: 'host', d }); const c = this.conns.get(peer); if (c && c.open) try { c.send(d); } catch (e) { } },
  onMsg(peer, d) {
    if (!d || !d.t) return;
    if (d.t === 'hello') {
      // one phone drives the game; a newer phone (or the same phone after a reconnect) takes over
      if (pad.peer && pad.peer !== peer && pad.cid !== d.cid) this.send(pad.peer, { t: 'replaced' });
      pad.peer = peer; pad.cid = d.cid; pad.on = true; pad.seen = (d.c || [0, 0, 0, 0, 0]).slice(); pad.last = performance.now();
      this.sentKey = ''; this.send(peer, { t: 'welcome' }); this.push(true); say(t('pad.joined')); this.refreshCard(); return;
    }
    if (peer !== pad.peer) return this.send(peer, { t: 'who' });
    pad.last = performance.now(); if (!pad.on) { pad.on = true; this.refreshCard(); }
    if (d.t === 'in') {
      pad.mx = clamp(+d.mx || 0, -1, 1); pad.my = clamp(+d.my || 0, -1, 1); pad.fire = !!d.f; pad.auto = d.auto !== false;
      if (state === 'play' && isFinite(d.look)) pad.turn += clamp(d.look, -1.5, 1.5);
      const c = d.c || [];
      for (let k = 0; k < 5; k++) while ((c[k] || 0) > pad.seen[k]) { pad.seen[k]++; this.press(k); }
    } else if (d.t === 'nav') this.nav(d.dir);
    else if (d.t === 'ok') this.ok();
    else if (d.t === 'back') this.back();
  },
  onClose(peer) { if (peer !== pad.peer) return; pad.on = false; pad.mx = pad.my = 0; pad.fire = false; say(t('pad.left')); this.refreshCard(); },
  // 0 use · 1 next weapon · 2 turn around · 3 map · 4 pause
  press(k) {
    audioInit();
    if (state !== 'play') { if (k === 4) this.back(); return; }
    if (k === 0) use();
    else if (k === 1) { for (let j = 1; j <= 4; j++) { const w = (player.want + j) % 4; if (player.has[w]) { selectW(w); break; } } }
    else if (k === 2) { if (!(player.qturn > 0)) player.qturn = Math.PI; }
    else if (k === 3) showMap = !showMap;
    else if (k === 4) pause();
  },
  // menus: the phone's arrows move a highlight between the buttons on screen
  buttons() { return [...card.querySelectorAll('button:not([disabled])')].filter(b => b.offsetParent && !ov.hidden); },
  nav(dir) {

/* ================= MAIN LOOP ================= */
function frame(now) {
  const dt = clamp((now - last) / 1000 || 0, 0, .05); last = now;
  TZ.hidden = !(touchMode && state === 'play' && !pad.on);
  if (state === 'play') {
    time += dt; stats.time += dt;
    updatePlayer(dt); updateDoors(dt); updateEnemies(dt); updateProjs(dt); updateTraps(dt);
    muzzle = Math.max(0, muzzle - dt * 9); shake = Math.max(0, shake - dt);
    tickMsgs(dt); tickBanner(dt); markSeen(); updateHUD(); checkPerf(dt);
  } else if (state === 'title' || state === 'story') { time += dt; player.a += dt * .12; }
  updateParticles(state === 'play' || state === 'title' || state === 'story' ? dt : 0);
  syncScene(dt);
  renderer.clear(); renderer.render(scene, camera);
  renderer.clearDepth(); renderer.render(wscene, wcam);
  requestAnimationFrame(frame);
}
