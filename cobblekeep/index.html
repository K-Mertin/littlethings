<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cobble Keep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --sky:#8fd0ff; --sky2:#ffe3f1; --ink:#4a2b6b; --ink-2:#8a6aa8;
    --card:#fffaf2; --pink:#ff7fb0; --pink-dk:#d9487f; --sun:#ffd23f; --mint:#7fe0b8;
  }
  [hidden]{display:none!important}
  html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);overflow:hidden}
  body{font-family:"Pixelify Sans",ui-rounded,"Trebuchet MS",system-ui,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--sky),var(--sky2))}
  #game{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#8fd0ff;cursor:crosshair;max-width:100%}
  #ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(120,190,255,.35);backdrop-filter:blur(2px)}
  .card{max-width:540px;width:100%;box-sizing:border-box;background:var(--card);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--pink);padding:22px 22px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-height:calc(100% - 8px);overflow:auto}
  .eyebrow{font-size:14px;letter-spacing:.14em;color:var(--pink-dk);text-transform:uppercase}
  h1{margin:0;font-weight:700;font-size:clamp(34px,8vw,58px);line-height:1;color:var(--sun);
     text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),6px 6px 0 var(--pink);text-wrap:balance}
  .sub{margin:0;font-size:16px;color:var(--ink-2)}
  button{font:inherit;font-size:18px;font-weight:700;letter-spacing:.04em;color:var(--ink);background:var(--sun);border:3px solid var(--ink);padding:10px 20px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
  button:hover{background:#ffe27a}
  button:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  button:disabled{background:#e9e1ee;color:#a898b6;border-color:#b8a8c8;box-shadow:none;cursor:not-allowed}
  .stages{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .stages button{font-size:14px;padding:6px 10px;box-shadow:0 3px 0 var(--ink);background:#fff}
  .stages button.cur{background:var(--mint)}
  .keys{display:grid;grid-template-columns:auto auto;gap:4px 16px;font-size:13px;color:var(--ink-2);text-align:left}
  .keys b{color:var(--ink);font-weight:700}
  .stats{display:grid;grid-template-columns:auto auto;gap:4px 28px;font-size:17px;text-align:left;font-variant-numeric:tabular-nums}
  .stats span:nth-child(odd){color:var(--ink-2)}
  .note{font-size:12px;color:var(--ink-2);margin:0}
  .hall{position:absolute;top:16px;left:16px;font-size:14px;color:var(--ink);text-decoration:none;padding:6px 10px;border:3px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--pink)}
  .hall:hover,.hall:focus-visible{background:var(--sun);outline:none}
  @media (max-width:520px){.keys{font-size:12px}.card{padding:16px}}
  @media (max-height:460px){.card{gap:8px;padding:14px}.card h1{font-size:34px}.keys{font-size:11px}.note,.intro,.tdesc{display:none}.sub{font-size:14px}.stages button{font-size:12px;padding:4px 8px}.tset{font-size:13px;gap:4px 10px}.seg button{padding:3px 8px}}
  /* touch controls */
  body.touch, body.touch #game, #touch{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.touch #game, #touch{touch-action:none}
  #touch{position:absolute;inset:0;z-index:2;--stick:clamp(116px,24vmin,180px);--btn:clamp(84px,17vmin,132px)}
  #stick,#stickHint{position:absolute;width:var(--stick);height:var(--stick);border-radius:50%;pointer-events:none;box-sizing:border-box}
  #stick{margin:calc(var(--stick) / -2) 0 0 calc(var(--stick) / -2);border:3px solid rgba(74,43,107,.55);background:rgba(255,255,255,.3);display:none}
  #knob{position:absolute;left:28%;top:28%;width:44%;height:44%;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink);box-sizing:border-box}
  #stickHint{left:calc(26px + env(safe-area-inset-left,0px));bottom:12%;border:3px dashed rgba(74,43,107,.4);background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px;font-weight:700;color:rgba(74,43,107,.8);line-height:1.25}
  #lookHint{position:absolute;right:calc(24px + env(safe-area-inset-right,0px));top:24%;font-size:13px;font-weight:700;color:rgba(74,43,107,.8);background:rgba(255,255,255,.5);padding:4px 10px;border:2px dashed rgba(74,43,107,.4);pointer-events:none;transition:opacity .6s}
  #stickHint.off,#lookHint.off{opacity:0}
  #stickHint.off{display:none}
  .tb{position:absolute;border-radius:50%;padding:0;font-size:15px;box-shadow:0 3px 0 var(--ink);background:rgba(255,250,242,.82);touch-action:none}
  .tb.on{background:var(--sun);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
  #tFire{width:var(--btn);height:var(--btn);right:calc(20px + env(safe-area-inset-right,0px));bottom:14%;background:rgba(255,127,176,.88);color:#fff;font-size:18px}
  #tUse{width:calc(var(--btn) * .64);height:calc(var(--btn) * .64);right:calc(var(--btn) + 34px + env(safe-area-inset-right,0px));bottom:calc(14% + var(--btn) * .12)}
  #tTurn{width:calc(var(--btn) * .58);height:calc(var(--btn) * .58);right:calc(var(--btn) + 40px + env(safe-area-inset-right,0px));bottom:calc(14% + var(--btn) * .76 + 14px);font-size:13px}
  #tToy{width:calc(var(--btn) * .58);height:calc(var(--btn) * .58);right:calc(var(--btn) * .21 + 20px + env(safe-area-inset-right,0px));bottom:calc(14% + var(--btn) + 14px)}
  .tb.sm{width:46px;height:46px;font-size:12px;top:calc(12px + env(safe-area-inset-top,0px))}
  #tPause{right:calc(14px + env(safe-area-inset-right,0px))}
  #tMap{right:calc(70px + env(safe-area-inset-right,0px))}
  .tset{display:grid;grid-template-columns:auto auto;gap:6px 12px;align-items:center;font-size:14px;text-align:left}
  .tset > span{color:var(--ink-2)}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{font-size:13px;padding:4px 10px;background:#fff;box-shadow:0 2px 0 var(--ink);border-width:2px}
  .seg button.cur{background:var(--mint)}
  @media (orientation:portrait){
    body.touch #wrap{align-items:flex-start;padding-top:calc(56px + env(safe-area-inset-top,0px))}
    #tFire{bottom:calc(60px + env(safe-area-inset-bottom,0px))} #tUse{bottom:calc(36px + env(safe-area-inset-bottom,0px))}
    #tTurn{bottom:calc(36px + var(--btn) * .64 + 14px + env(safe-area-inset-bottom,0px))} #tToy{bottom:calc(60px + var(--btn) + 14px + env(safe-area-inset-bottom,0px))}
    #stickHint{bottom:calc(48px + env(safe-area-inset-bottom,0px))} #lookHint{top:auto;bottom:calc(60px + var(--btn) * 2 + env(safe-area-inset-bottom,0px));right:24px}
  }
</style>

<div id="wrap">
  <canvas id="game" width="400" height="225"></canvas>
  <div id="touch" hidden>
    <div id="stickHint">WALK<br>+ TURN</div>
    <div id="lookHint">DRAG HERE TO AIM</div>
    <div id="stick"><div id="knob"></div></div>
    <button type="button" class="tb" id="tFire" data-b="fire">FIRE</button>
    <button type="button" class="tb" id="tUse" data-b="use">USE</button>
    <button type="button" class="tb" id="tToy" data-b="toy">TOY</button>
    <button type="button" class="tb" id="tTurn" data-b="turn">180°</button>
    <button type="button" class="tb sm" id="tMap" data-b="map">MAP</button>
    <button type="button" class="tb sm" id="tPause" data-b="pause">II</button>
  </div>
  <div id="ov">
    <a class="hall" href="../index.html">&larr; Game Hall</a>
    <div class="card" id="card"></div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   COBBLE KEEP — a bright, blocky DOOM-style shooter. 5 stages.
   ===================================================================== */
const W = 400, H = 225, VH = 192, HALF = VH / 2;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(W, VH);
const buf = new Uint32Array(img.data.buffer);
const zbuf = new Float32Array(W);
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H), k = s >= 2 ? Math.floor(s) : s;
  cv.style.width = Math.floor(W * k) + 'px'; cv.style.height = Math.floor(H * k) + 'px';
}
addEventListener('resize', fit); fit();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rgb = (r, g, b, a = 255) => ((a << 24) | (clamp(b | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(r | 0, 0, 255)) >>> 0;
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a);
const nz = (R, a) => (R() * 2 - 1) * a;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const WHITE = [255, 255, 255];

/* ================= TEXTURES (16x16) ================= */
const TX = {};
function build(name, seed, maker) {
  const R = rng(seed), px = maker(R), t = new Uint32Array(256);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const c = px(x, y); t[y * 16 + x] = rgb(c[0], c[1], c[2], c[3] ?? 255); }
  TX[name] = t; return t;
}
function voronoi(R, count) {
  const pts = []; for (let i = 0; i < count; i++) pts.push([R() * 16, R() * 16, R()]);
  return (x, y) => { let d1 = 1e9, d2 = 1e9, cell = pts[0];
    for (const p of pts) for (const ox of [-16, 0, 16]) for (const oy of [-16, 0, 16]) { const d = Math.hypot(x + .5 - p[0] - ox, y + .5 - p[1] - oy); if (d < d1) { d2 = d1; d1 = d; cell = p; } else if (d < d2) d2 = d; }
    return { edge: d2 - d1, cell, d1 }; };
}
const plank = (base, dark) => R => { const sh = [0, 0, 0, 0].map(() => nz(R, 10)); return (x, y) => { const row = y >> 2; if (y % 4 === 3) return dark; if (x === (row * 5 + 3) % 16) return mix(dark, base, .5); const g = sh[row] + nz(R, 6); return [base[0] + g, base[1] + g * .85, base[2] + g * .6]; }; };
const wool = c => R => (x, y) => { const v = nz(R, 8) - (((x + y * 3) % 7 === 0) ? 14 : 0); return [c[0] + v, c[1] + v, c[2] + v]; };
const bricks = (b, m, jit = 12) => R => { const sh = []; for (let i = 0; i < 16; i++) sh.push(nz(R, jit)); return (x, y) => { const row = y >> 2, off = (row & 1) * 4; if (y % 4 === 3 || (x + off) % 8 === 7) return [m[0] + nz(R, 4), m[1] + nz(R, 4), m[2] + nz(R, 4)]; const s = sh[(row * 2 + (((x + off) >> 3) & 1)) & 15] + nz(R, 5); return [b[0] + s, b[1] + s, b[2] + s]; }; };
const tiles = (b, seam, sz = 8) => R => (x, y) => { if (x % sz === 0 || y % sz === 0) return seam; const v = nz(R, 5) + ((((x / sz) | 0) + ((y / sz) | 0)) & 1) * -6; return [b[0] + v, b[1] + v, b[2] + v]; };
const checker = (a, b) => R => (x, y) => { const c = (((x >> 3) + (y >> 3)) & 1) ? a : b, v = nz(R, 4); return [c[0] + v, c[1] + v, c[2] + v]; };

// --- ground & outdoor
build('grass', 101, R => (x, y) => { const v = nz(R, 12); if (R() < .05) return [150 + v, 228, 110]; if (R() < .015) return [255, 236, 110]; if (R() < .01) return [255, 150, 200]; return [104 + v, 200 + v, 82 + v * .5]; });
build('path', 102, R => (x, y) => { const v = nz(R, 10); if (R() < .07) return [190, 150, 110]; return [226 + v, 190 + v, 136 + v]; });
build('sand', 103, R => (x, y) => { const v = nz(R, 8); if (R() < .06) return [255, 240, 196]; return [246 + v, 222 + v, 160 + v]; });
build('sandPath', 104, tiles([236, 206, 146], [214, 180, 120]));
build('snow', 105, R => (x, y) => { const v = nz(R, 4); if (R() < .05) return [255, 255, 255]; if (R() < .05) return [214, 232, 255]; return [242 + v, 248 + v, 255]; });
build('iceFloor', 106, R => (x, y) => { const s = ((x + y * 2) % 13) < 2; const v = nz(R, 5); return s ? [230, 245, 255] : [176 + v, 218 + v, 255]; });
build('pinkGrass', 107, R => (x, y) => { const v = nz(R, 10); if (R() < .06) return [255, 220, 236]; if (R() < .02) return [255, 250, 160]; return [255, 164 + v, 206 + v * .5]; });
build('mint', 108, checker([184, 244, 214], [255, 255, 250]));
// --- indoor floors
build('tileFloor', 110, tiles([238, 232, 218], [206, 198, 184]));
build('planksFloor', 111, plank([222, 178, 118], [164, 120, 72]));
build('checkerPink', 112, checker([255, 190, 214], [255, 250, 252]));
build('carpet', 113, R => (x, y) => { if ((x + y) % 8 === 0 || (x - y + 16) % 8 === 0) return [255, 204, 110]; const v = nz(R, 5); return [228 + v, 88 + v, 124 + v]; });
build('sandTile', 114, tiles([240, 214, 156], [212, 180, 118]));
build('sandTile2', 115, tiles([226, 196, 136], [198, 164, 104], 4));
build('spruceFloor', 116, plank([176, 124, 80], [118, 80, 50]));
build('blueCarpet', 117, R => (x, y) => { if (y % 8 === 2 || y % 8 === 5) return [255, 255, 255]; const v = nz(R, 5); return [120 + v, 164 + v, 236]; });
build('chocoFloor', 118, R => (x, y) => { const e = x % 8 === 0 || y % 8 === 0, h = x % 8 === 1 || y % 8 === 1, v = nz(R, 4); return e ? [84, 48, 32] : h ? [160, 104, 72] : [128 + v, 78 + v, 52 + v]; });
// --- ceilings
build('ceilWood', 120, plank([204, 158, 106], [150, 108, 66]));
build('ceilCream', 121, R => (x, y) => { if (y === 15 || x === 0) return [236, 214, 190]; const v = nz(R, 3); return [255 + v, 244 + v, 226 + v]; });
build('ceilSand', 122, bricks([232, 206, 150], [208, 178, 118], 6));
build('ceilIce', 123, R => (x, y) => { const v = nz(R, 4); return ((x * 3 + y) % 17 < 2) ? [250, 254, 255] : [210 + v, 232 + v, 255]; });
build('ceilPink', 124, R => (x, y) => { const v = nz(R, 4); if (R() < .05) return [[255, 255, 255], [140, 220, 255], [255, 230, 120]][(R() * 3) | 0]; return [255, 206 + v, 228 + v]; });
build('ceilSpruce', 125, plank([160, 112, 72], [108, 72, 44]));
// --- walls
build('hedge', 130, R => (x, y) => { const v = nz(R, 14); if (R() < .16) return [62, 150, 70]; if (R() < .035) return [255, 160, 200]; if (R() < .02) return [255, 240, 120]; return [100 + v, 198 + v, 90 + v * .5]; });
build('grassBlock', 131, R => (x, y) => { const v = nz(R, 10); if (y < 3 || (y === 3 && R() < .5)) return [112 + v, 204 + v, 84]; if (R() < .08) return [140, 110, 90]; return [186 + v, 132 + v, 88 + v]; });
build('planks', 132, plank([236, 192, 132], [176, 130, 80]));
build('log', 133, R => (x, y) => { const v = nz(R, 8); if (x % 4 === 0) return [128 + v, 86 + v, 54]; return [170 + v, 120 + v, 76 + v]; });
build('cobble', 134, R => { const v = voronoi(R, 9); return (x, y) => { const o = v(x, y); if (o.edge < 1) return [150, 152, 166]; const b = 196 + o.cell[2] * 40 + nz(R, 6) - o.d1 * 2; return [b, b, b + 6]; }; });
build('creamBrick', 135, bricks([242, 214, 178], [255, 246, 232]));
build('bookshelf', 136, R => { const cols = [[255, 110, 140], [110, 170, 255], [120, 220, 140], [255, 210, 90], [190, 130, 255], [255, 160, 90]]; const book = []; for (let i = 0; i < 32; i++) book.push(cols[(R() * cols.length) | 0]); const pl = plank([236, 190, 130], [176, 130, 80])(R); return (x, y) => { if (y < 2 || y > 13 || y === 7 || y === 8) return pl(x, y); const bi = (y < 7 ? 0 : 16) + (x >> 1); const top = (y < 7 ? 2 : 9) + ((bi * 7) % 3 === 0 ? 1 : 0); if (y < top || (x % 2 === 1 && bi % 3 === 0)) return [120, 84, 56]; const c = book[bi], hl = y === top + 1 ? 40 : 0; return [c[0] + hl, c[1] + hl, c[2] + hl]; }; });
build('pinkWool', 137, wool([255, 172, 204]));
build('blueWool', 138, wool([142, 192, 255]));
build('yellowWool', 139, wool([255, 222, 112]));
build('sandstone', 140, R => (x, y) => { const v = nz(R, 5); if (y % 8 === 0) return [214, 182, 120]; if (y % 8 === 1) return [252, 230, 172]; return [240 + v, 214 + v, 152 + v]; });
build('chiseled', 141, R => (x, y) => { const v = nz(R, 4), b = [240 + v, 214 + v, 152 + v]; const e = x === 0 || y === 0 || x === 15 || y === 15; if (e) return [206, 172, 110]; const inner = x >= 3 && x <= 12 && y >= 3 && y <= 12; if (inner && (x === 3 || x === 12 || y === 3 || y === 12)) return [210, 176, 114]; if (x >= 6 && x <= 9 && y >= 6 && y <= 9) return (x === 6 || x === 9 || y === 6 || y === 9) ? [90, 190, 200] : [150, 230, 236]; return b; });
build('ice', 142, R => (x, y) => { const v = nz(R, 5); if ((x + y) % 12 < 2 && x > 1 && x < 14) return [232, 246, 255]; if (x === 0 || y === 0) return [196, 228, 255]; return [150 + v, 204 + v, 250]; });
build('snowBrick', 143, bricks([236, 244, 255], [182, 204, 232], 5));
build('spruce', 144, plank([168, 118, 74], [112, 76, 46]));
build('candy', 145, R => (x, y) => { const s = (((x + y) >> 2) & 1), v = nz(R, 4); return s ? [244 + v, 70 + v, 96 + v] : [255, 246 + v, 246 + v]; });
build('cake', 146, R => (x, y) => { const v = nz(R, 5); if (y < 4 || (y === 4 && (x % 5) < 2)) { if (y < 4 && R() < .12) return [[120, 200, 255], [255, 240, 120], [140, 230, 150], [255, 255, 255]][(R() * 4) | 0]; return [255, 176 + v, 206 + v]; } if (y === 9 || y === 10) return [255, 248 + v, 232]; return [246 + v, 206 + v, 146 + v]; });
build('chocolate', 147, R => (x, y) => { const e = x % 8 === 7 || y % 8 === 7, h = x % 8 === 0 || y % 8 === 0, v = nz(R, 4); return e ? [88, 50, 34] : h ? [170, 112, 78] : [134 + v, 84 + v, 56 + v]; });
build('door', 150, R => (x, y) => { if (x === 0 || x === 15 || y === 0) return [150, 98, 62]; const heart = [[6, 3], [7, 3], [9, 3], [10, 3], [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4], [11, 4], [6, 5], [7, 5], [8, 5], [9, 5], [10, 5], [7, 6], [8, 6], [9, 6], [8, 7]]; if (heart.some(([a, b]) => a === x && b === y)) return [255, 120, 160]; if (x === 12 && (y === 9 || y === 10)) return [255, 214, 90]; const g = nz(R, 6) + (x % 4 === 3 ? -34 : 0); return [236 + g, 186 + g, 124 + g * .7]; });
function keyDoor(c) { return R => { const d = TX.door; return (x, y) => { if (x <= 1 || x >= 14 || y <= 1) return mix(c, WHITE, (x + y) % 3 === 0 ? .35 : 0); if (x >= 5 && x <= 10 && y >= 8 && y <= 13) { if ((x === 7 || x === 8) && y >= 10 && y <= 12) return [60, 40, 70]; return c; } const k = d[y * 16 + x]; return [k & 255, k >> 8 & 255, k >> 16 & 255]; }; }; }
const KEYCOL = { r: [255, 80, 100], e: [80, 150, 255], y: [255, 206, 40] };
build('door1', 151, keyDoor(KEYCOL.r)); build('door2', 152, keyDoor(KEYCOL.e)); build('door3', 153, keyDoor(KEYCOL.y));
function goalTex(on) { return R => (x, y) => {
  if (x <= 1 || x >= 14 || y <= 1 || y >= 14) return ((x + y) & 1) ? [255, 206, 60] : [255, 236, 140];
  const cx = x - 7.5, cy = y - 7.8, a = Math.atan2(cy, cx), r = Math.hypot(cx, cy), lim = 2.6 + 2.6 * Math.pow(Math.abs(Math.cos(2.5 * a + Math.PI / 4)), 3);
  if (r < lim) return on ? [255, 255, 200, 254] : [255, 216, 80, 254];
  return on ? [140, 230, 255, 254] : [150, 110, 230]; }; }
build('goalOff', 154, goalTex(false)); build('goalOn', 155, goalTex(true));

  if (boss && boss.state !== 'idle' && boss.state !== 'dead') {
    const bw = 160, bx = (W - bw) / 2, by = 16;
    text('JELLY KING', (W / 2 - tw('JELLY KING') / 2) | 0, 6, '#ffffff');
    ctx.fillStyle = '#4a2b6b'; ctx.fillRect(bx - 2, by - 2, bw + 4, 8); ctx.fillStyle = '#ffd3e6'; ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = '#ff5ab0'; ctx.fillRect(bx, by, bw * Math.max(0, boss.hp) / boss.T.hp, 4);
  }
  if (showMap) drawMap();
  if (!locked && !touchMode && state === 'play' && !p.dead) { const s = 'CLICK TO CAPTURE MOUSE'; text(s, (W / 2 - tw(s) / 2) | 0, VH - 12, '#ffffff'); }
}

/* ================= FLOW: TITLE / STAGES / RESULTS ================= */
let state = 'title', last = 0, stageStart = null, runTime = 0, unlocked = 1;
try { unlocked = clamp(parseInt(localStorage.getItem('cobblekeep.unlocked') || '1', 10) || 1, 1, 5); } catch (e) { }
function saveUnlock(n) { unlocked = Math.max(unlocked, Math.min(5, n)); try { localStorage.setItem('cobblekeep.unlocked', String(unlocked)); } catch (e) { } }
const ov = document.getElementById('ov'), card = document.getElementById('card');
const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let primaryAction = () => { };
function beginStage(i, L) {
  audioInit();
  const s = loadStage(i); player = mkPlayer(s[0], s[1], L); stageStart = { i, L: JSON.parse(JSON.stringify(L)) };
  flow = null; time = 0; mStep = 0;
  say(`STAGE ${i + 1}: ${ST.name.toUpperCase()}`); setTimeout(() => { if (state === 'play' && SI === i) say(ST.tip.toUpperCase()); }, 1400);
  state = 'play'; ov.hidden = true; resetTouch(); goFullscreen(); tryLock(); last = performance.now();
}
function resume() { audioInit(); state = 'play'; ov.hidden = true; resetTouch(); goFullscreen(); tryLock(); last = performance.now(); }
function pause() {
  if (state !== 'play') return; state = 'paused'; mouseDown = false; resetTouch();
  if (document.pointerLockElement) document.exitPointerLock();
  pauseCard();
}
function pauseCard() {
  showCard(`<div class="eyebrow">Paused · Stage ${SI + 1}</div><h1>${ST.name}</h1>
    <p class="sub">Popped ${stats.kills}/${stats.killsT} · Treats ${stats.items}/${stats.itemsT} · ${fmt(stats.time)}</p>
    <button id="go" type="button">Resume</button>${settingsHTML()}<button id="quit" type="button" style="font-size:14px;background:#fff">Back to title</button>`, resume);
  document.getElementById('quit').onclick = titleScreen;
  bindSettings(pauseCard);
}
function stageClear() {
  if (state !== 'play') return; mouseDown = false; runTime += stats.time;
  if (document.pointerLockElement) document.exitPointerLock();
  saveUnlock(SI + 2);
  const last5 = SI === STAGES.length - 1, carry = loadoutOf(player);
  state = last5 ? 'end' : 'inter';
  const rows = `<div class="stats"><span>Popped</span><span>${stats.kills} / ${stats.killsT}</span><span>Treats</span><span>${stats.items} / ${stats.itemsT}</span><span>Secrets</span><span>${stats.secrets} / ${stats.secretsT}</span><span>Time</span><span>${fmt(stats.time)}</span></div>`;
  if (last5) showCard(`<div class="eyebrow">All 5 stages cleared</div><h1>You did it!</h1><p class="sub">The Jelly King is popped and Cobble Keep is sweet again.</p>${rows}<button id="go" type="button">Play again</button>`, titleScreen);
  else showCard(`<div class="eyebrow">Stage ${SI + 1} clear!</div><h1>${ST.name}</h1>${rows}<p class="note">Next: Stage ${SI + 2} · ${STAGES[SI + 1].name}</p><button id="go" type="button">Next stage</button>`, () => beginStage(SI + 1, carry));
}
function stageFail() {
  if (state !== 'play') return; state = 'dead'; mouseDown = false;
  if (document.pointerLockElement) document.exitPointerLock();
  showCard(`<div class="eyebrow">Stage ${SI + 1} · ${ST.name}</div><h1>Oof!</h1><p class="sub">You got bonked. Try the stage again with the toys you started it with.</p><button id="go" type="button">Try again</button><button id="quit" type="button" style="font-size:14px;background:#fff">Back to title</button>`, () => beginStage(stageStart.i, stageStart.L));
  document.getElementById('quit').onclick = titleScreen;
}
function showCard(html, onGo) {
  card.innerHTML = html; ov.hidden = false;
  const b = document.getElementById('go'); b.onclick = onGo; primaryAction = onGo; b.focus();
}
function settingsHTML() {
  if (!touchMode) return '';
  const seg = (k, v, label) => `<button type="button" data-set="${k}:${v}" class="${String(TS[k]) === String(v) ? 'cur' : ''}">${label}</button>`;
  return `<div class="tset"><span>Controls</span><div class="seg">${seg('scheme', 'easy', 'Easy')}${seg('scheme', 'dual', 'Dual stick')}</div>
    <span>Turn speed</span><div class="seg">${seg('turn', .6, 'Slow')}${seg('turn', 1, 'Normal')}${seg('turn', 1.5, 'Fast')}</div>
    <span>Auto-fire</span><div class="seg">${seg('autofire', true, 'On')}${seg('autofire', false, 'Off')}</div></div>
    <p class="sub tdesc" style="font-size:13px;max-width:46ch">${TS.scheme === 'easy'
      ? 'Easy: the left stick walks forward/back and turns left/right. Drag on the right side for fine aiming. Doors open when you walk into them.'
      : 'Dual stick: the left stick walks and sidesteps. Drag on the right side to turn. Doors open when you walk into them.'}</p>`;
}
function bindSettings(rerender) {
  card.querySelectorAll('[data-set]').forEach(b => b.onclick = () => {
    const [k, v] = b.dataset.set.split(':'); TS[k] = k === 'scheme' ? v : k === 'turn' ? +v : v === 'true';
    saveTS(); updateHints(); rerender();
  });
}
function titleScreen() {
  state = 'title';
  if (document.pointerLockElement) document.exitPointerLock();
  const btns = STAGES.map((s, i) => `<button type="button" data-s="${i}" ${i + 1 > unlocked ? 'disabled' : ''} class="${i + 1 === unlocked ? 'cur' : ''}">${i + 1}. ${i + 1 > unlocked ? 'Locked' : s.name}</button>`).join('');
  showCard(`<div class="eyebrow">5 stages · ${touchMode ? 'Touch controls' : 'Keyboard + mouse'}</div><h1>Cobble Keep</h1>
    <p class="sub intro">Bonk jellies, collect keys and ring the goal block at the end of each stage.</p>
    <button id="go" type="button">${unlocked > 1 ? `Continue · Stage ${unlocked}` : 'Start'}</button>
    <div class="stages">${btns}</div>
    ${touchMode
      ? settingsHTML()
      : `<div class="keys"><b>WASD</b><span>move · Shift run</span><b>Mouse</b><span>look · click to shoot</span><b>E / Space</b><span>open doors · ring goal</span><b>1 2 3 4</b><span>hammer · bubbles · confetti · stars</span><b>Tab / M</b><span>map · N music</span><b>Arrows</b><span>turn without a mouse</span></div>`}
    <p class="note">Some walls are not what they seem.</p>`, () => beginStage(unlocked - 1, STAGES[unlocked - 1].loadout));
  card.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const i = +b.dataset.s; beginStage(i, STAGES[i].loadout); });
  bindSettings(titleScreen);
}

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  TZ.hidden = !(touchMode && state === 'play');
  if (state === 'play') {
    time += dt; stats.time += dt;
    updatePlayer(dt); updateDoors(dt); updateEnemies(dt); updateProjs(dt);
    muzzle = Math.max(0, muzzle - dt * 9); lightBoost = muzzle; shake = Math.max(0, shake - dt);
  } else if (state === 'title') { time += dt; player.a += dt * .15; }
  const sx = shake > 0 ? rnd(-2, 2) * shake * 8 : 0, sy = shake > 0 ? rnd(-2, 2) * shake * 8 : 0;
  ctx.save(); ctx.translate(sx | 0, sy | 0);
  render(); if (state !== 'title') drawWeapon(); drawOverlay(state === 'play' ? dt : 0);
  ctx.restore();
  drawHUD();
  requestAnimationFrame(frame);
}
// live scene behind the title card: a slow pan around the meadow
{ const s = loadStage(0); player = mkPlayer(s[0] + 3, s[1] + 3, STAGES[0].loadout); }
titleScreen();
requestAnimationFrame(frame);
</script>
</html>
