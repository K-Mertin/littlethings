<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ㄅㄆㄇ 小島</title>
<meta name="theme-color" content="#e4f1e6">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e4f1e6;      /* 作業簿的淡綠 */
  --grid:#9fcfa9;       /* 格線 */
  --ink:#1c3765;        /* 深藍墨水 */
  --blue:#2468c2;       /* 小藍企鵝的藍 */
  --red:#e0392b;        /* 紅筆 */
  --sun:#ffc93c;        /* 星星 */
  --card:#ffffff;
  --mute:#5d7a8e;
  --good:#2e9d57;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Sans TC",serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:clip}
body{min-height:100%;overflow-x:clip}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed;
  color:var(--ink);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
/* 整頁一起捲（不用內層捲動區）：平板全螢幕時內層捲動區可能拉不動 */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#head{position:sticky;top:0;z-index:10;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
#wtones,#rp{scroll-margin-top:210px;scroll-margin-bottom:16px}

/* 上方列 */
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:76px}
.round{width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 #b7d5bd;font-size:30px;display:grid;place-items:center;flex:none}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 #b7d5bd}
#hall{font-size:15px;font-weight:700;width:auto;padding:0 18px;border-radius:32px;height:52px}
#stars{margin-left:auto;white-space:nowrap;font-weight:900;font-size:22px;background:var(--card);border-radius:30px;padding:8px 16px;box-shadow:0 3px 0 #b7d5bd}
#gear{position:relative;overflow:hidden}
#gear .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(36,104,194,.25)}
.hide{display:none!important}

/* 小藍與對話泡泡 */
#stage{display:flex;align-items:center;gap:10px;padding:0 14px 6px;min-height:112px}
#bird{width:104px;height:104px;flex:none}
#bird svg{width:100%;height:100%;overflow:visible}
#bird.talk .beakTop{transform:translateY(-1.5px)}
#bird.talk .beakBot{transform:translateY(3px)}
.beakTop,.beakBot{transition:transform .09s}
#bird.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}}
#bubble{position:relative;background:var(--card);border-radius:22px;padding:14px 20px;font-size:22px;font-weight:700;line-height:1.4;max-width:640px;box-shadow:0 3px 0 #b7d5bd}
#bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--card);border-left:0}
#bubble:empty{visibility:hidden}

#view{flex:1;padding:4px 14px 24px;overflow-x:clip}
.center{display:flex;flex-direction:column;align-items:center;gap:22px}

/* 首頁 */
#home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:900px;margin:0 auto}
.tile{background:var(--card);border-radius:28px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #b7d5bd;min-height:148px;justify-content:center}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #b7d5bd}
.tile .big{font-family:var(--kai);font-size:62px;line-height:1.05;color:var(--blue)}
.tile .emo{font-size:56px;line-height:1.05}
.tile .lab{font-size:22px;font-weight:900}
.tile.t1 .big{color:var(--blue)} .tile.t2{--c:#e0392b}
@media (max-width:620px){#home{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:140px}.tile .big,.tile .emo{font-size:48px}}

/* 注音格：方格＋右邊放聲調的窄格 */
.zg{position:relative;display:inline-grid;place-items:center;font-family:var(--kai);font-weight:700;color:var(--ink);background:var(--card);
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),#cfe7d4 calc(50% - 1px),#cfe7d4 calc(50% + 1px),transparent calc(50% + 1px)),
                   linear-gradient(transparent calc(50% - 1px),#cfe7d4 calc(50% - 1px),#cfe7d4 calc(50% + 1px),transparent calc(50% + 1px));
  border:3px solid var(--grid);border-radius:14px}

/* 學注音 */
.tabs{display:flex;gap:10px;justify-content:center;margin:2px 0 16px;flex-wrap:wrap}
.tab{background:var(--card);border-radius:30px;padding:12px 24px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #b7d5bd;min-height:56px}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 #17488a}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;max-width:1000px;margin:0 auto}
.sym{aspect-ratio:1;font-size:56px;box-shadow:0 4px 0 #b7d5bd}
.sym:active{transform:translateY(2px)}
.sym.heard::after{content:"";position:absolute;right:7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--good)}
.sym .gl{font-size:12px;position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--ui);color:var(--mute);font-weight:700}
.grouplabel{max-width:1000px;margin:14px auto 8px;font-weight:900;font-size:18px;color:var(--mute)}

/* 詳細卡 */
#sheet{position:fixed;inset:0;background:rgba(28,55,101,.35);display:grid;place-items:center;z-index:20;padding:16px}
#sheet .card{background:var(--card);border-radius:32px;padding:28px 34px;display:flex;align-items:center;gap:34px;max-width:94vw;box-shadow:0 8px 0 #b7d5bd;flex-wrap:wrap;justify-content:center}
#sheet .zg{width:190px;height:190px;font-size:150px}
#sheet .ex{display:flex;flex-direction:column;align-items:center;gap:6px}
#sheet .ex .emo{font-size:110px;line-height:1}
#sheet .acts{display:flex;gap:12px;width:100%;justify-content:center}

/* 詞＋注音（直排在字的右邊） */
.wz{display:inline-flex;align-items:center;gap:2px;font-family:var(--kai)}
.wz .hz{font-size:1em;line-height:1}
.syl{display:inline-flex;align-items:center;font-family:var(--kai);font-weight:700}
.syl .col{display:flex;flex-direction:column;line-height:1;align-items:center}
.syl .col i{font-style:normal;font-size:.36em}
.syl .tn{font-size:.3em;margin-left:.02em;align-self:center}
.syl .neu{font-size:.3em;line-height:.6}
.syl.lit .col i.on{color:var(--red)}
.wz .syl{margin-right:.12em}

/* 題目 */
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--grid)}
.dots span.done{background:var(--sun);border-color:#e3a800}
.opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.opt{width:150px;height:150px;font-size:110px;box-shadow:0 5px 0 #b7d5bd}
.opt:active{transform:translateY(3px)}
.opt.ok{border-color:var(--good);background-color:#e6f7ec;animation:pop .45s}
.opt.no{animation:shake .4s;opacity:.45}
.opt.glow{border-color:var(--sun);box-shadow:0 0 0 8px rgba(255,201,60,.55),0 5px 0 #b7d5bd}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.say{background:var(--blue);color:#fff;border-radius:40px;padding:14px 28px;font-size:24px;font-weight:900;box-shadow:0 4px 0 #17488a;min-height:64px;display:inline-flex;align-items:center;gap:10px}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 #17488a}
.say.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 #b7d5bd}
.pic{background:var(--card);border-radius:32px;padding:14px 30px;display:flex;align-items:center;gap:22px;box-shadow:0 5px 0 #b7d5bd}
.pic .emo{font-size:120px;line-height:1}
.pic .w{font-family:var(--kai);font-size:84px;font-weight:700}

/* 拼拼看 */
.slots{display:flex;align-items:center;gap:4px}
.slotcol{display:flex;flex-direction:column;gap:8px}
.slot{width:104px;height:104px;font-size:80px;border-style:dashed}
.slot.fill{border-style:solid;border-color:var(--blue);animation:pop .35s}
.slot.next{border-color:var(--sun);box-shadow:0 0 0 6px rgba(255,201,60,.4)}
.slot .ghost{color:#cfe2d4}
.tonebox{width:46px;font-family:var(--kai);font-size:64px;font-weight:700;color:var(--red);text-align:center;min-height:64px}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:720px}
.tilez{width:104px;height:104px;font-size:76px;box-shadow:0 4px 0 #b7d5bd}
.tilez.used{visibility:hidden}
.tilez.no{animation:shake .4s}
.sylgroup{display:flex;align-items:center;gap:4px;padding:6px;border-radius:18px;opacity:.55}
.sylgroup.cur,.sylgroup.done{opacity:1}.sylgroup.cur{background:rgba(255,255,255,.6)}
.sylch{font-family:var(--kai);font-size:56px;font-weight:700;margin-right:6px}
.two .slots{gap:14px}.two .slot{width:84px;height:84px;font-size:64px}.two .tonebox{width:34px;font-size:52px}
.two .pic .emo{font-size:84px}.two .pic .w{font-size:60px}.two .slotcol{gap:6px}
.combogrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.combo .syl .col i{font-size:44px}.optc .syl .col i{font-size:58px}

/* 練習島 */
.maptabs{position:relative;z-index:2}
.pracgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;max-width:960px;margin:0 auto}
.pcard{position:relative;background:var(--card);border-radius:22px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 #b7d5bd;min-height:130px;justify-content:center;border:3px solid transparent}
.pcard .pe{font-family:var(--kai);font-size:40px;font-weight:700;line-height:1.1}.pcard .pt{font-weight:900;font-size:19px}
.pcard.done{border-color:var(--good);background:#f2fbf4}.pcard .pd{position:absolute;top:6px;right:10px;font-size:15px;font-weight:900}
.pcard.lock{opacity:.5}
.hzopt{font:inherit;font-size:64px;font-weight:700;color:var(--ink);background:#fff;border:3px solid #cfe3d3;border-radius:22px;padding:14px 26px;min-width:140px;box-shadow:0 5px 0 #b9d8bf;cursor:pointer;font-family:var(--kai)}
.hzopt.ok{border-color:#2fa35a;background:#e6f7ea}.hzopt.no{opacity:.45}.hzopt.glow{animation:pulse 1.2s infinite;border-color:#e3a800}
.hzemo{font-size:56px;margin-left:12px}
.storypage.oline{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;justify-content:center;align-items:flex-end;min-height:120px}
.oslot{min-width:90px;min-height:96px;border:3px dashed #b9d8bf;border-radius:16px;display:flex;align-items:center;justify-content:center;padding:4px 8px}
.oslot.next{border-color:#e3a800;background:#fff8dc}.oslot.fill{border-style:solid;border-color:#2fa35a;background:#f0faf2}
.otiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.otile,.oslot{font-size:52px}
.otile{background:#fff;border:3px solid #cfe3d3;border-radius:18px;padding:6px 12px;box-shadow:0 5px 0 #b9d8bf}
.otile.used{visibility:hidden}.otile.no{animation:shake .4s}.otile.glow{border-color:#e3a800;animation:pulse 1.2s infinite}
@media (max-width:620px){.hzopt{font-size:44px;min-width:96px;padding:10px 14px}.oslot{min-width:64px;min-height:80px}.otile,.oslot{font-size:36px}}
.pcard.cur{border-color:#e3a800;background:#fff8dc;animation:pulse 1.6s infinite}
.pcard .pnum{font-size:14px;font-weight:900;color:var(--mute)}
.pairrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.paircol{display:flex;flex-direction:column;align-items:center;gap:10px}
.vs{font-size:40px;color:var(--mute);font-weight:900}
.pairsym.lit{background-color:#fff3c4;border-color:#e3a800;transform:scale(1.06)}
@media (max-width:620px){.pairrow{gap:6px;flex-wrap:nowrap}.vs{font-size:24px}.paircol .tbig{width:96px;height:96px;font-size:72px}.paircol .pic{flex-direction:column;padding:8px 12px;gap:2px;min-width:0}.paircol .pic .emo{font-size:52px}.paircol .pic .w{font-size:40px}}
@media (max-width:520px){.pracgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pcard .pe{font-size:32px}.pcard .pt{font-size:16px}}

/* 課程 */
#ltag{font-weight:900;font-size:18px;background:var(--card);border-radius:30px;padding:8px 14px;box-shadow:0 3px 0 #b7d5bd;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
#ltag span{opacity:.35;font-size:20px}#ltag span.d{opacity:1}#ltag span.c{opacity:1;transform:scale(1.25)}
.maptile{grid-column:1/-1;flex-direction:row;min-height:96px;gap:18px;background:var(--blue);color:#fff;box-shadow:0 5px 0 #17488a}
.maptile .lab{font-size:28px}.maptile .sub{font-size:20px;font-weight:700;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px}
.lmap{position:relative;max-width:1000px;margin:0 auto}
.lpath{position:absolute;left:0;top:0}
.lnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.lnode .lc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;background:var(--card);border:4px solid var(--grid);box-shadow:0 4px 0 #b7d5bd}
.lnode .lt{font-family:var(--kai);font-weight:700;font-size:20px;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:10px;padding:0 6px}
.lnode.done .lc{background:#e6f7ec;border-color:var(--good)}
.lnode.cur .lc{background:var(--sun);border-color:#e3a800;animation:pulse 1.6s infinite}
.lnode.lock{opacity:.55}.lnode.lock .lc{font-size:28px}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,201,60,.35),0 4px 0 #b7d5bd}}
.lcard{background:var(--card);border-radius:32px;padding:26px 44px;text-align:center;box-shadow:0 6px 0 #b7d5bd}
.lnum{font-size:24px;font-weight:900;color:var(--mute)}.ltitle{font-family:var(--kai);font-size:84px;font-weight:700;letter-spacing:.08em;line-height:1.2}
.lsteps{display:flex;gap:8px;justify-content:center;align-items:center;font-size:34px;margin-top:8px}.lsteps i{font-style:normal;color:var(--mute);font-size:24px}
.lsym.seen{border-color:var(--good)}
.rtitle{font-size:26px;font-weight:900;margin:0 0 14px}
@media (max-width:520px){#ltag{font-size:14px;padding:6px 10px}#ltag span{font-size:16px}.ltitle{font-size:56px}.lcard{padding:18px 20px}.lnode .lc{width:68px;height:68px;font-size:26px}.lnode .lt{font-size:16px}.maptile .lab{font-size:22px}}

/* 小故事 */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;max-width:900px;margin:0 auto}
.sbook{position:relative;background:var(--card);border-radius:24px 10px 10px 24px;border-left:14px solid var(--blue);padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 #b7d5bd;min-height:170px;justify-content:center}
.sbook:nth-child(4n+2){border-left-color:var(--red)}.sbook:nth-child(4n+3){border-left-color:var(--good)}.sbook:nth-child(4n+4){border-left-color:#e3a800}
.readcard{background:var(--card);border-radius:28px;padding:10px 34px;box-shadow:0 5px 0 #b7d5bd;display:flex;align-items:center;gap:8px;font-size:200px;min-height:220px}
.readcard .syl .col i{font-size:.4em}.readcard .syl .tn{font-size:.3em}.readcard .syl .neu{font-size:.3em}
.readcard.shown{font-size:110px;animation:pop .4s}.readcard.shown .syl .col i{font-size:.36em}
.ropt .emo{font-size:96px}.ropt{padding:14px 22px}.ropt.ok{background:#e6f7ec;animation:pop .45s}.ropt.no{animation:shake .4s;opacity:.45}
.ropt.glow{box-shadow:0 0 0 8px rgba(255,201,60,.55),0 5px 0 #b7d5bd}
.sbook .emo{font-size:70px;line-height:1}.sbook .bt{font-family:var(--kai);font-size:30px;font-weight:700}.sbook .done{position:absolute;right:10px;top:8px;font-size:26px}
.storypage{background:var(--card);border-radius:28px;padding:18px 26px 22px;box-shadow:0 5px 0 #b7d5bd;max-width:min(980px,100%);display:flex;flex-direction:column;align-items:center;gap:8px}
.semo{font-size:96px;line-height:1.1;letter-spacing:8px}
.sline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:64px;row-gap:6px}
.sw{display:inline-flex;align-items:center;border-radius:14px;padding:2px 4px}
.sw.lit{background:#fff3c4}.sw.notap{cursor:default}
.sc{display:inline-flex;align-items:center;font-family:var(--kai);font-weight:700;transition:color .15s}
.sc .hz{line-height:1}.sc .syl{font-size:1em;margin-left:1px}
.sc .syl .col i{font-size:.42em}.sc .syl .tn{font-size:.34em}.sc .syl .neu{font-size:.34em}
.sc.on .hz{color:var(--red)}
.punct{font-family:var(--kai);font-weight:700;margin:0 2px}
.snav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.snav .say:disabled{opacity:.35}
.qopt .emo{font-size:80px}.qopt .w{font-size:52px}.qopt.ok{background:#e6f7ec;animation:pop .45s}.qopt.no{animation:shake .4s;opacity:.45}
.qopt.glow{box-shadow:0 0 0 8px rgba(255,201,60,.55),0 5px 0 #b7d5bd}
@media (max-width:520px){.readcard{font-size:140px;min-height:150px}.readcard.shown{font-size:80px}.ropt .emo{font-size:64px}.ropt{padding:10px 12px}.sline{font-size:40px}.semo{font-size:64px}.storypage{padding:12px 10px 14px}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sbook .emo{font-size:52px}.sbook .bt{font-size:24px}
  .qopt{padding:8px 14px}.qopt .emo{font-size:56px}.qopt .w{font-size:36px}}

/* 換好朋友 */
#pal{font-size:28px}
.palcard{flex-direction:column}
.paltitle{font-family:var(--kai);font-size:36px;font-weight:700}
.pals{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.pal{background:#f4f8f5;border:4px solid transparent;border-radius:24px;padding:10px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:20px}
.pal .palsvg{width:110px;height:110px;display:block}.pal .palsvg svg{width:100%;height:100%}
.pal.on{border-color:var(--sun);background:#fff8dc}
#startBird{cursor:pointer}
@media (max-width:520px){.pal .palsvg{width:80px;height:80px}.pals{gap:8px}}

/* 教一教 */
.tcard{background:var(--card);border-radius:32px;padding:20px 24px;box-shadow:0 6px 0 #b7d5bd;display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1000px}
.tleft{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:300px}
.tbig{width:200px;height:200px;font-size:160px;cursor:pointer}
.ttip{display:flex;gap:8px;align-items:flex-start;font-size:20px;font-weight:700;line-height:1.5;background:#f1f6f2;border-radius:16px;padding:10px 14px;transition:background .2s}

function load(text) {
  text = ZY.spoken(text);
  const id = hash(text);
  if (!bufs.has(id)) {
    bufs.set(id, fetch('audio/' + id + '.mp3').then(r => r.ok ? r.arrayBuffer() : null)
      .then(ab => ab && ctx() ? new Promise((ok, no) => ctx().decodeAudioData(ab, ok, no)) : null).catch(() => null));
  }
  return bufs.get(id);
}
function stopAll() { token++; if (cur) { try { cur.stop(); } catch (e) {} cur = null; } if (window.speechSynthesis) speechSynthesis.cancel(); talking(false); }
function talking(on) { $('#bird').classList.toggle('talk', on); }
let beak = null;
function beakAnim(on) { clearInterval(beak); if (on) { let o = false; beak = setInterval(() => { o = !o; talking(o); }, 140); } else talking(false); }
async function play(text) {
  const my = token;
  const buf = await load(text);
  if (my !== token) return false;
  beakAnim(true);
  try {
    if (buf) {
      await new Promise(res => {
        const src = ctx().createBufferSource(); src.buffer = buf; src.connect(ctx().destination);
        src.onended = res; cur = src; src.start();
      });
    } else await fallback(text);
  } finally { beakAnim(false); }
  return my === token;
}
function fallback(text) {

    if (!window.speechSynthesis) return setTimeout(res, 600);
    const u = new SpeechSynthesisUtterance(ZY.spoken(text)); u.lang = 'zh-TW'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)); if (v) u.voice = v;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 380);
    speechSynthesis.speak(u);

/* 聽音找注音 */
function distractors(ans, pool, n) {
  const out = [];
  const conf = CONFUSE.find(c => c.includes(ans));
  const v = S.score[ans] || [0, 0];
  if (conf && v[0] >= 2) out.push(...shuffle(Array.from(conf).filter(c => c !== ans && pool.includes(c))).slice(0, 1));
  for (const c of shuffle(pool)) { if (out.length >= n) break; if (c !== ans && !out.includes(c) && !(conf && conf.includes(c) && v[0] < 2)) out.push(c); }
  return out;
}
SCREENS.listen = (o = {}) => {

    if (i >= N) return done();
    const all = o.pool || SYMBOLS.map(x => x.s);
    let s = queue.length && Math.random() < .6 ? queue.shift() : null;
    if (!s) { let k = 0; do { s = o.focus && Math.random() < .6 ? wpick(o.focus) : wpick(all); } while (s === last && k++ < 9); }
    last = s;
    let pool = all.filter(x => (groupOf(s) === 'c') === (groupOf(x) === 'c')); if (pool.length < 3) pool = all;
    const opts = shuffle([s, ...distractors(s, pool, 2)]);

function densePts(pts) { // 在轉角切開，每段用 Catmull-Rom 平滑，每 2 單位一點

    }
  }

    if (s.length < 2) continue;

      const p0 = s[Math.max(0, i - 1)], p1 = s[i], p2 = s[i + 1], p3 = s[Math.min(s.length - 1, i + 2)];
      const n = Math.max(2, Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 2));
      for (let k = 0; k < n; k++) {
        const t = k / n, t2 = t * t, t3 = t2 * t;
        out.push([0, 1].map(j => .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3)));
      }
    }

  }

}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const pathLen = d => d.reduce((s, p, i) => i ? s + dist(p, d[i - 1]) : 0, 0);
// 檢查一筆：起點、終點、沿路的檢查點都要依序經過；容忍度寬
function checkStroke(user, model) {
  if (user.length < 2) return false;
  const L = pathLen(model);
  if (pathLen(user) < Math.min(L * .45, L - 6)) return false;
  if (dist(user[0], model[0]) > 20 || dist(user[user.length - 1], model[model.length - 1]) > 22) return false;
  let last = 0;
  const step = Math.max(1, Math.round(10 / 2));
  for (let i = 0; i < model.length; i += step) {

    for (let j = 0; j < user.length; j++) { const d = dist(model[i], user[j]); if (d < best) { best = d; bi = j; } }
    if (best > 18) return false;
    if (bi < last - 6) return false;

  }

  for (const u of user) { let best = 1e9; for (const m of model) best = Math.min(best, dist(u, m)); if (best > 18) off++; }
  return off <= user.length * .15;
}

  const line = (d, w, color) => { g.save(); g.lineCap = g.lineJoin = 'round'; g.lineWidth = w * px; g.strokeStyle = color; g.beginPath(); d.forEach((p, k) => k ? g.lineTo(p[0] * px, p[1] * px) : g.moveTo(p[0] * px, p[1] * px)); g.stroke(); g.restore(); };
  const dot = (p, r, c) => { g.beginPath(); g.arc(p[0] * px, p[1] * px, r * px, 0, 7); g.fillStyle = c; g.fill(); };
  function draw() {
    g.clearRect(0, 0, cv.width, cv.height);
    if (hint) strokes.forEach(d => line(d, 9, '#e6eee8'));
    for (let i = 0; i < cur; i++) line(strokes[i], 8, '#1c3765');
    if (cur < strokes.length && (hint || miss >= 2)) dot(strokes[cur][0], 4.2, '#2e9d57');
    if (drawing) line(drawing, 6, '#2468c2');
  }
  const fit = () => { const r = box.getBoundingClientRect(); const dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; px = cv.width / 100; draw(); };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; };
  cv.addEventListener('pointerdown', e => { if (dead || cur >= strokes.length) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = [pos(e)]; draw(); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); if (dist(p, drawing[drawing.length - 1]) > .8) { drawing.push(p); draw(); } });
  cv.addEventListener('pointerup', () => {
    if (!drawing) return; const u = drawing; drawing = null;
    if (checkStroke(u, strokes[cur])) { cur++; chime(true); draw(); if (cur >= strokes.length) { dead = true; setTimeout(() => o.onDone && o.onDone(), 250); } }
    else { miss++; chime(false); draw(); if (o.onMiss) o.onMiss(miss); }
  });
  cv.addEventListener('pointercancel', () => { drawing = null; draw(); });
  requestAnimationFrame(fit);
  return { setHint(v) { hint = v; draw(); }, clear() { cur = 0; miss = 0; dead = false; draw(); }, get miss() { return miss; } };
}

async function animateStrokes(cv, s, my) {
  const g = cv.getContext('2d'); const r = cv.getBoundingClientRect(); const dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; const px = cv.width / 100;
  const strokes = strokesOf(s).map(densePts);
  const line = (d, w, c) => { g.save(); g.lineCap = g.lineJoin = 'round'; g.lineWidth = w * px; g.strokeStyle = c; g.beginPath(); d.forEach((p, k) => k ? g.lineTo(p[0] * px, p[1] * px) : g.moveTo(p[0] * px, p[1] * px)); g.stroke(); g.restore(); };
  for (let i = 0; i < strokes.length; i++) {
    for (let k = 2; k <= strokes[i].length + 1; k += 2) {
      if (my !== token) return;
      g.clearRect(0, 0, cv.width, cv.height);
      strokes.forEach(d => line(d, 9, '#eef3ef'));
      for (let j = 0; j < i; j++) line(strokes[j], 8, '#1c3765');
      line(strokes[i].slice(0, k), 8, '#2468c2');
      const p0 = strokes[i][0]; g.font = `900 ${8 * px}px Noto Sans TC,sans-serif`; g.fillStyle = '#e0392b'; g.textAlign = 'center'; g.fillText(i + 1, (p0[0] - 7) * px, (p0[1] - 4) * px);
      await sleep(24);
    }
    await sleep(320);
  }
}

  { id: 'sea', icon: '🌊', name: '海底', svg: `<defs><linearGradient id="gsea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd3f5"/><stop offset="1" stop-color="#1f6fb5"/></linearGradient></defs><rect width="160" height="100" fill="url(#gsea)"/><ellipse cx="80" cy="104" rx="100" ry="16" fill="#f1d38f"/><path d="M20 92 C16 80 26 74 20 62 M28 94 C32 82 24 76 30 66 M140 92 C136 80 146 74 140 60" stroke="#2f9e5b" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="60" cy="40" r="2" fill="#fff" opacity=".6"/><circle cx="64" cy="30" r="1.5" fill="#fff" opacity=".6"/><circle cx="110" cy="50" r="2.4" fill="#fff" opacity=".5"/>` },
  { id: 'space', icon: '🚀', name: '太空', svg: `<rect width="160" height="100" fill="#1b2350"/>${Array.from({ length: 46 }, (_, i) => `<circle cx="${(i * 71 + 13) % 157 + 1.5}" cy="${(i * i * 17 + i * 31 + 7) % 97 + 1.5}" r="${i % 4 ? .7 : 1.2}" fill="#fff" opacity="${i % 3 ? .6 : .95}"/>`).join('')}<circle cx="128" cy="76" r="16" fill="#f0a35a"/><ellipse cx="128" cy="76" rx="26" ry="5" fill="none" stroke="#ffd9a0" stroke-width="2"/><circle cx="26" cy="20" r="8" fill="#e8e8f0"/>` },
  { id: 'castle', icon: '🏰', name: '城堡', svg: `<rect width="160" height="100" fill="#f6d6f0"/><rect y="78" width="160" height="22" fill="#a8dd8c"/><g fill="#c9b6e8"><rect x="56" y="38" width="48" height="42"/><rect x="48" y="28" width="14" height="52"/><rect x="98" y="28" width="14" height="52"/><path d="M48 28 L55 16 L62 28 Z M98 28 L105 16 L112 28 Z M70 38 L80 22 L90 38 Z"/></g><path d="M74 80 V64 Q80 56 86 64 V80 Z" fill="#8a6cc4"/>` },
  { id: 'room', icon: '🏠', name: '我的房間', svg: `<rect width="160" height="100" fill="#fff1d6"/><rect y="72" width="160" height="28" fill="#d9a066"/><rect x="18" y="16" width="40" height="30" fill="#bfe6ff" stroke="#fff" stroke-width="3"/><line x1="38" y1="16" x2="38" y2="46" stroke="#fff" stroke-width="2"/><ellipse cx="96" cy="86" rx="40" ry="8" fill="#ff9aa8" opacity=".7"/><rect x="118" y="44" width="30" height="30" rx="3" fill="#8fc4ff"/>` },
  { id: 'island', icon: '🏝️', name: '小島', svg: `<rect width="160" height="100" fill="#aee4ff"/><rect y="60" width="160" height="40" fill="#39a6e0"/><ellipse cx="80" cy="74" rx="52" ry="12" fill="#f1d38f"/><path d="M84 70 C82 54 86 40 92 30" stroke="#8a5a33" stroke-width="4" fill="none"/><path d="M92 30 C80 26 72 32 70 36 M92 30 C104 24 112 30 114 34 M92 30 C90 20 98 14 104 14 M92 30 C84 22 76 22 74 24" stroke="#3aa35b" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="24" cy="18" r="9" fill="#ffd54a"/>` },
];
let bookTab = 'meadow', trayCat = 0;
const owned = () => { const m = {}; for (const e of S.stickers) m[e] = (m[e] || 0) + 1; return m; };
function placedCount() { const m = {}; for (const id in (S.scenes || {})) for (const p of S.scenes[id]) m[p.e] = (m[p.e] || 0) + 1; return m; }
SCREENS.book = () => {
  S.scenes = S.scenes || {};
  const tabs = `<div class="tabs booktabs">${SCENES.map(sc => `<button class="tab ${bookTab === sc.id ? 'on' : ''}" data-b="${sc.id}">${sc.icon} ${sc.name}</button>`).join('')}<button class="tab ${bookTab === 'collect' ? 'on' : ''}" data-b="collect">📒 收集冊</button></div>`;
  if (bookTab === 'collect') {
    const own = owned();
    view.innerHTML = tabs + `<div class="collect">${STICKER_SETS.map(set => { const n = set.list.filter(e => own[e]).length;
      return `<div class="cset"><div class="cname">${set.icon} ${set.name} <span class="cnum">${n}／${set.list.length}${n === set.list.length ? ' 🏅' : ''}</span></div>
        <div class="cgrid">${set.list.map(e => own[e] ? `<span class="cst got">${e}${own[e] > 1 ? `<i>${own[e]}</i>` : ''}</span>` : `<span class="cst"></span>`).join('')}</div></div>`; }).join('')}</div>`;
    bindBookTabs(); say(S.stickers.length ? P.bookCollect : P.stickerEmpty); return;
  }
  const sc = SCENES.find(x => x.id === bookTab);
  const list = S.scenes[sc.id] || (S.scenes[sc.id] = []);
  view.innerHTML = tabs + `<div class="bookwrap"><div class="scene" id="scene"><svg class="scenebg" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice">${sc.svg}</svg></div>
    <div class="traycats">${STICKER_SETS.map((set, i) => `<button class="chip ${trayCat === i ? 'on' : ''}" data-c="${i}">${set.icon}</button>`).join('')}</div>
    <div class="tray" id="tray"></div></div>`;
  bindBookTabs();
  const scene = $('#scene');
  const renderPlaced = () => {
    scene.querySelectorAll('.pst').forEach(x => x.remove());
    list.forEach((p, i) => { const el = h(`<div class="pst" style="left:${p.x}%;top:${p.y}%;font-size:${(p.s || 1) * 100}%">${p.e}</div>`); el.dataset.i = i; scene.appendChild(el); dragPlaced(el); });
  };
  const renderTray = () => {
    const own = owned(), used = placedCount();
    const set = STICKER_SETS[trayCat];
    const items = set.list.filter(e => own[e]);
    $('#tray').innerHTML = items.length ? items.map(e => { const left = own[e] - (used[e] || 0); return `<div class="tst ${left > 0 ? '' : 'empty'}" data-e="${e}">${e}<i>${left}</i></div>`; }).join('') : `<p class="note">這一類還沒有貼紙，玩遊戲就可以得到喔！</p>`;
    $('#tray').querySelectorAll('.tst:not(.empty)').forEach(dragNew);
  };
  view.querySelectorAll('.traycats .chip').forEach(b => b.onclick = () => { trayCat = +b.dataset.c; view.querySelectorAll('.traycats .chip').forEach(x => x.classList.toggle('on', x === b)); renderTray(); });
  const inScene = (x, y) => { const r = scene.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };
  const toPct = (x, y) => { const r = scene.getBoundingClientRect(); return [Math.max(2, Math.min(98, (x - r.left) / r.width * 100)), Math.max(3, Math.min(97, (y - r.top) / r.height * 100))]; };
  // 從下面的貼紙盒拖一張新的上去
  function dragNew(el) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); const emo = el.dataset.e;
      const ghost = h(`<div class="ghost">${emo}</div>`); document.body.appendChild(ghost);
      const mv = ev => { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; ghost.classList.toggle('ok', inScene(ev.clientX, ev.clientY)); };
      mv(e);
      const up = ev => {
        removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); ghost.remove();
        if (ev.type === 'pointerup' && inScene(ev.clientX, ev.clientY)) {
          const [x, y] = toPct(ev.clientX, ev.clientY); list.push({ e: emo, x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, s: 1 }); save(); chime(true); renderPlaced(); renderTray();
        }
      };
      addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    });
  }
  // 圖上的貼紙：拖著移動；點一下換大小；拖到圖外面就收回盒子
  function dragPlaced(el) {
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); const i = +el.dataset.i; const p = list[i]; const sx = e.clientX, sy = e.clientY; let moved = false;
      el.classList.add('drag'); el.setPointerCapture(e.pointerId);
      const mv = ev => {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) moved = true;
        if (!moved) return;
        const r = scene.getBoundingClientRect();
        el.style.left = ((ev.clientX - r.left) / r.width * 100) + '%'; el.style.top = ((ev.clientY - r.top) / r.height * 100) + '%';
        el.classList.toggle('out', !inScene(ev.clientX, ev.clientY));
      };
      const up = ev => {
        el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); el.classList.remove('drag');
        if (!moved) { p.s = p.s === 1 ? 1.5 : p.s === 1.5 ? .7 : 1; save(); renderPlaced(); return; }
        if (!inScene(ev.clientX, ev.clientY)) { list.splice(i, 1); save(); renderPlaced(); renderTray(); return; }
        const [x, y] = toPct(ev.clientX, ev.clientY); p.x = Math.round(x * 10) / 10; p.y = Math.round(y * 10) / 10;
        list.push(list.splice(i, 1)[0]); save(); renderPlaced();
      };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
  }
  renderPlaced(); renderTray();
  say(S.stickers.length ? P.bookIntro : P.stickerEmpty);
};
function bindBookTabs() { view.querySelectorAll('.booktabs .tab').forEach(b => b.onclick = () => { bookTab = b.dataset.b; SCREENS.book(); }); }


/* ---------- 換好朋友（吉祥物） ---------- */
function palPicker() {
  stopAll();
  const o = h(`<div id="sheet"><div class="card palcard"><div class="paltitle">選一個好朋友</div>
    <div class="pals">${MASCOT_IDS.map(id => `<button class="pal ${S.mascot === id ? 'on' : ''}" data-id="${id}"><span class="palsvg">${MASCOTS[id].svg}</span><span class="nm">${MASCOTS[id].name}</span></button>`).join('')}</div>
    <div class="acts"><button class="say alt" data-a="close">✔ 好了</button></div></div></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('.pal').forEach(b => b.onclick = () => {
    S.mascot = b.dataset.id; save(); setMascot(S.mascot);
    o.querySelectorAll('.pal').forEach(x => x.classList.toggle('on', x === b));
    $('#bird').classList.remove('hop'); void $('#bird').offsetWidth; $('#bird').classList.add('hop');
    say(P.palHi(MASCOTS[S.mascot].name));
  });
  o.querySelector('[data-a=close]').onclick = () => { stopAll(); o.remove(); };
  o.onclick = e => { if (e.target === o) { stopAll(); o.remove(); } };
  say(P.palIntro);
}
$('#pal').onclick = palPicker;
$('#startBird').onclick = () => { const i = MASCOT_IDS.indexOf(S.mascot); S.mascot = MASCOT_IDS[(i + 1) % MASCOT_IDS.length]; save(); setMascot(S.mascot); };

/* ---------- 家長區：按住兩秒＋加法 ---------- */
(() => {
  const g = $('#gear'), f = g.querySelector('.fill'); let t0 = 0, raf = 0;
  const down = e => { e.preventDefault(); t0 = performance.now(); const tick = () => { const p = (performance.now() - t0) / 2000; f.style.height = Math.min(100, p * 100) + '%'; if (p >= 1) { up(); gate(); } else raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); };
  const up = () => { cancelAnimationFrame(raf); f.style.height = '0'; };
  g.addEventListener('pointerdown', down); g.addEventListener('pointerup', up); g.addEventListener('pointerleave', up); g.addEventListener('pointercancel', up);
  g.addEventListener('contextmenu', e => e.preventDefault());
})();
function gate() {
  stopAll();
  const a = 3 + rand(7), b = 4 + rand(6), ans = a + b;
  const opts = shuffle([ans, ans + 1 + rand(3), ans - 1 - rand(3)]);
  const o = h(`<div class="overlay" id="parent"><div class="panel" style="text-align:center"><h2>家長區</h2>
    <p class="gate">${a} + ${b} = ?</p><div class="row" style="justify-content:center">${opts.map(x => `<button class="say alt" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="chip" data-a="x">取消</button></div></div></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('[data-v]').forEach(btn => btn.onclick = () => { if (+btn.dataset.v === ans) { o.remove(); parentPanel(); } else o.remove(); });
  o.querySelector('[data-a=x]').onclick = () => o.remove();
}
function parentPanel() {
  const lvl = s => { const v = S.score[s]; if (!v) return ''; const c = v[0]; return (c >= 6 ? 's3' : c >= 3 ? 's2' : c >= 1 ? 's1' : '') + (v[1] > v[0] && v[1] >= 2 ? ' weak' : ''); };
  const weak = SYMBOLS.filter(x => { const v = S.score[x.s]; return v && v[1] >= 2 && v[1] >= v[0] / 2; }).map(x => x.s);
  const o = h(`<div class="overlay" id="parent">
    <div class="panel"><h2>進度</h2>
      <div class="row"><span>今天玩了 <b>${Math.round(S.sec / 60)}</b> 分鐘</span><span>・貼紙 <b>${S.stickers.length}</b> 張</span><span>・聽過 <b>${Object.keys(S.heard).length}</b>／37 個注音</span></div>
      <p class="note">每個注音答對的次數：淺黃 1 次以上、黃 3 次以上、綠 6 次以上；紅框是常答錯的。</p>
      <div class="mini">${SYMBOLS.map(x => `<span class="${lvl(x.s)}">${x.s}</span>`).join('')}</div>
      <p class="note">需要多練：${weak.length ? weak.join(' ') : '目前沒有'}　拼過的字：${Object.keys(S.spelled).join('、') || '還沒有'}　四聲答對 ${S.tones[0]} 題</p>
    </div>
    <div class="panel"><h2>設定</h2>
      <div class="row">休息提醒：${[0, 10, 15, 20, 30].map(m => `<button class="chip ${S.rest === m ? 'on' : ''}" data-rest="${m}">${m ? m + ' 分鐘' : '關閉'}</button>`).join('')}</div>
      <div class="row"><button class="chip" data-a="fs">全螢幕</button><button class="chip" data-a="reset">清除進度</button><a class="chip" href="../index.html" style="text-decoration:none;color:inherit">回遊戲大廳</a></div>
      <p class="note">筆順依據教育部《國字標準字體筆順學習網》。聲音：微軟台灣中文神經語音（雲哲 YunJhe）預錄。進度只存在這台裝置的瀏覽器裡。</p>
    </div>
    <button class="say" data-a="close">✔ 回到遊戲</button></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('[data-rest]').forEach(b => b.onclick = () => { S.rest = +b.dataset.rest; save(); o.remove(); parentPanel(); });
  o.querySelector('[data-a=fs]').onclick = () => fullscreen();
  o.querySelector('[data-a=reset]').onclick = e => {
    if (e.target.dataset.sure) { const r = S.rest; S = { heard: {}, score: {}, spelled: {}, tones: [0, 0], stickers: [], day: today(), sec: 0, rest: r }; save(); updStars(); o.remove(); go('home'); }
    else { e.target.dataset.sure = 1; e.target.textContent = '再按一次確定清除'; }
  };
  o.querySelector('[data-a=close]').onclick = () => { o.remove(); if (screen === 'home') go('home'); };
}
function fullscreen() { const d = document.documentElement; const f = d.requestFullscreen || d.webkitRequestFullscreen; if (f && !document.fullscreenElement) try { f.call(d).catch(() => {}); } catch (e) {} }

/* ---------- 遊玩時間與休息提醒 ---------- */
let restShown = 0;
setInterval(() => {
  if (document.hidden || !$('#start').classList.contains('hide')) return;
  if (S.day !== today()) { S.day = today(); S.sec = 0; restShown = 0; }
  S.sec += 5; if (S.sec % 30 === 0) save();
  if (S.rest && S.sec >= S.rest * 60 * (restShown + 1) && !$('#rest')) {
    restShown++; stopAll();
    const o = h(`<div class="overlay" id="rest"><div class="bird" style="width:160px;height:160px">${BIRD}</div><p style="font-size:30px;font-weight:900">${P.rest}</p><button class="say alt">我休息好了</button></div>`);
    document.body.appendChild(o); play(P.rest);
    o.querySelector('button').onclick = () => o.remove();
  }
}, 5000);

/* ---------- 開始 ---------- */
$('#go').onclick = () => {
  const c = ctx(); if (c && c.state === 'suspended') c.resume();
  if (matchMedia('(pointer:coarse)').matches) fullscreen();
  $('#start').classList.add('hide'); updStars(); go('home');
};
preload(P.hello, P.pickOne);
// 測試用：列出台詞
window.__zy = { say, S, go };
</script>
