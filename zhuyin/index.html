<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ㄅㄆㄇ 小島</title>
<meta name="theme-color" content="#e4f1e6">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e4f1e6;      /* 作業簿的淡綠 */
  --grid:#9fcfa9;       /* 格線 */
  --ink:#1c3765;        /* 深藍墨水 */
  --blue:#2468c2;       /* 藍鵲的藍 */
  --red:#e0392b;        /* 藍鵲的紅嘴 */
  --sun:#ffc93c;        /* 星星 */
  --card:#ffffff;
  --mute:#5d7a8e;
  --good:#2e9d57;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Sans TC",serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;
  color:var(--ink);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* 上方列 */
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:76px}
.round{width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 #b7d5bd;font-size:30px;display:grid;place-items:center;flex:none}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 #b7d5bd}
#hall{font-size:15px;font-weight:700;width:auto;padding:0 18px;border-radius:32px;height:52px}
#stars{margin-left:auto;font-weight:900;font-size:22px;background:var(--card);border-radius:30px;padding:8px 16px;box-shadow:0 3px 0 #b7d5bd}
#gear{position:relative;overflow:hidden}
#gear .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(36,104,194,.25)}
.hide{display:none!important}

/* 小藍與對話泡泡 */
#stage{display:flex;align-items:center;gap:10px;padding:0 14px 6px;min-height:112px}
#bird{width:104px;height:104px;flex:none}
#bird svg{width:100%;height:100%;overflow:visible}
#bird.talk .beakTop{transform:rotate(-10deg)}
#bird.talk .beakBot{transform:rotate(14deg)}
.beakTop,.beakBot{transform-origin:62px 40px;transition:transform .09s}
#bird.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}}
#bubble{position:relative;background:var(--card);border-radius:22px;padding:14px 20px;font-size:22px;font-weight:700;line-height:1.4;max-width:640px;box-shadow:0 3px 0 #b7d5bd}
#bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--card);border-left:0}
#bubble:empty{visibility:hidden}

#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 14px 24px;-webkit-overflow-scrolling:touch}
.center{display:flex;flex-direction:column;align-items:center;gap:22px}

/* 首頁 */
#home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:900px;margin:0 auto}
.tile{background:var(--card);border-radius:28px;padding:20px 10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #b7d5bd;min-height:170px;justify-content:center}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #b7d5bd}
.tile .big{font-family:var(--kai);font-size:62px;line-height:1.05;color:var(--blue)}
.tile .emo{font-size:56px;line-height:1.05}
.tile .lab{font-size:22px;font-weight:900}
.tile.t1 .big{color:var(--blue)} .tile.t2{--c:#e0392b}
@media (max-width:620px){#home{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:140px}.tile .big,.tile .emo{font-size:48px}}

/* 注音格：方格＋右邊放聲調的窄格 */
.zg{position:relative;display:inline-grid;place-items:center;font-family:var(--kai);font-weight:700;color:var(--ink);background:var(--card);
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),#cfe7d4 calc(50% - 1px),#cfe7d4 calc(50% + 1px),transparent calc(50% + 1px)),
                   linear-gradient(transparent calc(50% - 1px),#cfe7d4 calc(50% - 1px),#cfe7d4 calc(50% + 1px),transparent calc(50% + 1px));
  border:3px solid var(--grid);border-radius:14px}

/* 學注音 */
.tabs{display:flex;gap:10px;justify-content:center;margin:2px 0 16px;flex-wrap:wrap}
.tab{background:var(--card);border-radius:30px;padding:12px 24px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #b7d5bd;min-height:56px}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 #17488a}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;max-width:1000px;margin:0 auto}
.sym{aspect-ratio:1;font-size:56px;box-shadow:0 4px 0 #b7d5bd}
.sym:active{transform:translateY(2px)}
.sym.heard::after{content:"";position:absolute;right:7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--good)}
.sym .gl{font-size:12px;position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--ui);color:var(--mute);font-weight:700}
.grouplabel{max-width:1000px;margin:14px auto 8px;font-weight:900;font-size:18px;color:var(--mute)}

/* 詳細卡 */
#sheet{position:fixed;inset:0;background:rgba(28,55,101,.35);display:grid;place-items:center;z-index:20;padding:16px}
#sheet .card{background:var(--card);border-radius:32px;padding:28px 34px;display:flex;align-items:center;gap:34px;max-width:94vw;box-shadow:0 8px 0 #b7d5bd;flex-wrap:wrap;justify-content:center}
#sheet .zg{width:190px;height:190px;font-size:150px}
#sheet .ex{display:flex;flex-direction:column;align-items:center;gap:6px}
#sheet .ex .emo{font-size:110px;line-height:1}
#sheet .acts{display:flex;gap:12px;width:100%;justify-content:center}

/* 詞＋注音（直排在字的右邊） */
.wz{display:inline-flex;align-items:center;gap:2px;font-family:var(--kai)}
.wz .hz{font-size:1em;line-height:1}
.syl{display:inline-flex;align-items:center;font-family:var(--kai);font-weight:700}
.syl .col{display:flex;flex-direction:column;line-height:1;align-items:center}
.syl .col i{font-style:normal;font-size:.36em}
.syl .tn{font-size:.3em;margin-left:.02em;align-self:center}
.syl .neu{font-size:.3em;line-height:.6}
.syl.lit .col i.on{color:var(--red)}
.wz .syl{margin-right:.12em}

/* 題目 */
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--grid)}
.dots span.done{background:var(--sun);border-color:#e3a800}
.opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.opt{width:150px;height:150px;font-size:110px;box-shadow:0 5px 0 #b7d5bd}
.opt:active{transform:translateY(3px)}
.opt.ok{border-color:var(--good);background-color:#e6f7ec;animation:pop .45s}
.opt.no{animation:shake .4s;opacity:.45}
.opt.glow{border-color:var(--sun);box-shadow:0 0 0 8px rgba(255,201,60,.55),0 5px 0 #b7d5bd}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.say{background:var(--blue);color:#fff;border-radius:40px;padding:14px 28px;font-size:24px;font-weight:900;box-shadow:0 4px 0 #17488a;min-height:64px;display:inline-flex;align-items:center;gap:10px}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 #17488a}
.say.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 #b7d5bd}
.pic{background:var(--card);border-radius:32px;padding:14px 30px;display:flex;align-items:center;gap:22px;box-shadow:0 5px 0 #b7d5bd}
.pic .emo{font-size:120px;line-height:1}
.pic .w{font-family:var(--kai);font-size:84px;font-weight:700}

/* 拼拼看 */
.slots{display:flex;align-items:center;gap:4px}
.slotcol{display:flex;flex-direction:column;gap:8px}
.slot{width:104px;height:104px;font-size:80px;border-style:dashed}
.slot.fill{border-style:solid;border-color:var(--blue);animation:pop .35s}
.slot.next{border-color:var(--sun);box-shadow:0 0 0 6px rgba(255,201,60,.4)}
.slot .ghost{color:#cfe2d4}
.tonebox{width:46px;font-family:var(--kai);font-size:64px;font-weight:700;color:var(--red);text-align:center;min-height:64px}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:720px}
.tilez{width:104px;height:104px;font-size:76px;box-shadow:0 4px 0 #b7d5bd}
.tilez.used{visibility:hidden}
.tilez.no{animation:shake .4s}

/* 四聲 */
.tones{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.tonecard{background:var(--card);border:3px solid var(--grid);border-radius:24px;width:156px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 #b7d5bd}
.tonecard:active{transform:translateY(3px)}
.tonecard svg{width:100px;height:56px}
.tonecard .syl{font-size:120px;color:var(--ink)}
.tonecard .syl .col i{font-size:.5em}.tonecard .syl .tn{font-size:.42em}
.tonecard .nm{font-weight:900;font-size:20px}
.tonecard.ok{border-color:var(--good);background:#e6f7ec;animation:pop .45s}
.tonecard.no{animation:shake .4s;opacity:.45}
.tonecard.glow{border-color:var(--sun);box-shadow:0 0 0 8px rgba(255,201,60,.55)}
.bigchar{font-family:var(--kai);font-size:120px;font-weight:700;line-height:1}

/* 貼紙簿 */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;max-width:960px;margin:0 auto}
.stk{aspect-ratio:1;border-radius:50%;background:var(--card);border:3px dashed var(--grid);display:grid;place-items:center;font-size:58px}
.stk.got{border:3px solid var(--sun);box-shadow:0 4px 0 #e3a800}
.stk.got:active{animation:pop .4s}

/* 完成畫面 */
#reward{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(28,55,101,.35)}
#reward .card{background:var(--card);border-radius:36px;padding:30px 44px;text-align:center;box-shadow:0 8px 0 #b7d5bd}
#reward .stk{width:180px;margin:0 auto 18px;font-size:110px;animation:spinIn .8s}
@keyframes spinIn{from{transform:scale(0) rotate(-200deg)}}
#reward .row{display:flex;gap:12px;justify-content:center}

/* 開始畫面、家長區、休息 */
.overlay{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
#start h1{font-family:var(--kai);font-size:clamp(56px,11vw,110px);margin:0;letter-spacing:.04em}
#start .bird{width:180px;height:180px}
#start p{font-size:24px;font-weight:700;margin:0}
#parent{z-index:45;justify-content:flex-start;overflow-y:auto}
.panel{background:var(--card);border-radius:24px;padding:20px 22px;width:min(760px,100%);box-shadow:0 4px 0 #b7d5bd}
.panel h2{margin:0 0 12px;font-size:22px}
.panel .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.mini span{font-family:var(--kai);font-size:30px;font-weight:700;text-align:center;border-radius:10px;padding:2px 0;background:#f1f5f2}
.mini span.s1{background:#fff3c4}.mini span.s2{background:#ffe08a}.mini span.s3{background:#9ee0b4}.mini span.weak{outline:3px solid var(--red)}
.chip{background:#eef4f9;border-radius:30px;padding:10px 18px;font-weight:700;font-size:17px;min-height:48px}
.chip.on{background:var(--blue);color:#fff}
.note{color:var(--mute);font-size:14px;line-height:1.6}
.gate{font-size:34px;font-weight:900}
@media (min-width:900px) and (min-height:700px){.opt{width:180px;height:180px;font-size:132px}}
@media (max-height:560px){#stage{min-height:84px}#bird{width:76px;height:76px}#bubble{font-size:18px;padding:10px 16px}
  .opt{width:120px;height:120px;font-size:88px}.pic .emo{font-size:90px}.pic .w{font-size:64px}.slot,.tilez{width:86px;height:86px;font-size:64px}.center{gap:14px}
  .tonecard .syl{font-size:90px}}
@media (max-width:520px){.opt{width:110px;height:110px;font-size:80px}.slot,.tilez{width:80px;height:80px;font-size:60px}.tonecard{width:44vw}.tonecard .syl{font-size:90px}
  #bubble{font-size:18px}#bird{width:80px;height:80px}.pic .emo{font-size:84px}.pic .w{font-size:60px}#hall{padding:0 12px}}
@media (max-height:560px) and (min-width:600px){
  #bar{min-height:58px;padding:6px 12px}.round{width:52px;height:52px;font-size:24px}#hall{height:44px}
  #stage{min-height:64px;padding-bottom:2px}#bird{width:60px;height:60px}
  .center{flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px 24px}
  .center>.dots{flex-basis:100%}
  .pic{padding:8px 18px}.pic .emo{font-size:72px}.pic .w{font-size:52px}
  .opt{width:104px;height:104px;font-size:78px}.slot,.tilez{width:72px;height:72px;font-size:54px}.tiles{max-width:420px}
  .tonecard{width:120px;padding:4px}.tonecard .syl{font-size:60px}.tonecard svg{height:28px}.tonecard .nm{font-size:16px}
  #sheet .zg{width:140px;height:140px;font-size:110px}#sheet .ex .emo{font-size:70px}}
@media (max-width:520px){.say{font-size:20px;padding:12px 20px;min-height:56px}#sheet .card{padding:22px 18px;gap:18px}
  .tonecard .syl{font-size:72px}.tonecard svg{height:40px}}
.say{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="round" id="homeBtn" aria-label="回首頁">🏠</button>
    <a class="round" id="hall" href="../index.html" style="text-decoration:none;color:inherit">← 遊戲大廳</a>
    <span id="stars" aria-label="貼紙數">⭐ 0</span>
    <button class="round" id="gear" aria-label="家長區（按住兩秒）"><span class="fill"></span>⚙️</button>
  </div>
  <div id="stage">
    <button id="bird" aria-label="小藍，再說一次"></button>
    <div id="bubble" aria-live="polite"></div>
  </div>
  <div id="view"></div>
</div>

<div class="overlay" id="start">
  <div class="bird" id="startBird"></div>
  <h1>ㄅㄆㄇ 小島</h1>
  <button class="say" id="go">▶ 點一下開始</button>
</div>

<script src="data.js"></script>
<script>
'use strict';
const { SYMBOLS, GROUPS, ONE, TWO, WORDS, TONE_SETS, TONE_NAMES, TONE_MARKS, CONFUSE, P, parseSyl, syllables, hash, symOf } = ZY;
const $ = (s, el = document) => el.querySelector(s);
const view = $('#view');
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ---------- 小藍（台灣藍鵲）---------- */
const BIRD = `<svg viewBox="0 0 120 120" aria-hidden="true">
  <path d="M30 78 C10 92 4 108 6 116 C14 110 22 104 34 96 Z" fill="#2468c2"/>
  <path d="M30 80 C18 96 14 110 18 118 C24 110 30 102 38 94 Z" fill="#3b82d6"/>
  <circle cx="7" cy="115" r="5" fill="#fff"/><circle cx="18" cy="117" r="5" fill="#fff"/>
  <ellipse cx="56" cy="74" rx="34" ry="30" fill="#2468c2"/>
  <ellipse cx="60" cy="82" rx="20" ry="17" fill="#6aa6ea"/>
  <path d="M34 66 C40 84 56 92 70 90 C56 84 46 74 44 62 Z" fill="#17488a"/>
  <circle cx="52" cy="40" r="25" fill="#22252b"/>
  <circle cx="58" cy="36" r="8" fill="#fff"/><circle cx="60" cy="37" r="4.5" fill="#22252b"/><circle cx="61.5" cy="35" r="1.6" fill="#fff"/>
  <circle cx="58" cy="36" r="10" fill="none" stroke="#ffd23c" stroke-width="2.5"/>
  <path class="beakTop" d="M62 38 L92 42 L62 46 Z" fill="#e0392b"/>
  <path class="beakBot" d="M62 44 L86 46 L62 50 Z" fill="#c22a1e"/>
  <circle cx="44" cy="50" r="5" fill="#ff8a8a" opacity=".5"/>
  <path d="M46 102 l-2 10 M52 102 l0 10 M64 102 l2 10 M70 102 l0 10" stroke="#e0392b" stroke-width="4" stroke-linecap="round"/>
</svg>`;
$('#bird').innerHTML = BIRD; $('#startBird').innerHTML = BIRD;

/* ---------- 進度 ---------- */
const KEY = 'zhuyin-v1';
const today = () => new Date().toISOString().slice(0, 10);
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S = Object.assign({ heard: {}, score: {}, spelled: {}, tones: [0, 0], stickers: [], day: today(), sec: 0, rest: 15 }, S);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
function mark(s, ok) { const v = S.score[s] || (S.score[s] = [0, 0]); v[ok ? 0 : 1]++; save(); }
function weight(s) { const v = S.score[s] || [0, 0]; return Math.max(.3, 1 + v[1] * 1.5 - Math.min(v[0], 4) * .2); }
function wpick(list, key = x => x) {
  const ws = list.map(x => weight(key(x))); let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; } return list[list.length - 1];
}
const STICKERS = ['🐻','🐼','🦊','🐸','🐙','🦄','🐳','🦋','🐞','🐢','🦒','🦁','🐧','🐬','🦉','🐨','🐹','🐰','🦕','🐝',
  '🌈','🌻','🍉','🍓','🍩','🧁','🍭','🚀','🚂','🎈','🪁','⚽','🎨','🎸','🏰','⛵','🌟','🌙','☀️','🍀'];
const updStars = () => { $('#stars').textContent = '⭐ ' + S.stickers.length; };

/* ---------- 聲音 ---------- */
let AC = null;
const bufs = new Map();
let cur = null;          // 正在播的 source
let token = 0;           // 換畫面就作廢舊的播放
function ctx() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } return AC; }
function load(text) {
  const id = hash(text);
  if (!bufs.has(id)) {
    bufs.set(id, fetch('audio/' + id + '.mp3').then(r => r.ok ? r.arrayBuffer() : null)
      .then(ab => ab && ctx() ? new Promise((ok, no) => ctx().decodeAudioData(ab, ok, no)) : null).catch(() => null));
  }
  return bufs.get(id);
}
function stopAll() { token++; if (cur) { try { cur.stop(); } catch (e) {} cur = null; } if (window.speechSynthesis) speechSynthesis.cancel(); talking(false); }
function talking(on) { $('#bird').classList.toggle('talk', on); }
let beak = null;
function beakAnim(on) { clearInterval(beak); if (on) { let o = false; beak = setInterval(() => { o = !o; talking(o); }, 140); } else talking(false); }
async function play(text) {
  const my = token;
  const buf = await load(text);
  if (my !== token) return false;
  beakAnim(true);
  try {
    if (buf) {
      await new Promise(res => {
        const src = ctx().createBufferSource(); src.buffer = buf; src.connect(ctx().destination);
        src.onended = res; cur = src; src.start();
      });
    } else await fallback(text);
  } finally { beakAnim(false); }
  return my === token;
}
function fallback(text) {
  return new Promise(res => {
    if (!window.speechSynthesis) return setTimeout(res, 600);
    const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-TW'; u.rate = .9;

function distractors(ans, pool, n) {
  const out = [];
  const conf = CONFUSE.find(c => c.includes(ans));
  const v = S.score[ans] || [0, 0];
  if (conf && v[0] >= 2) out.push(...shuffle(Array.from(conf).filter(c => c !== ans && pool.includes(c))).slice(0, 1));
  for (const c of shuffle(pool)) { if (out.length >= n) break; if (c !== ans && !out.includes(c) && !(conf && conf.includes(c) && v[0] < 2)) out.push(c); }
  return out;
}

SCREENS.spell = () => {
  const N = 6; let i = 0;

  // 前幾輪先拼兩個符號的字
  const easy = ONE.filter(w => parseSyl(w.z).parts.length === 2), hard = ONE.filter(w => parseSyl(w.z).parts.length === 3);
  const list = shuffle(done < 12 ? easy : easy.concat(hard, hard)).filter((w, k, a) => a.findIndex(x => x.w === w.w) === k);

    if (i >= N) return finishRound();

    const allPool = SYMBOLS.map(x => x.s).filter(s => !parts.includes(s));
    const extra = []; for (const p of parts) extra.push(...distractors(p, allPool, 1));
    while (extra.length < 3) { const c = pick(allPool); if (!extra.includes(c)) extra.push(c); }

    $('#pic').onclick = () => say(P.spellQ(w.w));

    view.querySelectorAll('.tilez').forEach(b => b.onclick = async () => {
      if (k >= parts.length || b.classList.contains('used')) return;
      if (b.dataset.s === parts[k]) {
        b.classList.add('used'); const sl = slots[k]; sl.textContent = parts[k]; sl.classList.remove('next'); sl.classList.add('fill');
        if (!miss) mark(parts[k], true); miss = 0; k++;

  };
  say(P.spellIntro).then(ok => ok && next());
};
