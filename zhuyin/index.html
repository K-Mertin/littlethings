<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ㄅㄆㄇ 小島</title>
<meta name="theme-color" content="#e4f1e6">
<link rel="icon" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e4f1e6;      /* 作業簿的淡綠 */
  --grid:#9fcfa9;       /* 格線 */
  --ink:#1c3765;        /* 深藍墨水 */
  --blue:#2468c2;       /* 藍鵲的藍 */
  --red:#e0392b;        /* 藍鵲的紅嘴 */
  --sun:#ffc93c;        /* 星星 */
  --card:#ffffff;
  --mute:#5d7a8e;
  --good:#2e9d57;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti","Noto Sans TC",serif;
  --ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{overflow-x:clip}
body{min-height:100%;overflow-x:clip}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed;
  color:var(--ink);font-family:var(--ui);user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
/* 整頁一起捲（不用內層捲動區）：平板全螢幕時內層捲動區可能拉不動 */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#head{position:sticky;top:0;z-index:10;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
#wtones,#rp{scroll-margin-top:210px;scroll-margin-bottom:16px}

/* 上方列 */
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:76px}
.round{width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 3px 0 #b7d5bd;font-size:30px;display:grid;place-items:center;flex:none}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 #b7d5bd}
#hall{font-size:15px;font-weight:700;width:auto;padding:0 18px;border-radius:32px;height:52px}
#stars{margin-left:auto;font-weight:900;font-size:22px;background:var(--card);border-radius:30px;padding:8px 16px;box-shadow:0 3px 0 #b7d5bd}
#gear{position:relative;overflow:hidden}
#gear .fill{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(36,104,194,.25)}
.hide{display:none!important}

/* 小藍與對話泡泡 */
#stage{display:flex;align-items:center;gap:10px;padding:0 14px 6px;min-height:112px}
#bird{width:104px;height:104px;flex:none}
#bird svg{width:100%;height:100%;overflow:visible}
#bird.talk .beakTop{transform:rotate(-10deg)}
#bird.talk .beakBot{transform:rotate(14deg)}
.beakTop,.beakBot{transform-origin:62px 40px;transition:transform .09s}
#bird.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}}
#bubble{position:relative;background:var(--card);border-radius:22px;padding:14px 20px;font-size:22px;font-weight:700;line-height:1.4;max-width:640px;box-shadow:0 3px 0 #b7d5bd}
#bubble::before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid var(--card);border-left:0}
#bubble:empty{visibility:hidden}

#view{flex:1;padding:4px 14px 24px;overflow-x:clip}
.center{display:flex;flex-direction:column;align-items:center;gap:22px}

/* 首頁 */
#home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:900px;margin:0 auto}
.tile{background:var(--card);border-radius:28px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 #b7d5bd;min-height:148px;justify-content:center}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 #b7d5bd}
.tile .big{font-family:var(--kai);font-size:62px;line-height:1.05;color:var(--blue)}
.tile .emo{font-size:56px;line-height:1.05}
.tile .lab{font-size:22px;font-weight:900}
.tile.t1 .big{color:var(--blue)} .tile.t2{--c:#e0392b}
@media (max-width:620px){#home{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:140px}.tile .big,.tile .emo{font-size:48px}}

/* 注音格：方格＋右邊放聲調的窄格 */
.zg{position:relative;display:inline-grid;place-items:center;font-family:var(--kai);font-weight:700;color:var(--ink);background:var(--card);
  background-image:linear-gradient(90deg,transparent calc(50% - 1px),#cfe7d4 calc(50% - 1px),#cfe7d4 calc(50% + 1px),transparent calc(50% + 1px)),
                   linear-gradient(transparent calc(50% - 1px),#cfe7d4 calc(50% - 1px),#cfe7d4 calc(50% + 1px),transparent calc(50% + 1px));
  border:3px solid var(--grid);border-radius:14px}

/* 學注音 */
.tabs{display:flex;gap:10px;justify-content:center;margin:2px 0 16px;flex-wrap:wrap}
.tab{background:var(--card);border-radius:30px;padding:12px 24px;font-size:22px;font-weight:900;box-shadow:0 3px 0 #b7d5bd;min-height:56px}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 #17488a}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;max-width:1000px;margin:0 auto}
.sym{aspect-ratio:1;font-size:56px;box-shadow:0 4px 0 #b7d5bd}
.sym:active{transform:translateY(2px)}
.sym.heard::after{content:"";position:absolute;right:7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--good)}
.sym .gl{font-size:12px;position:absolute;bottom:4px;left:0;right:0;text-align:center;font-family:var(--ui);color:var(--mute);font-weight:700}
.grouplabel{max-width:1000px;margin:14px auto 8px;font-weight:900;font-size:18px;color:var(--mute)}

/* 詳細卡 */
#sheet{position:fixed;inset:0;background:rgba(28,55,101,.35);display:grid;place-items:center;z-index:20;padding:16px}
#sheet .card{background:var(--card);border-radius:32px;padding:28px 34px;display:flex;align-items:center;gap:34px;max-width:94vw;box-shadow:0 8px 0 #b7d5bd;flex-wrap:wrap;justify-content:center}
#sheet .zg{width:190px;height:190px;font-size:150px}
#sheet .ex{display:flex;flex-direction:column;align-items:center;gap:6px}
#sheet .ex .emo{font-size:110px;line-height:1}
#sheet .acts{display:flex;gap:12px;width:100%;justify-content:center}

/* 詞＋注音（直排在字的右邊） */
.wz{display:inline-flex;align-items:center;gap:2px;font-family:var(--kai)}
.wz .hz{font-size:1em;line-height:1}
.syl{display:inline-flex;align-items:center;font-family:var(--kai);font-weight:700}
.syl .col{display:flex;flex-direction:column;line-height:1;align-items:center}
.syl .col i{font-style:normal;font-size:.36em}
.syl .tn{font-size:.3em;margin-left:.02em;align-self:center}
.syl .neu{font-size:.3em;line-height:.6}
.syl.lit .col i.on{color:var(--red)}
.wz .syl{margin-right:.12em}

/* 題目 */
.dots{display:flex;gap:8px;justify-content:center}
.dots span{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--grid)}
.dots span.done{background:var(--sun);border-color:#e3a800}
.opts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.opt{width:150px;height:150px;font-size:110px;box-shadow:0 5px 0 #b7d5bd}
.opt:active{transform:translateY(3px)}
.opt.ok{border-color:var(--good);background-color:#e6f7ec;animation:pop .45s}
.opt.no{animation:shake .4s;opacity:.45}
.opt.glow{border-color:var(--sun);box-shadow:0 0 0 8px rgba(255,201,60,.55),0 5px 0 #b7d5bd}
@keyframes pop{40%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.say{background:var(--blue);color:#fff;border-radius:40px;padding:14px 28px;font-size:24px;font-weight:900;box-shadow:0 4px 0 #17488a;min-height:64px;display:inline-flex;align-items:center;gap:10px}
.say:active{transform:translateY(2px);box-shadow:0 2px 0 #17488a}
.say.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 #b7d5bd}
.pic{background:var(--card);border-radius:32px;padding:14px 30px;display:flex;align-items:center;gap:22px;box-shadow:0 5px 0 #b7d5bd}
.pic .emo{font-size:120px;line-height:1}
.pic .w{font-family:var(--kai);font-size:84px;font-weight:700}

/* 拼拼看 */
.slots{display:flex;align-items:center;gap:4px}
.slotcol{display:flex;flex-direction:column;gap:8px}
.slot{width:104px;height:104px;font-size:80px;border-style:dashed}
.slot.fill{border-style:solid;border-color:var(--blue);animation:pop .35s}
.slot.next{border-color:var(--sun);box-shadow:0 0 0 6px rgba(255,201,60,.4)}
.slot .ghost{color:#cfe2d4}
.tonebox{width:46px;font-family:var(--kai);font-size:64px;font-weight:700;color:var(--red);text-align:center;min-height:64px}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:720px}
.tilez{width:104px;height:104px;font-size:76px;box-shadow:0 4px 0 #b7d5bd}
.tilez.used{visibility:hidden}
.tilez.no{animation:shake .4s}
.sylgroup{display:flex;align-items:center;gap:4px;padding:6px;border-radius:18px;opacity:.55}
.sylgroup.cur,.sylgroup.done{opacity:1}.sylgroup.cur{background:rgba(255,255,255,.6)}
.sylch{font-family:var(--kai);font-size:56px;font-weight:700;margin-right:6px}
.two .slots{gap:14px}.two .slot{width:84px;height:84px;font-size:64px}.two .tonebox{width:34px;font-size:52px}
.two .pic .emo{font-size:84px}.two .pic .w{font-size:60px}.two .slotcol{gap:6px}
.combogrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.combo .syl .col i{font-size:44px}.optc .syl .col i{font-size:58px}

/* 課程 */
#ltag{font-weight:900;font-size:18px;background:var(--card);border-radius:30px;padding:8px 14px;box-shadow:0 3px 0 #b7d5bd;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
#ltag span{opacity:.35;font-size:20px}#ltag span.d{opacity:1}#ltag span.c{opacity:1;transform:scale(1.25)}
.maptile{grid-column:1/-1;flex-direction:row;min-height:96px;gap:18px;background:var(--blue);color:#fff;box-shadow:0 5px 0 #17488a}
.maptile .lab{font-size:28px}.maptile .sub{font-size:20px;font-weight:700;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px}
.lmap{position:relative;max-width:1000px;margin:0 auto}
.lpath{position:absolute;left:0;top:0}
.lnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.lnode .lc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:900;background:var(--card);border:4px solid var(--grid);box-shadow:0 4px 0 #b7d5bd}
.lnode .lt{font-family:var(--kai);font-weight:700;font-size:20px;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:10px;padding:0 6px}
.lnode.done .lc{background:#e6f7ec;border-color:var(--good)}
.lnode.cur .lc{background:var(--sun);border-color:#e3a800;animation:pulse 1.6s infinite}
.lnode.lock{opacity:.55}.lnode.lock .lc{font-size:28px}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(255,201,60,.35),0 4px 0 #b7d5bd}}
.lcard{background:var(--card);border-radius:32px;padding:26px 44px;text-align:center;box-shadow:0 6px 0 #b7d5bd}
.lnum{font-size:24px;font-weight:900;color:var(--mute)}.ltitle{font-family:var(--kai);font-size:84px;font-weight:700;letter-spacing:.08em;line-height:1.2}
.lsteps{display:flex;gap:8px;justify-content:center;align-items:center;font-size:34px;margin-top:8px}.lsteps i{font-style:normal;color:var(--mute);font-size:24px}
.lsym.seen{border-color:var(--good)}
.rtitle{font-size:26px;font-weight:900;margin:0 0 14px}
@media (max-width:520px){#ltag{font-size:14px;padding:6px 10px}#ltag span{font-size:16px}.ltitle{font-size:56px}.lcard{padding:18px 20px}.lnode .lc{width:68px;height:68px;font-size:26px}.lnode .lt{font-size:16px}.maptile .lab{font-size:22px}}

/* 小故事 */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;max-width:900px;margin:0 auto}
.sbook{position:relative;background:var(--card);border-radius:24px 10px 10px 24px;border-left:14px solid var(--blue);padding:22px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 5px 0 #b7d5bd;min-height:170px;justify-content:center}
.sbook:nth-child(4n+2){border-left-color:var(--red)}.sbook:nth-child(4n+3){border-left-color:var(--good)}.sbook:nth-child(4n+4){border-left-color:#e3a800}
.readcard{background:var(--card);border-radius:28px;padding:10px 34px;box-shadow:0 5px 0 #b7d5bd;display:flex;align-items:center;gap:8px;font-size:200px;min-height:220px}
.readcard .syl .col i{font-size:.4em}.readcard .syl .tn{font-size:.3em}.readcard .syl .neu{font-size:.3em}
.readcard.shown{font-size:110px;animation:pop .4s}.readcard.shown .syl .col i{font-size:.36em}
.ropt .emo{font-size:96px}.ropt{padding:14px 22px}.ropt.ok{background:#e6f7ec;animation:pop .45s}.ropt.no{animation:shake .4s;opacity:.45}
.ropt.glow{box-shadow:0 0 0 8px rgba(255,201,60,.55),0 5px 0 #b7d5bd}
.sbook .emo{font-size:70px;line-height:1}.sbook .bt{font-family:var(--kai);font-size:30px;font-weight:700}.sbook .done{position:absolute;right:10px;top:8px;font-size:26px}
.storypage{background:var(--card);border-radius:28px;padding:18px 26px 22px;box-shadow:0 5px 0 #b7d5bd;max-width:min(980px,100%);display:flex;flex-direction:column;align-items:center;gap:8px}
.semo{font-size:96px;line-height:1.1;letter-spacing:8px}
.sline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;font-size:64px;row-gap:6px}
.sw{display:inline-flex;align-items:center;border-radius:14px;padding:2px 4px}
.sw.lit{background:#fff3c4}.sw.notap{cursor:default}
.sc{display:inline-flex;align-items:center;font-family:var(--kai);font-weight:700;transition:color .15s}
.sc .hz{line-height:1}.sc .syl{font-size:1em;margin-left:1px}
.sc .syl .col i{font-size:.42em}.sc .syl .tn{font-size:.34em}.sc .syl .neu{font-size:.34em}
.sc.on .hz{color:var(--red)}
.punct{font-family:var(--kai);font-weight:700;margin:0 2px}
.snav{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.snav .say:disabled{opacity:.35}
.qopt .emo{font-size:80px}.qopt .w{font-size:52px}.qopt.ok{background:#e6f7ec;animation:pop .45s}.qopt.no{animation:shake .4s;opacity:.45}
.qopt.glow{box-shadow:0 0 0 8px rgba(255,201,60,.55),0 5px 0 #b7d5bd}
@media (max-width:520px){.readcard{font-size:140px;min-height:150px}.readcard.shown{font-size:80px}.ropt .emo{font-size:64px}.ropt{padding:10px 12px}.sline{font-size:40px}.semo{font-size:64px}.storypage{padding:12px 10px 14px}.books{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sbook .emo{font-size:52px}.sbook .bt{font-size:24px}
  .qopt{padding:8px 14px}.qopt .emo{font-size:56px}.qopt .w{font-size:36px}}

/* 寫字的注音、讀短句 */
.wwrow{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.wwleft{display:flex;flex-direction:column;align-items:center;gap:14px}
.wwright{display:flex;flex-direction:column;align-items:center;gap:12px}
.writebox.wwpad{width:min(40vh,80vw,400px)}
.slot.sm{width:80px;height:80px;font-size:60px}
.wwbig{width:100%;height:100%;display:grid;place-items:center;font-size:min(36vh,300px)}
.wwbig .syl .col i{font-size:.4em}.wwbig .syl .tn{font-size:.32em}
.tsm{width:120px;padding:6px}.tsm svg{height:36px}
.two .tsm{width:96px}
.rpage .semo{font-size:64px}.rpline{font-size:96px}.rpline .zw .syl .col i{font-size:.42em}.rpline .zw .syl .tn,.rpline .zw .syl .neu{font-size:.34em}
.rpage.small .semo{font-size:40px}.rpage.small .rpline{font-size:72px}
.rpage .sline{margin:2px 0}
.rplist{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:-4px 0 12px}
.zw{display:inline-flex;align-items:center;margin:0 6px}
.rsline .sline{font-size:120px}.rsline .zw .syl .col i{font-size:.42em}.rsline .zw .syl .tn,.rsline .zw .syl .neu{font-size:.34em}
.rsline .sc .syl .col i{font-size:.42em}
@media (max-width:520px){.rpline{font-size:64px}.rpage.small .rpline{font-size:52px}.two .tsm{width:62px}.two .tsm .nm{font-size:12px}.rsline .sline{font-size:72px}.slot.sm{width:60px;height:60px;font-size:44px}.wwrow{gap:12px}.writebox.wwpad{width:min(80vw,320px)}.tsm{width:76px}.tsm .nm{font-size:14px}}

/* 寫注音 */
.writewrap{flex-direction:row;align-items:flex-start;justify-content:center;gap:24px;flex-wrap:wrap}
.writebox{width:min(62vh,88vw,560px);aspect-ratio:1;padding:0;touch-action:none}
.writebox canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.writeside{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.wstars{font-size:46px;letter-spacing:6px;color:#d9e2dc;text-align:center}.wstars .on{color:var(--sun);text-shadow:0 2px 0 #e3a800}
#home{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){#home{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-aspect-ratio:1/1){.writewrap{flex-direction:column-reverse;align-items:center}.writeside{flex-direction:row;flex-wrap:wrap;justify-content:center}.wstars{width:100%}}

/* 結合韻 */
.combogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px;max-width:1000px;margin:0 auto 18px}
.combo{aspect-ratio:1;font-size:100px;box-shadow:0 4px 0 #b7d5bd}
.combo.heard::after{content:"";position:absolute;right:7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--good)}
.combo .syl .col i{font-size:.38em}
#sheet .zg.combobig{font-size:200px}
#sheet .combobig .syl .col i{font-size:.36em}
.optc{font-size:140px}.optc .syl .col i{font-size:.38em}

/* 四聲 */
.tones{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.tonecard{background:var(--card);border:3px solid var(--grid);border-radius:24px;width:156px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 #b7d5bd}
.tonecard:active{transform:translateY(3px)}
.tonecard svg{width:100px;height:56px}
.tonecard .syl{font-size:120px;color:var(--ink)}
.tonecard .syl .col i{font-size:.5em}.tonecard .syl .tn{font-size:.42em}
.tonecard .nm{font-weight:900;font-size:20px}
.tonecard.ok{border-color:var(--good);background:#e6f7ec;animation:pop .45s}
.tonecard.no{animation:shake .4s;opacity:.45}
.tonecard.glow{border-color:var(--sun);box-shadow:0 0 0 8px rgba(255,201,60,.55)}
.bigchar{font-family:var(--kai);font-size:120px;font-weight:700;line-height:1}

/* 貼紙簿 */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;max-width:960px;margin:0 auto}
.stk{aspect-ratio:1;border-radius:50%;background:var(--card);border:3px dashed var(--grid);display:grid;place-items:center;font-size:58px}
.stk.got{border:3px solid var(--sun);box-shadow:0 4px 0 #e3a800}
.stk.got:active{animation:pop .4s}

/* 完成畫面 */
#reward{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(28,55,101,.35)}
#reward .card{background:var(--card);border-radius:36px;padding:30px 44px;text-align:center;box-shadow:0 8px 0 #b7d5bd}
#reward .stk{width:180px;margin:0 auto 18px;font-size:110px;animation:spinIn .8s}
@keyframes spinIn{from{transform:scale(0) rotate(-200deg)}}
#reward .row{display:flex;gap:12px;justify-content:center}

/* 開始畫面、家長區、休息 */
.overlay{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
#start h1{font-family:var(--kai);font-size:clamp(56px,11vw,110px);margin:0;letter-spacing:.04em}
#start .bird{width:180px;height:180px}
#start p{font-size:24px;font-weight:700;margin:0}
#parent{z-index:45;justify-content:flex-start;overflow-y:auto}
.panel{background:var(--card);border-radius:24px;padding:20px 22px;width:min(760px,100%);box-shadow:0 4px 0 #b7d5bd}
.panel h2{margin:0 0 12px;font-size:22px}
.panel .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.mini span{font-family:var(--kai);font-size:30px;font-weight:700;text-align:center;border-radius:10px;padding:2px 0;background:#f1f5f2}
.mini span.s1{background:#fff3c4}.mini span.s2{background:#ffe08a}.mini span.s3{background:#9ee0b4}.mini span.weak{outline:3px solid var(--red)}
.chip{background:#eef4f9;border-radius:30px;padding:10px 18px;font-weight:700;font-size:17px;min-height:48px}
.chip.on{background:var(--blue);color:#fff}
.note{color:var(--mute);font-size:14px;line-height:1.6}
.gate{font-size:34px;font-weight:900}

  .opt{width:120px;height:120px;font-size:88px}.pic .emo{font-size:90px}.pic .w{font-size:64px}.slot,.tilez{width:86px;height:86px;font-size:64px}.center{gap:14px}

  #bubble{font-size:18px}#bird{width:80px;height:80px}.pic .emo{font-size:84px}.pic .w{font-size:60px}#hall{padding:0 12px}}

  .tonecard{width:120px;padding:4px}.tonecard .syl{font-size:60px}.tonecard svg{height:28px}.tonecard .nm{font-size:16px}
  #sheet .zg{width:140px;height:140px;font-size:110px}#sheet .ex .emo{font-size:70px}
  .two .slot{width:52px;height:52px;font-size:40px}.two .sylch{font-size:38px}.two .tonebox{font-size:36px;width:24px}.two .pic .emo{font-size:56px}.two .pic .w{font-size:40px}
  .rpline{font-size:52px}.rpage.small .rpline{font-size:44px}.rpage .semo{font-size:36px}

  .readcard{font-size:120px;min-height:130px;padding:4px 20px}.readcard.shown{font-size:70px}.ropt .emo{font-size:60px}.ropt{padding:8px 14px}
  .semo{font-size:52px}.sline{font-size:40px}.storypage{padding:8px 14px 10px}.qopt .emo{font-size:52px}.qopt .w{font-size:34px}

  .combogrid{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin-bottom:8px}.combo .syl .col i{font-size:30px}.optc .syl .col i{font-size:40px}}
@media (max-width:520px){.two .slot{width:58px;height:58px;font-size:44px}.two .sylch{font-size:40px;margin-right:2px}.two .tonebox{width:24px;font-size:40px}
  .two .slots{gap:4px}.sylgroup{padding:4px}.combogrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.combo .syl .col i{font-size:34px}
  .say{font-size:20px;padding:12px 20px;min-height:56px}#sheet .card{padding:22px 18px;gap:18px}
  .tonecard .syl{font-size:72px}.tonecard svg{height:40px}}
.say{white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="head">
  <div id="bar">
    <button class="round" id="homeBtn" aria-label="回首頁">🏠</button>
    <a class="round" id="hall" href="../index.html" style="text-decoration:none;color:inherit">← 遊戲大廳</a>
    <span id="ltag" class="hide"></span>
    <span id="stars" aria-label="貼紙數">⭐ 0</span>
    <button class="round" id="gear" aria-label="家長區（按住兩秒）"><span class="fill"></span>⚙️</button>
  </div>
  <div id="stage">
    <button id="bird" aria-label="小藍，再說一次"></button>
    <div id="bubble" aria-live="polite"></div>
  </div>
  </div>
  <div id="view"></div>
</div>

<div class="overlay" id="start">
  <div class="bird" id="startBird"></div>
  <h1>ㄅㄆㄇ 小島</h1>
  <button class="say" id="go">▶ 點一下開始</button>
</div>

<script src="data.js"></script>
<script>
'use strict';
const { SYMBOLS, GROUPS, ONE, TWO, WORDS, COMBOS, SENTS, PASSAGES, LESSONS, CN, lessonTitle, STORIES, parseLine, pageText, NO_TAP, strokesOf, TONE_SETS, TONE_NAMES, TONE_MARKS, CONFUSE, P, parseSyl, syllables, hash, symOf } = ZY;
const $ = (s, el = document) => el.querySelector(s);
const view = $('#view');
const rand = n => Math.floor(Math.random() * n);
const pick = a => a[rand(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

/* ---------- 小藍（台灣藍鵲）---------- */
const BIRD = `<svg viewBox="0 0 120 120" aria-hidden="true">
  <path d="M30 78 C10 92 4 108 6 116 C14 110 22 104 34 96 Z" fill="#2468c2"/>
  <path d="M30 80 C18 96 14 110 18 118 C24 110 30 102 38 94 Z" fill="#3b82d6"/>
  <circle cx="7" cy="115" r="5" fill="#fff"/><circle cx="18" cy="117" r="5" fill="#fff"/>
  <ellipse cx="56" cy="74" rx="34" ry="30" fill="#2468c2"/>
  <ellipse cx="60" cy="82" rx="20" ry="17" fill="#6aa6ea"/>
  <path d="M34 66 C40 84 56 92 70 90 C56 84 46 74 44 62 Z" fill="#17488a"/>
  <circle cx="52" cy="40" r="25" fill="#22252b"/>
  <circle cx="58" cy="36" r="8" fill="#fff"/><circle cx="60" cy="37" r="4.5" fill="#22252b"/><circle cx="61.5" cy="35" r="1.6" fill="#fff"/>
  <circle cx="58" cy="36" r="10" fill="none" stroke="#ffd23c" stroke-width="2.5"/>
  <path class="beakTop" d="M62 38 L92 42 L62 46 Z" fill="#e0392b"/>
  <path class="beakBot" d="M62 44 L86 46 L62 50 Z" fill="#c22a1e"/>
  <circle cx="44" cy="50" r="5" fill="#ff8a8a" opacity=".5"/>
  <path d="M46 102 l-2 10 M52 102 l0 10 M64 102 l2 10 M70 102 l0 10" stroke="#e0392b" stroke-width="4" stroke-linecap="round"/>
</svg>`;
$('#bird').innerHTML = BIRD; $('#startBird').innerHTML = BIRD;

/* ---------- 進度 ---------- */
const KEY = 'zhuyin-v1';
const today = () => new Date().toISOString().slice(0, 10);
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { S = {}; }
S = Object.assign({ heard: {}, score: {}, spelled: {}, tones: [0, 0], stickers: [], day: today(), sec: 0, rest: 15 }, S);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
function mark(s, ok) { const v = S.score[s] || (S.score[s] = [0, 0]); v[ok ? 0 : 1]++; save(); }
function weight(s) { const v = S.score[s] || [0, 0]; return Math.max(.3, 1 + v[1] * 1.5 - Math.min(v[0], 4) * .2); }
function wpick(list, key = x => x) {
  const ws = list.map(x => weight(key(x))); let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; } return list[list.length - 1];
}
const STICKERS = ['🐻','🐼','🦊','🐸','🐙','🦄','🐳','🦋','🐞','🐢','🦒','🦁','🐧','🐬','🦉','🐨','🐹','🐰','🦕','🐝',
  '🌈','🌻','🍉','🍓','🍩','🧁','🍭','🚀','🚂','🎈','🪁','⚽','🎨','🎸','🏰','⛵','🌟','🌙','☀️','🍀'];
const updStars = () => { $('#stars').textContent = '⭐ ' + S.stickers.length; };

/* ---------- 聲音 ---------- */
let AC = null;
const bufs = new Map();
let cur = null;          // 正在播的 source
let token = 0;           // 換畫面就作廢舊的播放
function ctx() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } return AC; }
function load(text) {
  text = ZY.spoken(text);
  const id = hash(text);
  if (!bufs.has(id)) {
    bufs.set(id, fetch('audio/' + id + '.mp3').then(r => r.ok ? r.arrayBuffer() : null)
      .then(ab => ab && ctx() ? new Promise((ok, no) => ctx().decodeAudioData(ab, ok, no)) : null).catch(() => null));
  }
  return bufs.get(id);
}
function stopAll() { token++; if (cur) { try { cur.stop(); } catch (e) {} cur = null; } if (window.speechSynthesis) speechSynthesis.cancel(); talking(false); }
function talking(on) { $('#bird').classList.toggle('talk', on); }
let beak = null;
function beakAnim(on) { clearInterval(beak); if (on) { let o = false; beak = setInterval(() => { o = !o; talking(o); }, 140); } else talking(false); }
async function play(text) {
  const my = token;
  const buf = await load(text);
  if (my !== token) return false;
  beakAnim(true);
  try {
    if (buf) {
      await new Promise(res => {
        const src = ctx().createBufferSource(); src.buffer = buf; src.connect(ctx().destination);
        src.onended = res; cur = src; src.start();
      });
    } else await fallback(text);
  } finally { beakAnim(false); }
  return my === token;
}
function fallback(text) {
  return new Promise(res => {
    if (!window.speechSynthesis) return setTimeout(res, 600);
    const u = new SpeechSynthesisUtterance(ZY.spoken(text)); u.lang = 'zh-TW'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => /zh[-_]TW/i.test(v.lang)); if (v) u.voice = v;
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length * 380);
    speechSynthesis.speak(u);
  });
}
// 說話：泡泡顯示文字並念出來；多句依序念
let lastLines = [];
async function say(...lines) {
  lines = lines.filter(Boolean); stopAll(); const my = token; lastLines = lines;
  for (const l of lines) {
    if (my !== token) return false;
    $('#bubble').textContent = typeof l === 'object' ? (l.show || l.text) : l;
    if (!(await play(l.text || l))) return false;
    await sleep(160);
  }
  return my === token;
}
// 不改泡泡、不打斷題目重念的短音（點卡片時）
async function blip(text) { stopAll(); return play(text); }
const preload = (...t) => t.forEach(x => load(typeof x === 'object' ? x.text : x));
$('#bird').onclick = () => { $('#bird').classList.remove('hop'); void $('#bird').offsetWidth; $('#bird').classList.add('hop'); if (lastLines.length) say(...lastLines); };

/* ---------- 注音呈現 ---------- */
function sylHTML(z, litIdx = -1) {
  const s = typeof z === 'string' ? parseSyl(z) : z;
  const parts = s.parts.map((p, i) => `<i class="${i === litIdx ? 'on' : ''}">${p}</i>`).join('');
  return `<span class="syl${litIdx >= 0 ? ' lit' : ''}"><span class="col">${s.tone === 4 ? '<span class="neu">˙</span>' : ''}${parts}</span>${s.tone && s.tone < 4 ? `<span class="tn">${TONE_MARKS[s.tone]}</span>` : ''}</span>`;
}
function wordHTML(w, z, lit) {
  const chars = Array.from(w), sy = z.split(' ');
  return `<span class="wz">${chars.map((c, i) => `<span class="hz">${c}</span>${sylHTML(sy[i], i === 0 ? lit : -1)}`).join('')}</span>`;
}

/* ---------- 畫面切換 ---------- */
let screen = 'home';
function go(name, ...args) {
  stopAll(); screen = name; window.scrollTo(0, 0); closeSheet();
  if (!keepLesson) LES = null; keepLesson = false; updTag();
  $('#homeBtn').classList.toggle('hide', name === 'home');
  $('#hall').classList.toggle('hide', name !== 'home');
  SCREENS[name](...args);
}
setTimeout(updTag);
$('#homeBtn').onclick = () => go('home');

const SCREENS = {};
SCREENS.home = () => {
  view.innerHTML = `<div id="home">
    <button class="tile maptile" data-go="map"><span class="emo">🗺️</span><span class="lab">注音課程</span><span class="sub">${lessonsDone() >= LESSONS.length ? '全部完成！' : `第 ${lessonsDone() + 1} 課`}</span></button>
    <button class="tile" data-go="learn"><span class="big">ㄅㄆㄇ</span><span class="lab">認識注音</span></button>
    <button class="tile" data-go="listen"><span class="emo">👂</span><span class="lab">聽音找注音</span></button>
    <button class="tile" data-go="first"><span class="emo">🍉</span><span class="lab">第一個音</span></button>
    <button class="tile" data-go="write"><span class="emo">✏️</span><span class="lab">寫注音</span></button>
    <button class="tile" data-go="spell"><span class="emo">🧩</span><span class="lab">拼拼看</span></button>
    <button class="tile" data-go="combo"><span class="big">ㄧㄚ</span><span class="lab">結合韻</span></button>
    <button class="tile" data-go="tone"><span class="big">ˉˊˇˋ</span><span class="lab">四聲</span></button>
    <button class="tile" data-go="story"><span class="emo">📚</span><span class="lab">小故事</span></button>
    <button class="tile" data-go="book"><span class="emo">📒</span><span class="lab">貼紙簿</span></button>
  </div>`;
  view.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  say(S.stickers.length ? P.pickOne : P.hello, ...(S.stickers.length ? [] : [P.pickOne]));
};

/* 認識注音 */
let learnTab = 'c';
SCREENS.learn = (fromTab) => {
  const groups = learnTab === 'c' ? ['c'] : ['m', 'v'];
  view.innerHTML = `<div class="tabs"><button class="tab ${learnTab === 'c' ? 'on' : ''}" data-t="c">聲母</button><button class="tab ${learnTab !== 'c' ? 'on' : ''}" data-t="v">介音・韻母</button></div>
    ${groups.map(g => `${groups.length > 1 ? `<div class="grouplabel">${GROUPS[g]}</div>` : ''}<div class="symgrid">${SYMBOLS.filter(x => x.g === g).map(x =>
      `<button class="zg sym ${S.heard[x.s] ? 'heard' : ''}" data-s="${x.s}" aria-label="${x.s}">${x.s}</button>`).join('')}</div>`).join('')}`;
  view.querySelectorAll('.tab').forEach(b => b.onclick = () => { learnTab = b.dataset.t; SCREENS.learn(true); say(learnTab === 'c' ? P.learnTabC : P.learnTabV); });
  view.querySelectorAll('.sym').forEach(b => b.onclick = () => openSym(b.dataset.s, b));
  if (!fromTab) say(P.learnIntro);
};
function openSym(s, btn) {
  const x = symOf(s);
  S.heard[s] = 1; save(); if (btn) btn.classList.add('heard');
  const sh = h(`<div id="sheet"><div class="card">
    <div class="zg">${s}</div>
    <div class="ex"><span class="emo">${x.e}</span><span style="font-size:72px">${wordHTML(x.w, x.z, x.z.split(' ')[0].includes(s) ? Array.from(x.z.split(' ')[0]).indexOf(s) : -1)}</span></div>
    <div class="acts"><button class="say" data-a="again">🔊 再聽一次</button><button class="say alt" data-a="close">✔ 好了</button></div>
  </div></div>`);
  document.body.appendChild(sh);
  const speak = () => say(P.sym(s), P.symEx(s));
  sh.querySelector('[data-a=again]').onclick = speak;
  sh.querySelector('[data-a=close]').onclick = () => { stopAll(); closeSheet(); };
  sh.onclick = e => { if (e.target === sh) { stopAll(); closeSheet(); } };
  speak();
}
function closeSheet() { const s = $('#sheet'); if (s) s.remove(); }

/* 共用：一輪題目 */
function dotsHTML(n, i) { return `<div class="dots">${Array.from({ length: n }, (_, k) => `<span class="${k < i ? 'done' : ''}"></span>`).join('')}</div>`; }
async function finishRound() {
  const left = STICKERS.filter(x => !S.stickers.includes(x));
  const st = left.length ? pick(left) : pick(STICKERS);
  S.stickers.push(st); save(); updStars();
  const r = h(`<div id="reward"><div class="card"><div class="stk got">${st}</div>
    <div class="row"><button class="say" data-a="again">🔁 再玩一次</button><button class="say alt" data-a="home">🏠 回首頁</button></div></div></div>`);
  const back = screen === 'writeOne' ? 'write' : screen;
  document.body.appendChild(r);
  r.querySelector('[data-a=again]').onclick = () => { r.remove(); go(back); };
  r.querySelector('[data-a=home]').onclick = () => { r.remove(); go('home'); };
  say(P.roundDone);
}

/* 聽音找注音 */
function distractors(ans, pool, n) {
  const out = [];
  const conf = CONFUSE.find(c => c.includes(ans));
  const v = S.score[ans] || [0, 0];
  if (conf && v[0] >= 2) out.push(...shuffle(Array.from(conf).filter(c => c !== ans && pool.includes(c))).slice(0, 1));
  for (const c of shuffle(pool)) { if (out.length >= n) break; if (c !== ans && !out.includes(c) && !(conf && conf.includes(c) && v[0] < 2)) out.push(c); }
  return out;
}
SCREENS.listen = (o = {}) => {
  const N = o.N || 8; let i = 0; let queue = [], last = null; const done = o.done || finishRound;
  const groupOf = s => symOf(s).g;
  const next = () => {
    if (i >= N) return done();
    const all = o.pool || SYMBOLS.map(x => x.s);
    let s = queue.length && Math.random() < .6 ? queue.shift() : null;
    if (!s) { let k = 0; do { s = o.focus && Math.random() < .6 ? wpick(o.focus) : wpick(all); } while (s === last && k++ < 9); }
    last = s;
    let pool = all.filter(x => (groupOf(s) === 'c') === (groupOf(x) === 'c')); if (pool.length < 3) pool = all;
    const opts = shuffle([s, ...distractors(s, pool, 2)]);
    let wrong = 0, first = true;
    view.innerHTML = `<div class="center">${dotsHTML(N, i)}
      <div class="opts">${opts.map(o => `<button class="zg opt" data-s="${o}">${o}</button>`).join('')}</div>
      <button class="say" id="again">🔊 再聽一次</button></div>`;
    $('#again').onclick = () => say(P.find(s));
    view.querySelectorAll('.opt').forEach(b => b.onclick = async () => {
      if (b.classList.contains('ok') || b.classList.contains('no')) return;
      if (b.dataset.s === s) {
        b.classList.add('ok'); if (first) mark(s, true); view.querySelectorAll('.opt').forEach(o => o.disabled = true);
        i++; const ok = await say(pick(P.praise)); if (ok) next();
      } else {
        first = false; wrong++; b.classList.add('no'); mark(s, false); if (!queue.includes(s)) queue.push(s);
        if (wrong >= 1) view.querySelector(`.opt[data-s="${s}"]`).classList.toggle('glow', wrong >= 1);
        await say(P.thisIs(b.dataset.s), P.find(s));
      }
    });

/* 可重用的寫字板：在 box 裡寫一個注音 s；hint=true 時顯示淡淡的字和起點 */
function writePad(box, s, o = {}) {
  box.innerHTML = '<canvas></canvas>';
  const cv = box.querySelector('canvas'), g = cv.getContext('2d');

  function draw() {
    g.clearRect(0, 0, cv.width, cv.height);
    if (hint) strokes.forEach(d => line(d, 9, '#e6eee8'));
    for (let i = 0; i < cur; i++) line(strokes[i], 8, '#1c3765');
    if (cur < strokes.length && (hint || miss >= 2)) dot(strokes[cur][0], 4.2, '#2e9d57');
    if (drawing) line(drawing, 6, '#2468c2');
  }
  const fit = () => { const r = box.getBoundingClientRect(); const dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; px = cv.width / 100; draw(); };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100]; };
  cv.addEventListener('pointerdown', e => { if (dead || cur >= strokes.length) return; e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = [pos(e)]; draw(); });
  cv.addEventListener('pointermove', e => { if (!drawing) return; const p = pos(e); if (dist(p, drawing[drawing.length - 1]) > .8) { drawing.push(p); draw(); } });
  cv.addEventListener('pointerup', () => {
    if (!drawing) return; const u = drawing; drawing = null;
    if (checkStroke(u, strokes[cur])) { cur++; chime(true); draw(); if (cur >= strokes.length) { dead = true; setTimeout(() => o.onDone && o.onDone(), 250); } }

          slots[k].textContent = sy.parts[k]; slots[k].classList.remove('next'); slots[k].classList.add('fill');
          blip(P.sym(sy.parts[k])); k++; hintOn = false;
          if (k < sy.parts.length) startPart(); else askTone();
        },
      });
    };
    const askTone = () => {
      const sy = syls[si];
      $('#wwpad').innerHTML = `<div class="wwbig">${sylHTML({ parts: sy.parts, tone: 0 })}</div>`;
      $('#wtools').classList.add('hide'); $('#wtones').classList.remove('hide');
      $('#wtones').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      body.querySelectorAll('#wtones .tonecard').forEach(b => b.onclick = async () => {
        if (b.classList.contains('ok') || b.classList.contains('no')) return;
        const n = +b.dataset.n;
        if (n === sy.tone) {
          b.classList.add('ok'); body.querySelectorAll('#wtones .tonecard').forEach(x => x.disabled = true);
          group(si).querySelector('.tonebox').textContent = sy.tone === 4 ? '˙' : TONE_MARKS[sy.tone];
          group(si).classList.add('done');
          $('#wwpad').innerHTML = `<div class="wwbig">${sylHTML(sy)}</div>`;
          const last = si === syls.length - 1;
          const lines = [P.spellSyl(chars[si], zs[si])];
          if (last) { S.spelled[w.w] = (S.spelled[w.w] || 0) + 1; save(); i++; if (two) lines.push(P.spellWordDone(w.w)); lines.push(pick(P.praise)); }
          const ok = await say(...lines); if (!ok) return;
          if (last) next(); else { si++; startSyl(); say(P.wwNext(chars[si])); }
        } else { b.classList.add('no'); body.querySelector(`#wtones .tonecard[data-n="${sy.tone}"]`).classList.add('glow'); await say(w.w, P.wwTone); }
      });
      say(w.w, P.wwTone);
    };
    $('#whint').onclick = () => { hintOn = !hintOn; pad.setHint(hintOn); };
    $('#wclr').onclick = () => pad.clear();
    startSyl();
    preload(...chars.map((c, s) => P.spellSyl(c, zs[s])), ...syls.flatMap(s => s.parts.map(P.sym)));
    say(P.wwQ(w.w));
  };
  say(two ? P.wwIntro2 : P.wwIntro).then(ok => ok && next());
};

/* 只看注音讀短文：讀完回答問題，最後才出現國字 */
SCREENS.readP = (o = {}) => {
  const done = o.done || finishRound;
  S.readP = S.readP || {};
  const pi = o.pi != null ? o.pi : PASSAGES.findIndex((x, k) => !S.readP[k]) >= 0 ? PASSAGES.findIndex((x, k) => !S.readP[k]) : rand(PASSAGES.length);
  const ps = PASSAGES[pi];
  const body = o.into ? $(o.into) : view;

  let qi = 0;

    const q = ps.qs[qi]; const order = shuffle(q.o.map((_, k) => k));
    $('#rpq').innerHTML = `<div class="center">${dotsHTML(ps.qs.length, qi)}<div class="opts">${order.map(k => `<button class="pic ropt rpopt" data-k="${k}"><span class="emo">${q.o[k][0]}</span></button>`).join('')}</div>
      <button class="say alt" id="rpagain">🔊 再聽題目</button></div>`;
    $('#rpagain').onclick = () => say(q.q);
    body.querySelectorAll('.rpopt').forEach(b => b.onclick = async () => {
      if (b.classList.contains('ok') || b.classList.contains('no')) return;
      const k = +b.dataset.k;
      if (k === q.a) { b.classList.add('ok'); body.querySelectorAll('.rpopt').forEach(x => x.disabled = true); qi++; const ok = await say(q.o[k][1], pick(P.praise)); if (ok) ask(); }
      else { b.classList.add('no'); body.querySelector(`.rpopt[data-k="${q.a}"]`).classList.add('glow'); await say(q.o[k][1], q.q); }
    });
    preload(...q.o.map(x => x[1]));
    say(q.q);
  };
  const reveal = async () => {
    S.readP[pi] = (S.readP[pi] || 0) + 1; save();
    $('#rpq').innerHTML = '';
    $('#rp').innerHTML = `<div class="semo">${ps.e}</div>${sents.map(t => `<div class="sline">${lineHTML({ t })}</div>`).join('')}`;
    $('#rp').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    const ok = await say(P.rpReveal, { text, show: ps.title });
    if (ok) done();
  };
  $('#rpgo').onclick = () => { $('#rpgo').remove(); $('#rp').classList.add('small'); ask(); };
  preload(text);
  say(P.rpIntro);
};

/* 只看注音讀短句 */
function zyLineHTML(t) {
  // 標點黏在前一個詞後面，避免自己換到下一行
  const out = [];
  for (const x of parseLine(t)) {
    if (x.z) out.push(`${x.z.split(' ').map(z => sylHTML(z)).join('')}`);
    else if (out.length) out[out.length - 1] += `<span class="punct">${x.w}</span>`;
    else out.push(`<span class="punct">${x.w}</span>`);
  }
  return out.map(h => `<span class="zw">${h}</span>`).join('');
}
SCREENS.readS = (o = {}) => {
  const done = o.done || finishRound;
  const N = o.N || 5; let i = 0;
  const list = shuffle(SENTS).slice(0, N);
  const body = o.into ? $(o.into) : view;
  const next = () => {
    if (i >= N) return done();
    const x = list[i]; let first = true;
    const opts = shuffle([x, ...shuffle(SENTS.filter(y => y !== x)).slice(0, 2)]);
    body.innerHTML = `<div class="center">${dotsHTML(N, i)}
      <div class="storypage rsline" id="rsl" data-t="${pageText(x)}"><div class="sline">${zyLineHTML(x.t)}</div></div>
      <div class="opts">${opts.map((y, k) => `<button class="pic ropt rsopt" data-k="${SENTS.indexOf(y)}"><span class="emo">${y.e}</span></button>`).join('')}</div></div>`;
    body.querySelectorAll('.rsopt').forEach(b => b.onclick = async () => {
      if (b.classList.contains('ok') || b.classList.contains('no')) return;
      if (SENTS[+b.dataset.k] === x) {
        b.classList.add('ok'); body.querySelectorAll('.rsopt').forEach(z => z.disabled = true);
        $('#rsl').innerHTML = `<div class="sline">${lineHTML(x)}</div>`;
        i++; const ok = await say({ text: pageText(x), show: pageText(x) }, pick(P.praise)); if (ok) next();
      } else {
        first = false; b.classList.add('no'); body.querySelector(`.rsopt[data-k="${SENTS.indexOf(x)}"]`).classList.add('glow');
        await say(P.rsIntro);
      }
    });
    preload(pageText(x));
    $('#bubble').textContent = P.rsIntro; lastLines = [P.rsIntro];
  };
  say(P.rsIntro).then(ok => ok && next());
};

/* 四聲 */
const CURVES = ['M10 18 L90 18', 'M10 46 L90 10', 'M10 18 Q42 62 90 12', 'M10 8 L90 48', 'M49 28 L51 28'];
const curveSVG = n => `<svg viewBox="0 0 100 56" aria-hidden="true"><path d="${CURVES[n]}" fill="none" stroke="#e0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let toneMode = 'learn';
SCREENS.tone = () => {
  view.innerHTML = `<div class="tabs"><button class="tab ${toneMode === 'learn' ? 'on' : ''}" data-m="learn">聽一聽</button><button class="tab ${toneMode === 'quiz' ? 'on' : ''}" data-m="quiz">考考你</button></div><div id="tbody"></div>`;
  view.querySelectorAll('.tab').forEach(b => b.onclick = () => { toneMode = b.dataset.m; SCREENS.tone(); });
  (toneMode === 'learn' ? toneLearn : toneQuiz)();
};
function toneCards(set, cls = '') {
  return `<div class="tones">${set.ch.map((c, n) => `<button class="tonecard ${cls}" data-n="${n}">${curveSVG(n)}${sylHTML({ parts: Array.from(set.base), tone: n })}<span class="nm">${TONE_NAMES[n]}</span></button>`).join('')}</div>`;
}
let toneSetIdx = 0;
SCREENS.toneL = o => { view.innerHTML = '<div id="tbody"></div>'; toneLearn(o); };
SCREENS.toneQ = o => { view.innerHTML = '<div id="tbody"></div>'; toneQuiz(o); };
function toneLearn(o = {}) {
  const set = TONE_SETS[toneSetIdx % TONE_SETS.length];
  $('#tbody').innerHTML = `<div class="center">${toneCards(set)}<button class="say alt" id="more">換一組 🔁</button></div>`;
  $('#tbody').querySelectorAll('.tonecard').forEach(b => b.onclick = () => { const n = +b.dataset.n; b.classList.remove('ok'); void b.offsetWidth; b.classList.add('ok'); say(P.toneEx(set.ch[n], n)); });
  if (o.done) { $('#more').insertAdjacentHTML('afterend', '<button class="say" id="lnext">下一步 ▶</button>'); $('#lnext').onclick = () => o.done(); }
  $('#more').onclick = () => { toneSetIdx++; toneLearn(o); say(...TONE_SETS[toneSetIdx % TONE_SETS.length].ch.map((c, n) => P.toneEx(c, n))); };
  say(P.toneIntro, P.toneLearn);
}
function toneQuiz(o = {}) {
  const N = o.N || 6; let i = 0; let lastSet = -1; const done = o.done || finishRound;
  const next = () => {
    if (i >= N) return done();
    let si; do { si = rand(TONE_SETS.length); } while (si === lastSet); lastSet = si;
    const set = TONE_SETS[si]; const n = rand(4); const c = set.ch[n]; let first = true;
    $('#tbody').innerHTML = `<div class="center">${dotsHTML(N, i)}<button class="say" id="again">🔊 再聽一次</button>${toneCards(set)}</div>`;
    $('#again').onclick = () => say(P.toneQ(c));
    $('#tbody').querySelectorAll('.tonecard').forEach(b => b.onclick = async () => {
      if (b.classList.contains('ok') || b.classList.contains('no')) return;
      if (+b.dataset.n === n) {
        b.classList.add('ok'); S.tones[first ? 0 : 1]++; save(); i++;
        $('#tbody').querySelectorAll('.tonecard').forEach(o => o.disabled = true);
        const ok = await say(P.toneEx(c, n), pick(P.praise)); if (ok) next();
      } else {
        first = false; b.classList.add('no'); S.tones[1]++; save();
        $('#tbody').querySelector(`.tonecard[data-n="${n}"]`).classList.add('glow');
        await say(P.toneEx(set.ch[+b.dataset.n], +b.dataset.n), P.toneQ(c));
      }
    });
    preload(P.toneEx(c, n), ...set.ch.map((x, k) => P.toneEx(x, k)));
    say(P.toneQ(c));
  };
  next();
}

/* ---------- 家長區：按住兩秒＋加法 ---------- */
(() => {
  const g = $('#gear'), f = g.querySelector('.fill'); let t0 = 0, raf = 0;
  const down = e => { e.preventDefault(); t0 = performance.now(); const tick = () => { const p = (performance.now() - t0) / 2000; f.style.height = Math.min(100, p * 100) + '%'; if (p >= 1) { up(); gate(); } else raf = requestAnimationFrame(tick); }; raf = requestAnimationFrame(tick); };
  const up = () => { cancelAnimationFrame(raf); f.style.height = '0'; };
  g.addEventListener('pointerdown', down); g.addEventListener('pointerup', up); g.addEventListener('pointerleave', up); g.addEventListener('pointercancel', up);
  g.addEventListener('contextmenu', e => e.preventDefault());
})();
function gate() {
  stopAll();
  const a = 3 + rand(7), b = 4 + rand(6), ans = a + b;
  const opts = shuffle([ans, ans + 1 + rand(3), ans - 1 - rand(3)]);
  const o = h(`<div class="overlay" id="parent"><div class="panel" style="text-align:center"><h2>家長區</h2>
    <p class="gate">${a} + ${b} = ?</p><div class="row" style="justify-content:center">${opts.map(x => `<button class="say alt" data-v="${x}">${x}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="chip" data-a="x">取消</button></div></div></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('[data-v]').forEach(btn => btn.onclick = () => { if (+btn.dataset.v === ans) { o.remove(); parentPanel(); } else o.remove(); });
  o.querySelector('[data-a=x]').onclick = () => o.remove();
}
function parentPanel() {
  const lvl = s => { const v = S.score[s]; if (!v) return ''; const c = v[0]; return (c >= 6 ? 's3' : c >= 3 ? 's2' : c >= 1 ? 's1' : '') + (v[1] > v[0] && v[1] >= 2 ? ' weak' : ''); };
  const weak = SYMBOLS.filter(x => { const v = S.score[x.s]; return v && v[1] >= 2 && v[1] >= v[0] / 2; }).map(x => x.s);
  const o = h(`<div class="overlay" id="parent">
    <div class="panel"><h2>進度</h2>
      <div class="row"><span>今天玩了 <b>${Math.round(S.sec / 60)}</b> 分鐘</span><span>・貼紙 <b>${S.stickers.length}</b> 張</span><span>・聽過 <b>${Object.keys(S.heard).length}</b>／37 個注音</span></div>
      <p class="note">每個注音答對的次數：淺黃 1 次以上、黃 3 次以上、綠 6 次以上；紅框是常答錯的。</p>
      <div class="mini">${SYMBOLS.map(x => `<span class="${lvl(x.s)}">${x.s}</span>`).join('')}</div>
      <p class="note">需要多練：${weak.length ? weak.join(' ') : '目前沒有'}　拼過的字：${Object.keys(S.spelled).join('、') || '還沒有'}　四聲答對 ${S.tones[0]} 題</p>
    </div>
    <div class="panel"><h2>設定</h2>
      <div class="row">休息提醒：${[0, 10, 15, 20, 30].map(m => `<button class="chip ${S.rest === m ? 'on' : ''}" data-rest="${m}">${m ? m + ' 分鐘' : '關閉'}</button>`).join('')}</div>
      <div class="row"><button class="chip" data-a="fs">全螢幕</button><button class="chip" data-a="reset">清除進度</button><a class="chip" href="../index.html" style="text-decoration:none;color:inherit">回遊戲大廳</a></div>
      <p class="note">筆順依據教育部《國字標準字體筆順學習網》。聲音：微軟台灣中文神經語音（雲哲 YunJhe）預錄。進度只存在這台裝置的瀏覽器裡。</p>
    </div>
    <button class="say" data-a="close">✔ 回到遊戲</button></div>`);
  document.body.appendChild(o);
  o.querySelectorAll('[data-rest]').forEach(b => b.onclick = () => { S.rest = +b.dataset.rest; save(); o.remove(); parentPanel(); });
  o.querySelector('[data-a=fs]').onclick = () => fullscreen();
  o.querySelector('[data-a=reset]').onclick = e => {
    if (e.target.dataset.sure) { const r = S.rest; S = { heard: {}, score: {}, spelled: {}, tones: [0, 0], stickers: [], day: today(), sec: 0, rest: r }; save(); updStars(); o.remove(); go('home'); }
    else { e.target.dataset.sure = 1; e.target.textContent = '再按一次確定清除'; }
  };
  o.querySelector('[data-a=close]').onclick = () => { o.remove(); if (screen === 'home') go('home'); };
}
function fullscreen() { const d = document.documentElement; const f = d.requestFullscreen || d.webkitRequestFullscreen; if (f && !document.fullscreenElement) try { f.call(d).catch(() => {}); } catch (e) {} }

/* ---------- 遊玩時間與休息提醒 ---------- */
let restShown = 0;
setInterval(() => {
  if (document.hidden || !$('#start').classList.contains('hide')) return;
  if (S.day !== today()) { S.day = today(); S.sec = 0; restShown = 0; }
  S.sec += 5; if (S.sec % 30 === 0) save();
  if (S.rest && S.sec >= S.rest * 60 * (restShown + 1) && !$('#rest')) {
    restShown++; stopAll();
    const o = h(`<div class="overlay" id="rest"><div class="bird" style="width:160px;height:160px">${BIRD}</div><p style="font-size:30px;font-weight:900">${P.rest}</p><button class="say alt">我休息好了</button></div>`);
    document.body.appendChild(o); play(P.rest);
    o.querySelector('button').onclick = () => o.remove();
  }
}, 5000);

/* ---------- 開始 ---------- */
$('#go').onclick = () => {
  const c = ctx(); if (c && c.state === 'suspended') c.resume();
  if (matchMedia('(pointer:coarse)').matches) fullscreen();
  $('#start').classList.add('hide'); updStars(); go('home');
};
preload(P.hello, P.pickOne);
