<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>銘甲戰記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#14191e; --panel:#1a2127; --panel2:#20282f; --line:#2b353e;
  --ink:#e3e8eb; --mute:#8d9ba6; --dim:#5f6d78;
  --p:#8fd0ff; --pbg:#153250; --pline:#2f6c9f;
  --e:#ff8f7e; --ebg:#461d1b; --eline:#903c34;
  --amber:#f3bb4f; --good:#86d49a; --bad:#ff8f7e;
  --mv:rgba(86,156,255,.32); --atk:rgba(255,120,95,.28); --thr:rgba(255,95,75,.14); --rep:rgba(120,220,150,.30);
  --cs:40px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit}
#app{max-width:1300px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hall{position:relative;z-index:70;align-self:center;font-size:12px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.hall:hover,.hall:focus-visible{color:var(--ink);border-color:var(--pline);outline:none}
.logo{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.12em;color:var(--ink)}
.logo b{color:var(--amber);font-weight:900}
#stageName{color:var(--mute);font-size:14px;letter-spacing:.06em}
.turninfo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px}
.phase{padding:2px 10px;border-radius:3px;font-family:var(--sans);font-weight:700;letter-spacing:.1em;font-size:12px}
.phase.P{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.phase.E{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:1fr}}
.board{min-width:0}
.mapwrap{overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(var(--cols),var(--cs));grid-auto-rows:var(--cs);gap:1px;background:var(--line);border:1px solid var(--line);width:max-content;margin:0 auto;touch-action:manipulation}
.c{position:relative;background:#1f272e;display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.c .tg{font-family:var(--mono);font-size:calc(var(--cs)*.46);line-height:1;pointer-events:none;font-variant-emoji:text}
.t-plain .tg{color:#3d4a55}
.t-forest{background:#1c2a24}.t-forest .tg{color:#6ea56b}
.t-mount{background:#2a261f}.t-mount .tg{color:#b99d73}
.t-water{background:#172839}.t-water .tg{color:#5b95c2}
.t-wall{background:repeating-linear-gradient(45deg,#39434c 0 3px,#2a3239 3px 7px);cursor:default}.t-wall .tg{visibility:hidden}
.t-base{background:#2a2718}.t-base .tg{color:var(--amber)}
.t-ruin{background:#24262a}.t-ruin .tg{color:#858b91}
.c::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1}
.c.thr::after{background:var(--thr);box-shadow:inset 0 0 0 1px rgba(255,110,90,.28)}
.c.mv::after{background:var(--mv)}
.c.ra::after{background:rgba(255,120,95,.13);box-shadow:inset 0 0 0 1px rgba(255,120,95,.22)}
.c.atk::after{background:var(--atk)}
.c.rep::after{background:var(--rep)}
.c:hover::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(243,187,79,.55);z-index:3;pointer-events:none}
.u{position:absolute;inset:2px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:calc(var(--cs)*.6);line-height:1;border-radius:3px;z-index:2;pointer-events:none;transition:filter .2s}
.u.P{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.u.E{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}
.u.boss{box-shadow:inset 0 0 0 2px var(--amber)}
.u.acted{filter:grayscale(.9) brightness(.6)}
.u i{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:rgba(0,0,0,.45);border-radius:1px}
.u i::after{content:"";display:block;height:100%;width:var(--h);background:currentColor;border-radius:1px}
.u.fly::before{content:"";position:absolute;top:2px;right:3px;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:5px solid currentColor;opacity:.8}
.c.sel .u{outline:2px solid var(--amber);outline-offset:0;animation:pulse 1s ease-in-out infinite}
.c.tgt .u{outline:2px solid var(--e);animation:pulse .8s ease-in-out infinite}
.c.rtg .u{outline:2px solid var(--good)}
.c.hit .u{animation:shake .35s}
@keyframes pulse{50%{outline-color:transparent}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;color:var(--mute);font-size:12.5px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:2px;font-family:var(--mono);font-size:12px}
.legend .num{font-family:var(--mono);color:var(--dim)}

.panel{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:#4a5a67;background:#253039}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--amber);color:#1c1508;border-color:var(--amber);font-weight:700}
.btn.pri:hover:not(:disabled){background:#ffc964}
.btn.on{border-color:var(--amber);color:var(--amber)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.toggles label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.box h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:500}
.actions .hint{color:var(--mute);margin:0}
.actions .row{display:flex;flex-wrap:wrap;gap:8px}
.actions .wlist{display:flex;flex-direction:column;gap:6px}
.wbtn{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:8px 10px}
.wbtn small{color:var(--mute);font-family:var(--mono);font-size:11.5px}
.wbtn .why{color:var(--bad);font-family:var(--sans)}

.uc-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.uc-g{width:48px;height:48px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:30px;border-radius:4px;flex:none}
.P .uc-g{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.E .uc-g{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}
.uc-head b{display:block;font-size:16px}
.uc-head small{color:var(--mute)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-family:var(--mono);font-size:12px;margin-bottom:8px}
.bar{height:6px;background:#0f1418;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.bar.hp i{background:var(--good)} .bar.hp.low i{background:var(--bad)} .bar.en i{background:#6aa9e0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.stats div{background:var(--panel2);border-radius:3px;padding:4px 0;text-align:center}
.stats small{display:block;color:var(--mute);font-size:11px;letter-spacing:.06em}
.stats span{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{font-size:11.5px;padding:1px 7px;border-radius:10px;background:#2c2715;color:var(--amber);box-shadow:inset 0 0 0 1px #5b4a1f}
.wt{width:100%;border-collapse:collapse;font-size:12.5px}
.wt th{color:var(--dim);font-weight:500;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);font-size:11.5px}
.wt td{padding:4px;border-bottom:1px solid #222b32;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wt td:first-child{font-family:var(--sans)}
.wt .tag{font-family:var(--sans);font-size:10.5px;color:var(--amber);margin-left:4px}
.tinfo{color:var(--mute);font-size:12.5px;min-height:1.5em}
.tinfo b{color:var(--ink);font-weight:500}
.logwrap ol{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.logwrap li{color:#b9c4cc}
.logwrap li.q{color:var(--p)} .logwrap li.eq{color:var(--e)}
.logwrap li.good{color:var(--good)} .logwrap li.bad{color:var(--bad)} .logwrap li.sys{color:var(--amber)}

.modal{position:fixed;inset:0;background:rgba(8,11,14,.72);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--panel);border:1px solid #38444f;border-radius:8px;padding:20px 22px;width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox.wide{width:min(780px,100%)}
.mbox h2{font-family:var(--serif);font-weight:900;font-size:22px;margin:0 0 10px;letter-spacing:.06em;text-wrap:balance}
.mbox h4{margin:18px 0 6px;font-size:13px;letter-spacing:.12em;color:var(--amber);font-weight:700}
.mbox p{margin:0 0 8px}
.mbox .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.brief p{margin:0 0 10px;max-width:60ch}
.brief .say{color:var(--p)} .brief .esay{color:var(--e)}
.cond{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--panel2);border-radius:4px;padding:10px 12px;margin-top:10px;font-size:13px}
.cond dt{color:var(--mute)} .cond dd{margin:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{background:var(--panel2);border-radius:6px;padding:10px 12px}
.vs .who{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.vs .g{font-family:var(--serif);font-weight:900;font-size:22px;width:34px;height:34px;display:grid;place-items:center;border-radius:3px}
.vs .P .g{background:var(--pbg);color:var(--p)} .vs .E .g{background:var(--ebg);color:var(--e)}
.vs dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.vs dt{color:var(--mute)} .vs dd{margin:0;font-family:var(--mono)}
.vs .kill{color:var(--amber);font-family:var(--sans);font-size:11.5px;margin-left:4px}
.react{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.react .btn{text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.react .btn b{font-size:15px}
.react small{color:var(--mute);font-family:var(--mono);font-size:12px}
.spl{display:flex;flex-direction:column;gap:6px}
.spl .btn{display:grid;grid-template-columns:4em 3.5em 1fr;gap:8px;align-items:center;text-align:left}
.spl .cost{font-family:var(--mono);color:var(--amber)}
.spl .d{color:var(--mute);font-size:12.5px}

.title{text-align:center}
.t-logo{font-family:var(--serif);font-weight:900;font-size:clamp(40px,11vw,64px);letter-spacing:.2em;line-height:1.1;margin:6px 0 4px;padding-left:.2em}
.t-logo b{color:var(--amber)}
.t-sub{color:var(--mute);margin-bottom:18px}
.t-demo{font-family:var(--mono);color:var(--dim);white-space:pre;font-size:13px;line-height:1.35;margin:0 auto 18px;display:inline-block;text-align:left}
.t-demo .p{color:var(--p);font-family:var(--serif);font-weight:900} .t-demo .e{color:var(--e);font-family:var(--serif);font-weight:900}
.t-demo .f{color:#6ea56b} .t-demo .m{color:#b99d73} .t-demo .w{color:#5b95c2}
.stlist{display:flex;flex-direction:column;gap:8px;max-width:360px;margin:0 auto}
.stlist .btn{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.stlist small{color:var(--mute)}

.help table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.help th,.help td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.help th{color:var(--dim);font-weight:500}
.help td.g{font-family:var(--mono);font-size:16px}
.help ul{margin:0 0 6px;padding-left:1.2em}
.help li{margin-bottom:3px}
.help .formula{font-family:var(--mono);background:var(--panel2);padding:8px 10px;border-radius:4px;font-size:12.5px;overflow-x:auto;white-space:pre}

.battle{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(6,9,12,.82);padding:16px;cursor:pointer}
.bt{width:min(720px,100%);background:#10161b;border:1px solid #33404b;border-radius:8px;padding:20px}
.bt-row{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:10px}
.bt-side{text-align:center}
.bt-g{width:clamp(56px,16vw,84px);height:clamp(56px,16vw,84px);margin:0 auto 8px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:clamp(34px,10vw,54px);border-radius:6px;transition:transform .15s}
.bt-side.P .bt-g{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.bt-side.E .bt-g{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}
.bt-g.shake{animation:shake .3s 2}
.bt-g.down{filter:grayscale(1) brightness(.4)}
.bt-name{font-size:12.5px;color:var(--mute);margin-bottom:6px}
.bt-hp{font-family:var(--mono);font-size:12px;margin-top:4px}
.bt-side .bar i{transition:width .5s ease-out}
.bt-mid{text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.bt-w{font-weight:700;color:var(--amber);min-height:1.4em}
.bt-arrow{height:3px;background:#27323b;position:relative;overflow:hidden;border-radius:2px}
.bt-arrow i{position:absolute;top:0;bottom:0;width:0;background:var(--amber)}
.bt-arrow.ltr i{left:0;animation:shoot .45s ease-in forwards}
.bt-arrow.rtl i{right:0;animation:shoot .45s ease-in forwards}
@keyframes shoot{to{width:100%}}
.bt-res{font-family:var(--mono);font-size:22px;font-weight:600;min-height:1.4em}
.bt-res.hit{color:#fff}.bt-res.miss{color:var(--dim)}.bt-res.crit{color:var(--amber)}
.bt-line{margin-top:14px;min-height:1.5em;text-align:center;color:var(--mute);font-size:13px}
.bt-skip{text-align:center;color:var(--dim);font-size:11.5px;margin-top:6px}
.banner{position:fixed;left:0;right:0;top:40%;z-index:55;pointer-events:none;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(28px,7vw,44px);letter-spacing:.3em;padding:14px 0;animation:ban .9s ease-out forwards}
.banner.P{background:linear-gradient(90deg,transparent,rgba(21,50,80,.92) 20%,rgba(21,50,80,.92) 80%,transparent);color:var(--p)}
.banner.E{background:linear-gradient(90deg,transparent,rgba(70,29,27,.92) 20%,rgba(70,29,27,.92) 80%,transparent);color:var(--e)}
@keyframes ban{0%{opacity:0;transform:scaleY(.2)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

.stats{grid-template-columns:repeat(6,1fr)}
.rt{margin-left:10px;font-size:11.5px;padding:1px 8px;border-radius:10px;background:#2c2715;color:var(--amber);box-shadow:inset 0 0 0 1px #5b4a1f;letter-spacing:.08em}
.winlbl{color:var(--mute);font-size:12.5px;margin:-8px 0 12px}
.c.exit::before{content:"";position:absolute;inset:3px;border:1px dashed var(--good);border-radius:2px;z-index:1;pointer-events:none}
.legend .sw.exit{position:relative;border:1px dashed var(--good)}
.u.guest{background:#1d3a2c;color:#9fe3b4;box-shadow:inset 0 0 0 1px #3f7d58}
.u.talkable::after{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.c.ttg .u{outline:2px solid var(--good);animation:pulse .8s ease-in-out infinite}
.talkbtn{border-color:#3f7d58;color:var(--good)}
.expbar{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-family:var(--mono);font-size:12px;margin-bottom:8px}
.bar.ex i{background:var(--amber)}
.spline{font-size:12px;color:var(--mute);margin-bottom:8px}
.chip.sk{background:#18293a;color:#a9d3f5;box-shadow:inset 0 0 0 1px #2d4f6e}
.lvtxt{color:var(--amber);font-weight:700;letter-spacing:.05em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{display:block;color:var(--amber);font-size:11px;letter-spacing:.2em;margin-bottom:2px}
.prep-h h2{margin-bottom:4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.rc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rc.ready{border-color:#6b5520;box-shadow:0 0 0 1px rgba(243,187,79,.25)}
.rc-h{display:flex;gap:10px;align-items:center}
.rc-h small{color:var(--mute)}
.rc-s{font-size:11.5px;color:#b9c4cc}
.rc-k{font-size:11.5px;color:#a9d3f5;min-height:1.4em}
.rc .row{display:flex;gap:6px;flex-wrap:wrap}
.rc .btn{padding:4px 10px;font-size:13px}
.uc-g.P{display:inline-grid;place-items:center;font-family:var(--serif);font-weight:900;border-radius:4px;background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline);flex:none}
.tier{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:3px;letter-spacing:.08em;vertical-align:1px}
.tier.t1{background:#27313a;color:#aebbc5}.tier.t2{background:#16304a;color:#8fd0ff}.tier.t3{background:#3a2d12;color:var(--amber)}.tier.t4{background:#4a1f1d;color:#ffb3a6}
.dlist{display:flex;flex-direction:column;gap:6px}
.dl{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:4px;padding:6px 10px;cursor:pointer}
.dl small{color:var(--mute);margin-left:auto}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.choice{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice b{font-size:16px}.choice small{color:var(--mute)}
.tree{display:flex;align-items:center;gap:14px;overflow-x:auto;padding:6px 2px 10px}
.tbr{display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);padding-left:14px}
.trow{display:flex;align-items:center;gap:14px}
.tcol{display:flex;flex-direction:column;gap:6px}
.tcol.t3{border-left:1px solid var(--line);padding-left:14px}
.cn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 10px;min-width:92px;text-align:left;display:flex;flex-direction:column;gap:1px;cursor:pointer;color:var(--ink);font:inherit}
.cn b{font-size:14px}.cn small{font-size:11px;color:var(--mute)}
.cn.past{opacity:.55}
.cn.cur{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
.cn.cur small{color:var(--p)}
.cn.avail{border-color:var(--amber);box-shadow:0 0 12px rgba(243,187,79,.35);animation:glow 1.4s ease-in-out infinite}
.cn.avail small{color:var(--amber)}
.cn.lock{opacity:.45}

function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rng(seed){ let s=(seed>>>0)||1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
const ease={out:p=>1-(1-p)*(1-p), in:p=>p*p, io:p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2, back:p=>1+2.7*Math.pow(p-1,3)+1.7*Math.pow(p-1,2)};

const TREE=['..ddd..','.dmmld.','dmmmlld','dmmmmld','.dmmmd.','..dtd..','...t...'];
const TREE_C={d:'#1d5a33',m:'#2f8a4c',l:'#5cbf6e',t:'#6b4426'};
function genTile(kind,v,frame){
  const c=mkCanvas(16,16), x=c.getContext('2d'), r=rng(kind.charCodeAt(0)*977+v*131+frame*17+7);
  const px=(i,j,col)=>{ if(i<0||j<0||i>15||j>15) return; x.fillStyle=col; x.fillRect(i,j,1,1); };
  const rect=(i,j,w,h,col)=>{ x.fillStyle=col; x.fillRect(i,j,w,h); };
  const grass=()=>{ rect(0,0,16,16,'#78c257');
    for(let n=0;n<16;n++) px(r()*16|0,r()*16|0,r()<.55?'#66ae48':'#95d76d');
    for(let n=0;n<3;n++){ const i=r()*14|0,j=r()*14|0; px(i,j,'#57983c'); px(i+1,j-1,'#57983c'); } };
  const pat=(rows,colors,ox,oy)=>rows.forEach((row,j)=>[...row].forEach((ch,i)=>{ if(colors[ch]) px(ox+i,oy+j,colors[ch]); }));
  switch(kind){
    case 'plain': grass(); if(v===2){ px(4,5,'#fff6a8'); px(11,10,'#ffb3c7'); px(8,13,'#fff6a8'); px(13,3,'#ffb3c7'); } break;
    case 'forest': grass(); pat(TREE,TREE_C,1,1); pat(TREE,TREE_C,8,6); if(v!==1) pat(TREE,TREE_C,2,9); else pat(TREE,TREE_C,9,0); break;
    case 'mount': { grass(); const peaks=v===1?[[5,4,6],[11,6,5]]:[[8,2,8]];
      for(const [cx,top,half] of peaks) for(let y=top;y<16;y++){ const w=Math.min(half,Math.round((y-top)*0.75)+1);
        for(let i=cx-w;i<=cx+w;i++){ let col=i<cx?'#b9a98f':'#8c7b66'; if(i===cx-w||i===cx+w) col='#5e5244';
          if(y<top+3) col=i<cx?'#f4f6f8':'#cdd5de'; if(y===top+3&&(i+y)%2===0) col='#f4f6f8'; px(i,y,col);} }
      break; }
    case 'water': { rect(0,0,16,16,'#3b8fd9');
      for(let n=0;n<10;n++) px(r()*16|0,r()*16|0,'#3381cb');
      const off=frame?2:0;
      for(const [i,j] of [[2,3],[9,6],[4,11],[12,13],[13,2]]){ const ii=(i+off)%16; px(ii,j,'#9fd4ff'); px((ii+1)%16,j,'#9fd4ff'); px((ii+2)%16,j-1,'#cfeaff'); }
      break; }
    case 'wall': { rect(0,0,16,16,'#8a929b');
      for(let j=0;j<16;j+=4){ rect(0,j,16,1,'#5d646c'); const o=(j/4)%2?4:0; for(let i=o;i<16;i+=8) rect(i,j,1,4,'#5d646c'); rect(0,j+1,16,1,'#a7afb8'); }
      for(let n=0;n<8;n++) px(r()*16|0,r()*16|0,'#7a828b'); break; }
    case 'base': { rect(0,0,16,16,'#aeb6be'); rect(0,0,16,1,'#c8cfd6'); rect(0,15,16,1,'#8f98a2'); rect(0,0,1,16,'#c8cfd6'); rect(15,0,1,16,'#8f98a2');
      for(let j=0;j<16;j++)for(let i=0;i<16;i++){ const d=Math.hypot(i-7.5,j-7.5); if(d>5&&d<6.4) px(i,j,'#f3c43b'); else if(d<=4.2) px(i,j,'#8b949e'); }
      rect(6,5,1,6,'#f3c43b'); rect(9,5,1,6,'#f3c43b'); rect(6,7,4,1,'#f3c43b'); break; }
    case 'ruin': { rect(0,0,16,16,'#b49b78'); for(let n=0;n<18;n++) px(r()*16|0,r()*16|0,r()<.5?'#9c8463':'#c8b08c');
      const blk=(i,j,w,h)=>{ rect(i,j,w,h,'#8f969e'); rect(i,j,w,1,'#b8bec5'); rect(i,j+h-1,w,1,'#6b7178'); rect(i+w-1,j,1,h,'#6b7178'); };
      blk(1,3,5,4); blk(9,8,6,5); if(v!==1) blk(3,11,4,3); else blk(10,1,4,4);
      for(let n=0;n<5;n++) px(r()*16|0,r()*16|0,'#7a8088'); break; }
  }
  return c;
}
function tileImg(kind,v,frame){ const k=kind+v+'_'+(kind==='water'?frame:0); return GFX.tiles[k]||(GFX.tiles[k]=genTile(kind,v,kind==='water'?frame:0)); }

function spriteSet(key){
  if(GFX.sprites[key]!==undefined) return GFX.sprites[key];
  if(typeof ICONS==='undefined'||!ICONS[key]) return GFX.sprites[key]=null;
  const d=ICONS[key], mk=fn=>{ const c=mkCanvas(16,16), x=c.getContext('2d');
    d.rows.forEach((r,y)=>[...r].forEach((ch,i)=>{ if(ch!=='.'&&d.pal[ch]){ x.fillStyle=fn(d.pal[ch]); x.fillRect(i,y,1,1); } })); return c; };
  const gray=hex=>{ const n=parseInt(hex.slice(1),16), l=Math.round(((n>>16)*.3+((n>>8)&255)*.59+(n&255)*.11)*.75); return `rgb(${l},${l},${l})`; };
  return GFX.sprites[key]={n:mk(h=>h), g:mk(gray), w:mk(()=>'#ffffff')};
}

function gfxActive(){ return typeof document!=='undefined'&&typeof document.getElementById==='function'&&typeof requestAnimationFrame!=='undefined'&&!!document.getElementById('mapcv')&&!G.classic; }
function gfxResize(){
  if(typeof document==='undefined'||typeof document.getElementById!=='function') return;
  const cv=document.getElementById('mapcv'); if(!cv) return;
  GFX.mapOn=gfxActive();
  const map=document.getElementById('map');
  map.classList.toggle('spr',GFX.mapOn);
  cv.hidden=!GFX.mapOn;
  if(!GFX.mapOn) return;
  const cs=GFX.cs, dpr=Math.min(2,window.devicePixelRatio||1); GFX.dpr=dpr;
  cv.style.width=G.W*cs+'px'; cv.style.height=G.H*cs+'px';
  cv.width=Math.round(G.W*cs*dpr); cv.height=Math.round(G.H*cs*dpr);
}
function gfxPickCs(avail,W){
  const raw=avail/W;
  if(raw>=32) return Math.min(64,Math.floor(raw/16)*16);   // 整數倍放大，像素清楚
  return Math.max(20,Math.floor(raw));
}
function startMapLoop(){
  if(GFX.raf||typeof requestAnimationFrame==='undefined') return;
  const loop=now=>{ GFX.raf=requestAnimationFrame(loop); try{ if(GFX.mapOn&&G.map&&G.map.length) drawMap(now); }catch(e){ console.error(e); } };
  GFX.raf=requestAnimationFrame(loop);
}
function drawMap(now){
  const cv=document.getElementById('mapcv'); if(!cv||cv.hidden) return;
  const ctx=cv.getContext('2d'), cs=GFX.cs, dt=Math.min(0.05,(now-(GFX.last||now))/1000); GFX.last=now;
  ctx.setTransform(GFX.dpr,0,0,GFX.dpr,0,0); ctx.imageSmoothingEnabled=false;

    const t=terrAt(x,y), v=((x*73856093)^(y*19349663))>>>0;

function weaponKind(w){

}

function drawCutIn(ctx,c,now,W,H){
  const p=Math.min(1,(now-c.t0)/c.dur); if(p<0) return;

  ctx.save();

  ctx.beginPath(); ctx.moveTo(-10,cy-bh/2+sk*dir); ctx.lineTo(W+10,cy-bh/2-sk*dir); ctx.lineTo(W+10,cy+bh/2-sk*dir); ctx.lineTo(-10,cy+bh/2+sk*dir); ctx.closePath();
  const g=ctx.createLinearGradient(0,cy-bh/2,0,cy+bh/2); g.addColorStop(0,team[1]); g.addColorStop(.5,team[0]); g.addColorStop(1,team[1]);
  ctx.fillStyle=g; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle=team[2]; ctx.stroke(); ctx.clip();

    ctx.fillStyle='rgba(255,255,255,'+(.15+l.w*.1)+')'; ctx.fillRect(xx,cy-bh/2+l.y*bh,l.len,l.w); }
  // 機體頭像
  const size=200, slide=p<.2?1-ease.out(p/.2):0, px=c.left?150-slide*260:W-150+slide*260;
  ctx.imageSmoothingEnabled=false;
  if(c.sp){ ctx.save(); ctx.translate(px,cy); if(!c.left) ctx.scale(-1,1); ctx.drawImage(c.sp.n,-size/2,-size/2+16,size,size); ctx.restore(); }
  else { ctx.fillStyle=team[2]; ctx.font='900 120px "Noto Serif TC",serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(c.u.ch,px,cy); }
  // 文字
  const tp=p<.28?0:Math.min(1,(p-.28)/.15), tx=c.left?W-40:40, ta=c.left?'right':'left', tslide=(1-ease.out(tp))*120*dir;
  ctx.globalAlpha=tp; ctx.textAlign=ta; ctx.textBaseline='middle';
  ctx.font='700 15px "Noto Sans TC",sans-serif'; ctx.fillStyle=team[2]; ctx.fillText(`${c.u.pilot}　${c.u.name}`,tx+tslide,cy-42);

  ctx.restore();
}
function drawFighter(ctx,sd,now){
  const u=sd.u, size=112, flip=!sd.left, lift=u.fly?40:0, bob=Math.sin(now/300+(sd.left?0:1.7))*(u.fly?6:2);

function startTitleBg(){
  if(typeof requestAnimationFrame==='undefined'||typeof document.getElementById!=='function') return;
  const cv=document.getElementById('bgcv'); if(!cv) return;
  document.body.classList.add('titlemode');
  if(GFX.titleRaf) return;
  const stars=Array.from({length:90},(_,i)=>({x:Math.random(),y:Math.random()*.55,s:Math.random()<.2?2:1,p:Math.random()*6}));
  const squad=['gang','feng','lei','yu','tetsu','lena','rei'];
  const foes=['bing','qi','yi','pao'];
  const draw=now=>{
    if(!document.body.classList.contains('titlemode')){ GFX.titleRaf=0; return; }
    GFX.titleRaf=requestAnimationFrame(draw);
    const dpr=Math.min(2,window.devicePixelRatio||1), W=window.innerWidth, H=window.innerHeight;
    if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
    const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingEnabled=false;
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0b1430'); g.addColorStop(.55,'#2a3a78'); g.addColorStop(.78,'#d8785a'); g.addColorStop(1,'#f3b46a');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(const s of stars){ ctx.globalAlpha=.4+.6*Math.abs(Math.sin(now/900+s.p)); ctx.fillStyle='#fff'; ctx.fillRect(s.x*W,s.y*H,s.s,s.s); } ctx.globalAlpha=1;
    const gy=H*.86;
    ctx.fillStyle='#3a2f5a'; for(let i=-1;i<10;i++){ const cx=(i*W/7+(now/120)%(W/7)), h=H*.16+(i%3)*H*.04; ctx.beginPath(); ctx.moveTo(cx-W/9,gy); ctx.lineTo(cx,gy-h); ctx.lineTo(cx+W/9,gy); ctx.fill(); }
    ctx.fillStyle='#4f3f6a'; for(let i=-1;i<14;i++){ const cx=(i*W/10+(now/60)%(W/10)); ctx.beginPath(); ctx.moveTo(cx-W/14,gy); ctx.lineTo(cx,gy-H*.08-(i%2)*H*.03); ctx.lineTo(cx+W/14,gy); ctx.fill(); }
    const ts=48; for(let x=-(Math.floor(now/30)%ts);x<W;x+=ts) for(let y=gy;y<H;y+=ts) ctx.drawImage(tileImg('plain',((x/ts|0)+(y/ts|0))%3,0),x,y,ts,ts);
    ctx.fillStyle='rgba(20,10,40,.35)'; ctx.fillRect(0,gy,W,H-gy);
    const sz=Math.max(40,Math.min(72,W/22));
    squad.forEach((k,i)=>{ const sp=spriteSet(k); if(!sp) return; const x=W*.06+i*sz*1.05, y=gy-sz+Math.sin(now/300+i)*3+(k==='feng'?-sz*.35:0);
      ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x+sz/2,gy-2,sz*.35,sz*.08,0,0,Math.PI*2); ctx.fill(); ctx.drawImage(sp.n,x,y,sz,sz); });
    foes.forEach((k,i)=>{ const sp=spriteSet(k); if(!sp) return; const x=W*.94-sz-i*sz*1.05, y=gy-sz+Math.sin(now/340+i*2)*3+(k==='yi'?-sz*.35:0);
      ctx.save(); ctx.translate(x+sz,y); ctx.scale(-1,1); ctx.globalAlpha=.85; ctx.drawImage(sp.n,0,0,sz,sz); ctx.restore(); ctx.globalAlpha=1; });
  };
  GFX.titleRaf=requestAnimationFrame(draw);
}

function pickQuote(u,kind,opp){

  return list[Math.floor(Math.random()*list.length)];
}

const BGM={on:true,vol:.55,cur:null,want:null,timer:0,step:0,next:0,gain:null,song:null,nbuf:null};
try{ const v=localStorage.getItem('zijia2-bgm'); if(v==='0') BGM.on=false; }catch(e){}
function bgmCtx(){
  if(typeof window==='undefined'||!(window.AudioContext||window.webkitAudioContext)) return null;
  if(!SFX.ctx){ try{ SFX.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  return SFX.ctx;
}
function bgmPrep(name){
  const s=SONGS[name]; if(s._p) return s;
  const steps=[];
  s.mel.forEach((bar,bi)=>{ const tk=bar.trim().split(/\s+/); tk.forEach((t,i)=>steps.push({t,bar:bi,i})); });
  // 計算每個音的長度（八分音符數）
  steps.forEach((st,i)=>{ if(st.t==='-'||st.t==='=') return; let n=1; while(steps[i+n]&&steps[i+n].t==='=') n++; st.len=n; st.m=noteMidi(st.t); });
  s._p=true; s.steps=steps; s.tones=s.chords.map(chordTones); return s;
}
function bgmOsc(type,freq,t,dur,vol,slide){
  const c=SFX.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.008); g.gain.setValueAtTime(vol,t+Math.max(.01,dur*.7)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(BGM.gain); o.start(t); o.stop(t+dur+.02);
}
function bgmNoise(t,dur,hp,vol){
  const c=SFX.ctx;
  if(!BGM.nbuf){ const n=c.sampleRate*.3|0; BGM.nbuf=c.createBuffer(1,n,c.sampleRate); const d=BGM.nbuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; }
  const s=c.createBufferSource(); s.buffer=BGM.nbuf; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp;
  const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(BGM.gain); s.start(t); s.stop(t+dur+.02);
}
function bgmStep(s,i,t,d8){
  const st=s.steps[i], bar=st.bar, pos=st.i, tones=s.tones[bar];
  if(st.m) bgmOsc('square',mfreq(st.m),t,d8*st.len*.95,s.lead||.11);
  const b=(s.bass||'')[pos]; const root=36+tones[0]+(tones[0]>4?0:12);
  if(b==='r') bgmOsc('triangle',mfreq(root),t,d8*.9,.32);
  else if(b==='o') bgmOsc('triangle',mfreq(root+12),t,d8*.9,.28);
  else if(b==='f') bgmOsc('triangle',mfreq(root+7),t,d8*.9,.28);
  if(s.arp){ for(let k=0;k<2;k++){ const n=tones[(pos*2+k)%3]+60; bgmOsc('square',mfreq(n),t+k*d8/2,d8*.45,.035); } }
  const dr=(s.drum||'')[pos];
  if(dr==='k') bgmOsc('sine',150,t,.14,.55,.25);
  else if(dr==='s') bgmNoise(t,.12,1400,.22);
  else if(dr==='h') bgmNoise(t,.04,7000,.08);
}
function bgmTick(){
  const c=SFX.ctx, s=BGM.song; if(!c||!s) return;
  const d8=60/s.bpm/2;
  while(BGM.next<c.currentTime+.15){
    bgmStep(s,BGM.step,BGM.next,d8); BGM.next+=d8; BGM.step++;
    if(BGM.step>=s.steps.length){ if(s.loop===false){ const end=BGM.next; clearInterval(BGM.timer); BGM.timer=0; BGM.cur=null; setTimeout(()=>{ if(!BGM.timer) bgmFade(); },Math.max(0,(end-c.currentTime)*1000)+400); return; } BGM.step=0; }
  }
}
function bgmFade(){
  if(!BGM.gain||!SFX.ctx) return; const g=BGM.gain, t=SFX.ctx.currentTime;
  try{ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0.0001,t+.35); }catch(e){}
  setTimeout(()=>{ try{ g.disconnect(); }catch(e){} },500); BGM.gain=null;
}
function bgmStop(){ if(BGM.timer){ clearInterval(BGM.timer); BGM.timer=0; } BGM.cur=null; bgmFade(); }
function bgm(name){
  BGM.want=name;
  if(!BGM.on||!name||!SONGS[name]){ if(!name||!BGM.on) bgmStop(); return; }
  if(BGM.cur===name&&BGM.timer) return;
  const c=bgmCtx(); if(!c||typeof setInterval==='undefined') return;
  if(c.state!=='running'){ try{ c.resume().then(()=>{ if(BGM.want===name&&!BGM.timer) bgm(name); }).catch(()=>{}); }catch(e){} return; } // 瀏覽器要求使用者先互動，解鎖後才開始
  bgmStop();
  const s=bgmPrep(name);
  BGM.gain=c.createGain(); BGM.gain.gain.setValueAtTime(0.0001,c.currentTime); BGM.gain.gain.linearRampToValueAtTime(BGM.vol*.45,c.currentTime+.25); BGM.gain.connect(c.destination);
  BGM.song=s; BGM.cur=name; BGM.step=0; BGM.next=c.currentTime+.08; BGM.timer=setInterval(bgmTick,25); bgmTick();
}
function bgmUnlock(){ const c=bgmCtx(); if(!c) return; const go=()=>{ if(BGM.want&&!BGM.timer) bgm(BGM.want); };
  if(c.state!=='running') c.resume().then(go).catch(()=>{}); else go(); }
if(typeof document!=='undefined'&&typeof document.addEventListener==='function'){
  document.addEventListener('pointerdown',bgmUnlock,true); document.addEventListener('keydown',bgmUnlock,true);

}

  if(!SFX.ctx){ try{ SFX.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(SFX.ctx.state==='suspended') SFX.ctx.resume();
  return SFX.ctx;
}
function tone(freq,dur,o={}){
  const c=sfxCtx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||'square'; osc.frequency.setValueAtTime(freq,t);
  if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(30,freq*o.slide),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(SFX.vol*(o.vol??1),t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t+dur+0.03);
}
function noise(dur,o={}){
  const c=sfxCtx(); if(!c) return;
  const t=c.currentTime+(o.delay||0), n=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type=o.hp?'highpass':'lowpass'; f.frequency.value=o.hp||o.lp||2400;
  const g=c.createGain(); g.gain.setValueAtTime(SFX.vol*(o.vol??1),t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t); src.stop(t+dur+0.02);
}

function statsOf(clsId,lv,mod={}){
  const c=CLS(clsId); let b;
  if(c.stats) b={...c.stats};
  else { b={...ROLE_BASE[c.role]}; const t=TIER_ADD[c.tier]; for(const k in t) b[k]+=t[k]; }
  for(const k in (c.tweak||{})) b[k]=(b[k]||0)+c.tweak[k];
  const g=GROWTH[c.tier]; for(const k in g) b[k]+=g[k]*(lv-1);
  for(const k in mod) b[k]=(b[k]||0)+mod[k];
  for(const k in b) b[k]=Math.round(b[k]);
  return b;
}
const mRank=m=>(CLS(m.cls).tier-1)*10+m.lv;

function reqOK(c,cid){

}

function moveCost(u,x,y){const t=terrAt(x,y); if(t.block) return 99; return u.fly?1:t.cost;}

function aura(u){
  const r={hit:0,eva:0,dmg:0};
  if(u.merc){ const c=G.units.find(o=>o.cid===u.cmd&&o.side===u.side&&o.hp>0&&!o.merc); if(c&&dist(c,u)<=2){ r.hit=10; r.eva=10; r.dmg=10; } }
  for(const o of G.units){ if(o===u||o.side!==u.side||o.hp<=0||!o.skills.aura) continue;
    const a=o.skills.aura; if(dist(o,u)>a.range) continue;
    r.hit=Math.max(r.hit,a.hit||0); r.eva=Math.max(r.eva,a.eva||0); r.dmg=Math.max(r.dmg,a.dmg||0); }
  return r;
}
function guardAura(u){
  let p=0; for(const o of G.units){ if(o===u||o.side!==u.side||o.hp<=0||!o.skills.guardAura) continue;
    if(dist(o,u)<=o.skills.guardAura.range) p=Math.max(p,o.skills.guardAura.pct); }
  return p;
}

  for(const p of parts) for(const k in (p.mod||{})) s[k]=(s[k]||0)+p.mod[k];
  const ps=m.psk||{};
  const u=baseUnit({side:'P',cid:m.cid,member:m,cls:m.cls,lv:m.lv,name:ch.mech,pilot:ch.pilot,ch:ch.ch,x,y,s,c,
    sp:maxSp(m)+15*(ps.spUp||0),spirits:unlockedSpirits(m),lines:ch.lines});

function mkEnemy(d){

function whyNot(u,w,d,moved){
  if(w.will&&u.will<w.will) return '需氣力 '+w.will;
  if(w.en&&u.en<w.en) return 'EN 不足';
  if(w.ammo!=null&&w.left<=0) return '彈藥耗盡';
  if(moved&&!w.post) return '移動後不可用';
  if(d!=null&&(d<w.min||d>wMax(u,w))) return '射程外';
  return '';
}
function hitRate(a,w,d,react){
  if(d.st.dodge) return 0;
  if(a.st.sure) return 100;
  const aa=aura(a), da=aura(d);
  let h=75+w.hit+(a.hit-d.eva)/2-terrBonus(d).eva+sk(a,'hitUp')-sk(d,'evaUp')+aa.hit-da.eva;
  if(a.st.focus) h+=30;
  if(d.st.focus) h-=30;
  if(react==='evade') h/=2;
  return clamp(Math.round(h),0,100);
}
function calcDmg(a,w,d,react){
  const arm=d.def*(1-sk(a,'pierce')/100);
  let v=(w.pow+a.atk*10)*a.will/100 - arm*d.will/100*0.5;
  v*=1+(sk(a,'dmgUp')+aura(a).dmg)/100;
  v*=1-(sk(d,'dmgDown')+guardAura(d))/100;
  v*=1-terrBonus(d).def;
  if(a.st.soul) v*=2.5; else if(a.st.valor) v*=2;
  if(d.st.wall) v*=0.25;
  if(react==='guard') v*=0.5;
  return Math.max(10,Math.round(v));
}
function bestWeapon(u,t,d,moved=false){
  let best=null,bs=-1;
  for(const w of u.weapons){ if(whyNot(u,w,d,moved)) continue;
    const s=hitRate(u,w,t,null)*Math.min(calcDmg(u,w,t,null),t.hp);
    if(s>bs){bs=s;best=w;} }
  return best;
}
function aiReact(d,a,dd){ const cw=bestWeapon(d,a,dd); return cw?{react:'counter',cw}:{react:'guard',cw:null}; }
function reachable(u){
  const res=new Map(); res.set(key(u.x,u.y),{c:0,prev:null,x:u.x,y:u.y,stop:true});
  const pq=[[0,u.x,u.y]], mv=effMove(u);
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]); const [c,x,y]=pq.shift();
    if(c>res.get(key(x,y)).c) continue;
    for(const [dx,dy] of DIRS){
      const nx=x+dx,ny=y+dy; if(!inMap(nx,ny)) continue;
      const mc=moveCost(u,nx,ny); if(mc>=99) continue;
      const o=unitAt(nx,ny); if(o&&o.side!==u.side) continue;
      const nc=c+mc; if(nc>mv) continue;
      const k=key(nx,ny), old=res.get(k);
      if(!old||old.c>nc){res.set(k,{c:nc,prev:key(x,y),x:nx,y:ny,stop:!o||o===u}); pq.push([nc,nx,ny]);}
    }
  }
  return res;
}
function pathTo(reach,x,y){const p=[];let k=key(x,y);while(k){const v=reach.get(k);p.unshift(v);k=v.prev;}return p;}
function threatCells(e){
  const set=new Set(), reach=reachable(e);
  for(const v of reach.values()){ if(!v.stop) continue; const moved=!(v.x===e.x&&v.y===e.y);
    if(e.ai==='hold'&&moved) {}
    for(const w of e.weapons){ if(whyNot(e,w,null,moved)) continue; const mx=wMax(e,w);
      for(let dy=-mx;dy<=mx;dy++)for(let dx=-mx;dx<=mx;dx++){const m=Math.abs(dx)+Math.abs(dy);
        if(m<w.min||m>mx) continue; const x=v.x+dx,y=v.y+dy; if(inMap(x,y)) set.add(key(x,y));}}}
  return set;
}

function addExp(m,amt){ // 回傳 {up:升級數, pp:獲得 PP}
  let up=0, pp=0; m.exp+=Math.round(amt);
  while(m.exp>=EXP.perLv){ m.exp-=EXP.perLv; if(m.lv<MAX_LV){ m.lv++; up++; } pp++; }
  m.pp=(m.pp||0)+pp; return {up,pp};
}
function gainExp(u,amt){
  const m=u.member; if(!m||u.side!=='P') return;
  const r=addExp(m,amt*DIFF[G.diff==null?1:G.diff].exp);
  if(r.pp&&!r.up) log(`${u.pilot} 獲得 ${r.pp} PP。`,'lvl');
  if(r.up&&!G.anim) setTimeout(()=>sfx('levelup'),200);
  if(r.up){
    const s=statsOf(m.cls,m.lv,CHARS[m.cid].mod);
    const dh=s.hp-u.maxHp, de=s.en-u.maxEn;
    u.maxHp=s.hp; u.hp=clamp(u.hp+dh,0,u.maxHp); u.maxEn=s.en; u.en=clamp(u.en+de,0,u.maxEn);
    Object.assign(u,{atk:s.atk,def:s.def,hit:s.hit,eva:s.eva,lv:m.lv});
    if(typeof mapFx==='function') mapFx(u.x,u.y,'LV UP','#ffd25a',{delay:500,dur:1400});
    log(`▲ ${u.pilot} 升到 Lv ${m.lv}！獲得 ${r.pp} PP。${canChange(m)?'（戰鬥後可以轉職）':''}`,'lvl');
    G.lvUps.push(`${u.pilot} Lv ${m.lv}`);
  }
}
function goldFor(d){ return (d.boss?800:0)+d.tier*80+d.lv*15; }
function expFor(a,d,kill){
  const diff=uRank(d)-uRank(a);
  let e=clamp(EXP.hitBase+diff*EXP.hitStep,EXP.hitMin,EXP.hitMax);
  if(kill) e+=clamp(EXP.killBase+diff*EXP.killStep,EXP.killMin,EXP.killMax)+(d.boss?EXP.boss:0);
  return e;
}

  const mp=$('#map').getBoundingClientRect(), cs=cr.width, pitch=G.W>1?(mp.width-cs)/(G.W-1):cs;
  // 需要保持可見的格子與權重：可選目標最重要，其次是自己與其他機體、移動範圍
  const imp=new Map(), addW=(x,y,w)=>{ const k=key(x,y); imp.set(k,Math.max(imp.get(k)||0,w)); };
  if(G.mode==='unit'&&!s.moved&&G.reach) for(const v of G.reach.values()) if(v.stop) addW(v.x,v.y,1);
  for(const u of G.units) addW(u.x,u.y,u.side==='E'?4:3);

  for(const t of tg) addW(t.x,t.y,20);
  const cells=[...imp].map(([k,w])=>{ const [x,y]=k.split(',').map(Number); const L=cr.left-br.left+(x-s.x)*pitch, T=cr.top-br.top+(y-s.y)*pitch; return {L,T,R:L+cs,B:T+cs,w}; });
  const ux=cr.left-br.left, uy=cr.top-br.top, g=6;
  const cand=[[ux+cs+g,uy-4],[ux+cs+g,uy+cs-fh+4],[ux-fw-g,uy-4],[ux-fw-g,uy+cs-fh+4],[ux,uy-fh-g],[ux+cs-fw,uy-fh-g],[ux,uy+cs+g],[ux+cs-fw,uy+cs+g],
    [ux+cs*2+g,uy-4],[ux-fw-cs-g,uy-4],[ux+cs+g,uy-fh/2],[ux-fw-g,uy-fh/2],
    [mp.left-br.left+4,mp.top-br.top+4],[mp.right-br.left-fw-4,mp.top-br.top+4],[mp.left-br.left+4,mp.bottom-br.top-fh-4],[mp.right-br.left-fw-4,mp.bottom-br.top-fh-4],
    [ux+cs/2-fw/2,mp.bottom-br.top+4,1],[mp.left-br.left+4,mp.bottom-br.top+4,1],[mp.right-br.left-fw-4,mp.bottom-br.top+4,1]];

    let sc=0; for(const c of cells){ const ox=Math.min(x+fw,c.R)-Math.max(x,c.L), oy=Math.min(y+fh,c.B)-Math.max(y,c.T); if(ox>2&&oy>2) sc+=c.w*Math.min(1,ox*oy/(cs*cs)+.35); }
    sc+=Math.hypot(x+fw/2-(ux+cs/2),y+fh/2-(uy+cs/2))/(cs*8);
    if(!best||sc<best.sc) best={x,y,sc};
  }

}

function resolveLines(lines){

  for(const l of (lines||[])){
    if(Array.isArray(l)) out.push(l);
    else if(l&&l.if!=null){ if(G.flags[l.if]) out.push(l.line); }
    else if(l&&l.ifnot!=null){ if(!G.flags[l.ifnot]) out.push(l.line); }
  }

}

function playScene(lines){

function strike(a,w,d,react,seq){
  const hr=hitRate(a,w,d,react);
  if(w.en) a.en-=w.en; if(w.ammo!=null) w.left--;
  const before=d.hp; let hit=false,dmg=0,crit=false,note='';
  if(d.st.dodge){d.st.dodge=false;note='閃避發動';}
  else hit=Math.random()*100<hr;
  if(hit){
    dmg=Math.round(calcDmg(a,w,d,react)*(0.9+Math.random()*0.2));
    if(Math.random()<0.08+sk(a,'crit')/100){crit=true;dmg=Math.round(dmg*1.25);}
    a.st.valor=false; a.st.soul=false; d.hp=Math.max(0,d.hp-dmg); addWill(a,3); addWill(d,2);
    if(G.pstat){ if(d.side==='P') G.pstat.taken+=dmg; else G.pstat.dealt+=dmg; }
    if(d.hp===0){ addWill(a,5+sk(a,'killWill')); if(a.side==='P'&&d.side==='E'){ const g=goldFor(d); G.gold=(G.gold||0)+g; G.goldGain=(G.goldGain||0)+g; } }
    gainExp(a,expFor(a,d,d.hp===0));
  } else addWill(d,3);
  const tag=react==='guard'?'（防禦）':react==='evade'?'（迴避）':'';
  log(`${a.ch}${a.name}【${w.name}】→ ${d.ch}${d.name}${tag}：${hit?(crit?'會心一擊！':'命中，')+fmt(dmg)+' 傷害':(note||'未命中')}${d.hp===0?'，擊墜！':''}`, hit&&a.side!=='P'?'bad':'');
  seq.push({a,d,w,hit,dmg,crit,before,after:d.hp,note});
}

async function afterCombat(){

    const ph=u.phase2; u.phased=true;

async function checkEnd(){
  if(G.over) return true;
  const ch=CH();
  if(!G.units.some(u=>u.cid==='gang'&&u.side==='P')){ lose('剛鐵號被擊墜，銘甲隊被迫撤退。'); return true; }
  for(const p of (ch.protect||[])) if(!G.units.some(u=>u.cid===p)){ lose(`${GUESTS[p]?GUESTS[p].pilot:p} 被擊墜了。`); return true; }
  const es=G.units.filter(u=>u.side==='E'&&!(u.obj&&!u.weapons.length));
  const w=ch.win;
  if(w.type==='destroy'&&!G.units.some(u=>u.side==='E'&&u.tag===w.target)){ win(); return true; }
  if(w.type==='capture'&&G.units.some(u=>u.side==='P'&&!u.merc&&w.cells.some(([x,y])=>u.x===x&&u.y===y))){ win(); return true; }
  if(w.type==='boss'&&G.seenTags.has(w.target)&&!es.some(u=>u.tag===w.target)){ win(); return true; }
  if(w.type==='escape'){ const g=G.units.find(u=>u.cid===(w.who||'gang')); if(g&&w.cells.some(([x,y])=>g.x===x&&g.y===y)){ win(); return true; } }
  if(es.length===0&&w.type!=='survive'&&w.type!=='escape'){
    const pend=(ch.events||[]).filter((e,i)=>!G.firedEvents.has(i)&&e.spawn&&e.spawn.length);
    if(pend.length){ // 還有增援：提前觸發
      for(const e of pend){ await fireEvent(e,(ch.events||[]).indexOf(e)); }
      render(); return false;
    }
    win(); return true;
  }
  if(es.length===0&&w.type==='survive'){ win(); return true; }
  return false;
}
async function fireEvent(ev,i){
  G.firedEvents.add(i);
  render(); await playScene(ev.lines||[]);
  for(const d of (ev.spawn||[])){
    let {x,y}=d; if(unitAt(x,y)||terrAt(x,y).block){ const f=freeNear(x,y); if(!f) continue; x=f.x;y=f.y; }
    G.units.push(mkEnemy({...d,x,y}));
  }
  if(ev.spawn&&ev.spawn.length) log(`敵方增援出現！（${ev.spawn.length} 機）`,'sys');
  render();
}
function freeNear(x,y){
  for(let r=1;r<6;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){ const nx=x+dx,ny=y+dy;
    if(inMap(nx,ny)&&!terrAt(nx,ny).block&&!unitAt(nx,ny)) return {x:nx,y:ny}; }
  return null;
}

async function animateMove(u,reach,x,y){

function quickPlan(s,t){
  const ox=s.x, oy=s.y;
  const cells=s.moved?[{x:s.x,y:s.y,c:0}]:[...G.reach.values()].filter(v=>v.stop);
  let best=null;
  for(const v of cells){ const moved=s.moved||!(v.x===G.origin.x&&v.y===G.origin.y); s.x=v.x; s.y=v.y; const d=dist(s,t);
    for(const w of weaponsOf(s)){ if(whyNot(s,w,d,moved)) continue;
      const r=aiReact(t,s,d), hr=hitRate(s,w,t,r.react)/100, dm=calcDmg(s,w,t,r.react);
      let sc=hr*Math.min(dm,t.hp)+(dm>=t.hp?1500*hr:0)-(v.c||0)*3-(w.en||0)*2-(w.combo?300:0)+(s.fly?0:terrAt(v.x,v.y).def*300);

function phaseUpkeep(side){
  for(const u of G.units.filter(u=>u.side===side)){
    const t=terrAt(u.x,u.y); let h=0,e=0;
    if(t.heal){ h+=Math.round(u.maxHp*.1); e+=Math.round(u.maxEn*.1); }
    if(u.skills.regen) h+=Math.round(u.maxHp*u.skills.regen/100);
    h=Math.min(u.maxHp-u.hp,h); e=Math.min(u.maxEn-u.en,e);
    if(h||e){u.hp+=h;u.en+=e; if(side==='P'||u.boss) log(`${u.ch}${u.name} 回復 HP +${fmt(h)}${e?`、EN +${e}`:''}。`,side==='P'?'good':'');}
    if(u.skills.spRegen&&u.maxSp) u.sp=Math.min(u.maxSp,u.sp+u.skills.spRegen);
  }
}
async function runEvents(phase){
  const evs=CH().events||[];

async function endPlayerPhase(){

function playerThreat(){
  const sig=G.turn+'|'+G.units.filter(u=>u.side==='P').map(u=>u.uid+':'+u.x+','+u.y).join(';');
  if(G._ptSig===sig&&G._pt) return G._pt;
  const m=new Map();
  for(const p of G.units.filter(u=>u.side==='P')) for(const k of threatCells(p)) m.set(k,(m.get(k)||0)+1);
  G._pt=m; G._ptSig=sig; return m;
}
function aiPlan(e){
  const reach=reachable(e); let best=null;
  const ps=G.units.filter(u=>u.side==='P');
  const protect=CH().protect||[];
  const pt=playerThreat();
  const low=!e.boss&&e.hp<e.maxHp*0.3;
  const ox=e.x, oy=e.y;
  for(const v of reach.values()){ if(!v.stop) continue; const moved=!(v.x===ox&&v.y===oy);
    const tb=e.fly?0:TERRAIN[G.map[v.y][v.x]].def;
    const danger=pt.get(key(v.x,v.y))||0;
    e.x=v.x; e.y=v.y;   // 暫時站到候選位置，計算地形與反擊
    for(const t of ps){ const d=Math.abs(v.x-t.x)+Math.abs(v.y-t.y);
      for(const w of e.weapons){ if(whyNot(e,w,d,moved)) continue;
        const hr=hitRate(e,w,t,null)/100, dm=calcDmg(e,w,t,null), kill=dm>=t.hp;
        let sc=hr*Math.min(dm,t.hp)+(kill?2500*hr:0)+(1-t.hp/t.maxHp)*400+tb*600-(v.c*2)+(t.cid==='gang'?150:0)+(protect.includes(t.cid)?400:0);
        if(!kill||hr<0.9){ const cw=bestWeapon(t,e,d); if(cw){ const ce=hitRate(t,cw,e,null)/100*calcDmg(t,cw,e,null);
          sc-=ce*(e.boss?0.9:0.5); if(ce>=e.hp) sc-=2000; } }
        sc-=danger*(low?250:50);
        if(!best||sc>best.sc) best={sc,v,t,w,kill};
      }}}
  e.x=ox; e.y=oy;
  return {best,reach,low};
}
function retreatDest(e,reach){
  const pt=playerThreat(), ps=G.units.filter(u=>u.side==='P');
  let best=null;
  for(const v of reach.values()){ if(!v.stop) continue;
    const t=TERRAIN[G.map[v.y][v.x]];
    const near=Math.min(...ps.map(p=>Math.abs(p.x-v.x)+Math.abs(p.y-v.y)));
    const sc=-(pt.get(key(v.x,v.y))||0)*100+near*12+(t.heal?300:0)+(e.fly?0:t.def*200);
    if(!best||sc>best.sc) best={sc,v};
  }
  return best&&best.v;
}
function approachDest(e,reach){
  const INF=1e9, f=Array.from({length:G.H},()=>Array(G.W).fill(INF)); const pq=[];
  for(const p of G.units.filter(u=>u.side==='P')){f[p.y][p.x]=0;pq.push([0,p.x,p.y]);}
  while(pq.length){pq.sort((a,b)=>a[0]-b[0]);const [c,x,y]=pq.shift(); if(c>f[y][x]) continue;
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy; if(!inMap(nx,ny)) continue; const mc=moveCost(e,nx,ny); if(mc>=99) continue;
      if(c+mc<f[ny][nx]){f[ny][nx]=c+mc;pq.push([c+mc,nx,ny]);}}}
  let best=null; const pt=playerThreat();
  for(const v of reach.values()){ if(!v.stop) continue; const val=f[v.y][v.x]+(pt.get(key(v.x,v.y))||0)*1.5;
    if(!best||val<best.val||(val===best.val&&v.c<best.v.c)) best={val,v}; }
  if(!best||best.val>=f[e.y][e.x]+(pt.get(key(e.x,e.y))||0)*1.5) return null;
  return best.v;
}
async function enemyAct(e){

function bestDefender(e,w,t){

}

async function deploy(){
  const ch=CH(), n=ch.deploy.length;
  if(G.roster.length<=n){ G.deployed=G.roster.map(m=>m.cid); return true; }
  function refundBench(){ for(const cid of Object.keys(G.mercs||{})) if(!G.deployed.includes(cid)){ for(const t of G.mercs[cid]) G.gold+=mercCost(t); G.mercs[cid]=[]; log('未出擊角色的傭兵已退款。','sys'); } }
  const sel=new Set(G.deployed.filter(c=>G.roster.some(m=>m.cid===c)).slice(0,n)); sel.add('gang');
  for(const m of G.roster){ if(sel.size>=n) break; sel.add(m.cid); }
  return new Promise(res=>{
    const box=$('#mbox'); box.className='mbox';
    const draw=()=>{ box.innerHTML=`<h2>選擇出擊機體</h2><p style="color:var(--mute)">最多 ${n} 台（已選 ${sel.size}）。剛鐵號必須出擊。</p>
      <div class="dlist">${G.roster.map(m=>{const c=CLS(m.cls);return `<label class="dl"><input type="checkbox" data-c="${m.cid}" ${sel.has(m.cid)?'checked':''} ${m.cid==='gang'?'disabled':''}><span class="uc-g P hasicon" style="width:32px;height:32px;font-size:18px">${face(m.cid,CHARS[m.cid].ch)}</span>${CHARS[m.cid].pilot}<small>${c.name} Lv${m.lv}</small></label>`;}).join('')}</div>
      <div class="foot"><button class="btn" data-x="back">返回</button><button class="btn pri" data-x="ok" ${sel.size>n?'disabled':''}>出擊</button></div>`; };
    draw(); $('#modal').hidden=false;
    box.onchange=e=>{const c=e.target.dataset.c; if(!c) return; if(e.target.checked) sel.add(c); else sel.delete(c); draw();};
    box.onclick=e=>{const b=e.target.closest('[data-x]'); if(!b||b.disabled) return; box.onclick=null; box.onchange=null; $('#modal').hidden=true;
      if(b.dataset.x==='ok'){ G.deployed=[...sel]; refundBench(); res(true);} else res(false); };
  });
}
async function startBattle(){
  const ch=CH();

  order.slice(0,ch.deploy.length).forEach((m,i)=>{const [x,y]=ch.deploy[i]; G.units.push(mkPlayerUnit(m,x,y));});
  for(const g of (ch.guests||[])) G.units.push(mkGuest(g.id,g.lv||5,g.x,g.y));
  for(const [cid,list] of Object.entries(G.mercs||{})){ const cmd=G.units.find(u=>u.cid===cid&&u.side==='P'); const m=G.roster.find(r=>r.cid===cid); if(!cmd||!m) continue;
    for(const type of list){ const f=freeNear(cmd.x,cmd.y); if(f) G.units.push(mkMerc(type,m,f.x,f.y)); } }
  G.goldGain=0;
  G.over=false; clearLog(); render();
  log(`第 ${ch.no} 章 ${ch.title}　開始。勝利條件：${ch.winText}。`,'sys');
  await startPlayerPhase();
}
async function win(){
  if(G.over) return; G.over=true; G.busy=false; render(); if(typeof bgm==='function'&&BGM.on) bgm('win'); else sfx('win');
  const ch=CH();
  const alive=new Set(G.units.filter(u=>u.side==='P'&&u.member).map(u=>u.cid));
  const lv=[];
  for(const m of G.roster){ const before=m.lv; const bonus=G.deployed.includes(m.cid)?(alive.has(m.cid)?EXP.clearAlive:EXP.clearDown):EXP.clearBench;
    addExp(m,bonus);
    if(m.lv>before) lv.push(`${CHARS[m.cid].pilot} Lv ${m.lv}`); }
  const clearGold=500+100*ch.no; G.gold=(G.gold||0)+clearGold; const battleGold=G.goldGain||0; G.mercs={};
  const ready=G.roster.filter(canChange).map(m=>CHARS[m.cid].pilot);
  await ask(`<h2>作戰成功</h2><p>第 ${ch.no} 章「${ch.title}」以 <b>${G.turn}</b> 回合完成。</p>
    <p>獲得資金：擊墜 ${fmt(battleGold)} G ＋ 通關獎勵 ${fmt(clearGold)} G　→　持有 <b>${fmt(G.gold)} G</b></p>
    <p style="color:var(--mute)">全員獲得通關經驗（出擊存活 ${EXP.clearAlive}／被擊墜 ${EXP.clearDown}／待命 ${EXP.clearBench}）。${lv.length?`<br>升級：${lv.join('、')}`:''}${ready.length?`<br><span style="color:var(--amber)">可以轉職：${ready.join('、')}</span>`:''}</p>
    <div class="foot"><button class="btn pri" data-v="ok">繼續</button></div>`);
  await playScene(ch.post);
  (ch.join||[]).forEach(c=>{ if(joinChar(c)) log(`${CHARS[c].pilot} 加入了銘甲隊。`,'good'); });
  if(ch.ending){ await showEnding(ch.ending, ch.route); return titleScreen(); }
  let next=ch.next;
  if(next&&typeof next==='object'&&next.branch){ const hit=next.branch.find(b=>(b.all||[]).every(f=>G.flags[f])&&!(b.none||[]).some(f=>G.flags[f])); next=hit?hit.next:next.else; }
  if(next&&typeof next==='object'&&next.choice){ store('branch-'+ch.id,{...snapshot(),pendingChoice:ch.id}); next=await makeChoice(next.choice); }
  if(!next) return titleScreen();
  gotoChapter(next);
}
async function makeChoice(c){

      return `<button class="btn choice" data-v="${i}" ${ok?'':'disabled'}><b>${o.text}</b><small>${o.desc||''}</small>${ok?'':`<small class="why">${o.requiresText||'條件未達成'}</small>`}</button>`;}).join('')}</div>`,'wide');

function rootOf(clsId){let c=CLS(clsId); while(c.from&&CLASSES[c.from]) c=CLASSES[c.from]; return c.id;}
function pathSet(clsId){const s=new Set();let c=CLS(clsId);s.add(c.id);while(c.from&&CLASSES[c.from]){c=CLASSES[c.from];s.add(c.id);}return s;}
async function classChange(cid,viewOnly=false){
  const m=G.roster.find(x=>x.cid===cid); if(!m) return;
  const cur=CLS(m.cls), past=pathSet(m.cls), avail=new Set(canChange(m)?childrenOf(m.cls,cid).map(c=>c.id):[]);
  const root=rootOf(m.cls);
  const node=(c)=>{ const st=c.id===m.cls?'cur':past.has(c.id)?'past':avail.has(c.id)?'avail':reqOK(c,cid)?'':'lock';
    return `<button class="cn ${st}" data-v="${avail.has(c.id)&&!viewOnly?'to:'+c.id:'info:'+c.id}"><span class="tier t${c.tier}">${TIER_NAME[c.tier]}</span><b>${c.req&&!reqOK(c,cid)&&st!=='cur'&&st!=='past'?'？？？':c.name}</b>${st==='cur'?'<small>目前</small>':st==='avail'?'<small>可轉職</small>':''}</button>`; };
  const kids=id=>Object.values(CLASSES).filter(c=>c.from===id);
  let tree=`<div class="tree"><div class="tcol">${node(CLASSES[root])}</div><div class="tbr">`;
  for(const k2 of kids(root)){
    tree+=`<div class="trow"><div class="tcol">${node(k2)}</div><div class="tcol t3">${kids(k2.id).map(node).join('')}</div></div>`;
  }
  tree+='</div></div>';
  const t4=cid==='gang'?Object.values(CLASSES).filter(c=>c.from==='*s3'):[];
  if(t4.length) tree+=`<div class="t4row"><span style="color:var(--mute)">任一上階 Lv ${CC_LV}＋第 12 章以後，依路線解放：</span>${t4.map(node).join('')}</div>`;
  if(CLASSES[root]&&CLASSES[root].tier===2) tree=tree; // 騎士系從中階開始
  for(;;){
    const v=await ask(`<h2>${CHARS[cid].pilot}的轉職樹</h2>
      <p style="color:var(--mute)">${ROLE_NAME[cur.role]}　·　目前：${cur.name} Lv ${m.lv}　·　${canChange(m)?'<span style="color:var(--amber)">可以轉職！點選發光的職業。</span>':`到達 Lv ${CC_LV} 後可轉職，轉職後等級回到 1，但基礎能力大幅提升。`}</p>
      ${tree}<div class="foot"><button class="btn" data-v="back">返回</button></div>`,'wide');
    if(v==='back') return;
    const [act,id]=v.split(':'); const c=CLASSES[id];
    const r=await classInfo(m,c,act==='to');
    if(r==='done') return;
  }
}
async function classInfo(m,c,can){
  const now=statsOf(m.cls,m.lv,CHARS[m.cid].mod), nx=statsOf(c.id,1,CHARS[m.cid].mod);
  const hidden=c.req&&!reqOK(c,m.cid)&&!pathSet(m.cls).has(c.id);
  if(hidden){ await ask(`<h2>？？？</h2><p>這個職業的解放條件尚未滿足。</p><p style="color:var(--mute)">${c.desc}</p><div class="foot"><button class="btn pri" data-v="b">返回</button></div>`); return; }
  const row=(k,n)=>`<tr><td>${n}</td><td class="mono">${fmt(now[k])}</td><td class="mono">${fmt(nx[k])}</td><td class="mono ${nx[k]>now[k]?'up':nx[k]<now[k]?'dn':''}">${nx[k]>now[k]?'+':''}${fmt(nx[k]-now[k])}</td></tr>`;
  const v=await ask(`<h2>${c.name}<span class="tier t${c.tier}" style="margin-left:10px;font-size:12px">${TIER_NAME[c.tier]}</span></h2>
    <p style="color:var(--mute)">${c.desc}${c.fly?'　飛行。':''}</p>
    <table class="cmp"><thead><tr><th></th><th>目前 Lv${m.lv}</th><th>轉職後 Lv1</th><th></th></tr></thead><tbody>
    ${row('hp','HP')}${row('en','EN')}${row('atk','攻擊')}${row('def','裝甲')}${row('hit','命中')}${row('eva','迴避')}${row('mov','移動')}</tbody></table>
    <h4>特殊能力</h4><p>${skillList(c.skills).join('、')||'—'}</p>
    <h4>武器</h4><table class="wt"><thead><tr><th>武器</th><th>威力</th><th>射程</th><th>命中</th><th>消耗</th></tr></thead><tbody>
    ${c.weapons.map(w=>`<tr><td>${w.name}${!w.post?'<span class="tag">P✕</span>':''}</td><td>${fmt(w.pow)}</td><td>${w.min===w.max?w.min:w.min+'–'+w.max}</td><td>${w.hit>=0?'+':''}${w.hit}</td><td>${costTxt({...w,left:w.ammo})}</td></tr>`).join('')}</tbody></table>
    <div class="foot"><button class="btn" data-v="b">返回</button>${can?`<button class="btn pri" data-v="go">轉職為 ${c.name}</button>`:''}</div>`,'wide');
  if(v!=='go') return;
  m.cls=c.id; m.lv=1; m.exp=0; sfx('levelup');
  await ask(`<div class="title"><small class="eyebrow">CLASS CHANGE</small><div class="t-logo" style="font-size:clamp(28px,7vw,40px)">${c.name}</div><p>${CHARS[m.cid].pilot}轉職成功！${unlockedSpirits(m).length>0?`<br><span style="color:var(--mute)">可用精神：${unlockedSpirits(m).join('、')}</span>`:''}</p><div class="foot" style="justify-content:center"><button class="btn pri" data-v="ok">好</button></div></div>`);
  return 'done';
}

   <li><b>畫面</b>：地圖為像素地形與 Q 版機體，戰鬥有動畫（近戰、光束、飛彈、射擊、擊墜爆炸）。想看原本的文字地圖，可以勾選「經典文字地圖」。</li>
   <li><b>寶箱</b>：地圖上的寶箱裡有資金、道具或零件。讓我方機體停在寶箱上並結束行動就能拿到。</li>
   <li><b>地圖設施</b>：「防衛砲台」不會移動，但射程很遠；「破損城牆」擊破後會變成通道；「虛無核心」是破壞目標。部分關卡的勝利條件是佔領指定格子（綠色虛線框）或破壞設施。</li>
   <li><b>必殺技</b>：使用需要氣力的武器時，會有切入演出。最終頭目被擊破後可能會進入第二形態。</li>
   <li>難度：簡單（敵人等級 −2、經驗 ×1.25）、普通、困難（敵人等級 +2）。在出擊準備畫面可以隨時更改。</li></ul>
   <h4>地形</h4>
   <table><thead><tr><th></th><th>地形</th><th>移動</th><th>防禦</th><th>迴避</th><th>備註</th></tr></thead><tbody>${ts}</tbody></table>
   <p style="color:var(--mute);font-size:12.5px">飛行機體（字的右上角有小三角）移動消耗一律為 1，但不享有地形加成。</p>
   <h4>戰鬥公式</h4>
   <div class="formula">命中率 = 75 + 武器命中 + (攻方命中 − 守方迴避) ÷ 2 − 地形迴避 + 技能／指揮加成
傷害   = (武器威力 + 攻擊×10) × 攻方氣力% − 裝甲 × 守方氣力% × 0.5
         × 技能加成 × (1 − 地形防禦) × 0.9〜1.1　（會心 ×1.25）</div>
   <ul><li><b>氣力</b>：初始 100、上限 150。命中 +3、擊墜 +5、被命中 +2、迴避 +3。部分必殺武器需要氣力。</li>
   <li><b>P✕</b>：移動後不能使用的武器。<b>先制反擊</b>：被攻擊時先打回去。<b>指揮</b>：範圍內友軍獲得加成。</li></ul>
   <h4>精神指令（消耗 SP，不消耗行動）</h4>
   <table><thead><tr><th>名稱</th><th>SP</th><th>效果</th></tr></thead><tbody>${sps}</tbody></table>
   </div><div class="foot"><button class="btn pri" data-v="ok">了解</button></div>`,'wide');
}

// =====================================================================
// 事件綁定
// =====================================================================
$('#map').addEventListener('click',e=>{const c=e.target.closest('.c'); if(c) onCell(+c.dataset.x,+c.dataset.y);});
$('#map').addEventListener('mouseover',e=>{const c=e.target.closest('.c'); if(!c) return; const x=+c.dataset.x,y=+c.dataset.y; showTerrain(x,y); if(typeof GFX!=='undefined') GFX.hover={x,y};
  const u=unitAt(x,y); if(G.phase==='P'&&!G.busy){ const want=u||null; if(want!==G.inspect&&(want||G.mode!=='idle'||!G.threatOne)){G.inspect=want;renderInfo();} }});
$('#map').addEventListener('mouseleave',()=>{ if(typeof GFX!=='undefined') GFX.hover=null;if(G.phase==='P'&&!G.busy){G.inspect=G.threatOne||null;renderInfo();}});
$('#actions').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b||b.disabled) return; if(b.dataset.w!=null) pickWeapon(+b.dataset.w); else onAction(b.dataset.a);});
$('#btnEnd').onclick=()=>{ if(G.sel&&G.sel.moved) cancel(); G.sel=null; G.mode='idle'; endPlayerPhase(); };
$('#btnThreat').onclick=()=>{G.threatAll=!G.threatAll;render();};
$('#btnHelp').onclick=()=>{ if(!$('#modal').hidden) return; showHelp(); };
$('#btnMenu').onclick=async()=>{ if(G.busy||!$('#modal').hidden) return;
  if(G.over){ return; }
  const v=await ask(`<h2>選單</h2><div class="stlist" style="max-width:none"><button class="btn" data-v="turn" ${G.turnSnap?'':'disabled'}><span>重來本回合</span><small>回到第 ${G.turn} 回合我方行動開始時</small></button><button class="btn" data-v="retry"><span>重新開始本章</span><small>回到出擊準備</small></button><button class="btn" data-v="title"><span>回到標題畫面</span><small>未存檔的戰鬥進度會遺失</small></button>${IN_HALL?`<a class="btn hallbtn" href="${HALL_URL}"><span>返回遊戲大廳</span><small>未存檔的戰鬥進度會遺失</small></a>`:''}</div><div class="foot"><button class="btn pri" data-v="">繼續戰鬥</button></div>`);
  if(v==='turn'&&G.turnSnap){ restoreTurn(G.turnSnap); return; }
  if(v==='retry'){ G.over=true; restore(G.prepSnap); prep(); } else if(v==='title'){ G.over=true; titleScreen(); } };
$('#optAnim').onchange=e=>{G.anim=e.target.checked;};
$('#optAuto').onchange=e=>{G.autoCounter=e.target.checked;};
$('#optFast').onchange=e=>{G.fast=e.target.checked;};
if($('#optBgm')){ $('#optBgm').checked=BGM.on; $('#optBgm').onchange=e=>{ BGM.on=e.target.checked; try{localStorage.setItem('zijia2-bgm',BGM.on?'1':'0');}catch(_){} if(BGM.on){ const w=BGM.want; BGM.want=null; bgm(w); } else bgmStop(); }; }
if($('#optSfx')){ $('#optSfx').checked=SFX.on; $('#optSfx').onchange=e=>{ SFX.on=e.target.checked; try{localStorage.setItem('zijia2-sfx',SFX.on?'1':'0');}catch(_){} if(SFX.on) sfx('select'); }; }
if(!IN_HALL){ const h=document.querySelector('.hall'); if(h&&h.remove) h.remove(); }
$('#optIcons').onchange=e=>{G.classic=e.target.checked; try{localStorage.setItem(SAVE+'classic',G.classic?'1':'0');}catch(_){} fitMap(); renderLegend(); render();};
try{ if(localStorage.getItem(SAVE+'classic')==='1'){ G.classic=true; $('#optIcons').checked=true; } }catch(_){}
document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden||!$('#battle').hidden||!$('#scene').hidden) return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  if(e.key==='Escape'){ cancel(); return; }
  if(G.phase!=='P'||G.busy||G.over) return;
  const k=(e.key||'').toLowerCase();
  if(k==='tab'){ e.preventDefault(); nextUnit(); return; }
  if(k==='e'&&!e.metaKey&&!e.ctrlKey){ if(G.sel&&G.sel.moved) return; G.sel=null; G.mode='idle'; endPlayerPhase(); return; }
  if(!G.sel) return;
  const act={a:'attack',s:'spirit',w:'wait',r:'repair',t:'talk',i:'item'}[k];
  if(act&&G.mode==='unit'){ const btn=document.querySelector(`#actions [data-a="${act}"]:not([disabled])`); if(btn){ e.preventDefault(); onAction(act); } return; }
  if(G.mode==='weapon'&&/^[1-9]$/.test(k)){ const i=+k-1, b=document.querySelector(`#actions [data-w="${i}"]:not([disabled])`); if(b){ e.preventDefault(); pickWeapon(i); } }
});
$('#map').addEventListener('contextmenu',e=>{ e.preventDefault(); if(G.phase==='P'&&!G.busy) cancel(); });
$('#fmenu').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b||b.disabled) return; e.stopPropagation(); if(b.dataset.a!=='cancel'&&b.dataset.a!=='back') sfx('menu'); if(b.dataset.w!=null) pickWeapon(+b.dataset.w); else onAction(b.dataset.a);});
window.addEventListener('resize',()=>renderFMenu());
document.querySelector('.mapwrap').addEventListener('scroll',()=>renderFMenu());
window.addEventListener('resize',()=>{fitMap();});

fitMap();
renderLegend();
if(typeof startMapLoop==='function') startMapLoop();
titleScreen();
</script>

</html>
