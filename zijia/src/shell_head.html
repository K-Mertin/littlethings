<title>字甲戰線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#14191e; --panel:#1a2127; --panel2:#20282f; --line:#2b353e;
  --ink:#e3e8eb; --mute:#8d9ba6; --dim:#5f6d78;
  --p:#8fd0ff; --pbg:#153250; --pline:#2f6c9f;
  --e:#ff8f7e; --ebg:#461d1b; --eline:#903c34;
  --amber:#f3bb4f; --good:#86d49a; --bad:#ff8f7e;
  --mv:rgba(86,156,255,.32); --atk:rgba(255,120,95,.28); --thr:rgba(255,95,75,.14); --rep:rgba(120,220,150,.30);
  --cs:40px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.55}
button{font:inherit;color:inherit}
#app{max-width:1300px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hall{align-self:center;font-size:12px;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px}
.hall:hover,.hall:focus-visible{color:var(--ink);border-color:var(--pline);outline:none}
.logo{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.12em;color:var(--ink)}
.logo b{color:var(--amber);font-weight:900}
#stageName{color:var(--mute);font-size:14px;letter-spacing:.06em}
.turninfo{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px}
.phase{padding:2px 10px;border-radius:3px;font-family:var(--sans);font-weight:700;letter-spacing:.1em;font-size:12px}
.phase.P{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.phase.E{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:1fr}}
.board{min-width:0}
.mapwrap{overflow-x:auto}
.map{display:grid;grid-template-columns:repeat(var(--cols),var(--cs));grid-auto-rows:var(--cs);gap:1px;background:var(--line);border:1px solid var(--line);width:max-content;margin:0 auto;touch-action:manipulation}
.c{position:relative;background:#1f272e;display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.c .tg{font-family:var(--mono);font-size:calc(var(--cs)*.46);line-height:1;pointer-events:none;font-variant-emoji:text}
.t-plain .tg{color:#3d4a55}
.t-forest{background:#1c2a24}.t-forest .tg{color:#6ea56b}
.t-mount{background:#2a261f}.t-mount .tg{color:#b99d73}
.t-water{background:#172839}.t-water .tg{color:#5b95c2}
.t-wall{background:repeating-linear-gradient(45deg,#39434c 0 3px,#2a3239 3px 7px);cursor:default}.t-wall .tg{visibility:hidden}
.t-base{background:#2a2718}.t-base .tg{color:var(--amber)}
.t-ruin{background:#24262a}.t-ruin .tg{color:#858b91}
.c::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1}
.c.thr::after{background:var(--thr);box-shadow:inset 0 0 0 1px rgba(255,110,90,.28)}
.c.mv::after{background:var(--mv)}
.c.ra::after{background:rgba(255,120,95,.13);box-shadow:inset 0 0 0 1px rgba(255,120,95,.22)}
.c.atk::after{background:var(--atk)}
.c.rep::after{background:var(--rep)}
.c:hover::before{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 2px rgba(243,187,79,.55);z-index:3;pointer-events:none}
.u{position:absolute;inset:2px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:calc(var(--cs)*.6);line-height:1;border-radius:3px;z-index:2;pointer-events:none;transition:filter .2s}
.u.P{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.u.E{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}
.u.boss{box-shadow:inset 0 0 0 2px var(--amber)}
.u.acted{filter:grayscale(.9) brightness(.6)}
.u i{position:absolute;left:3px;right:3px;bottom:2px;height:3px;background:rgba(0,0,0,.45);border-radius:1px}
.u i::after{content:"";display:block;height:100%;width:var(--h);background:currentColor;border-radius:1px}
.u.fly::before{content:"";position:absolute;top:2px;right:3px;width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:5px solid currentColor;opacity:.8}
.c.sel .u{outline:2px solid var(--amber);outline-offset:0;animation:pulse 1s ease-in-out infinite}
.c.tgt .u{outline:2px solid var(--e);animation:pulse .8s ease-in-out infinite}
.c.rtg .u{outline:2px solid var(--good)}
.c.hit .u{animation:shake .35s}
@keyframes pulse{50%{outline-color:transparent}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;color:var(--mute);font-size:12.5px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:2px;font-family:var(--mono);font-size:12px}
.legend .num{font-family:var(--mono);color:var(--dim)}

.panel{display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:#4a5a67;background:#253039}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--amber);color:#1c1508;border-color:var(--amber);font-weight:700}
.btn.pri:hover:not(:disabled){background:#ffc964}
.btn.on{border-color:var(--amber);color:var(--amber)}
.toggles{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:13px}
.toggles label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.box h3{margin:0 0 8px;font-size:12px;letter-spacing:.14em;color:var(--mute);font-weight:500}
.actions .hint{color:var(--mute);margin:0}
.actions .row{display:flex;flex-wrap:wrap;gap:8px}
.actions .wlist{display:flex;flex-direction:column;gap:6px}
.wbtn{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:8px 10px}
.wbtn small{color:var(--mute);font-family:var(--mono);font-size:11.5px}
.wbtn .why{color:var(--bad);font-family:var(--sans)}

.uc-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.uc-g{width:48px;height:48px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:30px;border-radius:4px;flex:none}
.P .uc-g{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.E .uc-g{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}
.uc-head b{display:block;font-size:16px}
.uc-head small{color:var(--mute)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-family:var(--mono);font-size:12px;margin-bottom:8px}
.bar{height:6px;background:#0f1418;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.bar.hp i{background:var(--good)} .bar.hp.low i{background:var(--bad)} .bar.en i{background:#6aa9e0}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.stats div{background:var(--panel2);border-radius:3px;padding:4px 0;text-align:center}
.stats small{display:block;color:var(--mute);font-size:11px;letter-spacing:.06em}
.stats span{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.chip{font-size:11.5px;padding:1px 7px;border-radius:10px;background:#2c2715;color:var(--amber);box-shadow:inset 0 0 0 1px #5b4a1f}
.wt{width:100%;border-collapse:collapse;font-size:12.5px}
.wt th{color:var(--dim);font-weight:500;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);font-size:11.5px}
.wt td{padding:4px;border-bottom:1px solid #222b32;font-family:var(--mono);font-variant-numeric:tabular-nums}
.wt td:first-child{font-family:var(--sans)}
.wt .tag{font-family:var(--sans);font-size:10.5px;color:var(--amber);margin-left:4px}
.tinfo{color:var(--mute);font-size:12.5px;min-height:1.5em}
.tinfo b{color:var(--ink);font-weight:500}
.logwrap ol{list-style:none;margin:0;padding:0;max-height:220px;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
.logwrap li{color:#b9c4cc}
.logwrap li.q{color:var(--p)} .logwrap li.eq{color:var(--e)}
.logwrap li.good{color:var(--good)} .logwrap li.bad{color:var(--bad)} .logwrap li.sys{color:var(--amber)}

.modal{position:fixed;inset:0;background:rgba(8,11,14,.72);display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:var(--panel);border:1px solid #38444f;border-radius:8px;padding:20px 22px;width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mbox.wide{width:min(780px,100%)}
.mbox h2{font-family:var(--serif);font-weight:900;font-size:22px;margin:0 0 10px;letter-spacing:.06em;text-wrap:balance}
.mbox h4{margin:18px 0 6px;font-size:13px;letter-spacing:.12em;color:var(--amber);font-weight:700}
.mbox p{margin:0 0 8px}
.mbox .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.brief p{margin:0 0 10px;max-width:60ch}
.brief .say{color:var(--p)} .brief .esay{color:var(--e)}
.cond{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--panel2);border-radius:4px;padding:10px 12px;margin-top:10px;font-size:13px}
.cond dt{color:var(--mute)} .cond dd{margin:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{background:var(--panel2);border-radius:6px;padding:10px 12px}
.vs .who{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.vs .g{font-family:var(--serif);font-weight:900;font-size:22px;width:34px;height:34px;display:grid;place-items:center;border-radius:3px}
.vs .P .g{background:var(--pbg);color:var(--p)} .vs .E .g{background:var(--ebg);color:var(--e)}
.vs dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0;font-size:13px}
.vs dt{color:var(--mute)} .vs dd{margin:0;font-family:var(--mono)}
.vs .kill{color:var(--amber);font-family:var(--sans);font-size:11.5px;margin-left:4px}
.react{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.react .btn{text-align:left;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.react .btn b{font-size:15px}
.react small{color:var(--mute);font-family:var(--mono);font-size:12px}
.spl{display:flex;flex-direction:column;gap:6px}
.spl .btn{display:grid;grid-template-columns:4em 3.5em 1fr;gap:8px;align-items:center;text-align:left}
.spl .cost{font-family:var(--mono);color:var(--amber)}
.spl .d{color:var(--mute);font-size:12.5px}

.title{text-align:center}
.t-logo{font-family:var(--serif);font-weight:900;font-size:clamp(40px,11vw,64px);letter-spacing:.2em;line-height:1.1;margin:6px 0 4px;padding-left:.2em}
.t-logo b{color:var(--amber)}
.t-sub{color:var(--mute);margin-bottom:18px}
.t-demo{font-family:var(--mono);color:var(--dim);white-space:pre;font-size:13px;line-height:1.35;margin:0 auto 18px;display:inline-block;text-align:left}
.t-demo .p{color:var(--p);font-family:var(--serif);font-weight:900} .t-demo .e{color:var(--e);font-family:var(--serif);font-weight:900}
.t-demo .f{color:#6ea56b} .t-demo .m{color:#b99d73} .t-demo .w{color:#5b95c2}
.stlist{display:flex;flex-direction:column;gap:8px;max-width:360px;margin:0 auto}
.stlist .btn{padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.stlist small{color:var(--mute)}

.help table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
.help th,.help td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.help th{color:var(--dim);font-weight:500}
.help td.g{font-family:var(--mono);font-size:16px}
.help ul{margin:0 0 6px;padding-left:1.2em}
.help li{margin-bottom:3px}
.help .formula{font-family:var(--mono);background:var(--panel2);padding:8px 10px;border-radius:4px;font-size:12.5px;overflow-x:auto;white-space:pre}

.battle{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(6,9,12,.82);padding:16px;cursor:pointer}
.bt{width:min(720px,100%);background:#10161b;border:1px solid #33404b;border-radius:8px;padding:20px}
.bt-row{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:10px}
.bt-side{text-align:center}
.bt-g{width:clamp(56px,16vw,84px);height:clamp(56px,16vw,84px);margin:0 auto 8px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:clamp(34px,10vw,54px);border-radius:6px;transition:transform .15s}
.bt-side.P .bt-g{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.bt-side.E .bt-g{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}
.bt-g.shake{animation:shake .3s 2}
.bt-g.down{filter:grayscale(1) brightness(.4)}
.bt-name{font-size:12.5px;color:var(--mute);margin-bottom:6px}
.bt-hp{font-family:var(--mono);font-size:12px;margin-top:4px}
.bt-side .bar i{transition:width .5s ease-out}
.bt-mid{text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.bt-w{font-weight:700;color:var(--amber);min-height:1.4em}
.bt-arrow{height:3px;background:#27323b;position:relative;overflow:hidden;border-radius:2px}
.bt-arrow i{position:absolute;top:0;bottom:0;width:0;background:var(--amber)}
.bt-arrow.ltr i{left:0;animation:shoot .45s ease-in forwards}
.bt-arrow.rtl i{right:0;animation:shoot .45s ease-in forwards}
@keyframes shoot{to{width:100%}}
.bt-res{font-family:var(--mono);font-size:22px;font-weight:600;min-height:1.4em}
.bt-res.hit{color:#fff}.bt-res.miss{color:var(--dim)}.bt-res.crit{color:var(--amber)}
.bt-line{margin-top:14px;min-height:1.5em;text-align:center;color:var(--mute);font-size:13px}
.bt-skip{text-align:center;color:var(--dim);font-size:11.5px;margin-top:6px}
.banner{position:fixed;left:0;right:0;top:40%;z-index:55;pointer-events:none;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(28px,7vw,44px);letter-spacing:.3em;padding:14px 0;animation:ban .9s ease-out forwards}
.banner.P{background:linear-gradient(90deg,transparent,rgba(21,50,80,.92) 20%,rgba(21,50,80,.92) 80%,transparent);color:var(--p)}
.banner.E{background:linear-gradient(90deg,transparent,rgba(70,29,27,.92) 20%,rgba(70,29,27,.92) 80%,transparent);color:var(--e)}
@keyframes ban{0%{opacity:0;transform:scaleY(.2)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

.stats{grid-template-columns:repeat(6,1fr)}
.rt{margin-left:10px;font-size:11.5px;padding:1px 8px;border-radius:10px;background:#2c2715;color:var(--amber);box-shadow:inset 0 0 0 1px #5b4a1f;letter-spacing:.08em}
.winlbl{color:var(--mute);font-size:12.5px;margin:-8px 0 12px}
.c.exit::before{content:"";position:absolute;inset:3px;border:1px dashed var(--good);border-radius:2px;z-index:1;pointer-events:none}
.legend .sw.exit{position:relative;border:1px dashed var(--good)}
.u.guest{background:#1d3a2c;color:#9fe3b4;box-shadow:inset 0 0 0 1px #3f7d58}
.u.talkable::after{content:"";position:absolute;top:3px;left:3px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.c.ttg .u{outline:2px solid var(--good);animation:pulse .8s ease-in-out infinite}
.talkbtn{border-color:#3f7d58;color:var(--good)}
.expbar{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-family:var(--mono);font-size:12px;margin-bottom:8px}
.bar.ex i{background:var(--amber)}
.spline{font-size:12px;color:var(--mute);margin-bottom:8px}
.chip.sk{background:#18293a;color:#a9d3f5;box-shadow:inset 0 0 0 1px #2d4f6e}
.lvtxt{color:var(--amber);font-weight:700;letter-spacing:.05em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{display:block;color:var(--amber);font-size:11px;letter-spacing:.2em;margin-bottom:2px}
.prep-h h2{margin-bottom:4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:14px}
.rc{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rc.ready{border-color:#6b5520;box-shadow:0 0 0 1px rgba(243,187,79,.25)}
.rc-h{display:flex;gap:10px;align-items:center}
.rc-h small{color:var(--mute)}
.rc-s{font-size:11.5px;color:#b9c4cc}
.rc-k{font-size:11.5px;color:#a9d3f5;min-height:1.4em}
.rc .row{display:flex;gap:6px;flex-wrap:wrap}
.rc .btn{padding:4px 10px;font-size:13px}
.uc-g.P{display:inline-grid;place-items:center;font-family:var(--serif);font-weight:900;border-radius:4px;background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline);flex:none}
.tier{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:3px;letter-spacing:.08em;vertical-align:1px}
.tier.t1{background:#27313a;color:#aebbc5}.tier.t2{background:#16304a;color:#8fd0ff}.tier.t3{background:#3a2d12;color:var(--amber)}.tier.t4{background:#4a1f1d;color:#ffb3a6}
.dlist{display:flex;flex-direction:column;gap:6px}
.dl{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:4px;padding:6px 10px;cursor:pointer}
.dl small{color:var(--mute);margin-left:auto}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.choice{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.choice b{font-size:16px}.choice small{color:var(--mute)}
.tree{display:flex;align-items:center;gap:14px;overflow-x:auto;padding:6px 2px 10px}
.tbr{display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line);padding-left:14px}
.trow{display:flex;align-items:center;gap:14px}
.tcol{display:flex;flex-direction:column;gap:6px}
.tcol.t3{border-left:1px solid var(--line);padding-left:14px}
.cn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:6px 10px;min-width:92px;text-align:left;display:flex;flex-direction:column;gap:1px;cursor:pointer;color:var(--ink);font:inherit}
.cn b{font-size:14px}.cn small{font-size:11px;color:var(--mute)}
.cn.past{opacity:.55}
.cn.cur{border-color:var(--p);box-shadow:0 0 0 1px var(--p)}
.cn.cur small{color:var(--p)}
.cn.avail{border-color:var(--amber);box-shadow:0 0 12px rgba(243,187,79,.35);animation:glow 1.4s ease-in-out infinite}
.cn.avail small{color:var(--amber)}
.cn.lock{opacity:.45}
@keyframes glow{50%{box-shadow:0 0 2px rgba(243,187,79,.2)}}
.t4row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:12.5px}
.cmp{border-collapse:collapse;font-size:13px;margin:6px 0}
.cmp th,.cmp td{padding:3px 12px 3px 0;text-align:left}
.cmp th{color:var(--dim);font-weight:500}
.cmp .up{color:var(--good)}.cmp .dn{color:var(--bad)}
.trees{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:8px 0}
.treepre{font-family:var(--sans);font-size:12.5px;line-height:1.6;margin:4px 0 0;color:#b9c4cc;white-space:pre}
.t-end{color:var(--dim);font-size:12.5px;margin-top:14px}.t-end b{color:var(--amber)}
.logwrap li.lvl{color:var(--amber)}
.scene{position:fixed;inset:0;z-index:58;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px;background:linear-gradient(to top,rgba(8,11,14,.92),rgba(8,11,14,.35) 60%,rgba(8,11,14,.2));padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));cursor:pointer}
.sbox{position:relative;width:min(780px,100%);background:#0f151a;border:1px solid #3a4753;border-radius:8px;padding:16px 18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;min-height:118px;box-shadow:0 10px 40px rgba(0,0,0,.5);order:1}
.sbox.narr{grid-template-columns:1fr;text-align:center;align-items:center}
.sbox.narr .stext{color:#cfd8de;font-size:15.5px}
.sg{width:58px;height:58px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:34px;border-radius:6px}
.sg.P{background:var(--pbg);color:var(--p);box-shadow:inset 0 0 0 1px var(--pline)}
.sg.E{background:var(--ebg);color:var(--e);box-shadow:inset 0 0 0 1px var(--eline)}
.sg.N{background:#2a3038;color:#cbd3d9;box-shadow:inset 0 0 0 1px #4a5560}
.sname{font-weight:700;letter-spacing:.08em;margin-bottom:4px;font-size:13.5px}
.sname.P{color:var(--p)}.sname.E{color:var(--e)}.sname.N{color:#cbd3d9}
.stext{font-size:16px;line-height:1.8;max-width:62ch;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}}
.snext{position:absolute;right:14px;bottom:8px;color:var(--amber);font-size:12px;animation:pulse 1s infinite}
.sctrl{order:0;width:min(780px,100%);display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:12px;font-family:var(--mono)}
.sctrl .btn{padding:3px 10px;font-size:12px;font-family:var(--sans)}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;width:100%;height:100%}
.hasicon{overflow:hidden;position:relative}
.uc-g.hasicon,.sg.hasicon,.bt-g.hasicon{padding:3px}
.uc-g .badge{position:absolute;right:-1px;bottom:-1px;font-size:11px;line-height:1;padding:2px 3px;border-radius:3px 0 3px 0;background:var(--pline);color:#fff;font-family:var(--serif);font-weight:900}
.E .uc-g .badge{background:var(--eline)}
.u img.px{width:88%;height:88%}
.u.merc{inset:6px;font-size:calc(var(--cs)*.42);background:#1c3b5a;color:#bfe3ff;box-shadow:inset 0 0 0 1px #3f79a8;border-radius:50%}
.btn.combo{border-color:#6b5520}.ctag{margin-left:6px;color:var(--amber);font-size:11px}
.supline{display:flex;gap:8px;align-items:center;margin-top:10px;background:var(--panel2);padding:8px 10px;border-radius:4px;font-size:13px;cursor:pointer}
.chip.pt{background:#2a2438;color:#d8c8ff;box-shadow:inset 0 0 0 1px #4a3e6a}.chip.pt.empty{background:none;color:var(--dim);box-shadow:inset 0 0 0 1px var(--line)}
.chip.mc{background:#16304a;color:#bfe3ff;box-shadow:inset 0 0 0 1px #2f6c9f}
.rc-x{display:flex;flex-wrap:wrap;gap:4px;min-height:1.2em}
.btn.hot{border-color:var(--amber);color:var(--amber)}
table.shop{width:100%;border-collapse:collapse;font-size:13px}table.shop td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:middle}table.shop td:last-child{text-align:right}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}.slot{background:var(--panel2);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.mchip{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1c3b5a;color:#bfe3ff;font-family:var(--serif);font-weight:900;font-size:13px}
.board{position:relative}
.fmenu{position:absolute;z-index:20;width:max-content;min-width:128px;max-width:240px;background:#0f151a;border:1px solid #3a4753;border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px rgba(0,0,0,.55)}
.fmenu .fm-h{font-size:11.5px;color:var(--mute);padding:2px 4px 4px;border-bottom:1px solid var(--line);margin-bottom:2px;white-space:nowrap}
.fmenu .btn{padding:5px 10px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:13.5px}
.fmenu .wbtn{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.fmenu .wbtn small{grid-column:1/-1;font-family:var(--mono);font-size:11px;color:var(--mute)}
.fmenu .wbtn small.why{color:var(--bad);font-family:var(--sans)}
.fmenu kbd{font-family:var(--mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:0 4px;min-width:1.2em;text-align:center}
.fmenu .btn.pri kbd{color:#5a430f;border-color:#b8892c}
.hint.keys{margin-top:8px!important;font-size:12px;color:var(--dim)}
.wswitch{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.wswitch .btn{display:flex;flex-direction:column;align-items:flex-start;padding:5px 10px;font-size:13px}
.wswitch .btn small{font-family:var(--mono);font-size:11px;color:var(--mute)}
.wswitch .btn.on{border-color:var(--amber);color:var(--amber)}
@media (hover:none){.fmenu kbd{display:none}}
</style>
<div id="app">
  <header class="top">
    <div class="brand"><a class="hall" href="../index.html" title="返回遊戲大廳">← 大廳</a><span class="logo">字<b>甲</b>戰線</span><span id="stageName"></span></div>
    <div class="turninfo"><span id="turnLbl"></span><span id="phaseLbl" class="phase P">我方回合</span></div>
  </header>
  <p class="winlbl" id="winLbl"></p>
  <main class="layout">
    <section class="board">
      <div class="mapwrap"><div id="map" class="map" role="grid" aria-label="戰場地圖"></div></div>
      <div id="fmenu" class="fmenu" hidden></div>
      <div class="legend" id="legend"></div>
    </section>
    <aside class="panel">
      <div class="toolbar">
        <button class="btn pri" id="btnEnd">結束回合</button>
        <button class="btn" id="btnThreat">敵方威脅範圍</button>
        <button class="btn" id="btnHelp">說明</button>
        <button class="btn" id="btnMenu">選單</button>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="optAnim" checked> 戰鬥動畫</label>
        <label><input type="checkbox" id="optAuto"> 被攻擊時自動反擊</label>
        <label><input type="checkbox" id="optIcons"> 地圖顯示機體圖示</label>
        <label><input type="checkbox" id="optFast"> 快速敵方回合</label>
      </div>
      <div class="box actions" id="actions"></div>
      <div class="box" id="info"></div>
      <div class="tinfo" id="terrain">將游標移到地圖格子上可查看地形效果。</div>
      <div class="box logwrap"><h3>戰鬥記錄</h3><ol id="log"></ol></div>
    </aside>
  </main>
</div>
<div id="scene" class="scene" hidden></div>
<div id="modal" class="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="battle" class="battle" hidden></div>
<div id="banner" hidden></div>
