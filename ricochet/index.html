<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>反彈神射手 · Ricochet</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/offline/offline.js" data-game="ricochet" defer></script>
<meta name="theme-color" content="#f6efe0">
<style>
:root{
  --ink:#2b2340; --mute:#6d6787; --paper:#f6efe0; --panel:#fffaf0;
  --red:#ef4b3f; --gold:#ffc23d; --mint:#3fcf8e; --blue:#4a9dff; --violet:#9b6bff;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#e9dfc8;color:var(--ink);font-family:var(--sans);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
[hidden]{display:none!important}

/* 上方 HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;height:42px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.9);
  box-shadow:0 3px 0 rgba(43,35,64,.15);font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip .t{font-size:13px;color:var(--mute);font-weight:800}
.sp{flex:1}
.hb{flex:none;width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(43,35,64,.15);font-size:20px;display:grid;place-items:center;text-decoration:none}
.hb:active{transform:translateY(2px);box-shadow:none}
#ammo{gap:3px;padding:0 12px}
.shell{width:10px;height:22px;border-radius:5px 5px 2px 2px;background:linear-gradient(#ffd46b 0 40%,#d99a1e 40%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.shell.used{background:rgba(43,35,64,.15);box-shadow:none}

/* 下方操作列 */
#ctrl{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:10px;
  padding:0 calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal));z-index:3;pointer-events:none}
#ctrl>*{pointer-events:auto}
.rb{width:64px;height:64px;border-radius:20px;background:#fff;box-shadow:0 4px 0 rgba(43,35,64,.2);font-size:28px;font-weight:900;display:grid;place-items:center}
.rb:active,.rb.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,64,.2)}
#ang{min-width:118px;height:64px;border-radius:20px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#ang b{font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#ang small{font-size:11px;opacity:.7;margin-top:4px;letter-spacing:.2em}
#fire{height:64px;padding:0 26px;white-space:nowrap;flex:none;border-radius:20px;background:var(--red);color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 0 #a92b22;margin-left:8px}
#fire:active{transform:translateY(3px);box-shadow:0 1px 0 #a92b22}
#fire:disabled{background:#c9c2b4;box-shadow:0 4px 0 #a39c8e;cursor:default}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--sab));font-size:13px;color:var(--mute);font-weight:700;white-space:nowrap;z-index:2;pointer-events:none}
.touch #hint{display:none}
@media (max-width:480px){
  #ctrl{gap:8px}
  .rb{width:56px;height:58px;font-size:26px}
  #ang{min-width:96px;height:58px}
  #ang b{font-size:24px}
  #fire{height:58px;padding:0 18px;font-size:20px;margin-left:4px}
}

/* 提示泡泡 */
#tip{position:fixed;left:50%;top:calc(62px + var(--sat));transform:translateX(-50%);max-width:min(560px,92vw);background:#fff;border-radius:16px;padding:10px 16px;
  font-weight:800;font-size:16px;box-shadow:0 4px 0 rgba(43,35,64,.15);z-index:2;text-align:center;transition:opacity .4s}
#tip.fade{opacity:0}

/* 覆蓋畫面：選關、結果 */
.ov{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));
  background:rgba(246,239,224,.94);overflow:auto;touch-action:pan-y}
.box{width:min(760px,100%);max-height:100%;}
#menu .box{text-align:center}
.logo{font-size:clamp(34px,7vw,56px);font-weight:900;letter-spacing:.06em;margin:4px 0 0;color:var(--ink)}
.logo span{color:var(--red)}
.sub{color:var(--mute);font-weight:700;margin:6px 0 18px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lv{position:relative;background:#fff;border-radius:18px;padding:12px 10px 10px;box-shadow:0 4px 0 rgba(43,35,64,.15);text-align:center}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,64,.15)}
.lv .n{font-size:30px;font-weight:900;line-height:1.1}
.lv .nm{font-size:14px;font-weight:800;color:var(--mute);margin-top:2px}
.lv .st{font-size:20px;letter-spacing:2px;color:var(--gold);margin-top:4px;text-shadow:0 1px 0 #c98a00}
.lv .st i{font-style:normal;color:rgba(43,35,64,.15);text-shadow:none}
.lv.lock{opacity:.5;cursor:default}
.lv.lock .n::after{content:" 🔒";font-size:18px}
.lv.next{outline:3px solid var(--red);outline-offset:2px}
.foot{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;height:48px;padding:0 20px;border-radius:16px;background:#fff;font-weight:900;font-size:17px;box-shadow:0 4px 0 rgba(43,35,64,.15);text-decoration:none;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,64,.15)}
.btn.main{background:var(--red);color:#fff;box-shadow:0 4px 0 #a92b22}
#result .box{width:min(420px,100%);background:#fff;border-radius:26px;padding:26px 22px 22px;text-align:center;box-shadow:0 8px 0 rgba(43,35,64,.15)}
#result h2{margin:0;font-size:34px;font-weight:900}
#rStars{font-size:52px;letter-spacing:6px;color:var(--gold);text-shadow:0 2px 0 #c98a00;margin:8px 0 4px}
#rStars i{font-style:normal;color:rgba(43,35,64,.12);text-shadow:none}
#rText{color:var(--mute);font-weight:700;margin:0 0 6px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <button class="hb" id="bMenu" title="選關（Esc）">☰</button>
  <div class="chip" id="lvName"></div>
  <div class="sp"></div>
  <div class="chip" id="ammo" title="剩下的子彈"></div>
  <button class="hb" id="bRetry" title="重來（R）">↻</button>
  <button class="hb" id="bMute" title="聲音">🔊</button>
</div>

<div id="ctrl" hidden>
  <button class="rb" id="bCCW" title="逆時針（← 或 A）">↺</button>
  <div id="ang"><b id="angNum">0.0°</b><small>角度</small></div>
  <button class="rb" id="bCW" title="順時針（→ 或 D）">↻</button>
  <button id="fire">發射</button>
</div>
<div id="hint" hidden>拖曳畫面瞄準 · ← → 微調（按住 Shift 更細）· 空白鍵發射 · R 重來</div>
<div id="tip" hidden></div>

<div class="ov" id="menu">
  <div class="box">
    <h1 class="logo">反彈<span>神射手</span></h1>
    <p class="sub">調好角度，讓子彈撞牆反彈，打倒所有敵人！</p>
    <div class="grid" id="grid"></div>
    <div class="foot"><a class="btn" href="../index.html">← 回遊戲大廳</a></div>
  </div>
</div>

<div class="ov" id="result" hidden>
  <div class="box">
    <h2 id="rTitle">過關！</h2>
    <div id="rStars"></div>
    <p id="rText"></p>
    <div class="foot">
      <button class="btn" id="rMenu">☰ 選關</button>
      <button class="btn" id="rRetry">↻ 再玩一次</button>
      <button class="btn main" id="rNext">下一關 →</button>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
