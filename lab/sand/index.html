<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>沙之實驗室 · MW 實驗室</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b1020">
<style>
  :root {
    --bg: #0b1020; --panel: #151c33; --panel2: #1d2643; --line: #2c3760; --ink: #e9eefc; --mute: #94a0c6;
    --accent: #ffb347; --good: #49d483; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header a.back { color: var(--mute); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 4px; letter-spacing: .04em; white-space: nowrap; }
  .tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mute); }
  .tag.gpu { color: #9fe0ff; border-color: #2e6b8f; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 6px 14px; font-size: 14px; color: var(--mute); }
  .seg button.on { background: var(--accent); color: #2a1600; font-weight: 700; }
  .grow { flex: 1; }
  .icon { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; font-size: 15px; }

  #stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #stage canvas { position: absolute; display: block; touch-action: none; border-radius: 6px; }
  canvas.cpu { image-rendering: pixelated; }
  #cursor { pointer-events: none; }

  #hud { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: min(560px, calc(100% - 20px));
    background: rgba(13, 18, 36, .82); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; pointer-events: none;
    backdrop-filter: blur(6px); font-size: 14px; z-index: 2; }
  #hud.hidden { display: none; }
  #hud .goal { line-height: 1.45; }
  #hud .bars { display: flex; gap: 10px; margin-top: 6px; align-items: center; font-size: 12px; color: var(--mute); }
  .bar { flex: 1; height: 8px; background: #0a0f1f; border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; width: 0; background: var(--good); border-radius: 99px; transition: width .25s; }
  .bar.ink i { background: #8fb2ff; }
  #hud .hint { pointer-events: auto; }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 8px 10px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    display: flex; gap: 8px; align-items: center; overflow-x: auto; scrollbar-width: none; }
  footer::-webkit-scrollbar { display: none; }
  .tool { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 58px; padding: 6px 6px 5px;
    background: var(--panel2); border: 2px solid transparent; border-radius: 12px; font-size: 12px; color: var(--mute); }
  .tool b { font-size: 22px; line-height: 1; }
  .tool .sw { width: 26px; height: 4px; border-radius: 4px; }
  .tool.on { border-color: var(--accent); color: var(--ink); background: #2a3358; }
  .sep { width: 1px; align-self: stretch; background: var(--line); flex: 0 0 auto; }
  .sizes { display: flex; gap: 4px; flex: 0 0 auto; }
  .sizes button { width: 40px; height: 40px; border-radius: 10px; background: var(--panel2); border: 2px solid transparent; display: grid; place-items: center; }
  .sizes button.on { border-color: var(--accent); }
  .sizes i { display: block; background: var(--ink); border-radius: 50%; }

  .overlay { position: fixed; inset: 0; background: rgba(5, 8, 18, .72); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .overlay.hidden { display: none; }
  .sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: min(680px, 100%); max-height: 90dvh; overflow: auto; }
  .sheet h2 { margin: 0 0 4px; font-size: 20px; }
  .sheet p { color: var(--mute); margin: 0 0 14px; line-height: 1.5; font-size: 14px; }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .lv { text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 10px; align-items: center; }
  .lv:hover { border-color: var(--accent); }
  .lv .em { font-size: 30px; }
  .lv .n { font-size: 12px; color: var(--mute); }
  .lv .t { font-weight: 700; }
  .lv .st { color: var(--accent); letter-spacing: 2px; font-size: 13px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; font-size: 15px; }
  .btn.main { background: var(--accent); color: #2a1600; border-color: var(--accent); font-weight: 700; }
  .big { font-size: 42px; text-align: center; letter-spacing: 6px; color: var(--accent); margin: 6px 0 2px; }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: rgba(13, 18, 36, .92); border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 30; color: var(--mute); }

  #toolTip { background: linear-gradient(180deg, transparent, rgba(10,14,30,.9)); color: var(--mute); font-size: 13px; padding: 5px 14px 3px; min-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toolTip b { color: var(--ink); }
  header { background: linear-gradient(90deg, #1b2347, #2a1f4a 60%, #3a2440); }
  footer { background: linear-gradient(180deg, #131a33, #0f1428); }
  .tool { transition: transform .12s, background .12s; }
  .tool:hover { transform: translateY(-2px); background: #26305a; }
  .tool .sw { width: 34px; height: 6px; box-shadow: 0 0 8px rgba(255,255,255,.15); }
  .tool.on { box-shadow: 0 0 0 1px var(--accent), 0 6px 18px rgba(255,179,71,.25); }
  .lv { transition: transform .12s; } .lv:hover { transform: translateY(-2px); }
  .lv .st i { font-style: normal; opacity: .35; }
  #stage canvas:not(#cursor) { box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); }
  #hint { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 8; }
  #hint .hbox { background: rgba(13,18,36,.9); border: 1px solid var(--accent); border-radius: 18px; padding: 16px 22px; font-size: 18px; text-align: center; line-height: 1.6; max-width: min(520px, 90vw); animation: bob 1.6s ease-in-out infinite; }
  #hint.hidden { display: none; }
  #hint small { color: var(--mute); font-size: 14px; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
  #confetti span { position: absolute; top: -40px; animation: fall 2.6s cubic-bezier(.3,.6,.5,1) forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(540deg); } }
  .big { text-shadow: 0 0 18px rgba(255,179,71,.6); }
  @media (max-width: 560px) { header h1 { font-size: 15px; } .tag { display: none; } .tool { min-width: 52px; } }
</style>
</head>
<body>
<header>
  <a class="back" href="/lab/">← 實驗室</a>
  <h1>🏖️ 沙之實驗室</h1>
  <span class="tag" id="engine">…</span>
  <span class="grow"></span>
  <div class="seg" id="modeSeg"><button data-v="free" class="on">自由玩</button><button data-v="level">關卡</button></div>
  <button class="icon" id="pauseBtn" title="暫停（空白鍵）">⏸</button>
  <button class="icon" id="clearBtn" title="清空／重來">🗑️</button>
  <button class="icon" id="soundBtn" title="聲音">🔊</button>
</header>
<div id="stage">
  <div id="hud" class="hidden">
    <div class="goal" id="goal"></div>
    <div class="bars"><span id="progLbl">目標</span><div class="bar"><i id="prog"></i></div>
      <span id="inkWrap"><span>石牆</span></span><div class="bar ink" id="inkBar"><i id="ink"></i></div><span id="timer"></span></div>
  </div>
</div>
<div id="toolTip"></div>
<footer id="tools"></footer>
<div id="hint" class="hidden"><div class="hbox">👆 選一種材料，在畫面上<b>按住拖拉</b>倒下去！<br><small>沙會堆成小山、水會流、岩漿碰到水變石頭、種子澆水會長大開花……試試看各種組合！</small></div></div>
<div id="confetti"></div>

<div class="overlay hidden" id="levelPick"><div class="sheet">
  <h2>挑戰關卡</h2>
  <p>每一關都要用物理想辦法：水往低處流、沙會堆起來、水碰到岩漿變石頭、火會燒木頭和植物。石牆用越少，星星越多。</p>
  <div class="levels" id="levelList"></div>
  <div class="row"><button class="btn" data-close>回自由玩</button></div>
</div></div>
<div class="overlay hidden" id="result"><div class="sheet" style="width:min(420px,100%);text-align:center">
  <h2 id="resTitle">過關！</h2>
  <div class="big" id="resStars">★★★</div>
  <p id="resText"></p>
  <div class="row" style="justify-content:center"><button class="btn" id="resRetry">再玩一次</button><button class="btn" id="resList">選關卡</button><button class="btn main" id="resNext">下一關 →</button></div>
</div></div>
<div id="toast"></div>
<div id="loading">準備沙子中…</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
