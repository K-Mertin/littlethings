<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>夜雨賽車 · MW 實驗室</title>
<meta name="description" content="下雨的城市夜賽：濕路映著霓虹燈、車燈照亮雨幕、輪胎濺起水花，水窪會讓車子打滑。">
<meta name="theme-color" content="#0a0812">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
  :root { --panel: rgba(12, 10, 22, .74); --line: rgba(255, 120, 220, .22); --ink: #fff; --mute: #b7aed0; --pink: #ff4fd8; --cyan: #3fe0ff; --yellow: #ffd23f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0812; color: var(--ink); touch-action: none;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #3a1747, #0a0812 70%); z-index: 50; transition: opacity .6s; }
  #loading .box { width: min(420px, 84vw); text-align: center; }
  #loading h1 { font-size: clamp(34px, 8vw, 58px); margin: 0 0 4px; letter-spacing: .12em; text-shadow: 0 0 18px var(--pink); }
  #loading p { color: var(--mute); margin: 0 0 20px; }
  .bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--pink)); transition: width .2s; }
  #loadMsg { margin-top: 10px; font-size: 13px; color: var(--mute); }

  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: flex-start; padding: max(10px, env(safe-area-inset-top)) 12px 0; z-index: 5; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #top a.back { color: var(--ink); text-decoration: none; padding: 8px 12px; font-size: 14px; }
  .grow { flex: 1; pointer-events: none !important; }
  .ibtn { padding: 8px 11px; font-size: 15px; }
  #race { padding: 8px 14px; display: flex; gap: 16px; align-items: baseline; font-variant-numeric: tabular-nums; }
  #race .big { font-size: 28px; font-weight: 900; color: var(--yellow); }
  #race small { color: var(--mute); font-size: 12px; display: block; }
  #speed { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); text-align: right; z-index: 4; pointer-events: none; font-variant-numeric: tabular-nums; text-shadow: 0 0 14px rgba(0,0,0,.8); }
  #speed b { font-size: 54px; font-weight: 900; font-style: italic; }
  #speed span { font-size: 15px; color: var(--mute); margin-left: 4px; }
  #mini { position: fixed; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 4; pointer-events: none; border-radius: 12px; background: rgba(10,8,20,.55); }
  #count { position: fixed; inset: 0; display: grid; place-items: center; z-index: 6; pointer-events: none; font-size: clamp(80px, 22vw, 180px); font-weight: 900; color: var(--yellow); text-shadow: 0 0 30px var(--pink); }
  #msg { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); font-size: 26px; font-weight: 900; z-index: 6; pointer-events: none; text-shadow: 0 0 18px var(--cyan); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #msg.show { opacity: 1; }

  #touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #touch .zone { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 10px; pointer-events: auto; }
  #touch button { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--line); background: rgba(255,255,255,.1); font-size: 28px; touch-action: none; }
  #touch .on { background: rgba(255,79,216,.35); }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(6, 4, 14, .72); display: flex; align-items: center; justify-content: center; padding: 14px; }
  .sheet { width: min(560px, 100%); max-height: 90dvh; overflow: auto; padding: 20px; }
  .sheet h2 { margin: 0 0 6px; }
  .sub { color: var(--mute); margin: 0 0 12px; font-size: 14px; line-height: 1.5; }
  .opt { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
  .opt > span { width: 70px; color: var(--mute); font-size: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 7px 13px; font-size: 14px; color: var(--mute); }
  .seg button.on { background: var(--pink); color: #fff; font-weight: 800; }
  .colors { display: flex; gap: 8px; }
  .colors button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; }
  .colors button.on { border-color: #fff; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .btn { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.07); text-decoration: none; color: inherit; }
  .btn.main { background: var(--pink); border-color: var(--pink); font-weight: 800; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px; }
  td { padding: 5px 6px; border-bottom: 1px solid rgba(255,255,255,.08); }
  tr.me td { color: var(--yellow); font-weight: 800; }
  .keys { font-size: 13px; color: var(--mute); line-height: 1.6; margin-top: 10px; }
  body.touch #speed { top: max(64px, calc(env(safe-area-inset-top) + 58px)); bottom: auto; }
  body.touch #mini { bottom: auto; top: max(70px, calc(env(safe-area-inset-top) + 64px)); width: 110px; height: 110px; }
  @media (max-width: 640px) { #speed b { font-size: 40px; } #race .big { font-size: 22px; } .wide { display: none; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading"><div class="box"><h1>🌧️ 夜雨賽車</h1><p>MW NIGHT GP</p><div class="bar"><i id="loadBar"></i></div><div id="loadMsg">載入中…</div></div></div>

<div id="top">
  <a class="back panel" href="/lab/">← <span class="wide">實驗室</span></a>
  <div id="race" class="panel"><div><small>名次</small><span class="big" id="pos">–</span></div><div><small>圈數</small><span class="big" id="lap">–</span></div><div><small>時間</small><span class="big" id="time" style="color:#fff;font-size:20px">0:00.0</span></div></div>
  <span class="grow"></span>
  <button class="ibtn panel" id="camBtn" title="換視角（C）">🎥</button>
  <button class="ibtn panel" id="menuBtn" title="暫停／選單（Esc）">⏸</button>
  <button class="ibtn panel" id="soundBtn">🔊</button>
</div>
<canvas id="mini" width="170" height="170"></canvas>
<div id="speed"><b id="kmh">0</b><span>km/h</span></div>
<div id="count"></div>
<div id="msg"></div>
<div id="touch" class="hidden">
  <div class="zone" style="left:max(14px,env(safe-area-inset-left))"><button id="tL">◀</button><button id="tR">▶</button></div>
  <div class="zone" style="right:max(14px,env(safe-area-inset-right));bottom:max(96px,calc(env(safe-area-inset-bottom) + 96px))"><button id="tH" title="甩尾">↯</button></div>
  <div class="zone" style="right:max(14px,env(safe-area-inset-right))"><button id="tB">⏬</button><button id="tG">⏫</button></div>
</div>

<div class="overlay hidden" id="menu"><div class="sheet panel">
  <h2>🌧️ MW NIGHT GP</h2>
  <p class="sub">下雨的城市夜賽。濕路比較滑，<b>路上的水窪更滑</b>，過彎前要早點煞車。按住手煞車可以甩尾過彎。</p>
  <div class="opt"><span>賽道</span><div class="seg" id="oTrack"><button data-v="0">🏙️ 霓虹市區</button><button data-v="1">⚓ 港灣大道</button></div></div>
  <div class="opt"><span>模式</span><div class="seg" id="oMode"><button data-v="race">和電腦比賽</button><button data-v="tt">計時賽</button></div></div>
  <div class="opt"><span>圈數</span><div class="seg" id="oLaps"><button data-v="2">2</button><button data-v="3">3</button><button data-v="5">5</button></div></div>
  <div class="opt"><span>對手</span><div class="seg" id="oDiff"><button data-v="0">輕鬆</button><button data-v="1">普通</button><button data-v="2">厲害</button></div></div>
  <div class="opt"><span>天氣</span><div class="seg" id="oRain"><button data-v="1">大雨</button><button data-v="0.5">小雨</button><button data-v="0">雨停了</button></div></div>
  <div class="opt"><span>車色</span><div class="colors" id="oColor"></div></div>
  <div class="keys">⌨️ ↑／W 油門 · ↓／S 煞車、倒車 · ←→／AD 轉彎 · 空白鍵 手煞車（甩尾） · R 回到賽道 · C 換視角 · Esc 暫停<br>🏆 最快一圈：<b id="best">—</b></div>
  <div class="row"><a class="btn" href="/lab/street/">🏙️ 開回大街</a><button class="btn" id="resume">繼續</button><button class="btn main" id="go">開始！</button></div>
</div></div>
<div class="overlay hidden" id="result"><div class="sheet panel">
  <h2 id="rTitle"></h2><p class="sub" id="rText"></p>
  <table id="rTable"></table>
  <div class="row"><a class="btn" href="/lab/street/">🏙️ 開回大街逛逛</a><button class="btn" id="rMenu">選單</button><button class="btn main" id="rAgain">再跑一次</button></div>
</div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
