<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>造物主之島 · MW 實驗室</title>
<meta name="description" content="當造物主：堆山、挖河、下雨、放泉水，顯示卡即時算水往低處流、河流沖刷出山谷、泥沙在河口堆成三角洲。">
<meta name="theme-color" content="#0b1a24">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
  :root { --panel: rgba(10, 26, 34, .74); --line: rgba(160, 230, 220, .22); --ink: #eefaf6; --mute: #9fc2bb; --accent: #ffd76a; --teal: #4fe0c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1a24; color: var(--ink); touch-action: none;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #1d5a5a, #0b1a24 70%); z-index: 50; transition: opacity .6s; }
  #loading .box { width: min(420px, 84vw); text-align: center; }
  #loading h1 { font-size: clamp(34px, 8vw, 56px); margin: 0 0 4px; letter-spacing: .12em; }
  #loading p { color: var(--mute); margin: 0 0 20px; }
  .bar { position: relative; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 3%; background: linear-gradient(90deg, var(--teal), var(--accent)); transition: width .2s; }
  /* 一道光一直來回跑（transform 動畫，程式忙著編譯時也會動，不會看起來卡住） */
  .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: barShine 1.1s linear infinite; }
  @keyframes barShine { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #loadMsg { margin-top: 10px; font-size: 13px; color: var(--mute); }

  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 0; z-index: 5; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #top a.back { color: var(--ink); text-decoration: none; padding: 8px 12px; font-size: 14px; }
  #top h1 { margin: 0 6px; font-size: 17px; text-shadow: 0 2px 10px #000; pointer-events: none; }
  .tag { font-size: 11px; color: var(--mute); padding: 4px 9px; border-radius: 999px; pointer-events: none !important; }
  .grow { flex: 1; pointer-events: none !important; }
  .ibtn { padding: 8px 12px; font-size: 15px; }
  #dock { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; z-index: 5; max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; }
  #dock::-webkit-scrollbar { display: none; }
  .db { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 60px; padding: 6px 8px; border-radius: 11px; border: 2px solid transparent; background: rgba(255,255,255,.05); font-size: 12px; color: var(--mute); }
  .db b { font-size: 20px; line-height: 1.1; }
  .db.on { border-color: var(--accent); color: var(--ink); background: rgba(255, 215, 106, .14); }
  .sep { width: 1px; align-self: stretch; background: var(--line); flex: 0 0 auto; margin: 0 2px; }
  #goals { position: fixed; left: 12px; top: max(60px, calc(env(safe-area-inset-top) + 52px)); padding: 8px 12px; z-index: 4; font-size: 13px; max-width: min(300px, 64vw); }
  #goals h3 { margin: 0 0 4px; font-size: 14px; color: var(--accent); display: flex; justify-content: space-between; gap: 8px; }
  #goals h3 button { background: none; border: 0; color: var(--mute); font-size: 13px; padding: 0; }
  #goals small { color: var(--mute); font-weight: normal; margin-left: 4px; }
  .vlabel { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: rgba(10,26,34,.7); border: 1px solid var(--line); transform: translate(-50%, -100%); }
  .vlabel.wet { border-color: #6cc3ff; color: #bfe6ff; }
  .vlabel.dry { color: var(--mute); }
  #goals ul { margin: 0; padding: 0; list-style: none; }
  #goals li { margin: 3px 0; line-height: 1.4; color: var(--mute); }
  #goals li.done { color: var(--ink); }
  #goals li .bar2 { height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); margin-top: 2px; overflow: hidden; }
  #goals li .bar2 i { display: block; height: 100%; background: var(--teal); }
  #toast { position: fixed; left: 50%; bottom: calc(var(--dockH, 80px) + 54px); transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .3s; z-index: 8; pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
  #toast.show { opacity: 1; }
  #help { position: fixed; left: 50%; bottom: calc(var(--dockH, 80px) + 56px); transform: translateX(-50%); padding: 8px 14px; font-size: 13px; color: var(--mute); z-index: 4; text-align: center; pointer-events: none; transition: opacity 1s; width: min(560px, 92vw); line-height: 1.5; }
  /* 右邊：小地圖＋鏡頭按鈕 */
  #side { position: fixed; right: 10px; top: max(60px, calc(env(safe-area-inset-top) + 52px)); z-index: 4; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #mini { width: 132px; height: 132px; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(0,0,0,.35); cursor: crosshair; touch-action: none; display: block; }
  #camPad { display: grid; grid-template-columns: repeat(2, 42px); gap: 5px; padding: 5px; }
  #camPad button { height: 40px; border-radius: 10px; border: 0; background: rgba(255,255,255,.07); font-size: 18px; touch-action: none; }
  #camPad button:active { background: rgba(255, 215, 106, .3); }
  #sizeBar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--dockH, 80px) + 10px); z-index: 5; display: flex; gap: 4px; align-items: center; padding: 4px 6px; font-size: 12px; color: var(--mute); }
  #sizeBar span { padding: 0 4px; }
  #sizeBar button { border: 1px solid transparent; background: rgba(255,255,255,.06); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
  #sizeBar button.on { border-color: var(--accent); color: var(--ink); background: rgba(255, 215, 106, .14); }
  /* 面板上也不要讓瀏覽器縮放網頁；工具列可以左右滑 */
  #top, #goals, #side, #sizeBar, #toast, #help { touch-action: none; }
  #dock { touch-action: pan-x; }
  #goals ul { touch-action: pan-y; }
  @media (max-width: 640px) { #top h1, .tag { display: none; } .db { min-width: 52px; } #goals { font-size: 12px; } #mini { width: 96px; height: 96px; } #camPad { grid-template-columns: repeat(2, 38px); } #camPad button { height: 36px; font-size: 16px; } #dock { flex-wrap: wrap; justify-content: center; width: calc(100vw - 16px); } .sep { display: none; } #toast { white-space: normal; text-align: center; border-radius: 14px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading"><div class="box">
  <h1>🏝️ 造物主之島</h1>
  <p>堆山、挖河、下雨，看水怎麼改變大地</p>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg">下載遊戲程式…</div>
</div></div>
<div id="top">
  <a class="back panel" href="/lab/">← 實驗室</a>
  <h1>🏝️ 造物主之島</h1>
  <span class="tag panel" id="engine"></span>
  <span class="grow"></span>
  <button class="ibtn panel" id="speedBtn" title="時間快轉">⏩ ×1</button>
  <button class="ibtn panel" id="soundBtn" title="聲音">🔊</button>
</div>
<div id="goals" class="panel"><h3><span>🎯 造物主任務 <small id="goalCount"></small></span><button id="goalsToggle">收起</button></h3><ul id="goalList"></ul></div>
<div id="help" class="panel">選一個工具，在島上按住拖曳：⛰️ 堆山、⛏️ 挖地、🌧️ 下雨、💧 放泉水。✋ 移動：拖曳地圖。<br>兩根手指：捏合縮放、轉一轉轉向、一起上下推改變角度。電腦：滾輪縮放、右鍵拖曳轉向、WASD 移動、Q／E 轉。右上角小地圖點一下就飛過去。</div>
<div id="side">
  <canvas id="mini" width="192" height="192" title="小地圖：點一下飛過去"></canvas>
  <div id="camPad" class="panel">
    <button data-a="zin" title="拉近（滾輪、兩指張開、＋）">➕</button><button data-a="zout" title="拉遠（滾輪、兩指捏合、－）">➖</button>
    <button data-a="rotL" title="向左轉（Q）">⟲</button><button data-a="rotR" title="向右轉（E）">⟳</button>
    <button data-a="top" title="切換：從正上方看／斜斜看">🔭</button><button data-a="home" title="回到看整座島（Home）">🏝️</button>
  </div>
</div>
<div id="sizeBar" class="panel hidden"></div>
<div id="dock" class="panel"></div>
<div id="toast" class="panel"></div>
<div id="vlabels"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
