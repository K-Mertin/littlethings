<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>星塵彈幕 · MW 實驗室</title>
<meta name="description" content="縱向捲軸彈幕射擊：畫面上同時好幾萬顆會發光的子彈，全部由顯示卡算位置、畫出來。三關、三隻魔王、擦彈加分、炸彈清畫面。">
<meta name="theme-color" content="#06030f">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
  :root { --panel: rgba(16, 10, 34, .72); --line: rgba(200, 170, 255, .22); --ink: #f3efff; --mute: #ada4d0; --accent: #ffd447; --pink: #ff5ab0; --cyan: #5ae0ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06030f; color: var(--ink); touch-action: none;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #3a1458, #06030f 70%); z-index: 50; transition: opacity .6s; }
  #loading .box { width: min(420px, 84vw); text-align: center; }
  #loading h1 { font-size: clamp(34px, 8vw, 56px); margin: 0 0 4px; letter-spacing: .12em; text-shadow: 0 0 22px var(--pink); }
  #loading p { color: var(--mute); margin: 0 0 20px; }
  .bar { position: relative; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 3%; background: linear-gradient(90deg, var(--pink), var(--accent)); transition: width .2s; }
  /* 一道光一直來回跑（transform 動畫，程式忙著編譯時也會動，不會看起來卡住） */
  .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: barShine 1.1s linear infinite; }
  @keyframes barShine { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #loadMsg { margin-top: 10px; font-size: 13px; color: var(--mute); }

  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 0; z-index: 5; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #top a.back { color: var(--ink); text-decoration: none; padding: 8px 12px; font-size: 14px; }
  .stat { padding: 6px 12px; font-size: 14px; font-variant-numeric: tabular-nums; pointer-events: none !important; }
  .stat b { color: var(--accent); }
  .grow { flex: 1; pointer-events: none !important; }
  .ibtn { padding: 8px 12px; font-size: 15px; }
  #boss { position: fixed; left: 50%; top: max(58px, calc(env(safe-area-inset-top) + 50px)); transform: translateX(-50%); width: min(520px, 80vw); padding: 6px 10px; z-index: 5; }
  #boss .nm { font-size: 13px; color: var(--pink); margin-bottom: 4px; display: flex; justify-content: space-between; }
  #boss .hp { height: 8px; border-radius: 8px; background: rgba(255,255,255,.1); overflow: hidden; }
  #boss .hp i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--pink), var(--accent)); transition: width .15s; }
  #banner { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; z-index: 6; pointer-events: none; transition: opacity .6s; text-shadow: 0 0 18px rgba(255, 90, 176, .8); }
  #banner h2 { margin: 0; font-size: clamp(26px, 6vw, 44px); letter-spacing: .1em; }
  #banner p { margin: 6px 0 0; color: var(--mute); font-size: 15px; max-width: 80vw; }
  #bombBtn { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 74px; height: 74px; border-radius: 50%; font-size: 30px; z-index: 6; border: 2px solid var(--pink); background: rgba(255, 90, 176, .18); }
  #touchHint { position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translateX(-50%); font-size: 13px; color: var(--mute); z-index: 4; pointer-events: none; padding: 6px 12px; text-align: center; transition: opacity 1s; }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(5, 2, 14, .72); display: flex; align-items: center; justify-content: center; padding: 14px; }
  .sheet { width: min(640px, 100%); max-height: 90dvh; overflow: auto; padding: 18px; }
  .sheet h2 { margin: 0 0 4px; }
  .sheet .sub { color: var(--mute); margin: 0 0 12px; font-size: 14px; line-height: 1.6; }
  .seg { display: inline-flex; overflow: hidden; border-radius: 999px; padding: 0; border: 1px solid var(--line); }
  .seg button { background: none; border: 0; padding: 8px 16px; font-size: 14px; color: var(--mute); }
  .seg button.on { background: var(--accent); color: #2a1a00; font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 12px; }
  .card { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.04); }
  .card .h { font-weight: 800; }
  .card p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--mute); }
  .card:disabled { opacity: .45; }
  button.card:not(:disabled):hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  .btn.main { background: var(--accent); color: #2a1a00; border-color: var(--accent); font-weight: 800; }
  .keys { font-size: 13px; color: var(--mute); line-height: 1.7; margin-top: 12px; }
  .big { font-size: 40px; text-align: center; color: var(--accent); margin: 6px 0; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .wide { display: none; } .stat { padding: 5px 8px; font-size: 13px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading"><div class="box">
  <h1>✨ 星塵彈幕</h1>
  <p>幾萬顆子彈的縱向射擊</p>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg">下載遊戲程式…</div>
</div></div>

<div id="top">
  <a class="back panel" href="/lab/">← <span class="wide">實驗室</span></a>
  <div class="stat panel">分數 <b id="score">0</b></div>
  <div class="stat panel wide">擦彈 <b id="grazeN">0</b></div>
  <span class="grow"></span>
  <div class="stat panel"><span id="lives">❤️❤️❤️</span> <span id="bombs">💣💣💣</span></div>
  <div class="stat panel wide">火力 <b id="power">1</b></div>
  <div class="stat panel wide" id="bcount"></div>
  <button class="ibtn panel" id="pauseBtn" title="暫停（Esc）">⏸</button>
  <button class="ibtn panel" id="soundBtn" title="聲音">🔊</button>
</div>
<div id="boss" class="panel hidden"><div class="nm"><span id="bossName"></span><span id="bossPh"></span></div><div class="hp"><i id="bossHp"></i></div></div>
<div id="banner" style="opacity:0"><h2 id="bnT"></h2><p id="bnP"></p></div>
<button id="bombBtn" class="hidden" title="炸彈">💣</button>
<div id="touchHint" class="panel hidden">手指在畫面任何地方拖曳＝移動 · 兩根手指＝慢速 · 💣＝炸彈</div>

<div class="overlay" id="menu"><div class="sheet panel">
  <h2>✨ 星塵彈幕</h2>
  <p class="sub">縱向捲軸彈幕射擊。戰機會自動開火，你只要閃子彈！只有機身中間的<b>白點</b>被打到才算中彈，子彈擦過旁邊（擦彈）還會加分。打倒敵人會掉出 ⭐ 分數、🔴 火力、🟢 炸彈。</p>
  <div><div class="seg" id="diffSeg"><button data-v="0">簡單</button><button data-v="1">普通</button><button data-v="2">困難</button></div></div>
  <div class="grid" id="stageList"></div>
  <div class="keys" id="keysTxt">⌨️ 方向鍵／WASD 移動 · Shift 慢速（比較好鑽縫）· X 或 空白鍵 炸彈 · Esc 暫停<br>📱 手指在畫面任何地方拖曳＝移動（戰機跟著手指走）· 兩根手指＝慢速 · 💣 按鈕＝炸彈</div>
  <div class="keys" id="bestTxt"></div>
</div></div>

<div class="overlay hidden" id="pause"><div class="sheet panel" style="width:min(380px,100%)">
  <h2>⏸ 暫停</h2>
  <div class="row"><button class="btn" id="quitBtn">回選單</button><button class="btn main" id="resumeBtn">繼續</button></div>
</div></div>

<div class="overlay hidden" id="result"><div class="sheet panel" style="width:min(440px,100%)">
  <h2 id="rTitle"></h2>
  <div class="big" id="rScore"></div>
  <p class="sub" id="rText"></p>
  <div class="row"><button class="btn" id="rMenu">回選單</button><button class="btn main" id="rGo"></button></div>
</div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
