<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>銀河建造師 · MW 實驗室</title>
<meta name="description" content="丟進星系和黑洞，看重力讓幾十萬顆星星轉成旋臂、撞出潮汐尾巴；用彈弓發射行星、月亮、彗星，邊玩邊學萬有引力。">
<meta name="theme-color" content="#05040d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
  :root { --panel: rgba(14, 12, 30, .74); --line: rgba(190, 170, 255, .2); --ink: #f1eeff; --mute: #a9a2cc; --accent: #ffcf5c; --violet: #a68bff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05040d; color: var(--ink); touch-action: none;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #2a1d55, #05040d 70%); z-index: 50; transition: opacity .6s; }
  #loading .box { width: min(420px, 84vw); text-align: center; }
  #loading h1 { font-size: clamp(34px, 8vw, 56px); margin: 0 0 4px; letter-spacing: .12em; }
  #loading p { color: var(--mute); margin: 0 0 20px; }
  .bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--violet), var(--accent)); transition: width .2s; }
  #loadMsg { margin-top: 10px; font-size: 13px; color: var(--mute); }

  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 0; z-index: 5; pointer-events: none; flex-wrap: wrap; }
  #top > * { pointer-events: auto; }
  #top a.back { color: var(--ink); text-decoration: none; padding: 8px 12px; font-size: 14px; }
  #top h1 { margin: 0 6px; font-size: 17px; text-shadow: 0 2px 10px #000; pointer-events: none; }
  .grow { flex: 1; pointer-events: none !important; }
  .seg { display: inline-flex; overflow: hidden; border-radius: 999px; padding: 0; }
  .seg button { background: none; border: 0; padding: 8px 14px; font-size: 14px; color: var(--mute); }
  .seg button.on { background: var(--accent); color: #2a1a00; font-weight: 800; }
  .ibtn { padding: 8px 12px; font-size: 15px; }
  .tag { font-size: 11px; color: var(--mute); padding: 4px 9px; border-radius: 999px; }

  #dock { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; z-index: 5;
    max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; align-items: center; }
  #dock::-webkit-scrollbar { display: none; }
  .db { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 60px; padding: 6px 8px; border-radius: 11px; border: 2px solid transparent; background: rgba(255,255,255,.05); font-size: 12px; color: var(--mute); }
  .db b { font-size: 20px; line-height: 1.1; }
  .db.on { border-color: var(--accent); color: var(--ink); background: rgba(255, 207, 92, .14); }
  .sep { width: 1px; align-self: stretch; background: var(--line); flex: 0 0 auto; margin: 0 2px; }

  #tip { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); padding: 10px 14px; font-size: 14px; line-height: 1.5; z-index: 4; pointer-events: none; transition: opacity .5s; }
  #mhud { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); width: min(620px, calc(100vw - 20px)); padding: 10px 14px; z-index: 4; }
  #mhud h3 { margin: 0 0 3px; font-size: 16px; color: var(--accent); }
  #mhud p { margin: 0; font-size: 14px; line-height: 1.5; }
  #mhud .row2 { display: flex; gap: 10px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--mute); flex-wrap: wrap; }
  #mhud .row2 button { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.06); font-size: 13px; }
  #speedLbl { position: fixed; z-index: 6; pointer-events: none; font-size: 13px; padding: 3px 8px; border-radius: 8px; background: rgba(0,0,0,.6); }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(3, 2, 10, .7); display: flex; align-items: center; justify-content: center; padding: 14px; }
  .sheet { width: min(720px, 100%); max-height: 88dvh; overflow: auto; padding: 18px; }
  .sheet h2 { margin: 0 0 4px; }
  .sheet .sub { color: var(--mute); margin: 0 0 12px; font-size: 14px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .card { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.04); }
  .card .h { display: flex; gap: 8px; align-items: center; font-weight: 700; }
  .card .h span { font-size: 26px; }
  .card p { margin: 6px 0 0; font-size: 13px; line-height: 1.55; color: var(--mute); }
  .card .st { color: var(--accent); letter-spacing: 2px; font-size: 13px; margin-top: 4px; }
  button.card:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  .btn.main { background: var(--accent); color: #2a1a00; border-color: var(--accent); font-weight: 800; }
  .big { font-size: 40px; text-align: center; letter-spacing: 6px; color: var(--accent); }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .3s; z-index: 8; pointer-events: none; }
  #toast.show { opacity: 1; }
  @media (max-width: 640px) { #top h1 { display: none; } .tag { display: none; } .db { min-width: 52px; } #tip, #mhud { top: 58px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading"><div class="box">
  <h1>🌌 銀河建造師</h1>
  <p>用重力蓋一座星系</p>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg">載入中…</div>
</div></div>

<div id="top">
  <a class="back panel" href="/lab/">← 實驗室</a>
  <h1>🌌 銀河建造師</h1>
  <span class="tag panel" id="engine"></span>
  <span class="grow"></span>
  <div class="seg panel" id="modeSeg"><button data-v="galaxy" class="on">星系沙盒</button><button data-v="orbit">軌道任務</button></div>
  <button class="ibtn panel" id="infoBtn" title="天文小百科">📚</button>
</div>

<div id="tip" class="panel"></div>
<div id="mhud" class="panel hidden">
  <h3 id="mTitle"></h3><p id="mGoal"></p>
  <div class="row2"><span id="mTries"></span><span id="mTime"></span><span class="grow"></span>
    <button id="mHint">💡 提示</button><button id="mReset">↺ 重來</button><button id="mList">☰ 任務</button></div>
</div>
<div id="speedLbl" class="hidden"></div>

<div id="dock" class="panel"></div>

<div class="overlay hidden" id="missionPick"><div class="sheet panel">
  <h2>🚀 軌道任務</h2>
  <p class="sub">在要發射的東西上按住、往後拉（像彈弓），放開就飛出去。拉的時候會畫出預測的軌道。</p>
  <div class="grid" id="missionList"></div>
  <div class="row"><button class="btn" data-close>回星系沙盒</button></div>
</div></div>
<div class="overlay hidden" id="result"><div class="sheet panel" style="width:min(460px,100%);text-align:center">
  <h2 id="rTitle"></h2><div class="big" id="rStars"></div><p class="sub" id="rText"></p>
  <div class="card" id="rInfo" style="text-align:left"></div>
  <div class="row" style="justify-content:center"><button class="btn" id="rRetry">再試一次</button><button class="btn" id="rList">選任務</button><button class="btn main" id="rNext">下一個 →</button></div>
</div></div>
<div class="overlay hidden" id="info"><div class="sheet panel">
  <h2>📚 天文小百科</h2>
  <p class="sub">玩的時候遇到的天文知識。</p>
  <div class="grid" id="infoList"></div>
  <div class="row"><button class="btn main" data-close>關閉</button></div>
</div></div>
<div id="toast" class="panel"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
