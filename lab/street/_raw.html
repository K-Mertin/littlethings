<!doctype html><canvas id="c" width="200" height="100"></canvas><pre id="o"></pre><script type="module">
const log=t=>{document.getElementById('o').textContent+=t+'\n';console.log(t)};
try{log('gpu '+!!navigator.gpu);const a=await navigator.gpu.requestAdapter();log('adapter '+!!a);const d=await a.requestDevice();log('device');
d.lost.then(i=>log('LOST '+i.reason+' '+i.message));
const ctx=document.getElementById('c').getContext('webgpu');log('ctx '+!!ctx);const f=navigator.gpu.getPreferredCanvasFormat();ctx.configure({device:d,format:f,alphaMode:'opaque'});log('configured '+f);
const enc=d.createCommandEncoder();const p=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),clearValue:{r:1,g:0,b:0,a:1},loadOp:'clear',storeOp:'store'}]});p.end();d.queue.submit([enc.finish()]);log('submitted');
await d.queue.onSubmittedWorkDone();log('done');window.__done=1;}catch(e){log('ERR '+e.message)}
</script>
