<script type="module">
import { loadAvatar } from './js/avatar.js';
const out=[];for(const id of ['boy','girl']){const g=await loadAvatar(id);g.scene.traverse(o=>{if(o.isMesh)out.push([id,o.name,o.isSkinnedMesh,o.geometry.attributes.position.count,o.geometry.index?o.geometry.index.count:0,o.material.userData.kind,o.material.name,Object.keys(o.geometry.attributes).join(',')].join(' | '))});
out.push(id+' anims '+g.animations.map(a=>a.name+':'+a.duration.toFixed(2)).join(' ')+' ud '+JSON.stringify(g.scene.userData));}
console.log(out.join('\n'));window.__d=1;
</script>
