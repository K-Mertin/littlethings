<!doctype html><pre id="o"></pre><script type="module">
const log=t=>console.log(t);
try{const a=await navigator.gpu.requestAdapter();const d=await a.requestDevice();d.lost.then(i=>log('LOST '+i.reason));
const b=d.createBuffer({size:16,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
const s=d.createBuffer({size:16,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});
const m=d.createShaderModule({code:'@group(0)@binding(0) var<storage,read_write> o:array<u32>; @compute @workgroup_size(1) fn main(){o[0]=42u;}'});
const pl=d.createComputePipeline({layout:'auto',compute:{module:m,entryPoint:'main'}});
const bg=d.createBindGroup({layout:pl.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:s}}]});
const e=d.createCommandEncoder();const c=e.beginComputePass();c.setPipeline(pl);c.setBindGroup(0,bg);c.dispatchWorkgroups(1);c.end();e.copyBufferToBuffer(s,0,b,0,16);d.queue.submit([e.finish()]);
await b.mapAsync(GPUMapMode.READ);log('result '+new Uint32Array(b.getMappedRange())[0]);}catch(e){log('ERR '+e.message)}
</script>
