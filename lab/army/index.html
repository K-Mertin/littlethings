<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>萬軍對決 3D · MW 實驗室</title>
<meta name="description" content="上千名士兵在 3D 戰場上對決：劍盾兵、弓箭手、騎兵，山丘、河流、樹林會影響戰局。畫線指揮各隊走位。">
<meta name="theme-color" content="#1c2a1a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
  :root { --panel: rgba(22, 26, 20, .78); --line: rgba(255, 240, 200, .18); --ink: #fbf6e8; --mute: #c5bea6; --accent: #f2c14e; --blue: #4d8cff; --red: #ff5a52; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2a1a; color: var(--ink); touch-action: none;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #3b4a2a, #12180f 70%); z-index: 50; transition: opacity .6s; }
  #loading .box { width: min(420px, 84vw); text-align: center; }
  #loading h1 { font-size: clamp(34px, 8vw, 56px); margin: 0 0 4px; letter-spacing: .1em; }
  #loading p { color: var(--mute); margin: 0 0 20px; }
  .bar { height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--accent), var(--red)); transition: width .2s; }
  #loadMsg { margin-top: 10px; font-size: 13px; color: var(--mute); }

  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 0; z-index: 5; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #top a.back { color: var(--ink); text-decoration: none; padding: 8px 12px; font-size: 14px; }
  .grow { flex: 1; pointer-events: none !important; }
  #score { display: flex; align-items: center; gap: 8px; padding: 7px 12px; font-weight: 800; min-width: 0; flex: 0 1 420px; }
  #score .b { color: var(--blue); } #score .r { color: var(--red); }
  #score .track { flex: 1; height: 10px; border-radius: 10px; overflow: hidden; display: flex; background: #333; min-width: 60px; }
  #score .track i { display: block; height: 100%; }
  .ibtn { padding: 8px 11px; font-size: 15px; }
  .ibtn.on { background: rgba(242, 193, 78, .3); border-color: var(--accent); }

  #brief { position: fixed; left: 50%; top: 62px; transform: translateX(-50%); width: min(600px, calc(100vw - 20px)); padding: 10px 14px; z-index: 4; font-size: 14px; line-height: 1.55; }
  #brief h3 { margin: 0 0 4px; color: var(--accent); font-size: 16px; }
  #dock { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; z-index: 5; max-width: calc(100vw - 16px); overflow-x: auto; scrollbar-width: none; }
  #dock::-webkit-scrollbar { display: none; }
  .db { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 62px; padding: 6px 8px; border-radius: 11px; border: 2px solid transparent; background: rgba(255,255,255,.06); font-size: 12px; color: var(--mute); }
  .db b { font-size: 20px; line-height: 1.1; }
  .db.on { border-color: var(--accent); color: var(--ink); }
  .db.go { background: var(--accent); color: #2a1d00; font-weight: 800; min-width: 96px; }
  .sep { width: 1px; align-self: stretch; background: var(--line); flex: 0 0 auto; }
  #selInfo { position: fixed; left: 12px; bottom: 90px; padding: 8px 12px; font-size: 13px; z-index: 4; max-width: 60vw; }

  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(8, 10, 6, .72); display: flex; align-items: center; justify-content: center; padding: 14px; }
  .sheet { width: min(760px, 100%); max-height: 90dvh; overflow: auto; padding: 18px; }
  .sheet h2 { margin: 0 0 4px; }
  .sub { color: var(--mute); margin: 0 0 12px; font-size: 14px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .card { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: rgba(255,255,255,.05); }
  button.card:hover { border-color: var(--accent); }
  .card .h { display: flex; gap: 8px; align-items: center; font-weight: 700; }
  .card .h span { font-size: 26px; }
  .card p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--mute); }
  .card .st { color: var(--accent); letter-spacing: 2px; font-size: 13px; margin-top: 4px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.07); }
  .btn.main { background: var(--accent); color: #2a1d00; border-color: var(--accent); font-weight: 800; }
  .big { font-size: 40px; text-align: center; letter-spacing: 6px; color: var(--accent); }
  .free { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px 14px; align-items: center; margin-top: 10px; font-size: 14px; }
  .free .hd { font-weight: 800; } .free .b { color: var(--blue); } .free .r { color: var(--red); }
  .stp { display: inline-flex; align-items: center; gap: 6px; }
  .stp button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.08); }
  .stp b { min-width: 18px; text-align: center; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; background: #2a2f25; color: var(--ink); border: 1px solid var(--line); }
  #toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .3s; z-index: 8; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #mini { position: fixed; right: 12px; bottom: 90px; width: 180px; height: 120px; padding: 0; z-index: 4; border-radius: 12px; cursor: pointer; touch-action: none; }
  @media (max-width: 640px) { #mini { width: 126px; height: 84px; bottom: 84px; } }
  @media (max-width: 640px) { .db { min-width: 54px; } #brief { top: 58px; font-size: 13px; } .wide { display: none; } #selInfo { bottom: 84px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading"><div class="box">
  <h1>⚔️ 萬軍對決</h1>
  <p>指揮上千名士兵</p>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg">載入中…</div>
</div></div>

<div id="top">
  <a class="back panel" href="/lab/">← <span class="wide">實驗室</span></a>
  <div id="score" class="panel"><span class="b" id="sb">0</span><div class="track"><i id="tb" style="background:var(--blue)"></i><i id="tr" style="background:var(--red)"></i></div><span class="r" id="sr">0</span></div>
  <span class="grow"></span>
  <button class="ibtn panel" id="speedBtn" title="速度">1×</button>
  <button class="ibtn panel" id="pauseBtn" title="暫停（空白鍵）">⏸</button>
  <button class="ibtn panel" id="menuBtn" title="選戰役">☰</button>
  <button class="ibtn panel" id="soundBtn" title="聲音">🔊</button>
</div>
<div id="brief" class="panel"><h3 id="bTitle"></h3><div id="bText"></div></div>
<div id="selInfo" class="panel hidden"></div>
<div id="dock" class="panel"></div>
<canvas id="mini" class="panel" title="小地圖：點一下鏡頭就移過去"></canvas>

<div class="overlay hidden" id="menu"><div class="sheet panel">
  <h2>⚔️ 選一場戰役</h2>
  <p class="sub">藍軍是你。點一隊（或按「全選」）→ 點地面走過去；拖一條線，隊伍會沿著線排成一排。滑鼠右鍵拖曳轉視角、滾輪拉遠拉近；手機用兩指。</p>
  <div class="grid" id="battleList"></div>
  <h2 style="margin-top:18px">🎲 自由對戰</h2>
  <div class="free" id="free"></div>
  <div class="row"><label>地形 <select id="freeTer"></select></label><span class="grow"></span><button class="btn main" id="freeGo">開始自由對戰</button></div>
</div></div>
<div class="overlay hidden" id="result"><div class="sheet panel" style="width:min(440px,100%);text-align:center">
  <h2 id="rTitle"></h2><div class="big" id="rStars"></div><p class="sub" id="rText"></p>
  <div class="row" style="justify-content:center"><button class="btn" id="rRetry">再打一次</button><button class="btn" id="rMenu">選戰役</button><button class="btn main" id="rNext">下一場 →</button></div>
</div></div>
<div id="toast" class="panel"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
