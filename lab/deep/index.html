<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>深海探險隊 · MW 實驗室</title>
<meta name="description" content="駕駛小潛水艇探索海底：上萬條魚的魚群、水底光紋、會發光的深海生物，蒐集海洋圖鑑、幫珊瑚礁清垃圾。">
<meta name="theme-color" content="#04131c">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<style>
  :root { --panel: rgba(4, 24, 36, .72); --line: rgba(160, 230, 255, .2); --ink: #eafaff; --mute: #9cc6d6; --accent: #ffd447; --cyan: #5fe1ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04131c; color: var(--ink); touch-action: none;
    font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 30%, #0b4660, #031019 70%); z-index: 50; transition: opacity .6s; }
  #loading .box { width: min(420px, 84vw); text-align: center; }
  #loading h1 { font-size: clamp(34px, 8vw, 56px); margin: 0 0 4px; letter-spacing: .12em; }
  #loading p { color: var(--mute); margin: 0 0 20px; }
  .bar { position: relative; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 3%; background: linear-gradient(90deg, var(--cyan), var(--accent)); transition: width .2s; }
  /* 一道光一直來回跑（transform 動畫，程式忙著編譯時也會動，不會看起來卡住） */
  .bar::after { content: \"\"; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: barShine 1.1s linear infinite; }
  @keyframes barShine { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  #loadMsg { margin-top: 10px; font-size: 13px; color: var(--mute); min-height: 1.2em; }
  #startBtn { margin-top: 18px; padding: 12px 30px; border-radius: 999px; border: 0; background: var(--accent); color: #2b1d00; font-weight: 800; font-size: 18px; }

  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: flex-start; padding: max(10px, env(safe-area-inset-top)) 12px 0; pointer-events: none; z-index: 5; }
  #top > * { pointer-events: auto; }
  #top a.back { color: var(--ink); text-decoration: none; padding: 8px 12px; font-size: 14px; }
  .grow { flex: 1; pointer-events: none !important; }
  .stat { padding: 8px 12px; font-size: 14px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .stat b { color: var(--accent); }
  .ibtn { padding: 8px 12px; font-size: 15px; border: 1px solid var(--line); }
  .ibtn.on { background: rgba(255, 212, 71, .3); border-color: var(--accent); }
  #gpuTag { font-size: 11px; color: var(--mute); padding: 4px 8px; }

  #depthBar { position: fixed; right: 14px; top: 50%; transform: translateY(-50%); width: 10px; height: 46vh; border-radius: 10px;
    background: linear-gradient(#5fe1ff, #0a5a7a 40%, #031620); border: 1px solid var(--line); z-index: 4; pointer-events: none; }
  #depthBar i { position: absolute; left: -7px; width: 22px; height: 4px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  #depthBar span { position: absolute; right: 18px; transform: translateY(-50%); font-size: 13px; white-space: nowrap; text-shadow: 0 1px 4px #000; }

  #toast { position: fixed; left: 50%; top: 70px; transform: translateX(-50%) translateY(-10px); opacity: 0; transition: .35s; z-index: 8; pointer-events: none;
    padding: 12px 16px; width: min(440px, 92vw); display: flex; gap: 12px; align-items: center; }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast .em { font-size: 40px; }
  #toast h3 { margin: 0 0 2px; font-size: 17px; color: var(--accent); }
  #toast p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--ink); }
  #msg { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .3s; z-index: 8; pointer-events: none; white-space: nowrap; }
  #msg.show { opacity: 1; }

  #codex { position: fixed; inset: 0; z-index: 20; background: rgba(2, 10, 16, .7); display: flex; align-items: center; justify-content: center; padding: 14px; }
  #codex .sheet { width: min(760px, 100%); max-height: 88dvh; overflow: auto; padding: 18px; }
  #codex h2 { margin: 0 0 4px; }
  #codex .sub { color: var(--mute); margin: 0 0 12px; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: rgba(255,255,255,.04); }
  .card .h { display: flex; gap: 8px; align-items: center; font-weight: 700; }
  .card .h span { font-size: 26px; }
  .card p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--mute); }
  .card.lock { opacity: .55; }
  .card .lv { color: var(--accent); letter-spacing: 2px; }
  .card button { margin-top: 8px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255,212,71,.18); color: inherit; font: inherit; }
  .card button:disabled { opacity: .45; }
  .card.lock .h span { filter: grayscale(1) brightness(.4); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .btn { padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  .btn.main { background: var(--accent); color: #2b1d00; border-color: var(--accent); font-weight: 800; }

  /* 觸控 */
  #touch { position: fixed; inset: 0; z-index: 3; pointer-events: none; }
  #stick { position: absolute; left: max(22px, env(safe-area-inset-left)); bottom: max(26px, env(safe-area-inset-bottom)); width: 130px; height: 130px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px solid var(--line); pointer-events: auto; touch-action: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px; border-radius: 50%; background: rgba(255,255,255,.3); }
  #vbtns { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(26px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
  #vbtns button { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.1); border: 2px solid var(--line); font-size: 24px; touch-action: none; }
  #help { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); padding: 8px 14px; font-size: 13px; color: var(--mute); z-index: 4; text-align: center; transition: opacity 1s; pointer-events: none; }

  #mission { position: fixed; left: 12px; top: max(58px, calc(env(safe-area-inset-top) + 52px)); padding: 7px 12px; font-size: 13px; z-index: 4; max-width: min(360px, 70vw); }
  #mission small { color: var(--mute); margin-right: 4px; } #mission b { color: var(--accent); margin-left: 6px; }
  #zone { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); font-size: clamp(22px, 4vw, 34px); font-weight: 800; letter-spacing: .1em; text-shadow: 0 2px 16px rgba(0,0,0,.6); opacity: 0; transition: opacity .8s; pointer-events: none; z-index: 4; }
  #zone.show { opacity: 1; }
  #sonar { position: fixed; left: 50%; bottom: 120px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 6px 12px; z-index: 4; pointer-events: none; }
  #sonar i { font-style: normal; display: inline-block; font-size: 22px; color: var(--cyan); transition: transform .2s; }
  #sonarBtn.cool { opacity: .5; }
  @media (max-width: 640px) { .stat { padding: 6px 9px; font-size: 13px; } #gpuTag, .wide { display: none; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>

<div id="loading"><div class="box">
  <h1>🌊 深海探險隊</h1>
  <p>駕駛小潛水艇，去看看海底住著誰</p>
  <div class="bar"><i id="loadBar"></i></div>
  <div id="loadMsg">載入中…</div>
  <button id="startBtn" class="hidden">出發 ▶</button>
</div></div>

<div id="top">
  <a class="back panel" href="/lab/">← <span class="wide">實驗室</span></a>
  <span class="grow"></span>
  <div class="stat panel">深度 <b id="depth">0</b> m</div>
  <button class="stat panel" id="codexBtn">📖 <b id="codexN">0</b>/<span id="codexT">0</span></button>
  <div class="stat panel">🗑️ <b id="trashN">0</b>/20</div>
  <button class="ibtn panel" id="sonarBtn" title="聲納：找最近還沒發現的生物（R）">📡</button>
  <button class="ibtn panel" id="lightBtn" title="探照燈（F）">💡</button>
  <button class="ibtn panel" id="soundBtn" title="聲音">🔊</button>
</div>
<div id="mission" class="panel"></div>
<div id="zone"></div>
<div id="sonar" class="panel hidden"><i>⬆</i><span></span></div>
<div id="depthBar"><i id="depthMark"></i><span id="depthLbl"></span></div>
<div id="toast" class="panel"><span class="em" id="tEm"></span><div><h3 id="tName"></h3><p id="tFact"></p></div></div>
<div id="msg" class="panel"></div>
<div id="help" class="panel">W／S 前進後退 · A／D 轉彎 · 空白鍵上浮 · Shift 下潛 · 拖曳滑鼠看四周 · F 探照燈 · R 聲納</div>

<div id="touch" class="hidden">
  <div id="stick"><i></i></div>
  <div id="vbtns"><button id="upBtn">⬆️</button><button id="downBtn">⬇️</button></div>
</div>

<div id="codex" class="hidden"><div class="sheet panel">
  <h2>📖 海洋圖鑑</h2>
  <p class="sub" id="codexSub"></p>
  <h3 style="margin:16px 0 6px">🔧 潛艇工廠 <span class="sub" id="shellN" style="font-weight:400"></span></h3>
  <p class="sub" style="margin:0 0 8px">發現一種生物得 3 個🐚、撿一個垃圾得 2 個🐚，拿來升級潛水艇。</p>
  <div class="cards" id="ups"></div>
  <h3 style="margin:16px 0 6px">📖 圖鑑</h3>
  <div class="cards" id="cards"></div>
  <div class="row"><button class="btn" id="resetBtn">重新開始探險</button><button class="btn main" id="closeCodex">繼續探險</button></div>
</div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
