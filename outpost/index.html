<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Crystal Outpost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#24304f; --mute:#6b7590; --panel:rgba(255,251,242,.95); --line:#e3d8c2; --edge:#cdbf9f;
  --blue:#3b8cff; --red:#ff5a6a; --gold:#ffc23a; --green:#2fbf68; --cyan:#3fd4f5;
  --font:"Fredoka",ui-rounded,"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2a3a;color:var(--ink);font-family:var(--font);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
#cv.target{cursor:crosshair}
.hidden{display:none!important}
.pnl{background:var(--panel);border:2px solid var(--line);border-radius:16px;box-shadow:0 6px 20px rgba(10,20,40,.28)}

/* top bar */
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 8px;white-space:nowrap}
.res{display:flex;align-items:center;gap:5px;padding:2px 8px;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;min-width:62px}
.res i{width:16px;height:16px;display:inline-block;flex:none}
.ico-c{background:linear-gradient(135deg,#bff6ff,#3fd4f5 55%,#1d86ad);clip-path:polygon(50% 0,100% 38%,78% 100%,22% 100%,0 38%)}
.ico-g{background:radial-gradient(circle at 35% 35%,#c6ffd6,#3ed27a 60%,#1f8a4c);border-radius:50%}
.ico-s{background:#ffc23a;border-radius:4px;box-shadow:inset 0 -4px 0 #e39a10}
#rS.full{color:#e0364a}
#clock{font-weight:500;color:var(--mute);padding:0 6px;font-variant-numeric:tabular-nums}
.tb{border:2px solid var(--line);background:#fff;border-radius:10px;height:32px;min-width:34px;padding:0 8px;font-size:14px;font-weight:600;cursor:pointer}
.tb:hover{border-color:var(--edge)}
.tb.on{background:#dff0ff;border-color:var(--blue)}
#bIdle b{color:var(--blue)}
#bIdle.none{opacity:.5}

/* bottom HUD */
#bottom{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:flex-end;justify-content:space-between;
  padding:8px;padding-bottom:max(8px,env(safe-area-inset-bottom));pointer-events:none}
#bottom>*{pointer-events:auto}
#mmWrap{padding:6px;flex:none}
#mm{width:172px;height:172px;display:block;border-radius:10px;background:#3d6b3d;cursor:pointer;touch-action:none}
#info{flex:1 1 auto;min-width:0;max-width:560px;height:184px;padding:10px 14px;overflow:hidden;align-self:stretch;max-height:184px;margin-top:auto}
#cmd{display:grid;grid-template-columns:repeat(4,56px);grid-template-rows:repeat(3,56px);gap:6px;padding:9px;flex:none}
.cb{position:relative;border:2px solid #d8ccb2;border-radius:12px;background:#fff;cursor:pointer;padding:0;overflow:hidden;touch-action:none}
.cb:hover{border-color:#a99b7c;background:#fffdf6}
.cb:active{transform:translateY(1px)}
.cb img{width:100%;height:100%;display:block;pointer-events:none}
.cb .hk{position:absolute;top:1px;left:4px;font-size:11px;font-weight:700;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff}
.cb .cs{position:absolute;bottom:0;right:3px;font-size:11px;font-weight:600;color:#1d86ad;text-shadow:0 0 3px #fff,0 0 3px #fff}
.cb.poor .cs{color:#e0364a}
.cb.off{opacity:.38;cursor:not-allowed}
.cb.sel{border-color:var(--green);background:#e7fbe9}
.slot{border:2px dashed #ece3d0;border-radius:12px}

.iname{font-size:20px;font-weight:600;margin:0;line-height:1.15}
.isub{font-size:13px;color:var(--mute)}
.irow{display:flex;gap:12px;align-items:flex-start}
.port{width:84px;height:84px;border-radius:14px;background:#fff;border:2px solid var(--line);flex:none}
.port img{width:100%;height:100%;display:block}
.hpb{height:9px;border-radius:6px;background:#eadfca;overflow:hidden;margin:5px 0 3px;max-width:240px}
.hpb>i{display:block;height:100%;background:var(--green);border-radius:6px}
.stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;margin-top:4px}
.stats span b{font-weight:600}
.queue{display:flex;gap:6px;margin-top:10px;align-items:center}
.q{position:relative;width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;overflow:hidden}
.q img{width:100%;height:100%;display:block;pointer-events:none}
.q i{position:absolute;left:0;bottom:0;height:5px;background:var(--green);pointer-events:none}
.q:hover{border-color:#e0364a}
.q.empty{background:transparent;border-style:dashed;cursor:default}
.multi{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;max-height:160px;overflow:hidden}
.mu{position:relative;width:38px;height:38px;border-radius:9px;background:#fff;border:2px solid var(--line);cursor:pointer;overflow:hidden}
.mu img{width:100%;height:100%;display:block;pointer-events:none}
.mu i{position:absolute;left:3px;right:3px;bottom:2px;height:4px;border-radius:3px;background:#eadfca;pointer-events:none}
.mu i b{display:block;height:100%;border-radius:3px;background:var(--green)}
.mu:hover{border-color:var(--blue)}
.hint{font-size:13px;color:var(--mute);line-height:1.45}
.hint kbd{font-family:inherit;font-size:12px;border:1.5px solid var(--edge);border-bottom-width:3px;border-radius:5px;padding:0 5px;background:#fff}

#toast{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 56px);transform:translateX(-50%);padding:7px 16px;font-weight:600;font-size:16px;
  border-radius:12px;background:rgba(36,48,79,.9);color:#fff;pointer-events:none;opacity:0;transition:opacity .25s;max-width:calc(100vw - 24px);width:max-content;text-align:center}
#toast.show{opacity:1}
#toast.bad{background:rgba(196,40,60,.92)}
#toast.good{background:rgba(30,140,80,.92)}
#tip{position:fixed;z-index:5;max-width:260px;padding:8px 11px;font-size:13px;line-height:1.4;pointer-events:none}
#tip b{font-size:15px}
#tip .tc{color:#1d86ad;font-weight:600}
#tip .bad{color:#e0364a;font-weight:600}

/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;
  background:radial-gradient(ellipse at center,rgba(20,32,56,.25),rgba(20,32,56,.6))}
.card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:26px 28px 22px;text-align:center;touch-action:pan-y}
.logo{font-size:clamp(38px,8vw,58px);font-weight:700;line-height:1;letter-spacing:.01em;color:var(--ink)}
.logo span{background:linear-gradient(135deg,#3fd4f5,#3b8cff 60%,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:12px auto 18px;max-width:40ch;line-height:1.45}
.seg{display:inline-flex;background:#f1e9d8;border-radius:14px;padding:4px;gap:4px;margin-bottom:16px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 18px;font-size:16px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.big{display:block;margin:0 auto;border:0;border-radius:16px;padding:13px 34px;font-size:20px;font-weight:600;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#58a6ff,#2f7cf0);box-shadow:0 5px 0 #1d5fc4,0 10px 18px rgba(30,90,200,.3)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #1d5fc4}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn2{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 18px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn2:hover{border-color:var(--edge)}
details{text-align:left;margin-top:18px;border-top:2px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;text-align:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:" ▾"}
details[open] summary::after{content:" ▴"}
.help{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin-top:12px}
.help dt{font-weight:600;white-space:nowrap}
.help dd{margin:0;color:var(--mute)}
.help h4{grid-column:1/-1;margin:8px 0 0;font-size:15px}
.wins{margin-top:14px;font-size:13px;color:var(--mute)}
.hall{display:inline-block;margin-top:10px;color:var(--mute);font-size:14px;text-decoration:none}
.hall:hover{color:var(--ink)}
.endt{font-size:48px;font-weight:700;margin:0}
.endt.win{color:#2f9e5c} .endt.lose{color:#d6384c}
.est{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}
.est div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px}
.est b{display:block;font-size:22px}
.est span{font-size:12px;color:var(--mute)}
.touchOnly{display:none}
body.touch .touchOnly{display:inline-block}

@media (max-width:900px),(max-height:600px){
  #mm{width:120px;height:120px}
  #cmd{grid-template-columns:repeat(4,46px);grid-template-rows:repeat(3,46px);gap:5px;padding:7px}
  #info{height:142px;max-height:142px;padding:8px 10px}
  .port{width:60px;height:60px}
  .iname{font-size:17px}
  .res{font-size:15px;min-width:50px;padding:2px 4px}
  #clock{display:none}
}
@media (max-height:460px){
  #mm{width:96px;height:96px}
  #cmd{grid-template-columns:repeat(4,40px);grid-template-rows:repeat(3,40px);gap:4px;padding:6px}
  #info{height:110px;max-height:110px}
  #info .stats,#info .hint{display:none}
  .port{width:48px;height:48px}
  .q{width:36px;height:36px}
  #toast{font-size:14px;top:calc(max(6px,env(safe-area-inset-top)) + 46px)}
}
@media (max-width:640px){
  #info{display:none}
  #top{gap:3px;padding:4px 5px}
  .tb{height:30px;min-width:30px;padding:0 6px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hidden">
  <div id="top" class="pnl">
    <div class="res" title="Crystals"><i class="ico-c"></i><b id="rC">0</b></div>
    <div class="res" title="Gas"><i class="ico-g"></i><b id="rG">0</b></div>
    <div class="res" title="Supply (used / limit)"><i class="ico-s"></i><b id="rS">0/0</b></div>
    <div id="clock">0:00</div>
    <button class="tb none" id="bIdle" title="Select an idle worker ( ` )">Idle <b id="nIdle">0</b></button>
    <button class="tb touchOnly" id="bBox" title="Drag to box-select">⬚</button>
    <button class="tb" id="bMute" title="Sound on/off">♪</button>
    <button class="tb" id="bMenu" title="Pause (Esc)">❚❚</button>
  </div>
  <div id="bottom">
    <div id="mmWrap" class="pnl"><canvas id="mm" width="344" height="344"></canvas></div>
    <div id="info" class="pnl"></div>
    <div id="cmd" class="pnl"></div>
  </div>
  <div id="toast"></div>
  <div id="tip" class="pnl hidden"></div>
</div>

<div id="title" class="screen">
  <div class="card pnl">
    <div class="logo"><span>Crystal</span> Outpost</div>
    <p class="sub">A bright little real-time strategy game. Mine crystals and gas, build up your base and knock out the red team's buildings.</p>
    <div class="seg" id="diff"><button data-d="easy">Easy</button><button data-d="normal" class="on">Normal</button><button data-d="hard">Hard</button></div>
    <button class="big" id="bStart">Start battle</button>
    <details id="howto"><summary>How to play</summary><div class="help" id="helpBox"></div></details>
    <div class="wins" id="wins"></div>
    <a class="hall" href="../index.html">← Game Hall</a>
  </div>
</div>

<div id="pause" class="screen hidden">
  <div class="card pnl">
    <div class="logo" style="font-size:40px">Paused</div>
    <div class="row" style="margin-top:20px"><button class="big" id="bResume">Resume</button></div>
    <div class="row"><button class="btn2" id="bRestart">Restart</button><button class="btn2" id="bQuit">Quit to title</button><a class="btn2" href="../index.html">Game Hall</a></div>
    <details><summary>How to play</summary><div class="help" id="helpBox2"></div></details>
  </div>
</div>

<div id="end" class="screen hidden">
  <div class="card pnl">
    <p class="endt" id="endT">Victory!</p>
    <p class="sub" id="endS" style="margin-bottom:6px"></p>
    <div class="est" id="endStats"></div>
    <div class="row" style="margin-top:18px"><button class="big" id="bAgain">Play again</button></div>
    <div class="row"><button class="btn2" id="bEndTitle">Title</button><a class="btn2" href="../index.html">Game Hall</a></div>
  </div>
</div>
<script>
'use strict';
// =====================================================================
//  Crystal Outpost — a small real-time strategy game in one file.
//  Map: 80x80 tiles of 32px. Two teams: 0 = player (blue), 1 = AI (red).
// =====================================================================
const T = 32, MW = 80, MH = 80, N = MW * MH, STEP = 1 / 30;
const TEAM = [
  { c: '#3b8cff', l: '#a9d2ff', d: '#1d4f9e', name: 'Blue' },
  { c: '#ff5a6a', l: '#ffb8c0', d: '#a8293b', name: 'Red' },
];
const DEF = {
  worker:   { name: 'Worker',   unit: 1, hp: 40,  armor: 0, r: 9,  speed: 84,  sight: 7,  cost: [50, 0],   time: 12, sup: 1, key: 'W', wpn: { dmg: 5, range: 4, cd: 1.1, melee: 1 }, desc: 'Mines crystals and gas, and builds structures.' },
  trooper:  { name: 'Trooper',  unit: 1, hp: 45,  armor: 0, r: 9,  speed: 88,  sight: 8,  cost: [50, 0],   time: 16, sup: 1, key: 'T', wpn: { dmg: 6, range: 128, cd: .62, proj: 'bolt' }, desc: 'Basic ranged infantry. Cheap and quick to train.' },
  guardian: { name: 'Guardian', unit: 1, hp: 135, armor: 1, r: 12, speed: 80,  sight: 7,  cost: [100, 0],  time: 22, sup: 2, key: 'G', wpn: { dmg: 16, range: 6, cd: 1.05, melee: 1 }, desc: 'Tough shield-bearer that fights up close.' },
  buggy:    { name: 'Buggy',    unit: 1, hp: 80,  armor: 0, r: 12, speed: 140, sight: 9,  cost: [75, 0],   time: 18, sup: 2, key: 'B', wpn: { dmg: 9, range: 84, cd: .5, proj: 'bolt' }, desc: 'Very fast raider. Great for hunting workers.' },
  tank:     { name: 'Tank',     unit: 1, hp: 170, armor: 1, r: 15, speed: 66,  sight: 10, cost: [150, 100], time: 32, sup: 3, key: 'T', wpn: { dmg: 26, range: 210, cd: 2.0, proj: 'shell', splash: 34 }, desc: 'Long-range cannon with splash damage. Needs gas.' },
  hq:       { name: 'Command Center', bld: 1, w: 3, h: 3, hp: 1500, armor: 1, sight: 10, cost: [400, 0], time: 70, supply: 10, key: 'C', trains: ['worker'], desc: 'Trains workers. Workers bring resources here. Gives 10 supply.' },
  depot:    { name: 'Supply Depot', bld: 1, w: 2, h: 2, hp: 400, armor: 1, sight: 6, cost: [100, 0], time: 20, supply: 8, key: 'S', desc: 'Raises your supply limit by 8.' },
  refinery: { name: 'Refinery', bld: 1, w: 2, h: 2, hp: 500, armor: 1, sight: 6, cost: [75, 0], time: 20, key: 'R', desc: 'Build on a gas geyser so workers can collect gas.' },
  barracks: { name: 'Barracks', bld: 1, w: 3, h: 3, hp: 1000, armor: 1, sight: 7, cost: [150, 0], time: 40, key: 'B', req: 'depot', trains: ['trooper', 'guardian'], desc: 'Trains Troopers and Guardians.' },
  factory:  { name: 'Factory',  bld: 1, w: 3, h: 3, hp: 1250, armor: 1, sight: 7, cost: [150, 100], time: 45, key: 'F', req: 'barracks', trains: ['buggy', 'tank'], desc: 'Builds Buggies and Tanks.' },
  turret:   { name: 'Turret',   bld: 1, w: 2, h: 2, hp: 380, armor: 1, sight: 9, cost: [100, 0], time: 24, key: 'T', req: 'barracks', wpn: { dmg: 12, range: 192, cd: .75, proj: 'bolt' }, desc: 'Defensive gun tower.' },
  crystal:  { name: 'Crystals', res: 1, w: 1, h: 1, hp: 1, sight: 0 },
  geyser:   { name: 'Gas Geyser', res: 1, w: 2, h: 2, hp: 1, sight: 0 },
};
for (const k in DEF) DEF[k].kind = k;
const BUILD_LIST = ['hq', 'depot', 'refinery', 'barracks', 'factory', 'turret'];
const AI_CFG = {
  easy:   { think: 1.0, mult: .75, workers: 13, first: 360, wave: 5, grow: 2, rax2: 360, fac: 460, turrets: 0, expand: 720 },
  normal: { think: .6,  mult: 1.0, workers: 17, first: 270, wave: 7, grow: 3, rax2: 220, fac: 300, turrets: 1, expand: 540 },
  hard:   { think: .35, mult: 1.25, workers: 20, first: 210, wave: 9, grow: 4, rax2: 150, fac: 230, turrets: 2, expand: 420 },
};

// ---------- small helpers
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const tOf = v => Math.floor(v / T);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let NOW = 0;  // real seconds, for idle animation

// ---------- grids
const TER = new Uint8Array(N);   // 0 grass, 1 rock, 2 water, 3 trees
const BLK = new Int32Array(N);   // id of the building/resource standing on a tile
const VIS = new Uint8Array(N), EXP = new Uint8Array(N);
const walk = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH && TER[y * MW + x] === 0 && BLK[y * MW + x] === 0;
const walkP = (x, y) => walk(tOf(x), tOf(y));

let G = null;   // the running game

// =====================================================================
//  Map generation (180° rotational symmetry: player bottom-left, AI top-right)
// =====================================================================
const SITES0 = [{ x: 10, y: 69, main: 1 }, { x: 30, y: 70 }, { x: 9, y: 46 }, { x: 33, y: 49 }];
function genMap(seed) {
  const R = mulberry32(seed);
  TER.fill(0); BLK.fill(0);
  const sym = (x, y, v) => { if (x < 0 || y < 0 || x >= MW || y >= MH) return; TER[y * MW + x] = v; TER[(MH - 1 - y) * MW + (MW - 1 - x)] = v; };
  const sites = [];
  for (const s of SITES0) { sites.push({ ...s, side: 0 }); sites.push({ x: MW - 1 - s.x, y: MH - 1 - s.y, main: s.main, side: 1 }); }
  const nearSite = (x, y, r) => sites.some(s => (x - s.x) ** 2 + (y - s.y) ** 2 < r * r);
  for (let i = 0; i < MW; i++) { sym(i, 0, 1); sym(0, i, 1); }
  for (let k = 0; k < 32; k++) {
    const cx = R() * MW, cy = R() * MH, rad = 1.3 + R() * 3.3;
    const p = R(), ty = p < .42 ? 1 : p < .75 ? 3 : 2;
    const sx = .65 + R() * .8, sy = .65 + R() * .8;
    for (let y = Math.floor(cy - rad * 2); y <= cy + rad * 2; y++) for (let x = Math.floor(cx - rad * 2); x <= cx + rad * 2; x++) {
      const d = Math.hypot((x + .5 - cx) / sx, (y + .5 - cy) / sy);
      if (d < rad * (.78 + R() * .35) && !nearSite(x, y, 8.6)) sym(x, y, ty);
    }
  }
  // keep a lane clear through the middle so the map never splits in two
  const flood = (sx, sy) => {
    const seen = new Uint8Array(N), q = [sy * MW + sx]; seen[q[0]] = 1;
    for (let h = 0; h < q.length; h++) {
      const i = q[h], x = i % MW, y = (i / MW) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, j = ny * MW + nx;
        if (nx >= 0 && ny >= 0 && nx < MW && ny < MH && !seen[j] && TER[j] === 0) { seen[j] = 1; q.push(j); }
      }
    }
    return seen;
  };
  for (let pass = 0; pass < 8; pass++) {
    const seen = flood(sites[0].x, sites[0].y);
    const lost = sites.find(s => !seen[s.y * MW + s.x]);
    if (!lost) break;
    // carve from the lost site toward the map centre until we hit the reachable region
    let x = lost.x, y = lost.y;
    for (let n = 0; n < 200; n++) {
      if (seen[y * MW + x]) break;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) sym(x + a, y + b, 0);
      const tx = MW / 2, ty = MH / 2;
      if (Math.abs(tx - x) > Math.abs(ty - y)) x += Math.sign(tx - x); else y += Math.sign(ty - y);
    }
  }
  for (let i = 0; i < MW; i++) { sym(i, 0, 1); sym(0, i, 1); }
  // resources: crystals in an arc on the far side of each site, a gas geyser to one side
  const res = [];
  SITES0.forEach((s, si) => {
    const dir = Math.atan2(s.y - MH / 2, s.x - MW / 2);

// ---------- terrain (baked once per game)
let terCv = null, mmTer = null;
function bakeTerrain() {
  const R = mulberry32(G.seed + 99);
  terCv = document.createElement('canvas'); terCv.width = MW * T; terCv.height = MH * T;
  const g = terCv.getContext('2d');
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const n = Math.sin(x * .31 + y * .17) * .5 + Math.sin(x * .07 - y * .23) * .5;
    g.fillStyle = `hsl(${100 + n * 8},${48 + n * 6}%,${60 + n * 3 + R() * 2}%)`; g.fillRect(x * T, y * T, T, T);
  }
  for (let i = 0; i < 260; i++) { g.fillStyle = R() < .5 ? 'rgba(255,255,220,.07)' : 'rgba(40,110,40,.07)'; circ(g, R() * MW * T, R() * MH * T, 30 + R() * 90); g.fill(); }
  // dirt pads at every base site
  for (const s of [...G.sites, ...G.blds.filter(b => b.kind === 'hq').map(b => ({ x: b.tx + 1, y: b.ty + 1 }))]) {
    const cx = (s.x + .5) * T, cy = (s.y + .5) * T;
    const gr = g.createRadialGradient(cx, cy, 20, cx, cy, 5.5 * T); gr.addColorStop(0, 'rgba(236,214,160,.75)'); gr.addColorStop(1, 'rgba(236,214,160,0)');
    g.fillStyle = gr; g.fillRect(cx - 6 * T, cy - 6 * T, 12 * T, 12 * T);
  }
  // grass tufts & flowers
  for (let i = 0; i < 2600; i++) {
    const x = R() * MW * T, y = R() * MH * T;
    if (TER[tOf(y) * MW + tOf(x)] !== 0) continue;
    const p = R();
    if (p < .72) { g.strokeStyle = 'rgba(60,130,50,.45)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x - 3, y + 2); g.lineTo(x - 1, y - 3); g.moveTo(x, y + 2); g.lineTo(x + 1, y - 4); g.moveTo(x + 3, y + 2); g.lineTo(x + 4, y - 2); g.stroke(); }
    else { g.fillStyle = ['#fff6f0', '#ffd23f', '#ff9ec7', '#c7b4ff'][(R() * 4) | 0]; for (let k = 0; k < 4; k++) { circ(g, x + Math.cos(k * 1.57) * 2.2, y + Math.sin(k * 1.57) * 2.2, 1.8); g.fill(); } g.fillStyle = '#ffb627'; circ(g, x, y, 1.3); g.fill(); }
  }
  const is = (x, y, v) => x >= 0 && y >= 0 && x < MW && y < MH && TER[y * MW + x] === v;
  const blob = (v, inset, col, dy = 0) => {
    g.fillStyle = col;
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      if (!is(x, y, v)) continue;
      const u = is(x, y - 1, v), d = is(x, y + 1, v), l = is(x - 1, y, v), r = is(x + 1, y, v);
      const rad = 13;
      const radii = [!u && !l ? rad : 0, !u && !r ? rad : 0, !d && !r ? rad : 0, !d && !l ? rad : 0];
      const x0 = x * T + (l ? 0 : inset), y0 = y * T + (u ? 0 : inset) + dy, x1 = x * T + T - (r ? 0 : inset), y1 = y * T + T - (d ? 0 : inset) + dy;
      g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, radii); g.fill();
    }
  };
  // water with sandy shore
  blob(2, -5, '#efdfa6'); blob(2, 0, '#4fb7ea'); blob(2, 5, '#6fcaf3');
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (is(x, y, 2) && R() < .25) { g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2; g.beginPath(); const cx = x * T + 8 + R() * 16, cy = y * T + 10 + R() * 12; g.moveTo(cx - 5, cy); g.quadraticCurveTo(cx, cy - 4, cx + 5, cy); g.stroke(); }
  // rocky plateaus
  blob(1, -2, 'rgba(24,48,28,.25)', 6);
  blob(1, -1, '#8a8fa9'); blob(1, 2, '#b4b9cf', -4); blob(1, 7, '#c6cadc', -5);
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (is(x, y, 1) && R() < .55) {
    const cx = x * T + 6 + R() * 20, cy = y * T + 4 + R() * 18, r = 4 + R() * 6;
    g.fillStyle = '#9da2bb'; circ(g, cx, cy + 2, r); g.fill(); g.fillStyle = '#d6d9e6'; circ(g, cx - 1, cy, r * .8); g.fill();
  }

  const trees = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (is(x, y, 3)) trees.push({ x: x * T + 16 + (R() - .5) * 8, y: y * T + 16 + (R() - .5) * 8, r: 15 + R() * 6, c: R() < .1 ? 1 : R() < .5 ? 2 : 0 });

  for (const t of trees) {
    const cols = [['#3f9e4d', '#5cc163', '#2b7a3a'], ['#ff8fbf', '#ffc0da', '#d2608f'], ['#4cae55', '#76d06f', '#2f8240']][t.c];

    g.fillStyle = cols[2]; circ(g, t.x, t.y - 1, t.r + 1.5); g.fill();
    g.fillStyle = cols[0]; circ(g, t.x, t.y - 2, t.r); g.fill();
    g.fillStyle = cols[1]; circ(g, t.x - t.r * .3, t.y - t.r * .45, t.r * .5); g.fill();
  }

  const m = mmTer.getContext('2d');
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) { const v = TER[y * MW + x]; m.fillStyle = v === 1 ? '#a3a8c0' : v === 2 ? '#4fb7ea' : v === 3 ? '#3a8f47' : '#7fca62'; m.fillRect(x, y, 1, 1); }
}

  if (d.box) { boxSelect(d.sx, d.sy, d.x, d.y, e.shiftKey); if (d.touch) { boxMode = false; $('bBox').classList.remove('on'); } return; }
  const w = toWorld(d.x, d.y);
  if (d.touch) { if (!d.moved || (G.mode && G.mode.t === 'place')) tap(w.x, w.y); return; }
  if (!d.moved) clickSelect(w.x, w.y, e.shiftKey, e.ctrlKey || e.metaKey, false);
}
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); drag = null; pinch = null; pan = null; });
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') mouse.inside = false; });
cv.addEventListener('wheel', e => {
  e.preventDefault(); if (!G || G.demo) return;
  const w = toWorld(e.clientX, e.clientY);
  cam.z = clamp(cam.z * (e.deltaY < 0 ? 1.1 : 1 / 1.1), .45, 1.7);
  cam.x = w.x - e.clientX / cam.z; cam.y = w.y - e.clientY / cam.z; clampCam();
}, { passive: false });
// minimap
function mmWorld(e) { const r = mm.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * MW * T, y: (e.clientY - r.top) / r.height * MH * T }; }
let mmDrag = false;
mm.addEventListener('contextmenu', e => e.preventDefault());
mm.addEventListener('pointerdown', e => {
  audio(); if (!G || G.demo) return; e.preventDefault();
  const w = mmWorld(e);
  if (e.button === 2 || (G.mode && G.mode.t !== 'place')) {
    if (G.mode && G.mode.t !== 'place') execMode(w.x, w.y, false); else { const us = ownUnits(); if (us.length) { cmdMove(us, w.x, w.y, false); sfx('ack'); } else rightCmd(w.x, w.y, false); }
    return;
  }
  mmDrag = true; mm.setPointerCapture(e.pointerId); centerOn(w.x, w.y);
});
mm.addEventListener('pointermove', e => { if (mmDrag) { const w = mmWorld(e); centerOn(w.x, w.y); } });
mm.addEventListener('pointerup', () => mmDrag = false);

function jumpIdle() {
  const list = G.ents.filter(e => e.alive && e.team === 0 && e.kind === 'worker' && e.order.t === 'idle');
  if (!list.length) return;
  G.idleI = ((G.idleI || 0) + 1) % list.length;
  const w = list[G.idleI]; setSel([w]); centerOn(w.x, w.y); sfx('click');
}
addEventListener('keydown', e => {
  if (e.key === 'Shift') keys.Shift = true;
  if (!$('title').classList.contains('hidden')) { if (e.key === 'Enter') startGame(); return; }
  if (!G || G.demo) return;
  const k = e.key;
  if (!$('end').classList.contains('hidden')) return;
  if (k === 'Escape') { if (G.mode) setMode(null); else if (G.sub) G.sub = null; else togglePause(); cardSig = ''; return; }
  if (k === 'p' || k === 'P' || k === 'F10') { togglePause(); return; }
  if (paused) return;
  if (k.startsWith('Arrow')) { keys[k] = true; e.preventDefault(); return; }
  if (/^[0-9]$/.test(k)) {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); G.groups[k] = ownUnits().length ? ownUnits().map(u => u.id) : ownBlds().map(b => b.id); toast('Group ' + k + ' set'); return; }
    const ids = (G.groups[k] || []).filter(id => byId(id));
    if (!ids.length) return;
    const now = performance.now();
    if (G.lastGroup === k && now - G.lastGroupT < 400) { const f = byId(ids[0]); if (f) centerOn(f.x, f.y); }
    G.lastGroup = k; G.lastGroupT = now;
    setSel(ids.map(id => G.byId.get(id))); return;
  }
  if (k === '`' || k === '~' || k === 'F1') { e.preventDefault(); jumpIdle(); return; }
  if (k === ' ') {
    e.preventDefault();
    if (G.alertPos && G.time - G.alertPos.time < 10) centerOn(G.alertPos.x, G.alertPos.y);
    else { const s = selEnts()[0] || G.blds.find(b => b.team === 0); if (s) centerOn(s.x, s.y); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const up = k.length === 1 ? k.toUpperCase() : k;
  curCard = card();
  for (const b of curCard) if (b && (b.key === up || (b.key === 'Esc' && k === 'Escape'))) { e.preventDefault(); b.act(e.shiftKey); cardSig = ''; updHud(); return; }
});
addEventListener('keyup', e => { keys[e.key] = false; if (e.key === 'Shift') keys.Shift = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

$('bIdle').addEventListener('click', () => G && jumpIdle());
$('bBox').addEventListener('click', () => { boxMode = !boxMode; $('bBox').classList.toggle('on', boxMode); if (boxMode) toast('Drag to select units'); });
$('bMute').addEventListener('click', () => { muted = !muted; $('bMute').textContent = muted ? '♪̸' : '♪'; $('bMute').style.opacity = muted ? .5 : 1; try { localStorage.setItem('crystalOutpost.mute', muted ? '1' : '0'); } catch (e) { } });
$('bMenu').addEventListener('click', () => togglePause());

function cameraUpdate(dt) {
  if (G.demo) {
    let tx = 0, ty = 0, n = 0;
    for (const p of G.proj) { tx += p.x; ty += p.y; n++; }
    if (!n) { const b = G.blds[Math.floor(G.time / 12) % Math.max(1, G.blds.length)]; if (b) { tx = b.x; ty = b.y; n = 1; } }
    if (n) {
      const gx = tx / n - W / cam.z / 2, gy = ty / n - H / cam.z / 2;
      cam.x += (gx - cam.x) * Math.min(1, dt * .4); cam.y += (gy - cam.y) * Math.min(1, dt * .4); clampCam();
    }
    return;
  }
  const sp = 900 * dt / cam.z;
  if (keys.ArrowLeft) cam.x -= sp; if (keys.ArrowRight) cam.x += sp; if (keys.ArrowUp) cam.y -= sp; if (keys.ArrowDown) cam.y += sp;
  if (mouse.inside && mouse.type === 'mouse' && !drag && !pan && !paused && document.hasFocus()) {
    const m = 6;
    if (mouse.x < m) cam.x -= sp; if (mouse.x > W - m) cam.x += sp; if (mouse.y < m) cam.y -= sp; if (mouse.y > H - m) cam.y += sp;
  }
  clampCam();
}

// =====================================================================
//  Screens & main loop
// =====================================================================
const HELP = `
<h4>Goal</h4><dt>Win</dt><dd>Destroy every red building. You lose if all of yours are destroyed.</dd>
<h4>Mouse &amp; keyboard</h4>
<dt>Left-click / drag</dt><dd>Select (Shift adds, double-click selects the same type on screen)</dd>
<dt>Right-click</dt><dd>Move, attack, mine, or set a rally point</dd>
<dt>A then click</dt><dd>Attack-move: fight anything on the way</dd>
<dt>S · H · M</dt><dd>Stop · hold position · move only</dd>
<dt>B</dt><dd>Build menu (with a worker selected), then click to place. Shift places several.</dd>
<dt>Ctrl + 1–9</dt><dd>Make a group; press the number to select it, twice to jump there</dd>
<dt>\` (backtick)</dt><dd>Select an idle worker</dd>
<dt>Space</dt><dd>Jump to the last alert</dd>
<dt>Arrows / screen edge</dt><dd>Scroll. Mouse wheel zooms, middle-drag pans, click the minimap to jump</dd>
<dt>Esc / P</dt><dd>Cancel, or pause</dd>
<h4>Touch</h4>
<dt>Tap</dt><dd>Select your unit or building. With units selected, tap the ground to move or an enemy to attack.</dd>
<dt>Drag · pinch</dt><dd>Scroll · zoom. Press ⬚ then drag to box-select.</dd>
<h4>Economy</h4>
<dt>Crystals</dt><dd>Workers mine them and carry them to the Command Center.</dd>
<dt>Gas</dt><dd>Build a Refinery on a green geyser; up to 3 workers per Refinery.</dd>
<dt>Supply</dt><dd>Every unit uses supply. Build Supply Depots to raise the limit.</dd>
<dt>Tech</dt><dd>Supply Depot → Barracks → Factory. Turrets need a Barracks.</dd>`;
$('helpBox').innerHTML = HELP; $('helpBox2').innerHTML = HELP;
let diff = 'normal';
try { diff = localStorage.getItem('crystalOutpost.diff') || 'normal'; } catch (e) { }
document.querySelectorAll('#diff button').forEach(b => {
  b.classList.toggle('on', b.dataset.d === diff);
  b.addEventListener('click', () => { diff = b.dataset.d; document.querySelectorAll('#diff button').forEach(x => x.classList.toggle('on', x === b)); try { localStorage.setItem('crystalOutpost.diff', diff); } catch (e) { } });
});
function loadWins() { try { return JSON.parse(localStorage.getItem('crystalOutpost.wins')) || {}; } catch (e) { return {}; } }
function showWins() { const w = loadWins(); $('wins').textContent = 'Wins: Easy ' + (w.easy || 0) + ' · Normal ' + (w.normal || 0) + ' · Hard ' + (w.hard || 0); }
function startDemo() {
  newGame({ demo: true, seed: (Math.random() * 1e9) | 0, diff: 'normal', diff0: 'normal' });
  cam.z = Math.min(1, Math.max(.6, W / 1400));
  const b = G.blds[0]; centerOn(b.x, b.y);
}
function startGame() {
  audio();
  $('title').classList.add('hidden'); $('end').classList.add('hidden'); $('pause').classList.add('hidden'); $('hud').classList.remove('hidden');
  paused = false; boxMode = false; $('bBox').classList.remove('on');
  newGame({ seed: (Math.random() * 1e9) | 0, diff });
  cam.z = W < 700 ? .75 : 1;
  const hq = G.blds.find(b => b.team === 0); centerOn(hq.x + 60, hq.y - 40);
  cardSig = ''; infoSig = ''; updHud();
  toast('Train workers, build Supply Depots, then a Barracks!');
}
function toTitle() {
  paused = false;
  $('hud').classList.add('hidden'); $('pause').classList.add('hidden'); $('end').classList.add('hidden'); $('title').classList.remove('hidden');
  showWins(); startDemo();
}
function togglePause() {
  if (!G || G.demo || G.over) return;
  paused = !paused; $('pause').classList.toggle('hidden', !paused);
}
function onGameOver(win) {
  if (win) { try { const w = loadWins(); w[G.diff] = (w[G.diff] || 0) + 1; localStorage.setItem('crystalOutpost.wins', JSON.stringify(w)); } catch (e) { } }
  setTimeout(() => {
    if (!G || G.demo) return;
    sfx(win ? 'win' : 'lose');
    $('endT').textContent = win ? 'Victory!' : 'Defeat'; $('endT').className = 'endt ' + (win ? 'win' : 'lose');
    const m = Math.floor(G.time / 60), s = Math.floor(G.time % 60);
    $('endS').textContent = (win ? 'The red team is wiped out.' : 'Your base has fallen.') + ' ' + G.diff[0].toUpperCase() + G.diff.slice(1) + ' · ' + m + ':' + String(s).padStart(2, '0');
    const st = G.stats;
    $('endStats').innerHTML = [[st.mined, 'Crystals mined'], [st.gas, 'Gas collected'], [st.trained, 'Units trained'], [st.killed, 'Enemy units destroyed'], [st.razed, 'Enemy buildings destroyed'], [st.lost, 'Units lost']].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
    $('end').classList.remove('hidden');
  }, 2000);
}
$('bStart').addEventListener('click', startGame);
$('bResume').addEventListener('click', togglePause);
$('bRestart').addEventListener('click', startGame);
$('bQuit').addEventListener('click', toTitle);
$('bAgain').addEventListener('click', startGame);
$('bEndTitle').addEventListener('click', toTitle);

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; NOW += dt;
  if (G && !paused) {
    acc += dt; let n = 0;
    while (acc >= STEP && n < 5) { sim(STEP); acc -= STEP; n++; }
    if (n === 5) acc = 0;
  }
  if (G) {
    cameraUpdate(dt);
    drawAll();
    hudT -= dt; if (hudT <= 0) { hudT = .1; if (!G.demo) { updHud(); drawMinimap(); } }
    if (G.demo && G.over && (G.overT -= dt) <= 0) startDemo();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
if (matchMedia('(pointer: coarse)').matches) { isTouch = true; document.body.classList.add('touch'); }
$('bMute').textContent = muted ? '♪̸' : '♪'; $('bMute').style.opacity = muted ? .5 : 1;
showWins();
startDemo();
requestAnimationFrame(frame);

// debug / test hooks
window.RTS = { get G() { return G; }, sim, newGame, startGame, cam, step(n) { for (let i = 0; i < n; i++) sim(STEP); } };
</script>
</body>
