<body>

<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'mole', title: '敲敲地鼠', stats: ['score', 'time'] });
let W = 360, H = 520, land = false;
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const ROUND = 45;
const holes = []; for (let i = 0; i < 9; i++) holes.push({ x: 0, y: 0, m: null });
function placeHoles() {
  holes.forEach((h, i) => { const r = Math.floor(i / 3), c = i % 3;

}
cv.onfit = placeHoles;
MG.fit(cv, (sw, sh) => { land = sw > sh * 1.15; [W, H] = land ? [580, 350] : [360, 520]; return [W, H]; });
let mode = 'timed';

const rest = MG.barButton('休息一下', () => end());
let score, left, spawnT, state = 'ready', pops = [], hits = [], t = 0, combo = 0, misses = 0;

function reset() { MG.fx.clear(); for (const h of holes) h.m = null; score = 0; left = ROUND; spawnT = 0.6; pops = []; hits = []; t = 0; combo = 0; misses = 0; hud(); }

}
function update(dt) {

  const prog = progNow();

}
function whack(i, px, py) {

// ---------- input ----------

const KEYMAP = { q: 0, w: 1, e: 2, a: 3, s: 4, d: 5, z: 6, x: 7, c: 8, '7': 0, '8': 1, '9': 2, '4': 3, '5': 4, '6': 5, '1': 6, '2': 7, '3': 8 };

// ---------- draw ----------
let bgC = null, bgK = '';
function farm() {

  g.fillStyle = '#a7d98a'; g.beginPath(); g.moveTo(0, skyH); for (let xx = 0; xx <= W; xx += 12) g.lineTo(xx, skyH - 10 - Math.sin(xx * 0.02) * 8); g.lineTo(W, skyH); g.fill();

  g.fillStyle = '#d9d2c0'; g.beginPath(); g.roundRect(bxp + 26, byp - 34, 12, 34, [6, 6, 0, 0]); g.fill();   // silo

function sign() {

  x.fillStyle = '#8a5a2b'; x.fillRect(sx - 4, sy + 30, 8, 46); x.fillStyle = 'rgba(0,0,0,.2)'; x.fillRect(sx + 1, sy + 30, 3, 46);

}
function draw() {

  sign();
  holes.forEach((h, i) => drawHole(h, i));
  MG.fx.draw(x);
  // mallet
  for (const s of hits) {
    const k = 1 - s.life / 0.22, a = -1.1 + Math.min(1, k * 2.2) * 1.1;
    x.save(); x.translate(s.x + 26, s.y + 26); x.rotate(a);

    x.fillStyle = hg; x.beginPath(); x.roundRect(-22, -62, 44, 24, 7); x.fill(); x.strokeStyle = '#8e2a20'; x.lineWidth = 2; x.stroke();
    x.fillStyle = '#e8e2d0'; x.fillRect(-16, -62, 4, 24); x.fillRect(12, -62, 4, 24);

function drawHole(h, i) {

  const mg = x.createLinearGradient(0, hy - 18, 0, hy + 16); mg.addColorStop(0, '#b8854e'); mg.addColorStop(1, '#7a5230');
  x.fillStyle = mg; x.beginPath(); x.ellipse(hx, hy, 49, 18, 0, 0, 7); x.fill();

      x.fillStyle = m.kind === 'gold' ? '#ffcf33' : '#8a5a34'; x.strokeStyle = m.kind === 'gold' ? '#b38400' : '#5a3a1e'; x.lineWidth = 1.5;
      for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(hx + sd * 22, hy - 2, 9, 6, 0, 0, 7); x.fill(); x.stroke(); x.strokeStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.moveTo(hx + sd * 22 - 3, hy - 4); x.lineTo(hx + sd * 22 - 3, hy + 1); x.moveTo(hx + sd * 22 + 2, hy - 4); x.lineTo(hx + sd * 22 + 2, hy + 1); x.stroke(); x.strokeStyle = m.kind === 'gold' ? '#b38400' : '#5a3a1e'; }

  }
  if (bonk) { // stars circling the head
    for (let j = 0; j < 3; j++) { const a = t * 6 + j * 2.1; x.fillStyle = '#ffd34d'; x.font = '15px sans-serif'; x.fillText('★', cx + Math.cos(a) * 24, top - 6 + Math.sin(a) * 6); }
  }
}
function face(cx, cy, bonk, nose, bunny) {
  x.fillStyle = '#2a1c10'; x.strokeStyle = '#2a1c10'; x.lineWidth = 2.2; x.lineCap = 'round';
  if (bonk) { for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(cx + sd * 12 - 4, cy - 4); x.lineTo(cx + sd * 12 + 4, cy + 4); x.moveTo(cx + sd * 12 + 4, cy - 4); x.lineTo(cx + sd * 12 - 4, cy + 4); x.stroke(); } }
  else for (const sd of [-1, 1]) {
    x.fillStyle = '#2a1c10'; x.beginPath(); x.ellipse(cx + sd * 12, cy, 4.2, 5, 0, 0, 7); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(cx + sd * 12 - 1.3, cy - 1.8, 1.6, 0, 7); x.fill();
  }
  x.fillStyle = 'rgba(255,120,140,.45)'; for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(cx + sd * 19, cy + 8, 5, 3, 0, 0, 7); x.fill(); }
  x.fillStyle = nose; x.beginPath(); x.ellipse(cx, cy + 9, bunny ? 4 : 6, bunny ? 3 : 4.5, 0, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(cx - 1.5, cy + 7.5, 1.4, 0, 7); x.fill();
}

function start(m) { if (m) mode = m; reset(); state = 'play'; MG.hide(); rest.show(mode === 'relax'); }
function end() {
  if (state !== 'play') return;
  state = 'over'; rest.show(false); MG.sfx('win');
  const rec = mode === 'timed' ? MG.record('mole', score) : null;
  MG.panel({
    title: mode === 'timed' ? '時間到！' : '休息一下！',
    html: `<p>這次敲到</p><div class="big">${score} 分</div>` + (rec ? (rec.isNew && score > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best} 分</p>`) : `<p>玩了 ${mmss(t)}</p>`),
    buttons: [{ label: '再玩一次', on: () => start() }, { label: '換模式', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready';
  MG.choose({
    id: 'mole', title: '敲敲地鼠',
    html: `<p>地鼠跑出來偷吃菜了！金色地鼠分數多但跑得快，戴安全帽的要敲兩下，小白兔是好朋友<b>不要敲</b>！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・速度比較慢' }, { id: 'timed', label: '⏱ 45 秒挑戰', sub: '越後面越快' }],
    keys: '點地鼠就能敲　鍵盤：<kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> / <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd>　慢慢玩時按上面的「休息一下」結束',
    start: m => start(m),
  });
}
reset(); menu();
MG.loop(dt => { if (state === 'play') update(dt); else { t += dt; MG.fx.step(dt); } draw(); });
</script>
</body>
