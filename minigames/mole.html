<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="mini.css">
<style>

</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'mole', title: '敲敲地鼠', stats: ['score', 'time'] });
let W = 360, H = 520, land = false, HS = 1, RG = 128, CG = 110, LP = 160, GR = 3, GC = 3;   // HS: hole art scale, RG/CG: row/column gap, LP: landscape side panel width
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const ROUND = 45;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- levels ----------
// n: holes · goal: moles to whack · k: who pops up (weights) · sp: speed 0..1 · time: seconds in ⏱ mode
// pat: copy the pattern (first length, rounds) · color: how many hat colours · boss: the mole king's hearts · dbl: chance two pop at once
const LEVELS = [
  { name: '經典農場', classic: true, theme: 'farm', n: 9, mk: '🏆' },
  { name: '小小菜園', theme: 'farm', n: 3, goal: 8, k: { mole: 1 }, sp: 0.05, time: 40, mk: '🌱' },
  { name: '四個洞', theme: 'farm', n: 4, goal: 10, k: { mole: 1 }, sp: 0.15, time: 40 },
  { name: '金色地鼠', theme: 'farm', n: 6, goal: 12, k: { mole: 3, gold: 1 }, sp: 0.2, time: 40, mk: '⭐' },
  { name: '小白兔來玩', theme: 'farm', n: 6, goal: 12, k: { mole: 3, bunny: 1 }, sp: 0.25, time: 40, mk: '🐰' },
  { name: '安全帽地鼠', theme: 'garden', n: 6, goal: 12, k: { mole: 2, helmet: 1 }, sp: 0.25, time: 45, mk: '🪖' },
  { name: '跟著敲', theme: 'garden', n: 4, pat: { len: 2, rounds: 3 }, time: 60, mk: '🔁' },
  { name: '花園大混戰', theme: 'garden', n: 9, goal: 15, k: { mole: 4, gold: 1, bunny: 1 }, sp: 0.3, time: 45 },
  { name: '顏色帽子', theme: 'garden', n: 6, color: 2, goal: 10, sp: 0.25, time: 45, mk: '🎨' },
  { name: '地鼠大王', theme: 'farm', n: 9, boss: 6, k: { mole: 1 }, sp: 0.3, time: 60, mk: '👑' },
  { name: '再跟著敲', theme: 'garden', n: 9, pat: { len: 3, rounds: 4 }, time: 75, mk: '🔁' },
  { name: '敲兩下', theme: 'farm', n: 9, goal: 18, k: { mole: 3, helmet: 2, bunny: 1 }, sp: 0.4, time: 45, mk: '🪖' },
  { name: '月光帽子', theme: 'night', n: 9, color: 3, goal: 12, sp: 0.35, time: 50, mk: '🎨' },
  { name: '月光農場', theme: 'night', n: 9, goal: 20, k: { mole: 4, gold: 1, helmet: 1, bunny: 1 }, sp: 0.45, time: 45, mk: '🌙' },
  { name: '十二個洞', theme: 'night', n: 12, goal: 18, k: { mole: 4, gold: 1 }, sp: 0.4, time: 45 },
  { name: '月光跟著敲', theme: 'night', n: 6, pat: { len: 4, rounds: 4 }, time: 80, mk: '🔁' },
  { name: '帽子大集合', theme: 'garden', n: 12, color: 3, goal: 15, sp: 0.45, time: 50, mk: '🎨' },
  { name: '大王又來了', theme: 'farm', n: 12, boss: 8, k: { mole: 2, bunny: 1 }, sp: 0.45, time: 60, mk: '👑' },
  { name: '快快敲', theme: 'night', n: 12, goal: 24, k: { mole: 4, gold: 1, helmet: 1, bunny: 1 }, sp: 0.6, time: 45, dbl: 0.3, mk: '⚡' },
  { name: '記憶高手', theme: 'garden', n: 9, pat: { len: 5, rounds: 4 }, time: 90, mk: '🔁' },
  { name: '四種帽子', theme: 'night', n: 12, color: 4, goal: 16, sp: 0.5, time: 55, mk: '🎨' },
  { name: '地鼠滿滿', theme: 'farm', n: 12, goal: 28, k: { mole: 5, gold: 1, helmet: 2, bunny: 2 }, sp: 0.65, time: 50, dbl: 0.45, mk: '⚡' },
  { name: '超級大王', theme: 'night', n: 12, boss: 10, k: { mole: 2, helmet: 1, bunny: 1 }, sp: 0.6, time: 70, mk: '👑' },
  { name: '地鼠冠軍', theme: 'night', n: 12, goal: 30, k: { mole: 5, gold: 2, helmet: 2, bunny: 2 }, sp: 0.75, time: 50, dbl: 0.5, mk: '🏆' },
];
const THEME_E = { farm: '🥕', garden: '🌷', night: '🌙' };
// the first time a new kind of level shows up, a panel explains it once
const NEWS = {
  gold: ['⭐ 金色地鼠', '金色地鼠戴著小皇冠，跑得特別快，敲到可以拿很多分！'],
  bunny: ['🐰 小白兔', '小白兔是好朋友，拿著紅蘿蔔跑出來玩。<b>不要敲牠喔！</b>'],
  helmet: ['🪖 安全帽地鼠', '戴黃色安全帽的地鼠要<b>敲兩下</b>：第一下把帽子敲掉，第二下才算！'],
  pat: ['🔁 跟著敲', '地鼠會一隻一隻輪流探出頭，頭上有 1、2、3 的號碼。<b>記住順序</b>，等牠們都躲起來、木牌出現 👆 以後，照一樣的順序敲洞口！敲錯沒關係，牠們會再表演一次。'],
  color: ['🎨 顏色帽子', '地鼠戴著不同顏色的帽子。看看木牌上的帽子是什麼顏色，<b>只敲一樣顏色的</b>！木牌上的帽子有時候會換顏色喔。'],
  boss: ['👑 地鼠大王', '地鼠大王又大又調皮，敲一下就會躲到別的洞。把木牌上的愛心全部敲掉就過關！'],
};
const newsOf = L => L.classic ? [] : [L.k && L.k.gold && 'gold', L.k && L.k.bunny && 'bunny', L.k && L.k.helmet && 'helmet', L.pat && 'pat', L.color && 'color', L.boss && 'boss'].filter(Boolean);
const HATS = [{ c: '#ff4f5e', d: '#b8283a', s: 'heart' }, { c: '#3d8bff', d: '#1d4f9e', s: 'star' }, { c: '#ffd23f', d: '#b38400', s: 'dot' }, { c: '#3cc46a', d: '#1f7a3d', s: 'tri' }];

let level = 1, LV = LEVELS[0], bgC = null, bgK = '';
const holes = []; for (let i = 0; i < 9; i++) holes.push({ x: 0, y: 0, m: null });
// the field is spread over whatever shape the screen has; the grid (rows × columns) is picked to fit, holes grow when there is room
const SKY = () => land ? 46 : 92;
function gridFor(n, fw, fh) {
  const opts = { 3: [[3, 1], [1, 3]], 4: [[2, 2], [1, 4], [4, 1]], 6: [[3, 2], [2, 3]], 9: [[3, 3]], 12: [[4, 3], [3, 4]] }[n] || [[3, 3]];
  let best = opts[0], bs = 1e9;
  for (const [r, c] of opts) { const s = Math.abs(Math.log((fw / c) / (fh / r) / (land ? 1.25 : 0.86))); if (s < bs - 1e-6) { bs = s; best = [r, c]; } }
  return best;
}
function placeHoles() {
  const n = LV.n, sky = SKY();
  while (holes.length < n) holes.push({ x: 0, y: 0, m: null });
  holes.length = n;
  const fx0 = land ? LP + 5 : 10, fw = land ? W - LP - 10 : W - 20, fy0 = land ? sky + 6 : sky, fh = land ? H - sky - 12 : H - sky - 34;
  [GR, GC] = gridFor(n, fw, fh);
  RG = fh / GR; CG = fw / GC;
  HS = clamp(Math.min(RG / (land ? 92 : 128), CG / (land ? 118 : 110)), 0.6, 1.5);
  holes.forEach((h, i) => { const r = Math.floor(i / GC), c = i % GC; h.r = r; h.c = c; h.x = fx0 + CG * (c + 0.5); h.y = fy0 + RG * (r + 0.5) + RG * (land ? 0.16 : 0.2); });
  bgK = '';
}
cv.onfit = placeHoles;
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  land = asp > 1.15;
  if (land) { H = 350; W = Math.round(Math.min(1000, Math.max(520, H * asp))); }
  else { W = 360; H = Math.round(Math.min(860, Math.max(420, W / asp))); }
  return [W, H];
});
addEventListener('mg-big', () => { bgK = ''; });
const TS = () => MG.textScale, F = (px, w = 900) => `${w} ${Math.round(px * TS())}px system-ui,"Noto Sans TC","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
let mode = 'timed';
const progNow = () => mode === 'timed' ? 1 - left / ROUND : Math.min(0.5, t / 120);
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
const rest = MG.barButton('休息一下', () => end());
rest.el.innerHTML = '休息<span class="bx2">一下</span>';   // narrow phones in 大字模式 show just 休息
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
let score, left, spawnT, state = 'ready', pops = [], hits = [], t = 0, combo = 0, misses = 0;
let prog = 0, winT = 0, tcol = 0, colN = 0, boss = null, pat = null, flash = 0, flies = [];

function reset() {
  MG.fx.clear(); placeHoles(); for (const h of holes) { h.m = null; h.hint = 0; }
  score = 0; left = LV.classic ? ROUND : (LV.time || 45); spawnT = 0.6; pops = []; hits = []; t = 0; combo = 0; misses = 0;
  prog = 0; winT = 0; flash = 0; colN = 0; tcol = 0; boss = LV.boss ? { hp: LV.boss, max: LV.boss, t: 1.0 } : null; pat = null;
  if (LV.pat) { pat = { round: 0, rounds: LV.pat.rounds, seq: [], i: 0, phase: 'wait', t: 1.0, replay: false }; }
  flies = []; for (let i = 0; i < 9; i++) flies.push({ x: Math.random(), y: Math.random(), ph: Math.random() * 6 });
  hud();
}
const goalOf = () => LV.pat ? LV.pat.rounds : LV.boss ? LV.boss : LV.goal || 0;
function hud() { MG.stat('score', `${score} 分`); MG.stat('time', mode === 'timed' ? `⏱ ${Math.ceil(left)}` : `🐢 ${mmss(t)}`); }

// ---------- critters ----------
const STAY = { mole: 1.05, gold: 0.62, helmet: 1.35, bunny: 1.2, color: 1.25 };
const stayK = () => (1.3 - (LV.sp || 0) * 0.65) * (mode === 'relax' ? 1.4 : 1);
const gapK = () => (0.95 - (LV.sp || 0) * 0.45) * (mode === 'relax' ? 1.35 : 1);
const maxUp = () => (LV.n <= 4 ? (LV.n <= 3 ? 1 : 2) : LV.n <= 6 ? 2 : LV.n <= 9 ? 3 : 4) - (LV.boss ? 1 : 0);
function spawn() {   // 經典農場: the original endless mix that speeds up
  const free = holes.filter(h => !h.m); if (!free.length) return;
  const h = MG.pick(free), prog = progNow(), r = Math.random();
  let kind = 'mole';
  if (r < 0.12 + prog * 0.08) kind = 'bunny';
  else if (r < 0.22 + prog * 0.08) kind = 'gold';
  else if (r < 0.36 + prog * 0.1) kind = 'helmet';
  const stay = { mole: 1.05, gold: 0.62, helmet: 1.35, bunny: 1.2 }[kind] * (1 - prog * 0.38);
  h.m = { kind, up: 0, state: 'rise', stay, hp: kind === 'helmet' ? 2 : 1, hitT: 0 };
}
function pickKind(k) { let tot = 0; for (const n in k) tot += k[n]; let r = Math.random() * tot; for (const n in k) { r -= k[n]; if (r <= 0) return n; } return 'mole'; }
function spawnGoal() {
  const free = holes.filter(h => !h.m); if (!free.length) return;
  if (holes.filter(h => h.m && h.m.kind !== 'boss').length >= Math.max(1, maxUp())) return;
  const h = MG.pick(free);
  let kind, col = 0;
  if (LV.color) { kind = 'color'; col = Math.random() < 0.45 ? tcol : MG.randi(0, LV.color - 1); }
  else kind = pickKind(LV.k || { mole: 1 });
  h.m = { kind, col, up: 0, state: 'rise', stay: STAY[kind] * stayK(), hp: kind === 'helmet' ? 2 : 1, hitT: 0 };
}
function spawnBoss() {
  const free = holes.filter(h => !h.m); if (!free.length) return;
  const h = MG.pick(free);
  h.m = { kind: 'boss', up: 0, state: 'rise', stay: (1.75 - (LV.sp || 0) * 0.6) * (mode === 'relax' ? 1.4 : 1), hp: 1, hitT: 0 };
  snd('boing');
}
// 🔁 copy the pattern
const patLen = () => LV.pat.len + Math.floor(pat.round / 2);
const showStay = () => (0.8 - Math.min(0.2, patLen() * 0.03)) * (mode === 'relax' ? 1.3 : 1);
function patNew() {
  const n = patLen(), seq = [];
  for (let i = 0; i < n; i++) { let k; do k = MG.randi(0, holes.length - 1); while (seq.length && k === seq[seq.length - 1]); seq.push(k); }
  pat.seq = seq; pat.replay = false; patShow();
}
function patShow() { pat.phase = 'show'; pat.i = 0; pat.t = 0.55; for (const h of holes) h.m = null; }
function patStep(dt) {
  pat.t -= dt;
  if (pat.phase === 'show' && pat.t <= 0) {
    if (pat.i < pat.seq.length) {
      const h = holes[pat.seq[pat.i]], st = showStay();
      h.m = { kind: 'pat', num: pat.i + 1, up: 0, state: 'rise', stay: st, hp: 1, hitT: 0 };
      MG.sfx('match', pat.i + 1); pat.i++; pat.t = st + 0.42;
    } else { pat.phase = 'input'; pat.i = 0; MG.sfx('pop'); }
  } else if (pat.phase === 'wait' && pat.t <= 0) {
    if (pat.replay) patShow(); else patNew();
  }
}
function patTap(i) {
  if (pat.phase !== 'input') { MG.sfx('step'); return; }
  const h = holes[i];
  if (i === pat.seq[pat.i]) {
    h.m = { kind: 'pat', num: pat.i + 1, up: 0.5, state: 'rise', stay: 0.35, hp: 1, hitT: 0, ok: true };
    pat.i++; score += 10; MG.sfx('match', pat.i); snd('pop');
    MG.fx.burst(h.x, h.y - 30 * HS, { n: 10, colors: ['#ffd23f', '#fff3a0', '#8fe39a'], speed: 150, up: 90, size: 4, shape: 'star', life: 0.6 });
    if (pat.i >= pat.seq.length) {
      pat.round++; prog = pat.round; score += 20 * pat.seq.length;
      pops.push({ x: W / 2 + (land ? LP / 2 : 0), y: SKY() + 40, t: MG.praise(Math.min(5, pat.round + 1)), c: '#ff7a00', life: 1.2 });
      MG.sfx('yay'); snd('sparkle');
      if (pat.round >= pat.rounds) { winT = 0.9; pat.phase = 'done'; } else { pat.phase = 'wait'; pat.t = 1.3; }
    }
    hud();
  } else {
    MG.sfx('miss'); pops.push({ x: h.x, y: h.y - 70 * HS, t: MG.WORDS.oops, c: '#ff5a4e', life: 1 });
    holes[pat.seq[pat.i]].hint = 1.2;
    pat.phase = 'wait'; pat.t = 1.5; pat.replay = true; combo = 0;
  }
}

function update(dt) {
  t += dt; if (mode === 'timed') left -= dt; MG.fx.step(dt); flash = Math.max(0, flash - dt);
  for (const h of holes) h.hint = Math.max(0, (h.hint || 0) - dt);
  if (LV.classic) {
    const prog = progNow();
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); if (prog > 0.5 && Math.random() < 0.35) spawn(); spawnT = (0.72 - prog * 0.36) * MG.rand(0.7, 1.25); }
  } else if (pat) { if (!winT) patStep(dt); }
  else if (!winT) {
    spawnT -= dt;
    if (spawnT <= 0) { spawnGoal(); if (LV.dbl && Math.random() < LV.dbl) spawnGoal(); spawnT = gapK() * MG.rand(0.7, 1.25); }
    if (boss && !holes.some(h => h.m && h.m.kind === 'boss')) { boss.t -= dt; if (boss.t <= 0) spawnBoss(); }
  }
  for (const h of holes) {
    const m = h.m; if (!m) continue;
    if (m.state === 'rise') { m.up = Math.min(1, m.up + dt * 7); if (m.up >= 1) m.state = 'stay'; }
    else if (m.state === 'stay') { m.stay -= dt; if (m.stay <= 0) m.state = 'sink'; }
    else if (m.state === 'sink' || m.state === 'bonk') {
      if (m.state === 'bonk') { m.hitT += dt; if (m.hitT < (m.kind === 'boss' ? 0.45 : 0.25)) continue; }
      m.up -= dt * 6;
      if (m.up <= 0) {
        if (m.state === 'sink' && m.kind !== 'bunny' && m.kind !== 'pat' && !(m.kind === 'color' && m.col !== tcol)) { if (combo >= 3) { snd('miss'); pops.push({ x: h.x, y: h.y - 40 * HS, t: MG.WORDS.miss, c: '#7b8095', life: 0.8 }); } combo = 0; }
        if (m.kind === 'boss' && boss) boss.t = m.state === 'bonk' ? 0.5 : 0.7;
        h.m = null;
      }
    }
  }
  for (const p of pops) { p.y -= 36 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  for (const s of hits) s.life -= dt; hits = hits.filter(s => s.life > 0);
  if (winT) { winT -= dt; if (winT <= 0) { winT = 0; win(); return; } }
  else if (mode === 'timed' && left <= 0) { left = 0; if (LV.classic) end(); else fail(); }
  hud();
}
function goalHit(h) {
  prog++;
  if (prog >= goalOf()) { winT = 0.8; for (const o of holes) if (o !== h && o.m && o.m.state !== 'bonk') o.m.state = 'sink'; }
}
function whack(i, px, py) {
  if (state !== 'play' || winT || MG.panelOpen()) return;
  const h = holes[i]; if (!h) return;
  hits.push({ x: px ?? h.x, y: py ?? h.y - 30, life: 0.22 });
  if (pat) { patTap(i); return; }
  const m = h.m;
  if (!m || m.state === 'bonk' || m.up < 0.35) { MG.sfx('step'); return; }
  if (m.kind === 'bunny') {
    const loss = LV.classic ? 20 : 10;
    score = Math.max(0, score - loss); combo = 0; m.state = 'bonk'; m.hitT = 0; MG.sfx('miss'); MG.fx.burst(h.x, h.y - 40, { n: 8, colors: ['#ff8ac2', '#fff'], speed: 120, shape: 'star', size: 5 });
    pops.push({ x: h.x, y: h.y - 70 * HS, t: `No 🐰❌ −${loss}`, c: '#ff5a4e', life: 1 }); hud(); return;
  }
  if (m.kind === 'color' && m.col !== tcol) {   // wrong colour: it just ducks
    combo = 0; m.state = 'sink'; MG.sfx('boing'); MG.sfx('miss');
    pops.push({ x: h.x, y: h.y - 70 * HS, t: MG.WORDS.no, c: '#ff5a4e', life: 0.8 }); return;
  }
  if (m.kind === 'helmet' && m.hp > 1) { m.hp--; m.stay += 0.25; MG.sfx('hit'); snd('boing'); MG.fx.burst(h.x, h.y - 50, { n: 10, colors: ['#fff6a0', '#ffd23f', '#fff'], speed: 200, up: 80, size: 2.2, life: 0.4 }); pops.push({ x: h.x, y: h.y - 70 * HS, t: 'Clang! 🪖', c: '#7b8095', life: 0.5 }); return; }
  if (m.kind === 'boss') {
    boss.hp--; m.state = 'bonk'; m.hitT = 0; score += 30; shakeT = 0.25;
    MG.sfx('hit'); snd('boing'); MG.sfx('combo', boss.max - boss.hp);
    MG.fx.burst(h.x, h.y - 50 * HS, { n: 16, colors: ['#ffd23f', '#ff8ac2', '#fff'], speed: 220, up: 120, size: 5, shape: 'star', life: 0.7 });
    pops.push({ x: h.x, y: h.y - 90 * HS, t: boss.hp > 0 ? 'Bonk! 👑' : 'You win! 🎉', c: '#a050e0', life: 0.9 });
    prog = boss.max - boss.hp; if (boss.hp <= 0) { winT = 1.0; MG.sfx('yay'); for (const o of holes) if (o !== h && o.m) o.m.state = 'sink'; }
    hud(); return;
  }
  combo++;
  const base = { mole: 10, gold: 30, helmet: 20, color: 15 }[m.kind];
  const pts = base + Math.min(10, Math.floor(combo / 5) * 2);
  score += pts; m.state = 'bonk'; m.hitT = 0;
  if (m.kind === 'gold') { MG.sfx('coin'); snd('sparkle'); } else { MG.sfx('hit'); snd('pop'); }

  x.fillText(keyOf(h).toUpperCase(), hx + 44, hy + 14);
  x.restore();
}
function drawCritter(m, cx, top) {
  const bonk = m.state === 'bonk', wob = bonk ? Math.sin(m.hitT * 40) * 2 : 0;
  cx += wob;
  if (m.kind === 'bunny') {
    for (const sd of [-1, 1]) {
      x.fillStyle = '#fff'; x.strokeStyle = '#cfc3d8'; x.lineWidth = 2;
      x.beginPath(); x.ellipse(cx + sd * 11, top - 8, 7.5, 23, sd * 0.18, 0, 7); x.fill(); x.stroke();
      x.fillStyle = '#ffc2d4'; x.beginPath(); x.ellipse(cx + sd * 11, top - 6, 3.5, 16, sd * 0.18, 0, 7); x.fill();
    }
    const bg = x.createRadialGradient(cx - 8, top + 18, 4, cx, top + 30, 34); bg.addColorStop(0, '#ffffff'); bg.addColorStop(1, '#e4dcec');
    x.fillStyle = bg; x.strokeStyle = '#cfc3d8'; x.lineWidth = 2; x.beginPath(); x.ellipse(cx, top + 30, 28, 30, 0, 0, 7); x.fill(); x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.ellipse(cx, top + 38, 13, 9, 0, 0, 7); x.fill();
    face(cx, top + 24, bonk, '#ff8fb0', true);
    // carrot in paw
    x.save(); x.translate(cx + 20, top + 44); x.rotate(-0.5);
    x.fillStyle = '#ff8a1c'; x.beginPath(); x.moveTo(-4, 0); x.lineTo(4, 0); x.lineTo(0, 16); x.fill(); x.strokeStyle = '#3aa845'; x.lineWidth = 2; x.beginPath(); x.moveTo(0, 0); x.lineTo(-3, -6); x.moveTo(0, 0); x.lineTo(3, -6); x.stroke(); x.restore();
    return;
  }
  const boss = m.kind === 'boss';
  if (boss) { x.save(); x.translate(cx, top + 70); x.scale(1.28, 1.28); x.translate(-cx, -top - 70); top -= 6; }
  const gold = m.kind === 'gold';
  const body = gold ? ['#fff0a0', '#ffcf33', '#c99a00'] : boss ? ['#b88a62', '#8a5d3a', '#553419'] : ['#c79a6a', '#a77447', '#6e4724'];
  if (boss) { // red cape behind the king
    x.fillStyle = '#d63a4a'; x.strokeStyle = '#8e1f2c'; x.lineWidth = 2; x.beginPath(); x.moveTo(cx - 30, top + 30); x.quadraticCurveTo(cx - 44, top + 70, cx - 36, top + 80); x.lineTo(cx + 36, top + 80); x.quadraticCurveTo(cx + 44, top + 70, cx + 30, top + 30); x.closePath(); x.fill(); x.stroke();
  }
  // ears
  x.fillStyle = body[1]; x.strokeStyle = body[2]; x.lineWidth = 2;
  for (const sd of [-1, 1]) { x.beginPath(); x.arc(cx + sd * 21, top + 6, 7, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#e8a8a0'; x.beginPath(); x.arc(cx + sd * 21, top + 6, 3.5, 0, 7); x.fill(); x.fillStyle = body[1]; }
  const g = x.createRadialGradient(cx - 10, top + 14, 3, cx, top + 34, 38); g.addColorStop(0, body[0]); g.addColorStop(0.6, body[1]); g.addColorStop(1, body[2]);
  x.fillStyle = g; x.strokeStyle = body[2]; x.lineWidth = 2.5; x.beginPath(); x.ellipse(cx, top + 34, 30, 34, 0, 0, 7); x.fill(); x.stroke();
  // muzzle
  x.fillStyle = gold ? '#fff6cf' : '#f0d4b0'; x.beginPath(); x.ellipse(cx, top + 36, 17, 13, 0, 0, 7); x.fill();
  face(cx, top + 24, bonk, '#ff6f7f', false);
  // whiskers + teeth
  x.strokeStyle = 'rgba(60,40,20,.55)'; x.lineWidth = 1;
  for (const sd of [-1, 1]) for (const dy of [-2, 2]) { x.beginPath(); x.moveTo(cx + sd * 10, top + 35 + dy); x.lineTo(cx + sd * 25, top + 33 + dy * 2.5); x.stroke(); }
  x.fillStyle = '#fff'; x.strokeStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.roundRect(cx - 4, top + 41, 3.6, 5, 1); x.roundRect(cx + 0.4, top + 41, 3.6, 5, 1); x.fill(); x.stroke();
  if (boss) {   // curly moustache + big crown
    x.strokeStyle = '#3a2410'; x.lineWidth = 3; x.lineCap = 'round';
    for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(cx, top + 39); x.quadraticCurveTo(cx + sd * 10, top + 34, cx + sd * 15, top + 39); x.quadraticCurveTo(cx + sd * 18, top + 43, cx + sd * 14, top + 44); x.stroke(); }
    x.fillStyle = '#ffd23f'; x.strokeStyle = '#b38400'; x.lineWidth = 2; x.beginPath(); x.moveTo(cx - 18, top + 6); x.lineTo(cx - 20, top - 14); x.lineTo(cx - 9, top - 4); x.lineTo(cx, top - 18); x.lineTo(cx + 9, top - 4); x.lineTo(cx + 20, top - 14); x.lineTo(cx + 18, top + 6); x.closePath(); x.fill(); x.stroke();
    for (const [gx, gc] of [[-11, '#ff4f5e'], [0, '#3d8bff'], [11, '#3cc46a']]) { x.fillStyle = gc; x.beginPath(); x.arc(cx + gx, top + 1, 2.6, 0, 7); x.fill(); }
  }
  if (gold) {
    x.fillStyle = '#fff'; for (const [sx2, sy2, ph] of [[24, 0, 0], [-26, 18, 2], [18, 48, 4]]) { const k2 = (Math.sin(t * 6 + ph) + 1) / 2; x.globalAlpha = k2; x.font = `${8 + k2 * 6}px sans-serif`; x.fillText('✦', cx + sx2, top + sy2); }
    x.globalAlpha = 1;
    // tiny crown
    x.fillStyle = '#ffd23f'; x.strokeStyle = '#b38400'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(cx - 10, top + 2); x.lineTo(cx - 10, top - 8); x.lineTo(cx - 5, top - 2); x.lineTo(cx, top - 10); x.lineTo(cx + 5, top - 2); x.lineTo(cx + 10, top - 8); x.lineTo(cx + 10, top + 2); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = '#ff4f5e'; x.beginPath(); x.arc(cx, top - 3, 1.8, 0, 7); x.fill();
  }
  if (m.kind === 'color') {   // knitted hat in the colour (with a white sign on it)
    const hh = HATS[m.col];
    x.fillStyle = hh.c; x.strokeStyle = hh.d; x.lineWidth = 2;
    x.beginPath(); x.arc(cx, top + 14, 27, Math.PI, 0); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.roundRect(cx - 30, top + 9, 60, 9, 4); x.fill(); x.stroke();
    x.beginPath(); x.arc(cx, top - 14, 6, 0, 7); x.fill(); x.stroke();
    sym(hh.s, cx, top - 1, 8, '#fff');
  }
  if (m.kind === 'pat') {   // number badge: 1, 2, 3 …
    x.fillStyle = m.ok ? '#3cc46a' : '#ff7a00'; x.strokeStyle = '#fff'; x.lineWidth = 3; x.beginPath(); x.arc(cx, top - 10, 13, 0, 7); x.fill(); x.stroke();
    x.fillStyle = '#fff'; x.font = '900 17px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(m.num), cx, top - 9);
  }
  if (m.kind === 'helmet' && m.hp > 1) {   // miner helmet with lamp
    const hg = x.createLinearGradient(0, top - 12, 0, top + 18); hg.addColorStop(0, '#ffe680'); hg.addColorStop(1, '#e8a800');
    x.fillStyle = hg; x.strokeStyle = '#a87800'; x.lineWidth = 2;
    x.beginPath(); x.arc(cx, top + 18, 29, Math.PI, 0); x.lineTo(cx + 34, top + 20); x.lineTo(cx - 34, top + 20); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = '#d99a00'; x.fillRect(cx - 34, top + 16, 68, 5);
    x.fillStyle = '#fff'; x.strokeStyle = '#a87800'; x.beginPath(); x.arc(cx, top + 2, 7, 0, 7); x.fill(); x.stroke();
    x.fillStyle = 'rgba(255,255,180,.85)'; x.beginPath(); x.arc(cx, top + 2, 4, 0, 7); x.fill();
    x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(cx - 14, top - 2, 7, 3, -0.6, 0, 7); x.fill();
  } else if (m.kind === 'helmet') {   // dented helmet fell off: show a bandage
    x.fillStyle = '#fff2d6'; x.save(); x.translate(cx + 12, top + 10); x.rotate(0.5); x.fillRect(-9, -3, 18, 6); x.restore();
  }
  if (bonk) { // stars circling the head
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (let j = 0; j < 3; j++) { const a = t * 6 + j * 2.1; x.fillStyle = '#ffd34d'; x.font = '15px sans-serif'; x.fillText('★', cx + Math.cos(a) * 24, top - 6 + Math.sin(a) * 6); }
  }
  if (boss) x.restore();
}
function face(cx, cy, bonk, nose, bunny) {
  x.fillStyle = '#2a1c10'; x.strokeStyle = '#2a1c10'; x.lineWidth = 2.2; x.lineCap = 'round';
  if (bonk) { for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(cx + sd * 12 - 4, cy - 4); x.lineTo(cx + sd * 12 + 4, cy + 4); x.moveTo(cx + sd * 12 + 4, cy - 4); x.lineTo(cx + sd * 12 - 4, cy + 4); x.stroke(); } }
  else for (const sd of [-1, 1]) {
    x.fillStyle = '#2a1c10'; x.beginPath(); x.ellipse(cx + sd * 12, cy, 4.2, 5, 0, 0, 7); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(cx + sd * 12 - 1.3, cy - 1.8, 1.6, 0, 7); x.fill();
  }
  x.fillStyle = 'rgba(255,120,140,.45)'; for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(cx + sd * 19, cy + 8, 5, 3, 0, 0, 7); x.fill(); }
  x.fillStyle = nose; x.beginPath(); x.ellipse(cx, cy + 9, bunny ? 4 : 6, bunny ? 3 : 4.5, 0, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(cx - 1.5, cy + 7.5, 1.4, 0, 7); x.fill();
}

// ---------- flow ----------
function setLevel(n) { level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; placeHoles(); }
function start(m, lv) {
  if (m) mode = m; if (lv) setLevel(lv);
  reset(); state = 'play'; MG.hide(); rest.show(mode === 'relax');
  const fresh = newsOf(LV).filter(k => !MG.store.get('mole.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('mole.seen.' + k, true));
    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function end() {   // 經典農場 time up, or 休息一下
  if (state !== 'play') return;
  state = 'over'; rest.show(false); MG.sfx('win'); if (score > 0) MG.sfx('yay');
  const rec = LV.classic && mode === 'timed' ? MG.record('mole', score) : null;
  MG.panel({
    title: mode === 'timed' ? '時間到！' : '休息一下！',
    html: `<p>這次敲到</p><div class="big">${score} 分</div>` + (rec ? (rec.isNew && score > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best} 分</p>`) : `<p>玩了 ${mmss(t)}</p>`) + (!LV.classic ? `<p>${LV.name}：${prog} / ${goalOf()}</p>` : ''),
    buttons: [{ label: '再玩一次', on: () => start() }, { label: '選關卡', alt: true, on: menu }],
  });
}
function cleared() { const c = MG.store.get('mole.clear', []); return Array.isArray(c) ? c : []; }
function win() {
  if (state !== 'play') return;
  state = 'over'; rest.show(false); MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const c = cleared(); if (!c.includes(level)) { c.push(level); MG.store.set('mole.clear', c); }
  MG.fx.burst(W / 2, H * 0.4, { n: 50, colors: ['#ffd23f', '#ff8ac2', '#8fd0ff', '#8fe39a'], shape: 'star', speed: 320, up: 180, size: 7 });
  const next = level < LEVELS.length ? LEVELS[level] : null;
  setTimeout(() => { if (state !== 'over') return; MG.panel({
    title: `第 ${level} 關過關！`,
    html: `<div class="big">${score} 分</div><p>${LV.name} 完成 ^_^</p>` + (next ? `<p>下一關：${THEME_E[next.theme]} ${next.name}</p>` : '<p>你是敲地鼠冠軍！</p>'),
    buttons: [...(next ? [{ label: '下一關', on: () => { MG.store.set('mole.pickLevel', level + 1); start(null, level + 1); } }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
  }); }, 700);
}
function fail() {
  if (state !== 'play') return;
  state = 'over'; rest.show(false); MG.sfx('over');
  MG.panel({
    title: '時間到！',
    html: `<p>敲到</p><div class="big">${prog} / ${goalOf()}</div><p>差一點點！再試一次吧</p><p>🐢 慢慢玩沒有時間限制喔</p>`,
    buttons: [{ label: '再試一次', on: () => start() }, { label: '🐢 慢慢玩這關', alt: true, on: () => { MG.store.set('mole.pickMode', 'relax'); start('relax'); } }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; rest.show(false);
  const done = cleared();
  MG.choose({
    id: 'mole', title: '敲敲地鼠',
    html: `<p>地鼠跑出來偷吃菜了！金色地鼠分數多但跑得快，戴安全帽的要敲兩下，小白兔是好朋友<b>不要敲</b>！</p><p>第 1 關是經典玩法；後面每關敲到木牌上的數量就過關，還有 🔁 跟著敲、🎨 顏色帽子、👑 地鼠大王，洞也會越來越多！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・速度比較慢' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '經典 45 秒・越後面越快' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${THEME_E[LEVELS[n - 1].theme]} ${LEVELS[n - 1].name}${done.includes(n) ? ' ✓' : ''}）`, short: n => `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '點地鼠就能敲　鍵盤：<kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> / <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd>（洞多的時候還有 <kbd>R</kbd><kbd>F</kbd><kbd>V</kbd>…）　慢慢玩時按上面的「休息一下」結束',
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),
  });
}
setLevel(Math.min(MG.store.get('mole.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => { if (state === 'play' && !MG.panelOpen()) update(dt); else { t += dt; MG.fx.step(dt); } draw(); });

// ---------- hook for automated tests ----------
window.MOLE = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get prog() { return prog; }, get goal() { return goalOf(); }, get score() { return score; },
  get grid() { return [GR, GC, HS]; }, levels: LEVELS.length,
  holes: () => holes.map(h => ({ x: h.x, y: h.y, m: h.m && { kind: h.m.kind, up: h.m.up, st: h.m.state, col: h.m.col, hp: h.m.hp } })),
  get tcol() { return tcol; }, get boss() { return boss && { ...boss }; }, get pat() { return pat && { phase: pat.phase, seq: pat.seq.slice(), i: pat.i, round: pat.round }; },
  start: (lv, m = 'relax') => start(m, lv), whack: i => whack(i), step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play') update(dt); },
  toClient(i) { const h = holes[i], rc = cv.getBoundingClientRect(), B = 3, ly = h.y - 28 * HS; return { x: rc.left + B + h.x * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  menu: () => menu(),
};
</script>
