const COS = { farm: ['bandana', 'glasses', 'flower', 'bow'], garden: ['flower', 'bow', 'glasses', 'scarf'], night: ['bow', 'glasses', 'scarf'], beach: ['sunglasses', 'lei', 'glasses', 'flower'], snow: ['scarf', 'muffs', 'glasses', 'bow'], candy: ['lolly', 'bow', 'glasses', 'flower'], lantern: ['bow', 'scarf', 'glasses', 'flower'] };

let level = 1, LV = LEVELS[0], C = LV, si = 0, bgC = null, bgK = '';
const holes = [];
const TOPH = () => land ? 50 : (H >= 640 ? 112 : 98);
const BOTH = () => land ? 0 : (H >= 640 ? 62 : 50);
function gridFor(n, fw, fh) {
  const opts = { 3: [[3, 1], [1, 3]], 4: [[2, 2], [1, 4], [4, 1]], 5: [[2, 3], [3, 2]], 6: [[3, 2], [2, 3]], 8: [[2, 4], [4, 2]], 9: [[3, 3]], 12: [[4, 3], [3, 4]] }[n] || [[Math.ceil(n / 3), 3]];
  let best = opts[0], bs = 1e9;
  for (const [r, c] of opts) { const s = -Math.min(fw / c / 106, fh / r / 98); if (s < bs - 1e-6) { bs = s; best = [r, c]; } }   // the grid that gives the biggest holes
  return best;
}
// normalised hole spots (u,v in 0..1) for the level's layout; rows of holes fill the field
function layoutPts(n, kind, fw, fh) {
  const pts = [];
  if (kind === 'ring') {
    const mid = n >= 7, m = mid ? n - 1 : n;
    for (let i = 0; i < m; i++) { const a = -PI / 2 + i * 2 * PI / m; pts.push({ u: 0.5 + 0.5 * Math.cos(a), v: 0.5 + 0.5 * Math.sin(a), row: -1 }); }
    if (mid) pts.push({ u: 0.5, v: 0.5, row: -1 });
    return pts;
  }
  let rows = kind === 'diamond' ? { 4: [1, 2, 1], 5: [2, 1, 2], 6: [1, 2, 2, 1], 8: [1, 2, 2, 2, 1], 9: [1, 2, 3, 2, 1], 12: [2, 3, 2, 3, 2] }[n] : null, tr = false;
  if (rows && land) tr = true;   // landscape: lay the diamond on its side
  if (!rows) { const [r, c] = gridFor(n, fw, fh); rows = []; let left = n; for (let i = 0; i < r; i++) { rows.push(Math.min(c, left)); left -= c; } }
  const R = rows.length, M = Math.max(...rows);
  rows.forEach((k, r) => {
    for (let c = 0; c < k; c++) {
      let u = M === 1 ? 0.5 : (c + (M - k) / 2) / (M - 1), v = R === 1 ? 0.5 : r / (R - 1);
      if (kind === 'stag' && M > 1 && R > 1) u = 0.12 + u * 0.76 + (r % 2 ? 0.12 : -0.12);
      if (kind === 'arc' && M > 1) v += (R === 1 ? 0.3 : 0.5 / (R - 1)) * (0.25 - (u - 0.5) * (u - 0.5)) * -1.2;
      pts.push(tr ? { u: v, v: u, row: -1 } : { u, v, row: r });
    }

}
function placeHoles() {
  const n = C.n || 9, kind = C.lay || 'grid';
  while (holes.length < n) holes.push({ x: 0, y: 0, bx: 0, by: 0, m: null });
  holes.length = n;
  const fx0 = land ? LP + 4 : 4, fx1 = W - 4, fy0 = land ? TOPH() - 8 : TOPH() - 4, fy1 = H - BOTH() - (land ? 4 : 2);
  const fw = fx1 - fx0, fh = fy1 - fy0;
  const pts = layoutPts(n, kind, fw, fh);
  const us = pts.map(p => p.u), vs = pts.map(p => p.v), u0 = Math.min(...us), u1 = Math.max(...us), v0 = Math.min(...vs), v1 = Math.max(...vs);
  let hs = 1, amp = 0;
  for (let it = 0; it < 5; it++) {
    amp = C.move ? fw * 0.11 * C.move : 0;
    const ax = fx0 + 54 * hs + amp, bx = fx1 - 54 * hs - amp, ay = fy0 + 76 * hs, by = fy1 - (C.move ? 36 : 20) * hs;
    pts.forEach(p => { p.x = u1 > u0 ? ax + (p.u - u0) / (u1 - u0) * (bx - ax) : (ax + bx) / 2; p.y = v1 > v0 ? ay + (p.v - v0) / (v1 - v0) * (by - ay) : (ay + by) / 2; });
    let best = Math.min(1.45, (fy1 - fy0) / 100, (fx1 - fx0) / 112);
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {

      best = Math.min(best, need);
    }
    hs = clamp(best, 0.5, 1.45);
  }

  const byRow = pts.every(p => p.row >= 0), same = (a, b) => byRow ? a.row === b.row : Math.abs(a.y - b.y) < 22 * HS;
  pts.sort((a, b) => (same(a, b) ? a.x - b.x : a.y - b.y));
  holes.forEach((h, i) => { const p = pts[i]; h.bx = h.x = p.x; h.by = h.y = p.y; h.amp = amp; h.ph = 0; });

  let rows = [], cur = null;
  holes.forEach((h, i) => { if (!cur || !same(pts[i], cur.p)) { cur = { y: h.y, p: pts[i], hs: [] }; rows.push(cur); } cur.hs.push(h); });
  const RK = ['qwer', 'asdf', 'zxcv', 'uiop', 'jkl;'], flat = '1234567890-=';

  else holes.forEach((h, i) => { h.key = flat[i] || ''; h.row = i; });
  rows.forEach((r, ri) => r.hs.forEach(h => { h.dir = ri % 2 ? -1 : 1; h.rowi = ri; }));
  holes.rows = rows.map(r => r.y);
  bgK = '';
}

  if (state !== 'play') return;
  state = 'over'; rest.show(false); MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const c = cleared(); if (!c.includes(level)) { c.push(level); MG.store.set('mole.clear', c); }
  // everyone pops out to cheer, confetti in the colours of this scene
  holes.forEach(h => { h.m = newM('mole', { state: 'cheer', up: 1, cos: costume() }); });
  celeb = 0.001; cele = [];
  MG.fx.burst(midPos().x, H * 0.4, { n: 50, colors: ['#ffd23f', '#ff8ac2', '#8fd0ff', '#8fe39a'], shape: 'star', speed: 320, up: 180, size: 7 });
  const next = level < LEVELS.length ? LEVELS[level] : null;
  setTimeout(() => { if (state !== 'over') return; MG.panel({
    title: `第 ${level} 關過關！`,
    html: `<div class="big">${score} 分</div><p>${THEMES[C.theme].e} ${LV.name} 完成 ^_^</p>` + (next ? `<p>下一關：${THEMES[themeOf(next)].e} ${next.name}</p>` : '<p>你是敲地鼠超級冠軍！🏆</p>'),
    buttons: [...(next ? [{ label: '下一關', on: () => { MG.store.set('mole.pickLevel', level + 1); start(null, level + 1); } }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
  }); }, 900);
}
function fail() {
  if (state !== 'play') return;
  state = 'over'; rest.show(false); MG.sfx('over');
  MG.panel({
    title: '時間到！',
    html: `<p>敲到</p><div class="big">${prog} / ${goalOf()}</div>${LV.stages ? `<p>走到第 ${si + 1} / ${LV.stages.length} 段</p>` : ''}<p>差一點點！再試一次吧</p><p>🐢 慢慢玩沒有時間限制喔</p>`,
    buttons: [{ label: '再試一次', on: () => start() }, { label: '🐢 慢慢玩這關', alt: true, on: () => { MG.store.set('mole.pickMode', 'relax'); start('relax'); } }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; rest.show(false); celeb = 0; cele = [];
  for (const h of holes) h.m = null;
  const done = cleared();
  MG.choose({
    id: 'mole', title: '敲敲地鼠',
    html: `<p>地鼠跑出來搗蛋了！金色地鼠分數多但跑得快，戴安全帽的要敲兩下，小白兔是好朋友<b>不要敲</b>！</p><p>${LEVELS.length} 關、7 個場景：農場、花園、月光、🏖️ 沙灘城堡、❄️ 雪地、🍭 糖果國、🏮 燈籠夜。還有 🔁 跟著敲、🎨 顏色帽子、👑 地鼠大王、🎩 只敲戴帽子的、🐣 保護好朋友、🎠 會跑的洞、🎵 跟著節拍敲，最後是 🎪 大會串！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・速度比較慢' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '經典 45 秒・越後面越快' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${THEMES[themeOf(LEVELS[n - 1])].e} ${LEVELS[n - 1].name}${done.includes(n) ? ' ✓' : ''}）`, short: n => `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '點地鼠就能敲　鍵盤：<kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> / <kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd>（洞口旁邊有小字母）　慢慢玩時按上面的「休息一下」結束',
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),
  });
}
setLevel(Math.min(MG.store.get('mole.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => { if (state === 'play' && !MG.panelOpen()) update(dt); else { t += dt; MG.fx.step(dt); } celeStep(dt); draw(); });

// ---------- hook for automated tests ----------
// good(): holes that are right to whack now (what a perfect player would tap)
function goodHoles() {
  if (pat) return pat.phase === 'input' ? [pat.seq[pat.i]] : [];
  return holes.map((h, i) => i).filter(i => { const m = holes[i].m; if (!m || m.state === 'bonk' || m.state === 'wait' || m.state === 'sink' || m.up < 0.5) return false; return !['bunny', 'friend', 'decoy', 'cheer'].includes(m.kind) && !(m.kind === 'color' && m.col !== tcol) && m.state !== 'cheer'; });
}
window.MOLE = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get prog() { return prog; }, get goal() { return goalOf(); }, get score() { return score; },
  get grid() { return [holes.length, C.lay || 'grid', HS]; }, levels: LEVELS.length, get stage() { return si; }, get stages() { return LV.stages ? LV.stages.length : 1; }, get theme() { return C.theme; },
  holes: () => holes.map(h => ({ x: h.x, y: h.y, key: h.key, m: h.m && { kind: h.m.kind, up: h.m.up, st: h.m.state, col: h.m.col, hp: h.m.hp, hat: h.m.hat, cos: h.m.cos, fk: h.m.fk, tgt: h.m.tgt, bal: h.m.bal, rh: !!h.m.rh } })),
  get tcol() { return tcol; }, get boss() { return boss && { ...boss }; }, get pat() { return pat && { phase: pat.phase, seq: pat.seq.slice(), i: pat.i, round: pat.round }; }, get rh() { return rh && { beat: rh.beat, per: rh.per }; },
  good: () => goodHoles(),
  start: (lv, m = 'relax') => start(m, lv), whack: i => whack(i), step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play') update(dt); },
  win() { if (state === 'play') { winT = 0; win(); } },
  toClient(i) { const h = holes[i], rc = cv.getBoundingClientRect(), B = 3, ly = h.y - 28 * HS; return { x: rc.left + B + h.x * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  menu: () => menu(),
};
</script>
