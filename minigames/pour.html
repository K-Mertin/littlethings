<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>彩虹倒水瓶</title>
<link rel="stylesheet" href="mini.css">
<style>.mg-stage{padding:6px}</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'pour', title: '彩虹倒水瓶', stats: ['level', 'moves'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
let land = false;

// ---------- data ----------
const COLORS = ['#ff4d5e', '#ff9f1c', '#ffd93d', '#45c95f', '#3d8bff', '#9b5cff', '#ff73c0', '#8b5a2b', '#36d6d0', '#b6e03a', '#23358f', '#68707f', '#1d7a46', '#2b2b33'];
const HIDDEN = '#c9d1de';           // colour of a ❓ layer that hasn't been seen yet
const SHAPES = ['dot', 'star', 'tri', 'heart', 'square', 'diamond', 'moon', 'plus', 'ring', 'drop', 'cross', 'hex', 'bolt', 'flower'];
// [colours, units per bottle, empty bottles = 2, mystery = false]
// mystery: only the top layer of each bottle can be seen; the ❓ layers show up when they reach the top
// from 21 on, "same difficulty, different way to play" twists (an object adds them):
//   small: the empty bottles only hold that many 🥛 · one: thin-neck bottles pour one layer at a time 💧
//   tag: every bottle has a colour label and only finishes with that colour 🏷️ · lock: one bottle is chained 🔒 until the first bottle is finished
const LEVELS = [[3, 3], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [5, 5], [8, 4], [7, 5], [9, 4], [8, 5], [10, 5],
  [5, 4, 1], [6, 4, 2, true], [11, 5], [8, 6], [8, 5, 2, true], [13, 5], [10, 6, 2, true], [14, 6],
  [5, 4, 2, false, { small: 2 }], [5, 4, 2, false, { one: true }], [4, 4, 2, false, { tag: true }], [6, 4, 2, false, { lock: true }],
  [7, 4, 3, false, { small: 2 }], [7, 4, 2, false, { one: true }], [5, 4, 2, false, { tag: true }], [8, 4, 2, false, { lock: true }],
  [6, 5, 2, true, { small: 3 }], [7, 4, 2, false, { one: true, lock: true }], [6, 4, 2, false, { tag: true }], [8, 5, 2, true, { lock: true }],
  [12, 6], [8, 4, 1], [12, 6, 2, true], [14, 7]];
const LV = n => { const [c, k, e = 2, m = false, o = {}] = LEVELS[n - 1]; return { c, k, e, m, small: o.small || 0, one: !!o.one, tag: !!o.tag, lock: !!o.lock }; };
const lvName = n => { const L = LV(n); return `${L.c}色×${L.k}格${L.e < 2 ? '・1空瓶' : ''}${L.m ? '・❓' : ''}${L.small ? '・🥛小瓶' : ''}${L.one ? '・💧細口' : ''}${L.tag ? '・🏷️標籤' : ''}${L.lock ? '・🔒鎖' : ''}`; };
const BW = 52, UH = 30, NECK = 16;

let bottles = [], hid = [], gone = [], cap = 4, level = 1, mode = 'shape', state = 'menu';
let hintPlan = null, sel = -1, moves = 0, hist = [], anim = null, puzzle = null, extraUsed = false, downOn = -1;
let fade = [], shake = [], hint = null, t = 0, pos = [], scale = 1, btns = [], floats = [], doneN = 0;

// ---------- rules ----------
const topOf = b => b[b.length - 1];
// R: the rules of the current puzzle — k layers per colour, caps per bottle, one-layer pours, colour labels (-1 = none), the locked bottle
let R = { k: 4, caps: [], one: false, tags: null, lock: -1 }, lockOpen = true;
const capOf = (rs, j) => rs.caps[j] ?? rs.k;
const done1 = (b, i, rs = R) => b.length === rs.k && b.every(v => v === b[0]) && (!rs.tags || rs.tags[i] === b[0]);
const full1 = (b, i) => done1(b, i);
function canPour(bs, i, j, rs = R, open = lockOpen) {
  const a = bs[i], b = bs[j];
  if (i === j || !a.length || b.length >= capOf(rs, j) || (b.length && topOf(b) !== topOf(a))) return false;
  if (rs.lock >= 0 && !open && (i === rs.lock || j === rs.lock)) return false;
  return true;
}
function runLen(b) { let k = 1; while (k < b.length && b[b.length - 1 - k] === topOf(b)) k++; return k; }
const pourAmount = (bs, i, j, rs = R) => rs.one ? 1 : Math.min(runLen(bs[i]), capOf(rs, j) - bs[j].length);
function pourInto(bs, i, j, rs = R) { const k = pourAmount(bs, i, j, rs); for (let n = 0; n < k; n++) bs[j].push(bs[i].pop()); return k; }

// depth-first search with memo: used to make sure every puzzle can be solved, and for the 💡 hint
function solve(start, rs = R, open0 = lockOpen, limit = 80000) {
  const seen = new Set(); let nodes = 0;
  // labels, a lock or different sizes make bottle positions matter; otherwise bottles are interchangeable
  const positional = !!rs.tags || rs.lock >= 0 || rs.caps.some(c => c !== rs.k);
  const key = (bs, open) => (positional ? bs.map(b => b.join(',')).join('|') : bs.map(b => b.join(',')).sort().join('|')) + (open ? '+' : '-');
  const done = bs => bs.every((b, i) => b.length === 0 || done1(b, i, rs));
  const path = [];
  const dfs = (bs, open) => {
    if (done(bs)) return true;
    if (++nodes > limit) return false;
    const k = key(bs, open); if (seen.has(k)) return false; seen.add(k);
    for (let i = 0; i < bs.length; i++) {
      const a = bs[i]; if (!a.length || done1(a, i, rs)) continue;
      const uniform = a.every(v => v === a[0]), prune = !rs.tags && !rs.one;
      const tried = new Set();
      for (let j = 0; j < bs.length; j++) {
        if (!canPour(bs, i, j, rs, open)) continue;
        if (!bs[j].length) { const ck = capOf(rs, j) + (rs.tags ? ':' + j : ''); if ((prune && uniform) || tried.has(ck)) continue; tried.add(ck); }
        const nb = bs.map(b => b.slice()); pourInto(nb, i, j, rs);
        path.push([i, j]);
        if (dfs(nb, open || done1(nb[j], j, rs))) return true;
        path.pop();
      }
    }
    return false;
  };
  return dfs(start.map(b => b.slice()), open0) ? path : null;
}
// returns { b: bottles, rs: rules } — only puzzles the solver could finish
function makePuzzle(nc, c, empties = 2, L = {}) {
  let last = null;
  const hard = empties < 2 || L.tag || L.lock || L.small || L.one;
  for (let tries = 0; tries < (hard ? 400 : 80); tries++) {
    const units = MG.shuffle(Array.from({ length: nc * c }, (_, i) => i % nc));
    const bs = Array.from({ length: nc }, (_, i) => units.slice(i * c, (i + 1) * c));
    if (bs.some(b => b.every(v => v === b[0]))) continue;              // nothing already finished
    for (let k = 0; k < empties; k++) bs.push([]);
    const rs = { k: c, caps: bs.map((b, i) => i >= nc && L.small ? L.small : c), one: !!L.one, tags: null, lock: -1 };
    if (L.tag) rs.tags = MG.shuffle(Array.from({ length: nc }, (_, i) => i)).concat(Array(empties).fill(-1));
    if (L.lock) rs.lock = MG.randi(0, nc - 1);
    last = { b: bs, rs };
    if (solve(bs, rs, !L.lock, hard ? 60000 : 40000)) return last;
  }
  return last;
}

// ---------- layout ----------
const bh = (c = cap) => c * UH + 10;                  // body height (local units) of a bottle that holds c layers
const BH = i => bh(capOf(R, i));
let U = 1;
function layout() {
  const W = cv.lw, H = cv.lh, n = bottles.length, g = 10;
  U = Math.max(1, Math.min(1.5, Math.min(W, H) / 420)) * MG.textScale;
  // toolbar: a row along the bottom, or a column on the right when the screen is wide and short
  const labels = [['undo', '↶ 復原'], ['hint', '💡 提示'], ['add', '➕ 空瓶'], ['reset', '🔄 重來']];
  const bh2 = Math.round(Math.max(52, 50 * U));
  const side = W > H * 1.3;
  let ax0 = 0, aw = W, topY = 18, botY;
  if (side) {
    const bw = Math.round(Math.min(W * 0.24, Math.max(120, 116 * U))), bx = W - bw - g, gap = Math.min(16, (H - g * 2 - bh2 * 4) / 3);
    const y0 = (H - (bh2 * 4 + gap * 3)) / 2;
    btns = labels.map(([id, label], k) => ({ id, label, x: bx, y: y0 + k * (bh2 + gap), w: bw, h: bh2 }));
    aw = bx - g; botY = H - 8;
  } else {
    const gap = 8, bw = Math.min(170, (W - 20 - gap * 3) / 4), tot = labels.length * bw + (labels.length - 1) * gap;
    btns = labels.map(([id, label], k) => ({ id, label, x: (W - tot) / 2 + k * (bw + gap), y: H - bh2 - 12, w: bw, h: bh2 }));
    botY = H - bh2 - 28;
  }
  const cellW = BW + 26, cellH = bh() + NECK + 46;
  let best = null;
  for (let per = 1; per <= n; per++) {
    const rows = Math.ceil(n / per);
    const s = Math.min((aw - 20) / (per * cellW), (botY - topY) / (rows * cellH), 3);
    if (!best || s > best.s + 1e-6) best = { per, rows, s };
  }
  scale = best.s; pos = [];
  const rows = best.rows, base = Math.floor(n / rows), extra = n % rows;
  const usedH = rows * cellH * scale, y0 = topY + (botY - topY - usedH) / 2;
  let i = 0;
  for (let r = 0; r < rows; r++) {
    const cnt = base + (r < extra ? 1 : 0), rowW = cnt * cellW * scale, x0 = ax0 + (aw - rowW) / 2;
    for (let k = 0; k < cnt; k++, i++) pos.push({ cx: x0 + (k + 0.5) * cellW * scale, by: y0 + (r + 1) * cellH * scale - 18 * scale });
  }
  shelfW = [ax0 + 10, aw - 20];
}
let shelfW = [10, 300];
// the canvas takes the whole stage (1 logical px ≈ 1 CSS px), the bottles are scaled up to fill it
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  const W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  const H = Math.max(260, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  land = W > H * 1.05; return [W, H];
});
cv.onfit = () => { if (bottles.length) layout(); };
addEventListener('mg-big', () => { if (bottles.length) layout(); });

// ---------- game flow ----------
function snapshot() { return { b: bottles.map(b => b.slice()), h: hid.map(b => b.slice()), gone: gone.slice(), moves, open: lockOpen }; }
const vis = i => bottles[i].map((v, k) => hid[i][k] ? -1 : v);   // what the player can see (-1 = ❓)
function reveal() { hid.forEach((h, i) => { if (h.length) h[h.length - 1] = false; }); }
function startLevel(lv, fresh = true) {
  level = lv; const L = LV(lv); cap = L.k;
  if (fresh || !puzzle) puzzle = makePuzzle(L.c, cap, L.e, L);
  R = { ...puzzle.rs, caps: puzzle.rs.caps.slice(), tags: puzzle.rs.tags && puzzle.rs.tags.slice() }; lockOpen = R.lock < 0;
  bottles = puzzle.b.map(b => b.slice()); gone = bottles.map(() => false);
  hid = bottles.map(b => b.map((_, k) => L.m && k < b.length - 1));
  fade = bottles.map(() => 0); shake = bottles.map(() => 0);
  sel = -1; moves = 0; hist = []; anim = null; extraUsed = false; hint = null; downOn = -1; floats = []; doneN = 0;
  layout(); hud(); state = 'play'; MG.hide();
  // the first time a new way to play shows up, explain it once (in the menu language)
  const NEWS = { small: ['🥛 小瓶子', '空瓶子比較矮，裝不下一整瓶。只能拿來暫放，最後要清空喔！'], one: ['💧 細口瓶', '瓶口很細，每次只會倒過去一格。要多倒幾次才能把同顏色搬完。'],
    tag: ['🏷️ 顏色標籤', '每個瓶子下面有顏色標籤，要倒滿<b>和標籤一樣的顏色</b>才會蓋上蓋子。倒錯顏色的話，標籤會搖一搖。'], lock: ['🔒 鎖住的瓶子', '有一個瓶子被鎖住了，不能倒進去也不能倒出來。先完成任何一瓶，鎖就會打開！'] };
  const fresh1 = Object.keys(NEWS).filter(k => L[k] && !MG.store.get('pour.seen.' + k, false));
  if (fresh1.length) {
    fresh1.forEach(k => MG.store.set('pour.seen.' + k, true));
    MG.panel({ title: fresh1.map(k => NEWS[k][0]).join('＋'), html: fresh1.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('moves', `🫗 ${moves} 步`); }
function tryPour(i, j) {
  if (!canPour(bottles, i, j)) {
    shake[j] = 0.35; MG.sfx('miss');
    // no rule sentence during play: a tiny visual instead (full bottle, or colours that don't match)
    if (R.lock >= 0 && !lockOpen && (i === R.lock || j === R.lock)) { shake[R.lock] = 0.35; say(R.lock, '🔒', '#6f7f99'); sel = -1; return; }
    say(j, bottles[j].length >= capOf(R, j) ? MG.WORDS.full : '❌ 🎨≠🎨', '#d0404e');
    sel = -1; return;
  }
  hist.push(snapshot()); hint = null;
  const k = pourAmount(bottles, i, j);
  anim = { i, j, c: topOf(bottles[i]), k, t: 0 };
  sel = -1; moves++; hud(); MG.sfx('flip');
}
function finishPour() {
  const { i, j } = anim; anim = null;
  const k = pourInto(bottles, i, j);
  hid[i].splice(hid[i].length - k, k); for (let n = 0; n < k; n++) hid[j].push(false);
  const wasHidden = hid.some(h => h.length && h[h.length - 1]);
  reveal();
  MG.sfx('pop'); if (wasHidden) MG.sfx('sparkle');
  if (full1(bottles[j], j)) {               // a bottle full of one colour: it gets a cork and pops away
    fade[j] = 0.001; doneN++;
    if (!lockOpen) { lockOpen = true; const L = R.lock; setTimeout(() => { if (L >= 0 && pos[L]) { say(L, '🔓 Open!', '#2f8a48'); shake[L] = 0.35; MG.sfx('good'); MG.sfx('sparkle'); } }, 450); }
    // layered: a rising match chime + sparkle, then a whoosh as the bottle flies away
    MG.sfx('match', doneN + 1); MG.sfx('sparkle'); setTimeout(() => MG.sfx('whoosh'), 380);
    say(j, MG.praise(Math.min(5, doneN)), '#ff6a00');
    const p = pos[j]; MG.fx.burst(p.cx, p.by - (BH(j) + NECK) * scale, { n: 22, colors: [COLORS[bottles[j][0]], '#fff', '#ffd23f'], shape: 'star', speed: 220, up: 140, size: 6 });
  }
  checkStuck();
}
function checkStuck() {
  const live = bottles.map((b, i) => !gone[i] && fade[i] === 0);
  if (bottles.every((b, i) => !live[i] || b.length === 0)) return;          // finishing
  for (let i = 0; i < bottles.length; i++) for (let j = 0; j < bottles.length; j++) if (live[i] && live[j] && canPour(bottles, i, j)) return;
  MG.toast(`${MG.WORDS.stuck}  ↶ ➕`, 2600);
}
function win() {
  state = 'over'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const rec = MG.record('pour', level);
  MG.fx.burst(cv.lw / 2, cv.lh * 0.4, { n: 50, colors: COLORS, shape: 'star', speed: 320, up: 180, size: 7 });
  setTimeout(() => MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<p>用了 ${moves} 步，全部倒好了 ^_^</p>` + (level < LEVELS.length ? `<p>下一關：${lvName(level + 1)}</p>` + (LV(level + 1).m && !LV(level).m ? '<p>❓ 神秘瓶：下面的顏色要倒開才看得到喔！</p>' : '') + (LV(level + 1).e < 2 && LV(level).e >= 2 ? '<p>下一關只有一個空瓶，要想清楚再倒！</p>' : '') : '<p>你是倒水大師！可以一直玩新的題目喔</p>') + (rec.isNew ? '<p class="new">新紀錄！^_^</p>' : ''),
    buttons: [
      { label: level < LEVELS.length ? '下一關' : '再來一題', on: () => { MG.store.set('pour.pickLevel', Math.min(level + 1, LEVELS.length)); startLevel(Math.min(level + 1, LEVELS.length)); } },
      { label: '這關換一題', alt: true, on: () => startLevel(level) },
      { label: '選關卡', alt: true, on: menu },
    ],
  }), 900);
}
function undo() {
  if (anim) return;
  const s = hist.pop(); if (!s) { MG.toast('⏮️ Start'); MG.sfx('miss'); return; }
  bottles = s.b; hid = s.h; gone = s.gone; moves = s.moves; lockOpen = s.open ?? lockOpen; fade = bottles.map(() => 0); bottles.forEach((b, i) => { if (full1(b, i)) gone[i] = true; }); sel = -1; hint = null; hud(); MG.sfx('place');
}
function addBottle() {
  if (anim) return;
  if (extraUsed) { MG.toast('No more ➕'); MG.sfx('miss'); return; }
  extraUsed = true; R.caps.push(R.k); if (R.tags) R.tags.push(-1); bottles.push([]); hid.push([]); gone.push(false); fade.push(0); shake.push(0);
  for (const s of hist) { s.b.push([]); s.h.push([]); s.gone.push(false); }
  layout(); MG.sfx('pop'); MG.sfx('whoosh'); MG.toast('+1 🫙');
}
function showHint() {
  if (anim) return;
  const live = bottles.map((b, i) => (gone[i] || fade[i] > 0) ? [] : b), key = JSON.stringify(live) + lockOpen;
  // keep following one plan while the player follows the hints (re-solving every time could send them in circles)
  const path = hintPlan && hintPlan.key === key && hintPlan.path.length ? hintPlan.path : solve(live);
  if (!path) { hintPlan = null; MG.toast(`${MG.WORDS.oops} ↶`, 2400); MG.sfx('miss'); return; }
  if (!path.length) return;
  const [i, j] = path[0];
  const nb = live.map(b => b.slice()); pourInto(nb, i, j); const opened = lockOpen || done1(nb[j], j); if (done1(nb[j], j)) nb[j] = [];
  hintPlan = { path: path.slice(1), key: JSON.stringify(nb) + opened }; hint = { i, j, t: 0 }; sel = -1; MG.sfx('flip'); MG.sfx('sparkle');
}
function reset() { if (anim) return; startLevel(level, false); MG.sfx('whoosh'); MG.toast('Again! 🔄'); }

// ---------- input ----------
function hitBottle(p) {
  for (let i = 0; i < bottles.length; i++) {
    if (gone[i] || fade[i] > 0) continue;
    const q = pos[i], w = (BW / 2 + 12) * scale, h = (BH(i) + NECK + 30) * scale;
    if (p.x > q.cx - w && p.x < q.cx + w && p.y > q.by - h && p.y < q.by + 14 * scale) return i;
  }
  return -1;
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = cv.logical(e);
  const b = btns.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
  if (b) { MG.sfx('click'); ({ undo, hint: showHint, add: addBottle, reset })[b.id](); return; }
  if (anim) finishPour();                     // quick fingers: finish the pour that's still running
  const i = hitBottle(p); downOn = -1;
  if (i < 0) { sel = -1; return; }
  if (sel < 0) {
    if (!bottles[i].length) { shake[i] = 0.25; MG.sfx('miss'); say(i, 'Empty 🫙', '#5a6f90'); return; }
    sel = i; downOn = i; MG.sfx('tick');
    try { cv.setPointerCapture(e.pointerId); } catch {}
  } else if (sel === i) sel = -1;
  else tryPour(sel, i);
});
cv.addEventListener('pointerup', e => {           // drag from one bottle and let go on another also pours
  if (state !== 'play' || downOn < 0 || anim) return;
  const j = hitBottle(cv.logical(e)), i = downOn; downOn = -1;
  if (j >= 0 && j !== i && sel === i) tryPour(i, j);
});
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') undo();
  if (e.key === 'h' || e.key === 'H') showHint();
  const n = parseInt(e.key, 10); const idx = e.key === '0' ? 9 : n - 1;
  if (!isNaN(n) && idx < bottles.length && !gone[idx]) { if (sel < 0) { if (bottles[idx].length) { sel = idx; MG.sfx('tick'); } } else if (sel === idx) sel = -1; else tryPour(sel, idx); }
});

// ---------- drawing ----------
function shapePath(id, r) {
  x.beginPath();
  switch (id) {
    case 'dot': x.arc(0, 0, r * 0.8, 0, 7); break;
    case 'star': for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } x.closePath(); break;
    case 'tri': x.moveTo(0, -r); x.lineTo(r * 0.95, r * 0.7); x.lineTo(-r * 0.95, r * 0.7); x.closePath(); break;
    case 'heart': x.moveTo(0, r * 0.85); x.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.6, -r * 1.2, 0, -r * 0.45); x.bezierCurveTo(r * 0.6, -r * 1.2, r * 1.4, -r * 0.1, 0, r * 0.85); break;
    case 'square': x.rect(-r * 0.75, -r * 0.75, r * 1.5, r * 1.5); break;
    case 'diamond': x.moveTo(0, -r); x.lineTo(r * 0.75, 0); x.lineTo(0, r); x.lineTo(-r * 0.75, 0); x.closePath(); break;
    case 'moon': x.arc(0, 0, r * 0.85, Math.PI * 0.3, Math.PI * 1.7); x.arc(r * 0.35, 0, r * 0.6, Math.PI * 1.5, Math.PI * 0.5, true); x.closePath(); break;
