<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>彩虹倒水瓶</title>
<link rel="stylesheet" href="mini.css">
<style>.mg-stage{padding:6px}.pour-demo{display:block;margin:.2em auto .4em;width:min(100%,330px);height:auto}</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'pour', title: '彩虹倒水瓶', stats: ['level', 'moves'] });
const cv = document.getElementById('cv'); let x = cv.getContext('2d');   // x is swapped for a moment while the intro pictures are drawn
let land = false;

// ---------- data ----------
const COLORS = ['#ff4d5e', '#ff9f1c', '#ffd93d', '#45c95f', '#3d8bff', '#9b5cff', '#ff73c0', '#8b5a2b', '#36d6d0', '#b6e03a', '#23358f', '#68707f', '#1d7a46', '#2b2b33'];
const HIDDEN = '#c9d1de';           // colour of a ❓ layer that hasn't been seen yet
const SHAPES = ['dot', 'star', 'tri', 'heart', 'square', 'diamond', 'moon', 'plus', 'ring', 'drop', 'cross', 'hex', 'bolt', 'flower'];
// [colours, units per bottle, empty bottles = 2, mystery = false]
// mystery: only the top layer of each bottle can be seen; the ❓ layers show up when they reach the top
// from 21 on, "same difficulty, different way to play" twists (an object adds them):
//   small: the empty bottles only hold that many 🥛 · one: thin-neck bottles pour one layer at a time 💧
//   tag: every bottle has a colour label and only finishes with that colour 🏷️ · lock: one bottle is chained 🔒 until the first bottle is finished
const LEVELS = [[3, 3], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [5, 5], [8, 4], [7, 5], [9, 4], [8, 5], [10, 5],
  [5, 4, 1], [6, 4, 2, true], [11, 5], [8, 6], [8, 5, 2, true], [13, 5], [10, 6, 2, true], [14, 6],
  [5, 4, 2, false, { small: 2 }], [5, 4, 2, false, { one: true }], [4, 4, 2, false, { tag: true }], [6, 4, 2, false, { lock: true }],
  [7, 4, 3, false, { small: 2 }], [7, 4, 2, false, { one: true }], [5, 4, 2, false, { tag: true }], [8, 4, 2, false, { lock: true }],
  [6, 5, 2, true, { small: 3 }], [7, 4, 2, false, { one: true, lock: true }], [6, 4, 2, false, { tag: true }], [8, 5, 2, true, { lock: true }],
  [12, 6], [8, 4, 1], [12, 6, 2, true], [14, 7],
  // from 37 on, three more twists (and mixes with the old ones):
  //   ice: that many layers are frozen 🧊 — a frozen layer can't pour out; pour the same colour onto it and it melts
  //   bucket: a wide glass bucket 🪣 that holds two bottles' worth of any colours, but never gets a cork (it must end empty)
  //   tap: that many bottles have a tap at the bottom 🚰 — they pour out their BOTTOM layer (water still goes in at the top)
  [6, 4, 2, false, { ice: 2 }], [6, 4, 1, false, { bucket: true }], [6, 4, 2, false, { tap: 1 }], [10, 5, 2, true],
  [8, 4, 2, false, { ice: 3 }], [8, 5, 1, false, { bucket: true }], [8, 4, 2, false, { tap: 1 }], [10, 5, 2, false, { small: 3 }],
  [8, 5, 2, false, { ice: 3, lock: true }], [7, 4, 1, false, { bucket: true, one: true }], [8, 4, 2, false, { tap: 2 }], [12, 6, 2, true],
  [10, 5, 2, false, { ice: 4 }], [10, 5, 1, false, { bucket: true, lock: true }], [9, 5, 2, false, { tap: 2, small: 3 }], [10, 6, 2, false, { one: true }],
  [8, 4, 2, false, { ice: 3, one: true }], [11, 6, 1, false, { bucket: true }], [10, 5, 2, false, { tap: 2, ice: 2 }], [12, 6, 2, true, { lock: true }],
  [8, 5, 2, false, { tag: true, ice: 3 }], [12, 6, 1, false, { bucket: true, tap: 1 }], [11, 6, 2, false, { ice: 3, tap: 1, lock: true }], [13, 6, 1, false, { bucket: true, ice: 3 }]];
const LV = n => { const [c, k, e = 2, m = false, o = {}] = LEVELS[n - 1]; return { c, k, e, m, small: o.small || 0, one: !!o.one, tag: !!o.tag, lock: !!o.lock, ice: o.ice || 0, bucket: !!o.bucket, tap: o.tap || 0 }; };
const lvName = n => { const L = LV(n); return `${L.c}色×${L.k}格${L.e < 2 ? `・${L.e}空瓶` : ''}${L.m ? '・❓' : ''}${L.small ? '・🥛小瓶' : ''}${L.one ? '・💧細口' : ''}${L.tag ? '・🏷️標籤' : ''}${L.lock ? '・🔒鎖' : ''}${L.ice ? '・🧊冰塊' : ''}${L.bucket ? '・🪣大水桶' : ''}${L.tap ? '・🚰水龍頭' : ''}`; };
const BW = 52, UH = 30, NECK = 16, BKW = 112, STAND = 22;   // bottle width, layer height, neck · bucket top width · height of a tap bottle's stand
const ICE = 32;                                           // a frozen layer is stored as colour + ICE
const fz = v => v >= ICE, colOf = v => v >= ICE ? v - ICE : v;

let bottles = [], hid = [], gone = [], cap = 4, level = 1, mode = 'shape', state = 'menu';
let hintPlan = null, sel = -1, moves = 0, hist = [], anim = null, puzzle = null, extraUsed = false, downOn = -1;
let melts = [], fade = [], shake = [], hint = null, t = 0, pos = [], scale = 1, btns = [], floats = [], doneN = 0;

// ---------- rules ----------
const topOf = b => b[b.length - 1];
// R: the rules of the current puzzle — k layers per colour, caps per bottle, one-layer pours, colour labels (-1 = none), the locked bottle
// tap / big: per-bottle flags (or null) for 🚰 tap bottles and the 🪣 bucket
let R = { k: 4, caps: [], one: false, tags: null, lock: -1, tap: null, big: null }, lockOpen = true;
const capOf = (rs, j) => rs.caps[j] ?? rs.k;
const isTap = (rs, j) => !!(rs.tap && rs.tap[j]), isBig = (rs, j) => !!(rs.big && rs.big[j]);
const outOf = (b, i, rs = R) => isTap(rs, i) ? b[0] : b[b.length - 1];       // the layer that would pour out
const done1 = (b, i, rs = R) => b.length === rs.k && !isBig(rs, i) && b[0] < ICE && b.every(v => v === b[0]) && (!rs.tags || rs.tags[i] === b[0]);
const full1 = (b, i) => done1(b, i);
function canPour(bs, i, j, rs = R, open = lockOpen) {
  const a = bs[i], b = bs[j];
  if (i === j || !a.length || b.length >= capOf(rs, j)) return false;
  const v = outOf(a, i, rs);
  if (fz(v) || (b.length && colOf(topOf(b)) !== v)) return false;   // ice can't move; pouring onto ice of the same colour is fine (it melts)
  if (rs.lock >= 0 && !open && (i === rs.lock || j === rs.lock)) return false;
  return true;
}
function runLen(b) { let k = 1; while (k < b.length && b[b.length - 1 - k] === topOf(b)) k++; return k; }
function runLow(b) { let k = 1; while (k < b.length && b[k] === b[0]) k++; return k; }   // same colour run from the bottom (tap bottles)
const pourAmount = (bs, i, j, rs = R) => rs.one ? 1 : Math.min(isTap(rs, i) ? runLow(bs[i]) : runLen(bs[i]), capOf(rs, j) - bs[j].length);
function pourInto(bs, i, j, rs = R) {
  const k = pourAmount(bs, i, j, rs), a = bs[i], b = bs[j], tap = isTap(rs, i);
  if (b.length && fz(b[b.length - 1])) b[b.length - 1] -= ICE;               // 🧊 melts under the same colour
  for (let n = 0; n < k; n++) b.push(tap ? a.shift() : a.pop());
  return k;
}

// depth-first search with memo: used to make sure every puzzle can be solved, and for the 💡 hint
function solve(start, rs = R, open0 = lockOpen, limit = 80000) {
  const seen = new Set(); let nodes = 0;
  // labels, a lock or different sizes make bottle positions matter; otherwise bottles are interchangeable
  const positional = !!rs.tags || rs.lock >= 0 || !!rs.tap || !!rs.big || rs.caps.some(c => c !== rs.k);
  const enc = b => String.fromCharCode(...b), key = (bs, open) => (positional ? bs.map(enc).join('|') : bs.map(enc).sort().join('|')) + (open ? '+' : '-');
  const done = bs => bs.every((b, i) => b.length === 0 || done1(b, i, rs));
  const prune = !rs.tags && !rs.one && !rs.tap && !rs.big;
  const path = [], maxD = start.reduce((a, b) => a + b.length, 0) * (rs.one ? 2.5 : 1.2) + 20;   // depth cap: no endless wandering (and no stack overflow)
  const dfs = (bs, open) => {
    if (done(bs)) return true;
    if (++nodes > limit || path.length > maxD) return false;
    const k = key(bs, open); if (seen.has(k)) return false; seen.add(k);
    // try the most promising pours first: onto a bottle that holds only that colour, moves that take a whole run, then the rest, empty bottles last
    const mv = [];
    for (let i = 0; i < bs.length; i++) {
      const a = bs[i]; if (!a.length || done1(a, i, rs)) continue;
      const uniform = a.every(v => v === a[0]);
      const tried = new Set();
      for (let j = 0; j < bs.length; j++) {
        if (!canPour(bs, i, j, rs, open)) continue;
        const b = bs[j];
        if (!b.length) {
          const ck = capOf(rs, j) + (rs.tags ? ':' + j : '') + (isTap(rs, j) ? 't' : '') + (isBig(rs, j) ? 'b' : '');
          if ((prune && uniform) || tried.has(ck)) continue; tried.add(ck); mv.push(i, j, 0); continue;
        }
        const bu = b.every(v => v === b[0]);
        const run = isTap(rs, i) ? runLow(a) : runLen(a), whole = run <= capOf(rs, j) - b.length;
        mv.push(i, j, (bu ? 4 : 1) + (whole ? 2 : 0) + (whole && run === a.length ? 1 : 0));
      }
    }
    const ord = []; for (let m = 0; m < mv.length; m += 3) ord.push(m);
    ord.sort((p, q) => mv[q + 2] - mv[p + 2]);
    for (const m of ord) {
      const i = mv[m], j = mv[m + 1];
      const nb = bs.slice(); nb[i] = bs[i].slice(); nb[j] = bs[j].slice(); pourInto(nb, i, j, rs);   // only the two bottles that change are copied
      path.push([i, j]);
      if (dfs(nb, open || done1(nb[j], j, rs))) return true;
      path.pop();
    }
    return false;
  };
  const ok = dfs(start.map(b => b.slice()), open0); solve.nodes = nodes;
  return ok ? path : null;
}
// 🧊 freeze n layers (at most one per bottle, never under a layer of its own colour, never in a tap bottle)
function freeze(bs, nc, n, rs) {
  const spots = [];
  for (let i = 0; i < nc; i++) if (!isTap(rs, i)) for (let p = 0; p < bs[i].length; p++) if (p === bs[i].length - 1 || bs[i][p + 1] !== bs[i][p]) spots.push([i, p]);
  const used = new Set();
  for (const [i, p] of MG.shuffle(spots)) { if (used.size >= n) break; if (used.has(i)) continue; used.add(i); bs[i][p] += ICE; }
}
// returns { b: bottles, rs: rules, ok } — keeps trying until the solver can finish one (ok), within a small time budget
let GEN_LIM = 4000;
function makePuzzle(nc, c, empties = 2, L = {}, again = 0) {
  let last = null; const t0 = performance.now();
  const hard = empties < 2 || L.tag || L.lock || L.small || L.one || L.ice || L.bucket || L.tap;
  for (let tries = 0; tries < (hard ? 400 : 80); tries++) {
    const units = MG.shuffle(Array.from({ length: nc * c }, (_, i) => i % nc));
    const bs = Array.from({ length: nc }, (_, i) => units.slice(i * c, (i + 1) * c));
    if (bs.some(b => b.every(v => v === b[0]))) continue;              // nothing already finished
    for (let k = 0; k < empties; k++) bs.push([]);
    if (L.bucket) bs.push([]);                                          // the 🪣 bucket comes last
    const n = bs.length, bk = L.bucket ? n - 1 : -1;
    const rs = { k: c, caps: bs.map((b, i) => i === bk ? c * 2 : i >= nc && L.small ? L.small : c), one: !!L.one, tags: null, lock: -1, tap: null, big: null };
    if (L.bucket) rs.big = bs.map((b, i) => i === bk);
    if (L.tag) rs.tags = MG.shuffle(Array.from({ length: nc }, (_, i) => i)).concat(Array(n - nc).fill(-1));
    if (L.lock) rs.lock = MG.randi(0, nc - 1);
    if (L.tap) { const ids = MG.shuffle(Array.from({ length: nc }, (_, i) => i)).slice(0, L.tap); rs.tap = bs.map((b, i) => ids.includes(i)); }
    if (L.ice) freeze(bs, nc, L.ice, rs);
    last = { b: bs, rs, ok: false };
    if (solve(bs, rs, !L.lock, GEN_LIM)) { last.ok = true; last.tries = tries + 1; last.extra = again; return last; }
    if (performance.now() - t0 > 750 && tries > 2) break;   // keeps a slow tablet under ~1 s
  }
  // very unlucky: never hand out a puzzle that wasn't checked — try again with one more empty bottle
  return again < 2 ? makePuzzle(nc, c, empties + 1, L, again + 1) : last;
}

// ---------- layout ----------
const bh = (c = cap) => c * UH + 10;                  // body height (local units) of a bottle that holds c layers
const BH = i => isBig(R, i) ? bh(R.k) : bh(capOf(R, i));   // the bucket is as tall as a bottle, just twice as wide
const unitH = i => isBig(R, i) ? UH / 2 : UH;                 // …so each of its layers is half as thick
const halfW = i => isBig(R, i) ? BKW / 2 : BW / 2;
const lift = i => isTap(R, i) ? STAND : 0;                    // a tap bottle stands on little legs
const mouthY = i => BH(i) + (isBig(R, i) ? 6 : NECK) + lift(i); // height of the opening above the shelf (local units)
let U = 1;
function layout() {
  const W = cv.lw, H = cv.lh, n = bottles.length, g = 10;
  U = Math.max(1, Math.min(1.5, Math.min(W, H) / 420)) * MG.textScale;
  // toolbar: a row along the bottom, or a column on the right when the screen is wide and short
  const labels = [['undo', '↶ 復原'], ['hint', '💡 提示'], ['add', '➕ 空瓶'], ['reset', '🔄 重來']];
  const bh2 = Math.round(Math.max(52, 50 * U));
  const side = W > H * 1.3;
  let ax0 = 0, aw = W, topY = 18, botY;
  if (side) {
    const bw = Math.round(Math.min(W * 0.24, Math.max(120, 116 * U))), bx = W - bw - g, gap = Math.min(16, (H - g * 2 - bh2 * 4) / 3);
    const y0 = (H - (bh2 * 4 + gap * 3)) / 2;
    btns = labels.map(([id, label], k) => ({ id, label, x: bx, y: y0 + k * (bh2 + gap), w: bw, h: bh2 }));
    aw = bx - g; botY = H - 8;
  } else {
    const gap = 8, bw = Math.min(170, (W - 20 - gap * 3) / 4), tot = labels.length * bw + (labels.length - 1) * gap;
    btns = labels.map(([id, label], k) => ({ id, label, x: (W - tot) / 2 + k * (bw + gap), y: H - bh2 - 12, w: bw, h: bh2 }));
    botY = H - bh2 - 28;
  }
  const cellW = BW + 26, cellH = bh() + NECK + 46 + (R.tap && R.tap.some(v => v) ? STAND : 0);
  // the 🪣 bucket takes a wider cell; split the bottles into rows by width, keep the layout that makes them biggest
  const ws = bottles.map((_, i) => isBig(R, i) ? (BKW + 26) / cellW : 1), tot = ws.reduce((a, b) => a + b, 0);
  const split = rows => { const rw = Array(rows).fill(0), ri = []; let acc = 0; ws.forEach(w => { const r = Math.min(rows - 1, Math.floor((acc + w / 2) / (tot / rows))); ri.push(r); rw[r] += w; acc += w; }); return { rw, ri }; };
  let best = null;
  for (let rows = 1; rows <= n; rows++) {
    const sp = split(rows), s = Math.min((aw - 20) / (Math.max(...sp.rw) * cellW), (botY - topY) / (rows * cellH), 3);
    if (!best || s > best.s + 1e-6) best = { rows, s, ...sp };
  }
  scale = best.s; pos = [];
  const rows = best.rows;
  const usedH = rows * cellH * scale, y0 = topY + (botY - topY - usedH) / 2;
  const accs = Array(rows).fill(0);
  ws.forEach((w, i) => {
    const r = best.ri[i], x0 = ax0 + (aw - best.rw[r] * cellW * scale) / 2;
    pos.push({ cx: x0 + (accs[r] + w / 2) * cellW * scale, by: y0 + (r + 1) * cellH * scale - 26 * scale }); accs[r] += w;
  });
  shelfW = [ax0 + 10, aw - 20];
}
let shelfW = [10, 300];
// the canvas takes the whole stage (1 logical px ≈ 1 CSS px), the bottles are scaled up to fill it
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  const W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  const H = Math.max(260, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  land = W > H * 1.05; return [W, H];
});
cv.onfit = () => { if (bottles.length) layout(); };
addEventListener('mg-big', () => { if (bottles.length) layout(); });

// ---------- game flow ----------
function snapshot() { return { b: bottles.map(b => b.slice()), h: hid.map(b => b.slice()), gone: gone.slice(), moves, open: lockOpen }; }
const vis = i => bottles[i].map((v, k) => hid[i][k] ? -1 : v);   // what the player can see (-1 = ❓)
function reveal() { hid.forEach((h, i) => { if (h.length) h[h.length - 1] = false; }); }
function startLevel(lv, fresh = true) {
  level = lv; const L = LV(lv); cap = L.k;
  if (fresh || !puzzle) puzzle = makePuzzle(L.c, cap, L.e, L);
  R = { ...puzzle.rs, caps: puzzle.rs.caps.slice(), tags: puzzle.rs.tags && puzzle.rs.tags.slice(), tap: puzzle.rs.tap && puzzle.rs.tap.slice(), big: puzzle.rs.big && puzzle.rs.big.slice() }; lockOpen = R.lock < 0;
  bottles = puzzle.b.map(b => b.slice()); gone = bottles.map(() => false);
  hid = bottles.map(b => b.map((_, k) => L.m && k < b.length - 1));
  fade = bottles.map(() => 0); shake = bottles.map(() => 0);
  sel = -1; moves = 0; hist = []; anim = null; extraUsed = false; hint = null; downOn = -1; floats = []; doneN = 0; melts = [];
  layout(); hud(); state = 'play'; MG.hide();
  // the first time a new way to play shows up, explain it once (in the menu language)
  const NEWS = { small: ['🥛 小瓶子', '空瓶子比較矮，裝不下一整瓶。只能拿來暫放，最後要清空喔！'], one: ['💧 細口瓶', '瓶口很細，每次只會倒過去一格。要多倒幾次才能把同顏色搬完。'],
    tag: ['🏷️ 顏色標籤', '每個瓶子下面有顏色標籤，要倒滿<b>和標籤一樣的顏色</b>才會蓋上蓋子。倒錯顏色的話，標籤會搖一搖。'], lock: ['🔒 鎖住的瓶子', '有一個瓶子被鎖住了，不能倒進去也不能倒出來。先完成任何一瓶，鎖就會打開！'],
    ice: ['🧊 結冰的水', '有些水結冰了，冰塊<b>倒不出來</b>。把<b>一樣顏色</b>的水倒在冰上面，冰就會融化！'],
    bucket: ['🪣 大水桶', '大水桶很寬，可以裝<b>兩瓶</b>的水，什麼顏色都能放。它不會蓋蓋子，最後要把它<b>倒空</b>喔！'],
    tap: ['🚰 水龍頭瓶', '這個瓶子站在小腳上，下面有水龍頭：水會從<b>最下面</b>流出來！倒進來的水還是從上面進去。'] };
  const fresh1 = Object.keys(NEWS).filter(k => L[k] && !MG.store.get('pour.seen.' + k, false));
  if (fresh1.length) {
    fresh1.forEach(k => MG.store.set('pour.seen.' + k, true));
    MG.panel({ title: fresh1.map(k => NEWS[k][0]).join('＋'), html: fresh1.map(k => `<p>${NEWS[k][1]}</p>` + (DEMO[k] ? `<img class="pour-demo" alt="" src="${demoImg(k)}">` : '')).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
// 🧊 the layer that would pour out is frozen: the bottle shivers
function brrr(i) { shake[i] = 0.35; MG.sfx('miss'); MG.sfx('tick'); say(i, '🧊 Brrr!', '#3d86c8'); }
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('moves', `🫗 ${moves} 步`); }
function tryPour(i, j) {
  if (!canPour(bottles, i, j)) {
    shake[j] = 0.35; MG.sfx('miss');
    // no rule sentence during play: a tiny visual instead (full bottle, or colours that don't match)
    if (R.lock >= 0 && !lockOpen && (i === R.lock || j === R.lock)) { shake[R.lock] = 0.35; say(R.lock, '🔒', '#6f7f99'); sel = -1; return; }
    if (bottles[i].length && fz(outOf(bottles[i], i))) { brrr(i); sel = -1; return; }
    say(j, bottles[j].length >= capOf(R, j) ? MG.WORDS.full : '❌ 🎨≠🎨', '#d0404e');
    sel = -1; return;
  }
  hist.push(snapshot()); hint = null;
  const k = pourAmount(bottles, i, j);
  anim = { i, j, c: outOf(bottles[i], i), k, t: 0, tap: isTap(R, i) };
  sel = -1; moves++; hud(); MG.sfx('flip');
  if (anim.tap) setTimeout(() => MG.sfx('boing'), 200);          // the tap squeaks open
}
function finishPour() {
  const { i, j } = anim; anim = null;
  const melt = bottles[j].length > 0 && fz(topOf(bottles[j])), meltAt = bottles[j].length;
  const k = pourInto(bottles, i, j);
  if (isTap(R, i)) hid[i].splice(0, k); else hid[i].splice(hid[i].length - k, k);
  for (let n = 0; n < k; n++) hid[j].push(false);

  for (const m of melts) m.t += dt; melts = melts.filter(m => m.t < 0.7);

  for (let i = 0; i < fade.length; i++) if (fade[i] > 0 && !gone[i]) { fade[i] += dt / 1.1; if (fade[i] >= 1) { gone[i] = true; } }
  if (state === 'play' && !anim && bottles.every((b, i) => gone[i] || b.length === 0)) win();
  draw();
});
</script>
