<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>彩虹倒水瓶</title>
<link rel="stylesheet" href="mini.css">
<style>.mg-stage{padding:6px}</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'pour', title: '彩虹倒水瓶', stats: ['level', 'moves'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
let land = false;

// ---------- data ----------
const COLORS = ['#ff4d5e', '#ff9f1c', '#ffd93d', '#45c95f', '#3d8bff', '#9b5cff', '#ff73c0', '#8b5a2b', '#36d6d0', '#b6e03a', '#23358f', '#68707f', '#1d7a46', '#2b2b33'];
const HIDDEN = '#c9d1de';           // colour of a ❓ layer that hasn't been seen yet
const SHAPES = ['dot', 'star', 'tri', 'heart', 'square', 'diamond', 'moon', 'plus', 'ring', 'drop', 'cross', 'hex', 'bolt', 'flower'];
// [colours, units per bottle, empty bottles = 2, mystery = false]
// mystery: only the top layer of each bottle can be seen; the ❓ layers show up when they reach the top
const LEVELS = [[3, 3], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [5, 5], [8, 4], [7, 5], [9, 4], [8, 5], [10, 5],
  [5, 4, 1], [6, 4, 2, true], [11, 5], [8, 6], [8, 5, 2, true], [13, 5], [10, 6, 2, true], [14, 6]];
const LV = n => { const [c, k, e = 2, m = false] = LEVELS[n - 1]; return { c, k, e, m }; };
const lvName = n => { const L = LV(n); return `${L.c}色×${L.k}格${L.e < 2 ? '・1空瓶' : ''}${L.m ? '・❓' : ''}`; };
const BW = 52, UH = 30, NECK = 16;

let bottles = [], hid = [], gone = [], cap = 4, level = 1, mode = 'shape', state = 'menu';
let sel = -1, moves = 0, hist = [], anim = null, puzzle = null, extraUsed = false, downOn = -1;
let fade = [], shake = [], hint = null, t = 0, pos = [], scale = 1, btns = [], floats = [], doneN = 0;

// ---------- rules ----------
const topOf = b => b[b.length - 1];
const full1 = b => b.length === cap && b.every(v => v === b[0]);
function canPour(bs, i, j, c = cap) {
  const a = bs[i], b = bs[j];
  return i !== j && a.length > 0 && b.length < c && (b.length === 0 || topOf(b) === topOf(a));
}
function runLen(b) { let k = 1; while (k < b.length && b[b.length - 1 - k] === topOf(b)) k++; return k; }
function pourInto(bs, i, j, c = cap) { const k = Math.min(runLen(bs[i]), c - bs[j].length); for (let n = 0; n < k; n++) bs[j].push(bs[i].pop()); return k; }

// depth-first search with memo: used to make sure every puzzle can be solved, and for the 💡 hint
function solve(start, c, limit = 80000) {
  const seen = new Set(); let nodes = 0;
  const key = bs => bs.map(b => b.join('')).sort().join('|');
  const done = bs => bs.every(b => b.length === 0 || (b.length === c && b.every(v => v === b[0])));
  const path = [];
  const dfs = bs => {
    if (done(bs)) return true;
    if (++nodes > limit) return false;
    const k = key(bs); if (seen.has(k)) return false; seen.add(k);
    for (let i = 0; i < bs.length; i++) {
      const a = bs[i]; if (!a.length || (a.length === c && a.every(v => v === a[0]))) continue;
      const uniform = a.every(v => v === a[0]);
      let triedEmpty = false;
      for (let j = 0; j < bs.length; j++) {
        if (!canPour(bs, i, j, c)) continue;
        if (!bs[j].length) { if (uniform || triedEmpty) continue; triedEmpty = true; }
        const nb = bs.map(b => b.slice()); pourInto(nb, i, j, c);
        path.push([i, j]);
        if (dfs(nb)) return true;
        path.pop();
      }
    }
    return false;
  };
  return dfs(start.map(b => b.slice())) ? path : null;
}
function makePuzzle(nc, c, empties = 2) {
  let last = null;
  for (let tries = 0; tries < (empties < 2 ? 400 : 80); tries++) {
    const units = MG.shuffle(Array.from({ length: nc * c }, (_, i) => i % nc));
    const bs = Array.from({ length: nc }, (_, i) => units.slice(i * c, (i + 1) * c));
    if (bs.some(b => b.every(v => v === b[0]))) continue;              // nothing already finished
    for (let k = 0; k < empties; k++) bs.push([]);
    last = bs;
    if (solve(bs, c, 40000)) return bs;
  }
  return last;
}

// ---------- layout ----------
const bh = () => cap * UH + 10;                       // body height (local units)
function layout() {
  const W = cv.lw, H = cv.lh, topY = 18, botY = H - 92, n = bottles.length;
  const cellW = BW + 26, cellH = bh() + NECK + 46;
  let best = null;
  for (let per = 1; per <= n; per++) {
    const rows = Math.ceil(n / per);
    const s = Math.min((W - 20) / (per * cellW), (botY - topY) / (rows * cellH), 1.6);
    if (!best || s > best.s + 1e-6) best = { per, rows, s };
  }
  scale = best.s; pos = [];
  const rows = best.rows, base = Math.floor(n / rows), extra = n % rows;
  const usedH = rows * cellH * scale, y0 = topY + (botY - topY - usedH) / 2;
  let i = 0;
  for (let r = 0; r < rows; r++) {
    const cnt = base + (r < extra ? 1 : 0), rowW = cnt * cellW * scale, x0 = (W - rowW) / 2;
    for (let k = 0; k < cnt; k++, i++) pos.push({ cx: x0 + (k + 0.5) * cellW * scale, by: y0 + (r + 1) * cellH * scale - 18 * scale });
  }
  // toolbar
  const labels = [['undo', '↶ 復原'], ['hint', '💡 提示'], ['add', '➕ 空瓶'], ['reset', '🔄 重來']];
  const bw = Math.min(150, (W - 30) / 4 - 8), gap = 8, tot = labels.length * bw + (labels.length - 1) * gap;
  btns = labels.map(([id, label], k) => ({ id, label, x: (W - tot) / 2 + k * (bw + gap), y: H - 70, w: bw, h: 54 }));
}
MG.fit(cv, (sw, sh) => { land = sw > sh * 1.05; return land ? [Math.round(Math.min(1100, Math.max(760, 500 * sw / sh))), 500] : [480, Math.round(Math.min(900, Math.max(640, 480 * sh / sw)))]; });
cv.onfit = () => { if (bottles.length) layout(); };

// ---------- game flow ----------
function snapshot() { return { b: bottles.map(b => b.slice()), h: hid.map(b => b.slice()), gone: gone.slice(), moves }; }
const vis = i => bottles[i].map((v, k) => hid[i][k] ? -1 : v);   // what the player can see (-1 = ❓)
function reveal() { hid.forEach((h, i) => { if (h.length) h[h.length - 1] = false; }); }
function startLevel(lv, fresh = true) {
  level = lv; const L = LV(lv); cap = L.k;
  if (fresh || !puzzle) puzzle = makePuzzle(L.c, cap, L.e);
  bottles = puzzle.map(b => b.slice()); gone = bottles.map(() => false);
  hid = bottles.map(b => b.map((_, k) => L.m && k < b.length - 1));
  fade = bottles.map(() => 0); shake = bottles.map(() => 0);
  sel = -1; moves = 0; hist = []; anim = null; extraUsed = false; hint = null; downOn = -1; floats = []; doneN = 0;
  layout(); hud(); state = 'play'; MG.hide();
}
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('moves', `🫗 ${moves} 步`); }
function tryPour(i, j) {
  if (!canPour(bottles, i, j)) {
    shake[j] = 0.35; MG.sfx('miss');
    // no rule sentence during play: a tiny visual instead (full bottle, or colours that don't match)
    say(j, bottles[j].length >= cap ? MG.WORDS.full : '❌ 🎨≠🎨', '#d0404e');
    sel = -1; return;
  }
  hist.push(snapshot()); hint = null;
  const k = Math.min(runLen(bottles[i]), cap - bottles[j].length);
  anim = { i, j, c: topOf(bottles[i]), k, t: 0 };
  sel = -1; moves++; hud(); MG.sfx('flip');
}
function finishPour() {
  const { i, j } = anim; anim = null;
  const k = pourInto(bottles, i, j);
  hid[i].splice(hid[i].length - k, k); for (let n = 0; n < k; n++) hid[j].push(false);
  const wasHidden = hid.some(h => h.length && h[h.length - 1]);
  reveal();
  MG.sfx('pop'); if (wasHidden) MG.sfx('sparkle');
  if (full1(bottles[j])) {               // a bottle full of one colour: it gets a cork and pops away
    fade[j] = 0.001; doneN++;
    // layered: a rising match chime + sparkle, then a whoosh as the bottle flies away
    MG.sfx('match', doneN + 1); MG.sfx('sparkle'); setTimeout(() => MG.sfx('whoosh'), 380);
    say(j, MG.praise(Math.min(5, doneN)), '#ff6a00');
    const p = pos[j]; MG.fx.burst(p.cx, p.by - (bh() + NECK) * scale, { n: 22, colors: [COLORS[bottles[j][0]], '#fff', '#ffd23f'], shape: 'star', speed: 220, up: 140, size: 6 });
  }
  checkStuck();
}
function checkStuck() {
  const live = bottles.map((b, i) => !gone[i] && fade[i] === 0);
  if (bottles.every((b, i) => !live[i] || b.length === 0)) return;          // finishing
  for (let i = 0; i < bottles.length; i++) for (let j = 0; j < bottles.length; j++) if (live[i] && live[j] && canPour(bottles, i, j)) return;
  MG.toast(`${MG.WORDS.stuck}  ↶ ➕`, 2600);
}
function win() {
  state = 'over'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const rec = MG.record('pour', level);
  MG.fx.burst(cv.lw / 2, cv.lh * 0.4, { n: 50, colors: COLORS, shape: 'star', speed: 320, up: 180, size: 7 });
  setTimeout(() => MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<p>用了 ${moves} 步，全部倒好了 ^_^</p>` + (level < LEVELS.length ? `<p>下一關：${lvName(level + 1)}</p>` + (LV(level + 1).m && !LV(level).m ? '<p>❓ 神秘瓶：下面的顏色要倒開才看得到喔！</p>' : '') + (LV(level + 1).e < 2 && LV(level).e >= 2 ? '<p>下一關只有一個空瓶，要想清楚再倒！</p>' : '') : '<p>你是倒水大師！可以一直玩新的題目喔</p>') + (rec.isNew ? '<p class="new">新紀錄！^_^</p>' : ''),
    buttons: [
      { label: level < LEVELS.length ? '下一關' : '再來一題', on: () => { MG.store.set('pour.pickLevel', Math.min(level + 1, LEVELS.length)); startLevel(Math.min(level + 1, LEVELS.length)); } },
      { label: '這關換一題', alt: true, on: () => startLevel(level) },
      { label: '選關卡', alt: true, on: menu },
    ],
  }), 900);
}
function undo() {
  if (anim) return;
  const s = hist.pop(); if (!s) { MG.toast('⏮️ Start'); MG.sfx('miss'); return; }
  bottles = s.b; hid = s.h; gone = s.gone; moves = s.moves; fade = bottles.map(() => 0); bottles.forEach((b, i) => { if (full1(b)) gone[i] = true; }); sel = -1; hint = null; hud(); MG.sfx('place');
}
function addBottle() {
  if (anim) return;
  if (extraUsed) { MG.toast('No more ➕'); MG.sfx('miss'); return; }
  extraUsed = true; bottles.push([]); hid.push([]); gone.push(false); fade.push(0); shake.push(0);
  for (const s of hist) { s.b.push([]); s.h.push([]); s.gone.push(false); }
  layout(); MG.sfx('pop'); MG.sfx('whoosh'); MG.toast('+1 🫙');
}
function showHint() {
  if (anim) return;
  const live = bottles.map((b, i) => (gone[i] || fade[i] > 0) ? [] : b);
  const path = solve(live, cap);
  if (!path) { MG.toast(`${MG.WORDS.oops} ↶`, 2400); MG.sfx('miss'); return; }
  if (!path.length) return;
  const [i, j] = path[0]; hint = { i, j, t: 0 }; sel = -1; MG.sfx('flip'); MG.sfx('sparkle');
}
function reset() { if (anim) return; startLevel(level, false); MG.sfx('whoosh'); MG.toast('Again! 🔄'); }

// ---------- input ----------
function hitBottle(p) {
  for (let i = 0; i < bottles.length; i++) {
    if (gone[i] || fade[i] > 0) continue;
    const q = pos[i], w = (BW / 2 + 12) * scale, h = (bh() + NECK + 30) * scale;
    if (p.x > q.cx - w && p.x < q.cx + w && p.y > q.by - h && p.y < q.by + 14 * scale) return i;
  }
  return -1;
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = cv.logical(e);
  const b = btns.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
  if (b) { MG.sfx('click'); ({ undo, hint: showHint, add: addBottle, reset })[b.id](); return; }
  if (anim) finishPour();                     // quick fingers: finish the pour that's still running
  const i = hitBottle(p); downOn = -1;
  if (i < 0) { sel = -1; return; }
  if (sel < 0) {
    if (!bottles[i].length) { shake[i] = 0.25; MG.sfx('miss'); say(i, 'Empty 🫙', '#5a6f90'); return; }
    sel = i; downOn = i; MG.sfx('tick');
    try { cv.setPointerCapture(e.pointerId); } catch {}
  } else if (sel === i) sel = -1;
  else tryPour(sel, i);
});
cv.addEventListener('pointerup', e => {           // drag from one bottle and let go on another also pours
  if (state !== 'play' || downOn < 0 || anim) return;
  const j = hitBottle(cv.logical(e)), i = downOn; downOn = -1;
  if (j >= 0 && j !== i && sel === i) tryPour(i, j);
});
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') undo();
  if (e.key === 'h' || e.key === 'H') showHint();
  const n = parseInt(e.key, 10); const idx = e.key === '0' ? 9 : n - 1;
  if (!isNaN(n) && idx < bottles.length && !gone[idx]) { if (sel < 0) { if (bottles[idx].length) { sel = idx; MG.sfx('tick'); } } else if (sel === idx) sel = -1; else tryPour(sel, idx); }
});

// ---------- drawing ----------
function shapePath(id, r) {
  x.beginPath();
  switch (id) {
    case 'dot': x.arc(0, 0, r * 0.8, 0, 7); break;
    case 'star': for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.42 : r; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } x.closePath(); break;
    case 'tri': x.moveTo(0, -r); x.lineTo(r * 0.95, r * 0.7); x.lineTo(-r * 0.95, r * 0.7); x.closePath(); break;
    case 'heart': x.moveTo(0, r * 0.85); x.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.6, -r * 1.2, 0, -r * 0.45); x.bezierCurveTo(r * 0.6, -r * 1.2, r * 1.4, -r * 0.1, 0, r * 0.85); break;
    case 'square': x.rect(-r * 0.75, -r * 0.75, r * 1.5, r * 1.5); break;
    case 'diamond': x.moveTo(0, -r); x.lineTo(r * 0.75, 0); x.lineTo(0, r); x.lineTo(-r * 0.75, 0); x.closePath(); break;
    case 'moon': x.arc(0, 0, r * 0.85, Math.PI * 0.3, Math.PI * 1.7); x.arc(r * 0.35, 0, r * 0.6, Math.PI * 1.5, Math.PI * 0.5, true); x.closePath(); break;
    case 'plus': { const w = r * 0.32; x.rect(-w, -r * 0.85, w * 2, r * 1.7); x.rect(-r * 0.85, -w, r * 1.7, w * 2); break; }
    case 'ring': x.arc(0, 0, r * 0.85, 0, 7); x.arc(0, 0, r * 0.4, 0, 7, true); break;
    case 'drop': x.moveTo(0, -r); x.quadraticCurveTo(r * 0.9, r * 0.1, 0, r * 0.85); x.quadraticCurveTo(-r * 0.9, r * 0.1, 0, -r); break;
    case 'cross': { const w = r * 0.3; x.save(); x.rotate(Math.PI / 4); x.rect(-w, -r * 0.9, w * 2, r * 1.8); x.rect(-r * 0.9, -w, r * 1.8, w * 2); x.restore(); break; }
    case 'hex': for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; x.lineTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9); } x.closePath(); break;
    case 'bolt': x.moveTo(r * 0.2, -r); x.lineTo(-r * 0.6, r * 0.15); x.lineTo(-r * 0.05, r * 0.15); x.lineTo(-r * 0.25, r); x.lineTo(r * 0.6, -r * 0.2); x.lineTo(r * 0.05, -r * 0.2); x.closePath(); break;
    case 'flower': for (let i = 0; i < 5; i++) { const a = i * Math.PI * 2 / 5 - Math.PI / 2; x.moveTo(Math.cos(a) * r * 0.55 + r * 0.38, Math.sin(a) * r * 0.55); x.arc(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.38, 0, 7); } break;
  }
}
// segs: [[colour, units], ...] from the bottom
function segsOf(b) { const s = []; for (const v of b) { if (s.length && s[s.length - 1][0] === v) s[s.length - 1][1]++; else s.push([v, 1]); } return s; }
function drawBottle(segs, done, happy, tilt = 0) {
  const H = bh(), w2 = BW / 2;
  // glass back
  x.fillStyle = 'rgba(255,255,255,.45)';
  x.beginPath(); x.roundRect(-w2, -H, BW, H, [6, 6, 18, 18]); x.fill();
  x.fillRect(-13, -H - NECK, 26, NECK + 2);
  // liquid
  x.save(); x.beginPath(); x.roundRect(-w2 + 4, -H + 2, BW - 8, H - 6, [4, 4, 14, 14]); x.clip();
  if (tilt) {                                      // tipped over: keep the water level flat
    x.translate(0, -H / 2); x.rotate(-tilt);
    let y = -1e9; for (const sx of [-1, 1]) for (const sy of [-1, 1]) y = Math.max(y, sx * w2 * Math.sin(tilt) + sy * H / 2 * Math.cos(tilt));
    const f = Math.max(0.42, Math.cos(tilt));
    for (const [c, n] of segs) { const h = n * UH * f; if (h <= 0.01) continue; x.fillStyle = c < 0 ? HIDDEN : COLORS[c]; x.fillRect(-200, y - h - 2, 400, h + 2.6); y -= h; }
    x.fillStyle = 'rgba(255,255,255,.3)'; x.fillRect(-200, y - 2, 400, 3);
    segs = [];
  }
  let y = -4, k = 0;
  for (const [c, n] of segs) {
    const h = n * UH; if (h <= 0.01) continue;
    x.fillStyle = c < 0 ? HIDDEN : COLORS[c]; x.fillRect(-w2, y - h, BW, h + 0.6);
    x.fillStyle = 'rgba(0,0,0,.08)'; x.fillRect(w2 - 14, y - h, 10, h);
    if (c < 0) {                                     // ❓ layers: striped, with a question mark each
      x.save(); x.beginPath(); x.rect(-w2, y - h, BW, h); x.clip();
      x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 4; for (let d = -BW; d < h + BW; d += 11) { x.beginPath(); x.moveTo(-w2, y - d); x.lineTo(w2, y - d - BW); x.stroke(); }
      x.restore();
      x.fillStyle = '#6f7f99'; x.font = '900 20px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      for (let u = 0; u < Math.floor(n + 0.001); u++) { x.fillText('?', 0, y - (u + 0.5) * UH + 1); x.fillStyle = 'rgba(111,127,153,.5)'; x.fillRect(-w2, y - u * UH - 1, BW, 1.5); x.fillStyle = '#6f7f99'; }
    } else if (mode === 'shape') {
      for (let u = 0; u < Math.floor(n + 0.001); u++) { x.save(); x.translate(0, y - (u + 0.5) * UH); x.fillStyle = 'rgba(255,255,255,.78)'; shapePath(SHAPES[c], 8.5); x.fill(); x.restore(); }
    }
    y -= h; k++;
  }
  if (segs.length && y < -4) {
    const c = segs[segs.length - 1][0];
    x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.ellipse(0, y, w2 - 5, 3.2, 0, 0, 7); x.fill();
    if (happy) {                                    // a finished bottle smiles
      const fy = y + Math.min(40, -y - 4) / 2 + 6;
      x.fillStyle = '#2b2020'; for (const sd of [-1, 1]) { x.beginPath(); x.arc(sd * 7, fy - 4, 2.4, 0, 7); x.fill(); }
      x.strokeStyle = '#2b2020'; x.lineWidth = 2; x.beginPath(); x.arc(0, fy, 5, 0.3, Math.PI - 0.3); x.stroke();
      x.fillStyle = 'rgba(255,120,140,.55)'; for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(sd * 13, fy, 3.5, 2.2, 0, 0, 7); x.fill(); }
      void c;
    }
  }
  x.restore();
  // glass shine + outline
  x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.roundRect(-w2 + 7, -H + 8, 6, H - 26, 3); x.fill();
  x.strokeStyle = '#6f7f99'; x.lineWidth = 3; x.lineJoin = 'round';
  x.beginPath(); x.moveTo(-13, -H - NECK); x.lineTo(-13, -H); x.lineTo(-w2 + 6, -H); x.quadraticCurveTo(-w2, -H, -w2, -H + 6); x.lineTo(-w2, -18); x.quadraticCurveTo(-w2, 0, -w2 + 18, 0); x.lineTo(w2 - 18, 0); x.quadraticCurveTo(w2, 0, w2, -18); x.lineTo(w2, -H + 6); x.quadraticCurveTo(w2, -H, w2 - 6, -H); x.lineTo(13, -H); x.lineTo(13, -H - NECK); x.stroke();
  x.fillStyle = '#b9c6da'; x.beginPath(); x.roundRect(-17, -H - NECK - 5, 34, 7, 3); x.fill(); x.stroke();
  if (done) { x.fillStyle = '#b07a45'; x.strokeStyle = '#7a5530'; x.lineWidth = 2; x.beginPath(); x.roundRect(-11, -H - NECK - 14, 22, 14, [3, 3, 1, 1]); x.fill(); x.stroke(); }
}
function backdrop(W, H) {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fff6e0'); g.addColorStop(1, '#ffe2c4'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.5)';
  for (let i = 0; i < 9; i++) { const bx = (i * 97 + 30) % W, by = 30 + ((i * 131) % (H - 140)); x.beginPath(); x.arc(bx, by + Math.sin(t * 0.6 + i) * 6, 6 + (i % 3) * 4, 0, 7); x.fill(); }
  // shelf lines under each row
  const rows = [...new Set(pos.map(p => Math.round(p.by)))];
  for (const ry of rows) { x.fillStyle = '#d9a86a'; x.fillRect(10, ry + 4 * scale, W - 20, 9 * scale); x.fillStyle = 'rgba(120,70,20,.25)'; x.fillRect(10, ry + 13 * scale, W - 20, 4 * scale); }
}
function draw() {
  const W = cv.lw, H = cv.lh;
  backdrop(W, H);
  if (!bottles.length) return;
  let animBits = null;
  if (anim) {
    const T = anim.t, mv = Math.min(1, T / 0.22), pr = Math.max(0, Math.min(1, (T - 0.22) / 0.4)), back = Math.max(0, Math.min(1, (T - 0.66) / 0.2));
    animBits = { mv: back > 0 ? 1 - back : mv, pr: back > 0 ? 1 : pr, pouring: T > 0.22 && T < 0.66 };
  }
  // dest bottles first, the moving one last (on top)
  const order = bottles.map((_, i) => i).filter(i => !anim || i !== anim.i);
  if (anim) order.push(anim.i);
  for (const i of order) {
    if (gone[i]) continue;
    const q = pos[i];
    let segs = segsOf(vis(i));
    let cx = q.cx, by = q.by, ang = 0, a = 1, sc = scale;
    if (anim && i === anim.i) {
      const left = pos[anim.i].cx < pos[anim.j].cx ? 1 : -1, A = 1.15 * left;
      const e = animBits.mv * animBits.mv * (3 - 2 * animBits.mv);
      const dq = pos[anim.j], L = (bh() / 2 + NECK) * scale;
      const tx = dq.cx - Math.sin(A) * L, ty = dq.by - (bh() + NECK + 26) * scale + Math.cos(A) * L;   // pivot (centre) target
      const hx = q.cx, hy = q.by - bh() / 2 * scale;
      cx = hx + (tx - hx) * e; by = hy + (ty - hy) * e + bh() / 2 * scale; ang = A * e;
      const lost = anim.k * animBits.pr; let rem = lost;
      segs = segs.map(s => s.slice());
      while (rem > 0 && segs.length) { const s = segs[segs.length - 1], d = Math.min(s[1], rem); s[1] -= d; rem -= d; if (s[1] <= 0.0001) segs.pop(); }
    } else if (anim && i === anim.j) {
      segs = segsOf(vis(i)); const add = anim.k * animBits.pr;
      if (add > 0) { if (segs.length && segs[segs.length - 1][0] === anim.c) segs[segs.length - 1][1] += add; else segs.push([anim.c, add]); }
    }
    if (i === sel) by -= 18 * scale;
    if (shake[i] > 0) cx += Math.sin(shake[i] * 60) * 5 * scale * (shake[i] / 0.35);
    if (fade[i] > 0) { const f = fade[i]; by -= f * 30 * scale; sc = scale * (1 + f * 0.25); a = Math.max(0, 1 - Math.max(0, f - 0.45) / 0.55); }
    x.save(); x.globalAlpha = a; x.translate(cx, by);
    if (ang) { x.translate(0, -bh() / 2 * sc); x.rotate(ang); x.translate(0, bh() / 2 * sc); }
    x.scale(sc, sc);
    if (hint && (i === hint.i || i === hint.j) && Math.floor(hint.t * 4) % 2 === 0) { x.fillStyle = 'rgba(255,210,63,.45)'; x.beginPath(); x.roundRect(-BW / 2 - 10, -bh() - NECK - 18, BW + 20, bh() + NECK + 28, 14); x.fill(); }
    drawBottle(segs, fade[i] > 0, fade[i] > 0, ang);
    x.restore();
    // number label (for keyboard players)
    if (fade[i] === 0 && !(anim && i === anim.i)) { x.fillStyle = 'rgba(90,60,30,.45)'; x.font = `700 ${Math.round(12 * scale + 2)}px system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(i < 9 ? i + 1 : i === 9 ? 0 : '', q.cx, q.by + 22 * scale); }
  }
  // the stream of water
  if (anim && animBits.pouring) {
    const left = pos[anim.i].cx < pos[anim.j].cx ? 1 : -1, dq = pos[anim.j];
    const mx = dq.cx, my = dq.by - (bh() + NECK + 26) * scale;
    const fill = bottles[anim.j].length + anim.k * animBits.pr;
    const ly = dq.by - (4 + fill * UH) * scale;
    x.strokeStyle = COLORS[anim.c]; x.lineCap = 'round'; x.lineWidth = 7 * scale;
    x.beginPath(); x.moveTo(mx + left * 2 * scale, my); x.lineTo(mx, ly); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.6)'; for (let k = 0; k < 3; k++) { const yy = my + ((t * 300 + k * 40) % Math.max(10, ly - my)); x.beginPath(); x.arc(mx - 1, yy, 1.6 * scale, 0, 7); x.fill(); }
  }
  // hint arrow
  if (hint) {
    const a = pos[hint.i], b = pos[hint.j], yA = a.by - (bh() + NECK + 34) * scale, yB = b.by - (bh() + NECK + 34) * scale, bob = Math.sin(t * 8) * 4;
    x.strokeStyle = '#ff9f1c'; x.lineWidth = 5; x.lineCap = 'round'; x.setLineDash([2, 10]);
    x.beginPath(); x.moveTo(a.cx, yA + bob); x.quadraticCurveTo((a.cx + b.cx) / 2, Math.min(yA, yB) - 50 * scale, b.cx, yB + bob); x.stroke(); x.setLineDash([]);
    x.fillStyle = '#ff9f1c'; x.beginPath(); x.moveTo(b.cx, yB + 12 + bob); x.lineTo(b.cx - 10, yB - 4 + bob); x.lineTo(b.cx + 10, yB - 4 + bob); x.fill();
  }
  MG.fx.draw(x);
  drawFloats();
  // toolbar
  for (const b of btns) {
    const off = (b.id === 'add' && extraUsed) || (b.id === 'undo' && !hist.length);
    x.fillStyle = off ? '#efe4cc' : b.id === 'hint' ? '#ffd23f' : '#fff7e6';
    x.strokeStyle = off ? '#d8c9a6' : '#c99a5a'; x.lineWidth = 2.5;
    x.beginPath(); x.roundRect(b.x, b.y, b.w, b.h, 14); x.fill(); x.stroke();
    x.fillStyle = off ? '#b5a585' : '#4a3520'; x.font = `700 ${b.w < 100 ? 15 : 18}px "Noto Sans TC",system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
}

// short English + emoji words above a bottle
function say(i, text, col) { const q = pos[i]; if (!q) return; floats = floats.filter(f => f.i !== i); floats.push({ i, text, col, x: q.cx, y: q.by - (bh() + NECK + 40) * scale, life: 1.2 }); }
function drawFloats() {
  const W = cv.lw;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    let sz = Math.round(Math.max(18, Math.min(30, 24 * scale)));
    x.font = `900 ${sz}px system-ui,"Noto Sans TC",sans-serif`;
    let tw = x.measureText(f.text).width;
    if (tw > W - 16) { sz = Math.floor(sz * (W - 16) / tw); x.font = `900 ${sz}px system-ui,"Noto Sans TC",sans-serif`; tw = x.measureText(f.text).width; }
    const fx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x)), fy = Math.max(sz, f.y - (1.2 - f.life) * 30);
    x.globalAlpha = Math.min(1, f.life * 2.5);
    x.lineWidth = Math.max(3, sz * 0.2); x.strokeStyle = '#fff'; x.strokeText(f.text, fx, fy);
    x.fillStyle = f.col; x.fillText(f.text, fx, fy);
  }
  x.globalAlpha = 1;
}

// ---------- menu ----------
function menu() {
  state = 'menu';
  MG.choose({
    id: 'pour', title: '彩虹倒水瓶',
    html: `<p>點一個瓶子，再點另一個瓶子，就會把上面的水倒過去。<b>只能倒在一樣的顏色上面，或倒進空瓶子</b>。</p><p>把每個瓶子都倒成同一個顏色，瓶子就會蓋上蓋子、開心地消失！不限時間，慢慢想 ^_^</p><p>第 13 關以後是挑戰關：只有一個空瓶、❓ 神秘瓶（下面的顏色要倒開才看得到）、最多 14 種顏色！</p>`,
    modes: [{ id: 'shape', label: '🔷 有小圖案', sub: '每種顏色都有圖案，比較好認' }, { id: 'plain', label: '🎨 只看顏色', sub: '挑戰眼力' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${lvName(n)}）` },
    keys: '點瓶子或拖過去倒　<kbd>1</kbd>～<kbd>9</kbd> 選瓶子　<kbd>Z</kbd> 復原　<kbd>H</kbd> 提示',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
// sample puzzle behind the start panel
cap = 4; bottles = makePuzzle(4, 4); hid = bottles.map(b => b.map(() => false)); gone = bottles.map(() => false); fade = bottles.map(() => 0); shake = bottles.map(() => 0); layout();
menu();
window.PRT = { get state() { return state; }, floats: () => floats.map(f => f.text), bottles: () => bottles.map(b => b.slice()), get cap() { return cap; }, get anim() { return !!anim; }, gone: () => gone.slice(),
  at(i) { const q = pos[i], rc = cv.getBoundingClientRect(), B = 3, lx = q.cx, ly = q.by - bh() / 2 * scale; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; } };

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  for (let i = 0; i < shake.length; i++) shake[i] = Math.max(0, shake[i] - dt);
  if (hint) { hint.t += dt; if (hint.t > 6) hint = null; }
  if (anim) { anim.t += dt; if (anim.t >= 0.86) finishPour(); }
  for (let i = 0; i < fade.length; i++) if (fade[i] > 0 && !gone[i]) { fade[i] += dt / 1.1; if (fade[i] >= 1) { gone[i] = true; } }
  if (state === 'play' && !anim && bottles.every((b, i) => gone[i] || b.length === 0)) win();
  draw();
});
</script>
