const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TS = () => MG.textScale, F = (px, w = 900) => `${w} ${Math.round(px * TS())}px system-ui,"Noto Sans TC",${EMO}`;

// ---------- layout: the sky column (FW wide) keeps a 360-wide feel; spare room in landscape becomes side panels ----------
let W = 360, H = 640, FW = 360, FH = 640, FX = 0, LAY = 'none', kx = 1;
const BASEW = 360, BASEH = 600;
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22)), oldFW = FW;
  if (a >= BASEW / BASEH) { H = BASEH; W = Math.round(H * a); FW = Math.min(W, 540); }
  else { W = BASEW; H = Math.round(Math.min(1000, W / a)); FW = W; }
  FW = Math.round(FW); FX = Math.round((W - FW) / 2); LAY = FX >= 120 ? 'side' : 'none'; FH = H; kx = FW / BASEW;
  if (oldFW !== FW && clouds) rescaleX(FW / oldFW);
  return [W, H];
}

// ---------- physics ----------
const PXM = 10;                 // 10 px = 1 metre
const R = 19, BASEG = 1500, BASEJ = 760, SPRINGJ = 1320;
const VX = () => 360 * kx;

// ---------- themes ----------
const THEMES = {
  day: { nm: '藍天', ic: '☀️', sky: ['#48a8ee', '#98d2ff', '#e4f6ff'], cl: ['#ffffff', '#d6e8ff', '#86a8d4'], far: 'cloud', gr: 'meadow', ink: '#245a8a' },

  rain: { nm: '雨天', ic: '🌧️', sky: ['#7896c0', '#b0c6e0', '#e8f0f7'], cl: ['#ffffff', '#dbe5f1', '#8299b8'], far: 'drizzle', gr: 'meadow', ink: '#2f4a6e' },

  night: { nm: '夜空', ic: '🌙', sky: ['#0e1442', '#262c74', '#4a4a9c'], cl: ['#f0eeff', '#b6b1ee', '#6a63bd'], far: 'stars', gr: 'night', glow: 'rgba(190,180,255,.55)', ink: '#fff' },
  space: { nm: '太空', ic: '🚀', sky: ['#05041a', '#14103e', '#2e1d5e'], cl: ['#f6f2ff', '#c8b8ff', '#7860d4'], far: 'space', gr: 'space', glow: 'rgba(170,150,255,.6)', ink: '#fff', lowG: 1 },
  rainbow: { nm: '彩虹', ic: '🌈', sky: ['#74c4ff', '#c4e4ff', '#fff0fb'], cl: ['#ffffff', '#ebe3ff', '#a08cd4'], far: 'rainbow', gr: 'meadow', ink: '#5a3f9a' },
  thunder: { nm: '雷雲', ic: '⚡', sky: ['#3d4a78', '#6f7fae', '#b9c3dc'], cl: ['#f4f6ff', '#c9d1ea', '#6c78a4'], far: 'thunder', gr: 'meadow', ink: '#fff', storm: 1 },

};
// confetti colours for each sky (win party, collect sparkles)
const FXC = { day: ['#ffd34a', '#5fc8ff', '#7ed957', '#fff'], sunset: ['#ff9a5a', '#ffd166', '#ff7aa8', '#fff'], rain: ['#7cc8ff', '#b6e3ff', '#ffd34a', '#fff'], candy: ['#ff6fa8', '#8fd8ff', '#ffd23f', '#9be38a'], night: ['#fff3a0', '#c6b8ff', '#ff9ec8', '#fff'], space: ['#c6a8ff', '#8fe0ff', '#ffb46b', '#fff'], rainbow: ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'], thunder: ['#ffe066', '#9fc6ff', '#ffffff', '#ffb347'], aurora: ['#7affd6', '#8fb8ff', '#d7a8ff', '#fff'] };
const PAL_MOVE = ['#fffbe8', '#ffe196', '#cf962a'], PAL_RAIN = ['#e4e9f1', '#97a6bf', '#5d6d8c'], PAL_RESCUE = ['#ffffff', '#fff0fa', '#e48ab8'], PAL_MELT = ['#fff7ef', '#ffd3b4', '#dc8a5c'], PAL_SLIDE = ['#ffffff', '#fff1d6', '#e0a24a'], PAL_HOUSE = ['#ffffff', '#e2f4ff', '#6aa6d8'], PAL_STORM = ['#dfe3f0', '#8f99b8', '#4d5878'];
const RB = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];

// ---------- levels ----------
// h: goal height (m) or c: collect {k: kind, n}; m: path-cloud mix; bub/bird/rk: chance per step of a bubble / bird / rocket; wind: gust strength; goal: what waits at the top
const LEVELS = [
  { n: '第一朵雲', th: 'day', h: 120, m: { normal: 1 }, goal: 'balloon', mk: '🌱', e: 0.1 },
  { n: '星星小路', th: 'day', c: { k: 'star', n: 6 }, m: { normal: 1 }, mk: '⭐', e: 0.1 },

  { n: '小鳥朋友', th: 'sunset', h: 230, m: { normal: 3, rain: 1 }, bird: 0.24, goal: 'balloon', mk: '🐦', e: 0.08 },
  { n: '氣球派對', th: 'sunset', h: 260, m: { normal: 3, spring: 1, move: 1 }, goal: 'balloon', mk: '🎈' },

  { n: '棉花糖山', th: 'candy', h: 290, m: { normal: 2, spring: 1, rain: 1, move: 1 }, goal: 'candy', mk: '🍬' },
  { n: '點燈籠', th: 'night', c: { k: 'lantern', n: 8 }, m: { normal: 3, move: 1 }, mk: '🏮', e: 0.05 },

  { n: '彩虹城堡', th: 'rainbow', h: 310, m: { normal: 3, spring: 1, move: 1 }, bub: 0.15, goal: 'castle', mk: '🏰' },
  { n: '泡泡和小鳥', th: 'sunset', h: 310, m: { normal: 3, rain: 1 }, bub: 0.2, bird: 0.18, goal: 'balloon', mk: '🫧' },
  { n: '大風吹', th: 'day', h: 310, m: { normal: 2, move: 2 }, wind: 105, goal: 'balloon', mk: '🍃' },

  { n: '流星雨', th: 'space', c: { k: 'star', n: 14 }, m: { normal: 2, move: 1, rain: 1 }, rk: 0.1, mk: '⭐' },
  { n: '水果大豐收', th: 'sunset', c: { k: 'fruit', n: 14 }, m: { normal: 2, move: 1, spring: 1 }, wind: 55, mk: '🍓' },
  { n: '糖果大收集', th: 'candy', c: { k: 'candy', n: 16 }, m: { normal: 2, move: 1, rain: 1 }, bub: 0.15, mk: '🍬' },
  { n: '燈籠節', th: 'night', c: { k: 'lantern', n: 14 }, m: { normal: 2, move: 1, rain: 1 }, bird: 0.18, mk: '🏮' },
  { n: '會動的雲路', th: 'sunset', h: 390, m: { normal: 1, move: 3 }, goal: 'balloon', mk: '↔️' },
  { n: '小鳥接力', th: 'day', h: 420, m: { normal: 2, rain: 2 }, bird: 0.3, goal: 'balloon', mk: '🐦' },
  { n: '月亮旅行', th: 'night', h: 420, m: { normal: 2, move: 1, rain: 1, spring: 1 }, bub: 0.12, goal: 'moon', mk: '🌙' },
  { n: '太空彈彈', th: 'space', h: 440, m: { normal: 2, spring: 1, move: 1, rain: 1 }, rk: 0.12, goal: 'moon', mk: '🚀' },
  { n: '彩虹大冒險', th: 'rainbow', h: 470, m: { normal: 2, spring: 1, move: 1, rain: 1 }, bub: 0.12, bird: 0.12, wind: 55, goal: 'castle', mk: '🌈' },
  { n: '夜空大冒險', th: 'night', h: 490, m: { normal: 2, spring: 1, move: 2, rain: 1 }, bub: 0.12, bird: 0.15, goal: 'moon', mk: '🌙' },
  { n: '天空之頂', th: 'rainbow', h: 550, m: { normal: 2, spring: 1, move: 2, rain: 2 }, bub: 0.1, bird: 0.12, wind: 75, goal: 'castle', mk: '🏆' },
  // ---- 31+ (append only): new ways to play — 🎈 rescue lost balloons, ✉️ deliver letters to sky houses, 🌈 rainbow slides, 🌬️ wind gusts, 🫠 melting clouds, ✈️ planes ----
  { n: '找回氣球', th: 'day', c: { k: 'balloon', n: 6 }, m: { normal: 3, spring: 1 }, mk: '🎈', e: 0.55 },
  { n: '小小郵差', th: 'day', c: { k: 'mail', n: 3 }, m: { normal: 3, move: 1 }, mk: '✉️', e: 0.55 },
  { n: '彩虹溜滑梯', th: 'rainbow', h: 260, m: { normal: 3, slide: 1 }, goal: 'castle', mk: '🛝', e: 0.5 },
  { n: '陣風來了', th: 'sunset', h: 260, m: { normal: 3, move: 1 }, gust: 150, goal: 'balloon', mk: '🌬️', e: 0.45 },
  { n: '融化的雲', th: 'sunset', h: 300, m: { normal: 2, melt: 2 }, plane: 0.12, goal: 'house', mk: '🫠', e: 0.35 },
  { n: '轟隆雷雲', th: 'thunder', h: 360, m: { normal: 2, rain: 1, melt: 1, move: 1 }, gust: 170, goal: 'house', mk: '⚡', e: 0.2 },
  { n: '極光寶石', th: 'aurora', c: { k: 'gem', n: 14 }, m: { normal: 2, move: 1, melt: 1, slide: 1 }, bird: 0.12, mk: '💎', e: 0.1 },
  { n: '氣球大搜救', th: 'thunder', c: { k: 'balloon', n: 14 }, m: { normal: 2, move: 1, rain: 1, slide: 1 }, wind: 60, plane: 0.12, mk: '🎈' },
  { n: '天空郵差大挑戰', th: 'aurora', c: { k: 'mail', n: 7 }, m: { normal: 2, move: 2, melt: 1, rain: 1, slide: 1 }, gust: 190, bub: 0.08, mk: '🏆' },
  { n: '飛向太空站', th: 'space', h: 700, m: { normal: 2, move: 2, melt: 1, rain: 1, spring: 1, slide: 1 }, gust: 200, rk: 0.08, plane: 0.06, goal: 'station', mk: '🏆' },
];
const ENDLESS = LEVELS.length + 1;
const ITEM = { star: '⭐', fruit: '🍓', candy: '🍬', lantern: '🏮', balloon: '🎈', gem: '💎', mail: '✉️' };
const GOALN = { balloon: '🎈 氣球派對', candy: '🍬 糖果屋', moon: '🌙 月亮', castle: '🏰 彩虹城堡', house: '🏡 天空小屋', station: '🛸 太空站' };
const lvName = n => n === ENDLESS ? '♾️ 一直跳' : `${THEMES[LEVELS[n - 1].th].ic} ${LEVELS[n - 1].n}`;
const GOALE = { balloon: '🎈', candy: '🍬', moon: '🌙', castle: '🏰', house: '🏡', station: '🛸' };
const lvGoal = L => L.c ? `${ITEM[L.c.k]}×${L.c.n}` : `${GOALE[L.goal]} ${L.h} 公尺`;
const ENDLESS_TH = ['day', 'sunset', 'rainbow', 'rain', 'thunder', 'candy', 'night', 'aurora', 'space'];

// ---------- state ----------
let level = 1, L = LEVELS[0], mode = 'relax', state = 'ready';
let P, clouds = null, items = [], bubbles = [], birds = [], floats = [], leaves = [], drops = [], gusts = [], amb = [];
let met = { bird: 0, plane: 0, bub: 0, slide: 0 }, cel = 0, flash = 0, flashT = 3, gustOn = 0;
let camY = 0, t = 0, best = 0, got = 0, hearts = 3, rescues = 0, stars = 0, windV = 0, nextMile = 50, goal = null, gen = null, rng = Math.random, bgTh = 'day', bgOld = null, bgFade = 0;
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
function say(t0, c, px, py) { floats.push({ x: clamp(px, 60, FW - 60), y: py, t: t0, c: c || '#fff', life: 1 }); }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const rr = (a, b) => a + rng() * (b - a);
const themeAt = y => L ? L.th : ENDLESS_TH[Math.floor(Math.max(0, -y / PXM) / 250) % ENDLESS_TH.length];
const SLIDE_H = 150;
const grav = () => (L && THEMES[L.th].lowG) ? { g: 0.62, j: 0.84 } : { g: 1, j: 1 };

// difficulty 0..1 → gaps and widths
function diff(y) {
  let d;
  const li = L ? LEVELS.indexOf(L) : -1;
  if (L) d = li < 30 ? clamp(li / 29 - (L.e || 0), 0, 1) : clamp(0.86 + (li - 30) * 0.035 - (L.e || 0), 0, 1.2);   // 31–40 reach a bit past the old top
  else d = clamp(-y / PXM / 2200, 0, 1);
  const r = { gap: [64 + 34 * d, 88 + 46 * d], w: [120 - 40 * d, 140 - 50 * d], ex: 0.4 - 0.22 * d, msp: 0.8 + d * 0.7 };
  if (L) Object.assign(r, { m: L.m, bub: L.bub || 0, bird: L.bird || 0, rk: L.rk || 0, plane: L.plane || 0, gust: L.gust ? 0.2 : 0 });
  else {   // ♾️: new things show up as you climb
    const h = -y / PXM, m = { normal: 4 };
    if (h > 40) m.spring = 1; if (h > 90) m.move = 1.5 + d * 2; if (h > 160) m.rain = 1 + d * 2; if (h > 280) m.melt = 1; if (h > 380) m.slide = 0.7;
    Object.assign(r, { m, bub: h > 120 ? 0.1 : 0, bird: h > 220 ? 0.1 : 0, rk: 0, plane: h > 320 ? 0.06 : 0, gust: h > 520 ? 0.12 : 0 });
  }
  return r;
}
function pickMix(m) { let s = 0; for (const k in m) s += m[k]; let v = rng() * s; for (const k in m) { v -= m[k]; if (v <= 0) return k; } return 'normal'; }

// ---------- world generation (seeded per level, so every level is the same each time and can be checked) ----------
function addCloud(type, cx, y, w, path) {
  const c = { type, x: clamp(cx - w / 2, 4, FW - w - 4), y, w, path, gone: false, fade: 0, sq: 0, th: themeAt(y), alt: rng() < 0.5, ph: rng() * 6.3 };
  if (type === 'move') {
    c.bx = c.x; c.amp = Math.min(rr(36, 80) * kx, c.bx - 4, FW - w - 4 - c.bx);
    if (c.amp < 26) { c.bx = (FW - w) / 2 + rr(-20, 20) * kx; c.amp = Math.min(rr(36, 80) * kx, c.bx - 4, FW - w - 4 - c.bx); }
    c.sp = rr(0.8, 1.2) * gen.d.msp;
  }
  if (type === 'slide') { const cx0 = c.x + w / 2; c.sdir = cx0 < FW / 2 ? 1 : -1; c.sl = Math.min(FW * 0.4, 150 * kx); }
  if (type === 'house') { c.col = Math.floor(rng() * 4); c.done = false; }
  clouds.push(c); return c;
}
function genStep() {
  const d = gen.d = diff(gen.y), gap = rr(d.gap[0], d.gap[1]);
  if (goal && gen.y - goal.y <= d.gap[1]) { gen.done = true; return; }
  let ny = gen.y - gap; if (goal && ny - goal.y < 50) ny = goal.y + 50;
  const wk = 1 + (kx - 1) * 0.55, w = rr(d.w[0], d.w[1]) * wk;
  let cx = gen.px + rr(-0.45, 0.45) * FW;
  if (cx < w / 2 + 6) cx = 2 * (w / 2 + 6) - cx; if (cx > FW - w / 2 - 6) cx = 2 * (FW - w / 2 - 6) - cx; cx = clamp(cx, w / 2 + 6, FW - w / 2 - 6);
  let type = gen.n < 3 ? 'normal' : pickMix(d.m);
  if ((type === 'spring' || type === 'slide') && (gen.prev === 'spring' || gen.prev === 'slide')) type = 'normal';
  const mail = L && L.c && L.c.k === 'mail';
  if (mail && gen.n >= 3 && gen.n - gen.lastHouse >= 4 && rng() < 0.6) type = 'house';
  if (type === 'slide' && goal && ny - SLIDE_H - goal.y < 160) type = 'normal';   // ✉️ a sky house waits on the path every few clouds
  const c = addCloud(type, cx, ny, type === 'house' ? Math.max(w, 112 * wk) : w, gen.n++);
  if (type === 'house') gen.lastHouse = gen.n;
  gen.prev = type;
  const mid = (gen.y + ny) / 2;
  if (d.gust && gen.n > 4 && rng() < d.gust && !gusts.some(o => Math.abs(o.y - mid) < 260)) gusts.push({ y: mid, h: rr(90, 130), dir: rng() < 0.5 ? -1 : 1, ph: rng() * 6 });
  if (type === 'slide') {   // 🌈 the rainbow carries 噗噗 up to its far end, the next cloud is counted from there
    gen.y = ny - SLIDE_H; gen.px = c.x + c.w / 2 + c.sdir * c.sl;
    if (L && L.c && L.c.k !== 'mail' && rng() < 0.7) items.push(mkItem(L.c.k, gen.px, gen.y - 44));
    else if (!(L && L.c) && rng() < 0.6) items.push(mkItem('star', c.x + c.w / 2 + c.sdir * c.sl * 0.55, ny - SLIDE_H * 0.62));
    return;
  }
  // goodies: things to collect sit right on the way (most of them) or a little off to the side
  if (mail) { if (gen.n > 3 && rng() < 0.18) items.push(mkItem('star', c.x + c.w / 2, ny - 40, c)); }
  else if (L && L.c) {
    if (gen.n > 2 && rng() < 0.72) {
      if (rng() < 0.7) items.push(mkItem(L.c.k, c.x + c.w / 2, ny - 40, c));
      else items.push(mkItem(L.c.k, rr(30, FW - 30), mid));
    }
  } else if (gen.n > 3 && rng() < 0.2) items.push(mkItem('star', c.x + c.w / 2, ny - 40, c));
  // extra clouds to choose from
  if (rng() < d.ex) {
    const w2 = rr(d.w[0], d.w[1]) * wk * 0.9, side = c.x + c.w / 2 < FW / 2 ? 1 : -1;
    const cx2 = clamp(c.x + c.w / 2 + side * rr(0.35, 0.55) * FW, w2 / 2 + 6, FW - w2 / 2 - 6);
    const y2 = ny + rr(-gap * 0.35, gap * 0.35);
    if (Math.abs(cx2 - (c.x + c.w / 2)) > (w + w2) / 2 + 10 && !clouds.some(o => Math.abs(o.y - y2) < 58 && cx2 + w2 / 2 + 12 > o.x && cx2 - w2 / 2 - 12 < o.x + o.w)) addCloud(d.m.rain && rng() < 0.4 ? 'rain' : 'normal', cx2, y2, w2, -1);

  },
  step(frames = 60) { for (let i = 0; i < frames && state === 'play'; i++) update(1 / 60); },
  dbg: () => ({ x: Math.round(P.x), y: Math.round(P.y), vy: Math.round(P.vy), cam: Math.round(camY), tgt: P.tgt && { x: Math.round(P.tgt.x), y: Math.round(P.tgt.y), w: Math.round(P.tgt.w), type: P.tgt.type, gone: P.tgt.gone }, ride: !!P.ride, bub: P.bub, best, rescues, birds: birds.length }),
  menu: () => menu(),
  get met() { return { ...met }; }, get gusts() { return gusts.length; }, get theme() { return bgTh; },
  types: () => { const o = {}; for (const c of clouds) o[c.type] = (o[c.type] || 0) + 1; return o; },
};
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) { for (let i = 0; i < (HOOK.fast | 0 || 1) && state === 'play'; i++) update(dt); }
  else {
    t += dt; MG.fx.step(dt); stepFx(dt);
    if (state === 'ready' && P) { P.y = -R - Math.abs(Math.sin(t * 3.2)) * 120; P.squash = Math.max(0, 0.3 - Math.abs(Math.sin(t * 3.2)) * 3); P.face = 'happy'; }
  }
  draw();
});
</script>
