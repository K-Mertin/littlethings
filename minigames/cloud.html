<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'cloud', title: '噗噗跳跳雲', stats: ['lv', 'goal'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TS = () => MG.textScale, F = (px, w = 900) => `${w} ${Math.round(px * TS())}px system-ui,"Noto Sans TC",${EMO}`;

// ---------- layout: the sky column (FW wide) keeps a 360-wide feel; spare room in landscape becomes side panels ----------
let W = 360, H = 640, FW = 360, FH = 640, FX = 0, LAY = 'none', kx = 1;
const BASEW = 360, BASEH = 600;
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22)), oldFW = FW;
  if (a >= BASEW / BASEH) { H = BASEH; W = Math.round(H * a); FW = Math.min(W, 540); }
  else { W = BASEW; H = Math.round(Math.min(1000, W / a)); FW = W; }
  FW = Math.round(FW); FX = Math.round((W - FW) / 2); LAY = FX >= 120 ? 'side' : 'none'; FH = H; kx = FW / BASEW;
  if (oldFW !== FW && clouds) rescaleX(FW / oldFW);
  return [W, H];
}

// ---------- physics ----------
const PXM = 10;                 // 10 px = 1 metre
const R = 19, BASEG = 1500, BASEJ = 760, SPRINGJ = 1320;
const VX = () => 360 * kx;

// ---------- themes ----------
const THEMES = {
  day: { nm: '藍天', ic: '☀️', sky: ['#48a8ee', '#98d2ff', '#e4f6ff'], cl: ['#ffffff', '#d6e8ff', '#86a8d4'], far: 'cloud', gr: 'meadow', ink: '#245a8a' },
  sunset: { nm: '黃昏', ic: '🧡', sky: ['#6f6ad6', '#ff9cc0', '#ffd99a'], cl: ['#fffaf6', '#ffd4df', '#c9879a'], far: 'cloud', gr: 'meadow', ink: '#7a3a5e' },
  rain: { nm: '雨天', ic: '🌧️', sky: ['#7896c0', '#b0c6e0', '#e8f0f7'], cl: ['#ffffff', '#dbe5f1', '#8299b8'], far: 'drizzle', gr: 'meadow', ink: '#2f4a6e' },
  candy: { nm: '糖果天空', ic: '🍭', sky: ['#ff98cf', '#ffcde9', '#c6f3ff'], cl: ['#fff2fa', '#ffc4e3', '#d777ab'], cl2: ['#f0fffa', '#b8efdc', '#4fb594'], far: 'candy', gr: 'candy', ink: '#8a2f63' },
  night: { nm: '夜空', ic: '🌙', sky: ['#0e1442', '#262c74', '#4a4a9c'], cl: ['#f0eeff', '#b6b1ee', '#6a63bd'], far: 'stars', gr: 'night', glow: 'rgba(190,180,255,.55)', ink: '#fff' },
  space: { nm: '太空', ic: '🚀', sky: ['#05041a', '#14103e', '#2e1d5e'], cl: ['#f6f2ff', '#c8b8ff', '#7860d4'], far: 'space', gr: 'space', glow: 'rgba(170,150,255,.6)', ink: '#fff', lowG: 1 },
  rainbow: { nm: '彩虹', ic: '🌈', sky: ['#74c4ff', '#c4e4ff', '#fff0fb'], cl: ['#ffffff', '#ebe3ff', '#a08cd4'], far: 'rainbow', gr: 'meadow', ink: '#5a3f9a' },
};
const PAL_MOVE = ['#fffbe8', '#ffe196', '#cf962a'], PAL_RAIN = ['#e4e9f1', '#97a6bf', '#5d6d8c'], PAL_RESCUE = ['#ffffff', '#fff0fa', '#e48ab8'];
const RB = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#4dabf7', '#9775fa'];

// ---------- levels ----------
// h: goal height (m) or c: collect {k: kind, n}; m: path-cloud mix; bub/bird/rk: chance per step of a bubble / bird / rocket; wind: gust strength; goal: what waits at the top
const LEVELS = [
  { n: '第一朵雲', th: 'day', h: 120, m: { normal: 1 }, goal: 'balloon', mk: '🌱', e: 0.1 },
  { n: '星星小路', th: 'day', c: { k: 'star', n: 6 }, m: { normal: 1 }, mk: '⭐', e: 0.1 },
  { n: '彈彈床', th: 'day', h: 200, m: { normal: 3, spring: 1 }, goal: 'balloon', mk: '🤸', e: 0.08 },
  { n: '飄來飄去', th: 'sunset', h: 200, m: { normal: 2, move: 2 }, goal: 'balloon', mk: '↔️', e: 0.08 },
  { n: '下雨雲', th: 'rain', h: 200, m: { normal: 2, rain: 2 }, goal: 'balloon', mk: '🌧️', e: 0.08 },
  { n: '水果雲', th: 'day', c: { k: 'fruit', n: 8 }, m: { normal: 3, move: 1 }, mk: '🍓' },
  { n: '泡泡雲', th: 'day', h: 230, m: { normal: 3, move: 1 }, bub: 0.3, goal: 'balloon', mk: '🫧', e: 0.08 },
  { n: '小鳥朋友', th: 'sunset', h: 230, m: { normal: 3, rain: 1 }, bird: 0.24, goal: 'balloon', mk: '🐦', e: 0.08 },
  { n: '氣球派對', th: 'sunset', h: 260, m: { normal: 3, spring: 1, move: 1 }, goal: 'balloon', mk: '🎈' },
  { n: '風吹吹', th: 'day', h: 230, m: { normal: 3, move: 1 }, wind: 70, goal: 'balloon', mk: '🍃', e: 0.08 },
  { n: '糖果天空', th: 'candy', c: { k: 'candy', n: 10 }, m: { normal: 3, spring: 1 }, mk: '🍭' },
  { n: '棉花糖山', th: 'candy', h: 290, m: { normal: 2, spring: 1, rain: 1, move: 1 }, goal: 'candy', mk: '🍬' },
  { n: '點燈籠', th: 'night', c: { k: 'lantern', n: 8 }, m: { normal: 3, move: 1 }, mk: '🏮', e: 0.05 },
  { n: '晚安月亮', th: 'night', h: 290, m: { normal: 2, rain: 1, move: 1 }, goal: 'moon', mk: '🌙' },
  { n: '彩虹城堡', th: 'rainbow', h: 310, m: { normal: 3, spring: 1, move: 1 }, bub: 0.15, goal: 'castle', mk: '🏰' },
  { n: '泡泡和小鳥', th: 'sunset', h: 310, m: { normal: 3, rain: 1 }, bub: 0.2, bird: 0.18, goal: 'balloon', mk: '🫧' },
  { n: '大風吹', th: 'day', h: 310, m: { normal: 2, move: 2 }, wind: 105, goal: 'balloon', mk: '🍃' },
  { n: '雨天彩虹', th: 'rain', h: 320, m: { normal: 1, rain: 3 }, goal: 'castle', mk: '🌧️' },
  { n: '太空漫步', th: 'space', h: 340, m: { normal: 3, move: 1 }, rk: 0.12, goal: 'moon', mk: '🚀', e: 0.1 },
  { n: '流星雨', th: 'space', c: { k: 'star', n: 14 }, m: { normal: 2, move: 1, rain: 1 }, rk: 0.1, mk: '⭐' },
  { n: '水果大豐收', th: 'sunset', c: { k: 'fruit', n: 14 }, m: { normal: 2, move: 1, spring: 1 }, wind: 55, mk: '🍓' },
  { n: '糖果大收集', th: 'candy', c: { k: 'candy', n: 16 }, m: { normal: 2, move: 1, rain: 1 }, bub: 0.15, mk: '🍬' },
  { n: '燈籠節', th: 'night', c: { k: 'lantern', n: 14 }, m: { normal: 2, move: 1, rain: 1 }, bird: 0.18, mk: '🏮' },
  { n: '會動的雲路', th: 'sunset', h: 390, m: { normal: 1, move: 3 }, goal: 'balloon', mk: '↔️' },
  { n: '小鳥接力', th: 'day', h: 420, m: { normal: 2, rain: 2 }, bird: 0.3, goal: 'balloon', mk: '🐦' },
  { n: '月亮旅行', th: 'night', h: 420, m: { normal: 2, move: 1, rain: 1, spring: 1 }, bub: 0.12, goal: 'moon', mk: '🌙' },
  { n: '太空彈彈', th: 'space', h: 440, m: { normal: 2, spring: 1, move: 1, rain: 1 }, rk: 0.12, goal: 'moon', mk: '🚀' },
  { n: '彩虹大冒險', th: 'rainbow', h: 470, m: { normal: 2, spring: 1, move: 1, rain: 1 }, bub: 0.12, bird: 0.12, wind: 55, goal: 'castle', mk: '🌈' },
  { n: '夜空大冒險', th: 'night', h: 490, m: { normal: 2, spring: 1, move: 2, rain: 1 }, bub: 0.12, bird: 0.15, goal: 'moon', mk: '🌙' },
  { n: '天空之頂', th: 'rainbow', h: 550, m: { normal: 2, spring: 1, move: 2, rain: 2 }, bub: 0.1, bird: 0.12, wind: 75, goal: 'castle', mk: '🏆' },
];
const ENDLESS = LEVELS.length + 1;
const ITEM = { star: '⭐', fruit: '🍓', candy: '🍬', lantern: '🏮' };
const GOALN = { balloon: '🎈 氣球派對', candy: '🍬 糖果屋', moon: '🌙 月亮', castle: '🏰 彩虹城堡' };
const lvName = n => n === ENDLESS ? '♾️ 一直跳' : `${THEMES[LEVELS[n - 1].th].ic} ${LEVELS[n - 1].n}`;
const GOALE = { balloon: '🎈', candy: '🍬', moon: '🌙', castle: '🏰' };
const lvGoal = L => L.c ? `${ITEM[L.c.k]}×${L.c.n}` : `${GOALE[L.goal]} ${L.h} 公尺`;
const ENDLESS_TH = ['day', 'sunset', 'rain', 'candy', 'night', 'space', 'rainbow'];

// ---------- state ----------
let level = 1, L = LEVELS[0], mode = 'relax', state = 'ready';
let P, clouds = null, items = [], bubbles = [], birds = [], floats = [], leaves = [], drops = [];
let camY = 0, t = 0, best = 0, got = 0, hearts = 3, rescues = 0, stars = 0, windV = 0, nextMile = 50, goal = null, gen = null, rng = Math.random, bgTh = 'day', bgOld = null, bgFade = 0;
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
function say(t0, c, px, py) { floats.push({ x: clamp(px, 60, FW - 60), y: py, t: t0, c: c || '#fff', life: 1 }); }
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const rr = (a, b) => a + rng() * (b - a);
const themeAt = y => L ? L.th : ENDLESS_TH[Math.floor(Math.max(0, -y / PXM) / 250) % ENDLESS_TH.length];
const grav = () => (L && THEMES[L.th].lowG) ? { g: 0.62, j: 0.84 } : { g: 1, j: 1 };

// difficulty 0..1 → gaps and widths
function diff(y) {
  let d;
  if (L) d = clamp(LEVELS.indexOf(L) / 29 - (L.e || 0), 0, 1);
  else d = clamp(-y / PXM / 2200, 0, 1);
  const r = { gap: [64 + 34 * d, 88 + 46 * d], w: [120 - 40 * d, 140 - 50 * d], ex: 0.4 - 0.22 * d, msp: 0.8 + d * 0.7 };
  if (L) Object.assign(r, { m: L.m, bub: L.bub || 0, bird: L.bird || 0, rk: L.rk || 0 });
  else {   // ♾️: new things show up as you climb
    const h = -y / PXM, m = { normal: 4 };
    if (h > 40) m.spring = 1; if (h > 90) m.move = 1.5 + d * 2; if (h > 160) m.rain = 1 + d * 2;
    Object.assign(r, { m, bub: h > 120 ? 0.1 : 0, bird: h > 220 ? 0.1 : 0, rk: 0 });
  }
  return r;
}
function pickMix(m) { let s = 0; for (const k in m) s += m[k]; let v = rng() * s; for (const k in m) { v -= m[k]; if (v <= 0) return k; } return 'normal'; }

// ---------- world generation (seeded per level, so every level is the same each time and can be checked) ----------
function addCloud(type, cx, y, w, path) {
  const c = { type, x: clamp(cx - w / 2, 4, FW - w - 4), y, w, path, gone: false, fade: 0, sq: 0, th: themeAt(y), alt: rng() < 0.5, ph: rng() * 6.3 };
  if (type === 'move') {
    c.bx = c.x; c.amp = Math.min(rr(36, 80) * kx, c.bx - 4, FW - w - 4 - c.bx);
    if (c.amp < 26) { c.bx = (FW - w) / 2 + rr(-20, 20) * kx; c.amp = Math.min(rr(36, 80) * kx, c.bx - 4, FW - w - 4 - c.bx); }
    c.sp = rr(0.8, 1.2) * gen.d.msp;
  }
  clouds.push(c); return c;
}
function genStep() {
  const d = gen.d = diff(gen.y), gap = rr(d.gap[0], d.gap[1]);
  if (goal && gen.y - goal.y <= d.gap[1]) { gen.done = true; return; }
  let ny = gen.y - gap; if (goal && ny - goal.y < 50) ny = goal.y + 50;
  const wk = 1 + (kx - 1) * 0.55, w = rr(d.w[0], d.w[1]) * wk;
  let cx = gen.px + rr(-0.45, 0.45) * FW;
  if (cx < w / 2 + 6) cx = 2 * (w / 2 + 6) - cx; if (cx > FW - w / 2 - 6) cx = 2 * (FW - w / 2 - 6) - cx; cx = clamp(cx, w / 2 + 6, FW - w / 2 - 6);
  let type = gen.n < 3 ? 'normal' : pickMix(d.m);
  if (type === 'spring' && gen.prev === 'spring') type = 'normal';
  const c = addCloud(type, cx, ny, w, gen.n++);
  gen.prev = type;
  const mid = (gen.y + ny) / 2;
  // goodies: things to collect sit right on the way (most of them) or a little off to the side
  if (L && L.c) {
    if (gen.n > 2 && rng() < 0.72) {
      if (rng() < 0.7) items.push(mkItem(L.c.k, c.x + c.w / 2, ny - 40, c));
      else items.push(mkItem(L.c.k, rr(30, FW - 30), mid));
    }
  } else if (gen.n > 3 && rng() < 0.2) items.push(mkItem('star', c.x + c.w / 2, ny - 40, c));
  // extra clouds to choose from
  if (rng() < d.ex) {
    const w2 = rr(d.w[0], d.w[1]) * wk * 0.9, side = c.x + c.w / 2 < FW / 2 ? 1 : -1;
    const cx2 = clamp(c.x + c.w / 2 + side * rr(0.35, 0.55) * FW, w2 / 2 + 6, FW - w2 / 2 - 6);
    const y2 = ny + rr(-gap * 0.35, gap * 0.35);
    if (Math.abs(cx2 - (c.x + c.w / 2)) > (w + w2) / 2 + 10 && !clouds.some(o => Math.abs(o.y - y2) < 58 && cx2 + w2 / 2 + 12 > o.x && cx2 - w2 / 2 - 12 < o.x + o.w)) addCloud(d.m.rain && rng() < 0.4 ? 'rain' : 'normal', cx2, y2, w2, -1);
  }
  if (gen.n > 3 && rng() < d.bub) bubbles.push({ x: rr(40, FW - 40), y: mid, r: 26, ph: rng() * 6, used: false });
  if (gen.n > 3 && rng() < d.bird) birds.push({ x: rr(20, FW - 20), y: mid + 10, dir: rng() < 0.5 ? -1 : 1, sp: rr(55, 90) * kx, used: false, leave: 0, ph: rng() * 6, col: Math.floor(rng() * 3) });
  if (gen.n > 3 && rng() < d.rk) items.push(mkItem('rocket', rr(40, FW - 40), mid));
  gen.y = ny; gen.px = c.x + c.w / 2;
}
function mkItem(k, ix, iy, on) { return { k, x: clamp(ix, 22, FW - 22), y: iy, got: false, gt: 0, v: Math.floor(rng() * 4), ph: rng() * 6, on: on || null }; }
function genTo(yTop) { let guard = 0; while (!gen.done && gen.y > yTop && guard++ < 400) genStep(); }
function rescaleX(k) {
  for (const c of clouds) { c.x *= k; c.w *= k; if (c.bx != null) { c.bx *= k; c.amp *= k; } }
  for (const a of [items, bubbles, birds]) for (const o of a) o.x *= k;
  if (P) { P.x *= k; P.vx *= k; } if (gen) gen.px *= k;
}

function reset() {
  rng = mulberry(L ? 7919 * level + 13 : (Math.random() * 1e9) | 0);
  clouds = []; items = []; bubbles = []; birds = []; floats = []; leaves = []; drops = []; MG.fx.clear();
  P = { x: FW / 2, y: -R, vx: 0, vy: -BASEJ * 0.6, squash: 0, face: 'happy', faceT: 0, bub: 0, ride: null, rocket: 0, look: 0, tgt: null, landY: 0 };
  camY = -FH + 110; t = 0; best = 0; got = 0; hearts = 3; rescues = 0; stars = 0; windV = 0; nextMile = 50;
  goal = L && L.h ? { y: -L.h * PXM, kind: L.goal } : null;
  gen = { y: 0, px: FW / 2, n: 0, done: false, prev: '', d: diff(0) };
  bgTh = themeAt(camY + FH / 2); bgOld = null; bgFade = 0;
  genTo(camY - FH);
  hud();
}
function hud() {
  MG.stat('lv', L ? `第 ${level} 關` : '♾️');
  if (!L) MG.stat('goal', `☁️ ${best} 公尺`);
  else if (L.c) MG.stat('goal', `${ITEM[L.c.k]} ${got}/${L.c.n}`);
  else MG.stat('goal', `☁️ ${Math.min(best, L.h)}/${L.h}`);
}

// ---------- input: drag a finger (噗噗 follows), hold ◀ ▶, or keys ----------
const keys = { l: false, r: false }, ptrs = new Map();
let dragX = null, btnDir = 0;
function btns() {
  if (LAY === 'side') { const r = Math.min(62, FX * 0.34); return [{ d: -1, x: FX / 2, y: H - r - 24, r }, { d: 1, x: W - FX / 2, y: H - r - 24, r }]; }
  const r = 33; return [{ d: -1, x: FX + r + 10, y: H - r - 12, r }, { d: 1, x: FX + FW - r - 10, y: H - r - 12, r }];
}
function ptrKind(p) {
  if (LAY === 'side') { if (p.x < FX) return { d: -1 }; if (p.x > FX + FW) return { d: 1 }; }
  const b = btns().find(b => Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.3);
  return b ? { d: b.d } : { d: 0, x: clamp(p.x - FX, R, FW - R) };
}
function updPtr() { dragX = null; btnDir = 0; for (const v of ptrs.values()) { if (v.d) btnDir = v.d; else dragX = v.x; } }
cv.addEventListener('pointerdown', e => { if (state !== 'play') return; try { cv.setPointerCapture(e.pointerId); } catch {} ptrs.set(e.pointerId, ptrKind(cv.logical(e))); updPtr(); });
cv.addEventListener('pointermove', e => { const v = ptrs.get(e.pointerId); if (!v) return; const k = ptrKind(cv.logical(e)); if (!v.d && !k.d) v.x = k.x; else if (v.d && k.d) v.d = k.d; updPtr(); });
for (const ev of ['pointerup', 'pointercancel']) cv.addEventListener(ev, e => { ptrs.delete(e.pointerId); updPtr(); });
addEventListener('keydown', e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'a') keys.l = true; if (k === 'arrowright' || k === 'd') keys.r = true; });
addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k === 'arrowleft' || k === 'a') keys.l = false; if (k === 'arrowright' || k === 'd') keys.r = false; });
addEventListener('blur', () => { keys.l = keys.r = false; ptrs.clear(); updPtr(); });

// ---------- update ----------
const wrapD = d => d > FW / 2 ? d - FW : d < -FW / 2 ? d + FW : d;
function autoDir() {   // test bot: aim for the next cloud on the way up
  const T = P.tgt; if (!T) return 0;
  const tx = T.x + T.w / 2, d = wrapD(tx - P.x);
  return Math.abs(d) < 6 ? 0 : Math.sign(d);
}
function pickTarget() {
  let b = null;
  for (const c of clouds) if (c.path >= 0 && !c.gone && c.y < P.landY - 4 && (!b || c.y > b.y)) b = c;
  P.tgt = b;
}
function bounce(c, v) {
  P.vy = -v; P.squash = 0.38; P.landY = c ? c.y : 0; pickTarget();
  if (!c) { snd('jump'); return; }
  c.sq = 1;
  if (c.type === 'spring') { MG.sfx('boing'); P.face = 'wink'; P.faceT = 0.9; say('Boing! 🤸', '#ff7a3d', c.x + c.w / 2, c.y - 50); MG.fx.burst(c.x + c.w / 2, c.y - 6, { n: 10, colors: ['#ffd34a', '#ff8ac2', '#fff'], speed: 150, up: 120, size: 4, shape: 'star', life: 0.6 }); }
  else if (c.type === 'rain') {
    c.gone = true; c.fade = 0.6; MG.sfx('flip'); snd('whoosh');
    for (let i = 0; i < 9; i++) drops.push({ x: c.x + rr(8, c.w - 8), y: c.y + 14, vy: rr(80, 160), life: rr(0.6, 1) });
    say('Splash! 💧', '#3d8ce0', c.x + c.w / 2, c.y - 40);

    windSign(rx2, 180, Math.min(1.4, FX / 130));
    const big = L ? (L.c ? ITEM[L.c.k] : GOALE[L.goal]) : '🏆';
    x.font = `${Math.round(Math.min(72, FX * 0.36))}px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText(big, rx2, H * 0.47 + Math.sin(t * 2) * 4);
    x.font = F(17); x.fillStyle = THEMES[bgTh].ink === '#fff' ? '#fff' : '#3a3a6a'; x.fillText(L ? L.n : `最高 ${Math.max(best, MG.best('cloud') ?? 0)} m`, rx2, H * 0.47 + Math.min(72, FX * 0.36) * 0.75);
    for (const b of btns()) drawBtn(b);
  } else {
    if (FX > 0) { x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(0, 0, FX, H); x.fillRect(FX + FW, 0, FX, H); }
    if (L && L.h) rail(FX + FW - 18, 58, 14, Math.min(FH * 0.5, 360));
    let cxp = FX + 14;
    x.font = F(18); const w1 = x.measureText(cnt).width + 22; chip(cxp + w1 / 2, 26, cnt, 18, w1); cxp += w1 + 8;
    if (heartTxt) { x.font = F(18); const w2 = x.measureText(heartTxt).width + 20; chip(cxp + w2 / 2, 26, heartTxt, 18, w2); }
    windSign(FX + FW / 2, 66);
    if (state === 'play') for (const b of btns()) drawBtn(b);
  }
}
function draw() {
  drawBg();
  drawWorld();
  drawHud();
  if (bgFade > 0.3 && !L) { x.globalAlpha = Math.min(1, (bgFade - 0.3) * 2); x.font = F(26); x.textAlign = 'center'; x.lineWidth = 5; x.strokeStyle = '#fff'; const s = `${THEMES[bgTh].ic} ${THEMES[bgTh].nm}`; x.strokeText(s, W / 2, H * 0.3); x.fillStyle = '#ff7a00'; x.fillText(s, W / 2, H * 0.3); x.globalAlpha = 1; }
}

// ---------- flow ----------
const rest = MG.barButton('休息一下', () => { if (state === 'play') endEndless(true); });
rest.el.innerHTML = '休息<span class="bx2">一下</span>';
const NEWS = {
  basic: ['☁️ 跳跳雲', '噗噗會自己一直往上彈！<b>手指按著畫面左右滑</b>，噗噗就會跟著你的手指走（也可以按 ◀ ▶ 或鍵盤 ← →）。從左邊出去會從右邊跑回來喔！<br>不小心掉下去也沒關係，🌈 彩虹雲會接住你。'],
  goal: ['🎈 往上跳到終點', '一直往上跳，跳到最上面的 <b>🎈 氣球派對</b>、🌙 月亮或 🏰 城堡就過關！旁邊的彩虹條會告訴你還有多高。'],
  star: ['⭐ 收集星星', '這一關要<b>收集星星</b>！碰到就收進來，上面有數字告訴你還差幾顆。'],
  spring: ['🤸 彈簧床', '雲上面有藍色彈簧床，跳上去會「蹦～」一下彈得好高好高！'],
  move: ['↔️ 會飄的雲', '金黃色的雲會左右飄來飄去，看準了再跳上去！'],
  rain: ['🌧️ 下雨雲', '灰灰的下雨雲<b>只能踩一次</b>，踩完就會變成小雨滴不見了，要趕快往上跳喔！'],
  fruit: ['🍓 水果雲', '天上長了好多水果！草莓、蘋果、橘子都收集起來，有的掛在旁邊要繞過去拿喔。'],
  bubble: ['🫧 泡泡', '碰到大泡泡，噗噗會被包起來慢慢飄上去，一會兒「啵」就破了！'],
  bird: ['🐦 小鳥朋友', '碰到飛過來的小鳥，牠會帶著噗噗飛上去一大段！'],
  wind: ['🍃 風吹吹', '風一下往左、一下往右，會把噗噗吹過去。看看上面的風向箭頭，往反方向撐住！'],
  candy: ['🍬 糖果天空', '棉花糖雲上面有好多糖果，收集起來吧！'],
  lantern: ['🏮 點燈籠', '晚上的天空有沒亮的燈籠，噗噗碰一下就會亮起來飄上天！把燈籠都點亮吧。'],
  space: ['🚀 太空', '太空裡比較輕，噗噗會跳得慢慢的、高高的。碰到 🚀 小火箭會咻～一下飛好高！'],
  endless: ['♾️ 一直跳', '沒有終點，看你可以跳多高！越高會經過黃昏、雨天、糖果天空、夜空、太空和彩虹。'],
};
function newsOf() {
  if (!L) return ['basic', 'endless'];
  const k = ['basic', L.h ? 'goal' : L.c.k];
  for (const m in L.m) if (NEWS[m]) k.push(m);
  if (L.bub) k.push('bubble'); if (L.bird) k.push('bird'); if (L.wind) k.push('wind'); if (L.th === 'space') k.push('space');
  return k;
}
function intro() {
  const ks = newsOf().filter(k => NEWS[k] && !MG.store.get('cloud.seen.' + k, false));
  if (!ks.length) return false;
  ks.forEach(k => MG.store.set('cloud.seen.' + k, true));
  MG.panel({ title: ks.map(k => NEWS[k][0]).join('＋'), html: ks.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  return true;
}
function startLevel(n) {
  level = n; L = n === ENDLESS ? null : LEVELS[n - 1];
  reset(); state = 'play'; MG.hide(); rest.show(!L);
  keys.l = keys.r = false; ptrs.clear(); updPtr();
  if (!intro()) MG.toast(L ? `第 ${n} 關　${lvName(n)}　${lvGoal(L)}` : '♾️ 看看可以跳多高！', 1800);
}
function cleared() { const c = MG.store.get('cloud.cleared', {}); return c && typeof c === 'object' ? c : {}; }
function win() {
  if (state !== 'play') return;
  state = 'won'; P.vy = 0; keys.l = keys.r = false; ptrs.clear(); updPtr(); MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  say(MG.WORDS.clear, '#ff7a00', P.x, P.y - 50);
  MG.fx.burst(P.x, P.y, { n: 46, colors: ['#ffd34a', '#fff6a0', '#ff8ac2', '#9ff0ff', '#5fe07a'], speed: 300, up: 200, size: 6, shape: 'star', life: 1.1 });
  const cl = cleared(); cl[level] = Math.max(cl[level] || 0, stars + 1); MG.store.set('cloud.cleared', cl);
  const done = Object.keys(cl).length; MG.record('cloud.levels', done);
  const nx = level < LEVELS.length ? level + 1 : ENDLESS, lv = level;
  MG.store.set('cloud.pickLevel', nx);
  setTimeout(() => state === 'won' && level === lv && MG.panel({
    title: `第 ${lv} 關過關！`,
    html: `<div class="big">${L.c ? `${ITEM[L.c.k]} × ${got}` : GOALN[L.goal]}</div>` + (L.h ? `<p>跳了 ${L.h} 公尺高，⭐ 撿到 ${stars} 顆星星</p>` : `<p>跳了 ${best} 公尺高</p>`) +
      (mode === 'heart' ? `<p>🌈 彩虹雲還剩 ${hearts} 朵</p>` : '') +
      `<p>${nx === ENDLESS ? '全部過關了！來試試 ♾️ 一直跳吧 ^_^' : `下一關：${lvName(nx)}`}</p>`,
    buttons: [{ label: nx === ENDLESS ? '♾️ 一直跳' : '下一關', on: () => startLevel(nx) }, { label: '再玩一次', alt: true, on: () => startLevel(lv) }, { label: '選關卡', alt: true, on: menu }],
  }), 1100);
}
function fail() {
  if (!L) return endEndless(false);
  state = 'over'; MG.sfx('over');
  MG.panel({
    title: '彩虹雲用完了！',
    html: `<p>這次跳到</p><div class="big">${best} 公尺</div>` + (L.c ? `<p>${ITEM[L.c.k]} 收集了 ${got} / ${L.c.n}</p>` : `<p>終點在 ${L.h} 公尺</p>`) + `<p>再試一次！🐢 慢慢玩有用不完的彩虹雲喔</p>`,
    buttons: [{ label: '再試一次', on: () => startLevel(level) }, { label: '🐢 慢慢玩這關', alt: true, on: () => { mode = 'relax'; MG.store.set('cloud.pickMode', 'relax'); startLevel(level); } }, { label: '選關卡', alt: true, on: menu }],
  });
}
function endEndless(rested) {
  if (state !== 'play') return;
  state = 'over'; rest.show(false); MG.sfx(rested ? 'win' : 'over'); if (best > 0) setTimeout(() => MG.sfx('yay'), 200);
  const rec = MG.record('cloud', best);
  MG.panel({
    title: rested ? '休息一下！' : '彩虹雲用完了！',
    html: `<p>這次跳到</p><div class="big">${best} 公尺</div><p>⭐ 撿到 ${stars} 顆星星</p>` + (rec.isNew && best > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best} 公尺</p>`),
    buttons: [{ label: '再玩一次', on: () => startLevel(ENDLESS) }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; rest.show(false);
  const cl = cleared();
  MG.choose({
    id: 'cloud', title: '噗噗跳跳雲',
    html: `<p>噗噗踩著雲朵一直往上彈！手指左右滑讓噗噗跳到上面的雲，跳到 🎈 氣球派對、🌙 月亮、🏰 彩虹城堡就過關。</p><p>還有 🤸 彈簧床、↔️ 會飄的雲、🌧️ 只能踩一次的下雨雲、🫧 泡泡、🐦 小鳥、🍃 風、🏮 燈籠、🚀 太空，最後是 ♾️ 一直跳！</p>`,
    modesTitle: '要怎麼玩？',
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '掉下去都有彩虹雲接住' }, { id: 'heart', label: '🌈 三朵彩虹雲', sub: '彩虹雲用完要重來' }],
    levels: { count: ENDLESS, max: ENDLESS, label: n => n === ENDLESS ? `♾️ 一直跳（最高 ${MG.best('cloud') ?? 0} 公尺）` : `${n}（${lvName(n)}・${lvGoal(LEVELS[n - 1])}${cl[n] ? ' ✓' : ''}）`, short: n => n === ENDLESS ? '♾️' : `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '手指按著畫面左右滑，或按 ◀ ▶　電腦：<kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd>',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
MG.fit(cv, layout);
L = LEVELS[0]; level = 1; reset(); P.vy = 0;
menu();

// ---------- test hook ----------
const HOOK = window.CLOUDT = {
  auto: false, fast: 1, levels: LEVELS, count: ENDLESS,
  start(n, m = 'relax') { mode = m; startLevel(n); },
  get state() { return state; }, get level() { return level; }, get height() { return best; }, get got() { return got; }, get hearts() { return hearts; }, get rescues() { return rescues; }, get stars() { return stars; },
  get P() { return { x: P.x, y: P.y, vy: P.vy, bub: P.bub, ride: !!P.ride, rocket: P.rocket }; },
  win() { if (state === 'play') { if (L && L.c) got = L.c.n; win(); } },
  // play a level with the bot, fast (no drawing); returns how it went
  run(n, maxSec = 400, m = 'relax') {
    mode = m; startLevel(n); MG.hide(); HOOK.auto = true;
    let steps = 0; const dt = 1 / 60;
    while (state === 'play' && steps < maxSec * 60) { update(dt); steps++; }
    HOOK.auto = false;
    return { n, state, sec: Math.round(steps / 60), rescues, height: best, got, stars };
  },
  // check the generated path: every gap must be well inside one bounce
  verify(n) {
    level = n; L = n === ENDLESS ? null : LEVELS[n - 1]; reset();
    const top = goal ? goal.y - 200 : -60000;
    genTo(top);
    const path = clouds.filter(c => c.path >= 0).sort((a, b) => b.y - a.y);
    const gk = grav(), reach = (BASEJ * gk.j) ** 2 / (2 * BASEG * gk.g);
    let maxGap = path.length ? -path[0].y : 0, prev = 0;
    for (const c of path) { maxGap = Math.max(maxGap, prev - c.y); prev = c.y; }
    if (goal) maxGap = Math.max(maxGap, prev - goal.y);
    const nItems = items.filter(i => L && L.c && i.k === L.c.k).length;
    const res = { n, clouds: path.length, maxGap: Math.round(maxGap), reach: Math.round(reach), ok: maxGap < reach * 0.8 && (!goal || gen.done), items: nItems };
    state = 'ready'; return res;
  },
  step(frames = 60) { for (let i = 0; i < frames && state === 'play'; i++) update(1 / 60); },
  dbg: () => ({ x: Math.round(P.x), y: Math.round(P.y), vy: Math.round(P.vy), cam: Math.round(camY), tgt: P.tgt && { x: Math.round(P.tgt.x), y: Math.round(P.tgt.y), w: Math.round(P.tgt.w), type: P.tgt.type, gone: P.tgt.gone }, ride: !!P.ride, bub: P.bub, best, rescues, birds: birds.length }),
  menu: () => menu(),
};
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) { for (let i = 0; i < (HOOK.fast | 0 || 1) && state === 'play'; i++) update(dt); }
  else {
    t += dt; MG.fx.step(dt); stepFx(dt);
    if (state === 'ready' && P) { P.y = -R - Math.abs(Math.sin(t * 3.2)) * 120; P.squash = Math.max(0, 0.3 - Math.abs(Math.sin(t * 3.2)) * 3); P.face = 'happy'; }
  }
  draw();
});
