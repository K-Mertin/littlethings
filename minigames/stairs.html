<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<link rel="stylesheet" href="mini.css">
<style>

</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'stairs', title: '噗噗下樓梯', stats: ['floor', 'best'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
// canvas = the stage's shape. The shaft (FW × FH) keeps its 360×560 feel; it gets wider (up to 1.5×, platforms + speeds scale with it)
// or taller, and spare room becomes HUD bands: left/right in landscape ('side'), below in portrait ('bottom').
let W = 360, H = 560, FW = 360, FH = 560, FX = 0, BW = 0, LAY = 'none', kx = 1, PW = 86;
const BASEW = 360, BASEH = 560;
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22)), oldFW = FW;   // 22 = stage padding + canvas border
  if (a >= BASEW / BASEH) {
    H = BASEH; W = Math.round(H * a); FH = H;
    const SB = 150;
    if (W >= BASEW + 2 * SB) { FW = Math.min(BASEW * 1.5, W - 2 * SB); LAY = 'side'; }
    else { FW = Math.min(W, BASEW * 1.5); LAY = 'none'; }
  } else {
    W = BASEW; H = Math.round(W / a); FW = W;
    if (H - BASEH >= 100) { const bh = Math.min(H - BASEH, 175); FH = H - bh; LAY = 'bottom'; } else { FH = H; LAY = 'none'; }
  }
  FW = Math.round(FW); FX = Math.round((W - FW) / 2); BW = FX; kx = FW / BASEW; PW = 86 * kx;
  // a rotation mid-game: keep everything at the same relative spot
  if (oldFW !== FW && plats) { const k = FW / oldFW; for (const p of plats) { p.x *= k; p.w *= k; } if (P) { P.x *= k; P.vx *= k; } }
  return [W, H];
}
cv.onfit = () => { wallKey = ''; };
addEventListener('mg-big', () => { wallKey = ''; });

const R = 14, HPMAX = 10, CEIL = 22, PH = 12, GAP = 72;
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TYPES = ['normal', 'normal', 'normal', 'spike', 'spring', 'left', 'right', 'fragile'];

// ---------- towers (themes) and levels ----------
// wall: brick colour [hue, sat, light]; pl: normal stair [top, bottom, outline]; deco: the three wall decorations
const TH = {
  castle: { nm: '城堡', ic: '🏰', wall: '#20284a', br: [228, 28, 30], pl: ['#f2c46c', '#c98f3a', '#8a5a22'], deco: ['torch', 'window', 'banner'], fog: '10,12,30' },
  candy: { nm: '糖果塔', ic: '🍭', wall: '#4a1f3c', br: [328, 42, 46], pl: ['#ffc2dc', '#f06a9e', '#9a2f5d'], deco: ['lolly', 'cane', 'lolly'], fog: '40,10,30' },
  ice: { nm: '冰之塔', ic: '❄️', wall: '#173556', br: [204, 40, 44], pl: ['#c8d6e6', '#8a9cb4', '#4a5a72'], deco: ['flake', 'icicle', 'window'], fog: '8,20,40' },
  cloud: { nm: '雲朵塔', ic: '☁️', sky: '#6cbcf2', pl: ['#ffffff', '#dbe9f7', '#8fb0d0'], deco: ['cloudlet', 'rainbow', 'cloudlet'], fog: '30,70,140' },
  factory: { nm: '玩具工廠', ic: '⚙️', wall: '#262b33', br: [212, 10, 32], pl: ['#d3dae6', '#8a94a8', '#4a5262'], deco: ['gear', 'pipe', 'lamp'], fog: '10,12,16' },
  cave: { nm: '水晶洞', ic: '💎', wall: '#221a2c', br: [272, 14, 25], pl: ['#c4b49e', '#857563', '#55493c'], deco: ['crystal', 'mush', 'crystal'], fog: '12,6,20' },
  magic: { nm: '魔法塔', ic: '🔮', wall: '#1a1240', br: [258, 36, 30], pl: ['#d9c2ff', '#9a72f0', '#4f2f9a'], deco: ['moon', 'sparkle', 'banner'], fog: '14,6,40' },
};
// g = goal (reach floor g, or collect g candies when star); m = stair mix (weights); sp = [start speed, + per floor, max speed]; st = chance of a ⭐ on a stair
const LEVELS = [
  { n: '城堡入口', th: 'castle', g: 10, m: { normal: 1 }, sp: [52, 0.5, 72], st: 0.3, mk: '🌱' },
  { n: '彈彈樓梯', th: 'castle', g: 15, m: { normal: 4, spring: 1 }, sp: [58, 0.9, 92], st: 0.3 },
  { n: '小心木板', th: 'castle', g: 15, m: { normal: 4, spring: 1, fragile: 1 }, sp: [60, 1, 98], st: 0.3 },
  { n: '糖果屋', th: 'candy', g: 6, star: 1, m: { normal: 4, spring: 1 }, sp: [56, 0.8, 88], st: 0.5, mk: '🍬' },
  { n: '尖刺出現了', th: 'castle', g: 20, m: { normal: 5, spike: 1, spring: 1, fragile: 1 }, sp: [64, 1.1, 108], st: 0.3 },
  { n: '滑滑冰樓梯', th: 'ice', g: 15, m: { normal: 2, ice: 3 }, sp: [58, 1, 95], st: 0.3, mk: '❄️' },
  { n: '彈簧雲', th: 'cloud', g: 20, m: { normal: 3, spring: 3 }, sp: [62, 1.1, 104], st: 0.35, mk: '☁️' },
  { n: '輸送帶工廠', th: 'factory', g: 20, m: { normal: 3, left: 2, right: 2 }, sp: [62, 1.1, 104], st: 0.3, mk: '⚙️' },
  { n: '糖果雨', th: 'candy', g: 10, star: 1, m: { normal: 4, spring: 2, fragile: 1 }, sp: [64, 1, 108], st: 0.5, mk: '🍬' },
  { n: '城堡深處', th: 'castle', g: 30, m: { normal: 3, spike: 1, spring: 1, left: 1, right: 1, fragile: 1 }, sp: [68, 1.3, 122], st: 0.3 },
  { n: '會動的樓梯', th: 'factory', g: 15, m: { normal: 2, move: 3 }, sp: [60, 1, 98], st: 0.3, mk: '↔️' },
  { n: '碎碎水晶洞', th: 'cave', g: 20, m: { normal: 2, fragile: 3 }, sp: [62, 1.1, 104], st: 0.3, mk: '💎' },
  { n: '冰和尖刺', th: 'ice', g: 25, m: { normal: 2, ice: 3, spike: 1 }, sp: [66, 1.2, 114], st: 0.3, mk: '❄️' },
  { n: '一閃一閃', th: 'magic', g: 15, m: { normal: 2, blink: 3 }, sp: [58, 1, 96], st: 0.3, mk: '👻' },
  { n: '飄飄雲', th: 'cloud', g: 25, m: { normal: 2, spring: 2, move: 2 }, sp: [66, 1.2, 114], st: 0.35, mk: '☁️' },
  { n: '忙碌工廠', th: 'factory', g: 25, m: { normal: 2, left: 2, right: 2, fragile: 1, move: 1 }, sp: [68, 1.2, 118], st: 0.3, mk: '⚙️' },
  { n: '糖果大收集', th: 'candy', g: 14, star: 1, m: { normal: 3, spring: 1, move: 1, ice: 1 }, sp: [66, 1.1, 112], st: 0.5, mk: '🍬' },
  { n: '滑滑又動動', th: 'ice', g: 25, m: { normal: 2, ice: 2, move: 2 }, sp: [68, 1.2, 118], st: 0.3, mk: '❄️' },
  { n: '魔法碎片', th: 'magic', g: 25, m: { normal: 2, blink: 2, fragile: 1, spike: 1 }, sp: [68, 1.2, 118], st: 0.3, mk: '👻' },
  { n: '危險洞窟', th: 'cave', g: 30, m: { normal: 2, fragile: 2, spike: 1, move: 1 }, sp: [72, 1.3, 128], st: 0.3, mk: '💎' },
  { n: '城堡大冒險', th: 'castle', g: 40, m: { normal: 3, spike: 1, spring: 1, left: 1, right: 1, fragile: 1, move: 1 }, sp: [74, 1.4, 138], st: 0.3 },
  { n: '冰雲魔法', th: 'cloud', g: 35, m: { normal: 2, ice: 2, spring: 1, blink: 1 }, sp: [74, 1.4, 138], st: 0.35, mk: '☁️' },
  { n: '魔法大混合', th: 'magic', g: 40, m: { normal: 2, blink: 1, ice: 1, move: 1, left: 1, right: 1, spike: 1, fragile: 1 }, sp: [78, 1.5, 148], st: 0.3, mk: '👻' },
  { n: '超級大挑戰', th: 'castle', g: 50, m: { normal: 3, spike: 1, spring: 1, left: 1, right: 1, fragile: 1, move: 1, ice: 1, blink: 1 }, sp: [82, 1.6, 162], st: 0.3, mk: '🏆' },
];
const ENDLESS = LEVELS.length + 1;
let level = ENDLESS, L = null, mode = 'normal', stars = 0;
const theme = () => TH[L ? L.th : 'castle'];
const starIc = () => L && L.th === 'candy' ? '🍬' : '⭐';
const lvName = n => n === ENDLESS ? '♾️ 無限下樓' : `${TH[LEVELS[n - 1].th].ic} ${LEVELS[n - 1].n}`;

let wallOff = 0, deco = [];
let floats = [];
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
function say(t, c = '#fff', px = P.x, py = P.y - 30) { floats.push({ x: Math.max(50, Math.min(FW - 50, px)), y: Math.max(40, py), t, c, life: 0.9 }); }
let P, plats, rise, spawnY, nextIdx, floor, state = 'ready', shake = 0, flash = 0, parts = [], t = 0;

function reset() {
  P = { x: FW / 2, y: 280 - R, vy: 0, vx: 0, on: null, hp: HPMAX, inv: 0, ignore: null, ignoreT: 0, face: 'happy', squash: 0 };
  plats = []; nextIdx = 0; floor = 0; rise = 70; t = 0; parts = []; floats = []; wallOff = 0; stars = 0; MG.fx.clear();
  addPlat(FW / 2 - PW / 2, 280, 'normal');
  spawnY = 280;
  while (spawnY < FH + GAP) spawnNext();
  P.on = plats[0];
  showHud();
}
function spawnNext() {
  spawnY += GAP;
  // the 🏁 finish stair: extra wide, so it's easy to land on
  if (L && !L.star && nextIdx === L.g) { const w = Math.min(FW - 8, PW * 1.8); addPlat(MG.rand(4, FW - w - 4), spawnY, 'goal', w); return; }
  addPlat(MG.rand(4, FW - PW - 4), spawnY, pickType());
}
function pickType() {
  // early floors are friendlier
  if (nextIdx < (L ? 3 : 4)) return 'normal';
  if (!L) {
    const ty = MG.pick(TYPES);
    if (ty === 'spike' && nextIdx < 10 && Math.random() < 0.5) return 'normal';
    return ty;
  }
  // levels: weighted mix, and never two tricky stairs in a row too often
  const prev = plats.length ? plats[plats.length - 1].type : 'normal';
  if ((prev === 'spike' || prev === 'blink' || prev === 'fragile') && Math.random() < 0.5) return 'normal';
  let sum = 0; for (const k in L.m) sum += L.m[k];
  let r = Math.random() * sum; for (const k in L.m) { r -= L.m[k]; if (r <= 0) return k; }
  return 'normal';
}
function addPlat(px, py, type, w = PW) {
  const star = L && type !== 'spike' && type !== 'goal' && nextIdx > 1 && Math.random() < L.st ? 1 : 0;
  plats.push({ x: px, y: py, w, type, idx: nextIdx++, used: false, crumble: -1, gone: false, boing: 0, seed: Math.random() * 1000, star,
    vx: type === 'move' ? (Math.random() < 0.5 ? -1 : 1) * MG.rand(42, 60) * kx : 0, ph: Math.random() * 3.2 });
}
const blinkOn = p => ((t + p.ph) % 3.2) < 2.2;          // 👻 magic stairs: 2.2 s there, 1 s gone
const goalTxt = () => L.star ? `${starIc()} ${stars}/${L.g}` : `🏁 ${Math.min(floor, L.g)}/${L.g}`;
function showHud() {
  if (L) { MG.stat('floor', `第 ${level} 關`); MG.stat('best', goalTxt()); return; }
  MG.stat('floor', `地下 ${floor} 層`); const b = MG.best('stairs'); MG.stat('best', mode === 'relax' ? '' : `最高 ${b ?? 0}`);
}

// ---------- input ----------
const keys = { l: false, r: false }; let touchDir = 0;
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play' && MG.panelOpen()) { /* button has focus */ }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = false;
});
const touches = new Map();
const stage = cv.parentElement;
function updTouch() { let d = 0; for (const v of touches.values()) d = v; touchDir = d; }
stage.addEventListener('pointerdown', e => { const r = stage.getBoundingClientRect(); touches.set(e.pointerId, e.clientX < r.left + r.width / 2 ? -1 : 1); updTouch(); });
stage.addEventListener('pointermove', e => { if (!touches.has(e.pointerId)) return; const r = stage.getBoundingClientRect(); touches.set(e.pointerId, e.clientX < r.left + r.width / 2 ? -1 : 1); updTouch(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) stage.addEventListener(ev, e => { touches.delete(e.pointerId); updTouch(); });
addEventListener('blur', () => { keys.l = keys.r = false; touches.clear(); touchDir = 0; });

// ---------- update ----------
function hurt(n) {
  if (P.inv > 0) return;
  if (mode !== 'relax') P.hp = Math.max(0, P.hp - n);       // 🐢 慢慢玩: it still says ouch, but nothing is lost
  P.inv = 0.7; shake = 0.25; flash = 0.2; P.face = 'ouch'; MG.sfx('hit'); say('Ouch! 💥', '#ff8a7a');
}
// 🐢 慢慢玩: fell off the bottom → a little stair pops up in the middle and 噗噗 lands on it
function rescue() {
  const w = PW * 1.2, y = Math.round(FH * 0.5);
  plats.push({ x: Math.max(4, Math.min(FW - w - 4, P.x - w / 2)), y, w, type: 'normal', idx: floor, used: true, crumble: -1, gone: false, boing: 0, seed: 7, star: 0, vx: 0, ph: 0, rescue: 1 });
  P.on = plats[plats.length - 1]; P.y = y - R; P.vy = 0; P.vx = 0; P.inv = 1.2; P.squash = 0.3; P.face = 'happy';
  MG.sfx('boing'); say('Up! 🎈', '#9ff0ff', P.x, y - 44);
  MG.fx.burst(P.x, y, { n: 14, colors: ['#9ff0ff', '#fff', '#ffd34a'], speed: 150, up: 80, size: 4, shape: 'star', life: 0.7 });
}
function autoDir() {   // test bot: head for the best stair below (but ride a safe stair up while low on the screen)
  if (P.on && P.y > FH * 0.42 && P.on.type !== 'spike' && P.on.type !== 'fragile' && P.on.type !== 'blink' && P.on.type !== 'ice' && P.on.type !== 'left' && P.on.type !== 'right') return 0;
  let best = null, bs = -1e9;
  for (const p of plats) {
    if (p.gone || p === P.on || p.y < P.y + R + 8 || p.y > P.y + 320) continue;
    if (p.type === 'blink' && !blinkOn(p)) continue;
    let s = -(p.y - P.y) * 0.5 - Math.abs(p.x + p.w / 2 - P.x) * 0.6;
    if (p.type === 'spike') s -= 400; if (p.type === 'goal') s += 600; if (p.star === 1) s += 140; if (p.type === 'fragile') s -= 30;
    if (P.on && p.x + p.w / 2 > P.on.x - 4 && p.x + p.w / 2 < P.on.x + P.on.w + 4) s -= 150;   // right under my own stair: hard to reach
    if (s > bs) { bs = s; best = p; }
  }
  if (!best) return 0;
  let tx = best.x + best.w / 2;
  if (P.on) { const me = P.on; if (tx > me.x - R && tx < me.x + me.w + R) tx = (tx - me.x < me.x + me.w - tx) ? me.x - R * 1.5 : me.x + me.w + R * 1.5; }
  const d = tx - P.x; return Math.abs(d) < 6 ? 0 : Math.sign(d);
}
function update(dt) {
  t += dt;
  rise = L ? Math.min(L.sp[2], L.sp[0] + floor * L.sp[1]) * (mode === 'relax' ? 0.85 : 1) : Math.min(175, 70 + floor * 1.6);
  const dy = rise * dt;
  for (const p of plats) p.y -= dy;
  spawnY -= dy;
  while (spawnY < FH + GAP) spawnNext();
  plats = plats.filter(p => p.y > -PH && !p.gone);

  // horizontal (❄️ ice: 噗噗 keeps sliding and only slowly speeds up / stops)
  let dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0); if (touchDir) dir = touchDir;
  if (HOOK.auto) dir = autoDir();
  const top = 210 * kx;
  if (P.on && P.on.type === 'ice') P.vx += (dir * top - P.vx) * Math.min(1, dt * 2.2); else P.vx = dir * top;
  P.x += P.vx * dt; P.look = dir || (P.look || 0) * 0.9;
  wallOff += dy * 0.55;
  for (const p of plats) {
    p.boing = Math.max(0, p.boing - dt);
    if (p.type === 'move') {   // ↔️ sliding stairs carry 噗噗 along
      p.x += p.vx * dt;
      if (p.x < 4) { p.x = 4; p.vx = Math.abs(p.vx); } else if (p.x > FW - p.w - 4) { p.x = FW - p.w - 4; p.vx = -Math.abs(p.vx); }
      if (P.on === p) P.x += p.vx * dt;
    }
    if (p.type === 'blink' && P.on === p && !blinkOn(p)) { P.on = null; P.vy = 0; }
  }
  if (P.on && P.on.type === 'left') P.x -= 95 * kx * dt;
  if (P.on && P.on.type === 'right') P.x += 95 * kx * dt;
  P.x = Math.max(R, Math.min(FW - R, P.x)); if (P.x <= R || P.x >= FW - R) P.vx *= 0.3;
  P.inv = Math.max(0, P.inv - dt); P.ignoreT = Math.max(0, P.ignoreT - dt); if (!P.ignoreT) P.ignore = null;
  if (P.inv === 0 && P.face === 'ouch') P.face = 'happy';
  P.squash *= Math.pow(0.002, dt);

  // ⭐ / 🍬 on the stairs: touch to collect
  for (const p of plats) if (p.star === 1) {
    const sx = p.x + p.w / 2, sy = p.y - 26;
    if (Math.hypot(P.x - sx, P.y - sy) < R + 15) {
      p.star = 2; stars++; MG.sfx('coin'); snd('sparkle', 0, 120);
      say(`+1 ${starIc()}`, '#ffd34a', sx, sy - 16);
      MG.fx.burst(sx, sy, { n: 12, colors: ['#ffd34a', '#fff6a0', '#fff', L && L.th === 'candy' ? '#ff8ac2' : '#ffe36b'], speed: 150, up: 60, size: 4.5, shape: 'star', life: 0.6 });
      if (L && L.star && stars >= L.g) { showHud(); return win(); }
    }
  }

  if (P.on) {
    const p = P.on;
    if (p.gone || P.x < p.x - R * 0.6 || P.x > p.x + p.w + R * 0.6) { P.on = null; P.vy = 0; }
    else {
      P.y = p.y - R; P.vy = 0;
      if (p.type === 'fragile' && p.crumble >= 0) { p.crumble += dt; if (p.crumble > 0.38) { p.gone = true; P.on = null; MG.fx.burst(p.x + p.w / 2, p.y + 4, { n: 18, colors: ['#b9a58a', '#8f7d64', '#d8c6a8'], speed: 120, up: 20, size: 5, shape: 'sq', life: 0.8 }); MG.sfx('step'); snd('whoosh'); } }
    }
  }
  if (!P.on) {
    const prevFeet = P.y + R;
    P.vy = Math.min(560, P.vy + 1500 * dt);
    P.y += P.vy * dt;
    const feet = P.y + R;
    if (P.vy >= 0) for (const p of plats) {
      if (p === P.ignore || p.gone || (p.type === 'blink' && !blinkOn(p))) continue;
      if (prevFeet <= p.y + dy + 1 && feet >= p.y && P.x > p.x - R * 0.6 && P.x < p.x + p.w + R * 0.6) { land(p); break; }
    }
    if (state !== 'play') return;
  }
  // ceiling spikes
  if (P.y - R < CEIL) {
    hurt(5);
    P.y = CEIL + R + 2;
    if (P.on) { P.ignore = P.on; P.ignoreT = 0.35; P.on = null; }
    P.vy = 120;
  }
  MG.fx.step(dt);
  for (const f of floats) { f.y -= 34 * dt; f.life -= dt; } floats = floats.filter(f => f.life > 0);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  if (mode === 'relax' && P.y - R > FH) rescue();
  if (P.hp <= 0 || P.y - R > FH) gameOver();
  showHud();
}
function land(p) {

  left: ['🟪 輸送帶', '輸送帶會把噗噗往箭頭的方向送，往反方向走才不會被送走。'],

  move: ['↔️ 會動的樓梯', '綠色的樓梯會左右移動，站上去會一起移動，看準了再跳下去！'],
  blink: ['👻 一閃一閃的魔法樓梯', '紫色魔法樓梯會一下出現、一下消失。開始閃的時候就快消失了，趕快離開！'],
};
function intro() {
  const keys = ['goal', ...Object.keys(L.m), L.star ? 'star' : ''].filter(k => NEWS[k] && !MG.store.get('stairs.seen.' + k, false));
  if (!keys.length) return false;
  keys.forEach(k => MG.store.set('stairs.seen.' + k, true));
  MG.panel({ title: keys.map(k => NEWS[k][0]).join('＋'), html: keys.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  return true;
}
function startLevel(n) {
  level = n; L = n === ENDLESS ? null : LEVELS[n - 1]; wallKey = '';
  reset(); state = 'play'; MG.hide(); rest.show(!L && mode === 'relax');
  keys.l = keys.r = false; touches.clear(); touchDir = 0;
  if (L && !intro()) MG.toast(`第 ${n} 關　${lvName(n)}　${L.star ? `${starIc()}×${L.g}` : `🏁 ${L.g} 層`}`, 1800);
}
function win() {
  if (state !== 'play') return;
  state = 'won'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  P.face = 'happy'; say(MG.WORDS.clear, '#ffd34a', P.x, P.y - 40);
  MG.fx.burst(P.x, P.y, { n: 40, colors: ['#ffd34a', '#fff6a0', '#ff8ac2', '#9ff0ff', '#5fe07a'], speed: 260, up: 180, size: 6, shape: 'star', life: 1 });
  const cl = MG.store.get('stairs.cleared', {}); cl[level] = Math.max(cl[level] || 0, stars); MG.store.set('stairs.cleared', cl);
  const nx = level < LEVELS.length ? level + 1 : ENDLESS, done = level;
  MG.store.set('stairs.pickLevel', nx);
  setTimeout(() => state === 'won' && level === done && MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<div class="big">${L.star ? `${starIc()} × ${stars}` : `🏁 地下 ${floor} 層`}</div>` + (!L.star ? `<p>⭐ 收集了 ${stars} 顆星星</p>` : `<p>到了地下 ${floor} 層</p>`) +
      `<p>${nx === ENDLESS ? '全部的塔都下完了！來試試 ♾️ 無限下樓吧 ^_^' : `下一關：${lvName(nx)}`}</p>`,
    buttons: [{ label: nx === ENDLESS ? '♾️ 無限下樓' : '下一關', on: () => startLevel(nx) }, { label: '再玩一次', alt: true, on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],
  }), 800);
}
function gameOver(rested) {
  state = 'over'; rest.show(false);
  if (!rested) { MG.sfx('over'); MG.fx.burst(P.x, Math.min(P.y, FH - 10), { n: 22, colors: ['#4cc96a', '#9ff0a8', '#2e9a4c'], speed: 220, up: 160, size: 5 }); } else MG.sfx('win');
  showHud();
  if (L) return MG.panel({
    title: '噗噗掉下去了！',
    html: `<p>這次到了地下 ${floor} 層` + (L.star ? `，收集了 ${starIc()} ${stars} 顆` : `（終點在 ${L.g} 層）`) + `</p><p>再試一次！覺得太難可以選 🐢 慢慢玩，不會輸喔。</p>`,
    buttons: [{ label: '再試一次', on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],
  });
  const rec = mode === 'relax' ? null : MG.record('stairs', floor);
  MG.panel({
    title: rested ? '休息一下！' : '噗噗掉下去了！',
    html: `<p>這次到了</p><div class="big">地下 ${floor} 層</div>` + (!rec ? '<p>🐢 慢慢玩不算紀錄喔</p>' : rec.isNew && floor > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：地下 ${rec.best} 層</p>`),
    buttons: [{ label: '再玩一次', on: () => startLevel(ENDLESS) }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; rest.show(false);
  MG.choose({
    id: 'stairs', title: '噗噗下樓梯',
    html: `<p>天花板的尖刺一直往下壓，快跳到下面的樓梯上！每一關跳到 🏁 終點就過關，最後一格是 ♾️ 無限下樓，看能下到幾層。</p>
  <p>🟨 普通（補血）⬜ 尖刺 🟦 彈簧 🟪 輸送帶 🟫 會碎<br>還有 🍬 糖果塔、❄️ 冰樓梯、↔️ 會動的樓梯、👻 魔法樓梯！</p>`,
    modes: [{ id: 'normal', label: '❤️ 一般', sub: '血用完就要重來' }, { id: 'relax', label: '🐢 慢慢玩', sub: '不會輸・掉下去會再回來' }],
    levels: { count: ENDLESS, max: ENDLESS, label: n => n === ENDLESS ? `♾️ 無限下樓（最高 ${MG.best('stairs') ?? 0} 層）` : `${n}（${lvName(n)}）`,
      short: n => n === ENDLESS ? '♾️' : `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '電腦：<kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd>　手機：按住畫面左半邊或右半邊',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
MG.fit(cv, layout);
reset();
menu();
// test hook: start any level, steer with a little bot, run faster
const HOOK = window.STR = { auto: false, fast: 1, start(n, m = 'normal') { mode = m; startLevel(n); }, get state() { return state; }, get level() { return level; }, get floor() { return floor; }, get stars() { return stars; },
  get hp() { return P.hp; }, get count() { return ENDLESS; }, levels: LEVELS, types: () => plats.map(p => p.type), dbg: () => [Math.round(P.x), Math.round(P.y), P.on ? Math.round(P.on.y) : null, FH, plats.length], menu: () => menu() };
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) { for (let i = 0; i < (HOOK.fast | 0 || 1) && state === 'play'; i++) update(dt); }
  else { t += dt; MG.fx.step(dt); for (const f of floats) { f.y -= 34 * dt; f.life -= dt; } floats = floats.filter(f => f.life > 0); }
  draw();
});
</script>
