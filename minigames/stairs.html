// or taller, and spare room becomes HUD bands: left/right in landscape ('side'), below in portrait ('bottom').
let W = 360, H = 560, FW = 360, FH = 560, FX = 0, BW = 0, LAY = 'none', kx = 1, PW = 86;
const BASEW = 360, BASEH = 560;
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22)), oldFW = FW;   // 22 = stage padding + canvas border
  if (a >= BASEW / BASEH) {
    H = BASEH; W = Math.round(H * a); FH = H;
    const SB = 150;
    if (W >= BASEW + 2 * SB) { FW = Math.min(BASEW * 1.5, W - 2 * SB); LAY = 'side'; }
    else { FW = Math.min(W, BASEW * 1.5); LAY = 'none'; }
  } else {
    W = BASEW; H = Math.round(W / a); FW = W;
    if (H - BASEH >= 100) { const bh = Math.min(H - BASEH, 175); FH = H - bh; LAY = 'bottom'; } else { FH = H; LAY = 'none'; }
  }
  FW = Math.round(FW); FX = Math.round((W - FW) / 2); BW = FX; kx = FW / BASEW; PW = 86 * kx;
  // a rotation mid-game: keep everything at the same relative spot
  if (oldFW !== FW && plats) { const k = FW / oldFW; for (const p of plats) { p.x *= k; p.w *= k; } if (P) { P.x *= k; P.vx *= k; } }
  return [W, H];
}

const ENDLESS = LEVELS.length + 1;

// …and the ♾️ was number 39 before the 🔔🌬️🌙 levels came in

// 🔔 bells play 「小星星」 one note at a time

let level = ENDLESS, L = null, mode = 'normal', stars = 0;
const thName = () => L ? L.th : ENDLESS_TH[Math.floor(floor / 20) % ENDLESS_TH.length];
const theme = () => TH[thName()];

const starIc = () => COLIC[theme().col];

const lvName = n => n === ENDLESS ? '♾️ 無限下樓' : `${TH[LEVELS[n - 1].th].ic} ${LEVELS[n - 1].n}`;

let wallOff = 0;
let floats = [];
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
function say(t, c = '#fff', px = P.x, py = P.y - 30) { floats.push({ x: Math.max(50, Math.min(FW - 50, px)), y: Math.max(40, py), t, c, life: 0.9 }); }
let P, plats, rise, spawnY, nextIdx, floor, state = 'ready', shake = 0, flash = 0, t = 0;
let rung = 0, windT = 0, windDir = 1, windOn = 0, windWarn = 0, windStreaks = [];
let rescued = 0, rescuedList = [], hasKey = false, goalIdx = null, lampT = 0, winT = 0, lastFriend = 0, lastKey = 0, endTh = 0;
const reqMet = () => (!L || !L.fr || rescued >= L.fr) && (!L || !L.key || hasKey);

function reset() {
  P = { x: FW / 2, y: 280 - R, vy: 0, vx: 0, on: null, hp: HPMAX, inv: 0, ignore: null, ignoreT: 0, face: 'happy', squash: 0, trail: [] };

  rung = 0; windT = 0; windDir = Math.random() < 0.5 ? -1 : 1; windOn = 0; windWarn = 0; windStreaks = [];
  rescued = 0; rescuedList = []; hasKey = false; goalIdx = null; lampT = 0; winT = 0; lastFriend = 0; lastKey = 0; endTh = 0;
  addPlat(FW / 2 - PW / 2, 280, 'normal');
  spawnY = 280;
  while (spawnY < FH + GAP) spawnNext();
  P.on = plats[0];
  showHud();
}
function spawnNext() {
  spawnY += GAP;
  // the 🏁 finish stair (or 🚪 door): extra wide, so it's easy to land on. It only shows up once the friends / key are found.
  if (L && !L.star && L.g && goalIdx == null && nextIdx >= L.g && reqMet()) { const w = Math.min(FW - 8, PW * 1.8); goalIdx = nextIdx; addPlat(MG.rand(4, FW - w - 4), spawnY, 'goal', w); return; }
  addPlat(MG.rand(4, FW - PW - 4), spawnY, pickType());
}
function pickType() {
  // early floors are friendlier
  if (nextIdx < (L ? 3 : 4)) return 'normal';
  if (!L) {
    const ty = MG.pick(TYPES);
    if (ty === 'spike' && nextIdx < 10 && Math.random() < 0.5) return 'normal';
    return ty;
  }
  // levels: weighted mix, and never two tricky stairs in a row too often
  const prev = plats.length ? plats[plats.length - 1].type : 'normal';
  if ((prev === 'spike' || prev === 'blink' || prev === 'fragile') && Math.random() < 0.5) return 'normal';
  // 🔔 bell stairs: enough of them so the song can always be finished, never two in a row
  if (L.bell && prev !== 'bell' && rung + plats.filter(p => p.type === 'bell' && !p.used).length < L.bell + 2 && Math.random() < 0.32) return 'bell';
  let sum = 0; for (const k in L.m) sum += L.m[k];
  let r = Math.random() * sum; for (const k in L.m) { r -= L.m[k]; if (r <= 0) return k; }
  return 'normal';
}
const onScreen = it => plats.reduce((n, p) => n + (p.item === it && !p.got ? 1 : 0), 0);
// what sits above a new stair: a friend in a bubble, the 🔑, a lantern, a heart, a ⭐ — or nothing
function pickItem(type, idx) {
  if (type === 'spike' || type === 'goal' || type === 'bell' || idx < 2) return null;

// ---------- far layer (slow parallax): the back of the tower ----------

    for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(255,255,255,${0.12 + rnd() * 0.12})`; const sx = rnd() * w, sy = rnd() * h; wrapY(sy, y => { g.beginPath(); g.arc(sx, y, 3 + rnd() * 3, 0, 7); g.fill(); }); }

  } else if (th === 'sea') {

      else { g.fillStyle = 'rgba(12,72,124,.6)'; rr(g, cx - 24, top - 12, 48, 13, 4); g.fill(); }
      g.fillStyle = 'rgba(90,170,220,.18)'; for (let k = 0; k < 4; k++) g.fillRect(cx - 11 + k * 7, top + (br ? 18 : 3), 2.5, ch - (br ? 22 : 8));

    for (let i = 0; i < 9; i++) { const sx = rnd() * w, sy = rnd() * h, len = 50 + rnd() * 60; wrapY(sy, y => { g.strokeStyle = 'rgba(20,110,120,.45)'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(sx, y); for (let k = 1; k <= 6; k++) g.lineTo(sx + Math.sin(k * 1.2) * 7, y - k * len / 6); g.stroke(); }); }

// ---------- side walls (mid parallax): pillars at both edges of the shaft ----------
function paintWall(g, th, w, rnd) {
  const h = TILE, sw = SWD();
  for (const sd of [0, 1]) {
    const x0 = sd ? w - sw : 0, inner = sd ? x0 : sw;
    // a soft shadow the wall throws onto the back
    const sg = g.createLinearGradient(inner, 0, inner + (sd ? -22 : 22), 0); sg.addColorStop(0, 'rgba(0,0,0,.35)'); sg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = sg; g.fillRect(sd ? inner - 22 : inner, 0, 22, h);
    g.save(); g.beginPath(); g.rect(x0, 0, sw, h); g.clip();

      const base = th === 'ice' ? [204, 55, 80] : th === 'magic' ? [262, 32, 42] : [230, 20, 48], ol = th === 'ice' ? '#5d8fbf' : th === 'magic' ? '#24154f' : '#262a55';
      g.fillStyle = ol; g.fillRect(x0, 0, sw, h);

        g.fillStyle = `hsl(${base[0] + rnd() * 10} ${base[1]}% ${base[2] + rnd() * 10}%)`; rr(g, xx + 1.5, row * 30 + 1.5, sw - 3, 27, 4); g.fill();
        g.fillStyle = 'rgba(255,255,255,.16)'; g.fillRect(xx + 4, row * 30 + 3, sw - 8, 3);
        g.fillStyle = 'rgba(0,0,0,.16)'; g.fillRect(xx + 4, row * 30 + 24, sw - 8, 3);
        if (th === 'magic' && rnd() < 0.2) { g.fillStyle = 'rgba(255,215,90,.7)'; star5(g, xx + sw / 2, row * 30 + 15, 4); g.fill(); }
        if (th === 'castle' && rnd() < 0.12) { g.fillStyle = 'rgba(100,180,90,.6)'; blob(g, xx + sw / 2, row * 30 + 26, 7, 6, 0.4, rnd); g.fill(); }
        if (th === 'ice' && rnd() < 0.3) { g.fillStyle = 'rgba(255,255,255,.8)'; rr(g, xx + 2, row * 30 + 1, sw - 4, 5, 3); g.fill(); }
      }
    } else if (th === 'candy') {   // wafer-biscuit pillars with pink icing drips
      g.fillStyle = '#e2a65e'; g.fillRect(x0, 0, sw, h);
      g.strokeStyle = 'rgba(150,90,30,.45)'; g.lineWidth = 1.5; for (let y = 0; y < h; y += 8) { g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + sw, y); g.stroke(); } for (let xx = x0 + 4; xx < x0 + sw; xx += 8) { g.beginPath(); g.moveTo(xx, 0); g.lineTo(xx, h); g.stroke(); }
      for (let y = 0; y < h; y += 120) { g.fillStyle = '#ff9cc8'; g.fillRect(x0, y, sw, 12); for (let xx = x0 + 3; xx < x0 + sw; xx += 8) { g.beginPath(); g.ellipse(xx, y + 12 + (xx * 7 % 9), 3.2, 4 + (xx * 7 % 9), 0, 0, 7); g.fill(); } g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(x0 + 2, y + 2, sw - 4, 3);
        const cols = ['#fff', '#ffd34a', '#6fd3ff', '#8fe07a']; for (let k = 0; k < 5; k++) { g.fillStyle = cols[k % 4]; g.fillRect(x0 + 3 + rnd() * (sw - 8), y + 3 + rnd() * 6, 4, 1.8); } }
    } else if (th === 'jungle') {   // bark with grooves, moss and tiny mushrooms
      g.fillStyle = '#7a5030'; g.fillRect(x0, 0, sw, h);
      for (let xx = x0 + 3; xx < x0 + sw; xx += 7) { g.strokeStyle = 'rgba(40,22,8,.5)'; g.lineWidth = 2; g.beginPath(); const ph = rnd() * 6; for (let y = 0; y <= h; y += 12) g.lineTo(xx + Math.sin(y / TILE * 6.283 * 3 + ph) * 2, y); g.stroke(); }
      for (let i = 0; i < 6; i++) { const yy = rnd() * h; g.fillStyle = 'rgba(110,190,70,.85)'; wrapY(yy, y => { blob(g, sd ? x0 + 4 : x0 + sw - 4, y, 9 + rnd() * 6, 7, 0.5, rnd); g.fill(); }); }
      for (let i = 0; i < 3; i++) { const yy = rnd() * h, mx = sd ? x0 + 6 : x0 + sw - 6; wrapY(yy, y => { g.fillStyle = '#f6ecd8'; g.fillRect(mx - 2, y, 4, 7); g.fillStyle = '#ff5a4e'; g.beginPath(); g.ellipse(mx, y, 7, 5, 0, Math.PI, 0); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(mx - 2, y - 2, 1.4, 0, 7); g.fill(); }); }
    } else if (th === 'sea') {   // reef rock with colourful corals

      for (let i = 0; i < 5; i++) { const yy = rnd() * h, col = ['#ff8aa8', '#ffb35a', '#c38aff', '#6fe0c0'][i % 4], cx = sd ? x0 + 6 : x0 + sw - 6; wrapY(yy, y => { g.strokeStyle = col; g.lineWidth = 3.5; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, y + 12); g.lineTo(cx, y - 6); g.moveTo(cx, y + 2); g.lineTo(cx + (sd ? 8 : -8), y - 8); g.moveTo(cx, y + 6); g.lineTo(cx + (sd ? -6 : 6), y - 3); g.stroke(); }); }
    } else if (th === 'cloud') {   // white marble columns with golden rings

      for (let xx = x0 + sw * 0.25; xx < x0 + sw; xx += sw * 0.25) { g.fillStyle = 'rgba(140,160,200,.25)'; g.fillRect(xx - 1, 0, 2, h); }
      for (let y = 20; y < h; y += 160) { g.fillStyle = lin(g, y, y + 12, '#ffe68a', '#e0a52a'); g.fillRect(x0, y, sw, 12); g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(x0, y + 2, sw, 2); }
      for (let i = 0; i < 3; i++) { const yy = rnd() * h, fx = sd ? x0 + 5 : x0 + sw - 5; wrapY(yy, y => { g.strokeStyle = '#6fc06a'; g.lineWidth = 2; g.beginPath(); g.moveTo(fx, y - 20); g.quadraticCurveTo(fx + 6, y, fx, y + 20); g.stroke(); g.fillStyle = '#ff9cc2'; for (const o of [-12, 4, 16]) { g.beginPath(); g.arc(fx + 2, y + o, 3, 0, 7); g.fill(); } }); }

    } else if (th === 'cave') {   // knobbly rock with crystals

      for (let i = 0; i < 18; i++) { const yy = rnd() * h; g.fillStyle = `rgba(${rnd() < 0.5 ? '100,84,130' : '70,58,96'},1)`; wrapY(yy, y => { blob(g, x0 + sw / 2, y, sw * 0.55, 6, 0.4, rnd); g.fill(); }); }
      for (let i = 0; i < 4; i++) { const yy = rnd() * h, cx = sd ? x0 + 5 : x0 + sw - 5, col = i % 2 ? '#7fe6ff' : '#ff9ae0'; wrapY(yy, y => { g.fillStyle = col; g.beginPath(); g.moveTo(cx - 4, y + 8); g.lineTo(cx, y - 10); g.lineTo(cx + 4, y + 8); g.fill(); g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(cx - 1, y - 4, 1.5, 9); }); }
    }
    g.restore();
    // a bright edge where the light (top-left) catches the wall
    g.fillStyle = sd ? 'rgba(0,0,0,.25)' : 'rgba(255,255,255,.18)'; g.fillRect(sd ? x0 : sw - 3, 0, 3, h);

// ---------- screen-fixed overlay: depth fog, vignette, light rays (cached) ----------

    x.save(); x.translate(cx, cy); if (sp > 0 && T.crit !== 'firefly') x.scale(-1, 1); critter(T.crit, 0, 0, (T.crit === 'firefly' ? 0.9 : 1) * Math.min(1.25, kx), i); x.restore();

  ice: ['❄️ 滑滑冰樓梯', '亮藍色的冰樓梯很滑！噗噗站上去會一直滑，要早一點放開，或往反方向按才停得下來。'],
  move: ['↔️ 會動的樓梯', '綠色葉子樓梯會左右移動，站上去會一起移動，看準了再跳下去！'],
  blink: ['👻 一閃一閃的魔法樓梯', '紫色魔法樓梯會一下出現、一下消失。開始閃的時候就快消失了，趕快離開！'],
  rescue: ['🫧 救救小朋友', '有小朋友被困在<b>泡泡</b>裡了！碰一下泡泡就能把牠救出來，牠會一路跟著你。救到上面寫的數量就過關！'],
  key: ['🔑 鑰匙和 🚪 門', '這座塔的出口是一扇 <b>🚪 門</b>。要先在路上找到 <b>🔑 鑰匙</b>，門才會出現在下面喔！沒撿到也沒關係，鑰匙會再出現。'],
  dark: ['🏮 黑漆漆的塔', '這裡好暗！只有噗噗的<b>燈籠</b>照得到附近，樓梯的邊邊會微微發亮。撿到 🏮 燈籠，光會變大一下下！'],
  bell: ['🔔 鈴鐺樓梯', '發亮的<b>鈴鐺樓梯</b>踩一下就會「叮」！一個一個踩，就會彈出一首<b>小星星</b>。踩夠上面寫的數量就過關，不用一直往下衝喔。'],
  wind: ['🌬️ 大風吹', '這座塔會<b>颳大風</b>！牆上出現 ⬅️ ➡️ 箭頭，就是風要往那邊吹了，往<b>反方向</b>按住就不會被吹走。'],
  moon: ['🌙 月亮慢慢飄', '這裡像在月亮上一樣<b>好輕好輕</b>，噗噗會慢慢飄下去，在空中也可以慢慢左右移動找位置。'],
  lift: ['🎈 氣球電梯', '有氣球的籃子會<b>慢慢上上下下</b>。站在上面會一起動，等它往下的時候再跳，比較不會撞到刺刺！'],
};
function intro() {
  const ks = [L.g || L.star ? 'goal' : '', ...Object.keys(L.m), L.star ? 'star' : '', L.fr ? 'rescue' : '', L.key ? 'key' : '', L.dark ? 'dark' : '', L.bell ? 'bell' : '', L.wind ? 'wind' : '', L.moon ? 'moon' : ''].filter(k => NEWS[k] && !MG.store.get('stairs.seen.' + k, false));
  if (!ks.length) return false;
  ks.forEach(k => MG.store.set('stairs.seen.' + k, true));
  MG.panel({ title: ks.map(k => NEWS[k][0]).join('＋'), html: ks.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  return true;
}
function goalLine(Lv) {
  if (Lv.bell) return `🔔×${Lv.bell}` + (Lv.wind ? '　🌬️' : '');
  if (Lv.star) return `${COLIC[TH[Lv.th].col]}×${Lv.g}`;
  const a = []; if (Lv.fr) a.push(`${BUDIC[TH[Lv.th].bud]}×${Lv.fr}`); if (Lv.key) a.push('🔑'); if (Lv.g) a.push(`${Lv.key ? '🚪' : '🏁'} ${Lv.g} 層`); if (Lv.dark) a.push('🏮'); if (Lv.wind) a.push('🌬️'); if (Lv.moon) a.push('🌙');
  return a.join('　');
}
function startLevel(n) {
  level = n; L = n === ENDLESS ? null : LEVELS[n - 1];
  reset(); state = 'play'; MG.hide(); rest.show(!L && mode === 'relax');
  keys.l = keys.r = false; touches.clear(); touchDir = 0;
  if (L && !intro()) MG.toast(`第 ${n} 關　${lvName(n)}　${goalLine(L)}`, 1800);
}
function win() {
  if (state !== 'play') return;
  state = 'won'; winT = 0; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  P.face = 'happy'; say(MG.WORDS.clear, '#ffd34a', P.x, P.y - 40);
  MG.fx.burst(P.x, P.y, { n: 44, colors: [...theme().conf, '#fff6a0'], speed: 280, up: 180, size: 6, shape: 'star', life: 1.1 });
  MG.fx.burst(FW / 2, FH * 0.4, { n: 30, colors: theme().conf, speed: 320, up: 120, size: 5, shape: 'sq', life: 1.4, grav: 300 });
  const cl = MG.store.get('stairs.cleared', {}); cl[level] = Math.max(cl[level] || 0, stars); MG.store.set('stairs.cleared', cl);
  const nx = level < LEVELS.length ? level + 1 : ENDLESS, done = level;
  MG.store.set('stairs.pickLevel', nx);
  setTimeout(() => state === 'won' && level === done && MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<div class="big">${L.bell ? `🔔 × ${rung} 🎶` : L.star ? `${starIc()} × ${stars}` : L.fr ? `${budIc()} × ${rescued}` : `${L.key ? '🚪' : '🏁'} 地下 ${floor} 層`}</div>` +
      (L.fr ? `<p>救出了 ${rescued} 個小朋友，牠們好開心！</p>` : '') + (!L.star ? `<p>${starIc()} 收集了 ${stars} 個</p>` : `<p>到了地下 ${floor} 層</p>`) +
      `<p>${nx === ENDLESS ? '全部的塔都下完了！你好厲害！來試試 ♾️ 無限下樓吧 ^_^' : `下一關：${lvName(nx)}`}</p>`,
    buttons: [{ label: nx === ENDLESS ? '♾️ 無限下樓' : '下一關', on: () => startLevel(nx) }, { label: '再玩一次', alt: true, on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],
  }), 1300);
}
function gameOver(rested) {
  state = 'over'; rest.show(false);
  if (!rested) { MG.sfx('over'); MG.fx.burst(P.x, Math.min(P.y, FH - 10), { n: 22, colors: ['#4cc96a', '#9ff0a8', '#2e9a4c'], speed: 220, up: 160, size: 5 }); } else MG.sfx('win');
  showHud();
  if (L) return MG.panel({
    title: '噗噗掉下去了！',
    html: `<p>這次到了地下 ${floor} 層` + (L.star ? `，收集了 ${starIc()} ${stars} 個` : L.g ? `（終點在 ${L.g} 層）` : '') + (L.fr ? `，救了 ${rescued} 個小朋友` : '') + `</p><p>再試一次！覺得太難可以選 🐢 慢慢玩，不會輸喔。</p>`,
    buttons: [{ label: '再試一次', on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],
  });
  const rec = mode === 'relax' ? null : MG.record('stairs', floor);
  MG.panel({
    title: rested ? '休息一下！' : '噗噗掉下去了！',
    html: `<p>這次到了</p><div class="big">地下 ${floor} 層</div>` + (!rec ? '<p>🐢 慢慢玩不算紀錄喔</p>' : rec.isNew && floor > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：地下 ${rec.best} 層</p>`),
    buttons: [{ label: '再玩一次', on: () => startLevel(ENDLESS) }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; rest.show(false);
  const cl = MG.store.get('stairs.cleared', {});
  MG.choose({
    id: 'stairs', title: '噗噗下樓梯',
    html: `<p>天花板的刺刺一直往下壓，快跳到下面的樓梯上！一共 ${LEVELS.length} 關，最後一格是 ♾️ 無限下樓（每 20 層換一座塔）。</p>
  <p>🏰 城堡、🍭 糖果工廠、🌳 大樹洞、🐠 海底塔、☁️ 雲朵塔…<br>新玩法：🫧 救朋友、🔑 鑰匙和門、🏮 黑漆漆提燈、🎈 氣球電梯，還有 🆕 🔔 踩鈴鐺彈歌、🌬️ 大風吹、🌙 月亮慢慢飄！</p>`,
    modes: [{ id: 'normal', label: '❤️ 一般', sub: '血用完就要重來' }, { id: 'relax', label: '🐢 慢慢玩', sub: '不會輸・掉下去會再回來' }],
    levels: { count: ENDLESS, max: ENDLESS, label: n => n === ENDLESS ? `♾️ 無限下樓（最高 ${MG.best('stairs') ?? 0} 層）` : `${n}（${lvName(n)}・${goalLine(LEVELS[n - 1])}）${cl[n] != null ? ' ✓' : ''}`,
      fresh: n => n >= 39 && n < ENDLESS,
      short: n => n === ENDLESS ? '♾️' : `${n}${LEVELS[n - 1].mk || ''}${cl[n] != null ? '<small>✓</small>' : ''}` },
    keys: '電腦：<kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd>　手機：按住畫面左半邊或右半邊',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
MG.fit(cv, layout);
reset();
menu();
// test hook: start any level, steer with a little bot, run faster, read the goals, win at once
const HOOK = window.STR = { auto: false, fast: 1, start(n, m = 'normal') { mode = m; startLevel(n); }, get state() { return state; }, get level() { return level; }, get floor() { return floor; }, get stars() { return stars; },
  get hp() { return P.hp; }, get count() { return ENDLESS; }, levels: LEVELS, types: () => plats.map(p => p.type), items: () => plats.filter(p => p.item && !p.got).map(p => p.item),
  get rescued() { return rescued; }, get rung() { return rung; }, get hasKey() { return hasKey; }, get goalIdx() { return goalIdx; }, get theme() { return thName(); }, get lay() { return LAY; },
  win: () => win(), dbg: () => [Math.round(P.x), Math.round(P.y), P.on ? Math.round(P.on.y) : null, FH, plats.length], menu: () => menu() };
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) { for (let i = 0; i < (HOOK.fast | 0 || 1) && state === 'play'; i++) update(dt); }
  else { t += dt; if (state === 'won') winT += dt; MG.fx.step(dt); for (const f of floats) { f.y -= 34 * dt; f.life -= dt; } floats = floats.filter(f => f.life > 0); }
  draw();
});
</script>
