<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗下樓梯</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'stairs', title: '噗噗下樓梯', stats: ['floor', 'best'] });
const W = 360, H = 560, cv = document.getElementById('cv'), x = cv.getContext('2d');
MG.fit(cv, W, H);

const R = 14, HPMAX = 10, CEIL = 22, PW = 86, PH = 12, GAP = 72;
const TYPES = ['normal', 'normal', 'normal', 'spike', 'spring', 'left', 'right', 'fragile'];
let wallOff = 0, deco = [];
let P, plats, rise, spawnY, nextIdx, floor, state = 'ready', shake = 0, flash = 0, parts = [], t = 0;

function reset() {
  P = { x: W / 2, y: 280 - R, vy: 0, on: null, hp: HPMAX, inv: 0, ignore: null, ignoreT: 0, face: 'happy', squash: 0 };
  plats = []; nextIdx = 0; floor = 0; rise = 70; t = 0; parts = []; wallOff = 0; MG.fx.clear();
  addPlat(W / 2 - PW / 2, 280, 'normal');
  spawnY = 280;
  while (spawnY < H + GAP) { spawnY += GAP; addPlat(MG.rand(4, W - PW - 4), spawnY, pickType()); }
  P.on = plats[0];
  showHud();
}
function pickType() {
  // early floors are friendlier
  if (nextIdx < 4) return 'normal';
  const ty = MG.pick(TYPES);
  if (ty === 'spike' && nextIdx < 10 && Math.random() < 0.5) return 'normal';
  return ty;
}
function addPlat(px, py, type) { plats.push({ x: px, y: py, type, idx: nextIdx++, used: false, crumble: -1, gone: false, boing: 0, seed: Math.random() * 1000 }); }
function showHud() { MG.stat('floor', `地下 ${floor} 層`); const b = MG.best('stairs'); MG.stat('best', `最高 ${b ?? 0}`); }

// ---------- input ----------
const keys = { l: false, r: false }; let touchDir = 0;
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play' && MG.panelOpen()) { /* button has focus */ }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.l = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.r = false;
});
const touches = new Map();
const stage = cv.parentElement;
function updTouch() { let d = 0; for (const v of touches.values()) d = v; touchDir = d; }
stage.addEventListener('pointerdown', e => { const r = stage.getBoundingClientRect(); touches.set(e.pointerId, e.clientX < r.left + r.width / 2 ? -1 : 1); updTouch(); });
stage.addEventListener('pointermove', e => { if (!touches.has(e.pointerId)) return; const r = stage.getBoundingClientRect(); touches.set(e.pointerId, e.clientX < r.left + r.width / 2 ? -1 : 1); updTouch(); });
for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) stage.addEventListener(ev, e => { touches.delete(e.pointerId); updTouch(); });
addEventListener('blur', () => { keys.l = keys.r = false; touches.clear(); touchDir = 0; });

// ---------- update ----------
function hurt(n) {
  if (P.inv > 0) return;
  P.hp = Math.max(0, P.hp - n); P.inv = 0.7; shake = 0.25; flash = 0.2; P.face = 'ouch'; MG.sfx('hit');
}
function update(dt) {
  t += dt;
  rise = Math.min(175, 70 + floor * 1.6);
  const dy = rise * dt;
  for (const p of plats) p.y -= dy;
  spawnY -= dy;
  while (spawnY < H + GAP) { spawnY += GAP; addPlat(MG.rand(4, W - PW - 4), spawnY, pickType()); }
  plats = plats.filter(p => p.y > -PH && !p.gone);

  // horizontal
  let dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0); if (touchDir) dir = touchDir;
  P.x += dir * 210 * dt; P.look = dir || (P.look || 0) * 0.9;
  wallOff += dy * 0.55;
  for (const p of plats) p.boing = Math.max(0, p.boing - dt);
  if (P.on && P.on.type === 'left') P.x -= 95 * dt;
  if (P.on && P.on.type === 'right') P.x += 95 * dt;
  P.x = Math.max(R, Math.min(W - R, P.x));
  P.inv = Math.max(0, P.inv - dt); P.ignoreT = Math.max(0, P.ignoreT - dt); if (!P.ignoreT) P.ignore = null;
  if (P.inv === 0 && P.face === 'ouch') P.face = 'happy';
  P.squash *= Math.pow(0.002, dt);

  if (P.on) {
    const p = P.on;
    if (p.gone || P.x < p.x - R * 0.6 || P.x > p.x + PW + R * 0.6) { P.on = null; P.vy = 0; }
    else {
      P.y = p.y - R; P.vy = 0;
      if (p.type === 'fragile' && p.crumble >= 0) { p.crumble += dt; if (p.crumble > 0.38) { p.gone = true; P.on = null; MG.fx.burst(p.x + PW / 2, p.y + 4, { n: 18, colors: ['#b9a58a', '#8f7d64', '#d8c6a8'], speed: 120, up: 20, size: 5, shape: 'sq', life: 0.8 }); MG.sfx('step'); } }
    }
  }
  if (!P.on) {
    const prevFeet = P.y + R;
    P.vy = Math.min(560, P.vy + 1500 * dt);
    P.y += P.vy * dt;
    const feet = P.y + R;
    if (P.vy >= 0) for (const p of plats) {
      if (p === P.ignore || p.gone) continue;
      if (prevFeet <= p.y + dy + 1 && feet >= p.y && P.x > p.x - R * 0.6 && P.x < p.x + PW + R * 0.6) { land(p); break; }
    }
  }
  // ceiling spikes
  if (P.y - R < CEIL) {
    hurt(5);
    P.y = CEIL + R + 2;
    if (P.on) { P.ignore = P.on; P.ignoreT = 0.35; P.on = null; }
    P.vy = 120;
  }
  MG.fx.step(dt);
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt);
  if (P.hp <= 0 || P.y - R > H) gameOver();
  showHud();
}
function land(p) {
  P.on = p; P.y = p.y - R; P.squash = 0.22;
  MG.fx.burst(P.x, p.y, { n: 6, colors: ['rgba(255,255,255,.7)', 'rgba(220,210,190,.7)'], speed: 70, up: 30, size: 3, grav: 120, life: 0.45 });
  if (p.idx > floor) floor = p.idx;
  if (p.type === 'spike') { if (!p.used) hurt(4); }
  else if (!p.used && P.hp < HPMAX) P.hp++;
  if (p.type === 'spring') { P.on = null; P.vy = -560; P.squash = -0.2; p.boing = 0.35; MG.sfx('jump'); }
  if (p.type === 'spike' && !p.used) MG.fx.burst(P.x, p.y - 4, { n: 10, colors: ['#ff5a4e', '#ffd23f', '#fff'], speed: 160, shape: 'star', size: 5 });
  else if (p.type !== 'spike') MG.sfx('step');
  if (p.type === 'fragile' && p.crumble < 0) p.crumble = 0;
  p.used = true;
}
function burst(px, py, col, n) { for (let i = 0; i < n; i++) parts.push({ x: px + MG.rand(-30, 30), y: py, vx: MG.rand(-80, 80), vy: MG.rand(-160, -20), life: MG.rand(0.4, 0.8), col }); }

// ---------- draw ----------
// Stone wall tile (W x 240, tiles vertically), cached per pixel ratio
let wallTile = null, wallKey = '';
function makeWall() {
  const k = cv._mgScale || 1, key = '' + k; if (key === wallKey) return; wallKey = key;
  const c = document.createElement('canvas'); c.width = W * k; c.height = 240 * k; const w = c.getContext('2d'); w.scale(k, k);
  w.fillStyle = '#20284a'; w.fillRect(0, 0, W, 240);
  let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let row = 0; row < 8; row++) {
    const y = row * 30, off = row % 2 ? 0 : -30;
    for (let xx = off; xx < W; xx += 60) {
      const l = 30 + rnd() * 14, hue = 228 + rnd() * 14;
      w.fillStyle = `hsl(${hue} 28% ${l}%)`; w.beginPath(); w.roundRect(xx + 1.5, y + 1.5, 57, 27, 4); w.fill();
      w.fillStyle = 'rgba(255,255,255,.07)'; w.fillRect(xx + 3, y + 3, 53, 4);
      w.fillStyle = 'rgba(0,0,0,.18)'; w.fillRect(xx + 3, y + 23, 53, 4);
      for (let i = 0; i < 4; i++) { w.fillStyle = `rgba(0,0,0,${0.06 + rnd() * 0.08})`; w.beginPath(); w.arc(xx + 6 + rnd() * 48, y + 6 + rnd() * 18, 1 + rnd() * 2, 0, 7); w.fill(); }
      if (rnd() < 0.12) { w.fillStyle = 'rgba(90,160,90,.35)'; w.beginPath(); w.ellipse(xx + 10 + rnd() * 40, y + 26, 8, 3, 0, 0, 7); w.fill(); }   // moss
    }
  }
  wallTile = c;
}
function decoAt(i) { // deterministic wall decoration for slot i (every 180px of wall)
  const r = Math.abs(Math.sin(i * 91.7) * 1000) % 1;
  return r < 0.45 ? 'torch' : r < 0.75 ? 'window' : r < 0.9 ? 'banner' : 'none';
}
function drawWall() {
  makeWall();
  const off = wallOff % 240;
  for (let y = -off; y < H; y += 240) x.drawImage(wallTile, 0, y, W, 240);
  // decorations scroll with the wall
  const SL = 180, first = Math.floor(wallOff / SL);
  for (let i = first; i < first + Math.ceil(H / SL) + 2; i++) {
    const kind = decoAt(i), y = i * SL - wallOff + 60, side = i % 2 ? 60 : W - 60;
    if (kind === 'torch') {
      const fl = 0.85 + Math.sin(t * 13 + i) * 0.08 + Math.sin(t * 7.3 + i * 2) * 0.07;
      const g = x.createRadialGradient(side, y - 14, 4, side, y - 14, 90 * fl); g.addColorStop(0, 'rgba(255,190,90,.38)'); g.addColorStop(1, 'rgba(255,150,60,0)');
      x.fillStyle = g; x.fillRect(side - 100, y - 110, 200, 200);
      x.fillStyle = '#4a3a2a'; x.fillRect(side - 3, y - 6, 6, 22); x.fillStyle = '#6b5a44'; x.fillRect(side - 8, y - 8, 16, 5);
      x.fillStyle = '#7a6a54'; x.fillRect(side - 2, y + 14, 4, 8);
      x.fillStyle = '#ff7a1c'; x.beginPath(); x.moveTo(side - 7, y - 8); x.quadraticCurveTo(side - 8 * fl, y - 22, side, y - 30 * fl); x.quadraticCurveTo(side + 8 * fl, y - 22, side + 7, y - 8); x.fill();
      x.fillStyle = '#ffd34a'; x.beginPath(); x.moveTo(side - 3.5, y - 8); x.quadraticCurveTo(side - 4, y - 16, side, y - 21 * fl); x.quadraticCurveTo(side + 4, y - 16, side + 3.5, y - 8); x.fill();
    } else if (kind === 'window') {
      x.fillStyle = '#151a30'; x.beginPath(); x.roundRect(side - 24, y - 36, 48, 62, [24, 24, 3, 3]); x.fill();
      const sky = x.createLinearGradient(0, y - 32, 0, y + 22); sky.addColorStop(0, '#1d2f6b'); sky.addColorStop(1, '#4b3f88');
      x.fillStyle = sky; x.beginPath(); x.roundRect(side - 19, y - 31, 38, 52, [19, 19, 2, 2]); x.fill();
      x.fillStyle = '#fff6c9'; x.beginPath(); x.arc(side + 6, y - 14, 7, 0, 7); x.fill(); x.fillStyle = '#1d2f6b'; x.beginPath(); x.arc(side + 9, y - 16, 6, 0, 7); x.fill();
      x.fillStyle = '#fff'; for (const [sx, sy] of [[-10, -4], [-4, 8], [10, 6], [-12, 14]]) x.fillRect(side + sx, y + sy, 1.5, 1.5);
      x.strokeStyle = '#2d2440'; x.lineWidth = 3; x.beginPath(); x.moveTo(side, y - 31); x.lineTo(side, y + 21); x.moveTo(side - 19, y - 4); x.lineTo(side + 19, y - 4); x.stroke();
      x.fillStyle = '#8b8fa8'; x.fillRect(side - 28, y + 24, 56, 6);
    } else if (kind === 'banner') {
      const sw = Math.sin(t * 1.6 + i) * 2;
      x.fillStyle = '#6b5a44'; x.fillRect(side - 22, y - 40, 44, 4);
      x.fillStyle = i % 3 ? '#b8323b' : '#2f6fb8'; x.beginPath(); x.moveTo(side - 18, y - 36); x.lineTo(side + 18, y - 36); x.lineTo(side + 18 + sw, y + 20); x.lineTo(side + sw, y + 10); x.lineTo(side - 18 + sw, y + 20); x.closePath(); x.fill();
      x.fillStyle = '#ffd34a'; x.beginPath(); x.arc(side + sw * 0.5, y - 12, 7, 0, 7); x.fill(); x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(side - 18, y - 36, 36, 3);
    }
  }
  // depth fog
  const fog = x.createLinearGradient(0, 0, 0, H); fog.addColorStop(0, 'rgba(10,12,30,.15)'); fog.addColorStop(1, 'rgba(10,12,30,.45)'); x.fillStyle = fog; x.fillRect(0, 0, W, H);
}
function draw() {
  x.save();
  if (shake) x.translate(MG.rand(-4, 4) * shake * 4, MG.rand(-4, 4) * shake * 4);
  drawWall();
  // floor signs every 10 floors
  for (const p of plats) if (p.idx > 0 && p.idx % 10 === 0) {
    const sx = p.x + PW / 2, sy = p.y + 20;
    x.strokeStyle = '#8a7a5a'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(sx - 14, p.y + PH); x.lineTo(sx - 10, sy); x.moveTo(sx + 14, p.y + PH); x.lineTo(sx + 10, sy); x.stroke();
    x.fillStyle = '#f3e2b5'; x.strokeStyle = '#8a6a3a'; x.lineWidth = 2; x.beginPath(); x.roundRect(sx - 22, sy, 44, 20, 4); x.fill(); x.stroke();
    x.fillStyle = '#6b4a22'; x.font = '800 12px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('B' + p.idx, sx, sy + 10.5);
  }
  for (const p of plats) drawPlat(p);
  MG.fx.draw(x);
  // player
  if (!(P.inv > 0 && Math.floor(P.inv * 14) % 2)) MG.puPu(x, P.x, P.y, R, P.face, P.squash, { look: P.look || 0, arms: P.on ? false : 'up' });
  // ceiling: dark shadow, metal bar with bolts, shiny spikes
  const cg = x.createLinearGradient(0, 0, 0, 70); cg.addColorStop(0, 'rgba(0,0,0,.45)'); cg.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = cg; x.fillRect(0, 0, W, 70);
  const bar = x.createLinearGradient(0, 0, 0, 11); bar.addColorStop(0, '#9aa0b8'); bar.addColorStop(1, '#5d6378'); x.fillStyle = bar; x.fillRect(0, 0, W, 11);
  for (let i = 9; i < W; i += 36) { x.fillStyle = '#c9cede'; x.beginPath(); x.arc(i, 5.5, 2.2, 0, 7); x.fill(); x.fillStyle = '#4a4f62'; x.fillRect(i - 1.2, 4.8, 2.4, 1.2); }
  for (let i = 0; i < W; i += 18) {
    const sg = x.createLinearGradient(i, 0, i + 18, 0); sg.addColorStop(0, '#f4f6fc'); sg.addColorStop(0.5, '#c4c9d8'); sg.addColorStop(1, '#878da2');
    x.fillStyle = sg; x.strokeStyle = '#5d6378'; x.lineWidth = 1; x.beginPath(); x.moveTo(i + 1, 10); x.lineTo(i + 9, CEIL + 3); x.lineTo(i + 17, 10); x.closePath(); x.fill(); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.8)'; x.fillRect(i + 5, 11, 1.4, 5);
  }
  // HP: little heart-gem segments in a panel
  x.fillStyle = 'rgba(15,18,40,.65)'; x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 1.5; x.beginPath(); x.roundRect(8, H - 32, 182, 24, 12); x.fill(); x.stroke();
  x.fillStyle = '#ff7a8a'; x.font = '15px system-ui,sans-serif'; x.textBaseline = 'middle'; x.textAlign = 'left'; x.fillText('❤', 16, H - 19.5);
  const low = P.hp <= 3;
  for (let i = 0; i < HPMAX; i++) {
    const on = i < P.hp, px = 36 + i * 15, py = H - 26;
    x.fillStyle = on ? (low ? '#ff5a4e' : '#5fe07a') : 'rgba(255,255,255,.15)'; x.beginPath(); x.roundRect(px, py, 12, 13, 3); x.fill();
    if (on) { x.fillStyle = 'rgba(255,255,255,.5)'; x.fillRect(px + 2, py + 2, 8, 3); }
  }
  if (low && state === 'play') { const v = x.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75); v.addColorStop(0, 'rgba(255,0,0,0)'); v.addColorStop(1, `rgba(255,30,30,${0.18 + Math.sin(t * 6) * 0.08})`); x.fillStyle = v; x.fillRect(0, 0, W, H); }
  if (flash) { x.fillStyle = `rgba(255,60,60,${flash * 1.6})`; x.fillRect(0, 0, W, H); }
  x.restore();
}
function drawPlat(p) {
  let px = p.x, py = p.y;
  if (p.type === 'fragile' && p.crumble > 0) px += Math.sin(p.crumble * 80) * 2;
  // soft shadow on the wall behind every platform
  x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.roundRect(px + 4, py + 6, PW, PH + 2, 5); x.fill();
  if (p.type === 'normal') {
    const g = x.createLinearGradient(0, py, 0, py + PH); g.addColorStop(0, '#f2c46c'); g.addColorStop(1, '#c98f3a');
    x.fillStyle = g; x.beginPath(); x.roundRect(px, py, PW, PH, 4); x.fill();
    x.strokeStyle = '#8a5a22'; x.lineWidth = 1.5; x.stroke();
    x.strokeStyle = 'rgba(138,90,34,.45)'; x.lineWidth = 1; x.beginPath();
    x.moveTo(px + PW * 0.34, py + 1); x.lineTo(px + PW * 0.34, py + PH - 1); x.moveTo(px + PW * 0.68, py + 1); x.lineTo(px + PW * 0.68, py + PH - 1);
    for (let i = 0; i < 3; i++) { const yy = py + 3 + i * 3; x.moveTo(px + 4 + (p.seed + i * 13) % 20, yy); x.lineTo(px + 22 + (p.seed + i * 13) % 20, yy); }
    x.stroke();
    x.fillStyle = 'rgba(255,255,255,.45)'; x.fillRect(px + 3, py + 1.5, PW - 6, 2);
    x.fillStyle = '#6b5a44'; for (const nx of [px + 6, px + PW * 0.34 + 5, px + PW * 0.68 + 5, px + PW - 6]) { x.beginPath(); x.arc(nx, py + PH / 2 + 1, 1.3, 0, 7); x.fill(); }
  } else if (p.type === 'spike') {
    const g = x.createLinearGradient(0, py + 4, 0, py + PH); g.addColorStop(0, '#8d93a8'); g.addColorStop(1, '#4f5568');
    x.fillStyle = g; x.beginPath(); x.roundRect(px, py + 4, PW, PH - 4, 3); x.fill(); x.strokeStyle = '#3a3f50'; x.lineWidth = 1.5; x.stroke();
    for (let i = 0; i < PW; i += 10.75) {
      const sg = x.createLinearGradient(px + i, 0, px + i + 10.75, 0); sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.5, '#cfd4e2'); sg.addColorStop(1, '#8a90a6');
      x.fillStyle = sg; x.strokeStyle = '#5a6074'; x.lineWidth = 1; x.beginPath(); x.moveTo(px + i + 0.5, py + 5); x.lineTo(px + i + 5.4, py - 8); x.lineTo(px + i + 10.25, py + 5); x.closePath(); x.fill(); x.stroke();
    }
    x.fillStyle = '#d4d8e4'; for (let i = 8; i < PW; i += 20) { x.beginPath(); x.arc(px + i, py + PH / 2 + 2, 1.5, 0, 7); x.fill(); }
    x.fillStyle = 'rgba(255,60,60,.25)'; x.fillRect(px, py + PH - 2, PW, 2);
  } else if (p.type === 'spring') {
    const comp = p.boing > 0 ? Math.sin((0.35 - p.boing) / 0.35 * Math.PI * 3) * 4 * (p.boing / 0.35) : 0;
    const top = py - 2 + comp;
    x.strokeStyle = '#7d8498'; x.lineWidth = 2.4;
    for (const cxp of [px + 18, px + PW - 18]) { x.beginPath(); for (let i = 0; i <= 6; i++) x.lineTo(cxp + (i % 2 ? 7 : -7), top + 4 + i * ((py + PH + 2 - top - 4) / 6)); x.stroke(); }
    x.fillStyle = '#5d6378'; x.beginPath(); x.roundRect(px + 2, py + PH - 1, PW - 4, 4, 2); x.fill();
    const g = x.createLinearGradient(0, top, 0, top + 7); g.addColorStop(0, '#9ff0ff'); g.addColorStop(1, '#2c9fc4');
    x.fillStyle = g; x.strokeStyle = '#1d6f8f'; x.lineWidth = 1.5; x.beginPath(); x.roundRect(px, top, PW, 7, 3.5); x.fill(); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.6)'; x.fillRect(px + 4, top + 1.2, PW - 8, 1.8);
    x.fillStyle = '#1d6f8f'; x.font = '900 9px system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('▲ ▲ ▲', px + PW / 2, top + 4);
  } else if (p.type === 'left' || p.type === 'right') {
    const sd = p.type === 'left' ? -1 : 1;
    x.fillStyle = '#2d2a3c'; x.beginPath(); x.roundRect(px, py, PW, PH, PH / 2); x.fill();
    x.strokeStyle = '#141220'; x.lineWidth = 1.5; x.stroke();
    // moving chevrons on the belt
    x.save(); x.beginPath(); x.roundRect(px + 3, py + 2, PW - 6, PH - 4, (PH - 4) / 2); x.clip();
    x.fillStyle = '#b7a2ff'; const o = ((t * 95 * sd) % 14 + 14) % 14;
    for (let i = -14; i < PW + 14; i += 14) { const ax = px + i + o; x.beginPath(); x.moveTo(ax - 3 * sd, py + 2); x.lineTo(ax + 3 * sd, py + PH / 2); x.lineTo(ax - 3 * sd, py + PH - 2); x.lineTo(ax - 6 * sd, py + PH - 2); x.lineTo(ax, py + PH / 2); x.lineTo(ax - 6 * sd, py + 2); x.fill(); }
    x.restore();
    // rollers at each end
    for (const rx of [px + PH / 2, px + PW - PH / 2]) {
      x.fillStyle = '#9aa0b8'; x.beginPath(); x.arc(rx, py + PH / 2, PH / 2 - 0.5, 0, 7); x.fill();
      x.strokeStyle = '#4a4f62'; x.lineWidth = 1.2; x.beginPath(); const a = t * 8 * sd; x.moveTo(rx + Math.cos(a) * 4, py + PH / 2 + Math.sin(a) * 4); x.lineTo(rx - Math.cos(a) * 4, py + PH / 2 - Math.sin(a) * 4); x.stroke();
    }
  } else if (p.type === 'fragile') {
    const g = x.createLinearGradient(0, py, 0, py + PH); g.addColorStop(0, '#d9cbb0'); g.addColorStop(1, '#a8957a');
    x.globalAlpha = p.crumble > 0 ? 1 - p.crumble * 1.2 : 1;
    x.fillStyle = g; x.beginPath(); x.roundRect(px, py, PW, PH, 3); x.fill(); x.strokeStyle = '#6e5e46'; x.lineWidth = 1.5; x.stroke();
    x.strokeStyle = '#6e5e46'; x.lineWidth = 1.2; x.beginPath();
    x.moveTo(px + PW * 0.28, py); x.lineTo(px + PW * 0.33, py + 5); x.lineTo(px + PW * 0.3, py + PH);
    x.moveTo(px + PW * 0.33, py + 5); x.lineTo(px + PW * 0.44, py + 7);
    x.moveTo(px + PW * 0.7, py); x.lineTo(px + PW * 0.64, py + 6); x.lineTo(px + PW * 0.68, py + PH); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(px + 3, py + 1.5, PW - 6, 2);
    if (p.crumble > 0 && Math.random() < 0.5) MG.fx.burst(px + MG.rand(5, PW - 5), py + PH, { n: 1, colors: ['#b9a58a'], speed: 20, up: -20, size: 2.5, shape: 'sq', life: 0.5 });
    x.globalAlpha = 1;
  }
}

// ---------- flow ----------
function start() { reset(); state = 'play'; MG.hide(); }
function gameOver() {
  state = 'over'; MG.sfx('over'); MG.fx.burst(P.x, Math.min(P.y, H - 10), { n: 22, colors: ['#4cc96a', '#9ff0a8', '#2e9a4c'], speed: 220, up: 160, size: 5 });
  const rec = MG.record('stairs', floor);
  showHud();
  MG.panel({
    title: '噗噗掉下去了！',
    html: `<p>這次到了</p><div class="big">地下 ${floor} 層</div>` + (rec.isNew && floor > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：地下 ${rec.best} 層</p>`),
    buttons: [{ label: '再玩一次', on: start }, { label: '回遊戲區', alt: true, on: () => location.href = 'index.html' }],
  });
}
reset();
MG.panel({
  title: '噗噗下樓梯',
  html: `<p>天花板的尖刺一直往下壓，快跳到下面的樓梯上，看能下到幾層！</p>
  <p>🟨 普通（補 1 格血）　⬜ 尖刺（扣血）<br>🟦 彈簧　🟪 輸送帶　🟫 會碎的木板</p>`,
  keys: '電腦：<kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd>　手機：按住畫面左半邊或右半邊',
  buttons: [{ label: '開始', on: start }],
});
MG.loop(dt => { if (state === 'play') update(dt); else { t += dt; MG.fx.step(dt); } draw(); });
</script>
