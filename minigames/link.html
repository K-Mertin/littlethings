const LV = n => LEVELS[Math.min(n, LEVELS.length) - 1];
const thOf = L => L.th || 'zoo';
function mechOf(L) {
  const m = (L.m || []).join(''), out = [];

const MECH = {
  shape: ['🧩', '特別形狀', '🧩 特別形狀', '這次的盤子是特別的形狀！空空的地方沒有動物，<b>線可以從空格穿過去</b>喔。'],

};
const lvShort = n => { const L = LV(n), me = mechOf(L); return `${n}${L.fin ? '👑' : me.length ? MECH[me[me.length - 1]][0] : L.th ? THEMES[L.th].em : ''}`; };
const lvLabel = n => { const L = LV(n), me = mechOf(L), nm = [L.fin ? '👑 大結局' : '', L.th ? THEMES[L.th].nm : n > 18 ? THEMES.zoo.nm : '', ...me.map(k => MECH[k][1])].filter(Boolean).join('＋'); return `${n}（${L.a}×${L.b}${nm ? '・' + nm : ''}）`; };
const GNAME = { down: '⬇️ 往下掉', up: '⬆️ 往上飄', left: '⬅️ 往左靠', right: '➡️ 往右靠', midH: '➡️⬅️ 往中間擠', outH: '⬅️➡️ 往兩邊分開', midV: '⬇️⬆️ 上下往中間擠', outV: '⬆️⬇️ 上下分開' };

const relax = () => mode === 'relax';

const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
let hole = [], matchN = 0, theme = null;

const isTile = v => v && !v.rock;
const isFree = v => v && !v.rock && !v.lock && !v.ice && !v.cage;
let level, score, grid, R_, C_, tile, ring, bx, by, U = 1, hudBox, bHint, bShuf, bZin, bZout, bZfit, VP, infoBox = null, sel = null, links = [], left, maxT, hints, shuffles, state = 'ready', t = 0, combo = 0, lastMatch = -9, hintPair = null, shakeCell = null, pops = [], gone = [];
let thKey = 'zoo', types = [], want = null, chainN = 0, rainbowT = 0, party = null, hero = { mood: 'happy', t: 0, jump: 0, say: '', sayT: 0 }, lastAct = 0;

function setupLevel(n) {
  level = n; const L = LV(n);
  // the long side of the board follows the screen; the map is written lying down (a rows), so portrait turns it on its side
  [R_, C_] = land ? [Math.min(L.a, L.b), Math.max(L.a, L.b)] : [Math.max(L.a, L.b), Math.min(L.a, L.b)];
  const flip = R_ !== L.a;

  let pi = 0;
  spots.forEach(([r, c]) => { const k = mch(r, c), kk = keySpots.get(r + ',' + c); grid[r + 1][c + 1] = { ch: kk || pool[pi++], lock: k === 'L' ? 1 : 0, ice: k === 'I' ? 2 : 0, cage: k === 'K' ? 1 : k === 'k' ? 2 : 0 }; });

  want = null; chainN = 0; rainbowT = 0; party = null; hero.mood = 'happy'; hero.say = ''; lastAct = t; totalTiles = spots.length;

}
// the first time a new way to play shows up, explain it once
function introNew() {
  const fresh = mechOf(LV(level)).filter(k => !MG.store.get('link.seen.' + k, false));

  fresh.forEach(k => MG.store.set('link.seen.' + k, true));

  return true;
}
// HUD (time bar + 💡 / 🔀 + 🔍 zoom buttons): rows above the board in portrait, a column on the right in landscape.
// VP = the part of the canvas the board may use (and is clipped to when zoomed in)
function layout() {
  U = Math.max(1, Math.min(1.6, Math.min(W, H) / 420)) * MG.textScale;
  const bh = Math.round(Math.max(48, 46 * U)), g = 8, gs = 2, RING = 0.3;
  const fitTile = (aw, ah) => Math.floor(Math.min(aw / (C_ + RING * 2), ah / (R_ + RING * 2)));
  infoBox = null;
  if (land) {
    const pw = Math.round(Math.min(W * 0.3, Math.max(176, 136 * U)));
    const px = W - pw - g, zb = Math.floor((pw - g * 2) / 3);
    hudBox = { x: px, y: g, w: pw, h: Math.round(Math.max(40, 36 * U)) };
    let y = hudBox.y + hudBox.h + g;
    if (pw >= 250) { const hw = Math.floor((pw - g) / 2); bHint = { x: px, y, w: hw, h: bh }; bShuf = { x: px + hw + g, y, w: pw - hw - g, h: bh }; y += bh + g; }
    else { bHint = { x: px, y, w: pw, h: bh }; bShuf = { x: px, y: y + bh + g, w: pw, h: bh }; y += (bh + g) * 2; }
    bZout = { x: px, y, w: zb, h: bh }; bZin = { x: px + zb + g, y, w: zb, h: bh }; bZfit = { x: px + (zb + g) * 2, y, w: pw - (zb + g) * 2, h: bh };
    y += bh + g;
    if (H - g - y >= 90) infoBox = { x: px, y, w: pw, h: H - g - y };       // the side panel: hero, pictures left, this level's tricks

    tile = fitTile(VP.w - gs * 2, H - g * 2);
    bx = Math.round((VP.w - tile * C_) / 2); by = Math.round((H - tile * R_) / 2);
  } else {
    const tall = H > W * 1.3, zb = bh, th = tall ? Math.round(Math.max(32, 30 * U)) : 0;

    const avail = H - hudH - g * 3, infoMin = Math.round(Math.max(84, Math.min(170, H * 0.12)));
    let t1 = fitTile(W - gs * 2, avail - infoMin - g), useInfo = t1 >= 38;

  MG.panel({ title: '時間到了！', html: `<p>到了第 ${level} 關</p><div class="big">${score} 分</div>` + (rec.isNew && score > 0 ? '<p class="new">新紀錄！^_^</p>' : `<p>最高紀錄：${rec.best} 分</p>`) + '<p>覺得太趕的話，可以玩不限時的「慢慢玩」</p>',
    buttons: [{ label: '再試這關', on: () => { setupLevel(level); state = 'play'; MG.hide(); levelToast(); } }, { label: '🐢 改成慢慢玩', alt: true, on: () => { mode = 'relax'; MG.store.set('link.pickMode', 'relax'); setupLevel(level); state = 'play'; MG.hide(); } }, { label: '選關卡', alt: true, on: menu }] });
}
function start(m, lv, pk) { mode = m; if (pk && pk.style) style = pk.style; score = 0; setupLevel(lv || 1); state = 'play'; MG.hide(); levelToast(); }
function levelToast() { if (introNew()) return; if (falling()) MG.toast(`🌀 ${GNAME[LV(level).g].split(' ')[0]}`, 2200); }
function menu() {
  state = 'ready';
  MG.choose({
    id: 'link', title: '動物連連看',
    html: '<p>點兩隻一樣的動物，如果可以用一條<b>最多轉兩個彎</b>的線連起來，牠們就會跳走！線不能穿過別的動物。</p><p>39 關：動物園、海洋、水果、花園、玩具、農場、太空，還有 🌀 滑動、🔑 鑰匙籠子、🔗 連鎖配對和 👑 大結局！</p>',
    picks: [{ key: 'style', title: '選玩法', options: [{ id: 'classic', label: '🐾 經典', sub: '線可以從外面繞過去' }, { id: 'fall', label: '🌀 會掉落', sub: '線不能出框・消掉後動物會滑動，每關方向不同' }] }],
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・提示和洗牌用不完' }, { id: 'timed', label: '⏱ 限時挑戰', sub: '剩下的時間換獎勵分' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: lvLabel, short: lvShort },
    keys: '點選動物　<kbd>H</kbd> 提示　<kbd>R</kbd> 洗牌',
    playing: () => state === 'play',
    start: (m, lv, pk) => start(m, lv, pk),
  });
}
score = 0; setupLevel(1); menu();
// small hook for automated tests
window.LKT = {
  get state() { return state; }, get level() { return level; }, get count() { return LEVELS.length; }, get style() { return style; }, get zoom() { return zoom; },
  start(n, st = 'classic', m = 'relax') { start(m, n, { style: st }); MG.hide(); },
  board: () => grid.map(row => row.map(v => !v ? '' : v.rock ? 'R' : (v.lock ? 'L' : v.ice ? 'I' : v.cage ? 'K' + v.cage : '') + v.ch)),
  get want() { return want; }, get chain() { return chainN; }, get theme() { return thKey; }, get info() { return infoBox; }, cages: () => cageLeft(),
  // test only: clear the board and play the win celebration
  win() { for (let r = 1; r <= R_; r++) for (let c = 1; c <= C_; c++) if (isTile(grid[r][c])) grid[r][c] = null; levelClear(); },
  // test only: link the wanted pair (chain levels)
  stepWant() { const mv = movesByType(false), m = want && mv.get(want); if (!m) return false; sel = null; tapBoard(scr(m[0])); tapBoard(scr(m[1])); return true; },
  holes: () => hole.map(row => row.map(Number)), tiles: () => grid.flat().filter(isTile).length,
  move: () => anyMove(), ice: () => iceCell(), mech: n => mechOf(LV(n)), map: n => LV(n).m || null,
  // client (CSS px) coords of a cell centre, so a test can tap like a finger
  at(r, c) { const [bx2, by2] = toScr(...cellXY(r, c)), rc = cv.getBoundingClientRect(); return { x: rc.left + bx2 * rc.width / W, y: rc.top + by2 * rc.height / H }; },
  // test only: play one step through the real tap handler (a pair, or one ice tap); returns false when stuck
  step() {
    const m = anyMove();
    if (m) { sel = null; tapBoard(scr(m[0])); tapBoard(scr(m[1])); return true; }
    const ic = iceCell(); if (ic) { sel = null; tapBoard(scr(ic)); return true; }
    return false;
  },
};
function scr([r, c]) { const [a, b] = toScr(...cellXY(r, c)); return { x: a, y: b }; }
MG.loop(dt => { if (state === 'play') update(dt); else if (state === 'party') updateParty(dt); else { t += dt; tick(dt); } draw(); });
</script>
