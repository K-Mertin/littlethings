<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>動物連連看</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'link', title: '動物連連看', stats: ['level', 'score'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
let W = 360, H = 580, land = false;
MG.fit(cv, (sw, sh) => { land = sw > sh * 1.1; [W, H] = land ? [660, 400] : [360, 580]; return [W, H]; });
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const ANIMALS = ['🐶', '🐱', '🐰', '🦊', '🐼', '🐸', '🐵', '🐧', '🐙', '🦁', '🐷', '🐨', '🦄', '🐢', '🐝', '🐳', '🦉', '🐞', '🐤', '🦋', '🐯', '🐮'];
// g = which way the animals slide after a pair disappears (only in the 會掉落 style)
const LEVELS = [
  { a: 6, b: 6, types: 9, time: 150, g: 'down' }, { a: 6, b: 8, types: 12, time: 170, g: 'left' }, { a: 8, b: 8, types: 14, time: 190, g: 'up' },
  { a: 8, b: 8, types: 16, time: 190, g: 'right' }, { a: 8, b: 10, types: 18, time: 210, g: 'midH' }, { a: 8, b: 10, types: 20, time: 210, g: 'outH' },
  { a: 8, b: 10, types: 20, time: 200, g: 'midV' }, { a: 8, b: 10, types: 22, time: 200, g: 'outV' },
];
const GNAME = { down: '⬇️ 往下掉', up: '⬆️ 往上飄', left: '⬅️ 往左靠', right: '➡️ 往右靠', midH: '➡️⬅️ 往中間擠', outH: '⬅️➡️ 往兩邊分開', midV: '⬇️⬆️ 上下往中間擠', outV: '⬆️⬇️ 上下分開' };
let mode = 'relax', style = 'classic';      // style: 'classic' (lines may go around the outside) | 'fall' (inside only, animals slide)
const falling = () => style === 'fall';
let slides = new Map();                      // "r,c" -> { fr, fc, t } for the slide animation
const relax = () => mode === 'relax';
const snd = (() => { const last = {}; return (n, a) => { const now = performance.now(); if (now - (last[n] || 0) < 60) return; last[n] = now; MG.sfx(n, a); }; })();
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
let level, score, grid, R_, C_, tile, ox, oy, sel = null, links = [], left, maxT, hints, shuffles, state = 'ready', t = 0, combo = 0, lastMatch = -9, hintPair = null, shakeCell = null, pops = [], gone = [];

function setupLevel(n) {
  level = n; const L = LEVELS[Math.min(n, LEVELS.length) - 1];
  // the long side of the board follows the screen
  [R_, C_] = land ? [Math.min(L.a, L.b), Math.max(L.a, L.b)] : [Math.max(L.a, L.b), Math.min(L.a, L.b)];
  const total = R_ * C_, types = ANIMALS.slice().sort(() => Math.random() - 0.5).slice(0, L.types), pool = [];
  for (let i = 0; pool.length < total; i++) pool.push(types[Math.floor(i / 2) % types.length], types[Math.floor(i / 2) % types.length]);
  pool.length = total; MG.shuffle(pool);
  // grid with an empty one-cell border so links can go around the outside
  grid = Array.from({ length: R_ + 2 }, () => Array(C_ + 2).fill(null));
  for (let r = 0; r < R_; r++) for (let c = 0; c < C_; c++) grid[r + 1][c + 1] = pool[r * C_ + c];
  maxT = L.time; left = relax() ? 0 : maxT; slides = new Map(); hints = 3; shuffles = 2; sel = null; links = []; combo = 0; hintPair = null; gone = [];
  layout(); ensureMoves(); hud();
}
function layout() {
  const topH = 40;
  tile = Math.floor(Math.min((W - 12) / (C_ + 2), (H - topH - 8) / (R_ + 2)));
  ox = Math.round((W - tile * (C_ + 2)) / 2); oy = Math.round(topH + (H - topH - tile * (R_ + 2)) / 2);
}
cv.onfit = () => { if (grid) layout(); };
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('score', `${score} 分`); }
const cellXY = (r, c) => [ox + c * tile + tile / 2, oy + r * tile + tile / 2];

// ---------- path finding: at most two turns ----------
function findPath(a, b) {
  const RR = R_ + 2, CC = C_ + 2, DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
  const best = new Map(), q = [];
  const key = (r, c, d) => (r * CC + c) * 4 + d;
  for (let d = 0; d < 4; d++) q.push({ r: a[0], c: a[1], d, turns: 0, prev: null, start: true });
  while (q.length) {
    const s = q.shift();
    const [dr, dc] = DIRS[s.d]; const nr = s.r + dr, nc = s.c + dc;
    if (nr < 0 || nc < 0 || nr >= RR || nc >= CC) continue;
    if (falling() && (nr < 1 || nc < 1 || nr > R_ || nc > C_)) continue;     // 會掉落: the line has to stay on the board
    const node = { r: nr, c: nc, d: s.d, turns: s.turns, prev: s };
    if (nr === b[0] && nc === b[1]) { const pts = []; let n = node; while (n) { pts.push([n.r, n.c]); n = n.prev; } return pts.reverse(); }
    if (grid[nr][nc] !== null) continue;
    const k = key(nr, nc, s.d); if (best.has(k) && best.get(k) <= s.turns) continue; best.set(k, s.turns);
    for (let d = 0; d < 4; d++) {
      if ((d + 2) % 4 === s.d) continue;
      const turns = s.turns + (d !== s.d ? 1 : 0); if (turns > 2) continue;
      const nn = { r: nr, c: nc, d, turns, prev: node };
      if (d === s.d) q.unshift(nn); else q.push(nn);
    }
  }
  return null;
}
function anyMove() {
  const cells = []; for (let r = 1; r <= R_; r++) for (let c = 1; c <= C_; c++) if (grid[r][c]) cells.push([r, c]);
  for (let i = 0; i < cells.length; i++) for (let j = i + 1; j < cells.length; j++) {
    const [a, b] = [cells[i], cells[j]];
    if (grid[a[0]][a[1]] === grid[b[0]][b[1]] && findPath(a, b)) return [a, b];
  }
  return null;
}
function reshuffle() {
  const cells = [], vals = []; for (let r = 1; r <= R_; r++) for (let c = 1; c <= C_; c++) if (grid[r][c]) { cells.push([r, c]); vals.push(grid[r][c]); }
  MG.shuffle(vals); cells.forEach(([r, c], i) => grid[r][c] = vals[i]); sel = null; hintPair = null;
}
function ensureMoves() { let tries = 0; while (remaining() && !anyMove() && tries++ < 30) reshuffle(); }
const remaining = () => grid.some(row => row.some(v => v));

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = cv.logical(e);
  // hint / shuffle buttons in the top strip
  if (p.y < 40) { if (p.x > W - 96) doShuffle(); else if (p.x > W - 186) doHint(); return; }
  const c = Math.floor((p.x - ox) / tile), r = Math.floor((p.y - oy) / tile);
  if (r < 1 || c < 1 || r > R_ || c > C_ || !grid[r][c]) return;
  if (!sel) { sel = [r, c]; MG.sfx('flip'); return; }
  if (sel[0] === r && sel[1] === c) { sel = null; return; }
  if (grid[sel[0]][sel[1]] !== grid[r][c]) { sel = [r, c]; MG.sfx('flip'); return; }
  const path = findPath(sel, [r, c]);
  if (!path) { shakeCell = { r, c, t: 0.3 }; MG.sfx('miss'); MG.toast('Blocked 🚧'); sel = [r, c]; return; }
  match(sel, [r, c], path); sel = null;
});
addEventListener('keydown', e => { if (state !== 'play') return; if (e.key === 'h' || e.key === 'H') doHint(); if (e.key === 'r' || e.key === 'R') doShuffle(); });
function match(a, b, path) {
  const ch = grid[a[0]][a[1]];
  links.push({ pts: path.map(([r, c]) => cellXY(r, c)), life: 0.35 });
  for (const [r, c] of [a, b]) { const [px, py] = cellXY(r, c); gone.push({ x: px, y: py, ch, life: 0.35 }); MG.fx.burst(px, py, { n: 8, colors: ['#ffd23f', '#ff8ac2', '#fff'], speed: 120, size: 4, shape: 'star', life: 0.5 }); grid[r][c] = null; }
  combo = t - lastMatch < 3 ? combo + 1 : 1; lastMatch = t;
  const pts = 10 + (combo > 1 ? Math.min(combo, 8) * 5 : 0); score += pts;
  snd('match', combo); snd('whoosh'); if (combo >= 2) snd('combo', combo);
  const [mx, my] = cellXY(b[0], b[1]); pops.push({ x: mx, y: my - 10, t: `+${pts}`, life: 0.8 });
  if (combo > 1) pops.push({ x: mx, y: my - 30, t: combo >= 5 ? `${MG.praise(Math.min(5, combo - 2))}` : MG.WORDS.combo(combo), life: 1.1, big: true });
  if (hintPair && hintPair.some(([r, c]) => (r === a[0] && c === a[1]) || (r === b[0] && c === b[1]))) hintPair = null;
  hud();
  if (falling()) slideAll(LEVELS[Math.min(level, LEVELS.length) - 1].g);
  if (!remaining()) return setTimeout(levelClear, 450);
  if (!anyMove()) { reshuffle(); ensureMoves(); snd('whoosh'); MG.toast(`${MG.WORDS.stuck} Shuffle!`); }
}
// ---------- 會掉落: animals slide toward the level's direction ----------
function slideLine(cells, toStart) {        // cells: list of [r,c] in order; pack the animals toward the start (or the end)
  const vals = cells.map(([r, c]) => grid[r][c]).filter(Boolean);
  const from = cells.filter(([r, c]) => grid[r][c]);
  const order = toStart ? cells : cells.slice().reverse(), src = toStart ? from : from.slice().reverse(), vs = toStart ? vals : vals.slice().reverse();
  cells.forEach(([r, c]) => grid[r][c] = null);
  vs.forEach((v, i) => {
    const [r, c] = order[i], [fr, fc] = src[i]; grid[r][c] = v;
    if (fr !== r || fc !== c) { const old = slides.get(fr + ',' + fc); slides.set(r + ',' + c, { fr: old ? old.fr + (fr - old.fr) * 0 : fr, fc: old ? old.fc : fc, t: 0 }); }
  });
}
function slideAll(g) {
  const rows = [], cols = [];
  for (let r = 1; r <= R_; r++) rows.push(Array.from({ length: C_ }, (_, i) => [r, i + 1]));
  for (let c = 1; c <= C_; c++) cols.push(Array.from({ length: R_ }, (_, i) => [i + 1, c]));
  const half = (line) => [line.slice(0, Math.floor(line.length / 2)), line.slice(Math.floor(line.length / 2))];
  if (g === 'down') cols.forEach(l => slideLine(l, false));
  else if (g === 'up') cols.forEach(l => slideLine(l, true));
  else if (g === 'left') rows.forEach(l => slideLine(l, true));
  else if (g === 'right') rows.forEach(l => slideLine(l, false));
  else if (g === 'midH') rows.forEach(l => { const [a, b] = half(l); slideLine(a, false); slideLine(b, true); });
  else if (g === 'outH') rows.forEach(l => { const [a, b] = half(l); slideLine(a, true); slideLine(b, false); });
  else if (g === 'midV') cols.forEach(l => { const [a, b] = half(l); slideLine(a, false); slideLine(b, true); });
  else if (g === 'outV') cols.forEach(l => { const [a, b] = half(l); slideLine(a, true); slideLine(b, false); });
  if (sel && !grid[sel[0]][sel[1]]) sel = null;
  if (sel) { for (const [k, v] of slides) if (v.t === 0 && v.fr === sel[0] && v.fc === sel[1]) { const [r, c] = k.split(',').map(Number); sel = [r, c]; break; } }
  hintPair = null;
}
function doHint() { if (!relax() && hints <= 0) { MG.toast('No more 💡'); MG.sfx('miss'); return; } const m = anyMove(); if (!m) return; if (!relax()) hints--; hintPair = m; MG.sfx('sparkle'); }
function doShuffle() { if (!relax() && shuffles <= 0) { MG.toast('No more 🔀'); MG.sfx('miss'); return; } if (!relax()) shuffles--; reshuffle(); ensureMoves(); MG.sfx('whoosh'); MG.sfx('flip'); }

// ---------- draw ----------
function drawTile(px, py, ch, s, hl) {
  const sz = tile - 4, X = px - sz / 2, Y = py - sz / 2;
  x.fillStyle = hl === 'sel' ? '#ffb72b' : '#d8c08c'; x.beginPath(); x.roundRect(X, Y + 3, sz, sz, sz * 0.18); x.fill();
  const g = x.createLinearGradient(0, Y, 0, Y + sz); g.addColorStop(0, hl === 'sel' ? '#fff6c9' : hl === 'hint' ? '#e6ffe0' : '#fffdf6'); g.addColorStop(1, hl === 'sel' ? '#ffe08a' : hl === 'hint' ? '#bff0b0' : '#f3e6c6');
  x.fillStyle = g; x.beginPath(); x.roundRect(X, Y, sz, sz, sz * 0.18); x.fill();
  x.strokeStyle = hl === 'sel' ? '#ff9f1c' : hl === 'hint' ? '#4cc96a' : 'rgba(180,150,90,.5)'; x.lineWidth = hl ? 3 : 1.2; x.stroke();
  x.fillStyle = 'rgba(255,255,255,.6)'; x.fillRect(X + sz * 0.15, Y + 2, sz * 0.7, 2);
  x.save(); x.translate(px, py + 1); x.scale(s, s); x.fillStyle = '#000'; x.font = `${Math.floor(sz * 0.68)}px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, 0, 1); x.restore();
}
const easeOut = v => 1 - (1 - v) * (1 - v) * (1 - v);
function draw() {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#c9f0d8'); g.addColorStop(1, '#fff5d6'); x.fillStyle = g; x.fillRect(0, 0, W, H);
  // leafy corners
  for (const [lx, ly, a] of [[0, H, -0.6], [W, H, -2.5], [0, 40, 0.5], [W, 40, 2.6]]) { x.save(); x.translate(lx, ly); x.rotate(a); for (let i = 0; i < 3; i++) { x.fillStyle = ['#7fcf6a', '#5fb84f', '#94dc7a'][i]; x.beginPath(); x.ellipse(30 + i * 14, -i * 8, 34, 12, -0.3 + i * 0.3, 0, 7); x.fill(); } x.restore(); }
  // board backing
  x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.roundRect(ox + tile * 0.6, oy + tile * 0.6, tile * (C_ + 0.8), tile * (R_ + 0.8), 14); x.fill();
  if (falling()) gravityArrows(LEVELS[Math.min(level, LEVELS.length) - 1].g);
  for (let r = 1; r <= R_; r++) for (let c = 1; c <= C_; c++) {
    const v = grid[r][c]; if (!v) continue;
    let [px, py] = cellXY(r, c);
    const sl = slides.get(r + ',' + c);
    if (sl) { const k = 1 - easeOut(Math.min(1, sl.t / 0.22)); px += (sl.fc - c) * tile * k; py += (sl.fr - r) * tile * k; }
    const isSel = sel && sel[0] === r && sel[1] === c, isHint = hintPair && hintPair.some(([a, b]) => a === r && b === c);
    let sx = 0; if (shakeCell && shakeCell.r === r && shakeCell.c === c) sx = Math.sin(shakeCell.t * 60) * 3;
    drawTile(px + sx, py - (isSel ? 3 : 0), v, isSel ? 1.08 + Math.sin(t * 10) * 0.03 : isHint ? 1 + Math.sin(t * 8) * 0.06 : 1, isSel ? 'sel' : isHint ? 'hint' : '');
  }
  for (const gq of gone) { const k = gq.life / 0.35; x.globalAlpha = k; x.fillStyle = '#000'; x.font = `${Math.floor(tile * 0.68 * (1 + (1 - k) * 0.6))}px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(gq.ch, gq.x, gq.y - (1 - k) * 14); }
  x.globalAlpha = 1;
  for (const l of links) {
    x.globalAlpha = Math.min(1, l.life * 4); x.strokeStyle = '#ff5a8a'; x.lineWidth = 5; x.lineCap = 'round'; x.lineJoin = 'round';
    x.shadowColor = '#fff'; x.shadowBlur = 8; x.beginPath(); l.pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.stroke(); x.shadowBlur = 0;
  }
  x.globalAlpha = 1;
  MG.fx.draw(x);
  for (const p of pops) {
    x.globalAlpha = Math.min(1, p.life * 2); x.font = `900 ${p.big ? 18 : 16}px system-ui,"Noto Sans TC",sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const hw = x.measureText(p.t).width / 2 + 4, px = Math.max(hw, Math.min(W - hw, p.x)), py = Math.max(52, p.y);   // keep it on screen, below the top strip
    x.lineWidth = 4; x.strokeStyle = '#fff'; x.strokeText(p.t, px, py); x.fillStyle = p.big ? '#ff4f8a' : '#ff7a00'; x.fillText(p.t, px, py);
  }
  x.globalAlpha = 1;
  // top strip: time bar, hint, shuffle
  const tw = W - 200, f = relax() ? 1 : Math.max(0, left / maxT);
  x.fillStyle = 'rgba(255,255,255,.8)'; x.beginPath(); x.roundRect(8, 10, tw, 20, 10); x.fill();
  x.fillStyle = relax() ? '#8fd0ff' : f < 0.2 ? '#ff5a4e' : f < 0.5 ? '#ffb21f' : '#4cc96a'; x.beginPath(); x.roundRect(11, 13, Math.max(8, (tw - 6) * f), 14, 7); x.fill();
  x.fillStyle = '#3a2f22'; x.font = '700 12px "Noto Sans TC",system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(relax() ? `🐢 慢慢玩　${mmss(left)}` : `⏱ ${Math.ceil(left)}`, 8 + tw / 2, 20.5);
  const btn = (bx, label, n) => { const ok = relax() || n > 0; x.fillStyle = ok ? '#fff' : '#eee'; x.strokeStyle = ok ? '#ffb72b' : '#ccc'; x.lineWidth = 2; x.beginPath(); x.roundRect(bx, 6, 84, 28, 10); x.fill(); x.stroke(); x.fillStyle = ok ? '#6b4a22' : '#aaa'; x.font = '700 13px "Noto Sans TC",system-ui'; x.fillText(relax() ? label : `${label} ${n}`, bx + 42, 20.5); };
  btn(W - 180, '💡 提示', hints); btn(W - 90, '🔀 洗牌', shuffles);
}

// faint arrows around the board that show where the animals slide
function gravityArrows(g) {
  const L = ox + tile * 0.6, T = oy + tile * 0.6, Wb = tile * (C_ + 0.8), Hb = tile * (R_ + 0.8), cx = L + Wb / 2, cy = T + Hb / 2;
  const arrow = (ax, ay, ang) => { x.save(); x.translate(ax, ay); x.rotate(ang); x.fillStyle = 'rgba(255,122,0,.75)'; x.beginPath(); x.moveTo(9, 0); x.lineTo(-5, -8); x.lineTo(-2, 0); x.lineTo(-5, 8); x.closePath(); x.fill(); x.restore(); };
  const bob = Math.sin(t * 4) * 2, D = Math.PI / 2;
  const out = tile * 0.32;
  const at = { down: [[cx - Wb / 4, T + Hb + out, D], [cx + Wb / 4, T + Hb + out, D]], up: [[cx - Wb / 4, T - out, -D], [cx + Wb / 4, T - out, -D]],
    left: [[L - out, cy - Hb / 4, Math.PI], [L - out, cy + Hb / 4, Math.PI]], right: [[L + Wb + out, cy - Hb / 4, 0], [L + Wb + out, cy + Hb / 4, 0]],
    midH: [[L - out, cy, 0], [L + Wb + out, cy, Math.PI]], outH: [[L - out, cy, Math.PI], [L + Wb + out, cy, 0]],
    midV: [[cx, T - out, D], [cx, T + Hb + out, -D]], outV: [[cx, T - out, -D], [cx, T + Hb + out, D]] }[g] || [];
  for (const [ax, ay, ang] of at) arrow(ax + Math.cos(ang) * bob, ay + Math.sin(ang) * bob, ang);
}

// ---------- flow ----------
function update(dt) {
  t += dt; if (relax()) left += dt; else left -= dt;
  for (const l of links) l.life -= dt; links = links.filter(l => l.life > 0);
  for (const [k, v] of slides) { v.t += dt; if (v.t >= 0.22) slides.delete(k); }
  for (const g2 of gone) g2.life -= dt; gone = gone.filter(g2 => g2.life > 0);
  for (const p of pops) { p.y -= 30 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  if (shakeCell) { shakeCell.t -= dt; if (shakeCell.t <= 0) shakeCell = null; }
  MG.fx.step(dt);
  if (!relax() && left <= 0) { left = 0; timeUp(); }
}
function levelClear() {
  if (state !== 'play') return;
  state = 'between';
  const bonus = relax() ? 0 : Math.ceil(left) * 2; score += bonus; hud(); MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  if (!relax()) MG.record('link', score);
  MG.store.set('link.level', Math.max(MG.store.get('link.level', 1), level + 1));
  MG.panel({ title: `第 ${level} 關完成！`, html: (relax() ? `<p>花了 ${mmss(left)}，慢慢來最棒 ^_^</p>` : `<p>剩下 ${Math.ceil(left)} 秒，時間獎勵 +${bonus}</p>`) + `<div class="big">${score} 分</div>`,
    buttons: [...(level < LEVELS.length ? [{ label: '下一關', on: () => { setupLevel(level + 1); state = 'play'; MG.hide(); levelToast(); } }] : [{ label: '再玩一次', on: () => { setupLevel(level); state = 'play'; MG.hide(); levelToast(); } }]), { label: '選關卡', alt: true, on: menu }] });
}
function timeUp() {
  state = 'over'; MG.sfx('over'); const rec = MG.record('link', score);
  MG.panel({ title: '時間到了！', html: `<p>到了第 ${level} 關</p><div class="big">${score} 分</div>` + (rec.isNew && score > 0 ? '<p class="new">新紀錄！^_^</p>' : `<p>最高紀錄：${rec.best} 分</p>`) + '<p>覺得太趕的話，可以玩不限時的「慢慢玩」</p>',
    buttons: [{ label: '再試這關', on: () => { setupLevel(level); state = 'play'; MG.hide(); } }, { label: '🐢 改成慢慢玩', alt: true, on: () => { mode = 'relax'; MG.store.set('link.pickMode', 'relax'); setupLevel(level); state = 'play'; MG.hide(); } }, { label: '選關卡', alt: true, on: menu }] });
}
function start(m, lv, pk) { mode = m; if (pk && pk.style) style = pk.style; score = 0; setupLevel(lv || 1); state = 'play'; MG.hide(); levelToast(); }
function levelToast() { if (falling()) MG.toast(`🌀 ${GNAME[LEVELS[Math.min(level, LEVELS.length) - 1].g].split(' ')[0]}`, 2200); }
function menu() {
  state = 'ready';
  MG.choose({
    id: 'link', title: '動物連連看',
    html: '<p>點兩隻一樣的動物，如果可以用一條<b>最多轉兩個彎</b>的線連起來，牠們就會消失！線不能穿過別的動物。</p>',
    picks: [{ key: 'style', title: '選玩法', options: [{ id: 'classic', label: '🐾 經典', sub: '線可以從外面繞過去' }, { id: 'fall', label: '🌀 會掉落', sub: '線不能出框・消掉後動物會滑動，每關方向不同' }] }],
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・提示和洗牌用不完' }, { id: 'timed', label: '⏱ 限時挑戰', sub: '剩下的時間換獎勵分' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${LEVELS[n - 1].a}×${LEVELS[n - 1].b}）` },
    keys: '點選動物　<kbd>H</kbd> 提示　<kbd>R</kbd> 洗牌',
    playing: () => state === 'play',
    start: (m, lv, pk) => start(m, lv, pk),
  });
}
score = 0; setupLevel(1); menu();
MG.loop(dt => { if (state === 'play') update(dt); else { t += dt; MG.fx.step(dt); } draw(); });
</script>
</body>
</html>
