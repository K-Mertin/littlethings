<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'domino', title: '骨牌連鎖', stats: ['level', 'goal'] });
const cv = document.getElementById('cv');
let x = cv.getContext('2d');

// ==LOGIC== (pure rules: a tiny deterministic grid "physics"; the tests run this part on its own)
// grid cells x 0..W-1, y 0..H-1 (y goes down). terrain: 0 air, 1 solid (ground / shelf), 10+c = gate of colour c (solid until opened)
// every piece sits in one cell (the seesaw takes three). Things that move: balls ⚽, cakes 🍰, toy trains 🚂 and bubbles 🫧.
const SPRING_UP = 2, SAW_UP = 3, FAN_RANGE = 6;
const BODY = { ball: 1, cake: 1, train: 1 };
const GOAL = { bell: 1, bln: 1, lamp: 1, train: 1, friend: 1 };
// pieces a ball can't roll into (it gives them a push instead)
const BLOCK = { dom: 1, bell: 1, lamp: 1, fan: 1, hero: 1, saw: 1, ball: 1, cake: 1, train: 1, friend: 1 };
const DIRS = { ramp: 1, spring: 1, fan: 1, hero: 1, train: 1 };
// pieces that need a floor under them
const NEEDS_FLOOR = { dom: 1, ramp: 1, spring: 1, fan: 1, btn: 1, bell: 1, lamp: 1, bucket: 0, ball: 0, bub: 0 };

function parseLevel(def) {
  const H = def.map.length, W = def.map[0].length;
  const ter = def.map.map(r => [...r].map(ch => ch === '#' ? 1 : /[0-3]/.test(ch) ? 10 + +ch : 0));
  const objs = (def.o || []).map(a => mkObj(a, true));
  return { W, H, ter, objs, slots: def.s || null, tray: def.t || {}, sol: (def.sol || []).map(a => mkObj(a, false)), def };
}
function mkObj(a, fixed) {
  const [k, x, y, p, q] = a, o = { k, x, y, fixed };
  if (k === 'ramp' || k === 'spring' || k === 'hero') o.d = p ?? 1;
  else if (k === 'fan') { o.d = p ?? 1; o.col = q ?? -1; }
  else if (k === 'train') { o.d = p ?? 1; o.col = q ?? -1; }
  else if (k === 'saw') o.tilt = p ?? -1;
  else if (k === 'bucket' || k === 'btn' || k === 'lamp' || k === 'claw') o.col = p ?? -1;
  return o;
}
const cellsOf = o => o.k === 'saw' ? [[o.x - 1, o.y], [o.x, o.y], [o.x + 1, o.y]] : [[o.x, o.y]];

// a fresh run of the level with the kid's pieces in it
function makeSim(L, placed) {
  const S = { W: L.W, H: L.H, ter: L.ter.map(r => r.slice()), objs: [], t: 0, q: [], ev: [], done: new Set(), goals: 0, idle: 0, over: false, win: false };
  let id = 0;
  for (const o0 of [...L.objs, ...placed]) {
    const o = { ...o0, id: id++, px: o0.x, py: o0.y };
    if (BODY[o.k]) { o.vx = 0; o.up = 0; o.fall = false; o.held = false; o.rot = 0; }
    if (o.k === 'train') o.on = false;
    if (o.k === 'dom') { o.st = 'up'; o.fd = 1; }
    if (o.k === 'fan') o.on = false;
    S.objs.push(o);
  }
  for (const c of S.objs.filter(o => o.k === 'claw')) { const b = S.objs.find(o => (o.k === 'ball' || o.k === 'cake') && o.x === c.x && o.y === c.y); if (b) { b.held = true; c.ball = b.id; } }
  S.goals = S.objs.filter(o => GOAL[o.k]).length;
  // ▶: the hero gives a push, claws without a colour let go, plain fans start blowing
  S.q.push({ at: 1, f: 'start' });
  return S;
}
const inG = (S, x, y) => x >= 0 && x < S.W && y >= 0 && y < S.H;
const solidT = (S, x, y) => { if (!inG(S, x, y)) return y >= S.H || x < 0 || x >= S.W; return S.ter[y][x] !== 0; };
function at(S, x, y) { const out = []; for (const o of S.objs) { if (o.gone || o.popped) continue; if (o.k === 'saw' ? (o.y === y && Math.abs(o.x - x) <= 1) : (o.x === x && o.y === y)) out.push(o); } return out; }
const isBlock = (o, mover) => BLOCK[o.k] && !(o.k === 'friend' && mover && mover.k === 'cake') && !(BODY[o.k] && (o.caught || o.inB != null));
const blockerAt = (S, x, y, mover) => at(S, x, y).find(o => o !== mover && isBlock(o, mover));
function emit(S, e) { e.t = S.t; S.ev.push(e); }
function goal(S, o, what) { if (S.done.has(o.id)) return; S.done.add(o.id); o.hit = true; emit(S, { e: 'goal', what, x: o.x, y: o.y, id: o.id }); }

function trigger(S, col, x, y) {
  emit(S, { e: 'trigger', col, x, y });
  for (let yy = 0; yy < S.H; yy++) for (let xx = 0; xx < S.W; xx++) if (S.ter[yy][xx] === 10 + col) { S.ter[yy][xx] = 0; emit(S, { e: 'gate', x: xx, y: yy, col }); }
  for (const o of S.objs) {
    if (o.col !== col || o.gone) continue;
    if (o.k === 'fan' && !o.on) fanOn(S, o);
    else if (o.k === 'lamp') goal(S, o, 'lamp');
    else if (o.k === 'train' && !o.on) startTrain(S, o);
    else if (o.k === 'claw' && !o.open) openClaw(S, o);
  }
}
function openClaw(S, c) { c.open = true; const b = S.objs.find(o => o.id === c.ball); if (b) b.held = false; emit(S, { e: 'claw', x: c.x, y: c.y }); S.busy = true; }
function startTrain(S, o) { o.on = true; o.vx = o.d; goal(S, o, 'train'); emit(S, { e: 'train', x: o.x, y: o.y }); }
function fanOn(S, f) {
  f.on = true; emit(S, { e: 'fan', x: f.x, y: f.y });
  // the first thing in the wind gets a push
  for (let k = 1; k <= FAN_RANGE; k++) {
    const x = f.x + f.d * k; if (solidT(S, x, f.y)) break;
    const b = at(S, x, f.y).find(o => isBlock(o));
    if (b) { if (o2wind(b)) push(S, b, f.d, 'wind'); break; }
  }
}
const o2wind = o => o.k === 'dom' || o.k === 'ball' || o.k === 'cake';
function windAt(S, x, y) {
  for (const f of S.objs) {
    if (f.k !== 'fan' || !f.on || f.y !== y) continue;
    const k = (x - f.x) * f.d; if (k < 1 || k > FAN_RANGE) continue;
    let ok = true; for (let j = 1; j < k; j++) { const xx = f.x + f.d * j; if (solidT(S, xx, y) || at(S, xx, y).some(o => (isBlock(o) && !BODY[o.k]))) { ok = false; break; } }
    if (ok) return f.d;
  }
  return 0;
}
// something gives this piece a push (d = -1 / 1 sideways, 0 = from above)
function push(S, o, d, src) {
  switch (o.k) {
    case 'dom': if (o.st === 'up') { S.busy = true; o.st = 'fall'; o.fd = d || 1; emit(S, { e: 'dom', x: o.x, y: o.y, d: o.fd }); S.q.push({ at: S.t + 1, f: 'domhit', id: o.id }); } break;
    case 'ball': case 'cake': if (!o.held && !o.caught && o.inB == null && d && o.vx !== d) { o.vx = d; S.busy = true; emit(S, { e: 'roll', x: o.x, y: o.y, k: o.k }); } break;
    case 'bell': goal(S, o, 'bell'); break;
    case 'bln': goal(S, o, 'bln'); o.popped = true; break;
    case 'train': if (!o.on && o.col < 0) startTrain(S, o); break;
    case 'btn': press(S, o); break;
    case 'friend': emit(S, { e: 'bump', x: o.x, y: o.y }); break;
  }
}
function press(S, b) { if (b.pressed) return; b.pressed = true; emit(S, { e: 'btn', x: b.x, y: b.y, col: b.col }); trigger(S, b.col, b.x, b.y); }
function hitCell(S, x, y, d, src) {
  if (!inG(S, x, y)) return;
  for (const o of at(S, x, y)) if (o !== src) push(S, o, d, src);
}
function supported(S, b) {
  const here = at(S, b.x, b.y);
  if (here.some(o => o.k === 'ramp' || o.k === 'btn' || o.k === 'bucket')) return true;
  if (solidT(S, b.x, b.y + 1)) return true;
  return !!blockerAt(S, b.x, b.y + 1, b);
}
// try to move body b into cell (x, y); dir: -1 / 1 sideways, 'down', 'up'
function enter(S, b, x, y, dir) {
  const side = dir === 1 || dir === -1;
  if (y >= S.H) { b.gone = true; emit(S, { e: 'lost', x: b.x, y: b.y }); return true; }
  if (!inG(S, x, y) || solidT(S, x, y)) { if (side) { b.vx = 0; if (b.mt === S.t - 1) emit(S, { e: 'bump', x: b.x, y: b.y }); } return false; }
  const os = at(S, x, y).filter(o => o !== b);
  const bl = os.find(o => isBlock(o, b));
  if (bl) {
    if (side) { push(S, bl, dir, b); if (b.k !== 'train') b.vx = 0; else { b.vx = 0; } emit(S, { e: 'hit', x, y, k: bl.k }); }
    else if (dir === 'up') { push(S, bl, 0, b); }
    return false;
  }
  const ramp = os.find(o => o.k === 'ramp');
  if (ramp && side && dir === -ramp.d) { b.vx = 0; if (b.mt === S.t - 1) emit(S, { e: 'bump', x: b.x, y: b.y }); return false; }
  b.x = x; b.y = y; b.mt = S.t; S.busy = true;
  for (const o of os) {
    if (o.k === 'btn') press(S, o);
    else if (o.k === 'bln' && !o.popped) { goal(S, o, 'bln'); o.popped = true; }
    else if (o.k === 'spring' && b.k !== 'train') { b.up = SPRING_UP; b.vx = o.d; b.fall = false; emit(S, { e: 'spring', x, y }); o.boing = S.t; }
    else if (o.k === 'bucket' && !o.full && b.k !== 'train') { b.caught = true; o.full = true; b.vx = 0; emit(S, { e: 'bucket', x, y }); trigger(S, o.col, x, y); }
    else if (o.k === 'bub' && !o.carry && !o.popped && b.k !== 'train') { o.carry = b.id; b.inB = o.id; b.vx = b.vx || 0; emit(S, { e: 'bubin', x, y }); }
    else if (o.k === 'friend' && b.k === 'cake') { b.gone = true; goal(S, o, 'friend'); }
  }
  return true;
}
function stepBody(S, b) {
  if (b.gone || b.held || b.caught || b.inB != null) return;
  if (b.k === 'train' && !b.on) return;
  const ox = b.x, oy = b.y;
  if (b.up > 0) {
    const tries = b.vx ? [[b.x + b.vx, b.y - 1], [b.x, b.y - 1]] : [[b.x, b.y - 1]];
    for (const [x, y] of tries) { if (enter(S, b, x, y, 'up')) { b.up--; b.rot += b.vx || 0; return; } }
    b.up = 0; emit(S, { e: 'bump', x: b.x, y: b.y });
  }
  if (!supported(S, b)) {
    let wx = windAt(S, b.x, b.y), tx = b.x + wx;
    if (wx && (solidT(S, tx, b.y) || blockerAt(S, tx, b.y, b) || solidT(S, tx, b.y + 1) || blockerAt(S, tx, b.y + 1, b))) tx = b.x;
    if (wx && tx !== b.x) b.vx = wx;
    b.fall = true;
    enter(S, b, tx, b.y + 1, 'down');
    return;
  }
  if (b.fall) {   // just landed on something
    b.fall = false; emit(S, { e: 'land', x: b.x, y: b.y, k: b.k });
    const u = blockerAt(S, b.x, b.y + 1, b);
    if (u) {
      if (u.k === 'saw') sawLand(S, u, b);
      else if (u.k === 'dom' || u.k === 'bell' || u.k === 'train') push(S, u, u.k === 'dom' ? (b.vx || 1) : 0, b);
    }
  }
  const ramp = at(S, b.x, b.y).find(o => o.k === 'ramp');
  if (ramp) b.vx = ramp.d;
  if (b.k === 'train') b.vx = b.on ? b.d : 0;
  const w = windAt(S, b.x, b.y); if (w && !b.vx && b.k !== 'train') b.vx = w;
  if (!b.vx) return;
  if (enter(S, b, b.x + b.vx, b.y, b.vx)) b.rot += b.vx;
  void ox; void oy;
}
function sawLand(S, s, b) {
  const side = b.x - s.x;
  b.vx = 0;
  if (side && side === -s.tilt) {
    s.tilt = side; emit(S, { e: 'saw', x: s.x, y: s.y });
    const o = S.objs.find(q => BODY[q.k] && !q.gone && q.x === s.x - side && q.y === s.y - 1 && q !== b);
    if (o) { o.up = SAW_UP; o.vx = side; o.fall = false; emit(S, { e: 'fly', x: o.x, y: o.y }); }
  }
}
function stepBubble(S, u) {
  if (u.popped || u.carry == null) return;
  const b = S.objs.find(o => o.id === u.carry);
  const wx = windAt(S, u.x, u.y), [dx, dy] = wx ? [wx, 0] : [0, -1], x = u.x + dx, y = u.y + dy;
  const os = inG(S, x, y) ? at(S, x, y).filter(o => o !== u && o !== b) : [];
  const bl = os.find(o => isBlock(o) || o.k === 'bub');
  if (!inG(S, x, y) || solidT(S, x, y) || bl) {
    if (bl) push(S, bl, dx, b);
    u.popped = true; b.inB = null; b.vx = dx || 0; b.fall = true; emit(S, { e: 'bubpop', x: u.x, y: u.y }); S.busy = true;
    return;
  }
  u.x = x; u.y = y; b.x = x; b.y = y; S.busy = true;
  for (const o of os) if (o.k === 'bln' && !o.popped) { goal(S, o, 'bln'); o.popped = true; }
}
function tick(S) {
  if (S.over) return;
  S.t++; S.busy = false;
  for (const o of S.objs) { o.px = o.x; o.py = o.y; o.pst = o.st; }
  const now = S.q.filter(e => e.at <= S.t); S.q = S.q.filter(e => e.at > S.t);
  for (const e of now) {
    if (e.f === 'start') {
      for (const h of S.objs) if (h.k === 'hero') { emit(S, { e: 'heropush', x: h.x, y: h.y }); hitCell(S, h.x + h.d, h.y, h.d, h); }
      for (const c of S.objs) if (c.k === 'claw' && c.col < 0) openClaw(S, c);
      for (const f of S.objs) if (f.k === 'fan' && f.col < 0) fanOn(S, f);
      S.busy = true;
    } else if (e.f === 'domhit') {
      const o = S.objs.find(q => q.id === e.id); o.st = 'down'; emit(S, { e: 'clack', x: o.x, y: o.y });
      hitCell(S, o.x + o.fd, o.y, o.fd, o);
      S.busy = true;
    }
  }
  for (const b of S.objs) if (BODY[b.k]) { const was = [b.x, b.y, b.vx, b.up]; stepBody(S, b); if (b.x !== was[0] || b.y !== was[1]) S.busy = true; }
  for (const u of S.objs) if (u.k === 'bub') stepBubble(S, u);
  if (S.goals && S.done.size >= S.goals && !S.win) { S.win = true; emit(S, { e: 'win' }); }
  S.idle = S.busy || S.q.length ? 0 : S.idle + 1;
  if (S.idle >= 2 || S.t > 400) S.over = true;
}
function runAll(L, placed, max = 400) { const S = makeSim(L, placed); while (!S.over && S.t < max) tick(S); return S; }

// can piece kind k go in cell (x, y)?  (other = pieces already there, ignore = the piece being moved)
function canPlace(L, placed, k, x, y, ignore) {
  if (x < 0 || y < 0 || x >= L.W || y >= L.H || L.ter[y][x]) return false;
  if (L.slots && !L.slots.some(([a, b]) => a === x && b === y)) return false;
  const all = [...L.objs, ...placed.filter(p => p !== ignore)];
  if (all.some(o => cellsOf(o).some(([a, b]) => a === x && b === y))) return false;
  if (all.some(o => o.k === 'claw' && o.x === x && o.y === y)) return false;
  if (NEEDS_FLOOR[k]) {
    const below = y + 1 >= L.H || L.ter[y + 1][x] === 1 || all.some(o => o.k === 'saw' ? false : (o.x === x && o.y === y + 1 && BLOCK[o.k] && !BODY[o.k]));
    if (!below) return false;
  }
  return true;
}
// ==END==

// map: '#' floor / shelf, '0'..'3' a coloured gate (a door or a trapdoor), '.' air.   o: fixed pieces [kind, x, y, …]
// s: slots (only these cells take pieces; none = any cell that fits)   t: the tray { kind: count }   sol: one answer [kind, x, y, dir]
// colours: 0 red, 1 blue, 2 yellow, 3 purple.   th: scenery
const LEVELS = [
  { k: 'dom', nm: '補一塊骨牌', th: 'meadow', map: ['........', '........', '........', '########'],
    o: [['hero', 0, 2, 1], ['dom', 1, 2], ['dom', 2, 2], ['dom', 3, 2], ['dom', 5, 2], ['dom', 6, 2], ['bell', 7, 2]], s: [[4, 2]], t: { dom: 1 }, sol: [['dom', 4, 2]] },
  { k: 'dom', nm: '兩個缺口', th: 'meadow', map: ['........', '........', '........', '########'],
    o: [['hero', 0, 2, 1], ['dom', 1, 2], ['dom', 3, 2], ['dom', 4, 2], ['dom', 6, 2], ['bln', 7, 2]], s: [[2, 2], [5, 2]], t: { dom: 2 }, sol: [['dom', 2, 2], ['dom', 5, 2]] },
  { k: 'ball', nm: '滾滾球', th: 'room', map: ['........', '........', '........', '########'],
    o: [['hero', 0, 2, 1], ['dom', 4, 2], ['dom', 5, 2], ['dom', 6, 2], ['bell', 7, 2]], s: [[1, 2]], t: { ball: 1 }, sol: [['ball', 1, 2]] },
  { k: 'dom', nm: '骨牌推球', th: 'room', map: ['........', '........', '#####...', '........', '########'],
    o: [['hero', 0, 1, 1], ['dom', 1, 1], ['dom', 2, 1], ['ball', 4, 1], ['bell', 7, 3]], s: [[3, 1]], t: { dom: 1 }, sol: [['dom', 3, 1]] },
  { k: 'drop', nm: '球從天上掉', th: 'meadow', map: ['........', '........', '........', '........', '########'],
    o: [['ramp', 1, 3, 1], ['dom', 3, 3], ['dom', 4, 3], ['dom', 5, 3], ['bell', 6, 3]], t: { ball: 1 }, sol: [['ball', 1, 0]] },
  { k: 'ramp', nm: '溜滑梯', th: 'park', map: ['........', '.....###', '........', '........', '########'],
    o: [['hero', 7, 0, -1], ['ball', 6, 0], ['dom', 6, 3], ['bell', 7, 3]], s: [[4, 3]], t: { ramp: 1 }, sol: [['ramp', 4, 3, 1]] },
  { k: 'flip', nm: '轉個方向', th: 'park', map: ['........', '###.....', '........', '........', '########'],
    o: [['hero', 0, 0, 1], ['ball', 1, 0], ['bell', 0, 3], ['dom', 1, 3], ['dom', 2, 3]], t: { ramp: 1 }, sol: [['ramp', 3, 3, -1]] },
  { k: 'btn', nm: '開燈囉', th: 'room', map: ['........', '........', '........', '########'],
    o: [['hero', 0, 2, 1], ['dom', 1, 2], ['dom', 2, 2], ['dom', 4, 2], ['btn', 5, 2, 1], ['lamp', 7, 2, 1]], s: [[3, 2]], t: { dom: 1 }, sol: [['dom', 3, 2]] },
  { k: 'spring', nm: '彈簧跳跳', th: 'meadow', map: ['........', '........', '.....###', '.....###', '########'],
    o: [['hero', 0, 3, 1], ['ball', 1, 3], ['dom', 6, 1], ['bell', 7, 1]], t: { spring: 1 }, sol: [['spring', 3, 3, 1]] },
  { k: 'pulley', nm: '水桶開門', th: 'farm', map: ['........', '#####...', '........', '..0.....', '########'],
    o: [['hero', 0, 0, 1], ['bucket', 5, 2, 0], ['ramp', 1, 3, 1], ['ball', 1, 3], ['dom', 6, 3], ['bell', 7, 3]], s: [[1, 0]], t: { ball: 1 }, sol: [['ball', 1, 0]] },
  { k: 'fan', nm: '電風扇', th: 'room', map: ['........', '........', '........', '########'],
    o: [['ball', 3, 2], ['dom', 5, 2], ['dom', 6, 2], ['bell', 7, 2]], t: { fan: 1 }, sol: [['fan', 1, 2, 1]] },
  { k: 'cake', nm: '送蛋糕', th: 'party', map: ['........', '####....', '........', '........', '########'],
    o: [['hero', 0, 0, 1], ['cake', 1, 0], ['friend', 1, 3]], t: { ramp: 1 }, sol: [['ramp', 4, 3, -1]] },
  { k: 'saw', nm: '翹翹板', th: 'park', map: ['.........', '....#####', '.........', '.........', '.........', '#########'],
    o: [['saw', 2, 4, -1], ['claw', 3, 0], ['ball', 3, 0], ['dom', 7, 0], ['bell', 8, 0]], t: { ball: 1 }, sol: [['ball', 1, 3]] },
  { k: 'bubble', nm: '泡泡電梯', th: 'sea', map: ['........', '........', '........', '........', '########'],
    o: [['hero', 0, 3, 1], ['ball', 1, 3], ['bln', 5, 1]], t: { bub: 1 }, sol: [['bub', 5, 3]] },
  { k: 'ramp', nm: '斜坡樓梯', th: 'park', map: ['........', '....####', '........', '####....', '........', '########'],

function trayKinds() { return KIND_ORDER.filter(k => L.tray[k]); }
function layout() {
  if (!L) return;

  U = Math.max(1, Math.min(1.5, Math.min(W, H) / 420)) * MG.textScale;
  const kinds = trayKinds(), nk = kinds.length;

  if (land) {

    const cols = nk > 3 ? 2 : 1, rowsK = Math.ceil(nk / cols);
    const bh2 = Math.round(Math.min(78 * U, (H - 30 - gap * (rowsK + 2)) / (rowsK + 2.3)));

    const totH = rowsK * kh + (rowsK - 1) * gap + gap * 2 + bh2 * 2.3 + gap;
    let yy = Math.max(12, (H - totH) / 2);

    yy += rowsK * (kh + gap) + gap;
    const hw = (tw - gap) / 2;
    items.push({ id: 'hint', x: tx, y: yy, w: hw, h: bh2 }, { id: 'clear', x: tx + hw + gap, y: yy, w: hw, h: bh2 });
    items.push({ id: 'go', x: tx, y: yy + bh2 + gap, w: tw, h: bh2 * 1.3 });
    trayR = { x: tx - 8, y: Math.max(4, (H - totH) / 2 - 10), w: tw + 16, h: totH + 20 };

    const one = W >= (nk + 3.6) * Math.max(66, rh * 1.02);

function canStand(o) { return o.y + 1 >= L.H || L.ter[o.y + 1][o.x] === 1 || [...L.objs, ...placed].some(q => q !== o && ((q.k === 'saw' && q.y === o.y + 1 && Math.abs(q.x - o.x) <= 1) || (q.x === o.x && (q.y === o.y + 1 && BLOCK[q.k] || q.y === o.y && (q.k === 'ramp' || q.k === 'btn' || q.k === 'claw'))))); }

function flipFx(o, X, Y) {

function drawWind(f) {

function drawHint() {
