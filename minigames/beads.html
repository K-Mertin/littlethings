function newsOf(L, n) {

  if (L.pets) k.push('pets'); if (L.goal) k.push('goal'); if (L.tun) k.push('tun'); if (L.rocks) k.push('rocks'); if (L.spin) k.push('spin');

}

// ---------- canvas size: the short side is ~380 units, the long side follows the screen ----------
let bgC = null, fgC = null, bgK = '', SPR = new Map();
MG.fit(cv, (sw, sh) => {

  land = asp > 1.05;

  else { W = 380; H = Math.round(clamp(W / asp, 420, 880)); }

});
cv.onfit = () => { bgK = ''; SPR = new Map(); if (geo) relayout(); };
addEventListener('mg-big', () => { bgK = ''; });

// ---------- paths: dense polylines resampled every 2 units ----------
function ellPts(cx, cy, rx, ry, a0, a1) { const n = Math.max(2, Math.ceil(Math.abs(a1 - a0) * Math.max(rx, ry) / 3)), o = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); } return o; }
function bezPts(p0, p1, p2, p3) { const n = 40, o = []; for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t; o.push([u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0], u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]); } return o; }
function cat(...arrs) { const o = []; for (const a of arrs) for (const p of a) { const l = o[o.length - 1]; if (!l || Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.05) o.push(p); } return o; }
function resample(pts) {
  const n0 = pts.length, cum = new Float64Array(n0);
  for (let i = 1; i < n0; i++) cum[i] = cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  const ST = 2, n = Math.max(2, Math.floor(cum[n0 - 1] / ST) + 1), X = new Float32Array(n), Y = new Float32Array(n);
  for (let i = 0, j = 0; i < n; i++) {
    const s = i * ST; while (j < n0 - 2 && cum[j + 1] < s) j++;
    const seg = cum[j + 1] - cum[j] || 1, k = clamp((s - cum[j]) / seg, 0, 1);
    X[i] = pts[j][0] + (pts[j + 1][0] - pts[j][0]) * k; Y[i] = pts[j][1] + (pts[j + 1][1] - pts[j][1]) * k;
  }
  return { X, Y, n };
}
// round: [[fraction, half-window (units), passes]] — extra smoothing for sharp spots (the heart's tip)
function makePath(pts, passes = 4, round = []) {
  let { X, Y, n } = resample(pts);
  const smooth = (i0, i1, k) => { for (let pass = 0; pass < k; pass++) { const X2 = X.slice(), Y2 = Y.slice(); for (let i = Math.max(1, i0); i < Math.min(n - 1, i1); i++) { X2[i] = (X[i - 1] + 2 * X[i] + X[i + 1]) / 4; Y2[i] = (Y[i - 1] + 2 * Y[i] + Y[i + 1]) / 4; } X = X2; Y = Y2; } };
  smooth(1, n - 1, passes);
  for (const [f, w, k] of round) { const c = Math.round(f * (n - 1)), h = Math.round(w / 2); smooth(c - h, c + h, k); }
  ({ X, Y, n } = resample(Array.from(X, (v, i) => [v, Y[i]])));
  const A = new Float32Array(n);
  for (let i = 0; i < n; i++) { const a = Math.max(0, i - 1), b = Math.min(n - 1, i + 1); A[i] = Math.atan2(Y[b] - Y[a], X[b] - X[a]); }
  return { X, Y, A, n, L: (n - 1) * 2 };
}
function at(p, s) { const f = clamp(s, 0, p.L) / 2, i = Math.min(p.n - 2, Math.floor(f)), k = f - i; return [p.X[i] + (p.X[i + 1] - p.X[i]) * k, p.Y[i] + (p.Y[i + 1] - p.Y[i]) * k, p.A[i]]; }

// ---------- track shapes (built for the current W×H) ----------
function genGeo(L) {
  const b = { x: 12, y: HUD + 4, w: W - 24, h: H - HUD - 14 }, cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const g = { paths: [], hero: { x: cx, y: cy }, rail: null, obs: [], orbit: null, b };
  const clr = L.spin ? 112 : HCL + R + 14;   // how far (bead centre) the track keeps from the hero
  const gp = 3.1 * R;
  if (L.tr === 'oval' || L.tr === 'spiral') {
    let rx = b.w / 2 - R - 4, ry = b.h / 2 - R - 4; rx = Math.min(rx, ry * 1.5); ry = Math.min(ry, rx * 1.5);
    const mn = Math.min(rx, ry), dr = Math.max(0.24, 2.9 * R / mn), inner = clr / mn;
    let turns = Math.min(L.tr === 'oval' ? 1.2 : 2.3, (1 - inner) / dr);
    if (turns < 1) turns = Math.min(turns, 0.86);
    const a0 = L.tr === 'oval' ? -Math.PI / 2 - 0.9 : Math.PI * 0.95, N = Math.ceil(turns * 300), pts = [];
    for (let i = 0; i <= N; i++) { const u = turns * i / N, f = 1 - dr * u, a = a0 + u * TAU; pts.push([cx + rx * f * Math.cos(a), cy + ry * f * Math.sin(a)]); }
    g.paths.push(pts);
  } else if (L.tr === 'arch') {   // a tall rounded doorway, twice: straight legs and a round top, the inner one exactly one lane inside
    const y0 = b.y + b.h - 42, rx = b.w / 2 - R - 4, top = b.y + R + 4, ryT = Math.min(y0 - top, rx * 1.05), yc = top + ryT;
    g.hero = { x: cx, y: y0 - 6 };
    g.paths.push(cat([[cx - rx, y0 + 4], [cx - rx, yc]], ellPts(cx, yc, rx, ryT, Math.PI, TAU), [[cx + rx, y0]], ellPts(cx + rx - gp / 2, y0, gp / 2, gp / 2, 0, Math.PI),
      [[cx + rx - gp, yc]], ellPts(cx, yc, rx - gp, ryT - gp, TAU, Math.PI + 0.42)));
  } else if (L.tr === 'snake') {
    const top = b.y + R + 6, railY = b.y + b.h - 32, low = railY - (L.rocks ? 126 : 104);
    const k = clamp(Math.floor((low - top) / 76) + 1, 3, 8), gap = (low - top) / (k - 1), r = gap / 2;
    const xl = b.x + R + 4 + r, xr = b.x + b.w - R - 4 - r, pts = [[b.x + R + 4, top]];
    for (let i = 0; i < k; i++) {
      const y = top + i * gap, right = i % 2 === 0;
      if (right) { pts.push([xr, y]); if (i < k - 1) pts.push(...ellPts(xr, y + r, r, r, -Math.PI / 2, Math.PI / 2)); else pts.push([b.x + b.w - R - 4, y]); }
      else { pts.push([xl, y]); if (i < k - 1) pts.push(...ellPts(xl, y + r, r, r, -Math.PI / 2, -Math.PI * 1.5)); else pts.push([b.x + R + 4, y]); }
    }
    g.paths.push(cat(pts));
    g.rail = { x0: b.x + 40, x1: b.x + b.w - 40, y: railY, low };

}

function draw() {

  for (const ch of chains) for (const b of ch.beads) if (b.s > R * 0.2 && b.x != null) all.push([ch, b]);

  if (shot) drawBead({ c: shot.c, id: 5 }, shot.x, shot.y, 1, t * 12);

    const k = clamp(f.t / 1.1, 0, 1), tx = hero.x - 34, ty = hero.y + 14, px = lerp(f.x0, tx, k), py = lerp(f.y0, ty, k) - Math.sin(k * Math.PI) * 70;

  }

    const hw = x.measureText(w.t).width / 2 + 6, px = clamp(w.x, hw, W - hw), py = clamp(w.y, HUD + 12, H - 12);

  while (k >= 0 && k < B.length && B[k].c === col) { cnt++; if (k < B.length - 1 && !touching(B, k, k + 1)) { k = -1; break; } k++; }

window.BEADST = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, levels: NL, get size() { return [W, H, land]; },
  start: (lv, m = 'relax') => { mode = m; go(lv); MG.hide(); }, menu: () => menu(), win: () => { if (state === 'play') startWin(); },
  get hero() { return { ...hero, aim }; }, get cur() { return cur; }, get nxt() { return nxt; }, setCur(c) { cur = c; },
  info() { return { level, state, mode, tr: LV.tr, chains: chains.map(c => ({ L: c.p.L, n: c.beads.length, q: c.queue.length, front: frontS(c) / c.p.L, headMax: c.headMax })), pets: petsLeft(), goal: goalLeft(), left: beadsLeft(), shots, friends: friends.length, obs: obstacles().length }; },
  beads: () => chains.map(c => c.beads.map(b => ({ s: b.s, c: b.c, pet: !!b.pet, pw: b.pw, x: b.x, y: b.y, vis: visible(c, b) }))),
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play' || state === 'cascade' || state === 'eaten') update(dt); },
  aimAt(px, py) { if (geo.rail) { hero.x = hero.tx = clamp(px, geo.rail.x0, geo.rail.x1); aim = -Math.PI / 2; } else aim = Math.atan2(py - (hero.y - 4), px - hero.x); },
  fire: () => fire(), swap: () => swap(), power: k => power(k, chains[0]),
  toClient(px, py) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + px * (rc.width - 2 * B) / W, y: rc.top + B + py * (rc.height - 2 * B) / H }; },
  // geometry sanity: track parts never overlap (except the 8's bridge), hero and rocks keep clear of the beads
  geoCheck() {
    const out = { selfMin: 1e9, crossMin: 1e9, heroMin: 1e9, obsMin: 1e9, inside: true, L: chains.map(c => Math.round(c.p.L)) };
    for (const [ia, ch] of chains.entries()) {
      const p = ch.p;
      for (let i = 0; i < p.n; i += 3) {
        if (p.X[i] < R - 1 || p.X[i] > W - R + 1 || p.Y[i] < HUD - 2 || p.Y[i] > H - R + 1) out.inside = false;
        out.heroMin = Math.min(out.heroMin, Math.hypot(p.X[i] - geo.hero.x, p.Y[i] - geo.hero.y));
        for (const o of geo.obs) out.obsMin = Math.min(out.obsMin, Math.hypot(p.X[i] - o.x, p.Y[i] - o.y) - o.r - R);
        for (let j = i + Math.ceil(3 * D / 2); j < p.n; j += 3) { const d = Math.hypot(p.X[i] - p.X[j], p.Y[i] - p.Y[j]); if (d < out.selfMin && !(LV.tr === 'eight' && d < D * 1.2)) { out.selfMin = d; out.selfAt = [i * 2 / p.L, j * 2 / p.L].map(v => +v.toFixed(3)); } }
        for (const [ib, c2] of chains.entries()) if (ib > ia) for (let j = 0; j < c2.p.n; j += 3) out.crossMin = Math.min(out.crossMin, Math.hypot(p.X[i] - c2.p.X[j], p.Y[i] - c2.p.Y[j]));

  // a simple helper player: picks the shot that makes the biggest match

  plan() {
    if (state !== 'play' || shot || MG.panelOpen()) return null;
    const b = this.best(); if (!b) return null;
    if (geo.rail) return { x: b.ox, y: geo.rail.low - 10, swap: b.sw, hx: hero.x, hy: hero.y };
    return { x: hero.x + Math.cos(b.ang) * 110, y: hero.y - 4 + Math.sin(b.ang) * 110, swap: b.sw, hx: hero.x, hy: hero.y };
  },
  best() {
    let best = null;
    for (const [col, sw] of [[cur, false], [nxt, true]]) for (const ch of chains) for (const b of ch.beads) {
      if (!visible(ch, b)) continue;

    return best;
  },
  autoStep() {
    if (state !== 'play' || shot || MG.panelOpen()) return false;
    const best = this.best();
    if (!best) { aim = -Math.PI / 2 + 0.3; fire(); return true; }
    if (best.sw) swap();
    if (geo.rail) { hero.x = hero.tx = best.ox; aim = -Math.PI / 2; } else aim = best.ang;

  },
  autoPlay(maxShots = 300, gap = 60) {   // plays synchronously, one shot every `gap` frames
    let n = 0;
    while (n < maxShots && (state === 'play' || state === 'cascade' || state === 'eaten')) {
      if (state === 'play') { this.autoStep(); n++; }
      for (let k = 0; k < gap; k++) if (state === 'play' || state === 'cascade' || state === 'eaten') update(1 / 60);
    }
    return { state, shots: n, info: this.info() };
  },
};
