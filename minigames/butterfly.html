.bf-c img{width:calc(58px * var(--ui));height:calc(58px * var(--ui))}
.bf-c b{font-size:calc(12.5px * var(--ui));color:#5a4422;line-height:1.25}
.bf-c small{font-size:calc(11.5px * var(--ui));color:#b0894a;font-weight:700}
.bf-c.no{background:#f2f4f7;border-color:#dfe3ea}
.bf-c.no b{color:#a8b0bc}

// ---------- levels ----------

// pool: who flies around · on: how many at once · sp: 0..1 speed · time: ⏱ seconds · fl: flowers · lv: leaves

  { name: '蝴蝶大慶典', type: 'mix', theme: 'garden', stages: [{ type: 'card', pool: ['pink', 'purp', 'eye', 'snow', 'sky'], rounds: 2, on: 5, sp: 0.15, gift: 'gold' }, { type: 'catch', theme: 'pond', pool: ['dfr', 'dfb', 'dfg'], goal: 4, on: 4, sp: 0.2, gift: 'dfx' }, { type: 'catch', theme: 'night', pool: ['ffy', 'ffg', 'ffp', 'luna'], goal: 4, on: 5, sp: 0.1 }, { type: 'release', theme: 'garden', goal: 6 }], time: 260, mk: '👑' },

// the first time something new shows up, a short panel explains it once
const NEWS = {
  catch: ['🦋 捉蝴蝶', '蝴蝶飛來飛去！用手指<b>點一下蝴蝶</b>，噗噗長長的捕蟲網就會輕輕把牠捉進玻璃瓶。手指<b>滑過去</b>也可以一次捉好幾隻喔！過關的時候，我們會把牠們放回大自然 💕'],
  color: ['🎨 找顏色', '看看上面木牌的蝴蝶是<b>什麼顏色</b>，只捉一樣顏色的！捉錯了沒關係，牠只會飛開一下下。'],
  card: ['🃏 看圖卡', '木牌上有一張<b>圖卡</b>，找找看哪一隻跟圖卡<b>一模一樣</b>：顏色和花紋都要一樣喔！'],
  shy: ['🌷 害羞的蝴蝶', '蝴蝶躲在花苞裡！花苞打開、蝴蝶探出頭的時候<b>點牠</b>。點一下合起來的花苞，牠會快一點出來喔。看到花苞上露出翅膀尖尖，裡面就有蝴蝶！'],
  lady: ['🐞 小瓢蟲', '小瓢蟲背上有圓圓的點點，牠們慢慢地飛，有時候會停下來休息一下。'],
  spots: ['🔢 數點點', '木牌上的瓢蟲背上有幾個點點？數一數，捉<b>點點一樣多</b>的那一隻！'],
  dragon: ['🪷 池塘蜻蜓', '蜻蜓會<b>停在空中</b>一下下，然後「咻！」一下飛走。趁牠停住的時候點牠！'],
  firefly: ['✨ 螢火蟲', '晚上的螢火蟲會<b>一閃一閃</b>。屁股<b>亮起來</b>的時候才捉得到喔！點到暗暗的螢火蟲，牠會趕快亮給你看。'],
  rain: ['☔ 下雨天', '下雨了，小蟲蟲都躲到<b>大葉子</b>下面。點葉子掀起來看看，找到小蟲蟲再點牠！<b>會動來動去</b>的葉子下面，一定有朋友在躲雨。'],
  release: ['🏡 送牠們回家', '玻璃瓶裡的蝴蝶要回家了！蝴蝶最喜歡<b>跟自己一樣顏色</b>的花。點一下（或拖著）同樣顏色的花，蝴蝶就會飛過去。'],
  swap: ['🔄 換顏色', '捉了幾隻以後，木牌上的<b>顏色會換</b>，記得看一看喔！'],

  mix: ['🧩 好幾個任務', '這一關有<b>好幾個小任務</b>，做完一個就換下一個，還會換地方喔！木牌下面的小圓圈告訴你還有幾個。'],
};
const kindsOf = L => (L.pool || []).map(id => SPI[id].k);
// what's new in one task (a level, or one step of a mix level)
const newsPart = P => {
  const out = [P.type], ks = kindsOf(P);
  if (ks.includes('lb')) out.push('lady'); if (ks.includes('df')) out.push('dragon'); if (ks.includes('ff')) out.push('firefly');
  if (P.swap) out.push('swap'); if (P.swarm) out.push('swarm');
  return out;
};
const newsOf = L => [...new Set(L.stages ? ['mix', ...L.stages.flatMap(s => newsPart(Object.assign({}, L, s)))] : newsPart(L))];
const KIND = ['蝴蝶們開心地飛回家了，謝謝你輕輕地照顧牠們 💕', '看過、玩過，就讓小蟲蟲回到大自然，牠們的家人在等牠們喔！', '小蟲蟲說：「謝謝你沒有弄痛我們！」🦋', '輕輕地捉、開心地放，你是大自然的好朋友 🌿', '牠們飛走前，繞著你轉了一圈說：「掰掰，下次再一起玩！」👋'];

// ---------- layout ----------
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  land = asp > 1.15;
  if (land) { H = 440; W = Math.round(clamp(H * asp, 560, 1100)); }
  else { W = 360; H = Math.round(clamp(W / asp, 460, 860)); }
  return [W, H];
});
cv.onfit = () => { bgK = ''; relayout(); };
addEventListener('mg-big', () => { bgK = ''; });
const SG = () => { const w = Math.min(W - 16, land ? 360 : 320), h = 72; return { x: (W - w) / 2, y: 6, w, h }; };
const GL = () => H - (land ? 18 : 24);            // where the hero's feet are
const GT = () => GL() - (land ? 56 : 66);          // top of the grass in front
const HR = () => land ? 27 : 29;                   // hero radius
const HX = () => land ? 150 : 116;
const JX = () => land ? 72 : 46;
const FX0 = () => 26, FX1 = () => W - 26;
const FY0 = () => SG().y + SG().h + (nStages() > 1 ? 30 : 18);
const FY1 = () => GT() - 4;
const TS = () => MG.textScale;
const FF = '"Noto Sans TC",system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const F = (px, w = 900) => `${w} ${Math.round(px * TS())}px ${FF}`;
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;

// ---------- state ----------

reset(); menu();
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) update(dt);
  else {
    t += dt; MG.fx.step(dt); ambient(dt);
    for (const b of bugs) if (b.st === 'free' || b.st === 'leave' || state !== 'play') { if (b.st === 'fly' || b.st === 'rest') { b.ph += dt * 10; b.x += Math.sin(t + b.seed) * 10 * dt; } else stepBug(b, dt); }
    bugs = bugs.filter(b => !b.gone);
    for (const p of pops) { p.y -= 34 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
    for (const h of hearts) { h.x += h.vx * dt; h.y += h.vy * dt; h.life -= dt; } hearts = hearts.filter(h => h.life > 0);
  }
  draw();
});

// ---------- hook for automated tests ----------
window.BUTTERFLYT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get prog() { return prog; }, get goal() { return goalOf(); }, get type() { return LV.type; }, get theme() { return LV.theme; },
  get stage() { return stageI; }, get stages() { return nStages(); }, get stageT() { return stageT; }, get misses() { return misses; }, get size() { return [W, H, land]; }, levels: LEVELS.length,
  get tcol() { return tcol; }, get card() { return cardSp && cardSp.id; }, get tN() { return tN; }, get jar() { return jar.map(j => j.sp.id); }, get book() { return book(); }, species: SPECIES.length,
  bugs: () => bugs.map((b, i) => ({ i, id: b.sp.id, k: b.k, st: b.st, x: b.x, y: b.y, spots: b.spots, target: active(b) && isTarget(b), glow: glowOf(b) })),
  flowers: () => flowers.map((f, i) => ({ i, x: f.x, y: f.y, r: f.r, col: f.col, st: f.st, bug: f.bug && f.bug.id, open: f.open })),
  leaves: () => leaves.map((l, i) => ({ i, x: l.x, y: l.y, r: l.r, lift: l.lift, item: l.item === 'snail' ? 'snail' : l.item ? l.item.sp.id : null })),
  get cur() { const c = rel && rel.cur; return c && { id: c.sp.id, col: c.sp.col, st: c.st, x: c.x, y: c.y }; },
  start: (lv, m = 'relax') => start(m, lv), win: () => { if (state === 'play') startWin(); }, menu: () => menu(), showBook: () => showBook(),
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play' && !MG.panelOpen()) update(dt); },
  tapAt: (lx, ly) => tapAt(lx, ly),
  logToClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  // one helpful move for the current task; returns the logical point it used (or null)
  auto() {
    if (state !== 'play' || winT || stageT || MG.panelOpen()) return null;
    const T = LV.type;
    if (T === 'shy') { const f = flowers.find(o => o.st === 'peek' && o.bug); if (f) { shyTap(f.x, flowerBugY(f), false); return [f.x, flowerBugY(f)]; } const h = flowers.find(o => o.bug && o.st === 'hidden'); if (h) { shyTap(h.x, h.y - h.r * 0.3, false); return [h.x, h.y]; } return null; }
    if (T === 'rain') { const l = leaves.find(o => o.lift > 0.5 && o.item && o.item !== 'snail'); if (l) { rainTap(l.x, l.y - l.r * 0.6, false); return [l.x, l.y]; } const h = leaves.find(o => o.item && o.item !== 'snail' && o.tgt === 0); if (h) { rainTap(h.x, h.y - h.r * 0.6, false); return [h.x, h.y]; } return null; }
    if (T === 'release') { const c = rel && rel.cur; if (c && c.st === 'ready') { const f = flowers.find(o => o.col === c.sp.col); if (f) { sendTo(f); return [f.x, f.y]; } } return null; }
    const b = bugs.find(o => active(o) && isTarget(o) && glowOf(o) >= 0.4 && o.x > 20 && o.x < W - 20);
    if (b) { const p = [b.x, b.y]; tapAt(b.x, b.y); return p; }
    return null;
  },
  target() { // logical point of something right to touch now (for real pointer tests)
    const T = LV.type;
    if (T === 'shy') { const f = flowers.find(o => o.st === 'peek' && o.bug && o.open > 0.8); return f ? [f.x, flowerBugY(f)] : null; }
    if (T === 'rain') { const l = leaves.find(o => o.lift > 0.5 && o.item && o.item !== 'snail') || leaves.find(o => o.item && o.item !== 'snail' && o.tgt === 0); return l ? [l.x, l.y - l.r * 0.6] : null; }
    if (T === 'release') { const c = rel && rel.cur; if (c && c.st === 'ready') { const f = flowers.find(o => o.col === c.sp.col); return f ? [f.x, f.y - f.r * 0.5] : null; } return null; }
    const b = bugs.find(o => active(o) && isTarget(o) && glowOf(o) >= 0.6 && o.x > 30 && o.x < W - 30 && (o.k !== 'df' || o.mode === 'hover'));
    return b ? [b.x, b.y] : null;
  },
};
