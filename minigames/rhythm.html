<title>噗噗節奏樂園</title>

<style>
.mg-stage{padding:6px}.rh-stars{font-size:38px;letter-spacing:.12em;margin:2px 0 4px}
.rh-res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.rh-res div{background:#fff;border:2px solid #e2cf9c;border-radius:10px;padding:4px 2px;font-size:13px;color:var(--mute)}
.rh-res b{display:block;font-size:22px;color:var(--ink)}
.rh-res .p b{color:#e8508a}.rh-res .g b{color:#2f7fd8}.rh-res .m b{color:#9a8fa8}
/* a tall start panel must stay scrollable to its top on small phones */
.mg-over{align-items:flex-start}.mg-card{margin:auto}
.mg-pick:has(> [data-pk="diff"]){grid-template-columns:repeat(3,1fr)}
.mg-levels.mg-lvgrid{grid-template-columns:repeat(5,1fr)}
.mg-lvgrid .mg-lv{min-height:52px;line-height:1.15;padding:2px;white-space:normal}
.mg-lvgrid .mg-lv small{display:block;font-size:11px;font-weight:700;color:#e0a100;letter-spacing:.04em}
.mg-lvgrid .mg-lv[aria-pressed=true] small{color:#fff}
.rh-new{display:flex;gap:10px;align-items:center;text-align:left;margin:6px 0}.rh-new b.ic{font-size:40px;line-height:1;flex:none}
</style>
</head>

  if (!paused) return;

    if (id !== runId || paused || state !== 'play') return;
    refreshLat();
    const ci = clamp(SD.beat, 0.45, 0.75) / Math.sqrt(SPEED), hear = ac.currentTime - outLat;
    freezeUntil = hear + 0.15 + 3 * ci;

// ---------- scheduler: everything ~120 ms ahead on the audio clock ----------
function schedule() {
  if (state !== 'play' && state !== 'end') return;

  const now = ac.currentTime, horizon = (now + 0.12 - outLat - songStart) * SPEED;

  for (let k = scanFrom; k < notes.length; k++) {
    const n = notes[k]; if (n.t > tj + GOOD) break;
    if (n.roll && !n.ghost && n.lane === lane && !n.st && tj >= n.t - GOOD && tj <= n.end + 0.05) { rollTap(n); return; }
  }
  let best = null, bd = 9;

    if (n.t > tj + GOOD) break;
    if (n.lane !== lane || n.st || n.roll || n.ghost) continue;
    const d = Math.abs(n.t - tj);
    if (d <= GOOD && d < bd) { best = n; bd = d; }
  }
  if (!best) { SND.tap(); return; }
  if (best.swipe) {
    const s0 = String(src);

    best.st = 5; swipes.set(src, { n: best, tj, x0: pt ? pt.x : 0, y0: pt ? pt.y : 0, at: tj });

    txt(String(combo), cx, cy, Math.min(56 * s, R.w * 0.36), hot ? '#ff4f93' : ink, 'center', dark ? null : '#fff', 6);
    starRow(cx, top + 118 * s, 11 * s);
    txt(`正確率 ${Math.round(acc * 100)}%・${score} 分`, cx, top + 146 * s, 14 * s, sub);
    if (mode === 'challenge' && !demo) { txt('⚡ 噗噗能量', cx, top + 168 * s, 13 * s, sub); energyBar(R.x + 26, top + 178 * s, R.w - 52, 10 * s); }
    else txt('🐢 不會失敗，慢慢敲', cx, top + 172 * s, 13 * s, sub);
  }

}

let iconSpr = null, iconSprKey = '';
function iconSprite() {
  const k = SONG().ic;
  if (iconSpr && iconSprKey === k) return iconSpr;
  iconSpr = document.createElement('canvas'); iconSpr.width = iconSpr.height = 64; iconSprKey = k;
  const g = iconSpr.getContext('2d'); g.font = `48px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(k, 32, 35);
  return iconSpr;
}
function drawOverlays(tNow) {
  const cx = CX, cy = fieldTop + (hitY - fieldTop) * 0.36;
  const dark = isDark();
  if (state === 'play' && inCount() && !pendingResume) {
    const ci = clamp(SD.beat, 0.45, 0.75) / Math.sqrt(SPEED), left = freezeUntil - (ac.currentTime - outLat), k = Math.ceil(left / ci);
    if (k >= 1 && k <= 3) { const fr = 1 - (left / ci - (k - 1)); txt(String(k), cx, cy, 96 * (1 + 0.25 * (1 - fr)), '#ff6fa8', 'center', '#fff', 10); }
  } else if (state === 'play' && notes.length && tNow < notes[0].t - 0.25 && !demo) {
    txt('Ready? 🥁', cx, cy - 20, 34 * Math.min(U, 1.2), dark ? '#fff' : '#ff6fa8', 'center', dark ? 'rgba(0,0,0,.3)' : '#fff', 7);
    txt('糖果掉到鼓上就敲一下！', cx, cy + 22, 20 * Math.min(U, 1.2), dark ? '#ffe9a8' : '#7a4a6a', 'center', dark ? 'rgba(0,0,0,.3)' : '#fff', 5);
  }

    const k = SD.callBar[SD.barAt(tNow)];

      const sc = 1 + Math.exp(-((beatNow() % 1 + 1) % 1) * 6) * 0.06;
      x.save(); x.translate(cx, py); x.scale(sc, sc);
      x.fillStyle = 'rgba(40,20,60,.2)'; rr(x, -w / 2 + 2, -h / 2 + 4, w, h, h / 2); x.fill();
      x.fillStyle = mine ? '#ff6fa8' : '#5aa8f0'; rr(x, -w / 2, -h / 2, w, h, h / 2); x.fill();
      x.strokeStyle = '#fff'; x.lineWidth = 3; x.stroke();
      fitTxt(label, 0, 1, w - 16, h * 0.56, '#fff');
      x.restore();
    }
  }
  if (banner && banner.life > 0) {

    x.globalAlpha = a;

    x.globalAlpha = 1;
  }

  }
  x.globalAlpha = 1;
  // win party: the song's own icon rains down with streamers
  if (confetti.length) {
    const spr = iconSprite();
    for (const c of confetti) {
      if (c.y < -40) continue;
      x.save(); x.translate(c.x, c.y); x.rotate(c.rot);
      if (c.ic) x.drawImage(spr, -c.s / 2, -c.s / 2, c.s, c.s); else { x.fillStyle = c.col; x.fillRect(-c.s / 2, -c.s / 5, c.s, c.s / 2.5); }
      x.restore();
    }
  }
}

function drawCalib() {
  const c = calib, cx = W / 2, cy = H * 0.5;
  const dark = isDark(), ink = dark ? '#fff' : '#6a3456';
  x.fillStyle = dark ? 'rgba(25,15,60,.72)' : 'rgba(255,250,245,.78)'; x.fillRect(0, 0, W, H);
  txt('調整節拍', cx, (land ? 50 : fieldTop + 30), 34 * Math.min(U, 1.2), ink, 'center', dark ? null : '#fff', 6);
  fitTxt('聽到「咚」就敲一下畫面（或按空白鍵）', cx, (land ? 92 : fieldTop + 72), W - 40, 20 * Math.min(U, 1.2), dark ? '#ffe9a8' : '#7a4a6a');
  if (!c) return;
  const hear = ac.currentTime - outLat, ph = (hear - c.t0) / c.ci, f = ((ph % 1) + 1) % 1, live = ph > -0.5 && ph < c.total;
  const pulse = live && ph >= -0.05 ? Math.exp(-f * 6) : 0;
  const r = Math.min(W, H) * 0.17 * (1 + pulse * 0.12);
  const pal = MG.JELLY.pink;
  x.fillStyle = 'rgba(40,20,60,.18)'; x.beginPath(); x.ellipse(cx, cy + r * 1.05, r * 1.1, r * 0.3, 0, 0, 7); x.fill();
  const gr = x.createRadialGradient(cx - r * 0.3, cy - r * 0.3, 4, cx, cy, r);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.5, pulse > 0.3 ? '#fff3a0' : pal[0]); gr.addColorStop(1, pal[2]);
  x.fillStyle = gr; dot(x, cx, cy, r); x.strokeStyle = pal[4]; x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.stroke();
  x.globalAlpha = 0.6; x.fillStyle = pal[2]; shapePath(x, 'heart', cx, cy, r * 0.45); x.fill(); x.globalAlpha = 1;
  if (c.flash > 0) { x.strokeStyle = `rgba(255,200,60,${c.flash})`; x.lineWidth = 8; x.beginPath(); x.arc(cx, cy, r + 10 + (1 - c.flash) * 20, 0, 7); x.stroke(); }
  if (ph < 0) txt('先聽一下…', cx, cy + r + 50, 22 * Math.min(U, 1.2), ink);
  const dw = 30, sx = cx - (CAL_N - 1) * dw / 2;
  for (let k = 0; k < CAL_N; k++) { x.fillStyle = k < c.taps.length ? '#ff6fa8' : dark ? 'rgba(255,255,255,.3)' : 'rgba(160,120,150,.3)'; dot(x, sx + k * dw, cy + r + 90, 9); }
}
function draw() {
  const px = cv._mgScale || 1, key = `${W}x${H}:${px}:${song}:${diff}:${mode}:${demo}`;
  if (key !== layerKey) buildLayer();
  x.drawImage(layer, 0, 0, W, H);
  const tNow = songNowCache - OFFSET;
  // the whole stage breathes with the beat
  const b = beatNow(), pulse = state === 'play' && !paused ? Math.exp(-((b % 1 + 1) % 1) * 5) : 0;
  if (pulse > 0.02) { x.fillStyle = `rgba(255,255,255,${pulse * 0.08})`; x.fillRect(0, 0, W, H); }
  if (state === 'calib') { drawPupu(); drawCalib(); MG.fx.draw(x); return; }
  drawStageFx(tNow);
  drawBand();
  drawHitLine();
  drawPads(tNow);
  if (state === 'play' || state === 'end') drawNotes(tNow);
  MG.fx.draw(x);
  drawHudCached();
  drawPupu();
  drawCrowd();
  drawOverlays(tNow);
}

// =====================================================================
// main loop
// =====================================================================
let lastStat = '';
function hud2(force) {
  const s = state === 'play' || state === 'end' ? `${score} 分` : `⭐ ${Object.values(MG.store.get('rhythm.stars', {}) || {}).reduce((a, b) => a + (+b || 0), 0)}`;
  if (s === lastStat && !force) return; lastStat = s; MG.stat('a', s);
}
function update(dt) {
  t += dt; frameN++;
  if (frameN % 30 === 0) refreshLat();
  for (let k = 0; k < 4; k++) { padAnim[k] += dt; laneFlash[k] = Math.max(0, laneFlash[k] - dt * 4); }
  armsT += dt; moodT = Math.max(0, moodT - dt);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  for (const f of floats) f.life -= dt; if (floats.length && floats.some(f => f.life <= 0)) floats = floats.filter(f => f.life > 0);
  // stage life
  for (let k = 0; k < 2; k++) { const was = band.play[k]; band.play[k] = Math.max(0, was - dt * 3); if (was === 1 && bandPos[k] && Math.random() < 0.5) { const B = bandPos[k]; tunes.push({ x: B.x + B.dir * B.R * 0.9, y: B.y - B.R * 2.4, vx: B.dir * (10 + Math.random() * 20), s: B.R * 0.7, life: 1.1, col: MG.pick(['#ff6fa8', '#5aa8f0', '#ffb800', '#4cc96a', '#a07cf2']) }); } }
  band.cheer = Math.max(0, band.cheer - dt); band.oops = Math.max(0, band.oops - dt); band.sing = Math.max(0, band.sing - dt); crowdCheer = Math.max(0, crowdCheer - dt);
  for (const q of tunes) { q.life -= dt; q.y -= dt * 40; q.x += q.vx * dt + Math.sin(t * 5 + q.y * 0.05) * 0.4; }
  if (tunes.length && tunes[0].life <= 0) tunes = tunes.filter(q => q.life > 0);
  for (const c of confetti) { c.y += c.vy * dt; c.x += Math.sin(t * 2 + c.ph) * 30 * dt; c.rot += c.vr * dt; }
  if (state === 'play' || state === 'end') { songNowCache = songPos(); schedule(); }
  if (state === 'play') judgeStep();
  if (state === 'calib') {
    if (MG.panelOpen()) { calib = null; stopMusic(); state = 'menu'; }
    else if (calib) { calib.flash = Math.max(0, calib.flash - dt * 3); if (ac.currentTime - outLat > calib.t0 + calib.total * calib.ci + 0.4) finishCalib(); }
  }
  MG.fx.step(dt);
  hud2();
}

// =====================================================================
// menu
// =====================================================================
function bestOf(n) { const map = MG.store.get('rhythm.stars', {}) || {}, id = SONGS[n - 1].id; return Math.max(0, ...['easy', 'normal', 'hard'].map(d => +map[id + '.' + d] || 0)); }
function starLabel(n) {
  const s0 = SONGS[n - 1], best = bestOf(n), fx = Object.keys(s0.fx || {});
  return (s0.fin ? '👑 超級大合奏！' : '') + s0.ic + ' ' + s0.nm + (fx.length ? '（' + fx.map(k => FX_NEWS[k][0] + FX_NEWS[k][1]).join('、') + '）' : '') + (best ? ' ' + '⭐'.repeat(best) : '');
}
function songShort(n) { const b = bestOf(n), s0 = SONGS[n - 1]; return `${s0.fin ? '👑' : n}${s0.ic}<small>${'★'.repeat(b)}${'☆'.repeat(3 - b)}</small>`; }
const MENU = {
  id: 'rhythm', title: '噗噗節奏樂園', menuLabel: '☰ 選歌', levelsTitle: '選一首歌',
  html: '<p>跟著音樂敲果凍鼓！糖果掉到鼓上的時候<b>敲一下</b>，長長的糖果要<b>按住</b>。慢慢玩不會失敗，先看 ♪ 示範也可以 ^_^</p>' +
    '<p>36 首歌！越後面越好玩：👏 兩個鼓一起敲、👆 滑一下、🥁 連打、🌈 長長糖果、🐸 跳跳糖、👂 你敲我學、🚀 越來越快，最後還有 👑 三首超級大合奏！</p>',
  picks: [{ key: 'diff', title: '難度', def: 'easy', options: [{ id: 'easy', label: '🐣 簡單', sub: '2 個鼓' }, { id: 'normal', label: '⭐ 普通', sub: '3 個鼓' }, { id: 'hard', label: '🔥 困難', sub: '4 個鼓、長按' }] }],
  modesTitle: '想怎麼玩？',
  modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不會失敗' }, { id: 'challenge', label: '⭐ 挑戰', sub: '噗噗能量條' }],
  levels: { count: SONGS.length, max: SONGS.length, label: starLabel, short: songShort },
  extra: [{ label: '🎧 調整節拍', alt: true, on: () => startCalib() }],
  keys: '手指敲鼓（好幾根手指可以一起敲），整條都可以敲　電腦：<kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd>（簡單用 <kbd>F</kbd><kbd>J</kbd> 或空白鍵）',
  playing: () => state === 'play',
  onPause: () => pauseGame(),
  restore: () => resumeGame(),
  start: (m, lv, pk) => {
    mode = m === 'challenge' ? 'challenge' : 'relax';
    diff = pk && DIFFS[pk.diff] ? pk.diff : 'easy';
    startSong(lv - 1);
  },
};
function menu() {
  stopMusic(); runId++; calib = null; demo = false;
  if (paused) { paused = false; pendingResume = false; }
  state = 'menu';
  song = clamp(MG.store.get('rhythm.pickLevel', 1) - 1, 0, SONGS.length - 1);
  const d = MG.store.get('rhythm.pick.diff', 'easy'); diff = DIFFS[d] ? d : 'easy';
  SD = buildSong(song);
  layout();
  MG.choose(MENU);
  hud2(true);
}

cv.onfit = () => layout();
MG.fit(cv, (sw, sh) => {
  const l = sw > sh * 1.05;
  if (l) { const h = 560; return [Math.round(clamp(h * (sw - 12) / Math.max(1, sh - 12), 800, 1400)), h]; }
  const w = 480; return [w, Math.round(clamp(w * (sh - 12) / Math.max(1, sw - 12), 640, 1000))];
});
menu();

// ---------- hook for automated tests ----------
function toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; }
window.RH = {
  get state() { return state; }, get mode() { return mode; }, get diff() { return diff; }, get song() { return song; }, get demo() { return demo; }, get paused() { return paused; },
  get counts() { return { perfect: P, good: G, miss: M, combo, maxCombo, score, tailSum, holds: holdsN, energy, failed, acc: accNow() }; },
  get offset() { return OFFSET; }, get frames() { return frameN; }, get land() { return land; }, get calib() { return calib ? { taps: calib.taps.slice(), t0: calib.t0, ci: calib.ci } : null; },
  acState: () => ac ? ac.state : 'none', audioTime: () => ac ? ac.currentTime : 0, outLat: () => outLat,
  songPos: () => songPos(), inCount: () => !!inCount(),
  songs: () => SONGS.map((s, i) => { const d = buildSong(i); return { id: s.id, nm: s.nm, bpm: s.bpm, meter: s.meter, len: d.len, bars: d.bars, events: d.ev.length, melody: d.mel.length }; }),
  chart: (i, d) => makeChart(i, d).map(q => ({ ...q })),
  notes: () => notes.map(q => ({ t: q.t, lane: q.lane, end: q.end, st: q.st, hs: q.hs, frac: q.frac, dbl: !!q.dbl, roll: !!q.roll, swipe: !!q.swipe, hop: !!q.hop, from: q.from, ghost: !!q.ghost, taps: q.taps || 0, need: q.need || 0 })),
  fx: i => Object.keys(SONGS[i].fx || {}), count: () => SONGS.length, band: () => ({ ...band, play: band.play.slice(), crowdCheer, kinds: bandPos.map(b => b.kind) }),
  sections: i => buildSong(i).sections.map(q => ({ ...q })), callBars: i => buildSong(i).callBar.slice(),
  // finish the current song at once with every candy hit perfectly (tests / screenshots)
  win: () => { if (state !== 'play') return; for (const q of notes) if (!q.st && !q.ghost) { q.st = 1; P++; combo++; score += 100 + Math.min(combo, 50) * 2; if (q.end && !q.roll) { q.hs = 2; tailSum++; } } else if (q.ghost) q.st = 6; maxCombo = Math.max(maxCombo, combo); finishSong(); },
  lastPressLane: () => lastPressLane, swipes: () => swipes.size, bot: v => { botOn = !!v; },
  judgeLog: () => judgeLog.slice(),
  // the audio-clock time (ac.currentTime) at which a song-time t is heard on the hit line
  rawTimeOf: tt => songStart + (tt + OFFSET) / SPEED + outLat,
  setSpeed: k => { SPEED = k; }, setOffset: ms => { OFFSET = ms / 1000; MG.store.set('rhythm.offset', ms); },
  start: (i, o = {}) => { if (o.diff) diff = o.diff; if (o.mode) mode = o.mode; startSong(i, { demo: !!o.demo }); },
  menu: () => menu(), calibrate: () => startCalib(),
  dims: () => ({ W, H, land, laneW, lanesX, hitY, fieldTop, scale: cv.getBoundingClientRect().width / W, n: nLanes() }),
  lanePoint: (i, fy = 0.5) => { const y = fieldTop + (hitY - fieldTop) * fy; return toClient(laneXat(i, y), y); },
  padRect: i => { const a = toClient(lanesX + laneW * i, hitY - padRx * 0.4), b = toClient(lanesX + laneW * (i + 1), padBottom); return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y }; },
  demoPoint: () => toClient(demoB.x + demoB.w / 2, demoB.y + demoB.h / 2),
  demoRect: () => { const a = toClient(demoB.x, demoB.y), b = toClient(demoB.x + demoB.w, demoB.y + demoB.h); return { x: a.x, y: a.y, w: b.x - a.x, h: b.y - a.y }; },
  // direct judge calls (song time, already offset-adjusted) for deterministic tests
  pressAt: (lane, tj, src = 'test') => press(lane, tj, src), releaseAt: (src, tj) => release(src, tj),
  stars: () => MG.store.get('rhythm.stars', {}),
  // render benchmark: n update+draw steps, flushed (ms)
  bench: n => { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); draw(); } x0ctx.getImageData(0, 0, 1, 1); return performance.now() - t0; },
  floats: () => floats.map(f => f.text), banner: () => banner && { ...banner },
};

MG.loop(dt => { update(dt); draw(); });
</script>
