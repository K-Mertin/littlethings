<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>十乘十方塊</title>
<link rel="stylesheet" href="mini.css">
<style>.mg-over{align-items:flex-start}.mg-card{margin:auto}</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'blocks', title: '十乘十方塊', stats: ['score', 'best'] });
const N = 10, cv = document.getElementById('cv'), x = cv.getContext('2d');
const FONT = '"Noto Sans TC",system-ui,sans-serif';
let land = false, CELL = 32, U = 1, L = { bx: 20, by: 58, slots: [], tip: null, goal: null };

// ================= levels =================
// goal: lines = clear n lines · gems = clear every 💎 block · stones = clear every 🪨 block · paint = cover every ⭐ cell once
// map (10 rows): . empty  # wooden block  s stone  g gem block  * star cell to cover
// shapes: only these piece kinds (indexes into SHAPES) — the 🧩 levels
const BARS = [0, 1, 2, 3, 4, 5, 6, 7, 8], SQUARES = [0, 9, 10], CORNERS = [0, 11, 12, 13, 14, 15, 16, 17, 18], BIG = [7, 8, 9, 10, 15, 16, 17, 18];
const E10 = '..........';
const LEVELS = [
  { goal: 'lines', n: 3 },
  { goal: 'paint', map: [E10, E10, E10, '..**..**..', '.********.', '.********.', '..******..', '...****...', '....**....', E10] },
  { goal: 'gems', map: [E10, E10, E10, E10, E10, E10, E10, '##.g##....', E10, '#g###...#g'] },
  { goal: 'stones', map: [E10, E10, E10, E10, E10, E10, E10, E10, 'ss.sss.sss', 'sss.ssss.s'] },
  { goal: 'lines', n: 4, shapes: BARS },
  { goal: 'lines', n: 6, map: [E10, E10, E10, E10, E10, '#.........', '##........', '###.......', '####......', '#####.....'] },
  { goal: 'paint', map: ['....**....', '....**....', '...****...', '**********', '.********.', '..******..', '..******..', '.***..***.', '.**....**.', E10] },
  { goal: 'gems', map: [E10, E10, '....g.....', E10, E10, '##.g####.#', E10, 'g.........', '####.g####', '#.###.#g##'] },
  { goal: 'stones', map: [E10, '..ss..ss..', '..ss..ss..', E10, E10, '.s......s.', '..s....s..', '...ssss...', E10, E10] },
  { goal: 'lines', n: 5, shapes: SQUARES },
  { goal: 'paint', map: [E10, '...****...', '..******..', '.***..***.', '.**....**.', '.**....**.', '.***..***.', '..******..', '...****...', E10] },
  { goal: 'gems', map: [E10, E10, E10, 's...g....s', E10, 's.g....g.s', E10, 'ssss..ssss', 'g.ss..ss.g', 'ssss..ssss'] },
  { goal: 'stones', shapes: CORNERS, map: [E10, E10, E10, E10, E10, E10, 's.s.s.s.s.', 'ss.ss.ss.s', E10, 's.ss.ss.ss'] },
  { goal: 'lines', n: 10 },
  { goal: 'stones', shapes: BARS, map: [E10, E10, E10, E10, 's.s.s.s.s.', 's.s.s.s.s.', 's.s.s.s.s.', 's.s.s.s.s.', 's.s.s.s.s.', 's.s.s.s.s.'] },
  { goal: 'paint', map: ['....**....', '...****...', '..******..', '.********.', '**********', '.********.', '.**.**.**.', '.**.**.**.', '.**.**.**.', '.********.'] },
  { goal: 'gems', map: ['g........g', E10, '...g..g...', E10, '.g......g.', E10, '...g..g...', E10, E10, '#########.'] },
  { goal: 'lines', n: 6, shapes: BIG },
  { goal: 'stones', map: [E10, E10, E10, E10, E10, '....ss....', '...ssss...', '..ssssss..', '.ssssssss.', 'ssss..ssss'] },
  { goal: 'lines', n: 15, map: [E10, E10, E10, E10, E10, E10, '#.#.#.#.#.', '.#.#.#.#.#', '#.#.#.#.#.', '.#.#.#.#.#'] },
];
const GOAL_IC = { lines: '🧹', gems: '💎', stones: '🪨', paint: '⭐' };
const GOAL_NM = { lines: '消行', gems: '收集寶石', stones: '清除石頭', paint: '鋪滿星星' };
const lvShape = n => LEVELS[n - 1].shapes;
const lvTotal = lv => lv.goal === 'lines' ? lv.n : lv.map.join('').split('').filter(ch => ch === { gems: 'g', stones: 's', paint: '*' }[lv.goal]).length;
const lvName = n => { const lv = LEVELS[n - 1]; return `${GOAL_IC[lv.goal]} ${GOAL_NM[lv.goal]} ${lvTotal(lv)}${lv.goal === 'lines' ? ' 行' : ' 個'}${lv.shapes ? '・🧩 特定方塊' : ''}${lv.map && lv.goal !== 'stones' && /[#s]/.test(lv.map.join('')) ? '・有障礙' : ''}`; };
const lvShort = n => { const lv = LEVELS[n - 1]; return `${n}${lv.shapes ? '🧩' : GOAL_IC[lv.goal]}`; };

// the canvas takes the whole stage (1 logical px ≈ 1 CSS px); the board and the tray are sized from it
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  const W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  const H = Math.max(260, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  land = W > H * 1.1; return [W, H];
});
let mode = 'endless', level = 1, LV = null;
function layout() {
  const W = cv.lw, H = cv.lh, g = 10, fr = 12;            // fr: room for the wooden frame around the board
  U = Math.max(1, Math.min(1.6, Math.min(W, H) / 420)) * MG.textScale;
  const slots = [], lvl = mode === 'levels';
  if (land) {
    CELL = Math.floor(Math.min((H - fr * 2 - g * 2) / N, (W * 0.66 - fr * 2 - g) / N));
    const bw = N * CELL, trayW = Math.min(Math.max(150, W - bw - fr * 2 - g * 4), Math.round(bw * 0.62));
    const used = bw + fr * 2 + g * 2 + trayW, x0 = Math.round((W - used) / 2);
    L.bx = x0 + fr; L.by = Math.round((H - bw) / 2);
    const tx = L.bx + bw + fr + g * 2, gh = lvl ? Math.round(Math.min(64, 44 * U)) : 0, top = L.by - fr + (gh ? gh + g : 0);
    const sh = Math.floor((bw + fr * 2 - g * 2 - (gh ? gh + g : 0)) / 3);
    for (let i = 0; i < 3; i++) slots.push({ x: tx, y: top + i * (sh + g), w: trayW, h: sh });
    L.tip = null; L.goal = gh ? { x: tx, y: L.by - fr, w: trayW, h: gh } : null;
  } else {
    const tipH = Math.round((lvl ? 30 : 18) * U + 14), sw = Math.floor((W - g * 4) / 3);
    let trayH = Math.round(Math.max(100, Math.min(sw * 1.1, H * 0.22)));
    CELL = Math.floor(Math.min((W - fr * 2 - g * 2) / N, (H - tipH - trayH - fr * 2 - g * 3) / N));
    const bw = N * CELL;
    trayH = Math.round(Math.max(trayH, Math.min(sw * 1.3, H - tipH - bw - fr * 2 - g * 3)));
    const used = tipH + bw + fr * 2 + g + trayH, y0 = Math.max(0, Math.round((H - used) / 2));
    L.tip = { y: y0 + tipH / 2, h: tipH };
    L.goal = lvl ? { x: g, y: y0 + 2, w: W - g * 2, h: tipH - 6 } : null;
    L.bx = Math.round((W - bw) / 2); L.by = y0 + tipH + fr;
    const ty = L.by + bw + fr + g;
    for (let i = 0; i < 3; i++) slots.push({ x: g + i * (sw + g), y: ty, w: sw, h: trayH });
  }
  L.slots = slots;
}
cv.onfit = layout; layout();
addEventListener('mg-big', layout);
const BX = () => L.bx, BY = () => L.by;
const slotRect = (i) => L.slots[i];

const SHAPES = [
  ['#ffb72b', [[0, 0]]],
  ['#ff8a5c', [[0, 0], [1, 0]]], ['#ff8a5c', [[0, 0], [0, 1]]],
  ['#ff6fb5', [[0, 0], [1, 0], [2, 0]]], ['#ff6fb5', [[0, 0], [0, 1], [0, 2]]],
  ['#ff5a4e', [[0, 0], [1, 0], [2, 0], [3, 0]]], ['#ff5a4e', [[0, 0], [0, 1], [0, 2], [0, 3]]],
  ['#d9474a', [[0, 0], [1, 0], [2, 0], [3, 0], [4, 0]]], ['#d9474a', [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]]],
  ['#4cc96a', [[0, 0], [1, 0], [0, 1], [1, 1]]],
  ['#3db7c9', [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2]]],
  ['#3d9bff', [[0, 0], [1, 0], [0, 1]]], ['#3d9bff', [[0, 0], [1, 0], [1, 1]]], ['#3d9bff', [[0, 1], [1, 0], [1, 1]]], ['#3d9bff', [[0, 0], [0, 1], [1, 1]]],
  ['#8a63ff', [[0, 0], [1, 0], [2, 0], [0, 1], [0, 2]]], ['#8a63ff', [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]]],
  ['#8a63ff', [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]]], ['#8a63ff', [[2, 0], [2, 1], [2, 2], [1, 2], [0, 2]]],
];
// weights: small pieces a bit more common, 3x3 rare
const WEIGHT = [3, 3, 3, 3, 3, 2, 2, 1.2, 1.2, 3, 0.9, 2, 2, 2, 2, 1.2, 1.2, 1.2, 1.2];
const STONE = '#a3abb6', GEM = '#bfe3ff', WOOD = '#d9a35f';
const mkPiece = i => { const [col, cells] = SHAPES[i]; return { k: i, col, cells, w: Math.max(...cells.map(c => c[0])) + 1, h: Math.max(...cells.map(c => c[1])) + 1 }; };
function randPiece(allow) {
  const ids = allow || SHAPES.map((_, i) => i);
  let r = Math.random() * ids.reduce((a, i) => a + WEIGHT[i], 0), j = 0;
  while ((r -= WEIGHT[ids[j]]) > 0 && j < ids.length - 1) j++;
  return mkPiece(ids[j]);
}

let placedAt, bits = [], spec, paint;
let grid, tray, score, combo, state = 'ready', drag = null, ghost = null, fx = [], pops = [], t = 0, sel = 0, cur = { x: 3, y: 3 }, kbMode = false;
let got = 0, need = 0, pieces = 0, flyers = [], goalPulse = 0, stuckT = 0;
function reset() {
  grid = Array.from({ length: N }, () => Array(N).fill(null));
  placedAt = Array.from({ length: N }, () => Array(N).fill(null)); bits = [];
  spec = Array.from({ length: N }, () => Array(N).fill(null));
  paint = Array.from({ length: N }, () => Array(N).fill(0));
  score = 0; combo = 0; fx = []; pops = []; drag = null; ghost = null; sel = 0; cur = { x: 3, y: 3 }; flyers = []; stuckT = 0;
  got = 0; pieces = 0; need = 0;
  if (mode === 'levels') {
    LV = LEVELS[level - 1]; need = lvTotal(LV);
    if (LV.map) LV.map.forEach((row, r) => [...row].forEach((ch, c) => {
      if (ch === '#') grid[r][c] = WOOD;
      else if (ch === 's') { grid[r][c] = STONE; spec[r][c] = 's'; }
      else if (ch === 'g') { grid[r][c] = GEM; spec[r][c] = 'g'; }
      else if (ch === '*') paint[r][c] = 1;
    }));
  } else LV = null;
  refill(); hud();
}
const allowed = () => LV && LV.shapes;
function refill() { tray = [randPiece(allowed()), randPiece(allowed()), randPiece(allowed())]; }
function hud() {
  if (mode === 'levels') { MG.stat('score', `${GOAL_IC[LV.goal]} ${Math.min(got, need)}/${need}`); MG.stat('best', `第 ${level} 關`); }
  else { MG.stat('score', `${score} 分`); MG.stat('best', `最高 ${Math.max(score, MG.best('blocks') ?? 0)}`); }
}
function fits(p, gx, gy, G = grid) { return p.cells.every(([a, b]) => { const cx = gx + a, cy = gy + b; return cx >= 0 && cy >= 0 && cx < N && cy < N && !G[cy][cx]; }); }
function canPlaceAnywhere(p, G = grid) { for (let y = 0; y < N; y++) for (let x2 = 0; x2 < N; x2++) if (fits(p, x2, y, G)) return true; return false; }
const cellCenter = (c, r) => ({ x: BX() + c * CELL + CELL / 2, y: BY() + r * CELL + CELL / 2 });
function goalTarget() { const gR = L.goal; return gR ? { x: gR.x + gR.w / 2, y: gR.y + gR.h / 2 } : { x: cv.lw / 2, y: 20 }; }
function collect(c, r, ic) {
  const p = cellCenter(c, r), tg = goalTarget();
  flyers.push({ x0: p.x, y0: p.y, x1: tg.x, y1: tg.y, t: -Math.random() * 0.12, ic });
}

function place(i, gx, gy) {
  const p = tray[i];
  if (!p || !fits(p, gx, gy) || state !== 'play') return false;
  for (const [a, b] of p.cells) { grid[gy + b][gx + a] = p.col; placedAt[gy + b][gx + a] = t; }
  score += p.cells.length; pieces++; MG.sfx('place');
  tray[i] = null;
  // ⭐ cells: covered once = done (they stay golden even after the line clears)
  if (mode === 'levels' && LV.goal === 'paint') {
    let n = 0;
    for (const [a, b] of p.cells) if (paint[gy + b][gx + a] === 1) { paint[gy + b][gx + a] = 2; n++; got++; collect(gx + a, gy + b, '⭐'); }
    if (n) { MG.sfx('coin'); if (n >= 3) MG.sfx('sparkle'); goalPulse = 0.4; }
  }
  // clear full rows and columns
  const rows = [], cols = [];
  for (let k = 0; k < N; k++) { if (grid[k].every(Boolean)) rows.push(k); if (grid.every(r => r[k])) cols.push(k); }
  const lines = rows.length + cols.length;
  if (lines) {
    combo++;
    const burst = (c, r) => { for (let k = 0; k < 3; k++) bits.push({ x: BX() + c * CELL + CELL / 2, y: BY() + r * CELL + CELL / 2, vx: MG.rand(-140, 140), vy: MG.rand(-260, -60), a: MG.rand(0, 6), va: MG.rand(-8, 8), s: MG.rand(4, 8), col: grid[r][c], life: MG.rand(0.5, 0.9) }); };
    for (const r of rows) for (let c = 0; c < N; c++) burst(c, r);
    for (const c of cols) for (let r = 0; r < N; r++) if (!rows.includes(r)) burst(c, r);
    for (const r of rows) for (let c = 0; c < N; c++) fx.push({ c, r, col: grid[r][c], life: 0.35 });
    for (const c of cols) for (let r = 0; r < N; r++) fx.push({ c, r, col: grid[r][c], life: 0.35 });
    const gone = new Set();
    for (const r of rows) for (let c = 0; c < N; c++) gone.add(r * N + c);
    for (const c of cols) for (let r = 0; r < N; r++) gone.add(r * N + c);
    let found = 0;
    for (const k of gone) {
      const r = (k / N) | 0, c = k % N;
      if (mode === 'levels' && spec[r][c] && spec[r][c] === { gems: 'g', stones: 's' }[LV.goal]) { got++; found++; collect(c, r, spec[r][c] === 'g' ? '💎' : '🪨'); }
      grid[r][c] = null; spec[r][c] = null;
    }
    if (mode === 'levels' && LV.goal === 'lines') { got += lines; goalPulse = 0.4; }
    if (found) { MG.sfx('coin'); MG.sfx('sparkle'); goalPulse = 0.4; }
    const pts = [0, 10, 30, 60, 100, 150, 210][Math.min(6, lines)] * (combo > 1 ? combo : 1);
    score += pts;
    // layered clear sound: a chime that rises with lines + streak, combo bells on a streak, a whoosh as the row flies off
    MG.sfx('match', lines + combo - 1); MG.sfx('whoosh'); if (combo >= 2) MG.sfx('combo', combo); if (lines >= 2) MG.sfx('sparkle');
    const msg = combo > 1 ? MG.WORDS.combo(combo) : lines >= 3 ? MG.praise(4) : lines === 2 ? 'Double! ✌️' : MG.praise(1);
    pops.push({ x: BX() + gx * CELL + p.w * CELL / 2, y: BY() + gy * CELL, t: mode === 'levels' ? (found ? `${found > 1 ? found + '×' : ''}${LV.goal === 'gems' ? '💎' : '🪨'}` : LV.goal === 'lines' ? `🧹 ${Math.min(got, need)}/${need}` : '✨') : `+${pts}`, sub: msg, life: 1.1 });
  } else combo = 0;
  if (tray.every(q => !q)) refill();
  sel = tray.findIndex(Boolean);
  hud();
  if (mode === 'levels' && got >= need) { setTimeout(levelWon, 700); state = 'won'; return true; }
  if (!tray.some(q => q && canPlaceAnywhere(q))) {
    if (mode === 'levels') stuckT = 0.7;           // levels never end: new pieces that fit arrive instead
    else setTimeout(gameOver, 600);
  }
  return true;
}
// 闖關: when nothing fits, swap the tray for pieces that do (a 1×1 always fits somewhere)
function rescue() {
  if (state !== 'play' || tray.some(q => q && canPlaceAnywhere(q))) return;
  for (let i = 0; i < 3; i++) {
    let p = null;
    for (let k = 0; k < 40 && !p; k++) { const q = randPiece(allowed()); if (canPlaceAnywhere(q)) p = q; }
    tray[i] = p || mkPiece(0);
  }
  sel = 0; MG.sfx('whoosh'); MG.toast(MG.WORDS.stuck + ' ✨', 1300);
}

// ---------- input ----------
// Touch: the piece floats well above the fingertip (its bottom edge ~56 screen px above the finger),
// so neither the finger nor the floating piece hides the landing cells. Mouse: piece sits under the cursor.
const screenToLogical = () => { const r = cv.getBoundingClientRect(); return cv.lw / Math.max(1, r.width - 6); };
function liftFor(pc) { return drag && drag.touch ? pc.h * CELL / 2 + 56 * screenToLogical() : 0; }
function trayHit(p) {
  // generous hit area: the whole slot plus a margin, so small pieces are easy to grab with a finger
  for (let i = 0; i < 3; i++) { const s = slotRect(i); if (tray[i] && p.x >= s.x - 6 && p.x <= s.x + s.w + 6 && p.y >= s.y - 10 && p.y <= s.y + s.h + 10) return i; }
  return -1;
}
function ghostFrom(p) {
  const pc = tray[drag.i];
  const fx0 = p.x - pc.w * CELL / 2, fy0 = p.y - liftFor(pc) - pc.h * CELL / 2;   // floating piece top-left
  const gx = Math.round((fx0 - BX()) / CELL), gy = Math.round((fy0 - BY()) / CELL);
  return { gx, gy, fx: fx0, fy: fy0, ok: fits(pc, gx, gy) };
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = cv.logical(e), i = trayHit(p);
  kbMode = false;
  if (i < 0) return;
  try { cv.setPointerCapture(e.pointerId); } catch {}
  drag = { i, x: p.x, y: p.y, touch: e.pointerType !== 'mouse', t: 0 }; sel = i; ghost = ghostFrom(p); MG.sfx('flip');
});
cv.addEventListener('pointermove', e => {
  if (!drag) return; const p = cv.logical(e); drag.x = p.x; drag.y = p.y;
  const g = ghostFrom(p); if (g.ok && (!ghost || !ghost.ok || g.gx !== ghost.gx || g.gy !== ghost.gy)) MG.sfx('tick'); ghost = g;
});
cv.addEventListener('pointerup', e => {
  if (!drag) return;
  const g = ghostFrom(cv.logical(e));
  if (g.ok) place(drag.i, g.gx, g.gy); else MG.sfx('miss');
  drag = null; ghost = null;
});
cv.addEventListener('pointercancel', () => { drag = null; ghost = null; });
addEventListener('keydown', e => {
  if (state !== 'play') return;
  const k = e.key;
  if (['1', '2', '3'].includes(k) && tray[+k - 1]) { sel = +k - 1; kbMode = true; }
  else if (k === 'Tab') { e.preventDefault(); for (let j = 1; j <= 3; j++) { const n = (sel + j) % 3; if (tray[n]) { sel = n; break; } } kbMode = true; }
  else if (k === 'ArrowLeft') { cur.x--; kbMode = true; } else if (k === 'ArrowRight') { cur.x++; kbMode = true; }
  else if (k === 'ArrowUp') { cur.y--; kbMode = true; e.preventDefault(); } else if (k === 'ArrowDown') { cur.y++; kbMode = true; e.preventDefault(); }
  else if ((k === 'Enter' || k === ' ') && kbMode && tray[sel]) { e.preventDefault(); if (!place(sel, cur.x, cur.y)) MG.sfx('miss'); }
  else return;
  const pc = tray[sel]; if (pc) { cur.x = Math.max(0, Math.min(N - pc.w, cur.x)); cur.y = Math.max(0, Math.min(N - pc.h, cur.y)); }
});

// ---------- draw ----------
const shade = (hex, k) => { // k<0 darker, k>0 lighter
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
};
function block(px, py, s, col, alpha = 1) {
  x.globalAlpha = alpha;
  const r = s * 0.2;
  // body with vertical gradient
  const g = x.createLinearGradient(0, py, 0, py + s); g.addColorStop(0, shade(col, 0.25)); g.addColorStop(1, shade(col, -0.18));
  x.fillStyle = shade(col, -0.35); x.beginPath(); x.roundRect(px + 1, py + 2, s - 2, s - 2, r); x.fill();          // bottom lip
  x.fillStyle = g; x.beginPath(); x.roundRect(px + 1, py + 1, s - 2, s - 3.5, r); x.fill();
  // bevel: lighter top-left edge, inner face
  x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = Math.max(1, s * 0.05);
  x.beginPath(); x.roundRect(px + 2.2, py + 2.2, s - 4.4, s - 6, r * 0.8); x.stroke();
  const ig = x.createLinearGradient(0, py + s * 0.22, 0, py + s * 0.78); ig.addColorStop(0, shade(col, 0.08)); ig.addColorStop(1, shade(col, -0.06));
  x.fillStyle = ig; x.beginPath(); x.roundRect(px + s * 0.22, py + s * 0.2, s * 0.56, s * 0.52, r * 0.6); x.fill();
  // gloss + sparkle
  x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.ellipse(px + s * 0.34, py + s * 0.26, s * 0.14, s * 0.06, -0.5, 0, 7); x.fill();

  MG.choose({
    id: 'blocks', title: '十乘十方塊',
    html: `<p>把下面的方塊拖進 10×10 的格子。排滿一整行或一整列就會消掉！方塊不能旋轉，先想好再放 ^_^</p><p><b>🎯 闖關</b>：每關一個小任務——🧹 消掉幾行、💎 收集寶石、🪨 清除石頭、⭐ 鋪滿星星、🧩 只有特定方塊。放不下也不會輸！<br><b>♾️ 無限模式</b>：一直玩到放不下，挑戰最高分。</p>`,
    keys: '拖曳方塊　鍵盤：<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 選方塊、方向鍵移動、<kbd>Enter</kbd> 放下',
    modesTitle: '怎麼玩？',
    modes: [{ id: 'levels', label: '🎯 闖關', sub: `${LEVELS.length} 關小任務・不會輸` }, { id: 'endless', label: '♾️ 無限模式', sub: `最高 ${MG.best('blocks') ?? 0} 分` }],
    levelsTitle: '闖關從哪一關開始？',
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${lvName(n)}${done[n] != null ? '・✓' : ''}）`, short: lvShort },
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),
  });
}
reset();
// greedy helper used by the tests: picks a placement that clears lines / reaches the goal
function bestMove() {
  let best = null;
  for (let i = 0; i < 3; i++) {
    const p = tray[i]; if (!p) continue;
    for (let gy = 0; gy <= N - p.h; gy++) for (let gx = 0; gx <= N - p.w; gx++) {
      if (!fits(p, gx, gy)) continue;
      const tmp = grid.map(r => r.slice()); for (const [a, b] of p.cells) tmp[gy + b][gx + a] = 1;
      let s = Math.random() * 0.5, lines = 0;
      for (let k = 0; k < N; k++) {
        const rowN = tmp[k].filter(Boolean).length, colN = tmp.filter(r => r[k]).length;
        if (rowN === N) { lines++; for (let c = 0; c < N; c++) if (spec[k][c]) s += 30; } else s += rowN * rowN * 0.05 * (spec[k].some(Boolean) ? 3 : 1);
        if (colN === N) { lines++; for (let r = 0; r < N; r++) if (spec[r][k]) s += 30; } else s += colN * colN * 0.05 * (spec.some(r => r[k]) ? 3 : 1);
      }
      s += lines * 20;
      for (const [a, b] of p.cells) if (paint[gy + b][gx + a] === 1) s += 12;
      s += p.cells.length * 0.3;
      if (!best || s > best.s) best = { i, gx, gy, s };
    }
  }
  return best;
}
window.BKT = {
  get state() { return state; }, get mode() { return mode; }, get level() { return level; }, get got() { return got; }, get need() { return need; }, get pieces() { return pieces; },
  count: LEVELS.length, levels: () => LEVELS.map((l, i) => ({ n: i + 1, goal: l.goal, need: lvTotal(l), shapes: !!l.shapes, name: lvName(i + 1) })),
  pops: () => pops.map(p => [p.t, p.sub]), place: (i, gx, gy) => place(i, gx, gy), tray: () => tray.map(p => p && p.cells), trayKinds: () => tray.map(p => p && p.k),
  start: (m, lv) => start(m, lv), bestMove, rescue: () => rescue(),
  // play the current level with the greedy helper until it is won (or maxN pieces); returns pieces used
  autoplay(maxN = 800) { let n = 0; while (state === 'play' && n < maxN) { const m = bestMove(); if (!m) { stuckT = 0; rescue(); if (!bestMove()) return -1; continue; } place(m.i, m.gx, m.gy); n++; if (stuckT > 0) { stuckT = 0; rescue(); } } return state === 'won' ? pieces : -n; },
  setGrid(fn) { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c] = fn(r, c); }, setTray(cells) { tray = cells.map(cs => cs && { col: '#4cc96a', cells: cs, w: Math.max(...cs.map(c => c[0])) + 1, h: Math.max(...cs.map(c => c[1])) + 1 }); },
};
menu();
MG.loop(dt => {
  t += dt;
  for (const f of fx) f.life -= dt; fx = fx.filter(f => f.life > 0);
  for (const q of bits) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 900 * dt; q.a += q.va * dt; q.life -= dt; } bits = bits.filter(q => q.life > 0);
  for (const p of pops) { p.y -= 30 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  for (const f of flyers) f.t += dt; flyers = flyers.filter(f => f.t < 0.6);
  goalPulse = Math.max(0, goalPulse - dt);
  if (stuckT > 0 && !MG.panelOpen()) { stuckT -= dt; if (stuckT <= 0) rescue(); }
  MG.fx.step(dt);
  draw();
  MG.fx.draw(x);
});
</script>
