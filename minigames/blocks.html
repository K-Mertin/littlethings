<script>
'use strict';
MG.init({ id: 'blocks', title: '十乘十方塊', stats: ['score', 'best'] });
const N = 10, cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const FONT = '"Noto Sans TC",system-ui,sans-serif', EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let land = false, CELL = 32, U = 1, L = { bx: 20, by: 58, fr: 12, slots: [], card: null, hero: null };
const rng = s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let q = Math.imul(s ^ s >>> 15, 1 | s); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; };

// ================= levels (append-only: never renumber, saved ✓ marks use the level number) =================
// goal: lines = clear n lines · gems = clear every 💎 block · stones = clear every 🪨 block · paint = cover every ⭐ cell once
// map (10 rows): . empty  # wooden block  s stone  g gem block  * star cell  i ice block (2 clears)  x not part of the board
//                R Y G B P a candy block of that colour already on the board
// goals: { lines: n, gems: true (= all), stones: true, paint: true, ice: true, c_r: n (clear n red candies) … } — several at once
// cols: the candy colours pieces come in (colour levels) · shapes: only these piece kinds (indexes into SHAPES) — the 🧩 levels
// pic: a picture to fill (colour codes, . = outside) · chunk: biggest piece size · hint: tint the cells with the picture's colours
const BARS = [0, 1, 2, 3, 4, 5, 6, 7, 8], SQUARES = [0, 9, 10], CORNERS = [0, 11, 12, 13, 14, 15, 16, 17, 18], BIG = [7, 8, 9, 10, 15, 16, 17, 18];
const E10 = '..........';
const LEVELS = [

  { goals: { ice: true }, theme: 'snow', map: [E10, E10, E10, E10, 'i........i', '.i......i.', '..i....i..', '...i..i...', '....ii....', 'ii......ii'] },
  { goals: { lines: 10 }, theme: 'room', map: [E10, E10, E10, '...xxxx...', '...xxxx...', '...xxxx...', '...xxxx...', E10, E10, E10] },
  { pic: ['...kkkk...', '..kkkkkk..', '..kkyykk..', '..kkyykk..', '..kkkkkk..', '...kkkk...', '....dd....', '.gg.dd.gg.', '..ggddgg..', '....dd....'], chunk: 4, hint: false, name: '小花', ic: '🌷', theme: 'meadow' },
  { goals: { c_p: 20 }, cols: 'rpbg', shapes: CORNERS, theme: 'candy', map: [E10, E10, E10, E10, E10, E10, E10, E10, 'P..P..P..P', '.P..P..P..'] },
  { goals: { ice: true, lines: 6 }, theme: 'beach', map: [E10, 'x........x', 'xx......xx', 'xxx.ii.xxx', 'xxxx..xxxx', 'xxxx..xxxx', 'xxx.ii.xxx', 'xx......xx', 'x........x', E10] },
  { pic: ['....rr....', '...rrrr...', '...eeee...', '...esse...', '...esse...', '...eeee...', '..reeeer..', '.rreeeerr.', '.r.oyyo.r.', '....oo....'], chunk: 4, hint: false, name: '火箭', ic: '🚀', theme: 'night' },
  { goals: { gems: true, ice: true, lines: 8 }, finale: true, theme: 'candy', map: ['x...xx...x', '.g......g.', E10, '...i..i...', E10, 'x..i..i..x', 'xx..gg..xx', 'xxx....xxx', 'xxxx..xxxx', 'xxxxxxxxxx'] },
  { goals: { c_r: 12, ice: true, stones: true }, finale: true, cols: 'rybp', theme: 'snow', map: [E10, E10, E10, E10, E10, E10, '..s....s..', '.i..RR..i.', 'i.s....s.i', 'RRii..iiRR'] },
  { goals: { gems: true, ice: true, stones: true, c_y: 10 }, finale: true, cols: 'yrbg', theme: 'night', map: ['xxxx..xxxx', 'xxx.gg.xxx', 'xx..i...xx', 'x..s..s..x', '.i......i.', '.i......i.', 'x..s..s..x', 'xx...i..xx', 'xxx.gg.xxx', 'xxxx..xxxx'] },
];
const CANDY = { r: '#ff5f6d', y: '#ffc53a', g: '#5ccf6a', b: '#4ba6ff', p: '#a97cff' };
const CANDY_NM = { r: '紅色', y: '黃色', g: '綠色', b: '藍色', p: '紫色' }, CANDY_EM = { r: '🔴', y: '🟡', g: '🟢', b: '🔵', p: '🟣' };
const PIC_COL = { r: '#ff5a5f', o: '#ff9a3c', y: '#ffd23f', g: '#5cc96a', d: '#2f9e57', b: '#3d8bff', s: '#8fd3ff', p: '#a77bff', k: '#ff8fc2', w: '#b9773f', e: '#eef2f7', n: '#33406e' };
const GOAL_IC = { lines: '🧹', gems: '💎', stones: '🪨', paint: '⭐', ice: '🧊', pic: '🖼️' };
const GOAL_NM = { lines: '消行', gems: '收集寶石', stones: '清除石頭', paint: '鋪滿星星', ice: '打破冰塊', pic: '拼圖畫' };
const MAPCH = { gems: 'g', stones: 's', paint: '*', ice: 'i' };
const goalIc = k => k.startsWith('c_') ? CANDY_EM[k[2]] : GOAL_IC[k];
const goalNm = k => k.startsWith('c_') ? `收集${CANDY_NM[k[2]]}糖果` : GOAL_NM[k];
function goalsOf(lv) {
  if (lv.pic) return [{ k: 'pic', need: lv.pic.join('').replace(/\./g, '').length }];
  const g = lv.goals || { [lv.goal]: lv.goal === 'lines' ? lv.n : true };
  return Object.entries(g).map(([k, v]) => ({ k, need: v === true ? lv.map.join('').split('').filter(ch => ch === MAPCH[k]).length : v }));
}
const lvTotal = lv => goalsOf(lv).reduce((a, g) => a + g.need, 0);
const lvBoard = lv => !!(lv.map && lv.map.join('').includes('x'));
// the level's main "way to play" (for the intro panels, menu marks and the title in the card)
function lvType(lv) {
  if (lv.pic) return 'picture'; if (lv.finale) return 'finale'; if (lvBoard(lv)) return 'board';
  const ks = goalsOf(lv).map(g => g.k);
  if (ks.some(k => k.startsWith('c_'))) return 'color'; if (ks.includes('ice')) return 'ice';
  return lv.shapes ? 'shapes' : ks[0];
}
const TYPE_IC = { board: '🔷', color: '🍬', picture: '🖼️', ice: '🧊', finale: '🏆', shapes: '🧩' };
const TYPE_NM = { board: '形狀棋盤', color: '糖果顏色', picture: '拼圖畫', ice: '打破冰塊', finale: '大挑戰', shapes: '特定方塊' };
function lvName(n) {
  const lv = LEVELS[n - 1];
  if (n <= 20) return `${GOAL_IC[lv.goal]} ${GOAL_NM[lv.goal]} ${lvTotal(lv)}${lv.goal === 'lines' ? ' 行' : ' 個'}${lv.shapes ? '・🧩 特定方塊' : ''}${lv.map && lv.goal !== 'stones' && /[#s]/.test(lv.map.join('')) ? '・有障礙' : ''}`;
  if (lv.pic) return `🖼️ 拼出${lv.name} ${lv.ic}${lv.hint ? '' : '・只有影子'}`;
  const ty = lvType(lv), gs = goalsOf(lv).map(g => `${goalIc(g.k)} ${g.k === 'lines' ? g.need + ' 行' : goalNm(g.k) + ' ' + g.need}`).join('＋');
  return `${['board', 'finale'].includes(ty) ? TYPE_IC[ty] + ' ' + TYPE_NM[ty] + '・' : ''}${gs}${lv.shapes ? '・🧩' : ''}`;
}
const lvShort = n => { const lv = LEVELS[n - 1]; if (n <= 20) return `${n}${lv.shapes ? '🧩' : GOAL_IC[lv.goal]}`; return `${n}${TYPE_IC[lvType(lv)] || goalIc(goalsOf(lv)[0].k)}`; };

// ================= themes: a scene behind the toy box, the box paint, confetti =================
const THEMES = {
  room: { name: '玩具房', em: '🧸', frame: '#ff7f6e', frameD: '#c94f45', lining: '#fff4de', sock: '#f2dcb4', accent: '#ff9b7a', conf: ['#ff5a4e', '#ffd23f', '#4cc96a', '#3d9bff', '#ff6fb5'], shape: 'sq' },
  meadow: { name: '花草原', em: '🌼', frame: '#5cbf6a', frameD: '#3a8a47', lining: '#fbf6df', sock: '#e9e0b8', accent: '#7ccf73', conf: ['#ff8fc2', '#ffd23f', '#ffffff', '#ff9a3c', '#a77bff'], shape: 'dot' },
  beach: { name: '海邊', em: '🏖️', frame: '#3fa7e0', frameD: '#2a74a8', lining: '#fff7e3', sock: '#f0dfb6', accent: '#5bb8ea', conf: ['#8fd3ff', '#ffffff', '#ffd23f', '#ff8fa0', '#4ba6ff'], shape: 'dot' },
  candy: { name: '糖果屋', em: '🍭', frame: '#ff6fae', frameD: '#c8457f', lining: '#fff1f6', sock: '#f8d5e3', accent: '#ff8fc2', conf: ['#ff6fae', '#ffd23f', '#8fd3ff', '#a97cff', '#5ccf6a'], shape: 'sq' },
  night: { name: '星空', em: '🌙', frame: '#8a6cf0', frameD: '#5a43b0', lining: '#f1edff', sock: '#dcd3f6', accent: '#a58cff', conf: ['#ffe066', '#ffffff', '#ffd23f', '#c3a2ff'], shape: 'star' },
  snow: { name: '雪國', em: '⛄', frame: '#59a9e8', frameD: '#3474ad', lining: '#f4fbff', sock: '#d9eaf6', accent: '#79bdf0', conf: ['#ffffff', '#cfeaff', '#8fd3ff', '#ffd23f'], shape: 'star' },
};
const THEME_SEQ = ['room', 'meadow', 'beach', 'candy', 'night', 'snow'];
const themeOf = n => THEMES[mode === 'levels' ? (LEVELS[n - 1].theme || THEME_SEQ[(n - 1) % 6]) : 'room'];

// the canvas takes the whole stage (1 logical px ≈ 1 CSS px); the board and the tray are sized from it
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  const W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  const H = Math.max(260, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  land = W > H * 1.1; return [W, H];
});
let mode = 'endless', level = 1, LV = null, TH = THEMES.room;
function layout() {
  const W = cv.lw, H = cv.lh, g = Math.max(8, Math.round(Math.min(W, H) * 0.016));
  U = Math.max(0.8, Math.min(1.6, Math.min(W, H) / 420)) * MG.textScale;
  const slots = [];
  let fr;
  if (land) {
    // board on the left; a column with the hero card and the three piece cubbies on the right
    const cellFor = f => Math.floor(Math.min((H - g * 2 - f * 2) / N, (W * 0.64 - f * 2 - g * 2) / N));
    CELL = cellFor(14); fr = Math.max(12, Math.round(CELL * 0.36)); CELL = cellFor(fr);
    const bw = N * CELL, colW = Math.min(Math.max(170, W - bw - fr * 2 - g * 4), Math.round(bw * 0.8));
    const used = bw + fr * 2 + g * 1.5 + colW, x0 = Math.round((W - used) / 2);
    L.bx = x0 + fr; L.by = Math.round((H - bw) / 2);
    const tx = Math.round(L.bx + bw + fr + g * 1.5), top = L.by - fr, colH = bw + fr * 2;
    const cardH = Math.round(Math.min(colH * 0.36, Math.max(colH * 0.27, 150 * U)));
    L.card = { x: tx, y: top, w: colW, h: cardH };
    const sh = Math.floor((colH - cardH - g * 3) / 3);
    for (let i = 0; i < 3; i++) slots.push({ x: tx, y: top + cardH + g + i * (sh + g), w: colW, h: sh });
  } else {
    // hero card on top, the box in the middle, three cubbies at the bottom; spare height grows the card and cubbies
    let cardH = Math.round(Math.max(58, 66 * U)), trayH = Math.round(Math.max(96, Math.min((W - g * 4) / 3 * 0.95, H * 0.2)));
    const cellFor = f => Math.floor(Math.min((W - f * 2 - g * 2) / N, (H - cardH - trayH - f * 2 - g * 4) / N));
    CELL = cellFor(12); fr = Math.max(10, Math.round(CELL * 0.36)); CELL = cellFor(fr);
    const bw = N * CELL, cw = bw + fr * 2, sw = (cw - g * 2) / 3;
    let spare = H - (cardH + cw + trayH + g * 4);
    const addC = Math.min(spare * 0.5, Math.round((mode === 'levels' && G.length >= 3 ? 150 : 124) * U) - cardH); if (addC > 0) { cardH += Math.floor(addC); spare -= Math.floor(addC); }
    const addT = Math.min(spare * 0.8, Math.round(sw * 1.5) - trayH); if (addT > 0) { trayH += Math.floor(addT); spare -= Math.floor(addT); }
    const gap = g + Math.floor(Math.max(0, spare) / 4);
    L.bx = Math.round((W - bw) / 2);
    L.card = { x: L.bx - fr, y: gap, w: cw, h: cardH };
    L.by = gap + cardH + gap + fr;
    const ty = L.by + bw + fr + gap;
    for (let i = 0; i < 3; i++) slots.push({ x: Math.round(L.bx - fr + i * (sw + g)), y: ty, w: Math.floor(sw), h: trayH });
  }
  L.fr = fr; L.g = g; L.slots = slots;
  // inside the card: 噗噗 on the left, title + speech bubble, goal badges, the picture to copy
  const c = L.card;
  if (land) {
    const hr = Math.round(Math.min(c.h * 0.24, c.w * 0.14));
    L.hero = { x: c.x + 14 + hr * 1.05, y: c.y + 14 + hr * 1.05, r: hr };
    L.title = { x: L.hero.x + hr * 1.35, y: c.y + 12, w: c.x + c.w - 12 - (L.hero.x + hr * 1.35), h: Math.round(hr * 0.75) };
    L.bubble = { x: L.title.x, y: L.title.y + L.title.h + 6, w: L.title.w, h: Math.round(hr * 1.2) };
    const gy = c.y + 14 + hr * 2.35;
    L.goals = { x: c.x + 12, y: gy, w: c.w - 24, h: c.y + c.h - 12 - gy };
    L.prev = null;
    if (mode === 'levels' && LV && LV.pic) { const s = Math.min(L.goals.h + L.bubble.h * 0.6, L.goals.w * 0.4); L.prev = { x: c.x + c.w - 12 - s, y: c.y + c.h - 12 - s, s }; L.goals.w -= s + 10; L.bubble.w -= Math.max(0, L.bubble.y + L.bubble.h + 6 - L.prev.y) > 0 ? s + 10 : 0; }
  } else {
    const hr = Math.round(Math.min(c.h * 0.36, c.w * 0.1, 50 * U));
    L.hero = { x: c.x + 10 + hr * 1.1, y: c.y + c.h / 2 + hr * 0.02, r: hr };
    let rx = c.x + c.w - 10;
    L.prev = null;
    if (mode === 'levels' && LV && LV.pic) { const s = c.h - 16; L.prev = { x: rx - s, y: c.y + 8, s }; rx -= s + 8; }
    const x0 = L.hero.x + hr * 1.3, th = Math.round(Math.min(c.h * 0.36, 30 * U));
    L.title = { x: x0, y: c.y + 6, w: rx - x0, h: th };
    L.bubble = null;
    L.goals = { x: x0, y: c.y + 6 + th + 2, w: rx - x0, h: c.y + c.h - 8 - (c.y + 6 + th + 2) };
  }
  spriteCache.clear(); staticKey = '';
}
cv.onfit = layout;
addEventListener('mg-big', layout);
const BX = () => L.bx, BY = () => L.by;
const slotRect = (i) => L.slots[i];

const SHAPES = [
  ['#ffb72b', [[0, 0]]],
  ['#ff8a5c', [[0, 0], [1, 0]]], ['#ff8a5c', [[0, 0], [0, 1]]],
  ['#ff6fb5', [[0, 0], [1, 0], [2, 0]]], ['#ff6fb5', [[0, 0], [0, 1], [0, 2]]],

  ['#4cc96a', [[0, 0], [1, 0], [0, 1], [1, 1]]],

  ['#3d9bff', [[0, 0], [1, 0], [0, 1]]], ['#3d9bff', [[0, 0], [1, 0], [1, 1]]], ['#3d9bff', [[0, 1], [1, 0], [1, 1]]], ['#3d9bff', [[0, 0], [0, 1], [1, 1]]],
  ['#9a6cff', [[0, 0], [1, 0], [2, 0], [0, 1], [0, 2]]], ['#9a6cff', [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]]],
  ['#9a6cff', [[0, 0], [0, 1], [0, 2], [1, 2], [2, 2]]], ['#9a6cff', [[2, 0], [2, 1], [2, 2], [1, 2], [0, 2]]],

    drawPiece(p, s.x + (s.w - p.w * sc) / 2, s.y + (s.h - p.h * sc) / 2 + bob, sc, usable ? 1 : 0.3, usable ? (((t * 0.6 + i * 1.7) % 4) < 0.12 ? 'b' : 'o') : 'b');

    ctx.font = `900 ${f1}px system-ui,sans-serif`; const hw = Math.max(subW, ctx.measureText(p.t).width) / 2 * 1.2 + 6;
    const px = Math.max(hw, Math.min(cv.lw - hw, p.x)), py = Math.max(f1, p.y);

    ctx.font = `900 ${f1}px system-ui,sans-serif`; ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(p.t, 0, 0); ctx.fillStyle = '#ff7a00'; ctx.fillText(p.t, 0, 0);
    if (p.sub) { ctx.font = `900 ${f2}px "Noto Sans TC",system-ui,sans-serif`; ctx.strokeText(p.sub, 0, f1 * 1.1); ctx.fillStyle = '#e0445a'; ctx.fillText(p.sub, 0, f1 * 1.1); }

    const cx = bx + N * CELL / 2, cy = by + N * CELL / 2, w = Math.min(N * CELL * 0.86, 420 * U), h = w * 0.3;

    ctx.fillStyle = bg; rr(ctx, -w / 2, -h / 2, w, h, h / 2); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
    ctx.font = `900 ${h * 0.46}px system-ui,${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const txt = `${TH.em} Clear! 🎉`; ctx.lineWidth = 6; ctx.strokeStyle = TH.frameD; ctx.strokeText(txt, 0, 2); ctx.fillStyle = '#fff'; ctx.fillText(txt, 0, 2);

  }
}

// ---------- flow ----------
const NEWS = {

  stones: ['🪨 清除石頭', '格子裡有灰色的石頭。把石頭那一行或那一列排滿，石頭就會一起被消掉。全部清光就過關！'],
  paint: ['⭐ 鋪滿星星', '格子上有閃閃發亮的星星，把方塊放在星星上面，星星就會變成金色。所有星星都變金色就過關！'],

  color: ['🍬 收集糖果顏色', '上面會告訴你要收集哪一種顏色的糖果方塊。把那個顏色的方塊排進一整行或一整列消掉，就收集到了！'],
  picture: ['🖼️ 拼拼圖畫', '這一關不用消行，也不用趕時間。看看右上角的小圖，把每一塊方塊放到對的位置，拼出一幅漂亮的圖畫！放錯了方塊會自己回來，多試兩次還會告訴你放哪裡。'],
  ice: ['🧊 打破冰塊', '格子裡有冰塊！冰塊所在的那一行或那一列要消掉兩次：第一次冰塊會裂開，第二次才會破掉。全部打破就過關！'],
  finale: ['🏆 大挑戰', '大結局關卡！好幾種任務一起來，上面每一個任務都完成就過關。慢慢來，不會輸喔 ^_^'],
};
function introFor(lv) {
  const ks = lv.pic ? ['picture'] : goalsOf(lv).map(g => g.k.startsWith('c_') ? 'color' : g.k);
  const keys = [...new Set(['levels', ...ks, lv.shapes ? 'shapes' : null, lvBoard(lv) ? 'board' : null, lv.finale ? 'finale' : null])].filter(k => k && NEWS[k] && !MG.store.get('blocks.seen.' + k, false));
  if (!keys.length) return false;
  keys.forEach(k => MG.store.set('blocks.seen.' + k, true));
  MG.panel({ title: keys.map(k => NEWS[k][0]).join('＋'), html: keys.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  return true;
}
function start(m = mode, lv = level) {
  mode = m === 'levels' ? 'levels' : 'endless'; level = Math.max(1, Math.min(LEVELS.length, lv | 0 || 1));
  reset(); state = 'play'; MG.hide(); MG.fx.clear();
  say(mode === 'levels' ? (LV.pic ? 'Fill the picture! 🖼️' : "Let's go! 🚀") : 'Go go! ✨', 2.2); setMood('wink', 1.2);
  if (mode === 'levels') { if (!introFor(LV)) MG.toast(`${TH.em} ${G.map(g => `${goalIc(g.k)} ${g.need}`).join('  ')}${LV.shapes ? ' 🧩' : ''}`, 1500); }
}
function levelWon() {
  if (state !== 'won') return;
  MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 260);
  const done = MG.store.get('blocks.done', {}) || {}, best = done[level];
  const isBest = best == null || pieces < best; if (isBest) { done[level] = pieces; MG.store.set('blocks.done', done); }
  for (let i = 0; i < 3; i++) setTimeout(() => { for (const f of [0.2, 0.5, 0.8]) MG.fx.burst(BX() + N * CELL * f, BY() + N * CELL * 0.35, { n: 18, colors: TH.conf, shape: TH.shape, speed: 280, up: 200, size: Math.max(5, CELL * 0.14), life: 1.3 }); }, i * 260);
  const nx = level < LEVELS.length;

      html: `<div class="big">${LV.pic ? LV.ic + ' ' + LV.name : G.map(g => `${goalIc(g.k)} ${g.need}`).join(' ')}</div><p>用了 ${pieces} 塊方塊${isBest && best != null ? '，新紀錄！' : ''} ^_^</p>` + (nx ? '' : '<p>全部的關卡都過了，你是方塊大師！🏆</p>'),
      buttons: [
        { label: nx ? '下一關' : '回到第 1 關', on: () => { const n = nx ? level + 1 : 1; MG.store.set('blocks.pickLevel', n); start('levels', n); } },
        { label: '再玩一次', alt: true, on: () => start('levels', level) },
        { label: '選關', alt: true, on: menu },

}
function gameOver() {

  const rec = MG.record('blocks', score);
  MG.panel({
    title: '放不下了！',
    html: `<p>這次得到</p><div class="big">${score} 分</div>` + (rec.isNew && score > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best} 分</p>`),
    buttons: [{ label: '再玩一次', on: () => start('endless') }, { label: '🎯 去闖關', alt: true, on: menu }, { label: '回遊戲區', alt: true, on: () => location.href = 'index.html' }],

function menu() {

    id: 'blocks', title: '十乘十方塊',
    html: `<p>把下面的糖果方塊拖進玩具盒的 10×10 格子。排滿一整行或一整列就會消掉！方塊不能旋轉，先想好再放 ^_^</p><p><b>🎯 闖關</b>：${LEVELS.length} 關小任務——🧹 消行、💎 寶石、🪨 石頭、⭐ 星星、🧩 特定方塊，還有新的 🔷 形狀棋盤、🍬 糖果顏色、🧊 打破冰塊、🖼️ 拼圖畫和 🏆 大挑戰。放不下也不會輸！<br><b>♾️ 無限模式</b>：一直玩到放不下，挑戰最高分。</p>`,
    keys: '拖曳方塊　鍵盤：<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 選方塊、方向鍵移動、<kbd>Enter</kbd> 放下',
    modesTitle: '怎麼玩？',
    modes: [{ id: 'levels', label: '🎯 闖關', sub: `${LEVELS.length} 關小任務・不會輸` }, { id: 'endless', label: '♾️ 無限模式', sub: `最高 ${MG.best('blocks') ?? 0} 分` }],
    levelsTitle: '闖關從哪一關開始？',
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${lvName(n)}${done[n] != null ? '・✓' : ''}）`, short: lvShort },
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),

}
reset();
// greedy helper used by the tests: picks a placement that clears lines / reaches the goal
function bestMove() {
  if (LV && LV.pic) { const i = tray.findIndex(Boolean); return i < 0 ? null : { i, gx: tray[i].home.x, gy: tray[i].home.y, s: 1 }; }
  const want = new Set(G.filter(g => g.got < g.need).map(g => g.k));
  const val = (r, c) => { const sp = spec[r][c], v = grid[r][c]; if (sp === 'g') return want.has('gems') ? 3 : 0; if (sp === 's') return want.has('stones') ? 3 : 0; if (sp === 'i' || sp === 'j') return want.has('ice') ? 3 : 0; for (const k in CANDY) if (v === CANDY[k] && want.has('c_' + k)) return 2; return 0; };
  let best = null;
  for (let i = 0; i < 3; i++) {
    const p = tray[i]; if (!p) continue;
    for (let gy = 0; gy <= N - p.h; gy++) for (let gx = 0; gx <= N - p.w; gx++) {
      if (!fits(p, gx, gy)) continue;
      const tmp = grid.map(r => r.slice()); for (const [a, b] of p.cells) tmp[gy + b][gx + a] = p.col;
      let s = Math.random() * 0.5, lines = 0;
      for (let k = 0; k < N; k++) {
        let rv = 0, cvv = 0, rowN = 0, colN = 0;
        for (let j = 0; j < N; j++) { if (tmp[k][j]) rowN++; if (tmp[j][k]) colN++; rv += val(k, j); cvv += val(j, k); }
        if (lineFull(tmp, k, true)) { lines++; s += rv * 10; } else s += rowN * rowN * 0.05 * (rv ? 3 : 1);
        if (lineFull(tmp, k, false)) { lines++; s += cvv * 10; } else s += colN * colN * 0.05 * (cvv ? 3 : 1);
      }
      s += lines * 20;
      for (const [a, b] of p.cells) if (paint[gy + b][gx + a] === 1) s += 12;
      s += p.cells.length * 0.3;
      if (!best || s > best.s) best = { i, gx, gy, s };
    }
  }

}
window.BKT = {
  get state() { return state; }, get mode() { return mode; }, get level() { return level; }, get got() { return sumGot(); }, get need() { return sumNeed(); }, get pieces() { return pieces; },
  get theme() { return TH.name; }, get type() { return LV ? lvType(LV) : 'endless'; }, goals: () => G.map(g => ({ ...g })),
  count: LEVELS.length, levels: () => LEVELS.map((l, i) => ({ n: i + 1, goal: l.goal || lvType(l), type: lvType(l), need: lvTotal(l), shapes: !!l.shapes, name: lvName(i + 1) })),
  pops: () => pops.map(p => [p.t, p.sub]), place: (i, gx, gy) => place(i, gx, gy), tray: () => tray.map(p => p && p.cells), trayKinds: () => tray.map(p => p && p.k),
  trayHomes: () => tray.map(p => p && p.home), slots: () => L.slots, board: () => ({ x: L.bx, y: L.by, cell: CELL }),
  start: (m, lv) => start(m, lv), bestMove, rescue: () => rescue(),
  // play the current level with the greedy helper until it is won (or maxN pieces); returns pieces used
  autoplay(maxN = 800) { let n = 0; while (state === 'play' && n < maxN) { const m = bestMove(); if (!m) { stuckT = 0; rescue(); if (!bestMove()) return -1; continue; } place(m.i, m.gx, m.gy); n++; if (stuckT > 0) { stuckT = 0; rescue(); } } return state === 'won' ? pieces : -n; },
  setGrid(fn) { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) grid[r][c] = fn(r, c); }, setTray(cells) { tray = cells.map(cs => cs && { col: '#4cc96a', cells: cs, ...sizeOf(cs) }); },
  win() { if (state === 'play') { G.forEach(g => g.got = g.need); winNow(); } },

menu();
let frameMs = [];
window.BKT.frameMs = () => frameMs.slice();
MG.loop(dt => {
  const t0 = performance.now();
  t += dt; idleT += dt;
  for (const f of fx) f.life -= dt; fx = fx.filter(f => f.life > 0);
  for (const q of bits) { q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 900 * dt; q.a += q.va * dt; q.life -= dt; } bits = bits.filter(q => q.life > 0);
  for (const p of pops) { p.y -= 30 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  for (const f of flyers) f.t += dt; flyers = flyers.filter(f => f.t < 0.6);

  heroMoodT -= dt; if (heroMoodT <= 0 && state !== 'won') heroMood = 'happy';
  heroLineT -= dt; if (winT > 0) winT += dt;

  MG.fx.draw(ctx);

});
