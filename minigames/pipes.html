  if (cursor && cursor.on && state === 'play') { const q = cellXY(ix(cursor[0], cursor[1])); x.strokeStyle = '#ff9f1c'; x.lineWidth = 4; x.setLineDash([8, 6]); rr(q.x - cs / 2 + 1, q.y - cs / 2 + 1, cs - 2, cs - 2, cs * 0.16); x.stroke(); x.setLineDash([]); }
  for (let i = 0; i < N2; i++) { const c = P.cells[i]; if (c.k === 'tap') drawTap(i, c, cellXY(i)); }
  // pots: draw from top to bottom so the flowers overlap nicely
  const pots = []; for (let i = 0; i < N2; i++) if (P.cells[i].k === 'pot') pots.push(i);
  pots.sort((a, b) => cellXY(a).y - cellXY(b).y).forEach(i => drawPot(i, P.cells[i], cellXY(i)));
  if (state === 'won') drawRainbow();
  drawTray();
  drawHero();
  drawButtons();
  MG.fx.draw(x);
  drawFloats();
  if (drag && drag.x != null) { x.save(); x.globalAlpha = 0.92; drawTrayPiece(drag.b, drag.rot, drag.x, drag.y - cs * 0.3, cs * 1.06, true); x.restore(); }
}

// ---------- menu ----------
function menu() {
  state = 'menu';
  const S = starsOf();
  MG.choose({
    id: 'pipes', title: '接水管',
    html: `<p>點一下水管就會轉方向。把水管接好，讓水從<b>水桶</b>一路流到<b>花盆</b>，花就會開花！</p><p>不限時間、不會輸，慢慢轉 ^_^　卡住了可以按 💡 提示。</p><p>後面有 🌼 好多花盆、🔒 固定水管、🧩 放水管、🌱 整片花園、🎨 彩色的水、🌉 小橋和 🧡 混顏色！</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${lvName(n)}）${S[n] ? ' ' + '⭐'.repeat(S[n]) : ''}`, short: n => `${n}${TYPE[typeOf(LEVELS[n - 1])][0] || (S[n] ? '✓' : '')}` },
    keys: '點水管轉方向　<kbd>←↑↓→</kbd> 移動　<kbd>空白鍵</kbd> 轉　<kbd>H</kbd> 提示　<kbd>R</kbd> 重來',
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
// a sample board behind the start panel
(() => { L = LEVELS[2]; TH = THEMES.g; const p = genPuzzle(L); P = { n: p.n, G: p.G, cells: p.cells, garden: false }; tray = []; for (const c of P.cells) if (c.k === 'pipe') { c.turns = c.rot; c.vis = c.rot; } for (const c of P.cells) if (c.k === 'pot') c.bloom = 0; wetAt = new Float64Array(P.G * P.G * 2).fill(Infinity); FL = flow(P); for (let k = 0; k < wetAt.length; k++) if (FL.bits[k]) wetAt[k] = -10; layout(); })();
menu();

// ---------- test hook ----------
window.PIPT = {
  get state() { return state; }, get level() { return level; }, get hints() { return hints; }, get n() { return P && P.n; }, levels: LEVELS, typeOf: n => typeOf(LEVELS[n - 1]),
  start(n) { MG.hide(); startLevel(n); },
  cells: () => P.cells.map((c, i) => ({ i, k: c.k, b: c.b, rot: c.rot, lock: !!c.lock, slot: !!c.slot, sol: c.sol, ok: c.ok, col: c.col })),
  tray: () => tray.map(p => ({ ...p })),
  goal: () => goalMet(P, flow(P)),
  // put every piece where the solution has it (proves the level can be solved)
  solveNow() {
    for (const c of P.cells) if (c.k === 'pipe' && c.sol && c.b && c.b !== c.sol.b && c.slot) { tray.push({ b: c.b, rot: c.rot }); c.b = null; }
    for (const c of P.cells) if (c.k === 'pipe' && c.sol) {
      if (!c.b) { const k = tray.findIndex(p => p.b === c.sol.b); if (k < 0) return false; tray.splice(k, 1); c.b = c.sol.b; }
      c.rot = baseOf(c.sol.m).rot; while ((c.turns & 3) !== c.rot) c.turns++; c.rot = c.turns & 3;
    }
    layout(); recompute(0); return goalMet(P, flow(P));
  },
  win() { return this.solveNow(); },
  // generate many boards for level n and check each one: solved board meets the goal, scrambled one does not
  check(n, count = 30) {
    const L2 = LEVELS[n - 1], out = { ok: 0, bad: 0, short: 0 };
    for (let k = 0; k < count; k++) {
      const p = genPuzzle(L2); if (!p) { out.bad++; continue; }
      const Q = { n: p.n, G: p.G, cells: JSON.parse(JSON.stringify(p.cells)), garden: p.garden }, tr = p.tray.map(o => ({ ...o }));
      const before = goalMet(Q, flow(Q));
      let fine = true;
      for (const c of Q.cells) if (c.k === 'pipe' && c.sol) {
        if (!c.b) { const j = tr.findIndex(o => o.b === c.sol.b); if (j < 0) { fine = false; break; } tr.splice(j, 1); c.b = c.sol.b; }
        c.rot = baseOf(c.sol.m).rot;
      }
      if (fine && !before && goalMet(Q, flow(Q))) out.ok++; else out.bad++;
      if (!p.ok) out.short++;
    }
    return out;
  },
  hint() { showHint(); return hintCell && hintCell.i; },
  tap(i) { return rotateCell(i); },
  at(i) { const q = cellXY(i); return this.toClient(q.x, q.y); },
  trayAt(k) { const s = traySpots[k]; return s ? this.toClient(s.x, s.y) : null; },
  btn(id) { const b = btns.find(b => b.id === id); return b && this.toClient(b.x + b.w / 2, b.y + b.h / 2); },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; },
  dims: () => ({ W, H, cs, bx0, by0, side, tray: trayRect, ts }),
};

MG.loop(dt => { update(dt); draw(); });
</script>
