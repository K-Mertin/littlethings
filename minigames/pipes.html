      x.fillStyle = 'rgba(255,255,255,.8)'; x.beginPath(); x.ellipse(-r * 0.2, -r * 0.9, r * 0.5, r * 0.3 + f * r * 0.3, -0.3, 0, 7); x.fill(); x.beginPath(); x.ellipse(r * 0.4, -r * 0.9, r * 0.45, r * 0.25 + f * r * 0.3, 0.3, 0, 7); x.fill();
      x.fillStyle = '#ffd23f'; x.strokeStyle = '#8a6a10'; x.lineWidth = 1.2; x.beginPath(); x.ellipse(0, 0, r, r * 0.7, 0, 0, 7); x.fill(); x.stroke();
      x.fillStyle = '#3a2a10'; x.fillRect(-r * 0.3, -r * 0.65, r * 0.22, r * 1.3); x.fillRect(r * 0.2, -r * 0.6, r * 0.2, r * 1.2); x.beginPath(); x.arc(dir * r * 0.7, -r * 0.15, r * 0.1, 0, 7); x.fill();
    } else if (c.k === 'ffly') {
      const gl = 0.5 + 0.5 * Math.sin(c.ph * 3), r = 14 * U;
      const g2 = x.createRadialGradient(0, 0, 0, 0, 0, r); g2.addColorStop(0, `rgba(240,255,150,${0.75 * gl + 0.2})`); g2.addColorStop(1, 'rgba(240,255,150,0)');
      x.fillStyle = g2; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill(); x.fillStyle = '#fffbd0'; x.beginPath(); x.arc(0, 0, 2.2 * U, 0, 7); x.fill();
    } else if (c.k === 'bird' || c.k === 'parrot') {
      const r = 9 * U, fl = Math.sin(c.ph * 12);
      x.scale(dir, 1);
      if (c.k === 'parrot') { x.fillStyle = '#4fbf5a'; x.beginPath(); x.moveTo(-r * 0.8, 0); x.lineTo(-r * 2, r * 0.3); x.lineTo(-r * 1.9, -r * 0.1); x.closePath(); x.fill(); }
      x.fillStyle = c.col; x.strokeStyle = shade(hexOf(c.col), -70); x.lineWidth = 1.3;
      x.beginPath(); x.ellipse(0, 0, r, r * 0.7, 0, 0, 7); x.fill(); x.stroke();
      x.beginPath(); x.arc(r * 0.75, -r * 0.35, r * 0.48, 0, 7); x.fill(); x.stroke();
      x.save(); x.translate(-r * 0.1, -r * 0.2); x.rotate(-0.4 - fl * 0.8); x.beginPath(); x.ellipse(0, -r * 0.4, r * 0.3, r * 0.65, 0, 0, 7); x.fill(); x.stroke(); x.restore();
      x.fillStyle = '#ffb02e'; x.beginPath(); x.moveTo(r * 1.15, -r * 0.42); x.lineTo(r * 1.55, -r * 0.3); x.lineTo(r * 1.15, -r * 0.18); x.closePath(); x.fill();
      x.fillStyle = '#2a1a0a'; x.beginPath(); x.arc(r * 0.9, -r * 0.45, r * 0.09, 0, 7); x.fill();
    } else if (c.k === 'walker') {
      const hop = c.peck ? 0 : Math.abs(Math.sin(c.ph * 9)) * 2.5 * U, r = 10 * U;
      x.fillStyle = 'rgba(0,0,0,.12)'; x.beginPath(); x.ellipse(0, r * 0.9, r, r * 0.25, 0, 0, 7); x.fill();
      x.translate(0, -hop);
      if (c.wk === 'duck') drawDuck(0, 0, r * 0.75, dir, true, false);
      else if (c.wk === 'chick') { x.save(); x.scale(dir, 1); x.rotate(c.peck ? 0.5 : 0); x.strokeStyle = '#ff8c2a'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(-r * 0.2, r * 0.6); x.lineTo(-r * 0.2, r * 0.95); x.moveTo(r * 0.2, r * 0.6); x.lineTo(r * 0.2, r * 0.95); x.stroke(); blob(0, 0, r * 0.75, '#ffe14d', '#d0a020', 1.3); x.fillStyle = '#ff9a2e'; x.beginPath(); x.moveTo(r * 0.6, -r * 0.1); x.lineTo(r * 1.0, 0); x.lineTo(r * 0.6, r * 0.12); x.closePath(); x.fill(); x.fillStyle = '#2a1a0a'; x.beginPath(); x.arc(r * 0.3, -r * 0.2, r * 0.09, 0, 7); x.fill(); x.restore(); }
      else { x.save(); x.scale(dir, 1); x.rotate(c.peck ? 0.45 : 0); x.strokeStyle = '#d9606a'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(-r * 0.1, r * 0.55); x.lineTo(-r * 0.1, r * 0.95); x.moveTo(r * 0.2, r * 0.55); x.lineTo(r * 0.2, r * 0.95); x.stroke(); x.fillStyle = '#aab3c4'; x.strokeStyle = '#6a7388'; x.lineWidth = 1.3; x.beginPath(); x.ellipse(0, 0, r, r * 0.65, -0.1, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#8fd6c8'; x.beginPath(); x.arc(r * 0.65, -r * 0.45, r * 0.42, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#ffb02e'; x.beginPath(); x.moveTo(r * 1.0, -r * 0.5); x.lineTo(r * 1.3, -r * 0.4); x.lineTo(r * 1.0, -r * 0.32); x.fill(); x.fillStyle = '#2a1a0a'; x.beginPath(); x.arc(r * 0.78, -r * 0.55, r * 0.08, 0, 7); x.fill(); x.restore(); }
    }
    x.restore();
  }
}
function drawRain() {
  if (rainK <= 0) return;
  x.strokeStyle = `rgba(255,255,255,${0.5 * rainK})`; x.lineWidth = 1.6; x.lineCap = 'round'; x.beginPath();
  for (const r of rain) { x.moveTo(r.x, r.y); x.lineTo(r.x - r.l * 0.15, r.y + r.l); }
  x.stroke();
}
// a rope from each water wheel to the gate it opens
function drawRopes() {
  for (let i = 0; i < P.cells.length; i++) {
    const g = P.cells[i]; if (g.k !== 'gate') continue;
    const a = cellXY(g.key), b = cellXY(i), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + cs * 0.4;
    x.save(); x.strokeStyle = g.open ? 'rgba(255,159,28,.55)' : 'rgba(160,110,60,.55)'; x.lineWidth = Math.max(2, cs * 0.04); x.setLineDash([cs * 0.08, cs * 0.07]); x.lineDashOffset = g.open ? -t * 30 : 0;
    x.beginPath(); x.moveTo(a.x, a.y); x.quadraticCurveTo(mx, my, b.x, b.y); x.stroke(); x.restore();
  }
}

// ---------- menu ----------
function menu() {
  state = 'menu';
  const S = starsOf();
  MG.choose({
    id: 'pipes', title: '接水管',
    html: `<p>點一下水管就會轉方向。把水管接好，讓水從<b>水桶</b>一路流到要喝水的朋友那裡：花會開、小鴨子游泳、小牛喝水、水車轉轉、車車洗乾淨！</p><p>不限時間、不會輸，慢慢轉 ^_^　卡住了可以按 💡 提示。每一關都是固定的題目，想換一題可以在過關後按「這關換一題」。</p><p>${LEVELS.length} 關，有 🌷花園、🚜農場、⛲廣場、🦆公園、🏙️城市、🌴叢林，還有晚上、黃昏和下雨天；玩法有 🌼 好多花盆、🔒 固定水管、🧩 放水管、🌱 整片花園、🎨 彩色的水、🌉 小橋、🧡 混顏色，和新的 ➡️ 單向水管、⚙️ 水車開門、🔗 一起轉、📖 小任務！</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${lvName(n)}）${S[n] ? ' ' + '⭐'.repeat(S[n]) : ''}`, short: n => `${n}${TYPE[typeOf(LEVELS[n - 1])][0] || (S[n] ? '✓' : '')}` },
    keys: '點水管轉方向　<kbd>←↑↓→</kbd> 移動　<kbd>空白鍵</kbd> 轉　<kbd>H</kbd> 提示　<kbd>R</kbd> 重來',
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
// a sample board behind the start panel
(() => { L = Object.assign({}, LEVELS[2], { _lv: 3 }); TH = THEMES.g; const p = genPuzzle(L, 99); P = { n: p.n, G: p.G, cells: p.cells, garden: false }; tray = []; for (const c of P.cells) if (c.k === 'pipe') { c.turns = c.rot; c.vis = c.rot; } for (const c of P.cells) if (c.k === 'pot') { c.bloom = 0; c.poke = 0; } wetAt = new Float64Array(P.G * P.G * 2).fill(Infinity); FL = flow(P); for (let k = 0; k < wetAt.length; k++) if (FL.bits[k]) wetAt[k] = -10; layout(); spawnCritters(); })();
menu();

// ---------- test hook ----------
window.PIPT = {
  get state() { return state; }, get level() { return level; }, get hints() { return hints; }, get n() { return P && P.n; }, levels: LEVELS, typeOf: n => typeOf(LEVELS[n - 1]),
  get stage() { return stage; }, get stages() { return stages.length; }, get gems() { return gemsGot; }, get friends() { return friendsGot.slice(); }, get critters() { return critters.length; },
  start(n, v) { MG.hide(); if (v != null) variant[n] = v; startLevel(n); },
  cells: () => P.cells.map((c, i) => ({ i, k: c.k, b: c.b, rot: c.rot, lock: !!c.lock, slot: !!c.slot, sol: c.sol, ok: c.ok, col: c.col, rk: c.rk, one: !!c.one, link: c.link || 0, gem: !!c.gem, friend: c.friend || null, found: !!c.found, open: !!c.open, key: c.key, dk: c.dk })),
  tray: () => tray.map(p => ({ ...p })),
  goal: () => goalMet(P, flow(P, true)),
  // put every piece where the solution has it (proves the level can be solved); gates open by themselves when the wheel turns
  solveNow() {
    for (const c of P.cells) if (c.k === 'pipe' && c.sol && c.b && c.b !== c.sol.b && c.slot) { tray.push({ b: c.b, rot: c.rot }); c.b = null; }
    for (const c of P.cells) if (c.k === 'pipe' && c.sol) {
      if (!c.b) { const k = tray.findIndex(p => p.b === c.sol.b); if (k < 0) return false; tray.splice(k, 1); c.b = c.sol.b; }
      while (!isRight(c)) { c.turns++; c.rot = c.turns & 3; if (c.turns > 400) return false; }
    }
    layout(); recompute(0); return goalMet(P, flow(P, true));
  },
  win() { return this.solveNow(); },
  // check level n's seeded board(s): the solved board meets the goal, the scrambled one does not; also many other variants
  check(n, count = 30) {
    const out = { ok: 0, bad: 0, short: 0, fail: [] };
    const st = (LEVELS[n - 1].stages || [LEVELS[n - 1]]).map(sd => Object.assign({}, LEVELS[n - 1], { stages: null }, sd, { _lv: n }));
    for (let v = 0; v < count; v++) for (let si = 0; si < st.length; si++) {
      const L2 = st[si], p = genPuzzle(L2, seedOf(n, si, v)); if (!p) { out.bad++; out.fail.push([v, si, 'null']); continue; }
      const Q = { n: p.n, G: p.G, cells: JSON.parse(JSON.stringify(p.cells)), garden: p.garden }, tr = p.tray.map(o => ({ ...o }));
      const before = goalMet(Q, flow(Q, true));
      let fine = true;
      for (const c of Q.cells) if (c.k === 'pipe' && c.sol) {
        if (!c.b) { const j = tr.findIndex(o => o.b === c.sol.b); if (j < 0) { fine = false; break; } tr.splice(j, 1); c.b = c.sol.b; }
        c.rot = c.sol.r;
      }
      // closed gates must really block until the wheel turns, and the wheel must not need its own gate
      const gates = Q.cells.filter(c => c.k === 'gate');
      if (gates.length) { const f0 = flow(Q, false); for (const g of gates) if (f0.bits[g.key * 2] !== Q.cells[g.key].col) fine = false; if (goalMet(Q, f0)) fine = false; }
      const need = { gate: L2.gate, link: L2.link, oneway: L2.oneway };
      if (need.gate && !gates.length) fine = false;
      if (need.link && Q.cells.filter(c => c.link).length < 2) fine = false;
      if (need.oneway && !Q.cells.some(c => c.one)) fine = false;
      if (fine && !before && goalMet(Q, flow(Q, true))) out.ok++; else { out.bad++; out.fail.push([v, si]); }
      if (!p.ok) out.short++;
    }
    return out;
  },
  hint() { showHint(); return hintCell && hintCell.i; },
  tap(i) { return rotateCell(i); },
  poke(i) { const c = P.cells[i]; if (c.k === 'pot') pokeRecv(i); else if (c.k === 'rock' || c.k === 'deco') pokeProp(i); },
  at(i) { const q = cellXY(i); return this.toClient(q.x, q.y); },
  trayAt(k) { const s = traySpots[k]; return s ? this.toClient(s.x, s.y) : null; },
  btn(id) { const b = btns.find(b => b.id === id); return b && this.toClient(b.x + b.w / 2, b.y + b.h / 2); },
  critterAt(k) { const c = critters[k]; return c ? this.toClient(c.x, c.y) : null; },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; },
  dims: () => ({ W, H, cs, bx0, by0, side, tray: trayRect, ts }),
};

MG.loop(dt => { update(dt); draw(); });
</script>
