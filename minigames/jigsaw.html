<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>拼拼圖</title>
<link rel="stylesheet" href="mini.css">
<style>
.mg-stage{padding:6px}
.jg-pics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.jg-pic{font:inherit;font-size:12px;font-weight:700;color:var(--ink);border:3px solid #e2cf9c;border-radius:10px;background:#fff;padding:3px 3px 2px;cursor:pointer;line-height:1.5}
.jg-pic img,.jg-pic .dice{display:block;width:100%;aspect-ratio:4/3;border-radius:6px;object-fit:cover;background:#f3e7cf}
.jg-pic .dice{display:flex;align-items:center;justify-content:center;font-size:30px;background:repeating-conic-gradient(#fff4cc 0 25%,#fff8dc 0 50%) 0 0/16px 16px}
.jg-pic[aria-pressed=true]{border-color:var(--jelly2);background:#eaffd9;box-shadow:0 0 0 3px #c8f2c0}
@media (min-width:600px){.jg-pic{font-size:13px}.jg-pics{grid-template-columns:repeat(5,1fr)}}
@media (max-width:480px){.mg-bar [data-s=moves]{display:none}}
</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'jigsaw', title: '拼拼圖', stats: ['prog', 'time', 'moves'] });
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const SW = 320, SH = 240;     // every picture is drawn in this 4:3 space

// ================= pictures =================
// 26 picture-book illustrations, painted in code into the 320×240 frame. One light (top-left), soft
// coloured outlines (a darker shade of the fill, never black), gradients, ground shadows and layered
// far / mid / near backgrounds. They are the reward a child sees when a puzzle is done.
const TAU = Math.PI * 2;
let X = null;                                   // the context the pictures paint on
const lcg = seed => { let s = seed % 2147483647; if (s <= 0) s += 2147483646; const f = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 5; i++) f(); return f; };
const rgbOf = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
function shade(hex, f) { // f < 1 darker, f > 1 lighter
  const c = rgbOf(hex).map(v => f < 1 ? v * f : v + (255 - v) * (f - 1));
  return `rgb(${c.map(v => Math.round(Math.max(0, Math.min(255, v)))).join(',')})`;
}
const rgba = (hex, a) => `rgba(${rgbOf(hex).join(',')},${a})`;
const OL = c => shade(c, 0.58);                 // outline colour of a fill
function stops(q, st) { st.forEach((c, i) => q.addColorStop(i / (st.length - 1), c)); return q; }
const lin = (x0, y0, x1, y1, ...st) => stops(X.createLinearGradient(x0, y0, x1, y1), st);
const rad = (x, y, r0, r1, ...st) => stops(X.createRadialGradient(x, y, r0, x, y, r1), st);
const radO = (x0, y0, r0, x1, y1, r1, ...st) => stops(X.createRadialGradient(x0, y0, r0, x1, y1, r1), st);
function circ(x, y, r) { X.beginPath(); X.arc(x, y, r, 0, TAU); }
function ell(x, y, rx, ry, rot = 0) { X.beginPath(); X.ellipse(x, y, rx, ry, rot, 0, TAU); }
function rrect(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function fillS(f, s, w = 1) { if (f) { X.fillStyle = f; X.fill(); } if (s) { X.strokeStyle = s; X.lineWidth = w; X.stroke(); } }
function line(pts, col, w) { X.beginPath(); pts.forEach(([a, b], i) => i ? X.lineTo(a, b) : X.moveTo(a, b)); X.strokeStyle = col; X.lineWidth = w; X.stroke(); }
function clipped(pathFn, fn) { X.save(); pathFn(); X.clip(); fn(); X.restore(); }
// soft ground shadow
function soft(x, y, rx, ry, a = 0.25, col = '40,50,30') {
  X.save(); X.translate(x, y); X.scale(1, ry / rx);
  X.fillStyle = rad(0, 0, 0, rx, `rgba(${col},${a})`, `rgba(${col},${a * 0.7})`, `rgba(${col},0)`); circ(0, 0, rx); X.fill(); X.restore();
}
function shine(x, y, rx, ry, rot = -0.6, a = 0.6) { X.fillStyle = `rgba(255,255,255,${a})`; ell(x, y, rx, ry, rot); X.fill(); }
// a union of circles with one clean outline: stroke them all, then fill them all on top
function puffPath(cs, dx = 0, dy = 0, k = 1) { X.beginPath(); for (const [a, b, r] of cs) { X.moveTo(a + dx + r * k, b + dy); X.arc(a + dx, b + dy, r * k, 0, TAU); } }
function puffs(cs, fill, lineCol, lw) {
  if (lineCol) { puffPath(cs); X.strokeStyle = lineCol; X.lineWidth = lw * 2; X.stroke(); }
  puffPath(cs); X.fillStyle = fill; X.fill();
  return () => puffPath(cs);
}
// shaded puffy mass (tree tops, bushes, wool, clouds): dark base, lit colour shifted up-left, small highlights
function blobs(cs, base, o = {}) {
  const dk = o.dk || shade(base, 0.74), lt = o.lt || shade(base, 1.28), ln = o.line || shade(base, 0.5), lw = o.lw ?? 0.9, off = o.off ?? 2.6;
  const p = puffs(cs, dk, ln, lw);
  clipped(p, () => {
    puffPath(cs, -off, -off * 1.2, 0.93); X.fillStyle = base; X.fill();
    if (o.hl !== false) { X.globalAlpha = o.hlA ?? 0.55; X.fillStyle = lt; X.beginPath(); for (const [a, b, r] of cs) if (b - r < (o.hlY ?? 1e9)) { X.moveTo(a - r * 0.35 + r * 0.42, b - r * 0.4); X.ellipse(a - r * 0.35, b - r * 0.4, r * 0.42, r * 0.3, -0.5, 0, TAU); } X.fill(); X.globalAlpha = 1; }
    if (o.tex) o.tex();
  });
  return p;
}
// a smooth hill line through points, filled down to `bottom`
function ridge(pts, bottom, fill, lineCol, lw = 1) {
  X.beginPath(); X.moveTo(pts[0][0], bottom); X.lineTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) X.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  const L = pts[pts.length - 1]; X.lineTo(L[0], L[1]); X.lineTo(L[0], bottom); X.closePath(); fillS(fill, lineCol, lw);
}
// a rounded mountain with an optional snow cap
function mount(cx, by, w, h, col, cap = '#ffffff') {
  const p = () => { X.beginPath(); X.moveTo(cx - w, by); X.bezierCurveTo(cx - w * 0.45, by - h * 0.55, cx - w * 0.12, by - h, cx, by - h); X.bezierCurveTo(cx + w * 0.12, by - h, cx + w * 0.45, by - h * 0.55, cx + w, by); X.closePath(); };
  p(); fillS(lin(cx - w * 0.5, 0, cx + w * 0.5, 0, shade(col, 1.08), col, shade(col, 0.9)));
  clipped(p, () => {
    X.fillStyle = 'rgba(70,80,140,.1)'; X.beginPath(); X.moveTo(cx, by - h); X.quadraticCurveTo(cx + w * 0.1, by - h * 0.4, cx - w * 0.1, by); X.lineTo(cx + w, by); X.lineTo(cx + w, by - h); X.fill();
    if (cap) { const cy = by - h * 0.62; X.beginPath(); X.moveTo(cx - w, by - h - 2); X.lineTo(cx + w, by - h - 2); X.lineTo(cx + w, cy); for (let i = 0, n = 5; i < n; i++) { const x1 = cx + w - (i + 1) * w * 2 / n; X.quadraticCurveTo(x1 + w / n, cy + (i % 2 ? -4 : 5), x1, cy); } X.closePath(); X.fillStyle = cap; X.fill(); X.fillStyle = 'rgba(120,140,200,.18)'; X.fillRect(cx, by - h - 2, w, h); }
  });
}
function skyFill(...st) { X.fillStyle = lin(0, 0, 0, SH, ...st); X.fillRect(0, 0, SW, SH); }
// a friendly face: eyes with highlight dots, blush, smile (s = face width scale)
function face(cx, cy, s, o = {}) {
  const ec = o.eye || '#2e1f1c', e = s * (o.sp ?? 0.32);
  X.fillStyle = ec; for (const d of [-1, 1]) { ell(cx + d * e, cy, s * 0.11, s * 0.14); X.fill(); }
  X.fillStyle = '#fff'; for (const d of [-1, 1]) { circ(cx + d * e - s * 0.035, cy - s * 0.05, s * 0.042); X.fill(); }
  if (o.blush !== false) { X.fillStyle = o.blushCol || 'rgba(255,110,130,.42)'; for (const d of [-1, 1]) { ell(cx + d * (e + s * 0.2), cy + s * 0.2, s * 0.13, s * 0.08); X.fill(); } }
  X.strokeStyle = o.mouth || ec; X.lineWidth = Math.max(0.6, s * 0.06); X.lineCap = 'round';
  X.beginPath(); X.arc(cx, cy + s * 0.1, s * (o.mw ?? 0.15), 0.25 * Math.PI, 0.75 * Math.PI); X.stroke();
}
function sparkle(x, y, r, col = '#fff') {
  X.fillStyle = col; X.beginPath(); X.moveTo(x, y - r);
  X.quadraticCurveTo(x + r * 0.15, y - r * 0.15, x + r, y); X.quadraticCurveTo(x + r * 0.15, y + r * 0.15, x, y + r);
  X.quadraticCurveTo(x - r * 0.15, y + r * 0.15, x - r, y); X.quadraticCurveTo(x - r * 0.15, y - r * 0.15, x, y - r); X.fill();
}
function starPath(cx, cy, R0, ri, rot = 0) { X.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, q = i % 2 ? ri : R0; X.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } X.closePath(); }
function star(cx, cy, R0, col = '#ffd23f', rot = 0) {
  X.lineJoin = 'round'; starPath(cx, cy, R0, R0 * 0.5, rot);
  fillS(radO(cx - R0 * 0.3, cy - R0 * 0.3, 0, cx, cy, R0, shade(col, 1.45), col, shade(col, 0.88)), OL(col), Math.max(0.6, R0 * 0.12));
  shine(cx - R0 * 0.25, cy - R0 * 0.25, R0 * 0.22, R0 * 0.12, -0.7, 0.7);
}
function heart(cx, cy, s, col) {
  X.beginPath(); X.moveTo(cx, cy + s * 0.75); X.bezierCurveTo(cx - s * 1.25, cy - s * 0.05, cx - s * 0.8, cy - s * 1.05, cx, cy - s * 0.45);
  X.bezierCurveTo(cx + s * 0.8, cy - s * 1.05, cx + s * 1.25, cy - s * 0.05, cx, cy + s * 0.75); X.closePath();
  fillS(radO(cx - s * 0.4, cy - s * 0.4, 0, cx, cy, s * 1.1, shade(col, 1.35), col, shade(col, 0.85)), OL(col), Math.max(0.6, s * 0.1));
  shine(cx - s * 0.45, cy - s * 0.35, s * 0.22, s * 0.13, -0.7, 0.7);
}

// ---------- reusable things ----------
function sun(x, y, r) {
  X.fillStyle = rad(x, y, r * 0.9, r * 3, 'rgba(255,238,160,.75)', 'rgba(255,238,160,.25)', 'rgba(255,238,160,0)'); circ(x, y, r * 3); X.fill();
  X.save(); X.translate(x, y);
  for (let i = 0; i < 12; i++) {
    const L = i % 2 ? r * 1.42 : r * 1.68; X.save(); X.rotate(i * TAU / 12 + 0.13);
    X.beginPath(); X.moveTo(r * 1.1, -r * 0.17); X.quadraticCurveTo(L + r * 0.08, 0, r * 1.1, r * 0.17); X.closePath(); fillS(i % 2 ? '#ffd45a' : '#ffbf35'); X.restore();
  }
  circ(0, 0, r); fillS(radO(-r * 0.35, -r * 0.4, r * 0.05, 0, 0, r * 1.05, '#fffbd8', '#ffdc4e', '#ffb428'), '#e8961c', Math.max(0.8, r * 0.07));
  shine(-r * 0.45, -r * 0.5, r * 0.22, r * 0.12, -0.7, 0.75);
  face(0, r * 0.08, r * 0.95, { eye: '#7a3f0c', mouth: '#7a3f0c', blushCol: 'rgba(255,120,60,.45)' });
  X.restore();
}
function cloud(x, y, s, a = 1, tint = '#ffffff') {
  const cs = [[-17, 3, 9], [-7, -4, 12], [7, -7, 11], [18, 1, 9], [1, 4, 10], [-10, 6, 7], [11, 6, 7]].map(([p, q, r]) => [x + p * s, y + q * s, r * s]);
  X.save(); X.globalAlpha = a;
  const p = puffs(cs, tint, 'rgba(150,185,220,.7)', Math.max(0.5, 0.8 * s));
  clipped(p, () => {
    X.fillStyle = lin(0, y - 3 * s, 0, y + 15 * s, 'rgba(180,208,238,0)', 'rgba(180,208,238,.85)'); X.fillRect(x - 32 * s, y - 3 * s, 64 * s, 20 * s);
    X.fillStyle = 'rgba(255,255,255,.95)'; ell(x - 8 * s, y - 9 * s, 6 * s, 3 * s, -0.3); X.fill(); ell(x + 6 * s, y - 12 * s, 4 * s, 2 * s, -0.2); X.fill();
  });
  X.restore();
}
function balloon(x, y, s, col, sx = 0) {
  X.strokeStyle = 'rgba(110,100,100,.8)'; X.lineWidth = 0.7; X.beginPath(); X.moveTo(x, y + 14 * s);
  X.bezierCurveTo(x + 5 * s + sx, y + 22 * s, x - 5 * s + sx, y + 30 * s, x + sx * 1.6, y + 40 * s); X.stroke();
  X.beginPath(); X.moveTo(x, y - 13 * s); X.bezierCurveTo(x + 13 * s, y - 13 * s, x + 12 * s, y + 6 * s, x, y + 13 * s); X.bezierCurveTo(x - 12 * s, y + 6 * s, x - 13 * s, y - 13 * s, x, y - 13 * s);
  fillS(radO(x - 4 * s, y - 6 * s, s, x, y, 15 * s, shade(col, 1.4), col, shade(col, 0.78)), OL(col), 0.9 * s);
  X.beginPath(); X.moveTo(x, y + 12.5 * s); X.lineTo(x - 2.5 * s, y + 16 * s); X.lineTo(x + 2.5 * s, y + 16 * s); X.closePath(); fillS(shade(col, 0.85), OL(col), 0.7 * s);
  shine(x - 4.5 * s, y - 5.5 * s, 2.6 * s, 4.6 * s, 0.35, 0.75); shine(x - 2 * s, y - 10.5 * s, 1.1 * s, 0.8 * s, 0, 0.8);
}
function bird(x, y, s, col = '#5aa8e8', flip = 1, up = true) {
  X.save(); X.translate(x, y); X.scale(flip * s, s);
  X.beginPath(); X.moveTo(-7, 1); X.lineTo(-11, -1); X.lineTo(-10, 3); X.closePath(); fillS(shade(col, 0.8), OL(col), 0.7);
  ell(0, 1, 7, 5); fillS(radO(-2, -1, 0, 0, 1, 7, shade(col, 1.35), col, shade(col, 0.85)), OL(col), 0.8);
  ell(1, 3, 4, 2.4); fillS('#fff4e0');
  X.beginPath(); X.moveTo(6.5, 0); X.lineTo(10, 1.2); X.lineTo(6.5, 2.4); X.closePath(); fillS('#ffb02e', '#c97a10', 0.5);
  X.fillStyle = '#2e1f1c'; circ(4, -1, 1); X.fill(); X.fillStyle = '#fff'; circ(3.7, -1.3, 0.35); X.fill();
  X.beginPath(); if (up) { X.moveTo(-3, -1); X.quadraticCurveTo(-4, -10, 3, -12); X.quadraticCurveTo(2, -5, 2, 0); } else { X.moveTo(-3, 0); X.quadraticCurveTo(-2, 8, 4, 8); X.quadraticCurveTo(2, 3, 2, 0); }
  X.closePath(); fillS(shade(col, 0.88), OL(col), 0.7);
  X.restore();
}
function farBird(x, y, s, col = 'rgba(70,90,120,.7)') { X.strokeStyle = col; X.lineWidth = 1.1 * s; X.beginPath(); X.moveTo(x - 5 * s, y - 1 * s); X.quadraticCurveTo(x - 2.5 * s, y - 4 * s, x, y); X.quadraticCurveTo(x + 2.5 * s, y - 4 * s, x + 5 * s, y - 1 * s); X.stroke(); }
function trunk(x, y, w, h, col = '#8a5a32') {
  X.beginPath(); X.moveTo(x - w * 0.9, y + 0.5); X.quadraticCurveTo(x - w * 0.45, y - h * 0.35, x - w * 0.5, y - h); X.lineTo(x + w * 0.5, y - h);
  X.quadraticCurveTo(x + w * 0.45, y - h * 0.35, x + w, y + 0.5); X.quadraticCurveTo(x, y - 1.5, x - w * 0.9, y + 0.5); X.closePath();
  fillS(lin(x - w, 0, x + w, 0, shade(col, 1.25), col, shade(col, 0.72)), OL(col), Math.max(0.6, w * 0.18));
  X.strokeStyle = rgba('#3c2410', 0.35); X.lineWidth = Math.max(0.4, w * 0.12);
  X.beginPath(); X.moveTo(x - w * 0.1, y - h * 0.15); X.quadraticCurveTo(x - w * 0.2, y - h * 0.5, x - w * 0.05, y - h * 0.8); X.moveTo(x + w * 0.3, y - h * 0.3); X.lineTo(x + w * 0.25, y - h * 0.55); X.stroke();
}
function tree(x, y, s, leaf = '#5cbf4a', fruit = null) {
  soft(x + 3 * s, y + 0.5, 21 * s, 4.5 * s, 0.3);
  trunk(x, y, 5 * s, 27 * s);
  const cs = [[0, -45, 15], [-12, -36, 12], [12, -37, 12.5], [-6, -27, 11], [8, -27, 11], [0, -36, 13], [-16, -27, 8], [17, -28, 8]].map(([a, b, r]) => [x + a * s, y + b * s, r * s]);
  blobs(cs, leaf, { lw: 0.8 * s, off: 3 * s, hlY: y - 34 * s, tex: () => {
    X.strokeStyle = shade(leaf, 0.7); X.lineWidth = 0.7 * s;
    for (const [a, b] of [[-6, -42], [7, -44], [-12, -31], [3, -33], [12, -30], [-3, -24], [14, -38]]) { X.beginPath(); X.arc(x + a * s, y + b * s, 3 * s, 0.15 * Math.PI, 0.85 * Math.PI); X.stroke(); }
  } });
  if (fruit) for (const [a, b] of [[-9, -40], [7, -33], [-3, -27], [13, -42], [-14, -30]]) {
    const fx = x + a * s, fy = y + b * s; circ(fx, fy, 2.6 * s); fillS(radO(fx - 0.8 * s, fy - 0.8 * s, 0, fx, fy, 2.6 * s, shade(fruit, 1.4), fruit, shade(fruit, 0.75)), OL(fruit), 0.5 * s);
    X.fillStyle = 'rgba(255,255,255,.75)'; circ(fx - 0.9 * s, fy - 0.9 * s, 0.7 * s); X.fill();
  }
}
function bush(x, y, s, col = '#57b847', flowers = null) {
  soft(x + 2 * s, y + 0.5, 16 * s, 3.5 * s, 0.25);
  const cs = [[-9, -5, 7], [0, -9, 9], [9, -5, 7], [-3, -3, 6], [5, -3, 6]].map(([a, b, r]) => [x + a * s, y + b * s, r * s]);
  blobs(cs, col, { lw: 0.7 * s, off: 2 * s, hlY: y - 10 * s });
  if (flowers) for (const [a, b] of [[-8, -8], [2, -13], [8, -6], [-2, -5]]) { const fx = x + a * s, fy = y + b * s; X.fillStyle = flowers; for (let i = 0; i < 5; i++) { circ(fx + Math.cos(i * 1.257) * 1.4 * s, fy + Math.sin(i * 1.257) * 1.4 * s, 1.1 * s); X.fill(); } X.fillStyle = '#fff3a0'; circ(fx, fy, 0.8 * s); X.fill(); }
}
function pine(x, y, s, col = '#2f9a5a', snow = false, lights = null) {
  soft(x + 2 * s, y + 0.5, 15 * s, 3.5 * s, 0.28);
  rrect(x - 2.6 * s, y - 8 * s, 5.2 * s, 9 * s, 1 * s); fillS(lin(x - 3 * s, 0, x + 3 * s, 0, '#9c6a3c', '#6e4424'), '#4a2c14', 0.6 * s);
  for (let k = 0; k < 3; k++) {
    const w = [18, 14.5, 10.5][k] * s, ty = y - 6 * s - k * 11.5 * s, h = [17, 15, 14][k] * s, tip = ty - h - 4 * s;
    const path = () => { X.beginPath(); X.moveTo(x, tip); X.quadraticCurveTo(x + w * 0.3, ty - h * 0.35, x + w, ty); X.quadraticCurveTo(x + w * 0.5, ty + 3.2 * s, x, ty + 1.2 * s); X.quadraticCurveTo(x - w * 0.5, ty + 3.2 * s, x - w, ty); X.quadraticCurveTo(x - w * 0.3, ty - h * 0.35, x, tip); X.closePath(); };
    path(); fillS(lin(x - w, 0, x + w, 0, shade(col, 1.3), col, shade(col, 0.72)), OL(col), 0.8 * s);
    clipped(path, () => {
      X.fillStyle = 'rgba(10,40,20,.16)'; X.beginPath(); X.moveTo(x + 1 * s, tip); X.lineTo(x + w + 2, ty + 4 * s); X.lineTo(x + 1 * s, ty + 4 * s); X.fill();
      X.strokeStyle = shade(col, 0.75); X.lineWidth = 0.6 * s; for (const d of [-0.55, 0.05, 0.6]) { X.beginPath(); X.moveTo(x + d * w - 2 * s, ty - 1 * s); X.quadraticCurveTo(x + d * w, ty + 1.2 * s, x + d * w + 2 * s, ty - 1 * s); X.stroke(); }
      if (snow) { X.beginPath(); X.moveTo(x, tip - 1); X.quadraticCurveTo(x + w * 0.3, ty - h * 0.35, x + w * 0.62, ty - h * 0.2); X.quadraticCurveTo(x + w * 0.4, ty - h * 0.12, x + w * 0.25, ty - h * 0.28); X.quadraticCurveTo(x + w * 0.05, ty - h * 0.1, x - w * 0.15, ty - h * 0.3); X.quadraticCurveTo(x - w * 0.4, ty - h * 0.1, x - w * 0.62, ty - h * 0.2); X.quadraticCurveTo(x - w * 0.3, ty - h * 0.35, x, tip - 1); fillS('#ffffff'); }
    });

function paintPic(pic, g) {
  const old = X; X = g;
  g.save(); g.beginPath(); g.rect(0, 0, SW, SH); g.clip(); g.lineCap = 'round'; g.lineJoin = 'round';
  try { (ART[pic.id] || ART.meadow)(); } finally { g.restore(); X = old; }
}
function renderPic(pic, wpx, hpx) {
  const c = document.createElement('canvas'); c.width = wpx; c.height = hpx;
  const g = c.getContext('2d'); g.scale(wpx / SW, hpx / SH); paintPic(pic, g);
  return c;
}
// menu thumbnails are painted a few at a time after the menu shows, so it opens at once
const thumbs = {};
const thumbOf = pic => thumbs[pic.id] || '';
function fillThumbs() {
  const todo = PICS.filter(p => !thumbs[p.id]);
  const put = p => document.querySelectorAll(`.jg-pic[data-pic="${p.id}"] img`).forEach(im => { if (im.getAttribute('src') !== thumbs[p.id]) im.src = thumbs[p.id]; });
  PICS.forEach(p => thumbs[p.id] && put(p));
  const step = () => { const p = todo.shift(); if (!p) return; thumbs[p.id] = renderPic(p, 192, 144).toDataURL('image/png'); put(p); setTimeout(step, 0); };
  setTimeout(step, 30);
}
const picById = id => PICS.find(p => p.id === id) || PICS[0];

function picButtons() {
  const tile = (id, label, inner) => `<button type="button" class="jg-pic" data-pic="${id}" aria-pressed="${picSel === id}">${inner}${label}</button>`;
  return `<div class="jg-pics">${tile('random', '隨便一張', '<span class="dice">🎲</span>')}${PICS.map(p => tile(p.id, p.name, `<img ${thumbOf(p) ? `src="${thumbOf(p)}" ` : ''}alt="">`)).join('')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.jg-pic'); if (!b) return;
  picSel = b.dataset.pic; MG.store.set('jigsaw.pic', picSel); MG.sfx('click'); MG.unlock();
  document.querySelectorAll('.jg-pic').forEach(q => q.setAttribute('aria-pressed', q === b));
});
const MENU = {
  id: 'jigsaw', title: '拼拼圖',
  get html() { return `<p>把一片一片的拼圖拖到板子上，放到差不多的地方就會「喀」一聲吸進去！拼好了圖會動起來喔。不限時間，慢慢拼 ^_^</p><p>${PICS.length} 張圖、${LEVELS.length} 關：🔄 轉轉拼圖、🎁 翻翻驚喜、🟦 方塊拼圖、📏 長條拼圖、🔍 找找小朋友、🔀 兩圖混合、📖 故事拼圖（故事關卡會用故事裡的圖）！</p><p class="mg-pick-h">選一張圖</p>${picButtons()}`; },
  modes: [{ id: 'ghost', label: '🐣 有提示底圖', sub: '板子上有淡淡的圖' }, { id: 'plain', label: '🧩 沒有底圖', sub: '只看拼圖的形狀' }],
  levels: { count: PIECES.length, max: PIECES.length, label: lvLabel, short: n => `${n}${TY_IC[lvType(n)]}` },
  keys: '用手指或滑鼠拖拼圖　<kbd>H</kbd> 提示　按住 <kbd>V</kbd> 看原圖',
  playing: () => state === 'play' || state === 'find' || state === 'story',
  start: (m, lv) => { mode = m; start(picSel === 'random' ? pickRandomPic(state === 'menu' ? '' : pic.id) : picById(picSel), lv); },
};
function menu() {
  state = 'menu'; page = 0;
  if (!pieces.length || loose.length || lay.big || LV.mix || isStory(LV)) { setup(picSel === 'random' ? PICS[0] : picById(picSel), 1); }
  lay.btns = buttonsFor(lay.W, lay.H); bgDirty = true; hud();
  MG.choose(MENU); fillThumbs();
}
menu();

// small hook for automated tests
window.JGT = {
  get state() { return state; }, get level() { return level; }, get n() { return N; }, get pic() { return pic.id; }, get pic2() { return pic2 && pic2.id; }, get mode() { return mode; },
  get moves() { return moves; }, get placed() { return placedN; }, get type() { return lvType(level); }, get flags() { return flagsOf(LV); }, get page() { return page; }, get pages() { return isStory(LV) ? storyOf().pages.length : 1; },
  count: LEVELS.length, levels: () => LEVELS.map((l, i) => ({ n: i + 1, pieces: PIECES[i], type: lvType(i + 1), flags: flagsOf(l) })), pics: () => PICS.map(p => p.id),
  start: (lv, id) => start(id ? picById(id) : pic, lv), unique: () => uniqueShapes(), sigs: () => pieces.map(p => shapeSig(p.c, p.r)), get peek() { return peekA; }, words: () => words.map(w => w.text),
  lay: () => ({ W: lay.W, H: lay.H, pw: lay.pw, ph: lay.ph, pad: lay.pad, board: lay.board, big: lay.big, btns: lay.btns.map(b => ({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h, deco: !!b.deco })) }),
  pieces: () => pieces.map(p => ({ i: p.i, c: p.c, r: p.r, rot: p.rot, x: p.x, y: p.y, tx: tx(p), ty: ty(p), placed: p.placed, fly: !!p.fly, drag: p.drag, z: loose.indexOf(p) })),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; },
  // test helpers: skip the story card, snap every loose piece in (as if by hint), list / find the hidden friends
  skip() { if (state === 'story') { storyT = 2.6; breakApart(); } else if (state === 'pageWin') { winT = 9; } else if (state === 'storyOut') { storyT = 9; } },
  solve() { for (const p of loose.slice()) if (state === 'play' && !p.placed) { p.rot = 0; lock(p, true); } },
  friends: () => friends.map(f => { const b = lay.board, s = b.w / SW; return { kind: f.kind, decoy: f.decoy, found: f.found, lx: b.x + f.x * s, ly: b.y + (f.y - 12) * s }; }),
  findAll() { for (const f of friends) if (!f.decoy && !f.found) { const b = lay.board, s = b.w / SW; tapFind({ x: b.x + f.x * s, y: b.y + (f.y - 12) * s }); } },
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  if (state === 'play' || state === 'find' || state === 'story') {
    elapsed += dt;
    if (Math.floor(elapsed) !== Math.floor(elapsed - dt)) hud();
  }
  if (BIG.has(state)) { winT += dt; liveT += dt; }
  if (heroT > 0) heroT -= dt; if (heroHop > 0) heroHop -= dt;
  for (const f of friends) { if (f.found) f.ft += dt; if (f.hint > 0) f.hint -= dt; if (f.wig > 0) f.wig -= dt; }
  // 📖 the story card slides in, waits a moment, then breaks into pieces; after a page the card slides out
  if (state === 'story' && !MG.panelOpen()) { storyT += dt; if (storyT >= 2.6) breakApart(); }
  else if (state === 'pageWin' && winT > 2.4) { state = 'storyOut'; storyT = 0; bgDirty = true; MG.sfx('whoosh'); }
  else if (state === 'storyOut') { storyT += dt; if (storyT > 0.6) nextPage(); }
  for (const gl of glows) gl.t += dt; glows = glows.filter(g => g.t < 0.6);
  if (flips.length) { for (const f of flips) f.t += dt; const n0 = flips.length; flips = flips.filter(f => f.t < 0.45); if (flips.length !== n0) bgDirty = true; }
  for (const p of loose) { if (p.wig > 0) p.wig -= dt; const want = p.rot * Math.PI / 2; let d = want - p.ang; if (d < -Math.PI) d += Math.PI * 2; if (Math.abs(d) > 0.001) { p.ang += d * Math.min(1, dt * 14); if (Math.abs(want - p.ang) < 0.01) p.ang = want % (Math.PI * 2); } else p.ang = want; }
  for (const w of words) w.life -= dt; words = words.filter(w => w.life > 0);
  const showPeek = state === 'play' && (peekers.size > 0 || t < peekUntil);
  peekA += ((showPeek ? 1 : 0) - peekA) * Math.min(1, dt * 12);
  for (const p of loose.slice()) {
    if (p.fly) {
      const f = p.fly; f.t += dt;
      if (f.t >= 0) {
        const u = Math.min(1, f.t / f.dur), e = u * u * (3 - 2 * u);
        p.x = f.x0 + (f.x1 - f.x0) * e; p.y = f.y0 + (f.y1 - f.y0) * e - Math.sin(Math.PI * u) * f.arc;
        if (u >= 1) { p.fly = null; p.x = f.x1; p.y = f.y1; if (f.lock) lock(p, !!f.hint); }
      }
    }
    const want = p.drag || (p.fly && p.fly.lift && p.fly.t >= 0) ? 1 : 0;
    p.lift += (want - p.lift) * Math.min(1, dt * 14); if (p.lift < 0.01 && !want) p.lift = 0;
  }
  draw();
});
</script>
</body>
</html>
