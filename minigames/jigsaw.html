<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>拼拼圖</title>
<link rel="stylesheet" href="mini.css">
<style>
.mg-stage{padding:6px}
.jg-pics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.jg-pic{font:inherit;font-size:12px;font-weight:700;color:var(--ink);border:3px solid #e2cf9c;border-radius:10px;background:#fff;padding:3px 3px 2px;cursor:pointer;line-height:1.5}
.jg-pic img,.jg-pic .dice{display:block;width:100%;aspect-ratio:4/3;border-radius:6px;object-fit:cover}
.jg-pic .dice{display:flex;align-items:center;justify-content:center;font-size:30px;background:repeating-conic-gradient(#fff4cc 0 25%,#fff8dc 0 50%) 0 0/16px 16px}
.jg-pic[aria-pressed=true]{border-color:var(--jelly2);background:#eaffd9;box-shadow:0 0 0 3px #c8f2c0}
@media (min-width:600px){.jg-pic{font-size:13px}}
@media (max-width:480px){.mg-bar [data-s=moves]{display:none}}
</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'jigsaw', title: '拼拼圖', stats: ['prog', 'time', 'moves'] });
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const SW = 320, SH = 240;     // every picture is drawn in this 4:3 space
let x = null;                 // the context the picture-drawing code below paints on

// ================= pictures =================
// --- the five scenes from 大家來找碴 (spot.html), drawn without differences ---
const PAL = ['#ff5a4e', '#ff9f1c', '#ffd23f', '#4cc96a', '#3d9bff', '#8a63ff', '#ff6fb5', '#ffffff', '#6b4a22'];
const R = MG.rand, RI = MG.randi;
const P7 = PAL.slice(0, 7);
function otherColor(c, pool = PAL) { let n; do n = MG.pick(pool); while (n === c); return n; }
// colour pools per element type (a "colour" difference picks another one from the same pool)
const COLS = {
  balloon: P7, flower: P7, umbrella: P7, castle: P7, ball: P7, gift: P7, lolly: P7,
  boat: ['#d94a3c', '#3a7bd5', '#ffffff', '#ff9f1c', '#2e9a4c'],
  crab: ['#ff5a4e', '#ff9f1c', '#8a63ff', '#3d9bff'],
  shell: ['#ffb3cc', '#ffd98a', '#ffffff', '#c9b3ff'],
  starfish: ['#ff9f1c', '#ff6fb5', '#ff5a4e', '#ffd23f', '#8a63ff'],
  fish: ['#ff9f1c', '#ffd23f', '#ff6fb5', '#ff5a4e', '#8a63ff', '#4cc96a'],
  coral: ['#ff6f91', '#ff9f1c', '#b06fff', '#ff5a4e', '#ffd23f'],
  weed: ['#3aa85a', '#9ad04a', '#1f8a7a'],
  jelly: ['#ff9fd0', '#b49cff', '#ffd23f', '#ff8a5c'],
  pine: ['#ff5a4e', '#ffd23f', '#3d9bff', '#ff6fb5'],
  cupcake: ['#fff1f6', '#ff9fcf', '#a8e0ff', '#fff07a', '#c9b3ff'],
  icecream: ['#ffb3cf', '#fff3c4', '#a8e0ff', '#8a5a34', '#b6eb9a'],
  donut: ['#ff9fcf', '#8a5a34', '#ffffff', '#7fd0ff', '#ffe36b'],
  heart: ['#ff5a8a', '#ff9f1c', '#8a63ff', '#3d9bff'],
};
const col = type => MG.pick(COLS[type]);
const SCENES = {
  meadow(add) {
    const sunLeft = Math.random() < 0.5;
    add({ type: 'sun', x: sunLeft ? 40 : 280, y: 38, r: 20, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'cloud', x: 70 + i * 95 + R(-15, 15), y: R(30, 70), s: R(0.8, 1.1) });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'balloon', x: R(40, 280), y: R(55, 100), col: col('balloon') });
    for (let i = 0, n = RI(1, 3); i < n; i++) add({ type: 'bird', x: R(30, 290), y: R(20, 110), flip: Math.random() < 0.5 });
    row5(['house', 'house', 'tree', 'tree', 'tree'], 172, (k, sx) => k === 'house' ? house(sx, 172) : { type: 'tree', x: sx, y: 176, s: R(0.85, 1.1), leaf: MG.pick(['#4cc96a', '#3aa85a', '#79c94a']), fruit: Math.random() < 0.5 }).forEach(add);
    front(RI(5, 7), (fx, fy) => ({ type: 'flower', x: fx, y: fy, col: col('flower'), s: 1 })).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(206, 222), leaf: '#ffb72b' });
  },
  beach(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 38 : 282, y: 34, r: 18, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 90 + i * 110 + R(-15, 15), y: R(26, 56), s: R(0.75, 1) });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'bird', x: R(40, 280), y: R(60, 95), flip: Math.random() < 0.5 });
    const bx = MG.shuffle([R(40, 120), R(200, 280)]);
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'boat', x: bx[i], y: 148 + R(-3, 6), col: col('boat'), sail: MG.pick(['#ffffff', '#ffd23f', '#ff6fb5', '#9ad8ff']), flag: Math.random() < 0.5, s: R(0.85, 1) });
    row5(MG.shuffle(['umbrella', 'umbrella', 'castle', 'crab', 'ball']), 198, (k, sx) => {
      if (k === 'umbrella') return { type: 'umbrella', x: sx, y: 198, col: col('umbrella'), plain: false, s: 1 };
      if (k === 'castle') return { type: 'castle', x: sx, y: 200, col: col('castle'), three: Math.random() < 0.5, s: 1 };
      if (k === 'crab') return { type: 'crab', x: sx, y: 200, col: col('crab'), up: Math.random() < 0.5, s: 1.1 };
      return { type: 'ball', x: sx, y: 200, col: col('ball'), s: 1 };
    }).forEach(add);
    front(RI(4, 6), (fx, fy) => Math.random() < 0.5 ? { type: 'shell', x: fx, y: fy, col: col('shell'), s: 1 } : { type: 'starfish', x: fx, y: fy, col: col('starfish'), s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  sea(add) {
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'jelly', x: i ? R(190, 290) : R(30, 140), y: R(30, 70), col: col('jelly'), s: R(0.9, 1.1) });
    const fy = MG.shuffle([60, 85, 110, 135]);
    for (let i = 0, n = RI(4, 5); i < n; i++) add({ type: 'fish', x: 35 + i * (250 / (n - 1)) + R(-10, 10), y: (fy[i % 4] + R(-10, 10)), col: col('fish'), dir: Math.random() < 0.5 ? -1 : 1, stripe: Math.random() < 0.4, s: R(0.85, 1.1) });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'bubbles', x: 50 + i * 110 + R(-20, 20), y: R(28, 150), n: RI(3, 4) });
    row5(MG.shuffle(['coral', 'coral', 'weed', 'weed', 'chest']), 198, (k, sx) => {
      if (k === 'coral') return { type: 'coral', x: sx, y: 200, col: col('coral'), s: R(0.95, 1.15) };
      if (k === 'weed') return { type: 'weed', x: sx, y: 202, col: col('weed'), s: R(0.9, 1.1) };
      return { type: 'chest', x: sx, y: 202, open: Math.random() < 0.5, s: 1 };
    }).forEach(add);
    front(RI(3, 5), (fx, fy) => Math.random() < 0.5 ? { type: 'shell', x: fx, y: fy, col: col('shell'), s: 1 } : { type: 'starfish', x: fx, y: fy, col: col('starfish'), s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  snow(add) {
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 70 + i * 120 + R(-15, 15), y: R(26, 50), s: R(0.8, 1.05) });
    for (let i = 0, n = RI(3, 4); i < n; i++) add({ type: 'flake', x: 30 + i * (260 / (n - 1)) + R(-12, 12), y: R(66, 112), s: R(0.9, 1.15) });
    if (Math.random() < 0.6) add({ type: 'bird', x: R(40, 280), y: R(20, 45), flip: Math.random() < 0.5 });
    row5(MG.shuffle(['house', 'pine', 'pine', 'snowman', 'pine']), 174, (k, sx) => {
      if (k === 'house') return Object.assign(house(sx, 174), { snow: true });
      if (k === 'pine') return { type: 'pine', x: sx, y: 178, col: col('pine'), star: Math.random() < 0.5, s: R(0.9, 1.1) };
      return { type: 'snowman', x: sx, y: 178, hat: MG.pick(['#333a4a', '#d94a3c', '#3a7bd5']), scarf: MG.pick(['#ff5a4e', '#4cc96a', '#ffd23f', '#8a63ff']), btn: RI(2, 3), s: 1 };
    }).forEach(add);
    front(RI(3, 4), (fx, fy) => Math.random() < 0.65 ? { type: 'gift', x: fx, y: fy, col: col('gift'), rib: MG.pick(['#ffd23f', '#ffffff', '#ff5a4e']), bow: true, s: 1 } : { type: 'snowman', x: fx, y: fy + 2, hat: MG.pick(['#333a4a', '#d94a3c']), scarf: MG.pick(['#ff5a4e', '#4cc96a']), btn: 2, s: 0.6 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(210, 224), leaf: '#ffb72b' });
  },
  candy(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 40 : 280, y: 36, r: 18, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 90 + i * 110 + R(-15, 15), y: R(30, 60), s: R(0.8, 1) });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'heart', x: 50 + i * 100 + R(-20, 20), y: R(70, 110), col: col('heart'), s: R(0.9, 1.1) });
    if (Math.random() < 0.6) add({ type: 'balloon', x: R(40, 280), y: R(50, 90), col: col('balloon') });
    row5(MG.shuffle(['cupcake', 'lolly', 'icecream', 'lolly', 'cupcake']), 196, (k, sx) => {
      if (k === 'cupcake') return { type: 'cupcake', x: sx, y: 198, col: col('cupcake'), cherry: Math.random() < 0.6, s: 1.15 };
      if (k === 'lolly') return { type: 'lolly', x: sx, y: 200, col: col('lolly'), plain: false, s: 1.05 };
      return { type: 'icecream', x: sx, y: 200, col: col('icecream'), col2: col('icecream'), two: Math.random() < 0.5, s: 1.05 };
    }).forEach(add);
    front(RI(3, 4), (fx, fy) => ({ type: 'donut', x: fx, y: fy, col: col('donut'), spr: Math.random() < 0.6, s: 0.85 })).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
};
function house(sx, y) { return { type: 'house', x: sx, y, wall: MG.pick(['#ffe0b0', '#ffd0d0', '#d6ecff', '#e5ffd0']), roof: MG.pick(['#d94a3c', '#3a7bd5', '#7a4fbf', '#2e9a4c']), win: RI(1, 2), door: Math.random() < 0.5 ? -1 : 1 }; }
// five evenly spaced slots along the ground
function row5(kinds, y, make) { const slots = MG.shuffle([0, 1, 2, 3, 4]); return slots.map((s, i) => make(kinds[i], 32 + s * 64 + R(-6, 6))); }
// small things in the front strip
function front(n, make) { const out = []; for (let i = 0; i < n; i++) out.push(make(18 + i * (290 / n) + R(-8, 8), R(212, 232))); return out; }
const BACKS = {
  meadow(g, rnd) {
    const sky = g.createLinearGradient(0, 0, 0, 170); sky.addColorStop(0, '#7cc6ff'); sky.addColorStop(1, '#e6f6ff'); g.fillStyle = sky; g.fillRect(0, 0, SW, SH);
    // far mountains
    g.fillStyle = '#b5cfe8'; g.beginPath(); g.moveTo(0, 160);
    const pk = [0, 40 + rnd() * 30, 90 + rnd() * 40, 160 + rnd() * 40, 230 + rnd() * 40, SW];
    for (let i = 1; i < pk.length; i++) { g.lineTo((pk[i - 1] + pk[i]) / 2, 110 + rnd() * 25); g.lineTo(pk[i], 150); }
    g.lineTo(SW, 170); g.lineTo(0, 170); g.fill();
    // hills
    g.fillStyle = '#a7da82'; g.beginPath(); g.ellipse(70 + rnd() * 30, 172, 150, 30, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#93cf6c'; g.beginPath(); g.ellipse(240 + rnd() * 30, 174, 130, 24, 0, Math.PI, 0); g.fill();
    // tiny far trees on the hills
    for (let i = 0; i < 6; i++) { const tx = 20 + rnd() * 280, ty = 150 + rnd() * 12; g.fillStyle = '#6aad4c'; g.beginPath(); g.arc(tx, ty, 3.5, 0, 7); g.fill(); }
    // meadow
    const mg = g.createLinearGradient(0, 168, 0, SH); mg.addColorStop(0, '#86cc60'); mg.addColorStop(1, '#6db54a'); g.fillStyle = mg; g.fillRect(0, 168, SW, SH - 168);
    for (let i = 0; i < 120; i++) { const gx = rnd() * SW, gy = 176 + rnd() * 62; g.strokeStyle = `rgba(50,110,40,${0.25 + rnd() * 0.25})`; g.lineWidth = 1; g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx - 1, gy - 4); g.moveTo(gx + 1.5, gy); g.lineTo(gx + 2.5, gy - 3); g.stroke(); }
    // winding path with stepping stones
    const pxs = 130 + rnd() * 40;
    g.fillStyle = '#ead8a8'; g.beginPath(); g.moveTo(pxs - 12, 240); g.quadraticCurveTo(pxs + 26, 205, pxs + 8, 170); g.lineTo(pxs + 20, 170); g.quadraticCurveTo(pxs + 56, 206, pxs + 44, 240); g.fill();
    g.strokeStyle = 'rgba(160,130,80,.35)'; g.lineWidth = 1; g.stroke();
    for (let i = 0; i < 5; i++) { const tY = 236 - i * 14, tX = pxs + 16 + Math.sin(i * 0.9) * 6; g.fillStyle = '#d2c094'; g.beginPath(); g.ellipse(tX, tY, 6 - i * 0.7, 2.6 - i * 0.25, 0, 0, 7); g.fill(); }
    // fence segment
    const fx0 = rnd() < 0.5 ? 6 : 220, fy = 186;
    g.fillStyle = '#f4ead2'; g.strokeStyle = '#a8865a'; g.lineWidth = 1;
    g.fillRect(fx0, fy - 10, 92, 3); g.fillRect(fx0, fy - 4, 92, 3);
    for (let i = 0; i < 6; i++) { const xx = fx0 + 2 + i * 17; g.beginPath(); g.moveTo(xx, fy + 4); g.lineTo(xx, fy - 14); g.lineTo(xx + 2.5, fy - 17); g.lineTo(xx + 5, fy - 14); g.lineTo(xx + 5, fy + 4); g.closePath(); g.fill(); g.stroke(); }
    // rocks and grass tufts
    for (let i = 0; i < 4; i++) { const rx = 15 + rnd() * 290, ry = 200 + rnd() * 34; g.fillStyle = '#a9adb8'; g.beginPath(); g.ellipse(rx, ry, 6, 4, 0, Math.PI, 0); g.fill(); g.fillStyle = '#c9ccd6'; g.beginPath(); g.ellipse(rx - 1.5, ry - 1.5, 3, 1.6, 0, 0, 7); g.fill(); }
    for (let i = 0; i < 8; i++) { const tx = rnd() * SW, ty = 190 + rnd() * 48; g.strokeStyle = '#4f9a3a'; g.lineWidth = 1.4; for (const a of [-0.5, 0, 0.5]) { g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + Math.sin(a) * 6, ty - 7); g.stroke(); } }
  },
  beach(g, rnd) {
    const sky = g.createLinearGradient(0, 0, 0, 120); sky.addColorStop(0, '#6fc8ff'); sky.addColorStop(1, '#e4f7ff'); g.fillStyle = sky; g.fillRect(0, 0, SW, SH);
    // far island with a palm tree
    const ix = 50 + rnd() * 220;
    g.fillStyle = '#8fcf7a'; g.beginPath(); g.ellipse(ix, 122, 36, 9, 0, Math.PI, 0); g.fill();
    g.strokeStyle = '#8a6a44'; g.lineWidth = 2; g.beginPath(); g.moveTo(ix + 6, 116); g.quadraticCurveTo(ix + 9, 106, ix + 5, 98); g.stroke();
    g.fillStyle = '#4fae45'; for (const a of [-2.6, -2, -1.1, -0.5]) { g.beginPath(); g.ellipse(ix + 5 + Math.cos(a) * 7, 98 + Math.sin(a) * 3, 8, 2.4, a + Math.PI / 2 + 1.4, 0, 7); g.fill(); }
    const sea = g.createLinearGradient(0, 118, 0, 172); sea.addColorStop(0, '#2fa9e0'); sea.addColorStop(1, '#79d6ef'); g.fillStyle = sea; g.fillRect(0, 120, SW, 56);
    g.strokeStyle = 'rgba(255,255,255,.65)'; g.lineWidth = 1.4;
    for (let i = 0; i < 16; i++) { const wx = rnd() * SW, wy = 128 + rnd() * 38; g.beginPath(); g.arc(wx, wy, 4, Math.PI * 1.1, Math.PI * 1.9); g.arc(wx + 7, wy, 4, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
    const sand = g.createLinearGradient(0, 166, 0, SH); sand.addColorStop(0, '#f8e6b2'); sand.addColorStop(1, '#eccf8a'); g.fillStyle = sand;
    g.beginPath(); g.moveTo(0, 172); for (let xx = 0; xx <= SW; xx += 20) g.quadraticCurveTo(xx + 10, 166 + rnd() * 4, xx + 20, 171); g.lineTo(SW, SH); g.lineTo(0, SH); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(0, 172); for (let xx = 0; xx <= SW; xx += 20) g.quadraticCurveTo(xx + 10, 167, xx + 20, 172); g.stroke();
    for (let i = 0; i < 140; i++) { g.fillStyle = `rgba(170,130,60,${0.15 + rnd() * 0.25})`; g.fillRect(rnd() * SW, 176 + rnd() * 64, 1.3, 1.3); }
  },
  sea(g, rnd) {
    const w = g.createLinearGradient(0, 0, 0, SH); w.addColorStop(0, '#6fd6f7'); w.addColorStop(0.6, '#2f8fd0'); w.addColorStop(1, '#1f6fb8'); g.fillStyle = w; g.fillRect(0, 0, SW, SH);
    // light rays from the surface
    g.fillStyle = 'rgba(255,255,255,.12)';
    for (let i = 0; i < 4; i++) { const rx = 20 + rnd() * 280; g.beginPath(); g.moveTo(rx, 0); g.lineTo(rx + 22, 0); g.lineTo(rx + 70, 200); g.lineTo(rx + 30, 200); g.fill(); }
    // surface ripples
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1.5; for (let xx = 0; xx < SW; xx += 24) { g.beginPath(); g.arc(xx + 12, 2, 10, 0.2, Math.PI - 0.2); g.stroke(); }
    // far rocks
    g.fillStyle = '#2a6aa0'; g.beginPath(); g.moveTo(0, 196);
    for (let xx = 0; xx <= SW; xx += 32) g.quadraticCurveTo(xx + 16, 168 + rnd() * 16, xx + 32, 190);
    g.lineTo(SW, 210); g.lineTo(0, 210); g.fill();
    const sand = g.createLinearGradient(0, 190, 0, SH); sand.addColorStop(0, '#ecd8a0'); sand.addColorStop(1, '#d6b977'); g.fillStyle = sand;
    g.beginPath(); g.moveTo(0, 200); for (let xx = 0; xx <= SW; xx += 40) g.quadraticCurveTo(xx + 20, 192 + rnd() * 6, xx + 40, 199); g.lineTo(SW, SH); g.lineTo(0, SH); g.fill();
    for (let i = 0; i < 7; i++) { const px = rnd() * SW, py = 214 + rnd() * 24; g.fillStyle = '#b8a27a'; g.beginPath(); g.ellipse(px, py, 4 + rnd() * 3, 2.5, 0, 0, 7); g.fill(); }
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 1; for (let i = 0; i < 14; i++) { g.beginPath(); g.arc(rnd() * SW, 20 + rnd() * 160, 1.2 + rnd() * 1.6, 0, 7); g.stroke(); }
  },
  snow(g, rnd) {
    const sky = g.createLinearGradient(0, 0, 0, 170); sky.addColorStop(0, '#9fd2f7'); sky.addColorStop(1, '#eef7ff'); g.fillStyle = sky; g.fillRect(0, 0, SW, SH);
    g.fillStyle = '#c9dcef'; g.beginPath(); g.moveTo(0, 160);
    const pk = [0, 50 + rnd() * 30, 110 + rnd() * 40, 180 + rnd() * 40, 250 + rnd() * 30, SW];
    const tops = [];
    for (let i = 1; i < pk.length; i++) { const tx = (pk[i - 1] + pk[i]) / 2, ty = 104 + rnd() * 26; tops.push([tx, ty]); g.lineTo(tx, ty); g.lineTo(pk[i], 150); }
    g.lineTo(SW, 170); g.lineTo(0, 170); g.fill();
    g.fillStyle = '#ffffff'; for (const [tx, ty] of tops) { g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx - 11, ty + 13); g.lineTo(tx - 4, ty + 10); g.lineTo(tx, ty + 14); g.lineTo(tx + 5, ty + 10); g.lineTo(tx + 11, ty + 13); g.fill(); }
    g.fillStyle = '#e6f0fa'; g.beginPath(); g.ellipse(70 + rnd() * 30, 174, 150, 28, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#f2f7fd'; g.beginPath(); g.ellipse(240 + rnd() * 30, 176, 130, 22, 0, Math.PI, 0); g.fill();
    const gr = g.createLinearGradient(0, 170, 0, SH); gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#e2edf8'); g.fillStyle = gr; g.fillRect(0, 170, SW, SH - 170);
    g.strokeStyle = 'rgba(120,160,200,.25)'; g.lineWidth = 1.2; for (let i = 0; i < 10; i++) { const sx = rnd() * SW, sy = 182 + rnd() * 54; g.beginPath(); g.moveTo(sx - 10, sy); g.quadraticCurveTo(sx, sy - 3, sx + 10, sy); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,.95)'; for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(rnd() * SW, rnd() * 160, 0.8 + rnd() * 1.2, 0, 7); g.fill(); }

function drawColorPic(g, id) {
  const p = CPICS[id], regs = p.regions();
  g.save(); g.scale(0.8, 0.8);            // 300 tall art → 240; the frame is then 400 × 300
  g.lineJoin = 'round'; g.lineCap = 'round';
  regs.forEach((path, i) => {
    g.save();
    if (p.wide.includes(i)) g.scale(400 / 300, 1); else g.translate(50, 0);
    g.fillStyle = p.fills[i]; g.fill(path);
    if (i > 0) { g.strokeStyle = '#2a2f3a'; g.lineWidth = 3; g.stroke(path); }
    g.restore();
    if (i === 0 && p.extra) p.extra(g);
  });
  g.translate(50, 0); g.strokeStyle = '#2a2f3a'; g.fillStyle = '#2a2f3a'; g.lineWidth = 3; p.deco(g);
  g.restore();
}

cv.addEventListener('lostpointercapture', endPointer);
function drop(p, moved) {
  p.drag = false;
  if (state !== 'play' || p.placed) return;
  if (moved) { moves++; hud(); }
  // 🔄 a tap (no drag) turns the piece a quarter turn
  if (!moved && LV.rot) { p.rot = (p.rot + 1) % 4; MG.sfx('flip'); if (!p.rot) MG.sfx('pop'); return; }
  const snapD = Math.max(26, lay.S * 0.42);
  if (Math.hypot(p.x - tx(p), p.y - ty(p)) < snapD) {
    if (p.rot) { words.push({ text: '🔄 👆', x: p.x + lay.pw / 2, y: p.y + lay.ph / 2, life: 1 }); MG.sfx('miss'); p.wig = 0.4; return; }
    p.fly = { x0: p.x, y0: p.y, x1: tx(p), y1: ty(p), t: 0, dur: 0.09, arc: 0, lock: true }; return;
  }
  if (moved) streak = 0;                // dropped somewhere else: the streak starts again
  // never leave a piece under the buttons
  const o = outerOf(p);
  for (const b of lay.btns) if (hit(o, { x: b.x - 6, y: b.y - 6, w: b.w + 12, h: b.h + 12 })) { p.fly = { x0: p.x, y0: p.y, x1: p.x, y1: b.y - 8 - lay.pad - lay.ph, t: 0, dur: 0.18, arc: 0, lock: false }; break; }
  if (moved) MG.sfx('place');
}
addEventListener('keydown', e => {
  if (state !== 'play' || MG.panelOpen()) return;
  if (e.key === 'h' || e.key === 'H') useHint();
  if ((e.key === 'v' || e.key === 'V' || e.key === ' ') && !e.repeat) { e.preventDefault(); peekers.add('key'); peekStart(); }
});
addEventListener('keyup', e => { if (e.key === 'v' || e.key === 'V' || e.key === ' ') peekers.delete('key'); });

// ---------- drawing ----------
function rr(g, X, Y, w, h, r) { g.beginPath(); g.roundRect(X, Y, w, h, r); }
function backdrop(g) {
  const { W, H } = lay;
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#fff4dc'); bg.addColorStop(1, '#ffe4c6'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 26; i++) { const bx = (i * 137 + 40) % W, by = (i * 211 + 30) % H; g.beginPath(); g.arc(bx, by, 4 + (i % 4) * 3, 0, 7); g.fill(); }
}
function drawLayer(g) {
  backdrop(g);
  const { board: b, P, k } = lay;
  g.fillStyle = 'rgba(150,100,40,.18)'; rr(g, b.x - 8, b.y - 3, b.w + 16, b.h + 16, 14); g.fill();
  g.fillStyle = '#fffaf0'; rr(g, b.x - 8, b.y - 8, b.w + 16, b.h + 16, 14); g.fill();
  g.strokeStyle = '#e2c48e'; g.lineWidth = 3; g.stroke();
  if (state === 'won') { g.drawImage(picCv, b.x, b.y, b.w, b.h); return; }
  g.fillStyle = '#f3e7cf'; g.fillRect(b.x, b.y, b.w, b.h);
  if (mode === 'ghost' && !LV.back) { g.globalAlpha = 0.34; g.drawImage(picCv, b.x, b.y, b.w, b.h); g.globalAlpha = 1; }
  // faint piece outlines printed on the board
  g.save(); g.translate(b.x, b.y); g.strokeStyle = mode === 'ghost' && !LV.back ? 'rgba(110,80,40,.22)' : LV.back ? 'rgba(120,90,200,.55)' : 'rgba(140,105,55,.4)'; if (LV.back) g.lineWidth = 2; g.lineWidth = 1.2; g.setLineDash([4, 4]);
  for (const p of pieces) { g.save(); g.translate(p.c * lay.pw, p.r * lay.ph); if (LV.back) g.lineWidth = 2.2; g.stroke(p.path); g.restore(); }
  g.restore(); g.setLineDash([]);
  for (const p of pieces) if (p.placed && !flips.some(f => f.p === p)) g.drawImage(p.img, (lay.bxpx + p.c * lay.pwpx - lay.Ppx) / k, (lay.bypx + p.r * lay.phpx - lay.Ppx) / k, p.img.width / k, p.img.height / k);
  void P;
}
function drawPiece(p) {
  const k = lay.k, P = lay.P, img = LV.back ? p.back : p.img, imgS = LV.back ? p.backS : p.imgS;
  const wig = p.wig > 0 ? Math.sin(p.wig * 40) * 0.08 : 0;
  if (p.ang || wig) {
    const cx = p.x + lay.pw / 2, cy = p.y + lay.ph / 2, s = 1 + 0.08 * p.lift;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(p.ang + wig); ctx.scale(s, s); ctx.translate(-cx, -cy);
    ctx.drawImage(p.lift > 0.01 ? img : imgS, p.x - P, p.y - P, img.width / k, img.height / k);
    ctx.restore(); return;
  }
  if (p.lift > 0.01) {
    const s = 1 + 0.08 * p.lift, cx = p.x + lay.pw / 2, cy = p.y + lay.ph / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
    ctx.shadowColor = `rgba(60,40,10,${0.22 + 0.18 * p.lift})`; ctx.shadowBlur = (6 + 12 * p.lift) * k; ctx.shadowOffsetX = 2 * k * p.lift; ctx.shadowOffsetY = (3 + 9 * p.lift) * k;
    ctx.drawImage(img, p.x - P, p.y - P, img.width / k, img.height / k);
    ctx.restore();
  } else {
    ctx.drawImage(imgS, Math.round(p.x * k) / k - P, Math.round(p.y * k) / k - P, img.width / k, img.height / k);
  }
}
function drawButtons() {
  for (const b of lay.btns) {
    const on = b.id === 'peek' && peekA > 0.5;
    ctx.fillStyle = 'rgba(150,100,40,.25)'; rr(ctx, b.x, b.y + 4, b.w, b.h, 14); ctx.fill();
    ctx.fillStyle = b.id === 'hint' ? '#ffd23f' : on ? '#8fd0ff' : '#d6f0ff'; rr(ctx, b.x, b.y, b.w, b.h, 14); ctx.fill();
    ctx.strokeStyle = b.id === 'hint' ? '#c99a00' : '#5a9bd0'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#3a2f22'; ctx.font = `700 19px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  }
}
function draw() {
  if (!lay) return;
  const k = lay.k;
  if (!bgLayer) bgLayer = document.createElement('canvas');
  if (bgLayer.width !== cv.width || bgLayer.height !== cv.height) { bgLayer.width = cv.width; bgLayer.height = cv.height; bgDirty = true; }
  if (bgDirty) { const g = bgLayer.getContext('2d'); g.setTransform(k, 0, 0, k, 0, 0); drawLayer(g); bgDirty = false; }
  ctx.drawImage(bgLayer, 0, 0, cv.lw, cv.lh);
  const { board: b } = lay;
  // a sparkle ring on pieces that just clicked into place
  for (const gl of glows) {
    const a = 1 - gl.t / 0.6; if (a <= 0) continue;
    ctx.save(); ctx.translate(tx(gl.p), ty(gl.p)); ctx.globalAlpha = a; ctx.strokeStyle = '#fff7b0'; ctx.lineWidth = 4; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 12 * k; ctx.stroke(gl.p.path); ctx.restore();
  }
  // 🎁 a face-down piece that just clicked in turns over to show its bit of the picture
  for (const f of flips) {
    const u = Math.min(1, f.t / 0.45), sx = Math.abs(Math.cos(u * Math.PI)), p = f.p, front = u >= 0.5, im = front ? p.img : p.back;
    const cx = tx(p) + lay.pw / 2, cy = ty(p) + lay.ph / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(Math.max(0.04, sx) * (1 + 0.1 * Math.sin(u * Math.PI)), 1 + 0.1 * Math.sin(u * Math.PI)); ctx.translate(-cx, -cy);
    ctx.drawImage(im, tx(p) - lay.P, ty(p) - lay.P, im.width / k, im.height / k); ctx.restore();
  }
  if (state === 'play' && innerWidth <= 480) {   // no room in the top bar on phones: show the moves quietly here
    ctx.fillStyle = 'rgba(90,60,30,.55)'; ctx.font = `700 15px ${FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`✋ ${moves}`, 12, lay.btns[0].y + lay.btns[0].h / 2);
  }
  if (state === 'won') {
    const pulse = 0.5 + 0.5 * Math.sin(winT * 5);
    ctx.save(); ctx.strokeStyle = `rgba(255,214,70,${0.6 + 0.4 * pulse})`; ctx.lineWidth = 6; ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = (10 + 14 * pulse) * k;
    rr(ctx, b.x - 4, b.y - 4, b.w + 8, b.h + 8, 10); ctx.stroke(); ctx.restore();
    if (winT < 1) { ctx.fillStyle = `rgba(255,255,255,${0.7 * (1 - winT)})`; ctx.fillRect(b.x, b.y, b.w, b.h); }
    const r = Math.max(26, Math.min(58, b.h * 0.2)), hop = Math.abs(Math.sin(winT * 6)) * r * 0.45;
    MG.puPu(ctx, Math.min(lay.W - r * 1.2, b.x + b.w - r * 0.4), Math.min(lay.H - r * 1.1, b.y + b.h + r * 0.1) - hop, r, 'love', hop < 2 ? 0.12 : -0.05, { arms: 'up' });
  } else {
    const flying = [];
    for (const p of loose) { if (p.drag || p.lift > 0.01 || p.fly) flying.push(p); else drawPiece(p); }
    for (const p of flying) drawPiece(p);
  }
  MG.fx.draw(ctx);
  drawWords();
  if (peekA > 0.01 && state === 'play') {
    ctx.save(); ctx.globalAlpha = peekA;
    ctx.fillStyle = '#fff'; rr(ctx, b.x - 8, b.y - 8, b.w + 16, b.h + 16, 14); ctx.fill(); ctx.strokeStyle = '#5a9bd0'; ctx.lineWidth = 3; ctx.stroke();
    ctx.drawImage(picCv, b.x, b.y, b.w, b.h);
    ctx.restore();
  }
  if (state === 'play') drawButtons();
}

// short English + emoji words that float up from a piece that just clicked in
function drawWords() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const w of words) {
    let sz = w.big ? Math.max(30, Math.min(56, lay.board.h * 0.16)) : Math.max(20, Math.min(30, lay.S * 0.32));
    ctx.font = `900 ${sz}px ${FONT}`;
    let tw = ctx.measureText(w.text).width;
    if (tw > lay.W - 16) { sz = Math.floor(sz * (lay.W - 16) / tw); ctx.font = `900 ${sz}px ${FONT}`; tw = ctx.measureText(w.text).width; }
    const age = (w.big ? 1.6 : 1) - w.life, wx = Math.max(tw / 2 + 8, Math.min(lay.W - tw / 2 - 8, w.x)), wy = Math.max(sz, w.y - (w.big ? 0 : age * 40));
    const pop = age < 0.12 ? 0.6 + age / 0.12 * 0.5 : age < 0.22 ? 1.1 - (age - 0.12) : 1;
    ctx.save(); ctx.globalAlpha = Math.min(1, w.life * 2.5); ctx.translate(wx, wy); ctx.scale(pop, pop);
    ctx.lineWidth = Math.max(3, sz * 0.2); ctx.strokeStyle = '#fff'; ctx.strokeText(w.text, 0, 0);
    ctx.fillStyle = w.big ? '#ff4f8a' : '#ff7a00'; ctx.fillText(w.text, 0, 0);
    ctx.restore();
  }
}

// ---------- menu ----------
function picButtons() {
  const tile = (id, label, inner) => `<button type="button" class="jg-pic" data-pic="${id}" aria-pressed="${picSel === id}">${inner}${label}</button>`;
  return `<div class="jg-pics">${tile('random', '隨便一張', '<span class="dice">🎲</span>')}${PICS.map(p => tile(p.id, p.name, `<img src="${thumbOf(p)}" alt="">`)).join('')}</div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.jg-pic'); if (!b) return;
  picSel = b.dataset.pic; MG.store.set('jigsaw.pic', picSel); MG.sfx('click'); MG.unlock();
  document.querySelectorAll('.jg-pic').forEach(q => q.setAttribute('aria-pressed', q === b));
});
const MENU = {
  id: 'jigsaw', title: '拼拼圖',
  get html() { return `<p>把一片一片的拼圖拖到板子上，放到差不多的地方就會「喀」一聲吸進去！不限時間，慢慢拼 ^_^</p><p>後面的關卡有 🔄 轉轉拼圖、🎁 翻翻驚喜、🟦 方塊拼圖、📏 長條拼圖！</p><p class="mg-pick-h">選一張圖</p>${picButtons()}`; },
  modes: [{ id: 'ghost', label: '🐣 有提示底圖', sub: '板子上有淡淡的圖' }, { id: 'plain', label: '🧩 沒有底圖', sub: '只看拼圖的形狀' }],
  levels: { count: PIECES.length, max: PIECES.length, label: lvLabel, short: n => `${n}${TY_IC[lvType(n)]}` },
  keys: '用手指或滑鼠拖拼圖　<kbd>H</kbd> 提示　按住 <kbd>V</kbd> 看原圖',
  playing: () => state === 'play',
  start: (m, lv) => { mode = m; start(picSel === 'random' ? pickRandomPic(state === 'menu' ? '' : pic.id) : picById(picSel), lv); },
};
function menu() {
  state = 'menu';
  if (!pieces.length || loose.length) { setup(picSel === 'random' ? PICS[0] : picById(picSel), Math.min(PIECES.length, MG.store.get('jigsaw.pickLevel', 1))); }
  bgDirty = true; hud();
  MG.choose(MENU);
}
menu();

// small hook for automated tests (read-only)
window.JGT = {
  get state() { return state; }, get level() { return level; }, get n() { return N; }, get pic() { return pic.id; }, get mode() { return mode; },
  get moves() { return moves; }, get placed() { return placedN; }, get type() { return lvType(level); }, count: LEVELS.length, levels: () => LEVELS.map((l, i) => ({ n: i + 1, pieces: PIECES[i], type: lvType(i + 1) })),
  start: (lv, id) => start(id ? picById(id) : pic, lv), unique: () => uniqueShapes(), sigs: () => pieces.map(p => shapeSig(p.c, p.r)), get peek() { return peekA; }, words: () => words.map(w => w.text),
  lay: () => ({ W: lay.W, H: lay.H, pw: lay.pw, ph: lay.ph, pad: lay.pad, board: lay.board, btns: lay.btns.map(b => ({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h })) }),
  pieces: () => pieces.map(p => ({ i: p.i, c: p.c, r: p.r, rot: p.rot, x: p.x, y: p.y, tx: tx(p), ty: ty(p), placed: p.placed, fly: !!p.fly, drag: p.drag, z: loose.indexOf(p) })),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; },
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  if (state === 'play') {
    elapsed += dt;
    if (Math.floor(elapsed) !== Math.floor(elapsed - dt)) hud();
  }
  if (state === 'won') winT += dt;
  for (const gl of glows) gl.t += dt; glows = glows.filter(g => g.t < 0.6);
  if (flips.length) { for (const f of flips) f.t += dt; const n0 = flips.length; flips = flips.filter(f => f.t < 0.45); if (flips.length !== n0) bgDirty = true; }
  for (const p of loose) { if (p.wig > 0) p.wig -= dt; const want = p.rot * Math.PI / 2; let d = want - p.ang; if (d < -Math.PI) d += Math.PI * 2; if (Math.abs(d) > 0.001) { p.ang += d * Math.min(1, dt * 14); if (Math.abs(want - p.ang) < 0.01) p.ang = want % (Math.PI * 2); } else p.ang = want; }
  for (const w of words) w.life -= dt; words = words.filter(w => w.life > 0);
  const showPeek = state === 'play' && (peekers.size > 0 || t < peekUntil);
  peekA += ((showPeek ? 1 : 0) - peekA) * Math.min(1, dt * 12);
  for (const p of loose.slice()) {
    if (p.fly) {
      const f = p.fly; f.t += dt;
      if (f.t >= 0) {
        const u = Math.min(1, f.t / f.dur), e = u * u * (3 - 2 * u);
        p.x = f.x0 + (f.x1 - f.x0) * e; p.y = f.y0 + (f.y1 - f.y0) * e - Math.sin(Math.PI * u) * f.arc;
        if (u >= 1) { p.fly = null; p.x = f.x1; p.y = f.y1; if (f.lock) lock(p, !!f.hint); }
      }
    }
    const want = p.drag || (p.fly && p.fly.lift && p.fly.t >= 0) ? 1 : 0;
    p.lift += (want - p.lift) * Math.min(1, dt * 14); if (p.lift < 0.01 && !want) p.lift = 0;
  }
  draw();
});
</script>
