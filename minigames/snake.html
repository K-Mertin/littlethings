.mg-lv small{display:block;font-size:10px;color:#e8a400;letter-spacing:-.05em}
.mg-lvgrid .mg-lv{min-height:calc(48px * var(--ui));line-height:1.05}
.mg-lvgrid .mg-lv small::after{content:attr(data-s);white-space:pre}
.mg-lvgrid .mg-lv small{min-height:1.1em}
@media (max-width:400px){.mg-levels:not(.mg-lvgrid) .mg-lv{min-width:calc(25% - 6px)}}

      const n = drawStatus(cx, PL.btnEnd + 30);
      let top0 = PL.btnEnd + (n ? 50 : 16), room = P.y + P.h - top0;
      if (mode === 'level' && room > 200) { sceneCard(P.x + 16, top0, P.w - 32); top0 += 84; room -= 84; }
      if (room > 100) {
        const r = Math.min(46, room * 0.24), py = P.y + P.h - r * 1.05 - 18, hop = Math.abs(Math.sin(t * 3)) * 6;
        const m = state === 'won' ? 'love' : state === 'oops' ? 'ouch' : mood === 'love' || mood === 'wow' ? 'wow' : mood === 'tongue' ? 'tongue' : 'happy';
        MG.puPu(x, cx, py - hop, r, m, hop ? -0.03 : 0.05, { arms: 'up', look: Math.sin(t * 0.8) * 0.6 });
        const word = state === 'won' ? (flyWin ? 'Wow! 🦋' : 'Yay! 🎉') : state === 'oops' ? 'Oops! 💫' : homeOpen ? 'To the 🌿!' : combo >= 2 && t - lastEatT < 1.5 ? MG.WORDS.combo(combo) : munchT > 0 ? 'Yum! 😋' : 'Go! 💪';
        bubble(word, cx, py - r * 1.5 - 16);
      }
    } else if (PL.padTop - PL.btnEnd > 40) drawStatus(cx, (PL.padTop + PL.btnEnd) / 2);
  } else {
    const S0 = A.strip;
    if (!padOn) {
      const cx = W / 2, cy = btns[0].y + btns[0].h / 2;
      if (mode === 'level' && !(slowT > 0 || rainbowT > 0 || starT > 0)) { const x0 = btns[0].x + btns[0].w + 10, x1 = W - 20; drawPips((x0 + x1) / 2, btns[0].y, x1 - x0, btns[0].h); }
      else if (!drawStatus(cx, cy)) { emo(inf.a[0], cx - 26, cy, 22); txt(inf.a[1].replace(' / ', '/'), cx + 16, cy + 1, 19, '#c0392b', 'center', 900); }
    } else {
      txt(inf.a[1], 72, S0.y + S0.h - 50, 20, '#c0392b', 'center', 900); emo(inf.a[0], 72, S0.y + S0.h - 80, 20);
      if (!drawStatus(W - 72, S0.y + S0.h - 50) && mode === 'level') {
        const r = 26, py = S0.y + S0.h - 52, hop = Math.abs(Math.sin(t * 3)) * 4;
        MG.puPu(x, W - 72, py - hop, r, state === 'oops' ? 'ouch' : mood === 'love' || mood === 'wow' || state === 'won' ? 'wow' : 'happy', 0, { look: Math.sin(t * 0.8) * 0.6 });
      }
      txt(inf.b[1], 72, S0.y + S0.h - 20, 14, '#8a7a62', 'center', 800);
    }
    if (headerH) {
      const hy = oy - headerH / 2 - 2, label = mode === 'level' ? (homeOpen ? `第 ${level} 關・爬到小樹枝！` : order ? `第 ${level} 關・照順序：` : keyCell >= 0 && !gatesOpen ? `第 ${level} 關・先吃 🔑！` : food ? `第 ${level} 關・吃 ${goal} 片葉子！` : buds.size ? `第 ${level} 關・叫醒 ${goal} 朵花！` : `第 ${level} 關・吃 ${goal} 個水果！`) : `${MODE_NM[mode].split(' ')[1]}・${inf.sub}`;
      x.font = `900 19px ${FONT}`; const ow = orderW(26), tw = x.measureText(label).width, w = Math.min(W - 20, tw + 56 + ow);
      const wg = x.createLinearGradient(0, hy - 19, 0, hy + 19); wg.addColorStop(0, '#fffaf0'); wg.addColorStop(1, '#ffeccc');
      x.fillStyle = 'rgba(60,30,0,.18)'; rr(x, W / 2 - w / 2, hy - 16, w, 38, 19); x.fill();
      x.fillStyle = wg; rr(x, W / 2 - w / 2, hy - 19, w, 38, 19); x.fill(); x.strokeStyle = '#b77b3e'; x.lineWidth = 2.5; x.stroke();
      x.fillStyle = '#6fcf5a'; x.strokeStyle = '#2f7f34'; x.lineWidth = 1.5; for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(W / 2 + sd * (w / 2 - 6), hy - 17, 9, 4.5, sd * 0.5, 0, 7); x.fill(); x.stroke(); }
      emo(mode === 'level' ? LV[level - 1][1] : MODE_NM[mode].split(' ')[0], W / 2 - w / 2 + 22, hy, 19); txt(label, W / 2 - w / 2 + 40 + tw / 2, hy + 1, 19, '#5a3a1e', 'center', 900);
      if (order && !homeOpen) drawOrderRow(W / 2 - w / 2 + 44 + tw + ow / 2, hy, 26);

}
function draw() {
  if (lkey() !== layerKey) buildLayer();
  x.drawImage(layer, 0, 0, W, H);
  drawCritters();
  drawItems();
  drawSnake();
  MG.fx.draw(x);
  drawCeleb();
  for (const f of floats) {
    x.globalAlpha = clamp(f.life / f.max * 2.5, 0, 1);
    const fs = Math.min(Math.max(16, cs * 0.5), 34); x.font = `900 ${fs}px ${FONT}`;
    const hw = x.measureText(f.text).width / 2 + 6;
    txt(f.text, clamp(f.x, hw, Math.max(hw, W - hw)), Math.max(fs, f.y), fs, f.col, 'center', 900, 'rgba(90,60,0,.85)', 4);
  }
  x.globalAlpha = 1;
  drawUI();
}

// ---------- menu ----------
function levelLabel(n) { const k = lvKinds(n); return `${n} ${LV[n - 1][1]} ${LV[n - 1][0]}${k.length ? '（新玩法）' : ''}`; }
function levelShort(n) { const s = (MG.store.get('snake.stars', [])[n - 1]) || 0, k = lvKinds(n); return `${n}${k.length ? KMARK[k[0]] : ''}<small data-s="${s ? '★'.repeat(s) + '☆'.repeat(3 - s) : ' '}"></small>`; }
function menu() {
  startDemo(); hud(true);
  MG.choose({
    id: 'snake', title: '噗噗毛毛蟲',
    html: `<p>噗噗變成一條果凍毛毛蟲！帶牠去吃 🍎🍌🍇🍓，吃一個就變長一節。<b>往想去的方向滑一下</b>就會轉彎，也可以<b>點毛毛蟲旁邊</b>、用 🎮 方向鍵或鍵盤。</p>` +
      `<p>⭐ 星星加分、🐢 藥水變慢、🌈 彩虹果讓身體變彩色，還有一下就不見的金蘋果！</p>` +
      `<p>🎯 關卡第 16 關開始有新玩法：🌀 傳送洞、🐞 瓢蟲、⚽ 滾球、🎨 照順序吃、🏃 會跑的水果、🔑 鑰匙開籬笆、🌸 花花單行道！</p>` +
      `<p>🆕 第 41～45 關：🌻 爬過睡著的花苞，把它們都叫醒開花！</p><p>第 31～40 關：🔤 照字母吃、🌿 迷宮花園、🦋 吃飽葉子變成蝴蝶！每 5 關換一個新場景喔。</p>`,
    picks: [{ key: 'rule', title: '🎯 關卡模式：碰到東西會…', def: 'pass', options: [{ id: 'pass', label: '🫧 穿過去', sub: '停一下、自己轉彎，不會輸' }, { id: 'retry', label: '🔁 重來', sub: '撞到就從頭開始這關' }] }],
    modesTitle: '玩法',
    modes: [{ id: 'slow', label: '🐢 慢慢玩', sub: '牆可以穿過去，不會輸' }, { id: 'classic', label: '⭐ 經典', sub: '撞到就結束，越來越快' }, { id: 'level', label: '🎯 關卡', sub: `${LEVELS} 關，吃夠水果過關` }],
    levelsTitle: '🎯 關卡模式從哪一關開始？',
    levels: { count: LEVELS, max: LEVELS, label: levelLabel, short: levelShort, fresh: n => n >= 41 },
    keys: '滑一下轉彎、點毛毛蟲旁邊、🎮 方向鍵　電腦：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>',
    playing: () => state === 'play',
    start: (m, lv, pk) => { rule = pk && pk.rule === 'retry' ? 'retry' : 'pass'; startRound(m, m === 'level' ? lv : 1); },
  });
}
menu();

// ---------- hook for automated tests ----------
window.SNK = {
  get state() { return state; }, get mode() { return mode; }, get level() { return level; }, get rule() { return rule; }, get demo() { return demo; },
  get eaten() { return eaten; }, get goal() { return goal; }, get score() { return score; }, get bumps() { return bumps; }, get combo() { return combo; },
  get length() { return sim.body.length + sim.grow; }, get dir() { return sim.dir; }, get queue() { return sim.queue.slice(); }, get ticks() { return ticks; },
  get passes() { return passes; }, get padOn() { return padOn; }, get frames() { return frames; }, get stepT() { return stepT; }, get frameMs() { return frameMs; }, get lastEv() { return lastEv; },
  body: () => sim.body.map(p => p.slice()), fruits: () => fruits.map(f => ({ c: f.c, r: f.r, kind: f.kind })), item: () => item && { ...item },
  dims: () => ({ L, S: SS, Cd, Rd, cs, ox, oy, W, H, land, headerH, cssCell: cs * cssScale() }),
  board: () => ({ walls: Array.from(walls), ok: Array.from(okCell), C: L, R: SS }),
  spawnLog: () => spawnLog.slice(), levels: LV,
  btns: () => btns.map(b => ({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h })), padBtns: () => padBtns.map(b => ({ d: b.d, x: b.x, y: b.y, w: b.w, h: b.h })),
  head: () => headXY(),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  core, reachFrom: (S, c, r) => Array.from(reachFrom(S, c, r)),
  autoplay(on) { botOn = !!on; }, speed(k) { timeScale = k; },
  fast(sec, step = 1 / 60) { const n = Math.round(sec / step); for (let i = 0; i < n; i++) { t += step; update(step); } },
  headU: () => headP.slice(), segPts: () => segPts.map(p => [p[0], p[1]]), get atCentre() { return atCentre; },
  screenPts: () => segPts.map(p => { const q = ptXY(p); return [q.x, q.y]; }),
  turnScreen: d => turnScreen(d), placeFruit(c, r, kind = 'apple') { fruits = [{ c, r, kind, born: t }]; },
  start(lv, r = 'pass') { MG.hide(); rule = r; startRound('level', lv); }, go() { MG.hide(); if (state === 'intro') state = 'play'; },
  kinds: n => lvKinds(n), get gatesOpen() { return gatesOpen; }, get orderIdx() { return orderIdx; }, get order() { return order && order.slice(); },
  movers: () => movers.map(m => ({ kind: m.kind, cell: m.cells[m.k], cells: m.cells.slice() })), portal: () => portal && Array.from(portal), oneway: () => oneway && Array.from(oneway),
  get stateX() { return state; },
  placeItem(c, r, kind) { item = { c, r, kind, life: 10, max: 10, born: t }; },
  get home() { return homeCell; }, get homeOpen() { return homeOpen; }, get metaT() { return metaT; }, get flyWin() { return flyWin; }, get seq() { return seq; },
  get theme() { return THEME_ORDER.find(k => THEMES[k] === TH); }, hint: () => hint.slice(), mazeSpots: () => mazeSpots && mazeSpots.slice(),
  critters: () => critters.length, celeb: () => celeb.length, eatenKinds: () => eatenKinds.slice(),
  win() { if (state === 'play') levelClear(homeCell >= 0); },
  bench(n = 100) { const t0 = performance.now(); for (let i = 0; i < n; i++) { t += 1 / 60; update(1 / 60); draw(); } return (performance.now() - t0) / n; },
};

MG.loop(dt => {
  dt *= timeScale;
  const t0 = performance.now();
  t += dt; frames++;
  update(dt);
  draw();
  frameMs = frameMs * 0.9 + (performance.now() - t0) * 0.1;
  hud();
});
