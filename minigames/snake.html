<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

@media (max-width:400px){.mg-levels .mg-lv{min-width:calc(25% - 6px)}}
</style>
</head>
<body>
<main class="mg-stage" id="stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'snake', title: '噗噗毛毛蟲', stats: ['len', 'info'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), stageEl = document.getElementById('stage');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

// ---------- 15 levels: 14 × 10 (long side × short side). '.' grass, B bush, P pond, R rock, S = head start (facing →, body to its left) ----------
const LV = [
  ['大草原', '🌼', 5, ['..............', '..............', '..............', '..............', '...S..........', '..............', '..............', '..............', '..............', '..............']],
  ['小石頭', '🪨', 6, ['..............', '..............', '...R......R...', '...S..........', '......RR......', '......RR......', '..............', '...R......R...', '..............', '..............']],
  ['樹叢', '🌳', 6, ['..............', '..............', '..BBBB........', '..............', '...S..........', '..............', '........BBBB..', '..............', '..............', '..............']],
  ['小池塘', '🦆', 7, ['..............', '...S..........', '..............', '.....PPPP.....', '.....PPPP.....', '.....PPPP.....', '..............', '..............', '..............', '..............']],
  ['四個角落', '🍄', 8, ['..............', '.RR........RR.', '.R..........R.', '...S..........', '......BB......', '......BB......', '..............', '.R..........R.', '.RR........RR.', '..............']],
  ['兩道籬笆', '🌿', 8, ['..............', '...S..........', 'BBBBBB..BBBBBB', '..............', '..............', '..............', '..............', 'BBB..BBBBBBBBB', '..............', '..............']],
  ['小河', '🐟', 9, ['......PP......', '......PP......', '......PP......', '...S..........', '......PP......', '......PP......', '..............', '......PP......', '......PP......', '......PP......']],
  ['石頭柱子', '🗿', 9, ['..............', '..R...R...R...', '..R...R...R...', '..R...R...R...', '...S..........', '..............', '...R...R...R..', '...R...R...R..', '...R...R...R..', '..............']],
  ['花園小屋', '🏡', 10, ['..............', '...S..........', '...BBB..BBB...', '...B......B...', '..............', '..............', '...B......B...', '...BBB..BBB...', '..............', '..............']],
  ['池塘和石頭', '🐸', 10, ['..............', '.PP.....R.....', '.PP.......PP..', '.....R....PP..', '...S..........', '..R.....PP....', '........PP..R.', '.PP...........', '.PP....R......', '..............']],
  ['繞圈圈', '🌀', 11, ['...S..........', '.BBBBBBBBBBBB.', '.B............', '.B.BBBB.BBBB..', '.B.B.......B..', '.B.B.......B..', '.B.BBBBB.BBB..', '.B............', '.BBBBBBBBBBBB.', '..............']],
  ['跳格子', '🎲', 11, ['..............', '.R..R..R..R...', '..............', '...R..R..R..R.', '...S..........', '.R..R..R..R...', '..............', '...R..R..R..R.', '..............', '..............']],
  ['湖邊樹林', '🦢', 12, ['..............', '..PPP....BBB..', '..PPP.........', '..PPP....BBB..', '...S..........', '..............', '..BBB....PPP..', '.........PPP..', '..BBB....PPP..', '..............']],
  ['十字路口', '🚦', 12, ['......BB......', '......BB......', '...S..........', '......BB......', 'BBB.BBBBBB.BBB', '......BB......', '..............', '......BB......', '......BB......', '......BB......']],
  ['大花園', '🌈', 13, ['..............', '.B.R.P..P.R.B.', '..............', '.P.B.R..R.B.P.', '...S..........', '..............', '.P.B.R..R.B.P.', '..............', '.B.R.P..P.R.B.', '..............']],
];
const LEVELS = LV.length, MIN_CSS = 34;
const OB = { B: 1, P: 2, R: 3 };   // obstacle kinds

// ---------- the movement core (pure: also used by the unit tests through window.SNK.core) ----------
// S = { C, R, body: [[c, r], …] head first, dir, queue, grow, wrap, selfPass, walls: Uint8Array(C*R) }
// directions: 0 → (+c), 1 ↓ (+r), 2 ←, 3 ↑
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
const core = {
  make(o) { return { C: o.C, R: o.R, body: o.body.map(p => p.slice()), dir: o.dir ?? 0, queue: [], grow: o.grow || 0, wrap: !!o.wrap, selfPass: !!o.selfPass, walls: o.walls || new Uint8Array(o.C * o.R) }; },
  // buffer up to 2 turns; never the same way or straight back (compared with the last planned direction)
  turn(S, d) {
    const last = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
    if (d === last || (d === (last + 2) % 4 && S.body.length > 1) || S.queue.length >= 2) return false;
    S.queue.push(d); return true;
  },
  // where would the head go with direction d (null = outside a walled board)
  ahead(S, d, from) {
    const h = from || S.body[0]; let c = h[0] + DX[d], r = h[1] + DY[d];
    if (c < 0 || r < 0 || c >= S.C || r >= S.R) { if (!S.wrap) return null; c = (c + S.C) % S.C; r = (r + S.R) % S.R; }
    return [c, r];
  },
  // one step. ev: 'move' | 'pass' (went through itself) | 'wall' | 'block' (obstacle) | 'self' (bumped itself)
  step(S) {
    if (S.queue.length) { const q = S.queue.shift(); if (q !== (S.dir + 2) % 4 || S.body.length === 1) S.dir = q; }
    const nx = core.ahead(S, S.dir);
    if (!nx) return { ev: 'wall' };
    const [c, r] = nx;
    if (S.walls[r * S.C + c]) return { ev: 'block', c, r };
    const n = S.body.length, upto = S.grow > 0 ? n : n - 1;   // the tail moves away this step unless we are growing
    let hit = false;
    for (let i = 1; i < upto; i++) if (S.body[i][0] === c && S.body[i][1] === r) { hit = true; break; }
    if (hit && !S.selfPass) return { ev: 'self', c, r };
    S.body.unshift([c, r]);
    if (S.grow > 0) S.grow--; else S.body.pop();
    return { ev: hit ? 'pass' : 'move', c, r };
  },
};
// grid helpers on a sim
const freeN = (S, c, r) => { let n = 0; for (let d = 0; d < 4; d++) { const a = core.ahead(S, d, [c, r]); if (a && !S.walls[a[1] * S.C + a[0]]) n++; } return n; };
function reachFrom(S, c0, r0) {     // BFS over non-obstacle cells
  const seen = new Uint8Array(S.C * S.R), q = [[c0, r0]]; seen[r0 * S.C + c0] = 1;
  for (let h = 0; h < q.length; h++) for (let d = 0; d < 4; d++) { const a = core.ahead(S, d, q[h]); if (!a) continue; const i = a[1] * S.C + a[0]; if (!seen[i] && !S.walls[i]) { seen[i] = 1; q.push(a); } }
  return seen;
}

// ---------- state ----------
let state = 'menu', mode = 'slow', rule = 'pass', level = 1, demo = false;
let sim = null, L = 14, SS = 10, okCell = null, boardId = 0, walls = null, obKind = null;
let from = [], segs = [], acc = 0, stepT = 0.3, frac = 0, blockT = 0, bumpAnim = 0, bumpDir = 0, lastEv = '';
let lastEatTick = 0, fruits = [], item = null, eaten = 0, goal = 0, score = 0, combo = 0, lastEatT = -9, bumps = 0, best0 = 0;
let starT = 0, slowT = 0, rainbowT = 0, munchT = 0, wave = 9, oopsT = 0, winT = 0, giggleT = 0, moodT = 0, mood = 'happy';
let headAng = 0, t = 0, frames = 0, floats = [], growCols = [], spawnLog = [], botOn = false, timeScale = 1, ticks = 0, passes = 0, roundId = 0;
let padOn = MG.store.get('snake.pad', (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0);
let W = 480, H = 800, land = false, cs = 40, ox = 0, oy = 0, Cd = 14, Rd = 10, headerH = 0;
const A = { board: { x: 0, y: 0, w: 1, h: 1 } };
let btns = [], padBtns = [], pressed = null, pressT = 0;
const sprites = new Map(); let layer = null, layerKey = '';
const SND = {}; const snd = (n, a, gap = 60) => { if (demo) return; const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
const FRUITS = ['apple', 'banana', 'grape', 'berry'];
const FCOL = { apple: 'red', banana: 'yellow', grape: 'purple', berry: 'pink', gold: 'gold', rainbow: 'rainbow' };
const RAINBOW = ['red', 'orange', 'yellow', 'green', 'mint', 'blue', 'purple'];
const PAL = { ...MG.JELLY, gold: ['#fffbe0', '#ffe680', '#ffcc2e', '#e0a000', '#9a6c00'] };
const SPEC = { star: { life: 10 }, potion: { life: 10 }, rainbow: { life: 10 }, gold: { life: 5 } };
const MODE_NM = { slow: '🐢 慢慢玩', classic: '⭐ 經典', level: '🎯 關卡' };

// ---------- own tiny synth for the munch (pitch rises with the length) and the giggle; follows the 🔊 button ----------
let ac2 = null;
function au() {
  if (demo || MG.store.get('muted', false)) return null;
  try { ac2 = ac2 || new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  if (ac2.state === 'suspended') ac2.resume();
  return ac2;
}
function blip(f0, f1, dur, type, vol, delay = 0) {
  const a = au(); if (!a) return;
  const tt = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, tt); o.frequency.exponentialRampToValueAtTime(f1, tt + dur);
  g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(vol, tt + 0.012); g.gain.exponentialRampToValueAtTime(0.0006, tt + dur);
  o.connect(g).connect(a.destination); o.start(tt); o.stop(tt + dur + 0.02);
}
function munch(n) {
  const f = 300 * Math.pow(2, Math.min(n, 36) / 24);
  blip(f, f * 1.5, 0.07, 'triangle', 0.16); blip(f * 1.26, f * 1.9, 0.08, 'triangle', 0.13, 0.08);
}
function giggle() { for (let i = 0; i < 4; i++) blip(780 + i * 60, 980 + i * 60, 0.06, 'sine', 0.09, i * 0.075); }
addEventListener('pointerdown', () => au(), { once: true });

// ---------- layout ----------
function cssScale() { const r = cv.getBoundingClientRect(); return Math.max(0.1, (r.width - 6) / W); }
function mkPad(cx, cy, s) { const g = 6; for (const [dx, dy, d] of [[1, 0, 0], [0, 1, 1], [-1, 0, 2], [0, -1, 3]]) padBtns.push({ id: 'pad', d, x: cx + dx * (s + g) - s / 2, y: cy + dy * (s + g) - s / 2, w: s, h: s }); }
let PL = {};
function layoutAreas() {
  W = cv.lw; H = cv.lh; land = W > H; btns = []; padBtns = [];
  const slow = mode === 'slow';
  if (land) {
    const PW = 236, px0 = W - PW, compact = H < 520;
    A.panel = { x: px0 + 2, y: 10, w: PW - 12, h: H - 20 }; A.strip = null;
    A.board = { x: 12, y: 12, w: px0 - 22, h: H - 24 };
    const bx = px0 + 16, bw = PW - 44, s = 66, bh = compact ? 64 : 58;
    PL = compact ? { title: 36, sub: 0, a: 72, b: 104, compact } : { title: 42, sub: 76, a: 112, b: 148, compact };
    let y = compact ? 124 : padOn ? 176 : 214;
    if (compact && padOn && slow) {
      const hw = (bw - 8) / 2;
      btns.push({ id: 'pad', x: bx, y, w: hw, h: bh, short: 1 }, { id: 'rest', x: bx + hw + 8, y, w: hw, h: bh, short: 1 });
      y += bh;
    } else {
      btns.push({ id: 'pad', x: bx, y, w: bw, h: bh }); y += bh;
      if (slow) { y += 8; btns.push({ id: 'rest', x: bx, y, w: bw, h: bh }); y += bh; }
    }
    PL.btnEnd = y;
    if (padOn) { const cy = H - 14 - 10 - 1.5 * s - 6; mkPad(px0 + PW / 2 - 4, cy, s); PL.padTop = cy - 1.5 * s - 6; }
  } else {
    const B = padOn ? 244 : 100, bh = 64;
    A.strip = { x: 8, y: H - B, w: W - 16, h: B - 8 }; A.panel = null;
    A.board = { x: 10, y: 10, w: W - 20, h: H - B - 18 };
    if (padOn) {
      btns.push({ id: 'pad', x: 16, y: H - B + 14, w: 112, h: bh, short: 1 });
      if (slow) btns.push({ id: 'rest', x: W - 128, y: H - B + 14, w: 112, h: bh, short: 1 });
      mkPad(W / 2, H - B / 2 - 4, 66);
    } else {
      btns.push({ id: 'pad', x: 16, y: H - B + 10, w: 140, h: bh });
      if (slow) btns.push({ id: 'rest', x: W - 156, y: H - B + 10, w: 140, h: bh });
    }
  }
}
function placeBoard() {
  Cd = land ? L : SS; Rd = land ? SS : L;
  const m = A.board;
  cs = Math.min(m.w / Cd, m.h / Rd);
  if (!land && m.h - Rd * cs < 46) cs = Math.min(cs, (m.h - 46) / Rd);   // keep room for the little title in portrait
  ox = m.x + (m.w - Cd * cs) / 2;
  const gap = m.h - Rd * cs;
  headerH = !land && gap >= 44 ? Math.min(58, gap) : 0;
  oy = m.y + headerH + (m.h - headerH - Rd * cs) / 2;
  sprites.clear();
}
function freeDims() {
  const k = cssScale(), a = A.board, lc = Math.max(a.w, a.h - (land ? 0 : 50)) * k, sc = Math.min(a.w, a.h - (land ? 0 : 50)) * k;
  return [clamp(Math.floor(lc / MIN_CSS), 10, 20), clamp(Math.floor(sc / MIN_CSS), 8, 14)];
}
function relayout() { layoutAreas(); placeBoard(); layerKey = ''; }
cv.onfit = () => relayout();
MG.fit(cv, (sw, sh) => {
  const l = sw > sh * 1.05;
  if (l) { H = sh < 470 ? 440 : 600; W = Math.round(Math.min(H * 2.2, Math.max(H * 1.33, H * sw / sh))); }
  else { W = 480; H = Math.round(Math.min(1000, Math.max(640, W * sh / sw))); }
  return [W, H];
});
// canonical cell (float ok) → screen centre (portrait shows the board turned over: column ↔ row)
function cellXY(c, r) { return land ? { x: ox + (c + 0.5) * cs, y: oy + (r + 0.5) * cs } : { x: ox + (r + 0.5) * cs, y: oy + (c + 0.5) * cs }; }
const scr2can = d => land ? d : [1, 0, 3, 2][d];   // screen direction ↔ canonical direction (the same swap both ways)

// ---------- rounds ----------
function buildBoard() {
  walls = new Uint8Array(L * SS); obKind = new Uint8Array(L * SS);
  let start = [Math.floor(L / 3), Math.floor(SS / 2)];
  if (mode === 'level') {
    const map = LV[level - 1][3];
    for (let r = 0; r < SS; r++) for (let c = 0; c < L; c++) { const ch = map[r][c]; if (OB[ch]) { walls[r * L + c] = 1; obKind[r * L + c] = OB[ch]; } if (ch === 'S') start = [c, r]; }
  }
  const wrap = mode === 'slow', selfPass = mode === 'slow' || (mode === 'level' && rule === 'pass');
  sim = core.make({ C: L, R: SS, body: [start, [start[0] - 1, start[1]], [start[0] - 2, start[1]]], dir: 0, wrap, selfPass, walls });
  const seen = reachFrom(sim, start[0], start[1]);
  okCell = new Uint8Array(L * SS);
  for (let i = 0; i < L * SS; i++) okCell[i] = seen[i] && !walls[i] && freeN(sim, i % L, (i / L) | 0) >= 2 ? 1 : 0;
  boardId++;
}
function speedFor() {
  if (mode === 'slow') return 0.34;
  if (mode === 'classic') return Math.max(0.14, 0.26 - eaten * 0.005);
  return 0.31 - (level - 1) * 0.006;
}
function resetRun() {
  from = sim.body.map(p => p.slice()); segs = sim.body.map((_, i) => ({ col: i === 0 ? 'green' : i % 2 ? 'mint' : 'green', born: -9 }));
  acc = 0; frac = 0; blockT = 0; bumpAnim = 0; lastEv = ''; fruits = []; item = null; eaten = 0; score = 0; combo = 0; lastEatT = -9;
  starT = slowT = rainbowT = munchT = 0; wave = 9; oopsT = 0; winT = 0; giggleT = 0; moodT = 0; mood = 'happy'; growCols = []; floats = []; spawnLog = []; passes = 0;
  headAng = 0; ticks = 0; lastEatTick = 0; MG.fx.clear();
  stepT = speedFor();
  const nf = mode === 'slow' ? 2 : 1;
  for (let i = 0; i < nf; i++) spawnFruit();
}
function startRound(m, lv, how = 'new') {
  mode = m; level = lv || level; demo = false;
  layoutAreas();
  if (mode === 'level') { L = 14; SS = 10; } else [L, SS] = freeDims();
  if (how !== 'retry') bumps = 0;
  buildBoard(); placeBoard(); resetRun(); roundId++;
  best0 = MG.store.get('snake.best.' + mode, 0);
  goal = mode === 'level' ? LV[level - 1][2] : 0;
  state = 'play'; MG.hide(); layerKey = '';
  if (how !== 'retry') MG.toast(mode === 'level' ? `第 ${level} 關 ${LV[level - 1][1]}　Go! 🚀` : `${MODE_NM[mode]}　Go! 🚀`, 1800);
  hud(true);
}
function startDemo() {
  demo = true; mode = 'slow'; layoutAreas();
  [L, SS] = freeDims(); buildBoard(); placeBoard(); resetRun(); state = 'menu'; layerKey = '';
}

// ---------- fruit ----------
function onSnake(i) { for (const p of sim.body) if (p[1] * L + p[0] === i) return true; return false; }
function spawnCell(minD = 3) {
  const h = sim.body[0], cand = [], far = [];
  for (let i = 0; i < L * SS; i++) {
    if (!okCell[i] || onSnake(i) || fruits.some(f => f.r * L + f.c === i) || (item && item.r * L + item.c === i)) continue;
    cand.push(i);
    const c = i % L, r = (i / L) | 0;
    if (Math.abs(c - h[0]) + Math.abs(r - h[1]) >= minD) far.push(i);
  }
  const pool = far.length ? far : cand;
  if (!pool.length) return -1;
  return pool[(Math.random() * pool.length) | 0];
}
function spawnFruit() {
  const i = spawnCell(); if (i < 0) return false;
  fruits.push({ c: i % L, r: (i / L) | 0, kind: FRUITS[(Math.random() * FRUITS.length) | 0], born: t });
  spawnLog.push(i); return true;
}
function maybeSpecial() {
  if (item || eaten < 2 || Math.random() > (demo ? 0.4 : 0.3)) return;
  const bag = ['star', 'star', 'rainbow', 'rainbow', 'gold', 'gold', 'potion', 'potion'];
  const kind = bag[(Math.random() * bag.length) | 0];
  const i = spawnCell(2); if (i < 0) return;
  item = { c: i % L, r: (i / L) | 0, kind, life: SPEC[kind].life, max: SPEC[kind].life, born: t };
  spawnLog.push(i);
  if (!demo) { snd('sparkle'); if (kind === 'gold') addFloat(item.c, item.r, '✨', 0.8); }
}

// ---------- feedback ----------
function addFloat(c, r, text, life = 1, col = '#fff3a0') {
  const p = cellXY(c, r), fs = Math.min(Math.max(16, cs * 0.5), 34);
  let y = p.y - cs * 0.5;
  for (let k = 0; k < 6 && floats.some(f => Math.abs(f.x - p.x) < cs * 3 && Math.abs(f.y - y) < fs * 1.05); k++) y -= fs * 1.1;   // stack instead of overlapping
  floats.push({ x: p.x, y, text, life, max: life, col });
}
function burstAt(c, r, o) { const p = cellXY(c, r); MG.fx.burst(p.x, p.y, o); }
function eat(c, r) {
  // regular fruit
  const fi = fruits.findIndex(f => f.c === c && f.r === r);
  if (fi >= 0) {
    const f = fruits[fi]; fruits.splice(fi, 1);
    gotFruit(f.kind, c, r, 1);
    if (!(mode === 'level' && eaten >= goal)) spawnFruit();
    maybeSpecial();
  }
  if (item && item.c === c && item.r === r) {
    const k = item.kind; item = null;
    if (k === 'star') {
      score += 3; starT = 5; mood = 'wow'; moodT = 1;
      addFloat(c, r, '+3 🌟', 1.1); snd('sparkle'); snd('perfect');
      burstAt(c, r, { n: 18, colors: ['#ffd23f', '#fff3a0', '#fff'], shape: 'star', speed: 200, up: 80, size: Math.max(3, cs * 0.12), life: 0.9 });
    } else if (k === 'potion') {
      slowT = 6; mood = 'wow'; moodT = 1;
      addFloat(c, r, 'Slow… 🐢', 1.2, '#c8f2ff'); snd('whoosh'); snd('match', 2);
      burstAt(c, r, { n: 14, colors: ['#8ff0d6', '#c8f2ff', '#fff'], speed: 140, up: 60, size: Math.max(3, cs * 0.1), life: 0.8 });
    } else if (k === 'rainbow') {
      rainbowT = 8; gotFruit('rainbow', c, r, 2);

function tailK(i, n) { const fromEnd = n - 1 - i; return fromEnd >= 3 ? 1 : 0.76 + fromEnd * 0.08; }

function drawHead(hx, hy) {
  const r = cs * 0.56, a = headAng, fx = Math.cos(a), fy = Math.sin(a), px = -fy, py = fx;

  x.fillStyle = 'rgba(255,255,255,.75)'; x.beginPath(); x.ellipse(cx - r * 0.42, cy - r * 0.45, r * 0.2, r * 0.11, -0.75, 0, 7); x.fill();

  for (const sd of [-1, 1]) {
    const ex = cx + fx * r * ez + px * r * es * sd, ey = cy + fy * r * ez + py * r * es * sd - r * 0.08;

      x.strokeStyle = ink; x.lineWidth = Math.max(1.2, r * 0.09); const q = r * 0.12;
      x.beginPath(); x.moveTo(ex - q, ey - q); x.lineTo(ex + q, ey + q); x.moveTo(ex + q, ey - q); x.lineTo(ex - q, ey + q); x.stroke();
    } else if (blink || mood === 'love' && moodT > 0) {
      x.strokeStyle = ink; x.lineWidth = Math.max(1.2, r * 0.08); x.beginPath(); x.arc(ex, ey + r * 0.04, r * 0.12, Math.PI + 0.35, -0.35); x.stroke();
    } else {
      x.fillStyle = '#fff'; x.beginPath(); x.ellipse(ex, ey, r * 0.2, r * 0.23, 0, 0, 7); x.fill();
      x.strokeStyle = 'rgba(24,38,26,.5)'; x.lineWidth = Math.max(0.8, r * 0.04); x.stroke();
      const qx = ex + lkx * r * 0.08, qy = ey + lky * r * 0.09;
      x.fillStyle = ink; dot(x, qx, qy, r * 0.12);

  // cheeks
  x.fillStyle = 'rgba(255,110,140,.45)';
  for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(cx + fx * r * 0.42 + px * r * 0.62 * sd, cy + fy * r * 0.42 + py * r * 0.62 * sd + r * 0.06, r * 0.13, r * 0.08, 0, 0, 7); x.fill(); }

  if (munchT > 0 || near || state === 'oops' || mood === 'tongue' && moodT > 0) {
    const open = munchT > 0 ? 0.5 + 0.5 * Math.abs(Math.sin(munchT * 28)) : 1;
    x.fillStyle = '#7a2a33'; x.beginPath(); x.ellipse(mx, my, r * 0.17, r * 0.15 * open + 0.5, 0, 0, 7); x.fill();
    x.fillStyle = '#ff8aa0'; x.beginPath(); x.ellipse(mx, my + r * 0.06 * open, r * 0.09, r * 0.05 * open + 0.3, 0, 0, 7); x.fill();
  } else {
    x.strokeStyle = ink; x.lineWidth = Math.max(1.2, r * 0.08); x.beginPath(); x.arc(mx - fx * r * 0.08, my - fy * r * 0.08, r * 0.15, a - Math.PI / 2 + 0.6, a + Math.PI / 2 - 0.6); x.stroke();
  }

}
function drawButton(b, label, colA, colB, edge) {

function infoLines() {
  const len = sim.body.length + sim.grow;

function drawUI() {

// ---------- menu ----------
function levelLabel(n) { const s = (MG.store.get('snake.stars', [])[n - 1]) || 0; return `${n} ${LV[n - 1][1]}<small>${s ? '★'.repeat(s) + '☆'.repeat(3 - s) : '&nbsp;'}</small>`; }
