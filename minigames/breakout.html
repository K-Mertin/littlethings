function baseW() { return mode === 'relax' ? 100 : 86; }
function targetSpeed() {
  const base = (mode === 'relax' ? 285 : 345) * SPD[spd] * (1 + (lvl - 1) * 0.012) * SC;
  return base * (1 + (testMax ? 0.3 : ramp)) * (slowT > 0 ? 0.65 : 1);
}
function mkBrick(ch) {
  if (!ch || ch === '.') return null;
  if (ch === '#') return { ch, metal: true, hp: 1, max: 1, flash: 0 };
  if (ch === '=') return { ch, metal: true, gate: true, hp: 1, max: 1, flash: 0 };
  if (ch === 'i' || ch === 'I') return { ch, col: 'ice', ice: true, hp: ch === 'I' ? 2 : 1, max: ch === 'I' ? 2 : 1, hard: ch === 'I', flash: 0 };
  if (ch === 's') return { ch, col: 'sw', sw: true, hp: 1, max: 1, flash: 0 };
  if (ch === 't') return { ch, col: 'y', star: true, hp: 1, max: 1, flash: 0 };
  if (ch === '*') return { ch, bonus: true, col: 'gold', hp: 1, max: 1, flash: 0 };
  if (ch === '@') return { ch, col: 'n', hp: 3, max: 3, hard: true, flash: 0 };
  const lo = ch.toLowerCase(), hard = ch !== lo;
  return { ch, col: PAL[lo] ? lo : 'w', hp: hard ? 2 : 1, max: hard ? 2 : 1, hard, flash: 0 };
}
function parseLevel(n) {
  const L = LEVELS[n - 1]; ROWS = L.rows.length; left = 0;
  bumps = []; portals = []; fstars = []; bosses = []; need = L.need || 0; caught = 0;
  const cell = (r, c) => ({ x: c * BW + BW / 2, y: BTOP + r * BH + BH / 2 });
  bricks = L.rows.map((row, r) => Array.from({ length: COLS }, (_, c) => {
    const ch = row[c];
    if (ch === '+') { bumps.push({ ...cell(r, c), r: 12, fl: 0 }); return null; }
    if (ch >= '1' && ch <= '4') { portals.push({ ...cell(r, c), id: +ch, r: 15 }); return null; }
    if (ch === 'X') return { ch, bossCell: true };
    const B = mkBrick(ch); if (B && !B.metal) left++; return B;
  }));
  for (const p of portals) p.to = portals.find(q => q.id === (p.id % 2 ? p.id + 1 : p.id - 1)) || null;
  portals = portals.filter(p => p.to);
  // boss bricks: each connected block of X is one big brick that shares its hit points
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!bricks[r][c] || !bricks[r][c].bossCell) continue;
    const B = { ch: 'X', boss: true, col: L.bc || 'p', hp: 0, max: 0, flash: 0, r0: r, c0: c, r1: r, c1: c }, st = [[r, c]];
    bricks[r][c] = B;
    while (st.length) {
      const [a, b] = st.pop(); B.hp++; B.r0 = Math.min(B.r0, a); B.r1 = Math.max(B.r1, a); B.c0 = Math.min(B.c0, b); B.c1 = Math.max(B.c1, b);
      for (const [da, db] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const q = brickAt(a + da, b + db); if (q && q.bossCell) { bricks[a + da][b + db] = B; st.push([a + da, b + db]); } }
    }
    B.hp = B.max = Math.round(B.hp * 1.2); left += B.hp; bosses.push(B);
  }
  // sliding rows: start where the picture is drawn and swing between the walls
  rowOff = Array(ROWS).fill(0); rowMv = Array(ROWS).fill(null);
  for (const k in (L.move || {})) {
    const r = +k, cs = bricks[r].map((B, c) => B ? c : -1).filter(c => c >= 0); if (!cs.length) continue;
    const lo = -Math.min(...cs) * BW, hi = (COLS - 1 - Math.max(...cs)) * BW; if (hi - lo < 8) continue;
    const sp = Math.min(0.9, 110 / (hi - lo)) * (L.move[k] < 0 ? -1 : 1), u = clamp((0 - lo) / (hi - lo) * 2 - 1, -1, 1);
    rowMv[r] = { lo, hi, sp, ph: Math.asin(u) };
  }

}
function drawNet() {
  if (!net && netFlash <= 0) return;
  const a = net ? 0.85 + Math.sin(t * 4) * 0.1 : netFlash / 0.6;
  x.globalAlpha = a; x.strokeStyle = '#d8c2ff'; x.lineWidth = 2.5;
  x.beginPath(); for (let xx = 0; xx <= FW; xx += 8) x.lineTo(xx, NET_Y + Math.sin(xx * 0.15 + t * 3) * 1.6); x.stroke();
  x.strokeStyle = 'rgba(216,194,255,.5)'; x.lineWidth = 1;
  for (let xx = 0; xx <= FW; xx += 16) { x.beginPath(); x.moveTo(xx, NET_Y); x.lineTo(xx + 8, NET_Y + 10); x.lineTo(xx + 16, NET_Y); x.stroke(); }

function chips() {
  const out = [];

  if (stickyT > 0) out.push(['sticky', stickyT / 15]); if (laserT > 0) out.push(['laser', laserT / 7]); if (net) out.push(['net', 1]);

}
function drawChip(type, f, cx, cy, big) {
  const pw = POW[type], w = big ? 150 : 46, h = big ? 34 : 24;
  x.fillStyle = 'rgba(255,255,255,.88)'; rrect(x, cx, cy, w, h, h / 2); x.fill();
  x.strokeStyle = pw.col[1]; x.lineWidth = 2; x.stroke();

  if (big) txt(pw.nm, cx + h + 4, cy + h / 2 + 1, 15, '#4a2b3a', 'left');

    const bx = big ? cx + w - 52 : cx + h - 2, bw = big ? 40 : w - h - 4;
    x.fillStyle = '#eee'; rrect(x, bx, cy + h / 2 - 3, bw, 6, 3); x.fill();
    x.fillStyle = f < 0.25 ? '#ff5a6e' : pw.col[1]; rrect(x, bx, cy + h / 2 - 3, Math.max(3, bw * f), 6, 3); x.fill();

function drawField() {
  // everything here is in field-local coordinates, clipped to the field
  x.save(); x.translate(F.x, F.y);
  x.beginPath(); x.roundRect(0, 0, FW, F.h, 10); x.clip();
  if (bricksDirty) drawBricksLayer();
  x.drawImage(brL, 0, 0, FW, brL.hh);
  for (let r = 0; r < ROWS; r++) if (rowMv[r]) for (let c = 0; c < COLS; c++) { const B = bricks[r][c]; if (B) x.drawImage(brickSprite(B).c, c * BW + rowOff[r], BTOP + r * BH, BW, BH); }
  for (const B of bosses) drawBoss(B);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const B = bricks[r][c]; if (!B || B.boss) continue;
    const bx = c * BW + rowOff[r];
    if (B.flash > 0) { x.fillStyle = `rgba(255,255,255,${B.flash / 0.14 * 0.7})`; rrect(x, bx + 1.5, BTOP + r * BH + 1.5, BW - 3, BH - 4, 5); x.fill(); }
    if (B.bonus || B.sw || B.star) {           // twinkle on gift boxes, switches and stars
      const k = (t * 1.3 + r * 0.37 + c * 0.61) % 1.6; if (k < 0.5) { const a = Math.sin(k / 0.5 * Math.PI); x.fillStyle = `rgba(255,255,255,${a})`; star4(bx + BW - 8, BTOP + r * BH + 5, 4 * a + 1); }
    }
  }

  if (!land) {
    const L = LEVELS[lvl - 1];
    x.fillStyle = '#000'; x.font = `15px ${EMOJI}`; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText(L.ic, 10, 20);
    txt(L.nm, 32, 20, 14, '#fff', 'left', 800);
    const bw = 90; x.fillStyle = 'rgba(255,255,255,.2)'; rrect(x, 10, 33, bw, 6, 3); x.fill();
    x.fillStyle = '#ffd23f'; rrect(x, 10, 33, Math.max(4, bw * progress()), 6, 3); x.fill();

    const cs = chips();

    const a = 0.65 + Math.sin(t * 6) * 0.35; x.globalAlpha = a;
    txt('👆 Tap!', FW / 2, P.y + 46, 18, '#fff', 'center', 900, 'rgba(60,20,80,.85)', 5); x.globalAlpha = 1;

    x.globalAlpha = a; x.font = `800 15px ${FONT}`;
    const w = x.measureText(say.text).width + 22, bx = clamp(P.x - w / 2, 4, FW - w - 4);
    x.fillStyle = '#fff'; rrect(x, bx, y0 - 14, w, 28, 14); x.fill();
    x.beginPath(); x.moveTo(clamp(P.x, bx + 12, bx + w - 12) - 6, y0 + 13); x.lineTo(clamp(P.x, bx + 12, bx + w - 12), y0 + 22); x.lineTo(clamp(P.x, bx + 12, bx + w - 12) + 6, y0 + 13); x.fill();
    txt(say.text, bx + w / 2, y0 + 1, 15, '#2e7a3e', 'center', 800); x.globalAlpha = 1;

}
const progress = () => need ? caught / need : 1 - left / Math.max(1, total);
function star4(cx, cy, r) { x.beginPath(); x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r); x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill(); }
function drawPanels() {
  const lw = F.x - 28, lx = 14, rx = F.x + FW + 14, L = LEVELS[lvl - 1];
  // left: level card + big cheering 噗噗
  txt(`第 ${lvl} 關`, lx + lw / 2, 50, 28, '#c0507e', 'center', 900);
  x.fillStyle = '#000'; x.font = `44px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(L.ic, lx + lw / 2, 104);
  txt(L.nm, lx + lw / 2, 150, 20, '#4a2b3a', 'center', 800);
  const bw = lw - 40; x.fillStyle = '#f6e1ea'; rrect(x, lx + 20, 174, bw, 12, 6); x.fill();
  x.fillStyle = '#ffb72b'; rrect(x, lx + 20, 174, Math.max(12, bw * progress()), 12, 6); x.fill();
  if (need) txt(`⭐ ${caught} / ${need}`, lx + lw / 2, 204, 20, '#d18f00', 'center', 900);
  else txt(`還剩 ${left} 塊`, lx + lw / 2, 202, 14, '#a07a8a', 'center', 700);
  const pr = Math.min(54, lw * 0.24), py = H * 0.6, sq = P.hit > 0 ? Math.sin(P.hitAge * 20) * P.hit * 0.1 : Math.sin(t * 2.4) * 0.03;
  const live = balls.find(b => !b.dead);
  MG.puPu(x, lx + lw / 2, py, pr, mood, sq, { look: live ? clamp((live.x - FW / 2) / 200, -1, 1) : 0, arms: mood === 'wow' || mood === 'love' ? 'up' : true });
  if (say && say.text) {
    x.globalAlpha = clamp(say.life * 3, 0, 1); x.font = `800 17px ${FONT}`;
    let sz = 17; while (sz > 11 && x.measureText(say.text).width + 24 > lw - 12) { sz--; x.font = `800 ${sz}px ${FONT}`; }
    const w = Math.min(lw - 12, x.measureText(say.text).width + 24), bx = lx + lw / 2 - w / 2, by = py - pr * 1.25 - 46;
    x.fillStyle = '#fff'; x.strokeStyle = '#e59ac0'; x.lineWidth = 2.5; rrect(x, bx, by, w, 34, 15); x.fill(); x.stroke();

function draw() {

// small hook for automated tests: read-only snapshots, plus a few test helpers
window.BOT = {

  get left() { return left; }, get lost() { return lost; }, get deep() { return deep; }, get combo() { return combo; }, get speed() { return targetSpeed(); },
  get powers() { return { wide: wideT, slow: slowT, sticky: stickyT, laser: laserT, net, shots: shots.length }; },
  get paddle() { return { x: P.x, y: P.y, w: P.w, h: P.h }; }, get field() { return { x: F.x, y: F.y, w: F.w, h: F.h, land }; },
