// ---------- levels: 11 columns ----------

  { nm: '冰淇淋', ic: '🍦', rows: [

  { nm: '城堡', ic: '🏰', rows: [

  { nm: '聖誕樹', ic: '🎄', rows: [

    '..ggkgggg..',
    '.ggggGgrgg.',

    '#..#...#..#'] },
  { nm: '糖果城堡', ic: '🍬', rows: [
    'kkkkkkkkkkk',

    'kO@@@@@@@Ok',

    '...........',
    '.#..#.#..#.'] },
];
const PAL = {
  r: ['#ffb3b3', '#ff6b6b', '#c43a48'], o: ['#ffd3a1', '#ff9a40', '#b85a14'], y: ['#fff6b0', '#ffd23f', '#b88a00'],
  g: ['#b8f5b0', '#4cc96a', '#1f7a3a'], b: ['#b8e0ff', '#4c9cf0', '#1d4f9e'], c: ['#c4fff2', '#3fd2b0', '#147a62'],
  p: ['#e2d2ff', '#a07cf2', '#4f2f9a'], k: ['#ffd6e8', '#ff8fbf', '#b03a72'], w: ['#fffdf5', '#f6e6c4', '#a88a5a'],
  n: ['#d9a77e', '#9a6038', '#4a2a14'], d: ['#6e7494', '#2e3350', '#c9cde8'], a: ['#f4f2ff', '#bdbbe0', '#5a5c7a'],
  gold: ['#fff2a8', '#ffc93a', '#a87400'],
};
const POW = {
  wide: { ic: '↔️', nm: '變長', col: ['#a8f0b0', '#2fae55', '#17602c'], say: '噗噗變長了！' },
  multi: { ic: '✨', nm: '多球', col: ['#c4e6ff', '#3d8ff0', '#1d4f9e'], say: '三顆球！' },
  slow: { ic: '🐢', nm: '慢慢球', col: ['#c4fff2', '#22ad8e', '#0f6a55'], say: '球變慢了～' },
  sticky: { ic: '🍯', nm: '黏黏', col: ['#fff3b0', '#e8a400', '#8a6000'], say: '黏黏的！點一下發射' },
  laser: { ic: '⚡', nm: '雷射', col: ['#ffc4d6', '#e84880', '#8e1f4a'], say: '雷射發射！' },
  net: { ic: '🛡️', nm: '保護網', col: ['#e2d2ff', '#7a52d0', '#3f2390'], say: '下面有保護網了！' },
};
const POW_KEYS = Object.keys(POW), POW_W = { wide: 3, multi: 2.6, slow: 2, sticky: 2, laser: 2.2, net: 2 };
const SPD = { slow: 0.85, mid: 1, fast: 1.18 };

// ---------- sizes (field-local coordinates: 0,0 = top-left of the play field) ----------
const FW = 440, COLS = 11, BW = FW / COLS, BH = 20, BTOP = 54, BALL_R = 7, PAD_H = 20, CAP_W = 78, CAP_H = 26;
let land = false, W = 456, H = 800, SC = 1, NET_Y = 680, ROWS = 0;
const F = { x: 8, y: 8, w: FW, h: 760 };

// ---------- state ----------
let state = 'menu', mode = 'relax', spd = 'mid', lvl = 1, t = 0, lt = 0, ramp = 0, turbo = 1, testMax = false;
let bricks = [], left = 0, total = 0, balls = [], caps = [], shots = [], floats = [];
let score = 0, lives = 3, lost = 0, combo = 0, bestCombo = 0, deep = 0, serveT = 0;
let wideT = 0, slowT = 0, stickyT = 0, laserT = 0, laserCD = 0, net = false, netFlash = 0;
let shake = 0, mood = 'happy', moodT = 0, say = null;
let bgL = null, bgKey = '', brL = null, bricksDirty = true;
const sprites = new Map();
const P = { x: FW / 2, tx: FW / 2, y: 600, w: 96, h: PAD_H, hit: 0, hitAge: 1, vx: 0 };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function baseW() { return mode === 'relax' ? 100 : 86; }
function targetSpeed() {
  const base = (mode === 'relax' ? 285 : 345) * SPD[spd] * (1 + (lvl - 1) * 0.012) * SC;
  return base * (1 + (testMax ? 0.3 : ramp)) * (slowT > 0 ? 0.65 : 1);
}
function mkBrick(ch) {
  if (!ch || ch === '.') return null;
  if (ch === '#') return { ch, metal: true, hp: 1, max: 1, flash: 0 };
  if (ch === '*') return { ch, bonus: true, col: 'gold', hp: 1, max: 1, flash: 0 };
  if (ch === '@') return { ch, col: 'n', hp: 3, max: 3, hard: true, flash: 0 };
  const lo = ch.toLowerCase(), hard = ch !== lo;
  return { ch, col: PAL[lo] ? lo : 'w', hp: hard ? 2 : 1, max: hard ? 2 : 1, hard, flash: 0 };
}
function parseLevel(n) {
  const L = LEVELS[n - 1]; ROWS = L.rows.length; left = 0;
  bricks = L.rows.map(row => Array.from({ length: COLS }, (_, c) => { const B = mkBrick(row[c]); if (B && !B.metal) left++; return B; }));
  total = left; bricksDirty = true;
}
const brickAt = (r, c) => r >= 0 && r < ROWS && c >= 0 && c < COLS ? bricks[r][c] : null;

// ---------- layout ----------
function layout() {
  const M = 8;
  F.w = FW; F.y = M; F.h = H - 2 * M; F.x = Math.round((W - FW) / 2);
  SC = F.h / 700;
  const oldY = P.y;
  P.y = F.h - 66; NET_Y = F.h - 16;
  for (const b of balls) if (b.y > P.y - b.r && b.y < oldY) b.y = P.y - b.r - 1;   // keep balls that were above the paddle above it
  for (const b of balls) if (b.stuck) b.y = P.y - b.r;
  bgKey = ''; bricksDirty = true; sprites.clear();
}
cv.onfit = () => layout();
MG.fit(cv, (sw, sh) => {
  land = sw > sh * 1.05;
  if (land) { H = 620; W = Math.round(Math.min(1150, Math.max(820, H * sw / sh))); }
  else { W = 456; H = Math.round(Math.min(920, Math.max(700, W * sh / sw))); }
  return [W, H];
});

// ---------- flow ----------
function newBall(stuck) { return { x: P.x, y: P.y - BALL_R, vx: 0, vy: 0, r: BALL_R, stuck, serve: stuck, off: 0, stuckT: 0, sb: 0, trail: [], dead: false }; }
function serve() { balls = [newBall(true)]; serveT = 0; }
function clearPowers() { wideT = slowT = stickyT = laserT = 0; net = false; caps = []; shots = []; }
function startLevel(n) {
  lvl = n; parseLevel(n);
  score = 0; lost = 0; combo = 0; bestCombo = 0; lt = 0; ramp = 0; lives = 3; deep = 0;
  clearPowers(); floats = []; MG.fx.clear(); shake = 0;
  P.w = baseW(); P.x = P.tx = FW / 2; serve();
  state = 'play'; MG.hide(); setMood('happy', 0);
  const L = LEVELS[n - 1];
  MG.toast(`第 ${n} 關：${L.ic} ${L.nm}　點一下發射！`, 2200);
  talk('加油！', 1.6);
  hud();
}
function stars() { return lost === 0 ? 3 : lost <= 2 ? 2 : 1; }
function win() {
  state = 'clear'; caps = []; shots = []; laserT = 0;
  for (const b of balls) { b.vx = b.vy = 0; }
  MG.sfx('win'); setMood('love', 99); talk('過關了！', 3); P.hit = 1; P.hitAge = 0;
  const rec = MG.record('breakout', lvl), st = stars();
  for (let i = 0; i < 4; i++) MG.fx.burst(FW * (0.2 + i * 0.2), BTOP + 60, { n: 18, colors: ['#ff8fbf', '#ffd23f', '#4cc96a', '#4c9cf0', '#a07cf2', '#fff'], shape: 'star', speed: 300, up: 160, size: 6, life: 1.3 });
  const at = lvl;
  setTimeout(() => {
    if (state !== 'clear' || lvl !== at || MG.panelOpen()) return;
    const L = LEVELS[lvl - 1], nx = LEVELS[lvl];
    MG.panel({
      title: `第 ${lvl} 關完成！`,
      html: `<div class="bo-stars">${'⭐'.repeat(st)}${'☆'.repeat(3 - st)}</div><div class="big">${score} 分</div>` +
        `<p>${L.ic} ${L.nm}打完了！${lost ? `球掉了 ${lost} 次` : '一次都沒掉球'}${bestCombo >= 3 ? `，最多 ${bestCombo} 連擊` : ''} ^_^</p>` +
        (st < 3 ? '<p>一次都不掉球就有三顆星喔</p>' : '<p>太厲害了，三顆星！</p>') +
        (rec.isNew ? '<p class="new">新紀錄！^_^</p>' : '') +
        (nx ? `<p>下一關：${nx.ic} ${nx.nm}</p>` : '<p>十五關全部打完了，你是打磚塊大師！</p>'),
      buttons: [
        { label: nx ? '下一關' : '回到第 1 關', on: () => { const n = nx ? lvl + 1 : 1; MG.store.set('breakout.pickLevel', n); startLevel(n); } },
        { label: '這關再玩', alt: true, on: () => startLevel(lvl) },
        { label: '選關卡', alt: true, on: menu },
      ],
    });
  }, 1200);
}
function gameOver() {
  state = 'over'; MG.sfx('over'); setMood('ouch', 99); talk('沒有球了…', 3);
  const at = lvl;
  setTimeout(() => {
    if (state !== 'over' || lvl !== at || MG.panelOpen()) return;
    MG.panel({
      title: '球掉光了！',
      html: `<p>還差一點點，再試一次吧 ^_^</p><div class="big">${score} 分</div><p>還剩 ${left} 塊磚塊</p><p>想慢慢玩的話，可以改成「🐢 慢慢玩」，球掉了也沒關係喔</p>`,
      buttons: [
        { label: '再試一次', on: () => startLevel(lvl) },
        { label: '🐢 改成慢慢玩', alt: true, on: () => { mode = 'relax'; MG.store.set('breakout.pickMode', 'relax'); startLevel(lvl); } },
        { label: '選關卡', alt: true, on: menu },
      ],
    });
  }, 800);
}
function allLost() {
  lost++; combo = 0; ramp = 0; MG.sfx('bad'); setMood('ouch', 1.4); shake = Math.max(shake, 0.25);
  clearPowers();
  if (mode === 'challenge') {
    lives--; hud();
    if (lives <= 0) { balls = []; gameOver(); return; }
    MG.toast(lives === 1 ? '最後一條命，加油！' : `還有 ${lives} 條命，加油！`, 1600);
  } else MG.toast('再試一次！點一下發射 ^_^', 1600);
  talk('再試一次！', 1.8);
  serve();
}
let lastHud = '';
function hud() {
  const s = `${lvl}|${score}|${lives}|${mode}`;
  if (s === lastHud) return; lastHud = s;
  MG.stat('level', `第 ${lvl} 關`);
  MG.stat('score', `${score} 分`);
  MG.stat('lives', mode === 'challenge' ? `❤️ ${lives}` : '🐢 ∞');
}
function setMood(m, d) { mood = m; moodT = d; }
function talk(text, s) { say = { text, life: s, max: s }; }

// ---------- input: drag anywhere (stage), tap = launch ----------
const ptrs = new Map();
let steer = null;
const keys = { l: false, r: false };
const fieldX = e => cv.logical(e).x - F.x;
stageEl.addEventListener('pointerdown', e => {
  if (state !== 'play' || MG.panelOpen()) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 });
  if (steer == null || !ptrs.has(steer)) { steer = e.pointerId; P.tx = fieldX(e); }
  try { stageEl.setPointerCapture(e.pointerId); } catch {}
  e.preventDefault();
});
stageEl.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  const p = ptrs.get(e.pointerId);
  if (p) { p.moved = Math.max(p.moved, Math.hypot(e.clientX - p.x, e.clientY - p.y)); if (e.pointerId === steer) P.tx = fieldX(e); }
  else if (e.pointerType === 'mouse' && !ptrs.size) P.tx = fieldX(e);
});
function ptrEnd(e, ok) {
  const p = ptrs.get(e.pointerId); if (!p) return;
  ptrs.delete(e.pointerId);
  if (steer === e.pointerId) steer = ptrs.size ? ptrs.keys().next().value : null;
  if (ok && state === 'play' && performance.now() - p.t < 450 && p.moved < 16) launch();
}
stageEl.addEventListener('pointerup', e => ptrEnd(e, true));
stageEl.addEventListener('pointercancel', e => ptrEnd(e, false));
addEventListener('keydown', e => {
  if (state !== 'play' || MG.panelOpen()) return;
  if (e.key === 'ArrowLeft' || e.key === 'a') { keys.l = true; e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd') { keys.r = true; e.preventDefault(); }
  else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') { e.preventDefault(); launch(); }
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false; });

function aimAngle() { return Math.sin(t * 2.1) * 0.42; }
function offAngle(off) { return clamp(off / (P.w / 2), -1, 1) * 0.9; }
function launch() {
  let any = false;
  for (const b of balls) {
    if (!b.stuck) continue;
    const a = b.serve ? aimAngle() : offAngle(b.off), sp = targetSpeed();
    b.vx = Math.sin(a) * sp; b.vy = -Math.cos(a) * sp; b.stuck = false; b.serve = false; b.y = P.y - b.r - 0.5; any = true;
  }
  if (any) { MG.sfx('jump'); P.hit = 0.6; P.hitAge = 0; }
}

// ---------- physics ----------
function fixAngle(b) {
  const sp = Math.hypot(b.vx, b.vy) || 1, minY = sp * 0.27, minX = sp * 0.05;
  if (Math.abs(b.vy) < minY) { const sy = b.vy > 0 ? 1 : -1; b.vy = sy * minY; b.vx = (b.vx < 0 ? -1 : 1) * Math.sqrt(sp * sp - minY * minY); }
  if (Math.abs(b.vx) < minX) { b.vx = (b.vx < 0 ? -1 : 1) * minX; b.vy = (b.vy < 0 ? -1 : 1) * Math.sqrt(sp * sp - minX * minX); }
}
// bounced around for a long time without hitting a brick: nudge the angle a little so it can't loop forever
function nudge(b) {
  if (b.sb < 5) return;
  const a = MG.rand(-0.16, 0.16), c = Math.cos(a), s = Math.sin(a);
  [b.vx, b.vy] = [b.vx * c - b.vy * s, b.vx * s + b.vy * c]; fixAngle(b);
}
function collideBricks(b) {
  const r = b.r;
  const r0 = Math.max(0, Math.floor((b.y - r - BTOP) / BH)), r1 = Math.min(ROWS - 1, Math.floor((b.y + r - BTOP) / BH));
  if (r1 < r0) return;
  const c0 = Math.max(0, Math.floor((b.x - r) / BW)), c1 = Math.min(COLS - 1, Math.floor((b.x + r) / BW));
  let nx = 0, ny = 0, pen = 0, hits = null;
  for (let rr = r0; rr <= r1; rr++) for (let cc = c0; cc <= c1; cc++) {
    const B = bricks[rr][cc]; if (!B) continue;
    const x0 = cc * BW, y0 = BTOP + rr * BH, x1 = x0 + BW, y1 = y0 + BH;
    const px = clamp(b.x, x0, x1), py = clamp(b.y, y0, y1), dx = b.x - px, dy = b.y - py, d2 = dx * dx + dy * dy;
    if (d2 >= r * r) continue;
    let n1x, n1y, p;
    if (d2 < 1e-9) {            // centre inside a brick: must never happen (counted for the tests), push out the short way
      deep++;
      const l = b.x - x0, rt = x1 - b.x, u = b.y - y0, dn = y1 - b.y, m = Math.min(l, rt, u, dn);
      if (m === l) { n1x = -1; n1y = 0; p = l + r; } else if (m === rt) { n1x = 1; n1y = 0; p = rt + r; } else if (m === u) { n1x = 0; n1y = -1; p = u + r; } else { n1x = 0; n1y = 1; p = dn + r; }
    } else {
      const d = Math.sqrt(d2); n1x = dx / d; n1y = dy / d; p = r - d;
      if (n1x && n1y) {         // corner touching a neighbour brick: treat it as the flat face of the row/column
        const sx = Math.sign(n1x), sy = Math.sign(n1y), nH = brickAt(rr, cc + sx), nV = brickAt(rr + sy, cc);
        if (nH && !nV) { n1x = 0; n1y = sy; p = r - Math.abs(dy); }
        else if (nV && !nH) { n1x = sx; n1y = 0; p = r - Math.abs(dx); }
      }
    }
    nx += n1x; ny += n1y; if (p > pen) pen = p;
    (hits || (hits = [])).push(rr * COLS + cc);
  }
  if (!hits) return;

    txt(`${combo} 連擊！`, rx + lw / 2, H - 150, 26 * a + 4, combo >= 8 ? '#ff4f8a' : '#ff9a1c', 'center', 900, '#fff', 6);
  }
}
function draw() {
  const px = cv._mgScale || 1, key = `${W}x${H}:${px}:${land}`;
  if (!bgL) bgL = document.createElement('canvas');
  if (key !== bgKey) { bgKey = key; bgL.width = cv.width; bgL.height = cv.height; const g = bgL.getContext('2d'); g.setTransform(px, 0, 0, px, 0, 0); paintBg(g); }
  x.save();
  if (shake > 0) x.translate(MG.rand(-1, 1) * shake * 14, MG.rand(-1, 1) * shake * 14);
  x.drawImage(bgL, 0, 0, W, H);
  drawField();
  if (land) drawPanels();
  x.restore();
}

// ---------- menu ----------
function menu() {
  state = 'menu'; caps = []; shots = []; floats = [];
  parseLevel(Math.min(LEVELS.length, MG.store.get('breakout.pickLevel', 1))); lvl = Math.min(LEVELS.length, MG.store.get('breakout.pickLevel', 1));
  P.w = 96; P.x = P.tx = FW / 2; serve(); setMood('happy', 0); say = null;
  MG.choose({
    id: 'breakout', title: '噗噗打磚塊',
    html: `<p>噗噗變成長長的果凍板子了！手指在畫面上<b>左右拖</b>，噗噗就會跟著跑，把泡泡球彈回去，打掉全部的糖果磚塊。<b>點一下</b>發射球。</p>` +
      `<p>接住掉下來的膠囊有魔法：↔️ 變長、✨ 多球、🐢 慢慢球、🍯 黏黏、⚡ 雷射、🛡️ 保護網！</p>`,
    picks: [{ key: 'spd', title: '球速', def: 'mid', options: [{ id: 'slow', label: '🐌 慢', sub: '球比較慢' }, { id: 'mid', label: '🙂 普通', sub: '' }, { id: 'fast', label: '🚀 快', sub: '球比較快' }] }],
    modesTitle: '玩法',
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '球掉了沒關係，再發一次' }, { id: 'challenge', label: '🔥 挑戰', sub: '三條命、球比較快' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n} ${LEVELS[n - 1].ic}` },
    keys: '手指在畫面上左右拖、點一下發射　電腦：滑鼠移動、點一下，或 <kbd>←</kbd><kbd>→</kbd> 移動、<kbd>空白鍵</kbd> 發射',
    playing: () => state === 'play',
    start: (m, lv, pk) => { mode = m; if (pk && SPD[pk.spd]) spd = pk.spd; startLevel(lv); },
  });
  hud();
}
menu();

// small hook for automated tests: read-only snapshots, plus a few test helpers
window.BOT = {
  get state() { return state; }, get level() { return lvl; }, get mode() { return mode; }, get lives() { return lives; }, get score() { return score; },
  get left() { return left; }, get lost() { return lost; }, get deep() { return deep; }, get combo() { return combo; }, get speed() { return targetSpeed(); },
  get powers() { return { wide: wideT, slow: slowT, sticky: stickyT, laser: laserT, net, shots: shots.length }; },
  get paddle() { return { x: P.x, y: P.y, w: P.w, h: P.h }; }, get field() { return { x: F.x, y: F.y, w: F.w, h: F.h, land }; },
  balls: () => balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, stuck: b.stuck })),
  caps: () => caps.map(c => ({ type: c.type, x: c.x, y: c.y })),
  liveBricks() { const out = []; for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { const B = bricks[r][c]; if (B) out.push({ x0: c * BW, y0: BTOP + r * BH, x1: (c + 1) * BW, y1: BTOP + (r + 1) * BH, metal: !!B.metal }); } return out; },
  toClient(fx, fy) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + (fx + F.x) * (rc.width - 2 * B) / W, y: rc.top + B + (fy + F.y) * (rc.height - 2 * B) / H }; },
  force(type) { if (state === 'play' && POW[type]) caps.push({ type, x: P.x, y: P.y - 60, vy: 120 * SC, age: 0 }); },
  fast(n) { turbo = Math.max(1, Math.min(12, n | 0)); }, maxSpeed(on) { testMax = !!on; },
};

MG.loop(dt => {
  if (state === 'play') { for (let i = 0; i < turbo && state === 'play'; i++) update(dt); }
  else idle(dt);
  draw();
});
</script>
