<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗泡泡龍</title>
<link rel="stylesheet" href="mini.css">
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'bubble', title: '噗噗泡泡龍', stats: ['level', 'score'] });
const W = 360, H = 580, cv = document.getElementById('cv'), x = cv.getContext('2d');   // W×H = the playfield (rules live here)
// the canvas takes the stage's shape (CW×CH); the playfield is drawn as big as fits (scale FS at FX,FY) and the spare room
// becomes a HUD band: beside it in landscape ('side'), under it in portrait ('bottom'), or none (next bubble stays in the field)
const VX0 = 12.5, VY0 = 12, VW = 335, VH = 552;   // the part of the playfield that is shown (walls trimmed a little)
let CW = 360, CH = 580, FS = 1, FX = 0, FY = 0, LAY = 'none', SWAPB = null;
const cssK = () => (parseFloat(cv.style.width) || CW) / CW;
const TXT = px => Math.min(px * 2.2, px * MG.textScale / Math.min(1.25, cssK()));
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));   // 22 = stage padding + canvas border
  if (a >= 1) { CH = 600; CW = Math.round(CH * a); } else { CW = 360; CH = Math.round(CW / a); }
  const SB = 125 * (MG.big ? 1.2 : 1), BB = 104 * (MG.big ? 1.2 : 1);
  const f0 = Math.min(CW / VW, CH / VH), fS = Math.min((CW - 2 * SB) / VW, CH / VH), fB = Math.min(CW / VW, (CH - BB) / VH);
  if (Math.max(fS, fB) >= f0 * 0.97) { LAY = fS >= fB ? 'side' : 'bottom'; FS = Math.max(fS, fB); } else { LAY = 'none'; FS = f0; }
  FX = (CW - VW * FS) / 2;
  FY = LAY === 'bottom' ? 0 : (CH - VH * FS) / 2;
  return [CW, CH];
}
// canvas point -> playfield point
const toField = p => ({ x: (p.x - FX) / FS + VX0, y: (p.y - FY) / FS + VY0 });

const COLS = 8, R = 19, D = R * 2, RH = D * 0.866, X0 = (W - (COLS * D + R)) / 2, TOP0 = 34, DANGER = 470, SHOOT = { x: W / 2, y: 512 }, SPEED = 950;
const COLORS = [
  { c: '#ff5a6e', d: '#c0283c', name: '紅' }, { c: '#ffc93a', d: '#c98a00', name: '黃' }, { c: '#4cc96a', d: '#237a3b', name: '綠' },
  { c: '#3d9bff', d: '#1d5fb0', name: '藍' }, { c: '#b07cff', d: '#6a3fc0', name: '紫' }, { c: '#ff9f4a', d: '#c0601a', name: '橘' },
  { c: '#3fd6d0', d: '#178a85', name: '青' }, { c: '#ff7ac8', d: '#c0398a', name: '粉' },
];
const ROCK = 99;                 // grey stone: never pops, only falls when what holds it is gone
// difficulty: cl = how clumped the colours start, guide = how much aiming line is shown
const DIFF = {
  easy: { cl: 0.55, guide: Infinity, colors: n => Math.min(6, 3 + Math.floor((n - 1) / 2)), rows: n => Math.min(8, 4 + n), rocks: () => 0, drop: n => Math.max(4, 8 - Math.floor(n / 2)) },
  normal: { cl: 0.3, guide: 'bounce', colors: n => Math.min(8, 4 + Math.floor((n - 1) / 3)), rows: n => Math.min(9, 5 + Math.ceil(n / 3)), rocks: n => n >= 5 ? Math.min(9, Math.floor((n - 3) / 2)) : 0, drop: n => Math.max(3, 7 - Math.floor(n / 4)) },
  hard: { cl: 0.12, guide: 150, colors: n => Math.min(8, 5 + Math.floor((n - 1) / 4)), rows: n => Math.min(9, 6 + Math.ceil(n / 4)), rocks: n => n >= 3 ? Math.min(14, n) : 0, drop: n => Math.max(3, 6 - Math.floor(n / 4)) },
};
const NLEVELS = 20;
let mode = 'relax', diff = 'normal';
const D_ = () => DIFF[diff];
MG.fit(cv, layout);
let grid, ceilY, level, score, nColors, shot, cur, nxt, aim = -Math.PI / 2, misses, dropEvery, state = 'ready', falling = [], pops = [], t = 0, shakeT = 0, combo = 0;

const snd = (() => { const last = {}; return (n, a, gap = 60) => { const now = performance.now(); if (now - (last[n] || 0) < gap) return; last[n] = now; MG.sfx(n, a); }; })();
const cols = r => (r % 2 ? COLS - 1 : COLS);
const cx = (r, c) => X0 + R + c * D + (r % 2 ? R : 0);
const cy = r => ceilY + R + r * RH;
const ROWS = 15;
function neighbors(r, c) {
  const odd = r % 2, out = [[r, c - 1], [r, c + 1]];
  for (const dr of [-1, 1]) { if (odd) out.push([r + dr, c], [r + dr, c + 1]); else out.push([r + dr, c - 1], [r + dr, c]); }
  return out.filter(([a, b]) => a >= 0 && a < ROWS && b >= 0 && b < cols(a));
}
function newLevel(n) {
  level = n; nColors = D_().colors(n);
  const rows = D_().rows(n), cl = D_().cl;
  dropEvery = D_().drop(n);
  grid = Array.from({ length: ROWS }, (_, r) => Array(cols(r)).fill(-1));
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols(r); c++) {
    // small clusters so there are matches to find
    const left = c > 0 ? grid[r][c - 1] : -1, up = r > 0 ? grid[r - 1][Math.min(c, cols(r - 1) - 1)] : -1;
    const rnd = Math.random();
    grid[r][c] = rnd < cl * 0.64 && left >= 0 ? left : rnd < cl && up >= 0 ? up : MG.randi(0, nColors - 1);
  }
  // stones (never in the top two rows, never touching each other, so they can always be knocked down)
  for (let k = 0, tries = 0; k < D_().rocks(n) && tries < 200; tries++) {
    const r = MG.randi(2, rows - 1), c = MG.randi(0, cols(r) - 1);
    if (grid[r][c] === ROCK || neighbors(r, c).some(([a, b]) => grid[a][b] === ROCK)) continue;
    grid[r][c] = ROCK; k++;
  }
  ceilY = TOP0; misses = 0; shot = null; falling = []; combo = 0;
  cur = pickColor(); nxt = pickColor();
  hud();
}
function pickColor() {
  const present = new Set(); for (const row of grid) for (const v of row) if (v >= 0 && v !== ROCK) present.add(v);
  const arr = present.size ? [...present] : [...Array(nColors).keys()];
  return MG.pick(arr);
}
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('score', `${score} 分`); }

// ---------- aiming / shooting ----------
const clampAim = a => Math.max(-Math.PI + 0.16, Math.min(-0.16, a));
function setAimTo(p) { if (p.y < SHOOT.y - 8) aim = clampAim(Math.atan2(p.y - SHOOT.y, p.x - SHOOT.x)); }
let aiming = false;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const c = cv.logical(e), p = toField(c);
  if (SWAPB ? (c.x >= SWAPB.x && c.x <= SWAPB.x + SWAPB.w && c.y >= SWAPB.y && c.y <= SWAPB.y + SWAPB.h) : Math.hypot(p.x - (SHOOT.x + 62), p.y - (SHOOT.y + 18)) < 26) { swap(); return; }
  aiming = true; try { cv.setPointerCapture(e.pointerId); } catch {} setAimTo(p);
});
cv.addEventListener('pointermove', e => { if (state !== 'play') return; if (aiming || e.pointerType === 'mouse') setAimTo(toField(cv.logical(e))); });
cv.addEventListener('pointerup', e => { if (!aiming) return; aiming = false; const p = toField(cv.logical(e)); if (p.y < SHOOT.y - 8) { setAimTo(p); fire(); } });
cv.addEventListener('pointercancel', () => aiming = false);
const held = { l: false, r: false };
addEventListener('keydown', e => {
  if (state !== 'play') return;
  if (e.key === 'ArrowLeft') held.l = true; else if (e.key === 'ArrowRight') held.r = true;
  else if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'Enter') { e.preventDefault(); fire(); }
  else if (e.key === 's' || e.key === 'S' || e.key === 'Shift') swap();
});
addEventListener('keyup', e => { if (e.key === 'ArrowLeft') held.l = false; if (e.key === 'ArrowRight') held.r = false; });
function swap() { if (shot) return; [cur, nxt] = [nxt, cur]; MG.sfx('flip'); }
function fire() {
  if (shot || state !== 'play') return;
  shot = { x: SHOOT.x, y: SHOOT.y, vx: Math.cos(aim) * SPEED, vy: Math.sin(aim) * SPEED, col: cur };
  cur = nxt; nxt = pickColor(); MG.sfx('jump');
}
// guide: full trajectory with wall bounces, stops at the first bubble / ceiling
function guide() {
  const pts = [[SHOOT.x, SHOOT.y]]; let px = SHOOT.x, py = SHOOT.y, vx = Math.cos(aim), vy = Math.sin(aim);
  const L = X0 + R, Rr = X0 + COLS * D + R - R, gl = D_().guide;
  let len = 0, after = -1;
  for (let i = 0; i < 700; i++) {
    px += vx * 4; py += vy * 4; len += 4;
    if (px < L) { px = L; vx = -vx; pts.push([px, py]); if (after < 0) after = 0; }
    if (px > Rr) { px = Rr; vx = -vx; pts.push([px, py]); if (after < 0) after = 0; }
    if (after >= 0) after += 4;
    if (py <= ceilY + R || hits(px, py)) break;
    if (gl === 'bounce' ? after > 50 : len > gl) break;      // 普通: line stops a little after the first bounce; 困難: short line
  }
  pts.push([px, py]); return pts;
}
function hits(px, py) {
  for (let r = 0; r < ROWS; r++) { const yy = cy(r); if (Math.abs(yy - py) > D) continue; for (let c = 0; c < cols(r); c++) if (grid[r][c] >= 0 && Math.hypot(cx(r, c) - px, yy - py) < D * 0.86) return true; }
  return false;
}

// ---------- update ----------
function update(dt) {
  t += dt; shakeT = Math.max(0, shakeT - dt);
  if (held.l) aim = clampAim(aim - dt * 1.6); if (held.r) aim = clampAim(aim + dt * 1.6);
  if (shot) {
    const steps = 4;
    for (let s = 0; s < steps && shot; s++) {
      shot.x += shot.vx * dt / steps; shot.y += shot.vy * dt / steps;
      const L = X0 + R, Rr = X0 + COLS * D;
      if (shot.x < L) { shot.x = L; shot.vx = Math.abs(shot.vx); snd('boing', 0, 90); }
      if (shot.x > Rr) { shot.x = Rr; shot.vx = -Math.abs(shot.vx); snd('boing', 0, 90); }
      if (shot.y <= ceilY + R || hits(shot.x, shot.y)) settle();
    }
  }
  for (const f of falling) { f.vy += 1400 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt; }
  falling = falling.filter(f => f.y < H + 40);
  for (const p of pops) { p.y -= 40 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  MG.fx.step(dt);
}
function settle() {
  // nearest empty cell to where the shot stopped
  let best = null, bd = 1e9;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < cols(r); c++) {
    if (grid[r][c] >= 0) continue;
    const d = Math.hypot(cx(r, c) - shot.x, cy(r) - shot.y);
    if (d < bd && (r === 0 || neighbors(r, c).some(([a, b]) => grid[a][b] >= 0))) { bd = d; best = [r, c]; }
  }
  const col = shot.col; shot = null;
  if (!best) return;
  const [r, c] = best; grid[r][c] = col; MG.sfx('place');
  // same-colour group
  const group = [], seen = new Set([r + ',' + c]), stack = [[r, c]];
  while (stack.length) { const [a, b] = stack.pop(); group.push([a, b]); for (const [na, nb] of neighbors(a, b)) { const k = na + ',' + nb; if (!seen.has(k) && grid[na][nb] === col) { seen.add(k); stack.push([na, nb]); } } }
  if (group.length >= 3) {
    combo++;
    for (const [a, b] of group) { MG.fx.burst(cx(a, b), cy(a), { n: 7, colors: [(COLORS[grid[a][b]] || { c: '#999' }).c, '#fff'], speed: 160, up: 40, size: 4, life: 0.5 }); grid[a][b] = -1; }
    let pts = group.length * 10;
    // anything no longer connected to the ceiling falls
    const att = new Set(), st2 = [];
    for (let c2 = 0; c2 < cols(0); c2++) if (grid[0][c2] >= 0) { att.add('0,' + c2); st2.push([0, c2]); }
    while (st2.length) { const [a, b] = st2.pop(); for (const [na, nb] of neighbors(a, b)) { const k = na + ',' + nb; if (!att.has(k) && grid[na][nb] >= 0) { att.add(k); st2.push([na, nb]); } } }
    let dropped = 0;
    for (let a = 0; a < ROWS; a++) for (let b = 0; b < cols(a); b++) if (grid[a][b] >= 0 && !att.has(a + ',' + b)) {
      falling.push({ x: cx(a, b), y: cy(a), vx: MG.rand(-60, 60), vy: MG.rand(-120, 0), col: grid[a][b], rot: 0, vr: MG.rand(-6, 6) }); grid[a][b] = -1; dropped++;
    }
    pts += dropped * 20; if (combo > 1) pts *= combo;
    score += pts;
    // layered pop sound: rises with group size and combo; falling bubbles add a whoosh + coin
    snd('match', combo + Math.max(0, group.length - 3)); if (combo >= 2) snd('combo', combo);
    if (dropped) { snd('whoosh'); setTimeout(() => MG.sfx('coin'), 180); } else if (group.length >= 5) snd('sparkle');
    pops.push({ x: cx(r, c), y: cy(r), t: `+${pts}`, life: 1 });
    const word = combo >= 2 ? MG.WORDS.combo(combo) : dropped >= 3 ? 'Drop! ⬇️' : group.length >= 5 ? MG.praise(Math.min(5, group.length - 3)) : '';
    if (word) pops.push({ x: cx(r, c), y: cy(r) - 24, t: word, life: 1.2, big: true });
    if (grid.every(row => row.every(v => v < 0))) return levelClear();
  } else {
    combo = 0; misses++;
    if (mode === 'timed' && misses >= dropEvery) { misses = 0; ceilY += RH; shakeT = 0.4; MG.sfx('hit'); MG.toast('⚠️ Down! ⬇️'); }
  }
  // lost?
  for (let a = 0; a < ROWS; a++) for (let b = 0; b < cols(a); b++) if (grid[a][b] >= 0 && cy(a) + R >= DANGER) return gameOver();
  // keep the queued colours valid
  const present = new Set(); for (const row of grid) for (const v of row) if (v >= 0 && v !== ROCK) present.add(v);
  if (!present.has(cur)) cur = pickColor(); if (!present.has(nxt)) nxt = pickColor();
  hud();
}

// ---------- draw ----------
function bubble(px, py, col, r = R, face = true) {
  if (col === ROCK) {
    const g = x.createRadialGradient(px - r * 0.35, py - r * 0.4, r * 0.1, px, py, r); g.addColorStop(0, '#d9dde4'); g.addColorStop(1, '#7d8592');
    x.fillStyle = g; x.beginPath();
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, rr = r * (0.9 + ((i * 37) % 7) / 60); x.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); }
    x.closePath(); x.fill(); x.strokeStyle = 'rgba(0,0,0,.3)'; x.lineWidth = 1.2; x.stroke();
    x.strokeStyle = 'rgba(60,64,72,.45)'; x.lineWidth = 1.4; x.beginPath(); x.moveTo(px - r * 0.3, py - r * 0.1); x.lineTo(px, py + r * 0.15); x.lineTo(px + r * 0.25, py - r * 0.05); x.stroke();
    x.fillStyle = 'rgba(255,255,255,.5)'; x.beginPath(); x.ellipse(px - r * 0.35, py - r * 0.42, r * 0.22, r * 0.12, -0.6, 0, 7); x.fill();
    return;
  }
  const C = COLORS[col];
  const g = x.createRadialGradient(px - r * 0.35, py - r * 0.4, r * 0.1, px, py, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, C.c); g.addColorStop(1, C.d);
  x.fillStyle = g; x.beginPath(); x.arc(px, py, r - 0.5, 0, 7); x.fill();
  x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 1; x.stroke();
  x.fillStyle = 'rgba(255,255,255,.75)'; x.beginPath(); x.ellipse(px - r * 0.35, py - r * 0.42, r * 0.28, r * 0.15, -0.6, 0, 7); x.fill();
  if (face) {
    x.fillStyle = C.d; const blink = ((t * 0.7 + col * 1.3 + px * 0.01) % 4) < 0.1;
    for (const s of [-1, 1]) { if (blink) x.fillRect(px + s * r * 0.28 - r * 0.1, py - r * 0.02, r * 0.2, r * 0.06); else { x.beginPath(); x.arc(px + s * r * 0.28, py, r * 0.1, 0, 7); x.fill(); } }
    x.strokeStyle = C.d; x.lineWidth = Math.max(1, r * 0.08); x.lineCap = 'round'; x.beginPath(); x.arc(px, py + r * 0.12, r * 0.18, 0.3, Math.PI - 0.3); x.stroke();
  }
}
function draw() {
  const bg = x.createLinearGradient(0, 0, 0, CH); bg.addColorStop(0, '#bfe3fa'); bg.addColorStop(1, '#ffe6f3'); x.fillStyle = bg; x.fillRect(0, 0, CW, CH);
  SWAPB = null;
  if (LAY !== 'none') drawBand();
  x.save();
  x.translate(FX, FY); x.scale(FS, FS); x.translate(-VX0, -VY0);
  x.beginPath(); x.rect(VX0, VY0, VW, VH); x.clip();
  if (shakeT) x.translate(MG.rand(-1, 1) * shakeT * 8, 0);
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#d7f0ff'); g.addColorStop(1, '#fff2fa'); x.fillStyle = g; x.fillRect(-10, -10, W + 20, H + 20);
  // floating background bubbles
  for (let i = 0; i < 9; i++) { const bx = (i * 61 + Math.sin(t * 0.5 + i) * 10) % W, by = H - ((t * (12 + i * 3) + i * 90) % (H + 40)); x.strokeStyle = 'rgba(120,170,220,.25)'; x.lineWidth = 2; x.beginPath(); x.arc(bx, by, 6 + (i % 4) * 4, 0, 7); x.stroke(); }
  // side walls
  x.fillStyle = '#c9e4f6'; x.fillRect(0, 0, X0, H); x.fillRect(W - X0, 0, X0, H);
  // ceiling plank (comes down with "ceilY") and chains
  x.fillStyle = '#a8702e'; x.fillRect(0, ceilY - 14, W, 14); x.fillStyle = '#d99a5a'; x.fillRect(0, ceilY - 14, W, 4);
  if (ceilY > TOP0) { x.strokeStyle = '#7d8792'; x.lineWidth = 3; for (const sx of [40, W - 40]) { x.setLineDash([5, 4]); x.beginPath(); x.moveTo(sx, 0); x.lineTo(sx, ceilY - 14); x.stroke(); x.setLineDash([]); } }
  if (mode === 'timed' && LAY === 'none') for (let i = 0; i < dropEvery; i++) { x.fillStyle = i < dropEvery - misses ? '#ffd23f' : 'rgba(255,255,255,.35)'; x.beginPath(); x.arc(W - 16 - i * 12, ceilY - 7, 4, 0, 7); x.fill(); }
  // danger line
  x.strokeStyle = 'rgba(255,90,78,.7)'; x.lineWidth = 2; x.setLineDash([8, 6]); x.beginPath(); x.moveTo(X0, DANGER); x.lineTo(W - X0, DANGER); x.stroke(); x.setLineDash([]);
  // grid
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < cols(r); c++) if (grid[r][c] >= 0) bubble(cx(r, c), cy(r), grid[r][c]);
  // guide
  if (state === 'play' && !shot) {
    const pts = guide(); x.fillStyle = COLORS[cur].c;
    let acc = 0; for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i], len = Math.hypot(bx - ax, by - ay);
      for (let d = (16 - acc % 16); d < len; d += 16) { const k = d / len; x.globalAlpha = 0.85; x.beginPath(); x.arc(ax + (bx - ax) * k, ay + (by - ay) * k, 3.2, 0, 7); x.fill(); }
      acc += len;
    }
    x.globalAlpha = 1;
  }
  if (shot) bubble(shot.x, shot.y, shot.col);
  for (const f of falling) { x.save(); x.translate(f.x, f.y); x.rotate(f.rot); bubble(0, 0, f.col); x.restore(); }
  // shooter: 噗噗 holding a bubble wand
  x.fillStyle = '#b8dcf2'; x.fillRect(0, 540, W, H - 540); x.fillStyle = '#9fcbe6'; x.fillRect(0, 540, W, 4);
  x.save(); x.translate(SHOOT.x, SHOOT.y); x.rotate(aim + Math.PI / 2);
  x.fillStyle = '#8a92a0'; x.beginPath(); x.roundRect(-9, -46, 18, 40, 6); x.fill(); x.fillStyle = '#c9cede'; x.fillRect(-9, -46, 18, 6);
  x.restore();
  MG.puPu(x, SHOOT.x, SHOOT.y + 18, 20, combo > 1 ? 'wow' : 'happy', 0, { look: Math.cos(aim) * 1.5, arms: 'up' });
  if (state === 'play' && !shot) bubble(SHOOT.x + Math.cos(aim) * 40, SHOOT.y + 18 + Math.sin(aim) * 40 - 18, cur, R * 0.9);
  // next bubble (tap to swap) — in the HUD band when there is one
  if (LAY === 'none') {
    const k = Math.min(1.35, Math.max(1, TXT(10) / FS / 11));
    x.fillStyle = 'rgba(255,255,255,.8)'; x.beginPath(); x.arc(SHOOT.x + 62, SHOOT.y + 18, 22, 0, 7); x.fill();
    if (MG.big) { x.strokeStyle = '#2a5cab'; x.lineWidth = 2.5; x.stroke(); }
    bubble(SHOOT.x + 62, SHOOT.y + 18, nxt, 15);
    x.fillStyle = MG.big ? '#1d2f4a' : '#5a7a9a'; x.font = `700 ${11 * k}px "Noto Sans TC",system-ui`; x.textAlign = 'left'; x.textBaseline = 'middle'; x.fillText('← 點我換', SHOOT.x + 88, SHOOT.y + 18);
  }
  MG.fx.draw(x);
  const pk = Math.max(1, TXT(13) / FS / 18);
  for (const p of pops) {
    x.globalAlpha = Math.min(1, p.life * 2); x.font = `900 ${(p.big ? 20 : 18) * pk}px system-ui,"Noto Sans TC",sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const hw = x.measureText(p.t).width / 2 + 4, px = Math.max(VX0 + hw, Math.min(VX0 + VW - hw, p.x));   // stay on screen
    x.lineWidth = 4 * pk; x.strokeStyle = '#fff'; x.strokeText(p.t, px, p.y); x.fillStyle = p.big ? '#ff4f8a' : '#ff7a00'; x.fillText(p.t, px, p.y);
  }
  x.globalAlpha = 1;
  x.restore();
  // field frame
  if (LAY !== 'none') { x.strokeStyle = MG.big ? '#1d4f9e' : '#8fbfe0'; x.lineWidth = MG.big ? 4 : 3; x.beginPath(); x.roundRect(FX - 1.5, FY - 1.5, VW * FS + 3, VH * FS + 3, 6); x.stroke(); }
}
// ---------- HUD band ----------
function card(bx, by, bw, bh) {
  x.fillStyle = MG.big ? '#fff' : 'rgba(255,255,255,.85)'; x.strokeStyle = MG.big ? '#1d4f9e' : '#9fcbe6'; x.lineWidth = MG.big ? 4 : 2.5;
  x.beginPath(); x.roundRect(bx, by, bw, bh, Math.min(18, bh * 0.2)); x.fill(); x.stroke();
}
function t1(str, px, py, size, col, w = 900) { x.font = `${w} ${size}px "Noto Sans TC",system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = col; x.fillText(str, px, py); }
function infoCard(bx, by, bw, bh) {   // level + score (+ ceiling counter in 天花板會降)
  card(bx, by, bw, bh);
  const ink = MG.big ? '#10233a' : '#2a4a6a', sub = MG.big ? '#1d2f4a' : '#5a7a9a', cx = bx + bw / 2, timed = mode === 'timed';
  const f1 = Math.min(bw * 0.16, bh * (timed ? 0.15 : 0.2), TXT(24)), f2 = Math.min(bw * 0.3, bh * (timed ? 0.24 : 0.32), TXT(60));
  const rows = timed ? 4 : 3, gap = (bh - f1 * 2 - f2 - (timed ? f1 * 1.3 : 0)) / (rows + 1);
  let y = by + gap + f1 / 2;
  t1(`第 ${level} 關`, cx, y, f1, ink); y += f1 / 2 + gap + f2 / 2;
  t1(score, cx, y, f2, '#ff7a00'); y += f2 / 2 + gap + f1 / 2;
  t1('分', cx, y, f1 * 0.9, sub, 700);
  if (timed) {
    y += f1 / 2 + gap + f1 * 0.65; const r = Math.min(f1 * 0.42, bw / (dropEvery * 3)), step = r * 2.8;
    for (let i = 0; i < dropEvery; i++) { x.fillStyle = i < dropEvery - misses ? '#ffc93a' : 'rgba(90,122,154,.25)'; x.beginPath(); x.arc(cx - (dropEvery - 1) * step / 2 + i * step, y, r, 0, 7); x.fill(); if (MG.big) { x.strokeStyle = '#7a5a00'; x.lineWidth = 1.5; x.stroke(); } }
  }
}
function nextCard(bx, by, bw, bh) {   // the next bubble; the whole card is the 換 button
  card(bx, by, bw, bh); SWAPB = { x: bx, y: by, w: bw, h: bh };
  const cx = bx + bw / 2, f1 = Math.min(bw * 0.15, bh * 0.16, TXT(18));
  t1('下一顆', cx, by + f1 * 1.1, f1, MG.big ? '#10233a' : '#2a4a6a');
  const bw2 = Math.min(bw - 16, Math.max(f1 * 6, 90)), bh2 = Math.min(f1 * 2.2, bh * 0.24), by2 = by + bh - bh2 - 8;
  const top = by + f1 * 2, r = Math.max(8, Math.min(bw * 0.24, (by2 - top) / 2.7, 46)), ky = (top + by2) / 2;
  x.fillStyle = '#eaf6ff'; x.beginPath(); x.arc(cx, ky, r * 1.25, 0, 7); x.fill();
  bubble(cx, ky, nxt, r);
  x.fillStyle = '#4cc96a'; x.strokeStyle = '#2e9a4c'; x.lineWidth = MG.big ? 3 : 2; x.beginPath(); x.roundRect(cx - bw2 / 2, by2, bw2, bh2, bh2 / 2); x.fill(); x.stroke();
  t1('🔄 換一顆', cx, by2 + bh2 / 2, Math.min(f1, bh2 * 0.55), '#fff');
}
function drawBand() {
  if (LAY === 'side') {
    const bw = FX, pad = Math.max(10, bw * 0.08), cw = bw - pad * 2, fr = FX + VW * FS;
    infoCard(pad, pad, cw, Math.min(CH * 0.5, cw * 1.1));
    const nh = Math.min(CH * 0.5, cw * 1.25); nextCard(fr + pad, CH - pad - nh, cw, nh);
    // 噗噗's tip above the next bubble
    const hf = Math.min(cw * 0.1, TXT(16)), hy = pad + hf * 1.2;
    t1('👆 拖曳瞄準', fr + bw / 2, hy, hf, MG.big ? '#10233a' : '#3a5a7a', 800);
    t1('放開就發射', fr + bw / 2, hy + hf * 1.5, hf, MG.big ? '#10233a' : '#3a5a7a', 800);
  } else {
    const by = FY + VH * FS, bh = CH - by, pad = 8, w2 = (CW - pad * 3) / 2;
    infoCard(pad, by + pad, w2, bh - pad * 2);
    nextCard(pad * 2 + w2, by + pad, w2, bh - pad * 2);
  }
}

// ---------- flow ----------
function levelClear() {
  state = 'between'; const bonus = 100 + level * 50; score += bonus; hud(); MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  MG.record('bubble', score); MG.store.set('bubble.level', Math.max(MG.store.get('bubble.level', 1), level + 1));
  MG.fx.burst(W / 2, 260, { n: 40, colors: COLORS.map(c => c.c), speed: 260, up: 120, size: 6, shape: 'star', life: 1.2 });
  setTimeout(() => MG.panel({
    title: `第 ${level} 關過關！`, html: `<p>過關獎勵 +${bonus}</p><div class="big">${score} 分</div><p>下一關會再難一點點喔</p>`,
    buttons: [{ label: '下一關', on: () => { newLevel(level + 1); state = 'play'; MG.hide(); } }, { label: '選關卡', alt: true, on: menu }],
  }), 700);
}
function gameOver() {
  state = 'over'; MG.sfx('over'); shakeT = 0.4;
  const rec = MG.record('bubble', score);
  MG.panel({
    title: '泡泡碰到紅線了！',
    html: `<p>到了第 ${level} 關</p><div class="big">${score} 分</div>` + (rec.isNew && score > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best} 分</p>`) + (mode === 'timed' ? '<p>覺得太難的話，可以玩天花板不會下降的「慢慢玩」</p>' : ''),
    buttons: [{ label: '從這關再來', on: () => { newLevel(level); state = 'play'; MG.hide(); } },
      ...(mode === 'timed' ? [{ label: '🐢 改成慢慢玩', alt: true, on: () => { mode = 'relax'; MG.store.set('bubble.pickMode', 'relax'); newLevel(level); state = 'play'; MG.hide(); } }] : []),
      { label: '選關卡', alt: true, on: menu }],
  });
}
function start(m, lv, pk) { mode = m; if (pk && pk.diff) diff = pk.diff; score = 0; newLevel(lv || 1); state = 'play'; MG.hide(); }
function menu() {
  state = 'ready';
  MG.choose({
    id: 'bubble', title: '噗噗泡泡龍',
    html: `<p>瞄準後發射泡泡，碰到<b>三個以上一樣顏色</b>就會破掉，沒黏住的泡泡會一起掉下來！右下角是下一顆，點它可以交換。</p>${('ontouchstart' in window) && innerWidth > innerHeight ? '<p class="new">📱 把手機直放，泡泡會更大！</p>' : ''}`,
    modesTitle: '天花板',
    picks: [{ key: 'diff', title: '難度', def: 'normal', options: [{ id: 'easy', label: '🐣 簡單', sub: '顏色少、瞄準線完整' }, { id: 'normal', label: '⭐ 普通', sub: '瞄準線只到第一次反彈' }, { id: 'hard', label: '🔥 困難', sub: '顏色多、石頭多、瞄準線很短' }] }],
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '天花板不會往下降' }, { id: 'timed', label: '⏬ 天花板會降', sub: '一直沒消除天花板會下降' }],
    levels: { count: NLEVELS, max: NLEVELS },
    keys: '手指按住拖曳瞄準、放開發射　電腦：滑鼠瞄準點擊，或 <kbd>←</kbd><kbd>→</kbd> 瞄準、<kbd>空白鍵</kbd> 發射、<kbd>S</kbd> 交換',
    playing: () => state === 'play',
    start: (m, lv, pk) => start(m, lv, pk),
  });
}
score = 0; newLevel(1); menu();
window.BBT = { toClient(px, py) { const r = cv.getBoundingClientRect(), k = (r.width - 6) / CW; return { x: r.left + 3 + (FX + (px - VX0) * FS) * k, y: r.top + 3 + (FY + (py - VY0) * FS) * k }; }, get swapBtn() { return SWAPB; }, get nxt() { return nxt; }, get state() { return state; }, pops: () => pops.map(p => p.t), grid: () => grid.map(r => r.slice()), cell: (r, c) => ({ x: cx(r, c), y: cy(r) }), get cur() { return cur; }, get shot() { return !!shot; }, SHOOT,
  aimAt(px, py) { aim = Math.max(-Math.PI + 0.16, Math.min(-0.16, Math.atan2(py - SHOOT.y, px - SHOOT.x))); }, fire: () => fire(), setCur(c) { cur = c; } };
MG.loop(dt => { if (state === 'play') update(dt); else { t += dt; MG.fx.step(dt); for (const f of falling) { f.vy += 1400 * dt; f.y += f.vy * dt; } } draw(); });
</script>
