<script>
'use strict';
MG.init({ id: 'bubble', title: '噗噗泡泡龍', stats: ['level', 'score'] });
const W = 360, H = 580, cv = document.getElementById('cv'), x = cv.getContext('2d');   // W×H = the playfield (rules live here)

const cssK = () => (parseFloat(cv.style.width) || CW) / CW;

function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));   // 22 = stage padding + canvas border

  const SB = 125 * (MG.big ? 1.2 : 1), BB = 112 * (MG.big ? 1.2 : 1);

  if (Math.max(fS, fB) >= f0 * 0.97) { LAY = fS >= fB ? 'side' : 'bottom'; FS = Math.max(fS, fB); } else { LAY = 'none'; FS = f0; }

}

function cardLayout() {

    // cards sized to what they hold; the scene (hills, trees, coral…) shows below them

    const w1 = inner * 0.31, w2 = inner * 0.38, w3 = inner - w1 - w2, h = bh - pad * 2;

}

const toField = p => ({ x: (p.x - FX) / FS + VX0, y: (p.y - FY) / FS + VY0 });

const COLS = 8, R = 19, D = R * 2, RH = D * 0.866, X0 = (W - (COLS * D + R)) / 2, TOP0 = 34, DANGER = 470, SHOOT = { x: W / 2, y: 512 }, SPEED = 950;
// c = colour, l = light, d = shade, o = outline
const COLORS = [
  { c: '#ff5a6e', l: '#ffc2ca', d: '#c0283c', o: '#a01f33', name: '紅' }, { c: '#ffc93a', l: '#fff0b8', d: '#d99400', o: '#b07400', name: '黃' },
  { c: '#4cc96a', l: '#c4f2cf', d: '#26904a', o: '#1d7339', name: '綠' }, { c: '#3d9bff', l: '#bfe0ff', d: '#1d64c0', o: '#164f9c', name: '藍' },
  { c: '#b07cff', l: '#e6d6ff', d: '#7444cc', o: '#5c33a8', name: '紫' }, { c: '#ff9f4a', l: '#ffdcbc', d: '#d0661e', o: '#a84f12', name: '橘' },
  { c: '#3fd6d0', l: '#c0f4f1', d: '#16958f', o: '#0f7671', name: '青' }, { c: '#ff7ac8', l: '#ffd2ec', d: '#cc3d92', o: '#a62e76', name: '粉' },
];
const ROCK = 99;                 // grey stone: never pops, only falls when what holds it is gone
const RAINBOW = 98, BOMB = 97, BOLT = 96;   // 🌈 shot that matches any colour, 💣 / ⚡ grid bubbles set off by a bubble landing next to them

// little friends trapped in bubbles (drawn in code): chick, bunny, kitten, puppy, panda, frog, hamster, koala
const FRIENDS = ['小雞', '小兔', '小貓', '小狗', '熊貓', '青蛙', '倉鼠', '無尾熊'];
// levels 21+: same kind of difficulty (b = which old level it feels like) but a new way to play

  33: { k: 'bolt', bolt: 2, b: 12 }, 34: { k: 'bolt', bolt: 2, pet: 4, b: 13 }, 35: { k: 'hang', hang: 1, ice: 4, b: 13 }, 36: { k: 'color', color: 1, bolt: 2, b: 14 },
  37: { k: 'pet', pet: 4, bomb: 2, ice: 4, b: 15 }, 38: { k: 'big', b: 20 }, 39: { k: 'hang', hang: 1, bolt: 2, ice: 5, b: 20 }, 40: { k: 'pet', pet: 5, bomb: 2, ice: 5, bolt: 1, rainbow: 1, b: 20 },
  41: { k: 'shape', shape: 'heart', b: 6, th: 'candy' }, 42: { k: 'push', push: 3, every: 6, b: 7, th: 'sea' }, 43: { k: 'sway', sway: 1, b: 8, th: 'sky' },
  44: { k: 'shape', shape: 'star', pet: 3, b: 10, th: 'night' }, 45: { k: 'push', push: 4, every: 5, bomb: 2, b: 12, th: 'sea' },

  48: { k: 'final', sway: 1, push: 4, every: 5, bomb: 1, ice: 4, b: 20, th: 'night' },

const NEWS = {

  color: ['🎨', '指定顏色', '這一關只要把<b>指定顏色</b>的泡泡全部清掉就過關！「目標」會告訴你是哪個顏色、還剩幾顆。'],

  hang: ['✂️', '吊吊泡泡', '一大串泡泡只靠<b>最上面發亮的幾顆</b>吊著。把它們打掉，下面的泡泡就會全部掉下來！'],

  bolt: ['⚡', '閃電泡泡', '把泡泡黏在<b>閃電泡泡</b>旁邊，<b>整排</b>泡泡會被閃電一起消掉！'],
  shape: ['💖', '形狀泡泡', '泡泡排成了<b>愛心、星星、小魚</b>的形狀！找到吊住一大塊的地方打下去，整片掉下來最過癮。'],
  push: ['🌊', '泡泡擠下來', '每射幾顆，上面就會<b>擠進兩排新泡泡</b>！天花板上的小燈會告訴你還剩幾顆。慢慢玩的時候，快碰到紅線就不會再擠喔。'],
  sway: ['🎈', '搖搖泡泡', '泡泡串被氣球吊著<b>左右搖來搖去</b>！看準時機再發射。泡泡碰到牆壁就搖不動了。'],
  big: ['🔥', '超級大挑戰', ''],
  final: ['🏆', '終極大挑戰', ''],
};
const SHAPES = {
  heart: ['.XX..XX.', 'XXXXXXX', 'XXXXXXXX', '.XXXXX.', '..XXXX..', '..XXX..', '...XX...'],
  star: ['...XX...', '..XXX..', 'XXXXXXXX', '.XXXXX.', '..XXXX..', '.XX.XX.', '.X....X.'],
  fish: ['..XXX...', '.XXXX.X', 'XXXXXXXX', '.XXXX.X', '..XXX...', '.XXX...'],
};
// scenes: levels 1–40 walk through them four at a time, 41+ pick their own
const THEMES = ['sea', 'sky', 'candy', 'forest', 'night', 'snow'];
const TH = {
  sea: { name: '海底', icon: '🐠', acc: '#2f9fd0', accD: '#1b6f9c', wall: ['#ffe2b8', '#e3b47a', '#b8864c'], ceil: ['#ffcf9a', '#e09a55', '#a96a2c'], glass: 'rgba(235,250,255,.34)', ground: ['#f7e5b5', '#e2c486'] },
  sky: { name: '天空', icon: '☁️', acc: '#4aa8e8', accD: '#2a78b8', wall: ['#ffffff', '#dbe9f7', '#a9c3de'], ceil: ['#ffffff', '#e2eefa', '#a8c0dc'], glass: 'rgba(255,255,255,.38)', ground: ['#a9e08f', '#7cc56a'] },
  candy: { name: '糖果屋', icon: '🍭', acc: '#f06aa8', accD: '#c23d80', wall: ['#ffffff', '#ff8fbf', '#d24f8f'], ceil: ['#f5c27e', '#d6904a', '#9a5a26'], glass: 'rgba(255,248,252,.42)', ground: ['#b97a4e', '#8a5232'] },
  forest: { name: '森林', icon: '🍄', acc: '#4fae5c', accD: '#2e7d3c', wall: ['#d9a46a', '#b07a44', '#7a4f26'], ceil: ['#c99256', '#9d6a36', '#6e4620'], glass: 'rgba(250,255,245,.38)', ground: ['#8fd16e', '#62ad52'] },
  night: { name: '星空', icon: '🌙', acc: '#7a6ae0', accD: '#4a3ea8', wall: ['#a9b6ff', '#6f7fd8', '#46509e'], ceil: ['#c9c2ff', '#8f84e0', '#5a4fb0'], glass: 'rgba(200,215,255,.16)', ground: ['#3d4a8c', '#2a3470'] },
  snow: { name: '雪國', icon: '⛄', acc: '#5aaee0', accD: '#2f7cb0', wall: ['#ffffff', '#cfe6f7', '#93bbd9'], ceil: ['#ffffff', '#d7ebfa', '#9cc0dc'], glass: 'rgba(255,255,255,.36)', ground: ['#ffffff', '#d6e9f7'] },
};
const themeOf = n => (LT[n] && LT[n].th) || THEMES[Math.floor((n - 1) / 4) % THEMES.length];
// difficulty: cl = how clumped the colours start, guide = how much aiming line is shown
const DIFF = {
  easy: { cl: 0.55, guide: Infinity, sway: 0.75, colors: n => Math.min(6, 3 + Math.floor((n - 1) / 2)), rows: n => Math.min(8, 4 + n), rocks: () => 0, drop: n => Math.max(4, 8 - Math.floor(n / 2)) },
  normal: { cl: 0.3, guide: 'bounce', sway: 1.05, colors: n => Math.min(8, 4 + Math.floor((n - 1) / 3)), rows: n => Math.min(9, 5 + Math.ceil(n / 3)), rocks: n => n >= 5 ? Math.min(9, Math.floor((n - 3) / 2)) : 0, drop: n => Math.max(3, 7 - Math.floor(n / 4)) },
  hard: { cl: 0.12, guide: 150, sway: 1.35, colors: n => Math.min(8, 5 + Math.floor((n - 1) / 4)), rows: n => Math.min(9, 6 + Math.ceil(n / 4)), rocks: n => n >= 3 ? Math.min(14, n) : 0, drop: n => Math.max(3, 6 - Math.floor(n / 4)) },
};
const NLEVELS = 48;
let mode = 'relax', diff = 'normal';
const D_ = () => DIFF[diff];
MG.fit(cv, layout);
let grid, ceilY, level, score, nColors, shot, cur, nxt, aim = -Math.PI / 2, misses, dropEvery, state = 'ready', falling = [], pops = [], t = 0, shakeT = 0, combo = 0;
let boomKind = 0, LV = {}, ice = [], pet = [], target = -1, shotN = 0, freed = [], bolts = [], popA = [], theme = 'sea';
let pushLeft = 0, pushEvery = 6, pushShots = 0, pushA = 0;          // 🌊 rows squeezing in
let SX = 0, swA = 0, swT = 0, swW = 1;                               // 🎈 swinging bunch: offset SX = swA·sin(swT)
let petKinds = [], saved = [], startCount = 1, heroMood = 'happy', moodT = 0, heroSq = 0, winT = 0, celeb = [], fireT = 0;

const snd = (() => { const last = {}; return (n, a, gap = 60) => { const now = performance.now(); if (now - (last[n] || 0) < gap) return; last[n] = now; MG.sfx(n, a); }; })();
const cols = r => (r % 2 ? COLS - 1 : COLS);
const cx = (r, c) => X0 + R + c * D + (r % 2 ? R : 0);       // grid space (without the swing)
const gx = (r, c) => cx(r, c) + SX;                         // where it is on screen right now
const rowY = r => ceilY + R + r * RH;                        // where the row really is (rules)
const cy = r => rowY(r) - pushA;                             // where it is drawn (slides down after a 🌊 push)
const ROWS = 15;
function neighbors(r, c) {
  const odd = r % 2, out = [[r, c - 1], [r, c + 1]];
  for (const dr of [-1, 1]) { if (odd) out.push([r + dr, c], [r + dr, c + 1]); else out.push([r + dr, c - 1], [r + dr, c]); }
  return out.filter(([a, b]) => a >= 0 && a < ROWS && b >= 0 && b < cols(a));
}
// 🎈 the swinging bunch stays in the middle columns
const inBand = (r, c) => !LV.sway || (r % 2 ? c >= 1 && c <= 5 : c >= 1 && c <= 6);
function clumpCell(r, c, cl, cs) {
  const left = c > 0 ? grid[r][c - 1] : -1, up = r > 0 ? grid[r - 1][Math.min(c, cols(r - 1) - 1)] : -1, rnd = Math.random();
  return rnd < cl * 0.64 && isCol(left) ? left : rnd < cl && isCol(up) ? up : MG.pick(cs);
}
function newLevel(n) {
  level = n; LV = LT[n] || {}; const b = n <= 20 ? n : (LV.b || 20);
  theme = themeOf(n);
  nColors = D_().colors(b);
  const mask = LV.shape ? SHAPES[LV.shape] : null;
  const rows = mask ? mask.length : LV.push ? Math.min(5, D_().rows(b)) : D_().rows(b) + (LV.hang ? 1 : 0), cl = D_().cl;
  dropEvery = D_().drop(b);
  grid = Array.from({ length: ROWS }, (_, r) => Array(cols(r)).fill(-1));
  ice = grid.map(row => row.map(() => false)); pet = grid.map(row => row.map(() => 0));
  const all = [...Array(nColors).keys()];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols(r); c++) {
    if (mask && mask[r][c] !== 'X') continue;
    if (!inBand(r, c)) continue;
    grid[r][c] = clumpCell(r, c, cl, all);   // small clusters so there are matches to find
  }
  if (LV.hang) {   // ✂️ the whole bunch hangs from two pairs of bubbles at the top
    const A = [2, 5];
    for (let c = 0; c < cols(0); c++) grid[0][c] = -1;
    for (const a of A) { grid[0][a] = grid[1][Math.min(a, cols(1) - 1)]; }
  }
  // stones (never in the top two rows, never touching each other, so they can always be knocked down)
  for (let k = 0, tries = 0; k < (mask ? 0 : D_().rocks(b)) && tries < 200; tries++) {
    const r = MG.randi(LV.hang ? 3 : 2, rows - 1), c = MG.randi(0, cols(r) - 1);
    if (!isCol(grid[r][c]) || neighbors(r, c).some(([a, b]) => grid[a][b] === ROCK)) continue;
    grid[r][c] = ROCK; k++;
  }
  pruneLoose();
  // special bubbles / overlays on random colour cells (never on top of each other)
  const spot = (r0, r1) => { for (let k = 0; k < 300; k++) { const r = MG.randi(r0, Math.max(r0, r1)), c = MG.randi(0, cols(r) - 1); if (isCol(grid[r][c]) && !ice[r][c] && !pet[r][c] && !(LV.hang && r <= 1)) return [r, c]; } return null; };
  for (let k = 0; k < (LV.bomb || 0); k++) { const q = spot(1, rows - 2); if (q) grid[q[0]][q[1]] = BOMB; }
  for (let k = 0; k < (LV.bolt || 0); k++) { const q = spot(2, rows - 1); if (q) grid[q[0]][q[1]] = BOLT; }

  const pk = MG.shuffle([...Array(8).keys()]), np = LV.pet || (n <= 4 ? 1 : 2);
  petKinds = [];
  for (let k = 0; k < np; k++) { const q = LV.petTop ? spot(0, 1) : spot(LV.hang ? 2 : 0, Math.max(1, Math.floor(rows / 2))); if (q) { pet[q[0]][q[1]] = pk[k % 8] + 1; petKinds.push(pk[k % 8]); } }
  for (let k = 0; k < (LV.ice || 0); k++) { const q = spot(1, rows - 1); if (q) ice[q[0]][q[1]] = true; }
  target = -1;
  if (LV.color) { const cnt = Array(8).fill(0); for (const row of grid) for (const v of row) if (isCol(v)) cnt[v]++; target = cnt.indexOf(Math.max(...cnt)); }
  ceilY = TOP0; misses = 0; shot = null; falling = []; combo = 0; shotN = 0; freed = []; bolts = []; popA = []; celeb = [];
  pushLeft = LV.push || 0; pushEvery = LV.every || 6; pushShots = 0; pushA = 0;
  SX = 0; swT = 0; swW = D_().sway; swA = LV.sway ? swayMax() : 0;

  makeAmbient();
  hud();
}
// anything not hanging from the top row falls away (used for picture layouts)
function attached() {
  const att = new Set(), st = [];
  for (let c = 0; c < cols(0); c++) if (grid[0][c] >= 0) { att.add('0,' + c); st.push([0, c]); }
  while (st.length) { const [a, b] = st.pop(); for (const [na, nb] of neighbors(a, b)) { const k = na + ',' + nb; if (!att.has(k) && grid[na][nb] >= 0) { att.add(k); st.push([na, nb]); } } }
  return att;
}
function pruneLoose() { const att = attached(); for (let r = 0; r < ROWS; r++) for (let c = 0; c < cols(r); c++) if (grid[r][c] >= 0 && !att.has(r + ',' + c)) grid[r][c] = -1; }
const countLeft = () => { let n = 0; for (const row of grid) for (const v of row) if (v >= 0) n++; return n; };
// how far the 🎈 bunch may swing without going into a wall
function swayMax() {
  let lo = 1e9, hi = -1e9;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < cols(r); c++) if (grid[r][c] >= 0) { const v = cx(r, c); lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if (lo > hi) return 0;
  return Math.max(0, Math.min(34, lo - (X0 + R), X0 + R + (COLS - 1) * D - hi));
}
// the first time a new way to play shows up, explain it once
function intro() {
  const ks = Object.keys(NEWS).filter(k => k !== 'big' && k !== 'final' && LV[k] && !MG.store.get('bubble.seen.' + k, false));
  if (!ks.length) return;
  ks.forEach(k => MG.store.set('bubble.seen.' + k, true));
  MG.panel({ title: ks.map(k => NEWS[k][0] + ' ' + NEWS[k][1]).join('＋'), html: ks.map(k => `<p>${NEWS[k][2]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
}
function go(n) { newLevel(n); state = 'play'; MG.hide(); intro(); }
const petsLeft = () => { let n = 0; for (const row of pet) for (const p of row) if (p) n++; return n; };
const targetLeft = () => { let n = 0; for (const row of grid) for (const v of row) if (v === target) n++; return n; };
function goalDone() {
  if (grid.every(row => row.every(v => v < 0))) return true;

  if (LV.color) return targetLeft() === 0;
  return false;
}

      const row = Math.floor(i / per), inRow = Math.min(per, n - row * per), px = cxm + (i % per - (inRow - 1) / 2) * s * 2.3, py = mid + (row - (rowsN - 1) / 2) * s * 2.3;
      const waiting = leftKinds.includes(kd);
      if (waiting) { x.fillStyle = 'rgba(160,200,240,.35)'; ell(x, px, py, s * 1.05, s * 1.05); x.fill(); x.strokeStyle = 'rgba(120,170,220,.8)'; x.lineWidth = 2; x.stroke(); }
      x.globalAlpha = waiting ? 0.8 : 1; blit(friendSprite(kd, waiting ? 'scared' : 'happy', s * SC), px, py + (waiting ? 0 : -Math.abs(Math.sin(t * 4 + i)) * 3), s); x.globalAlpha = 1;
      if (!waiting) { x.fillStyle = '#4cc96a'; ell(x, px + s * 0.8, py + s * 0.7, s * 0.34, s * 0.34); x.fill(); t1('✓', px + s * 0.8, py + s * 0.72, s * 0.45, '#fff'); }
    });
    if (!left) t1('全部救出來了！', cxm, by1 - f1 * 0.2, f1 * 0.85, '#2e9a4c');
  } else if (LV.color) {
    const n = targetLeft(), r = Math.min(c.w * 0.18, ah * 0.32, 38);
    bubble(cxm - r * 1.2, mid, target, r);

  } else {   // clear everything: a jar that empties as you go
    const left = countLeft(), frac = Math.max(0, Math.min(1, 1 - left / startCount));

    const shown = [cur, nxt].filter(isCol); const cs = []; for (const row of grid) for (const v of row) if (isCol(v) && !cs.includes(v)) cs.push(v);

    const y2 = mid + r * 0.45 + f1 * 0.9; x.fillStyle = 'rgba(90,122,154,.18)'; x.beginPath(); x.roundRect(cxm - bw / 2, y2, bw, bhh, bhh / 2); x.fill();

function shelfCard(c) {   // friends rescued so far in this game

function nextCard(c) {   // the next bubble; the whole card is the 換 button

  const cxm = c.x + c.w / 2, top = c.top + 2, f1 = Math.min(c.w * 0.14, (c.h) * 0.15, TXT(18));
  const bw2 = Math.min(c.w - 14, Math.max(f1 * 5.5, 70)), bh2 = Math.min(f1 * 2.1, c.h * 0.26), by2 = c.y + c.h - bh2 - 8;
  const r = Math.max(8, Math.min(c.w * 0.25, (by2 - top) / 2.5, 46)), ky = (top + by2) / 2;
  x.fillStyle = MG.big ? '#eaf2ff' : TH[theme].acc + '22'; x.beginPath(); x.arc(cxm, ky, r * 1.28, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 2; x.stroke();
  bubble(cxm, ky + Math.sin(t * 2.5) * 2, nxt, r * (1 - swapT * 1.5));
  x.fillStyle = '#4cc96a'; x.strokeStyle = '#2e9a4c'; x.lineWidth = MG.big ? 3 : 2; x.beginPath(); x.roundRect(cxm - bw2 / 2, by2, bw2, bh2, bh2 / 2); x.fill(); x.stroke();

function drawBand() {
  if (CARDS.info) infoCard(CARDS.info);

  if (CARDS.shelf) shelfCard(CARDS.shelf);
  if (CARDS.next) nextCard(CARDS.next);
  if (CARDS.tip) { const q = CARDS.tip, f = Math.min(q.h * 0.36, q.w * 0.09, TXT(15)); t1('👆 拖曳瞄準，放開發射', q.x + q.w / 2, q.y + q.h / 2 + 1, f, INKC(), 800); }
}

// ---------- flow ----------
function levelClear() {
  state = 'between'; const bonus = 100 + level * 50; score += bonus; hud(); MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  MG.record('bubble', score); MG.store.set('bubble.level', Math.max(MG.store.get('bubble.level', 1), level + 1));
  const done = MG.store.get('bubble.done', {}); done[level] = 1; MG.store.set('bubble.done', done);
  MG.fx.burst(W / 2, 260, { n: 40, colors: COLORS.map(c => c.c), speed: 260, up: 120, size: 6, shape: 'star', life: 1.2 });
  winT = 0.001; startCeleb();
  const why = LV.pet ? '小動物全部救出來了！' : LV.color ? '指定的顏色全部清光了！' : '';
  const friendsLine = petKinds.length ? `<p>救出了 ${petKinds.map(k => FRIENDS[k]).join('、')} 💗</p>` : '';
  setTimeout(() => MG.panel({
    title: `第 ${level} 關過關！`, html: `<p>${why}過關獎勵 +${bonus}</p>${friendsLine}<div class="big">${score} 分</div>` +
      (level < NLEVELS ? `<p>${nextNote(level + 1)}</p>` : `<p>全部 ${NLEVELS} 關都過了，你是泡泡龍大師！</p>`),
    buttons: [{ label: level < NLEVELS ? '下一關' : '回到第 1 關', on: () => { const n = level < NLEVELS ? level + 1 : 1; MG.store.set('bubble.pickLevel', n); go(n); } }, { label: '選關卡', alt: true, on: menu }],
  }), 1300);
}
function nextNote(n) {
  const L = LT[n], th = TH[themeOf(n)], tn = themeOf(n) !== themeOf(n - 1) ? `　要去${th.icon} ${th.name}囉！` : '';
  if (L && (L.k === 'big' || L.k === 'final')) return `下一關是${NEWS[L.k][1]} ${NEWS[L.k][0]}${tn}`;
  return (L && NEWS[L.k] ? `下一關：${NEWS[L.k][0]} ${NEWS[L.k][1]}` : '下一關會再難一點點喔') + tn;
}
function gameOver() {
  state = 'over'; MG.sfx('over'); shakeT = 0.4; mood('ouch', 99);
  const rec = MG.record('bubble', score);
  MG.panel({
    title: '泡泡碰到紅線了！',
    html: `<p>到了第 ${level} 關</p><div class="big">${score} 分</div>` + (rec.isNew && score > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best} 分</p>`) + (mode === 'timed' ? '<p>覺得太難的話，可以玩天花板不會下降的「慢慢玩」</p>' : ''),
    buttons: [{ label: '從這關再來', on: () => go(level) },
      ...(mode === 'timed' ? [{ label: '🐢 改成慢慢玩', alt: true, on: () => { mode = 'relax'; MG.store.set('bubble.pickMode', 'relax'); go(level); } }] : []),
      { label: '選關卡', alt: true, on: menu }],

}
function start(m, lv, pk) { mode = m; if (pk && pk.diff) diff = pk.diff; score = 0; saved = []; go(lv || 1); }
function menu() {
  state = 'ready';
  const done = MG.store.get('bubble.done', {});
  MG.choose({
    id: 'bubble', title: '噗噗泡泡龍',
    html: `<p>瞄準後發射泡泡，碰到<b>三個以上一樣顏色</b>就會破掉，沒黏住的泡泡會一起掉下來！順便把關在泡泡裡的小動物救出來。</p><p>一路從 🐠 海底、☁️ 天空、🍭 糖果屋、🍄 森林、🌙 星空玩到 ⛄ 雪國。第 21 關起有新玩法：🐣 救小動物、💣 炸彈、🎨 指定顏色、🌈 彩虹、✂️ 吊吊泡泡、🧊 冰凍、⚡ 閃電；第 41 關起還有 💖 形狀泡泡、🌊 泡泡擠下來、🎈 搖搖泡泡，最後是 🏆 終極大挑戰！</p>${('ontouchstart' in window) && innerWidth > innerHeight && innerHeight < 500 ? '<p class="new">📱 把手機直放，泡泡會更大！</p>' : ''}`,
    modesTitle: '天花板',

    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '天花板不會往下降' }, { id: 'timed', label: '⏬ 天花板會降', sub: '一直沒消除天花板會下降' }],
    levels: { count: NLEVELS, max: NLEVELS, label: n => { const L = LT[n], th = TH[themeOf(n)]; return (L && NEWS[L.k] ? `${n}（${NEWS[L.k][0]} ${NEWS[L.k][1]}）` : `${n}（${th.icon} ${th.name}）`) + (done[n] ? ' ✓' : ''); }, short: n => { const L = LT[n]; return `${n}${L && NEWS[L.k] ? NEWS[L.k][0] : (n - 1) % 4 === 0 ? TH[themeOf(n)].icon : ''}${done[n] ? '✓' : ''}`; } },
    keys: '手指按住拖曳瞄準、放開發射　電腦：滑鼠瞄準點擊，或 <kbd>←</kbd><kbd>→</kbd> 瞄準、<kbd>空白鍵</kbd> 發射、<kbd>S</kbd> 交換',

score = 0; newLevel(1); menu();
window.BBT = { toClient(px, py) { const r = cv.getBoundingClientRect(), k = (r.width - 6) / CW; return { x: r.left + 3 + (FX + (px - VX0) * FS) * k, y: r.top + 3 + (FY + (py - VY0) * FS) * k }; }, get swapBtn() { return SWAPB; }, get nxt() { return nxt; }, get state() { return state; }, pops: () => pops.map(p => p.t), grid: () => grid.map(r => r.slice()), cell: (r, c) => ({ x: gx(r, c), y: cy(r) }), get cur() { return cur; }, get shot() { return !!shot; }, SHOOT,
  aimAt(px, py) { aim = Math.max(-Math.PI + 0.16, Math.min(-0.16, Math.atan2(py - SHOOT.y, px - SHOOT.x))); }, fire: () => fire(), setCur(c) { cur = c; },
  // levels 21+ and a simple greedy player for the tests

  go: n => go(n), setDiff(d) { diff = d; }, setMode(m) { mode = m; }, swap: () => swap(), win: () => { if (state === 'play') levelClear(); },
  get level() { return level; },
  sim(a) {   // follows the shot, including a 🎈 bunch that keeps swinging while it flies
    let px = SHOOT.x, py = SHOOT.y, vx = Math.cos(a) * SPEED, vy = Math.sin(a) * SPEED; const dt = 1 / 240, L = X0 + R, Rr = X0 + COLS * D;
    const sx0 = SX; let tt = 0;

      px += vx * dt; py += vy * dt; tt += dt; if (px < L) { px = L; vx = Math.abs(vx); } if (px > Rr) { px = Rr; vx = -Math.abs(vx); }
      const sx = sxAt();
      if (py <= ceilY + R || hits(px, py, sx)) { SX = sx; const cell = landingCell(px, py); SX = sx0; return cell; }
    }

  },
  score(a, col) {
    const cell = this.sim(a); if (!cell) return -1e9; const [r, c] = cell;

    for (const cc of cs) {
      const g = flood(r, c, cc); let v = g.length;
      if (g.length >= 3) { v = 10 + g.length; for (const [p, q] of g) { if (pet[p][q]) v += 8; if (cc === target) v += 3; for (const [p2, q2] of neighbors(p, q)) if (ice[p2][q2]) v += 2; } }
      best = Math.max(best, v);

    if (neighbors(r, c).some(([p, q]) => grid[p][q] === BOMB || grid[p][q] === BOLT)) best += 9;

  },
  plan() {   // best angle (and whether to swap first) for the greedy player — the touch tests tap there
    let best = -1e9, ba = -Math.PI / 2, sw = false;
    for (const [col, isSw] of [[cur, false], [nxt, true]]) for (let i = 0; i <= 160; i++) {
      const a = -Math.PI + 0.16 + (Math.PI - 0.32) * i / 160, v = this.score(a, col) - (isSw ? 0.5 : 0);
      if (v > best) { best = v; ba = a; sw = isSw; }
    }
    return { a: ba, swap: sw, tx: SHOOT.x + Math.cos(ba) * 160, ty: SHOOT.y + Math.sin(ba) * 160 };
  },
  autoStep() {
    if (state !== 'play' || shot) return false;
    const p = this.plan();
    if (p.swap) swap(); aim = p.a; fire(); return true;
  },
  autoPlay(max = 400) {   // plays the level synchronously (no waiting for animations)
    let n = 0;
    while (state === 'play' && n < max) { if (!this.autoStep()) break; n++; for (let k = 0; k < 600 && (shot || pushA > 0); k++) update(1 / 60); }

MG.loop(dt => { if (state === 'play') update(dt); else { t += dt; stepFx(dt); for (const f of falling) { f.vy += 1400 * dt; f.y += f.vy * dt; } } draw(); });
