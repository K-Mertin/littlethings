      { key: 'help', title: '和弦按鈕', def: 'self', options: [{ id: 'self', label: '👆 我來按', sub: '按一樣顏色的' }, { id: 'auto', label: '🪄 自動換', sub: '只要刷就好' }] },
    ],
    modesTitle: '想怎麼玩？',
    modes: [{ id: 'level', label: '🎶 闖關彈', sub: '30 關，收集星星' }, { id: 'free', label: '🎨 自由彈', sub: '換吉他、錄音、播放', noLevels: true, hide: ['pace', 'help'] }],
    levels: {
      count: LEVELS.length, max: LEVELS.length,
      label: n => `${TYPE[LEVELS[n - 1].type][0]} ${lvName(n)}` + (map[LEVELS[n - 1].id] ? ' ' + '⭐'.repeat(map[LEVELS[n - 1].id]) : ''),
      short: n => `${n}${TYPE[LEVELS[n - 1].type][0]}` + (map[LEVELS[n - 1].id] ? '⭐' : ''),
    },
    keys: '手指在琴弦上滑過去就會響，按住或點一下彩色和弦按鈕再刷　電腦鍵盤：<kbd>1</kbd>～<kbd>8</kbd> 換和弦、<kbd>↓</kbd> 或 <kbd>空白鍵</kbd> 往下刷、<kbd>↑</kbd> 往上刷、<kbd>D</kbd> 歌曲示範',
    playing: () => state === 'play' || state === 'intro',
    onPause: () => { if (demo) endDemo(); stopAll(); },
    start: (m, lv, pk) => {
      ins = pk.ins; pace = pk.pace; helper = pk.help;
      unlockAudio();
      if (m === 'free') startFree(); else startLevel(lv);
    },
  });
  hud();
}

// level grid: a heading in front of each section (also inside the ☰ pause menu)
function decorateGrid() {
  const g = document.querySelector('.mg-over .mg-lvgrid');
  if (!g || g.dataset.sections || !document.getElementById('gtMenu')) return;
  g.dataset.sections = '1';
  let last = null;
  LEVELS.forEach((q, i) => {
    const sc = secOf(q); if (sc === last) return; last = sc;
    const b = g.querySelector(`.mg-lv[data-lv="${i + 1}"]`); if (!b) return;
    const h = document.createElement('div'); h.className = 'gt-sec'; h.textContent = sc.nm;
    g.insertBefore(h, b);
  });
}
new MutationObserver(decorateGrid).observe(document.body, { childList: true, subtree: true });

// =====================================================================
// record & play back (自由彈)
// =====================================================================
function recPush(s, m, vel, delay) {
  const tt = performance.now() + delay * 1000 - rec.t0;
  if (tt > 90000 || rec.ev.length > 900) { stopRec(); return; }
  rec.ev.push([Math.round(tt), s, m, +vel.toFixed(2)]);
}
function toggleRec() { if (rec.on) return stopRec(); pb = null; rec.on = true; rec.t0 = performance.now(); rec.ev = []; MG.sfx('click'); hud(); }
function stopRec() { rec.on = false; MG.store.set('guitar.rec', rec.ev); hud(); }
function togglePlay() {
  if (pb) { pb = null; return; }
  if (rec.on) stopRec();
  if (!rec.ev.length) { MG.sfx('miss'); MG.toast('⏺️ → 🎸 → ⏹️ → ▶️'); return; }
  pb = { t0: performance.now(), i: 0 };
}
function updatePb() {
  if (!pb) return;
  const now = performance.now() - pb.t0;
  while (pb && pb.i < rec.ev.length && rec.ev[pb.i][0] <= now) { const [, s, m, v] = rec.ev[pb.i]; if (s < nStr()) pluck(s, m, v, 0, true); heroStrum('D'); pb.i++; }
  if (pb && pb.i >= rec.ev.length && now > rec.ev[rec.ev.length - 1][0] + 1500) pb = null;
}

// =====================================================================
// input
// =====================================================================
const ptrs = new Map();
const inRect = (p, r, m = 0) => p.x >= r.x - m && p.x <= r.x + r.w + m && p.y >= r.y - m && p.y <= r.y + r.h + m;
function inStrings(p) { const S = SR, n = S.ys.length; return p.x >= S.x0 && p.x <= S.x1 && p.y >= S.ys[0] - S.sp * 0.8 && p.y <= S.ys[n - 1] + S.sp * 0.8; }
function nearestString(py) { const S = SR; let b = -1, bd = S.sp * 0.55; S.ys.forEach((y, s) => { const d = Math.abs(py - y); if (d < bd) { bd = d; b = s; } }); return b; }
function selectChord(c, fromUser) {
  if (!CH[c]) return;
  if (chordSel !== c) { chordSel = c; MG.sfx('flip'); }
  padBump[c] = 1;
  // a little "chk" so changing chords feels physical
  void fromUser;
}
function pressBtn(b) {
  if (b.id === 'ins') { if (ins !== b.v) { ins = b.v; MG.store.set('guitar.pick.ins', ins); stopAll(); relayout(); strAmp.fill(0); } MG.sfx('click'); }
  else if (b.id === 'scene') { const L2 = ['camp', 'meadow', 'beach', 'stage']; scene = L2[(L2.indexOf(scene) + 1) % 4]; MG.store.set('guitar.scene', scene); layerKey = ''; MG.sfx('whoosh'); }
  else if (b.id === 'ctx') { context = isMel() ? 'chord' : 'mel'; MG.store.set('guitar.ctx', context); relayout(); MG.sfx('pop'); }
  else if (b.id === 'rec') toggleRec();
  else if (b.id === 'play') togglePlay();
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); unlockAudio();
  if (state !== 'play') return;
  const p = cv.logical(e);
  try { cv.setPointerCapture(e.pointerId); } catch {}
  if (demoBtn && inRect(p, demoBtn, 4)) { ptrs.set(e.pointerId, { kind: 'btn' }); if (demo) endDemo(); else startDemo(); return; }
  if (demo) { ptrs.set(e.pointerId, { kind: 'btn' }); endDemo(); return; }   // any touch stops the demo: now it's your turn
  const b = btns.find(q => inRect(p, q, 3));
  if (b) { ptrs.set(e.pointerId, { kind: 'btn' }); pressBtn(b); return; }
  const pd = pads.find(q => inRect(p, q, 4));
  if (pd) { ptrs.set(e.pointerId, { kind: 'pad', c: pd.c }); selectChord(pd.c, true); return; }
  const r = { kind: 'str', x: p.x, y: p.y, sx: p.x, sy: p.y, t0: performance.now(), lt: performance.now(), count: 0, dir: 0, emitted: false, total: 0, inside: inStrings(p) };
  ptrs.set(e.pointerId, r);
  if (isMel() && r.inside) { const s = nearestString(p.y); if (s >= 0) { const f = fretAt(p.x); pluck(s, INS[ins].open[s] + f, 0.85); onPluck(s, f, true); r.plucked = s; } }
});
cv.addEventListener('pointermove', e => {
  const r = ptrs.get(e.pointerId); if (!r || r.kind !== 'str' || state !== 'play') return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = cv.logical(ev), now = performance.now();
    const y0 = r.y, y1 = p.y, dy = y1 - y0;
    if (dy !== 0 && p.x >= SR.x0 - 10 && p.x <= SR.x1 + 10) {
      const dir = dy > 0 ? 'D' : 'U', speed = Math.abs(dy) / Math.max(1, now - r.lt);
      const order = SR.ys.map((y, s) => ({ y, s })).filter(o => dy > 0 ? (o.y > y0 && o.y <= y1) : (o.y < y0 && o.y >= y1));
      if (dy < 0) order.reverse();
      for (const o of order) {
        const k = (o.y - y0) / dy, cx = r.x + (p.x - r.x) * k;
        const vel = clamp(0.5 + speed * 0.35, 0.5, 1);
        if (isMel()) { if (o.s !== r.plucked) { const f = fretAt(cx); pluck(o.s, INS[ins].open[o.s] + f, vel * 0.9); onPluck(o.s, f, false); } r.plucked = -1; }
        else strumString(o.s, vel);
        if (r.dir !== dir) { r.dir = dir; r.count = 0; r.emitted = false; }
        r.count++; r.total++;
        if (!isMel() && !r.emitted && r.count >= 2) { r.emitted = true; onStrum(dir); }
      }
    }
    r.x = p.x; r.y = p.y; r.lt = now;
  }
});
function ptrEnd(e) {
  const r = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
  if (!r || r.kind !== 'str' || state !== 'play' || isMel()) return;
  if (!r.emitted && r.count >= 1) { onStrum(r.dir); return; }
  // a quick tap on the strings = a friendly down-strum
  if (r.total === 0 && r.inside && Math.hypot(r.x - r.sx, r.y - r.sy) < 16 && performance.now() - r.t0 < 600 && e.type === 'pointerup') { autoStrum('D', 0.8); onStrum('D'); }
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', ptrEnd);
addEventListener('keydown', e => {
  if (state !== 'play' || e.repeat) return;
  if (demo) { if (/^[1-9]$|^Arrow(Up|Down)$|^ $|^Escape$/.test(e.key)) { e.preventDefault(); endDemo(); } return; }
  if (e.key === 'd' || e.key === 'D') { if (canDemo()) startDemo(); return; }
  const chs = pads.map(p => p.c);
  if (/^[1-9]$/.test(e.key) && chs[+e.key - 1]) { selectChord(chs[+e.key - 1], true); e.preventDefault(); return; }
  if (e.key === 'ArrowDown' || e.key === ' ' || e.key === 'ArrowUp') {
    e.preventDefault(); unlockAudio();
    const dir = e.key === 'ArrowUp' ? 'U' : 'D';
    if (isMel()) { const n = G.notes && G.notes[G.idx]; if (mode === 'level' && n) { pluck(n.s, INS[ins].open[n.s] + n.f, 0.85); onPluck(n.s, n.f, true); } return; }
    autoStrum(dir); onStrum(dir);
  }
});

// =====================================================================
// update & draw
// =====================================================================
function update(dt) {
  tNow += dt; frameN++; MG.fx.step(dt);
  for (let s = 0; s < strAmp.length; s++) strAmp[s] *= Math.exp(-dt * 2.2);
  for (const f of floats) { f.life -= dt; f.y += f.vy * dt; } floats = floats.filter(f => f.life > 0);
  for (const k in padBump) { padBump[k] = Math.max(0, padBump[k] - dt * 3); }
  heroSq = Math.max(0, heroSq - dt * 5); heroArm = Math.max(0, heroArm - dt * 4); activity = Math.max(0, activity - dt * 0.5); heroMoodT -= dt; dirFlash = Math.max(0, dirFlash - dt);
  if (melNodes.length > 40 && ac) { const now = ac.currentTime; melNodes = melNodes.filter(n => n.end > now); }
  if (warmQ.length && frameN % 2 === 0) warmStep();
  updatePb();
  if (demo && state === 'play') { updateDemo(dt); return; }
  if (state !== 'play' || mode !== 'level' || !G.ready) return;
  const t = LV.type;
  if (G.endAt && tNow >= G.endAt) { finish(); return; }
  if (t === 'song' || t === 'pattern' || t === 'melOpen' || t === 'melFret') {
    const list = G.cues || G.notes;
    G.view = lerp(G.view, G.idx, Math.min(1, dt * 9));
    if (G.pulse) G.pulse = Math.max(0, G.pulse - dt * 2);
    if (timed()) {
      G.clock += dt;
      const bi = Math.floor(G.clock / G.spb);
      if (bi !== G.lastTick) { G.lastTick = bi; if (G.clock < 0) MG.sfx('tick'); else if (isMel() && bi % 1 === 0 && G.idx < list.length) MG.sfx('tick'); }
      if (helper === 'auto' && G.cues) { const c = G.cues[G.idx]; if (c && c.t - G.clock < 0.35 && chordSel !== c.chord) { chordSel = c.chord; padBump[c.chord] = 1; } }
      let changed = false;
      while (G.idx < list.length && list[G.idx].t < G.clock - GOOD) { list[G.idx].res = 'miss'; G.miss++; G.idx++; changed = true; }
      if (changed) { hud(); if (G.idx >= list.length && !G.endAt) G.endAt = tNow + 1.2; }
      if (G.mel) while (G.melNext < G.mel.length && G.mel[G.melNext].t * G.spb <= G.clock + 0.15) { const n = G.mel[G.melNext]; if (n.t * G.spb >= G.clock - 0.05) melNote(n.m, n.t * G.spb - G.clock, n.d * G.spb); G.melNext++; }
      if (G.idx >= list.length && !G.endAt) G.endAt = tNow + Math.max(0.8, (G.total * G.spb - G.clock) + 0.4);
    }
  } else if (t === 'echo') {
    G.shake = Math.max(0, G.shake - dt);
    if (G.phase === 'wait') { G.timer -= dt; if (G.timer <= 0) { G.phase = 'demo'; G.shown = []; G.demoI = 0; G.timer = 0.2; } }
    else if (G.phase === 'demo') {
      G.timer -= dt;
      if (G.timer <= 0) {
        const round = G.rounds[G.r];
        if (G.demoI < round.length) { heroDemo(round[G.demoI]); G.demoI++; G.timer = 0.62; }
        else { G.phase = 'you'; G.k = 0; G.mine = []; MG.sfx('pop'); if (LV.chords && helper !== 'none') { /* the player picks the chords */ } }
      }
    } else if (G.phase === 'ok') { G.timer -= dt; if (G.timer <= 0) { G.r++; if (G.r >= G.rounds.length) { G.r = G.rounds.length - 1; G.phase = 'end'; G.endAt = tNow + 0.4; } else { G.phase = 'wait'; G.timer = 0.5; G.shown = []; G.mine = []; G.k = 0; hud(); } } }
  } else if (t === 'request') {
    G.shake = Math.max(0, G.shake - dt); G.fT += dt;
    if (G.fState === 'in') { G.fx = lerp(G.fx, spot.reqX, Math.min(1, dt * 4)); if (Math.abs(G.fx - spot.reqX) < 3) { G.fx = spot.reqX; G.fState = 'wait'; MG.sfx('pop'); } }
    else if (G.fState === 'happy') { if (G.fT > 1.1) { G.fState = 'out'; G.fT = 0; MG.sfx('whoosh'); } }
    else if (G.fState === 'out') { G.fx -= dt * W * 0.9; if (G.fx < -spot.reqR * 2) { G.i++; hud(); if (G.i >= G.q.length) { G.fState = 'done'; G.endAt = tNow + 0.3; } else { G.fState = 'in'; G.fx = W + spot.reqR * 2; G.fT = 0; } } }
  }
}
function draw() {
  buildLayer();
  x.drawImage(layer, 0, 0, W, H);
  drawSceneFx(); drawFire();
  drawFriends();
  drawHero();
  drawLane(); drawEcho(); drawRequest();
  drawStrings(); drawPads(); drawButtons(); drawDemoHand(); drawDemoBtn();
  MG.fx.draw(x); drawFloats();
}

// =====================================================================
// boot
// =====================================================================
cv.onfit = () => relayout();
MG.fit(cv, (sw, sh) => {
  if (sw > sh * 1.05) { const h = 560; return [Math.round(clamp(h * (sw - 12) / Math.max(1, sh - 12), 800, 1400)), h]; }
  const w = 480; return [w, Math.round(clamp(w * (sh - 12) / Math.max(1, sw - 12), 640, 1040))];
});
menu();

function toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; }
window.GTT = {
  get state() { return state; }, get mode() { return mode; }, get level() { return level; }, get type() { return LV.type; }, get ins() { return ins; }, get pace() { return pace; }, get helper() { return helper; },
  get chord() { return chordSel; }, get context() { return context; }, levels: LEVELS.length, get G() { return G; },
  start: n => { startLevel(n); if (state === 'intro') { MG.hide(); state = 'play'; beginRun(); } },
  free: () => startFree(), win: () => finish(),
  set: o => { if (o.ins) ins = o.ins; if (o.pace) pace = o.pace; if (o.helper) helper = o.helper; },
  select: c => selectChord(c, true), strum: d => { autoStrum(d || 'D'); onStrum(d || 'D'); },
  need: () => { const t = LV.type; if (t === 'song' || t === 'pattern') { const c = G.cues[G.idx]; return c ? { chord: c.chord, dir: c.dir, t: c.t } : null; } if (t === 'melOpen' || t === 'melFret') { const n = G.notes[G.idx]; return n ? { s: n.s, f: n.f, t: n.t } : null; } if (t === 'request') return G.fState === 'wait' ? { chord: G.q[G.i] } : null; if (t === 'echo') { const w = G.phase === 'you' && G.rounds[G.r][G.k]; return w ? { chord: w.c, dir: w.d } : null; } if (t === 'wake') return { chord: chordSel, dir: 'D' }; return null; },
  padPoint: c => { const p = pads.find(q => q.c === c); return p ? toClient(p.x + p.w / 2, p.y + p.h / 2) : null; },
  btnPoint: (id, v) => { const b = btns.find(q => q.id === id && (v == null || q.v === v)); return b ? toClient(b.x + b.w / 2, b.y + b.h / 2) : null; },
  stringPoint: (s, f) => toClient(f == null ? SR.holeX : fretCellX(f), SR.ys[s]),
  strumLine: () => { const n = SR.ys.length, zx = SR.holeX + SR.holeR * 0.3; return { a: toClient(zx, SR.ys[0] - SR.sp * 0.6), b: toClient(zx, SR.ys[n - 1] + SR.sp * 0.6) }; },
  stars: () => starMap(), audio: () => ({ ...AU, ctx: ac ? ac.state : 'none' }), get frames() { return frameN; },
  dims: () => ({ W, H, T, land, pads: pads.length, strings: SR.ys.length, sp: SR.sp }),
  validate: () => {
    const out = [];
    for (const k in SONGS) { const S = SONGS[k]; if (S.str) { const st = parseStr(S.str); if (st.total % S.bar) out.push(k + ' str beats ' + st.total); continue; } const bars = S.ch.split('|').length, m = parseMel(S.mel); if (Math.abs(m.total - bars * S.bar) > 1e-6) out.push(`${k}: mel ${m.total} vs bars ${bars * S.bar}`); for (const b of S.ch.split('|')) for (const c of b.trim().split(/\s+/)) if (!CH[c]) out.push(k + ' bad chord ' + c); }
    for (const [i, q] of LEVELS.entries()) { if (q.song && !SONGS[q.song]) out.push('lv' + (i + 1) + ' no song'); if (q.type === 'melFret') { for (const id of ['guitar', 'uke']) { const save = ins; ins = id; for (const n of parseMel(SONGS[q.song].mel)) { const tb = id === 'uke' ? POS.uke : POS.guitar, a = id === 'uke' ? n.m : n.m - 12; if (!tb[a] && !tb[a + 12] && !tb[a - 12]) out.push(`lv${i + 1} ${id} no pos ${n.m}`); } ins = save; } } }
    return out;
  },
  demo: () => startDemo(), stopDemo: () => endDemo(), get demoOn() { return !!demo; }, demoPoint: () => demoBtn ? toClient(demoBtn.x + demoBtn.w / 2, demoBtn.y + demoBtn.h / 2) : null,
  ids: () => LEVELS.map(q => q.id),
  rec: () => rec.ev.length, get recOn() { return rec.on; }, get playing() { return !!pb; },
};

MG.loop(dt => { update(dt); draw(); });
