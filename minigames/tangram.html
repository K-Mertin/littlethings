  HX: { v: [[2, 0], [1, -S3], [-1, -S3], [-2, 0], [-1, S3], [1, S3]], set: 'blk' },
  TZ: { v: [[-2, 0], [2, 0], [1, -S3], [-1, -S3]], set: 'blk' },

  BS: { v: [[0, 0], [2, 0], [2, 2], [0, 2]], set: 'blk' },

const STEPS = { tan: 8, blk: 6 };             // rotations per full turn
function centroid(p) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < p.length; i++) { const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length], c = x0 * y1 - x1 * y0; a += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c; }
  a /= 2; return [cx / (6 * a), cy / (6 * a), Math.abs(a)];
}
const areaOf = p => centroid(p)[2];
for (const k in KINDS) { const K = KINDS[k], [cx, cy, a] = centroid(K.v); K.local = K.v.map(([x, y]) => [x - cx, y - cy]); K.area = a; K.n = STEPS[K.set]; }
// the piece's polygon (centred on 0,0) at rotation r (steps) and flip f
function shapeOf(kind, r, f) {
  const K = KINDS[kind], a = r * Math.PI * 2 / K.n, c = Math.cos(a), s = Math.sin(a);
  return K.local.map(([x, y]) => { if (f) x = -x; return [x * c - y * s, x * s + y * c]; });
}
function sameSet(p, q, eps = 0.02) {
  if (p.length !== q.length) return false;
  return p.every(([x, y]) => q.some(([u, v]) => Math.abs(x - u) < eps && Math.abs(y - v) < eps));
}

  for (const k in KINDS) {
    const K = KINDS[k]; if (K.set !== set || K.v.length !== poly.length || Math.abs(K.area - a) > 0.03) continue;
    const m = [];
    for (let f = 0; f < 2; f++) for (let r = 0; r < K.n; r++) if (sameSet(shapeOf(k, r, !!f), loc)) m.push([r, !!f]);
    if (m.length) return { kind: k, c: [cx, cy], m };
  }
  return null;
}

let rnd = Math.random;

    for (let k = 0; k < 4; k++) { const ph = (T * 0.5 + k / 4) % 1, [sx, sy] = toPx([bb.x0 + g.off[0] - 0.3 + Math.sin(ph * 9 + k) * 0.2, bb.y0 + g.off[1] + (bb.y1 - bb.y0) * 0.5 - ph * 2.5]); x.strokeStyle = `rgba(90,160,230,${0.8 * (1 - ph)})`; x.lineWidth = 2; x.beginPath(); x.arc(sx, sy, u * (0.1 + k * 0.03), 0, TAU); x.stroke(); }
  }
  if (!under && A.shell) withFig(gi, T, () => {
    const [sx, sy] = toPx([A.shell[0] + g.off[0], A.shell[1] + g.off[1]]);
    x.strokeStyle = 'rgba(255,255,255,.75)'; x.lineWidth = Math.max(2.5, u * 0.09); x.lineCap = 'round'; x.beginPath();
    for (let a = 0; a < TAU * 2.2; a += 0.15) { const r = u * 0.12 * a; x.lineTo(sx + Math.cos(a + T * 2) * r, sy + Math.sin(a + T * 2) * r); } x.stroke();
  });
}
function drawHero() {
  if (!heroPos) return;
  let [hx, hy, hr] = heroPos;
  let mood = heroMood.m, sq = 0, dy = 0;
  if (state === 'win' && mode === 'levels') {      // celebrate in the middle of the (now empty) tray
    const k = Math.min(1, winT / 0.5), R = Math.min(tray.w, tray.h) * 0.2, tx = tray.x + tray.w / 2, ty = tray.y + tray.h / 2 + R * 0.1;
    hx += (tx - hx) * k; hy += (ty - hy) * k; hr += (R - hr) * k;
  }
  if (state === 'win' || freeAlive >= 0) { const p = (t * 1.8) % 1; dy = -4 * p * (1 - p) * hr * 0.5; sq = p < 0.1 ? 0.12 : 0; mood = 'proud'; }
  else if (heroMood.t <= 0) mood = 'happy';
  const look = drag ? Math.max(-1, Math.min(1, (drag.p.px - hx) / 200)) : Math.sin(t * 0.7) * 0.5;
  MG.puPu(x, hx, hy + dy, hr, mood, sq + Math.sin(t * 3) * 0.02, { look, arms: state === 'win' || freeAlive >= 0 ? 'up' : undefined });
}
function draw() {
  if (!bgCache) bgCache = buildBg();
  x.drawImage(bgCache, 0, 0, W, H);
  if (!pieces.length) return;
  const alive = state === 'win' && winT >= 0;
  if (alive) { x.save(); rr(board.x + 5, board.y + 5, board.w - 10, board.h - 10, 22); x.clip(); }
  if (!alive) drawSilhouette();
  else {   // a faint shadow stays where the picture was
    x.globalAlpha = Math.max(0.12, 1 - winT * 2); drawSilhouette(); x.globalAlpha = 1;
    figs.forEach((g, gi) => drawExtras(gi, winT, true));
  }
  if (!alive) drawHero();
  // placed pieces (moving together when alive)
  const placed = pieces.filter(p => p.st === 'placed');
  if (alive) {
    figs.forEach((g, gi) => withFig(gi, winT, () => {
      for (const p of placed) { const s = slots[p.slot]; if (s.g !== gi) continue; x.save(); partTf(gi, s.i, winT); drawPiece(p, { alive: true }); x.restore(); }
      drawEyes(gi, winT);
    }));
    figs.forEach((g, gi) => drawExtras(gi, winT, false));
    x.restore(); drawHero();
  } else for (const p of placed) drawPiece(p);
  // free-play creature
  const loose = pieces.filter(p => p.st === 'loose' || p.st === 'tray').sort((a, b) => a.z - b.z);
  if (freeAlive >= 0) {
    const ls = pieces.filter(p => p.st === 'loose'), b = bboxOf(ls.flatMap(p => screenPts(p)));
    const ph = (freeAlive * 1.5) % 1, dy = -4 * ph * (1 - ph) * u * 0.6;
    x.save(); x.translate(0, dy);
    for (const p of loose.filter(p => p.st === 'loose')) drawPiece(p, { alive: true });
    // eyes on the top piece
    const top = ls.slice().sort((a, b2) => bboxOf(screenPts(a)).y0 - bboxOf(screenPts(b2)).y0)[0];
    const re = Math.max(7, u * 0.26), [cx, cy] = [top.px, top.py], blink = (freeAlive % 3) < 0.12;
    for (const sd of [-1, 1]) { const ex = cx + sd * re * 1.25; if (blink) { x.strokeStyle = '#2a2236'; x.lineWidth = 3; x.beginPath(); x.arc(ex, cy, re * 0.8, 0.3, Math.PI - 0.3); x.stroke(); continue; } x.fillStyle = '#fff'; x.strokeStyle = '#2a2236'; x.lineWidth = 2; x.beginPath(); x.ellipse(ex, cy, re, re * 1.1, 0, 0, TAU); x.fill(); x.stroke(); x.fillStyle = '#2a2236'; x.beginPath(); x.arc(ex + Math.sin(freeAlive) * re * 0.3, cy + re * 0.1, re * 0.55, 0, TAU); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(ex - re * 0.2, cy - re * 0.15, re * 0.18, 0, TAU); x.fill(); }
    x.restore(); void b;
    for (const p of loose.filter(p => p.st === 'tray')) drawPiece(p);
  } else for (const p of loose) drawPiece(p);
  if (drag) drawPiece(drag.p, { lift: drag.moved ? 1 : 0.4 });
  if (state === 'play') for (const p of pieces) if (p.st !== 'placed' && flippable(p) && !(drag && drag.p === p && drag.moved)) drawBadge(p);
  if (state === 'play') for (const b of btns) drawBtn(b);
  MG.fx.draw(x);
  drawFloats();
}
function say(px, py, text, col) { floats.push({ text, col, x: px, y: py, life: 1.2 }); if (floats.length > 4) floats.shift(); }
function drawFloats() {
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    let sz = Math.round(Math.max(20, Math.min(34, u * 0.55)) * MG.textScale);
    x.font = `900 ${sz}px system-ui,${FONT}`;
    const tw = x.measureText(f.text).width, fx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x)), fy = Math.max(sz, f.y - (1.2 - f.life) * 34);
    x.globalAlpha = Math.min(1, f.life * 2.5);
    x.lineWidth = Math.max(4, sz * 0.22); x.strokeStyle = '#fff'; x.strokeText(f.text, fx, fy);
    x.fillStyle = f.col; x.fillText(f.text, fx, fy);
  }
  x.globalAlpha = 1;
}

// ---------- menu ----------
const lvName = n => { const Lv = LEVELS[n - 1]; return `${Lv.f.map(k => FIG[k].emo + ' ' + FIG[k].name).join('＋')}・${TYPE[Lv.t].name}`; };
function menu() {
  state = 'menu';
  MG.choose({
    id: 'tangram', title: '七巧板',
    html: `<p>把彩色的板子<b>拖到影子上</b>，放對地方就會「喀」一聲黏住，<b>點一下</b>可以轉方向。拼好了，圖案就會<b>活起來</b>！</p><p>不限時間，慢慢拼；有 💡 提示，按兩下還會幫你放好一塊 ^_^</p><p>有框框的簡單關、影子關、🧩 真正的七巧板、🔶 積木板、🪞 翻面板、👯 一次拼兩個圖！</p>`,
    modes: [{ id: 'levels', label: '🧩 拼圖關卡', sub: '把影子拼出來' }, { id: 'free', label: '🎨 自由拼', sub: '拼你自己的圖' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${lvName(n)}${stars[n] ? ' ' + '⭐'.repeat(stars[n]) : ''}）`, short: n => `${n}${TYPE[LEVELS[n - 1].t].mark}${stars[n] ? '✓' : ''}` },
    levelsTitle: '選一關（自由拼不用選）',
    keys: '拖動板子　點一下轉　<kbd>R</kbd> 轉最上面的板子　<kbd>H</kbd> 提示',
    playing: () => state === 'play' || state === 'win',
    start: (m, lv) => { if (m === 'free') startFree(); else startLevel(lv); },
  });
}
// a sample behind the start panel
startLevel(Math.min(LEVELS.length, MG.store.get('tangram.pickLevel', 1) || 1), true); state = 'menu';
menu();

window.TGT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get u() { return u; },
  start: lv => startLevel(lv), free: s => startFree(s), win: () => { for (const p of pieces) if (p.st !== 'placed') TGT.placePiece(p.id); },
  slots: () => slots.map(s => ({ kind: s.kind, filled: s.filled, c: s.c, m: s.m })),
  pieces: () => pieces.map(p => ({ id: p.id, kind: p.kind, st: p.st, r: p.r, f: p.f, px: p.px, py: p.py })),
  // put piece id exactly on a free slot of its kind in the matching turn and let the game snap it (returns true when it snapped)
  placePiece(id) {
    const p = pieces[id]; if (p.st === 'placed') return true;
    const s = slots.find(q => q.filled < 0 && q.kind === p.kind); if (!s) return false;
    const m = s.m.find(q => q[1] === p.f) || s.m[0];
    if (L.t !== 'flip' && m[1]) return false;               // a flipped spot outside 🪞 levels: not solvable
    p.r = m[0]; p.f = m[1]; p.ang = p.r * TAU / KINDS[p.kind].n; p.fs = p.f ? -1 : 1; p.angT = p.fsT = undefined;
    [p.px, p.py] = toPx(s.c); p.px += u * 0.3; p.py -= u * 0.25; p.st = 'loose';
    return trySnap(p, false);
  },
  // screen (client) coordinates of a logical canvas point
  client(px, py) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + px * (rc.width - 2 * B) / cv.lw, y: rc.top + B + py * (rc.height - 2 * B) / cv.lh }; },
  pieceClient(id) { const p = pieces[id]; return TGT.client(p.px, p.py); },
  slotClient(i) { const [a, b] = toPx(slots[i].c); return TGT.client(a, b); },
  badgeClient(id) { const [a, b] = badgePos(pieces[id]); return TGT.client(a, b); },
  btnClient(id) { const b = btns.find(q => q.id === id); return TGT.client(b.x, b.y); },
  layoutInfo: () => ({ W, H, u, board, tray, land, arr, overlap: pieces.filter(p => p.st === 'tray').some(p => p.px < tray.x || p.px > tray.x + tray.w || p.py < tray.y || p.py > tray.y + tray.h) }),
  get hintsUsed() { return hintsUsed; },
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  if (hint) hint.t += dt;
  if (heroMood.t > 0) heroMood.t -= dt;
  if (winT >= 0) winT += dt;
  if (freeAlive >= 0) { freeAlive += dt; if (freeAlive > 4) freeAlive = -1; }
  for (const p of pieces) {
    if (p.angT !== undefined) { p.ang += (p.angT - p.ang) * Math.min(1, dt * 16); if (Math.abs(p.angT - p.ang) < 0.002) { p.ang = p.angT; } }
    if (p.fsT !== undefined) { p.fs += (p.fsT - p.fs) * Math.min(1, dt * 14); if (Math.abs(p.fsT - p.fs) < 0.01) { p.fs = p.fsT; p.fsT = undefined; } }
    const scT = p.st === 'tray' ? trayK : 1; p.sc = p.sc === undefined ? scT : p.sc + (scT - p.sc) * Math.min(1, dt * 12);
    if (p.wig > 0) p.wig = Math.max(0, p.wig - dt);
    if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 3);
    if (p.anim) { const a = p.anim; a.t += dt / 0.2; const e = Math.min(1, a.t), k = e * e * (3 - 2 * e); p.px = a.fx + (a.tx - a.fx) * k; p.py = a.fy + (a.ty - a.fy) * k; if (e >= 1) p.anim = null; }
  }
  draw();
});
</script>
