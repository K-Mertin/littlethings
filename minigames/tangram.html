  BS: { v: [[0, 0], [2, 0], [2, 2], [0, 2]], set: 'blk' },

const STEPS = { tan: 8, blk: 6 };             // rotations per full turn
function centroid(p) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < p.length; i++) { const [x0, y0] = p[i], [x1, y1] = p[(i + 1) % p.length], c = x0 * y1 - x1 * y0; a += c; cx += (x0 + x1) * c; cy += (y0 + y1) * c; }
  a /= 2; return [cx / (6 * a), cy / (6 * a), Math.abs(a)];
}
const areaOf = p => centroid(p)[2];
for (const k in KINDS) { const K = KINDS[k], [cx, cy, a] = centroid(K.v); K.local = K.v.map(([x, y]) => [x - cx, y - cy]); K.area = a; K.n = STEPS[K.set]; }
// the piece's polygon (centred on 0,0) at rotation r (steps) and flip f
function shapeOf(kind, r, f) {
  const K = KINDS[kind], a = r * Math.PI * 2 / K.n, c = Math.cos(a), s = Math.sin(a);
  return K.local.map(([x, y]) => { if (f) x = -x; return [x * c - y * s, x * s + y * c]; });
}
function sameSet(p, q, eps = 0.02) {
  if (p.length !== q.length) return false;
  return p.every(([x, y]) => q.some(([u, v]) => Math.abs(x - u) < eps && Math.abs(y - v) < eps));
}
// which (rotation, flip) of which kind gives exactly this polygon
function classify(poly, set) {
  const [cx, cy, a] = centroid(poly), loc = poly.map(([x, y]) => [x - cx, y - cy]);
  for (const k in KINDS) {
    const K = KINDS[k]; if (K.set !== set || K.v.length !== poly.length || Math.abs(K.area - a) > 0.03) continue;
    const m = [];
    for (let f = 0; f < 2; f++) for (let r = 0; r < K.n; r++) if (sameSet(shapeOf(k, r, !!f), loc)) m.push([r, !!f]);
    if (m.length) return { kind: k, c: [cx, cy], m };
  }
  return null;
}

  drawHero();

  figs.forEach(g => { if (g.done) { if (g.doneT < 0) { for (const p of pieces) if (p.st === 'placed' && figs[tg[p.slot].g] === g) drawPiece(p); } else drawBoardFig(g, g.doneT, { amp: 0.35, eyeK: backOut(Math.min(1, g.doneT / 0.4)), flash: Math.max(0, 1 - g.doneT * 3) }); } });

  if (freeAlive >= 0) {
    const ls = pieces.filter(p => p.st === 'loose');

    x.save(); x.translate(0, dy);

    const top = ls.slice().sort((a, b2) => bboxOf(screenPts(a)).y0 - bboxOf(screenPts(b2)).y0)[0];
    const re = Math.max(7, u * 0.26), [cx, cy] = [top.px, top.py], blink = (freeAlive % 3) < 0.12;
    for (const sd of [-1, 1]) { const ex = cx + sd * re * 1.25; if (blink) { x.strokeStyle = '#2a2236'; x.lineWidth = 3; x.beginPath(); x.arc(ex, cy, re * 0.8, 0.3, Math.PI - 0.3); x.stroke(); continue; } x.fillStyle = '#fff'; x.strokeStyle = '#2a2236'; x.lineWidth = 2; x.beginPath(); x.ellipse(ex, cy, re, re * 1.1, 0, 0, TAU); x.fill(); x.stroke(); x.fillStyle = '#2a2236'; x.beginPath(); x.arc(ex + Math.sin(freeAlive) * re * 0.3, cy + re * 0.1, re * 0.55, 0, TAU); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(ex - re * 0.2, cy - re * 0.15, re * 0.18, 0, TAU); x.fill(); }

}

  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get u() { return u; }, get theme() { return TH; }, get levels() { return LEVELS.length; },
  start: lv => startLevel(lv), free: s => startFree(s), album: i => startAlbum(i), paint: () => { MG.hide(); startPaint(); }, skip: () => skipWin(),
  // finish the level the honest way: pull the bag, then snap every piece where the solver says it can go
  win() { for (let k = 0; k < 200 && state === 'play'; k++) { if (bag) while (pullBag(true)); const mv = nextMove(); if (!mv || mv.bag) break; TGT.placeOn(mv.p.id, tg.indexOf(mv.T)); } return slots.every(slotDone); },
  slots: () => slots.map(s => ({ kind: s.kind, use: s.use, done: slotDone(s), split: s.split, alts: s.alts.map(a => a.map(i => tg[i].kind)) })),
  targets: () => tg.map(T => ({ kind: T.kind, filled: T.filled, c: T.c, main: T.main, alt: T.alt, free: targetFree(T) })),
  pieces: () => pieces.map(p => ({ id: p.id, kind: p.kind, st: p.st, r: p.r, f: p.f, px: p.px, py: p.py, inBag: !!p.inBag, col: p.colKey })),
  next: () => { const mv = nextMove(); return mv && (mv.bag ? { bag: true } : { id: mv.p.id, t: tg.indexOf(mv.T), rot: rotOK(mv.p, mv.T) ? 0 : 1 }); },
  // put piece id exactly on target ti in the matching turn and let the game snap it (returns true when it snapped)
  placeOn(id, ti) {
    const p = pieces[id], T = tg[ti]; if (p.st === 'placed') return true;
    const m = T.m.find(q => q[1] === p.f) || T.m.find(q => !q[1]) || T.m[0];
    if (L.t !== 'flip' && m[1]) return false;
    p.inBag = false; p.r = m[0]; p.f = m[1]; p.ang = p.r * TAU / KINDS[p.kind].n; p.fs = p.f ? -1 : 1; p.angT = p.fsT = undefined;
    [p.px, p.py] = toPx(T.c); p.px += u * 0.15; p.py -= u * 0.12; p.st = 'loose';
    return trySnap(p, false);
  },
  placePiece(id) { const p = pieces[id]; const ti = tg.findIndex(T => T.kind === p.kind && targetFree(T) && T.ok && okWith(p, T)); return ti >= 0 && TGT.placeOn(id, ti); },
  pull: () => pullBag(), get bagLeft() { return bag ? pieces.filter(p => p.inBag).length : 0; },
  get albumKeys() { return Object.keys(album); }, get bonus() { return bonus && { x: bonus.x, y: bonus.y, got: bonus.got }; },
  crits: () => crits.map(c => ({ k: c.k, x: c.x, y: c.y })), get sun() { return sun && { x: sun.x, y: sun.y }; },
  swatches: () => swatches.map(s => ({ k: s.k, x: s.x, y: s.y })),
  figPoint(gi, i = 0) { const g = figs[gi], q = g.rec.P[i], [a, b] = centroid(q.pts); return [ox + (g.off[0] + a) * u, oy + (g.off[1] + b) * u]; },
  client(px, py) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + px * (rc.width - 2 * B) / cv.lw, y: rc.top + B + py * (rc.height - 2 * B) / cv.lh }; },
  pieceClient(id) { const p = pieces[id]; return TGT.client(p.px, p.py); },
  tgClient(i) { const [a, b] = toPx(tg[i].c); return TGT.client(a, b); },
  slotClient(i) { return TGT.tgClient(slots[i].whole); },
  badgeClient(id) { const [a, b] = badgePos(pieces[id]); return TGT.client(a, b); },
  btnClient(id) { const b = btns.find(q => q.id === id); return TGT.client(b.x, b.y); },
  bagClient() { return bag && TGT.client(bag.x, bag.y); },
  layoutInfo: () => ({ W, H, u, board, tray, land, arr, overlap: pieces.filter(p => p.st === 'tray' && !p.inBag).some(p => p.hx < tray.x || p.hx > tray.x + tray.w || p.hy < tray.y || p.hy > tray.y + tray.h) }),
  get hintsUsed() { return hintsUsed; }, get landed() { return figs.every(g => g.landed); },
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  if (hint) hint.t += dt;
  if (heroMood.t > 0) heroMood.t -= dt;
  if (winT >= 0 && state === 'win') { winT += dt; if (winT >= panelAt && !panelShown) showWinPanel(); }
  if (freeAlive >= 0) { freeAlive += dt; if (freeAlive > 4) freeAlive = -1; }
  for (const g of figs) if (g.done) g.doneT += dt;
  for (const k in albumHop) if (albumHop[k] > 0) albumHop[k] = Math.max(0, albumHop[k] - dt * 1.8);
  for (const g of figs) if (g.rec) for (const q of g.rec.P) if (q.pop > 0) q.pop = Math.max(0, q.pop - dt * 3);
  if (mode !== 'free') stepWorld(dt);
  for (const p of pieces) {
    if (p.angT !== undefined) { p.ang += (p.angT - p.ang) * Math.min(1, dt * 16); if (Math.abs(p.angT - p.ang) < 0.002) { p.ang = p.angT; } }
    if (p.fsT !== undefined) { p.fs += (p.fsT - p.fs) * Math.min(1, dt * 14); if (Math.abs(p.fsT - p.fs) < 0.01) { p.fs = p.fsT; p.fsT = undefined; } }
    const scT = p.st === 'tray' ? trayK : 1; p.sc = p.sc === undefined ? scT : p.sc + (scT - p.sc) * Math.min(1, dt * 12);
    if (p.wig > 0) p.wig = Math.max(0, p.wig - dt);
    if (p.pop > 0) p.pop = Math.max(0, p.pop - dt * 3);
    if (p.anim) { const a = p.anim; a.t += dt / (a.arc ? 0.35 : 0.2); const e = clamp(a.t, 0, 1), k = e * e * (3 - 2 * e); p.px = a.fx + (a.tx - a.fx) * k; p.py = a.fy + (a.ty - a.fy) * k - (a.arc ? Math.sin(e * Math.PI) * u * 1.2 : 0); if (e >= 1) p.anim = null; }
  }
  draw();
});
</script>
