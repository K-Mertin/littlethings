<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗太空船</title>
<link rel="stylesheet" href="mini.css">
<style>
.mg-stage{padding:6px}
.mg-stage canvas{background:#1d1446;border-color:#efeaff}
.mg-over{align-items:flex-start}.mg-card{margin:auto}
.mg-levels.mg-lvgrid{grid-template-columns:repeat(auto-fill,minmax(calc(62px * var(--ui)),1fr))}
.mg-lvgrid .mg-lv{min-height:52px;line-height:1.15;padding:2px 2px;white-space:normal}
.mg-lvgrid .mg-lv small{display:block;font-size:11px;font-weight:700;color:#e0a100;letter-spacing:.04em}
.mg-lvgrid .mg-lv[aria-pressed=true] small{color:#fff}
.sp-stars{font-size:44px;letter-spacing:.12em;margin:2px 0 4px;color:#ffc21a}
.sp-stars i{font-style:normal;color:#d9d2c4}
.sp-new{display:flex;gap:12px;align-items:center;text-align:left;margin:8px 0}

@media (max-width:440px){.mg-bar button{flex-shrink:0}}

</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'space', title: '噗噗太空船', stats: ['level', 'info'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TS = () => MG.textScale, F = (px, w = 900) => `${w} ${Math.round(px * TS())}px system-ui,"Noto Sans TC",${EMO}`;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

// =====================================================================
// levels — ty: what the goal is · n: how many · th: background theme · met: meteor amount
// mag / shield: power-ups show up · grav: gravity planets also float by · move: rings sway · fast: quick comet · rain: star shower
// (append-only: progress is saved by level number)
// =====================================================================
const LEVELS = [
  { ty: 'stars', n: 8, th: 0, met: 0, nm: '星星小路', mk: '⭐' },
  { ty: 'stars', n: 12, th: 0, met: 0.6, nm: '慢慢的隕石', mk: '🪨' },
  { ty: 'rings', n: 6, th: 1, met: 0, nm: '穿過光圈', mk: '⭕' },
  { ty: 'rescue', n: 5, th: 1, met: 0.3, nm: '外星寶寶', mk: '👽' },
  { ty: 'stars', n: 16, th: 2, met: 0.4, mag: 1, nm: '吸吸磁鐵', mk: '🧲' },
  { ty: 'deliver', n: 3, th: 2, met: 0.3, nm: '送包裹到月亮', mk: '📦' },
  { ty: 'rings', n: 8, th: 3, met: 0.6, nm: '光圈和隕石' },
  { ty: 'slalom', len: 2300, th: 3, nm: '隕石帶', mk: '🏁' },
  { ty: 'blast', n: 10, th: 4, hp: 1, met: 0, nm: '泡泡砲', mk: '🫧' },
  { ty: 'gravity', n: 12, th: 4, met: 0, nm: '會吸人的星球', mk: '🪐' },
  { ty: 'stars', n: 18, th: 0, met: 1.3, shield: 1, nm: '防護泡泡', mk: '🛡️' },
  { ty: 'comet', n: 5, th: 1, met: 0, nm: '追彗星', mk: '☄️' },
  { ty: 'rescue', n: 7, th: 2, met: 0.6, drift: 1, nm: '漂來漂去的寶寶' },
  { ty: 'rings', n: 10, th: 3, met: 0.4, move: 1, nm: '會動的光圈' },
  { ty: 'deliver', n: 4, th: 4, met: 0.8, nm: '月亮快遞' },
  { ty: 'blast', n: 14, th: 0, hp: 2, met: 0, nm: '硬硬的石頭' },
  { ty: 'rescue', n: 8, th: 1, met: 0, grav: 1, nm: '星球旁的寶寶' },
  { ty: 'slalom', len: 3000, th: 2, shield: 1, nm: '長長隕石帶' },
  { ty: 'comet', n: 7, th: 3, met: 0.5, fast: 1, nm: '快快彗星' },
  { ty: 'stars', n: 30, th: 4, met: 0.3, mag: 1, rain: 1, nm: '星星下雨了', mk: '🌠' },
  { ty: 'rings', n: 10, th: 0, met: 0, grav: 1, nm: '星球光圈' },
  { ty: 'blast', n: 18, th: 1, hp: 3, met: 0, shield: 1, nm: '大石頭' },
  { ty: 'deliver', n: 5, th: 2, met: 1.3, shield: 1, nm: '穿過隕石送月亮' },
  { ty: 'comet', n: 8, th: 3, met: 0.5, grav: 1, nm: '彗星大冒險', mk: '🏆' },
];
const TY = {
  stars: { ic: '⭐' }, rings: { ic: '⭕' }, rescue: { ic: '👽' }, deliver: { ic: '📦' },
  slalom: { ic: '🏁' }, blast: { ic: '🪨' }, gravity: { ic: '⭐' }, comet: { ic: '☄️' },
};
// one short Chinese panel the first time each new thing shows up
const NEWS = {
  fly: ['🚀', '開火箭囉', '用手指<b>按住畫面拖拖看</b>，火箭就會跟著飛！（電腦用方向鍵）把 ⭐ 星星收集起來吧。'],
  met: ['🪨', '慢慢的隕石', '隕石會慢慢飄下來，<b>躲開</b>它們！撞到也沒關係，只會掉幾顆星星、火箭晃一晃，掉的星星還可以撿回來喔。'],
  rings: ['⭕', '穿過光圈', '從<b>光圈的中間飛過去</b>，就會叮叮響！穿過左上角的數量就過關。'],
  rescue: ['👽', '外星寶寶', '外星寶寶在太空迷路了！<b>飛過去碰碰牠們</b>，就能把牠們接上火箭。'],
  mag: ['🧲', '磁鐵', '撿到磁鐵以後，附近的星星都會<b>自己飛過來</b>！'],
  deliver: ['📦', '送包裹', '火箭載著包裹！看到有小房子的星球，就<b>飛過去碰一下</b>把包裹送到。沒碰到的話等一下還會再來，最後一個要送到月亮上！'],
  slalom: ['🏁', '隕石帶', '前面有一大片隕石，找<b>中間的空隙</b>慢慢鑽過去，飛到彩虹終點線就過關！'],
  blast: ['🫧', '泡泡砲', '火箭會<b>自己發射泡泡</b>！把火箭移到石頭下面，泡泡就會把石頭打碎，變成星星。'],
  gravity: ['🪐', '會吸人的星球', '大星球會把火箭<b>慢慢吸過去</b>！用手指把火箭拉開一點，繞著星球收集星星。'],
  shield: ['🛡️', '防護泡泡', '撿到防護泡泡，火箭外面會有一層泡泡，隕石撞上來會<b>彈開變成星星</b>！'],
  comet: ['☄️', '追彗星', '頑皮的小彗星飛來飛去，<b>追上去碰到它</b>就得到一次！碰到左上角的次數就過關。'],
  rain: ['🌠', '星星下雨了', '好多星星掉下來！開著磁鐵<b>接住越多越好</b>。'],
};
const newsOf = L => [L === LEVELS[0] && 'fly', L.met > 0 && 'met', (L.ty === 'slalom') && 'slalom', ['rings', 'rescue', 'deliver', 'blast', 'gravity', 'comet'].includes(L.ty) && L.ty, (L.grav && 'gravity'), L.mag && 'mag', L.shield && 'shield', L.rain && 'rain'].filter(Boolean).filter((k, i, a) => a.indexOf(k) === i);

// background themes: sky gradient, nebula colours, decor planet colours
const THEMES = [
  { nm: '紫色星雲', sky: ['#160f3a', '#33206a', '#5e3590'], neb: ['#ff7ac8', '#7a6bff', '#45c8ff'], pl: [['#ffd1e8', '#ff8ac2', '#c2558f'], ['#c9f0ff', '#6cc6ff', '#3478c8']] },
  { nm: '深藍銀河', sky: ['#06142f', '#0f3166', '#24558f'], neb: ['#3fd2ff', '#6a7cff', '#9bffea'], pl: [['#ffe9c2', '#ffbf6a', '#d0803a'], ['#e0d6ff', '#a68cff', '#6a50c8']] },
  { nm: '粉紅糖果星雲', sky: ['#2c1440', '#6a2f70', '#c45e92'], neb: ['#ffb3d9', '#ffd27a', '#c39bff'], pl: [['#d6fff2', '#7ae8c8', '#2fae8e'], ['#fff3c2', '#ffd85a', '#d0a020']] },
  { nm: '綠色極光', sky: ['#051a26', '#0d3a4a', '#1a6466'], neb: ['#5affc8', '#3fd2ff', '#b4ff7a'], pl: [['#ffd9d0', '#ff9a86', '#c8584a'], ['#e6f0ff', '#9cb8ff', '#5a72d0']] },
  { nm: '金色日出', sky: ['#24123c', '#6e3458', '#d8845a'], neb: ['#ffd27a', '#ff8a6a', '#ffb3d9'], pl: [['#d2f4ff', '#78d0f0', '#3a90b8'], ['#f2e0ff', '#c69cf0', '#8a5ac0']] },
];
const ALIEN_PAL = ['purple', 'blue', 'pink', 'yellow', 'mint', 'orange'];

// =====================================================================
// layout
// =====================================================================
let W = 400, H = 700, land = false;
const SPR = new Map();
let bgC = null, bgK = '', tiles = null;
cv.onfit = () => { W = cv.lw; H = cv.lh; land = W > H; SPR.clear(); bgK = ''; if (R) { R.x = clamp(R.x, 30, W - 30); R.y = clamp(R.y, 80, H - 50); R.tx = R.x; R.ty = R.y; } };
let R = null;
const RS = () => land ? 1.08 : 1.15;   // rocket drawing scale
MG.fit(cv, (sw, sh) => {
  if (sw > sh * 1.1) { const h = 560; return [Math.round(clamp(h * sw / sh, 760, 1300)), h]; }
  const w = 400; return [w, Math.round(clamp(w * sh / sw, 560, 900))];
});
addEventListener('mg-big', () => { SPR.clear(); });
function spr(key, w, h, fn) {
  const s = cv._mgScale || 1, k = key + '@' + s;
  let c = SPR.get(k);
  if (!c) { c = document.createElement('canvas'); c.width = Math.ceil(w * s); c.height = Math.ceil(h * s); const g = c.getContext('2d'); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round'; fn(g); SPR.set(k, c); }
  return c;
}
const blit = (c, cx, cy, w, h, rot = 0, sc = 1) => { if (!rot && sc === 1) { x.drawImage(c, cx - w / 2, cy - h / 2, w, h); return; } x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc); x.drawImage(c, -w / 2, -h / 2, w, h); x.restore(); };

// =====================================================================
// state
// =====================================================================
let level = 1, LV = LEVELS[0], mode = 'slow', state = 'menu', S = null, t = 0;
let objs = [], shots = [], pops = [], trail = [];
const keys = new Set();
let drag = null;
const best = () => { const b = MG.store.get('space.best', []); return Array.isArray(b) ? b : []; };

function newRocket() { return { x: W / 2, y: H * 0.78, tx: W / 2, ty: H * 0.78, vx: 0, vy: 0, tilt: 0, inv: 0, wob: 0, mood: 0, shield: 0, mag: 0, fire: 0, carry: false }; }
function reset() {
  MG.fx.clear(); objs = []; shots = []; pops = []; trail = [];
  R = newRocket(); drag = null; keys.clear();
  S = { dist: 0, stars: 0, rings: 0, saved: 0, deliv: 0, blasted: 0, comet: 0, hits: 0, next: {}, row: 0, fin: false, finished: false, winT: 0, goT: 1.2, chain: 0, chainT: 0, homeAt: 260, parcelT: 0, deco: Math.random() * 1000, rng: mulberry(level * 7919 + (Date.now() & 0xffff)) };
  R.carry = LV.ty === 'deliver';
  if (LV.ty === 'comet') objs.push({ kind: 'comet', x: W / 2, y: -60, tx: W / 2, ty: H * 0.25, cool: 0, tail: [], sp: 0 });
  hud();
}
const rnd = () => S.rng(), rr = (a, b) => a + rnd() * (b - a);
const speed = () => (62 + level * 2.2 + (LV.ty === 'slalom' ? 14 : 0)) * (mode === 'slow' ? 0.78 : 1);
const goal = () => LV.ty === 'slalom' ? [Math.min(LV.len, Math.floor(S.dist)), LV.len] : [{ stars: S.stars, gravity: S.stars, rings: S.rings, rescue: S.saved, deliver: S.deliv, blast: S.blasted, comet: S.comet }[LV.ty], LV.n];
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('info', `⭐ ${S ? S.stars : 0}`); }
function pop(px, py, text, c = '#fff', life = 1) { pops.push({ x: px, y: py, t: text, c, life, max: life }); }
const SND = {}; const snd = (n, a, gap = 70) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };

// =====================================================================
// spawning (by distance flown, so slow mode just stretches the same level)
// =====================================================================
function every(key, gap, first, fn) { if (S.next[key] == null) S.next[key] = first; if (S.dist >= S.next[key]) { S.next[key] = S.dist + gap * rr(0.8, 1.2); fn(); } }
const count = k => { let n = 0; for (const o of objs) if (o.kind === k && !o.dead) n++; return n; };
function addStar(px, py, o = {}) { objs.push({ kind: 'star', x: px, y: py, r: 13, ph: rnd() * 6, ...o }); }
function starPattern() {
  const m = 40, cx = rr(m + 40, W - m - 40), p = Math.floor(rnd() * 5);
  if (p === 0) for (let i = 0; i < 4; i++) addStar(cx, -30 - i * 42);
  else if (p === 1) for (let i = 0; i < 5; i++) addStar(cx + Math.sin(i * 0.9) * 46, -30 - i * 40);
  else if (p === 2) for (let i = 0; i < 5; i++) { const a = Math.PI + i * Math.PI / 4; addStar(cx + Math.cos(a) * 60, -60 + Math.sin(a) * 50); }
  else if (p === 3) { for (const [dx, dy] of [[0, 0], [-34, -30], [34, -30], [-50, -66], [50, -66], [-20, -86], [20, -86]]) addStar(cx + dx * 0.9, -20 + dy); }
  else { const c2 = clamp(cx, 90, W - 90); for (let i = 0; i < 5; i++) addStar(c2 - 80 + i * 40, -30 - Math.abs(i - 2) * 22); }
}
function addMeteor(px, py, r, o = {}) { objs.push({ kind: 'meteor', x: px, y: py, r, seed: Math.floor(rnd() * 9999), rot: rnd() * 6, vr: rr(-0.8, 0.8), vx: rr(-14, 14), vy: rr(14, 34) * (mode === 'slow' ? 0.7 : 1), face: rnd() < 0.55, ...o }); }
function addPlanet() {
  const side = (S.row++ % 2) ? 1 : -1, r = rr(38, 50), px = W / 2 + side * rr(W * 0.12, W * 0.26), py = -r - 40;
  const p = { kind: 'planet', x: px, y: py, r, seed: Math.floor(rnd() * 9999), col: Math.floor(rnd() * 4), ring: rnd() < 0.5, ph: rnd() * 6 };
  objs.push(p);
  const n = LV.ty === 'gravity' ? 6 : LV.ty === 'rescue' ? 2 : 0;
  for (let i = 0; i < n; i++) {
    const orb = { p, a: i * TAU / n, d: r + (LV.ty === 'rescue' ? 46 : 34 + (i % 2) * 22), w: (side > 0 ? 1 : -1) * 0.7 };
    if (LV.ty === 'rescue') objs.push({ kind: 'alien', x: px, y: py, r: 18, pal: ALIEN_PAL[Math.floor(rnd() * ALIEN_PAL.length)], ph: rnd() * 6, orb });
    else addStar(px, py, { orb });
  }
}
function spawn() {
  const L = LV, ty = L.ty;
  // stars sprinkled almost everywhere (they are the score)
  if (ty === 'stars') every('star', L.rain ? 230 : 170, 40, starPattern);
  else if (ty !== 'gravity') every('star', 300, 120, starPattern);
  if (L.rain) every('rain', 34, 60, () => addStar(rr(24, W - 24), -20, { vy: rr(60, 120), spin: 1 }));
  if (L.mag) every('mag', 820, 160, () => objs.push({ kind: 'power', what: 'mag', x: rr(60, W - 60), y: -30, ph: 0 }));
  if (L.shield) every('shield', 900, 260, () => objs.push({ kind: 'power', what: 'shield', x: rr(60, W - 60), y: -30, ph: 0 }));
  if (L.met > 0) every('met', 300 / L.met * (land ? 0.75 : 1), 220, () => addMeteor(rr(30, W - 30), -50, rr(18, 32)));
  if (ty === 'rings' && count('ring') < 2) every('ring', 230, 90, () => { const rx = 54; objs.push({ kind: 'ring', x: rr(rx + 20, W - rx - 20), y: -30, rx, ox: 0, ph: rnd() * 6, done: 0, pass: 0 }); });
  if (ty === 'rescue' && count('alien') < 3) every('alien', L.grav ? 420 : 260, 120, () => objs.push({ kind: 'alien', x: rr(50, W - 50), y: -40, r: 18, pal: ALIEN_PAL[Math.floor(rnd() * ALIEN_PAL.length)], ph: rnd() * 6, vx: L.drift ? rr(-50, 50) : 0 }));
  if (ty === 'gravity' || L.grav) every('planet', ty === 'gravity' ? 400 : 560, 140, addPlanet);
  if (ty === 'blast' && count('rock') < (land ? 7 : 5)) every('rock', 120, 60, () => { const r = rr(22, 32); objs.push({ kind: 'rock', x: rr(r + 12, W - r - 12), y: -40, r, hp: 1 + Math.floor(rnd() * L.hp), max: L.hp, seed: Math.floor(rnd() * 9999), rot: rnd() * 6, vr: rr(-0.6, 0.6), vx: rr(-10, 10), vy: rr(18, 30) * (mode === 'slow' ? 0.7 : 1), hit: 0 }); });
  if (ty === 'deliver' && R.carry && !objs.some(o => (o.kind === 'home' || o.kind === 'moon') && !o.done) && S.dist >= S.homeAt) {
    const last = S.deliv === L.n - 1;
    objs.push(last ? { kind: 'moon', x: W / 2 + rr(-W * 0.18, W * 0.18), y: -90, r: 66, done: false, ph: 0 } : { kind: 'home', x: rr(70, W - 70), y: -70, r: 38, col: Math.floor(rnd() * 4), done: false, ph: 0, seed: Math.floor(rnd() * 999) });
  }
  if (ty === 'slalom' && S.dist < L.len - 220) every('row', 165, 140, () => {
    const gap = (mode === 'slow' ? 190 : 160) + (land ? 40 : 0), k = S.row++;
    const c = W / 2 + Math.sin(k * 0.55) * (W / 2 - gap / 2 - 24) * 0.85;
    const L0 = c - gap / 2, R0 = c + gap / 2;
    for (let px = 22; px < W; px += 58) { if (px > L0 - 22 && px < R0 + 22) continue; addMeteor(px + rr(-6, 6), -40 + rr(-10, 10), rr(20, 27), { vx: 0, vy: 0, face: rnd() < 0.3 }); }
    if (k % 2 === 0) addStar(c, -40);
  });
  if (ty === 'slalom' && S.dist >= L.len && !S.fin) { S.fin = true; objs.push({ kind: 'finish', y: -30 }); }
}

// =====================================================================
// update
// =====================================================================
function hitRocket(o) {
  if (S.winT) return;
  if (R.shield > 0) {
    o.dead = true; MG.sfx('boing'); snd('sparkle');
    MG.fx.burst(o.x, o.y, { n: 16, colors: ['#bfefff', '#fff', '#ffd23f'], speed: 200, up: 0, grav: 0, size: 4, shape: 'star', life: 0.6 });
    addStar(o.x, o.y, { lost: true, vx: 0, vy: -40, delay: 0.2 });
    pop(o.x, o.y - 30, 'Boing! 🛡️', '#bfefff', 0.8);
    return;
  }
  if (R.inv > 0) return;
  S.hits++; R.inv = 1.6; R.wob = 0.9; S.chain = 0;
  MG.sfx('boing'); MG.sfx('miss');
  const loss = Math.min(S.stars, mode === 'slow' ? 1 : 3);
  S.stars -= loss;   // the dropped stars float nearby and can be caught again
  for (let i = 0; i < loss; i++) { const a = -Math.PI / 2 + (i - (loss - 1) / 2) * 0.9; addStar(R.x, R.y, { lost: true, vx: Math.cos(a) * 150, vy: Math.sin(a) * 150, delay: 0.7 }); }
  pop(R.x, R.y - 60, loss ? `Oops 💦 −${loss}⭐` : MG.WORDS.oops, '#ffb3c7', 1);
  // nudge the rock away so it doesn't sit on the rocket
  const dx = o.x - R.x, dy = o.y - R.y, d = Math.hypot(dx, dy) || 1;
  o.vx = (o.vx || 0) + dx / d * 80; o.y -= 0; o.bump = 0.4;
  hud();
}
function collectStar(o) {
  o.dead = true; S.stars++; S.chain++; S.chainT = 1.2;
  MG.sfx('match', Math.min(8, S.chain)); if (S.chain % 5 === 0) { snd('combo', Math.min(10, S.chain / 2)); pop(o.x, o.y - 24, MG.praise(Math.min(5, S.chain / 5)), '#ffe066', 1); }
  MG.fx.burst(o.x, o.y, { n: 8, colors: ['#ffe066', '#fff6b0', '#ffb300'], speed: 120, up: 20, grav: 60, size: 3.5, shape: 'star', life: 0.5 });
  hud();
}
let lastGood = 0;
function update(dt) {
  t += dt; MG.fx.step(dt);

  const hg = x.createRadialGradient(o.x, o.y, 2, o.x, o.y, r * 2.2); hg.addColorStop(0, 'rgba(220,245,255,.6)'); hg.addColorStop(1, 'rgba(160,220,255,0)'); x.fillStyle = hg; x.beginPath(); x.arc(o.x, o.y, r * 2.2, 0, TAU); x.fill();
  const g = x.createRadialGradient(o.x - 6, o.y - 7, 2, o.x, o.y, r); g.addColorStop(0, '#ffffff'); g.addColorStop(0.6, '#cfefff'); g.addColorStop(1, '#7cc8f5');
  x.fillStyle = g; x.beginPath(); x.arc(o.x + wig, o.y, r, 0, TAU); x.fill(); x.strokeStyle = '#3d8fd0'; x.lineWidth = 2.5; x.stroke();
  const ex = clamp((R.x - o.x) / 200, -1, 1) * 2.5, cx = o.x + wig;
  x.fillStyle = '#1d3f6a';
  if (o.cool > 0) { x.strokeStyle = '#1d3f6a'; x.lineWidth = 2.2; for (const sd of [-1, 1]) { x.beginPath(); x.arc(cx + sd * 6, o.y - 1, 3.4, Math.PI + 0.3, -0.3); x.stroke(); } }
  else for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(cx + sd * 6 + ex, o.y - 2, 2.6, 3.6, 0, 0, TAU); x.fill(); x.fillStyle = '#fff'; x.beginPath(); x.arc(cx + sd * 6 + ex - 0.8, o.y - 3.4, 1.1, 0, TAU); x.fill(); x.fillStyle = '#1d3f6a'; }
  x.fillStyle = '#7a2a3a'; x.beginPath(); x.ellipse(cx, o.y + 6, 3.4, o.cool > 0 ? 3.4 : 2.2, 0, 0, TAU); x.fill();
  x.fillStyle = 'rgba(255,130,170,.5)'; for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(cx + sd * 11, o.y + 4, 3.4, 2, 0, 0, TAU); x.fill(); }
  x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.ellipse(cx - 8, o.y - 10, 4, 2, -0.6, 0, TAU); x.fill();
}
function drawFinish(o) {
  const y = o.y, cols = ['#ff6b7a', '#ffb347', '#ffe066', '#7ee08a', '#6cc6ff', '#b08cff'];
  x.save(); x.globalAlpha = 0.9;
  cols.forEach((c, i) => { x.fillStyle = c; x.fillRect(0, y - 15 + i * 5, W, 5); });
  x.globalAlpha = 1; x.fillStyle = 'rgba(255,255,255,.35)'; x.fillRect(0, y - 15, W, 2);
  x.fillStyle = '#fff'; x.font = `30px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const fx of [W * 0.12, W * 0.88]) x.fillText('🏁', fx, y - 26);
  x.restore();
}
function glow(cx, cy, r) { const g = x.createRadialGradient(cx, cy, r * 0.4, cx, cy, r); g.addColorStop(0, 'rgba(255,245,170,.45)'); g.addColorStop(1, 'rgba(255,240,150,0)'); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); }
function drawObj(o) {
  switch (o.kind) {
    case 'star': {
      const tw = 1 + Math.sin(o.ph * 5) * 0.07, c = starSprite();
      if (o.lost && o.delay) x.globalAlpha = 0.6;
      blit(c, o.x, o.y, 40, 40, o.spin ? o.ph * 2 : Math.sin(o.ph * 2) * 0.15, tw); x.globalAlpha = 1; break;
    }
    case 'meteor': case 'rock': {
      const warm = o.kind === 'rock', c = rockSprite(o.r, o.seed % 40, warm, warm ? true : o.face), w = o.r * 2 + 10;
      const sc = o.hit ? 1.1 : 1;
      blit(c, o.x, o.y, w, w, o.face || warm ? Math.sin(o.rot) * 0.3 : o.rot, sc);
      if (warm && o.max > 1) {   // little dots: how many more bubbles it needs
        for (let i = 0; i < o.hp; i++) { const dx = (i - (o.hp - 1) / 2) * 11; x.fillStyle = '#bfefff'; x.strokeStyle = '#2f78cf'; x.lineWidth = 1.5; x.beginPath(); x.arc(o.x + dx, o.y - o.r - 8, 4, 0, TAU); x.fill(); x.stroke(); }
      }
      break;
    }
    case 'planet': {
      const rg = o.r * 3.4, a = 0.18 + 0.08 * Math.sin(o.ph * 3);
      x.save(); x.strokeStyle = `rgba(255,255,255,${a})`; x.lineWidth = 2; x.setLineDash([3, 10]); x.lineDashOffset = o.ph * 20;
      x.beginPath(); x.arc(o.x, o.y, rg * 0.7, 0, TAU); x.stroke(); x.beginPath(); x.arc(o.x, o.y, rg * 0.45, 0, TAU); x.stroke(); x.restore();
      const c = planetSprite(o), w = Math.round(o.r) * 3.4, h = Math.round(o.r) * 2.6, sq = o.sq ? 1 + Math.sin(o.sq * 30) * 0.04 : 1;
      if (o.sq) o.sq = Math.max(0, o.sq - 1 / 60);
      blit(c, o.x, o.y, w, h, 0, sq); break;
    }
    case 'home': {
      const c = homeSprite(o), w = o.r * 2.6, h = o.r * 3.4;
      blit(c, o.x, o.y - h * 0.12, w, h);
      if (!o.done) {
        const by = o.y - o.r * 2.3 + Math.sin(o.ph * 5) * 5;
        glow(o.x, o.y, o.r + 34 + Math.sin(o.ph * 4) * 4);
        x.fillStyle = '#fff'; x.font = `24px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('📦', o.x, by - 14); x.fillText('👇', o.x, by + 12);
      } else { x.fillStyle = '#fff'; x.font = `22px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('💖', o.x + o.r * 0.6, o.y - o.r * 1.6 - Math.sin(o.ph * 3) * 4); }
      break;
    }
    case 'moon': {
      const r = o.r, c = moonSprite(r);
      blit(c, o.x, o.y - r * 2.9 * 0.08, r * 2.8, r * 2.9);
      if (!o.done) {
        glow(o.x, o.y, r + 36 + Math.sin(o.ph * 4) * 4);
        const by = o.y - r * 1.9 + Math.sin(o.ph * 5) * 5; x.fillStyle = '#fff'; x.font = `26px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('📦', o.x - 16, by); x.fillText('👇', o.x + 16, by);
      }
      break;
    }
    case 'alien': drawAlien(o); break;
    case 'power': drawPower(o); break;
    case 'comet': drawComet(o); break;
    case 'finish': drawFinish(o); break;
  }
}
function drawHUD() {
  const [c, n] = goal(), ic = TY[LV.ty].ic, s = TS();
  const w = Math.round(132 * s), h = Math.round(46 * s), x0 = 10, y0 = 10;
  x.fillStyle = 'rgba(20,10,50,.45)'; x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 2;
  x.beginPath(); x.roundRect(x0, y0, w, h, h / 2); x.fill(); x.stroke();
  x.textAlign = 'left'; x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.font = `${Math.round(22 * s)}px ${EMO}`; x.fillText(ic, x0 + 10 * s, y0 + h * 0.42);
  x.fillStyle = '#fff';
  if (LV.ty === 'slalom') { x.font = F(15); x.fillText(`${Math.round(Math.min(1, c / n) * 100)}%`, x0 + 42 * s, y0 + h * 0.4); }
  else { x.font = F(20); x.fillText(`${Math.min(c, n)}/${n}`, x0 + 42 * s, y0 + h * 0.42); }
  const bw = w - 54 * s, bx = x0 + 42 * s, by = y0 + h - 11 * s;
  x.fillStyle = 'rgba(255,255,255,.25)'; x.beginPath(); x.roundRect(bx, by, bw, 5 * s, 3); x.fill();
  x.fillStyle = '#ffe066'; x.beginPath(); x.roundRect(bx, by, Math.max(5, bw * Math.min(1, c / n)), 5 * s, 3); x.fill();
  // timers for the power-ups
  let px = x0 + w + 8;
  for (const [v, e] of [[R.mag, '🧲'], [R.shield, '🛡️']]) if (v > 0) {
    x.fillStyle = 'rgba(20,10,50,.45)'; x.beginPath(); x.arc(px + 20, y0 + h / 2, 20, 0, TAU); x.fill();
    x.strokeStyle = '#ffe066'; x.lineWidth = 3; x.beginPath(); x.arc(px + 20, y0 + h / 2, 18, -Math.PI / 2, -Math.PI / 2 + TAU * v / 9); x.stroke();
    x.fillStyle = '#fff'; x.font = `18px ${EMO}`; x.textAlign = 'center'; x.fillText(e, px + 20, y0 + h / 2 + 1); x.textAlign = 'left'; px += 46;
  }
}
function draw() {
  drawBG();
  if (!S) return;
  // rocket trail sparkles
  x.save(); x.globalCompositeOperation = 'lighter';
  for (const p of trail) { const k = p.life / 0.5; x.fillStyle = `rgba(255,200,120,${0.22 * k})`; x.beginPath(); x.arc(p.x, p.y, 3 + 7 * k, 0, TAU); x.fill(); }
  x.restore();
  for (const o of objs) if (o.kind === 'ring') drawRingHalf(o, false);
  for (const o of objs) if (o.kind === 'planet' || o.kind === 'home' || o.kind === 'moon') drawObj(o);
  for (const o of objs) if (o.kind === 'finish') drawObj(o);
  for (const o of objs) if (o.kind === 'star' || o.kind === 'power' || o.kind === 'alien') drawObj(o);
  for (const o of objs) if (o.kind === 'meteor' || o.kind === 'rock') drawObj(o);
  for (const o of objs) if (o.kind === 'comet') drawObj(o);
  for (const s of shots) {
    const g = x.createRadialGradient(s.x - 3, s.y - 3, 1, s.x, s.y, s.r); g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.55, 'rgba(150,235,255,.55)'); g.addColorStop(1, 'rgba(255,150,230,.85)');
    x.fillStyle = g; x.beginPath(); x.arc(s.x, s.y, s.r, 0, TAU); x.fill(); x.strokeStyle = '#fff'; x.lineWidth = 2; x.stroke();
    x.fillStyle = '#fff'; x.beginPath(); x.ellipse(s.x - s.r * 0.4, s.y - s.r * 0.4, s.r * 0.3, s.r * 0.18, -0.7, 0, TAU); x.fill();
  }
  if (state === 'play' || state === 'win') drawRocket();
  for (const o of objs) if (o.kind === 'ring') drawRingHalf(o, true);
  MG.fx.draw(x);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const p of pops) { x.globalAlpha = Math.min(1, p.life * 2.5); x.font = F(19); x.lineWidth = 4; x.strokeStyle = 'rgba(30,15,70,.85)'; const px = clamp(p.x, 80, W - 80), py = Math.max(84 * TS(), p.y); x.strokeText(p.t, px, py); x.fillStyle = p.c; x.fillText(p.t, px, py); }
  x.globalAlpha = 1;
  if (state === 'play' && S.goT > 0) { const a = Math.min(1, S.goT * 2); x.globalAlpha = a; x.font = F(40); x.lineWidth = 6; x.strokeStyle = 'rgba(30,15,70,.85)'; const tx = 'Go! 🚀'; x.strokeText(tx, W / 2, H * 0.42); x.fillStyle = '#ffe066'; x.fillText(tx, W / 2, H * 0.42); x.globalAlpha = 1; }
  if (state === 'play' || state === 'win') drawHUD();
}

// =====================================================================
// flow
// =====================================================================
function setLevel(n) { level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; bgK = ''; }
function start(m, lv) {
  if (m) mode = m; if (lv) setLevel(lv);
  reset(); state = 'play'; MG.hide();
  const fresh = newsOf(LV).filter(k => !MG.store.get('space.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('space.seen.' + k, true));
    MG.sfx('sparkle');
    MG.panel({ title: fresh.map(k => NEWS[k][1]).join('＋'), html: fresh.map(k => `<div class="sp-new"><b class="ic">${NEWS[k][0]}</b><p>${NEWS[k][2]}</p></div>`).join(''), buttons: [{ label: '出發！', on: () => { MG.hide(); S.goT = 1.2; } }] });
  }
}
const rating = () => S.hits <= 1 ? 3 : S.hits <= 3 ? 2 : 1;
function win() {
  if (S.winT || state !== 'play') return;
  S.winT = 1.6; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  for (const o of objs) if ((o.kind === 'meteor' || o.kind === 'rock') && o.y > -20 && o.y < H + 20) { o.dead = true; MG.fx.burst(o.x, o.y, { n: 10, colors: ['#ffe066', '#fff', '#c3a2ff'], speed: 160, up: 0, grav: 0, size: 4, shape: 'star', life: 0.6 }); }
  pop(W / 2, H * 0.36, MG.WORDS.clear, '#ffe066', 1.4);
  R.tx = W / 2; R.ty = H * 0.6; drag = null;
}
function showWin() {
  if (state !== 'play') return;
  state = 'win';
  const b = best(), r = rating(), old = b[level - 1] || 0;
  if (r > old) { b[level - 1] = r; MG.store.set('space.best', b); }
  const total = best().reduce((a, v) => a + (v || 0), 0); MG.record('space', total);
  const next = level < LEVELS.length ? LEVELS[level] : null;
  MG.panel({
    title: `第 ${level} 關過關！`,
    html: `<div class="sp-stars">${'★'.repeat(r)}<i>${'★'.repeat(3 - r)}</i></div><p>${TY[LV.ty].ic} ${LV.nm} 完成 ^_^</p><p>收集了 ⭐ ${S.stars} 顆星星${S.hits ? `，撞到 ${S.hits} 次` : '，一次都沒撞到！'}</p>` +
      (r > old && old ? '<p class="new">比上次更棒！</p>' : '') + (next ? `<p>下一關：${TY[next.ty].ic} ${next.nm}</p>` : '<p>你是太空船大英雄！🚀</p>'),
    buttons: [...(next ? [{ label: '下一關', on: () => { MG.store.set('space.pickLevel', level + 1); start(null, level + 1); } }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
  });
}
function lvLabel(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n}. ${TY[L.ty].ic} ${L.nm}　${'★'.repeat(b)}${'☆'.repeat(3 - b)}`; }
function lvShort(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n}${L.mk || TY[L.ty].ic}<small>${'★'.repeat(b)}${'☆'.repeat(3 - b)}</small>`; }
function menu() {
  state = 'menu'; drag = null;
  if (!S) reset();
  MG.choose({
    id: 'space', title: '噗噗太空船', levelsTitle: '選一關',
    html: '<p>噗噗開著小火箭去太空！<b>手指按住畫面拖一拖</b>，火箭就會跟著飛。</p><p>收集 ⭐ 星星、穿過 ⭕ 光圈、接 👽 外星寶寶、送 📦 包裹到月亮、用 🫧 泡泡打石頭、追 ☄️ 彗星……慢慢的隕石要躲開，撞到也只會掉幾顆星星喔！</p>',
    modesTitle: '想怎麼飛？',
    modes: [{ id: 'slow', label: '🐢 慢慢飛', sub: '飛慢一點，撞到只掉 1 顆星' }, { id: 'chal', label: '🚀 快快飛', sub: '飛快一點，撞到掉 3 顆星' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: lvLabel, short: lvShort },
    keys: '手指按住拖動火箭　電腦：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 或滑鼠拖',
    playing: () => state === 'play',
    onPause: () => { drag = null; keys.clear(); },
    restore: () => { drag = null; keys.clear(); },
    start: (m, lv) => start(m, lv),
  });
}
setLevel(Math.min(MG.store.get('space.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => { if (state === 'play' && !MG.panelOpen()) update(dt); else { t += dt; MG.fx.step(dt); if (state === 'menu' && S) S.dist += 30 * dt; } draw(); });

// ---------- hook for automated tests ----------
window.SPACET = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, levels: LEVELS.length,
  get goal() { return goal(); }, get stars() { return S.stars; }, get hits() { return S.hits; }, get type() { return LV.ty; },
  rocket: () => ({ x: R.x, y: R.y, tx: R.tx, ty: R.ty, shield: R.shield, mag: R.mag, carry: R.carry }),
  objs: () => objs.map(o => ({ kind: o.kind, x: o.x, y: o.y, r: o.r, done: o.done, hp: o.hp, what: o.what })),
  layout: () => ({ W, H, land }),
  start: (lv, m = 'slow') => start(m, lv), menu: () => menu(),
  win: () => win(), finish() { win(); S.winT = 0.01; update(0.02); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) { if (state !== 'play') break; update(dt); } },
  setTarget(px, py) { R.tx = px; R.ty = py; },
  // simple autopilot: fly toward whatever helps the goal and away from rocks
  auto(sec, dt = 1 / 30) {
    for (let i = 0, n = Math.round(sec / dt); i < n && state === 'play'; i++) { pilot(); update(dt); }
    return { state, goal: goal(), hits: S.hits };
  },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
};
function pilot() {
  const ty = LV.ty;
  let tgt = null, bd = 1e9;
  const want = o => (o.kind === 'star' && !o.delay && (ty === 'stars' || ty === 'gravity')) || (o.kind === 'alien' && ty === 'rescue') || (o.kind === 'comet') || ((o.kind === 'home' || o.kind === 'moon') && !o.done && R.carry) || (o.kind === 'power');
  for (const o of objs) if (want(o) && o.y > 40 && o.y < H - 20) { const d = Math.hypot(o.x - R.x, o.y - R.y) - (o.kind === 'home' || o.kind === 'moon' ? 200 : 0); if (d < bd) { bd = d; tgt = o; } }
  if (ty === 'rings') { const rg = objs.filter(o => o.kind === 'ring' && !o.pass && o.y < R.y).sort((a, b) => b.y - a.y)[0]; if (rg) { R.tx = rg.x; R.ty = H * 0.7; return; } }
  if (ty === 'blast') { const rk = objs.filter(o => o.kind === 'rock' && o.y > 0 && o.y < R.y - 100).sort((a, b) => b.y - a.y)[0]; if (rk) { R.tx = rk.x; R.ty = H - 60; return; } }
  if (ty === 'slalom') { R.tx = R.x; R.ty = H - 60; const row = objs.filter(o => o.kind === 'meteor' && o.y < R.y && o.y > R.y - 220); if (row.length) { let bx = R.x, bs = -1; for (let px = 30; px < W - 30; px += 10) { const m = Math.min(...row.map(o => Math.abs(o.x - px) - o.r)); if (m > bs) { bs = m; bx = px; } } R.tx = bx; } return; }
  if (tgt) { R.tx = tgt.x; R.ty = tgt.kind === 'home' || tgt.kind === 'moon' ? tgt.y : tgt.y; }
}
