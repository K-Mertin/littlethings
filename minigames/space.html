};
const newsOf = (P, i, L) => [L === LEVELS[0] && i === 0 && 'fly', i === 0 && L.ph && L.ph.length > 2 && 'mission', P.met > 0 && 'met', (P.ty === 'slalom') && 'slalom', ['rings', 'rescue', 'deliver', 'blast', 'gravity', 'comet', 'fuel', 'const', 'land', 'garden', 'end'].includes(P.ty) && P.ty, P.seed && 'seed', (P.grav && 'gravity'), P.mag && 'mag', (P.shield || P.shower) && 'shield', P.rain && 'rain', P.whirl && 'whirl', P.shower && 'shower'].filter(Boolean).filter((k, i, a) => a.indexOf(k) === i);

// background themes: sky gradient, nebula colours, decor planet colours
const THEMES = [
  { nm: '紫色星雲', sky: ['#160f3a', '#33206a', '#5e3590'], neb: ['#ff7ac8', '#7a6bff', '#45c8ff'], pl: [['#ffd1e8', '#ff8ac2', '#c2558f'], ['#c9f0ff', '#6cc6ff', '#3478c8']] },

];

// =====================================================================
// layout
// =====================================================================
let W = 400, H = 700, land = false;
const SPR = new Map();
let bgC = null, bgK = '', tiles = null;
cv.onfit = () => {
  const ow = W, oh = H; W = cv.lw; H = cv.lh; land = W > H; SPR.clear(); bgK = '';
  // keep a laid-out scene (constellation / garden / landing) in proportion when the screen turns
  if (R && S && (ow !== W || oh !== H)) { const kx = W / ow, ky = H / oh; for (const o of objs) if (o.fix) { o.x *= kx; o.y *= ky; if (o.bx != null) o.bx *= kx; } if (S.cons) { S.cons.pts = S.cons.pts.map(([a, b]) => [a * kx, b * ky]); const bx = S.cons.box; S.cons.box = [bx[0] * kx, bx[1] * ky, bx[2] * kx, bx[3] * ky]; } } if (R) { R.x = clamp(R.x, 30, W - 30); R.y = clamp(R.y, 80, H - 50); R.tx = R.x; R.ty = R.y; } };
let R = null;
const RS = () => land ? 1.08 : 1.15;   // rocket drawing scale
MG.fit(cv, (sw, sh) => {

});

function spr(key, w, h, fn) {

  return c;
}
const blit = (c, cx, cy, w, h, rot = 0, sc = 1) => { if (!rot && sc === 1) { x.drawImage(c, cx - w / 2, cy - h / 2, w, h); return; } x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc); x.drawImage(c, -w / 2, -h / 2, w, h); x.restore(); };

// =====================================================================

let level = 1, LV = LEVELS[0], PH = LEVELS[0], mode = 'slow', state = 'menu', S = null, t = 0;

function newRocket() { return { x: W / 2, y: H * 0.78, tx: W / 2, ty: H * 0.78, vx: 0, vy: 0, tilt: 0, inv: 0, wob: 0, mood: 0, shield: 0, mag: 0, fire: 0, carry: false, hold: null, legs: 0, sc: 1, spin: null, fuel: 0 }; }

const rnd = () => S.rng(), rr = (a, b) => a + rnd() * (b - a);

  for (const o of objs) if ((o.kind === 'meteor' || o.kind === 'rock') && o.y > -20 && o.y < H + 20) { o.dead = true; MG.fx.burst(o.x, o.y, { n: 10, colors: ['#ffe066', '#fff', '#c3a2ff'], speed: 160, up: 0, grav: 0, size: 4, shape: 'star', life: 0.6 }); }
  pop(W / 2, H * 0.36, MG.WORDS.clear, '#ffe066', 1.4);
  if (PH.ty !== 'end' && PH.ty !== 'land') { R.tx = W / 2; R.ty = H * 0.6; } drag = null;
  celebrate(R.x, R.y - 40);
}
function showWin() {
  if (state !== 'play') return;
  state = 'win';
  const b = best(), r = rating(), old = b[level - 1] || 0;
  if (r > old) { b[level - 1] = r; MG.store.set('space.best', b); }
  const total = best().reduce((a, v) => a + (v || 0), 0); MG.record('space', total);
  const next = level < LEVELS.length ? LEVELS[level] : null;
  MG.panel({
    title: `第 ${level} 關過關！`,
    html: `<div class="sp-stars">${'★'.repeat(r)}<i>${'★'.repeat(3 - r)}</i></div><p>${lvIc(LV)} ${LV.nm} 完成 ^_^</p><p>收集了 ⭐ ${S.stars} 顆星星${S.hits ? `，撞到 ${S.hits} 次` : '，一次都沒撞到！'}</p>` +
      (r > old && old ? '<p class="new">比上次更棒！</p>' : '') + (next ? `<p>下一關：${lvIc(next)} ${next.nm}</p>` : '<p>你是太空船大英雄！🚀</p>'),
    buttons: [...(next ? [{ label: '下一關', on: () => { MG.store.set('space.pickLevel', level + 1); start(null, level + 1); } }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
  });
}
function lvLabel(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n}. ${lvIc(L)} ${L.nm}　${'★'.repeat(b)}${'☆'.repeat(3 - b)}`; }
function lvShort(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n}${L.mk || TY[L.ty].ic}<small>${'★'.repeat(b)}${'☆'.repeat(3 - b)}</small>`; }
function menu() {
  state = 'menu'; drag = null;
  if (!S) reset();
  MG.choose({
    id: 'space', title: '噗噗太空船', levelsTitle: '選一關',
    html: '<p>噗噗開著小火箭去太空！<b>手指按住畫面拖一拖</b>，火箭就會跟著飛。</p><p>收集 ⭐ 星星、穿過 ⭕ 光圈、接 👽 外星寶寶、送 📦 包裹到月亮、用 🫧 泡泡打石頭、追 ☄️ 彗星，還有 ✨ 星座連連看、🛬 降落星球、🌷 太空花園……任務完成就飛回 🛰️ 太空站！慢慢的隕石要躲開，撞到也只會掉幾顆星星喔！</p>',
    modesTitle: '想怎麼飛？',
    modes: [{ id: 'slow', label: '🐢 慢慢飛', sub: '飛慢一點，撞到只掉 1 顆星' }, { id: 'chal', label: '🚀 快快飛', sub: '飛快一點，撞到掉 3 顆星' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: lvLabel, short: lvShort },
    keys: '手指按住拖動火箭　電腦：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 或滑鼠拖',
    playing: () => state === 'play',
    onPause: () => { drag = null; keys.clear(); },
    restore: () => { drag = null; keys.clear(); },
    start: (m, lv) => start(m, lv),
  });
}
setLevel(Math.min(MG.store.get('space.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => { if (state === 'play' && !MG.panelOpen()) update(dt); else { t += dt; MG.fx.step(dt); if (state === 'menu' && S) S.dist += 30 * dt; } draw(); });

// ---------- hook for automated tests ----------
window.SPACET = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, levels: LEVELS.length,
  get goal() { return goal(); }, get stars() { return S.stars; }, get hits() { return S.hits; }, get type() { return PH.ty; },
  get phase() { return S.pi; }, get phases() { return S.P.map(p => p.ty); }, get cons() { return S.cons && { done: S.cons.done, n: S.cons.pts.length, pts: S.cons.pts }; },
  nextPhase() { S.doneT = null; phaseDone(); }, setHero: h => MG.setHero(h),
  rocket: () => ({ x: R.x, y: R.y, tx: R.tx, ty: R.ty, shield: R.shield, mag: R.mag, carry: R.carry, hold: R.hold, spin: !!R.spin }),
  objs: () => objs.map(o => ({ kind: o.kind, x: o.x, y: o.y, r: o.r, done: o.done, hp: o.hp, what: o.what, st: o.st, f: o.f, k: o.k })),
  layout: () => ({ W, H, land }),
  start: (lv, m = 'slow') => start(m, lv), menu: () => menu(),
  win: () => win(), finish() { win(); S.winT = 0.01; update(0.02); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) { if (state !== 'play') break; update(dt); } },
  setTarget(px, py) { R.tx = px; R.ty = py; },
  aim() { const ox = R.tx, oy = R.ty; pilot(); const r = { x: R.tx, y: R.ty }; R.tx = ox; R.ty = oy; return r; },
  bench(n = 60) { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); draw(); } x.getImageData(0, 0, 1, 1); return (performance.now() - t0) / n; },
  // simple autopilot: fly toward whatever helps the goal and away from rocks
  auto(sec, dt = 1 / 30) {
    for (let i = 0, n = Math.round(sec / dt); i < n && state === 'play'; i++) { pilot(); update(dt); }
    return { state, goal: goal(), hits: S.hits };
  },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
};
function pilot() {
  const ty = PH.ty;
  if (ty === 'const' && S.cons) { const p = S.cons.pts[Math.min(S.cons.done, S.cons.pts.length - 1)]; R.tx = p[0]; R.ty = p[1] + 4; return; }
  if (ty === 'land') { const p = objs.find(o => o.kind === 'pad' && !o.done && o.k === S.pc); if (p) { R.tx = p.x; R.ty = Math.abs(R.x - p.x) < 20 ? H : p.y - 140; } return; }
  if (ty === 'garden') {
    const pots = objs.filter(o => o.kind === 'pot'), want = R.hold === 'seed' ? 0 : R.hold === 'water' ? 1 : -1;
    let tg = want >= 0 ? pots.find(o => o.st === want) : (pots.some(o => o.st === 1) ? objs.find(o => o.kind === 'cloud') : objs.find(o => o.kind === 'seedbox'));
    if (tg) { if (R.tx === tg.x && Math.hypot(R.x - tg.x, R.y - tg.y) < 30) { R.tx = tg.x + 120; R.ty = tg.y + 60; } else { R.tx = tg.x; R.ty = tg.y; } }
    return;
  }
  if (ty === 'end') { const d = objs.find(o => o.kind === 'dest'); if (d) { R.tx = d.x; R.ty = d.y + dockDY(d); } return; }
  if (ty === 'fuel') { const f = objs.filter(o => o.kind === 'fuel' && o.y > 40 && o.y < H - 20).sort((a, b) => Math.hypot(a.x - R.x, a.y - R.y) - Math.hypot(b.x - R.x, b.y - R.y))[0]; if (f) { R.tx = f.x; R.ty = f.y; return; } }
  let tgt = null, bd = 1e9;
  const want = o => (o.kind === 'star' && !o.delay && (ty === 'stars' || ty === 'gravity')) || (o.kind === 'alien' && ty === 'rescue') || (o.kind === 'comet') || ((o.kind === 'home' || o.kind === 'moon') && !o.done && R.carry) || (o.kind === 'power');
  for (const o of objs) if (want(o) && o.y > 40 && o.y < H - 20) { const d = Math.hypot(o.x - R.x, o.y - R.y) - (o.kind === 'home' || o.kind === 'moon' ? 200 : 0); if (d < bd) { bd = d; tgt = o; } }
  if (ty === 'rings') { const rg = objs.filter(o => o.kind === 'ring' && !o.pass && o.y < R.y).sort((a, b) => b.y - a.y)[0]; if (rg) { R.tx = rg.x; R.ty = H * 0.7; return; } }
  if (ty === 'blast') { const rk = objs.filter(o => o.kind === 'rock' && o.y > 0 && o.y < R.y - 100).sort((a, b) => b.y - a.y)[0]; if (rk) { R.tx = rk.x; R.ty = H - 60; return; } }
  if (ty === 'slalom') { R.tx = R.x; R.ty = H - 60; const row = objs.filter(o => o.kind === 'meteor' && o.y < R.y && o.y > R.y - 220); if (row.length) { let bx = R.x, bs = -1; for (let px = 30; px < W - 30; px += 10) { const m = Math.min(...row.map(o => Math.abs(o.x - px) - o.r)); if (m > bs) { bs = m; bx = px; } } R.tx = bx; } return; }
  if (tgt) { R.tx = tgt.x; R.ty = tgt.kind === 'home' || tgt.kind === 'moon' ? tgt.y : tgt.y; }
}
