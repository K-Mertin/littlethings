<!doctype html>

<head>

<title>噗噗去釣魚</title>

<style>
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px;max-height:48vh;overflow:auto;padding:2px}
.dex div{border:2px solid #d8ecf7;border-radius:12px;background:#f4fbff;padding:6px 2px;font-size:12px;color:#4a6a80;line-height:1.3}
.dex div b{display:block;font-size:30px;line-height:1.2;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.dex div.no{background:#eef2f5;color:#aab4bc}
.dex div.no b{filter:brightness(0) opacity(.25)}
.dex small{display:block;color:#ff7a00}
.dex small.bt{color:#3a7bd5;font-size:13px}
.haul{font-size:26px;line-height:1.5;margin:6px 0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.haul span{display:inline-block;margin:0 5px;white-space:nowrap}
.haul sub{font-size:13px;font-family:var(--sans);color:var(--mute);vertical-align:baseline}
</style>
<style>

  html.mg-big .mg-bar button{flex-shrink:0}

}
@media (max-width:380px){html.mg-big .mg-bar{gap:3px;padding-left:3px;padding-right:3px}html.mg-big .mg-bar a.back{font-size:14px;padding:0 6px}html.mg-big .mg-bar .stat{font-size:13px;padding:3px 5px}html.mg-big .mg-barbtn:not(.mg-menu){padding:0 6px!important}}
@media (max-width:440px){.mg-bar button{flex-shrink:0}}
@media (max-width:380px){.mg-bar .bx2{display:none}.mg-bar{gap:4px;padding-left:4px;padding-right:4px}}

<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'fish', title: '噗噗去釣魚', stats: ['score', 'time'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
let W = 720, H = 450, land = true, cssK = 1;
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const SANS = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const ROUND = 60;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, k) => a + (b - a) * k;
// game randomness goes through rnd() so tests can seed it
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
let rnd = Math.random;
const R = (a, b) => a + rnd() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1));
function pickW(list, wf) { let tot = 0; for (const s of list) tot += wf(s); let r = rnd() * tot; for (const s of list) { r -= wf(s); if (r <= 0) return s; } return list[list.length - 1]; }

const BAITS = [
  { id: 'worm', e: '🪱', name: '小蟲' },
  { id: 'bread', e: '🍞', name: '麵包' },
  { id: 'shrimp', e: '🦐', name: '小蝦' },
  { id: 'lure', e: '✨', name: '亮亮假餌' },
];
// d: depth zone (0 surface … 1 deepest), sp: swim speed, w: how common, s: size, bait: favourite baits,
// nib: little nibbles before the real bite, fight: 0 = comes straight up, 1–3 = tug-of-war strength
const SPECIES = [
  { id: 'fish', e: '🐟', name: '小魚', pts: 10, d: [0.02, 0.3], sp: 60, w: 30, s: 26, bait: ['worm', 'bread'], nib: 1, fight: 0, pers: 'school' },
  { id: 'tropical', e: '🐠', name: '熱帶魚', pts: 20, d: [0.08, 0.36], sp: 75, w: 20, s: 26, bait: ['bread'], nib: 1, fight: 0, pers: 'school' },
  { id: 'puffer', e: '🐡', name: '河豚', pts: 30, d: [0.34, 0.56], sp: 40, w: 12, s: 28, bait: ['shrimp'], nib: 2, fight: 0, pers: 'curious' },
  { id: 'crab', e: '🦀', name: '螃蟹', pts: 25, d: [1, 1], sp: 30, w: 10, s: 28, bait: ['worm'], nib: 1, fight: 0, pers: 'calm', floor: true },
  { id: 'octo', e: '🐙', name: '章魚', pts: 40, d: [0.62, 0.84], sp: 32, w: 8, s: 32, bait: ['shrimp'], nib: 2, fight: 1, pers: 'curious' },
  { id: 'squid', e: '🦑', name: '烏賊', pts: 50, d: [0.58, 0.8], sp: 90, w: 6, s: 30, bait: ['shrimp', 'lure'], nib: 2, fight: 1, pers: 'shy' },
  { id: 'turtle', e: '🐢', name: '海龜', pts: 60, d: [0.32, 0.56], sp: 30, w: 5, s: 34, bait: ['worm', 'bread'], nib: 3, fight: 2, pers: 'curious' },
  { id: 'dolphin', e: '🐬', name: '海豚', pts: 80, d: [0.04, 0.3], sp: 140, w: 3, s: 40, bait: ['lure'], nib: 2, fight: 2, pers: 'shy' },
  { id: 'shark', e: '🦈', name: '鯊魚', pts: 100, d: [0.6, 0.82], sp: 110, w: 2, s: 46, bait: ['lure'], nib: 3, fight: 3, pers: 'shy' },
  { id: 'whale', e: '🐳', name: '小鯨魚', pts: 150, d: [0.86, 0.97], sp: 50, w: 1, s: 52, bait: ['shrimp'], nib: 4, fight: 3, pers: 'curious' },
];
const SPI = Object.fromEntries(SPECIES.map(s => [s.id, s]));
const JUNK = [{ e: '👢', name: '舊靴子' }, { e: '🥫', name: '空罐子' }, { e: '🧦', name: '一隻襪子' }];
const TREASURE = { id: 'crown', e: '👑', name: '海底王冠', pts: 200 };
const ALL = [...SPECIES, TREASURE];

let mode = 'timed', state = 'ready', frozen = false, silent = false, simLog = null, frames = 0;
let dex = MG.store.get('fish.dex', {}); if (!dex || typeof dex !== 'object') dex = {};
let baitI = clamp(BAITS.findIndex(b => b.id === MG.store.get('fish.bait', 'worm')), 0, 3);
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
const baitMul = sp => sp.bait.includes(BAITS[baitI].id) ? 3 : 0.4;   // favourite bait: comes more often & bites faster
const WIN = () => mode === 'relax' ? 0.9 : 0.6;

// ---------- sounds: MG blips + a few of our own (cast whoosh, plop, nibble ticks, splashes, reel clicks) ----------
let acx = null;
function aud() {
  if (silent || MG.store.get('muted', false)) return null;
  if (!acx) { try { acx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (acx.state === 'suspended') acx.resume();
  return acx;
}
addEventListener('pointerdown', () => aud(), { once: true, capture: true });
addEventListener('keydown', () => aud(), { once: true, capture: true });
function toneS(f0, f1, dur, type = 'sine', vol = 0.1, delay = 0) {
  const ac = aud(); if (!ac) return;
  const tt = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, tt); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), tt + dur);
  g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(vol, tt + 0.006); g.gain.exponentialRampToValueAtTime(0.0006, tt + dur);
  o.connect(g).connect(ac.destination); o.start(tt); o.stop(tt + dur + 0.03);
}
let nbuf = null;
function noiseS(dur, f0, f1, vol = 0.06, delay = 0) {
  const ac = aud(); if (!ac) return;
  if (!nbuf) { nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const tt = ac.currentTime + delay, src = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = nbuf; bp.type = 'bandpass'; bp.Q.value = 1.1; bp.frequency.setValueAtTime(f0, tt); bp.frequency.exponentialRampToValueAtTime(f1, tt + dur);
  g.gain.setValueAtTime(0.0001, tt); g.gain.exponentialRampToValueAtTime(vol, tt + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.0005, tt + dur);
  src.connect(bp).connect(g).connect(ac.destination); src.start(tt, Math.random() * 0.5); src.stop(tt + dur + 0.03);
}
const SND = {
  cast: () => { noiseS(0.36, 500, 2800, 0.1); toneS(300, 900, 0.3, 'triangle', 0.03); },
  plop: () => { toneS(640, 130, 0.14, 'sine', 0.18); noiseS(0.16, 1800, 400, 0.06, 0.02); },
  tick: () => { toneS(1500, 1200, 0.04, 'triangle', 0.06); toneS(900, 700, 0.05, 'sine', 0.05, 0.03); },
  bite: () => { noiseS(0.34, 2600, 450, 0.16); toneS(360, 110, 0.24, 'sine', 0.16); },
  click: k => toneS(520 + k * 1100, 430 + k * 900, 0.026, 'square', 0.03),
  thrash: () => { noiseS(0.22, 1200 + Math.random() * 800, 380, 0.11); },
  snap: () => { toneS(1500, 90, 0.3, 'sawtooth', 0.07); noiseS(0.16, 3000, 800, 0.07); },
  zing: () => { toneS(1100, 420, 0.28, 'triangle', 0.05); noiseS(0.2, 2400, 1200, 0.03); },
  startle: () => { toneS(700, 1300, 0.09, 'triangle', 0.07); noiseS(0.18, 1500, 600, 0.05, 0.03); },
  late: () => { toneS(520, 210, 0.32, 'triangle', 0.08); noiseS(0.2, 1400, 500, 0.05); },
  reelIn: () => { for (let i = 0; i < 5; i++) toneS(900 + i * 90, 820 + i * 90, 0.025, 'square', 0.025, i * 0.05); },
};
const LAST = {};
function snd(n, a, gap = 60) { if (silent) return; const now = performance.now(); if (now - (LAST[n] || 0) < gap) return; LAST[n] = now; if (SND[n]) SND[n](a); else MG.sfx(n, a); }
const sfx = (n, a) => { if (!silent) MG.sfx(n, a); };

// ---------- layout ----------
let L = {};
function layout() {
  const WY = land ? 140 : 250;
  L = {
    WY, dockX: land ? 112 : 104, puX: land ? 60 : 56, puY: WY - 31, r: land ? 20 : 21, rodL: land ? 66 : 70,
    castMin: land ? 175 : 150, castMax: W - 80, pullMax: land ? 210 : 190, bottom: H - 16, shallow: WY + (land ? 76 : 150),
  };
  weeds = [];
  for (let sx = L.dockX + 26, i = 0; sx < W - 6; sx += land ? 74 : 62, i++) weeds.push({ x: sx + (i * 37 % 23), h: 40 + (i * 53 % 4) * 16, c: i % 2 ? '#3aa86a' : '#2f8f5a' });
}
function bottomY(px) { const k = clamp((px - L.dockX) / (W * (land ? 0.8 : 0.86) - L.dockX), 0, 1); return L.shallow + (L.bottom - L.shallow) * k * k * (3 - 2 * k) + Math.sin(px * 0.045) * 3; }
const surf = px => L.WY + Math.sin(px * 0.03 + t * 1.6) * 2.2 + Math.sin(px * 0.071 - t * 2.3) * 1.1;
const zoneY = d => L.WY + 22 + d * (L.bottom - L.WY - 52);
function xMinFor(y, m) { for (let px = L.dockX; px < W; px += 4) if (bottomY(px) > y + m) return px + 8; return W - 60; }
// the depth bar on the right edge of the lake: drag the 🪝 handle up/down
function barGeo() { const ts = MG.textScale, s = Math.round(clamp(40 * ts / cssK, 34, 58 * ts)); return { s, x0: W - 8 - s, cx: W - 8 - s / 2, top: L.WY + 6, bot: L.bottom - 2 }; }
const BANDS = [{ d: 0.17, e: ['🐟', '🐠', '🐬'] }, { d: 0.45, e: ['🐡', '🐢'] }, { d: 0.71, e: ['🐙', '🦑', '🦈'] }, { d: 0.915, e: ['🐳'] }];
function barHit(p) { const g = barGeo(); return p.x >= g.x0 - 30 / Math.max(cssK, 0.5) && p.x <= W && p.y >= g.top - 16 && p.y <= g.bot + 16; }
function depthRefX() { return hook.st === 'wait' ? hook.x : hook.st === 'fly' ? hook.lx : hook.st === 'aim' && aim ? aimX() : (hook.lx || lerp(L.castMin, L.castMax, 0.6)); }
const floorAt = px => bottomY(px) - 12;
function setDepth(y) {
  if (y < L.WY - 4 && hook.st === 'wait' && !(interested && interested.st === 'bite')) { log('depthReel'); retrieve(); return; }   // pulled all the way up: reel in to cast again
  depthSel = clamp(y, L.WY + 24, L.bottom - 12);
  if (hook.st === 'wait') {
    hook.tgtY = depthSel; hook.paused = false;
    if (hook.snag && depthSel < floorAt(hook.x) - 10) hook.snag = null;
  }
}
function btnS() { const ts = MG.textScale; return Math.round(Math.min(clamp(54 * ts / cssK, 56, (land ? 84 : 80) * ts), (W - 48) / 4 - 6)); }
function baitRects() { const s = btnS(), g = 8, x0 = W - 12 - (4 * s + 3 * g); return BAITS.map((b, i) => ({ x: x0 + i * (s + g), y: 10, w: s, h: s })); }

// ---------- state ----------
let t = 0, playT = 0, left = ROUND, score = 0, quitting = false;
let fishes = [], items = [], spots = [], rings = [], pops = [], caughtNow = [], respawnQ = [], weeds = [], caughtRound = [], newFound = [];
let hook = { st: 'ready' }, bob = { dip: 0, plunge: 0 }, interested = null, fight = null, aim = null;
let quietFish = false, depthSel = 0, rodA = -1.0, rodBend = 0, castSwing = 0, idleT = 0, castsDone = 0, kbAim = 0.45, kbAimShow = 0, reelKey = false, spotT = 1, lastOutcome = '', evLog = [];
const ptrs = new Map();
const log = (s) => { lastOutcome = s; evLog.push(s); if (evLog.length > 200) evLog.shift(); };

function mkFish(sp, x0, base, dir, xmin) {
  return { sp, x: x0, y: sp.floor ? bottomY(x0) - sp.s * 0.32 : base, base, dir, xmin, ph: R(0, 6), st: 'swim', cool: 0, q: 0, poke: 0, fade: 1, lead: null, ox: 0, oy: 0, sz: R(0.92, 1.08), side: 0 };
}
function spawnGroup(initial, sp0) {
  const sp = sp0 || pickW(SPECIES, s => s.w);
  const dir = initial ? (rnd() < 0.5 ? 1 : -1) : -1;
  const base = sp.floor ? 0 : zoneY(R(sp.d[0], sp.d[1]));
  const xmin = sp.floor ? L.dockX + 24 : xMinFor(base, sp.s * 0.45 + 6);
  const x0 = initial ? R(Math.max(xmin, L.dockX + 40), W - 30) : W + 40;
  const lead = mkFish(sp, x0, base, dir, xmin); fishes.push(lead);
  if (sp.pers === 'school') {
    const n = RI(2, 3);
    for (let i = 0; i < n; i++) { const f = mkFish(sp, x0, base, dir, xmin); f.lead = lead; f.ox = 20 + i * 17 + R(0, 8); f.oy = R(-16, 16); f.base = base + f.oy; f.x = x0 - dir * f.ox; f.y = base + f.oy; fishes.push(f); }
  }
  return lead;
}
const popTarget = () => land ? 12 : 13;
function placeItems() {
  items = [];
  for (let i = 0; i < 3; i++) { const ix = R(L.dockX + 150, W - 30); items.push({ k: JUNK[RI(0, 2)], x: ix, rot: R(-0.6, 0.6), treasure: false }); }
  if (rnd() < 0.6) { const ix = R(W * 0.6, W - 40); items.push({ k: TREASURE, x: ix, rot: 0, treasure: true }); }
}
function hangPt() { const [tx, ty] = rodTip(); return [tx + Math.sin(t * 2) * 2, ty + 30]; }
function toReady() { hook = { st: 'ready', x: 0, y: 0, bx: 0, by: 0, lx: 0, tgtY: null, catch: null, snag: null, snagT: 0, wt: 0, it: 0.4, waitT: 0 }; interested = null; fight = null; aim = null; bob.dip = bob.plunge = 0; const [hx, hy] = hangPt(); hook.x = hx; hook.y = hy; }
function scene() {
  depthSel = zoneY(0.3);
  fishes = []; spots = []; rings = []; respawnQ = []; interested = null; fight = null; MG.fx.clear();
  while (fishes.length < popTarget()) spawnGroup(true);
  placeItems(); toReady(); ropeReset();
}
function reset() { score = 0; left = ROUND; playT = 0; quitting = false; pops = []; caughtNow = []; caughtRound = []; newFound = []; castsDone = 0; idleT = 0; scene(); hud(true); }
let hudS = '', hudT = '';
function hud(force) {
  const s = `${score} 分`, tm = mode === 'timed' ? `⏱ ${Math.ceil(left)}` : `🐢 ${mmss(playT)}`;
  if (force || s !== hudS) MG.stat('score', hudS = s); if (force || tm !== hudT) MG.stat('time', hudT = tm);
}
function pop(text, px, py, c = '#fff', life = 1.1, sz = 18) { if (silent) return; pops.push({ t: text, x: px, y: py, c, life, max: life, sz }); }

// ---------- rod + rope ----------
function handPt() { return [L.puX + L.r * 0.92, L.puY + L.r * 0.22]; }
function rodTip() { const [hx, hy] = handPt(), a = rodA + rodBend * 0.75; return [hx + Math.cos(a) * L.rodL, hy + Math.sin(a) * L.rodL]; }
const RN = 16; let rope = [];
function ropeReset() { const [ax, ay] = rodTip(); rope = []; for (let i = 0; i <= RN; i++) rope.push({ x: ax, y: ay + i * 2, px: ax, py: ay + i * 2 }); }
function ropeStep(dt, bx, by, slack) {
  const [ax, ay] = rodTip(), n = RN, seg = Math.max(1, Math.hypot(bx - ax, by - ay) * slack) / n;
  const g = dt * dt;
  for (let i = 1; i < n; i++) {
    const p = rope[i], wet = p.y > surf(p.x) + 1, damp = wet ? 0.88 : 0.985;
    const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp; p.px = p.x; p.py = p.y;
    p.x += vx + (wet ? Math.sin(t * 1.6 + i * 0.6) * 0.22 : Math.sin(t * 1.1 + i * 0.3) * 0.05);
    p.y += vy + (wet ? 60 : 560) * g;
  }
  for (let it = 0; it < 8; it++) {
    rope[0].x = ax; rope[0].y = ay; rope[n].x = bx; rope[n].y = by;
    for (let i = 0; i < n; i++) {
      const a = rope[i], b = rope[i + 1], dx = b.x - a.x, dy = b.y - a.y, dd = Math.hypot(dx, dy) || 1e-6;
      if (dd <= seg) continue;
      const wa = i === 0 ? 0 : 1, wb = i + 1 === n ? 0 : 1, s = wa + wb; if (!s) continue;
      const k = (dd - seg) / dd / s;
      a.x += dx * k * wa; a.y += dy * k * wa; b.x -= dx * k * wb; b.y -= dy * k * wb;
    }
  }
  rope[0].x = ax; rope[0].y = ay; rope[n].x = bx; rope[n].y = by;
}
function ropeEnd() {
  switch (hook.st) {
    case 'ready': case 'aim': case 'show': { const [hx, hy] = hangPt(); return [hx, hy - 8, 1.02]; }
    case 'fly': return [hook.x, hook.y - 8, 1.04];
    case 'wait': return [hook.bx, bobY() - 9, 1.1];
    case 'fight': return [hook.x, hook.y, 1.0 + (1 - fight.ten) * 0.05];
    default: return [hook.x, hook.y - 4, 1.02];
  }
}
const bobY = () => surf(hook.bx) - 3 + bob.dip * 6 + bob.plunge * 20;

// ---------- casting ----------
function pullToX(len) { const k = clamp((len - 16) / (L.pullMax - 16), 0, 1); return L.castMin + k * (L.castMax - L.castMin); }
const aimFrac = () => !aim ? 0 : aim.src === 'kb' ? (aim.charging ? aim.pow : kbAim) : clamp((aim.pull - 16) / (L.pullMax - 16), 0, 1);
const aimX = () => aim.src === 'kb' ? L.castMin + aimFrac() * (L.castMax - L.castMin) : pullToX(aim.pull);
function castTo(lx, ty = null) {
  if (state !== 'play' || (hook.st !== 'ready' && hook.st !== 'aim')) return false;
  lx = clamp(lx, L.castMin, L.castMax);
  const [tx, tyy] = rodTip();
  if (ty != null) depthSel = clamp(ty, L.WY + 24, L.bottom - 12);
  hook.st = 'fly'; hook.fu = 0; hook.lx = lx; hook.tgtY = depthSel; hook.fx0 = tx; hook.fy0 = tyy;
  const d = lx - tx; hook.fdur = 0.42 + d / 1150; hook.arcH = 34 + d * 0.26;
  aim = null; castSwing = 0.28; idleT = 0; castsDone++;
  snd('cast'); sfx('whoosh'); log('cast');
  return lx;
}
function landed() {
  const lx = hook.lx;
  Object.assign(hook, { st: 'wait', tgtY: depthSel, x: lx, y: surf(lx) + 6, bx: lx, wt: 0, it: 0.35, waitT: 0, sinking: true, paused: false, snag: null, snagT: 0, catch: null });
  bob.dip = 1; bob.plunge = 0;
  rings.push({ x: lx, r: 4, life: 0.9, max: 0.9, w: 3 }, { x: lx, r: 1, life: 1.3, max: 1.3, w: 2 });
  if (!silent) MG.fx.burst(lx, surf(lx), { n: 14, colors: ['#fff', '#d6f1ff', '#9fdcff'], speed: 110, up: 120, size: 3.5, life: 0.6, angle: -Math.PI / 2, spread: 2.2 });
  snd('plop');
  const spot = spots.find(s => Math.abs(s.x - lx) < 44);
  if (spot) {

  if (Math.abs(p.x - tk.chest.x) < 34 && Math.abs(p.y - (B.sand - 10)) < 30) { tk.chest.open = 1; tk.chest.bt = 4; for (let i = 0; i < 10; i++) tk.bub.push({ x: tk.chest.x + R(-10, 10), y: B.sand - 14 - i * 5, r: R(2, 5), v: R(40, 70) }); snd('coin'); snd('sparkle'); return; }
  const px = B.l + 46, py = B.b - 34;
  if (Math.hypot(p.x - px, p.y - py) < 40) { tk.puT = 1.2; sfx('boing'); return; }

let tbgC = null, tbgK = '';
function tankScenery() {
  const k = cv._mgScale || 1, key = W + 'x' + H + '@' + k; if (key === tbgK) return; tbgK = key;
  const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k); const g = c.getContext('2d'); g.scale(k, k);
  const B = tankBox();
  // cosy room wall
  const wall = g.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, '#fff3d9'); wall.addColorStop(1, '#ffe2b8'); g.fillStyle = wall; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,190,120,.25)'; for (let i = 0; i < W; i += 36) g.fillRect(i, 0, 14, H);
  // tank water
  g.save(); g.beginPath(); g.roundRect(B.l, B.t, B.r - B.l, B.b - B.t, 18); g.clip();
  const wg = g.createLinearGradient(0, B.t, 0, B.b); wg.addColorStop(0, '#8fe0ff'); wg.addColorStop(0.5, '#4fb3e8'); wg.addColorStop(1, '#2f86c8'); g.fillStyle = wg; g.fillRect(B.l, B.t, B.r - B.l, B.b - B.t);
  g.globalAlpha = 0.14; g.fillStyle = '#fff'; for (let i = 0; i < 6; i++) { const rx = B.l + i * (B.r - B.l) / 5; g.beginPath(); g.moveTo(rx, B.t); g.lineTo(rx + 34, B.t); g.lineTo(rx - 30, B.b); g.lineTo(rx - 70, B.b); g.fill(); }
  g.globalAlpha = 1;
  g.fillStyle = '#f0d898'; g.beginPath(); g.moveTo(B.l, B.b); for (let xx = B.l; xx <= B.r; xx += 10) g.lineTo(xx, B.sand + Math.sin(xx * 0.035) * 5); g.lineTo(B.r, B.b); g.fill();
  for (let i = 0; i < 26; i++) { const px = B.l + 10 + (i * 71) % (B.r - B.l - 20), py = B.sand + 10 + (i * 37) % Math.max(10, B.b - B.sand - 14); g.fillStyle = ['#ffb3c7', '#b8e6ff', '#fff', '#c9f2b0'][i % 4]; g.beginPath(); g.arc(px, py, 3, 0, 7); g.fill(); }
  for (const [rx, rw] of [[B.l + 120, 34], [B.r - 170, 26], [B.l + (B.r - B.l) * 0.5, 22]]) { g.fillStyle = '#8a92a0'; g.beginPath(); g.ellipse(rx, B.sand + 4, rw, rw * 0.7, 0, Math.PI, 0); g.fill(); g.fillStyle = '#a8b0bc'; g.beginPath(); g.ellipse(rx - rw * 0.3, B.sand - rw * 0.25, rw * 0.35, rw * 0.2, 0, 0, 7); g.fill(); }
  g.restore();
  g.strokeStyle = '#3d6f8f'; g.lineWidth = 6; g.beginPath(); g.roundRect(B.l, B.t, B.r - B.l, B.b - B.t, 18); g.stroke();
  g.fillStyle = '#4a7f9f'; g.beginPath(); g.roundRect(B.l - 4, B.t - 8, B.r - B.l + 8, 14, 6); g.fill();

}
function tankDraw() {
  tankScenery(); x.drawImage(tbgC, 0, 0, W, H);
  const B = tk.B;
  x.save(); x.beginPath(); x.roundRect(B.l, B.t, B.r - B.l, B.b - B.t, 18); x.clip();
  // plants
  x.lineCap = 'round';
  const plants = [B.l + 70, B.l + 95, B.l + (B.r - B.l) * 0.38, B.l + (B.r - B.l) * 0.62, B.r - 40, B.r - 60];
  plants.forEach((px, i) => { const h = 60 + (i % 3) * 30; x.strokeStyle = ['#36a865', '#2f8f5a', '#52c27a'][i % 3]; x.lineWidth = 7; x.beginPath(); x.moveTo(px, B.sand + 6); for (let k = 1; k <= 6; k++) x.lineTo(px + Math.sin(t * 1.3 + k * 0.8 + i) * 5 * k / 3, B.sand + 6 - h * k / 6); x.stroke(); });
  // treasure chest (crown on top once you found it)
  const ch = tk.chest, cy = B.sand - 4, lid = ch.open * 0.6;
  x.fillStyle = '#9a5a26'; rr(ch.x - 22, cy - 22, 44, 24, 4); x.fill(); x.fillStyle = '#ffd23f'; x.fillRect(ch.x - 22, cy - 14, 44, 4); x.fillRect(ch.x - 3, cy - 18, 6, 10);
  if (ch.open > 0.05) { x.fillStyle = 'rgba(255,230,120,.8)'; x.beginPath(); x.ellipse(ch.x, cy - 22, 18, 4, 0, 0, 7); x.fill(); }
  x.save(); x.translate(ch.x - 22, cy - 22); x.rotate(-lid); x.fillStyle = '#b8743a'; rr(0, -12, 44, 12, 6); x.fill(); x.fillStyle = '#ffd23f'; x.fillRect(19, -12, 6, 12); x.restore();
  if (dex.crown) emo('👑', 22, ch.x + 34, cy - 10, 1, 0.2);
  for (const b of tk.bub) { x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 1.5; x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.stroke(); }
  // fish
  for (const f of tk.fish) {
    const fl = f.flip > 0 ? Math.cos((1 - f.flip) * Math.PI * 2) : 1, hop = Math.sin(f.hop * Math.PI) * 26;
    const s = f.sz * (1 + f.puff * 0.6), tilt = f.sp.id === 'turtle' ? clamp(f.vy * 0.02, -0.3, 0.3) * -f.dir : 0;
    emo(f.sp.e, s, f.x, f.y - hop, -f.dir * fl, tilt);
  }
  for (const h of tk.hearts) emo(h.e, 18, h.x, h.y, 1, 0, clamp(h.life * 2, 0, 1));
  MG.fx.draw(x);
  x.restore();
  // glass shine
  x.fillStyle = 'rgba(255,255,255,.18)'; x.beginPath(); x.moveTo(B.l + 30, B.t + 10); x.lineTo(B.l + 70, B.t + 10); x.lineTo(B.l + 20, B.b - 10); x.lineTo(B.l + 6, B.b - 40); x.fill();
  // name tag of the tapped fish
  if (tk.label) {
    const f = tk.label.f, s = `${f.sp.name} ×${dex[f.sp.id] || 0}`; x.globalAlpha = clamp(tk.label.life * 3, 0, 1);
    x.font = `900 ${Math.round(17 * MG.textScale)}px ${SANS}`; const w = x.measureText(s).width + 26, lx = clamp(f.x, B.l + w / 2 + 4, B.r - w / 2 - 4), ly = clamp(f.y - f.sz - 24, B.t + 20, B.b - 20);
    const hh = 15 * MG.textScale; x.fillStyle = '#fff'; rr(lx - w / 2, ly - hh, w, hh * 2, hh); x.fill(); x.strokeStyle = '#ff9cc2'; x.lineWidth = 3; x.stroke();
    txt(s, lx, ly + 1, 17, '#cf4a80', null); x.globalAlpha = 1;
  }
  // 噗噗 admiring the tank

  MG.puPu(x, B.l + 46, B.b - 34 - hop, 26, tk.puT > 0 ? 'love' : 'happy', 0, { arms: tk.puT > 0 ? 'up' : true, look: 0.8 });
  // title + chips with counts
  const got = ALL.filter(s => dex[s.id] > 0);
  txt(`噗噗的水族箱　${SPECIES.filter(s => dex[s.id]).length} / ${SPECIES.length}`, W / 2, land ? 22 : 24, land ? 20 : 19, '#7a4a26', '#fff', 900, 5);
  const perRow = land ? Math.max(1, got.length) : 6, cw = clamp((W - 20) / perRow - 6, 48, 62), rows = Math.ceil(got.length / perRow);
  got.forEach((s, i) => {
    const row = Math.floor(i / perRow), inRow = Math.min(perRow, got.length - row * perRow), col = i % perRow;
    const cx = W / 2 - (inRow * (cw + 6) - 6) / 2 + col * (cw + 6), cy = (land ? 44 : 48) + row * 40;
    x.fillStyle = '#fff'; rr(cx, cy, cw, 32, 16); x.fill(); x.strokeStyle = '#ffd39a'; x.lineWidth = 2; x.stroke();
    emo(s.e, 20, cx + cw * 0.28, cy + 16); txt(`×${dex[s.id]}`, cx + cw * 0.68, cy + 17, 13, '#a0622a', null, 800);
  });
  if (!got.length) {
    txt('還沒有魚喔～', W / 2, (B.t + B.sand) / 2 - 16, 24, '#1d5a98', '#fff', 900, 6);
    txt('去釣魚吧！🎣', W / 2, (B.t + B.sand) / 2 + 18, 22, '#1d5a98', '#fff', 900, 6);
  }
  void rows;
}

// ---------- flow ----------
function dexHtml() {
  return `<div class="dex">${ALL.map(s => dex[s.id]
    ? `<div><b>${s.e}</b>${s.name}<small>${s.pts} 分${s.fight ? '・💪' : ''}・釣到 ${dex[s.id]} 次</small>${s.bait ? `<small class="bt">愛吃 ${s.bait.map(b => BAITS.find(q => q.id === b).e).join('')}</small>` : ''}</div>`
    : `<div class="no"><b>${s.e}</b>？？？</div>`).join('')}</div>`;
}
const dexCount = () => ALL.filter(s => dex[s.id]).length;
function showDex(back) { MG.panel({ title: `魚類圖鑑 ${dexCount()}/${ALL.length}`, html: dexHtml() + '<p>釣到過的魚，會告訴你牠最愛吃什麼魚餌喔！</p>', buttons: [{ label: '回去', on: back }] }); }
let endRec = null;
function end() {
  if (state !== 'play') return;
  state = 'over'; quitting = false; rest.show(false); ptrs.clear(); reelKey = false; aim = null;
  if (hook.st !== 'ready') toReady();
  sfx('win'); if (score > 0) sfx('yay');
  endRec = mode === 'timed' ? MG.record('fish', score) : null; log('end'); endPanel();
}
function haulHtml() {
  if (!caughtRound.length) return '<p>這次沒釣到東西，再試一次吧！</p>';
  const m = new Map(); for (const s of caughtRound) m.set(s, (m.get(s) || 0) + 1);
  return `<div class="haul">${[...m].map(([s, n]) => `<span>${s.e}<sub>×${n}</sub></span>`).join('')}</div>`;
}
function endPanel() {
  state = 'over';
  const rec = endRec;
  MG.panel({
    title: '收竿囉！',
    html: `<div class="big">${score} 分</div>` + (rec ? (rec.isNew && score > 0 ? '<p class="new">新紀錄！^_^</p>' : `<p>最高紀錄：${rec.best} 分</p>`) : `<p>釣了 ${mmss(playT)}</p>`) +
      haulHtml() + (newFound.length ? `<p class="new">新發現：${newFound.map(s => s.e + s.name).join('、')}</p>` : '') + `<p>圖鑑收集 ${dexCount()} / ${ALL.length}</p>`,
    buttons: [{ label: '再釣一次', on: () => start() }, { label: '🐠 水族箱', alt: true, on: () => openTank(endPanel) }, { label: '看圖鑑', alt: true, on: () => showDex(endPanel) }, { label: '換模式', alt: true, on: menu }],
  });
}
function start(m) {
  if (m) mode = m; tankBtn.show(false); reset(); state = 'play'; t = t || 0; quitting = false; MG.hide(); rest.show(mode === 'relax');
  ptrs.clear(); reelKey = false; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); log('start:' + mode);
}
const rest = MG.barButton('收竿', () => {
  if (state !== 'play') return;
  quitting = true;
  if (hook.st === 'ready' || hook.st === 'aim' || hook.st === 'fly' || hook.st === 'wait' || hook.st === 'retrieve') end();
});
function menu() {
  state = 'ready'; tankBtn.show(false);
  MG.choose({
    id: 'fish', title: '噗噗去釣魚',
    html: `<p>👆 從噗噗那裡<b>拖一拖、放開</b>就拋竿（拉越長丟越遠），或直接<b>點一下</b>水裡想釣的地方。</p><p>🪝 拖右邊的<b>深度桿</b>上下移動魚鉤：淺水有小魚，深水有章魚、鯊魚，最深有小鯨魚，海底有螃蟹。魚鉤往下沉時點一下可以停住。</p><p>浮標抖一抖是魚在偷咬，<b>整個沉下去</b>時快點一下！大魚會拔河：魚亂扭時放手，休息時按住。換魚餌會吸引不同的魚喔！</p><p>圖鑑 ${dexCount()} / ${ALL.length}　水族箱 ${SPECIES.filter(s => dex[s.id]).length} 種魚</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢釣', sub: '不限時間・線不會斷' }, { id: 'timed', label: '⏱ 60 秒挑戰', sub: '看能釣到幾分' }],
    keys: '（有鍵盤的話也可以：<kbd>空白鍵</kbd> 拋竿／釣起／收線，<kbd>←</kbd><kbd>→</kbd> 瞄準，<kbd>↑</kbd><kbd>↓</kbd> 深度，<kbd>1</kbd>–<kbd>4</kbd> 魚餌）',
    extra: [{ label: '魚類圖鑑', alt: true, on: () => showDex(menu) }, { label: '🐠 水族箱', alt: true, on: () => openTank(menu) }],
    playing: () => state === 'play',
    onPause: () => { ptrs.clear(); reelKey = false; if (hook.st === 'aim') { hook.st = 'ready'; aim = null; } },
    start: m => start(m),
  });
}
function onFit() {
  const r = cv.getBoundingClientRect(); cssK = Math.max(0.1, (r.width - 6) / W); if (L.WY) L.castMax = barGeo().x0 - 14;
  const key = W + 'x' + H;
  if (key !== L.key) { layout(); L.key = key; L.castMax = barGeo().x0 - 14; if (fishes) { const keepFight = false; void keepFight; scene(); } SPR.clear(); }
}

// ---------- headless simulation (for tests): auto-play many casts with one bait ----------
function simRun(o = {}) {
  const keep = { mode, baitI, rnd, state };
  silent = true; frozen = true; mode = o.mode || 'relax'; baitI = Math.max(0, BAITS.findIndex(b => b.id === o.bait)); rnd = mulberry(o.seed || 1);
  state = 'play'; reset();
  const got = {}; simLog = got; let n = 0, steps = 0; const dt = 1 / 30;
  while (n < (o.casts || 100) && steps++ < 3e6) {
    left = 999;
    if (hook.st === 'ready') {
      let cx = R(L.castMin, L.castMax), cy;
      if (o.depth != null) { cy = o.depth >= 1 ? null : zoneY(o.depth); const xm = cy == null ? L.castMin : Math.min(L.castMax, xMinFor(cy, 16)); cx = R(cy == null ? xm : Math.min(L.castMax - 10, xMinFor(cy, 70)), L.castMax); if (cy == null) cy = floorAt(cx); }
      else cy = R(L.WY + 30, floorAt(cx));
      castTo(cx, cy); n++;

    else if (hook.st === 'fight') reelKey = fight.ph === 'rest';
    update(dt);
  }
  reelKey = false; simLog = null; silent = false; rnd = keep.rnd; mode = keep.mode; baitI = keep.baitI; state = keep.state;
  reset(); frozen = false;
  return { got, casts: n, steps };
}

// ---------- hook for automated tests ----------
window.FSH = {
  get state() { return state; }, get mode() { return mode; }, get st() { return hook.st; }, get bait() { return BAITS[baitI].id; },
  get score() { return score; }, get left() { return left; }, get frames() { return frames; }, get outcome() { return lastOutcome; },
  get fight() { return fight && { ph: fight.ph, ten: fight.ten, p: fight.p, lvl: fight.lvl, id: fight.f.sp.id, maxed: fight.maxed, slips: fight.slips }; },
  get interested() { return interested && { id: interested.sp.id, st: interested.st, bt: interested.bt, nk: interested.nk, x: interested.x, y: interested.y }; },
  get hook() { return { st: hook.st, x: hook.x, y: hook.y, lx: hook.lx, bx: hook.bx, tgtY: hook.tgtY, sinking: !!hook.sinking, paused: !!hook.paused, depthSel, snag: !!hook.snag, wt: hook.wt }; },
  get aim() { return aim && { src: aim.src, pull: aim.pull, pow: aim.pow, x: aimX() }; },
  log: () => evLog.slice(), clearLog: () => { evLog.length = 0; }, pops: () => pops.map(p => p.t),
  freeze(v = true) { frozen = v; }, step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) update(dt); },
  stepUntil(fn, max = 20, dt = 1 / 60) { for (let i = 0; i < max / dt; i++) { if (fn()) return true; update(dt); } return !!fn(); },
  seed(n) { rnd = mulberry(n); }, unseed() { rnd = Math.random; },
  set calm(v) { quietFish = !!v; },
  bar: () => barGeo(), zoneY: d => zoneY(d), setDepth: y => setDepth(y),
  dims: () => ({ W, H, land, cssK, WY: L.WY, castMin: L.castMin, castMax: L.castMax, pullMax: L.pullMax, dockX: L.dockX, pu: { x: L.puX, y: L.puY }, tip: rodTip(), btns: baitRects(), bottomAt: [200, 300, 400, 500, 600].map(v => bottomY(v)) }),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  pullToX: len => pullToX(len), castTo: (lx, ty) => castTo(lx, ty), tap: () => hookTap(), setReel(v) { reelKey = !!v; },
  bottomY: px => bottomY(px), surf: px => surf(px), win: () => WIN(), forceFish: id => !!forceFish(id),
  spots: () => spots.map(s => ({ x: s.x, life: s.life })), addSpot(px) { spots.push({ x: px, life: 8, max: 9, ph: 0 }); },
  fishes: () => fishes.map(f => ({ id: f.sp.id, x: f.x, y: f.y, st: f.st, lead: !!f.lead })),
  items: () => items.map(i => ({ e: i.k.e, x: i.x, y: bottomY(i.x) - 8, treasure: i.treasure })),
  sim: o => simRun(o),
  perf(n = 200) { let a = performance.now(); for (let i = 0; i < n; i++) if (state === 'play') update(1 / 60); const u = (performance.now() - a) / n; a = performance.now(); for (let i = 0; i < n; i++) draw(); return { update: u, draw: (performance.now() - a) / n }; },
  tank: () => tk && tk.fish.map(f => ({ id: f.sp.id, x: f.x, y: f.y, flip: f.flip })), tankLabel: () => tk && tk.label && { id: tk.label.f.sp.id, n: dex[tk.label.f.sp.id] },
  dex: () => ({ ...dex }), caught: () => caughtRound.map(s => s.id), newFound: () => newFound.map(s => s.id),
  start: m => start(m), menu: () => menu(), openTank: () => openTank(menu), closeTank: () => closeTank(), end: () => end(),
};

cv.onfit = onFit;
MG.fit(cv, (sw, sh) => {
  land = sw > sh * 1.05;
  // the lake takes the stage's shape: wide phones get a wider lake, tall phones a deeper one, tablets a bigger one
  const asp = (sw - 22) / Math.max(1, sh - 22);
  if (land) { const h0 = asp > 1.9 ? 400 : 450; W = Math.round(clamp(h0 * asp, 720, 1120)); H = Math.round(clamp(W / asp, 400, 540)); }
  else if (420 / asp >= 760) { W = 420; H = Math.round(Math.min(900, 420 / asp)); }
  else { H = 760; W = Math.round(clamp(760 * asp, 420, 800)); }
  return [W, H];
});
reset(); menu();
MG.loop(dt => {
  frames++;
  if (state === 'play') { if (!frozen) update(dt); }
  else if (state === 'tank') { t += dt; if (tk) tankUpdate(dt); }
  else idle(dt);
  if (state === 'tank' && tk) tankDraw(); else draw();
});
</script>
