<!doctype html>
<html lang="zh-Hant">
<head>

}

</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'fire', title: '噗噗消防隊', stats: ['level', 'info'] });
const cv = document.getElementById('cv');
const x = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const F = (px, w = 900) => `${w} ${Math.round(px * MG.textScale)}px ${FONT},${EMO}`;
const FE = px => `${Math.round(px)}px ${EMO}`;

// game state (declared early: the canvas fit runs before the rest of the script)
let S = null, LV = null, level = 1, si = 0, state = 'menu', t = 0, idle = 0, finale = 0;
let pops = [], puffs = [], trans = { on: false, k: 0, dir: 1, fn: null };
const T = {};

// =====================================================================
// sounds: siren, bell, water hiss, "pssh", honk, quack, meow…
// =====================================================================
let AC = null;
const isMuted = () => !!MG.store.get('muted', false);
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
addEventListener('pointerdown', () => actx(), true);
function tn(f0, f1, dur, type = 'sine', vol = 0.1, delay = 0) {
  const a = AC; if (!a || isMuted()) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
let NB = null;
function nz(dur, f0, f1, vol = 0.06, delay = 0, q = 1.2, type = 'bandpass') {
  const a = AC; if (!a || isMuted()) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = NB; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.05, dur * 0.3)); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t0); s.stop(t0 + dur + 0.03);
}
const SND = {
  siren: () => { for (let i = 0; i < 3; i++) { tn(760, 770, 0.3, 'triangle', 0.06, i * 0.6); tn(575, 570, 0.3, 'triangle', 0.06, i * 0.6 + 0.3); } },
  bell: () => { for (let i = 0; i < 9; i++) { tn(1760, 1700, 0.07, 'square', 0.025, i * 0.075); tn(2640, 2600, 0.05, 'sine', 0.03, i * 0.075); } },
  ding: () => { tn(1568, 1568, 0.5, 'sine', 0.09); tn(3136, 3136, 0.3, 'sine', 0.03); },
  hiss: () => nz(0.18, 3000 + Math.random() * 1200, 5200, 0.035, 0, 0.7, 'highpass'),
  pssh: () => { nz(0.6, 5200, 900, 0.09, 0, 0.8); tn(900, 300, 0.25, 'sine', 0.04, 0.05); },
  honk: () => { tn(330, 320, 0.22, 'sawtooth', 0.05); tn(415, 405, 0.22, 'sawtooth', 0.04); },
  splash: () => { nz(0.28, 1800, 500, 0.08, 0, 1); tn(500, 900, 0.1, 'sine', 0.08); },
  gurgle: () => { for (let i = 0; i < 3; i++) tn(180 + Math.random() * 160, 90, 0.1, 'sine', 0.12, i * 0.09); },
  engine: () => { tn(70, 120, 0.5, 'sawtooth', 0.05); tn(90, 150, 0.5, 'square', 0.025, 0.05); },
  brake: () => nz(0.3, 2400, 1600, 0.04, 0, 3),
  quack: () => { tn(620, 420, 0.12, 'sawtooth', 0.045); tn(600, 400, 0.12, 'sawtooth', 0.045, 0.16); },
  meow: () => { tn(700, 1000, 0.15, 'sine', 0.08); tn(1000, 600, 0.25, 'sine', 0.08, 0.15); },
  tweet: () => { for (let i = 0; i < 3; i++) tn(2600, 3600, 0.07, 'sine', 0.06, i * 0.1); },
  beep: () => { tn(1320, 1320, 0.1, 'square', 0.025); tn(990, 990, 0.1, 'square', 0.025, 0.14); },
  clank: () => { tn(1200, 900, 0.08, 'square', 0.05); tn(2400, 2200, 0.12, 'sine', 0.04); },
  squeak: () => tn(1300 + Math.random() * 400, 1900, 0.06, 'sine', 0.05),
  scrub: () => nz(0.1, 2600 + Math.random() * 1500, 4200, 0.045, 0, 1.5),
  slide: () => { nz(0.6, 800, 3000, 0.06, 0, 1); tn(900, 300, 0.6, 'sine', 0.04); },
  motor: () => tn(110, 140, 0.18, 'sawtooth', 0.025),
  creak: () => tn(220 + Math.random() * 60, 260, 0.08, 'triangle', 0.04),
  door: () => { for (let i = 0; i < 6; i++) tn(300, 260, 0.06, 'square', 0.03, i * 0.08); },
  shine: () => { for (let i = 0; i < 4; i++) tn(2000 + Math.random() * 1800, 3000, 0.12, 'sine', 0.03, i * 0.05); },
};
const lastS = {};
function snd(n, gap = 80) { const now = performance.now(); if (now - (lastS[n] || 0) < gap) return; lastS[n] = now; actx(); if (SND[n]) SND[n](); }

// =====================================================================
// layout: the canvas is the whole stage; U = size unit
// =====================================================================
let W = 400, H = 700, U = 1, land = false;
const BG = new Map();
cv.onfit = () => { W = cv.lw; H = cv.lh; land = W > H * 1.05; U = clamp(Math.min(W, H) / 420, 0.72, 2); BG.clear(); if (S && T[S.ty].lay) T[S.ty].lay(S); };
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  return [Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6)), Math.max(300, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6))];
});
addEventListener('mg-big', () => BG.clear());
// static backgrounds are drawn once into an offscreen canvas
function cached(key, fn) {
  let c = BG.get(key);
  if (!c) {
    if (BG.size > 14) BG.clear();
    c = document.createElement('canvas'); const k = cv._mgScale || 1;
    c.width = Math.max(1, Math.round(W * k)); c.height = Math.max(1, Math.round(H * k));
    const g = c.getContext('2d'); g.scale(k, k); fn(g); BG.set(key, c);
  }
  return c;
}
const blit = c => x.drawImage(c, 0, 0, W, H);
let SD = 1;
const srnd = () => (SD = (SD * 16807) % 2147483647) / 2147483647;
const seed = n => { SD = (Math.abs(Math.floor(n)) % 2147483646) + 1; srnd(); srnd(); };
const sshuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(srnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const spick = a => a[Math.floor(srnd() * a.length)];

// =====================================================================
// drawing helpers
// =====================================================================
function fs(g, fill, stroke, lw) { if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function lg(g, x0, y0, x1, y1, cols) { const q = g.createLinearGradient(x0, y0, x1, y1); cols.forEach((c, i) => q.addColorStop(i / (cols.length - 1), c)); return q; }
function rg(g, cx, cy, r0, r1, cols) { const q = g.createRadialGradient(cx, cy, r0, cx, cy, r1); cols.forEach((c, i) => q.addColorStop(i / (cols.length - 1), c)); return q; }
function rrect(g, a, b, w, h, r) { w = Math.max(0.1, w); h = Math.max(0.1, h); const m = q => Math.max(0, Math.min(q, w / 2, h / 2)); g.beginPath(); g.roundRect(a, b, w, h, Array.isArray(r) ? r.map(m) : m(r)); }
function ell(g, cx, cy, rx, ry, rot = 0) { g.beginPath(); g.ellipse(cx, cy, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function circ(g, cx, cy, r) { g.beginPath(); g.arc(cx, cy, Math.max(0.1, r), 0, TAU); }
function star(g, cx, cy, R, r, n = 5) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; g.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } g.closePath(); }
function outText(g, s, px, py, size, fill, stroke = '#fff') {
  g.font = F(size); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = Math.max(3, size * 0.22); g.strokeStyle = stroke; g.strokeText(s, px, py); g.fillStyle = fill; g.fillText(s, px, py);
}
function sparkle(g, sx, sy, r, a = 1) {
  g.save(); g.globalAlpha = a; g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(sx, sy - r); g.quadraticCurveTo(sx, sy, sx + r, sy); g.quadraticCurveTo(sx, sy, sx, sy + r); g.quadraticCurveTo(sx, sy, sx - r, sy); g.quadraticCurveTo(sx, sy, sx, sy - r); g.fill();
  g.restore();
}

// ---------- sky, clouds, hills, trees, town ----------
function cloud(g, cx, cy, s, a = 0.95) {
  g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath();
  for (const [dx, dy, r] of [[-30, 4, 15], [-13, -6, 20], [9, -11, 22], [29, 1, 16], [0, 6, 17]]) { g.moveTo(cx + dx * s + r * s, cy + dy * s); g.arc(cx + dx * s, cy + dy * s, r * s, 0, TAU); }
  g.fill();
  g.fillStyle = 'rgba(150,185,230,.18)'; ell(g, cx + 2 * s, cy + 13 * s, 38 * s, 5 * s); g.fill();
}
function drawSky(g, h, mood = 'day') {
  const C = { day: ['#76c4ff', '#b6e2ff', '#eaf8ff'], night: ['#141e4a', '#2c3c7c', '#545c9c'], dusk: ['#5464c0', '#c88ccc', '#ffc890'] }[mood];
  g.fillStyle = lg(g, 0, 0, 0, h, C); g.fillRect(0, 0, W, h + 2);
  seed(77);
  if (mood !== 'day') for (let i = 0; i < (mood === 'night' ? 60 : 22); i++) { const sx = srnd() * W, sy = srnd() * h * (mood === 'night' ? 0.8 : 0.45); g.fillStyle = `rgba(255,255,225,${0.35 + srnd() * 0.6})`; circ(g, sx, sy, (0.6 + srnd() * 1.3) * U); g.fill(); }
  if (mood === 'night') {
    const mx = W * 0.84, my = Math.min(h * 0.24, 80 * U), mr = 22 * U;
    g.fillStyle = rg(g, mx, my, mr, mr * 3, ['rgba(255,250,200,.35)', 'rgba(255,250,200,0)']); circ(g, mx, my, mr * 3); g.fill();
    g.fillStyle = '#fff6c8'; circ(g, mx, my, mr); g.fill();
    g.fillStyle = 'rgba(210,195,140,.45)'; circ(g, mx - mr * 0.3, my - mr * 0.2, mr * 0.2); g.fill(); circ(g, mx + mr * 0.35, my + mr * 0.3, mr * 0.14); g.fill();
  } else if (mood === 'day') {
    const sx = W * 0.86, sy = Math.min(h * 0.22, 74 * U), sr = 24 * U;
    g.fillStyle = rg(g, sx, sy, sr, sr * 3, ['rgba(255,245,170,.6)', 'rgba(255,245,170,0)']); circ(g, sx, sy, sr * 3); g.fill();
    g.strokeStyle = 'rgba(255,214,90,.6)'; g.lineWidth = 3 * U; g.lineCap = 'round';
    for (let i = 0; i < 10; i++) { const a = i * TAU / 10; g.beginPath(); g.moveTo(sx + Math.cos(a) * sr * 1.3, sy + Math.sin(a) * sr * 1.3); g.lineTo(sx + Math.cos(a) * sr * 1.65, sy + Math.sin(a) * sr * 1.65); g.stroke(); }
    circ(g, sx, sy, sr); fs(g, rg(g, sx - sr * 0.3, sy - sr * 0.3, 2, sr, ['#fff8c0', '#ffd84a']), '#f0a020', 2.5 * U);
  } else {
    const sx = W * 0.2, sy = h * 0.86, sr = 34 * U;
    g.fillStyle = rg(g, sx, sy, sr, sr * 4, ['rgba(255,190,110,.6)', 'rgba(255,190,110,0)']); circ(g, sx, sy, sr * 4); g.fill();
    g.fillStyle = '#ffb45a'; circ(g, sx, sy, sr); g.fill();
  }
  if (mood !== 'night') for (let i = 0; i < 3; i++) cloud(g, W * (0.1 + i * 0.3 + srnd() * 0.12), h * (0.14 + srnd() * 0.3), U * (0.8 + srnd() * 0.5), mood === 'dusk' ? 0.55 : 0.92);
}
function drawHills(g, y, c1, c2, amp, ph) {
  g.fillStyle = lg(g, 0, y - amp, 0, y + amp, [c1, c2]); g.beginPath(); g.moveTo(0, y + amp * 3);
  for (let xx = 0; xx <= W + 24; xx += 24) g.lineTo(xx, y - amp * (0.55 + 0.45 * Math.sin(xx / (W * 0.2 + 60) + ph)));
  g.lineTo(W + 24, y + amp * 3); g.closePath(); g.fill();
}
// round cartoon tree; (tx, ty) = bottom of the trunk, s = scale (≈120·s tall)
function drawTree(g, tx, ty, s, night) {
  g.lineJoin = 'round';
  g.beginPath(); g.moveTo(tx - 8 * s, ty); g.quadraticCurveTo(tx - 5 * s, ty - 30 * s, tx - 6 * s, ty - 62 * s); g.lineTo(tx + 6 * s, ty - 62 * s); g.quadraticCurveTo(tx + 5 * s, ty - 30 * s, tx + 8 * s, ty); g.closePath();
  fs(g, night ? '#6e5236' : '#b07a46', night ? '#3e2c1e' : '#6e4626', 2.4 * s);
  const B = [[0, -84, 32], [-25, -66, 23], [25, -64, 25], [-13, -104, 23], [15, -102, 23]];
  g.strokeStyle = night ? '#24503a' : '#2f7f3a'; g.lineWidth = 5 * s;
  for (const [dx, dy, r] of B) { circ(g, tx + dx * s, ty + dy * s, r * s); g.stroke(); }
  g.fillStyle = night ? lg(g, 0, ty - 128 * s, 0, ty - 40 * s, ['#4f9a6a', '#2f6a48']) : lg(g, 0, ty - 128 * s, 0, ty - 40 * s, ['#9be879', '#48ad4c']);
  for (const [dx, dy, r] of B) { circ(g, tx + dx * s, ty + dy * s, r * s); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.22)'; for (const [dx, dy, r] of [[-18, -108, 8], [-8, -92, 6], [-32, -72, 5]]) { circ(g, tx + dx * s, ty + dy * s, r * s); g.fill(); }
}
const HC = [['#ffe2b8', '#e2604a'], ['#cfe8ff', '#4a86d6'], ['#ffd0de', '#d8508a'], ['#dff2c6', '#58a84e'], ['#fff0b0', '#e89a20'], ['#e8dcff', '#8a6ad8']];
// a little town house; (hx, gy) = bottom-left
function townHouse(g, hx, gy, w, h, v, night) {
  const [wc, rc] = HC[v % HC.length], line = 'rgba(90,60,40,.55)', lw = Math.max(1.2, 2 * U);
  g.lineJoin = 'round';
  const flat = v % 3 === 2, rh = flat ? h * 0.12 : h * 0.38, wy = gy - h + rh;
  rrect(g, hx, wy, w, gy - wy, 3 * U); fs(g, night ? shade(wc, 0.55) : wc, line, lw);
  if (flat) { rrect(g, hx - 3 * U, wy - rh, w + 6 * U, rh, 3 * U); fs(g, night ? shade(rc, 0.55) : rc, line, lw); }
  else { g.beginPath(); g.moveTo(hx - 5 * U, wy + 2 * U); g.lineTo(hx + w / 2, gy - h); g.lineTo(hx + w + 5 * U, wy + 2 * U); g.closePath(); fs(g, night ? shade(rc, 0.55) : rc, line, lw); }
  const ww = w * 0.24, wh = Math.min(ww * 1.1, (gy - wy) * 0.32);
  for (const fx of [0.27, 0.73]) {
    rrect(g, hx + w * fx - ww / 2, wy + (gy - wy) * 0.2, ww, wh, 3 * U); fs(g, night ? '#ffe58a' : '#bfe6ff', '#fff', lw);
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = lw * 0.7; g.beginPath(); g.moveTo(hx + w * fx, wy + (gy - wy) * 0.2); g.lineTo(hx + w * fx, wy + (gy - wy) * 0.2 + wh); g.stroke();
  }
  rrect(g, hx + w * 0.4, gy - (gy - wy) * 0.42, w * 0.2, (gy - wy) * 0.42, [5 * U, 5 * U, 0, 0]); fs(g, night ? '#6a4a30' : '#b07a46', line, lw);
}
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const r = (n >> 16) & 255, gg = (n >> 8) & 255, b = n & 255; return `rgb(${Math.round(r * k)},${Math.round(gg * k)},${Math.round(b * k + (1 - k) * 60)})`; }
// background row of houses and trees above the ground line
function townRow(g, gy, mood, n = 5, sd = 3) {
  const night = mood === 'night';
  drawHills(g, gy - 30 * U, night ? '#3a5e70' : mood === 'dusk' ? '#9a86b8' : '#bfe7c0', night ? '#2d4a5a' : mood === 'dusk' ? '#7a6aa0' : '#a4d9a8', 26 * U, sd);
  seed(sd * 11 + 5);
  const step = W / n;
  for (let i = 0; i < n; i++) {
    const hw = step * (0.5 + srnd() * 0.25), hh = hw * (0.8 + srnd() * 0.5);
    townHouse(g, i * step + srnd() * (step - hw), gy, hw, hh, i + sd, night);
    if (srnd() < 0.7) drawTree(g, (i + 0.96) * step, gy, U * (0.45 + srnd() * 0.25), night);
  }
}
function groundBand(g, y, mood, road = true) {
  const night = mood === 'night';
  // sidewalk
  const sh = 14 * U;
  g.fillStyle = night ? '#8d92a8' : '#e9e4d8'; g.fillRect(0, y, W, sh);
  g.strokeStyle = night ? 'rgba(40,40,70,.3)' : 'rgba(150,135,110,.35)'; g.lineWidth = 1.2 * U;
  for (let xx = 0; xx < W; xx += 34 * U) { g.beginPath(); g.moveTo(xx, y); g.lineTo(xx, y + sh); g.stroke(); }
  g.fillStyle = night ? '#6c7088' : '#c9c1ae'; g.fillRect(0, y + sh, W, 4 * U);
  if (road) {
    g.fillStyle = lg(g, 0, y + sh + 4 * U, 0, H, night ? ['#4a4f63', '#3a3e50'] : ['#7d8496', '#666d80']); g.fillRect(0, y + sh + 4 * U, W, H - y - sh);
    g.strokeStyle = night ? 'rgba(255,240,170,.55)' : 'rgba(255,255,255,.75)'; g.lineWidth = 4 * U; g.setLineDash([22 * U, 18 * U]);
    const my = y + sh + (H - y - sh) * 0.45; g.beginPath(); g.moveTo(0, my); g.lineTo(W, my); g.stroke(); g.setLineDash([]);
  } else {
    g.fillStyle = lg(g, 0, y + sh + 4 * U, 0, H, night ? ['#3f7a52', '#2e5e40'] : ['#a4e07e', '#74c458']); g.fillRect(0, y + sh + 4 * U, W, H - y - sh);
  }
}
function grassTufts(g, y0, y1, n, night) {
  seed(Math.round(y0) + 9);
  for (let i = 0; i < n; i++) {
    const gx = srnd() * W, gy = y0 + srnd() * (y1 - y0);
    g.strokeStyle = night ? 'rgba(20,60,30,.4)' : 'rgba(60,140,50,.45)'; g.lineWidth = 1.6 * U; g.lineCap = 'round';
    g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx - 2 * U, gy - 6 * U); g.moveTo(gx + 3 * U, gy); g.lineTo(gx + 4 * U, gy - 5 * U); g.stroke();
    if (srnd() < 0.2) { g.fillStyle = ['#ff8ab8', '#ffe066', '#fff', '#b49aff'][i % 4]; circ(g, gx + 1.5 * U, gy - 6 * U, 2.6 * U); g.fill(); }
  }
}

// ---------- the fire truck (facing right); (X, Y) = middle of the ground line, s = scale (220 × 120 at s = 1) ----------

  { nm: '消防隊的一天', mk: '🌈', steps: [['alarm'], ['drive', { len: 5, lights: 2, ducks: 1 }], ['hydrant'], ['spray', { sc: 'tower', n: 5, move: true }], ['ladder', { at: 'window', who: ['pink', 'blue'] }], ['drill', { n: 4 }]] },
];
// the first time a new kind of step shows up, a panel explains it once
const NEWS = {
  spray: ['🔥 噴水滅火', '手指<b>按住、拖一拖</b>，水管就會噴水！對準可愛的小火苗噴一噴，它會變成白白的煙「Pssh!」飄走。'],
  alarm: ['🔔 噹噹出動', '警鈴響了！<b>點一下</b>叫醒噗噗，再用手指<b>往下滑</b>，噗噗就會溜下滑桿、跳上消防車！'],
  drive: ['🚒 開消防車', '<b>按住畫面</b>消防車就往前開，放開就停。看到<b>紅燈</b>或小鴨過馬路要停一停，綠燈再走！按 🚨 可以響警笛。'],
  ladder: ['🚒 雲梯救援', '手指<b>拖一拖</b>，雲梯會伸長、轉方向。把籃子移到等待的朋友旁邊，他就會跳進籃子，平安回到地上！'],
  hydrant: ['💧 加滿水', '先把水管<b>拖到消防栓</b>接起來，再用手指在開關上<b>轉圈圈</b>（點一點也可以），消防車的水箱就會裝滿水。'],
  wash: ['🧽 洗馬路', '下過雨，馬路上都是泥巴！按住拖一拖，用水把泥巴<b>沖乾淨</b>，馬路就會亮晶晶。'],
  camp: ['🏕️ 營火安全', '大家烤完棉花糖了！把<b>水桶拖到營火</b>上澆熄它，再把 ⭐ 安全徽章<b>拖給每位小朋友</b>。'],
  boat: ['🚤 湖上救援', '手指按住哪裡，救生艇就開到哪裡！去接湖上的小動物，大家都上船以後，開回<b>碼頭</b>。'],
  drill: ['📋 消防演習', '演習開始！<b>點窗戶裡的朋友</b>，他們會跑到集合點排隊。全部出來以後，<b>點每一位</b>數一數！'],
  move: ['🔥 跳跳火苗', '這次的小火苗很調皮，會<b>跳來跳去</b>換位置，追著它噴水吧！'],
  regrow: ['🔥 會長大的火苗', '沒噴到的小火苗會<b>慢慢變大</b>，要一直噴到它變成白煙喔！'],
  big: ['🔥 大火苗', '大火苗比較大，要<b>噴久一點</b>才會變成白煙。'],
  station: ['🏠 消防局自由玩', '選下面的工具：🧽 抹肥皂、🚿 沖水、✨ 擦亮亮，再擦得亮晶晶！還可以敲 🔔、開 🚨，按 🌧️ 把車子再弄髒。'],
};

// =====================================================================
// flow
// =====================================================================
let ptr = null;
const rest = MG.barButton('完成', () => endFree());
function hud() {
  if (!LV) return;
  if (LV.free) { MG.stat('level', '🏠'); MG.stat('info', ''); return; }
  MG.stat('level', `第 ${level} 關`); MG.stat('info', `${stepIcon(LV.steps[si])} ${si + 1}/${LV.steps.length}`);
}
function beginStep() {
  const [ty, o = {}] = LV.steps[si];
  S = { ty, o, done: 0 }; T[ty].init(S, o); if (T[ty].lay) T[ty].lay(S);
  idle = 0; ptr = null; hud();
}
function intro() {
  if (state !== 'play' || !S) return;
  const o = S.o || {}, keys = [S.ty, ...['move', 'regrow', 'big'].filter(k => S.ty === 'spray' && o[k])].filter(k => NEWS[k] && !MG.store.get('fire.seen.' + k, false));
  if (!keys.length) return;
  keys.forEach(k => MG.store.set('fire.seen.' + k, true));
  MG.panel({ title: keys.map(k => NEWS[k][0]).join('＋'), html: keys.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
}
function stepDone(word) {
  if (!S || S.done) return; S.done = 1e-6; ptr = null;
  if (word) pop(W / 2, H * 0.3, word, '#ff7a00', 1.4, 30);
  MG.sfx('clear'); hud();
}
function curtain(fn) { trans = { on: true, k: 0, dir: 1, fn }; MG.sfx('whoosh'); }
function startLevel(n) {
  level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; si = 0; state = 'play'; MG.hide(); rest.show(false);
  pops = []; puffs = []; MG.fx.clear(); finale = 0; trans = { on: false, k: 0, dir: 1, fn: null };
  beginStep(); intro();
}
function startFree() {
  level = 0; LV = { nm: '消防局自由玩', free: true, steps: [['station']] }; si = 0; state = 'play'; MG.hide(); rest.show(true);
  pops = []; puffs = []; MG.fx.clear(); finale = 0; trans = { on: false, k: 0, dir: 1, fn: null };
  beginStep(); intro();
}
function endFree() {
  if (state !== 'play' || !LV || !LV.free) return;
  state = 'over'; rest.show(false); MG.sfx('win');
  const shiny = S && S.bl && S.bl.every(b => b.shine >= 1);
  MG.panel({ title: shiny ? '消防車亮晶晶！' : '休息一下！', html: `<div class="fr-stars">${shiny ? '✨🚒✨' : '🚒'}</div><p>${shiny ? '噗噗的消防車洗得好乾淨，隨時可以出動 ^_^' : '下次再來幫消防車洗澎澎吧 ^_^'}</p>`, buttons: [{ label: '再玩一次', on: startFree }, { label: '選關卡', alt: true, on: menu }] });
}
function win() {
  if (state !== 'play' || LV.free) return;
  state = 'over'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const done = new Set(MG.store.get('fire.done', [])); done.add(level); MG.store.set('fire.done', [...done]); MG.record('fire', done.size);
  const nx = level < LEVELS.length ? LEVELS[level] : null;
  MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<div class="fr-stars">🌟🌟🌟</div><p>${LV.mk} ${LV.nm}：大家都平安，謝謝噗噗消防隊 ^_^</p><div class="fr-box"><p>已經完成 <b>${done.size}</b> / ${LEVELS.length} 關</p>${nx ? `<p>下一關：${nx.mk} ${nx.nm}</p>` : '<p>你是最棒的消防隊長！🏅</p>'}</div>`,
    buttons: [...(nx ? [{ label: '下一關', on: () => { MG.store.set('fire.pickLevel', level + 1); startLevel(level + 1); } }] : []), { label: '再玩一次', alt: !!nx, on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'menu'; rest.show(false);
  const done = new Set(MG.store.get('fire.done', []));
  MG.choose({
    id: 'fire', title: '噗噗消防隊',
    html: `<p>噹噹噹！警鈴響了，噗噗消防隊出動！溜下滑桿、開消防車（紅燈要停一停），用水管把可愛的小火苗噴成白煙「Pssh!」，再用雲梯救樹上的小貓、屋頂的小鳥和窗戶邊的朋友。</p><p>還有 💧 加水、🧽 洗馬路、🏕️ 營火安全、🚤 湖上救援、📋 消防演習！不計時、不會失敗，最後大家都會開心歡呼 ^_^</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${LEVELS[n - 1].mk} ${LEVELS[n - 1].nm}${done.has(n) ? ' ✓' : ''}`, short: n => `${n}${LEVELS[n - 1].mk}${done.has(n) ? '<small>✓</small>' : ''}` },
    extra: [{ label: '🏠 消防局自由玩', alt: true, on: startFree }],
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
function update(dt) {
  t += dt; idle += dt;
  if (S) T[S.ty].update(S, dt);
  if (trans.on) {
    trans.k += dt / 0.36 * trans.dir;
    if (trans.dir > 0 && trans.k >= 1) { trans.k = 1; trans.dir = -1; const f = trans.fn; trans.fn = null; if (f) f(); }
    else if (trans.dir < 0 && trans.k <= 0) { trans = { on: false, k: 0, dir: 1, fn: null }; intro(); }
  }
  if (S && S.done && !trans.on && !finale && !LV.free) {
    S.done += dt;
    if (S.done > 1.3) {
      if (si < LV.steps.length - 1) curtain(() => { si++; beginStep(); });
      else { finale = 1e-6; MG.sfx('yay'); }
    }
  }
  if (finale) {
    finale += dt;
    if (Math.random() < dt * 6) MG.fx.burst(MG.rand(W * 0.15, W * 0.85), MG.rand(H * 0.15, H * 0.4), { n: 18, colors: ['#ffd23f', '#ff8ac2', '#8fd0ff', '#8fe39a', '#ff6a5a'], shape: Math.random() < 0.5 ? 'star' : 'sq', speed: 260 * U, up: 120 * U, size: 6 * U, life: 1 });
    if (finale > 2.2 && state === 'play') win();
  }
  for (const p of pops) { p.y -= 34 * U * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  for (const p of puffs) { p.y -= 40 * U * dt; p.x += p.vx * dt; p.life -= dt; } puffs = puffs.filter(p => p.life > 0);
  MG.fx.step(dt);
}
function iris(k) {
  const R = Math.hypot(W, H) * 0.62 * (1 - ease(k));
  x.save(); x.beginPath(); x.rect(0, 0, W, H); x.arc(W / 2, H / 2, Math.max(0.1, R), 0, TAU, true);
  x.fillStyle = '#e8352b'; x.fill('evenodd');
  if (R < 90 * U) { x.globalAlpha = 1 - R / (90 * U); helmet(x, W / 2, H / 2 + 60 * U, 70 * U); x.globalAlpha = 1; }
  x.restore();
}
function draw() {
  if (!S) return;
  T[S.ty].draw(S);
  drawPuffs(); MG.fx.draw(x); drawPops();
  if (state === 'play' && !S.done && !trans.on && idle > 3.5 && !MG.panelOpen() && T[S.ty].hint) { const h = T[S.ty].hint(S); if (h) drawHand(h.x, h.y, h.x2, h.y2); }
  drawChips();
  if (finale) outText(x, 'Hooray! 🎉', W / 2, H * 0.28, 40 * U * (1 + Math.sin(t * 6) * 0.05), '#ff5a3c');
  if (trans.on) iris(trans.k);
}

// ---------- input ----------
const canPlay = () => state === 'play' && S && !MG.panelOpen() && !trans.on && !S.done;
cv.addEventListener('pointerdown', e => {
  if (!canPlay() || ptr !== null) return;
  ptr = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch {}
  idle = 0; actx(); const h = T[S.ty]; if (h.down) h.down(S, cv.logical(e));
});
cv.addEventListener('pointermove', e => { if (e.pointerId !== ptr || !S) return; const h = T[S.ty]; if (h.move && canPlay()) h.move(S, cv.logical(e)); });
const upH = e => { if (e.pointerId !== ptr) return; ptr = null; if (!S) return; idle = 0; const h = T[S.ty]; if (h.up) h.up(S, cv.logical(e)); };
cv.addEventListener('pointerup', upH); cv.addEventListener('pointercancel', upH);
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowUp') && S && S.ty === 'drive' && canPlay()) { e.preventDefault(); idle = 0; T.drive.key(S, true); } });
addEventListener('keyup', e => { if ((e.key === ' ' || e.key === 'ArrowRight' || e.key === 'ArrowUp') && S && S.ty === 'drive') T.drive.key(S, false); });

// behind the start menu: the first level's little house
LV = LEVELS[0]; si = 0; beginStep();
menu();
MG.loop(dt => { if (state === 'play' && !MG.panelOpen()) update(dt); else { t += dt; MG.fx.step(dt); } draw(); });

// ---------- hook for automated tests ----------
window.FIRE = {
  get S() { return S; }, get state() { return state; }, get level() { return level; }, get si() { return si; }, get ty() { return S && S.ty; }, get ph() { return S && S.ph; },
  get done() { return !!(S && S.done); }, get trans() { return trans.on; }, get finale() { return finale; }, levels: LEVELS.length, LEVELS,
  start: n => startLevel(n), free: () => startFree(), menu: () => menu(), win: () => win(), hide: () => MG.hide(), endFree: () => endFree(),
  solve() { if (S && T[S.ty].solve) T[S.ty].solve(S); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play' && !MG.panelOpen()) update(dt); },
  client(lx, ly) { const r = cv.getBoundingClientRect(), B = 3; return { x: r.left + B + lx * (r.width - 2 * B) / cv.lw, y: r.top + B + ly * (r.height - 2 * B) / cv.lh }; },
  targets() { return S && T[S.ty].targets ? T[S.ty].targets(S).map(p => this.client(p.x, p.y)) : []; },
  go() { return S && S.goB ? this.client(S.goB.x, S.goB.y) : null; },
  tool(id) { const b = S && S.tb && S.tb.find(q => q.id === id); return b ? this.client(b.x, b.y) : null; },
};
</script>
</body>
