<script>
'use strict';
MG.init({ id: 'kitchen', title: '噗噗小廚房', stats: ['day', 'coins'] });
const cv = document.getElementById('cv');
let x = cv.getContext('2d');
let W = 640, H = 400, land = true;
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const ease = k => 1 - Math.pow(1 - clamp(k, 0, 1), 3);

// ---------- layout ----------
// The canvas takes the stage's shape (landscape 640–1200 wide, portrait 360 wide). Everything is placed in
// proportion so the stall fills the screen: customers at the counter on top, the stoves in the middle,
// the toppings table + plate at the bottom.
let Lo;
function layout() {
  const m = 10, gap = 12;
  if (land) {
    const counterY = Math.round(clamp(H * 0.34, 132, 236)), floorY = counterY + Math.round(clamp(H * 0.055, 20, 32));
    const hr = clamp(H * 0.066, 25, 40);
    const bz = Math.round(clamp(H * 0.21, 84, 136)), sy0 = floorY + 28, sy1 = H - bz - 12, sh = sy1 - sy0;
    const chefW = Math.round(clamp(W * 0.11, 70, 130)), avail = W - 2 * m - chefW - 2 * gap;
    const w0 = avail * 0.36, w1 = avail * 0.37, w2 = avail * 0.27;
    const s0 = { x: m, y: sy0, w: w0, h: sh }, pr = Math.min(w0 / 4.6, sh * 0.36);
    const grill = { x: m + w0 + gap, y: sy0 + sh * 0.08, w: w1, h: sh * 0.92 };
    const oven = { x: grill.x + w1 + gap, y: sy0 + sh * 0.02, w: w2, h: sh * 0.98 };
    const trashW = Math.round(clamp(W * 0.095, 66, 108)), trayW = Math.round(clamp(W * 0.2, 134, 232));
    const trash = { x: W - m - trashW, y: H - bz - 2, w: trashW, h: bz - 6 };
    const tray = { x: trash.x - gap - trayW, y: H - bz - 2, w: trayW, h: bz - 6 };
    const tw = (tray.x - gap - m - 5 * 8) / 6;
    Lo = {
      counterY, floorY, hr, bs: clamp(hr / 26, 1, 1.45), seatHW: W * 0.13,
      seats: [0.2, 0.5, 0.8].map(f => ({ x: W * f, y: counterY - hr * 1.42 })),
      s0, pots: [0.26, 0.72].map(f => ({ x: m + w0 * f, y: sy0 + sh * 0.5, r: pr })), grill, oven,
      chef: { x: W - m - chefW / 2, y: sy0 + sh * 0.6, r: Math.min(chefW * 0.33, sh * 0.26) },
      tops: { x: m, y: H - bz + 2, w: tw, h: bz - 12, gap: 8, cols: 6 }, tray, trash,
      table: H - bz - 10, bench: sy1 - 2,
    };
  } else if (H >= 620) {
    const counterY = Math.round(clamp(H * 0.2, 140, 196)), floorY = counterY + 22, hr = clamp(H * 0.037, 25, 30);
    const e = H - (floorY + 112 + 364);
    const ga = 72 + e * 0.22, gb = 104 + e * 0.34, th = 50 + e * 0.12, gd = 88 + e * 0.2;
    let y = floorY + 28;
    const grill = { x: 12, y, w: 336, h: ga }; y += ga + 34;
    const s0 = { x: 12, y, w: 206, h: gb }, pr = Math.min(206 / 4.6, gb * 0.36), oven = { x: 230, y, w: 118, h: gb }; y += gb + 18;
    const tops = { x: 12, y, w: (336 - 16) / 3, h: th, gap: 8, cols: 3 }; y += 2 * th + 8 + 14;
    const tray = { x: 12, y, w: 160, h: gd }, trash = { x: 274, y, w: 74, h: gd };
    Lo = {
      counterY, floorY, hr, bs: 0.95, seatHW: 56, seats: [62, 180, 298].map(sx => ({ x: sx, y: counterY - hr * 1.42 })),
      s0, pots: [0.27, 0.73].map(f => ({ x: 12 + 206 * f, y: s0.y + gb * 0.5, r: pr })), grill, oven,
      chef: { x: 223, y: y + gd * 0.56, r: Math.min(30, gd * 0.3) }, tops, tray, trash,
      table: tops.y - 10, bench: s0.y + gb - 2,
    };
  } else {
    const counterY = Math.round(clamp(H * 0.27, 128, 150)), floorY = counterY + 20, hr = 24;
    const av = H - floorY - 28 - 24 - 12 - 8, ra = av * 0.4, rb = av * 0.37, rc = av * 0.23;
    let y = floorY + 28;
    const s0 = { x: 8, y, w: 152, h: ra }, pr = Math.min(152 / 4.6, ra * 0.36), grill = { x: 168, y: y + ra * 0.06, w: 184, h: ra * 0.94 }; y += ra + 24;
    const oven = { x: 8, y, w: 110, h: rb }, tray = { x: 126, y, w: 134, h: rb }, trash = { x: 268, y, w: 84, h: rb }; y += rb + 12;
    const tops = { x: 8, y, w: (344 - 30) / 6, h: rc, gap: 6, cols: 6 };
    Lo = {
      counterY, floorY, hr, bs: 0.9, seatHW: 54, seats: [62, 180, 298].map(sx => ({ x: sx, y: counterY - hr * 1.42 })),
      s0, pots: [0.27, 0.73].map(f => ({ x: 8 + 152 * f, y: s0.y + ra * 0.5, r: pr })), grill, oven,
      chef: null, tops, tray, trash, table: oven.y - 8, bench: s0.y + ra - 2,
    };
  }
  const sb = (r, dx = 16, dy = 16) => ({ x: r.x + dx, y: r.y + r.h - dy, r: 14 });
  Lo.swap = [sb(Lo.s0, 16, 14), sb(Lo.grill, 16, 14), sb(Lo.oven, 16, 14)];
}
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  land = asp > 1.05;
  if (land) { W = Math.round(Math.min(1200, Math.max(640, 400 * asp))); H = Math.round(Math.min(620, Math.max(400, W / asp))); }
  else { W = 360; H = Math.round(Math.min(860, Math.max(476, W / asp))); }
  layout(); return [W, H];
});
addEventListener('mg-big', () => { bgK = ''; });
const TS = () => MG.textScale;
// font that grows in 大字模式 but still fits maxW
function fitFont(txt, px, maxW, w = 700, fam = FONT) {
  let sz = Math.round(px * TS()); x.font = `${w} ${sz}px ${fam}`;
  while (sz > px * 0.7 && x.measureText(txt).width > maxW) { sz--; x.font = `${w} ${sz}px ${fam}`; }
  return sz;
}

const ST = {

  skewer: { slot: 1, dish: 'skewer', n: 3 }, wok: { slot: 1, dish: 'rice', n: 2, stir: 2 }, dumpling: { slot: 1, dish: 'dumpling', n: 3, batch: 1 },
  cookie: { slot: 2, dish: 'cookie', n: 1 }, juice: { slot: 2, dish: 'juice', n: 1, blend: 1 }, candy: { slot: 2, dish: 'candy', n: 1, spin: 1 },

const SLOT_TYPES = [['noodle', 'pancake'], ['skewer', 'wok', 'dumpling'], ['cookie', 'juice', 'candy']];
const TOPS = [
  { id: 'egg', name: '蛋', dish: 'noodle' }, { id: 'onion', name: '蔥花', dish: 'noodle' },
  { id: 'sauce', name: '烤肉醬', dish: 'skewer' }, { id: 'sesame', name: '芝麻', dish: 'skewer' },
  { id: 'choco', name: '巧克力豆', dish: 'cookie' }, { id: 'sprinkle', name: '彩色糖', dish: 'cookie' },
  { id: 'honey', name: '蜂蜜', dish: 'pancake' }, { id: 'cream', name: '鮮奶油', dish: 'pancake' },
  { id: 'shrimp', name: '蝦仁', dish: 'rice' }, { id: 'soy', name: '醬油', dish: 'dumpling' }, { id: 'chili', name: '辣椒', dish: 'dumpling' },
  { id: 'strawb', name: '草莓', dish: 'juice', blend: 1 }, { id: 'banana', name: '香蕉', dish: 'juice', blend: 1 },
  { id: 'box', name: '便當盒', dish: null, box: 1 },
  { id: 'heartc', name: '愛心糖', dish: 'candy' }, { id: 'starc', name: '星星糖', dish: 'candy' },
];
const TOP = Object.fromEntries(TOPS.map(tp => [tp.id, tp]));
const TOP_BG = { egg: '#fff3c4', onion: '#dff5d6', sauce: '#ffd9c8', sesame: '#fff1d6', choco: '#f1dcc8', sprinkle: '#e8e2ff', honey: '#ffe9b0', cream: '#fff6ea', shrimp: '#ffe0d4', soy: '#f3dccb', chili: '#ffd6d0', strawb: '#ffd6e0', banana: '#fff4b8', box: '#ffd9d4', heartc: '#ffd8e8', starc: '#fff2b0' };
const OLD6 = ['egg', 'onion', 'sauce', 'sesame', 'choco', 'sprinkle'];
const topsOf = st => st.flatMap(s => DISH[ST[s].dish].tops);
// days 1–5 are the original ones (kept exactly); 6–14 bring new stations and special customers (first season, unchanged).
// 15–36: the night market + new ways to play (append-only: never renumber, saved stars keep their meaning).
// sp: special customers spread over the day; rush: a burst of customers (⏰ 挑戰 only); feat: new things explained once

const DAYS = [

  { mk: '🔥', dishes: ['noodle', 'skewer', 'cookie'], tops: OLD6, n: 11, patience: 26, gap: 4.2, intro: '週末大排長龍！客人比較急，動作要快 ^_^' },
  { mk: '🥞', st: ['pancake', 'skewer', 'cookie'], dishes: ['pancake', 'skewer', 'cookie'], tops: ['honey', 'cream', 'sauce', 'sesame', 'choco', 'sprinkle'], n: 8, patience: 34, gap: 5.6, feat: ['pancake'], intro: '鍋子換成平底鍋，今天賣鬆餅！出現 🔄 的時候記得翻面喔。' },
  { mk: '🍳', st: ['noodle', 'wok', 'cookie'], dishes: ['noodle', 'rice', 'cookie'], tops: ['egg', 'onion', 'shrimp', 'choco', 'sprinkle'], n: 8, patience: 34, gap: 5.6, feat: ['wok'], intro: '烤架換成炒鍋，今天賣炒飯！出現 🥄 就點一下翻炒。' },
  { mk: '🥳', dishes: ['noodle', 'skewer', 'cookie'], tops: OLD6, n: 8, patience: 32, gap: 5.4, sp: ['party', 'party'], feat: ['party'], intro: '今天有人過生日！戴派對帽的客人要一次三份喔。' },
  { mk: '🥟', st: ['noodle', 'dumpling', 'cookie'], dishes: ['noodle', 'dumpling', 'cookie'], tops: ['egg', 'onion', 'soy', 'chili', 'choco', 'sprinkle'], n: 9, patience: 32, gap: 5.2, feat: ['dumpling'], intro: '新廚具：蒸籠！點一下三籠水餃一起蒸。' },
  { mk: '🥤', st: ['noodle', 'dumpling', 'juice'], dishes: ['noodle', 'dumpling', 'juice'], tops: ['egg', 'onion', 'soy', 'chili', 'strawb', 'banana'], n: 9, patience: 32, gap: 5.2, feat: ['juice'], intro: '烤箱換成果汁機！先放水果，再點果汁機打果汁。' },
  { mk: '🙅', st: ['pancake', 'wok', 'juice'], dishes: ['pancake', 'rice', 'juice'], tops: ['honey', 'cream', 'shrimp', 'strawb', 'banana'], n: 10, patience: 32, gap: 5, sp: ['picky', 'picky', 'picky'], feat: ['picky'], intro: '有挑食的小朋友來吃炒飯，他不要青豆喔！' },

  x.save(); x.translate(bx - 2, by); x.rotate(-open * 0.6); rr(0, -9, bw + 4, 10, 5, vgrad(-9, 1, '#a8f0b8', '#5cc67a'), '#2e7a44', 2); rr(bw / 2 - 6, -14, 16, 6, 3, '#5cc67a', '#2e7a44', 1.5); x.restore();
  x.fillStyle = '#fff'; fitFont('倒掉', 11, bw - 8); x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 3; x.strokeStyle = '#2e7a44'; x.strokeText('倒掉', cx, by + bh * 0.74); x.fillText('倒掉', cx, by + bh * 0.74);
}
function drawChef() {
  const C0 = Lo.chef; if (!C0) return;
  const jump = state === 'celeb' ? Math.abs(Math.sin(t * 8)) * -C0.r * 0.4 : 0, r = C0.r;
  MG.puPu(x, C0.x, C0.y + jump, r, chefMood, Math.sin(t * 3) * 0.03, { arms: chefMood === 'wow' ? 'up' : false, hideHorns: true });
  const C = { x: C0.x, y: C0.y + jump + r * MG.hatDrop * 1.25 }, k = r / 24;
  x.save(); x.translate(C.x, C.y); x.scale(k, k);
  x.fillStyle = '#fff'; x.strokeStyle = '#c9cfd6'; x.lineWidth = 1.5;
  x.beginPath(); x.roundRect(-14, -36, 28, 12, 3); x.fill(); x.stroke();
  for (const [a, b, rr0] of [[-10, -42, 9], [0, -48, 11], [10, -42, 9]]) { x.beginPath(); x.arc(a, b, rr0, 0, 7); x.fill(); x.stroke(); }
  x.fillStyle = '#fff'; x.fillRect(-13, -38, 26, 6); gloss(-6, -48, 3, 2, 0.8);

function drawHud() {
  const CY = Lo.counterY, FY = Lo.floorY, my = (CY + 4 + FY) / 2, bh = FY - CY - 8;

  if (cfg.q && !freeMode) {
    const q = Math.max(0, cfg.n - spawned), show = Math.min(q, land ? 5 : 3);
    for (let k = show - 1; k >= 0; k--) drawAnimal(KINDS[(k * 3 + spawned) % KINDS.length], lx + 10 + k * 15, my + 1, bh * 0.42, 'wait');
    if (q) { lx += 18 + show * 15; x.font = `900 ${Math.round(11 * TS())}px ${FONT}`; x.textAlign = 'left'; x.textBaseline = 'middle'; x.lineWidth = 3; x.strokeStyle = '#7a3a12'; x.strokeText(`排隊 ${q}`, lx, my + 1); x.fillStyle = '#fff'; x.fillText(`排隊 ${q}`, lx, my + 1); }
  }
  // patience hearts under each customer (⏱ 挑戰)
  if (timed()) for (let i = 0; i < 3; i++) { const c = seats[i]; if (c && c.st === 'wait') drawHearts(Lo.seats[i].x + (land ? Lo.hr * 1.75 : 0), CY - (land ? 14 : 11), Math.max(0, c.pat / c.max)); }

  if (freeMode) {
    const s = `招待了 ${served} 位`; x.font = `800 ${Math.round(12 * TS())}px ${FONT}`; x.textAlign = 'right'; x.textBaseline = 'middle'; x.lineWidth = 3; x.strokeStyle = '#7a3a12'; x.strokeText(s, W - 12, my + 1); x.fillStyle = '#fff'; x.fillText(s, W - 12, my + 1);
  } else if (cfg.n <= (land ? 16 : 9)) {
    const dr = Math.min(5, bh * 0.32), gp = dr * 2.6, x1 = W - 14 - dr;
    for (let k = 0; k < cfg.n; k++) { const dx = x1 - (cfg.n - 1 - k) * gp, done = k < served, miss = k >= served && k < served + missed; circ(dx, my + 1, dr, done ? '#5cd67a' : miss ? '#c8b8a8' : 'rgba(255,255,255,.85)', done ? '#2e8a44' : '#8a5a2a', 1.2); if (done) { x.strokeStyle = '#fff'; x.lineWidth = 1.4; x.beginPath(); x.moveTo(dx - dr * 0.45, my + 1); x.lineTo(dx - dr * 0.1, my + 1 + dr * 0.4); x.lineTo(dx + dr * 0.5, my + 1 - dr * 0.4); x.stroke(); } }
  } else {
    const s = `${served + missed} / ${cfg.n}`; x.font = `800 ${Math.round(12 * TS())}px ${FONT}`; x.textAlign = 'right'; x.textBaseline = 'middle'; x.lineWidth = 3; x.strokeStyle = '#7a3a12'; x.strokeText(s, W - 12, my + 1); x.fillStyle = '#fff'; x.fillText(s, W - 12, my + 1);
  }
  // combo flame
  if (cfg.q && combo >= 2 && t - lastServe < 12) {
    const f = 1 - (t - lastServe) / 12, cx = W / 2, cy = FY + 13, sc = 1 + comboT * 0.15;
    x.save(); x.translate(cx, cy); x.scale(sc, sc);
    const s = MG.WORDS.combo(combo); x.font = `900 ${Math.round(12 * TS())}px ${FONT}`; const w = x.measureText(s).width + 20;
    rr(-w / 2, -10, w, 20, 10, vgrad(-10, 10, '#ffb04a', '#ff6a2a'), '#fff', 2); rr(-w / 2 + 4, 6, (w - 8) * f, 2.5, 1.2, 'rgba(255,255,255,.8)');
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(s, 0, -1);
    x.restore();

}
function draw() {

    const c = seats[i]; if (!c || !c.say || (c.st === 'wait' && !c.shake)) continue;
    const s = Lo.seats[i]; x.font = `900 ${Math.round(14 * TS())}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = MG.big ? 5 : 4; x.strokeStyle = '#fff';
    const sy = s.y - Lo.hr * 1.5 - 10; x.strokeText(c.say, s.x, sy); x.fillStyle = c.st === 'sad' || c.shake ? '#d0443a' : '#2e9a4c'; x.fillText(c.say, s.x, sy);

function drawCeleb() {
  const k = ease(celebT / 0.6), bw = Math.min(W * 0.6, 260), bh = 54, by = lerp(-bh - 10, Lo.counterY * 0.42, k), bx = W / 2 - bw / 2;
  x.strokeStyle = '#8a5a2a'; x.lineWidth = 2; x.beginPath(); x.moveTo(bx + 24, 0); x.lineTo(bx + 24, by); x.moveTo(bx + bw - 24, 0); x.lineTo(bx + bw - 24, by); x.stroke();
  x.save(); x.translate(W / 2, by + bh / 2); x.rotate(Math.sin(celebT * 5) * 0.03 * (1 - Math.min(1, celebT / 1.5)));
  x.fillStyle = 'rgba(80,40,10,.25)'; x.beginPath(); x.roundRect(-bw / 2 + 3, -bh / 2 + 4, bw, bh, 14); x.fill();
  rr(-bw / 2, -bh / 2, bw, bh, 14, vgrad(-bh / 2, bh / 2, '#fff2c8', '#ffd27a'), '#b8642e', 3);
  x.font = `900 ${Math.round(24 * TS())}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#c2462a'; x.fillText(cfg.night ? 'Sold out! 🎆' : 'Sold out! 🎉', 0, 1);
  x.restore();
}
function celebStep(dt) {
  celebT += dt;
  if (cfg.night) { if (Math.random() < dt * 4) { const fx = MG.rand(W * 0.1, W * 0.9), fy = MG.rand(Lo.counterY * 0.15, Lo.counterY * 0.6); MG.fx.burst(fx, fy, { n: 26, colors: MG.pick([['#ffd23f', '#fff'], ['#ff6b8a', '#ffd0dc'], ['#8fd0ff', '#fff'], ['#9be38a', '#fff6a0']]), speed: 170, up: 0, grav: 90, size: 3, shape: 'star', life: 1.1 }); juice('pop'); } }
  else if (Math.random() < dt * 14) MG.fx.burst(MG.rand(0, W), -6, { n: 3, colors: ['#ff6b5e', '#ffd23f', '#8fd0ff', '#8fe0a0', '#ff9ccf'], speed: 50, up: -40, grav: 120, size: 5, shape: 'sq', life: 2.2 });
  if (celebT >= 2) { state = 'over'; showResult(); }
}

// ---------- flow ----------
const starsTxt = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const dayTitle = d => `第 ${d + 1} 天${DAYS[d].nm ? `・${DAYS[d].mk} ${DAYS[d].nm}` : ''}`;
function endDay() {
  if (state !== 'play') return;
  const ratio = served / cfg.n, stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
  const all = MG.store.get('kitchen.stars', []); all[day] = Math.max(all[day] || 0, stars); MG.store.set('kitchen.stars', all);
  const rec = MG.record('kitchen.coins.' + day, coins);
  const total = all.reduce((a, b) => a + (b || 0), 0); MG.record('kitchen', total);
  res = { stars, rec };
  if (stars) { state = 'celeb'; celebT = 0; chefMood = 'wow'; chefT = 2.5; MG.sfx('win'); }
  else { state = 'over'; MG.sfx('over'); showResult(); }
}
function showResult() {
  const { stars, rec } = res, next = day + 1 < DAYS.length;
  MG.panel({
    title: stars ? `第 ${day + 1} 天打烊囉！` : '今天有點手忙腳亂…',
    html: `<div class="big stars">${starsTxt(stars)}</div><p>招待了 ${served} 位客人，賺了 🪙 ${coins}</p>` +
      (rec.isNew && coins > 0 ? `<p class="new">這一天的新紀錄！^_^</p>` : '') +
      (stars ? (next ? `<p>明天：${DAYS[day + 1].nm ? `<b>${DAYS[day + 1].mk} ${DAYS[day + 1].nm}</b>・` : ''}${DAYS[day + 1].intro}</p>` : `<p>${DAYS.length} 天都完成了，你是噗噗小廚房的傳說大廚！</p>`) : `<p>可以再試一次，或是改成「慢慢做」，客人就不會走掉喔！</p>`),
    buttons: [
      ...(next ? [{ label: '下一天', on: () => startDay(day + 1) }] : []),
      { label: '再玩這天', alt: !!next, on: () => startDay(day) },
      { label: '選擇天數', alt: true, on: menu },
    ],
  });
}
function startDay(d) {
  resetDay(d); state = 'intro'; draw();
  // new stations / customers / ways to play are explained once (rush hour only matters in ⏱ 挑戰)
  const fresh = (DAYS[d].feat || []).filter(k => !MG.store.get('kitchen.seen.' + k, false) && (k !== 'rush' || kmode === 'timed'));
  fresh.forEach(k => MG.store.set('kitchen.seen.' + k, true));
  MG.panel({
    title: fresh.length ? `${dayTitle(d)}・新東西！` : dayTitle(d),
    html: (fresh.length ? `<div class="k-new">${fresh.map(k => `<p><b>${FEAT[k][0]}</b><br>${FEAT[k][1]}</p>`).join('')}</div>` : '') +
      `<p>${DAYS[d].intro}</p><p>今天會來 ${DAYS[d].n} 位客人${kmode === 'relax' ? '，慢慢做不用急 ^_^' : ''}</p>`,
    buttons: [{ label: '開店！', on: () => { state = 'play'; MG.hide(); } }],
  });
}
function startFree() {
  resetDay(-1); state = 'intro'; draw();
  const first = !MG.store.get('kitchen.seen.free', false); MG.store.set('kitchen.seen.free', true);
  if (!first) { state = 'play'; MG.hide(); return; }
  MG.panel({ title: '🎨 自由做', html: `<div class="k-new"><p>${FEAT.free[1]}</p></div>`, buttons: [{ label: '開店！', on: () => { state = 'play'; MG.hide(); } }] });
}
const short = i => DAYS[i].mk;
function menu() {
  state = 'menu';
  const all = MG.store.get('kitchen.stars', []), got = all.reduce((a, b) => a + (b || 0), 0);
  const btn = i => `<button class="mg-btn${i ? ' alt' : ''}${DAYS[i].fin ? ' fin' : ''}" data-day="${i}" aria-label="第 ${i + 1} 天${DAYS[i].nm ? ' ' + DAYS[i].nm : ''}" ${unlocked(i) ? '' : 'disabled'}>${i + 1} ${short(i)}<small class="stars">${unlocked(i) ? starsTxt(all[i] || 0) : '🔒'}</small></button>`;
  const range = (a, b) => Array.from({ length: b - a }, (_, k) => a + k);
  MG.panel({
    title: '噗噗小廚房',
    html: `<p>客人想吃什麼都畫在泡泡裡。點爐子煮東西，煮好點一下放到盤子上，加上配料，再點客人上菜！</p>

    <div class="mg-pick"><button type="button" class="mg-opt" data-km="relax">🐢 慢慢做<small>客人不會走・東西比較不會焦</small></button><button type="button" class="mg-opt" data-km="timed">⏱ 挑戰<small>客人等太久會離開</small></button></div>
    <button type="button" class="mg-btn k-free" data-free>🎨 自由做<small>自己換廚具，想煮什麼就煮什麼，客人一直來</small></button>

    <p class="k-legend">🥞 鬆餅・🍳 炒飯・🥳 生日派對・🥟 水餃・🥤 果汁・🙅 挑食・🍱 便當・🎉🌟 大挑戰</p>
    <p class="k-sec">🏮 夜市與新玩法（15–${DAYS.length} 天）</p>
    <div class="days">${range(14, DAYS.length).map(btn).join('')}</div>
    <p class="k-legend">🏮🍭🌙🎆 夜市・⏰ 排隊人潮・💭🌶️ 特別要求（×2）・🍱🥤 套餐・🔥🥟 雙爐齊開・👑 大廚挑戰</p>`,
    keys: '全部用點的就能玩。鍵盤：Q W 鍋子・E R T 中間爐子・Y 烤箱・A–H 配料・空白鍵 盤子・X 倒掉・1 2 3 上菜',
  });

  document.querySelectorAll('[data-km]').forEach(b => b.onclick = () => { kmode = b.dataset.km; MG.store.set('kitchen.mode', kmode); MG.sfx('click'); syncKm(); });

MG.pauseMenu({ label: '☰ 選天', playing: () => state === 'play', open: was => { menu(); if (was) return () => { state = 'play'; }; } });
resetDay(0); menu();
// small hook for automated tests (read-only snapshots + a few actions)
function toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; }
window.KT = {
  get state() { return state; }, get tray() { return tray && JSON.parse(JSON.stringify(tray)); }, seats: () => seats.map(c => c && { say: c.say, st: c.st, order: JSON.parse(JSON.stringify(c.order)), sp: c.sp }), pots: () => units[0].map(p => ({ ...p })), get pops() { return pops.map(p => p.t); }, get coins() { return coins; }, Lo: () => Lo, dims: () => ({ W, H, land }),
  get day() { return day; }, days: DAYS.length, get served() { return served; }, get missed() { return missed; }, get spawned() { return spawned; }, cfg: () => JSON.parse(JSON.stringify(cfg)), get combo() { return combo; }, get frameMs() { return frameMs; }, get free() { return freeMode; },
  units: () => units.map(a => a.map(u => ({ ...u, fr: u.fr.slice() }))), startDay: d => { startDay(d); state = 'play'; MG.hide(); }, setMode: m => { kmode = m; }, startFree: () => { MG.store.set('kitchen.seen.free', true); startFree(); }, swap: sl => swapSlot(sl),
  tapUnit: (sl, i) => tapUnit(sl, i), addTop: id => addTop(TOP[id]), serve: i => serve(i), tapTray: () => tapTray(), trash: () => trashTray(), canServe: i => !!(seats[i] && seats[i].st === 'wait' && matches(seats[i].order, tray)),
  ff: sec => { for (let i = 0; i < sec * 30 && state === 'play'; i++) update(1 / 30); }, celeb: sec => { for (let i = 0; i < sec * 30 && state === 'celeb'; i++) { t += 1 / 30; MG.fx.step(1 / 30); celebStep(1 / 30); } },
  win: () => { if (state !== 'play') return; served = cfg.n; missed = 0; spawned = cfg.n; seats = [null, null, null]; endDay(); },
  pt: (lx, ly) => toClient(lx, ly), unitPt: (sl, i) => { const q = uPos(sl, i); return toClient(q.x, q.y); }, topPt: id => { const i = cfg.shelf.indexOf(id), r = topRect(i); return toClient(r.x + r.w / 2, r.y + r.h / 2); },
  seatPt: i => toClient(Lo.seats[i].x, Lo.seats[i].y), trayPt: () => toClient(Lo.tray.x + Lo.tray.w / 2, Lo.tray.y + Lo.tray.h / 2), swapPt: sl => toClient(Lo.swap[sl].x, Lo.swap[sl].y), trashPt: () => toClient(Lo.trash.x + Lo.trash.w / 2, Lo.trash.y + Lo.trash.h / 2),
};
MG.loop(dt => { if (state === 'play') update(dt); else { t += dt; MG.fx.step(dt); for (const p of puffs) { p.life -= dt; } puffs = puffs.filter(p => p.life > 0); if (state === 'celeb') celebStep(dt); } draw(); });
