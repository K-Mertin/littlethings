<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'kitchen', title: '噗噗小廚房', stats: ['day', 'coins'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
let W = 640, H = 400, land = true;
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ---------- layout ----------
// The base layouts are 640×400 (landscape) and 360×476 (portrait). The canvas takes the stage's shape, and the
// extra room is shared out between the stations (wider gaps, bigger topping buttons) — sizes of the cooking stations stay the same.
let Lo, TOPCOLS = 6;
function layout() {
  if (land) {
    const ex = W - 640, d = ex / 4, ey = H - 400, a = ey * 0.35, b = ey * 0.3, c = ey * 0.2;
    const ovenX = 424 + d * 2, tw = Math.min(84, (ovenX - 16 - 12 - 5 * 8) / 6);
    const gx = 228 + d * 1.2, gw = 176 + d * 0.3;
    TOPCOLS = 6;
    Lo = {
      seats: [130, 320, 510].map(sx => ({ x: sx * W / 640, y: 96 + a * 0.7 })), counterY: 140 + a, floorY: 172 + a,
      pots: [{ x: 66 + d * 0.4, y: 236 + a + b, r: 32 }, { x: 160 + d * 0.7, y: 236 + a + b, r: 32 }],
      grill: { x: gx, y: 202 + a + b, w: gw, h: 70 }, grillSlots: [0.216, 0.5, 0.784].map(f => gx + gw * f),
      oven: { x: ovenX, y: 192 + a + b, w: 112, h: 92 },
      chef: { x: 590 + d * 3.2, y: 246 + a + b },
      tops: { x: 16, y: 300 + a + b + c, w: tw, h: 46 + Math.min(14, c * 0.4), gap: 8 },
      tray: { x: ovenX, y: 300 + a + b + c, w: 122, h: 86 }, trash: { x: 560 + d * 3.2, y: 312 + a + b + c, w: 66, h: 74 },
    };
  } else {
    const ex = H - 476, two = ex >= 70, e = two ? ex - 62 : ex, a = e * 0.2, b = e * 0.25, c = e * 0.3, dd = e * 0.25;
    TOPCOLS = two ? 3 : 6;
    Lo = {
      seats: [62, 180, 298].map(sx => ({ x: sx, y: 100 + a * 0.7 })), counterY: 146 + a, floorY: 178 + a,
      pots: [{ x: 48, y: 244 + a + b, r: 28 }, { x: 122, y: 244 + a + b, r: 28 }],
      grill: { x: 168, y: 212 + a + b, w: 178, h: 64 }, grillSlots: [204, 257, 310],
      oven: { x: 14, y: 300 + a + b + c, w: 108, h: 92 },
      chef: null,
      tops: two ? { x: 12, y: 412 + a + b + c + dd, w: (W - 24 - 16) / 3, h: 50, gap: 8 } : { x: 12, y: 412 + a + b + c + dd, w: 52, h: 46, gap: 6.4 },
      tray: { x: 134, y: 304 + a + b + c, w: 124, h: 88 }, trash: { x: 272, y: 312 + a + b + c, w: 74, h: 78 },
    };
  }
}
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  land = asp > 1.05;
  if (land) { W = Math.round(Math.min(1200, Math.max(640, 400 * asp))); H = Math.round(Math.min(620, Math.max(400, W / asp))); }
  else { W = 360; H = Math.round(Math.min(860, Math.max(476, W / asp))); }
  layout(); return [W, H];
});
addEventListener('mg-big', () => { bgK = ''; });
const TS = () => MG.textScale;
// font that grows in 大字模式 but still fits maxW
function fitFont(txt, px, maxW, w = 700, fam = '"Noto Sans TC",system-ui') {
  let sz = Math.round(px * TS()); x.font = `${w} ${sz}px ${fam}`;
  while (sz > px * 0.7 && x.measureText(txt).width > maxW) { sz--; x.font = `${w} ${sz}px ${fam}`; }
  return sz;
}

// ---------- data ----------
// def: toppings a dish always comes with (fried rice comes with peas; a picky kid wants them picked out)
const DISH = {
  noodle: { name: '泡麵', cook: 4, burn: 10, tops: ['egg', 'onion'] },
  skewer: { name: '烤肉串', cook: 3.2, burn: 9, tops: ['sauce', 'sesame'] },
  cookie: { name: '餅乾', cook: 5, burn: 12, tops: ['choco', 'sprinkle'] },
  pancake: { name: '鬆餅', cook: 4.4, burn: 12, tops: ['honey', 'cream'] },
  rice: { name: '炒飯', cook: 4.5, burn: 12, tops: ['shrimp'], def: ['pea'] },
  dumpling: { name: '水餃', cook: 4, burn: 11, tops: ['soy', 'chili'] },
  juice: { name: '果汁', cook: 2.4, burn: 0, tops: ['strawb', 'banana'] },
};
// stations: slot 0 = the two round burners (left), 1 = the long stove (middle), 2 = the box (right)
const ST = {
  noodle: { slot: 0, dish: 'noodle', n: 2 }, pancake: { slot: 0, dish: 'pancake', n: 2, flip: 1 },
  skewer: { slot: 1, dish: 'skewer', n: 3 }, wok: { slot: 1, dish: 'rice', n: 2, stir: 2 }, dumpling: { slot: 1, dish: 'dumpling', n: 3, batch: 1 },
  cookie: { slot: 2, dish: 'cookie', n: 1 }, juice: { slot: 2, dish: 'juice', n: 1, blend: 1 },
};
const TOPS = [
  { id: 'egg', name: '蛋', dish: 'noodle' }, { id: 'onion', name: '蔥花', dish: 'noodle' },
  { id: 'sauce', name: '烤肉醬', dish: 'skewer' }, { id: 'sesame', name: '芝麻', dish: 'skewer' },
  { id: 'choco', name: '巧克力豆', dish: 'cookie' }, { id: 'sprinkle', name: '彩色糖', dish: 'cookie' },
  { id: 'honey', name: '蜂蜜', dish: 'pancake' }, { id: 'cream', name: '鮮奶油', dish: 'pancake' },
  { id: 'shrimp', name: '蝦仁', dish: 'rice' }, { id: 'soy', name: '醬油', dish: 'dumpling' }, { id: 'chili', name: '辣椒', dish: 'dumpling' },
  { id: 'strawb', name: '草莓', dish: 'juice', blend: 1 }, { id: 'banana', name: '香蕉', dish: 'juice', blend: 1 },
  { id: 'box', name: '便當盒', dish: null, box: 1 },
];
const TOP = Object.fromEntries(TOPS.map(tp => [tp.id, tp]));
const OLD6 = ['egg', 'onion', 'sauce', 'sesame', 'choco', 'sprinkle'];
// days 1–5 are the original ones (kept exactly); 6–14 bring new stations and special customers.
// sp: special customers spread over the day; rush: a burst of customers (⏰ 挑戰 only); feat: new things explained once
const DAYS = [
  { mk: '🍜', dishes: ['noodle'], tops: ['egg'], n: 6, patience: 40, gap: 6.5, intro: '今天只賣泡麵。點鍋子開始煮，煮好點一下放到盤子上，再點客人上菜！' },
  { mk: '🍢', dishes: ['noodle', 'skewer'], tops: ['egg', 'onion', 'sauce'], n: 7, patience: 36, gap: 6, intro: '新菜色：烤肉串！點烤架放上肉串，有的客人要加烤肉醬。' },
  { mk: '🍪', dishes: ['noodle', 'skewer', 'cookie'], tops: ['egg', 'onion', 'sauce', 'choco'], n: 8, patience: 34, gap: 5.5, intro: '烤箱可以烤餅乾了！烤比較久，記得早點開始烤。' },
  { mk: '🧂', dishes: ['noodle', 'skewer', 'cookie'], tops: OLD6, n: 9, patience: 30, gap: 5, intro: '所有配料都上架了，看清楚客人要什麼再加喔。' },
  { mk: '🔥', dishes: ['noodle', 'skewer', 'cookie'], tops: OLD6, n: 11, patience: 26, gap: 4.2, intro: '週末大排長龍！客人比較急，動作要快 ^_^' },
  { mk: '🥞', st: ['pancake', 'skewer', 'cookie'], dishes: ['pancake', 'skewer', 'cookie'], tops: ['honey', 'cream', 'sauce', 'sesame', 'choco', 'sprinkle'], n: 8, patience: 34, gap: 5.6, feat: ['pancake'], intro: '鍋子換成平底鍋，今天賣鬆餅！出現 🔄 的時候記得翻面喔。' },
  { mk: '🍳', st: ['noodle', 'wok', 'cookie'], dishes: ['noodle', 'rice', 'cookie'], tops: ['egg', 'onion', 'shrimp', 'choco', 'sprinkle'], n: 8, patience: 34, gap: 5.6, feat: ['wok'], intro: '烤架換成炒鍋，今天賣炒飯！出現 🥄 就點一下翻炒。' },
  { mk: '🥳', dishes: ['noodle', 'skewer', 'cookie'], tops: OLD6, n: 8, patience: 32, gap: 5.4, sp: ['party', 'party'], feat: ['party'], intro: '今天有人過生日！戴派對帽的客人要一次三份喔。' },
  { mk: '🥟', st: ['noodle', 'dumpling', 'cookie'], dishes: ['noodle', 'dumpling', 'cookie'], tops: ['egg', 'onion', 'soy', 'chili', 'choco', 'sprinkle'], n: 9, patience: 32, gap: 5.2, feat: ['dumpling'], intro: '新廚具：蒸籠！點一下三籠水餃一起蒸。' },
  { mk: '🥤', st: ['noodle', 'dumpling', 'juice'], dishes: ['noodle', 'dumpling', 'juice'], tops: ['egg', 'onion', 'soy', 'chili', 'strawb', 'banana'], n: 9, patience: 32, gap: 5.2, feat: ['juice'], intro: '烤箱換成果汁機！先放水果，再點果汁機打果汁。' },
  { mk: '🙅', st: ['pancake', 'wok', 'juice'], dishes: ['pancake', 'rice', 'juice'], tops: ['honey', 'cream', 'shrimp', 'strawb', 'banana'], n: 10, patience: 32, gap: 5, sp: ['picky', 'picky', 'picky'], feat: ['picky'], intro: '有挑食的小朋友來吃炒飯，他不要青豆喔！' },
  { mk: '🍱', st: ['pancake', 'wok', 'cookie'], dishes: ['pancake', 'rice', 'cookie'], tops: ['honey', 'cream', 'shrimp', 'box', 'choco', 'sprinkle'], n: 10, patience: 34, gap: 5, sp: ['bento', 'bento', 'bento'], feat: ['bento'], intro: '便當日！有客人要外帶便當，一個便當放兩樣菜。' },
  { mk: '🎉', st: ['pancake', 'dumpling', 'juice'], dishes: ['pancake', 'dumpling', 'juice'], tops: ['honey', 'cream', 'soy', 'chili', 'strawb', 'banana'], n: 11, patience: 30, gap: 4.6, sp: ['party', 'party'], rush: true, feat: ['rush'], intro: '下午茶大派對！鬆餅、水餃、果汁一起來。' },
  { mk: '🌟', st: ['noodle', 'wok', 'cookie'], dishes: ['noodle', 'rice', 'cookie'], tops: ['egg', 'onion', 'shrimp', 'box', 'choco', 'sprinkle'], n: 13, patience: 28, gap: 4.4, sp: ['picky', 'bento', 'party', 'picky', 'bento'], rush: true, feat: ['rush'], intro: '大廚之夜！挑食小朋友、便當、生日派對全都來了！' },
];
DAYS.forEach(d => { d.st = d.st || ['noodle', 'skewer', 'cookie']; d.shelf = d.shelf || (d.st.join() === 'noodle,skewer,cookie' ? OLD6 : d.tops); });
const FEAT = {
  pancake: ['🥞 鬆餅平底鍋', '點平底鍋倒麵糊。鬆餅冒泡泡、出現 🔄 的時候點一下翻面，再等一下就好了！'],
  wok: ['🍳 炒飯鍋', '點炒鍋開始炒飯。出現 🥄 的時候點一下翻炒，炒兩次就好了。炒飯會附綠色的青豆。'],
  dumpling: ['🥟 蒸籠', '點一下蒸籠，三籠水餃會一起蒸！蒸好了再一籠一籠拿到盤子上。'],
  juice: ['🥤 果汁機', '先點下面的水果放進果汁機（可以放兩種），再點果汁機打成果汁，打好點一下倒進杯子。'],
  party: ['🥳 生日派對客人', '戴派對帽的客人要一次三份一樣的！做好一份就送一份，三份都送到會有好多金幣。'],
  picky: ['🙅 挑食小朋友', '泡泡裡有 🚫 青豆的小朋友不吃青豆。炒飯放到盤子上以後，點一下盤子就能把青豆挑掉。'],
  bento: ['🍱 便當', '先點「便當盒」放到盤子上，再把泡泡裡的兩樣菜放進便當盒，就可以送給客人了。'],
  rush: ['⏰ 尖峰時間', '挑戰模式的時候，中間會突然一下子來很多客人，加油！（慢慢來模式不會有）'],
};
const GUESTS = ['🐶', '🐱', '🐰', '🐻', '🐼', '🦊', '🐸', '🐷', '🐨', '🐯', '🐵', '🐹'];
const SHIRTS = ['#ff8a80', '#80c8ff', '#ffd36b', '#b39dff', '#8fe0a0', '#ffb07a'];

let day = 0, cfg, coins, served, missed, spawned, spawnT, state = 'ready', t = 0;
let units = [[], [], []], tray, seats, pops = [], shakeTray = 0, chefMood = 'happy', chefT = 0;
let spAt = {}, rushAt = -1, rushLeft = 0, blendHint = 0;
const shelf = () => cfg.shelf.map(id => TOP[id]);
const stOn = sl => cfg.dishes.includes(ST[cfg.st[sl]].dish);

function resetDay(d) {
  day = d; cfg = DAYS[d];
  coins = 0; served = 0; missed = 0; spawned = 0; spawnT = 1.2; t = 0; pops = []; MG.fx.clear();
  units = cfg.st.map(type => Array.from({ length: ST[type].n }, () => ({ s: 'empty', t: 0, ph: 0, w: 0, fr: [] })));
  tray = null; seats = [null, null, null]; blendHint = 0;
  spAt = {}; (cfg.sp || []).forEach((k, j, a) => { let i = Math.max(1, Math.floor((j + 1) * cfg.n / (a.length + 1))); while (spAt[i]) i++; spAt[i] = k; });
  rushAt = cfg.rush ? Math.floor(cfg.n * 0.35) : -1; rushLeft = 0;
  hud();
}
// extra shared sounds, throttled so several pots finishing at once don't pile up (≥60 ms per name)
const juiceT = {};
function juice(name, n) { const q = performance.now(); if (q - (juiceT[name] || 0) < 60) return; juiceT[name] = q; MG.sfx(name, n); }
function hud() { MG.stat('day', `第 ${day + 1} 天`); MG.stat('coins', `🪙 ${coins}`); }
let kmode = MG.store.get('kitchen.mode', 'relax');   // 'relax': customers wait forever, food burns slower
const unlocked = () => true;

// ---------- customers ----------
function makeOrder(sp) {
  if (sp === 'bento') { const pool = cfg.dishes.filter(d => d !== 'noodle' && d !== 'juice'); return { type: 'bento', tops: [], items: [MG.pick(pool), MG.pick(pool)].sort() }; }
  const type = sp === 'picky' && cfg.dishes.includes('rice') ? 'rice' : MG.pick(cfg.dishes), D = DISH[type], allowed = D.tops.filter(tp => cfg.tops.includes(tp));
  let tops = allowed.filter(() => Math.random() < (type === 'noodle' ? 0.5 : 0.45));
  if (type === 'juice' && !tops.length) tops = [MG.pick(allowed)];
  if (sp === 'party' && tops.length > 1) tops = [MG.pick(tops)];
  if (sp === 'picky' && type === 'rice' && !tops.length && Math.random() < 0.5) tops = ['shrimp'];
  const o = { type, tops: [...(D.def && !(sp === 'picky' && type === 'rice') ? D.def : []), ...tops] };
  if (sp === 'party') { o.qty = 3; o.got = 0; }
  if (sp === 'picky' && type === 'rice') o.picky = true;
  return o;
}
function spawnGuest() {
  const free = seats.map((s, i) => s ? -1 : i).filter(i => i >= 0); if (!free.length) return false;
  const i = MG.pick(free), sp = spAt[spawned] || null, pat = cfg.patience * (sp === 'party' ? 2 : 1);
  seats[i] = { face: sp === 'party' ? '🥳' : sp === 'picky' ? '🧒' : MG.pick(GUESTS), shirt: MG.pick(SHIRTS), order: makeOrder(sp), sp, pat, max: pat, st: 'arrive', a: 0, shake: 0, say: '' };
  spawned++; MG.sfx('boing');
  return true;
}
function matches(o, d) {
  if (!d) return false;
  if (o.type === 'bento') return d.type === 'bento' && d.items.length === 2 && d.items.map(it => it.type).sort().join() === o.items.join();
  return o.type === d.type && o.tops.length === d.tops.length && o.tops.every(tp => d.tops.includes(tp));
}

// ---------- update ----------
function stepUnit(u, type, dt) {
  const S = ST[type], D = DISH[S.dish], mult = kmode === 'relax' ? 2 : 1;
  if (u.s === 'cook') {
    u.t += dt;
    if (S.flip && u.ph < 1 && u.t >= D.cook * 0.5) { u.s = 'wait'; u.w = 0; juice('pop'); }
    else if (S.stir && u.ph < S.stir && u.t >= D.cook * (u.ph + 1) / (S.stir + 1)) { u.s = 'wait'; u.w = 0; juice('pop'); }
    else if (u.t >= D.cook) { u.s = 'ready'; MG.sfx('good'); juice('sparkle'); }   // ding! + a little shimmer
  } else if (u.s === 'ready') {
    u.t += dt;
    if (D.burn && u.t >= D.burn * mult) { u.s = 'burnt'; MG.sfx('miss'); juice('whoosh'); }   // soft puff of smoke
  } else if (u.s === 'wait') {   // waiting for a flip / stir: never burns in 慢慢來
    u.w += dt; if (kmode === 'timed' && u.w >= 7) { u.s = 'burnt'; MG.sfx('miss'); juice('whoosh'); }
  }
}
function uPos(sl, i) {
  if (sl === 0) { const q = Lo.pots[i]; return { x: q.x, y: q.y, by: q.y - q.r - 6 }; }
  if (sl === 1) { const G = Lo.grill, n = units[1].length, f = n === 3 ? [0.216, 0.5, 0.784][i] : [0.27, 0.73][i]; return { x: G.x + G.w * f, y: G.y + G.h / 2, by: G.y - 8 }; }
  const O = Lo.oven; return { x: O.x + O.w / 2, y: O.y + O.h / 2, by: O.y - 6 };
}
function update(dt) {
  t += dt;
  for (let sl = 0; sl < 3; sl++) units[sl].forEach(u => stepUnit(u, cfg.st[sl], dt));
  // steam / smoke
  for (let sl = 0; sl < 2; sl++) units[sl].forEach((u, i) => {
    if (u.s === 'empty' || !stOn(sl) || Math.random() > (sl ? 0.2 : 0.25)) return;
    const q = uPos(sl, i), steamy = cfg.st[sl] === 'dumpling';
    MG.fx.burst(q.x + MG.rand(-10, 10), sl ? Lo.grill.y + 18 : q.y - 18, { n: 1, colors: [u.s === 'burnt' ? 'rgba(60,60,60,.5)' : `rgba(255,255,255,${steamy ? 0.75 : 0.5})`], speed: 10, up: steamy ? 50 : 38, grav: -20, size: steamy ? 6 : 4.5, life: 1 });
  });
  spawnT -= dt;
  if (rushAt >= 0 && spawned === rushAt && kmode === 'timed') { rushAt = -1; rushLeft = 4; spawnT = Math.min(spawnT, 0.6); MG.toast('Rush hour! ⏰', 1800); MG.sfx('whoosh'); pops.push({ x: W / 2, y: Lo.counterY - 20, t: 'Rush hour! ⏰', life: 1.6 }); }
  if (spawned < cfg.n && spawnT <= 0) { if (spawnGuest()) { if (rushLeft > 0) { rushLeft--; spawnT = 1.3; } else spawnT = cfg.gap * MG.rand(0.8, 1.2); } else spawnT = 0.5; }
  for (let i = 0; i < 3; i++) {
    const c = seats[i]; if (!c) continue;
    c.shake = Math.max(0, c.shake - dt);
    if (c.st === 'arrive') { c.a = Math.min(1, c.a + dt * 3); if (c.a >= 1) c.st = 'wait'; }
    else if (c.st === 'wait') {
      if (kmode === 'timed') c.pat -= dt;
      if (c.pat <= 0) { c.st = 'sad'; c.a = 1; c.say = 'Bye… 😢'; missed++; MG.sfx('miss'); }

}
// ----- slot 2: oven (cookies) or blender (juice)
function drawSlot2() {
  const O = Lo.oven, type = cfg.st[2], oven = units[2][0];
  if (type === 'juice') {
    const on = oven.s === 'cook';
    rr(O.x + 6, O.y + 4, O.w - 12, O.h - 8, 12, '#fff7e8', '#e3cfa6', 1.5);
    const bx = O.x + O.w / 2, base = O.y + O.h - 10, jw = Math.min(O.w * 0.28, 34), jh = O.h * 0.56, sh = on ? Math.sin(t * 50) * 1.2 : 0;
    rr(bx - jw * 1.15, base - 20, jw * 2.3, 20, 6, '#ff7a8a', '#c9406a', 2); circ(bx, base - 10, 4, on ? '#4cff8a' : '#fff');
    x.save(); x.translate(sh, 0);
    x.beginPath(); x.moveTo(bx - jw, base - 20 - jh); x.lineTo(bx + jw, base - 20 - jh); x.lineTo(bx + jw * 0.72, base - 20); x.lineTo(bx - jw * 0.72, base - 20); x.closePath();
    x.fillStyle = 'rgba(220,240,255,.75)'; x.fill();
    x.save(); x.clip();
    if (oven.s === 'cook' || oven.s === 'ready') { const lv = oven.s === 'ready' ? 0.75 : 0.3 + Math.min(1, oven.t / DISH.juice.cook) * 0.45; x.fillStyle = juiceCol(oven.fr); x.fillRect(bx - jw, base - 20 - jh * lv, jw * 2, jh * lv);
      if (on) { x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 2; for (let k = 0; k < 3; k++) { x.beginPath(); x.ellipse(bx, base - 26 - k * 8, jw * 0.5, 3, t * 20 + k, 0, 7); x.stroke(); } } }

    x.restore();
    x.beginPath(); x.moveTo(bx - jw, base - 20 - jh); x.lineTo(bx + jw, base - 20 - jh); x.lineTo(bx + jw * 0.72, base - 20); x.lineTo(bx - jw * 0.72, base - 20); x.closePath(); x.strokeStyle = '#7d9bb5'; x.lineWidth = 2; x.stroke();

  rr(O.x + 8, O.y + 8, O.w - 16, 14, 4, '#c5ccd4');
  for (let k = 0; k < 3; k++) circ(O.x + 20 + k * 16, O.y + 15, 4, k === 2 && ovenOn ? '#ff5a4e' : '#7d8792');
  const win = x.createLinearGradient(0, O.y + 28, 0, O.y + O.h - 10); win.addColorStop(0, ovenOn ? '#ffb347' : '#3a3f4a'); win.addColorStop(1, ovenOn ? '#d0602a' : '#22262e');
  rr(O.x + 10, O.y + 28, O.w - 20, O.h - 38, 8, win, '#5d6672');
  if (oven.s !== 'empty') drawDish({ type: 'cookie', tops: [] }, O.x + O.w / 2, O.y + 28 + (O.h - 38) / 2 + 2, 0.85, oven.s === 'burnt');
  x.fillStyle = 'rgba(255,255,255,.25)'; x.fillRect(O.x + 14, O.y + 31, O.w - 28, 4);
  if (!stOn(2)) lockOver(O, '🔒 第 3 天', 12);

function draw() {
  backdrop(); x.drawImage(bgC, 0, 0, W, H);

    const r = topRect(i), on = cfg.tops.includes(tp.id);

    rr(r.x, r.y, r.w, r.h, 10, on ? (hint ? '#fff7d6' : '#fff') : '#e6e2d8', hint ? '#ffb21f' : (MG.big ? '#a88a4a' : '#d9c79c'), hint ? 3 : MG.big ? 2.5 : 2);
    const wide = r.w > 90, lab = on ? tp.name : '🔒';
    x.globalAlpha = on ? 1 : 0.35; topIcon(tp.id, wide ? r.x + 22 : r.x + r.w / 2, wide ? r.y + r.h / 2 : r.y + r.h / 2 - 5, wide ? 1.25 : 1); x.globalAlpha = 1;
    x.fillStyle = on ? (MG.big ? '#3d2a10' : '#6b4a22') : '#a8a090'; x.textBaseline = 'middle';
    if (wide) { fitFont(lab, 13, r.w - 46); x.textAlign = 'left'; x.fillText(lab, r.x + 40, r.y + r.h / 2 + 1); }
    else { fitFont(lab, 10, r.w - 4); x.textAlign = 'center'; x.fillText(lab, r.x + r.w / 2, r.y + r.h - 8); }
  });
  // tray
  const T = Lo.tray, ts = shakeTray ? Math.sin(shakeTray * 60) * 3 : 0;
  rr(T.x + ts, T.y, T.w, T.h, 14, '#c98a3a', '#8a5a22', 2.5);
  x.fillStyle = '#fff'; x.beginPath(); x.ellipse(T.x + T.w / 2 + ts, T.y + T.h / 2 + 2, T.w * 0.38, T.h * 0.34, 0, 0, 7); x.fill();
  x.strokeStyle = '#e2d6b8'; x.lineWidth = 2; x.beginPath(); x.ellipse(T.x + T.w / 2 + ts, T.y + T.h / 2 + 2, T.w * 0.3, T.h * 0.26, 0, 0, 7); x.stroke();
  if (tray) {
    drawDish(tray, T.x + T.w / 2 + ts, T.y + T.h / 2, tray.type === 'bento' ? 1.25 : 1.05);
    if (tray.type === 'rice' && tray.tops.includes('pea') && seats.some(c => c && c.st === 'wait' && c.order.picky)) { const k = (t * 1.4) % 1; x.save(); x.globalAlpha = 1 - k; x.strokeStyle = '#ffb21f'; x.lineWidth = 3; x.beginPath(); x.arc(T.x + T.w / 2, T.y + T.h / 2, 14 + k * 22, 0, 7); x.stroke(); x.restore(); }
  } else { x.fillStyle = MG.big ? '#8a7650' : '#b8a888'; fitFont('盤子', 12, T.w - 10); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('盤子', T.x + T.w / 2, T.y + T.h / 2 + 2); }
  // trash
  const R = Lo.trash;
  rr(R.x + 8, R.y + 12, R.w - 16, R.h - 12, [4, 4, 12, 12], '#8fa3b5', '#5d6f80');
  for (let k = 0; k < 3; k++) { x.strokeStyle = 'rgba(255,255,255,.4)'; x.lineWidth = 2; x.beginPath(); x.moveTo(R.x + 22 + k * 11, R.y + 22); x.lineTo(R.x + 22 + k * 11, R.y + R.h - 8); x.stroke(); }
  rr(R.x + 2, R.y + 4, R.w - 4, 10, 4, '#a8bccd', '#5d6f80');
  x.fillStyle = '#fff'; fitFont('倒掉', 11, R.w - 16); x.textAlign = 'center'; x.fillText('倒掉', R.x + R.w / 2, R.y + R.h - 14);

// ---------- flow ----------
const starsTxt = n => '★'.repeat(n) + '☆'.repeat(3 - n);
function endDay() {
  if (state !== 'play') return;
  state = 'over';
  const ratio = served / cfg.n, stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : ratio >= 0.4 ? 1 : 0;
  const all = MG.store.get('kitchen.stars', []); all[day] = Math.max(all[day] || 0, stars); MG.store.set('kitchen.stars', all);
  const rec = MG.record('kitchen.coins.' + day, coins);
  const total = all.reduce((a, b) => a + (b || 0), 0); MG.record('kitchen', total);
  MG.sfx(stars ? 'win' : 'over');
  const next = day + 1 < DAYS.length;
  MG.panel({
    title: stars ? `第 ${day + 1} 天打烊囉！` : '今天有點手忙腳亂…',
    html: `<div class="big stars">${starsTxt(stars)}</div><p>招待了 ${served} 位客人，賺了 🪙 ${coins}</p>` +
      (rec.isNew && coins > 0 ? `<p class="new">這一天的新紀錄！^_^</p>` : '') +
      (stars ? (next ? `<p>明天：${DAYS[day + 1].intro}</p>` : `<p>${DAYS.length} 天都完成了，你是噗噗小廚房的大廚！</p>`) : `<p>可以再試一次，或是改成「慢慢來」，客人就不會走掉喔！</p>`),
    buttons: [
      ...(next ? [{ label: '下一天', on: () => startDay(day + 1) }] : []),
      { label: '再玩這天', alt: !!next, on: () => startDay(day) },
      { label: '選擇天數', alt: true, on: menu },
    ],

}
function startDay(d) {

  // new stations / customers are explained once (rush hour only matters in ⏰ 挑戰)
  const fresh = (DAYS[d].feat || []).filter(k => !MG.store.get('kitchen.seen.' + k, false) && (k !== 'rush' || kmode === 'timed'));
  fresh.forEach(k => MG.store.set('kitchen.seen.' + k, true));
  MG.panel({
    title: fresh.length ? `第 ${d + 1} 天・新東西！` : `第 ${d + 1} 天`,
    html: (fresh.length ? `<div class="k-new">${fresh.map(k => `<p><b>${FEAT[k][0]}</b><br>${FEAT[k][1]}</p>`).join('')}</div>` : '') +
      `<p>${DAYS[d].intro}</p><p>今天會來 ${DAYS[d].n} 位客人${kmode === 'relax' ? '，慢慢做不用急 ^_^' : ''}</p>`,

function menu() {

    <div class="days">${DAYS.map((d, i) => `<button class="mg-btn${i ? ' alt' : ''}" data-day="${i}" aria-label="第 ${i + 1} 天" ${unlocked(i) ? '' : 'disabled'}>${i + 1} ${d.mk}<small class="stars">${unlocked(i) ? starsTxt(all[i] || 0) : '🔒'}</small></button>`).join('')}</div>

MG.pauseMenu({ label: '☰ 選天', playing: () => state === 'play', open: was => { menu(); if (was) return () => { state = 'play'; }; } });

// small hook for automated tests (read-only snapshots + a few actions)
