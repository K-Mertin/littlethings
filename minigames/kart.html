function cupResults(p, r, rec, best) {

  order.forEach((c, k) => { cup.pts[c.who] = (cup.pts[c.who] || 0) + CUP_PTS[k]; });

  const dots = cup.list.map((ti, k) => `${THEMES[ti].ic}${k <= cup.k ? '✅' : ''}`).join('　');
  if (!last) {
    MG.panel({ title: `第 ${cup.k + 1} 場：第 ${place} 名！`, html: `<p>${dots}</p><p>${th.ic} ${th.nm} 拿到 <b>${CUP_PTS[place - 1]} 分</b></p>${rows}<p>下一場：${THEMES[cup.list[cup.k + 1]].ic} ${THEMES[cup.list[cup.k + 1]].nm}</p>`,
      buttons: [{ label: `下一場（${cup.k + 2}/${cup.list.length}）`, on: () => { cup.k++; start('cup', cup.lv + 1, null, true); } }, { label: '選賽道', alt: true, on: menu }] });

    buttons: [{ label: '再比一次盃賽', on: () => start('cup', cup.lv + 1) }, { label: '下一個盃賽', alt: true, on: () => { const n = (cup.lv + 3) % THEMES.length + 1; MG.store.set('kart.pickLevel', n); start('cup', n); } }, { label: '選賽道', alt: true, on: menu }] });
