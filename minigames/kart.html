    txt(String(clamp(n, 1, 3)), 0, 4, 76, x.strokeStyle, 'center', 900); x.restore();
    const th = trk.th, label = `${th.ic} ${th.nm}`; x.font = `900 22px ${FONT}`; const lw = x.measureText(label).width + 40;
    x.fillStyle = 'rgba(255,255,255,.9)'; x.beginPath(); x.roundRect(W / 2 - lw / 2, H * 0.38 + 84, lw, 42, 21); x.fill();
    txt(label, W / 2, H * 0.38 + 106, 22, '#3a3f55', 'center', 900);
    if (isTouch || mode === 'pvp') { x.globalAlpha = 0.6 + Math.sin(t * 6) * 0.3; for (const b of BTN.slice(0, mode === 'pvp' ? 4 : 2)) txt('👆', b.x + b.w / 2, b.y - 26, 26, '#fff', 'center', 700); x.globalAlpha = 1; }
  }
  // feedback: small words above the kart, big banner in the middle
  for (const f of floats) {
    const c = f.c; if (c._sx == null) continue;
    const k = 1 - f.life / f.max; x.globalAlpha = clamp(f.life * 3, 0, 1);
    txt(f.text, clamp(c._sx, 80, W - 80), c._sy - 50 - k * 36, 19, '#fff8c0', 'center', 900, 'rgba(70,40,0,.85)', 5);
  }
  x.globalAlpha = 1;
  if (banner) {
    const k = clamp(banner.life * 2.5, 0, 1), sc = 1 + Math.max(0, banner.life - banner.max + 0.25) * 2;
    x.save(); x.globalAlpha = k; x.translate(W / 2, H * (land ? 0.3 : 0.28)); x.scale(sc, sc);
    txt(banner.text, 0, 0, land ? 46 : 38, banner.col, 'center', 900, '#fff', 9); x.restore();
  }
}

// =====================================================================
// layout
// =====================================================================
function layout() {
  W = cv.lw; H = cv.lh; land = W > H;
  Z0 = clamp(Math.min(W, H) / 560, 0.8, 1.05);
  if (mode === 'pvp') {
    const B = land ? 106 : 98, g = 8, y0 = H - B - 12;
    BTN = [{ x: 12, y: y0, w: B, h: B }, { x: 12 + B + g, y: y0, w: B, h: B }, { x: W - 12 - B * 2 - g, y: y0, w: B, h: B }, { x: W - 12 - B, y: y0, w: B, h: B }];
  } else {
    const B = land ? 124 : 112, y0 = H - B - 14;
    BTN = [{ x: 14, y: y0, w: B, h: B }, { x: W - 14 - B, y: y0, w: B, h: B }];
  }
  mini = null;
}
cv.onfit = () => layout();
MG.fit(cv, (sw, sh) => {
  const l = sw > sh * 1.05;
  if (l) { const h = 540; return [Math.round(clamp(h * (sw - 12) / Math.max(1, sh - 12), 760, 1300)), h]; }
  const w = 480; return [w, Math.round(clamp(w * (sh - 12) / Math.max(1, sw - 12), 640, 1000))];
});

// =====================================================================
// flow: menu → countdown → race → results
// =====================================================================
const REC_KEY = 'kart.rec';
const recs = () => MG.store.get(REC_KEY, {}) || {};
function trackLabel(n) {
  const r = recs()[n - 1] || {}, th = THEMES[n - 1];
  return `${th.ic} ${th.nm}${r.place ? ' ' + ['🥇', '🥈', '🥉', '🎗️'][r.place - 1] : ''}`;
}
function start(m, lv, pk) {
  mode = m; trackI = clamp(lv - 1, 0, THEMES.length - 1);
  if (pk) { diff = DIFF[pk.diff] ? pk.diff : 'easy'; assist = pk.assist !== 'off'; }
  const prevTi = trk.ti; trk = getTrack(trackI); if (prevTi !== trk.ti) clearTiles();
  layout(); setupRace();
  ptrs.clear(); for (const k of keys) k.l = k.r = false;
  state = 'count'; countT = 3; lastBeep = 0; acc = 0; MG.hide(); ea();
  hud(); lastHud = '';
}
function showResults() {
  resultsShown = true;
  setTimeout(() => { const o = document.querySelector('.mg-over'); if (o) o.scrollTop = 0; }, 0);
  const p = humans[0], th = trk.th, rec = recs(), r = rec[trackI] || {};
  const nextB = { label: trackI < THEMES.length - 1 ? '下一條賽道' : '回到第一條', on: () => { const n = (trackI + 1) % THEMES.length + 1; MG.store.set('kart.pickLevel', n); start(mode, n); } };
  const again = { label: '再跑一次', alt: true, on: () => start(mode, trackI + 1) };
  const pickB = { label: '選賽道', alt: true, on: menu };
  const best = p.lapTimes.length ? Math.min(...p.lapTimes.slice(0, LAPS)) : 0;
  if (mode === 'race') {
    const place = p.place;
    const newBest = !r.place || place < r.place; if (newBest) r.place = place;
    if (!r.raceT || p.finishT < r.raceT) r.raceT = p.finishT;
    if (best && (!r.lap || best < r.lap)) r.lap = best;
    if (place === 1) { r.won = r.won || {}; r.won[diff] = 1; }
    rec[trackI] = r; MG.store.set(REC_KEY, rec);
    const wins = Object.values(rec).filter(q => q.place === 1).length; MG.record('kart', wins);
    results = { mode, place, time: p.finishT, stars: p.stars };
    const msg = place === 1 ? `<p class="new">${th.nm}冠軍！噗噗好開心 ^_^</p>` : place === 2 ? '<p>好棒！差一點點就第一名了，再跑一次吧！</p>' : '<p>跑完了，好厲害！撿星星會跑更快喔 ⭐</p>';
    MG.panel({ title: `第 ${place} 名！`, html: `<div class="kt-big">${['🥇', '🥈', '🥉', '🎗️'][place - 1]}</div><div class="kt-res"><div>名次<b>${['1st', '2nd', '3rd', '4th'][place - 1]}</b></div><div>時間<b>${mmss(p.finishT)}</b></div><div>星星<b>⭐ ${p.stars}</b></div></div>${msg}` +
      (newBest && place < 4 && r.place === place && place > 1 ? '<p class="new">這條賽道的最好名次！</p>' : '') + `<p>電腦：${{ easy: '🐣 簡單', normal: '⭐ 普通', hard: '🔥 困難' }[diff]}</p>`,
      buttons: place === 1 ? [nextB, again, pickB] : [again, { ...nextB, alt: true }, pickB] });
  } else if (mode === 'time') {
    const newT = !r.tt || p.finishT < r.tt; if (newT) r.tt = p.finishT;
    const newLap = best && (!r.lap || best < r.lap); if (newLap) r.lap = best;
    rec[trackI] = r; MG.store.set(REC_KEY, rec);
    results = { mode, time: p.finishT, lap: best, stars: p.stars, newT };
    MG.panel({ title: '跑完了！', html: `<div class="kt-big">⏱️</div><div class="kt-res"><div>時間<b>${mmss(p.finishT)}</b></div><div>最快一圈<b>${mmss(best)}</b></div><div>星星<b>⭐ ${p.stars}</b></div></div>` +
      (newT ? '<p class="new">新紀錄！好快！^_^</p>' : `<p>最快紀錄：${mmss(r.tt)}</p>`) + '<p>下次 👻 影子會跑你最快的那一圈，追上它！</p>', buttons: [again, { ...nextB, alt: true }, pickB] });
  } else if (mode === 'slow') {
    results = { mode, stars: p.stars };
    MG.panel({ title: `繞了 ${LAPS} 圈！`, html: `<div class="kt-big">🎉</div><p>噗噗在${th.nm}開了 ${LAPS} 圈，撿到 <b>⭐ ${p.stars}</b> 顆星星！</p><p>還想開的話就繼續開，想開多久都可以 ^_^</p>`,
      buttons: [{ label: '繼續開', on: () => { slowMore = true; state = 'play'; resultsShown = false; MG.hide(); ptrs.clear(); } }, { ...nextB, alt: true }, again, pickB] });
  } else {
    const [a, b] = humans, winner = (a.finished && (!b.finished || a.place < b.place)) ? a : (b.finished ? b : (a.dist >= b.dist ? a : b));
    results = { mode, winner: winner.kind, times: [a.finished ? a.finishT : null, b.finished ? b.finishT : null], stars: [a.stars, b.stars] };
    const nm = c => c.kind === 'p1' ? '💚 1P 噗噗' : '💜 2P 粉噗噗', tm = c => c.finished ? mmss(c.finishT) : '還在跑';
    MG.panel({ title: `${winner.kind === 'p1' ? '1P' : '2P'} 贏了！`, html: `<div class="kt-big">🏆</div><div class="kt-res"><div>${nm(a)}<b>${tm(a)}</b></div><div>${nm(b)}<b>${tm(b)}</b></div><div>星星<b>${a.stars} : ${b.stars}</b></div></div><p>兩個人都好棒！再比一次吧 ^_^</p>`,
      buttons: [again, { ...nextB, alt: true }, pickB] });
  }
}
const MENU = {
  id: 'kart', title: '噗噗開車車', menuLabel: '☰ 選賽道', levelsTitle: '選一條賽道',
  html: '<p>車子會自己往前開，按 <b>◀ ▶</b> 轉彎就好！撿 ⭐ 星星會跑更快，開過 ⚡ 會衝刺，跳台會飛起來，跑 3 圈回到 🏁 終點。</p>',
  picks: [
    { key: 'diff', title: '電腦有多快？（比賽用）', def: 'easy', options: [{ id: 'easy', label: '🐣 簡單', sub: '會等你' }, { id: 'normal', label: '⭐ 普通', sub: '' }, { id: 'hard', label: '🔥 困難', sub: '很快喔' }] },
    { key: 'assist', title: '🛞 幫我轉彎', def: 'on', options: [{ id: 'on', label: '🛞 要', sub: '車子不太會跑出去' }, { id: 'off', label: '✋ 不要', sub: '自己轉，比較難' }] },
  ],
  modesTitle: '想怎麼玩？',
  modes: [{ id: 'race', label: '🏁 比賽', sub: '和 3 個好朋友比' }, { id: 'slow', label: '🐢 慢慢開', sub: '沒有對手、不計時' }, { id: 'time', label: '⏱️ 計時', sub: '追上自己的 👻 影子' }, { id: 'pvp', label: '👫 兩人比賽', sub: '同一台，一人一邊' }],
  levels: { count: THEMES.length, max: THEMES.length, label: trackLabel },
  keys: '按住 ◀ ▶（或畫面左半邊／右半邊）轉彎　電腦：<kbd>←</kbd><kbd>→</kbd> 或 <kbd>A</kbd><kbd>D</kbd>　兩人：1P 用 <kbd>A</kbd><kbd>D</kbd>、2P 用 <kbd>←</kbd><kbd>→</kbd>',
  playing: () => state === 'count' || state === 'play' || (state === 'done' && !resultsShown),
  onPause: () => { engineSet(0, false); ptrs.clear(); },
  restore: () => { ptrs.clear(); for (const k of keys) k.l = k.r = false; },
  start: (m, lv, pk) => start(m, lv, pk),
};
function menu() {
  const wasRacing = racing() && !MG.panelOpen();
  if (!wasRacing) state = 'menu';
  const lv = clamp(MG.store.get('kart.pickLevel', 1), 1, THEMES.length);
  if (state === 'menu') {
    mode = MG.store.get('kart.pickMode', 'race'); if (!MENU.modes.some(q => q.id === mode)) mode = 'race';
    trackI = lv - 1; const prev = trk.ti; trk = getTrack(trackI); if (prev !== trk.ti) clearTiles();
    layout(); setupRace(); engineSet(0, false);
  }
  MG.choose(MENU);
  const o = document.querySelector('.mg-over'); if (o) o.scrollTop = 0;
}
menu();

// ---------- hook for automated tests ----------
function toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; }
window.KART = {
  get state() { return state; }, get mode() { return mode; }, get track() { return trackI; }, get diff() { return diff; }, get assist() { return assist; },
  get raceT() { return raceT; }, get frames() { return frameN; }, get steps() { return stepN; }, get tiles() { return tiles.size; }, get tilePix() { return tilePix; },
  get results() { return results; }, get resultsShown() { return resultsShown; }, get ghost() { return ghost ? { t: ghost.t, n: ghost.d.length / 3 } : null; },
  themes: THEMES.map(q => q.nm), LAPS, CPN, HW, LIM,
  cars: () => cars.map(c => ({ kind: c.kind, who: c.who, x: c.x, y: c.y, a: c.a, v: Math.hypot(c.vx, c.vy), seg: c.seg, s: c.s, d: c.d, dist: c.dist, cp: c.cp, lap: Math.floor(c.cp / CPN),
    finished: c.finished, place: c.place, finishT: c.finishT, rank: c.rank, stars: c.stars, respawns: c.respawns, off: c.off, boostT: c.boostT, wrongT: c.wrongT, steer: c.steer, want: c.want, user: c.user, lapTimes: c.lapTimes.slice(), hopT: c.hopT })),
  trackInfo: i => { const T = getTrack(i); return { N: T.N, L: T.L, S: T.S, box: T.box, boosts: T.boosts.map(b => ({ ...b })), ramps: T.ramps.map(r => ({ ...r })), stars: T.stars.length }; },
  trackCheck,
  start: (m, i, o = {}) => { MG.store.set('kart.pickLevel', i + 1); start(m, i + 1, { diff: o.diff || diff, assist: o.assist === false ? 'off' : 'on' }); },
  menu: () => menu(),
  setAuto: v => { autopilot = !!v; },
  // run the game loop for `sec` seconds in chunks of `dt` without drawing
  sim: (sec, dt = 1 / 60) => { const n = Math.round(sec / dt); for (let i = 0; i < n; i++) update(dt); return KART.cars(); },
  skipCount: () => { if (state === 'count') { countT = 0.0001; update(0.001); } },
  put: (k, dist, d = 0, back = false) => { const c = cars[k]; putCar(c, dist, d, back); c.cp = Math.max(0, Math.floor(Math.max(0, dist) / (trk.L / CPN))); },
  // slide a car along the centreline by ds (no physics) — exercises the lap / checkpoint logic only
  nudge: (k, ds) => {
    const c = cars[k], T = trk, st = Math.sign(ds) * 6;
    for (let m = 0; m < Math.abs(ds); m += 6) {
      const sn = c.s + st, f = ((sn / T.S) % T.N + T.N) % T.N, i = Math.floor(f) % T.N, j = (i + 1) % T.N, u = f - Math.floor(f);
      c.x = T.X[i] + (T.X[j] - T.X[i]) * u + T.NX[i] * c.d; c.y = T.Y[i] + (T.Y[j] - T.Y[i]) * u + T.NY[i] * c.d; c.vx = c.vy = 0;
      const s = locate(c), dd = wrapS(s - c.s); c.s = s; if (Math.abs(dd) < 90) c.dist += dd;
      while (c.dist >= (c.cp + 1) * T.L / CPN) { c.cp++; if (c.cp % CPN === 0) lapDone(c); }
    }
    return { dist: c.dist, cp: c.cp, lap: Math.floor(c.cp / CPN) };
  },
  input: () => [held(0), held(1), userSteer(0), userSteer(1)],
  ptrs: () => [...ptrs.values()].map(z => ({ ...z })),
  buttons: () => BTN.map(b => { const a = toClient(b.x, b.y), c = toClient(b.x + b.w, b.y + b.h); return { x: a.x, y: a.y, w: c.x - a.x, h: c.y - a.y }; }),
  dims: () => ({ W, H, land, Z0, cam: { ...cam } }),
  toClient, lapLog: () => lapLog.slice(), floats: () => floatLog.slice(), banner: () => banner && banner.text,
  jam: (k, sec) => { cars[k].jamT = sec; },
  starsLeft: () => trk.stars.filter(s => s.t <= 0).length,
  perf: (n = 60, flush = true) => { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); draw(); if (flush) x.getImageData(0, 0, 1, 1); } return (performance.now() - t0) / n; },
};

MG.loop(dt => { frameN++; update(dt); draw(); });
</script>
