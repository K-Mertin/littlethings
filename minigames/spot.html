<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>大家來找碴</title>
<link rel="stylesheet" href="mini.css">
<style>.mg-stage{padding:6px}.mg-pick:has([data-pk=theme]){grid-template-columns:repeat(3,1fr)}.mg-pick [data-pk=theme]{padding:8px 2px;font-size:calc(14px * var(--ui))}.mg-pick [data-pk=theme] small{display:none}</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'spot', title: '大家來找碴', stats: ['level', 'time'] });
const SW = 320, SH = 240, HINTS = 3;
let NDIFF = 5, KIND = '', look = 0, lookMax = 0, peek = 0, torch = { x: SW / 2, y: SH / 2 };
const cv = document.getElementById('cv'); let x = cv.getContext('2d');
let land = false, U = 1, HH = 48, TWO = false, PL = [[10, 50, 1], [340, 50, 1]];
// the canvas takes the whole stage (1 logical px ≈ 1 CSS px); the two pictures are scaled up as far as they fit
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  const W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  const H = Math.max(260, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  return [W, H];
});
function layout() {
  const W = cv.lw, H = cv.lh, g = 8;
  U = Math.max(1, Math.min(1.5, Math.min(W, H) / 420)) * MG.textScale;
  // header strip: words, found dots, 💡 button — on a tall phone the words get their own line above the dots and the button
  TWO = H > W * 1.3 && W < 600;
  HH = Math.round(Math.max(56, 46 * U) + (TWO ? 22 * U + 6 : 0));
  const ah = H - HH - g, aw = W - g * 2;
  // side by side or one above the other — whichever makes the pictures bigger
  const sSide = Math.min((aw - g * 2) / (SW * 2), (ah - g) / SH), sStack = Math.min(aw / SW, (ah - g * 3) / (SH * 2));
  land = sSide > sStack;
  if (KIND === 'magic') {   // 📸 one big picture
    const p1 = Math.max(0.5, Math.min(aw / SW, ah / SH)), w1 = SW * p1, h1 = SH * p1; land = true;
    PL = [[(W - w1) / 2, HH + (ah - h1) / 2, p1]]; return;
  }
  const ps = Math.max(0.5, land ? sSide : sStack), pw = SW * ps, ph = SH * ps;
  if (land) { const x0 = (W - pw * 2 - g * 2) / 2, y0 = HH + (ah - ph) / 2; PL = [[x0, y0, ps], [x0 + pw + g * 2, y0, ps]]; }
  else { const x0 = (W - pw) / 2, gap = Math.max(g * 2, (ah - ph * 2) / 3), y0 = HH + (ah - ph * 2 - gap) / 2; PL = [[x0, y0, ps], [x0, y0 + ph + gap, ps]]; }
}
cv.onfit = layout; layout();
addEventListener('mg-big', layout);
// panel origins + scale (each scene is drawn in its own 320×240 space)
const panels = () => PL;

const PAL = ['#ff5a4e', '#ff9f1c', '#ffd23f', '#4cc96a', '#3d9bff', '#8a63ff', '#ff6fb5', '#ffffff', '#6b4a22'];
let sceneSeed = 1, sceneBg = null, sceneBgKey = '', foundAt = [];
let mode = MG.store.get('spot.mode', 'relax');   // 'timed' | 'relax'
let level, left, scene, diffs, found, wrongs = [], state = 'ready', hints, hintT = 0, hintD = null, t = 0, total = 0, floats = [];


// ---------- picture themes ----------
const THEMES = [
  { id: 'meadow', name: '🏡 草原小鎮' },
  { id: 'beach', name: '🏖️ 海邊沙灘' },
  { id: 'sea', name: '🐠 海底世界' },
  { id: 'snow', name: '⛄ 下雪天' },
  { id: 'candy', name: '🍭 糖果王國' },
  { id: 'farm', name: '🐮 農場' },
  { id: 'play', name: '🛝 遊樂場' },
  { id: 'space', name: '🚀 外太空' },
  { id: 'night', name: '🌃 夜晚城市' },
];
// ---------- the level list: a theme, how many differences, and sometimes a new way to look ----------
// 🪞 mirror: the right picture is a mirror image · 🔦 torch: the pictures are dark, your finger is a torch · 📸 magic: look at one picture, it changes, tap what changed
const LEVELS = [
  ['meadow', 3], ['beach', 3], ['farm', 4], ['play', 4], ['sea', 4], ['meadow', 3, 'magic'], ['space', 4], ['snow', 5], ['farm', 4, 'mirror'], ['night', 5],
  ['candy', 5], ['beach', 3, 'magic'], ['night', 4, 'dark'], ['play', 5], ['sea', 5, 'mirror'], ['space', 5], ['farm', 4, 'magic'], ['meadow', 6], ['sea', 5, 'dark'], ['night', 6],
  ['candy', 5, 'mirror'], ['farm', 6], ['play', 4, 'magic'], ['space', 6], ['snow', 5, 'dark'], ['beach', 7], ['space', 6, 'mirror'], ['night', 5, 'magic'], ['play', 6, 'dark'], ['mix', 7],
].map(([th, n, k]) => ({ th, n, k: k || '' }));
const LV = n => LEVELS[n - 1] || { th: 'mix', n: 7, k: ['', '', 'mirror', 'dark', 'magic'][n % 5] };
const KNAME = { '': '', mirror: '🪞 鏡子', dark: '🔦 手電筒', magic: '📸 變魔術' };
const NEWS = {
  mirror: ['🪞 鏡子圖', '右邊（或下面）的圖是<b>照鏡子</b>的樣子，左右顛倒了！一樣要找出不一樣的地方喔。'],
  dark: ['🔦 手電筒', '天黑了，圖片暗暗的。手指點一點或滑一滑，<b>手電筒</b>就會照亮那裡，慢慢找出不一樣的地方！'],
  magic: ['📸 變魔術', '先<b>仔細看</b>這張圖，記住上面有什麼。時間到了圖會變魔術，有些東西會改變，<b>點出哪裡變了</b>！想再看一次可以按 💡。'],
};
let theme = 'meadow', lastTheme = '', themePick = MG.store.get('spot.pick.theme', MG.store.get('spot.theme', 'mix'));
if (themePick !== 'mix' && !THEMES.some(t => t.id === themePick)) themePick = 'mix';
function pickTheme() {
  if (themePick !== 'mix') return themePick;
  const lt = LV(level).th; if (lt !== 'mix') return lt;
  const pool = THEMES.map(t => t.id).filter(id => id !== lastTheme);
  return MG.pick(pool);
}

// ---------- scene generation ----------
const R = MG.rand, RI = MG.randi;
const P7 = PAL.slice(0, 7);
function otherColor(c, pool = PAL) { let n; do n = MG.pick(pool); while (n === c); return n; }
// colour pools per element type (a "colour" difference picks another one from the same pool)
const COLS = {
  balloon: P7, flower: P7, umbrella: P7, castle: P7, ball: P7, gift: P7, lolly: P7,
  boat: ['#d94a3c', '#3a7bd5', '#ffffff', '#ff9f1c', '#2e9a4c'],
  crab: ['#ff5a4e', '#ff9f1c', '#8a63ff', '#3d9bff'],
  shell: ['#ffb3cc', '#ffd98a', '#ffffff', '#c9b3ff'],
  starfish: ['#ff9f1c', '#ff6fb5', '#ff5a4e', '#ffd23f', '#8a63ff'],
  fish: ['#ff9f1c', '#ffd23f', '#ff6fb5', '#ff5a4e', '#8a63ff', '#4cc96a'],
  coral: ['#ff6f91', '#ff9f1c', '#b06fff', '#ff5a4e', '#ffd23f'],
  weed: ['#3aa85a', '#9ad04a', '#1f8a7a'],
  jelly: ['#ff9fd0', '#b49cff', '#ffd23f', '#ff8a5c'],
  pine: ['#ff5a4e', '#ffd23f', '#3d9bff', '#ff6fb5'],
  cupcake: ['#fff1f6', '#ff9fcf', '#a8e0ff', '#fff07a', '#c9b3ff'],
  icecream: ['#ffb3cf', '#fff3c4', '#a8e0ff', '#8a5a34', '#b6eb9a'],
  donut: ['#ff9fcf', '#8a5a34', '#ffffff', '#7fd0ff', '#ffe36b'],
  heart: ['#ff5a8a', '#ff9f1c', '#8a63ff', '#3d9bff'],
  barn: ['#d94a3c', '#3a7bd5', '#e8a400', '#2e9a4c'], tractor: ['#d94a3c', '#2e9a4c', '#3a7bd5', '#ff9f1c'], cow: ['#3a2f2a', '#a0642c', '#6b6b78'],
  sheep: ['#ff5a4e', '#3d9bff', '#ffd23f', '#8a63ff'], chicken: ['#ffffff', '#e8b46a', '#ffd23f'], pumpkin: ['#ff9f1c', '#ffd23f', '#9ad04a'],
  slide: P7, swing: P7, seesaw: P7, sandbox: ['#ff5a4e', '#3d9bff', '#4cc96a', '#8a63ff', '#ff9f1c'], kite: P7,
  planet: ['#ff9f1c', '#ff6fb5', '#3d9bff', '#4cc96a', '#8a63ff', '#ffd23f'], rocket: ['#ff5a4e', '#3d9bff', '#4cc96a', '#ff9f1c'], ufo: ['#9aa4b0', '#ff6fb5', '#4cc96a', '#ffd23f'],
  alien: ['#4cc96a', '#8a63ff', '#ff6fb5', '#3d9bff', '#ff9f1c'], flag: ['#ff5a4e', '#3d9bff', '#ffd23f', '#4cc96a'], gem: ['#ff5a8a', '#3dd6ff', '#9a72f0', '#4cc96a', '#ffd23f'],
  building: ['#3b4a7a', '#5a4a8a', '#2f5f7a', '#6a4a5a', '#3f6a5a'], car: ['#ff5a4e', '#3d9bff', '#ffd23f', '#ffffff', '#4cc96a'], cat: ['#333a4a', '#ff9f1c', '#ffffff', '#9aa4b0'],
  firework: ['#ff5a8a', '#ffd23f', '#3dd6ff', '#8aff7a', '#c77dff'],
};
const col = type => MG.pick(COLS[type]);

// each theme builds its list of things; y is the bottom of the thing (or the centre for floating ones)
const SCENES = {
  meadow(add) {
    const sunLeft = Math.random() < 0.5;
    add({ type: 'sun', x: sunLeft ? 40 : 280, y: 38, r: 20, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'cloud', x: 70 + i * 95 + R(-15, 15), y: R(30, 70), s: R(0.8, 1.1) });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'balloon', x: R(40, 280), y: R(55, 100), col: col('balloon') });
    for (let i = 0, n = RI(1, 3); i < n; i++) add({ type: 'bird', x: R(30, 290), y: R(20, 110), flip: Math.random() < 0.5 });
    row5(['house', 'house', 'tree', 'tree', 'tree'], 172, (k, sx) => k === 'house' ? house(sx, 172) : { type: 'tree', x: sx, y: 176, s: R(0.85, 1.1), leaf: MG.pick(['#4cc96a', '#3aa85a', '#79c94a']), fruit: Math.random() < 0.5 }).forEach(add);
    front(RI(5, 7), (fx, fy) => ({ type: 'flower', x: fx, y: fy, col: col('flower'), s: 1 })).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(206, 222), leaf: '#ffb72b' });
  },
  beach(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 38 : 282, y: 34, r: 18, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 90 + i * 110 + R(-15, 15), y: R(26, 56), s: R(0.75, 1) });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'bird', x: R(40, 280), y: R(60, 95), flip: Math.random() < 0.5 });
    const bx = MG.shuffle([R(40, 120), R(200, 280)]);
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'boat', x: bx[i], y: 148 + R(-3, 6), col: col('boat'), sail: MG.pick(['#ffffff', '#ffd23f', '#ff6fb5', '#9ad8ff']), flag: Math.random() < 0.5, s: R(0.85, 1) });
    row5(MG.shuffle(['umbrella', 'umbrella', 'castle', 'crab', 'ball']), 198, (k, sx) => {
      if (k === 'umbrella') return { type: 'umbrella', x: sx, y: 198, col: col('umbrella'), plain: false, s: 1 };
      if (k === 'castle') return { type: 'castle', x: sx, y: 200, col: col('castle'), three: Math.random() < 0.5, s: 1 };
      if (k === 'crab') return { type: 'crab', x: sx, y: 200, col: col('crab'), up: Math.random() < 0.5, s: 1.1 };
      return { type: 'ball', x: sx, y: 200, col: col('ball'), s: 1 };
    }).forEach(add);
    front(RI(4, 6), (fx, fy) => Math.random() < 0.5 ? { type: 'shell', x: fx, y: fy, col: col('shell'), s: 1 } : { type: 'starfish', x: fx, y: fy, col: col('starfish'), s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  sea(add) {
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'jelly', x: i ? R(190, 290) : R(30, 140), y: R(30, 70), col: col('jelly'), s: R(0.9, 1.1) });
    const fy = MG.shuffle([60, 85, 110, 135]);
    for (let i = 0, n = RI(4, 5); i < n; i++) add({ type: 'fish', x: 35 + i * (250 / (n - 1)) + R(-10, 10), y: (fy[i % 4] + R(-10, 10)), col: col('fish'), dir: Math.random() < 0.5 ? -1 : 1, stripe: Math.random() < 0.4, s: R(0.85, 1.1) });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'bubbles', x: 50 + i * 110 + R(-20, 20), y: R(28, 150), n: RI(3, 4) });
    row5(MG.shuffle(['coral', 'coral', 'weed', 'weed', 'chest']), 198, (k, sx) => {
      if (k === 'coral') return { type: 'coral', x: sx, y: 200, col: col('coral'), s: R(0.95, 1.15) };
      if (k === 'weed') return { type: 'weed', x: sx, y: 202, col: col('weed'), s: R(0.9, 1.1) };
      return { type: 'chest', x: sx, y: 202, open: Math.random() < 0.5, s: 1 };
    }).forEach(add);
    front(RI(3, 5), (fx, fy) => Math.random() < 0.5 ? { type: 'shell', x: fx, y: fy, col: col('shell'), s: 1 } : { type: 'starfish', x: fx, y: fy, col: col('starfish'), s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  snow(add) {
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 70 + i * 120 + R(-15, 15), y: R(26, 50), s: R(0.8, 1.05) });
    for (let i = 0, n = RI(3, 4); i < n; i++) add({ type: 'flake', x: 30 + i * (260 / (n - 1)) + R(-12, 12), y: R(66, 112), s: R(0.9, 1.15) });
    if (Math.random() < 0.6) add({ type: 'bird', x: R(40, 280), y: R(20, 45), flip: Math.random() < 0.5 });
    row5(MG.shuffle(['house', 'pine', 'pine', 'snowman', 'pine']), 174, (k, sx) => {
      if (k === 'house') return Object.assign(house(sx, 174), { snow: true });
      if (k === 'pine') return { type: 'pine', x: sx, y: 178, col: col('pine'), star: Math.random() < 0.5, s: R(0.9, 1.1) };
      return { type: 'snowman', x: sx, y: 178, hat: MG.pick(['#333a4a', '#d94a3c', '#3a7bd5']), scarf: MG.pick(['#ff5a4e', '#4cc96a', '#ffd23f', '#8a63ff']), btn: RI(2, 3), s: 1 };
    }).forEach(add);
    front(RI(3, 4), (fx, fy) => Math.random() < 0.65 ? { type: 'gift', x: fx, y: fy, col: col('gift'), rib: MG.pick(['#ffd23f', '#ffffff', '#ff5a4e']), bow: true, s: 1 } : { type: 'snowman', x: fx, y: fy + 2, hat: MG.pick(['#333a4a', '#d94a3c']), scarf: MG.pick(['#ff5a4e', '#4cc96a']), btn: 2, s: 0.6 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(210, 224), leaf: '#ffb72b' });
  },
  candy(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 40 : 280, y: 36, r: 18, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 90 + i * 110 + R(-15, 15), y: R(30, 60), s: R(0.8, 1) });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'heart', x: 50 + i * 100 + R(-20, 20), y: R(70, 110), col: col('heart'), s: R(0.9, 1.1) });
    if (Math.random() < 0.6) add({ type: 'balloon', x: R(40, 280), y: R(50, 90), col: col('balloon') });
    row5(MG.shuffle(['cupcake', 'lolly', 'icecream', 'lolly', 'cupcake']), 196, (k, sx) => {
      if (k === 'cupcake') return { type: 'cupcake', x: sx, y: 198, col: col('cupcake'), cherry: Math.random() < 0.6, s: 1.15 };
      if (k === 'lolly') return { type: 'lolly', x: sx, y: 200, col: col('lolly'), plain: false, s: 1.05 };
      return { type: 'icecream', x: sx, y: 200, col: col('icecream'), col2: col('icecream'), two: Math.random() < 0.5, s: 1.05 };
    }).forEach(add);
    front(RI(3, 4), (fx, fy) => ({ type: 'donut', x: fx, y: fy, col: col('donut'), spr: Math.random() < 0.6, s: 0.85 })).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
};
Object.assign(SCENES, {
  farm(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 40 : 280, y: 36, r: 19, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'cloud', x: 70 + i * 95 + R(-15, 15), y: R(28, 62), s: R(0.8, 1.05) });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'bird', x: R(40, 280), y: R(60, 100), flip: Math.random() < 0.5 });
    row5(MG.shuffle(['barn', 'tractor', 'cow', 'sheep', 'hay']), 190, (k, sx) => {
      if (k === 'barn') return { type: 'barn', x: sx, y: 186, col: col('barn'), open: Math.random() < 0.5, hay: Math.random() < 0.5, s: 1 };
      if (k === 'tractor') return { type: 'tractor', x: sx, y: 192, col: col('tractor'), smoke: Math.random() < 0.5, s: 1 };
      if (k === 'cow') return { type: 'cow', x: sx, y: 192, col: col('cow'), dir: Math.random() < 0.5 ? -1 : 1, bell: Math.random() < 0.5, s: 1.1 };
      if (k === 'sheep') return { type: 'sheep', x: sx, y: 192, col: col('sheep'), dir: Math.random() < 0.5 ? -1 : 1, s: 1.1 };
      return { type: 'hay', x: sx, y: 192, fork: Math.random() < 0.5, s: 1 };
    }).forEach(add);
    front(RI(4, 5), (fx, fy) => Math.random() < 0.55 ? { type: 'chicken', x: fx, y: fy, col: col('chicken'), dir: Math.random() < 0.5 ? -1 : 1, s: 1 } : { type: 'pumpkin', x: fx, y: fy, col: col('pumpkin'), leaf: Math.random() < 0.5, s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  play(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 40 : 280, y: 36, r: 18, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 90 + i * 110 + R(-15, 15), y: R(28, 56), s: R(0.8, 1) });
    const kx = MG.shuffle([R(40, 120), R(200, 280)]);
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'kite', x: kx[i], y: R(70, 100), col: col('kite'), tail: RI(2, 3), s: 1 });
    if (Math.random() < 0.6) add({ type: 'balloon', x: R(130, 190), y: R(60, 90), col: col('balloon') });
    row5(MG.shuffle(['slide', 'swing', 'seesaw', 'sandbox', 'tree']), 198, (k, sx) => {
      if (k === 'slide') return { type: 'slide', x: sx, y: 198, col: col('slide'), rungs: RI(3, 4), s: 1 };
      if (k === 'swing') return { type: 'swing', x: sx, y: 198, col: col('swing'), two: Math.random() < 0.5, s: 1 };
      if (k === 'seesaw') return { type: 'seesaw', x: sx, y: 200, col: col('seesaw'), tilt: Math.random() < 0.5 ? -1 : 1, s: 1 };
      if (k === 'sandbox') return { type: 'sandbox', x: sx, y: 202, col: col('sandbox'), bucket: Math.random() < 0.5, s: 1 };
      return { type: 'tree', x: sx, y: 196, s: R(0.85, 1), leaf: MG.pick(['#4cc96a', '#3aa85a', '#79c94a']), fruit: Math.random() < 0.5 };
    }).forEach(add);
    front(RI(3, 5), (fx, fy) => Math.random() < 0.5 ? { type: 'ball', x: fx, y: fy, col: col('ball'), s: 0.9 } : { type: 'flower', x: fx, y: fy, col: col('flower'), s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  space(add) {
    const px = MG.shuffle([R(36, 110), R(210, 284)]);
    for (let i = 0; i < 2; i++) add({ type: 'planet', x: px[i], y: R(36, 70), col: col('planet'), ring: Math.random() < 0.5, s: R(0.9, 1.15) });
    add({ type: 'rocket', x: R(140, 180), y: R(50, 80), col: col('rocket'), flame: Math.random() < 0.5, s: 1 });

function overPanel(rec) {

    buttons: [{ label: '再玩一次', on: () => newGame('timed', level) }, { label: '🐢 慢慢找', alt: true, on: () => newGame('relax', level) }, { label: '看一下答案', alt: true, on: () => { MG.hide(); MG.toast('Look 👀 then tap 👆', 2000); } }],

cv.addEventListener('pointerdown', () => { if (state === 'over' && !MG.panelOpen()) overPanel({ isNew: false, best: MG.best('spot') }); });

  if (MG.store.get('spot.pick.theme', null) == null) MG.store.set('spot.pick.theme', themePick);
  const best = Math.max(MG.store.get('spot.relax', 0), MG.best('spot') || 0);
  MG.choose({
    id: 'spot', title: '大家來找碴',
    html: `<p>兩張圖有幾個地方不一樣，點左邊或右邊都可以！💡 提示會閃出其中一個。每關都是新畫的圖，玩不完 ^_^</p><p>30 關有 9 種圖，還有 🪞 鏡子圖、🔦 手電筒、📸 變魔術三種新玩法！</p>`,
    picks: [{ key: 'theme', title: '要找哪一種圖？', options: [{ id: 'mix', label: '🎲 跟著關卡' }, ...THEMES.map(t => ({ id: t.id, label: t.name }))] }],
    modes: [{ id: 'relax', label: '🐢 慢慢找', sub: '不限時間・提示用不完' }, { id: 'timed', label: '⏱ 限時挑戰', sub: '點錯扣 2 秒・提示 3 個' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => { const L = LV(n); return `${n}　${L.th === 'mix' ? '🎲 大混合' : THEMES.find(t => t.id === L.th).name}・${L.n} 個${L.k ? '・' + KNAME[L.k] : ''}${n <= best ? ' ✓' : ''}`; },
      short: n => { const L = LV(n); return `${n}${L.k === 'mirror' ? '🪞' : L.k === 'dark' ? '🔦' : L.k === 'magic' ? '📸' : ''}`; } },

level = 1; hints = HINTS; makeLevel(); left = 0; hud();
menu();
window.SPT = { get state() { return state; }, get level() { return level; }, get kind() { return KIND; }, get n() { return NDIFF; }, get theme() { return theme; }, start: (lv, m = 'relax') => newGame(m, lv), go: () => { if (state === 'intro') { MG.hide(); state = KIND === 'magic' ? 'look' : 'play'; if (KIND === 'magic') lookMax = look = 3; } }, endLook: () => endLook(),

  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; } };
MG.loop(dt => {
  t += dt; hintT = Math.max(0, hintT - dt);
  for (const w of wrongs) w.life -= dt; wrongs = wrongs.filter(w => w.life > 0);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);

  peek = Math.max(0, peek - dt);

  draw();
