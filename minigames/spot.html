<!doctype html>
<html lang="zh-Hant">

<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'spot', title: '大家來找碴', stats: ['level', 'time'] });
const SW = 320, SH = 240, NDIFF = 5, HINTS = 3;
const cv = document.getElementById('cv'), x = cv.getContext('2d');
let land = false, U = 1, HH = 48, TWO = false, PL = [[10, 50, 1], [340, 50, 1]];
// the canvas takes the whole stage (1 logical px ≈ 1 CSS px); the two pictures are scaled up as far as they fit
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  const W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  const H = Math.max(260, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  return [W, H];
});
function layout() {
  const W = cv.lw, H = cv.lh, g = 8;
  U = Math.max(1, Math.min(1.5, Math.min(W, H) / 420)) * MG.textScale;
  // header strip: words, found dots, 💡 button — on a tall phone the words get their own line above the dots and the button
  TWO = H > W * 1.3 && W < 600;
  HH = Math.round(Math.max(56, 46 * U) + (TWO ? 22 * U + 6 : 0));
  const ah = H - HH - g, aw = W - g * 2;
  // side by side or one above the other — whichever makes the pictures bigger
  const sSide = Math.min((aw - g * 2) / (SW * 2), (ah - g) / SH), sStack = Math.min(aw / SW, (ah - g * 3) / (SH * 2));
  land = sSide > sStack;
  const ps = Math.max(0.5, land ? sSide : sStack), pw = SW * ps, ph = SH * ps;
  if (land) { const x0 = (W - pw * 2 - g * 2) / 2, y0 = HH + (ah - ph) / 2; PL = [[x0, y0, ps], [x0 + pw + g * 2, y0, ps]]; }
  else { const x0 = (W - pw) / 2, gap = Math.max(g * 2, (ah - ph * 2) / 3), y0 = HH + (ah - ph * 2 - gap) / 2; PL = [[x0, y0, ps], [x0, y0 + ph + gap, ps]]; }
}
cv.onfit = layout; layout();
addEventListener('mg-big', layout);
// panel origins + scale (each scene is drawn in its own 320×240 space)
const panels = () => PL;

const PAL = ['#ff5a4e', '#ff9f1c', '#ffd23f', '#4cc96a', '#3d9bff', '#8a63ff', '#ff6fb5', '#ffffff', '#6b4a22'];
let sceneSeed = 1, sceneBg = null, sceneBgKey = '', foundAt = [];
let mode = MG.store.get('spot.mode', 'relax');   // 'timed' | 'relax'
let level, left, scene, diffs, found, wrongs = [], state = 'ready', hints, hintT = 0, hintD = null, t = 0, total = 0, floats = [];


// ---------- picture themes ----------
const THEMES = [
  { id: 'meadow', name: '🏡 草原小鎮' },
  { id: 'beach', name: '🏖️ 海邊沙灘' },
  { id: 'sea', name: '🐠 海底世界' },
  { id: 'snow', name: '⛄ 下雪天' },
  { id: 'candy', name: '🍭 糖果王國' },
];
let theme = 'meadow', lastTheme = '', themePick = MG.store.get('spot.theme', 'mix');
if (themePick !== 'mix' && !THEMES.some(t => t.id === themePick)) themePick = 'mix';
function pickTheme() {
  if (themePick !== 'mix') return themePick;
  const pool = THEMES.map(t => t.id).filter(id => id !== lastTheme);
  return MG.pick(pool);
}

// ---------- scene generation ----------
const R = MG.rand, RI = MG.randi;
const P7 = PAL.slice(0, 7);
function otherColor(c, pool = PAL) { let n; do n = MG.pick(pool); while (n === c); return n; }
// colour pools per element type (a "colour" difference picks another one from the same pool)
const COLS = {
  balloon: P7, flower: P7, umbrella: P7, castle: P7, ball: P7, gift: P7, lolly: P7,
  boat: ['#d94a3c', '#3a7bd5', '#ffffff', '#ff9f1c', '#2e9a4c'],
  crab: ['#ff5a4e', '#ff9f1c', '#8a63ff', '#3d9bff'],
  shell: ['#ffb3cc', '#ffd98a', '#ffffff', '#c9b3ff'],
  starfish: ['#ff9f1c', '#ff6fb5', '#ff5a4e', '#ffd23f', '#8a63ff'],
  fish: ['#ff9f1c', '#ffd23f', '#ff6fb5', '#ff5a4e', '#8a63ff', '#4cc96a'],
  coral: ['#ff6f91', '#ff9f1c', '#b06fff', '#ff5a4e', '#ffd23f'],
  weed: ['#3aa85a', '#9ad04a', '#1f8a7a'],
  jelly: ['#ff9fd0', '#b49cff', '#ffd23f', '#ff8a5c'],
  pine: ['#ff5a4e', '#ffd23f', '#3d9bff', '#ff6fb5'],
  cupcake: ['#fff1f6', '#ff9fcf', '#a8e0ff', '#fff07a', '#c9b3ff'],
  icecream: ['#ffb3cf', '#fff3c4', '#a8e0ff', '#8a5a34', '#b6eb9a'],
  donut: ['#ff9fcf', '#8a5a34', '#ffffff', '#7fd0ff', '#ffe36b'],
  heart: ['#ff5a8a', '#ff9f1c', '#8a63ff', '#3d9bff'],
};
const col = type => MG.pick(COLS[type]);

// each theme builds its list of things; y is the bottom of the thing (or the centre for floating ones)
const SCENES = {
  meadow(add) {
    const sunLeft = Math.random() < 0.5;
    add({ type: 'sun', x: sunLeft ? 40 : 280, y: 38, r: 20, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'cloud', x: 70 + i * 95 + R(-15, 15), y: R(30, 70), s: R(0.8, 1.1) });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'balloon', x: R(40, 280), y: R(55, 100), col: col('balloon') });
    for (let i = 0, n = RI(1, 3); i < n; i++) add({ type: 'bird', x: R(30, 290), y: R(20, 110), flip: Math.random() < 0.5 });
    row5(['house', 'house', 'tree', 'tree', 'tree'], 172, (k, sx) => k === 'house' ? house(sx, 172) : { type: 'tree', x: sx, y: 176, s: R(0.85, 1.1), leaf: MG.pick(['#4cc96a', '#3aa85a', '#79c94a']), fruit: Math.random() < 0.5 }).forEach(add);
    front(RI(5, 7), (fx, fy) => ({ type: 'flower', x: fx, y: fy, col: col('flower'), s: 1 })).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(206, 222), leaf: '#ffb72b' });
  },
  beach(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 38 : 282, y: 34, r: 18, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 90 + i * 110 + R(-15, 15), y: R(26, 56), s: R(0.75, 1) });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'bird', x: R(40, 280), y: R(60, 95), flip: Math.random() < 0.5 });
    const bx = MG.shuffle([R(40, 120), R(200, 280)]);
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'boat', x: bx[i], y: 148 + R(-3, 6), col: col('boat'), sail: MG.pick(['#ffffff', '#ffd23f', '#ff6fb5', '#9ad8ff']), flag: Math.random() < 0.5, s: R(0.85, 1) });
    row5(MG.shuffle(['umbrella', 'umbrella', 'castle', 'crab', 'ball']), 198, (k, sx) => {
      if (k === 'umbrella') return { type: 'umbrella', x: sx, y: 198, col: col('umbrella'), plain: false, s: 1 };
      if (k === 'castle') return { type: 'castle', x: sx, y: 200, col: col('castle'), three: Math.random() < 0.5, s: 1 };
      if (k === 'crab') return { type: 'crab', x: sx, y: 200, col: col('crab'), up: Math.random() < 0.5, s: 1.1 };
      return { type: 'ball', x: sx, y: 200, col: col('ball'), s: 1 };
    }).forEach(add);
    front(RI(4, 6), (fx, fy) => Math.random() < 0.5 ? { type: 'shell', x: fx, y: fy, col: col('shell'), s: 1 } : { type: 'starfish', x: fx, y: fy, col: col('starfish'), s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  sea(add) {
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'jelly', x: i ? R(190, 290) : R(30, 140), y: R(30, 70), col: col('jelly'), s: R(0.9, 1.1) });
    const fy = MG.shuffle([60, 85, 110, 135]);
    for (let i = 0, n = RI(4, 5); i < n; i++) add({ type: 'fish', x: 35 + i * (250 / (n - 1)) + R(-10, 10), y: (fy[i % 4] + R(-10, 10)), col: col('fish'), dir: Math.random() < 0.5 ? -1 : 1, stripe: Math.random() < 0.4, s: R(0.85, 1.1) });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'bubbles', x: 50 + i * 110 + R(-20, 20), y: R(28, 150), n: RI(3, 4) });
    row5(MG.shuffle(['coral', 'coral', 'weed', 'weed', 'chest']), 198, (k, sx) => {
      if (k === 'coral') return { type: 'coral', x: sx, y: 200, col: col('coral'), s: R(0.95, 1.15) };
      if (k === 'weed') return { type: 'weed', x: sx, y: 202, col: col('weed'), s: R(0.9, 1.1) };
      return { type: 'chest', x: sx, y: 202, open: Math.random() < 0.5, s: 1 };
    }).forEach(add);
    front(RI(3, 5), (fx, fy) => Math.random() < 0.5 ? { type: 'shell', x: fx, y: fy, col: col('shell'), s: 1 } : { type: 'starfish', x: fx, y: fy, col: col('starfish'), s: 1 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
  snow(add) {
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 70 + i * 120 + R(-15, 15), y: R(26, 50), s: R(0.8, 1.05) });
    for (let i = 0, n = RI(3, 4); i < n; i++) add({ type: 'flake', x: 30 + i * (260 / (n - 1)) + R(-12, 12), y: R(66, 112), s: R(0.9, 1.15) });
    if (Math.random() < 0.6) add({ type: 'bird', x: R(40, 280), y: R(20, 45), flip: Math.random() < 0.5 });
    row5(MG.shuffle(['house', 'pine', 'pine', 'snowman', 'pine']), 174, (k, sx) => {
      if (k === 'house') return Object.assign(house(sx, 174), { snow: true });
      if (k === 'pine') return { type: 'pine', x: sx, y: 178, col: col('pine'), star: Math.random() < 0.5, s: R(0.9, 1.1) };
      return { type: 'snowman', x: sx, y: 178, hat: MG.pick(['#333a4a', '#d94a3c', '#3a7bd5']), scarf: MG.pick(['#ff5a4e', '#4cc96a', '#ffd23f', '#8a63ff']), btn: RI(2, 3), s: 1 };
    }).forEach(add);
    front(RI(3, 4), (fx, fy) => Math.random() < 0.65 ? { type: 'gift', x: fx, y: fy, col: col('gift'), rib: MG.pick(['#ffd23f', '#ffffff', '#ff5a4e']), bow: true, s: 1 } : { type: 'snowman', x: fx, y: fy + 2, hat: MG.pick(['#333a4a', '#d94a3c']), scarf: MG.pick(['#ff5a4e', '#4cc96a']), btn: 2, s: 0.6 }).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(210, 224), leaf: '#ffb72b' });
  },
  candy(add) {
    add({ type: 'sun', x: Math.random() < 0.5 ? 40 : 280, y: 36, r: 18, col: '#ffd23f', rays: true });
    for (let i = 0, n = RI(1, 2); i < n; i++) add({ type: 'cloud', x: 90 + i * 110 + R(-15, 15), y: R(30, 60), s: R(0.8, 1) });
    for (let i = 0, n = RI(2, 3); i < n; i++) add({ type: 'heart', x: 50 + i * 100 + R(-20, 20), y: R(70, 110), col: col('heart'), s: R(0.9, 1.1) });
    if (Math.random() < 0.6) add({ type: 'balloon', x: R(40, 280), y: R(50, 90), col: col('balloon') });
    row5(MG.shuffle(['cupcake', 'lolly', 'icecream', 'lolly', 'cupcake']), 196, (k, sx) => {
      if (k === 'cupcake') return { type: 'cupcake', x: sx, y: 198, col: col('cupcake'), cherry: Math.random() < 0.6, s: 1.15 };
      if (k === 'lolly') return { type: 'lolly', x: sx, y: 200, col: col('lolly'), plain: false, s: 1.05 };
      return { type: 'icecream', x: sx, y: 200, col: col('icecream'), col2: col('icecream'), two: Math.random() < 0.5, s: 1.05 };
    }).forEach(add);
    front(RI(3, 4), (fx, fy) => ({ type: 'donut', x: fx, y: fy, col: col('donut'), spr: Math.random() < 0.6, s: 0.85 })).forEach(add);
    add({ type: 'pupu', x: R(60, 260), y: R(212, 226), leaf: '#ffb72b' });
  },
};
function house(sx, y) { return { type: 'house', x: sx, y, wall: MG.pick(['#ffe0b0', '#ffd0d0', '#d6ecff', '#e5ffd0']), roof: MG.pick(['#d94a3c', '#3a7bd5', '#7a4fbf', '#2e9a4c']), win: RI(1, 2), door: Math.random() < 0.5 ? -1 : 1 }; }
// five evenly spaced slots along the ground
function row5(kinds, y, make) { const slots = MG.shuffle([0, 1, 2, 3, 4]); return slots.map((s, i) => make(kinds[i], 32 + s * 64 + R(-6, 6))); }
// small things in the front strip
function front(n, make) { const out = []; for (let i = 0; i < n; i++) out.push(make(18 + i * (290 / n) + R(-8, 8), R(212, 232))); return out; }
// what can be added as a difference, per theme: [sky/water thing, ground thing]
const ADDS = {
  meadow: [(nx, ny) => ({ type: 'star', x: nx, y: ny }), (nx, ny) => ({ type: 'flower', x: nx, y: ny, col: col('flower'), s: 1 })],
  beach: [(nx, ny) => ({ type: 'bird', x: nx, y: ny, flip: Math.random() < 0.5 }), (nx, ny) => ({ type: 'starfish', x: nx, y: ny, col: col('starfish'), s: 1 })],
  sea: [(nx, ny) => ({ type: 'bubbles', x: nx, y: ny, n: 3 }), (nx, ny) => ({ type: 'shell', x: nx, y: ny, col: col('shell'), s: 1 })],
  snow: [(nx, ny) => ({ type: 'flake', x: nx, y: ny, s: 1 }), (nx, ny) => ({ type: 'gift', x: nx, y: ny, col: col('gift'), rib: '#ffd23f', bow: true, s: 0.9 })],
  candy: [(nx, ny) => ({ type: 'heart', x: nx, y: ny, col: col('heart'), s: 1 }), (nx, ny) => ({ type: 'donut', x: nx, y: ny, col: col('donut'), spr: true, s: 0.8 })],
};
function makeScene() {
  const els = [];
  SCENES[theme](e => { e.id = els.length; els.push(e); });
  return els;
}
function bound(e) { // center + radius used for clicking
  const s = e.s || 1;
  switch (e.type) {
    case 'sun': return [e.x, e.y, e.r + 8];
    case 'cloud': return [e.x + 18 * s, e.y, 30 * s];
    case 'balloon': return [e.x, e.y + 6, 16 * s];
    case 'bird': return [e.x, e.y, 14];
    case 'star': return [e.x, e.y, 12];
    case 'house': return [e.x, e.y - 22, 28];
    case 'tree': return [e.x, e.y - 30 * s, 26 * s];
    case 'flower': return [e.x, e.y - 6, 12 * s];
    case 'pupu': return [e.x, e.y - 4, 16];
    case 'boat': return [e.x, e.y - 18 * s, 23 * s];
    case 'umbrella': return [e.x, e.y - 24 * s, 23 * s];
    case 'castle': return [e.x, e.y - 18 * s, 21 * s];
    case 'crab': return [e.x, e.y - 7 * s, 15 * s];
    case 'ball': return [e.x, e.y - 9 * s, 12 * s];
    case 'shell': return [e.x, e.y - 4 * s, 10 * s];
    case 'starfish': return [e.x, e.y - 5 * s, 11 * s];
    case 'fish': return [e.x, e.y, 17 * s];
    case 'coral': return [e.x, e.y - 17 * s, 18 * s];
    case 'weed': return [e.x, e.y - 22 * s, 14 * s];
    case 'bubbles': return [e.x, e.y - 8, 13];
    case 'jelly': return [e.x, e.y + 4 * s, 15 * s];
    case 'chest': return [e.x, e.y - 12 * s, 19 * s];
    case 'snowman': return [e.x, e.y - 24 * s, 21 * s];
    case 'pine': return [e.x, e.y - 26 * s, 23 * s];
    case 'gift': return [e.x, e.y - 9 * s, 13 * s];
    case 'flake': return [e.x, e.y, 11 * s];
    case 'cupcake': return [e.x, e.y - 14 * s, 15 * s];
    case 'lolly': return [e.x, e.y - 22 * s, 15 * s];
    case 'icecream': return [e.x, e.y - 20 * s, 17 * s];
    case 'donut': return [e.x, e.y - 7 * s, 14 * s];
    case 'heart': return [e.x, e.y, 12 * s];
  }
  return [e.x, e.y, 14];
}
const REMOVABLE = new Set(['cloud', 'balloon', 'bird', 'flower', 'tree', 'shell', 'starfish', 'ball', 'crab', 'fish', 'weed', 'bubbles', 'jelly', 'flake', 'gift', 'heart', 'donut', 'pine', 'lolly', 'boat']);
const SIZABLE = new Set(['sun', 'balloon', 'flower', 'cloud', 'tree', 'fish', 'coral', 'jelly', 'starfish', 'shell', 'snowman', 'pine', 'cupcake', 'lolly', 'icecream', 'heart', 'flake', 'umbrella', 'castle', 'crab', 'donut', 'gift']);
const SMALL = new Set(['flower', 'starfish', 'shell', 'heart', 'flake', 'donut', 'gift', 'crab', 'balloon']);
function recolor(e) {
  switch (e.type) {
    case 'house': if (Math.random() < 0.5) e.roof = otherColor(e.roof, ['#d94a3c', '#3a7bd5', '#7a4fbf', '#2e9a4c', '#ff9f1c']); else e.wall = otherColor(e.wall, ['#ffe0b0', '#ffd0d0', '#d6ecff', '#e5ffd0', '#fff3a0']); return true;
    case 'tree': e.leaf = e.leaf === '#79c94a' ? '#2f8a48' : '#79c94a'; e.leaf2 = true; return true;
    case 'pupu': e.leaf = '#ff5a8a'; return true;
    case 'cloud': e.gray = true; return true;
    case 'bird': e.blue = true; return true;
    case 'boat': if (Math.random() < 0.5) e.col = otherColor(e.col, COLS.boat); else e.sail = otherColor(e.sail, ['#ffffff', '#ffd23f', '#ff6fb5', '#9ad8ff', '#ff5a4e']); return true;
    case 'snowman': if (Math.random() < 0.5) e.hat = otherColor(e.hat, ['#333a4a', '#d94a3c', '#3a7bd5', '#2e9a4c']); else e.scarf = otherColor(e.scarf, ['#ff5a4e', '#4cc96a', '#ffd23f', '#8a63ff', '#3d9bff']); return true;
    case 'icecream': if (e.two && Math.random() < 0.5) e.col2 = otherColor(e.col2, COLS.icecream); else e.col = otherColor(e.col, COLS.icecream); return true;
  }
  if (e.col && COLS[e.type]) { e.col = otherColor(e.col, COLS[e.type]); return true; }
  return false;
}
function detail(e) {
  switch (e.type) {
    case 'house': if (Math.random() < 0.5) e.win = e.win === 1 ? 2 : 1; else e.door *= -1; return true;
    case 'tree': e.fruit = !e.fruit; return true;
    case 'sun': e.rays = !e.rays; return true;
    case 'bird': e.flip = !e.flip; return true;
    case 'pupu': e.closed = true; return true;
    case 'boat': e.flag = !e.flag; return true;
    case 'umbrella': e.plain = !e.plain; return true;
    case 'castle': e.three = !e.three; return true;
    case 'crab': e.up = !e.up; return true;
    case 'fish': if (Math.random() < 0.5) e.stripe = !e.stripe; else e.dir *= -1; return true;
    case 'bubbles': e.n = e.n === 3 ? 4 : 3; return true;
    case 'chest': e.open = !e.open; return true;
    case 'snowman': e.btn = e.btn === 2 ? 3 : 2; return true;
    case 'pine': e.star = !e.star; return true;
    case 'gift': e.bow = !e.bow; return true;
    case 'cupcake': e.cherry = !e.cherry; return true;
    case 'lolly': e.plain = !e.plain; return true;
    case 'icecream': e.two = !e.two; if (e.two && !e.col2) e.col2 = col('icecream'); return true;
    case 'donut': e.spr = !e.spr; return true;
  }
  return false;
}
function makeLevel() {
  theme = pickTheme(); lastTheme = theme;
  const base = makeScene();
  const a = structuredClone(base), b = structuredClone(base);
  diffs = [];
  const used = new Set();
  const far = (cx, cy, cr) => diffs.every(d => Math.hypot(d.x - cx, d.y - cy) > d.r + cr * 0.5 + 14);
  let guard = 0;
  while (diffs.length < NDIFF && guard++ < 400) {
    const side = Math.random() < 0.5 ? a : b;
    const kind = MG.pick(['color', 'color', 'remove', 'add', 'size', 'detail', 'detail']);
    if (kind === 'add') {
      const sky = Math.random() < 0.5;
      const nx = R(30, 290), ny = sky ? R(30, 110) : R(208, 228);
      const el = ADDS[theme][sky ? 0 : 1](nx, ny);
      const bb = bound(el);
      if (!far(bb[0], bb[1], bb[2]) || base.some(e => { const q = bound(e); return Math.hypot(q[0] - bb[0], q[1] - bb[1]) < q[2] + bb[2] - 4; })) continue;
      el.id = 1000 + diffs.length; side.push(el); diffs.push({ x: bb[0], y: bb[1], r: Math.max(bb[2], 14) });
      continue;
    }
    const cand = side.filter(e => !used.has(e.id) && e.id < 1000);
    if (!cand.length) continue;
    const e = MG.pick(cand), [cx, cy, cr] = bound(e);
    if (!far(cx, cy, cr)) continue;

      if (!e.plain) { x.strokeStyle = '#ffffff'; x.lineWidth = 2.4; x.beginPath(); for (let a = 0; a < Math.PI * 5.2; a += 0.2) { const r = a * 1.75 / Math.PI; x.lineTo(Math.cos(a) * r, -25 + Math.sin(a) * r); } x.stroke(); }
      x.fillStyle = 'rgba(255,255,255,.45)'; blob(-4, -30, 3, 1.8);
      break;
    }
    case 'icecream': {
      groundShadow(7, 0.15);
      x.fillStyle = '#e0a85a'; x.beginPath(); x.moveTo(-8, -15); x.lineTo(8, -15); x.lineTo(0, 1); x.closePath(); x.fill(); x.stroke();
      x.strokeStyle = 'rgba(140,90,30,.6)'; x.lineWidth = 1; for (const d of [-4, 0, 4]) { x.beginPath(); x.moveTo(-8 + (d + 4), -15); x.lineTo(d / 2 + 2, -4); x.moveTo(8 - (d + 4), -15); x.lineTo(-d / 2 - 2, -4); x.stroke(); }
      if (e.two) { x.fillStyle = e.col2 || e.col; x.beginPath(); x.arc(0, -29, 7.5, 0, 7); x.fill(); x.strokeStyle = 'rgba(0,0,0,.2)'; x.stroke(); }
      x.fillStyle = e.col; x.beginPath(); x.arc(0, -18, 8.5, Math.PI * 0.95, Math.PI * 2.05); x.quadraticCurveTo(6, -13, 3, -15); x.quadraticCurveTo(0, -12, -3, -15); x.quadraticCurveTo(-6, -13, -8.5, -16); x.fill(); x.strokeStyle = 'rgba(0,0,0,.2)'; x.stroke();
      x.fillStyle = 'rgba(255,255,255,.5)'; blob(-3, -22, 2.6, 1.6);

      x.fillStyle = e.col; x.beginPath(); x.ellipse(0, -8, 11, 6.8, 0, 0, 7); x.fill();
      if (e.spr) { const cs = ['#ff5a4e', '#3d9bff', '#4cc96a', '#ffd23f', '#ffffff', '#8a63ff']; for (let i = 0; i < 10; i++) { const a = i * 0.63, r = i % 2 ? 8 : 6; x.save(); x.translate(Math.cos(a) * r, -8 + Math.sin(a) * r * 0.6); x.rotate(a * 2); x.fillStyle = cs[i % cs.length]; x.fillRect(-1.6, -0.6, 3.2, 1.2); x.restore(); } }
      x.fillStyle = '#c48d4a'; blob(0, -8, 3.6, 2.4); x.fillStyle = '#fff3dc'; blob(0, -8.4, 2.6, 1.6);
      break;
    }
    case 'heart': {
      x.fillStyle = e.col; x.beginPath(); x.moveTo(0, 7); x.bezierCurveTo(-12, -1, -8, -11, 0, -5); x.bezierCurveTo(8, -11, 12, -1, 0, 7); x.fill(); x.strokeStyle = 'rgba(0,0,0,.25)'; x.stroke();
      x.fillStyle = 'rgba(255,255,255,.55)'; blob(-4, -4, 2.2, 1.3);

}
function draw() {
  const [w, h] = [cv.lw, cv.lh];

  // header: found dots + hint button

  const bh = HH - r1 - 6, bw = Math.round(Math.max(96, Math.min(w * 0.3, 92 * U)));
  hintBtn = { x: w - bw - 8, y: hy - bh / 2, w: bw, h: bh };
  const dr = Math.round(Math.max(6, 7 * U)), dg = dr * 2 + Math.round(5 * U), dx1 = TWO ? 12 + dr : hintBtn.x - 12 - dr - (NDIFF - 1) * dg;
  for (let i = 0; i < NDIFF; i++) { x.fillStyle = found[i] ? '#ff5a4e' : big ? '#c9b07a' : '#e2cf9c'; x.beginPath(); x.arc(dx1 + i * dg, hy, dr, 0, 7); x.fill(); if (big && !found[i]) { x.strokeStyle = '#8a6a2a'; x.lineWidth = 1.5; x.stroke(); } }
  const fitFont = (txt, maxW, px) => { let fs = px; x.font = `${wt} ${fs}px "Noto Sans TC",system-ui,sans-serif`; while (fs > 10 && x.measureText(txt).width > maxW) { fs--; x.font = `${wt} ${fs}px "Noto Sans TC",system-ui,sans-serif`; } };
  x.textBaseline = 'middle'; x.textAlign = 'left'; x.fillStyle = ink;
  if (TWO) { fitFont('找出 5 個不一樣', w - 24, Math.round(17 * U)); x.fillText('找出 5 個不一樣', 12, r1 / 2 + 6); }
  else { fitFont('找出 5 個不一樣', dx1 - dr - 22, Math.round(16 * U)); x.fillText('找出 5 個不一樣', 12, hy); }
  x.fillStyle = (mode === 'relax' || hints > 0) && state === 'play' ? '#ffd23f' : '#eee2c0'; x.strokeStyle = big ? '#8a6400' : '#c99a00'; x.lineWidth = big ? 3 : 2;
  x.beginPath(); x.roundRect(hintBtn.x, hintBtn.y, hintBtn.w, hintBtn.h, 10); x.fill(); x.stroke();
  const ht = mode === 'relax' ? '💡 提示' : `💡 提示 ${hints}`;
  x.fillStyle = ink; x.textAlign = 'center'; fitFont(ht, bw - 10, Math.round(Math.min(bh * 0.42, 16 * U))); x.fillText(ht, hintBtn.x + hintBtn.w / 2, hy + 1);
  const ps = panels();
  ps.forEach(([ox, oy, sc], i) => {
    x.fillStyle = '#c9a95a'; x.beginPath(); x.roundRect(ox - 4, oy - 4, SW * sc + 8, SH * sc + 8, 12); x.fill();
    drawScene(scene[i], ox, oy, sc);
    x.save(); x.translate(ox, oy); x.scale(sc, sc);
    diffs.forEach((d, k) => { if (!found[k]) return;
      const age = state === 'over' ? 1 : Math.min(1, (t - foundAt[k]) / 0.3), r0 = d.r + 3;
      x.strokeStyle = '#ff2d2d'; x.lineWidth = 3; x.lineCap = 'round';
      x.beginPath(); x.ellipse(d.x, d.y, r0 + 1, r0 - 1, -0.2, -1, -1 + age * Math.PI * 2.15); x.stroke();
      x.strokeStyle = 'rgba(255,45,45,.45)'; x.lineWidth = 1.5; x.beginPath(); x.ellipse(d.x + 1, d.y - 1, r0 + 3, r0 + 1, 0.1, 0, age * Math.PI * 2); x.stroke(); });
    if (hintD && hintT > 0 && Math.floor(hintT * 6) % 2 === 0) { x.strokeStyle = '#ffd23f'; x.lineWidth = 4; x.setLineDash([6, 5]); x.beginPath(); x.arc(hintD.x, hintD.y, hintD.r + 12, 0, 7); x.stroke(); x.setLineDash([]); }
    for (const wr of wrongs) { x.globalAlpha = Math.min(1, wr.life * 2); x.strokeStyle = '#3a7bd5'; x.lineWidth = 4; x.lineCap = 'round'; x.beginPath(); x.moveTo(wr.x - 9, wr.y - 9); x.lineTo(wr.x + 9, wr.y + 9); x.moveTo(wr.x + 9, wr.y - 9); x.lineTo(wr.x - 9, wr.y + 9); x.stroke(); }
    x.globalAlpha = 1;
    x.restore();
  });

}
// short English + emoji words that float up where you tapped
function drawFloats() {
  const [w, h] = [cv.lw, cv.lh];
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    const k = f.life / f.max, pop = k > 0.85 ? 1 + (k - 0.85) * 3 : 1;
    let sz = f.size;
    x.font = `900 ${sz}px system-ui,"Noto Sans TC",sans-serif`;
    let tw = x.measureText(f.text).width;
    if (tw > w - 16) { sz = Math.floor(sz * (w - 16) / tw); x.font = `900 ${sz}px system-ui,"Noto Sans TC",sans-serif`; tw = x.measureText(f.text).width; }
    const fx = Math.max(tw / 2 + 6, Math.min(w - tw / 2 - 6, f.x)), fy = Math.max(sz, Math.min(h - sz, f.y - (1 - k) * 26));
    x.save(); x.globalAlpha = Math.min(1, k * 2.5); x.translate(fx, fy); x.scale(pop, pop);
    x.lineWidth = Math.max(3, sz * 0.2); x.strokeStyle = '#fff'; x.strokeText(f.text, 0, 0);
    x.fillStyle = f.col; x.fillText(f.text, 0, 0);
    x.restore();
  }
}
function addFloat(text, fx, fy, col = '#ff5a2e', size = 22, life = 1) { floats.push({ text, x: fx, y: fy, col, size: Math.round(size * U), life, max: life }); }
let hintBtn = { x: 0, y: 0, w: 0, h: 0 };

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const p = cv.logical(e);
  if (p.x >= hintBtn.x && p.x <= hintBtn.x + hintBtn.w && p.y >= hintBtn.y && p.y <= hintBtn.y + hintBtn.h) { useHint(); return; }
  for (const [ox, oy, sc] of panels()) {
    const sx = (p.x - ox) / sc, sy = (p.y - oy) / sc;
    if (sx < 0 || sy < 0 || sx > SW || sy > SH) continue;
    let hit = -1, bd = 1e9;
    diffs.forEach((d, k) => { const dd = Math.hypot(d.x - sx, d.y - sy); if (!found[k] && dd < d.r + 8 && dd < bd) { bd = dd; hit = k; } });
    if (hit >= 0) {
      found[hit] = true; foundAt[hit] = t; if (hintD === diffs[hit]) hintD = null;
      const nf = found.filter(Boolean).length;
      // layered find sound: rises with how many you've found; a sparkle on top
      MG.sfx('match', nf); MG.sfx('sparkle');
      addFloat(nf === NDIFF ? MG.WORDS.clear : MG.praise(nf), p.x, p.y - 20, nf === NDIFF ? '#ff4f8a' : '#ff5a2e', 22 + nf);
      if (found.every(Boolean)) levelDone();
    } else if (!diffs.some((d, k) => found[k] && Math.hypot(d.x - sx, d.y - sy) < d.r + 8)) {
      wrongs.push({ x: sx, y: sy, life: 0.8 }); MG.sfx('miss');
      if (mode === 'timed') { left = Math.max(0, left - 2); addFloat(`${MG.WORDS.oops} −2s`, p.x, p.y - 18, '#3a7bd5', 18, 0.9); } else addFloat(MG.WORDS.oops, p.x, p.y - 18, '#3a7bd5', 18, 0.9);
    }
  }
});
addEventListener('keydown', e => { if ((e.key === 'h' || e.key === 'H') && state === 'play') useHint(); });
function useHint() {
  if (mode === 'timed' && hints <= 0) { MG.toast('No more 💡'); MG.sfx('miss'); return; }
  const k = found.findIndex(f => !f); if (k < 0) return;
  if (mode === 'timed') hints--; hintD = diffs[k]; hintT = 2.2; MG.sfx('flip'); MG.sfx('sparkle');
}

// ---------- flow ----------
// timed: 150 s for the first picture, 10 s less each level, never under 75 s
const levelTime = () => Math.max(75, 150 - (level - 1) * 10);
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
function newGame(m) { if (m) { mode = m; MG.store.set('spot.mode', m); } level = 1; total = 0; hints = HINTS; startLevel(); }
function startLevel() { makeLevel(); left = mode === 'timed' ? levelTime() : 0; state = 'play'; MG.hide(); hud(); }
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('time', mode === 'timed' ? `⏱ ${Math.ceil(left)}` : `🐢 ${mmss(left)}`); }
function levelDone() {
  state = 'between'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250); total = level;
  let html;
  if (mode === 'timed') {
    const quick = left > levelTime() * 0.5;
    if (quick) hints = Math.min(5, hints + 1);
    html = `<p>還剩 ${Math.ceil(left)} 秒 ^_^</p>` + (quick ? `<p>找得很快，送你一個 💡 提示</p>` : '') + `<p>下一關時間會少一點</p>`;
    MG.record('spot', total);
  } else {
    html = `<p>花了 ${mmss(left)} 找到全部 ^_^</p><p>慢慢來，不用急！</p>`;
    MG.store.set('spot.relax', Math.max(MG.store.get('spot.relax', 0), total));
  }
  setTimeout(() => MG.panel({
    title: `第 ${level} 關完成！`, html,
    buttons: [{ label: '下一關', on: () => { level++; startLevel(); } }, { label: '換模式', alt: true, on: menu }, { label: '回遊戲區', alt: true, on: () => location.href = 'index.html' }],
  }), 500);
}
function timeUp() {
  state = 'over'; MG.sfx('over');
  found = found.map(() => true); // reveal
  const rec = MG.record('spot', total);
  setTimeout(() => overPanel(rec), 900);
}
function overPanel(rec) {
  MG.panel({
    title: '時間到！',
    html: `<p>紅圈是剛剛沒找到的地方。這次過了</p><div class="big">${total} 關</div>` + (rec.isNew && total > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best ?? 0} 關</p>`) + `<p>覺得太趕的話，可以玩不限時的「慢慢找」</p>`,
    buttons: [{ label: '再玩一次', on: () => newGame('timed') }, { label: '🐢 慢慢找', alt: true, on: () => newGame('relax') }, { label: '看一下答案', alt: true, on: () => { MG.hide(); MG.toast('Look 👀 then tap 👆', 2000); } }],
  });
}
cv.addEventListener('pointerdown', () => { if (state === 'over' && !MG.panelOpen()) overPanel({ isNew: false, best: MG.best('spot') }); });
function menu() {
  state = 'ready';
  MG.panel({
    title: '大家來找碴',
    html: `<p>兩張圖有 5 個地方不一樣，點左邊或右邊都可以！</p><p>💡 提示會閃出其中一個，每關都是新畫的圖，有草原、海邊、海底、雪地、糖果國，玩不完 ^_^</p>
      <p class="mg-pick-h">要找哪一種圖？</p>
      <div class="mg-pick themes">${[{ id: 'mix', name: '🎲 輪流換' }, ...THEMES].map(th => `<button type="button" class="mg-opt" data-th="${th.id}">${th.name}</button>`).join('')}</div>
      <p class="mg-pick-h">選好了就按一個開始：</p>
      <div class="mg-btns" style="margin-top:6px">
        <button type="button" class="mg-btn${mode === 'relax' ? '' : ' alt'}" data-m="relax" style="padding:6px 14px;line-height:1.3">🐢 慢慢找<br><small style="font-weight:400;font-size:12px">不限時間・提示用不完</small></button>
        <button type="button" class="mg-btn${mode === 'timed' ? '' : ' alt'}" data-m="timed" style="padding:6px 14px;line-height:1.3">⏱ 限時挑戰<br><small style="font-weight:400;font-size:12px">第一關 150 秒・點錯扣 2 秒</small></button>
      </div>`,
    keys: '滑鼠點或手指點　<kbd>H</kbd> 用提示',
  });
  const syncTh = () => document.querySelectorAll('[data-th]').forEach(b => b.setAttribute('aria-pressed', b.dataset.th === themePick));
  document.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { themePick = b.dataset.th; MG.store.set('spot.theme', themePick); MG.sfx('click'); syncTh(); });
  syncTh();
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { MG.sfx('click'); MG.unlock(); newGame(b.dataset.m); });
  setTimeout(() => document.querySelector(`[data-m="${mode}"]`)?.focus(), 30);
}
level = 1; hints = HINTS; makeLevel(); left = 0; hud();
MG.pauseMenu({ label: '☰ 換模式', playing: () => state === 'play', open: was => { menu(); if (was) return () => { state = 'play'; }; } });
menu();
window.SPT = { get state() { return state; }, get found() { return found.slice(); }, floats: () => floats.map(f => f.text), diffs: () => diffs.map(d => ({ x: d.x, y: d.y, r: d.r })), panels: () => panels(),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; } };

  t += dt; hintT = Math.max(0, hintT - dt);
