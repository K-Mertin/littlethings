let W = 360, H = 580, CW = 360, CX0 = 0, SIDE = false, kx = 1, BASEW = 200, GROUNDY = 520, KEEP = 8, WF = 1;
let FH = 34, GB = 60, HANG = 58, TOPC = 112;
const JY = 8;   // jib top (screen)
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22)), oldCW = CW;   // 22 = stage padding + canvas border
  if (a >= 360 / 580) { H = 580; W = Math.round(H * a); CW = Math.min(W, 504); SIDE = W - CW >= 2 * 140; }
  else { W = 360; H = Math.round(W / a); CW = 360; SIDE = false; }
  CX0 = Math.round((W - CW) / 2); kx = CW / 360; BASEW = 200 * kx * WF;
  FH = Math.round(34 * Math.min(1.3, Math.max(kx * 0.92, H / 640, 1)));   // tall phones + wide tablets get taller, more detailed floors
  HANG = Math.round(FH * 1.45);
  GB = Math.round(Math.max(60, Math.min(140, H * 0.15))); GROUNDY = H - GB;
  TOPC = SIDE ? 64 : 118;
  KEEP = Math.max(5, Math.floor((GROUNDY - TOPC - HANG - FH) / FH));
  stars = []; for (let i = 0; i < 90 * W * H / (360 * 580); i++) stars.push([Math.random() * W, Math.random() * H, Math.random() * 1.5 + 0.5, Math.random() * 6]);
  layers.clear(); blockCache.clear(); picCache = null; for (const k in panels) delete panels[k];
  if (floors) {   // rotated mid-game: rescale the column, keep the camera on the top floor

    for (const f of [...floors, ...(mover ? [mover] : [])]) { f.x *= k; f.w *= k; if (f.px != null) f.px *= k; }
    debris = [];
    if (mover) { mover.amp = CW / 2 + floors[floors.length - 1].w * 0.25; mover.y = floorY(mover.n) - HANG; mover.falling = false; mover.bounce = 0; mover.drift *= k; }
    if (tgt) tgt.dx *= k;
    camT = Math.max(0, (floors.length - KEEP) * FH); camY = camT;
  }

}

const swayK = () => L && L.sway ? L.sway * (mode === 'relax' ? 0.6 : 1) * calmS : 0;
const swOff = (n, tt = t) => { const s = swayK(); return s ? Math.sin(tt * 1.6) * Math.min(n * 4, 44) * kx * s : 0; };
const gustNow = (tt = t) => L && L.gust ? L.gust * (mode === 'relax' ? 0.6 : 1) * (Math.sin(tt * 0.75) * 0.8 + Math.sin(tt * 1.9 + 1) * 0.35) : 0;

function reset() {

  debris = []; camY = 0; camT = 0; perfect = 0; pTot = 0; streak = 0; topper = 0; tHit = 0; calm = 1; calmS = 1; tgt = null; lift = 0; pops = []; MG.fx.clear();

  }

const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };

    say(gold && Math.abs(off) >= pw ? 'Gold! ✨' : streak >= 2 ? `Perfect ×${streak} 🌟` : MG.WORDS.perfect, floorY(m.n) - 8);

      `<p>${n >= 56 ? '已經蓋到外太空了！' : n >= 40 ? '晚上的星星都出來了！' : n >= 24 ? '蓋到夕陽那麼高了！' : '再往上就看得到夕陽喔'}</p>`,
    buttons: [{ label: '再蓋一次', on: () => startLevel(ENDLESS) }, { label: '選關卡', alt: true, on: menu }],
  }), rested ? 0 : 700);
}
function menu() {
  state = 'ready'; rest.show(false);
  MG.choose({
    id: 'stack', title: '疊疊高樓',
    html: '<p>吊車把樓層吊過來左右移動，<b>點一下</b>就放下來。超出下面那層的部分會被切掉，放得剛剛好是「完美」🌟！</p><p>40 關蓋 🏢 大樓、🗼 燈塔、🎂 蛋糕、🚀 火箭、🌳 樹屋、🏰 城堡和 🍯 蜂蜜塔；還有 🌊 會搖的塔、🌬️ 轉向的風、🎯 對準星星、🖼️ 疊出一幅圖，以及 ✨ 金磚、🧊 玻璃磚、🟣 橡皮磚。最後一格是 ♾️ 一直蓋。</p>',
    modes: [{ id: 'normal', label: '🏗️ 一般', sub: '沒疊到就要重來' }, { id: 'relax', label: '🐢 慢慢玩', sub: '沒疊到可以再放一次' }],
    levels: { count: ENDLESS, max: ENDLESS, label: n => n === ENDLESS ? `♾️ 一直蓋（最高 ${MG.best('stack') ?? 0} 層）` : `${n}（${lvName(n)}）`,
      short: n => n === ENDLESS ? '♾️' : `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '點畫面任何地方　電腦：<kbd>空白鍵</kbd>',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
MG.fit(cv, layout);
reset();
menu();
// test hook
const HOOK = window.STK = { auto: false, fast: 1, start(n, m = 'normal') { mode = m; startLevel(n); }, get state() { return state; }, get level() { return level; }, get floors() { return floors.length - 1; }, get perfects() { return pTot; }, get streak() { return streak; },
  get targets() { return tHit; }, get sway() { return floors ? swOff(floors.length - 1) : 0; }, get gust() { return gustNow(); }, get tgt() { return tgt && { dx: tgt.dx, tw: tgt.tw }; },
  get count() { return ENDLESS; }, levels: LEVELS, get mover() { return mover && { sp: mover.sp, drift: mover.drift, w: mover.w, x: mover.x, falling: mover.falling }; }, drop: () => drop(), menu: () => menu(), aim: () => mover && !mover.falling && Math.abs(mover.y - floorY(mover.n) + HANG) < 6 ? aimOff() / kx : null, win: () => { if (state === 'play' && L) win(); } };
let frameMs = 0;
MG.loop(dt => {
  const t0 = performance.now();
  if ((state === 'play' && !MG.panelOpen()) || state === 'over' || state === 'won') {
    const sub = HOOK.auto ? 12 : 1, n = (HOOK.fast | 0) || 1;
    for (let i = 0; i < n * sub; i++) update(dt / sub);
  } else t += dt;
  if (!HOOK.nodraw) draw();
  frameMs = frameMs * 0.95 + (performance.now() - t0) * 0.05; HOOK.frameMs = frameMs;
});
</script>
