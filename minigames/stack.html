/* 👓 大字模式 on a narrow phone: squeeze the top bar a little so the 🔊 button stays on screen and full size */

  html.mg-big .mg-bar a.back{font-size:15px;padding:0 7px}
  html.mg-big .mg-bar .stat{font-size:14px;padding:3px 6px}

</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'stack', title: '疊疊高樓', stats: ['floor', 'best'] });
const cv = document.getElementById('cv'); let x = cv.getContext('2d');
// canvas = the stage's shape: the sky/ground fill all of it; the building column (CW wide, centred at CX0) is 360 wide,
// up to 1.4× in landscape (blocks + swing speed scale with it), and the spare sides hold the floor counter and 噗噗.
let W = 360, H = 580, CW = 360, CX0 = 0, SIDE = false, kx = 1, BASEW = 200, GROUNDY = 520, KEEP = 8, WF = 1;
const FH = 34;
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22)), oldCW = CW;   // 22 = stage padding + canvas border
  if (a >= 360 / 580) { H = 580; W = Math.round(H * a); CW = Math.min(W, 504); SIDE = W - CW >= 2 * 140; }
  else { W = 360; H = Math.round(W / a); CW = 360; SIDE = false; }
  CX0 = Math.round((W - CW) / 2); kx = CW / 360; BASEW = 200 * kx * WF;
  const oldG = GROUNDY; GROUNDY = H - 60;
  KEEP = Math.max(8, Math.round((GROUNDY - (214 + (H - 580) * 0.3)) / FH) - 1);
  stars = []; for (let i = 0; i < 70 * W * H / (360 * 580); i++) stars.push([Math.random() * W, Math.random() * H, Math.random() * 1.5 + 0.5]);
  if (floors) {   // rotated mid-game: rescale the column, keep the camera on the top floor
    const k = CW / oldCW;
    for (const f of [...floors, ...debris, ...(mover ? [mover] : [])]) { f.x *= k; f.w *= k; }
    for (const d of debris) d.y += GROUNDY - oldG;
    if (mover) { mover.amp = CW / 2 + floors[floors.length - 2 >= 0 ? floors.length - 1 : 0].w * 0.25; mover.y += GROUNDY - oldG; mover.drift *= k; }   // rate (rad/s) stays: amp and speed scale together
    camT = Math.max(0, (floors.length - KEEP) * FH); camY = camT; blockCache.clear();
  }
  return [W, H];
}
const cssK = () => (parseFloat(cv.style.width) || W) / W;
const TXT = px => Math.min(px * 2.2, px * MG.textScale / Math.min(1.25, cssK()));
const HUES = [[255, 138, 128], [255, 196, 102], [140, 214, 120], [110, 190, 255], [184, 156, 255], [255, 160, 205]];
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ---------- buildings and levels ----------
const BLD = { house: { nm: '大樓', ic: '🏢' }, light: { nm: '燈塔', ic: '🗼' }, cake: { nm: '蛋糕塔', ic: '🎂' }, rocket: { nm: '火箭', ic: '🚀' }, tree: { nm: '樹屋', ic: '🌳' } };
// gt: 'floors' = build g floors, 'perfects' = g 🌟 perfect drops in total, 'streak' = g perfect drops in a row
// w = block width ×, sp = [swing speed, + per floor, max], pw = how close counts as perfect (px), wind 0..1, sx = special blocks { gold, glass, rubber } chances
const LEVELS = [
  { n: '第一棟小房子', b: 'house', gt: 'floors', g: 5, w: 1.25, sp: [95, 3, 160], pw: 7, mk: '🌱' },
  { n: '再高一點', b: 'house', gt: 'floors', g: 8, w: 1.1, sp: [105, 4, 180], pw: 6 },
  { n: '草莓蛋糕', b: 'cake', gt: 'floors', g: 8, w: 1.3, sp: [90, 3, 150], pw: 7, mk: '🎂' },
  { n: '完美三次', b: 'house', gt: 'perfects', g: 3, w: 1.2, sp: [95, 2, 150], pw: 7, mk: '🌟' },
  { n: '海邊燈塔', b: 'light', gt: 'floors', g: 10, w: 1.1, sp: [110, 4, 190], pw: 6, mk: '🗼' },
  { n: '金磚來了', b: 'house', gt: 'floors', g: 10, w: 1.05, sp: [115, 4, 200], pw: 6, sx: { gold: 0.35 }, mk: '✨' },
  { n: '森林樹屋', b: 'tree', gt: 'floors', g: 12, w: 1.1, sp: [115, 4, 200], pw: 6, mk: '🌳' },
  { n: '起風了', b: 'light', gt: 'floors', g: 10, w: 1.15, sp: [100, 3, 170], pw: 6, wind: 0.5, mk: '💨' },
  { n: '玻璃蛋糕', b: 'cake', gt: 'floors', g: 10, w: 1.15, sp: [105, 3, 180], pw: 6, sx: { glass: 0.35 }, mk: '🧊' },
  { n: '火箭發射', b: 'rocket', gt: 'floors', g: 15, w: 1.05, sp: [120, 5, 220], pw: 5, mk: '🚀' },
  { n: '彈彈橡皮', b: 'tree', gt: 'floors', g: 12, w: 1.05, sp: [120, 4, 210], pw: 6, sx: { rubber: 0.4 }, mk: '🟣' },
  { n: '連續完美', b: 'house', gt: 'streak', g: 3, w: 1.2, sp: [95, 2, 150], pw: 7, mk: '🔥' },
  { n: '細細燈塔', b: 'light', gt: 'floors', g: 10, w: 0.72, sp: [100, 3, 170], pw: 6, mk: '📏' },
  { n: '風中蛋糕', b: 'cake', gt: 'floors', g: 14, w: 1.1, sp: [110, 4, 200], pw: 6, wind: 0.5, sx: { gold: 0.25 }, mk: '💨' },
  { n: '玻璃火箭', b: 'rocket', gt: 'floors', g: 15, w: 1.05, sp: [120, 5, 220], pw: 5, sx: { glass: 0.3 }, mk: '🚀' },
  { n: '大風樹屋', b: 'tree', gt: 'floors', g: 16, w: 1.05, sp: [115, 4, 210], pw: 6, wind: 0.6, sx: { rubber: 0.3 }, mk: '🌳' },
  { n: '燈塔四連發', b: 'light', gt: 'streak', g: 4, w: 1.15, sp: [100, 2, 160], pw: 7, mk: '🔥' },
  { n: '窄窄大樓', b: 'house', gt: 'floors', g: 15, w: 0.75, sp: [125, 5, 230], pw: 5, mk: '📏' },
  { n: '特別蛋糕', b: 'cake', gt: 'floors', g: 18, w: 1, sp: [120, 5, 230], pw: 5, sx: { gold: 0.15, glass: 0.15, rubber: 0.15 }, mk: '🎂' },
  { n: '暴風火箭', b: 'rocket', gt: 'floors', g: 18, w: 1.05, sp: [115, 4, 210], pw: 6, wind: 1, mk: '💨' },
  { n: '完美樹屋', b: 'tree', gt: 'perfects', g: 8, w: 1.1, sp: [110, 3, 190], pw: 6, mk: '🌟' },
  { n: '風中細燈塔', b: 'light', gt: 'floors', g: 20, w: 0.78, sp: [115, 4, 220], pw: 5, wind: 0.6, mk: '📏' },
  { n: '五連完美', b: 'cake', gt: 'streak', g: 5, w: 1.15, sp: [100, 2, 160], pw: 6, mk: '🔥' },
  { n: '超級大火箭', b: 'rocket', gt: 'floors', g: 30, w: 1, sp: [130, 5, 280], pw: 5, wind: 0.7, sx: { gold: 0.1, glass: 0.12, rubber: 0.12 }, mk: '🏆' },
];
const ENDLESS = LEVELS.length + 1;
let level = ENDLESS, L = null, mode = 'normal', pTot = 0, streak = 0, topper = 0;
const bld = () => L ? L.b : 'house';
const skyK = () => L && L.b === 'rocket' && L.gt === 'floors' ? 50 / L.g : 1;    // 🚀 reaches outer space at the top
const lvName = n => n === ENDLESS ? '♾️ 一直蓋' : `${BLD[LEVELS[n - 1].b].ic} ${LEVELS[n - 1].n}`;
const goalTxt = () => L.gt === 'floors' ? `${BLD[L.b].ic} ${floors.length - 1}/${L.g}` : L.gt === 'perfects' ? `🌟 ${pTot}/${L.g}` : `🔥 ${streak}/${L.g}`;

let floors, mover, debris, camY, camT, state = 'ready', t = 0, perfect = 0, pops = [], shake = 0, stars = [];

function reset() {
  floors = [{ x: CW / 2 - BASEW / 2, w: BASEW, n: 0, seed: 1 }];
  debris = []; camY = 0; camT = 0; perfect = 0; pTot = 0; streak = 0; topper = 0; pops = []; MG.fx.clear();
  spawn(); hud();
}
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
const HANG = 58;   // how far above the tower the new floor hangs
function spawn() {
  const top = floors[floors.length - 1], n = floors.length, fromLeft = n % 2 === 1;
  const speed = (L ? Math.min(L.sp[2], L.sp[0] + n * L.sp[1]) * (mode === 'relax' ? 0.85 : 1) : Math.min(330, 120 + n * 6)) * kx, amp = CW / 2 + top.w * 0.25;
  // special blocks (not on the first floor)
  let sp = null;
  if (L && L.sx && n > 1) { let r = Math.random(); for (const k of ['gold', 'glass', 'rubber']) { const c = L.sx[k] || 0; if (r < c) { sp = k; break; } r -= c; } }
  // 💨 wind: the falling floor gets blown sideways (the dotted guide shows where it will really land)
  const drift = L && L.wind ? (Math.random() < 0.5 ? -1 : 1) * MG.rand(0.45, 1) * L.wind * 40 * kx : 0;
  // sine ping-pong: slows down at the ends instead of bouncing off them
  mover = { w: top.w, n, seed: Math.random() * 1000, amp, ph: fromLeft ? -Math.PI / 2 : Math.PI / 2, rate: speed * Math.PI / (2 * amp),
    x: 0, y: floorY(n) - HANG - 80, vy: 0, falling: false, enter: 0, sp, drift, x0: 0, y0: 0, bounce: 0 };
  mover.x = CW / 2 + Math.sin(mover.ph) * amp - mover.w / 2;
}
function hud() {
  if (L) { MG.stat('floor', `第 ${level} 關`); MG.stat('best', goalTxt()); return; }
  MG.stat('floor', `${floors.length - 1} 層`); MG.stat('best', mode === 'relax' ? '' : `最高 ${MG.best('stack') ?? 0}`);
}
const floorY = n => GROUNDY - (n + 1) * FH;   // world y of floor n's top edge

function drop() {
  if (state !== 'play' || !mover || mover.falling || MG.panelOpen()) return;
  mover.falling = true; mover.vy = 60; mover.x0 = mover.x; mover.y0 = mover.y; MG.sfx('flip');
}
function say(t, y, c) { pops.push({ t, life: 0.9, y, c }); }
function land() {
  const top = floors[floors.length - 1], m = mover;
  let L0 = Math.max(m.x, top.x), Rr = Math.min(m.x + m.w, top.x + top.w);
  if (Rr - L0 <= 0) { // missed completely
    debris.push({ x: m.x, y: floorY(m.n), w: m.w, vy: 0, vx: (Math.cos(m.ph) >= 0 ? 1 : -1) * 40, rot: 0, vr: (Math.cos(m.ph) >= 0 ? 1 : -1) * 2, n: m.n, seed: m.seed, sp: m.sp });
    mover = null; MG.sfx('miss'); snd('whoosh'); say(MG.WORDS.miss, floorY(m.n) - 8); perfect = 0; streak = 0;
    if (mode === 'relax') { say('Again! 🔁', floorY(m.n) - 40, '#3a7bd5'); hud(); return spawn(); }   // 🐢 no game over: here comes another one
    return gameOver();
  }
  const off = m.x - top.x, pw = (L ? L.pw : 5) * kx;
  // 🟣 rubber: bounces once and lands halfway closer to the middle
  if (m.sp === 'rubber' && !m.bounce && Math.abs(off) >= pw) {
    m.bounce = 1; m.falling = true; m.vy = -330; m.y = floorY(m.n) - 1; m.bx0 = m.x; m.bx1 = top.x + off / 2; m.bt = 0;
    MG.sfx('boing'); say('Boing! 🟣', floorY(m.n) - 8, '#9a52d0'); return;
  }
  // 🧊 glass: must be put down nicely, or it cracks (nothing lost, just try again)
  if (m.sp === 'glass' && Math.abs(off) >= 14 * kx) {
    MG.fx.burst(m.x + m.w / 2, floorY(m.n) + FH / 2, { n: 26, colors: ['#e4f7ff', '#9fdcff', '#fff'], speed: 220, up: 80, size: 5, shape: 'sq', life: 0.8 });
    MG.sfx('hit'); snd('whoosh'); say('Crack! 💥', floorY(m.n) - 8, '#2f86b8'); perfect = 0; streak = 0; shake = 0.15; mover = null; hud(); return spawn();
  }
  const gold = m.sp === 'gold';
  if (Math.abs(off) < pw || gold) {      // perfect (or ✨ gold: always snaps on top)
    perfect++; pTot++; streak++; L0 = top.x; Rr = top.x + top.w;
    let w = top.w;
    if (perfect >= 3 && w < BASEW) { w = Math.min(BASEW, w + 10 * kx); L0 -= 5 * kx; perfect = 0; say('Wider! ↔️', floorY(m.n) - 30); MG.sfx('yay'); }
    floors.push({ x: L0, w: Math.max(w, Rr - L0), n: m.n, seed: m.seed, glow: 0.5, squash: 0.25, sp: m.sp });
    if (gold) { MG.sfx('coin'); snd('sparkle'); }
    MG.sfx('perfect'); snd('match', Math.max(1, streak)); if (streak >= 2) snd('sparkle');
    say(gold && Math.abs(off) >= pw ? 'Gold! ✨' : streak >= 2 ? `Perfect ×${streak} 🌟` : MG.WORDS.perfect, floorY(m.n) - 8);
    MG.fx.burst(L0 + top.w / 2, floorY(m.n) + FH, { n: 16, colors: ['#fff', '#ffe36b', '#ffd23f'], speed: 180, up: 40, size: 4, shape: 'star', life: 0.6 });
  } else {
    perfect = 0; streak = 0;
    let w = Rr - L0;
    // 🐢 慢慢玩: the floor never gets thinner than a little tower
    if (mode === 'relax' && w < 26 * kx) { const c = (L0 + Rr) / 2; w = 26 * kx; L0 = c - w / 2; Rr = c + w / 2; }
    floors.push({ x: L0, w, n: m.n, seed: m.seed, squash: 0.25, sp: m.sp });
    // the overhang falls off
    if (m.x < L0) debris.push({ x: m.x, y: floorY(m.n), w: L0 - m.x, vy: 0, vx: -60, rot: 0, vr: -2.5, n: m.n, seed: m.seed, sp: m.sp });
    if (m.x + m.w > Rr) debris.push({ x: Rr, y: floorY(m.n), w: m.x + m.w - Rr, vy: 0, vx: 60, rot: 0, vr: 2.5, n: m.n, seed: m.seed, sp: m.sp });
    MG.sfx('place'); shake = 0.1; snd('whoosh');
    if (Math.abs(off) < 14 * kx) { snd('pop'); say(MG.WORDS.good, floorY(m.n) - 8); }
  }
  camT = Math.max(0, (floors.length - KEEP) * FH);
  const nf = floors[floors.length - 1];
  MG.fx.burst(nf.x + 4, floorY(nf.n) + FH, { n: 5, colors: ['rgba(255,255,255,.8)'], speed: 60, up: 10, size: 3, grav: 60, life: 0.4, angle: Math.PI, spread: 1.2 });
  MG.fx.burst(nf.x + nf.w - 4, floorY(nf.n) + FH, { n: 5, colors: ['rgba(255,255,255,.8)'], speed: 60, up: 10, size: 3, grav: 60, life: 0.4, angle: 0, spread: 1.2 });
  if (!L && (floors.length - 1) % 10 === 0) { MG.sfx('coin'); snd('combo', Math.min(10, (floors.length - 1) / 5)); say(`${floors.length - 1} 🏢 ${MG.praise(Math.min(5, (floors.length - 1) / 10))}`, floorY(m.n) - 52); }
  mover = null; hud();
  if (L && (L.gt === 'floors' ? floors.length - 1 >= L.g : L.gt === 'perfects' ? pTot >= L.g : streak >= L.g)) return win();
  spawn();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowDown') { if (state === 'play' && !MG.panelOpen()) { e.preventDefault(); drop(); } } });

let lastOff = null;
function bot() {   // test bot: drop when the floor (after the wind) will sit right on top
  if (!mover || mover.falling) return;
  const top = floors[floors.length - 1], off = mover.x + mover.drift - top.x;
  if (Math.abs(off) < 1.6 * kx || (lastOff != null && Math.sign(off) !== Math.sign(lastOff) && Math.abs(off) < 3 * kx)) { lastOff = null; drop(); return; }
  lastOff = off;
}
function update(dt) {
  t += dt; shake = Math.max(0, shake - dt);
  if (mover && state === 'play') {
    const hangY = floorY(mover.n) - HANG;
    if (mover.falling) {
      mover.vy += 1800 * dt; mover.y += mover.vy * dt;
      if (mover.bounce) { mover.bt += dt; mover.x = mover.bx0 + (mover.bx1 - mover.bx0) * Math.min(1, mover.bt / 0.36); }
      else if (mover.drift) mover.x = mover.x0 + mover.drift * Math.max(0, Math.min(1, (mover.y - mover.y0) / (floorY(mover.n) - mover.y0)));
      if (mover.y >= floorY(mover.n) && mover.vy > 0) { mover.y = floorY(mover.n); if (mover.bounce) mover.x = mover.bx1; land(); }
    } else {
      mover.ph += mover.rate * dt;
      mover.x = CW / 2 + Math.sin(mover.ph) * mover.amp - mover.w / 2;
      mover.y += (hangY + Math.sin(t * 4) * 2 - mover.y) * Math.min(1, dt * 10);   // lowered in from above
      if (HOOK.auto && Math.abs(mover.y - hangY) < 6) bot();
    }
  }
  for (const f of floors) if (f.squash) f.squash = Math.max(0, f.squash - dt);
  camY += (camT - camY) * Math.min(1, dt * 4);
  for (const d of debris) { d.vy += 1300 * dt; d.y += d.vy * dt; d.x += d.vx * dt; d.rot += d.vr * dt; }
  debris = debris.filter(d => d.y + camY < H + 200);
  for (const f of floors) if (f.glow) f.glow = Math.max(0, f.glow - dt);
  for (const p of pops) { p.y -= 30 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  if (topper) { topper += dt; if (bld() === 'rocket' && Math.random() < 0.7) MG.fx.burst(CX0 + CW / 2 + MG.rand(-BASEW / 3, BASEW / 3), GROUNDY + camY, { n: 2, colors: ['#ffd23f', '#ff7a1c', '#ff4f2a', '#fff'], speed: 120, up: 100, size: 6, grav: -60, life: 0.7 }); }
  MG.fx.step(dt);
}

// ---------- draw ----------
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
function skyColors(h) {   // h = floors climbed
  const stops = [[0, [120, 200, 255], [220, 242, 255]], [18, [255, 160, 110], [255, 220, 170]], [32, [40, 50, 120], [120, 90, 160]], [48, [8, 10, 30], [30, 30, 70]]];
  for (let i = 0; i < stops.length - 1; i++) { const [a, t1, b1] = stops[i], [b, t2, b2] = stops[i + 1]; if (h < b) { const k = (h - a) / (b - a); return [mix(t1, t2, k), mix(b1, b2, k)]; } }
  return [stops[stops.length - 1][1], stops[stops.length - 1][2]];
}
const blockCache = new Map();
function block(X, Y, w, n, seed, alpha = 1, glow = 0, sp = null) {
  const night = (floors.length - 1) * skyK() > 30, k = cv._mgScale || 1, b = bld(), key = `${w.toFixed(1)}|${n}|${seed}|${night}|${k}|${b}|${sp}`;
  let img = blockCache.get(key);
  if (!img) {
    img = document.createElement('canvas'); img.width = Math.ceil(w * k) + 2; img.height = Math.ceil(FH * k) + 2;
    const g = img.getContext('2d'); g.scale(k, k);
    const keep = x; x = g; drawBlock(0, 0, w, n, seed, night, b, sp); x = keep;
    if (blockCache.size > 400) blockCache.clear();
    blockCache.set(key, img);
  }
  x.globalAlpha = alpha; x.drawImage(img, X, Y, img.width / k, img.height / k); x.globalAlpha = 1;
  if (glow) { x.strokeStyle = `rgba(255,240,150,${glow * 2})`; x.lineWidth = 4; x.strokeRect(X - 1, Y - 1, w + 2, FH + 2); }
  if (sp === 'gold') { const s = (t * 60 + seed) % (w + 40) - 20; if (s > 2 && s < w - 6) { x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.moveTo(X + s, Y + 2); x.lineTo(X + s + 6, Y + 2); x.lineTo(X + s - 2, Y + FH - 2); x.lineTo(X + s - 8, Y + FH - 2); x.fill(); } }
}
function drawBlock(X, Y, w, n, seed, night, b, sp) {

    const bx = ((t * 18) % (W + 120)) - 60; x.fillStyle = '#fff'; x.beginPath(); x.moveTo(bx - 18, g + 10); x.lineTo(bx + 18, g + 10); x.lineTo(bx + 12, g + 20); x.lineTo(bx - 12, g + 20); x.fill(); x.fillStyle = '#ff5a6e'; x.beginPath(); x.moveTo(bx, g + 10); x.lineTo(bx, g - 14); x.lineTo(bx + 12, g + 6); x.fill();
    return;
  }
  if (b === 'cake') {   // a big tablecloth with a plate
    x.fillStyle = '#fff'; x.fillRect(0, g, W, 300); x.fillStyle = '#ff9cc2'; for (let i = 0; i < W; i += 28) for (let r = 0; r < 4; r++) if ((i / 28 + r) % 2 < 1) x.fillRect(i, g + r * 16, 28, 16);
    x.fillStyle = '#f2f4f8'; x.beginPath(); x.ellipse(CX0 + CW / 2, g, BASEW / 2 + 26, 9, 0, 0, 7); x.fill(); x.strokeStyle = '#c9cede'; x.lineWidth = 2; x.stroke();
    x.font = `34px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'bottom'; x.fillStyle = '#000';
    for (let side = 0; side < 2; side++) for (let k = 0; ; k++) { const cx = side ? CX0 + CW + 34 + k * 70 : CX0 - 34 - k * 70; if (side ? cx > W + 30 : cx < -30) break; x.fillText(['🧁', '🍓', '🍭', '🍪'][(k + side * 2) % 4], cx, g + 4); }
    return;
  }
  x.fillStyle = b === 'tree' ? '#5aa645' : b === 'rocket' ? '#8cc46a' : '#7cc45a'; x.fillRect(0, g, W, 300); x.fillStyle = b === 'tree' ? '#4c9a38' : '#6cb34c'; for (let i = 0; i < W; i += 12) x.fillRect(i, g, 6, 4);
  if (b === 'tree') {
    for (let i = 0, side = 0; side < 2; side++) for (let k = 0; ; k++, i++) { const cx = side ? CX0 + CW + 30 + k * 60 : CX0 - 30 - k * 60; if (side ? cx > W + 40 : cx < -40) break; const s = 0.8 + ((i * 37) % 5) * 0.12;
      x.fillStyle = '#7a5230'; x.fillRect(cx - 5 * s, g - 50 * s, 10 * s, 50 * s); for (const [ox, oy, r, c] of [[0, -70, 30, '#2f8a3c'], [-16, -56, 20, '#3d9a45'], [16, -58, 20, '#3d9a45'], [-6, -82, 16, '#5cbf5a']]) { x.fillStyle = c; x.beginPath(); x.arc(cx + ox * s, g + oy * s, r * s, 0, 7); x.fill(); } }
    return;
  }
  if (b === 'rocket') {   // a launch tower beside the rocket
    const tx = CX0 + CW / 2 + BASEW / 2 + 34; if (tx < W - 10) { x.strokeStyle = '#e8463c'; x.lineWidth = 3; x.beginPath(); for (let yy = 0; yy < 260; yy += 26) { x.moveTo(tx - 10, g - yy); x.lineTo(tx + 10, g - yy - 26); x.moveTo(tx + 10, g - yy); x.lineTo(tx - 10, g - yy - 26); } x.moveTo(tx - 10, g); x.lineTo(tx - 10, g - 260); x.moveTo(tx + 10, g); x.lineTo(tx + 10, g - 260); x.stroke(); }
  }
  drawTown();
}
// little houses and trees on the ground beside the building column (world coords, camera already applied)
function drawTown() {
  const g = GROUNDY;
  for (let i = 0, side = 0; side < 2; side++) for (let k = 0; ; k++, i++) {
    const cx = side ? CX0 + CW + 40 + k * 92 : CX0 - 40 - k * 92; if (side ? cx > W + 40 : cx < -40) break;
    const hh = 40 + ((i * 37) % 4) * 14, ww = 54, hue = HUES[(i * 5 + 2) % HUES.length];
    x.fillStyle = `rgb(${mix(hue, [255, 255, 255], 0.35)})`; x.fillRect(cx - ww / 2, g - hh, ww, hh);
    x.fillStyle = `rgb(${mix(hue, [0, 0, 0], 0.3)})`; x.beginPath(); x.moveTo(cx - ww / 2 - 6, g - hh); x.lineTo(cx, g - hh - 24); x.lineTo(cx + ww / 2 + 6, g - hh); x.fill();
    x.fillStyle = 'rgba(255,255,255,.8)'; for (let r = 0; r < Math.floor(hh / 26); r++) { x.fillRect(cx - 18, g - hh + 8 + r * 24, 12, 12); x.fillRect(cx + 6, g - hh + 8 + r * 24, 12, 12); }
    x.fillStyle = '#8a5a34'; x.fillRect(cx - 6, g - 16, 12, 16);
    const tx = cx + 46; x.fillStyle = '#8a5a34'; x.fillRect(tx - 3, g - 26, 6, 26); x.fillStyle = '#4cae55'; x.beginPath(); x.arc(tx, g - 32, 15, 0, 7); x.fill();
  }
}
// landscape: the floor counter on the left, 噗噗 cheering on the right
function drawSides(climbed) {
  const sw = CX0, pad = Math.max(14, sw * 0.08), cw = sw - pad * 2, big = MG.big;
  const f1 = Math.min(cw * 0.16, TXT(16)), f2 = Math.min(cw * 0.42, TXT(46));
  const ch = f1 * 2.4 + f2 * 1.2 + f1 * 1.6 + (L ? f1 * 2.6 : 0);
  x.fillStyle = big ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.82)'; x.strokeStyle = big ? '#3a2f22' : 'rgba(58,47,34,.25)'; x.lineWidth = big ? 4 : 2;
  x.beginPath(); x.roundRect(pad, pad, cw, ch, 18); x.fill(); x.stroke();
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = big ? '#1d160d' : '#6b5a44'; x.font = `700 ${f1}px "Noto Sans TC",system-ui`; x.fillText('蓋了', pad + cw / 2, pad + f1 * 1.1);
  x.fillStyle = '#ff7a00'; x.font = `900 ${f2}px system-ui,sans-serif`; x.fillText(climbed, pad + cw / 2, pad + f1 * 1.9 + f2 * 0.55);
  x.fillStyle = big ? '#1d160d' : '#6b5a44'; x.font = `700 ${f1}px "Noto Sans TC",system-ui,${EMOJI}`;
  x.fillText(L ? '層' : mode === 'relax' ? '層　🐢 慢慢玩' : `層　🏆 最高 ${MG.best('stack') ?? 0}`, pad + cw / 2, pad + f1 * 1.9 + f2 * 1.2 + f1 * 0.6);
  if (L) {   // the goal, and a progress bar
    const y0 = pad + f1 * 1.9 + f2 * 1.2 + f1 * 2.1, done = L.gt === 'floors' ? climbed / L.g : L.gt === 'perfects' ? pTot / L.g : streak / L.g;
    x.fillStyle = big ? '#1d160d' : '#3a2f22'; x.font = `900 ${f1 * 1.05}px "Noto Sans TC",system-ui,${EMOJI}`;
    x.fillText(L.gt === 'floors' ? `🏁 蓋到 ${L.g} 層` : L.gt === 'perfects' ? `🌟 完美 ${pTot} / ${L.g}` : `🔥 連續完美 ${streak} / ${L.g}`, pad + cw / 2, y0);
    const bh = f1 * 0.7; x.fillStyle = 'rgba(58,47,34,.15)'; x.beginPath(); x.roundRect(pad + 12, y0 + f1 * 0.8, cw - 24, bh, bh / 2); x.fill();
    x.fillStyle = '#ffb000'; x.beginPath(); x.roundRect(pad + 12, y0 + f1 * 0.8, Math.max(bh, (cw - 24) * Math.min(1, done)), bh, bh / 2); x.fill();
  }
  // right side: 噗噗 on the grass, and a big "tap" sign
  const rx = CX0 + CW + pad, rr = Math.min(cw * 0.2, 46), gy = GROUNDY + Math.min(camY, 0);
  const mood = state === 'over' ? 'ouch' : state === 'won' ? 'love' : perfect >= 2 ? 'love' : perfect ? 'wow' : 'happy';
  const hop = (state === 'play' && perfect) || state === 'won' ? Math.abs(Math.sin(t * 6)) * 10 : 0;
  x.fillStyle = big ? 'rgba(255,255,255,.95)' : 'rgba(255,255,255,.82)'; x.strokeStyle = big ? '#3a2f22' : 'rgba(58,47,34,.25)'; x.lineWidth = big ? 4 : 2;
  const th = Math.min(cw * 0.36, TXT(22) * 2.6);
  x.beginPath(); x.roundRect(rx, pad, cw, th, 18); x.fill(); x.stroke();
  x.fillStyle = big ? '#1d160d' : '#3a2f22'; x.font = `900 ${Math.min(cw * 0.11, TXT(20))}px "Noto Sans TC",system-ui`; x.fillText('👆 點一下放下！', rx + cw / 2, pad + th / 2);
  if (bld() === 'light') { const ry = Math.min(H - rr * 1.3, gy - rr - 4) + rr * 0.95; x.fillStyle = '#8a8f9e'; x.beginPath(); x.ellipse(rx + cw / 2, ry + 6, rr * 1.5, rr * 0.5, 0, Math.PI, 0); x.fill(); x.fillStyle = '#a3a8b6'; x.beginPath(); x.ellipse(rx + cw / 2 - rr * 0.3, ry + 2, rr * 0.9, rr * 0.3, 0, Math.PI, 0); x.fill(); }
  MG.puPu(x, rx + cw / 2, Math.min(H - rr * 1.3, gy - rr - 4) - hop, rr, mood, 0, { arms: perfect || state === 'over' || state === 'won' ? 'up' : false, look: mover ? Math.max(-1, Math.min(1, (CX0 + mover.x + mover.w / 2 - rx - cw / 2) / 200)) : 0 });
}

// ---------- flow ----------
const rest = MG.barButton('休息一下', () => { if (state === 'play') gameOver(true); });
rest.el.innerHTML = '休息<span class="bx2">一下</span>';
const NEWS = {
  goal: ['🏁 蓋到旗子那麼高', '每一關都有目標！蓋到 <b>🏁 旗子的高度</b> 就過關，房子會蓋上屋頂喔。'],
  perfects: ['🌟 完美放好', '這一關要放得<b>剛剛好</b>，和下面那層對齊就是「完美」🌟。完美的次數夠了就過關！'],
  streak: ['🔥 連續完美', '這一關要<b>連續</b>放出好幾次完美 🌟，中間沒對準的話要重新數喔。'],
  gold: ['✨ 金磚', '亮晶晶的金磚很神奇，只要有碰到下面那層，就會<b>自動對齊</b>變成完美！'],
  glass: ['🧊 玻璃磚', '透明的玻璃磚要<b>放得很準</b>，歪太多就會碎掉，要再放一次。'],
  rubber: ['🟣 橡皮磚', '紫色的橡皮磚放歪了會<b>彈一下</b>，往中間靠近一半再掉下來。'],
  wind: ['💨 起風了', '風會把掉下來的樓層吹歪！看<b>白色虛線</b>，那裡才是它真正會掉下去的地方。'],
  narrow: ['📏 細細的樓層', '這一關的樓層比較窄，要更專心對準喔！'],
};
function intro() {
  const ks = ['goal', L.gt, ...Object.keys(L.sx || {}), L.wind ? 'wind' : '', L.w < 0.9 ? 'narrow' : ''].filter(k => NEWS[k] && !MG.store.get('stack.seen.' + k, false));
  if (!ks.length) return false;
  ks.forEach(k => MG.store.set('stack.seen.' + k, true));
  MG.panel({ title: ks.map(k => NEWS[k][0]).join('＋'), html: ks.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  return true;
}
function startLevel(n) {
  level = n; L = n === ENDLESS ? null : LEVELS[n - 1];
  WF = L ? L.w : 1; BASEW = 200 * kx * WF; blockCache.clear(); lastOff = null;
  reset(); state = 'play'; MG.hide(); rest.show(!L && mode === 'relax');
  if (L && !intro()) MG.toast(`第 ${n} 關　${lvName(n)}`, 1600);
}
function win() {
  state = 'won'; mover = null; topper = 0.001; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 300);
  const top = floors[floors.length - 1];
  MG.fx.burst(CX0 + top.x + top.w / 2, floorY(top.n) + camY, { n: 46, colors: ['#ffd23f', '#ff8ac2', '#6fd3ff', '#9be36a', '#fff'], speed: 300, up: 200, size: 6, shape: 'star', life: 1.1 });
  const cl = MG.store.get('stack.cleared', {}); cl[level] = 1; MG.store.set('stack.cleared', cl);
  const nx = level < LEVELS.length ? level + 1 : ENDLESS; MG.store.set('stack.pickLevel', nx);
  const done = level;
  setTimeout(() => { if (state !== 'won' || level !== done) return; MG.panel({
    title: `第 ${done} 關完成！`,
    html: `<div class="big">${BLD[L.b].ic} ${floors.length - 1} 層</div><p>🌟 完美 ${pTot} 次</p><p>${nx === ENDLESS ? '全部蓋好了！來試試 ♾️ 一直蓋，看能蓋多高 ^_^' : `下一關：${lvName(nx)}`}</p>`,
    buttons: [{ label: nx === ENDLESS ? '♾️ 一直蓋' : '下一關', on: () => startLevel(nx) }, { label: '再玩一次', alt: true, on: () => startLevel(done) }, { label: '選關卡', alt: true, on: menu }],
  }); }, 1500);
}
function gameOver(rested) {
  state = 'over'; rest.show(false); if (!rested) { MG.sfx('over'); shake = 0.3; } else MG.sfx('win');
  const n = floors.length - 1; hud();
  if (L) return setTimeout(() => MG.panel({
    title: '沒疊到！',
    html: `<p>這次蓋了 ${n} 層` + (L.gt === 'floors' ? `（目標 ${L.g} 層）` : L.gt === 'perfects' ? `，完美 ${pTot} 次（目標 ${L.g} 次）` : '') + `</p><p>再試一次！覺得太難可以選 🐢 慢慢玩，沒疊到也可以再放一次。</p>`,
    buttons: [{ label: '再試一次', on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],
  }), 700);
  const rec = mode === 'relax' ? null : MG.record('stack', n);
  setTimeout(() => MG.panel({
    title: rested ? '休息一下！' : '沒疊到！',
    html: `<p>這次蓋了</p><div class="big">${n} 層</div>` + (!rec ? '<p>🐢 慢慢玩不算紀錄喔</p>' : rec.isNew && n > 0 ? '<p class="new">新紀錄！^_^</p>' : `<p>最高紀錄：${rec.best} 層</p>`) +
      `<p>${n >= 48 ? '已經蓋到外太空了！' : n >= 32 ? '晚上的星星都出來了！' : n >= 18 ? '蓋到夕陽那麼高了！' : '再往上就看得到夕陽喔'}</p>`,
    buttons: [{ label: '再蓋一次', on: () => startLevel(ENDLESS) }, { label: '選關卡', alt: true, on: menu }],
  }), rested ? 0 : 700);
}
function menu() {
  state = 'ready'; rest.show(false);
  MG.choose({
    id: 'stack', title: '疊疊高樓',
    html: '<p>樓層會左右移動，<b>點一下</b>就放下來。超出下面那層的部分會被切掉，放得剛剛好是「完美」🌟！</p><p>每一關蓋到 🏁 目標就過關：🏢 大樓、🗼 燈塔、🎂 蛋糕、🚀 火箭、🌳 樹屋，還有 ✨ 金磚、🧊 玻璃磚、🟣 橡皮磚和 💨 大風！最後一格是 ♾️ 一直蓋。</p>',
    modes: [{ id: 'normal', label: '🏗️ 一般', sub: '沒疊到就要重來' }, { id: 'relax', label: '🐢 慢慢玩', sub: '沒疊到可以再放一次' }],
    levels: { count: ENDLESS, max: ENDLESS, label: n => n === ENDLESS ? `♾️ 一直蓋（最高 ${MG.best('stack') ?? 0} 層）` : `${n}（${lvName(n)}）`,
      short: n => n === ENDLESS ? '♾️' : `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '點畫面任何地方　電腦：<kbd>空白鍵</kbd>',

MG.fit(cv, layout);
reset();
menu();
// test hook
const HOOK = window.STK = { auto: false, fast: 1, start(n, m = 'normal') { mode = m; startLevel(n); }, get state() { return state; }, get level() { return level; }, get floors() { return floors.length - 1; }, get perfects() { return pTot; }, get streak() { return streak; },
  get count() { return ENDLESS; }, levels: LEVELS, get mover() { return mover && { sp: mover.sp, drift: mover.drift, w: mover.w }; }, drop: () => drop(), menu: () => menu() };
MG.loop(dt => {
  if ((state === 'play' && !MG.panelOpen()) || state === 'over' || state === 'won') {
    const sub = HOOK.auto ? 4 : 1, n = (HOOK.fast | 0) || 1;
    for (let i = 0; i < n * sub; i++) update(dt / sub);
  } else t += dt;
  draw();
});
</script>
