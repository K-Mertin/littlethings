<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>小小著色本</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:linear-gradient(#fff6e0,#ffeef6)}
.book{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top)) 0 0 0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom))}
@media (min-aspect-ratio:1/1){.book{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(260px,38%)}}
.paper{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.paper canvas{display:block;background:#fff;border:3px solid #fff;border-radius:14px;box-shadow:0 6px 18px rgba(140,100,40,.25);touch-action:none;cursor:crosshair}
.tools{background:#fffdf7;border:3px solid #f1d7a6;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0;box-shadow:0 4px 0 #f1d7a6}
.pal{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
@media (min-aspect-ratio:1/1){.pal{grid-template-columns:repeat(6,1fr)}}
.pal button{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e6d6b8;cursor:pointer;padding:0;position:relative}
.pal button[aria-pressed=true]{box-shadow:0 0 0 3px #3a2f22;transform:scale(1.12)}
.pal button.eraser{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/10px 10px}
.pal button.eraser::after{content:"擦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 12px "Noto Sans TC",system-ui;color:#8a7a62}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row .mg-btn{min-width:0;min-height:44px;font-size:14px;padding:0 4px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.picks button{border:3px solid #eedcb8;border-radius:14px;background:#fff;padding:4px;cursor:pointer;font:inherit;font-size:13px;color:#6b4a22}
.picks button canvas{width:100%;height:auto;display:block;border-radius:8px}
.picks button[aria-current=true]{border-color:#ffb72b}
.done{color:#4cc96a;font-weight:700}
</style>
</head>
<body>
<div class="book">
  <div class="paper"><canvas id="cv" aria-label="著色畫"></canvas></div>
  <section class="tools" aria-label="顏色與工具">
    <div class="pal" id="pal"></div>
    <div class="row">
      <button class="mg-btn alt" id="undo" type="button">↶ 復原</button>
      <button class="mg-btn alt" id="clear" type="button">🧽 清空</button>
      <button class="mg-btn alt" id="pick" type="button">🖼 換圖</button>
      <button class="mg-btn" id="save" type="button">💾 存圖</button>
    </div>
  </section>
</div>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'color', title: '小小著色本', stats: ['prog'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), S = 300;
MG.fit(cv, S, S);

// ---------- shape helpers (300x300 picture space) ----------
const P = s => new Path2D(s);
const C = (cx, cy, r) => { const p = new Path2D(); p.arc(cx, cy, r, 0, Math.PI * 2); return p; };
const E = (cx, cy, rx, ry, rot = 0) => { const p = new Path2D(); p.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); return p; };
const RR = (X, Y, w, h, r = 0) => { const p = new Path2D(); p.roundRect(X, Y, w, h, r); return p; };
const POLY = pts => { const p = new Path2D(); pts.forEach(([a, b], i) => i ? p.lineTo(a, b) : p.moveTo(a, b)); p.closePath(); return p; };
const STAR = (cx, cy, R, r) => { const p = new Path2D(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; i ? p.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q) : p.moveTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } p.closePath(); return p; };
const FLOWER = (cx, cy, s) => { const p = new Path2D(); for (let i = 0; i < 5; i++) { const a = i * 1.2566 - Math.PI / 2; p.moveTo(cx + Math.cos(a) * s * 0.6 + s * 0.45, cy + Math.sin(a) * s * 0.6); p.arc(cx + Math.cos(a) * s * 0.6, cy + Math.sin(a) * s * 0.6, s * 0.45, 0, Math.PI * 2); } return p; };
const CLOUD = (X, Y, s) => P(`M${X} ${Y} a${14 * s} ${14 * s} 0 0 1 ${22 * s} ${-14 * s} a${20 * s} ${20 * s} 0 0 1 ${38 * s} ${2 * s} a${15 * s} ${15 * s} 0 0 1 ${10 * s} ${26 * s} z`);

const PICS = [
  { id: 'pupu', name: '噗噗', regions: () => [
    RR(0, 0, 300, 300), C(252, 52, 28), CLOUD(40, 86, 1.1), P('M0 232 Q150 200 300 232 V300 H0Z'),
    FLOWER(48, 262, 14), C(48, 262, 6), FLOWER(256, 268, 12), C(256, 268, 5),
    P('M85 246 C75 170 110 105 150 105 C190 105 225 170 215 246 Q150 264 85 246Z'), E(168, 96, 20, 9, -0.4),
    E(128, 168, 9, 13), E(172, 168, 9, 13), E(108, 192, 12, 7), E(192, 192, 12, 7), P('M134 194 Q150 216 166 194 Z'),
  ], deco: c => { c.beginPath(); c.moveTo(150, 105); c.quadraticCurveTo(152, 96, 156, 92); c.stroke(); } },
  { id: 'house', name: '小房子', regions: () => [
    RR(0, 0, 300, 300), C(48, 50, 26), CLOUD(190, 70, 1), P('M0 240 Q150 222 300 240 V300 H0Z'),
    RR(240, 168, 16, 78, 3), C(248, 148, 40), RR(166, 90, 22, 44, 2), RR(70, 150, 130, 100, 4), POLY([[52, 156], [135, 82], [218, 156]]),
    RR(118, 192, 34, 58, [16, 16, 0, 0]), RR(82, 170, 28, 26, 3), RR(160, 170, 28, 26, 3), P('M118 300 Q128 272 124 250 H146 Q150 272 168 300Z'),
    FLOWER(40, 270, 11), C(40, 270, 4.5), FLOWER(214, 272, 10), C(214, 272, 4),
  ], deco: c => { c.beginPath(); c.moveTo(96, 170); c.lineTo(96, 196); c.moveTo(82, 183); c.lineTo(110, 183); c.moveTo(174, 170); c.lineTo(174, 196); c.moveTo(160, 183); c.lineTo(188, 183); c.stroke(); c.beginPath(); c.arc(144, 222, 2.5, 0, 7); c.fill(); } },
  { id: 'fish', name: '小魚', regions: () => [
    RR(0, 0, 300, 300), P('M0 262 Q75 246 150 262 T300 256 V300 H0Z'), P('M40 262 C24 232 56 212 40 182 C62 206 42 232 56 260Z'), P('M262 258 C246 230 278 214 262 186 C284 208 264 232 278 256Z'),
    POLY([[214, 150], [272, 108], [260, 150], [272, 192]]), E(150, 150, 76, 48), P('M118 108 Q150 66 186 106Z'), P('M130 192 Q150 222 170 195Z'),
    P('M126 105 Q110 150 126 196 L142 198 Q126 150 142 103Z'), P('M166 103 Q150 150 166 198 L182 196 Q166 150 182 106Z'),
    C(104, 138, 13), C(100, 138, 5.5), C(70, 92, 9), C(54, 60, 6.5), C(78, 36, 5),
  ], deco: c => { c.beginPath(); c.moveTo(80, 160); c.quadraticCurveTo(88, 166, 96, 160); c.stroke(); } },
  { id: 'rocket', name: '火箭', regions: () => [
    RR(0, 0, 300, 300), E(62, 236, 64, 13, -0.3), C(62, 236, 40), C(250, 252, 24), STAR(42, 52, 13, 5), STAR(252, 42, 11, 4.5), STAR(272, 168, 9, 4), STAR(30, 150, 7, 3),
    P('M134 232 Q150 290 166 232Z'), P('M120 176 L94 232 L126 222Z'), P('M180 176 L206 232 L174 222Z'),
    P('M120 226 L120 122 Q150 44 180 122 L180 226Z'), P('M126 106 Q150 46 174 106Z'), RR(120, 196, 60, 12), C(150, 146, 17), C(150, 146, 10),
  ], deco: c => { for (const [a, b] of [[236, 244], [258, 258], [246, 262]]) { c.beginPath(); c.arc(a, b, 3, 0, 7); c.stroke(); } } },
  { id: 'butterfly', name: '蝴蝶', regions: () => [
    RR(0, 0, 300, 300), P('M0 250 Q150 232 300 250 V300 H0Z'), FLOWER(46, 266, 13), C(46, 266, 5), FLOWER(256, 262, 13), C(256, 262, 5),
    E(106, 118, 50, 38, -0.5), E(194, 118, 50, 38, 0.5), E(114, 186, 32, 28, 0.4), E(186, 186, 32, 28, -0.4),
    C(98, 112, 13), C(202, 112, 13), C(116, 188, 9), C(184, 188, 9), E(150, 152, 10, 56), C(150, 90, 15), C(128, 56, 7), C(172, 56, 7),
  ], deco: c => { c.beginPath(); c.moveTo(144, 78); c.quadraticCurveTo(136, 64, 128, 62); c.moveTo(156, 78); c.quadraticCurveTo(164, 64, 172, 62); c.stroke(); for (const sd of [-1, 1]) { c.beginPath(); c.arc(150 + sd * 5, 88, 1.8, 0, 7); c.fill(); } } },
  { id: 'icecream', name: '冰淇淋', regions: () => [
    RR(0, 0, 300, 300), RR(0, 262, 300, 38), POLY([[104, 170], [196, 170], [150, 286]]),
    C(150, 166, 48), C(118, 120, 36), C(182, 120, 36), C(150, 82, 34), P('M110 178 Q118 202 128 184 Q140 206 150 186 Q162 206 172 184 Q182 202 190 178Z'),
    C(162, 44, 12), STAR(40, 50, 14, 6), STAR(258, 64, 12, 5), C(50, 210, 10), C(252, 200, 12),
  ], deco: c => { c.beginPath(); for (let i = 0; i < 4; i++) { c.moveTo(112 + i * 22, 172); c.lineTo(134 + i * 8, 250); c.moveTo(188 - i * 22, 172); c.lineTo(166 - i * 8, 250); } c.stroke(); c.beginPath(); c.moveTo(162, 32); c.quadraticCurveTo(170, 18, 180, 16); c.stroke(); } },
];
const PALETTE = ['#ff4f5e', '#ff8a5c', '#ffb21f', '#ffe14a', '#b5e55a', '#4cc96a', '#2fbfa8', '#5fd0ff', '#3d7bff', '#7a5cff', '#c77dff', '#ff7ac2', '#ffc2d4', '#a0704a', '#5a3a1e', '#9aa4b0', '#2a2f3a', 'ERASE'];

// ---------- state ----------
let picIdx = Math.max(0, PICS.findIndex(p => p.id === MG.store.get('color.pic', 'pupu')));
let regions = [], fills = [], undo = [], color = MG.store.get('color.col', '#ff4f5e'), anims = [], t = 0, celebrated = false;
function load(i) {
  picIdx = i; const pic = PICS[i]; regions = pic.regions();
  fills = MG.store.get('color.fill.' + pic.id, null) || regions.map(() => '#ffffff');
  if (fills.length !== regions.length) fills = regions.map(() => '#ffffff');
  undo = []; anims = []; celebrated = isDone(); MG.store.set('color.pic', pic.id); hud();
}
const saveFills = () => MG.store.set('color.fill.' + PICS[picIdx].id, fills);
const isDone = () => fills.every(f => f !== '#ffffff');
function hud() { const n = fills.filter(f => f !== '#ffffff').length; MG.stat('prog', `${PICS[picIdx].name}　${n}/${fills.length}`); }

// ---------- painting ----------
cv.addEventListener('pointerdown', e => {
  const p = cv.logical(e);
  for (let i = regions.length - 1; i >= 0; i--) {
    if (x.isPointInPath(regions[i], p.x * cv._mgScale, p.y * cv._mgScale) || isIn(regions[i], p)) {
      const to = color === 'ERASE' ? '#ffffff' : color;
      if (fills[i] === to) { MG.sfx('step'); return; }
      undo.push([i, fills[i]]); if (undo.length > 60) undo.shift();
      anims.push({ i, from: fills[i], to, x: p.x, y: p.y, t: 0 });
      fills[i] = to; saveFills(); hud(); MG.sfx(to === '#ffffff' ? 'step' : 'pop');
      if (!celebrated && isDone()) { celebrated = true; setTimeout(celebrate, 500); }
      return;
    }
  }
});
// isPointInPath uses the current transform; this fallback checks in picture space
const hit = document.createElement('canvas').getContext('2d');
function isIn(path, p) { return hit.isPointInPath(path, p.x, p.y); }
function celebrate() {
  MG.sfx('win'); MG.fx.burst(S / 2, S / 2, { n: 40, colors: ['#ff4f5e', '#ffe14a', '#4cc96a', '#3d7bff', '#c77dff', '#fff'], speed: 240, up: 100, size: 6, shape: 'star', life: 1.2 });
  MG.toast('全部塗好了！好漂亮 ^_^', 2200);
}

// ---------- draw ----------
function render(c, list, animList, tt) {
  c.lineJoin = 'round'; c.lineCap = 'round';
  list.forEach((path, i) => {
    const a = animList && animList.find(q => q.i === i);
    c.fillStyle = a ? a.from : fills[i]; c.fill(path);
    if (a) { c.save(); c.clip(path); c.beginPath(); c.arc(a.x, a.y, Math.max(1, a.t * 420), 0, Math.PI * 2); c.fillStyle = a.to; c.fill(); c.restore(); }
    if (i > 0) { c.strokeStyle = '#2a2f3a'; c.lineWidth = 3; c.stroke(path); }
  });
  c.strokeStyle = '#2a2f3a'; c.fillStyle = '#2a2f3a'; c.lineWidth = 3; PICS[picIdx].deco(c);
}
function draw() {
  x.clearRect(0, 0, S, S);
  render(x, regions, anims, t);
  MG.fx.draw(x);
}
MG.loop(dt => { t += dt; for (const a of anims) a.t += dt; anims = anims.filter(a => a.t < 0.9); MG.fx.step(dt); draw(); });

// ---------- tools ----------
const palEl = document.getElementById('pal');
PALETTE.forEach(col => {
  const b = document.createElement('button'); b.type = 'button';
  if (col === 'ERASE') { b.className = 'eraser'; b.setAttribute('aria-label', '橡皮擦'); } else { b.style.background = col; b.setAttribute('aria-label', '顏色 ' + col); }
  b.setAttribute('aria-pressed', col === color);
  b.onclick = () => { color = col; MG.store.set('color.col', col); palEl.querySelectorAll('button').forEach(q => q.setAttribute('aria-pressed', q === b)); MG.sfx('click'); };
  palEl.append(b);
});
document.getElementById('undo').onclick = () => { const u = undo.pop(); if (!u) { MG.toast('沒有可以復原的了'); return; } fills[u[0]] = u[1]; saveFills(); hud(); MG.sfx('flip'); };
document.getElementById('clear').onclick = () => {
  MG.panel({ title: '要全部擦掉嗎？', html: '<p>這張圖的顏色會全部清空</p>', buttons: [
    { label: '清空', on: () => { undo = []; fills = regions.map(() => '#ffffff'); celebrated = false; saveFills(); hud(); MG.hide(); MG.sfx('step'); } },
    { label: '不要', alt: true, on: () => MG.hide() }] });
};
function thumb(i) {
  const k = 2, c = document.createElement('canvas'); c.width = 120 * k; c.height = 120 * k; const g = c.getContext('2d'); g.scale(120 * k / S, 120 * k / S);
  const regs = PICS[i].regions(), fl = MG.store.get('color.fill.' + PICS[i].id, null) || regs.map(() => '#ffffff');
  g.lineJoin = 'round'; regs.forEach((p, j) => { g.fillStyle = fl[j] || '#fff'; g.fill(p); if (j) { g.strokeStyle = '#2a2f3a'; g.lineWidth = 4; g.stroke(p); } });
  g.strokeStyle = '#2a2f3a'; g.fillStyle = '#2a2f3a'; g.lineWidth = 4; PICS[i].deco(g);
  return c;
}
function picker() {
  MG.panel({ title: '選一張圖', html: '<div class="picks" id="picks"></div>', buttons: [{ label: '關閉', alt: true, on: () => MG.hide() }] });
  const box = document.getElementById('picks');
  PICS.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.append(thumb(i));
    const fl = MG.store.get('color.fill.' + p.id, null), done = fl && fl.every(f => f !== '#ffffff');
    const s = document.createElement('div'); s.innerHTML = p.name + (done ? ' <span class="done">✓</span>' : ''); b.append(s);
    if (i === picIdx) b.setAttribute('aria-current', 'true');
    b.onclick = () => { MG.sfx('click'); load(i); MG.hide(); };
    box.append(b);
  });
}
document.getElementById('pick').onclick = picker;
document.getElementById('save').onclick = () => {
  const k = 3, c = document.createElement('canvas'); c.width = S * k; c.height = (S + 40) * k; const g = c.getContext('2d'); g.scale(k, k);
  g.fillStyle = '#fff'; g.fillRect(0, 0, S, S + 40);
  render(g, regions, null, 0);
  g.fillStyle = '#8a7a62'; g.font = '700 14px "Noto Sans TC","PingFang TC",system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const d = new Date(); g.fillText(`小小著色本・${PICS[picIdx].name}・${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`, S / 2, S + 20);
  const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `著色本-${PICS[picIdx].name}.png`; document.body.append(a); a.click(); a.remove();
  MG.sfx('clear'); MG.toast('存好了！');
};
load(picIdx);
if (!MG.store.get('color.seenHelp', false)) {
  MG.store.set('color.seenHelp', true);
  MG.panel({ title: '小小著色本', html: '<p>先選一個顏色，再點圖上的地方，就會塗上顏色！</p><p>塗錯了可以按「復原」，或用「擦」把顏色擦掉。</p>', buttons: [{ label: '開始塗色', on: () => MG.hide() }, { label: '換一張圖', alt: true, on: picker }] });
}
</script>
</body>
</html>
