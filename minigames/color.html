<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>小小著色本</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:linear-gradient(#fff6e0,#ffeef6)}
.book{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top)) 0 0 0;display:grid;gap:8px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom));
  /* the picture is square: give it a row as tall as the screen is wide, the tools take whatever is left (and grow to fill it) */
  grid-template-rows:minmax(0,calc(100vw - 16px)) minmax(auto,1fr)}
@media (min-aspect-ratio:1/1){.book{grid-template-rows:none;grid-template-columns:minmax(0,calc(100dvh - var(--bar-h) - env(safe-area-inset-top) - 16px - max(0px,env(safe-area-inset-bottom) - 8px))) minmax(260px,1fr)}}
.paper{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.paper canvas{display:block;background:#fff;border:3px solid #fff;border-radius:14px;box-shadow:0 6px 18px rgba(140,100,40,.25);touch-action:none;cursor:crosshair}
.tools{background:#fffdf7;border:3px solid #f1d7a6;border-radius:16px;padding:8px;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;box-shadow:0 4px 0 #f1d7a6}
.pal{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
/* tall phones: there is room under the picture, so the colour dots get bigger (6 per row) */
@media (max-aspect-ratio:3/5){.pal{grid-template-columns:repeat(6,1fr);gap:8px;padding:0 4px}.row .mg-btn{min-height:52px}}
@media (min-aspect-ratio:1/1){.pal{grid-template-columns:repeat(6,1fr)}}
@media (min-aspect-ratio:19/10){.pal{grid-template-columns:repeat(9,1fr)}}
/* tablets in landscape: a tall, roomy side panel → 4 big dots per row */
@media (min-aspect-ratio:1/1) and (max-aspect-ratio:8/5) and (min-height:600px){.pal{grid-template-columns:repeat(4,1fr);gap:10px}.row .mg-btn{min-height:56px;font-size:16px}}
/* tablets: cap the dots so they stay dots, not plates */
.pal button{max-width:96px;justify-self:center;width:100%}
.pal button{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e6d6b8;cursor:pointer;padding:0;position:relative}
.pal button[aria-pressed=true]{box-shadow:0 0 0 3px #3a2f22;transform:scale(1.12)}
.pal button.eraser{background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/10px 10px}
.pal button.eraser::after{content:"擦";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 12px "Noto Sans TC",system-ui;color:#8a7a62}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row .mg-btn{min-width:0;min-height:44px;font-size:14px;padding:0 4px}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.picks button{border:3px solid #eedcb8;border-radius:14px;background:#fff;padding:4px;cursor:pointer;font:inherit;font-size:13px;color:#6b4a22}
.picks button canvas{width:100%;height:auto;display:block;border-radius:8px}
.picks button[aria-current=true]{border-color:#ffb72b}
.done{color:#4cc96a;font-weight:700}
/* 🔢 照數字塗 */
.pal button.off{opacity:.25;transform:scale(.8)}
.pal button[data-n]::after{content:attr(data-n);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 clamp(12px,40%,26px) system-ui,sans-serif;color:#fff;-webkit-text-stroke:1.2px rgba(30,30,40,.7);paint-order:stroke fill}
.pal button.want{animation:want .8s ease}
@keyframes want{0%,100%{transform:scale(1)}20%{transform:scale(1.35) rotate(-8deg)}40%{transform:scale(1.1) rotate(8deg)}60%{transform:scale(1.3) rotate(-5deg)}}
.picks{grid-template-columns:repeat(3,1fr)}
/* 👓 大字模式 */
html.mg-big .pal button{box-shadow:0 0 0 2px #8a7a62}
html.mg-big .pal button[aria-pressed=true]{box-shadow:0 0 0 4px #1d160d}
html.mg-big .pal button.eraser::after{font-size:16px;color:#3a2f22}
html.mg-big .row .mg-btn{font-size:17px;min-height:56px}
html.mg-big .tools{border-color:#c9a95a}
html.mg-big .picks button{font-size:16px;border-color:#c9a95a}
</style>
</head>
<body>

    <div class="row">
      <button class="mg-btn alt" id="undo" type="button">↶ 復原</button>
      <button class="mg-btn alt" id="clear" type="button">🧽 清空</button>
      <button class="mg-btn alt" id="pick" type="button">🖼 換圖</button>
      <button class="mg-btn" id="save" type="button">💾 存圖</button>
    </div>

  ], deco: c => { c.beginPath(); for (const sd of [-1, 1]) { c.moveTo(150 + sd * 24, 156); c.lineTo(150 + sd * 56, 150); c.moveTo(150 + sd * 24, 162); c.lineTo(150 + sd * 56, 168); } c.moveTo(150, 158); c.quadraticCurveTo(144, 168, 138, 164); c.moveTo(150, 158); c.quadraticCurveTo(156, 168, 162, 164); c.moveTo(36, 226); c.quadraticCurveTo(56, 236, 74, 226); c.moveTo(34, 246); c.quadraticCurveTo(56, 256, 78, 244); c.stroke();
    for (const ex of [128, 172]) { c.beginPath(); c.ellipse(ex, 132, 2.5, 8, 0, 0, 7); c.fill(); } } },

    RR(94, 104, 24, 48, 4), RR(78, 150, 96, 70, 8), RR(58, 168, 22, 52, 4), C(68, 160, 8), POLY([[38, 238], [60, 204], [60, 238]]),

    RR(0, 0, 300, 300), C(246, 58, 28), STAR(42, 48, 14, 6), STAR(36, 122, 10, 4.5),

    P('M0 238 Q150 222 300 236 L300 254 Q150 240 0 258Z'), E(130, 236, 11, 7), E(170, 236, 11, 7), E(36, 228, 15, 7, -0.5), E(266, 226, 15, 7, 0.5),
  ], deco: c => { c.beginPath(); for (const [a, b] of [[140, 180], [160, 180], [150, 196], [134, 206], [166, 206]]) { c.moveTo(a - 6, b); c.quadraticCurveTo(a, b + 6, a + 6, b); } c.stroke(); } },
  { id: 'rainbow', name: '彩虹', hint: [7, 3, 0, 2, 3, 5, 8, 9, 4, 12, 12, 11, 3, 10, 3], regions: () => [
    RR(0, 0, 300, 300), C(46, 46, 26), RING(150, 236, 130, 115), RING(150, 236, 115, 100), RING(150, 236, 100, 85), RING(150, 236, 85, 70), RING(150, 236, 70, 55), RING(150, 236, 55, 40),
    P('M0 236 Q150 226 300 236 V300 H0Z'), CLOUD(0, 252, 1.3), CLOUD(205, 252, 1.3),
    FLOWER(110, 274, 12), C(110, 274, 6), FLOWER(190, 276, 12), C(190, 276, 6),
  ], deco: c => { } },
  { id: 'snail', name: '蝸牛', hint: [7, 3, 12, 4, 3, 2, 1, 11, 0, 16, 16, 5, 0, 3, 10, 3], regions: () => [
    RR(0, 0, 300, 300), C(46, 46, 24), CLOUD(150, 60, 1), P('M0 246 Q150 234 300 246 V300 H0Z'),
    P('M30 248 Q30 226 60 224 L222 220 Q236 218 236 200 L236 150 Q236 132 250 132 Q264 132 264 150 L264 222 Q264 248 236 248Z'),
    C(140, 160, 60), C(146, 162, 42), C(151, 164, 26), C(155, 165, 11), C(232, 102, 8), C(266, 100, 8), E(150, 278, 34, 10),
    FLOWER(40, 276, 11), C(40, 276, 6), FLOWER(270, 276, 11), C(270, 276, 6),
  ], deco: c => { c.beginPath(); c.moveTo(244, 136); c.lineTo(234, 110); c.moveTo(256, 136); c.lineTo(264, 108); c.moveTo(244, 160); c.quadraticCurveTo(250, 166, 256, 160); c.moveTo(118, 278); c.lineTo(182, 278); c.stroke(); c.beginPath(); c.arc(246, 148, 2.2, 0, 7); c.arc(256, 148, 2.2, 0, 7); c.fill(); } },
);
PICS.splice(MG.hero === 'niu' ? 0 : 1, 0, NIU_PIC);
const PALETTE = ['#ff4f5e', '#ff8a5c', '#ffb21f', '#ffe14a', '#b5e55a', '#4cc96a', '#2fbfa8', '#5fd0ff', '#3d7bff', '#7a5cff', '#c77dff', '#ff7ac2', '#ffc2d4', '#a0704a', '#5a3a1e', '#9aa4b0', '#2a2f3a', 'ERASE'];

// ---------- state ----------
let picIdx = Math.max(0, PICS.findIndex(p => p.id === MG.store.get('color.pic', MG.hero === 'niu' ? 'niu' : 'pupu')));
let regions = [], fills = [], undo = [], color = MG.store.get('color.col', '#ff4f5e'), anims = [], t = 0, celebrated = false;
// 🔢 照數字塗: every part shows a little dot with the colour (and number) it wants
let mode = MG.store.get('color.mode', 'free') === 'num' ? 'num' : 'free', info = null, wantT = {};
const fillKey = id => (mode === 'num' ? 'color.nfill.' : 'color.fill.') + id;
const target = i => PALETTE[PICS[picIdx].hint[i]];
// numbers for the colours a picture uses (in palette order)
const numsOf = pic => [...new Set(pic.hint)].sort((a, b) => a - b);
function load(i) {
  picIdx = i; const pic = PICS[i]; regions = pic.regions();
  fills = MG.store.get(fillKey(pic.id), null) || regions.map(() => '#ffffff');
  if (fills.length !== regions.length) fills = regions.map(() => '#ffffff');
  undo = []; anims = []; info = analyse(regions); celebrated = isDone(); MG.store.set('color.pic', pic.id); hud(); syncPal();
}
const saveFills = () => MG.store.set(fillKey(PICS[picIdx].id), fills);
const isDone = () => fills.every(f => f !== '#ffffff');
function hud() { const n = fills.filter(f => f !== '#ffffff').length; MG.stat('prog', `${mode === 'num' ? '🔢 ' : ''}${PICS[picIdx].name}　${n}/${fills.length}`); }
// where each part can be seen (later parts cover earlier ones): a 4-px grid → visible area + the roomiest spot for its number dot
const INFO = new Map();
function analyse(regs) {
  const id = PICS[picIdx].id; if (INFO.has(id)) return INFO.get(id);
  const G = 4, N = S / G, own = new Int16Array(N * N), dist = new Float32Array(N * N);
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
    let o = 0; const px = gx * G + G / 2, py = gy * G + G / 2;
    for (let k = regs.length - 1; k >= 0; k--) if (hit.isPointInPath(regs[k], px, py)) { o = k; break; }
    own[gy * N + gx] = o;
  }
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
    const q = gy * N + gx, o = own[q];
    const edge = gx === 0 || gy === 0 || gx === N - 1 || gy === N - 1 || own[q - 1] !== o || own[q + 1] !== o || own[q - N] !== o || own[q + N] !== o;
    dist[q] = edge ? 1 : 1e9;
  }
  for (let gy = 1; gy < N; gy++) for (let gx = 1; gx < N - 1; gx++) { const q = gy * N + gx; dist[q] = Math.min(dist[q], dist[q - 1] + 1, dist[q - N] + 1, dist[q - N - 1] + 1.41, dist[q - N + 1] + 1.41); }
  for (let gy = N - 2; gy >= 0; gy--) for (let gx = N - 2; gx > 0; gx--) { const q = gy * N + gx; dist[q] = Math.min(dist[q], dist[q + 1] + 1, dist[q + N] + 1, dist[q + N + 1] + 1.41, dist[q + N - 1] + 1.41); }
  const out = regs.map(() => ({ area: 0, x: 0, y: 0, r: 0 }));
  for (let q = 0; q < N * N; q++) { const o = out[own[q]]; o.area++; if (dist[q] > o.r) { o.r = dist[q]; o.x = (q % N) * G + G / 2; o.y = Math.floor(q / N) * G + G / 2; } }
  out.forEach(o => o.r *= G);
  INFO.set(id, out); return out;
}

// ---------- painting ----------
cv.addEventListener('pointerdown', e => {
  const p = cv.logical(e);
  for (let i = regions.length - 1; i >= 0; i--) {
    if (x.isPointInPath(regions[i], p.x * cv._mgScale, p.y * cv._mgScale) || isIn(regions[i], p)) {
      const to = color === 'ERASE' ? '#ffffff' : color;
      if (fills[i] === to) { MG.sfx('step'); return; }
      if (mode === 'num' && to !== '#ffffff' && to !== target(i)) {   // wrong colour: the right colour dot in the palette wiggles
        MG.sfx('miss'); wantT[i] = t;
        const want = palEl.querySelector(`[data-col="${target(i)}"]`);
        if (want) { want.classList.remove('want'); void want.offsetWidth; want.classList.add('want'); }
        return;
      }
      undo.push([i, fills[i]]); if (undo.length > 60) undo.shift();
      anims.push({ i, from: fills[i], to, x: p.x, y: p.y, t: 0 });
      fills[i] = to; saveFills(); hud();
      if (to === '#ffffff') { MG.sfx('step'); juice('whoosh'); }
      else {   // pop + a chime that climbs as the picture fills up (sparkles near the end)
        const prog = fills.filter(f => f !== '#ffffff').length / fills.length;
        MG.sfx('pop'); juice('match', prog >= 0.75 ? 3 : prog >= 0.4 ? 2 : 1);
      }
      if (!celebrated && isDone()) { celebrated = true; setTimeout(celebrate, 500); }
      return;
    }
  }
});
// extra shared sounds, throttled (≥60 ms per name) so quick taps don't pile up
const juiceT = {};
function juice(name, n) { const q = performance.now(); if (q - (juiceT[name] || 0) < 60) return; juiceT[name] = q; MG.sfx(name, n); }
// isPointInPath uses the current transform; this fallback checks in picture space
const hit = document.createElement('canvas').getContext('2d');
function isIn(path, p) { return hit.isPointInPath(path, p.x, p.y); }
function celebrate() {
  MG.sfx('win'); MG.sfx('yay'); MG.fx.burst(S / 2, S / 2, { n: 40, colors: ['#ff4f5e', '#ffe14a', '#4cc96a', '#3d7bff', '#c77dff', '#fff'], speed: 240, up: 100, size: 6, shape: 'star', life: 1.2 });
  MG.toast('Beautiful! 🎨🎉', 2200);
}

// ---------- draw ----------
function render(c, list, animList, tt) {
  c.lineJoin = 'round'; c.lineCap = 'round';
  list.forEach((path, i) => {
    const a = animList && animList.find(q => q.i === i);
    c.fillStyle = a ? a.from : fills[i]; c.fill(path);
    if (a) { c.save(); c.clip(path); c.beginPath(); c.arc(a.x, a.y, Math.max(1, a.t * 420), 0, Math.PI * 2); c.fillStyle = a.to; c.fill(); c.restore(); }
    if (i > 0) { c.strokeStyle = '#2a2f3a'; c.lineWidth = 3; c.stroke(path); }
  });
  c.strokeStyle = '#2a2f3a'; c.fillStyle = '#2a2f3a'; c.lineWidth = 3; PICS[picIdx].deco(c);
  if (mode === 'num' && animList && info) numDots(c, tt);
}
// 🔢 the little colour dots with numbers (only on parts that still want their colour)
function numDots(c, tt) {
  const pic = PICS[picIdx], nums = numsOf(pic);
  c.textAlign = 'center'; c.textBaseline = 'middle';
  info.forEach((o, i) => {
    if (!o.area || fills[i] === target(i) || anims.some(a => a.i === i)) return;
    const w = wantT[i] != null && tt - wantT[i] < 0.8 ? 1 + Math.sin((tt - wantT[i]) * 25) * 0.25 : 1;
    const r = Math.max(5, Math.min(11, o.r * 0.75)) * w;
    c.beginPath(); c.arc(o.x, o.y, r, 0, 7); c.fillStyle = target(i); c.fill(); c.lineWidth = 2.2; c.strokeStyle = '#fff'; c.stroke();
    c.lineWidth = 1; c.strokeStyle = 'rgba(42,47,58,.55)'; c.beginPath(); c.arc(o.x, o.y, r + 1.4, 0, 7); c.stroke();
    if (r >= 7) { const n = String(nums.indexOf(pic.hint[i]) + 1); c.font = `900 ${Math.round(r * 1.15)}px system-ui,sans-serif`; c.lineWidth = 2.6; c.strokeStyle = 'rgba(30,30,40,.75)'; c.strokeText(n, o.x, o.y + 0.5); c.fillStyle = '#fff'; c.fillText(n, o.x, o.y + 0.5); }
  });
}
function draw() {
  x.clearRect(0, 0, S, S);
  render(x, regions, anims, t);
  MG.fx.draw(x);
}
MG.loop(dt => { t += dt; for (const a of anims) a.t += dt; anims = anims.filter(a => a.t < 0.9); MG.fx.step(dt); draw(); });

// ---------- tools ----------
const palEl = document.getElementById('pal');
PALETTE.forEach(col => {
  const b = document.createElement('button'); b.type = 'button';
  if (col === 'ERASE') { b.className = 'eraser'; b.setAttribute('aria-label', '橡皮擦'); } else { b.style.background = col; b.setAttribute('aria-label', '顏色 ' + col); }
  b.setAttribute('aria-pressed', col === color); b.dataset.col = col;
  b.onclick = () => { color = col; MG.store.set('color.col', col); palEl.querySelectorAll('button').forEach(q => q.setAttribute('aria-pressed', q === b)); MG.sfx('click'); };
  palEl.append(b);
});
// 🔢 mode: colours the picture uses get their number, the others fade out
function syncPal() {
  const pic = PICS[picIdx], nums = numsOf(pic);
  palEl.querySelectorAll('button').forEach(b => {
    const k = PALETTE.indexOf(b.dataset.col), n = nums.indexOf(k);
    b.classList.toggle('off', mode === 'num' && b.dataset.col !== 'ERASE' && n < 0);
    if (mode === 'num' && n >= 0) b.dataset.n = n + 1; else delete b.dataset.n;
  });
}
document.getElementById('undo').onclick = () => { const u = undo.pop(); if (!u) { MG.sfx('miss'); MG.toast('No more ↩️'); return; } fills[u[0]] = u[1]; saveFills(); hud(); MG.sfx('flip'); juice('whoosh'); };
document.getElementById('clear').onclick = () => {
  MG.panel({ title: '要全部擦掉嗎？', html: '<p>這張圖的顏色會全部清空</p>', buttons: [
    { label: '清空', on: () => { undo = []; fills = regions.map(() => '#ffffff'); celebrated = false; saveFills(); hud(); MG.hide(); MG.sfx('step'); } },
    { label: '不要', alt: true, on: () => MG.hide() }] });
};
function thumb(i) {
  const k = 2, c = document.createElement('canvas'); c.width = 120 * k; c.height = 120 * k; const g = c.getContext('2d'); g.scale(120 * k / S, 120 * k / S);
  const regs = PICS[i].regions(), fl = MG.store.get(fillKey(PICS[i].id), null) || regs.map(() => '#ffffff');
  g.lineJoin = 'round'; regs.forEach((p, j) => { g.fillStyle = fl[j] || '#fff'; g.fill(p); if (j) { g.strokeStyle = '#2a2f3a'; g.lineWidth = 4; g.stroke(p); } });
  g.strokeStyle = '#2a2f3a'; g.fillStyle = '#2a2f3a'; g.lineWidth = 4; PICS[i].deco(g);
  return c;
}
function picker() {
  MG.panel({ title: '選一張圖', html: `<div class="mg-pick"><button type="button" class="mg-opt" data-md="free">🖍 自由塗色<small>想塗什麼顏色都可以</small></button><button type="button" class="mg-opt" data-md="num">🔢 照數字塗<small>跟著小圓點的顏色塗</small></button></div><div class="picks" id="picks"></div>`, buttons: [{ label: '關閉', alt: true, on: () => MG.hide() }] });
  document.querySelectorAll('[data-md]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.md === mode); b.onclick = () => { if (mode === b.dataset.md) return; MG.sfx('click'); setMode(b.dataset.md); picker(); }; });
  const box = document.getElementById('picks');
  PICS.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.append(thumb(i));
    const fl = MG.store.get(fillKey(p.id), null), done = fl && fl.every(f => f !== '#ffffff');
    const s = document.createElement('div'); s.dataset.keep = ''; s.innerHTML = p.name + (done ? ' <span class="done">✓</span>' : ''); b.append(s);
    if (i === picIdx) b.setAttribute('aria-current', 'true');
    b.onclick = () => { MG.sfx('click'); load(i); MG.hide(); };
    box.append(b);
  });
}
document.getElementById('pick').onclick = picker;
document.getElementById('save').onclick = () => {
  const k = 3, c = document.createElement('canvas'); c.width = S * k; c.height = (S + 40) * k; const g = c.getContext('2d'); g.scale(k, k);
  g.fillStyle = '#fff'; g.fillRect(0, 0, S, S + 40);
  render(g, regions, null, 0);
  g.fillStyle = '#8a7a62'; g.font = '700 14px "Noto Sans TC","PingFang TC",system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const d = new Date(); g.fillText(`小小著色本・${PICS[picIdx].name}・${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`, S / 2, S + 20);
  const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `著色本-${PICS[picIdx].name}.png`; document.body.append(a); a.click(); a.remove();
  MG.sfx('clear'); juice('sparkle'); MG.toast('Saved! 💾');
};
function setMode(m) {
  mode = m === 'num' ? 'num' : 'free'; MG.store.set('color.mode', mode);
  if (mode === 'num' && !MG.store.get('color.seenNum', false)) { MG.store.set('color.seenNum', true); setTimeout(() => MG.panel({ title: '🔢 照數字塗', html: '<p>圖上每個地方都有一個<b>小圓點</b>，圓點是什麼顏色，就選那個顏色來塗！</p><p>圓點裡的數字，和下面顏色上的數字一樣。選錯顏色的話，對的顏色會跳一跳提醒你 ^_^</p>', buttons: [{ label: '開始塗色', on: () => MG.hide() }] }), 50); }
  load(picIdx);
}
load(picIdx);
window.CLR = { pics: () => PICS.map(p => ({ id: p.id, name: p.name, n: p.regions().length, hint: p.hint ? p.hint.length : -1 })), load: i => { load(i); return { id: PICS[i].id }; }, setMode,
  info: () => info.map(o => ({ area: o.area, x: o.x, y: o.y, r: o.r })), target: i => target(i), get fills() { return fills.slice(); }, get done() { return isDone(); }, get mode() { return mode; },
  pick: col => { const b = palEl.querySelector(`[data-col="${col}"]`); b && b.click(); },
  toClient(px, py) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + px * (rc.width - 2 * B) / S, y: rc.top + B + py * (rc.height - 2 * B) / S }; } };
if (!MG.store.get('color.seenHelp', false)) {
  MG.store.set('color.seenHelp', true);
  MG.panel({ title: '小小著色本', html: '<p>先選一個顏色，再點圖上的地方，就會塗上顏色！</p><p>塗錯了可以按「復原」，或用「擦」把顏色擦掉。</p><p>按「換圖」有 18 張圖，還可以選「🔢 照數字塗」喔！</p>', buttons: [{ label: '開始塗色', on: () => MG.hide() }, { label: '換一張圖', alt: true, on: picker }] });
}
