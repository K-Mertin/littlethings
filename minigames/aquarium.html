function loadFree() {

  step(sec, auto = false, dt = 1 / 30) { for (let i = 0, n = Math.round(sec / dt); i < n && state === 'play'; i++) { if (auto && i % 3 === 0) keeper(); update(dt); } return state; },
  keeper: () => keeper(),
  get ptr() { return ptr && { mode: ptr.mode, x: Math.round(ptr.x), y: Math.round(ptr.y) }; }, get zoom() { return goalZoom; },
  toClient(lx, ly) { const r = cv.getBoundingClientRect(), B = 3; return { x: r.left + B + lx * (r.width - 2 * B) / W, y: r.top + B + ly * (r.height - 2 * B) / H }; },
  toolPt: k => { const tl = tools[k]; return AQT.toClient(tl.x + tl.w / 2, tl.y + tl.h / 2); },
  tankPt: (fx, fy) => AQT.toClient(gx(fx), lerp(L.wy, L.T.b, fy)), bagPt: () => { const b = bags.find(b => !b.away); return b && AQT.toClient(b.x, b.y); },
  eggPt: () => { const e = eggs[0]; return e && AQT.toClient(gx(e.fx), eggY(e)); }, hidePt: () => { const h = hides.find(h => !h.found); return h && AQT.toClient(decoX(h.d), decoY(h.d) - L.u * 0.4); },
  gunkPt: () => { const g = gunk[0]; return g && AQT.toClient(gx(g.fx), floorY(gx(g.fx)) - 6); }, fishPt: i => { const f = fish[i]; return f && AQT.toClient(f.x, f.y); },
  layout: () => ({ W, H, land, T: { ...L.T }, wy: L.wy, u: L.u, tray: { ...L.tray }, card: { ...L.card } }),
  free: () => MG.store.get('aquarium.free', null),
  prof(n = 10) { const o = {}; const tm = (k, f) => { const t0 = performance.now(); for (let i = 0; i < n; i++) f(); o[k] = +((performance.now() - t0) / n).toFixed(2); }; tm('draw', draw); tm('update', () => update(1 / 60)); return o; },
};
</script>
