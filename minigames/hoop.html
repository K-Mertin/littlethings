<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'hoop', title: '噗噗投籃', stats: ['goal', 'time'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, k) => a + (b - a) * k, TAU = Math.PI * 2;
const TS = () => MG.textScale, F = (px, w = 900) => `${w} ${Math.round(px * TS())}px system-ui,"Noto Sans TC","Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
const EMO = px => `${Math.round(px)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;

// ---------- levels ----------
// t: targets — k: hoop | can | basket | pool | bottle · fx: 0 (near) … 1 (far) · fy: 0 (low / on the floor) … 1 (high)
//    pts: stars for that target · move: { ax, ay, sp } swings back and forth · hop: [[fx range], [fy range]] jumps after every basket
// ball: bb basketball | paper | fruit | beach | ring · goal: baskets (or stars when pts) · wind: number (→ +) or 'shot' (new wind every throw)
// preview: 2 whole dotted path · 1 just the start · 0 none · assist: 0 strong … 2 gentle · bank / tramp: ×2 after touching the board / trampoline
// ceil: a ceiling at that height · pillar: { fx, fy } a tall wall · tramp: { fx } a trampoline on the floor
const LEVELS = [
  { name: '第一球', theme: 'court', ball: 'bb', goal: 3, t: [{ k: 'hoop', fx: .3, fy: .3 }], preview: 2, assist: 0, mk: '🏀' },
  { name: '遠一點點', theme: 'court', ball: 'bb', goal: 4, t: [{ k: 'hoop', fx: .75, fy: .45 }], preview: 2, assist: 0 },
  { name: '跳跳籃框', theme: 'court', ball: 'bb', goal: 5, t: [{ k: 'hoop', fx: .5, fy: .4, hop: [[.1, .95], [.15, .7]] }], preview: 2, assist: 0, mk: '📏' },
  { name: '紙團丟垃圾桶', theme: 'room', ball: 'paper', goal: 4, t: [{ k: 'can', fx: .55, fy: 0 }], preview: 2, assist: 0, mk: '📄' },
  { name: '蘋果進籃子', theme: 'orchard', ball: 'fruit', goal: 5, t: [{ k: 'basket', fx: .6, fy: 0 }], preview: 2, assist: 0, mk: '🍎' },
  { name: '會走的籃框', theme: 'gym', ball: 'bb', goal: 4, t: [{ k: 'hoop', fx: .55, fy: .4, move: { ax: .33, sp: .9 } }], preview: 2, assist: 0, mk: '↔️' },
  { name: '沙灘球', theme: 'beach', ball: 'beach', goal: 4, t: [{ k: 'pool', fx: .6, fy: 0 }], preview: 2, assist: 0, mk: '🏖️' },
  { name: '三個籃框', theme: 'court', ball: 'bb', goal: 8, pts: 1, t: [{ k: 'hoop', fx: .1, fy: .2, pts: 1 }, { k: 'hoop', fx: .55, fy: .5, pts: 2 }, { k: 'hoop', fx: 1, fy: .8, pts: 3 }], preview: 1, assist: 1, mk: '🎯' },
  { name: '微微風', theme: 'roof', ball: 'bb', goal: 4, wind: .5, t: [{ k: 'hoop', fx: .55, fy: .4 }], preview: 1, assist: 1, mk: '🌬️' },
  { name: '套圈圈', theme: 'fair', ball: 'ring', goal: 3, t: [{ k: 'bottle', fx: .55, fy: .12 }], preview: 2, assist: 0, mk: '💍' },
  { name: '擦板得分', theme: 'gym', ball: 'bb', goal: 6, pts: 1, bank: 1, t: [{ k: 'hoop', fx: .7, fy: .5, pts: 1 }], preview: 1, assist: 1, mk: '🪧' },
  { name: '垃圾桶跳跳', theme: 'room', ball: 'paper', goal: 5, t: [{ k: 'can', fx: .5, fy: 0, hop: [[.05, 1], [0, 0]] }], preview: 1, assist: 1, mk: '📏' },
  { name: '水果小推車', theme: 'orchard', ball: 'fruit', goal: 5, t: [{ k: 'basket', fx: .5, fy: 0, move: { ax: .35, sp: .75 } }], preview: 1, assist: 1, mk: '↔️' },
  { name: '風變來變去', theme: 'roof', ball: 'bb', goal: 5, wind: 'shot', t: [{ k: 'hoop', fx: .6, fy: .45 }], preview: 1, assist: 1, mk: '🌬️' },
  { name: '好多瓶子', theme: 'fair', ball: 'ring', goal: 6, pts: 1, t: [{ k: 'bottle', fx: .1, fy: .12, pts: 1 }, { k: 'bottle', fx: .55, fy: .22, pts: 2 }, { k: 'bottle', fx: 1, fy: .32, pts: 3 }], preview: 1, assist: 1, mk: '🎯' },
  { name: '海風沙灘球', theme: 'beach', ball: 'beach', goal: 4, wind: .6, t: [{ k: 'pool', fx: .55, fy: 0 }], preview: 1, assist: 1, mk: '🌬️' },
  { name: '牆壁反彈', theme: 'gym', ball: 'bb', goal: 3, ceil: .88, pillar: { fx: .42, fy: .5 }, t: [{ k: 'basket', fx: 1, fy: 0 }], preview: 2, assist: 0, mk: '🧱' },
  { name: '上上下下', theme: 'gym', ball: 'bb', goal: 5, t: [{ k: 'hoop', fx: .6, fy: .45, move: { ay: .3, sp: 1 } }], preview: 1, assist: 1, mk: '↕️' },
  { name: '三個垃圾桶', theme: 'room', ball: 'paper', goal: 10, pts: 1, t: [{ k: 'can', fx: .1, fy: 0, pts: 1 }, { k: 'can', fx: .55, fy: .3, pts: 2 }, { k: 'can', fx: 1, fy: .55, pts: 3 }], preview: 0, assist: 1, mk: '🎯' },
  { name: '忽遠忽近', theme: 'court', ball: 'bb', goal: 6, t: [{ k: 'hoop', fx: .5, fy: .5, hop: [[0, 1], [.1, .85]] }], preview: 0, assist: 2, mk: '📏' },
  { name: '彈跳床', theme: 'gym', ball: 'bb', goal: 6, pts: 1, tramp: { fx: .32 }, ceil: .95, t: [{ k: 'hoop', fx: .9, fy: .6, pts: 1 }], preview: 1, assist: 1, mk: '🤸' },
  { name: '風中套圈', theme: 'fair', ball: 'ring', goal: 4, wind: 'shot', t: [{ k: 'bottle', fx: .6, fy: .12 }], preview: 0, assist: 1, mk: '🌬️' },
  { name: '移動三籃框', theme: 'gym', ball: 'bb', goal: 10, pts: 1, t: [{ k: 'hoop', fx: .15, fy: .25, pts: 1, move: { ax: .12, sp: .8 } }, { k: 'hoop', fx: .55, fy: .55, pts: 2, move: { ay: .14, sp: 1 } }, { k: 'hoop', fx: .88, fy: .82, pts: 3, move: { ax: .05, sp: 1.2 } }], preview: 0, assist: 2, mk: '🎯' },
  { name: '投籃冠軍', theme: 'roof', ball: 'bb', goal: 6, wind: 'shot', t: [{ k: 'hoop', fx: .6, fy: .5, move: { ax: .3, sp: .85 } }], preview: 0, assist: 2, mk: '🏆' },
];
const THEME_E = { court: '🏀', gym: '🏫', room: '🛏️', orchard: '🍎', beach: '🏖️', fair: '🎡', roof: '🏙️' };
// the first time a new kind of level shows up, a panel explains it once
const NEWS = {
  basic: ['🏀 投籃', '手指<b>按住往上滑</b>，放開就把球丟出去！往哪邊滑，球就往哪邊飛；滑長一點，球會飛得比較遠。<br>白色小點點是球會飛的路線，點點變成<b>金色</b>就是會進喔！'],
  hop: ['📏 跳跳籃框', '每投進一球，籃框就會<b>跳到新的地方</b>，有時候近、有時候遠。'],
  paper: ['📄 紙團丟垃圾桶', '把揉好的紙團丟進垃圾桶！紙團很輕，輕輕滑一下就好。'],
  fruit: ['🍎 水果進籃子', '把蘋果、橘子、水梨丟進水果籃，看看能裝幾個！'],
  move: ['↔️ 會走的籃框', '籃框會<b>走來走去</b>，看準了再丟！'],
  beach: ['🏖️ 沙灘球', '沙灘球又大又輕，會<b>慢慢飄</b>，把它丟進游泳池！'],
  multi: ['🎯 好多目標', '有好幾個目標，旁邊的<b>星星越多，分數越多</b>。遠的、高的星星比較多！集滿星星就過關。'],
  wind: ['🌬️ 起風了', '看上面的小旗子：風往哪邊吹，球就會被<b>吹過去</b>。丟的時候往另一邊偏一點點！'],
  ring: ['💍 套圈圈', '把圈圈丟過去，<b>套在瓶子上</b>！圈圈要從瓶子正上方掉下來才套得進去。'],
  bank: ['🪧 擦板得分', '讓球先<b>碰到籃板</b>再進，可以拿兩倍星星！直接進也可以喔。'],
  wall: ['🧱 牆壁反彈', '一道高牆擋在中間！從牆上面的空隙丟過去，也可以<b>撞到牆壁彈進籃子</b>。'],
  vmove: ['↕️ 上上下下', '籃框會<b>上上下下</b>，等它到你喜歡的高度再丟！'],
  tramp: ['🤸 彈跳床', '把球丟到<b>彈跳床</b>上，會彈得好高！彈過再進球，可以拿兩倍星星。'],
};
const newsOf = (L, i) => [i === 0 && 'basic', L.t.some(t => t.hop) && 'hop', L.ball === 'paper' && 'paper', L.ball === 'fruit' && 'fruit',
  L.t.some(t => t.move && t.move.ax) && 'move', L.t.some(t => t.move && t.move.ay && !t.move.ax) && 'vmove', L.ball === 'beach' && 'beach', L.t.length > 1 && 'multi',
  L.wind && 'wind', L.ball === 'ring' && 'ring', L.bank && 'bank', L.pillar && 'wall', L.tramp && 'tramp'].filter(Boolean);
// ball kinds: r = drawn radius, cr = touch radius, gk gravity, wk wind, drag air drag, bo bounce on the floor
const BALLS = {
  bb: { r: 14, cr: 14, gk: 1, wk: .6, drag: 0, bo: .62 },
  paper: { r: 10, cr: 10, gk: .9, wk: 1.3, drag: .3, bo: .3 },
  fruit: { r: 12.5, cr: 12.5, gk: 1, wk: .5, drag: 0, bo: .35 },
  beach: { r: 25, cr: 25, gk: .55, wk: 1.1, drag: .5, bo: .72 },
  ring: { r: 20, cr: 5, gk: 1, wk: .7, drag: .1, bo: .25 },
};
const SIZE = { hoop: 26, can: 28, basket: 42, pool: 72, bottle: 0 };

// ---------- layout ----------
let W = 360, H = 720, land = false, S = 1, X0 = 60, FLOOR = 640, layoutV = 0;
let level = 1, LV = LEVELS[0];
function layout() {
  S = Math.min(W, H * 0.8) / 380;
  FLOOR = Math.round(H - (land ? 54 * S : Math.max(56 * S, H * 0.095)));
  X0 = land ? Math.max(70 * S, W * 0.1) : Math.max(52 * S, W * 0.14);
  layoutV++; bgK = ''; G0 = null; gCache = null;
}
const RX0 = () => X0 + 82 * S, RX1 = () => W - 62 * S;
const RY0 = () => FLOOR - 82 * S, RY1 = () => 104 * S;
const tX = fx => RX0() + fx * (RX1() - RX0());
const hoopY = fy => RY0() + fy * (RY1() - RY0());
const baseY = fy => FLOOR - fy * (FLOOR - RY1() - 70 * S);
addEventListener('mg-big', () => { bgK = ''; });

// ---------- game state ----------
let mode = 'relax', state = 'ready', T = 0, acc = 0, t = 0;
let targets = [], ball = null, phase = 'ready', phaseT = 0, popK = 1, wind = 0;
let made = 0, shots = 0, prog = 0, streak = 0, missRun = 0, timeLeft = 0, winT = 0;
let pops = [], drag = null, kb = null, preview = null, prevT = 0, heroMood = 'happy', heroT = 0, heroSq = 0, tramp = null, fruitK = 0;
const DT = 1 / 120, GRAV = () => 1300 * S;
const goalOf = () => LV.goal;
const timeFor = L => L.pts ? L.goal * 6 + 25 : L.goal * 11 + 20;

function makeTargets() {
  targets = LV.t.map((d, i) => ({ ...d, i, fx: d.fx, fy: d.fy, hopA: null, rings: 0, net: 0, sw: 0, hitT: 0 }));
  tramp = LV.tramp ? { fx: LV.tramp.fx, sq: 0 } : null;
}
function reset() {
  MG.fx.clear(); makeTargets(); G0 = null; gCache = null;
  made = 0; shots = 0; prog = 0; streak = 0; missRun = 0; winT = 0; pops = []; drag = null; kb = null; preview = null;
  timeLeft = timeFor(LV); T = 0; acc = 0;
  wind = LV.wind === 'shot' ? newWind() : (LV.wind || 0);
  heroMood = 'happy'; heroT = 0; newBall(true); hud();
}
function newWind() { let w; do w = MG.rand(-0.85, 0.85); while (Math.abs(w) < 0.35 || Math.abs(w - wind) < 0.3); return w; }
function hud() {
  MG.stat('goal', `${LV.pts ? '⭐' : ballIcon()} ${Math.min(prog, goalOf())}/${goalOf()}`);
  MG.stat('time', mode === 'timed' ? `⏱ ${Math.ceil(timeLeft)}` : '');
}
const ballIcon = () => ({ bb: '🏀', paper: '📄', fruit: '🍎', beach: '🏖️', ring: '💍' })[LV.ball];

// ---------- targets: where they are at time T ----------
function tpos(tg, TT) {
  let fx = tg.fx, fy = tg.fy;
  if (tg.move) { fx += (tg.move.ax || 0) * Math.sin(TT * tg.move.sp + (tg.move.ph || 0)); fy += (tg.move.ay || 0) * Math.sin(TT * tg.move.sp * 1.1 + (tg.move.ph || 0)); }
  if (tg.hopA) { const k = tg.hopA.k, e = k < 1 ? 1 - Math.pow(1 - k, 3) : 1; fx = lerp(tg.hopA.fx0, tg.hopA.fx1, e); fy = lerp(tg.hopA.fy0, tg.hopA.fy1, e); }
  const X = tX(fx);
  if (tg.k === 'hoop') return { x: X, y: hoopY(fy), fx, fy, lift: tg.hopA && tg.hopA.k < 1 ? Math.sin(tg.hopA.k * Math.PI) * 40 * S : 0 };
  return { x: X, y: baseY(fy), fx, fy, lift: tg.hopA && tg.hopA.k < 1 ? Math.sin(tg.hopA.k * Math.PI) * 40 * S : 0 };
}
const moving = () => targets.some(tg => tg.move);
// geometry: segments (with bounce e and a kind), round points (rim edges), score lines
let G0 = null, gCache = null;
function staticGeom() {
  const segs = [], pts = [];
  let ceil = null;
  if (LV.ceil) ceil = hoopY(LV.ceil);
  if (LV.pillar) {
    const px = tX(LV.pillar.fx), top = hoopY(LV.pillar.fy), w = 16 * S;
    segs.push({ ax: px - w, ay: FLOOR, bx: px - w, by: top, e: .5, kind: 'wall' }, { ax: px - w, ay: top, bx: px + w, by: top, e: .5, kind: 'wall' }, { ax: px + w, ay: top, bx: px + w, by: FLOOR, e: .5, kind: 'wall' });
  }
  if (tramp) { const tp = trampPos(); segs.push({ ax: tp.x - tp.w / 2, ay: tp.y, bx: tp.x + tp.w / 2, by: tp.y, e: 1, kind: 'tramp' }); }
  return { segs, pts, ceil };
}
const trampPos = () => ({ x: tX(tramp.fx), y: FLOOR - 26 * S, w: 96 * S });
function targetGeom(tg, p, segs, pts, zones) {
  const i = tg.i, s = S;
  if (tg.k === 'hoop') {
    const rw = SIZE.hoop * s, cx = p.x, cy = p.y, bx = cx + rw + 6 * s;
    pts.push({ x: cx - rw, y: cy, r: 3 * s, e: .5, ti: i }, { x: cx + rw, y: cy, r: 3 * s, e: .5, ti: i });
    segs.push({ ax: bx, ay: cy - 66 * s, bx: bx, by: cy + 12 * s, e: .62, kind: 'board', ti: i });
    segs.push({ ax: bx + 10 * s, ay: cy + 12 * s, bx: bx + 10 * s, by: FLOOR, e: .4, kind: 'pole', ti: i });
    zones.push({ y: cy, x0: cx - rw + 2 * s, x1: cx + rw - 2 * s, ti: i });
  } else if (tg.k === 'bottle') {
    const cx = p.x, by = p.y, top = by - 72 * s, cw = 24 * s;
    segs.push({ ax: cx, ay: top, bx: cx, by: top + 24 * s, e: .3, kind: 'bottle', ti: i },
      { ax: cx, ay: top + 24 * s, bx: cx - 12 * s, by: top + 38 * s, e: .3, kind: 'bottle', ti: i }, { ax: cx, ay: top + 24 * s, bx: cx + 12 * s, by: top + 38 * s, e: .3, kind: 'bottle', ti: i },
      { ax: cx - 12 * s, ay: top + 38 * s, bx: cx - 12 * s, by: by, e: .3, kind: 'bottle', ti: i }, { ax: cx + 12 * s, ay: top + 38 * s, bx: cx + 12 * s, by: by, e: .3, kind: 'bottle', ti: i });
    if (by < FLOOR - 2) segs.push({ ax: cx - cw, ay: by, bx: cx + cw, by: by, e: .3, kind: 'table', ti: i }, { ax: cx - cw, ay: by, bx: cx - cw, by: FLOOR, e: .3, kind: 'table', ti: i }, { ax: cx + cw, ay: by, bx: cx + cw, by: FLOOR, e: .3, kind: 'table', ti: i });
    zones.push({ y: top - 9 * s, x0: cx - 15 * s, x1: cx + 15 * s, ti: i });
  } else {   // containers: can, basket, pool
    const hw = SIZE[tg.k] * s, hh = (tg.k === 'can' ? 64 : tg.k === 'basket' ? 46 : 30) * s, cx = p.x, by = p.y, top = by - hh;
    const tap = tg.k === 'pool' ? 0 : tg.k === 'can' ? 4 * s : 8 * s, rr = tg.k === 'pool' ? 11 * s : 3.5 * s;
    pts.push({ x: cx - hw, y: top, r: rr, e: .45, ti: i }, { x: cx + hw, y: top, r: rr, e: .45, ti: i });
    segs.push({ ax: cx - hw, ay: top, bx: cx - hw + tap, by: by, e: .35, kind: 'side', ti: i }, { ax: cx + hw, ay: top, bx: cx + hw - tap, by: by, e: .35, kind: 'side', ti: i },
      { ax: cx - hw + tap, ay: by - 3 * s, bx: cx + hw - tap, by: by - 3 * s, e: .2, kind: 'bottom', ti: i });
    if (tg.k === 'pool') { pts[pts.length - 2].y += rr * 0.6; pts[pts.length - 1].y += rr * 0.6; }
    if (by < FLOOR - 2) segs.push({ ax: cx - hw - 18 * s, ay: by, bx: cx + hw + 18 * s, by: by, e: .3, kind: 'table', ti: i });
    zones.push({ y: top + (tg.k === 'pool' ? 6 * s : 2 * s), x0: cx - hw + rr + 1, x1: cx + hw - rr - 1, ti: i });
  }
}
function geomAt(TT) {
  if (!G0) G0 = staticGeom();
  const mv = moving() || targets.some(tg => tg.hopA && tg.hopA.k < 1);
  if (!mv && gCache) return gCache;
  const segs = G0.segs.slice(), pts = G0.pts.slice(), zones = [];
  for (const tg of targets) targetGeom(tg, tpos(tg, TT), segs, pts, zones);
  const g = { segs, pts, zones, ceil: G0.ceil };
  if (!mv) gCache = g;
  return g;
}

// ---------- physics (the same step for real throws, the dotted preview and the gentle aim help) ----------
function mkBall(kind, x0, y0, vx, vy) {
  const B = BALLS[kind];
  return { kind, x: x0, y: y0, vx, vy, r: B.r * S, cr: B.cr * S, gk: B.gk, wk: B.wk, drag: B.drag, bo: B.bo, rot: 0, spin: 0, t: 0, rim: 0, board: 0, tramp: 0, scored: null, floor: 0, rest: 0, fruit: fruitK };
}
function collideSeg(b, s, ev) {
  const dx = s.bx - s.ax, dy = s.by - s.ay, L2 = dx * dx + dy * dy;
  let k = L2 ? ((b.x - s.ax) * dx + (b.y - s.ay) * dy) / L2 : 0; k = clamp(k, 0, 1);
  const cx = s.ax + dx * k, cy = s.ay + dy * k, ox = b.x - cx, oy = b.y - cy, d2 = ox * ox + oy * oy;
  if (d2 >= b.cr * b.cr || d2 < 1e-9) return;
  const d = Math.sqrt(d2), nx = ox / d, ny = oy / d;
  b.x = cx + nx * b.cr; b.y = cy + ny * b.cr;
  const vn = b.vx * nx + b.vy * ny;
  if (vn >= 0) return;
  if (s.kind === 'tramp' && ny < -0.5) {
    const up = clamp(Math.abs(b.vy) * 1.0 + 120 * S, 700 * S, 1250 * S);
    b.vy = -up; b.vx *= 0.9; b.tramp = 1; if (ev) ev.push({ k: 'tramp', v: up }); return;

  const mood = heroMood === 'love' ? (MG.hero === 'niu' ? 'yay' : 'love') : heroMood;
  const look = ball && phase === 'fly' ? clamp((ball.x - X0) / (W * 0.4), -1, 1) : 0.6;
  MG.puPu(x, X0, cy - (heroMood === 'love' ? Math.abs(Math.sin(heroT * 9)) * 10 * S : 0), r, mood, heroSq + bob, { arms: phase === 'ready' || heroMood === 'love' ? 'up' : null, look });
  // ball in hand
  if (phase === 'ready' && state !== 'over') { const h = holdPos(), sc = popK < 1 ? 0.3 + popK * 0.7 + Math.sin(popK * Math.PI) * 0.25 : 1; drawBall({ kind: LV.ball, rot: 0, fruit: fruitK }, h.x, h.y, sc); }
  drawPreview();
  // ball in flight (rings stuck on a bottle slide down)
  if (ball && phase !== 'ready') {
    if (ball.stuck) { const st = ball.stuck, p = tpos(st.tg, T), e = st.k * st.k, bx = lerp(st.x0, p.x, Math.min(1, st.k * 3)), by = lerp(st.y0, p.y - 34 * S + st.tg.rings * 7 * S, e); ringOn(bx, by, 'back'); }
    else {
      if (ball.y < -ball.r) { const ax = clamp(ball.x, 20, W - 20); x.fillStyle = 'rgba(255,255,255,.85)'; x.beginPath(); x.moveTo(ax, 6 * S); x.lineTo(ax - 9 * S, 20 * S); x.lineTo(ax + 9 * S, 20 * S); x.closePath(); x.fill(); drawBall(ball, ax, 34 * S, 0.6); }
      else { x.fillStyle = 'rgba(40,40,60,.15)'; const sh = clamp(1 - (FLOOR - ball.y) / 400, 0.2, 1); x.beginPath(); x.ellipse(ball.x, FLOOR + 1, ball.r * sh, ball.r * 0.25 * sh, 0, 0, TAU); x.fill(); drawBall(ball, ball.x, ball.y); }
    }
  }
  for (const tg of targets) drawTargetFront(tg);
  if (ball && ball.stuck) { const st = ball.stuck, p = tpos(st.tg, T), e = st.k * st.k, bx = lerp(st.x0, p.x, Math.min(1, st.k * 3)), by = lerp(st.y0, p.y - 34 * S + st.tg.rings * 7 * S, e); ringOn(bx, by, 'front'); }
  drawHint();
  MG.fx.draw(x);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const p of pops) { x.globalAlpha = Math.min(1, p.life * 2); x.font = F(20); x.lineWidth = MG.big ? 5 : 4; x.strokeStyle = '#fff'; const px = clamp(p.x, 80 * S, W - 80 * S); x.strokeText(p.t, px, p.y); x.fillStyle = p.c; x.fillText(p.t, px, p.y); }
  x.globalAlpha = 1;
  drawHUD();
}

// ---------- flow ----------
function setLevel(n) { level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; G0 = null; gCache = null; bgK = ''; }
function stars() { const o = MG.store.get('hoop.stars', {}); return o && typeof o === 'object' ? o : {}; }
function start(m, lv) {
  if (m) mode = m; if (lv) setLevel(lv);
  reset(); state = 'play'; MG.hide();
  const fresh = newsOf(LV, level - 1).filter(k => !MG.store.get('hoop.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('hoop.seen.' + k, true));
    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function win() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const acc2 = shots ? made / shots : 1, st = acc2 >= 0.6 ? 3 : acc2 >= 0.34 ? 2 : 1;
  const all = stars(); if (!all[level] || all[level] < st) { all[level] = st; MG.store.set('hoop.stars', all); }
  MG.record('hoop', level);
  MG.fx.burst(W / 2, H * 0.35, { n: 60, colors: ['#ffd23f', '#ff8ac2', '#8fd0ff', '#8fe39a'], shape: 'star', speed: 340, up: 200, size: 7 });
  heroMood = 'love'; heroT = 3;
  const next = level < LEVELS.length ? LEVELS[level] : null;
  setTimeout(() => { if (state !== 'over') return; MG.panel({
    title: `第 ${level} 關過關！`,
    html: `<div class="big">${'⭐'.repeat(st)}${'☆'.repeat(3 - st)}</div><p>${LV.name}：丟了 ${shots} 次，進了 ${made} 球 ^_^</p>` + (next ? `<p>下一關：${THEME_E[next.theme]} ${next.name}</p>` : '<p>你是投籃冠軍！🏆</p>'),
    buttons: [...(next ? [{ label: '下一關', on: () => { MG.store.set('hoop.pickLevel', level + 1); start(null, level + 1); } }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
  }); }, 700);
}
function fail() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('over'); drag = null; preview = null;
  MG.panel({
    title: '時間到！',
    html: `<p>投進了</p><div class="big">${Math.min(prog, goalOf())} / ${goalOf()}</div><p>差一點點！再試一次吧</p><p>🐢 慢慢玩沒有時間限制喔</p>`,
    buttons: [{ label: '再試一次', on: () => start() }, { label: '🐢 慢慢玩這關', alt: true, on: () => { MG.store.set('hoop.pickMode', 'relax'); start('relax'); } }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; drag = null; preview = null;
  const st = stars();
  MG.choose({
    id: 'hoop', title: '噗噗投籃',
    html: `<p>手指<b>按住往上滑</b>，放開就把球丟出去！籃框、垃圾桶、水果籃、游泳池、套圈圈……丟進去就對了！</p><p>每關投進要的數量就過關；丟不進也沒關係，可以一直丟。後面還有 📏 跳跳籃框、↔️ 會走的籃框、🌬️ 風、🎯 好多目標和 🧱 反彈高手！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '時間內投完' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${THEME_E[LEVELS[n - 1].theme]} ${LEVELS[n - 1].name}${st[n] ? ' ' + '⭐'.repeat(st[n]) : ''}）`, short: n => `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '手指按住往上滑、放開就丟　滑鼠也一樣拖拉　鍵盤：<kbd>←</kbd><kbd>→</kbd> 方向、<kbd>↑</kbd><kbd>↓</kbd> 力氣、<kbd>空白鍵</kbd> 丟',
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),
  });
}
cv.onfit = layout;
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  land = asp > 1.1;
  if (land) { H = 480; W = Math.round(Math.min(1100, H * asp)); }
  else { W = Math.max(360, Math.round(480 * asp)); H = Math.round(clamp(W / asp, 480, 860)); }
  return [W, H];
});
setLevel(Math.min(MG.store.get('hoop.pickLevel', 1), LEVELS.length));
mode = MG.store.get('hoop.pickMode', 'relax') === 'timed' ? 'timed' : 'relax';
reset(); menu();
MG.loop(dt => { if (state === 'play' && !MG.panelOpen()) update(dt); else { t += dt; T += dt * (state === 'ready' ? 1 : 0); MG.fx.step(dt); for (const p of pops) p.life -= dt; } draw(); });

// ---------- hook for automated tests ----------
function solve(TT = T) {   // a throw that goes in (searched widely) — for tests and the level check
  const vr = vRef(), A = [];
  for (let d = 0; d <= 36; d += 3) { A.push(55 + d); if (d) A.push(55 - d); }
  for (const a of A) { if (a < 12 || a > 86) continue; for (let p = 0.3; p <= 2.3; p += 0.025) {
    const th = a * Math.PI / 180, v = p * vr, r = simulate(Math.cos(th) * v, -Math.sin(th) * v, TT, false);
    if (r.hit >= 0) return { vx: Math.cos(th) * v, vy: -Math.sin(th) * v, a, p, hit: r.hit };
  } }
  let best = null;
  return best;
}
window.HOOPT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get phase() { return phase; }, get prog() { return prog; }, get goal() { return goalOf(); },
  get made() { return made; }, get shots() { return shots; }, get wind() { return wind; }, levels: LEVELS.length, get size() { return [W, H, S]; },
  start: (lv, m = 'relax') => start(m, lv), menu: () => menu(), win: () => { prog = goalOf(); winT = 0.01; },
  solve: () => solve(), throwV: (vx, vy) => throwBall(vx, vy),
  autoShot() { const s = solve(); if (!s) return false; return throwBall(s.vx, s.vy); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play' && !MG.panelOpen()) update(dt); },
  targets: () => targets.map(tg => ({ k: tg.k, ...tpos(tg, T) })),
  ballClient() { const h = holdPos(), rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + h.x * (rc.width - 2 * B) / W, y: rc.top + B + h.y * (rc.height - 2 * B) / H, k: (rc.width - 2 * B) / W }; },
  toClient(px, py) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + px * (rc.width - 2 * B) / W, y: rc.top + B + py * (rc.height - 2 * B) / H }; },
  get preview() { return preview && { gold: preview.gold, n: preview.path ? preview.path.length / 2 : 0 }; },
  vRef: () => vRef(), assisted: (vx, vy) => assisted(vx, vy, T),
};
</script>
