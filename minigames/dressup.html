<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗換裝屋</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:linear-gradient(#ffe9f2,#fff6e0)}
.dress{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top)) 0 0 0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom))}
@media (min-aspect-ratio:1/1){.dress{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(300px,44%)}}
.stagebox{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
.stagebox canvas{display:block;border:3px solid #fff;border-radius:16px;box-shadow:0 6px 18px rgba(160,80,110,.25);background:#fff}
.closet{background:#fffdf7;border:3px solid #f2c6d6;border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  box-shadow:0 4px 0 #f2c6d6}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:6px;background:#ffeef4;border-bottom:2px solid #f2c6d6;flex:none}
.tabs button{position:relative;font:inherit;font-size:13px;font-weight:700;color:#8a4a62;background:#fff;border:2px solid #f2c6d6;border-radius:14px;
  padding:4px 0 3px;cursor:pointer;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 #f2c6d6}
.tabs button b{font-size:24px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tabs button span{line-height:1.2;white-space:nowrap}
.tabs button i{position:absolute;top:4px;right:5px;width:9px;height:9px;border-radius:50%;background:#ff4f8a;border:2px solid #fff}
.tabs button[aria-selected=true]{background:#ff7aa8;border-color:#e0588a;color:#fff;box-shadow:0 3px 0 #c94a7a;transform:translateY(-1px)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;bottom:-9px;left:calc(50% - 7px);border:7px solid transparent;border-top-color:#ff7aa8;border-bottom:0}
@media (max-width:420px){.tabs{gap:3px;padding:5px}.tabs button{font-size:11px;min-height:50px;border-radius:10px}.tabs button b{font-size:20px}}
@media (min-width:700px){.items{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}.items button{font-size:13px}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));align-content:start;gap:8px;padding:8px;overflow-y:auto;min-height:0;max-height:34vh}
@media (min-aspect-ratio:1/1){.items{max-height:none;flex:1}}
.items button{position:relative;aspect-ratio:1;border:2px solid #eedde3;border-radius:14px;background:#fff;padding:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font:inherit;font-size:11px;color:#8a6a76;overflow:hidden}
.items button canvas{width:72%;height:auto;display:block;pointer-events:none}
.items button span{line-height:1.1;margin-top:1px;white-space:nowrap}
.items button[aria-pressed=true]{border-color:#ff7aa8;background:#fff0f6;box-shadow:0 0 0 3px #ffd0e2}
.items button[aria-pressed=true]::after{content:"✓";position:absolute;top:3px;right:6px;color:#ff4f8a;font-weight:900;font-size:14px}
.items button:active{transform:scale(.95)}
.acts{display:flex;gap:6px;padding:6px 8px 8px;border-top:2px dashed #f2c6d6;flex:none}
.acts .mg-btn{flex:1;min-width:0;min-height:48px;font-size:15px;padding:0 6px}
/* 👓 大字模式 */
html.mg-big .tabs button{font-size:15px;min-height:64px;border-color:#d08aa4;color:#5a2a3e}
html.mg-big .tabs button b{font-size:28px}
html.mg-big .items button{font-size:14px;color:#4a2e3a;border-color:#d8b0c0}
html.mg-big .acts .mg-btn{font-size:18px;min-height:56px}
@media (max-width:420px){html.mg-big .tabs button{font-size:12px;min-height:58px}html.mg-big .tabs button b{font-size:24px}}
.photo img{width:100%;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="dress">
  <div class="stagebox"><canvas id="cv" aria-label="噗噗"></canvas></div>
  <section class="closet" aria-label="衣櫃">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="items" id="items"></div>
    <div class="acts">
      <button class="mg-btn alt" id="rand" type="button">🎲 隨機</button>
      <button class="mg-btn" id="snap" type="button">📸 拍照</button>
      <button class="mg-btn alt" id="clear" type="button">↺ 脫光光</button>
    </div>
  </section>
</div>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'dressup', title: '噗噗換裝屋', stats: [] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
// the stage canvas takes the shape of its box (base picture 300×340; 噗噗 stands near the bottom, the background fills the rest)
let SW = 300, SH = 340;
const refit = MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 6) / Math.max(1, sh - 6));
  if (asp < 300 / 340) { SW = 300; SH = Math.round(Math.min(620, 300 / asp)); } else { SH = 340; SW = Math.round(Math.min(760, 340 * asp)); }
  return [SW, SH];
});
// the box only gets its final size once the side panel is filled in (and when 大字模式 changes it): refit then too
try { new ResizeObserver(() => refit()).observe(cv.parentElement); } catch {}

// ---------- items: each draw(c, r) is relative to the jelly centre ----------
const P = (fn) => fn;
const star = (c, cx, cy, R, r2, col, stroke) => { c.fillStyle = col; c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r2 : R; c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } c.closePath(); c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = Math.max(1, R * 0.12); c.stroke(); } };
const dot = (c, cx, cy, r, col) => { c.fillStyle = col; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); };
const flower = (c, cx, cy, s, col) => { for (let i = 0; i < 5; i++) { const a = i * 1.2566; dot(c, cx + Math.cos(a) * s * 0.55, cy + Math.sin(a) * s * 0.55, s * 0.5, col); } dot(c, cx, cy, s * 0.38, '#ffe36b'); };

const HATS = [
  { id: 'none', name: '不戴' },
  { id: 'crown', name: '皇冠', draw: (c, r) => {
    const y0 = -r * 0.82, h = r * 0.5, w = r * 0.9;
    const g = c.createLinearGradient(0, y0 - h, 0, y0); g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#e8a800');
    c.fillStyle = g; c.strokeStyle = '#a87400'; c.lineWidth = r * 0.04;
    c.beginPath(); c.moveTo(-w / 2, y0); c.lineTo(-w / 2, y0 - h * 0.7); c.lineTo(-w / 4, y0 - h * 0.35); c.lineTo(0, y0 - h); c.lineTo(w / 4, y0 - h * 0.35); c.lineTo(w / 2, y0 - h * 0.7); c.lineTo(w / 2, y0); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#e8a800'; c.fillRect(-w / 2, y0 - h * 0.18, w, h * 0.18);
    dot(c, 0, y0 - h * 0.45, r * 0.07, '#ff4f6e'); dot(c, -w * 0.3, y0 - h * 0.25, r * 0.05, '#3d9bff'); dot(c, w * 0.3, y0 - h * 0.25, r * 0.05, '#4cc96a');
    for (const px of [-w / 2, 0, w / 2]) dot(c, px, px ? y0 - h * 0.72 : y0 - h * 1.02, r * 0.05, '#fff');
  } },
  { id: 'chef', name: '廚師帽', draw: (c, r) => {
    c.fillStyle = '#fff'; c.strokeStyle = '#cfd5dc'; c.lineWidth = r * 0.03;
    c.beginPath(); c.roundRect(-r * 0.42, -r * 1.08, r * 0.84, r * 0.3, r * 0.06); c.fill(); c.stroke();
    for (const [a, b, rr2] of [[-0.3, -1.25, 0.28], [0, -1.42, 0.34], [0.3, -1.25, 0.28]]) { c.beginPath(); c.arc(a * r, b * r, rr2 * r, 0, 7); c.fill(); c.stroke(); }
    c.fillStyle = '#fff'; c.fillRect(-r * 0.4, -r * 1.12, r * 0.8, r * 0.12);
  } },
  { id: 'wizard', name: '魔法帽', draw: (c, r) => {
    c.fillStyle = '#5b3aa8'; c.strokeStyle = '#3a2370'; c.lineWidth = r * 0.04;
    c.beginPath(); c.moveTo(-r * 0.5, -r * 0.8); c.quadraticCurveTo(-r * 0.1, -r * 1.3, r * 0.15, -r * 2.0); c.quadraticCurveTo(r * 0.2, -r * 1.3, r * 0.5, -r * 0.8); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(0, -r * 0.8, r * 0.78, r * 0.16, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#ffd23f'; c.fillRect(-r * 0.46, -r * 0.98, r * 0.92, r * 0.1);
    star(c, -r * 0.05, -r * 1.3, r * 0.12, r * 0.05, '#ffd23f'); star(c, r * 0.18, -r * 1.65, r * 0.07, r * 0.03, '#fff'); dot(c, -r * 0.25, -r * 1.08, r * 0.03, '#fff');
  } },
  { id: 'cap', name: '棒球帽', draw: (c, r) => {
    c.fillStyle = '#3d7bff'; c.strokeStyle = '#2350b0'; c.lineWidth = r * 0.04;
    c.beginPath(); c.moveTo(-r * 0.72, -r * 0.55); c.bezierCurveTo(-r * 0.7, -r * 1.25, r * 0.7, -r * 1.25, r * 0.72, -r * 0.55); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#2350b0'; c.beginPath(); c.ellipse(r * 0.75, -r * 0.55, r * 0.5, r * 0.11, 0.1, 0, 7); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = r * 0.025; c.beginPath(); c.moveTo(0, -r * 1.07); c.lineTo(0, -r * 0.6); c.stroke();
    dot(c, 0, -r * 1.08, r * 0.06, '#fff'); c.fillStyle = '#fff'; c.font = `900 ${r * 0.3}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('P', -r * 0.25, -r * 0.82);
  } },
  { id: 'bow', name: '蝴蝶結', draw: (c, r) => {
    c.save(); c.translate(r * 0.45, -r * 0.82); c.rotate(0.3);
    c.fillStyle = '#ff6fa8'; c.strokeStyle = '#d0407a'; c.lineWidth = r * 0.035;
    for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sd * r * 0.45, -r * 0.35, sd * r * 0.42, 0); c.quadraticCurveTo(sd * r * 0.45, r * 0.32, 0, 0); c.fill(); c.stroke(); }
    dot(c, 0, 0, r * 0.1, '#ff4f8a'); c.fillStyle = 'rgba(255,255,255,.5)'; for (const sd of [-1, 1]) dot(c, sd * r * 0.22, -r * 0.08, r * 0.05, 'rgba(255,255,255,.6)');
    c.restore();
  } },
  { id: 'bunny', name: '兔耳朵', draw: (c, r) => {
    for (const sd of [-1, 1]) { c.save(); c.translate(sd * r * 0.32, -r * 0.82); c.rotate(sd * 0.22);
      c.fillStyle = '#fff'; c.strokeStyle = '#e2d4dc'; c.lineWidth = r * 0.035; c.beginPath(); c.ellipse(0, -r * 0.42, r * 0.16, r * 0.48, 0, 0, 7); c.fill(); c.stroke();
      c.fillStyle = '#ffb6cd'; c.beginPath(); c.ellipse(0, -r * 0.4, r * 0.07, r * 0.36, 0, 0, 7); c.fill(); c.restore(); }
    c.fillStyle = '#ff9cc2'; c.beginPath(); c.ellipse(0, -r * 0.86, r * 0.62, r * 0.09, 0, Math.PI, 0); c.fill();
  } },
  { id: 'flowers', name: '花圈', draw: (c, r) => {
    c.strokeStyle = '#4fae45'; c.lineWidth = r * 0.06; c.beginPath(); c.ellipse(0, -r * 0.8, r * 0.7, r * 0.2, 0, Math.PI * 1.02, -0.02); c.stroke();
    const cols = ['#ff6fa8', '#ffd23f', '#fff', '#8fd0ff', '#ff9f4a'];
    for (let i = 0; i < 7; i++) { const a = Math.PI + (i + 0.5) / 7 * Math.PI; flower(c, Math.cos(a) * r * 0.7, -r * 0.8 + Math.sin(a) * r * 0.2, r * 0.13, cols[i % 5]); }
  } },
  { id: 'party', name: '派對帽', draw: (c, r) => {
    c.save(); c.translate(-r * 0.15, -r * 0.82); c.rotate(-0.2);
    c.beginPath(); c.moveTo(-r * 0.32, 0); c.lineTo(0, -r * 0.85); c.lineTo(r * 0.32, 0); c.closePath(); c.save(); c.clip();
    for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#3d9bff' : '#ffd23f'; c.fillRect(-r * 0.5, -r * 0.9 + i * r * 0.16, r, r * 0.16); }
    c.restore(); c.strokeStyle = '#2a5cab'; c.lineWidth = r * 0.03; c.stroke();
    for (let i = 0; i < 5; i++) dot(c, -r * 0.25 + i * r * 0.12, 0, r * 0.06, ['#ff4f6e', '#4cc96a', '#fff', '#ff9f1c', '#8a63ff'][i]);
    dot(c, 0, -r * 0.88, r * 0.1, '#ff4f6e'); c.restore();
  } },
];
const FACES = [
  { id: 'none', name: '不戴' },
  { id: 'round', name: '圓眼鏡', draw: (c, r) => { c.strokeStyle = '#3a2a20'; c.lineWidth = r * 0.05; for (const sd of [-1, 1]) { c.fillStyle = 'rgba(200,230,255,.25)'; c.beginPath(); c.arc(sd * r * 0.32, -r * 0.08, r * 0.22, 0, 7); c.fill(); c.stroke(); } c.beginPath(); c.moveTo(-r * 0.1, -r * 0.1); c.quadraticCurveTo(0, -r * 0.16, r * 0.1, -r * 0.1); c.stroke(); } },
  { id: 'sun', name: '墨鏡', draw: (c, r) => { c.fillStyle = '#1f2430'; for (const sd of [-1, 1]) { c.beginPath(); c.roundRect(sd * r * 0.32 - r * 0.24, -r * 0.24, r * 0.48, r * 0.3, r * 0.1); c.fill(); c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.moveTo(sd * r * 0.32 - r * 0.16, -r * 0.2); c.lineTo(sd * r * 0.32 - r * 0.04, -r * 0.2); c.lineTo(sd * r * 0.32 - r * 0.16, -r * 0.04); c.fill(); c.fillStyle = '#1f2430'; } c.fillRect(-r * 0.1, -r * 0.18, r * 0.2, r * 0.05); } },
  { id: 'stars', name: '星星眼鏡', draw: (c, r) => { for (const sd of [-1, 1]) { star(c, sd * r * 0.32, -r * 0.08, r * 0.27, r * 0.13, '#ff6fa8', '#d0407a'); dot(c, sd * r * 0.32, -r * 0.08, r * 0.1, 'rgba(255,255,255,.55)'); } c.strokeStyle = '#d0407a'; c.lineWidth = r * 0.04; c.beginPath(); c.moveTo(-r * 0.1, -r * 0.1); c.lineTo(r * 0.1, -r * 0.1); c.stroke(); } },
  { id: 'stache', name: '鬍子', draw: (c, r) => { c.fillStyle = '#5a3a1e'; for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(0, r * 0.12); c.bezierCurveTo(sd * r * 0.15, r * 0.02, sd * r * 0.38, r * 0.06, sd * r * 0.42, r * 0.2); c.bezierCurveTo(sd * r * 0.3, r * 0.12, sd * r * 0.15, r * 0.24, 0, r * 0.18); c.fill(); } } },
  { id: 'mono', name: '單片眼鏡', draw: (c, r) => { c.strokeStyle = '#c99a00'; c.lineWidth = r * 0.045; c.fillStyle = 'rgba(200,230,255,.3)'; c.beginPath(); c.arc(r * 0.32, -r * 0.08, r * 0.22, 0, 7); c.fill(); c.stroke(); c.lineWidth = r * 0.02; c.beginPath(); c.moveTo(r * 0.5, 0); c.quadraticCurveTo(r * 0.62, r * 0.3, r * 0.5, r * 0.5); c.stroke(); } },
  { id: 'mask', name: '英雄眼罩', draw: (c, r) => { c.fillStyle = '#e53935'; c.beginPath(); c.roundRect(-r * 0.66, -r * 0.3, r * 1.32, r * 0.36, r * 0.16); for (const sd of [-1, 1]) { c.ellipse(sd * r * 0.32, -r * 0.1, r * 0.14, r * 0.12, 0, 0, 7); } c.fill('evenodd'); c.strokeStyle = '#a02020'; c.lineWidth = r * 0.03; c.stroke(); c.beginPath(); c.moveTo(r * 0.62, -r * 0.14); c.quadraticCurveTo(r * 0.85, -r * 0.05, r * 0.9, r * 0.12); c.lineWidth = r * 0.08; c.strokeStyle = '#e53935'; c.stroke(); } },
  { id: 'nose', name: '小丑鼻', draw: (c, r) => { const g = c.createRadialGradient(-r * 0.04, r * 0.04, 1, 0, r * 0.08, r * 0.14); g.addColorStop(0, '#ff8a80'); g.addColorStop(1, '#d32f2f'); c.fillStyle = g; c.beginPath(); c.arc(0, r * 0.08, r * 0.13, 0, 7); c.fill(); dot(c, -r * 0.04, r * 0.03, r * 0.035, 'rgba(255,255,255,.7)'); } },
];
const CLOTHES = [
  { id: 'none', name: '不穿' },
  { id: 'bowtie', name: '領結', draw: (c, r) => { c.fillStyle = '#e53935'; c.strokeStyle = '#a02020'; c.lineWidth = r * 0.03; for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(0, r * 0.56); c.lineTo(sd * r * 0.26, r * 0.42); c.lineTo(sd * r * 0.26, r * 0.7); c.closePath(); c.fill(); c.stroke(); } dot(c, 0, r * 0.56, r * 0.07, '#c62828'); for (const sd of [-1, 1]) dot(c, sd * r * 0.16, r * 0.5, r * 0.03, '#fff'); } },
  { id: 'scarf', name: '圍巾', draw: (c, r) => {
    c.save(); c.beginPath(); c.ellipse(0, r * 0.52, r * 0.98, r * 0.14, 0, 0, 7); c.clip();
    for (let i = -6; i < 6; i++) { c.fillStyle = i % 2 ? '#ff5a4e' : '#fff'; c.fillRect(i * r * 0.18, r * 0.36, r * 0.18, r * 0.32); } c.restore();
    c.save(); c.translate(r * 0.4, r * 0.58); c.rotate(0.25); for (let i = 0; i < 3; i++) { c.fillStyle = i % 2 ? '#fff' : '#ff5a4e'; c.fillRect(-r * 0.1, i * r * 0.12, r * 0.2, r * 0.12); }
    c.strokeStyle = '#ff5a4e'; c.lineWidth = r * 0.025; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-r * 0.08 + i * r * 0.055, r * 0.36); c.lineTo(-r * 0.08 + i * r * 0.055, r * 0.44); c.stroke(); } c.restore();
  } },
  { id: 'tie', name: '領帶', draw: (c, r) => { c.fillStyle = '#3d7bff'; c.strokeStyle = '#2350b0'; c.lineWidth = r * 0.03; c.beginPath(); c.moveTo(-r * 0.08, r * 0.42); c.lineTo(r * 0.08, r * 0.42); c.lineTo(r * 0.05, r * 0.5); c.lineTo(r * 0.12, r * 0.86); c.lineTo(0, r * 0.96); c.lineTo(-r * 0.12, r * 0.86); c.lineTo(-r * 0.05, r * 0.5); c.closePath(); c.fill(); c.stroke(); c.strokeStyle = '#ffd23f'; c.lineWidth = r * 0.03; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-r * 0.08, r * (0.6 + i * 0.1)); c.lineTo(r * 0.08, r * (0.56 + i * 0.1)); c.stroke(); } } },
  { id: 'cape', name: '披風', back: true, draw: (c, r) => { const g = c.createLinearGradient(0, -r * 0.2, 0, r * 1.2); g.addColorStop(0, '#e53935'); g.addColorStop(1, '#a02020'); c.fillStyle = g; c.beginPath(); c.moveTo(-r * 0.7, -r * 0.1); c.quadraticCurveTo(-r * 1.4, r * 0.6, -r * 1.25, r * 1.1); c.quadraticCurveTo(0, r * 1.25, r * 1.25, r * 1.1); c.quadraticCurveTo(r * 1.4, r * 0.6, r * 0.7, -r * 0.1); c.closePath(); c.fill(); c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = r * 0.03; for (const sd of [-0.6, 0, 0.6]) { c.beginPath(); c.moveTo(sd * r, r * 0.5); c.lineTo(sd * r * 1.2, r * 1.15); c.stroke(); } } },
  { id: 'lei', name: '花環', draw: (c, r) => { const cols = ['#ff6fa8', '#ffd23f', '#ff9f4a', '#fff', '#8a63ff']; for (let i = 0; i < 9; i++) { const a = 0.25 + i / 8 * (Math.PI - 0.5); flower(c, Math.cos(a) * r * 0.75, r * 0.32 + Math.sin(a) * r * 0.32, r * 0.12, cols[i % 5]); } } },

const find = (list, id) => list.find(i => i.id === id) || list[0];
const save = () => MG.store.set('dress.outfit', outfit);

function drawPupu(c, cx, cy, r, o, tt = 0, squash = 0) {
  const cloth = find(CLOTHES, o.cloth), hat = find(HATS, o.hat), face = find(FACES, o.face), hold = find(HOLDS, o.hold);
  c.save(); c.translate(cx, cy);
  if (cloth.back) cloth.draw(c, r);
  if (hold.id === 'umbrella') hold.draw(c, r);
  c.restore();
  MG.puPu(c, cx, cy, r, o.mood, squash, { pal: MG.JELLY[o.color], arms: hold.id !== 'none' ? true : false, noLeaf: hat.id !== 'none' && hat.id !== 'bow' && hat.id !== 'flowers' });
  c.save(); c.translate(cx, cy); c.translate(0, r * 0.9); c.scale(1 + squash, 1 - squash); c.translate(0, -r * 0.9);
  if (cloth.draw && !cloth.back) cloth.draw(c, r);
  if (face.draw) face.draw(c, r);
  if (hat.draw) hat.draw(c, r);
  if (hold.draw && hold.id !== 'umbrella') hold.draw(c, r);

let t = 0, pop = 0;

  x.save(); x.beginPath(); x.roundRect(0, 0, SW, SH, 12); x.clip();
  drawBg(x, outfit.bg, SW, SH, t);
  const bob = Math.sin(t * 2.4) * 3, sq = Math.sin(t * 2.4) * 0.025 + pop * 0.18;
  x.fillStyle = 'rgba(0,0,0,.12)'; x.beginPath(); x.ellipse(SW / 2, SH - 56, 70 - bob, 10, 0, 0, 7); x.fill();
  drawPupu(x, SW / 2, SH - 130 + bob, 74, outfit, t, sq);
  MG.fx.draw(x);
  x.restore();
}
MG.loop(dt => { t += dt; pop *= Math.pow(0.002, dt); MG.fx.step(dt); draw(); });

  const c = CATS.find(q => q.id === cat);
  for (const it of c.list) {
    const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', outfit[cat] === it.id); b.setAttribute('aria-label', it.name);
    if (it.id === 'none') { const sp = document.createElement('div'); sp.textContent = '✕'; sp.style.cssText = 'font-size:26px;color:#d9b8c4;line-height:1;margin-bottom:6px'; b.append(sp); }
    else b.append(thumb(cat, it));
    const s = document.createElement('span'); s.textContent = it.name; b.append(s);
    b.onclick = () => wear(cat, it.id);
    itemsEl.append(b);
  }
}
// extra shared sounds, throttled (≥60 ms per name) so fast tapping through items stays pleasant
const juiceT = {};
function juice(name, n) { const q = performance.now(); if (q - (juiceT[name] || 0) < 60) return; juiceT[name] = q; MG.sfx(name, n); }
// each kind of item gets its own little flourish on top of the pop
const WEAR_SFX = { hat: 'boing', face: 'sparkle', cloth: 'whoosh', hold: 'coin', color: 'sparkle', mood: 'boing', bg: 'whoosh' };
let fullDress = ['hat', 'face', 'cloth', 'hold'].every(k => outfit[k] !== 'none');
function wear(catId, id, quiet) {
  outfit[catId] = id; save();
  if (!quiet && id !== 'none') { MG.sfx('pop'); juice(WEAR_SFX[catId] || 'sparkle'); }
  // first time hat + face + clothes + hand item are all on: a little cheer
  const full = ['hat', 'face', 'cloth', 'hold'].every(k => outfit[k] !== 'none');
  if (!quiet && full && !fullDress) { setTimeout(() => MG.sfx('yay'), 120); MG.toast(MG.praise(3), 1100); }
  fullDress = full;
  if (!quiet) { if (id === 'none') { MG.sfx('step'); juice('whoosh'); } pop = 1; MG.fx.burst(SW / 2, SH - 180, { n: 14, colors: ['#ff8ac2', '#ffd23f', '#8fd0ff', '#fff'], speed: 160, up: 80, size: 5, shape: 'star', life: 0.7 }); }
  renderTabs();
  if (catId === 'color') renderItems(); else itemsEl.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', CATS.find(q => q.id === catId).list[i].id === id));
}
document.getElementById('rand').onclick = () => {
  for (const c of CATS) { const pool = c.list.filter(i => i.id !== 'none'); outfit[c.id] = (c.id === 'face' || c.id === 'hold') && Math.random() < 0.3 ? 'none' : MG.pick(pool).id; }
  save(); renderTabs(); renderItems(); MG.sfx('whoosh'); MG.sfx('good'); juice('sparkle'); pop = 1; fullDress = ['hat', 'face', 'cloth', 'hold'].every(k => outfit[k] !== 'none');
  MG.fx.burst(SW / 2, SH - 160, { n: 24, colors: ['#ff8ac2', '#ffd23f', '#8fd0ff', '#b8f5a0', '#fff'], speed: 220, up: 100, size: 6, shape: 'star', life: 0.9 });
};
document.getElementById('clear').onclick = () => { for (const k of ['hat', 'face', 'cloth', 'hold']) outfit[k] = 'none'; outfit.mood = 'happy'; save(); renderTabs(); renderItems(); MG.sfx('step'); juice('whoosh'); pop = 1; fullDress = false; };
document.getElementById('snap').onclick = () => {
  MG.sfx('clear'); juice('sparkle');
  // polaroid-style photo
  const k = 2, PW = 340, PH = 430, c = document.createElement('canvas'); c.width = PW * k; c.height = PH * k; const g = c.getContext('2d'); g.scale(k, k);
  g.fillStyle = '#fffdf7'; g.fillRect(0, 0, PW, PH);
  g.save(); g.translate(20, 20); g.beginPath(); g.rect(0, 0, 300, 340); g.clip(); drawBg(g, outfit.bg, 300, 340, t);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(150, 284, 70, 10, 0, 0, 7); g.fill();
  drawPupu(g, 150, 210, 74, outfit); g.restore();
  g.fillStyle = '#6b4a5a'; g.font = '700 22px "Noto Sans TC","PingFang TC",system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('噗噗換裝屋 ^_^', PW / 2, PH - 50);
  const d = new Date(); g.font = '14px ui-monospace,Menlo,monospace'; g.fillStyle = '#b08a9a'; g.fillText(`${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`, PW / 2, PH - 24);
  const url = c.toDataURL('image/png');
  const flash = document.createElement('div'); flash.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:50;opacity:.9;transition:opacity .4s;pointer-events:none'; document.body.append(flash);
  requestAnimationFrame(() => { flash.style.opacity = '0'; setTimeout(() => flash.remove(), 450); });
  MG.panel({
    title: '拍好了！',
    html: `<div class="photo"><img alt="噗噗的照片" src="${url}"></div><p>按「存到裝置」就能把照片留下來</p>`,
    buttons: [
      { label: '存到裝置', on: () => { const a = document.createElement('a'); a.href = url; a.download = '噗噗造型.png'; document.body.append(a); a.click(); a.remove(); } },
      { label: '繼續換裝', alt: true, on: () => MG.hide() },
    ],
  });
};
renderTabs(); renderItems();
</script>
