<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗換裝屋</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:radial-gradient(120% 80% at 20% 0%,#fff3f8 0%,#ffe6f0 45%,#ffeedd 100%)}
.dress{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top)) 0 0 0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom))}
@media (min-aspect-ratio:1/1){.dress{grid-template-rows:none;grid-template-columns:minmax(0,1fr) minmax(320px,44%)}}
.stagebox{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:0}
.stagebox canvas{display:block;border:3px solid #fff;border-radius:18px;box-shadow:0 8px 22px rgba(160,80,110,.28),0 0 0 1.5px #f4c4d6;background:#fff;touch-action:manipulation}
/* 衣櫃：木頭衣櫃門框＋粉紅內襯 */
.closet{background:linear-gradient(#fffaf3,#fff4f8);border:3px solid #e9b58f;border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  box-shadow:0 5px 0 #d49a72,0 10px 22px rgba(150,90,60,.18),inset 0 0 0 3px #fff3e6}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 8px 10px;background:linear-gradient(#ffe2ec,#ffeef4);border-bottom:3px solid #f2c6d6;flex:none}
.tabs button{position:relative;font:inherit;font-size:13px;font-weight:800;color:#8a4a62;background:linear-gradient(#fff,#fff6f9);border:2px solid #f2c6d6;border-radius:16px;
  padding:3px 0 3px;cursor:pointer;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 #f2c6d6;touch-action:manipulation}
.tabs button canvas{width:38px;height:38px;display:block;pointer-events:none}
.tabs button span{line-height:1.15;white-space:nowrap}
.tabs button i{position:absolute;top:3px;right:4px;width:10px;height:10px;border-radius:50%;background:#ff4f8a;border:2px solid #fff}
.tabs button[aria-selected=true]{background:linear-gradient(#ff9cc0,#ff6fa0);border-color:#e0588a;color:#fff;box-shadow:0 3px 0 #c94a7a;transform:translateY(-1px)}
.tabs button[aria-selected=true]::after{content:"";position:absolute;bottom:-11px;left:calc(50% - 8px);border:8px solid transparent;border-top-color:#ff6fa0;border-bottom:0}
.tabs button:active{transform:scale(.95)}
@media (max-width:420px){.tabs{gap:4px;padding:6px 6px 9px}.tabs button{font-size:12px;min-height:54px;border-radius:12px}.tabs button canvas{width:30px;height:30px}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,100px),1fr));align-content:start;gap:10px;padding:10px;overflow-y:auto;min-height:0;max-height:31vh;grid-auto-rows:var(--rowh,100px);
  background:repeating-linear-gradient(90deg,rgba(242,198,214,.0) 0 46px,rgba(242,198,214,.18) 46px 48px)}
@media (min-aspect-ratio:1/1){.items{max-height:none;flex:1;--tile:112px}.items.few{--tile:140px}}
@media (min-width:700px) and (max-aspect-ratio:1/1){.items{--tile:120px}}
@media (max-width:370px){.items{--tile:92px;gap:8px}}
.items button{position:relative;border:2.5px solid #f0d4de;border-radius:18px;background:radial-gradient(circle at 50% 42%,#fff 0 52%,var(--tint,#fdeef4) 100%);padding:0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;font:inherit;font-size:13px;font-weight:700;color:#7a4a5e;overflow:hidden;box-shadow:0 3px 0 #f0d4de;touch-action:manipulation}
.items button canvas{position:absolute;left:6%;top:2%;width:88%;height:88%;display:block;pointer-events:none}
.items button span{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);line-height:1.1;white-space:nowrap;background:rgba(255,255,255,.88);border-radius:999px;padding:2px 9px;box-shadow:0 1px 0 rgba(200,140,160,.25)}
.items button .none{position:absolute;inset:0 0 20% 0;display:flex;align-items:center;justify-content:center;font-size:40px;color:#e4b8c8;line-height:1}
.items button[aria-pressed=true]{border-color:#ff6fa0;background:radial-gradient(circle at 50% 42%,#fff 0 50%,#ffd3e4 100%);box-shadow:0 0 0 4px #ffd0e2,0 3px 0 #e0588a}
.items button[aria-pressed=true]::after{content:"✓";position:absolute;top:5px;right:6px;width:24px;height:24px;border-radius:50%;background:#ff4f8a;color:#fff;font-weight:900;font-size:15px;line-height:24px;text-align:center;box-shadow:0 2px 0 #c94a7a}
.items button.want{border-color:#ffc93a;box-shadow:0 0 0 3px #ffe9a8,0 3px 0 #e8b02a}
.items button:active{transform:scale(.95)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;border-top:3px dashed #f2c6d6;flex:none;background:#fff8f0}
.acts .mg-btn{min-width:0;min-height:50px;font-size:15px;padding:0 4px;white-space:nowrap}
@media (max-width:370px){.acts .mg-btn{font-size:13.5px}}
/* 👓 大字模式 */
html.mg-big .tabs button{font-size:14px;min-height:62px;border-color:#d08aa4;color:#5a2a3e}
html.mg-big .tabs button[aria-selected=true]{color:#fff}
html.mg-big .items button{font-size:15px;color:#4a2e3a;border-color:#d8b0c0}
html.mg-big .acts .mg-btn{font-size:17px;min-height:56px}
@media (max-width:420px){html.mg-big .tabs button{font-size:12.5px;min-height:58px}}
.tabs button i.goal{width:auto;height:auto;background:none;border:0;top:-2px;right:0;font-style:normal;font-size:16px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;animation:dsGoal .8s ease-in-out infinite alternate}
@keyframes dsGoal{from{transform:scale(.85) rotate(-10deg)}to{transform:scale(1.15) rotate(10deg)}}
.ds-stars{font-size:40px;letter-spacing:.12em;margin:2px 0 6px}
.photo img{width:100%;max-width:300px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:6px 0}
.album button{border:0;padding:6px 6px 4px;background:#fffdf7;border-radius:8px;box-shadow:0 3px 8px rgba(120,60,80,.25);cursor:pointer;transform:rotate(var(--rot,0deg));font:inherit;font-size:12px;color:#8a6a76;min-height:44px}
.album button:nth-child(odd){--rot:-2deg}.album button:nth-child(3n){--rot:2deg}
.album img{width:100%;display:block;border-radius:3px}
.album .empty{grid-column:1/-1;color:#a07a8a}
</style>
</head>
<body>
<div class="dress">
  <div class="stagebox"><canvas id="cv" aria-label="噗噗"></canvas></div>
  <section class="closet" aria-label="衣櫃">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="items" id="items"></div>
    <div class="acts">
      <button class="mg-btn alt" id="rand" type="button">🎲 隨機</button>
      <button class="mg-btn" id="snap" type="button">📸 拍照</button>
      <button class="mg-btn alt" id="albumBtn" type="button">📒 相簿</button>
      <button class="mg-btn alt" id="clear" type="button">↺ 脫掉</button>
    </div>
  </section>
</div>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'dressup', title: '噗噗換裝屋', stats: ['lv'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
// the stage canvas takes the shape of its box (base picture 300×340; 噗噗 stands near the bottom, the background fills the rest)
let SW = 360, SH = 380;
const refit = MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 6) / Math.max(1, sh - 6));
  if (asp < 360 / 380) { SW = 360; SH = Math.round(Math.min(720, 360 / asp)); } else { SH = 380; SW = Math.round(Math.min(860, 380 * asp)); }
  return [SW, SH];
});
// the box only gets its final size once the side panel is filled in (and when 大字模式 changes it): refit then too
try { new ResizeObserver(() => refit()).observe(cv.parentElement); } catch {}

// ---------- items: each draw(c, r) is relative to the jelly centre ----------
const P = (fn) => fn;
const star = (c, cx, cy, R, r2, col, stroke) => { c.fillStyle = col; c.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r2 : R; c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } c.closePath(); c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = Math.max(1, R * 0.12); c.stroke(); } };
const dot = (c, cx, cy, r, col) => { c.fillStyle = col; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill(); };
// the lower part of the jelly body from height top (×r) down: clothes that cover the tummy
const bodyLow = (c, r, top) => { c.beginPath(); c.moveTo(-r * 0.99, r * top); c.quadraticCurveTo(0, r * (top + 0.1), r * 0.99, r * top); c.lineTo(r * 0.98, r * 0.62); c.bezierCurveTo(r * 0.98, r * 0.92, r * 0.6, r * 0.98, 0, r * 0.97); c.bezierCurveTo(-r * 0.6, r * 0.98, -r * 0.98, r * 0.92, -r * 0.98, r * 0.62); c.closePath(); };
const flower = (c, cx, cy, s, col) => { for (let i = 0; i < 5; i++) { const a = i * 1.2566; dot(c, cx + Math.cos(a) * s * 0.55, cy + Math.sin(a) * s * 0.55, s * 0.5, col); } dot(c, cx, cy, s * 0.38, '#ffe36b'); };

const HATS = [
  { id: 'none', name: '不戴' },
  { id: 'crown', name: '皇冠', draw: (c, r) => {
    const y0 = -r * 0.82, h = r * 0.5, w = r * 0.9;
    const g = c.createLinearGradient(0, y0 - h, 0, y0); g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#e8a800');
    c.fillStyle = g; c.strokeStyle = '#a87400'; c.lineWidth = r * 0.04;
    c.beginPath(); c.moveTo(-w / 2, y0); c.lineTo(-w / 2, y0 - h * 0.7); c.lineTo(-w / 4, y0 - h * 0.35); c.lineTo(0, y0 - h); c.lineTo(w / 4, y0 - h * 0.35); c.lineTo(w / 2, y0 - h * 0.7); c.lineTo(w / 2, y0); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#e8a800'; c.fillRect(-w / 2, y0 - h * 0.18, w, h * 0.18);
    dot(c, 0, y0 - h * 0.45, r * 0.07, '#ff4f6e'); dot(c, -w * 0.3, y0 - h * 0.25, r * 0.05, '#3d9bff'); dot(c, w * 0.3, y0 - h * 0.25, r * 0.05, '#4cc96a');
    for (const px of [-w / 2, 0, w / 2]) dot(c, px, px ? y0 - h * 0.72 : y0 - h * 1.02, r * 0.05, '#fff');
  } },
  { id: 'chef', name: '廚師帽', draw: (c, r) => {
    c.fillStyle = '#fff'; c.strokeStyle = '#cfd5dc'; c.lineWidth = r * 0.03;
    c.beginPath(); c.roundRect(-r * 0.42, -r * 1.08, r * 0.84, r * 0.3, r * 0.06); c.fill(); c.stroke();
    for (const [a, b, rr2] of [[-0.3, -1.25, 0.28], [0, -1.42, 0.34], [0.3, -1.25, 0.28]]) { c.beginPath(); c.arc(a * r, b * r, rr2 * r, 0, 7); c.fill(); c.stroke(); }
    c.fillStyle = '#fff'; c.fillRect(-r * 0.4, -r * 1.12, r * 0.8, r * 0.12);
  } },
  { id: 'wizard', name: '魔法帽', draw: (c, r) => {
    c.fillStyle = '#5b3aa8'; c.strokeStyle = '#3a2370'; c.lineWidth = r * 0.04;
    c.beginPath(); c.moveTo(-r * 0.5, -r * 0.8); c.quadraticCurveTo(-r * 0.1, -r * 1.3, r * 0.15, -r * 2.0); c.quadraticCurveTo(r * 0.2, -r * 1.3, r * 0.5, -r * 0.8); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.ellipse(0, -r * 0.8, r * 0.78, r * 0.16, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#ffd23f'; c.fillRect(-r * 0.46, -r * 0.98, r * 0.92, r * 0.1);
    star(c, -r * 0.05, -r * 1.3, r * 0.12, r * 0.05, '#ffd23f'); star(c, r * 0.18, -r * 1.65, r * 0.07, r * 0.03, '#fff'); dot(c, -r * 0.25, -r * 1.08, r * 0.03, '#fff');
  } },
  { id: 'cap', name: '棒球帽', draw: (c, r) => {
    c.fillStyle = '#3d7bff'; c.strokeStyle = '#2350b0'; c.lineWidth = r * 0.04;
    c.beginPath(); c.moveTo(-r * 0.72, -r * 0.55); c.bezierCurveTo(-r * 0.7, -r * 1.25, r * 0.7, -r * 1.25, r * 0.72, -r * 0.55); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#2350b0'; c.beginPath(); c.ellipse(r * 0.75, -r * 0.55, r * 0.5, r * 0.11, 0.1, 0, 7); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.5)'; c.lineWidth = r * 0.025; c.beginPath(); c.moveTo(0, -r * 1.07); c.lineTo(0, -r * 0.6); c.stroke();
    dot(c, 0, -r * 1.08, r * 0.06, '#fff'); c.fillStyle = '#fff'; c.font = `900 ${r * 0.3}px system-ui`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('P', -r * 0.25, -r * 0.82);
  } },
  { id: 'bow', name: '蝴蝶結', draw: (c, r) => {
    c.save(); c.translate(r * 0.45, -r * 0.82); c.rotate(0.3);
    c.fillStyle = '#ff6fa8'; c.strokeStyle = '#d0407a'; c.lineWidth = r * 0.035;
    for (const sd of [-1, 1]) { c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sd * r * 0.45, -r * 0.35, sd * r * 0.42, 0); c.quadraticCurveTo(sd * r * 0.45, r * 0.32, 0, 0); c.fill(); c.stroke(); }
    dot(c, 0, 0, r * 0.1, '#ff4f8a'); c.fillStyle = 'rgba(255,255,255,.5)'; for (const sd of [-1, 1]) dot(c, sd * r * 0.22, -r * 0.08, r * 0.05, 'rgba(255,255,255,.6)');
    c.restore();
  } },
  { id: 'bunny', name: '兔耳朵', draw: (c, r) => {
    for (const sd of [-1, 1]) { c.save(); c.translate(sd * r * 0.32, -r * 0.82); c.rotate(sd * 0.22);
      c.fillStyle = '#fff'; c.strokeStyle = '#e2d4dc'; c.lineWidth = r * 0.035; c.beginPath(); c.ellipse(0, -r * 0.42, r * 0.16, r * 0.48, 0, 0, 7); c.fill(); c.stroke();
      c.fillStyle = '#ffb6cd'; c.beginPath(); c.ellipse(0, -r * 0.4, r * 0.07, r * 0.36, 0, 0, 7); c.fill(); c.restore(); }
    c.fillStyle = '#ff9cc2'; c.beginPath(); c.ellipse(0, -r * 0.86, r * 0.62, r * 0.09, 0, Math.PI, 0); c.fill();
  } },
  { id: 'flowers', name: '花圈', draw: (c, r) => {
    c.strokeStyle = '#4fae45'; c.lineWidth = r * 0.06; c.beginPath(); c.ellipse(0, -r * 0.8, r * 0.7, r * 0.2, 0, Math.PI * 1.02, -0.02); c.stroke();
    const cols = ['#ff6fa8', '#ffd23f', '#fff', '#8fd0ff', '#ff9f4a'];
    for (let i = 0; i < 7; i++) { const a = Math.PI + (i + 0.5) / 7 * Math.PI; flower(c, Math.cos(a) * r * 0.7, -r * 0.8 + Math.sin(a) * r * 0.2, r * 0.13, cols[i % 5]); }
  } },
  { id: 'party', name: '派對帽', draw: (c, r) => {
    c.save(); c.translate(-r * 0.15, -r * 0.82); c.rotate(-0.2);
    c.beginPath(); c.moveTo(-r * 0.32, 0); c.lineTo(0, -r * 0.85); c.lineTo(r * 0.32, 0); c.closePath(); c.save(); c.clip();
    for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#3d9bff' : '#ffd23f'; c.fillRect(-r * 0.5, -r * 0.9 + i * r * 0.16, r, r * 0.16); }
    c.restore(); c.strokeStyle = '#2a5cab'; c.lineWidth = r * 0.03; c.stroke();
    for (let i = 0; i < 5; i++) dot(c, -r * 0.25 + i * r * 0.12, 0, r * 0.06, ['#ff4f6e', '#4cc96a', '#fff', '#ff9f1c', '#8a63ff'][i]);
    dot(c, 0, -r * 0.88, r * 0.1, '#ff4f6e'); c.restore();
  } },
  // ---- more hats (added later) ----
  { id: 'beanie', name: '毛線帽', draw: (c, r) => {
    c.fillStyle = '#ff6b5e'; c.strokeStyle = '#b8342a'; c.lineWidth = r * 0.035;
    c.beginPath(); c.moveTo(-r * 0.68, -r * 0.72); c.bezierCurveTo(-r * 0.66, -r * 1.42, r * 0.66, -r * 1.42, r * 0.68, -r * 0.72); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(150,30,20,.35)'; c.lineWidth = r * 0.03; for (let k = -3; k <= 3; k++) { c.beginPath(); c.moveTo(k * r * 0.17, -r * 0.8); c.quadraticCurveTo(k * r * 0.14, -r * 1.05, k * r * 0.08, -r * 1.22); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#d8cfc8'; c.lineWidth = r * 0.03; c.beginPath(); c.roundRect(-r * 0.74, -r * 0.84, r * 1.48, r * 0.2, r * 0.1); c.fill(); c.stroke();
    for (let k = 0; k < 8; k++) dot(c, -r * 0.62 + k * r * 0.177, -r * 0.74, r * 0.03, '#ffb6ad');
    dot(c, 0, -r * 1.3, r * 0.16, '#fff'); dot(c, -r * 0.05, -r * 1.35, r * 0.06, 'rgba(255,220,215,.9)');
  } },
  { id: 'earmuffs', name: '耳罩', draw: (c, r) => {
    c.strokeStyle = '#8a63ff'; c.lineWidth = r * 0.1; c.lineCap = 'round'; c.beginPath(); c.ellipse(0, -r * 0.3, r * 0.86, r * 0.72, 0, Math.PI * 1.06, -Math.PI * 0.06); c.stroke();
    for (const sd of [-1, 1]) { dot(c, sd * r * 0.88, -r * 0.3, r * 0.22, '#ffb6d3'); for (let k = 0; k < 7; k++) { const a = k * 0.9; dot(c, sd * r * 0.88 + Math.cos(a) * r * 0.15, -r * 0.3 + Math.sin(a) * r * 0.15, r * 0.08, '#ffd0e2'); } dot(c, sd * r * 0.88, -r * 0.3, r * 0.1, '#fff'); }
  } },
  { id: 'straw', name: '草帽', draw: (c, r) => {
    const g = c.createLinearGradient(0, -r * 1.3, 0, -r * 0.7); g.addColorStop(0, '#ffe39a'); g.addColorStop(1, '#e0b050');
    c.fillStyle = g; c.strokeStyle = '#a87a2a'; c.lineWidth = r * 0.03;
    c.beginPath(); c.ellipse(0, -r * 0.8, r * 1.02, r * 0.2, 0, 0, 7); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-r * 0.5, -r * 0.82); c.bezierCurveTo(-r * 0.5, -r * 1.32, r * 0.5, -r * 1.32, r * 0.5, -r * 0.82); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff5a6e'; c.fillRect(-r * 0.5, -r * 0.96, r * 1.0, r * 0.12); flower(c, r * 0.36, -r * 0.92, r * 0.08, '#fff');
    c.strokeStyle = 'rgba(168,122,42,.35)'; c.lineWidth = r * 0.02; for (let k = 1; k < 4; k++) { c.beginPath(); c.ellipse(0, -r * 0.8, r * (0.55 + k * 0.12), r * (0.11 + k * 0.025), 0, 0.2, Math.PI - 0.2); c.stroke(); }
  } },
  { id: 'pirate', name: '海盜帽', draw: (c, r) => {
    c.fillStyle = '#2b2b3a'; c.strokeStyle = '#11111a'; c.lineWidth = r * 0.035;
    c.beginPath(); c.moveTo(-r * 0.95, -r * 0.82); c.quadraticCurveTo(-r * 0.7, -r * 1.05, -r * 0.48, -r * 1.2); c.quadraticCurveTo(0, -r * 1.5, r * 0.48, -r * 1.2); c.quadraticCurveTo(r * 0.7, -r * 1.05, r * 0.95, -r * 0.82); c.quadraticCurveTo(0, -r * 0.62, -r * 0.95, -r * 0.82); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#ffd23f'; c.lineWidth = r * 0.04; c.beginPath(); c.moveTo(-r * 0.86, -r * 0.84); c.quadraticCurveTo(0, -r * 0.68, r * 0.86, -r * 0.84); c.stroke();
    c.strokeStyle = '#ffd23f'; c.lineWidth = r * 0.045; c.lineCap = 'round'; c.beginPath(); c.moveTo(0, -r * 1.24); c.lineTo(0, -r * 0.92); c.moveTo(-r * 0.1, -r * 1.14); c.lineTo(r * 0.1, -r * 1.14); c.moveTo(-r * 0.14, -r * 1.0); c.quadraticCurveTo(0, -r * 0.88, r * 0.14, -r * 1.0); c.stroke(); dot(c, 0, -r * 1.27, r * 0.04, '#ffd23f');

document.getElementById('rand').onclick = () => {
  for (const c of CATS) { const pool = c.list.filter(i => i.id !== 'none'); outfit[c.id] = ['face', 'hold', 'shoes', 'back', 'pet'].includes(c.id) && Math.random() < 0.35 ? (c.list[0].id === 'none' ? 'none' : outfit[c.id]) : MG.pick(pool).id; }

  THC.clear(); lastAct = t;
  save(); renderTabs(); renderItems(); MG.sfx('whoosh'); MG.sfx('good'); juice('sparkle'); pop = 1; fullDress = isFull(); checkWin();
  const hp = heroPos(); MG.fx.burst(hp.cx, SH - 160, { n: 24, colors: ['#ff8ac2', '#ffd23f', '#8fd0ff', '#b8f5a0', '#fff'], speed: 220, up: 100, size: 6, shape: 'star', life: 0.9 });
};
document.getElementById('clear').onclick = () => { for (const k of WEARABLE) outfit[k] = 'none'; outfit.mood = 'happy'; outfit.pose = 'stand'; save(); renderTabs(); renderItems(); MG.sfx('step'); juice('whoosh'); pop = 1; fullDress = false; };

// ---------- 📸 photos + 📒 album (the album keeps outfits, the pictures are drawn again when opened) ----------
function photo(o, k = 2, tt = 0.3) {
  const PW = 340, PH = 430, c = document.createElement('canvas'); c.width = PW * k; c.height = PH * k; const g = c.getContext('2d'); g.scale(k, k);
  g.fillStyle = '#fffdf7'; g.fillRect(0, 0, PW, PH);
  g.save(); g.translate(20, 20); g.beginPath(); g.rect(0, 0, 300, 340); g.clip(); drawBg(g, o.bg, 300, 340, tt); if (o.bg === 'room') drawMirror(g, 300, 340, o, tt);
  g.fillStyle = 'rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(150 + (find(PETS, o.pet).draw ? 26 : 0), 284, 64, 10, 0, 0, 7); g.fill();
  drawPupu(g, 150 + (find(PETS, o.pet).draw ? 26 : 0), 210, 74, o, tt, 0, { pose: o.pose === 'spin' ? 'stand' : o.pose }); g.restore();
  g.fillStyle = '#6b4a5a'; g.font = '700 22px "Noto Sans TC","PingFang TC",system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(MG.heroText('噗噗換裝屋 ^_^'), PW / 2, PH - 50);
  const d = o.at ? new Date(o.at) : new Date(); g.font = '14px ui-monospace,Menlo,monospace'; g.fillStyle = '#b08a9a'; g.fillText(`${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`, PW / 2, PH - 24);
  return c;
}
const ALB = NIU ? 'dress.album.niu' : 'dress.album', ALB_MAX = 30;

document.getElementById('albumBtn').onclick = openAlbum;

// ---------- challenge flow ----------
function checkWin() {
  if (!chal || chal.won || !CH[chal.n - 1].goals.every(goalMet)) return;
  chal.won = true; const n = chal.n;
  MG.sfx('yay'); setTimeout(() => MG.sfx('win'), 250); juice('sparkle');
  celebrate = { n, t0: t };
  const hp = heroPos();
  for (let i = 0; i < 5; i++) setTimeout(() => MG.fx.burst(hp.cx + MG.rand(-90, 90), SH - 200 + MG.rand(-60, 40), { n: 18, colors: ['#ff8ac2', '#ffd23f', '#8fd0ff', '#b8f5a0', '#fff'], speed: 240, up: 120, size: 6, shape: MG.pick(['star', 'sq']), life: 1 }), i * 150);
  MG.toast(MG.WORDS.perfect, 1300); pop = 1;
  const done = new Set(MG.store.get('dress.done', [])); done.add(n); MG.store.set('dress.done', [...done]); MG.record('dressup', done.size);
  setTimeout(() => { if (chal && chal.n === n && chal.won && !MG.panelOpen()) winPanel(n); }, 2000);
}
function winPanel(n) {

  MG.sfx('clear');
  MG.panel({
    title: `${L.ic} ${L.nm}造型完成！`,
    html: `<div class="ds-stars">⭐⭐⭐</div><p>${isCopy(n) ? '跟好朋友穿得一模一樣' : isMem(n) ? '全部都記住了' : '小圖片全部打勾了'}，好可愛 ^_^</p><p>已經完成 <b>${all}</b> / ${CH.length} 關</p>` + (nx ? `<p>下一關：${CH[n].ic} ${CH[n].nm}</p>` : `<p>${CH.length} 關全部完成，你是換裝大師！</p>`),
    buttons: [
      ...(nx ? [{ label: '下一關', on: () => { MG.store.set('dressup.pickLevel', n + 1); startChal(n + 1); } }] : []),
      { label: '📸 拍照', alt: true, on: () => document.getElementById('snap').click() },
      { label: '選關卡', alt: true, on: menu },
      { label: '繼續換裝', alt: true, on: () => MG.hide() },
    ],
  });
}
const NEWS = {
  chal: ['dress.seen.chal', '🎯 造型挑戰', '上面的<b>小圖片</b>就是要穿戴的東西！在衣櫃裡找到一樣的穿上去，小圖片打勾 ✓，全部打勾就完成了。<br>點一下小圖片，衣櫃會自動打開那一格；有 ⭐ 的分頁就是還要找的。'],
  theme: ['dress.seen.theme', '🌈 主題造型', '有些小圖片會<b>一直變換</b>，左上角還有數字：表示<b>這幾樣都可以</b>！選一個你喜歡的穿上去就好。'],
  color: ['dress.seen.color', '🎨 顏色和表情', '這一關還要換<b>顏色</b>或<b>表情</b>，看小圖片找一樣的！'],
  pose: ['dressup.seen.pose', '🕺 擺姿勢', '新的分頁「<b>動作</b>」：可以讓' + MG.heroName + '揮手、跳跳、跳舞、轉圈圈！<br>小圖片裡會動的那個，就是要擺的姿勢。'],
  copy: ['dressup.seen.copy', '👯 跟好朋友穿一樣', '左邊的<b>粉紅好朋友</b>已經打扮好了！<br>上面的卡片只告訴你是哪一類（帽子、衣服…），要<b>看好朋友身上穿什麼</b>，穿得一模一樣就過關。'],
  memory: ['dressup.seen.memory', '🧠 記一記', '小圖片<b>只給你看一下下</b>，然後會蓋起來變成 ❓。<br>記住要穿什麼！忘記了也沒關係：<b>點一下 ❓ 卡片</b>就能再偷看一次。'],
};
function startChal(n) {
  n = Math.max(1, Math.min(CH.length, n | 0 || 1));
  if (!chal) freeOutfit = outfit;
  const L = CH[n - 1];
  const keepColor = outfit.color;
  chal = { n, won: false, peek: 0, peekLen: 1, cardPeek: [], fa: 1 };
  outfit = Object.assign({}, DEFAULT, { bg: L.bg, color: L.goals.some(g => g[0] === 'color') ? DEFAULT.color : keepColor }); fullDress = false; GTH.clear(); THC.clear(); celebrate = null;
  if (isCopy(n)) chal.fo = friendOutfit(n);
  if (isMem(n)) { chal.peekLen = L.goals.length > 5 ? 9 : 7; chal.peek = t + chal.peekLen; }
  lastAct = t;
  const firstCat = (L.goals.find(g => !goalMet(g)) || L.goals[0])[0]; cat = isMem(n) || isCopy(n) ? 'hat' : firstCat;
  MG.hide(); renderTabs(); renderItems(); pop = 1;
  MG.stat('lv', `第 ${n} 關`); MG.sfx('whoosh');
  const ty = chalTypes(n), fresh = Object.keys(NEWS).filter(k => (k === 'chal' || ty[k]) && !MG.store.get(NEWS[k][0], false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set(NEWS[k][0], true));
    MG.panel({ title: fresh.map(k => NEWS[k][1]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][2]}</p>`).join(''), buttons: [{ label: '開始', on: () => { MG.hide(); if (isMem(n)) chal.peek = t + chal.peekLen; lastAct = t; } }] });
  }
}
function startFree() {
  if (chal) { outfit = freeOutfit || Object.assign({}, DEFAULT); chal = null; }
  celebrate = null; THC.clear();
  MG.hide(); MG.stat('lv', ''); renderTabs(); renderItems(); pop = 1;
}
function menu() {

    levels: { count: CH.length, max: CH.length, fresh: n => n > 24, label: n => `${CH[n - 1].ic} ${CH[n - 1].nm}${tag(n)}${done.has(n) ? ' ✓' : ''}`, short: n => `${n}${chalMarker(n) || CH[n - 1].ic}${done.has(n) ? '<small>✓</small>' : ''}` },
    levelsTitle: '造型挑戰：選一關',

}
MG.pauseMenu({ label: '🎯 挑戰', playing: () => false, open: () => { menu(); } });
cv.addEventListener('pointerdown', e => {
  if (!chal || MG.panelOpen()) return;
  const p = cv.logical(e), g = goalRects.find(q => p.x >= q.x - 3 && p.x <= q.x + q.w + 3 && p.y >= q.y - 3 && p.y <= q.y + q.h + 3);
  if (!g) return;
  // 🧠 / 👯🧠: a covered card peeks for a moment (and calls the friend back)
  if ((isMem(chal.n)) && !goalMet(CH[chal.n - 1].goals[g.i])) { chal.cardPeek[g.i] = t + 2.5; MG.sfx('flip'); lastAct = t; }
  cat = g.cat; MG.store.set('dress.tab', cat); MG.sfx('click'); juice('boing'); renderTabs(); renderItems(); itemsEl.scrollTop = 0;
});
// keyboard: ←→ change the closet tab, R random, P photo, A album
addEventListener('keydown', e => {
  if (MG.panelOpen() || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = CATS.findIndex(c => c.id === cat);
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { openCat(CATS[(i + (e.key === 'ArrowRight' ? 1 : CATS.length - 1)) % CATS.length].id); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') document.getElementById('rand').click();
  else if (e.key === 'p' || e.key === 'P') document.getElementById('snap').click();

});
renderTabs(); renderItems();
function sizeRows() { const b = itemsEl.querySelector('button'); if (b && b.offsetWidth) itemsEl.style.setProperty('--rowh', b.offsetWidth + 'px'); }
try { new ResizeObserver(sizeRows).observe(itemsEl); } catch {}
sizeRows();

// hook for automated tests
window.DRS = {
  get chal() { return chal && { ...chal }; }, get cat() { return cat; }, CH_COUNT: CH.length, NIU, get t() { return t; },
  outfit: () => ({ ...outfit }), wear: (c, id) => wear(c, id), startChal, startFree, menu, openAlbum, openCat, album,
  goals: n => CH[n - 1].goals.map(g => ({ cat: g[0], ids: goalIds(g), met: goalMet(g) })), types: n => chalTypes(n),
  lists: () => Object.fromEntries(CATS.map(c => [c.id, c.list.map(i => i.id)])),

};
