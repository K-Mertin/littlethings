const GY = 430, WB = 560, CW = 4, GA = 30;          // ground line, world bottom, column width, one grain of dirt (area)

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const FONT = '"Noto Sans TC",system-ui,sans-serif', EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

  snow: { sky: ['#9fd4ff', '#e2f3ff', '#ffffff'], hill: ['#f4f9ff', '#dbe9f7'], far: '#e8f2fb', dirt: ['#b98a62', '#7d583a'], crust: '#ffffff', crustD: '#cfe0f0', grain: ['#ffffff', '#eef6ff', '#dfeefa'] },
  beach: { sky: ['#6fc8ff', '#c9efff', '#fff8e4'], hill: ['#7fd6e8', '#5cc0dc'], far: '#bfeaf5', dirt: ['#e9c27a', '#b98a45'], crust: '#f6dc98', crustD: '#ddb76a', grain: ['#f4d27e', '#e8c066', '#fbe0a0'] },

// ---------- levels ----------
// every level is a job with a picture goal; v = vehicle marker in the level grid
const VMK = { exc: '⛏️', truck: '🚚', dozer: '🪨', crane: '🏗️', mixer: '🪣', roller: '🛞', drill: '🔩', multi: '🔁' };
const LEVELS = [
  { name: '挖個大洞', mk: 'exc', build: w => { w.ww = 840; soil(w, 330, 640, GY); digGoal(w, 360, 520, 52, 'hole'); w.dumpX = 70; addV(w, 'exc', 230, { xmin: 150, xmax: 282 }); } },
  { name: '把卡車裝滿', mk: 'exc', build: w => { w.ww = 900; mound(w, 520, 780, 70, GY + 30); addV(w, 'exc', 420, { xmin: 380, xmax: 440, dir: -1 }); npcTruck(w, 200, -1, 1); } },
  { name: '卡車倒土填洞', mk: 'truck', build: w => { w.ww = 900; pit(w, 90, 220, 32, D); fillGoal(w, 90, 220); addV(w, 'truck', 560, { xmin: 280, xmax: 820, load: 4500 }); } },
  { name: '推石頭', mk: 'dozer', build: w => { w.ww = 920; road(w, 0, 650); pit(w, 652, 900, 110); rock(w, 300, 26); rock(w, 420, 30); rock(w, 520, 22); rocksGoal(w, 660); addV(w, 'dozer', 140, { xmin: 100, xmax: 652 + 14 - 84 }); } },
  { name: '吊積木疊高高', mk: 'crane', build: w => { w.ww = 780; addV(w, 'crane', 110, { tmax: 700 }); item(w, 'cube', 240, 0, 0); item(w, 'cube', 310, 0, 1); item(w, 'cube', 380, 0, 2); stack(w, 'cube', 560, 3, 56, [0, 1, 2]); } },
  { name: '壓平新馬路', mk: 'roller', build: w => { w.ww = 1000; road(w, 0, 1000); for (const [bx, bw, bh] of [[300, 60, 18], [430, 70, 20], [570, 56, 16], [700, 72, 22], [830, 60, 18]]) bump(w, bx, bw, bh); w.reward = 'road'; addV(w, 'roller', 120, { xmin: 80, xmax: 940 }); } },
  { name: '倒水泥', mk: 'mixer', build: w => { w.ww = 900; road(w, 0, 900); mould(w, 380, 84, 40); mould(w, 620, 96, 40); addV(w, 'mixer', 160, { xmin: 120, xmax: 840 }); } },
  { name: '種路燈', mk: 'drill', build: w => { w.ww = 1000; for (const mx of [300, 520, 740]) mark(w, mx, 40, 'lamp'); w.reward = 'lamps'; addV(w, 'drill', 120, { xmin: 80, xmax: 900 }); } },
  { name: '挖游泳池', mk: 'exc', ribbon: true, build: w => { w.ww = 900; soil(w, 360, 640, GY); digGoal(w, 372, 590, 64, 'pool'); w.dumpX = 70; w.reward = 'pool'; addV(w, 'exc', 250, { xmin: 170, xmax: 296 }); } },
  { name: '推平土堆', mk: 'dozer', build: w => { w.ww = 1000; road(w, 0, 760); mound(w, 300, 460, 60, GY); mound(w, 560, 700, 45, GY); pit(w, 762, 990, 120); flatGoal(w, 180, 758); addV(w, 'dozer', 120, { xmin: 100, xmax: 762 + 14 - 84 }); } },
  { name: '蓋小橋', mk: 'crane', ribbon: true, build: w => { w.ww = 960; addV(w, 'crane', 90, { tmax: 720 }); river(w, 380, 620, 90); fixed(w, 'pillar', 500, GY + 90); item(w, 'beam', 235, 0); item(w, 'beam', 235, 1); slot(w, 'beam', 445, GY); slot(w, 'beam', 555, GY); } },
  { name: '來回運沙', mk: 'truck', build: w => { w.ww = 1100; pit(w, 60, 260, 46, D); fillGoal(w, 60, 260); hopper(w, 930); addV(w, 'truck', 620, { xmin: 320, xmax: 1010, load: 0 }); } },

  { name: '長長的山路', mk: 'roller', ribbon: true, build: w => { w.ww = 1400; hills(w, 26); road(w, 0, 1400); for (const [bx, bw, bh] of [[260, 60, 18], [420, 70, 20], [600, 60, 18], [780, 76, 22], [960, 60, 16], [1140, 70, 20]]) bump(w, bx, bw, bh); w.reward = 'road'; addV(w, 'roller', 110, { xmin: 80, xmax: 1330 }); } },
  { name: '水泥踏腳石', mk: 'mixer', build: w => { w.ww = 1100; road(w, 0, 1100); for (const mx of [340, 480, 620, 760]) mould(w, mx, 62, 30); addV(w, 'mixer', 150, { xmin: 120, xmax: 1040 }); } },
  { name: '山崩了！', mk: 'dozer', build: w => { w.ww = 1000; road(w, 0, 640); mound(w, 250, 540, 80, GY); rock(w, 310, 24); rock(w, 400, 30); rock(w, 480, 22); pit(w, 642, 990, 150); rocksGoal(w, 650); flatGoal(w, 160, 640); addV(w, 'dozer', 110, { xmin: 90, xmax: 642 + 14 - 84 }); } },
  { name: '蓋高塔', mk: 'crane', build: w => { w.ww = 820; addV(w, 'crane', 100, { tmax: 760 }); item(w, 'floor', 200, 0, 0); item(w, 'floor', 200, 1, 1); item(w, 'floor', 320, 0, 2); item(w, 'floor', 320, 1, 3); item(w, 'roof', 440, 0); stack(w, 'floor', 600, 4, 44, [0, 1, 2, 3]); slot(w, 'roof', 600, GY - 176, [3]); } },
  { name: '打地基', mk: 'drill', build: w => { w.ww = 1000; road(w, 0, 1000); for (const mx of [320, 460, 600, 740]) mark(w, mx, 80, 'pile'); addV(w, 'drill', 140, { xmin: 80, xmax: 900 }); } },
  { name: '挖化石', mk: 'exc', build: w => { w.ww = 900; soil(w, 300, 700, GY + 104); find(w, 380, GY + 58, 'bone'); find(w, 505, GY + 86, 'chest'); find(w, 625, GY + 48, 'egg'); w.dumpX = 60; addV(w, 'exc', 240, { xmin: 160, xmax: 400 }); } },
  { name: '挖土裝車去填洞', mk: 'multi', build: w => { w.ww = 1200; pit(w, 80, 220, 32, D); fillGoal(w, 80, 220); mound(w, 700, 940, 70, GY + 30); addV(w, 'exc', 610, { xmin: 570, xmax: 620, dir: -1 }); addV(w, 'truck', 400, { xmin: 300, xmax: 470, load: 0 }); } },
  { name: '推雪', mk: 'dozer', theme: 'snow', build: w => { w.ww = 1000; road(w, 0, 760); mound(w, 260, 420, 55, GY); mound(w, 500, 700, 65, GY); pit(w, 762, 990, 120); flatGoal(w, 160, 758); addV(w, 'dozer', 110, { xmin: 90, xmax: 762 + 14 - 84 }); } },
  { name: '挖開小河', mk: 'exc', build: w => { w.ww = 960; river(w, 180, 400, 50, GY + 14); mound(w, 400, 580, 60, GY + 26); digGoal(w, 420, 560, 18, 'canal'); w.reward = 'canal'; w.dumpX = 900; addV(w, 'exc', 700, { xmin: 660, xmax: 780, dir: -1 }); } },
  { name: '蓋大橋', mk: 'crane', ribbon: true, build: w => { w.ww = 1000; addV(w, 'crane', 80, { tmax: 780 }); river(w, 360, 740, 90); item(w, 'pillar', 150, 0); item(w, 'pillar', 196, 0); item(w, 'beam', 292, 0); item(w, 'beam', 292, 1); item(w, 'beam', 292, 2); slot(w, 'pillar', 460, GY + 90); slot(w, 'pillar', 640, GY + 90); slot(w, 'beam', 424, GY, [0]); slot(w, 'beam', 550, GY, [0, 1]); slot(w, 'beam', 676, GY, [1]); } },
  { name: '黃昏的水泥地', mk: 'mixer', theme: 'dusk', build: w => { w.ww = 1000; road(w, 0, 1000); mould(w, 330, 60, 44); mould(w, 520, 110, 34); mould(w, 740, 72, 40); addV(w, 'mixer', 150, { xmin: 120, xmax: 940 }); } },
  { name: '黃昏壓路', mk: 'roller', theme: 'dusk', build: w => { w.ww = 1200; hills(w, 36); road(w, 0, 1200); for (const [bx, bw, bh] of [[280, 64, 18], [460, 70, 22], [640, 60, 18], [820, 80, 22], [1000, 64, 18]]) bump(w, bx, bw, bh); w.reward = 'road'; addV(w, 'roller', 110, { xmin: 80, xmax: 1130 }); } },
  { name: '海邊的沙坑', mk: 'truck', theme: 'beach', build: w => { w.ww = 1100; pit(w, 80, 270, 40, H); fillGoal(w, 80, 270); w.sandbox = [80, 270]; hopper(w, 930); addV(w, 'truck', 600, { xmin: 330, xmax: 1010, load: 0 }); } },
  { name: '鑽井找水', mk: 'drill', build: w => { w.ww = 1000; mark(w, 300, 30, 'tree'); mark(w, 520, 110, 'well'); mark(w, 740, 30, 'tree'); addV(w, 'drill', 120, { xmin: 80, xmax: 900 }); } },
  { name: '推平再壓路', mk: 'multi', build: w => { w.ww = 1300; road(w, 0, 520); mound(w, 250, 430, 55, GY); pit(w, 522, 660, 100); flatGoal(w, 150, 518); road(w, 662, 1300); for (const [bx, bw, bh] of [[820, 60, 18], [960, 70, 20], [1100, 60, 18]]) bump(w, bx, bw, bh); addV(w, 'dozer', 110, { xmin: 90, xmax: 522 + 14 - 84 }); addV(w, 'roller', 760, { xmin: 730, xmax: 1240 }); } },
  { name: '挖池塘裝卡車', mk: 'exc', build: w => { w.ww = 960; soil(w, 470, 760, GY); digGoal(w, 490, 690, 56, 'pond'); w.reward = 'pond'; w.dumpX = 40; addV(w, 'exc', 400, { xmin: 360, xmax: 410 }); npcTruck(w, 170, -1, 1); } },
  { name: '遊樂場完工', mk: 'crane', ribbon: true, finale: true, build: w => { w.ww = 1210; addV(w, 'crane', 80, { tmax: 1130 }); item(w, 'slide', 196, 0); item(w, 'swing', 326, 0); item(w, 'house', 446, 0); item(w, 'seesaw', 576, 0); slot(w, 'slide', 740, GY); slot(w, 'house', 866, GY); slot(w, 'swing', 988, GY); slot(w, 'seesaw', 1120, GY); } },
];
const LV = n => LEVELS[n - 1];
const lvType = n => LV(n).mk;
const VNAME = { exc: '挖土機', truck: '砂石車', dozer: '推土機', crane: '吊車', mixer: '水泥車', roller: '壓路機', drill: '鑽地車', multi: '換車開' };

// ---------- world building helpers ----------
let Wd = null;
function newWorld(L) {
  const w = { ww: 900, theme: L.theme || 'day', veh: [], rocks: [], items: [], slots: [], moulds: [], bumps: [], marks: [], finds: [], hoppers: [], waters: [], goals: [], splats: [], dumpX: null, reward: null };
  L.build(w);
  return w;
}
// the builders run before the column arrays exist, so they queue terrain operations and apply them in order
function cols(w) {
  if (w.n) return;
  w.n = Math.ceil(w.ww / CW) + 2;
  w.top = new Float32Array(w.n).fill(GY); w.floor = new Float32Array(w.n).fill(GY); w.kind = new Uint8Array(w.n).fill(G);
}
const C0 = xw => Math.floor(xw / CW);
function eachCol(w, x0, x1, fn) { cols(w); for (let c = Math.max(0, C0(x0)); c <= Math.min(w.n - 1, C0(x1)); c++) fn(c, c * CW + CW / 2); }
function road(w, x0, x1) { eachCol(w, x0, x1, c => { if (w.kind[c] === G) w.kind[c] = R; }); }
function soil(w, x0, x1, fy) { eachCol(w, x0, x1, c => { w.kind[c] = D; w.floor[c] = Math.max(w.floor[c], fy); }); }
function mound(w, x0, x1, h, fy) {
  eachCol(w, x0, x1, (c, xw) => { const u = (xw - x0) / (x1 - x0), s = Math.pow(Math.sin(Math.PI * u), 0.8); w.top[c] = Math.min(w.top[c], GY - h * s); w.kind[c] = D; w.floor[c] = Math.max(fy, w.floor[c]); });
}
function pit(w, x0, x1, d, kind = H) {
  const sl = Math.min(d * 0.7, (x1 - x0) / 3);
  eachCol(w, x0, x1, (c, xw) => { const e = Math.min(xw - x0, x1 - xw), k = clamp(e / sl, 0, 1), y = GY + d * (k * k * (3 - 2 * k)); w.top[c] = y; w.floor[c] = y; w.kind[c] = kind === D ? H : kind; });
}
function hills(w, amp) { eachCol(w, 0, w.ww, (c, xw) => { const y = GY - amp * (0.5 + 0.5 * Math.sin(xw / 170 + 1.2)) * clamp((xw - 140) / 200, 0, 1) * clamp((w.ww - 120 - xw) / 200, 0, 1); w.top[c] = y; w.floor[c] = y; }); }
function river(w, x0, x1, d, wy = GY + 30) { pit(w, x0, x1, d); w.waters.push({ x0, x1, y: wy, a: 1 }); }
function digGoal(w, x0, x1, d, shape) {
  eachCol(w, x0, x1, (c, xw) => {
    const e = Math.min(xw - x0, x1 - xw), k = shape === 'pool' || shape === 'pond' ? Math.pow(clamp(e / 34, 0, 1), 0.6) : clamp(e / 26, 0, 1);
    const base = w.top[c], fy = Math.max(GY, base) + d * k;
    w.kind[c] = D; w.floor[c] = Math.max(base, fy);
  });
  w.goals.push({ type: 'dig', x0, x1, shape, prog: 0 });
}
function fillGoal(w, x0, x1) { w.goals.push({ type: 'fill', x0, x1, y: GY, prog: 0 }); }
function flatGoal(w, x0, x1) { w.goals.push({ type: 'flat', x0, x1, y: GY, prog: 0 }); }
function rocksGoal(w, zx) { w.goals.push({ type: 'rocks', zx, prog: 0 }); }
function rock(w, rx, r) { w.rocks.push({ x: rx, y: GY - r - 80, r, vy: 0, vx: 0, rot: Math.random() * 6, col: ['#9aa3b5', '#a8a196', '#8f9aad'][w.rocks.length % 3], seed: Math.random() * 10, inZone: false }); }
function bump(w, bx, bw, bh) { w.bumps.push({ x: bx, w: bw, h: bh, h0: bh, steam: Math.random() * 6 }); if (!w.goals.some(g => g.type === 'bumps')) w.goals.push({ type: 'bumps', prog: 0 }); }
function mould(w, mx, mw, md) { w.moulds.push({ x: mx, w: mw, d: md, fill: 0, done: false, pop: 0 }); if (!w.goals.some(g => g.type === 'moulds')) w.goals.push({ type: 'moulds', prog: 0 }); }
function mark(w, mx, d, kind) { w.marks.push({ x: mx, d, kind, depth: 0, done: false, pop: 0 }); if (!w.goals.some(g => g.type === 'marks')) w.goals.push({ type: 'marks', prog: 0 }); }
function find(w, fx, fy, kind) { w.finds.push({ x: fx, y: fy, kind, found: false, pop: 0, sx: fx, sy: fy }); if (!w.goals.some(g => g.type === 'find')) w.goals.push({ type: 'find', prog: 0 }); }
function hopper(w, hx) { w.hoppers.push({ x: hx, pour: 0, flying: 0, acc: 0 }); }
const ITEM = { cube: [56, 56], floor: [104, 44], roof: [120, 54], beam: [128, 20], pillar: [34, 90], slide: [124, 96], swing: [116, 100], seesaw: [134, 40], house: [86, 104] };
const CUBE_COL = ['#ff6b6b', '#ffc93a', '#4c9cf0', '#5ccf6e', '#b07cff'];
function item(w, kind, ix, layer, col = 0) {
  const [iw, ih] = ITEM[kind];
  // stack on whatever is already at that spot
  let by = GY; for (const o of w.items) if (o.state === 'ground' && Math.abs(o.x - ix) < (o.w + iw) / 2 - 4) by = Math.min(by, o.y - o.h);
  w.items.push({ kind, x: ix, y: by, w: iw, h: ih, state: 'ground', col, vy: 0, slot: null, wob: 0 });
  void layer;
}
function fixed(w, kind, ix, by) { const [iw, ih] = ITEM[kind]; w.items.push({ kind, x: ix, y: by, w: iw, h: ih, state: 'placed', col: 0, vy: 0, slot: null, fixed: true, wob: 0 }); }
function slot(w, kind, sx, by, dep = []) { const [sw, sh] = ITEM[kind]; w.slots.push({ kind, x: sx, y: by, w: sw, h: sh, dep, item: null }); if (!w.goals.some(g => g.type === 'slots')) w.goals.push({ type: 'slots', prog: 0 }); }
function stack(w, kind, sx, n, h, cols) { for (let i = 0; i < n; i++) slot(w, kind, sx, GY - i * h, i ? [w.slots.length - 1] : []); void cols; }
function npcTruck(w, px, dir, n) {
  addV(w, 'truck', px, { dir, npc: true, park: px, load: 0 });
  w.goals.push({ type: 'trucks', n, count: 0, prog: 0 });
}
function addV(w, type, vx, o = {}) {
  const v = { type, x: vx, y: GY, ang: 0, dir: o.dir || 1, vx: 0, xmin: o.xmin ?? 40, xmax: o.xmax ?? w.ww - 40, npc: !!o.npc, park: o.park, load: o.load || 0, cap: 4500, tip: 0, carry: 0, wheel: 0, spin: 0, puff: 0, depth: 0, pour: 0, state: 'park', dump: 0, pend: false, B: null, tgt: null, bang: 0, smoke: [] };
  if (type === 'exc') { v.cap = 1500; v.load = 0; }
  if (type === 'crane') { v.TX = vx; v.jy = 96; v.tmin = vx + 56; v.tmax = o.tmax || w.ww - 60; v.tro = vx + 160; v.hy = 200; v.sw = 0; v.swv = 0; v.hold = null; v.x = vx; }
  if (type === 'mixer') v.drum = 0;
  if (type === 'truck' && !v.npc) v.cap = 4500;
  if (type === 'truck' && v.npc) v.cap = 3600;
  w.veh.push(v);
  return v;
}

// ---------- state ----------
let level = 1, state = 'menu', act = 0, t = 0;
let grains = [], floats = [], cheer = null, ribbon = null, animals = [], rewardT = 0, finishT = 0;
const keys = { L: false, R: false, U: false, D: false, A: false };
const press = { L: 0, R: 0, U: 0, D: 0, A: 0 };       // how many pointers hold each panel button
let sceneDrive = null;                               // world x a finger is holding in the scene (drive towards it)
let scenePtr = null;
let bot = false;
const cur = () => Wd && Wd.veh[act];

// ---------- layout ----------
let LW = 300, LH = 300, PH = 120, VH = 200, S = 1, YB = WB, camX = 0, btns = [], bgC = null, bgKey = '';
function layout() {
  LW = cv.lw; LH = cv.lh;
  const wide = LW > LH * 1.25;
  PH = Math.round((wide ? clamp(LH * 0.17, 92, 140) : clamp(LH * 0.17, 100, 170)) * (MG.big ? 1.12 : 1));
  VH = LH - PH;
  S = Math.min(VH / WB, LW / clamp(LW * 0.95, 400, 800));      // phones see ~400 world units across, tablets more
  YB = WB + Math.max(0, VH / S - WB) * 0.42;          // tall screens: show more ground below, less empty sky
  buildButtons();
}
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  const W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  const Hh = Math.max(300, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  return [W, Hh];
});
cv.onfit = () => layout();
addEventListener('mg-big', () => layout());
const wx2s = wx => (wx - camX) * S, wy2s = wy => VH - (YB - wy) * S;
const s2w = (sx, sy) => ({ x: sx / S + camX, y: (sy - VH) / S + YB });
const visW = () => LW / S;

// panel buttons for the vehicle being driven
const ACTS = {
  exc: [{ id: 'dump', ic: '🪣', label: '倒土', tap: true }],

// ---------- autopilot (used by the tests to prove every job can be finished) ----------
function botStep(dt) {
  const v = cur(), w = Wd;
  keys.L = keys.R = keys.A = keys.U = keys.D = false;
  const goTo = (tx, tol = 4) => { const d = tx - v.x; if (d > tol) keys.R = true; else if (d < -tol) keys.L = true; return Math.abs(d) <= tol; };

    const truck = w.veh.find(o => o.type === 'truck' && (o.npc ? o.state === 'park' : true) && o.load < o.cap - GA);
    const dig = w.goals.find(g => g.type === 'dig' && !g.done), fnd = w.finds.find(f => !f.found);
    const fillG = w.goals.find(g => g.type === 'fill' && !g.done);
    if (multi && truck && !truck.npc && truck.load >= truck.cap - GA * 2) { switchTo(w.veh.indexOf(truck)); return; }
    if (multi && fillG && w.veh.find(o => o.type === 'truck' && !o.npc).load >= 3800) { switchTo(w.veh.findIndex(o => o.type === 'truck' && !o.npc)); return; }
    const sh = shoulder(v), M = mouthOf(v);
    const full = v.load >= v.cap - 2 || (v.load > 0 && v.botDump);
    if (v.dump) return;
    if (full) {
      let tx, ty;
      if (truck) { const [b0, b1] = bedRange(truck); tx = (b0 + b1) / 2; ty = bedRim(truck) - 50; }
      else { tx = w.dumpX ?? 40; ty = minTop(tx - 40, tx + 40) - 50; }
      const dxs = tx - sh.x;
      if (Math.abs(dxs) > 250) { goTo(v.x + Math.sign(dxs) * 40); }
      v.tgt = { x: tx, y: ty };
      if (Math.hypot(M.x - tx, M.y - ty) < 20) { v.pend = false; startDump(v); v.botDump = false; }
      return;
    }
    // choose where to dig
    let best = null;
    const consider = (c, score) => { if (!best || score > best.s) best = { c, s: score }; };
    if (fnd) { for (let c = C0(fnd.x - 16); c <= C0(fnd.x + 16); c++) if (w.top[c] < w.floor[c] - 1) consider(c, -(Math.abs(c * CW - fnd.x)) + (w.floor[c] - w.top[c]) * 0.1); }
    else if (dig) eachCol(w, dig.x0, dig.x1, c => { const rem = w.floor[c] - w.top[c]; if (rem > 2) consider(c, rem - Math.abs(c * CW - (dig.x0 + dig.x1) / 2) * 0.05); });

    const reach = Math.hypot(tx - sh.x, ty + 0 - sh.y);
    if (reach > EXC.L1 + EXC.L2 - 30) goTo(v.x + Math.sign(tx - sh.x) * 60);
    else if (Math.abs(tx - v.x) < 96) goTo(v.x - Math.sign(tx - v.x) * 60);

  } else if (v.type === 'truck') {
    const fill = w.goals.find(g => g.type === 'fill' && !g.done);
    if (!fill) return;
    const hp = w.hoppers[0];
    if (v.mode !== 'dump' && v.load < v.cap - GA && (hp || !multi)) {
      if (!hp) { v.mode = 'dump'; return; }
      const [b0, b1] = bedRange(v), bc = (b0 + b1) / 2; const d = hp.x - bc;
      if (Math.abs(d) > 6) { if (d > 0) keys.R = true; else keys.L = true; }
      if (v.load >= v.cap - GA * 2) v.mode = 'dump';
      return;
    }
    if (multi && v.load < 3000 && v.mode !== 'dump') { if (goTo(v.xmax, 3)) switchTo(w.veh.findIndex(o => o.type === 'exc')); return; }

    if (v.hold) {
      const s = w.slots.find(q => !q.item && q.kind === v.hold.kind && slotOpen(q));
      if (!s) { dropHeld(v); return; }
      const above = s.y - v.hold.h - 14 - 60;

}

  if (g.type === 'marks') return { lamp: '💡', pile: '🏛️', tree: '🌳', well: '⛲' }[Wd.marks[0].kind] || '✖️';
  if (g.type === 'slots') return { cube: '🧱', floor: '🏢', beam: '🌉', pillar: '🌉', slide: '🎠' }[Wd.slots[0].kind] || '🧱';
  return GICON[g.type];
}
function drawCard() {
  const gs = Wd.goals; if (!gs.length) return;
  const u = Math.max(1, Math.min(1.35, LW / 600)) * MG.textScale, rowH = 34 * u, pad = 8 * u, w = Math.min(LW - 20, 190 * u), h = pad * 2 + rowH * gs.length;
  const X = 10, Y = 10;
  x.fillStyle = 'rgba(255,255,255,.88)'; rr(X, Y, w, h, 14 * u); x.fill(); x.strokeStyle = 'rgba(200,150,60,.6)'; x.lineWidth = 2.5; x.stroke();
  gs.forEach((g, i) => {
    const yy = Y + pad + i * rowH + rowH / 2;
    x.font = `${Math.round(22 * u)}px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(goalIcon(g), X + pad + 13 * u, yy + 1);
    const bx = X + pad + 32 * u, bw = w - (bx - X) - pad - (g.done ? 26 * u : 0), bh = 14 * u;
    const counts = { rocks: Wd.rocks.length, trucks: g.n, slots: Wd.slots.length, moulds: Wd.moulds.length, marks: Wd.marks.length, find: Wd.finds.length }[g.type];
    if (counts && counts <= 6) {
      const got = Math.round(g.prog * counts), r = Math.min(bh * 0.62, (bw / counts) * 0.38);
      for (let k = 0; k < counts; k++) { const cx = bx + r + k * (bw - 2 * r) / Math.max(1, counts - 1) * (counts > 1 ? 1 : 0); x.beginPath(); x.arc(counts === 1 ? bx + r : cx, yy, r, 0, 7); fs(k < got ? '#ffc93a' : '#efe4cc', k < got ? '#c47c00' : '#d8c9a6', 2); if (k < got) { x.fillStyle = '#fff'; star(counts === 1 ? bx + r : cx, yy, r * 0.6, r * 0.27); x.fill(); } }
    } else {
      rr(bx, yy - bh / 2, bw, bh, bh / 2); x.fillStyle = '#efe4cc'; x.fill();
      const p = clamp(g.prog / (DONE_AT[g.type] || 1), 0, 1);
      if (p > 0) { rr(bx, yy - bh / 2, Math.max(bh, bw * p), bh, bh / 2); x.fillStyle = grad(yy - bh / 2, yy + bh / 2, '#9be38a', '#3cb85a'); x.fill(); }
      rr(bx, yy - bh / 2, bw, bh, bh / 2); x.strokeStyle = '#c99a5a'; x.lineWidth = 2; x.stroke();
    }
    if (g.done) { x.font = `${Math.round(20 * u)}px ${EMO}`; x.fillText('✅', X + w - pad - 10 * u, yy + 1); }
  });
}
function drawPanel() {
  const Y = VH;
  x.fillStyle = grad(Y, LH, '#fff3d6', '#ffe0a8'); x.fillRect(0, Y, LW, LH - Y);
  // hazard stripe
  x.save(); x.beginPath(); x.rect(0, Y, LW, 7); x.clip(); x.fillStyle = '#2c3038'; x.fillRect(0, Y, LW, 7); x.fillStyle = '#ffc93a'; for (let xx = -20; xx < LW + 20; xx += 22) { x.beginPath(); x.moveTo(xx, Y + 7); x.lineTo(xx + 11, Y); x.lineTo(xx + 22, Y); x.lineTo(xx + 11, Y + 7); x.closePath(); x.fill(); } x.restore();
  const v = cur(); if (!v) return;
  const glow = glowFor(v);
  for (const b of btns) {
    const held = (b.kind === 'pedal' || b.hold) && (press[b.id] > 0 || keys[b.id]);
    const off = b.kind === 'act' && b.id === 'dump' && v.load <= 0;
    const col = b.kind === 'pedal' ? ['#bfe3ff', '#6db8f5', '#2f78cf'] : b.kind === 'act' ? (off ? ['#f3ead8', '#e2d6bd', '#b9a888'] : ['#ffd9a8', '#ff9f4a', '#c0601a']) : b.kind === 'horn' ? ['#fff6c0', '#ffd84a', '#c49a00'] : (b.vi === act ? ['#fff', '#ffe08a', '#e0a000'] : ['#ffffff', '#eef2f6', '#b5bfcc']);
    const dy = held ? 4 : 0;
    x.fillStyle = 'rgba(120,70,20,.25)'; rr(b.x, b.y + 5, b.w, b.h, 16); x.fill();
    rr(b.x, b.y + dy, b.w, b.h - 2, 16); x.fillStyle = grad(b.y, b.y + b.h, col[0], col[1]); x.fill(); x.strokeStyle = col[2]; x.lineWidth = 3; x.stroke();
    if (b.id === glow || (b.kind === 'switch' && glow === 'sw' + b.vi)) { x.save(); x.globalAlpha = 0.5 + Math.sin(t * 8) * 0.4; x.strokeStyle = '#ff5d7a'; x.lineWidth = 5; rr(b.x - 4, b.y - 4 + dy, b.w + 8, b.h + 6, 19); x.stroke(); x.restore(); }
    x.fillStyle = 'rgba(255,255,255,.45)'; rr(b.x + 8, b.y + 5 + dy, b.w - 16, 8, 4); x.fill();
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2 + dy;
    if (b.kind === 'pedal') {
      const r = Math.min(b.w, b.h) * 0.24; x.fillStyle = '#fff'; x.strokeStyle = '#1d4f9e'; x.lineWidth = 3; x.beginPath();
      const d = b.id === 'L' ? -1 : 1; x.moveTo(cx + d * r * 1.2, cy); x.lineTo(cx - d * r * 0.8, cy - r * 1.2); x.lineTo(cx - d * r * 0.8, cy + r * 1.2); x.closePath(); x.fill(); x.stroke();
    } else if (b.kind === 'switch') {
      const o = Wd.veh[b.vi]; x.save(); x.beginPath(); x.roundRect(b.x + 3, b.y + 3 + dy, b.w - 6, b.h - 8, 13); x.clip();
      const k = Math.min(b.w / 230, b.h / 160); x.translate(cx, b.y + b.h * 0.84 + dy); x.scale(k, k);
      drawIcon(o.type);
      x.restore();
    } else {
      const fsz = Math.round(Math.min(b.h * 0.36, b.w * 0.36, 34));
      x.font = `${fsz}px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle';
      const lab = b.label && b.h > 70;
      x.fillStyle = '#5a3a10'; x.fillText(b.ic, cx, cy - (lab ? fsz * 0.38 : 0));
      if (lab) { let ls = Math.round(Math.min(18 * MG.textScale, b.h * 0.2)); x.font = `800 ${ls}px ${FONT}`; while (ls > 10 && x.measureText(b.label).width > b.w - 8) { ls--; x.font = `800 ${ls}px ${FONT}`; } x.fillStyle = off ? '#a8987a' : '#5a3a10'; x.fillText(b.label, cx, cy + fsz * 0.72); }
    }
  }
}
function drawIcon(type) {
  const fake = { type, x: 0, y: 0, ang: 0, dir: 1, wheel: 0, smoke: [], load: 0, cap: 1, tip: 0, carry: 0, depth: 0, spin: 0, drum: t, B: { x: 120, y: -60 }, bang: -0.15, npc: false };
  if (type === 'exc') { fake.E = ik(shoulder(fake), fake.B); drawVeh(fake, false); drawArm(fake); }
  else drawVeh(fake, false);
}
function glowFor(v) {
  const w = Wd;
  if (v.type === 'truck' && v.load > 0 && v.x <= v.xmin + 30 && w.goals.some(g => g.type === 'fill' && !g.done)) return 'A';
  if (v.type === 'mixer') { const ch = v.x - v.dir * 112; if (w.moulds.some(m => !m.done && Math.abs(m.x - ch) < m.w / 2)) return 'A'; }
  if (v.type === 'drill') { const b = v.x + v.dir * 94; if (w.marks.some(m => !m.done && Math.abs(m.x - b) < 30)) return 'A'; }
  if (v.type === 'exc' && v.load > 0 && hintT > 4) return 'dump';
  // multi-machine levels: show which machine to switch to
  const others = w.veh.map((o, i) => [o, i]).filter(([o, i]) => !o.npc && i !== act);
  if (others.length) {
    if (v.type === 'exc') { const tr = others.find(([o]) => o.type === 'truck'); if (tr && tr[0].load >= tr[0].cap - GA * 3) return 'sw' + tr[1]; }
    if (v.type === 'truck' && v.load <= 0 && w.goals.some(g => g.type === 'fill' && !g.done)) { const ex = others.find(([o]) => o.type === 'exc'); if (ex) return 'sw' + ex[1]; }
    if (v.type === 'dozer' && w.goals.filter(g => g.type === 'flat' || g.type === 'rocks').every(g => g.done)) { const ro = others.find(([o]) => o.type === 'roller'); if (ro) return 'sw' + ro[1]; }
    if (v.type === 'roller' && w.goals.some(g => g.type === 'flat' && !g.done) && w.goals.find(g => g.type === 'bumps')?.done) { const dz = others.find(([o]) => o.type === 'dozer'); if (dz) return 'sw' + dz[1]; }
  }
  if (hintT > 5 && ['dozer', 'roller', 'truck', 'mixer', 'drill'].includes(v.type) && Math.abs(v.vx) < 5) return 'R';
  return null;
}

// ---------- floats ----------
function say(wx, wy, text, col) {
  // stack on top of words that are still showing nearby instead of drawing over them
  for (let k = 0; k < 4; k++) { const o = floats.find(f => f.life > 0.5 && Math.abs(f.x - wx) < 150 && Math.abs(f.y - wy) < 30); if (!o) break; wy = o.y - 34; }
  floats.push({ x: wx, y: wy, text, col, life: 1.3 }); if (floats.length > 5) floats.shift();
}
function drawFloats() {
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    const sz = Math.round(Math.max(20, Math.min(32, 26 * S)) * MG.textScale);
    x.font = `900 ${sz}px system-ui,${FONT}`;
    const tw = x.measureText(f.text).width;
    const sx = clamp(wx2s(f.x), tw / 2 + 8, LW - tw / 2 - 8), sy = Math.max(sz, wy2s(f.y) - (1.3 - f.life) * 30);
    x.globalAlpha = Math.min(1, f.life * 2.5);
    x.lineWidth = Math.max(3, sz * 0.2); x.strokeStyle = '#fff'; x.strokeText(f.text, sx, sy);
    x.fillStyle = f.col; x.fillText(f.text, sx, sy);
  }
  x.globalAlpha = 1;
}

// ---------- main draw ----------
function draw() {
  if (!Wd) return;
  drawBg();
  x.save(); x.beginPath(); x.rect(0, 0, LW, VH); x.clip();
  x.save(); x.translate(-camX * S, VH - YB * S); x.scale(S, S);
  drawDeco();
  for (const hp of Wd.hoppers) drawHopper(hp);
  for (const v of Wd.veh) if (v.type === 'crane') drawCrane(v, Wd.veh.indexOf(v) === act);
  for (const s of Wd.slots) if (!s.item) drawItem({ ...s, wob: 0, col: 0 }, true);
  drawTerrain();
  drawUG();
  drawMoulds(false);
  drawWaters();
  drawRewards();
  drawFinds();
  drawGoals();
  drawBumps();
  drawMarks();
  for (const o of Wd.items) if (o.state !== 'held') drawItem(o, false);
  drawRocks();
  Wd.veh.forEach((v, i) => { if (v.type !== 'crane') { drawVeh(v, i === act); if (v.type === 'exc') drawArm(v); } });
  for (const o of Wd.items) if (o.state === 'held') drawItem(o, false);
  for (const g of grains) { x.fillStyle = g.col; x.save(); x.translate(g.x, g.y); x.rotate(g.r); x.fillRect(-g.s / 2, -g.s / 2, g.s, g.s); x.restore(); }
  drawMoulds(true);
  drawSpect();
  drawRibbon();
  for (const a of animals) drawAnimal(a.kind, a.x, topAt(a.x) - (a.hop > 0 ? Math.abs(Math.sin(a.hop * 8)) * 22 : a.walk ? Math.abs(Math.sin(a.ph)) * 5 : 0), 16, a.dir, state === 'cheer' || !a.walk);
  if (state === 'cheer') for (const a of animals) if (a.hop > 0) { x.fillStyle = '#ff5d7a'; x.font = `20px ${EMO}`; x.textAlign = 'center'; x.fillText('💖', a.x, topAt(a.x) - 70 - (1.2 - a.hop) * 20); }
  if (hintT > 2.5 || level <= 3) drawArrow(nextSpot());

  MG.fx.draw(x);
  drawFloats();
  drawCard();
  x.restore();
  drawPanel();
}

// ---------- menu ----------
function menu() {
  state = 'menu';
  const done = cleared();
  MG.choose({
    id: 'digger', title: '噗噗工地',
    html: `<p>戴上安全帽，開工囉！噗噗要開<b>挖土機、砂石車、推土機、吊車、水泥車、壓路機和鑽地車</b>，把每個工作做好。</p><p>照著虛線的圖案做就對了：挖游泳池、裝滿卡車、推石頭、蓋橋、壓馬路、蓋遊樂場⋯⋯完工還要和動物朋友一起剪綵！不限時間，慢慢玩 ^_^</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${VMK[LV(n).mk]} ${LV(n).name}${done.includes(n) ? ' ✓' : ''}）`, short: n => `${n}${done.includes(n) ? '✓' : VMK[LV(n).mk]}` },
    keys: '用手指拖挖斗、吊鉤，按住 ◀ ▶ 開車　鍵盤：<kbd>←</kbd><kbd>→</kbd> 開車　<kbd>↑</kbd><kbd>↓</kbd> 挖斗／吊鉤　<kbd>空白鍵</kbd> 動作　<kbd>H</kbd> 喇叭　<kbd>Tab</kbd> 換車',
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
// a scene behind the start menu
startLevel(Math.min(MG.store.get('digger.pickLevel', 1), LEVELS.length), false); state = 'menu';
menu();

// ---------- test hook ----------
window.DIGT = {
  get state() { return state; }, get level() { return level; }, levels: LEVELS.length,
  start: n => startLevel(n), menu: () => menu(),
  progress: () => Wd.goals.map(g => ({ type: g.type, prog: +(g.done ? 1 : goalProgress(g)).toFixed(3), done: !!g.done })),
  veh: () => Wd.veh.map(v => ({ type: v.type, x: Math.round(v.x), y: Math.round(v.y), load: Math.round(v.load), npc: v.npc, st: v.state })),
  get act() { return act; },
  bot(on = true) { bot = on; if (!on) for (const k in keys) keys[k] = false; },
  step(sec, dt = 1 / 30) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) { if (MG.panelOpen() && state === 'play') MG.hide(); update(dt); if (state === 'over') break; } return state; },
  win() { for (const g of Wd.goals) if (!g.done) { if (g.type === 'trucks') g.count = g.n; if (g.type === 'slots') for (const s of Wd.slots) if (!s.item) { const it = Wd.items.find(o => o.kind === s.kind && o.state === 'ground'); if (it) placeItem(it, s); } if (g.type === 'moulds') Wd.moulds.forEach(m => { m.done = true; m.fill = 1; }); if (g.type === 'marks') Wd.marks.forEach(m => { m.done = true; m.pop = 1; }); if (g.type === 'find') Wd.finds.forEach(f => { f.found = true; f.pop = 1; }); if (g.type === 'rocks') Wd.rocks.forEach(r => { r.inZone = true; }); finishGoal(g); } beginFinish(); },
  cut: () => cutRibbon(),
  toClient(wx, wy) { const rc = cv.getBoundingClientRect(), B = 3, sx = wx2s(wx), sy = wy2s(wy); return { x: rc.left + B + sx * (rc.width - 2 * B) / LW, y: rc.top + B + sy * (rc.height - 2 * B) / LH }; },
  btn(id) { const b = btns.find(q => q.id === id); if (!b) return null; const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + (b.x + b.w / 2) * (rc.width - 2 * B) / LW, y: rc.top + B + (b.y + b.h / 2) * (rc.height - 2 * B) / LH }; },
  bucket() { const v = Wd.veh.find(o => o.type === 'exc'); return v && { ...mouthOf(v), load: v.load }; },

MG.loop(dt => {
