    const tw = x.measureText(banner.t).width + 48 + (banner.sw ? 40 : 0);
    x.fillStyle = 'rgba(60,30,20,.2)'; x.beginPath(); x.roundRect(-tw / 2, -fsz * 0.9 + 4, tw, fsz * 1.8, fsz * 0.9); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.roundRect(-tw / 2, -fsz * 0.9, tw, fsz * 1.8, fsz * 0.9); x.fill(); x.strokeStyle = banner.c; x.lineWidth = 4; x.stroke();
    let tx0 = 0; if (banner.sw) { circ(x, -tw / 2 + 34, 0, 14); ff(x, gl(x, -tw / 2 + 34, 0, 14, ['#fff', CNAME[banner.sw][1], CNAME[banner.sw][1]]), 'rgba(60,40,30,.5)', 2); tx0 = 20; }

}

// ---------- flow ----------
const NEWS = {

  recipe: ['📝 食譜任務', '照著上面的食譜，把<b>每一種都接夠</b>，接夠的會打勾 ✅！'],
  sort: ['🧺 紅黃分類', '噗噗拿著兩個籃子，<b>籃子上有圖案</b>。要用對的籃子接：左邊接紅色的、右邊接黃色的！'],
  two: ['🧺🧺 兩個籃子', '噗噗一次拿兩個籃子，左右兩邊都接得到，可以接得更多！'],
  bug: ['🐛 小蟲蟲', '小蟲蟲會扭來扭去地掉下來，不要接到牠喔！'],
  meteor: ['☄️ 流星', '流星會斜斜地飛下來，躲開它們！'],
  bubble: ['🫧 泡泡雨', '泡泡會慢慢飄下來、左右晃，接到會「啵」一聲破掉！'],
  star: ['⭐ 星星夜', '晚上的天空會掉下星星和月亮，有些流星會斜斜地飛喔！'],
  snail: ['🐌 慢動作', '接到蝸牛，所有東西都會<b>變慢</b>一下子，比較好接！'],
  wind: ['💨 起風了', '風會把東西吹歪，風向還會變！看白色的風線，往旁邊多走一點。'],
  mag: ['🧲 吸鐵石', '接到吸鐵石，好東西會被<b>吸到籃子裡</b>，持續一下子！'],
  seq: ['🔢 照順序接', '上面有一排東西，要<b>照順序</b>一個一個接！下一個要接的會<b>亮起來、有箭頭</b>，其他的先不要（會變淡淡的）。'],
  switch: ['🚦 換顏色', '上面的圓圈告訴你現在要接<b>什麼顏色</b>。接夠了就會<b>換顏色</b>，看清楚再接喔！'],
  gold: ['🪙 黃金雨', '金色的雲飄過來就會<b>下金幣雨</b>！跟著雲跑，接住金幣 🪙 就過關。'],
  rain: ['✨ 黃金雨獎勵', '有時候金色的雲會飄過來下金幣雨，接到金幣可以<b>多拿好多分</b>！'],
};
function intro() {
  const ks = [L.gt === 'score' ? '' : L.gt, L.two && L.gt !== 'sort' ? 'two' : '', ...Object.keys(L.bad || {}), L.it === 'bubble' || L.it === 'star' ? L.it : '', L.snail ? 'snail' : '', L.wind ? 'wind' : '', L.mag ? 'mag' : '', L.goldRain ? 'rain' : '']
    .filter(k => NEWS[k] && !MG.store.get('catch.seen.' + k, false));
  if (!ks.length) return false;
  ks.forEach(k => MG.store.set('catch.seen.' + k, true));
  MG.panel({ title: ks.map(k => NEWS[k][0]).join('＋'), html: ks.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  return true;
}
function goalWords(Lv) {
  if (Lv.gt === 'recipe') return Object.keys(Lv.rec).map(k => `${k}×${Lv.rec[k]}`).join(' ');
  if (Lv.gt === 'sort') return `${Lv.A.join('')} ↔ ${Lv.B.join('')} 各 ${Lv.g} 個`;
  if (Lv.gt === 'only') return `只接 ${isBub(Lv.ch) ? '藍色泡泡' : Lv.ch} ×${Lv.g}`;
  if (Lv.gt === 'score') return `${Lv.g} 分`;
  if (Lv.gt === 'seq') return `照順序 ${Lv.seq.join('→')}，共 ${Lv.g} 個`;
  if (Lv.gt === 'switch') return `${Lv.cols.map(c => CNAME[c][0]).join('→')} 換著接，共 ${Lv.g} 個`;
  if (Lv.gt === 'gold') return `接金幣 🪙×${Lv.g}`;

}
function start(m) { if (m) mode = m; startLevel(level); }
function startLevel(n) {
  level = n; L = n === FREE ? null : LEVELS[n - 1]; bgKey = '';
  reset(); state = 'play'; MG.hide(); rest.show(!L && mode === 'relax');
  if (L) { B.x = B.tx = W / 2; if (!intro()) MG.toast(`第 ${n} 關　${goalWords(L)}`, 1800); }
}
function win() {

  banner = { t: MG.WORDS.clear, life: 2.2, c: THC[theme()].ac };
  MG.fx.burst(B.x, GROUND - 70, { n: 44, colors: ['#ffd23f', '#ff8ac2', '#6fd3ff', '#9be36a', '#fff', THC[theme()].ac], speed: 300, up: 220, size: 6, shape: 'star', life: 1.1 });

    html: `<div class="big">${score} 分</div><p>${mode === 'timed' ? `還剩 ${Math.ceil(left)} 秒` : `用了 ${mmss(t)}`}</p><p>${nx === FREE ? '全部過關了！可以去 🍎 自由玩拿高分 ^_^' : `下一關：${lvName(nx)}（${goalWords(LEVELS[nx - 1])}）`}</p>`,
    buttons: [{ label: nx === FREE ? '🍎 自由玩' : '下一關', on: () => startLevel(nx) }, { label: '再玩一次', alt: true, on: () => startLevel(done) }, { label: '選關卡', alt: true, on: menu }],
  }), 1500);
}
function stepIdle(dt) {   // after a win: the celebration keeps moving

function end(msg) {

    buttons: [{ label: '再玩一次', on: () => startLevel(FREE) }, { label: '選關卡', alt: true, on: menu }],

function menu() {

    id: 'catch', title: '水果接接樂',
    html: `<p>幫噗噗用籃子接住掉下來的東西！${LEVELS.length} 關走過 🍎 果園、🏖️ 海灘、❄️ 雪地、🏮 夜市、🪐 太空…每一關有不同的 🎯 目標：只接一種、📝 食譜、🔢 照順序接、🚦 換顏色、🪙 黃金雨、🧺 兩個籃子、💨 大風、🧲 吸鐵石…最後一格是 🍎 自由玩。</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・不會輸' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '有時間限制・💣 碰到三次就結束' }],
    levels: { count: FREE, max: FREE, label: n => n === FREE ? `🍎 自由玩（最高 ${MG.best('catch') ?? 0} 分）` : `${n}（${lvName(n)}：${goalWords(LEVELS[n - 1])}）`,
      short: n => n === FREE ? '🍎' : `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '電腦：<kbd>←</kbd><kbd>→</kbd> 或滑鼠　手機：手指在畫面上左右拖　自由玩的慢慢玩按上面的「休息一下」結束',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },

reset(); menu();
// test hook
const HOOK = window.CTC = { auto: false, fast: 1, start(n, m = 'relax') { mode = m; startLevel(n); }, get state() { return state; }, get level() { return level; }, get score() { return score; }, get got() { return got; },
  get count() { return FREE; }, levels: LEVELS, goal: () => goalFrac(), menu: () => menu(), win: () => win(), get theme() { return theme(); }, get rain() { return rain.on; }, get items() { return items.length; },
  get basket() { return { x: B.x, y: GROUND - 4, two: !!(L && L.two), sep: SEP }; }, wanted: ch => wanted(ch), sprites: () => Object.keys(DRAW), get size() { return [W, H]; } };
MG.loop(dt => {
