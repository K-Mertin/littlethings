<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'catch', title: '水果接接樂', stats: ['score', 'time'] });
let W = 360, H = 560;
const cv = document.getElementById('cv'), x = cv.getContext('2d');
// logical size follows the stage shape so the orchard fills the screen (portrait: 360 wide, landscape: 360 tall)
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  if (asp >= 1) { H = 360; W = Math.round(Math.min(1000, Math.max(400, H * asp))); }
  else { W = 360; H = Math.round(Math.min(860, Math.max(400, W / asp))); }
  return [W, H];
});
addEventListener('mg-big', () => { bgKey = ''; });
const TS = () => MG.textScale;
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const FRUITS = [['🍎', 10], ['🍌', 10], ['🍇', 10], ['🍊', 10], ['🍓', 10], ['🍉', 20], ['🍍', 20]];
const ROUND = 60, BW = 70;
let GROUND = 0; const groundY = () => (GROUND = H - 40);
let shake = 0, inBasket = [];
const JUICE = { '🍎': '#ff4f5e', '🍌': '#ffe14a', '🍇': '#9b5cff', '🍊': '#ff9f1c', '🍓': '#ff3b5c', '🍉': '#ff5a6e', '🍍': '#ffcf3a', '⭐': '#ffd23f', '🐌': '#8fd0ff', '🍒': '#e8243c', '🍋': '#fff04a',
  '🍬': '#ff8ac2', '🍭': '#ff5aa8', '🍩': '#d9935a', '🧁': '#ff9cc2', '🍪': '#c98a4a', '🍫': '#7a4a2a', '🍰': '#ffe0ec', '🌟': '#ffe36b', '🌙': '#fff3a8', '🧲': '#ff5a4e' };
// ---------- levels ----------
const SETS = {
  fruit: FRUITS.concat([['🍒', 10], ['🍋', 10]]),
  sweet: [['🍬', 10], ['🍭', 10], ['🍩', 10], ['🧁', 10], ['🍪', 10], ['🍫', 20], ['🍰', 20]],
  star: [['⭐', 10], ['⭐', 10], ['🌟', 20], ['🌙', 30]],
  bubble: [['blue', 10], ['pink', 10], ['yellow', 10], ['green', 10]],
};
const BUB = { blue: ['#d8f0ff', '#5ab4ff'], pink: ['#ffe0ef', '#ff7ab8'], yellow: ['#fff6c8', '#ffc93a'], green: ['#dcffe2', '#4cc96a'] };
const BAD = { bomb: '💣', bug: '🐛', meteor: '☄️' };
// it = what falls; gt: count (any g good things) | only (g of `ch`) | recipe (rec) | sort (two labelled baskets, g each) | score (g points)
// bad = { bomb|bug|meteor: share }, wind 0..1, two = two baskets, mag / snail = bonus shares, sp = fall speed ×, rate = seconds between drops, time = ⏱ limit, th = scenery
const LEVELS = [
  { n: '果園小幫手', it: 'fruit', gt: 'count', g: 10, sp: 0.8, rate: 0.95, time: 60, mk: '🌱' },
  { n: '小心炸彈', it: 'fruit', gt: 'count', g: 15, bad: { bomb: 0.16 }, time: 60 },
  { n: '只要蘋果', it: 'fruit', gt: 'only', ch: '🍎', g: 8, time: 70, mk: '🍎' },
  { n: '糖果屋', it: 'sweet', th: 'candy', gt: 'count', g: 15, bad: { bomb: 0.12 }, time: 60, mk: '🍬' },
  { n: '水果沙拉', it: 'fruit', gt: 'recipe', rec: { '🍎': 3, '🍌': 2 }, time: 70, mk: '📝' },
  { n: '小蟲蟲', it: 'fruit', gt: 'count', g: 12, bad: { bug: 0.25 }, time: 60, mk: '🐛' },
  { n: '泡泡雨', it: 'bubble', th: 'bubble', gt: 'count', g: 15, sp: 0.6, rate: 0.6, time: 60, mk: '🫧' },
  { n: '星星夜', it: 'star', th: 'night', gt: 'count', g: 15, time: 60, mk: '⭐' },
  { n: '慢動作', it: 'fruit', gt: 'count', g: 20, sp: 1.3, rate: 0.6, bad: { bomb: 0.12 }, snail: 0.1, time: 70, mk: '🐌' },
  { n: '兩個籃子', it: 'fruit', gt: 'count', g: 20, two: 1, bad: { bomb: 0.14 }, time: 60, mk: '🧺' },
  { n: '起風了', it: 'fruit', gt: 'count', g: 15, wind: 0.6, time: 70, mk: '💨' },
  { n: '只要棒棒糖', it: 'sweet', th: 'candy', gt: 'only', ch: '🍭', g: 8, bad: { bomb: 0.1 }, time: 70, mk: '🍭' },
  { n: '吸鐵石', it: 'fruit', gt: 'count', g: 20, mag: 0.07, bad: { bomb: 0.14 }, time: 60, mk: '🧲' },
  { n: '莓果沙拉', it: 'fruit', gt: 'recipe', rec: { '🍓': 3, '🍇': 3, '🍊': 2 }, time: 80, mk: '📝' },
  { n: '藍色泡泡', it: 'bubble', th: 'bubble', gt: 'only', ch: 'blue', g: 10, sp: 0.6, rate: 0.55, wind: 0.4, time: 70, mk: '🫧' },
  { n: '紅黃分類', it: 'sort', gt: 'sort', A: ['🍎', '🍓', '🍒'], B: ['🍌', '🍋', '🍍'], g: 6, two: 1, sp: 0.85, time: 80, mk: '🧺' },
  { n: '流星雨', it: 'star', th: 'night', gt: 'only', ch: '🌟', g: 10, bad: { meteor: 0.2 }, time: 70, mk: '☄️' },
  { n: '甜點食譜', it: 'sweet', th: 'candy', gt: 'recipe', rec: { '🍩': 3, '🧁': 3, '🍪': 3 }, bad: { bug: 0.15 }, time: 90, mk: '📝' },
  { n: '蟲蟲大風', it: 'fruit', gt: 'count', g: 20, bad: { bug: 0.2 }, wind: 0.7, time: 70, mk: '💨' },
  { n: '雙籃大豐收', it: 'fruit', gt: 'count', g: 30, two: 1, sp: 1.2, rate: 0.5, bad: { bomb: 0.2 }, time: 85, mk: '🧺' },
  { n: '泡泡大風', it: 'bubble', th: 'bubble', gt: 'count', g: 25, sp: 0.7, rate: 0.5, wind: 0.8, bad: { bug: 0.12 }, time: 70, mk: '🫧' },
  { n: '糖果分類', it: 'sort', gt: 'sort', A: ['🍬', '🍭'], B: ['🍩', '🍪'], g: 8, two: 1, bad: { bomb: 0.1 }, wind: 0.4, time: 90, th: 'candy', mk: '🧺' },
  { n: '大食譜', it: 'fruit', gt: 'recipe', rec: { '🍎': 4, '🍌': 4, '🍇': 4 }, sp: 1.2, bad: { bomb: 0.2 }, time: 90, mk: '📝' },
  { n: '超級大挑戰', it: 'fruit', gt: 'score', g: 600, sp: 1.3, rate: 0.5, bad: { bomb: 0.18, bug: 0.08 }, wind: 0.5, snail: 0.06, mag: 0.05, time: 95, mk: '🏆' },
];
const FREE = LEVELS.length + 1;
let level = FREE, L = null, got = 0, gotRec = {}, gotA = 0, gotB = 0, windX = 0, windT = 0, magT = 0;
const SEP = 96;   // 🧺🧺 distance between the two baskets
const lvName = n => n === FREE ? '🍎 自由玩' : `${LEVELS[n - 1].mk || '🍎'} ${LEVELS[n - 1].n}`;
const isBub = ch => !!BUB[ch];
let mode = 'timed';
const prog = () => L ? Math.min(1, goalFrac()) * 0.6 : mode === 'timed' ? 1 - left / ROUND : Math.min(0.6, t / 150);
function goalFrac() {
  if (!L) return 0;
  if (L.gt === 'recipe') { let a = 0, b = 0; for (const k in L.rec) { a += Math.min(L.rec[k], gotRec[k] || 0); b += L.rec[k]; } return a / b; }
  if (L.gt === 'sort') return (Math.min(L.g, gotA) + Math.min(L.g, gotB)) / (2 * L.g);
  if (L.gt === 'score') return score / L.g;
  return got / L.g;
}
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;
const rest = MG.barButton('休息一下', () => end('休息一下！'));
rest.el.innerHTML = '休息<span class="bx2">一下</span>';   // narrow phones in 大字模式 show just 休息
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
let B, items, score, combo, hearts, left, spawnT, state = 'ready', pops = [], t = 0, slow = 0;

function reset() {
  groundY();
  B = { x: W / 2, tx: W / 2, wob: 0, face: 'happy', faceT: 0, vx: 0 }; inBasket = []; MG.fx.clear(); shake = 0;
  items = []; pops = []; score = 0; combo = 0; hearts = 3; left = L ? L.time : ROUND; spawnT = 0.4; t = 0; slow = 0;
  got = 0; gotRec = {}; gotA = 0; gotB = 0; windX = 0; windT = 1.5; magT = 0; hud();
}
function hud() { MG.stat('score', L ? `第 ${level} 關` : `${score} 分`); MG.stat('time', mode === 'timed' ? `⏱ ${Math.ceil(left)}` : `🐢 ${mmss(t)}`); }
const bxs = () => L && L.two ? [B.x - SEP / 2, B.x + SEP / 2] : [B.x];   // basket centres

// ---------- input ----------
const keys = { l: false, r: false };
addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = true; });
addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.l = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.r = false; });
let dragging = false;
cv.addEventListener('pointerdown', e => { dragging = true; try { cv.setPointerCapture(e.pointerId); } catch {} B.tx = cv.logical(e).x; });
cv.addEventListener('pointermove', e => { if (dragging || e.pointerType === 'mouse') B.tx = cv.logical(e).x; });
cv.addEventListener('pointerup', () => dragging = false);
cv.addEventListener('pointercancel', () => dragging = false);

// ---------- update ----------
// what is still needed (recipe / only / sort) — the drops lean toward these so every level can be finished
function wanted(ch) {
  if (!L) return true;
  if (L.gt === 'only') return ch === L.ch;
  if (L.gt === 'recipe') return (gotRec[ch] || 0) < (L.rec[ch] || 0);
  if (L.gt === 'sort') return L.A.includes(ch) ? gotA < L.g : L.B.includes(ch) ? gotB < L.g : false;
  return true;
}
function spawnLevel() {
  const pg = prog(), r = Math.random(); let it, acc = 0;
  for (const k in (L.bad || {})) { acc += L.bad[k] * (1 + pg * 0.5); if (r < acc) { it = { kind: 'bad', bad: k, ch: BAD[k], pts: 0 }; break; } }
  if (!it && L.snail && r < (acc += L.snail)) it = { kind: 'snail', ch: '🐌', pts: 0 };
  if (!it && L.mag && r < (acc += L.mag)) it = { kind: 'mag', ch: '🧲', pts: 0 };
  if (!it && !L.snail && L.gt === 'count' && L.it === 'fruit' && r < (acc += 0.05)) it = { kind: 'star', ch: '⭐', pts: 50 };
  if (!it) {
    let ch, pts = 10;
    if (L.gt === 'sort') ch = MG.pick(Math.random() < 0.5 ? L.A : L.B);
    else {
      const need = L.gt === 'only' ? [L.ch] : L.gt === 'recipe' ? Object.keys(L.rec).filter(k => wanted(k)) : [];
      if (need.length && Math.random() < (L.gt === 'only' ? 0.45 : 0.6)) ch = MG.pick(need);
      else { const f = MG.pick(SETS[L.it]); ch = f[0]; pts = f[1]; }
    }
    const f = (SETS[L.it] || SETS.fruit).find(q => q[0] === ch); if (f) pts = f[1];
    it = { kind: L.it === 'bubble' ? 'bubble' : 'fruit', ch, pts };
  }
  const sp = (L.sp || 1) * (H > W ? H / 560 : 1);
  it.x = MG.rand(22, W - 22); it.y = -24; it.vy = (MG.rand(150, 200) + pg * 110) * sp; it.rot = MG.rand(-1, 1); it.spin = MG.rand(-3, 3); it.ph = Math.random() * 7;
  if (it.kind === 'bubble') { it.spin = 0; it.r = MG.rand(15, 19); }
  if (it.bad === 'bug') it.wig = MG.rand(40, 70);
  if (it.bad === 'meteor') { it.vx = (Math.random() < 0.5 ? -1 : 1) * MG.rand(50, 90); it.vy *= 1.15; }
  if (L.it === 'star' && it.kind === 'fruit' && Math.random() < 0.3) it.vx = MG.rand(-70, 70);   // shooting stars
  if (it.kind === 'star') it.vx = MG.rand(-60, 60);
  items.push(it);
}
function spawn() {
  if (L) return spawnLevel();
  const pg = prog();
  const r = Math.random();
  let it;
  if (r < 0.16 + pg * 0.14) it = { kind: 'bomb', ch: '💣', pts: 0 };
  else if (r < 0.22 + pg * 0.14) it = { kind: 'star', ch: '⭐', pts: 50 };
  else if (r < 0.25 + pg * 0.14) it = { kind: 'snail', ch: '🐌', pts: 0 };
  else { const f = MG.pick(FRUITS); it = { kind: 'fruit', ch: f[0], pts: f[1] }; }
  it.x = MG.rand(22, W - 22); it.y = -24; it.vy = (MG.rand(150, 210) + pg * 170) * (H > W ? H / 560 : 1);   // taller field → same fall time
  it.rot = MG.rand(-1, 1); it.spin = MG.rand(-3, 3);
  if (it.kind === 'star') it.vx = MG.rand(-60, 60);
  items.push(it);
}
function botX() {   // test bot: go under the next thing worth catching
  let best = null, bt = 1e9;
  for (const it of items) {
    if (it.done || it.y > GROUND - 8) continue;
    const good = it.kind === 'star' || it.kind === 'mag' || it.kind === 'snail' || ((it.kind === 'fruit' || it.kind === 'bubble') && wanted(it.ch));
    if (!good) continue;
    const tt = (GROUND - 20 - it.y) / Math.max(30, it.vy) + (it.kind === 'star' ? -0.3 : 0);
    if (tt < bt) { bt = tt; best = it; }
  }
  if (!best) return B.x;
  if (L && L.two) { const ia = L.gt === 'sort' ? (L.A.includes(best.ch) ? 0 : 1) : (Math.abs(best.x - (B.x - SEP / 2)) < Math.abs(best.x - (B.x + SEP / 2)) ? 0 : 1); return best.x + (ia ? -SEP / 2 : SEP / 2); }
  return best.x;
}
function update(dt) {
  groundY(); t += dt; left -= dt; slow = Math.max(0, slow - dt); magT = Math.max(0, magT - dt);
  const k = slow ? 0.5 : 1;
  if (keys.l) B.tx = B.x - 400; if (keys.r) B.tx = B.x + 400;
  if (HOOK.auto) B.tx = botX();
  const half = L && L.two ? SEP / 2 + BW / 2 : BW / 2;
  B.tx = Math.max(half, Math.min(W - half, B.tx));
  // 💨 wind changes direction now and then
  if (L && L.wind) { windT -= dt; if (windT <= 0) { windT = MG.rand(4, 7); const nw = (Math.random() < 0.5 ? -1 : 1) * MG.rand(0.5, 1) * L.wind * 70; if (Math.sign(nw) !== Math.sign(windX)) snd('whoosh'); windX = nw; } }
  else windX = 0;
  const nx = B.x + (B.tx - B.x) * Math.min(1, dt * 16);
  const maxStep = 560 * dt, ox = B.x; B.x += Math.max(-maxStep, Math.min(maxStep, nx - B.x)); B.vx = (B.x - ox) / Math.max(dt, 1e-3);
  MG.fx.step(dt); shake = Math.max(0, shake - dt);
  for (const it of items) if (it.kind === 'bomb' && Math.random() < 0.6) MG.fx.burst(it.x + 9, it.y - 15, { n: 1, colors: ['#ffd23f', '#ff7a1c', '#fff'], speed: 40, up: 20, size: 1.6, grav: 60, life: 0.3 });
  for (const it of items) if (it.kind === 'star' && Math.random() < 0.5) MG.fx.burst(it.x, it.y, { n: 1, colors: ['#fff6a0', '#ffd23f'], speed: 20, up: 0, size: 3, grav: 0, life: 0.5, shape: 'star' });
  B.wob *= Math.pow(0.01, dt); B.faceT -= dt; if (B.faceT <= 0) B.face = 'happy';

  spawnT -= dt;
  if (spawnT <= 0) { spawn(); spawnT = L ? (L.rate || 0.72) * MG.rand(0.75, 1.2) * (1 - prog() * 0.3) : Math.max(0.32, 0.8 - prog() * 0.45) * MG.rand(0.7, 1.2); }
  const bx = bxs();
  for (const it of items) {
    it.y += it.vy * dt * k; it.rot += it.spin * dt;
    if (it.vx) { it.x += it.vx * dt * k; if (it.x < 20 || it.x > W - 20) it.vx *= -1; }
    if (it.kind === 'bubble') it.x += Math.sin(t * 2.2 + it.ph) * 30 * dt;          // bubbles wobble as they float down
    if (it.wig) it.x += Math.cos(t * 4 + it.ph) * it.wig * dt;                       // bugs wiggle
    if (windX) it.x += windX * dt * k * (it.kind === 'bubble' ? 1.4 : 1);
    // 🧲 magnet: good things get pulled toward the basket
    if (magT && it.kind !== 'bad' && it.y > GROUND - 300 && it.y < GROUND - 10) { const tx = bx.reduce((a, b) => Math.abs(b - it.x) < Math.abs(a - it.x) ? b : a); it.x += (tx - it.x) * Math.min(1, dt * 3.2); }
    if (it.x < 14) { it.x = 14; if (it.vx) it.vx = Math.abs(it.vx); } else if (it.x > W - 14) { it.x = W - 14; if (it.vx) it.vx = -Math.abs(it.vx); }
    // catch zone: the top of the basket
    if (!it.done && it.y > GROUND - 34 && it.y < GROUND - 6) for (let i = 0; i < bx.length; i++) if (Math.abs(it.x - bx[i]) < BW / 2 + 6) { caught(it, i); break; }
    if (!it.done && it.y > H + 30) { it.done = true; if (it.kind === 'fruit' || it.kind === 'bubble') { if (combo >= 3 && wanted(it.ch)) { snd('miss'); pops.push({ x: Math.max(40, Math.min(W - 40, it.x)), y: GROUND - 20, t: MG.WORDS.miss, c: '#7b8095', life: 0.8 }); } if (wanted(it.ch)) combo = 0; } }
    if (state !== 'play') return;
  }
  items = items.filter(it => !it.done);
  for (const p of pops) { p.y -= 40 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  if (mode === 'timed' && left <= 0) { left = 0; end('時間到！'); }
  hud();
}
function goalDone() {
  if (!L) return false;
  if (L.gt === 'recipe') return Object.keys(L.rec).every(k => (gotRec[k] || 0) >= L.rec[k]);
  if (L.gt === 'sort') return gotA >= L.g && gotB >= L.g;
  if (L.gt === 'score') return score >= L.g;
  return got >= L.g;
}
function caught(it, bi = 0) {
  it.done = true; B.wob = 1;
  if (it.kind === 'mag') { magT = 6; MG.sfx('coin'); snd('sparkle'); MG.fx.burst(it.x, GROUND - 30, { n: 14, colors: ['#ff5a4e', '#c9d1de', '#fff'], speed: 150, size: 4, shape: 'star' }); pops.push({ x: it.x, y: GROUND - 50, t: 'Magnet! 🧲', c: '#d0343a', life: 1 }); return; }
  if (it.kind === 'bad') {   // 💣 / 🐛 / ☄️ in a level
    combo = 0; B.face = 'ouch'; B.faceT = 0.8; MG.sfx('bad'); shake = 0.3;
    MG.fx.burst(it.x, GROUND - 30, { n: 16, colors: it.bad === 'bug' ? ['#7ad36c', '#3cb85a', '#fff'] : ['#555', '#888', '#ff7a1c', '#ffd23f'], speed: 220, up: 80, size: 6, life: 0.6 });
    const word = it.bad === 'bug' ? 'Yuck! 🐛' : it.bad === 'meteor' ? 'Ouch! ☄️' : 'Boom! 💥';
    if (mode === 'relax') { if (L.gt === 'score') score = Math.max(0, score - 20); pops.push({ x: it.x, y: GROUND - 50, t: word, c: '#ff5a4e', life: 0.9 }); return; }
    hearts--; inBasket = []; pops.push({ x: it.x, y: GROUND - 50, t: word, c: '#ff5a4e', life: 0.9 });
    if (hearts <= 0) end(it.bad === 'bug' ? '被小蟲蟲嚇到了…' : '碰到太多次了…');
    return;
  }
  if (L && (it.kind === 'fruit' || it.kind === 'bubble')) {
    // the wrong colour / not on the list / the wrong basket: no harm, it just bounces off
    const ok = L.gt === 'sort' ? (bi === 0 ? L.A : L.B).includes(it.ch) : (L.gt === 'only' ? it.ch === L.ch : true);

    if (it.vx && L && L.it === 'star' && it.kind === 'fruit') { x.strokeStyle = 'rgba(255,240,170,.5)'; x.lineWidth = 3; x.beginPath(); x.moveTo(it.x, it.y); x.lineTo(it.x - it.vx * 0.25, it.y - it.vy * 0.15); x.stroke(); }
  }
  // 噗噗 with a basket
  const bx = B.x, by = GROUND - 6, w = Math.sin(t * 30) * B.wob * 3, lean = Math.max(-1, Math.min(1, B.vx / 400));
  const BX = bxs();
  if (magT) { x.strokeStyle = `rgba(255,90,78,${0.25 + 0.15 * Math.sin(t * 10)})`; x.lineWidth = 2; for (const cx of BX) for (let k = 1; k <= 3; k++) { x.beginPath(); x.arc(cx, by - 26, 20 + k * 18 + (t * 40) % 18, Math.PI * 1.15, Math.PI * 1.85); x.stroke(); } }
  for (const cx of BX) { x.fillStyle = 'rgba(20,60,20,.25)'; x.beginPath(); x.ellipse(cx, GROUND + 4, BW / 2 + 6, 5, 0, 0, 7); x.fill(); }
  if (BX.length > 1) {   // 🧺🧺 噗噗 in the middle holding two baskets
    MG.puPu(x, bx - lean * 3, by - 22, 17, B.face, B.wob * 0.15, { look: lean, arms: 'up' });
    x.strokeStyle = '#8a5a22'; x.lineWidth = 3; x.beginPath(); x.moveTo(BX[0] + w, by - 26); x.lineTo(bx - 14, by - 28); x.moveTo(BX[1] + w, by - 26); x.lineTo(bx + 14, by - 28); x.stroke();
    BX.forEach((cx, i) => { basket(cx, by, w, i); if (L.gt === 'sort') { const ic = (i ? L.B : L.A)[0]; x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, by - 8, 11, 0, 7); x.fill(); x.strokeStyle = i ? '#e8a400' : '#d0343a'; x.lineWidth = 2.5; x.stroke(); x.fillStyle = '#000'; x.font = `15px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ic, cx, by - 7); } });
  } else {
    MG.puPu(x, bx - lean * 3, by - 36, 15, B.face, B.wob * 0.15, { look: lean, arms: 'up' });
    basket(bx, by, w);
  }
  if (magT) { x.fillStyle = '#000'; x.font = `20px ${EMOJI}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('🧲', bx + (BX.length > 1 ? 0 : 26), by - (BX.length > 1 ? 52 : 60)); }
  MG.fx.draw(x);
  // pops
  for (const p of pops) {
    const k = Math.min(1, p.life * 2); x.globalAlpha = k; x.font = `900 ${Math.round(19 * TS())}px system-ui,"Noto Sans TC",sans-serif`;
    x.lineWidth = MG.big ? 5 : 4; x.strokeStyle = '#fff'; x.strokeText(p.t, p.x, p.y); x.fillStyle = p.c; x.fillText(p.t, p.x, p.y);
  }
  x.globalAlpha = 1;
  // HUD: hearts, time bar, combo
  // (大字模式: everything in the HUD is 1.3× and the pills are more opaque)
  const ts = TS(), ph = Math.round(28 * ts), pa = MG.big ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.75)';
  x.textAlign = 'left'; x.font = `${Math.round(19 * ts)}px ${EMOJI}`;
  x.fillStyle = pa; x.beginPath(); x.roundRect(6, 8, Math.round(88 * ts), ph, ph / 2); x.fill(); x.fillStyle = '#000';
  if (MG.big) { x.strokeStyle = '#7a5a3a'; x.lineWidth = 2; x.stroke(); }
  if (mode === 'timed') for (let i = 0; i < 3; i++) x.fillText(i < hearts ? '❤️' : '🤍', 6 + 7 * ts + i * 26 * ts, 8 + ph / 2 + 1); else { x.fillStyle = '#1d3a1d'; x.font = `700 ${Math.round(15 * ts)}px "Noto Sans TC",system-ui,${EMOJI}`; x.fillText('🐢 慢慢玩', 12, 8 + ph / 2 + 1); }
  const tw = Math.min(160, W * 0.3), tx = W / 2 - tw / 2, bh = Math.round(10 * ts);
  x.fillStyle = pa; x.beginPath(); x.roundRect(tx - 4, 8 + ph / 2 - bh / 2 - 3, tw + 8, bh + 6, (bh + 6) / 2); x.fill();
  const frac = mode === 'timed' ? left / (L ? L.time : ROUND) : L ? Math.min(1, goalFrac()) : 1; x.fillStyle = frac < 0.2 ? '#ff5a4e' : '#4cc96a'; x.beginPath(); x.roundRect(tx, 8 + ph / 2 - bh / 2, Math.max(6, tw * frac), bh, bh / 2); x.fill();
  if (slow) { x.textAlign = 'center'; x.fillStyle = '#000'; x.font = `${Math.round(16 * ts)}px ${EMOJI}`; x.fillText('🐌', tx + tw + 18 * ts, 8 + ph / 2); }
  if (L) goalPill(8 + ph + 6, ts, pa);
  if (combo >= 3) {
    // narrow portrait: the combo goes under the hearts so it never runs into the time bar
    const under = W < 520, cy = under ? 8 + ph + 16 * ts + (L ? ph + 8 : 0) : 8 + ph / 2 + 1;
    x.textAlign = under ? 'left' : 'right'; x.font = `900 ${Math.round(17 * ts)}px system-ui,"Noto Sans TC",sans-serif`; x.lineWidth = MG.big ? 5 : 4; x.strokeStyle = '#fff';
    const txt = `Combo ${combo} 🔥${combo >= 15 ? ' ×3' : combo >= 6 ? ' ×2' : ''}`, cxp = under ? 8 : W - 10; x.strokeText(txt, cxp, cy); x.fillStyle = MG.big ? '#c84f00' : '#ff7a00'; x.fillText(txt, cxp, cy);
  }
  x.restore();
}

// ---------- flow ----------
const NEWS = {
  count: ['🎯 過關目標', '每一關上面都有 <b>目標</b>，接到上面寫的數量就過關！'],
  only: ['🎯 只接一種', '這一關<b>只要接上面那一種</b>！其他的接到也沒關係，只是不算數（它們會變得淡淡的）。'],
  recipe: ['📝 食譜任務', '照著上面的食譜，把<b>每一種都接夠</b>，接夠的會打勾 ✅！'],
  sort: ['🧺 紅黃分類', '噗噗拿著兩個籃子，<b>籃子上有圖案</b>。要用對的籃子接：左邊接紅色的、右邊接黃色的！'],
  two: ['🧺🧺 兩個籃子', '噗噗一次拿兩個籃子，左右兩邊都接得到，可以接得更多！'],
  bug: ['🐛 小蟲蟲', '小蟲蟲會扭來扭去地掉下來，不要接到牠喔！'],
  meteor: ['☄️ 流星', '流星會斜斜地飛下來，躲開它們！'],
  bubble: ['🫧 泡泡雨', '泡泡會慢慢飄下來、左右晃，接到會「啵」一聲破掉！'],
  star: ['⭐ 星星夜', '晚上的天空會掉下星星和月亮，有些流星會斜斜地飛喔！'],
  snail: ['🐌 慢動作', '接到蝸牛，所有東西都會<b>變慢</b>一下子，比較好接！'],
  wind: ['💨 起風了', '風會把東西吹歪，風向還會變！看白色的風線，往旁邊多走一點。'],
  mag: ['🧲 吸鐵石', '接到吸鐵石，好東西會被<b>吸到籃子裡</b>，持續一下子！'],
};
function intro() {
  const ks = [L.gt === 'score' ? '' : L.gt, L.two && L.gt !== 'sort' ? 'two' : '', ...Object.keys(L.bad || {}), L.it === 'bubble' || L.it === 'star' ? L.it : '', L.snail ? 'snail' : '', L.wind ? 'wind' : '', L.mag ? 'mag' : '']
    .filter(k => NEWS[k] && !MG.store.get('catch.seen.' + k, false));
  if (!ks.length) return false;
  ks.forEach(k => MG.store.set('catch.seen.' + k, true));
  MG.panel({ title: ks.map(k => NEWS[k][0]).join('＋'), html: ks.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  return true;
}
function goalWords(Lv) {
  if (Lv.gt === 'recipe') return Object.keys(Lv.rec).map(k => `${k}×${Lv.rec[k]}`).join(' ');
  if (Lv.gt === 'sort') return `${Lv.A.join('')} ↔ ${Lv.B.join('')} 各 ${Lv.g} 個`;
  if (Lv.gt === 'only') return `只接 ${isBub(Lv.ch) ? '藍色泡泡' : Lv.ch} ×${Lv.g}`;
  if (Lv.gt === 'score') return `${Lv.g} 分`;
  return `接 ${Lv.g} 個`;
}
function start(m) { if (m) mode = m; startLevel(level); }
function startLevel(n) {
  level = n; L = n === FREE ? null : LEVELS[n - 1]; bgKey = '';
  reset(); state = 'play'; MG.hide(); rest.show(!L && mode === 'relax');
  if (L) { B.x = B.tx = W / 2; if (!intro()) MG.toast(`第 ${n} 關　${goalWords(L)}`, 1800); }
}
function win() {
  if (state !== 'play') return;
  state = 'won'; rest.show(false); MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250); B.face = 'happy';
  pops.push({ x: W / 2, y: GROUND - 130, t: MG.WORDS.clear, c: '#ff7a00', life: 1.4 });
  MG.fx.burst(B.x, GROUND - 60, { n: 40, colors: ['#ffd23f', '#ff8ac2', '#6fd3ff', '#9be36a', '#fff'], speed: 280, up: 200, size: 6, shape: 'star', life: 1 });
  const cl = MG.store.get('catch.cleared', {}); cl[level] = Math.max(cl[level] || 0, score); MG.store.set('catch.cleared', cl);
  const nx = level < LEVELS.length ? level + 1 : FREE, done = level; MG.store.set('catch.pickLevel', nx);
  setTimeout(() => state === 'won' && level === done && MG.panel({
    title: `第 ${done} 關完成！`,
    html: `<div class="big">${score} 分</div><p>${mode === 'timed' ? `還剩 ${Math.ceil(left)} 秒` : `用了 ${mmss(t)}`}</p><p>${nx === FREE ? '全部過關了！可以去 🍎 自由玩拿高分 ^_^' : `下一關：${lvName(nx)}（${goalWords(LEVELS[nx - 1])}）`}</p>`,
    buttons: [{ label: nx === FREE ? '🍎 自由玩' : '下一關', on: () => startLevel(nx) }, { label: '再玩一次', alt: true, on: () => startLevel(done) }, { label: '選關卡', alt: true, on: menu }],
  }), 900);
}
function end(msg) {
  if (state !== 'play') return;
  state = 'over'; rest.show(false);
  if (L) {   // a level that ran out of time or hearts
    MG.sfx('over');
    return MG.panel({
      title: msg,
      html: `<p>目標：${goalWords(L)}</p><p>再試一次！覺得太難可以選 🐢 慢慢玩，不限時間也不會輸。</p>`,
      buttons: [{ label: '再試一次', on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],
    });
  }
  MG.sfx(hearts > 0 ? 'win' : 'over'); if (hearts > 0 && score > 0) MG.sfx('yay');
  const rec = mode === 'timed' ? MG.record('catch', score) : null;
  MG.panel({
    title: msg,
    html: `<p>這次得到</p><div class="big">${score} 分</div>` + (rec ? (rec.isNew && score > 0 ? `<p class="new">新紀錄！^_^</p>` : `<p>最高紀錄：${rec.best} 分</p>`) : `<p>玩了 ${mmss(t)}</p>`),
    buttons: [{ label: '再玩一次', on: () => startLevel(FREE) }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; rest.show(false);
  MG.choose({
    id: 'catch', title: '水果接接樂',
    html: `<p>幫噗噗用籃子接住掉下來的東西！每一關有不同的 🎯 目標：🍎 只接一種、📝 食譜、🧺 兩個籃子、🫧 泡泡、⭐ 星星、🐛 小蟲蟲、💨 大風、🧲 吸鐵石…最後一格是 🍎 自由玩。</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・不會輸' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '有時間限制・💣 碰到三次就結束' }],
    levels: { count: FREE, max: FREE, label: n => n === FREE ? `🍎 自由玩（最高 ${MG.best('catch') ?? 0} 分）` : `${n}（${lvName(n)}：${goalWords(LEVELS[n - 1])}）`,
      short: n => n === FREE ? '🍎' : `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '電腦：<kbd>←</kbd><kbd>→</kbd> 或滑鼠　手機：手指在畫面上左右拖　自由玩的慢慢玩按上面的「休息一下」結束',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
reset(); menu();
// test hook
const HOOK = window.CTC = { auto: false, fast: 1, start(n, m = 'relax') { mode = m; startLevel(n); }, get state() { return state; }, get level() { return level; }, get score() { return score; }, get got() { return got; },
  get count() { return FREE; }, levels: LEVELS, goal: () => goalFrac(), menu: () => menu() };
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) { for (let i = 0; i < ((HOOK.fast | 0) || 1) && state === 'play'; i++) update(dt); }
  else { t += dt; MG.fx.step(dt); for (const p of pops) { p.y -= 40 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0); }
  draw();
});
</script>
