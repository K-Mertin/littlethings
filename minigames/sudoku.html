<script>
'use strict';
MG.init({ id: 'sudoku', title: '圖案數獨', stats: ['level', 'info'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';

// ---------- levels (append-only) ----------
// t: warm = 🔍 find the missing one (each shelf on its own) · row1 = only one missing per row · std = picture sudoku
//    color = 🎨 same shape, only the colour differs · shadow = 👤 the clues are shadows · jig = 🧩 jigsaw rooms
// n: 3 (rows + columns), 4 (2×2 rooms), 6 (2×3 rooms) · set: fruit / animal / color / shape / number · blanks: empty cells to fill
const LEVELS = [
  { t: 'warm', n: 3, set: 'fruit' },
  { t: 'row1', n: 3, set: 'fruit' },
  { t: 'std', n: 3, set: 'animal', blanks: 3 },
  { t: 'color', n: 3, set: 'color', blanks: 4 },
  { t: 'std', n: 3, set: 'shape', blanks: 5 },
  { t: 'warm', n: 4, set: 'animal' },
  { t: 'row1', n: 4, set: 'fruit' },
  { t: 'std', n: 4, set: 'animal', blanks: 6 },
  { t: 'shadow', n: 4, set: 'fruit', blanks: 6 },
  { t: 'color', n: 4, set: 'color', blanks: 7 },
  { t: 'jig', n: 4, set: 'shape', blanks: 6 },
  { t: 'std', n: 4, set: 'number', blanks: 8 },
  { t: 'shadow', n: 4, set: 'animal', blanks: 9 },
  { t: 'jig', n: 4, set: 'fruit', blanks: 9 },
  { t: 'color', n: 4, set: 'color', blanks: 10 },
  { t: 'warm', n: 6, set: 'number' },
  { t: 'row1', n: 6, set: 'animal' },
  { t: 'std', n: 6, set: 'fruit', blanks: 10 },
  { t: 'jig', n: 4, set: 'animal', blanks: 11 },
  { t: 'shadow', n: 6, set: 'shape', blanks: 12 },
  { t: 'color', n: 6, set: 'color', blanks: 14 },
  { t: 'std', n: 6, set: 'number', blanks: 16 },
  { t: 'jig', n: 6, set: 'fruit', blanks: 12 },
  { t: 'std', n: 6, set: 'animal', blanks: 20 },
];
const TYPE = { warm: ['🔍', '找找少了誰'], row1: ['☝️', '每排少一個'], std: ['▦', '圖案數獨'], color: ['🎨', '只看顏色'], shadow: ['👤', '影子關'], jig: ['🧩', '拼圖房間'] };
const SETS = { fruit: ['🍎', '水果'], animal: ['🐱', '動物'], color: ['🎨', '顏色'], shape: ['⭐', '形狀'], number: ['🔢', '數字'] };
const MARK = { warm: '🔍', row1: '☝️', std: '', color: '🎨', shadow: '👤', jig: '🧩' };
const lvName = n => { const L = LEVELS[n - 1]; return `${TYPE[L.t][1]}・${L.t === 'warm' ? `${L.n} 個` : `${L.n}×${L.n}`}・${SETS[L.set][0]}${SETS[L.set][1]}`; };

// ---------- puzzle engine ----------
// a puzzle: rows × cols cells, n symbols, groups = lists of cells that must hold every symbol once
function boxGroups(n) {
  const [bh, bw] = n === 4 ? [2, 2] : n === 6 ? [2, 3] : [0, 0]; if (!bh) return [];
  const out = [];
  for (let br = 0; br < n / bh; br++) for (let bc = 0; bc < n / bw; bc++) { const g = []; for (let r = 0; r < bh; r++) for (let c = 0; c < bw; c++) g.push((br * bh + r) * n + bc * bw + c); out.push(g); }
  return out;
}
// jigsaw rooms: grow n blobby, connected rooms of n cells; never a plain row / column / box
function jigRooms(n) {
  for (let tries = 0; tries < 4000; tries++) {
    const own = new Array(n * n).fill(-1);
    const nb = i => { const r = (i / n) | 0, c = i % n, o = []; if (r) o.push(i - n); if (r < n - 1) o.push(i + n); if (c) o.push(i - 1); if (c < n - 1) o.push(i + 1); return o; };
    let ok = true;
    for (let g = 0; g < n && ok; g++) {
      const free = own.map((v, i) => v < 0 ? i : -1).filter(i => i >= 0);
      // start in the most cornered free cell so no pockets are left behind
      let best = 1e9, seeds = [];
      for (const i of free) { const f = nb(i).filter(j => own[j] < 0).length; if (f < best) { best = f; seeds = [i]; } else if (f === best) seeds.push(i); }
      const room = [MG.pick(seeds)]; own[room[0]] = g;
      while (room.length < n) {
        const front = [...new Set(room.flatMap(nb))].filter(j => own[j] < 0);
        if (!front.length) { ok = false; break; }
        const sc = j => nb(j).filter(k => own[k] === g).length * 2 - nb(j).filter(k => own[k] < 0).length * 0.6 + Math.random() * 1.6;
        front.sort((a, b) => sc(b) - sc(a)); own[front[0]] = g; room.push(front[0]);
      }
      if (!ok) break;
      // what is left must split into pieces of exactly n cells
      const seen = new Set();
      for (const i of own.keys()) {
        if (own[i] >= 0 || seen.has(i)) continue;
        let cnt = 0; const st = [i]; seen.add(i);
        while (st.length) { const q = st.pop(); cnt++; for (const j of nb(q)) if (own[j] < 0 && !seen.has(j)) { seen.add(j); st.push(j); } }
        if (cnt % n) { ok = false; break; }
      }
    }
    if (!ok) continue;
    const rooms = Array.from({ length: n }, (_, g) => own.map((v, i) => v === g ? i : -1).filter(i => i >= 0));
    const straight = rooms.some(rm => rm.every(i => ((i / n) | 0) === ((rm[0] / n) | 0)) || rm.every(i => i % n === rm[0] % n));
    if (straight) continue;
    const boxes = boxGroups(n).map(b => b.join(','));
    if (rooms.filter(rm => boxes.includes(rm.slice().sort((a, b) => a - b).join(','))).length >= n - 1) continue;
    if (!fillSolution(n, n * n, groupsFor(n, n, false).concat(rooms))) continue;
    return rooms;
  }
  return boxGroups(n);
}
function groupsFor(rows, cols, rowsOnly) {
  const g = [];
  for (let r = 0; r < rows; r++) g.push(Array.from({ length: cols }, (_, c) => r * cols + c));
  if (!rowsOnly) for (let c = 0; c < cols; c++) g.push(Array.from({ length: rows }, (_, r) => r * cols + c));
  return g;
}
const peersOf = (cells, groups) => { const P = Array.from({ length: cells }, () => new Set()); for (const g of groups) for (const a of g) for (const b of g) if (a !== b) P[a].add(b); return P.map(s => [...s]); };
// random full solution (backtracking, most-constrained cell first)
function fillSolution(n, cells, groups) {
  const P = peersOf(cells, groups), v = new Array(cells).fill(-1);
  const rec = () => {
    let bi = -1, bc = null;
    for (let i = 0; i < cells; i++) {
      if (v[i] >= 0) continue;
      const c = []; for (let k = 0; k < n; k++) if (!P[i].some(j => v[j] === k)) c.push(k);
      if (!c.length) return false;
      if (!bc || c.length < bc.length) { bi = i; bc = c; }
    }
    if (bi < 0) return true;
    for (const k of MG.shuffle(bc)) { v[bi] = k; if (rec()) return true; }
    v[bi] = -1; return false;
  };
  return rec() ? v : null;
}
// how many ways can the grid be finished (stops at limit)
function countSolutions(n, grid, groups, limit = 2) {
  const cells = grid.length, P = peersOf(cells, groups), v = grid.slice(); let found = 0;
  const rec = () => {
    let bi = -1, bc = null;
    for (let i = 0; i < cells; i++) {
      if (v[i] >= 0) continue;
      const c = []; for (let k = 0; k < n; k++) if (!P[i].some(j => v[j] === k)) c.push(k);
      if (!c.length) return;
      if (!bc || c.length < bc.length) { bi = i; bc = c; }
    }
    if (bi < 0) { found++; return; }
    for (const k of bc) { v[bi] = k; rec(); if (found >= limit) break; }
    v[bi] = -1;
  };
  rec(); return found;
}
function makePuzzle(L) {
  const n = L.n, warm = L.t === 'warm', rows = warm ? 3 : n, cols = n, cells = rows * cols;
  let rooms = [];
  if (!warm) rooms = L.t === 'jig' ? jigRooms(n) : boxGroups(n);
  const groups = groupsFor(rows, cols, warm).concat(rooms);
  let sol = null;
  if (warm) {   // three shelves, each a different order, no column rule
    sol = [];
    let prev = null;
    for (let r = 0; r < rows; r++) { let row; do { row = MG.shuffle([...Array(n).keys()]); } while (prev && row.join() === prev.join()); prev = row; sol.push(...row); }
  } else sol = fillSolution(n, cells, groups);
  const given = sol.slice();
  if (warm || L.t === 'row1') {   // exactly one gap per shelf / row, each gap a different picture when possible
    const missing = MG.shuffle([...Array(n).keys()]);
    for (let r = 0; r < rows; r++) {
      const want = missing[r % n];
      let c = (L.t === 'row1') ? null : sol.slice(r * cols, r * cols + cols).indexOf(want);
      if (c == null) { const used = new Set(); for (let rr = 0; rr < r; rr++) used.add(given.slice(rr * cols, rr * cols + cols).indexOf(-1)); const opts = [...Array(cols).keys()].filter(q => !used.has(q)); c = MG.pick(opts.length ? opts : [...Array(cols).keys()]); }
      given[r * cols + c] = -1;
    }
  } else {
    const want = Math.min(L.blanks, cells - n);
    let blanks = 0;
    for (const i of MG.shuffle([...Array(cells).keys()])) {
      if (blanks >= want) break;
      const keep = given[i]; given[i] = -1;
      if (countSolutions(n, given, groups, 2) === 1) blanks++; else given[i] = keep;
    }
  }
  return { n, rows, cols, cells, rooms, groups, sol, given, set: L.set, t: L.t };
}

// ---------- symbols (drawn in code, cached as sprites) ----------
const SYM_COL = {   // [light, mid, dark, outline] — the colour the hint glow / sparkles use
  fruit: [['#ff8a7a', '#e8392f', '#b8201a', '#8e1c16'], ['#fff3a0', '#ffd93a', '#e8b000', '#a87400'], ['#d8b8ff', '#9a62e8', '#6a3cc0', '#45237f'], ['#ffd29a', '#ff9a2e', '#e0701c', '#a04510'], ['#effaa0', '#a8d84a', '#74a820', '#4f7a10'], ['#ffb0c0', '#f2506a', '#c8203e', '#8e1530']],
  animal: [['#ffd9a0', '#ffa24a', '#e0701c', '#a04510'], ['#ffe0ea', '#ff9cbc', '#e8709a', '#a83a66'], ['#d0f8b0', '#5ccf5a', '#2f9a3a', '#1f6e35'], ['#fff8b8', '#ffd93a', '#e8a800', '#a87400'], ['#ffffff', '#eef0ff', '#c9cdee', '#6a6fa8'], ['#ecc69a', '#b88250', '#87542a', '#5a3418']],
  color: [['#ffb3a8', '#f2463a', '#c8261c', '#8e1810'], ['#b8e0ff', '#3d8bff', '#1f5fd0', '#143f94'], ['#fff6a0', '#ffd31a', '#e8a800', '#a07000'], ['#b8f5b8', '#3cc85a', '#1f9a3a', '#156a28'], ['#e4c8ff', '#9b5cff', '#6d34d6', '#47208f'], ['#ffd6a8', '#ff8c1a', '#e06a00', '#a04800']],
  shape: [['#ffb0a8', '#f2564a', '#d03a30', '#8e2018'], ['#b8dcff', '#4c9cf0', '#2f78cf', '#1d4f9e'], ['#fff3a0', '#ffd23a', '#e8a400', '#a87400'], ['#ffd9a8', '#ff9a3a', '#e06a1c', '#a04510'], ['#ffd0e4', '#ff7eb6', '#e0508e', '#9a2f5d'], ['#c0f5d8', '#3fd29a', '#22ad74', '#147a4e']],
  number: [['#ffb0a8', '#f2564a', '#d03a30', '#8e2018'], ['#ffd9a8', '#ff9a3a', '#e06a1c', '#a04510'], ['#fff3a0', '#ffd23a', '#e8a400', '#a87400'], ['#c0f5c8', '#4cc96a', '#2a9447', '#1f6e35'], ['#b8dcff', '#4c9cf0', '#2f78cf', '#1d4f9e'], ['#e4ccff', '#a77cf2', '#7a52d0', '#4f2f9a']],
};
function grad(g, r, P, cx = -0.35, cy = -0.4) { const q = g.createRadialGradient(r * cx, r * cy, r * 0.05, 0, 0, r * 1.05); q.addColorStop(0, P[0]); q.addColorStop(0.5, P[1]); q.addColorStop(1, P[2]); return q; }
function shine(g, r, ax = -0.38, ay = -0.36, a = 0.7) { g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.ellipse(r * ax, r * ay, r * 0.17, r * 0.09, -0.7, 0, 7); g.fill(); g.beginPath(); g.arc(r * (ax + 0.2), r * (ay - 0.12), r * 0.04, 0, 7); g.fill(); }
function face(g, r, y = 0, ink = '#2a1c18', sp = 0.3, sz = 1) {
  g.fillStyle = ink;
  for (const sd of [-1, 1]) { g.beginPath(); g.ellipse(sd * r * sp, y, r * 0.075 * sz, r * 0.105 * sz, 0, 0, 7); g.fill(); }
  g.fillStyle = '#fff'; for (const sd of [-1, 1]) { g.beginPath(); g.arc(sd * r * sp - r * 0.025, y - r * 0.04, r * 0.03 * sz, 0, 7); g.fill(); }
  g.fillStyle = 'rgba(255,110,140,.45)'; for (const sd of [-1, 1]) { g.beginPath(); g.ellipse(sd * r * (sp + 0.2), y + r * 0.15, r * 0.1, r * 0.06, 0, 0, 7); g.fill(); }
  g.strokeStyle = ink; g.lineWidth = Math.max(1, r * 0.055); g.beginPath(); g.arc(0, y + r * 0.08, r * 0.1, 0.35, Math.PI - 0.35); g.stroke();
}
function leaf(g, x0, y0, r, rot, c1 = '#7fd85a', c2 = '#3a9a2a') { g.save(); g.translate(x0, y0); g.rotate(rot); g.fillStyle = c1; g.strokeStyle = c2; g.lineWidth = r * 0.06; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(r * 0.2, -r * 0.18, r * 0.42, 0); g.quadraticCurveTo(r * 0.2, r * 0.18, 0, 0); g.fill(); g.stroke(); g.beginPath(); g.moveTo(r * 0.04, 0); g.lineTo(r * 0.34, 0); g.stroke(); g.restore(); }
function drawSym(g, set, k, r) {
  const P = SYM_COL[set][k], lw = Math.max(1.2, r * 0.075);
  g.lineJoin = 'round'; g.lineCap = 'round';
  const fin = path => { g.fillStyle = grad(g, r, P); path(); g.fill(); g.strokeStyle = P[3]; g.lineWidth = lw; path(); g.stroke(); };
  if (set === 'fruit') {
    if (k === 0) {   // apple
      g.strokeStyle = '#7a4a1a'; g.lineWidth = lw * 1.1; g.beginPath(); g.moveTo(0, -r * 0.5); g.quadraticCurveTo(r * 0.02, -r * 0.78, r * 0.12, -r * 0.9); g.stroke();
      fin(() => { g.beginPath(); g.moveTo(0, -r * 0.5); g.bezierCurveTo(-r * 0.35, -r * 0.82, -r * 0.95, -r * 0.62, -r * 0.86, -r * 0.05); g.bezierCurveTo(-r * 0.8, r * 0.55, -r * 0.38, r * 0.92, 0, r * 0.74); g.bezierCurveTo(r * 0.38, r * 0.92, r * 0.8, r * 0.55, r * 0.86, -r * 0.05); g.bezierCurveTo(r * 0.95, -r * 0.62, r * 0.35, -r * 0.82, 0, -r * 0.5); g.closePath(); });
      leaf(g, r * 0.1, -r * 0.72, r * 1.1, -0.5); shine(g, r, -0.45, -0.2);
    } else if (k === 1) {   // banana
      fin(() => { g.beginPath(); g.moveTo(-r * 0.62, -r * 0.7); g.bezierCurveTo(-r * 1.0, r * 0.25, -r * 0.15, r * 0.95, r * 0.88, r * 0.38); g.bezierCurveTo(r * 0.2, r * 0.48, -r * 0.42, r * 0.12, -r * 0.4, -r * 0.72); g.closePath(); });
      g.strokeStyle = 'rgba(200,140,0,.55)'; g.lineWidth = lw * 0.8; g.beginPath(); g.moveTo(-r * 0.52, -r * 0.45); g.bezierCurveTo(-r * 0.6, r * 0.2, -r * 0.05, r * 0.6, r * 0.6, r * 0.45); g.stroke();
      g.fillStyle = '#6b4a1a'; g.beginPath(); g.roundRect(-r * 0.6, -r * 0.86, r * 0.2, r * 0.2, r * 0.05); g.fill(); g.beginPath(); g.arc(r * 0.86, r * 0.39, r * 0.06, 0, 7); g.fill();
      shine(g, r, -0.62, -0.05, 0.65);
    } else if (k === 2) {   // grapes
      g.strokeStyle = '#7a4a1a'; g.lineWidth = lw * 1.1; g.beginPath(); g.moveTo(0, -r * 0.58); g.lineTo(r * 0.06, -r * 0.88); g.stroke();
      leaf(g, r * 0.04, -r * 0.7, r * 1.1, -0.35);
      const B = [[-0.42, -0.38], [0, -0.42], [0.42, -0.38], [-0.22, 0.0], [0.22, 0.0], [-0.42, 0.0], [0.42, 0.0], [0, 0.38], [-0.22, 0.36], [0.22, 0.36], [0, 0.7]];
      for (const [bx, by] of [[-0.42, -0.36], [0, -0.42], [0.42, -0.36], [-0.21, 0.0], [0.21, 0.0], [-0.21, 0.36], [0.21, 0.36], [0, 0.68]]) {
        g.save(); g.translate(bx * r, by * r); const rr = r * 0.27; g.fillStyle = grad(g, rr, P); g.beginPath(); g.arc(0, 0, rr, 0, 7); g.fill(); g.strokeStyle = P[3]; g.lineWidth = lw * 0.8; g.stroke();
        g.fillStyle = 'rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(-rr * 0.35, -rr * 0.35, rr * 0.25, rr * 0.15, -0.7, 0, 7); g.fill(); g.restore();
      }
      void B;
    } else if (k === 3) {   // orange
      fin(() => { g.beginPath(); g.arc(0, r * 0.08, r * 0.8, 0, 7); });
      g.fillStyle = 'rgba(160,70,10,.25)'; for (const [a, b] of [[0.3, 0.2], [-0.2, 0.45], [0.45, -0.25], [-0.45, 0.05], [0.1, 0.55], [-0.1, -0.2]]) { g.beginPath(); g.arc(a * r, b * r, r * 0.035, 0, 7); g.fill(); }
      g.fillStyle = '#5a8a20'; g.beginPath(); g.arc(0, -r * 0.7, r * 0.07, 0, 7); g.fill();
      leaf(g, r * 0.02, -r * 0.72, r * 1.05, -0.4); shine(g, r, -0.4, -0.25);
    } else if (k === 4) {   // pear
      g.strokeStyle = '#7a4a1a'; g.lineWidth = lw * 1.1; g.beginPath(); g.moveTo(0, -r * 0.66); g.quadraticCurveTo(-r * 0.02, -r * 0.84, r * 0.08, -r * 0.94); g.stroke();
      fin(() => { g.beginPath(); g.moveTo(0, -r * 0.7); g.bezierCurveTo(-r * 0.32, -r * 0.7, -r * 0.3, -r * 0.2, -r * 0.55, r * 0.12); g.bezierCurveTo(-r * 0.9, r * 0.55, -r * 0.5, r * 0.92, 0, r * 0.9); g.bezierCurveTo(r * 0.5, r * 0.92, r * 0.9, r * 0.55, r * 0.55, r * 0.12); g.bezierCurveTo(r * 0.3, -r * 0.2, r * 0.32, -r * 0.7, 0, -r * 0.7); g.closePath(); });
      leaf(g, r * 0.06, -r * 0.8, r * 1.0, -0.6); shine(g, r, -0.38, 0.2, 0.65);
      g.fillStyle = 'rgba(255,140,80,.3)'; g.beginPath(); g.ellipse(r * 0.35, r * 0.45, r * 0.18, r * 0.12, 0.3, 0, 7); g.fill();
    } else {   // strawberry
      fin(() => { g.beginPath(); g.moveTo(0, r * 0.9); g.bezierCurveTo(-r * 0.55, r * 0.6, -r * 0.95, -r * 0.05, -r * 0.65, -r * 0.42); g.bezierCurveTo(-r * 0.35, -r * 0.66, r * 0.35, -r * 0.66, r * 0.65, -r * 0.42); g.bezierCurveTo(r * 0.95, -r * 0.05, r * 0.55, r * 0.6, 0, r * 0.9); g.closePath(); });
      g.fillStyle = '#fff2a0'; for (const [a, b] of [[-0.4, -0.15], [0, -0.2], [0.4, -0.15], [-0.25, 0.15], [0.25, 0.15], [-0.45, 0.2], [0.45, 0.2], [0, 0.42], [-0.18, 0.6], [0.18, 0.6], [0, 0.12]]) { if (Math.abs(a) > 0.42 && b > 0.1) continue; g.beginPath(); g.ellipse(a * r, b * r, r * 0.035, r * 0.055, 0, 0, 7); g.fill(); }
      g.fillStyle = '#4cc04a'; g.strokeStyle = '#2a7a2a'; g.lineWidth = lw * 0.8;
      g.beginPath(); for (let i = 0; i < 10; i++) { const a = Math.PI + i * Math.PI / 9, rr = i % 2 ? r * 0.18 : r * 0.42; g.lineTo(Math.cos(a) * rr, -r * 0.52 + Math.sin(a) * rr * 0.6); } g.closePath(); g.fill(); g.stroke();
      g.strokeStyle = '#2a7a2a'; g.lineWidth = lw; g.beginPath(); g.moveTo(0, -r * 0.6); g.lineTo(r * 0.04, -r * 0.86); g.stroke();
      shine(g, r, -0.42, -0.2, 0.55);
    }
  } else if (set === 'animal') {

    if (i >= 0 && P.given[i] < 0) { cur[d.from] = -1; place(i, d.k, 'drag'); }
    else if (i < 0) place(d.from, -1);
    hud(); return;
  }
  if (i >= 0) place(i, d.k, 'drag');
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', e => { if (drag && drag.id === e.pointerId) drag = null; });
addEventListener('keydown', e => {
  if (state !== 'play' || MG.panelOpen()) return;
  const mv = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
  if (mv) { e.preventDefault(); if (sel < 0) sel = cur.findIndex(v => v < 0); else { const r = Math.max(0, Math.min(P.rows - 1, ((sel / P.cols) | 0) + mv[0])), c = Math.max(0, Math.min(P.cols - 1, sel % P.cols + mv[1])); sel = r * P.cols + c; } MG.sfx('tick'); return; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= P.n && sel >= 0) { place(sel, n - 1); return; }
  if ((e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') && sel >= 0) { place(sel, -1); return; }
  if (e.key === 'h' || e.key === 'H') hint();
});

// ---------- drawing ----------
function drawButton(b) {
  const lit = b.id === 'hint';
  x.fillStyle = 'rgba(90,50,20,.18)'; x.beginPath(); x.roundRect(b.x + 2, b.y + 4, b.w, b.h, 16); x.fill();
  const gg = x.createLinearGradient(0, b.y, 0, b.y + b.h); gg.addColorStop(0, lit ? '#ffe680' : '#fffaf0'); gg.addColorStop(1, lit ? '#ffc93a' : '#f3e2c2');
  x.fillStyle = gg; x.strokeStyle = MG.big ? '#8a5a20' : '#c99a5a'; x.lineWidth = MG.big ? 3.5 : 2.5;
  x.beginPath(); x.roundRect(b.x, b.y, b.w, b.h, 16); x.fill(); x.stroke();
  let fs = Math.round(Math.min(b.h * 0.42, 19 * U)); const wt = MG.big ? 900 : 800;
  x.font = `${wt} ${fs}px ${FONT}`; while (fs > 11 && x.measureText(b.label).width > b.w - 12) { fs--; x.font = `${wt} ${fs}px ${FONT}`; }
  x.fillStyle = MG.big ? '#2a1a0a' : '#5a3a18'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
}
function draw() {
  const W = cv.lw, H = cv.lh;
  if (!P || !G) { x.fillStyle = '#eaf8ff'; x.fillRect(0, 0, W, H); return; }
  if (!bgC) buildBg(); if (!boardC) buildBoard();
  x.drawImage(bgC, 0, 0, W, H); x.drawImage(boardC, 0, 0, W, H);
  const bad = state === 'play' ? badSet() : new Set(), won = state === 'won' || state === 'done';
  const symR = G.cell * 0.36;
  // the selected cell / brush targets
  if (sel >= 0) { const q = cellXY(sel), pu = 0.5 + Math.sin(t * 6) * 0.5; x.fillStyle = `rgba(255,210,63,${0.35 + pu * 0.25})`; x.strokeStyle = '#ffae00'; x.lineWidth = Math.max(3, G.cell * 0.06); x.beginPath(); x.roundRect(q.x + 3, q.y + 3, q.s - 6, q.s - 6, q.s * 0.2); x.fill(); x.stroke(); }
  if (brush != null && state === 'play') for (let i = 0; i < P.cells; i++) if (cur[i] < 0) { const q = cellXY(i); putSym(P.set, brush, q.x + q.s / 2, q.y + q.s / 2, symR, false, 0.8 + Math.sin(t * 4 + i) * 0.04, 0, 0.22); }
  // golden sweeps over finished rows / columns / rooms
  for (const f of flashes) { const a = Math.max(0, Math.min(1, (f.t - f.d) / 0.15)) * Math.max(0, 1 - (f.t - f.d) / 0.9); if (a <= 0) continue; x.fillStyle = `rgba(255,220,90,${a * 0.5})`; for (const i of f.cells) { const q = cellXY(i); x.fillRect(q.x + 1, q.y + 1, q.s - 2, q.s - 2); } }
  // pictures
  for (let i = 0; i < P.cells; i++) {
    const k = drag && drag.from === i && drag.moved ? -1 : cur[i]; if (k < 0) continue;
    const q = cellXY(i); let cx = q.x + q.s / 2, cy = q.y + q.s / 2, sc = 1, rot = 0;
    if (shake[i] > 0) { cx += Math.sin(shake[i] * 55) * q.s * 0.07 * (shake[i] / 0.5); rot = Math.sin(shake[i] * 40) * 0.12 * (shake[i] / 0.5); }
    if (pop[i] > 0) sc = 1 + Math.sin(pop[i] * Math.PI) * 0.22;
    if (won) { const w = wave[i]; if (w > 0 && w < 0.6) { cy -= Math.sin(w / 0.6 * Math.PI) * q.s * 0.22; sc *= 1 + Math.sin(w / 0.6 * Math.PI) * 0.12; } else if (w >= 0.6) cy += Math.sin(t * 5 + i * 0.7) * q.s * 0.03; }
    if (bad.has(i)) { const pu = 0.5 + Math.sin(t * 5) * 0.5; x.fillStyle = `rgba(255,120,140,${0.18 + pu * 0.14})`; x.strokeStyle = `rgba(230,80,110,${0.55 + pu * 0.3})`; x.lineWidth = Math.max(2.5, q.s * 0.045); x.beginPath(); x.roundRect(q.x + 4, q.y + 4, q.s - 8, q.s - 8, q.s * 0.2); x.fill(); x.stroke(); }
    const isGiven = P.given[i] >= 0, sil = P.t === 'shadow' && isGiven && !(won && wave[i] > 0.3);
    putSym(P.set, k, cx, cy, symR, sil, sc, rot);
    if (hinted.has(i) && !won) { x.fillStyle = '#ffc93a'; drawStar(q.x + q.s * 0.82, q.y + q.s * 0.18, q.s * 0.09); }
  }
  // palette
  for (let s = 0; s < G.pal.length; s++) {
    const p = G.pal[s], on = brush != null && p.k === brush, r = p.s / 2, lift = on ? -r * 0.12 : 0, pp = palPop[s] > 0 ? 1 + Math.sin(palPop[s] * Math.PI) * 0.12 : 1;
    x.save(); x.translate(p.x, p.y + lift); x.scale(pp, pp);
    x.fillStyle = 'rgba(90,50,20,.18)'; x.beginPath(); x.ellipse(2, r * 0.92 - lift, r * 0.85, r * 0.18, 0, 0, 7); x.fill();
    const gg = x.createLinearGradient(0, -r, 0, r); gg.addColorStop(0, on ? '#fff6c4' : '#ffffff'); gg.addColorStop(1, on ? '#ffd76a' : '#f6ead2');
    x.fillStyle = gg; x.strokeStyle = on ? '#e89a00' : '#c99a5a'; x.lineWidth = on ? 4 : 2.5; x.beginPath(); x.roundRect(-r * 0.92, -r * 0.92, r * 1.84, r * 1.84, r * 0.4); x.fill(); x.stroke();
    x.restore();
    if (p.k >= 0) putSym(P.set, p.k, p.x, p.y + lift, r * 0.66 * pp); else drawEraser(p.x, p.y + lift, r * 0.62);
  }
  for (const b of G.btns) drawButton(b);
  // the hero cheers along
  const h = G.hero, bo = heroBounce > 0 ? Math.sin(heroBounce * Math.PI * 2) * 0.12 * heroBounce : 0;
  const hy = h.y + (won ? -Math.abs(Math.sin(t * 6)) * h.r * 0.25 : Math.sin(t * 2) * h.r * 0.03);
  MG.puPu(x, h.x, hy, h.r, won ? (MG.hero === 'niu' ? 'yay' : 'love') : heroMood, bo + (won ? 0 : Math.sin(t * 2.2) * 0.02), { arms: won || heroMood === 'wow' ? 'up' : 'down', look: drag ? Math.max(-1, Math.min(1, (drag.x - h.x) / 200)) : 0 });
  MG.fx.draw(x);
  // the picture being dragged
  if (drag && drag.moved) { if (drag.k >= 0) putSym(P.set, drag.k, drag.x, drag.y - G.cell * 0.25, symR * 1.25, false, 1, Math.sin(t * 8) * 0.06); else drawEraser(drag.x, drag.y - G.cell * 0.25, symR * 1.1); }
  // floating words
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    const sz = Math.round(Math.max(20, Math.min(32, G.cell * 0.32)) * U / Math.max(1, U * 0.85));
    x.font = `900 ${sz}px system-ui,${FONT}`; const tw = x.measureText(f.text).width;
    const fx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x)), fy = Math.max(sz, f.y - (1.2 - f.life) * 34);
    x.globalAlpha = Math.min(1, f.life * 2.5); x.lineWidth = Math.max(4, sz * 0.22); x.strokeStyle = '#fff'; x.strokeText(f.text, fx, fy); x.fillStyle = f.col; x.fillText(f.text, fx, fy); x.globalAlpha = 1;
  }
}
function drawStar(cx, cy, r) { x.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); x.fill(); x.strokeStyle = '#c98a00'; x.lineWidth = 1.2; x.stroke(); }

// ---------- menu ----------
function menu() {
  state = 'menu';
  const S = stars();
  MG.choose({
    id: 'sudoku', title: '圖案數獨',
    html: `<p>把圖案放進空格：<b>每一橫排、每一直排</b>，每種圖案都要剛好一個！點空格再點下面的圖案，或直接拖過去。</p><p>放錯了會搖一搖，換一個就好，不會失敗；不會的時候按 💡 提示 ^_^</p><p>從 3×3 開始，後面有 4×4、6×6，還有 🔍 找找少了誰、🎨 只看顏色、👤 影子關、🧩 拼圖房間！</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${TYPE[LEVELS[n - 1].t][0]} ${lvName(n)}）${S[n] ? ' ' + '⭐'.repeat(S[n]) : ''}`, short: n => `${n}${MARK[LEVELS[n - 1].t]}${S[n] ? '✓' : ''}` },
    keys: '點空格再點圖案，或把圖案拖進去　電腦：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 選格子、<kbd>1</kbd>～<kbd>6</kbd> 放圖案、<kbd>H</kbd> 提示',
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
// a sample board behind the start panel
P = makePuzzle(LEVELS[Math.min(MG.store.get('sudoku.pickLevel', 1), LEVELS.length) - 1]); P._lv = 0; peers = peersOf(P.cells, P.groups); cur = P.given.slice(); pop = cur.map(() => 0); shake = cur.map(() => 0); wave = cur.map(() => 0); palPop = Array(P.n + 1).fill(0); layout();
menu();

// ---------- hook for automated tests ----------
window.SDKT = {
  get state() { return state; }, get level() { return level; }, levels: LEVELS.length, LEVELS,
  start: lv => startLevel(lv), menu: () => menu(),
  puzzle: () => P && { n: P.n, rows: P.rows, cols: P.cols, t: P.t, set: P.set, given: P.given.slice(), sol: P.sol.slice(), groups: P.groups.map(g => g.slice()), rooms: P.rooms.map(g => g.slice()) },
  cur: () => cur.slice(), get sel() { return sel; }, get brush() { return brush; }, get hints() { return hints; }, get oops() { return oops; }, bad: () => [...badSet()],
  countSolutions: () => countSolutions(P.n, P.given, P.groups, 3), solveCheck: (lv, tries = 5) => { const out = []; for (let k = 0; k < tries; k++) { const q = makePuzzle(LEVELS[lv - 1]); const ok = q.sol.every((v, i) => q.given[i] < 0 || q.given[i] === v) && q.groups.every(g => new Set(g.map(i => q.sol[i])).size === g.length); out.push({ unique: countSolutions(q.n, q.given, q.groups, 3), ok, blanks: q.given.filter(v => v < 0).length }); } return out; },
  place: (i, k) => place(i, k), hint: () => hint(), win() { for (let i = 0; i < P.cells; i++) if (P.given[i] < 0 && cur[i] !== P.sol[i]) place(i, P.sol[i]); },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; },
  cellAt(i) { const q = cellXY(i); return this.toClient(q.x + q.s / 2, q.y + q.s / 2); }, palAt(k) { const s = G.pal.find(p => p.k === k); return this.toClient(s.x, s.y); },
  btnAt(id) { const b = G.btns.find(b => b.id === id); return this.toClient(b.x + b.w / 2, b.y + b.h / 2); }, layout: () => JSON.parse(JSON.stringify(G)),
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  for (let i = 0; i < pop.length; i++) { pop[i] = Math.max(0, pop[i] - dt * 3.2); shake[i] = Math.max(0, shake[i] - dt); if (state === 'won') wave[i] += dt; }
  for (let s = 0; s < palPop.length; s++) palPop[s] = Math.max(0, palPop[s] - dt * 4);
  for (const f of flashes) f.t += dt; flashes = flashes.filter(f => f.t < f.d + 1);
  heroBounce = Math.max(0, heroBounce - dt * 1.6); if (heroT > 0) { heroT -= dt; if (heroT <= 0) heroMood = 'happy'; }
  if (state === 'won') { winT += dt; if (winT > 1.6) state = 'done'; }
  draw();
});
</script>
