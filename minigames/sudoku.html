const TYPE = { warm: ['🔍', '找找少了誰'], row1: ['☝️', '每排少一個'], std: ['▦', '圖案數獨'], color: ['🎨', '只看顏色'], shadow: ['👤', '影子關'], jig: ['🧩', '拼圖房間'], queue: ['🚌', '排隊入座'], reveal: ['🖼️', '翻開大圖畫'], gift: ['🎁', '驚喜禮物'], grand: ['🏆', '大挑戰'] };

// the list of things to do in a level: an optional warm-up, then one or more boards
function stepsOf(L) {
  const base = { ...L }; delete base.more; delete base.boards; delete base.pre;
  const boards = L.boards ? L.boards.map(b => ({ ...base, ...b })) : [base, ...(L.more || []).map(m => ({ ...base, ...m }))];
  const out = boards.map(b => ({ kind: 'board', ...b }));
  if (L.pre) out.unshift({ kind: L.pre, n: Math.max(4, base.n), set: boards[0].set === 'color' ? 'color' : boards[0].set, sc: boards[0].sc, night: boards[0].night, t: L.pre });
  return out;
}
const lvName = n => {
  const L = LEVELS[n - 1], st = stepsOf(L), nb = st.filter(s => s.kind === 'board').length;
  if (L.t === 'grand') return `${TYPE.grand[1]}・${st.length} 個任務`;
  return `${TYPE[L.t][1]}・${L.t === 'warm' ? `${L.n} 個` : `${L.n}×${L.n}`}・${SETS[L.set][0]}${SETS[L.set][1]}${nb > 1 ? `＋${SETS[st[st.length - 1].set][0]}` : ''}${L.pre ? '＋暖身' : ''}`;
};

// ---------- puzzle engine ----------
// a puzzle: rows × cols cells, n symbols, groups = lists of cells that must hold every symbol once
function boxGroups(n) {
  const [bh, bw] = n === 4 ? [2, 2] : n === 6 ? [2, 3] : [0, 0]; if (!bh) return [];
  const out = [];
  for (let br = 0; br < n / bh; br++) for (let bc = 0; bc < n / bw; bc++) { const g = []; for (let r = 0; r < bh; r++) for (let c = 0; c < bw; c++) g.push((br * bh + r) * n + bc * bw + c); out.push(g); }
  return out;
}
// jigsaw rooms: grow n blobby, connected rooms of n cells; never a plain row / column / box
function jigRooms(n) {
  for (let tries = 0; tries < 4000; tries++) {
    const own = new Array(n * n).fill(-1);
    const nb = i => { const r = (i / n) | 0, c = i % n, o = []; if (r) o.push(i - n); if (r < n - 1) o.push(i + n); if (c) o.push(i - 1); if (c < n - 1) o.push(i + 1); return o; };
    let ok = true;
    for (let g = 0; g < n && ok; g++) {
      const free = own.map((v, i) => v < 0 ? i : -1).filter(i => i >= 0);
      // start in the most cornered free cell so no pockets are left behind
      let best = 1e9, seeds = [];
      for (const i of free) { const f = nb(i).filter(j => own[j] < 0).length; if (f < best) { best = f; seeds = [i]; } else if (f === best) seeds.push(i); }
      const room = [MG.pick(seeds)]; own[room[0]] = g;
      while (room.length < n) {
        const front = [...new Set(room.flatMap(nb))].filter(j => own[j] < 0);
        if (!front.length) { ok = false; break; }
        const sc = j => nb(j).filter(k => own[k] === g).length * 2 - nb(j).filter(k => own[k] < 0).length * 0.6 + Math.random() * 1.6;
        front.sort((a, b) => sc(b) - sc(a)); own[front[0]] = g; room.push(front[0]);
      }
      if (!ok) break;
      // what is left must split into pieces of exactly n cells
      const seen = new Set();
      for (const i of own.keys()) {
        if (own[i] >= 0 || seen.has(i)) continue;
        let cnt = 0; const st = [i]; seen.add(i);
        while (st.length) { const q = st.pop(); cnt++; for (const j of nb(q)) if (own[j] < 0 && !seen.has(j)) { seen.add(j); st.push(j); } }
        if (cnt % n) { ok = false; break; }
      }
    }
    if (!ok) continue;
    const rooms = Array.from({ length: n }, (_, g) => own.map((v, i) => v === g ? i : -1).filter(i => i >= 0));
    const straight = rooms.some(rm => rm.every(i => ((i / n) | 0) === ((rm[0] / n) | 0)) || rm.every(i => i % n === rm[0] % n));
    if (straight) continue;
    const boxes = boxGroups(n).map(b => b.join(','));
    if (rooms.filter(rm => boxes.includes(rm.slice().sort((a, b) => a - b).join(','))).length >= n - 1) continue;
    if (!fillSolution(n, n * n, groupsFor(n, n, false).concat(rooms))) continue;
    return rooms;
  }
  return boxGroups(n);
}
function groupsFor(rows, cols, rowsOnly) {
  const g = [];
  for (let r = 0; r < rows; r++) g.push(Array.from({ length: cols }, (_, c) => r * cols + c));
  if (!rowsOnly) for (let c = 0; c < cols; c++) g.push(Array.from({ length: rows }, (_, r) => r * cols + c));
  return g;
}
const peersOf = (cells, groups) => { const P = Array.from({ length: cells }, () => new Set()); for (const g of groups) for (const a of g) for (const b of g) if (a !== b) P[a].add(b); return P.map(s => [...s]); };
// random full solution (backtracking, most-constrained cell first)
function fillSolution(n, cells, groups) {
  const P = peersOf(cells, groups), v = new Array(cells).fill(-1);
  const rec = () => {
    let bi = -1, bc = null;
    for (let i = 0; i < cells; i++) {
      if (v[i] >= 0) continue;
      const c = []; for (let k = 0; k < n; k++) if (!P[i].some(j => v[j] === k)) c.push(k);
      if (!c.length) return false;
      if (!bc || c.length < bc.length) { bi = i; bc = c; }
    }
    if (bi < 0) return true;
    for (const k of MG.shuffle(bc)) { v[bi] = k; if (rec()) return true; }
    v[bi] = -1; return false;
  };
  return rec() ? v : null;
}
// how many ways can the grid be finished (stops at limit)
function countSolutions(n, grid, groups, limit = 2) {
  const cells = grid.length, P = peersOf(cells, groups), v = grid.slice(); let found = 0;
  const rec = () => {
    let bi = -1, bc = null;
    for (let i = 0; i < cells; i++) {
      if (v[i] >= 0) continue;
      const c = []; for (let k = 0; k < n; k++) if (!P[i].some(j => v[j] === k)) c.push(k);
      if (!c.length) return;
      if (!bc || c.length < bc.length) { bi = i; bc = c; }
    }
    if (bi < 0) { found++; return; }
    for (const k of bc) { v[bi] = k; rec(); if (found >= limit) break; }
    v[bi] = -1;
  };

}
function makePuzzle(L) {
  const n = L.n, warm = L.t === 'warm', rows = warm ? 3 : n, cols = n, cells = rows * cols;
  let rooms = [];
  if (!warm) rooms = L.t === 'jig' ? jigRooms(n) : boxGroups(n);
  const groups = groupsFor(rows, cols, warm).concat(rooms);
  let sol = null;
  if (warm) {   // three shelves, each a different order, no column rule
    sol = [];
    let prev = null;
    for (let r = 0; r < rows; r++) { let row; do { row = MG.shuffle([...Array(n).keys()]); } while (prev && row.join() === prev.join()); prev = row; sol.push(...row); }
  } else sol = fillSolution(n, cells, groups);
  const given = sol.slice();
  if (warm || L.t === 'row1') {   // exactly one gap per shelf / row, each gap a different picture when possible
    const missing = MG.shuffle([...Array(n).keys()]);
    for (let r = 0; r < rows; r++) {
      const want = missing[r % n];
      let c = (L.t === 'row1') ? null : sol.slice(r * cols, r * cols + cols).indexOf(want);
      if (c == null) { const used = new Set(); for (let rr = 0; rr < r; rr++) used.add(given.slice(rr * cols, rr * cols + cols).indexOf(-1)); const opts = [...Array(cols).keys()].filter(q => !used.has(q)); c = MG.pick(opts.length ? opts : [...Array(cols).keys()]); }
      given[r * cols + c] = -1;
    }
  } else {
    const want = Math.min(L.blanks, cells - n);
    let blanks = 0;
    for (const i of MG.shuffle([...Array(cells).keys()])) {
      if (blanks >= want) break;
      const keep = given[i]; given[i] = -1;
      if (countSolutions(n, given, groups, 2) === 1) blanks++; else given[i] = keep;
    }
  }
  const Pz = { n, rows, cols, cells, rooms, groups, sol, given, set: L.set, t: L.t };
  if (L.t === 'queue') { Pz.qCells = solveOrder(Pz); Pz.queue = Pz.qCells.map(i => sol[i]); }
  if (L.t === 'gift') { const gv = given.map((v, i) => v >= 0 ? i : -1).filter(i => i >= 0); Pz.wrapped = new Set(gv); Pz.bonus = MG.pick(gv); }
  if (L.t === 'reveal') Pz.bigK = Math.floor(Math.random() * n);
  return Pz;
}
// 🚌 the order friends line up in: always one whose seat can be worked out right now (a row / column / room with only one place left for it)
function solveOrder(Pz) {
  const v = Pz.given.slice(), P2 = peersOf(Pz.cells, Pz.groups), order = [];
  const can = (i, k) => v[i] < 0 && !P2[i].some(j => v[j] === k);
  while (v.some(q => q < 0)) {
    const singles = new Set();
    for (const g of Pz.groups) for (let k = 0; k < Pz.n; k++) { if (g.some(i => v[i] === k)) continue; const c = g.filter(i => can(i, k)); if (c.length === 1) singles.add(c[0]); }
    for (let i = 0; i < Pz.cells; i++) if (v[i] < 0 && [...Array(Pz.n).keys()].filter(k => can(i, k)).length === 1) singles.add(i);
    const i = singles.size ? MG.pick([...singles]) : v.findIndex(q => q < 0);
    v[i] = Pz.sol[i]; order.push(i);
  }
  return order;
}

  const hy = h.y + (won ? -Math.abs(Math.sin(t * 6)) * h.r * 0.25 : Math.sin(t * 2) * h.r * 0.03);
  MG.puPu(x, h.x, hy, h.r, won ? (MG.hero === 'niu' ? 'yay' : 'love') : heroMood, bo + (won ? 0 : Math.sin(t * 2.2) * 0.02), { arms: won || heroMood === 'wow' ? 'up' : 'down', look: drag ? Math.max(-1, Math.min(1, (drag.x - h.x) / 200)) : 0 });
  drawWinFx();
  x.restore();
  MG.fx.draw(x);
  // the picture being dragged
  if (drag && drag.moved) { if (drag.k >= 0) putSym(P.set, drag.k, drag.x, drag.y - G.cell * 0.25, G.cell * 0.36 * 1.25, false, 1, Math.sin(t * 8) * 0.06); else drawEraser(drag.x, drag.y - G.cell * 0.25, G.cell * 0.4); }
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    const sz = Math.round(Math.max(20, Math.min(32, G.cell * 0.32)) * U / Math.max(1, U * 0.85));
    x.font = `900 ${sz}px system-ui,${FONT}`; const tw = x.measureText(f.text).width;
    const fx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x)), fy = Math.max(sz, f.y - (1.2 - f.life) * 34);
    x.globalAlpha = Math.min(1, f.life * 2.5); x.lineWidth = Math.max(4, sz * 0.22); x.strokeStyle = '#fff'; x.strokeText(f.text, fx, fy); x.fillStyle = f.col; x.fillText(f.text, fx, fy); x.globalAlpha = 1;
  }
}
function drawStar(cx, cy, r) { x.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; x.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr); } x.closePath(); x.fill(); x.strokeStyle = '#c98a00'; x.lineWidth = 1.2; x.stroke(); }

// ---------- menu ----------
function menu() {
  state = 'menu';
  const S = stars(), K = stickers(), got = Object.keys(K).map(Number).filter(n => n >= 1 && n <= LEVELS.length).sort((a, b) => a - b);
  const book = got.length ? `<div class="sd-book">${got.map(n => { const s = stickerOf(n), u = stickerURL(s.set, s.k, 64); return u ? `<img src="${u}" alt="" width="34" height="34">` : ''; }).join('')}</div>` : '<p class="sd-small">每過一關就能拿到一張貼紙喔！</p>';
  MG.choose({
    id: 'sudoku', title: '圖案數獨',
    html: `<p>把圖案放進空格：<b>每一橫排、每一直排</b>，每種圖案都要剛好一個！點空格再點下面的圖案，或直接拖過去。放錯了會搖一搖，換一個就好，不會失敗 ^_^</p>` +
      `<p>坐校車、種菜園、麵包店、海底學校、恐龍公園……36 關有 🚌 排隊入座、🖼️ 翻開大圖畫、🎁 驚喜禮物、🧐 暖身小遊戲，還有 🏆 大挑戰！看到有朋友從框框後面偷看，快點它！</p>` +
      `<p class="sd-small">📒 我的貼紙 ${got.length} / ${LEVELS.length}　👀 找到躲貓貓朋友 ${MG.store.get('sudoku.friends', 0) | 0} 次</p>` + book,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${TYPE[LEVELS[n - 1].t][0]} ${lvName(n)}）${S[n] ? ' ' + '⭐'.repeat(S[n]) : ''}`, short: n => `${n}${MARK[LEVELS[n - 1].t]}${S[n] ? '✓' : ''}` },
    keys: '點空格再點圖案，或把圖案拖進去　電腦：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 選格子、<kbd>1</kbd>～<kbd>6</kbd> 放圖案、<kbd>H</kbd> 提示',
    playing: () => state === 'play' || state === 'stepwin',
    start: (m, lv) => startLevel(lv),
  });
}
// a sample board behind the start panel
{ const lv0 = Math.min(MG.store.get('sudoku.pickLevel', 1), LEVELS.length); L = LEVELS[lv0 - 1]; level = lv0; steps = stepsOf(L); stepI = steps.findIndex(s => s.kind === 'board'); B = steps[stepI]; SC = SCENE[B.sc]; P = makePuzzle(B); P._st = B; peers = peersOf(P.cells, P.groups); cur = P.given.slice(); pop = cur.map(() => 0); shake = cur.map(() => 0); wave = cur.map(() => 0); flip = cur.map(() => 0); P.unwrapT = cur.map(() => 0); palPop = Array(P.n + 1).fill(0); layout(); spawnCritters(); }
menu();

// ---------- hook for automated tests ----------
window.SDKT = {
  get state() { return state; }, get level() { return level; }, levels: LEVELS.length, LEVELS,
  start: lv => startLevel(lv), menu: () => menu(),
  step: () => ({ i: stepI, n: steps.length, kind: B.kind, t: B.t, set: B.set, sc: B.sc }),
  puzzle: () => P && P.t !== 'quiz' && { n: P.n, rows: P.rows, cols: P.cols, t: P.t, set: P.set, given: P.given.slice(), sol: P.sol.slice(), groups: P.groups.map(g => g.slice()), rooms: P.rooms.map(g => g.slice()), queue: P.queue ? P.queue.slice() : null, wrapped: P.wrapped ? [...P.wrapped] : null, bonus: P.bonus },
  quiz: () => Q && { kind: Q.kind, ans: Q.ans, round: Q.round, rounds: Q.rounds, items: Q.items.slice(), shelf: Q.shelf ? Q.shelf.slice() : null },
  quizAt(i) { const r = quizRects().items[i]; return this.toClient(r.x, r.y); }, answer: i => answerQuiz(i),
  cur: () => cur.slice(), get sel() { return sel; }, get brush() { return brush; }, get hints() { return hints; }, get oops() { return oops; }, bad: () => [...badSet()],
  countSolutions: () => countSolutions(P.n, P.given, P.groups, 3),
  solveCheck: (lv, tries = 5) => { const out = []; for (const S of stepsOf(LEVELS[lv - 1]).filter(s => s.kind === 'board')) for (let k = 0; k < tries; k++) { const q = makePuzzle(S); const ok = q.sol.every((v, i) => q.given[i] < 0 || q.given[i] === v) && q.groups.every(g => new Set(g.map(i => q.sol[i])).size === g.length); let qok = true; if (q.qCells) { qok = q.qCells.length === q.given.filter(v => v < 0).length && new Set(q.qCells).size === q.qCells.length && q.qCells.every(i => q.given[i] < 0); } out.push({ t: S.t, unique: countSolutions(q.n, q.given, q.groups, 3), ok: ok && qok, blanks: q.given.filter(v => v < 0).length }); } return out; },
  place: (i, k) => place(i, k), seat: i => seat(i), hint: () => hint(), unwrap: i => unwrap(i), findFriend: () => findFriend(),
  peekAt() { if (!peek || peek.found) return null; return this.toClient(peek.x, peek.y + peek.r * 0.95 - peek.r * 1.25); }, get peekH() { return peekH(); },
  win() { if (Q) { answerQuiz(Q.ans); return; } if (P.t === 'queue') { while (P.queue.length && state === 'play') { const k = P.queue[0], i = P.qCells.find(j => cur[j] < 0 && P.sol[j] === k); seat(i); } return; } for (let i = 0; i < P.cells; i++) if (P.given[i] < 0 && cur[i] !== P.sol[i]) place(i, P.sol[i]); },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B0 = 3; return { x: rc.left + B0 + lx * (rc.width - 2 * B0) / cv.lw, y: rc.top + B0 + ly * (rc.height - 2 * B0) / cv.lh }; },
  cellAt(i) { const q = cellXY(i); return this.toClient(q.x + q.s / 2, q.y + q.s / 2); }, palAt(k) { const s = P.t === 'queue' ? G.pal[0] : G.pal.find(p => p.k === k); return this.toClient(s.x, s.y); },
  btnAt(id) { const b = G.btns.find(b => b.id === id); return this.toClient(b.x + b.w / 2, b.y + b.h / 2); }, layout: () => JSON.parse(JSON.stringify(G)),
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt); stepCritters(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  for (let i = 0; i < pop.length; i++) { pop[i] = Math.max(0, pop[i] - dt * 3.2); shake[i] = Math.max(0, shake[i] - dt); flip[i] = Math.max(0, (flip[i] || 0) - dt * 2.6); if (P && P.unwrapT && P.unwrapT[i] > 0 && P.unwrapT[i] < 1) P.unwrapT[i] = Math.min(1, P.unwrapT[i] + dt * 1.8); if (isWon()) wave[i] += dt; }
  for (let s = 0; s < palPop.length; s++) palPop[s] = Math.max(0, palPop[s] - dt * 4);
  for (const f of flashes) f.t += dt; flashes = flashes.filter(f => f.t < f.d + 1);
  for (const n of notes) { if (n.d > 0) { n.d -= dt; continue; } n.y += n.vy * dt; n.life -= dt; } notes = notes.filter(n => n.life > 0);
  qShake = Math.max(0, qShake - dt);
  if (winFx) winFx.t += dt;
  if (peek) { if (!peek.found) peek.t += dt; else peek.jt += dt; }
  if (Q) { for (let i = 0; i < Q.shake.length; i++) { Q.shake[i] = Math.max(0, Q.shake[i] - dt); Q.pop[i] = Math.max(0, Q.pop[i] - dt * 2.5); } Q.glow = Math.max(0, Q.glow - dt); if (Q.doneT > 0) { Q.doneT -= dt; if (Q.doneT <= 0 && state === 'play') quizNext(); } }
  heroBounce = Math.max(0, heroBounce - dt * 1.6); if (heroT > 0) { heroT -= dt; if (heroT <= 0) heroMood = 'happy'; }
  if (state === 'stepwin') { winT += dt; if (winT > 2.1 && !MG.panelOpen()) nextStep(); }
  if (state === 'won') { winT += dt; if (winT > 1.8) state = 'done'; }
  draw();
});
