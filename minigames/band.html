const bandOf = L => L.pads ? [...L.band, ...L.pads.filter(p => !L.band.includes(p))] : L.band;
const lvName = n => { const L = LEVELS[n - 1]; return `${TYPE[L.type][1]}・${THEME[L.theme]}`; };

// =====================================================================
// audio — one AudioContext is the band's clock
// =====================================================================
let ac = null, master = null, buses = {}, noiseBuf = null, audioHeld = false, lat = 0;
const isMuted = () => !!MG.store.get('muted', false);
function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    try { ac = new AC({ latencyHint: 'interactive' }); } catch { try { ac = new AC(); } catch { ac = null; return null; } }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ac.createGain(); master.connect(comp); comp.connect(ac.destination);
    for (const id of [...XALL, 'fx']) { const g = ac.createGain(); g.connect(master); buses[id] = g; }
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // iOS / Android: playing one silent sample inside the touch unlocks the speaker
    try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch {}
    applyMute(); resync();
  }
  if (ac.state === 'suspended' && !audioHeld) ac.resume().catch(() => {});
  const l = ac.outputLatency || ac.baseLatency || 0; lat = clamp(isFinite(l) ? l : 0, 0, 0.2);
  return ac;
}
for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) addEventListener(ev, () => ensureAudio(), true);
function applyMute() { if (master) master.gain.value = isMuted() ? 0 : 0.85; }
document.querySelector('.mg-bar .mute').addEventListener('click', () => setTimeout(applyMute, 0));
document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend().catch(() => {}); else if (!audioHeld) { ac.resume().catch(() => {}); resync(); } });
const now = () => ac ? ac.currentTime : performance.now() / 1000;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function env(t, peak, att, hold, rel, dest) {
  const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + att);
  if (hold > 0) g.gain.setValueAtTime(Math.max(0.0002, peak), t + att + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + att + Math.max(0, hold) + rel); g.connect(dest); return g;
}
function osc(type, f, t, end, dest) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(dest); o.start(t); o.stop(end); return o; }
function noise(t, dur, dest) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.connect(dest); s.start(t, Math.random() * 0.6, dur); }
function filt(type, f, dest, q = 0.8) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b; }
const V = {
  kick(t, v, d) { const g = env(t, 0.9 * v, 0.002, 0, 0.28, d); const o = osc('sine', 140, t, t + 0.32, g); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); },
  snare(t, v, d) { const g = env(t, 0.32 * v, 0.002, 0, 0.15, d); noise(t, 0.18, filt('highpass', 1200, g)); const g2 = env(t, 0.22 * v, 0.002, 0, 0.08, d); osc('triangle', 200, t, t + 0.1, g2); },
  hat(t, v, d) { const g = env(t, 0.08 * v, 0.001, 0, 0.04, d); noise(t, 0.05, filt('highpass', 7500, g)); },
  tom(t, v, d, f = 160) { const g = env(t, 0.65 * v, 0.003, 0, 0.3, d); const o = osc('sine', f, t, t + 0.34, g); o.frequency.exponentialRampToValueAtTime(f * 0.5, t + 0.24); const g2 = env(t, 0.1 * v, 0.001, 0, 0.05, d); noise(t, 0.06, g2); },
  xylo(t, m, v, d) { const f = mtof(m); const g = env(t, 0.2 * v, 0.002, 0, 0.5, d); osc('sine', f, t, t + 0.55, g); const g2 = env(t, 0.06 * v, 0.001, 0, 0.09, d); osc('sine', f * 3.98, t, t + 0.12, g2); },
  piano(t, ms, v, d, dur = 0.6) { for (const m of ms) { const f = mtof(m); const g = env(t, 0.06 * v, 0.004, Math.max(0, dur - 0.3), 0.45, d); osc('triangle', f, t, t + dur + 0.5, g); const g2 = env(t, 0.022 * v, 0.003, 0, 0.3, d); osc('sine', f * 2, t, t + 0.35, g2); } },
  guitar(t, ms, v, d) { ms.forEach((m, i) => { const tt = t + i * 0.016, f = mtof(m), g = env(tt, 0.045 * v, 0.002, 0, 0.5, d), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3400, tt); lp.frequency.exponentialRampToValueAtTime(520, tt + 0.32); lp.connect(g); osc('sawtooth', f, tt, tt + 0.55, lp); }); },
  trumpet(t, m, v, d, dur) {
    const f = mtof(m), g = env(t, 0.075 * v, 0.035, Math.max(0, dur - 0.08), 0.09, d), lp = filt('lowpass', 2100, g, 1.2);
    const o = osc('sawtooth', f, t, t + dur + 0.15, lp); const lfo = osc('sine', 5.5, t, t + dur + 0.15, (() => { const k = ac.createGain(); k.gain.value = f * 0.007; k.connect(o.frequency); return k; })()); void lfo;
  },
  cello(t, m, v, d, dur) { const f = mtof(m), g = env(t, 0.16 * v, 0.06, Math.max(0, dur - 0.1), 0.16, d), lp = filt('lowpass', 900, g); osc('sawtooth', f, t, t + dur + 0.25, lp); const k = ac.createGain(); k.gain.value = 0.6; k.connect(lp); osc('triangle', f, t, t + dur + 0.25, k); },
  maracas(t, v, d) { const g = env(t, 0.07 * v, 0.004, 0, 0.06, d); noise(t, 0.08, filt('highpass', 5200, g)); },
  violin(t, m, v, d, dur) {   // 兩支微微走音的鋸齒波＋顫音＝弓弦
    const f = mtof(m), g = env(t, 0.05 * v, 0.07, Math.max(0, dur - 0.1), 0.14, d), lp = filt('lowpass', 2600, g, 1.1);
    const vib = ac.createGain(); vib.gain.value = f * 0.006; osc('sine', 5.8, t, t + dur + 0.25, vib);
    for (const dt2 of [-0.12, 0.12]) { const o = osc('sawtooth', f, t, t + dur + 0.25, lp); o.detune.value = dt2 * 10; vib.connect(o.frequency); }
  },

  const i = hitSlot(p);
  if (i >= 0) {
    if (MODE.tap) MODE.tap(i);
    else if (LV.pads && LV.pads.includes(slots[i].id)) { slots[i].shake = 0.35; MG.sfx('boing'); }   // the call-and-response leaders just giggle
    else setOn(i, !slots[i].on);
    hud(); return;
  }
  if (inR(p, R.hero)) { heroHappy('tongue', 0.8); MG.sfx('jump'); return; }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(cv.logical(e)); });
addEventListener('keydown', e => {
  if (state !== 'play' || e.repeat || (med && med.wait > 0)) return;
  const n = parseInt(e.key, 10);
  if (!isNaN(n) && n >= 1 && n <= slots.length && MODE.tap) { MODE.tap(n - 1); hud(); return; }
  const pk = ['z', 'x', 'c', 'v', 'b', 'n', 'm', ','].indexOf(e.key.toLowerCase());
  if (MODE.pad && (e.key === ' ' || pk >= 0)) { e.preventDefault(); const k = e.key === ' ' ? 0 : pk; if (k < btns.length) { MODE.pad(k); hud(); } }
});

// =====================================================================
// drawing
// =====================================================================
function draw() {
  c = x;
  background();
  if (MODE && MODE.under && state !== 'menu' && !(med && med.wait > 0)) MODE.under();
  const sn = stepNow(), ph = ((sn / 4) % 1 + 1) % 1, beat = Math.floor(sn / 4);
  // musicians, back row first
  const order = slots.map((s, i) => i).sort((a, b) => slots[a].by - slots[b].by);
  for (const i of order) {
    const s = slots[i], k = s.s;
    // riser + spotlight
    const glow = s.on || s.lead > 0 ? 0.35 + s.h * 0.4 : 0;
    if (glow) { x.fillStyle = rgrad(s.cx, s.by - 60 * k, 4, 90 * k, [hexA(INSTR[s.id].c, glow * 0.7), hexA(INSTR[s.id].c, 0)]); x.fillRect(s.cx - 95 * k, s.by - 160 * k, 190 * k, 190 * k); }
    ell(s.cx, s.by + 4 * k, 56 * k, 12 * k, shade(INSTR[s.id].c, -0.25));
    ell(s.cx, s.by + 1 * k, 56 * k, 12 * k, s.on ? shade(INSTR[s.id].c, 0.25) : shade(INSTR[s.id].c, 0.55), shade(INSTR[s.id].c, -0.3), 2);
    ell(s.cx - 18 * k, s.by - 2 * k, 18 * k, 3 * k, 'rgba(255,255,255,.4)');
    const sh = s.shake > 0 ? Math.sin(s.shake * 50) * 5 * k : 0, pop = s.pop > 0 ? Math.sin(s.pop * Math.PI) * 0.08 : 0;
    x.save(); x.translate(s.cx + sh, s.by); x.scale(k * (1 + pop), k * (1 - pop * 0.5));
    const awake = s.on || s.lead > 0, blink = ((t + i * 1.37) % 3.9) < 0.13;
    drawMusician(s.id, { on: awake, h: s.h, ph, beat, hat: s.hat, sleep: LV.type === 'wake' || LV.type === 'listen' ? true : undefined, cym: s.h, blink: awake && blink && s.h < 0.3, happy: (state === 'finale' && s.on && s.h > 0.6) || s.lead > 0.6 });
    x.restore();
    if (!s.on && LV.type === 'wake') { x.fillStyle = '#7a8ce0'; x.font = `900 ${Math.round(18 * k)}px ${FONT}`; x.textAlign = 'center'; x.globalAlpha = 0.6 + 0.4 * Math.sin(t * 2 + i); x.fillText('z', s.cx + 30 * k, s.by - 118 * k - (t * 8 + i * 5) % 10); x.font = `900 ${Math.round(13 * k)}px ${FONT}`; x.fillText('z', s.cx + 42 * k, s.by - 132 * k - (t * 8 + i * 5) % 10); x.globalAlpha = 1; }
    // tiny number for keyboard players
    x.fillStyle = 'rgba(80,50,20,.35)'; x.font = `800 ${Math.round(10 * k + 3)}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(i + 1), s.cx + 46 * k, s.by + 2 * k);
  }
  if (MODE && MODE.over && state !== 'menu' && !(med && med.wait > 0)) MODE.over();
  // flying notes
  for (const n of notes) { x.globalAlpha = Math.min(1, n.life * 1.5); noteGlyph(n.x, n.y, n.r, n.col); }
  x.globalAlpha = 1;
  // task card + hero
  if (R.card) {
    cardPanel(R.card, KEYS[keyI].c); if (state !== 'menu' && MODE && MODE.card) MODE.card(R.card); else menuCard(R.card);
    if (med && state !== 'menu') {   // 大合奏的段落：卡片上緣一排小音符
      const n = med.base.stages.length, d = Math.min(9 * U, R.card.w / (n * 3.4)), x0 = R.card.x + 12 + d * 1.4, y = R.card.y + 10 + d * 0.9;
      rrect(x0 - d * 1.4, y - d * 0.9, (n - 1) * d * 2.6 + d * 2.8, d * 1.8, d * 0.9, '#fff', '#ffb02e', 2);
      for (let i = 0; i < n; i++) { const done = i < med.k || (i === med.k && med.wait > 0); ell(x0 + i * d * 2.6, y, d * 0.6, d * 0.6, done ? '#ffb02e' : i === med.k ? '#ffe6a8' : 'rgba(0,0,0,.08)', done || i === med.k ? '#c47a00' : null, 1.5); }
    }
  }
  if (R.hero) { const hr = Math.min(R.hero.w * 0.36, R.hero.h * 0.34); ell(R.hero.x + R.hero.w / 2, R.hero.y + R.hero.h - 6, hr * 1.25, hr * 0.28, '#a0683a', '#6a4020', 2); drawHeroAt(R.hero.x + R.hero.w / 2, R.hero.y + R.hero.h - 8, hr); }
  if (R.pads && MODE && MODE.drawPads && state !== 'menu') MODE.drawPads();
  MG.fx.draw(x);
  drawFloats();
}
function menuCard(r) {
  const ids = slots.map(s => s.id), cells = gridFit({ x: r.x + 10, y: r.y + 10, w: r.w - 20, h: r.h - 20 }, ids.length, 1, 1, 400);
  cells.forEach((cl, i) => badge(ids[i], cl.x + cl.w / 2, cl.y + cl.h / 2, Math.min(cl.w, cl.h) * 0.85));
}
function drawFloats() {
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    let sz = Math.round(26 * U * f.big); x.font = `900 ${sz}px system-ui,${FONT}`;
    const tw = x.measureText(f.text).width, fx = clamp(f.x, tw / 2 + 8, W - tw / 2 - 8), fy = Math.max(sz, f.y - (1.3 - f.life) * 36);
    x.globalAlpha = Math.min(1, f.life * 2.5); x.lineWidth = Math.max(4, sz * 0.22); x.strokeStyle = '#fff'; x.strokeText(f.text, fx, fy); x.fillStyle = f.col; x.fillText(f.text, fx, fy);
  }
  x.globalAlpha = 1;
}

// =====================================================================
// menu
// =====================================================================
const stLabel = n => progress[n] ? ' ' + '⭐'.repeat(progress[n]) : '';
function menu() {
  state = 'menu'; setBand([], true); med = null;
  const pick = clamp(MG.store.get('band.pickLevel', 1), 1, LEVELS.length);
  LV = LEVELS[pick - 1]; MODE = null; slots = bandOf(LV).map(id => ({ id, on: false, h: 0, pop: 0, shake: 0, lead: 0, hat: null, cx: 0, by: 0, s: 1 })); layout();
  MG.choose({
    id: 'band', title: '噗噗樂團',
    html: `<p>小動物樂團開演唱會囉！<b>點一下樂手</b>就開始演奏，再點一下休息。不管怎麼組合，大家的拍子都對得剛剛好 ^_^</p><p>40 關有 😴 叫醒樂團、🖼️ 照圖組樂團、🥁 打拍子、🦜 你敲我也敲、👂 猜猜誰在演奏、🎪 點歌、🐢 快慢、🌈 換音調、🎵 彈兒歌、🧩 做一首歌、👗 換衣服、🎙️ 錄音自由演奏，還有新的 🎧 聽樂器、🧱 疊音樂、🪄 小小指揮家、🌟 聚光燈獨奏和 🎼 大合奏！新團員：🐭 小提琴、🐸 長笛。</p>`,
    modes: [{ id: 'calm', label: '🐢 慢慢玩', sub: '打拍子慢一點、更寬鬆' }, { id: 'norm', label: '🎵 一般', sub: '正常速度' }],
    modesTitle: '速度',
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${TYPE[LEVELS[n - 1].type][0]} ${lvName(n)}${stLabel(n)}`, short: n => `${n}${TYPE[LEVELS[n - 1].type][0]}` },
    keys: '點樂手開關　<kbd>1</kbd>～<kbd>8</kbd> 樂手　<kbd>空白鍵</kbd>／<kbd>Z</kbd><kbd>X</kbd><kbd>C</kbd>… 敲下面的樂器',
    playing: () => state === 'play' || state === 'finale',
    onPause: () => { audioHeld = true; if (ac) ac.suspend().catch(() => {}); },
    restore: () => { audioHeld = false; if (ac) ac.resume().catch(() => {}); resync(); },
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}

// =====================================================================
// main loop
// =====================================================================
MG.loop(dt => {
  t += dt;
  if (state === 'play' || state === 'finale') schedule();
  // hits that are due now make the musicians move
  const tn = now();
  while (visQ.length && visQ[0].t <= tn) {
    const v = visQ.shift();
    if (v.i < 0) { beatPulse = 1; continue; }
    const s = slots[v.i]; if (!s) continue;
    if (v.hidden) { if (MODE && MODE.hiddenNote) MODE.hiddenNote(v.i); continue; }
    s.h = 1;
    if (v.force) { s.pop = 0.6; s.lead = 0.35; }
    if (Math.random() < 0.55) notes.push({ x: s.cx + (Math.random() - 0.3) * 40 * s.s, y: s.by - 120 * s.s, vx: (Math.random() - 0.5) * 30, vy: -50 - Math.random() * 30, life: 1.1, col: INSTR[s.id].c, r: 6 * s.s });
  }
  if (visQ.length > 400) visQ.splice(0, visQ.length - 400);
  for (const s of slots) { s.h = Math.max(0, s.h - dt * 4); s.pop = Math.max(0, s.pop - dt * 3); s.shake = Math.max(0, s.shake - dt); s.lead = Math.max(0, s.lead - dt); }
  for (const n of notes) { n.x += n.vx * dt + Math.sin(t * 5 + n.y * 0.05) * 0.4; n.y += n.vy * dt; n.life -= dt; }
  notes = notes.filter(n => n.life > 0); if (notes.length > 80) notes.splice(0, notes.length - 80);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  beatPulse = Math.max(0, beatPulse - dt * 3); cardFlash = Math.max(0, cardFlash - dt * 1.5);
  heroT = Math.max(0, heroT - dt); heroJump = Math.max(0, heroJump - dt * 2.5);
  MG.fx.step(dt);
  if (state === 'play' && med && med.wait > 0) { med.wait -= dt; if (med.wait <= 0) nextStage(); }
  else if (state === 'play' && MODE && MODE.update) { MODE.update(dt); }
  if (state === 'play' || state === 'finale') hud();
  if (state === 'finale') { finT -= dt; if (finT <= 0) winPanel(); }
  draw();
});

// =====================================================================
// test hook
// =====================================================================
window.BANDT = {
  get state() { return state; }, get level() { return level; }, get type() { return LV.type; }, get task() { return task; }, levels: LEVELS.length,
  start: (n, m = 'calm') => { mode = m; startLevel(n); MG.hide(); },
  win: () => complete(3, 0), finishNow: () => { if (state === 'finale') finT = 0; },
  active: () => onIds(), slots: () => slots.map(s => ({ id: s.id, on: s.on, hat: s.hat })), toggle: i => press({ x: slots[i].cx, y: slots[i].by - 70 * slots[i].s }),
  solve: () => state === 'play' && MODE && MODE.solve && MODE.solve(), pad: k => MODE && MODE.pad && MODE.pad(k),
  set bot(v) { bot = v; }, get bot() { return bot; }, set speed(v) { speed = v; resync(); },
  at(i) { const s = slots[i], rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + s.cx * (rc.width - 2 * B) / W, y: rc.top + B + (s.by - 70 * s.s) * (rc.height - 2 * B) / H }; },
  padAt(k) { const b = btns[k], rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + (b.x + b.w / 2) * (rc.width - 2 * B) / W, y: rc.top + B + (b.y + b.h / 2) * (rc.height - 2 * B) / H }; },
  audio: () => ({ state: ac ? ac.state : 'none', muted: isMuted(), master: master ? master.gain.value : null }),
  now: () => now() - lat, get step() { return step; }, layout: () => JSON.parse(JSON.stringify(R)),
  get bpm() { return bpm; }, get stage() { return med ? { k: med.k, n: med.base.stages.length, wait: med.wait, type: LV.type } : null },
  skipWait: () => { if (med && med.wait > 0) med.wait = 0.001; },
};
menu();
</script>
