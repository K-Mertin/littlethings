  { k: 'tunnel', nm: '火車大冒險', pcs: 'sc', map: ['..~..MM..', '..~..MM..', '.T~..MM..', '..~..MM..', '..~..MM..', '..~..MM..'], s: [[0, 5, 'N']], t: [[8, 5, 'N']], st: [[4, 2, 'v', 0], [7, 2, 'v', 1]], p: [[1, 0, 0, 'bunny'], [3, 4, 1, 'bear']], tu: [[5, 1, 'W', 6, 4, 'E']], sol: '0.4.s0 0.3.s0 0.2.s0 0.1.s0 0.0.c1 1.0.s1 2.0.s1 3.0.c2 3.1.s0 3.2.s0 3.3.s0 3.4.c0 4.4.c3 4.3.s0 4.1.c1 7.4.c3 7.3.s0 7.1.c1 8.1.c2 8.2.s0 8.3.s0 8.4.s0' },
  { k: 'free', nm: '自由蓋鐵路', pcs: 'scx', free: 1, map: ['..........', '..T....MM.', '......~MM.', '.f....~...', '......~T..', '..........'], s: [[1, 2, 'S', 0, 1]], st: [[4, 0, 'h', 0], [9, 3, 'v', 1], [4, 5, 'h', 2]] },
];
const FREE = LEVELS.length;          // the last one is the sandbox

const TER = { '.': 0, f: 0, '-': 0, '|': 0, L: 0, r: 0, 7: 0, J: 0, '+': 0, T: 1, o: 2, b: 5, '~': 3, M: 4 };
const FIXC = { '-': ['s', 1], '|': ['s', 0], L: ['c', 0], r: ['c', 1], 7: ['c', 2], J: ['c', 3], '+': ['x', 0] };
const blocked = t => t === 1 || t === 2 || t === 4 || t === 5;
// a runtime level: W×H cells, ter (terrain), fix (fixed pieces), user (pieces the kid laid), P (passengers), trains
function buildLevel(def) {
  const H = def.map.length, W = def.map[0].length, N = W * H;
  const L = { W, H, rot: 0, ter: new Array(N).fill(0), flo: new Array(N).fill(false), fix: new Array(N).fill(null), user: new Array(N).fill(null), P: [], trains: [], pcs: def.pcs, count: !!def.count, free: !!def.free, k: def.k, hasTerm: !!(def.t && def.t.length), inv: null };
  const id = (x0, y0) => y0 * W + x0;
  def.map.forEach((row, y0) => [...row].forEach((ch, x0) => { const i = id(x0, y0); L.ter[i] = TER[ch] ?? 0; L.flo[i] = ch === 'f'; if (FIXC[ch]) L.fix[i] = { k: FIXC[ch][0], r: FIXC[ch][1] }; }));
  for (const [x0, y0, d, col = 0, loop = 0] of def.s || []) {
    const dd = ED[d], i = id(x0, y0);
    L.fix[i] = loop ? { k: 'stn', r: dd & 1, col: -1, home: true, start: true } : { k: 'start', d: dd, col };
    L.trains.push({ cell: i, d: dd, col });
  }
  for (const [x0, y0, o, col = null] of def.t || []) L.fix[id(x0, y0)] = { k: 'term', o: ED[o], col };
  for (const [x0, y0, ax, col] of def.st || []) L.fix[id(x0, y0)] = { k: 'stn', r: ax === 'h' ? 1 : 0, col, home: col < 0 };
  for (const [x0, y0, c, a, b] of def.sw || []) L.fix[id(x0, y0)] = { k: 'sw', c: ED[c], a: ED[a], b: ED[b], on: 0 };
  for (const [x1, y1, o1, x2, y2, o2] of def.tu || []) { L.fix[id(x1, y1)] = { k: 'portal', o: ED[o1], to: id(x2, y2) }; L.fix[id(x2, y2)] = { k: 'portal', o: ED[o2], to: id(x1, y1) }; }
  for (const [x0, y0, k, r] of def.u || []) L.user[id(x0, y0)] = { k, r };
  for (const [x0, y0, col, an] of def.p || []) L.P.push({ cell: id(x0, y0), col, an });
  // one known answer (found by the solver below; used for 💡 and checked by the tests)
  L.sol = new Array(N).fill(null); L.solSw = [];
  for (const tk of (def.sol || '').split(' ').filter(Boolean)) {
    const sw = tk[0] === 'S', [a, b, c] = (sw ? tk.slice(1) : tk).split('.');
    if (sw) L.solSw.push([id(+a, +b), +c]); else L.sol[id(+a, +b)] = { k: c[0], r: +c[1] };
  }
  return L;
}
// turn the whole level a quarter turn clockwise (phones in portrait get a tall board)
function rotPiece(p, map) {
  if (!p) return null; const q = { ...p }, R = d => (d + 1) & 3;
  if (p.k === 's' || p.k === 'stn') q.r = p.r ^ 1;
  else if (p.k === 'c') q.r = R(p.r);
  else if (p.k === 'sw') { q.c = R(p.c); q.a = R(p.a); q.b = R(p.b); }
  else if (p.k === 'term' || p.k === 'portal') { q.o = R(p.o); if (p.k === 'portal') q.to = map(p.to); }
  else if (p.k === 'start') q.d = R(p.d);
  return q;
}
function rotLevel(L) {
  const W = L.W, H = L.H, map = i => (i % W) * H + (H - 1 - ((i / W) | 0));
  const mv = (arr, f = v => v) => { const out = new Array(arr.length); arr.forEach((v, i) => { out[map(i)] = f(v); }); return out; };
  L.ter = mv(L.ter); L.flo = mv(L.flo); L.fix = mv(L.fix, p => rotPiece(p, map)); L.user = mv(L.user, p => rotPiece(p, map));
  if (L.sol) { L.sol = mv(L.sol, p => rotPiece(p, map)); L.solSw = L.solSw.map(([i, on]) => [map(i), on]); }
  L.P.forEach(p => { p.cell = map(p.cell); });
  L.trains.forEach(t => { t.cell = map(t.cell); t.d = (t.d + 1) & 3; });
  L.W = H; L.H = W; L.rot = (L.rot + 1) & 3; L.map = map;
  return map;
}
function conns(p) {
  switch (p.k) {
    case 's': case 'stn': return p.r ? [[1, 3]] : [[0, 2]];
    case 'c': return [[p.r, (p.r + 1) & 3]];
    case 'x': return [[0, 2], [1, 3]];
    case 'sw': return [[p.c, p.on ? p.b : p.a], [p.c, p.on ? p.a : p.b]];
    case 'term': return [[p.o, -1]];
    case 'start': return [[p.d, -2]];
    case 'portal': return [[p.o, -3]];
  }
  return [];
}
const edgesOf = p => { const s = new Set(); if (p) for (const [a, b] of conns(p)) { if (a >= 0) s.add(a); if (b >= 0) s.add(b); } return s; };
function exitOf(p, e) {
  switch (p.k) {
    case 'sw': return e === p.c ? (p.on ? p.b : p.a) : (e === p.a || e === p.b) ? p.c : null;   // coming in from a branch always gets through
    case 'term': return e === p.o ? 'STOP' : null;
    case 'start': return e === p.d ? 'STOP' : null;
    case 'portal': return e === p.o ? 'TUNNEL' : null;
  }
  for (const [a, b] of conns(p)) { if (a === e) return b; if (b === e) return a; }
  return null;
}
// one cell forward: where does a train in `cell` heading `d` go next?
function stepTrain(L, T, get) {
  const x0 = T.cell % L.W + DX[T.d], y0 = ((T.cell / L.W) | 0) + DY[T.d];
  if (x0 < 0 || y0 < 0 || x0 >= L.W || y0 >= L.H) return { fail: 'edge', n: -1 };
  const n = y0 * L.W + x0, ein = OPP(T.d), p = get(n);
  if (!p) return { fail: 'gap', n, ein };
  const ex = exitOf(p, ein);
  if (ex == null) return { fail: 'gap', n, ein };
  if (ex === 'STOP') return { n, ein, stop: true };
  if (ex === 'TUNNEL') { const q = get(p.to); return { n, ein, tunnel: true, out: p.to, d: q.o }; }
  return { n, ein, d: ex };
}
// a train reaches the middle of a cell: friends get off (matching colour / 🏠), then waiting friends get on
// PS[pid]: -1 waiting, k = riding train k, -2 home
function arrive(L, ti, cell, PS, get) {
  const ev = [], p = get(cell);
  let col = null, home = false;
  if (p && p.k === 'stn') { if (p.home) home = true; else col = p.col; }
  if (p && p.k === 'term') { if (p.col == null || L.trains.length === 1) home = true; if (p.col != null) col = p.col; }
  L.P.forEach((q, pid) => { if (PS[pid] === ti && ((home && q.col < 0) || (col != null && q.col === col))) { PS[pid] = -2; ev.push({ e: 'drop', pid }); } });
  L.P.forEach((q, pid) => { if (PS[pid] === -1 && q.cell === cell) { PS[pid] = ti; ev.push({ e: 'pick', pid }); } });
  return ev;
}
const termOK = (L, T, p) => p && p.k === 'term' && (p.col == null || p.col === T.col);
function won(L, TR, PS) {
  if (L.free) return false;
  if (PS.some(v => v !== -2)) return false;
  return !L.hasTerm || TR.every(t => t.term);
}
// run the trains cell by cell (the solver checks its answers with this; the game moves smoothly but follows the same rules)
function simulate(L, get, maxSteps = 600, visit = null) {
  const PS = L.P.map(() => -1);
  const TR = L.trains.map(t => ({ cell: t.cell, d: t.d, col: t.col, stop: false, term: false, prev: -1 }));

const MARK = { fix: '🔧', pick: '🐰', color: '🎨', bridge: '🌉', switch: '🔀', tunnel: '⛰️', loop: '🔁', two: '🚂', count: '🧮', cross: '✚', free: '🏗️' };

window.TRT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; },
  levels: LEVELS.length, L: () => L, PS: () => PS.slice(), trains: () => trains.map(T => ({ cell: T.cell, st: T.st, kind: T.kind, t: T.t, term: T.term })),
  start(n, m = 'slow') { mode = m; MG.hide(); startLevel(n); },
  redraw() { dirty = true; resetTrains(); },
  // check a level: the stored answer must win (in both board directions), and the solver must find one on its own
  check(n, rot = 0, limit = 400000) {
    const L2 = buildLevel(lvDef(n)); for (let k = 0; k < rot; k++) rotLevel(L2);
    const keepL = L; L = L2; const ans = knownAnswer(); L = keepL;
    const g = i => ans.place.get(i) || (ans.sw.has(i) ? { ...L2.fix[i], on: ans.sw.get(i) } : L2.fix[i]);
    const stored = simulate(L2, g).win;
    let inv = null; if (L2.count) { inv = { s: 0, c: 0, x: 0 }; for (const q of ans.place.values()) inv[q.k]++; }
    const s = solve(L2, { inv, limit });
    return { stored, solver: s ? simulate(L2, s.get).win : null, nodes: s && s.nodes, pieces: ans.place.size };
  },
  // lay the solver's answer on the board (as if the kid did it)
  applySolution() { const s = knownAnswer(); L.user.fill(null); for (const [i, q] of s.place) L.user[i] = q; for (const [i, on] of s.sw) L.fix[i].on = on; dirty = true; resetTrains(); return true; },
  go: () => go(), hint: () => { showHint(); return hint && { i: hint.i, q: hint.q, sw: hint.sw, go: hint.go }; },
  win: () => winNow(),
  cellXY(i) { const c = cc(i), rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + c.x * (rc.width - 2 * B) / cv.lw, y: rc.top + B + c.y * (rc.height - 2 * B) / cv.lh }; },
  itemXY(id, k) { const b = items.find(it => it.id === id && (k == null || it.k === k)); if (!b) return null; const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + (b.x + b.w / 2) * (rc.width - 2 * B) / cv.lw, y: rc.top + B + (b.y + b.h / 2) * (rc.height - 2 * B) / cv.lh }; },
  user: () => L.user.map(p => p && { ...p }), fixAt: i => L.fix[i] && { ...L.fix[i] },
  layout: () => ({ cs, bx, by, W: L.W, H: L.H, rot: L.rot, W0: cv.lw, H0: cv.lh, tray: trayR, items: items.map(b => ({ id: b.id, k: b.k, x: b.x, y: b.y, w: b.w, h: b.h })) }),
  setSpeed(v) { SPEED.slow = v; SPEED.fast = v; },
};

menu();
MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  for (const p of smoke) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * cs * 0.14; p.life -= dt; p.vy *= Math.pow(0.6, dt); }
  smoke = smoke.filter(p => p.life > 0);
  if (flashT > 0) flashT -= dt;
  if (hint) { hint.t += dt; if (hint.t > 7) hint = null; }
  if (L && state !== 'menu') {
    for (const T of trains) { moveTrain(T, dt); if (T.bump > 0) T.bump -= dt; }
    crashCheck();
    if (state === 'play') freeSpawn(dt);
  }
  stuckAt = stuckAt.filter(s => s.t < 30);
  draw(dt);
});
</script>
