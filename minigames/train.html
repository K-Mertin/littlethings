    const px = h.from.x + (to.x - h.from.x) * f, py = h.from.y + (to.y - h.from.y) * f - Math.sin(f * Math.PI) * cs * 0.5;

    if (sc > 0) drawRider(px, py, cs * (h.kind === 'on' ? 0.15 - 0.04 * f : 0.11 + 0.04 * f) * sc, q.an, q.col, { happy: true, body: h.kind === 'off' && f > 0.9 });
    if (h.kind === 'off' && h.k > 1 && h.k < 1.05) MG.fx.burst(px, py, { n: 8, colors: ['#ff7aa8', '#fff'], shape: 'star', speed: 60, up: 70, size: 4 * cs / 60, grav: 30 });
  }
  hops = hops.filter(h => h.kind === 'on' ? h.k < 1 : h.k < 1.7);
}

// ---------- sandbox: friends keep arriving at the stations ----------
function freeSpawn(dt) {
  if (!L.free) return;
  freeTimer -= dt; if (freeTimer > 0) return;
  freeTimer = 3.5 + Math.random() * 2;
  const waiting = L.P.filter((q, pid) => PS[pid] === -1).length; if (waiting >= 4) return;
  const st = L.fix.map((p, i) => p && p.k === 'stn' ? i : -1).filter(i => i >= 0);
  const from = MG.pick(st), fp = L.fix[from];
  if (L.P.some((q, pid) => PS[pid] === -1 && q.cell === from)) return;
  const dests = st.filter(i => i !== from).map(i => L.fix[i].home ? -1 : L.fix[i].col);
  const col = MG.pick(dests);
  L.P.push({ cell: from, col, an: MG.pick(Object.keys(AN)), free: true }); PS.push(-1);
  MG.sfx('pop'); void fp;
}

// ---------- tray ----------
function drawTray() {
  if (!trayR) return;
  x.fillStyle = 'rgba(255,248,232,.92)'; x.strokeStyle = '#e6cfa2'; x.lineWidth = 2;
  rr(trayR.x, trayR.y, trayR.w, trayR.h, 18); x.fill(); x.stroke();
  const run = running();
  for (const b of items) {
    let on = false, bg = '#fffdf6', edge = '#dcc59a', label = '', ic = '';
    if (b.id === 'pc') { on = brush === b.k && !erase; }
    if (b.id === 'erase') { on = erase; ic = '🧽'; label = '擦掉'; }
    if (b.id === 'reset') { ic = '🔄'; label = '重來'; }
    if (b.id === 'hint') { ic = '💡'; label = '提示'; bg = '#fff3c4'; edge = '#f0c23a'; if (hint && hint.go) on = false; }
    if (b.id === 'var') { ic = '🔀'; label = '換一題'; bg = '#e4f1ff'; edge = '#8db8ea'; on = varAsk > t - 2.5; }
    if (b.id === 'go') {
      const stuck = trains.some(T => T.st === 'stuck' || (T.st === 'done' && !T.term));
      ic = run ? '⏹' : stuck ? '🔁' : '▶'; label = run ? '停' : stuck ? '再試' : '出發';
      bg = run ? '#ff8a80' : '#5fd27a'; edge = run ? '#c0463c' : '#2f9a4c';
    }
    const pulse = (b.id === 'go' && hint && hint.go) ? 1 + Math.sin(t * 10) * 0.05 : 1;
    const fl = flashT > 0 && ((b.id === 'pc' && b.k === flashK) || (b.id === flashK)) ? Math.sin(flashT * 30) * 4 : 0;
    x.save(); x.translate(b.x + b.w / 2 + fl, b.y + b.h / 2); x.scale(pulse, pulse);
    const w = b.w, h = b.h;
    x.fillStyle = 'rgba(120,80,30,.18)'; rr(-w / 2, -h / 2 + 4, w, h, 14); x.fill();
    x.fillStyle = on ? '#ffd23f' : bg; x.strokeStyle = on ? '#d08a00' : edge; x.lineWidth = on ? 3.5 : 2.5;
    rr(-w / 2, -h / 2, w, h, 14); x.fill(); x.stroke();
    if ((run && b.id !== 'go' && b.id !== 'hint') || (run && b.id === 'hint')) { x.fillStyle = 'rgba(255,255,255,.55)'; rr(-w / 2, -h / 2, w, h, 14); x.fill(); }
    if (b.id === 'pc') {
      const s = Math.min(h * 0.78, w * 0.7);
      x.fillStyle = '#a8e486'; x.strokeStyle = '#6fbf52'; x.lineWidth = 1.5; rr(-s / 2, -s / 2, s, s, s * 0.18); x.fill(); x.stroke();
      x.save(); x.beginPath(); x.roundRect(-s / 2, -s / 2, s, s, s * 0.18); x.clip();
      drawTrack(x, 0, 0, s, b.k === 's' ? { k: 's', r: 1 } : b.k === 'c' ? { k: 'c', r: 1 } : { k: 'x' }, 'user');
      x.restore();
      if (L.count) {
        const n = invLeft(b.k), bs = Math.max(18, h * 0.32);
        x.fillStyle = n > 0 ? '#ff6a3d' : '#b9b0a0'; x.strokeStyle = '#fff'; x.lineWidth = 2.5;
        x.beginPath(); x.arc(w / 2 - bs * 0.45, -h / 2 + bs * 0.45, bs * 0.55, 0, 7); x.fill(); x.stroke();
        x.fillStyle = '#fff'; x.font = `900 ${Math.round(bs * 0.6)}px system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(n), w / 2 - bs * 0.45, -h / 2 + bs * 0.47);
      }
    } else if (b.id === 'var') {
      // 🔀 換一題 and, small underneath, which map this is: 第 2/4 題
      const side = w > h * 1.5, fs = Math.round(Math.min(h * (side ? 0.4 : 0.32), 24 * U)), ls = Math.round(Math.min(h * (side ? 0.24 : 0.2), 15 * U)), ss = Math.round(Math.max(10, Math.min(h * 0.17, 12.5 * U)));
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `${fs}px system-ui,"Apple Color Emoji","Noto Color Emoji",sans-serif`; x.fillStyle = '#fff'; x.fillText(ic, side ? -w * 0.24 : 0, side ? 1 : -h * 0.2);
      const lx = side ? w * 0.12 : 0;
      x.font = `800 ${side ? Math.round(ls * 1.15) : ls}px "Noto Sans TC",system-ui,sans-serif`; x.fillStyle = '#2a5a90'; x.fillText(label, lx, side ? -h * 0.13 : h * 0.1);
      x.font = `700 ${ss}px "Noto Sans TC",system-ui,sans-serif`; x.fillStyle = '#5a7fa8'; x.fillText(`第 ${vari + 1}/${nVar(level)} 題`, lx, side ? h * 0.2 : h * 0.33);
    } else {
      const big = b.id === 'go', fs = Math.round(Math.min(h * 0.4, (big ? 30 : 24) * U));
      const side = w > h * 1.5;
      x.textAlign = 'center'; x.textBaseline = 'middle';
      if (b.id === 'go' && !run && ic === '▶') {
        const tr = fs * 0.62, tx0 = side ? -w * 0.18 : 0, ty0 = side ? 0 : -h * 0.12;
        x.fillStyle = '#fff'; x.beginPath(); x.moveTo(tx0 - tr * 0.6, ty0 - tr); x.lineTo(tx0 + tr, ty0); x.lineTo(tx0 - tr * 0.6, ty0 + tr); x.closePath(); x.fill();
      } else { x.font = `${fs}px system-ui,"Apple Color Emoji","Noto Color Emoji",sans-serif`; x.fillStyle = '#fff'; x.fillText(ic, side ? -w * 0.2 : 0, side ? 1 : -h * 0.12); }
      const ls = Math.round(Math.min(h * 0.24, (big ? 20 : 15) * U));
      x.font = `800 ${side ? Math.round(ls * 1.2) : ls}px "Noto Sans TC",system-ui,sans-serif`; x.fillStyle = b.id === 'go' ? '#fff' : '#6a5030';
      x.fillText(label, side ? w * 0.14 : 0, side ? 1 : h * 0.28);
    }
    x.restore();
  }
  if (drag && drag.type === 'tray' && drag.moved) {
    const s = cs * 0.9; x.save(); x.globalAlpha = 0.85; x.translate(drag.x, drag.y - s * 0.3);
    x.fillStyle = 'rgba(168,228,134,.8)'; rr(-s / 2, -s / 2, s, s, s * 0.15); x.fill();
    drawTrack(x, 0, 0, s, drag.k === 's' ? { k: 's', r: 1 } : drag.k === 'c' ? { k: 'c', r: 1 } : { k: 'x' }, 'user'); x.restore();
  }
}

// ---------- floats ----------
function say(p, text, col) { floats.push({ x: p.x, y: p.y, text, col, life: 1.3 }); }
function drawFloats() {
  const W = cv.lw;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    let sz = Math.round(Math.max(18 * U, Math.min(30 * U, cs * 0.34)));
    x.font = `900 ${sz}px system-ui,"Noto Sans TC",sans-serif`;
    const tw = x.measureText(f.text).width;
    const fx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x)), fy = Math.max(sz, f.y - (1.3 - f.life) * 30);
    x.globalAlpha = Math.min(1, f.life * 2.5);
    x.lineWidth = Math.max(3, sz * 0.2); x.strokeStyle = '#fff'; x.strokeText(f.text, fx, fy);
    x.fillStyle = f.col; x.fillText(f.text, fx, fy);
  }
  x.globalAlpha = 1;
}

// ---------- frame ----------
function draw(dt) {
  if (!L) return;
  if (bgDirty || !bgC || bgC.width !== cv.width) drawBg();
  if (dirty || !trC || trC.width !== cv.width) drawTracks();
  const W = cv.lw, H = cv.lh, px = cv._mgScale || 1;
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(bgC, 0, 0); x.restore();
  // shimmering water
  x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = Math.max(1, cs * 0.025); x.lineCap = 'round';
  for (let i = 0; i < L.W * L.H; i++) if (L.ter[i] === 3 || L.ter[i] === 11) {
    const c = cc(i);
    for (let k = 0; k < 2; k++) { const ph = (t * 0.5 + hash(i, k + 30)) % 1, wx = c.x + (hash(i, k + 40) - 0.5) * cs * 0.5, wy = c.y + (ph - 0.5) * cs * 0.8; x.globalAlpha = Math.sin(ph * Math.PI); x.beginPath(); x.arc(wx, wy, cs * 0.08, Math.PI * 1.15, Math.PI * 1.85); x.stroke(); }
  }
  x.globalAlpha = 1;
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(trC, 0, 0); x.restore();
  void px;
  // switches (live): the branch not in use is faded, a green arrow shows the way
  for (let i = 0; i < L.W * L.H; i++) {
    const p = L.fix[i]; if (!p || p.k !== 'sw') continue;
    const c = cc(i);
    const offB = p.on ? p.a : p.b, onB = p.on ? p.b : p.a;
    x.save(); x.globalAlpha = 0.35; drawTrack(x, c.x, c.y, cs, pieceFor(p.c, offB), 'fixed'); x.restore();
    drawTrack(x, c.x, c.y, cs, pieceFor(p.c, onB), 'fixed');
    // lever sign
    const pulse = hint && hint.sw && hint.i === i ? 1 + Math.sin(t * 10) * 0.15 : 1;
    const corner = [0, 1, 2, 3].find(d => d !== p.c && d !== p.a && d !== p.b) ?? 0;
    const sx = c.x + DX[corner] * cs * 0.3, sy = c.y + DY[corner] * cs * 0.3, sr = cs * 0.16 * pulse;
    x.fillStyle = 'rgba(30,40,20,.2)'; x.beginPath(); x.arc(sx + 2, sy + 3, sr, 0, 7); x.fill();
    x.fillStyle = '#fff'; x.strokeStyle = '#2f9a4c'; x.lineWidth = Math.max(2, cs * 0.035); x.beginPath(); x.arc(sx, sy, sr, 0, 7); x.fill(); x.stroke();
    x.save(); x.translate(sx, sy); x.rotate([-Math.PI / 2, 0, Math.PI / 2, Math.PI][onB]);
    x.fillStyle = '#2fb565'; x.beginPath(); x.moveTo(sr * 0.65, 0); x.lineTo(-sr * 0.1, -sr * 0.55); x.lineTo(-sr * 0.1, -sr * 0.22); x.lineTo(-sr * 0.6, -sr * 0.22); x.lineTo(-sr * 0.6, sr * 0.22); x.lineTo(-sr * 0.1, sr * 0.22); x.lineTo(-sr * 0.1, sr * 0.55); x.closePath(); x.fill();
    x.restore();
  }
  drawCars(); drawCrossings(); drawBoats(); drawBridges(); drawGates(); drawButtons();
  // where the train got stuck
  for (const sa of stuckAt) {
    sa.t += dt;
    if (sa.i < 0) continue;
    const c = cc(sa.i), pr = cs * (0.36 + Math.sin(t * 6) * 0.04);
    x.strokeStyle = '#ff5d5d'; x.lineWidth = Math.max(2.5, cs * 0.05); x.setLineDash([cs * 0.1, cs * 0.08]);
    x.beginPath(); x.arc(c.x, c.y, pr, 0, 7); x.stroke(); x.setLineDash([]);
    if (!sa.edge) { x.fillStyle = '#ff5d5d'; x.font = `900 ${Math.round(cs * 0.4)}px system-ui,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('?', c.x, c.y + 1); }
  }
  // hint ghost
  if (hint && hint.q) {
    const c = cc(hint.i), a = 0.5 + Math.sin(t * 8) * 0.3;
    x.save(); x.globalAlpha = a; x.fillStyle = 'rgba(255,230,120,.55)'; rr(c.x - cs / 2 + 2, c.y - cs / 2 + 2, cs - 4, cs - 4, cs * 0.15); x.fill(); x.restore();
    drawTrack(x, c.x, c.y, cs, hint.q, 'ghost', L.ter[hint.i] === 3);
    x.font = `${Math.round(cs * 0.42)}px system-ui,"Apple Color Emoji","Noto Color Emoji",sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('👆', c.x + cs * 0.3, c.y + cs * 0.3 + Math.sin(t * 8) * cs * 0.06);
  }
  // brush preview under the finger is the tray highlight; now the friends and the trains
  for (const c of critters) if (c.k !== 'gull' && c.k !== 'bird' && c.k !== 'fly' && c.k !== 'bfly' && c.k !== 'pop') drawCritter(c);
  drawStars();
  for (const T of trains) drawTrain(T);
  x.save(); x.setTransform(1, 0, 0, 1, 0, 0); x.drawImage(ovC, 0, 0); x.restore();
  drawWaiting();
  drawBubbles();
  drawHops(dt);
  for (const c of critters) if (c.k === 'gull' || c.k === 'bird' || c.k === 'bfly' || c.k === 'pop') drawCritter(c);
  drawGlows();
  for (const c of critters) if (c.k === 'fly') drawCritter(c);
  drawParts();
  // smoke
  for (const p of smoke) {
    const f = p.life / p.max, g = x.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.1, p.x, p.y, p.r);
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.7, 'rgba(240,244,250,.8)'); g.addColorStop(1, 'rgba(220,228,240,0)');
    x.globalAlpha = Math.min(0.8, f * 1.2); x.fillStyle = g; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
  }
  x.globalAlpha = 1;
  MG.fx.draw(x);
  drawFloats();
  drawTray();
  void W; void H;
}

// ---------- menu ----------
function menu() {
  state = 'menu';
  if (!L) { def = lvDef(1); L = buildLevel(def); layout(); resetTrains(); }
  MG.choose({
    id: 'train', title: '火車軌道',
    html: `<p>幫噗噗的小火車蓋鐵路！手指在草地上<b>畫一條線</b>就會鋪好鐵軌，點一下軌道可以<b>轉方向</b>。蓋好按 ▶️，小火車就嘟嘟嘟出發！</p>` +
      `<p>載小動物、送貨物到商店、按按鈕開柵門、放下吊橋、穿山洞、扳轉轍器、兩列火車一起開……每一關都有不一樣的風景：農場、小鎮、海邊、雪地、城市、晚上。沿路還有 ⭐ 星星可以撿！每一關都有好幾張地圖，按 🔀「換一題」就能換一張再玩。開不過去也沒關係，修一修再出發，不會失敗 ^_^</p>`,
    modes: [{ id: 'slow', label: '🐢 慢慢開', sub: '火車開慢一點' }, { id: 'fast', label: '🐇 快快開', sub: '火車開快一點' }],
    modesTitle: '火車開多快？',
    levels: {
      count: LEVELS.length, max: LEVELS.length,
      label: n => `${n}（${lvDef(n).nm}${done.has(n) ? ' ✓' : ''}）`,
      short: n => `${n}${MARK[lvDef(n).k] || ''}${done.has(n) && n !== FREE ? '<small>✓</small>' : ''}`,
    },
    keys: '手指畫線鋪鐵軌、點一下轉方向　電腦：滑鼠拖曳、<kbd>空白鍵</kbd> 出發、<kbd>H</kbd> 提示',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
const MARK = { fix: '🔧', pick: '🐰', color: '🎨', bridge: '🌉', switch: '🔀', tunnel: '⛰️', loop: '🔁', two: '🚂', count: '🧮', cross: '✚', free: '🏗️', cargo: '📦', gate: '🚧', draw: '⛵', chain: '📜', grand: '🎉' };

window.TRT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; },
  levels: LEVELS.length, L: () => L, PS: () => PS.slice(), trains: () => trains.map(T => ({ cell: T.cell, st: T.st, kind: T.kind, t: T.t, term: T.term })),
  start(n, m = 'slow', v = null) { mode = m; MG.hide(); startLevel(n, null, v); },
  get variant() { return vari; }, nVar, swap: () => swapVariant(), varSel: () => ({ ...varSel }),
  redraw() { dirty = true; resetTrains(); },
  // check a level: the stored answer must win (in both board directions), and the solver must find one on its own
  check(n, rot = 0, limit = 400000, v = 0) {
    const L2 = buildLevel(lvDef(n, v)); for (let k = 0; k < rot; k++) rotLevel(L2);
    const keepL = L; L = L2; const ans = knownAnswer(); L = keepL;
    const g = i => ans.place.get(i) || (ans.sw.has(i) ? { ...L2.fix[i], on: ans.sw.get(i) } : L2.fix[i]);
    const stored = simulate(L2, g).win;
    let inv = null; if (L2.count) { inv = { s: 0, c: 0, x: 0 }; for (const q of ans.place.values()) inv[q.k]++; }
    const s = solve(L2, { inv, limit });
    // the empty board (only what the level gives) must not win, and the stars sit on the answer's route
    const empty = simulate(L2, i => L2.fix[i] || L2.user[i]).win, seen = new Set(); simulate(L2, g, 600, i => seen.add(i));
    return { stored, solver: s ? simulate(L2, s.get).win : null, nodes: s && s.nodes, pieces: ans.place.size, empty, stars: L2.stars.length, starsOn: L2.stars.every(i => seen.has(i)) };
  },
  // lay the solver's answer on the board (as if the kid did it)
  applySolution() { const s = knownAnswer(); L.user.fill(null); for (const [i, q] of s.place) L.user[i] = q; for (const [i, on] of s.sw) L.fix[i].on = on; dirty = true; resetTrains(); return true; },
  go: () => go(), hint: () => { showHint(); return hint && { i: hint.i, q: hint.q, sw: hint.sw, go: hint.go }; },
  win: () => winNow(),
  cellXY(i) { const c = cc(i), rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + c.x * (rc.width - 2 * B) / cv.lw, y: rc.top + B + c.y * (rc.height - 2 * B) / cv.lh }; },
  itemXY(id, k) { const b = items.find(it => it.id === id && (k == null || it.k === k)); if (!b) return null; const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + (b.x + b.w / 2) * (rc.width - 2 * B) / cv.lw, y: rc.top + B + (b.y + b.h / 2) * (rc.height - 2 * B) / cv.lh }; },
  user: () => L.user.map(p => p && { ...p }), fixAt: i => L.fix[i] && { ...L.fix[i] },
  layout: () => ({ cs, bx, by, W: L.W, H: L.H, rot: L.rot, W0: cv.lw, H0: cv.lh, tray: trayR, items: items.map(b => ({ id: b.id, k: b.k, x: b.x, y: b.y, w: b.w, h: b.h })) }),
  setSpeed(v) { SPEED.slow = v; SPEED.fast = v; },
  stars: () => ({ all: L.stars.slice(), got: [...gotStars] }), theme: () => L.th,
  world: () => ({ roads: roads.length, cars: roads.reduce((a, r) => a + r.cars.length, 0), xing: xing.length, boats: boats.length, critters: critters.length, parts: parts.length, glows: glows.length, gates: [...gateA.values()], bridges: [...dbA.values()] }),
  toggle: i => toggleSwitch(i), tapCell: i => { const c = cc(i); return { i, ter: L.ter[i], fix: L.fix[i] && L.fix[i].k, xy: c }; },
  propTap: i => propTap(i), free: FREE,
};

menu();
MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  for (const p of smoke) { p.x += p.vx * dt; p.y += p.vy * dt; p.r += dt * cs * 0.14; p.life -= dt; p.vy *= Math.pow(0.6, dt); }
  smoke = smoke.filter(p => p.life > 0);
  if (flashT > 0) flashT -= dt;
  if (hint) { hint.t += dt; if (hint.t > 7) hint = null; }
  if (L && state !== 'menu') {
    for (const T of trains) { moveTrain(T, dt); if (T.bump > 0) T.bump -= dt; }
    crashCheck();
    if (state === 'play') freeSpawn(dt);
  }
  stuckAt = stuckAt.filter(s => s.t < 30);
  if (L && state !== 'menu') stepWorld(dt);
  draw(dt);
});
</script>
