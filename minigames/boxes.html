'use strict';
MG.init({ id: 'boxes', title: '推箱子', stats: ['level', 'moves'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), stageEl = document.getElementById('stage');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ===== ENGINE START (pure rules + solver, no DOM) =====
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
// map chars: # wall · p prop (a wall that looks like a plant / barrel…) · ' ' floor · - outside · . star spot · $ box · * box on star · @ hero · + hero on star · & second hero
// r y b coloured boxes · R Y B coloured star spots · ~ ice · : star spot on ice · O hole · W water (a hole that becomes a stepping stone)
// k key · D door · f fruit · c hidden bonus star (not needed to win) · P button · G gate (open while every button is pressed)
// > v < ^ conveyor arrows · 1 2 3 teleport pairs · o rolling ball
const ARROW = { '>': 0, 'v': 1, '<': 2, '^': 3 };
function parseLevel(rows) {
  const H = rows.length, W = Math.max(...rows.map(r => r.length)), N = W * H;
  const L = { W, H, N, wall: new Uint8Array(N), out: new Uint8Array(N), ice: new Uint8Array(N), goal: new Int8Array(N).fill(-1),
    hole: new Int16Array(N).fill(-1), door: new Int16Array(N).fill(-1), key: new Int16Array(N).fill(-1), fruit: new Int16Array(N).fill(-1),
    arrow: new Int8Array(N).fill(-1), portTo: new Int16Array(N).fill(-1), plate: new Uint8Array(N), gate: new Uint8Array(N), prop: new Uint8Array(N),
    holes: [], wet: [], doors: [], keys: [], fruits: [], goals: [], bc: [], ball: [], h0: [], b0: [], plates: [], gates: [], ports: [], bonus: [] };
  const COL = { r: 1, y: 2, b: 3 }, GCOL = { R: 1, Y: 2, B: 3 }, pend = {};
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = rows[y][x] || '-', p = y * W + x;
    if (ch === '#' || ch === 'p') L.wall[p] = 1;
    if (ch === 'p') L.prop[p] = 1;
    else if (ch === '-') L.out[p] = 1;
    if (ch === '.' || ch === '*' || ch === '+') L.goal[p] = 0;
    if (GCOL[ch]) L.goal[p] = GCOL[ch];
    if (ch === '$' || ch === '*') { L.b0.push(p); L.bc.push(0); L.ball.push(0); }
    if (COL[ch]) { L.b0.push(p); L.bc.push(COL[ch]); L.ball.push(0); }
    if (ch === 'o') { L.b0.push(p); L.bc.push(0); L.ball.push(1); }
    if (ch === '@' || ch === '+') L.h0[0] = p;
    if (ch === '&') L.h0[1] = p;
    if (ch === '~' || ch === ':') L.ice[p] = 1;
    if (ch === ':') L.goal[p] = 0;
    if (ch === 'O' || ch === 'W') { L.hole[p] = L.holes.length; L.holes.push(p); L.wet.push(ch === 'W' ? 1 : 0); }
    if (ch === 'D') { L.door[p] = L.doors.length; L.doors.push(p); }
    if (ch === 'k') { L.key[p] = L.keys.length; L.keys.push(p); }
    if (ch === 'f') { L.fruit[p] = L.fruits.length; L.fruits.push(p); }
    if (ch === 'c') L.bonus.push(p);
    if (ch === 'P') { L.plate[p] = 1; L.plates.push(p); }
    if (ch === 'G') { L.gate[p] = 1; L.gates.push(p); }
    if (ARROW[ch] != null) L.arrow[p] = ARROW[ch];
    if (ch >= '1' && ch <= '3') { if (pend[ch] != null) { L.portTo[p] = pend[ch]; L.portTo[pend[ch]] = p; L.ports.push(pend[ch], p); } else pend[ch] = p; }
  }
  for (let p = 0; p < N; p++) if (L.goal[p] >= 0) L.goals.push(p);
  // floor cells nobody can ever reach (outside the walls) are scenery, not floor — teleports join their two rooms
  const seen = new Uint8Array(N), q = L.h0.slice(); q.forEach(p => seen[p] = 1);
  for (let i = 0; i < q.length; i++) {
    const p = q[i], x = p % W, y = (p / W) | 0;
    const nbs = [0, 1, 2, 3].map(d => { const nx = x + DX[d], ny = y + DY[d]; return nx < 0 || ny < 0 || nx >= W || ny >= H ? -1 : ny * W + nx; });
    if (L.portTo[p] >= 0) nbs.push(L.portTo[p]);
    for (const n of nbs) if (n >= 0 && !seen[n] && !L.wall[n] && !L.out[n]) { seen[n] = 1; q.push(n); }
  }
  for (let p = 0; p < N; p++) if (!L.wall[p] && !seen[p]) L.out[p] = 1;
  L.kind = { color: L.bc.some(c => c > 0), ice: L.ice.some(Boolean), hole: L.wet.some(w => !w), key: L.keys.length > 0, two: L.h0.length > 1, fruit: L.fruits.length > 0,
    water: L.wet.some(Boolean), plate: L.plates.length > 0, arrow: L.arrow.some(a => a >= 0), port: L.ports.length > 0, ball: L.ball.some(Boolean) };
  return L;
}
const initState = L => ({ h: L.h0.slice(), b: L.b0.slice(), f: 0, k: 0, d: 0, e: 0, kh: 0 });
const cloneS = s => ({ h: s.h.slice(), b: s.b.slice(), f: s.f, k: s.k, d: s.d, e: s.e, kh: s.kh });
function stepCell(L, p, d) { const x = p % L.W + DX[d], y = ((p / L.W) | 0) + DY[d]; return x < 0 || y < 0 || x >= L.W || y >= L.H ? -1 : y * L.W + x; }
const boxAt = (s, p) => s.b.indexOf(p);
const holeOpen = (L, s, p) => L.hole[p] >= 0 && !(s.f >> L.hole[p] & 1);
const doorShut = (L, s, p) => L.door[p] >= 0 && !(s.d >> L.door[p] & 1);
// the gates are open while every button has a box or a hero standing on it
function gateOpen(L, s) { for (const p of L.plates) if (!s.b.includes(p) && !s.h.includes(p)) return false; return true; }
const gateShut = (L, s, p) => L.gate[p] === 1 && !gateOpen(L, s);
// can a box move onto p (an open hole counts: the box drops in)
function boxFree(L, s, p) {
  if (p < 0 || L.wall[p] || L.out[p] || s.b.includes(p) || s.h.includes(p) || doorShut(L, s, p) || gateShut(L, s, p)) return false;
  if (L.key[p] >= 0 && !(s.k >> L.key[p] & 1)) return false;
  if (L.fruit[p] >= 0 && !(s.e >> L.fruit[p] & 1)) return false;
  return true;
}
// a pushed box (bi) has just reached b going d: holes swallow it, teleports send it on, ice / balls keep it going, arrows carry it
function travel(L, ns, bi, b, d, ev) {
  // (a box that came out of a teleport pops one more step out of the door, so the way stays clear)
  const path = [b]; let tele = false, guard = 0;
  for (;;) {
    if (holeOpen(L, ns, b)) { ns.f |= 1 << L.hole[b]; ev.fill = L.hole[b]; ev.path = path; return -1; }
    if (!tele && L.portTo[b] >= 0 && boxFree(L, ns, L.portTo[b])) { b = L.portTo[b]; path.push(b); ev.tj = path.length; tele = true; continue; }
    const nd = L.arrow[b] >= 0 ? L.arrow[b] : (L.ball[bi] || L.ice[b] || tele) ? d : -1;
    if (nd < 0) break;
    const nb = stepCell(L, b, nd);
    if (!boxFree(L, ns, nb)) break;
    b = nb; d = nd; path.push(b); tele = false;
    if (++guard > 80) break;
  }
  ev.path = path; return b;
}
// one step of hero hi in direction d → { s, push, path, tj, fill, key, door, fruit, tele } or { fail: reason }
function move(L, s, hi, d) {
  const p = s.h[hi], n = stepCell(L, p, d);
  if (n < 0 || L.wall[n] || L.out[n]) return { fail: 'wall' };
  if (holeOpen(L, s, n)) return { fail: L.wet[L.hole[n]] ? 'water' : 'hole' };
  if (s.h.includes(n)) return { fail: 'hero' };
  const bi = boxAt(s, n);
  if (bi < 0 && gateShut(L, s, n)) return { fail: 'gate' };
  const ns = cloneS(s), ev = { s: ns, push: -1, path: null, tj: -1, fill: -1, key: false, door: false, fruit: false, tele: null };
  if (doorShut(L, s, n)) { if (!s.kh) return { fail: 'door' }; ns.kh--; ns.d |= 1 << L.door[n]; ev.door = true; }
  if (bi >= 0) {
    const b = stepCell(L, n, d);
    if (!boxFree(L, ns, b)) return { fail: 'box' };
    ns.b[bi] = travel(L, ns, bi, b, d, ev);
    ev.push = bi;
  }
  ns.h[hi] = n;
  const q = L.portTo[n];
  if (q >= 0 && !ns.h.includes(q) && !ns.b.includes(q)) { ns.h[hi] = q; ev.tele = [n, q]; }
  const m = ns.h[hi];
  if (L.key[m] >= 0 && !(ns.k >> L.key[m] & 1)) { ns.k |= 1 << L.key[m]; ns.kh++; ev.key = true; }
  if (L.fruit[m] >= 0 && !(ns.e >> L.fruit[m] & 1)) { ns.e |= 1 << L.fruit[m]; ev.fruit = true; }
  return ev;
}
function goalOK(L, s, g) { const bi = s.b.indexOf(g); return bi >= 0 && (L.goal[g] === 0 || L.goal[g] === L.bc[bi]); }
function isWon(L, s) { return L.goals.every(g => goalOK(L, s, g)) && s.e === (1 << L.fruits.length) - 1; }
function stateKey(L, s) {
  // heroes, then every box as kind·256 + cell (sorted: two boxes of one kind are the same), then the small masks
  const b = s.b.map((p, i) => (L.bc[i] + 4 * L.ball[i]) * 256 + p + 1).sort((a, c) => a - c);
  return String.fromCharCode(...s.h, 0, ...b, 0, s.f, s.k, s.d, s.e, s.kh);
}
// breadth-first search over every move → the shortest list of [hero, dir] that wins (null = no way; .full tells if the search finished)
function solve(L, s0, limit = 400000) {
  const seen = new Map(), st = [s0], par = [-1], mv = [-1];
  seen.set(stateKey(L, s0), 0);
  if (isWon(L, s0)) return Object.assign([], { full: true, nodes: 1 });
  for (let i = 0; i < st.length; i++) {
    if (st.length > limit) return { none: true, full: false, nodes: st.length };
    const s = st[i];
    for (let hi = 0; hi < s.h.length; hi++) for (let d = 0; d < 4; d++) {
      const r = move(L, s, hi, d); if (r.fail) continue;
      // a box stuck in a corner that is not on a star can never come out
      if (r.push >= 0 && r.s.b[r.push] >= 0 && deadCorner(L, r.s, r.s.b[r.push], r.push)) continue;
      const k = stateKey(L, r.s); if (seen.has(k)) continue;
      seen.set(k, st.length); st.push(r.s); par.push(i); mv.push(hi * 4 + d);
      if (isWon(L, r.s)) {
        const out = []; for (let j = st.length - 1; j > 0; j = par[j]) out.push([mv[j] >> 2, mv[j] & 3]);
        return Object.assign(out.reverse(), { full: true, nodes: st.length });
      }
    }
  }
  return { none: true, full: true, nodes: st.length };
}
// a box in a wall corner that is not on a fitting star is lost (doors / fruit / keys / gates are not walls: they can open or go away)
function deadCorner(L, s, p, bi) {
  if (L.goal[p] >= 0 && (L.goal[p] === 0 || L.goal[p] === L.bc[bi])) return false;
  // a spare box (more boxes than stars, used for holes or buttons) may be parked anywhere → only prune when it's needed
  if (s.b.length > L.goals.length) return false;
  const solid = c => c < 0 || L.wall[c] || L.out[c];
  const w = [0, 1, 2, 3].map(d => solid(stepCell(L, p, d)));
  return (w[0] || w[2]) && (w[1] || w[3]);
}
// ===== ENGINE END =====

  for (let i = 0; i < happyT.length; i++) happyT[i] = Math.max(0, happyT[i] - dt * 1.6);
  for (const f of floats) { f.life -= dt; f.y -= dt * 30; } floats = floats.filter(f => f.life > 0);
  if (hint) { hint.t += dt; if (hint.t > 6) hint = null; }
  if (stuckT > 0) stuckT -= dt;
  if (pressT > 0) pressT -= dt;
  if (gateT > 0) gateT = Math.max(0, gateT - dt);
  for (const f of friends) if (f.happy > 0) f.happy = Math.max(0, f.happy - dt);
  for (const c of critters) if (c.jump > 0) c.jump = Math.max(0, c.jump - dt);
  for (const d of decor) { if (d.wig > 0) d.wig = Math.max(0, d.wig - dt); if (d.peek > 0) d.peek = Math.max(0, d.peek - dt); }
  stepAmbient(dt);
  if (state === 'won') winT += dt;
  draw();
});
</script>
