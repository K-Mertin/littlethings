'use strict';
MG.init({ id: 'boxes', title: '推箱子', stats: ['level', 'moves'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), stageEl = document.getElementById('stage');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ===== ENGINE START (pure rules + solver, no DOM) =====
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
// map chars: # wall · ' ' floor · - outside · . star spot · $ box · * box on star · @ hero · + hero on star · & second hero
// r y b coloured boxes · R Y B coloured star spots · ~ ice · : star spot on ice · O hole · k key · D door · f fruit
function parseLevel(rows) {
  const H = rows.length, W = Math.max(...rows.map(r => r.length)), N = W * H;
  const L = { W, H, N, wall: new Uint8Array(N), out: new Uint8Array(N), ice: new Uint8Array(N), goal: new Int8Array(N).fill(-1),
    hole: new Int16Array(N).fill(-1), door: new Int16Array(N).fill(-1), key: new Int16Array(N).fill(-1), fruit: new Int16Array(N).fill(-1),
    holes: [], doors: [], keys: [], fruits: [], goals: [], bc: [], h0: [], b0: [] };
  const COL = { r: 1, y: 2, b: 3 }, GCOL = { R: 1, Y: 2, B: 3 };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = rows[y][x] || '-', p = y * W + x;
    if (ch === '#') L.wall[p] = 1;
    else if (ch === '-') L.out[p] = 1;
    if (ch === '.' || ch === '*' || ch === '+') L.goal[p] = 0;
    if (GCOL[ch]) L.goal[p] = GCOL[ch];
    if (ch === '$' || ch === '*') { L.b0.push(p); L.bc.push(0); }
    if (COL[ch]) { L.b0.push(p); L.bc.push(COL[ch]); }
    if (ch === '@' || ch === '+') L.h0[0] = p;
    if (ch === '&') L.h0[1] = p;
    if (ch === '~' || ch === ':') L.ice[p] = 1;
    if (ch === ':') L.goal[p] = 0;
    if (ch === 'O') { L.hole[p] = L.holes.length; L.holes.push(p); }
    if (ch === 'D') { L.door[p] = L.doors.length; L.doors.push(p); }
    if (ch === 'k') { L.key[p] = L.keys.length; L.keys.push(p); }
    if (ch === 'f') { L.fruit[p] = L.fruits.length; L.fruits.push(p); }
  }
  for (let p = 0; p < N; p++) if (L.goal[p] >= 0) L.goals.push(p);
  // floor cells nobody can ever reach (outside the walls) are scenery, not floor
  const seen = new Uint8Array(N), q = L.h0.slice(); q.forEach(p => seen[p] = 1);
  for (let i = 0; i < q.length; i++) { const p = q[i], x = p % W, y = (p / W) | 0; for (let d = 0; d < 4; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const n = ny * W + nx; if (!seen[n] && !L.wall[n] && !L.out[n]) { seen[n] = 1; q.push(n); } } }
  for (let p = 0; p < N; p++) if (!L.wall[p] && !seen[p]) L.out[p] = 1;
  L.kind = { color: L.bc.some(c => c > 0), ice: L.ice.some(Boolean), hole: L.holes.length > 0, key: L.keys.length > 0, two: L.h0.length > 1, fruit: L.fruits.length > 0 };
  return L;
}
const initState = L => ({ h: L.h0.slice(), b: L.b0.slice(), f: 0, k: 0, d: 0, e: 0, kh: 0 });
const cloneS = s => ({ h: s.h.slice(), b: s.b.slice(), f: s.f, k: s.k, d: s.d, e: s.e, kh: s.kh });
function stepCell(L, p, d) { const x = p % L.W + DX[d], y = ((p / L.W) | 0) + DY[d]; return x < 0 || y < 0 || x >= L.W || y >= L.H ? -1 : y * L.W + x; }
const boxAt = (s, p) => s.b.indexOf(p);
const holeOpen = (L, s, p) => L.hole[p] >= 0 && !(s.f >> L.hole[p] & 1);
const doorShut = (L, s, p) => L.door[p] >= 0 && !(s.d >> L.door[p] & 1);
// can a box move onto p (an open hole counts: the box drops in)
function boxFree(L, s, p) {
  if (p < 0 || L.wall[p] || L.out[p] || s.b.includes(p) || s.h.includes(p) || doorShut(L, s, p)) return false;
  if (L.key[p] >= 0 && !(s.k >> L.key[p] & 1)) return false;
  if (L.fruit[p] >= 0 && !(s.e >> L.fruit[p] & 1)) return false;
  return true;
}
// one step of hero hi in direction d → { s, push, path, fill, key, door, fruit } or { fail: reason }
function move(L, s, hi, d) {
  const p = s.h[hi], n = stepCell(L, p, d);
  if (n < 0 || L.wall[n] || L.out[n]) return { fail: 'wall' };
  if (holeOpen(L, s, n)) return { fail: 'hole' };
  if (s.h.includes(n)) return { fail: 'hero' };
  const ns = cloneS(s), ev = { s: ns, push: -1, path: null, fill: -1, key: false, door: false, fruit: false };
  if (doorShut(L, s, n)) { if (!s.kh) return { fail: 'door' }; ns.kh--; ns.d |= 1 << L.door[n]; ev.door = true; }
  const bi = boxAt(s, n);
  if (bi >= 0) {
    let b = stepCell(L, n, d);
    if (!boxFree(L, ns, b)) return { fail: 'box' };
    const path = [b];
    if (holeOpen(L, ns, b)) { ns.f |= 1 << L.hole[b]; ns.b[bi] = -1; ev.fill = L.hole[b]; }
    else {
      while (L.ice[b]) { const nb = stepCell(L, b, d); if (!boxFree(L, ns, nb)) break; b = nb; path.push(b); if (holeOpen(L, ns, b)) { ns.f |= 1 << L.hole[b]; ev.fill = L.hole[b]; b = -1; break; } }
      ns.b[bi] = b;
    }
    ev.push = bi; ev.path = path;
  }
  ns.h[hi] = n;
  if (L.key[n] >= 0 && !(ns.k >> L.key[n] & 1)) { ns.k |= 1 << L.key[n]; ns.kh++; ev.key = true; }
  if (L.fruit[n] >= 0 && !(ns.e >> L.fruit[n] & 1)) { ns.e |= 1 << L.fruit[n]; ev.fruit = true; }
  return ev;
}
function goalOK(L, s, g) { const bi = s.b.indexOf(g); return bi >= 0 && (L.goal[g] === 0 || L.goal[g] === L.bc[bi]); }
function isWon(L, s) { return L.goals.every(g => goalOK(L, s, g)) && s.e === (1 << L.fruits.length) - 1; }
function stateKey(L, s) {
  // heroes, then every box as colour·256 + cell (sorted: two boxes of one colour are the same), then the small masks
  const b = s.b.map((p, i) => L.bc[i] * 256 + p + 1).sort((a, c) => a - c);
  return String.fromCharCode(...s.h, 0, ...b, 0, s.f, s.k, s.d, s.e, s.kh);
}
// breadth-first search over every move → the shortest list of [hero, dir] that wins (null = no way; .full tells if the search finished)
function solve(L, s0, limit = 400000) {
  const seen = new Map(), st = [s0], par = [-1], mv = [-1];
  seen.set(stateKey(L, s0), 0);
  if (isWon(L, s0)) return Object.assign([], { full: true, nodes: 1 });
  for (let i = 0; i < st.length; i++) {
    if (st.length > limit) return { none: true, full: false, nodes: st.length };
    const s = st[i];
    for (let hi = 0; hi < s.h.length; hi++) for (let d = 0; d < 4; d++) {
      const r = move(L, s, hi, d); if (r.fail) continue;
      // a box stuck in a corner that is not on a star can never come out
      if (r.push >= 0 && r.s.b[r.push] >= 0 && deadCorner(L, r.s, r.s.b[r.push], r.push)) continue;
      const k = stateKey(L, r.s); if (seen.has(k)) continue;
      seen.set(k, st.length); st.push(r.s); par.push(i); mv.push(hi * 4 + d);
      if (isWon(L, r.s)) {
        const out = []; for (let j = st.length - 1; j > 0; j = par[j]) out.push([mv[j] >> 2, mv[j] & 3]);
        return Object.assign(out.reverse(), { full: true, nodes: st.length });
      }
    }
  }
  return { none: true, full: true, nodes: st.length };
}
// a box in a wall corner that is not on a fitting star is lost (doors / fruit / keys are not walls: they can open or go away)
function deadCorner(L, s, p, bi) {
  if (L.goal[p] >= 0 && (L.goal[p] === 0 || L.goal[p] === L.bc[bi])) return false;
  // a spare box (more boxes than stars, used for holes) may be parked anywhere once every star is matched → only prune when it's needed
  if (s.b.length > L.goals.length) return false;
  const solid = c => c < 0 || L.wall[c] || L.out[c];
  const w = [0, 1, 2, 3].map(d => solid(stepCell(L, p, d)));
  return (w[0] || w[2]) && (w[1] || w[3]);
}
// ===== ENGINE END =====

const PL = LEVELS.map(lv => parseLevel(lv.m));
// the same level turned on its side (x ↔ y), so a wide room can fill a tall phone screen and the other way round.
// lists keep their order, so the hole / door / key / fruit bits of a state stay the same.
const mapP = (F, p) => p < 0 ? -1 : (p % F.W) * F.H + ((p / F.W) | 0);
function transposeL(F) {
  const T = { W: F.H, H: F.W, N: F.N, bc: F.bc, kind: F.kind };
  for (const k of ['wall', 'out', 'ice', 'goal', 'hole', 'door', 'key', 'fruit']) { const a = new F[k].constructor(F.N); for (let p = 0; p < F.N; p++) a[mapP(F, p)] = F[k][p]; T[k] = a; }
  for (const k of ['holes', 'doors', 'keys', 'fruits', 'h0', 'b0']) T[k] = F[k].map(p => mapP(F, p));
  T.goals = []; for (let p = 0; p < T.N; p++) if (T.goal[p] >= 0) T.goals.push(p);
  return T;

});

  U = Math.max(0.9, Math.min(1.35, Math.min(W, H) / 560)) * MG.textScale;

  const two = L.kind.two, g = 10;
  let A;

    panelR = { x: W - PW - 8, y: 8, w: PW, h: H - 16 };
    const px = panelR.x + 14, pw = PW - 28;
    info = { x: px, y: panelR.y + 12, w: pw, h: Math.round(Math.min(150, H * 0.22)) };
    const s = Math.round(Math.max(56, Math.min(84, (H - info.h - 60) / 6.2, pw / 3.3)));
    const bh = Math.round(Math.max(54, Math.min(70, s * 0.9))), by = info.y + info.h + 12, bw = (pw - g) / 2;
    btns.push({ id: 'undo', label: '↩️ 復原', x: px, y: by, w: bw, h: bh }, { id: 'reset', label: '🔄 重來', x: px + bw + g, y: by, w: bw, h: bh });
    if (two) btns.push({ id: 'hint', label: '💡 提示', x: px, y: by + bh + g, w: bw, h: bh }, { id: 'swap', label: '👥 換人', x: px + bw + g, y: by + bh + g, w: bw, h: bh });
    else btns.push({ id: 'hint', label: '💡 提示', x: px, y: by + bh + g, w: pw, h: bh });
    const top = by + 2 * bh + g + 14, avail = panelR.y + panelR.h - top - 10, ps = Math.round(Math.min(s, (avail - 8) / 3));
    mkPad(panelR.x + PW / 2, top + avail / 2, ps);
    A = { x: 10, y: 10, w: panelR.x - 18, h: H - 20 };
  } else {
    const s = Math.round(Math.max(54, Math.min(86, W * 0.16, H * 0.085)));
    const ch = s * 3 + 8 + 16, cy = H - ch / 2 - 6;

  S.h.forEach((p, i) => { const at = heroXY(i); items.push({ y: at.y - cs / 2 + 0.3, f: () => drawHero(i) }); });
  items.sort((a, b) => a.y - b.y).forEach(it => it.f());
  drawHint();
  MG.fx.draw(x);
  for (const f of floats) {
    x.globalAlpha = Math.max(0, Math.min(1, f.life * 2.5));
    const fs = Math.round(Math.min(Math.max(18, cs * 0.42), 36) * (f.big || 1)); x.font = `900 ${fs}px ${FONT}`;
    const hw = x.measureText(f.text).width / 2 + 6; txt(f.text, Math.max(hw, Math.min(W - hw, f.x)), Math.max(fs, f.y), fs, f.col || '#ff7a00', 'center', 900, '#fff', Math.max(4, fs * 0.22));
  }
  x.globalAlpha = 1;
  // controls
  for (const b of btns) {
    if (b.id === 'undo') drawButton(b, b.label, '#ffffff', '#ffe9c2', '#c98a3a', hist.length > 0, stuckT > 0);
    else if (b.id === 'reset') drawButton(b, b.label, '#ffffff', '#ffd9e3', '#c0507e', moves > 0 || hist.length > 0);
    else if (b.id === 'hint') drawButton(b, b.label, '#fff3a8', '#ffcf3a', '#c98a00', state === 'play');
    else if (b.id === 'swap') drawButton(b, b.label, act ? '#d6f5d0' : '#ffe0ec', act ? '#7fd88f' : '#ff9cc2', act ? '#2f9a48' : '#c0507e', state === 'play');
  }
  drawPad(th);
  drawInfo(th);
}

// say: short English + emoji words floating up from a spot
function say(at, text, col) { floats = floats.filter(f => Math.hypot(f.x - at.x, f.y0 - at.y) > 4); floats.push({ x: at.x, y: at.y - cs * 0.6, y0: at.y, text, col, life: 1.2 }); }

// ---------- menu ----------
function lvLabel(n) { const st = stars()[n] || 0, k = kindsOf(n); return `${n} ${k.length ? k.map(q => q[1]).join('') : THEMES[LEVELS[n - 1].th].ic} ${LEVELS[n - 1].nm}${st ? '　' + '⭐'.repeat(st) : ''}`; }
function menu() {
  state = 'menu';
  MG.choose({
    id: 'boxes', title: '推箱子',
    html: `<p>幫噗噗把箱子推到 ⭐ 星星上！<b>滑一下</b>、<b>點旁邊的格子</b>或按<b>方向鍵</b>就會走一步，走到箱子就會推它。</p>` +
      `<p>推錯了沒關係，按 ↩️ 復原想退幾步都可以，卡住了就按 💡 提示 ^_^</p>` +
      `<p>後面有 🎨 彩色禮物、🧊 滑溜溜的冰、🕳️ 地洞、🔑 鑰匙門、👥 兩個好朋友、🍓 撿水果！</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: lvLabel, short: n => `${n}${markOf(n)}${(stars()[n] || 0) === 3 ? '' : ''}` },
    keys: '滑一下／點格子／方向鍵走路　<kbd>Z</kbd> 復原　<kbd>R</kbd> 重來　<kbd>H</kbd> 提示　<kbd>Tab</kbd> 換人',
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
// a level behind the start panel
level = Math.min(LEVELS.length, MG.store.get('boxes.pickLevel', 1)); L = PL[level - 1]; S = initState(L); happyT = L.b0.map(() => 0); layout();
menu();

// small hook for automated tests
window.BOXT = {
  get state() { return state; }, get level() { return level; }, get moves() { return moves; }, get act() { return act; }, get anim() { return !!anim; }, get turned() { return L === PLT[level - 1]; },
  count: LEVELS.length, mins: LEVELS.map(l => l.min), maps: LEVELS.map(l => l.m), kinds: n => Object.keys(PL[n - 1].kind).filter(k => PL[n - 1].kind[k]),
  st: () => JSON.parse(JSON.stringify(S)), won: () => isWon(L, S), floats: () => floats.map(f => f.text),
  start(n) { MG.hide(); startLevel(n); MG.hide(); },
  solveLevel(n, limit = 2e6) { const P = PL[n - 1], r = solve(P, initState(P), limit); return r.none ? null : r.map(m => m.slice()); },
  solveNow: () => { const r = solve(L, S, 2e6); return r.none ? null : r.map(m => m.slice()); },
  move: (d, hi) => { if (hi != null && hi !== act) swapHero(hi); return tryMove(d); }, finish: () => { while (anim) finishAnim(); },
  swap: i => swapHero(i), hint: () => { showHint(); }, get hintObj() { return hint && { hi: hint.hi, steps: hint.steps.map(q => [q.hi, q.d]), push: hint.push }; }, get stuck() { return stuckT > 0; },
  win() { const p = solve(L, S, 2e6); if (p.none) return false; for (const [hi, d] of p) { if (hi !== act) swapHero(hi); tryMove(d); finishAnim(); } return isWon(L, S); },
  undo: () => undo(), restart: () => restart(),
  dims: () => ({ W, H, cs, ox, oy, land, btns: btns.map(b => ({ ...b })), pad: pad.map(b => ({ ...b })) }),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  cellClient(p) { return this.toClient(cellX(p) + cs / 2, cellY(p) + cs / 2); },
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  if (anim) { anim.t += dt; if (anim.t >= Math.max(anim.dur, anim.boxDur || 0)) finishAnim(); }
  if (bump) { bump.t -= dt; if (bump.t <= 0) bump = null; }
  if (bumpBox) { bumpBox.t -= dt; if (bumpBox.t <= 0) bumpBox = null; }
  for (let i = 0; i < 2; i++) squashT[i] = Math.max(0, squashT[i] - dt);
  for (let i = 0; i < happyT.length; i++) happyT[i] = Math.max(0, happyT[i] - dt * 1.6);
  for (const f of floats) { f.life -= dt; f.y -= dt * 30; } floats = floats.filter(f => f.life > 0);
  if (hint) { hint.t += dt; if (hint.t > 6) hint = null; }
  if (stuckT > 0) stuckT -= dt;
  if (pressT > 0) pressT -= dt;
  if (state === 'won') winT += dt;
  draw();
});
</script>
</body>
