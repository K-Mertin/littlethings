<script>
'use strict';
MG.init({ id: 'clock', title: '噗噗認時鐘', stats: ['level', 'round'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, k) => a + (b - a) * k, ease = k => k * k * (3 - 2 * k);
// colour code: the short hour hand is orange, the long minute hand is blue (digits on the digital clocks too)
const HC = ['#ffd2b0', '#ff8a3d', '#e8641c', '#a8420c'];
const MC = ['#c4dbff', '#4a86ff', '#2a5fd6', '#173e94'];
const HDIG = '#ffa25c', MDIG = '#86b8ff';
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const NUMF = 'ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Varela Round","Noto Sans TC",system-ui,sans-serif';

// ---------- 噗噗's day ----------
// win: [from, to] in minutes after midnight; per: 0 morning 🌅 · 1 noon ☀️ · 2 afternoon 🌤️ · 3 night 🌙
const ACT = {
  wake: { nm: '起床', win: [360, 450], per: 0 },
  breakfast: { nm: '吃早餐', win: [420, 510], per: 0 },
  school: { nm: '上學', win: [480, 570], per: 0 },
  lunch: { nm: '吃午餐', win: [690, 765], per: 1 },
  nap: { nm: '睡午覺', win: [780, 870], per: 2 },
  play: { nm: '去公園玩', win: [900, 1005], per: 2 },
  dinner: { nm: '吃晚餐', win: [1080, 1140], per: 3 },
  bath: { nm: '洗澎澎', win: [1140, 1200], per: 3 },
  bed: { nm: '睡覺', win: [1200, 1260], per: 3 },
};
const ORDER = Object.keys(ACT);
const TYPE = {
  set: { nm: '轉轉時鐘', ic: '🕐', mk: '' },
  pick: { nm: '找找時鐘', ic: '👀', mk: '👀' },
  dset: { nm: '電子鐘', ic: '🔢', mk: '🔢' },
  match: { nm: '配對連連看', ic: '🔗', mk: '🔗' },
  order: { nm: '排排一天', ic: '📅', mk: '📅' },
  sky: { nm: '太陽在哪裡', ic: '🌞', mk: '🌞' },
  cuckoo: { nm: '咕咕鐘', ic: '🐦', mk: '🐦' },
  tour: { nm: '噗噗的一天', ic: '🎠', mk: '🎠' },
  what: { nm: '這時候做什麼', ic: '🖼️', mk: '🖼️' },
  later: { nm: '過一會兒', ic: '⏩', mk: '⏩' },
  pie: { nm: '時鐘披薩', ic: '🍕', mk: '🍕' },
  sand: { nm: '沙漏比比看', ic: '⏳', mk: '⏳' },
  mix: { nm: '時鐘大挑戰', ic: '🏆', mk: '🏆' },
};
const STEPN = { 60: '整點', 30: '半點', 15: '一刻', 5: '5 分鐘' };
// t: level type · s: minute step (60 = o'clock only, 30 = half past, 15 = quarters, 5 = five minutes) · n: rounds · k: items · max: cuckoo count
// (append only: saved stars are keyed by level number)
const LEVELS = [
  { t: 'set', s: 60, n: 3 }, { t: 'pick', s: 60, n: 4 }, { t: 'set', s: 60, n: 4 }, { t: 'sky', s: 60, n: 4 }, { t: 'cuckoo', s: 60, n: 3, max: 5 },
  { t: 'order', s: 60, n: 2, k: 3 }, { t: 'match', s: 60, n: 2, k: 3 }, { t: 'set', s: 30, n: 4 }, { t: 'pick', s: 30, n: 5 }, { t: 'tour', s: 60, n: 1, k: 5 },
  { t: 'cuckoo', s: 60, n: 4, max: 12 }, { t: 'dset', s: 60, n: 4 }, { t: 'match', s: 30, n: 2, k: 3 }, { t: 'set', s: 30, n: 5 }, { t: 'order', s: 30, n: 2, k: 4 },
  { t: 'sky', s: 30, n: 4 }, { t: 'dset', s: 30, n: 4 }, { t: 'set', s: 15, n: 4 }, { t: 'pick', s: 15, n: 5 }, { t: 'match', s: 15, n: 2, k: 4 },
  { t: 'tour', s: 30, n: 1, k: 6 }, { t: 'dset', s: 15, n: 4 }, { t: 'order', s: 15, n: 2, k: 4 }, { t: 'set', s: 5, n: 4 }, { t: 'pick', s: 5, n: 5 },
  { t: 'sky', s: 15, n: 4 }, { t: 'match', s: 5, n: 2, k: 4 }, { t: 'dset', s: 5, n: 4 }, { t: 'order', s: 5, n: 2, k: 5 }, { t: 'set', s: 5, n: 6 },
  // 31–40：新玩法（每種先從簡單的整點／半點開始），最後三關是混合大挑戰
  { t: 'what', s: 60, n: 4 }, { t: 'later', s: 60, n: 4 }, { t: 'pie', s: 30, n: 4 }, { t: 'sand', s: 60, n: 3, k: 3 }, { t: 'what', s: 30, n: 5 },
  { t: 'later', s: 30, n: 5 }, { t: 'pie', s: 15, n: 5 },
  { t: 'mix', s: 30, seq: ['what', 'later', 'pie', 'sand', 'set'] },
  { t: 'mix', s: 15, seq: ['pie', 'later', 'what', 'dset', 'sand', 'match'] },
  { t: 'mix', s: 5, seq: ['what', 'pie', 'later', 'sand', 'pick', 'set'] },
];
LEVELS.forEach(L => { if (L.seq) L.n = L.seq.length; });
const SUBN = { later: { 60: '+1 小時', 30: '+30 分', 15: '+15 分', 5: '+10 分' }, sand: { 60: '差很多', 30: '差一些', 15: '差一點', 5: '差一點點' }, mix: { 30: '半點', 15: '一刻', 5: '終極' } };
const lvName = n => { const L = LEVELS[n - 1]; return `${TYPE[L.t].ic} ${TYPE[L.t].nm}・${L.t === 'cuckoo' ? `數到 ${L.max}` : (SUBN[L.t] || STEPN)[L.s]}`; };
// the first time a new way to play (or a new kind of time) shows up, a short panel explains it once
const NEWS = {
  set: ['🕐 轉轉時鐘', '看看圖片裡噗噗在做什麼、旁邊的時間是幾點，用手指拖<b class="ck-h">短短的橘色時針</b>，把時鐘轉到一樣的時間！轉對了放開手就過關，也可以按 ✅ 檢查。卡住了按 💡，會看到指針怎麼走。'],
  pick: ['👀 找找時鐘', '看看圖片和上面的時間，下面三個時鐘裡，<b>哪一個是一樣的時間</b>？點它！'],
  dset: ['🔢 電子鐘', '看看指針時鐘是幾點，按 ▲ ▼ 把電子鐘調成一樣的時間！<b class="ck-h">橘色是「幾點」</b>，<b class="ck-m">藍色是「幾分」</b>。'],
  match: ['🔗 配對連連看', '把<b>一樣時間</b>的指針時鐘和電子鐘配成一對：先點一個、再點另一個，或直接拖過去連起來！'],
  order: ['📅 排排一天', '噗噗的一天從早上到晚上，先做什麼、再做什麼呢？<b>照順序</b>點圖片（或拖到 1、2、3 的格子裡）。看看圖片角落的小時鐘喔！'],
  sky: ['🌞 太陽在哪裡', '噗噗在做什麼？是<b>早上、中午、下午還是晚上</b>？把太陽拖到天空對的位置，或直接點那個位置。晚上就點月亮！'],
  cuckoo: ['🐦 咕咕鐘', '小鳥會從小門跑出來「咕咕」叫。<b>數數看叫了幾聲</b>，就把時針轉到那個數字！點小木屋可以再聽一次。'],
  tour: ['🎠 噗噗的一天', '從早上 6 點開始，轉動時鐘讓時間往前走！走到上面貼紙的時間，就會收集那張貼紙，全部收集完就過關。長長的分針轉一圈，就是一個小時喔！'],
  what: ['🖼️ 這時候做什麼', '看看時鐘是幾點，旁邊的小圓窗是<b>早上、中午、下午還是晚上</b>。下面三張圖片，<b>噗噗這時候在做哪一件事</b>？點那張圖片！'],
  later: ['⏩ 過一會兒', '噗噗再玩一下下就要做下一件事了！看看上面的時鐘和沙漏：<b>過了一會兒以後</b>，時鐘會變成幾點呢？藍色的扇形就是分針要走的路，從下面三個時鐘裡點出來！'],
  pie: ['🍕 時鐘披薩', '時鐘變成一個披薩了！看上面的電子鐘，<b>點披薩一片一片放上去</b>（也可以用手指一路塗過去），分針就會跟著走。<b class="ck-m">半點是半個披薩</b>、一刻是四分之一個披薩喔！放好就過關，也可以按 ✅ 檢查。'],
  sand: ['⏳ 沙漏比比看', '每個沙漏旁邊的小時鐘，<b>藍色扇形越大，時間就越久</b>。從<b>最短的</b>開始，照順序點（或拖到 1、2、3 的格子裡）！'],
  mix: ['🏆 時鐘大挑戰', '最後的大挑戰！每一題都是<b>不一樣的玩法</b>，用你學過的本事把它們通通完成吧 ^_^'],
  s30: ['🕧 半點', '<b class="ck-m">長長的藍色分針</b>指到 6，就是「半」：3:30 是三點半。這時候<b class="ck-h">短短的時針</b>會停在兩個數字的中間喔！'],
  s15: ['🕒 一刻', '分針指到 3 是 15 分，指到 9 是 45 分。分針每走一大格就是 5 分鐘！'],
  s5: ['⏱️ 5 分鐘', '分針每走一大格是 5 分鐘：1 是 5 分、2 是 10 分、3 是 15 分……時鐘裡的<b class="ck-m">藍色小數字</b>會幫你數！'],
};
const PER_SKY = ['dawn', 'noon', 'day', 'night'];

// ---------- times ----------
const K = v => ((v % 720) + 720) % 720;                   // 12-hour clock position
const h12 = v => Math.floor(K(v) / 60) || 12;
const pad2 = n => String(n).padStart(2, '0');
const fmt = v => `${h12(v)}:${pad2(K(v) % 60)}`;
const PREV = { 30: 60, 15: 30, 5: 15 };                   // a half-past level mostly asks for :30, a quarter level for :15 / :45 …
function timeFor(a, step, after = -1) {
  const [lo, hi] = ACT[a].win, c = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) if (v > after) c.push(v);
  if (!c.length) return null;
  const fresh = PREV[step] ? c.filter(v => v % PREV[step]) : [];
  return fresh.length && Math.random() < 0.75 ? MG.pick(fresh) : MG.pick(c);
}
// k things 噗噗 does, in day order, at increasing times
function dayPlan(k, step, after = -1) {
  for (let tries = 0; tries < 300; tries++) {
    const acts = MG.shuffle(ORDER.slice()).slice(0, k).sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
    const out = []; let prev = after, ok = true;
    for (const a of acts) { const v = timeFor(a, step, prev); if (v == null) { ok = false; break; } out.push({ a, t: v }); prev = v; }
    if (ok) return out;
  }
  return ORDER.slice(0, k).map(a => ({ a, t: Math.ceil(ACT[a].win[0] / step) * step }));
}
function randTimes(n, step) {
  const ms = []; for (let m = 0; m < 60; m += step) ms.push(m);
  const fresh = PREV[step] ? ms.filter(m => m % PREV[step]) : ms, out = [];
  for (let tries = 0; out.length < n && tries < 800; tries++) {
    const v = MG.randi(0, 11) * 60 + (Math.random() < 0.7 ? MG.pick(fresh) : MG.pick(ms));
    if (out.includes(v)) continue;
    if (out.some(o => Math.floor(o / 60) === Math.floor(v / 60)) && (step === 60 || tries < 400)) continue;
    out.push(v);
  }
  return out;
}
// two wrong clocks that look a bit like the right one: the hour hand one number off, and the minute hand somewhere else
function distract(T, step) {
  const T0 = K(T), h = Math.floor(T0 / 60), m = T0 % 60, A = [], B = [];
  const add = (arr, v) => { v = K(v); if (v !== T0 && !A.includes(v) && !B.includes(v)) arr.push(v); };
  if (step === 60) { [60, -60, 120, -120, 180, 300, -240].forEach(d => add(A, T0 + d)); const a = MG.shuffle(A); return [a[0], a[1]]; }
  add(A, T0 + 60); add(A, T0 - 60);
  add(B, h * 60 + (m + 30) % 60); add(B, h * 60 + (m + step) % 60); add(B, h * 60 + (m + 60 - step) % 60);
  if (step <= 15 && m % 5 === 0 && m) add(B, (m / 5 % 12) * 60 + (h * 5) % 60);   // hands swapped
  const a = MG.pick(A), b = MG.pick(B.filter(v => v !== a));
  return [a, b];
}
// 噗噗這個時間會不會在做 a？（12 小時制的鐘上，早上 7 點和晚上 7 點看起來一樣，所以兩個都算）
const doingAt = (a, v) => { const [lo, hi] = ACT[a].win; return [v, v + 720, v - 720, v + 1440].some(q => q >= lo && q <= hi); };
// 這時候做什麼：一件對的事＋兩件「那個時間一定不會做」的事（簡單的關卡還會挑不同時段的）
function whatOpts(a, v, step) {
  let pool = ORDER.filter(b => b !== a && !doingAt(b, v));
  const far = pool.filter(b => ACT[b].per !== ACT[a].per);
  if (step >= 60 || far.length >= 2 && Math.random() < 0.6) pool = far.length >= 2 ? far : pool;
  return MG.shuffle([a, ...MG.shuffle(pool).slice(0, 2)]);
}
// 過一會兒：從 v 開始過 d 分鐘
function laterRound(step) {
  const d = step === 60 ? 60 : step === 30 ? (Math.random() < 0.75 ? 30 : 60) : step === 15 ? MG.pick([15, 30, 30, 60]) : MG.pick([10, 15, 20, 30]);
  const ms = []; for (let m = 0; m < 60; m += step) ms.push(m);
  const from = MG.randi(1, 11) * 60 + MG.pick(ms), to = from + d;
  const c = MG.shuffle([from, from - d, from + 2 * d, to + 60, to - 60, to + 30].map(K).filter((v, i, a) => v !== K(to) && a.indexOf(v) === i));
  const pref = c.filter(v => v === K(from) || v === K(from + 2 * d) || v === K(from - d));
  const wrong = (pref.length >= 2 ? pref : c).slice(0, 2), opts = MG.shuffle([K(to), ...wrong]);
  return { from, d, target: to, opts, ok: opts.indexOf(K(to)), bad: [], got: -1, shake: [0, 0, 0] };
}
// 沙漏比比看：k 個長短不同的時間（分鐘），簡單的差很多、難的只差一點點
function sandTimes(k, step) {
  const pool = step === 60 ? [10, 15, 20, 30, 40, 45, 60] : [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60], gap = step === 60 ? 15 : step === 30 ? 10 : 5;
  for (let tries = 0; tries < 500; tries++) {
    const pick = MG.shuffle(pool.slice()).slice(0, k).sort((a, b) => a - b);
    if (pick.every((v, i) => !i || v - pick[i - 1] >= gap)) return pick;
  }
  return [10, 20, 30, 40, 50, 60].slice(0, k);
}
// 卡片排版：n 張 4:3 卡片，找一個讓卡片最大的欄數
function fitCards(r, n, g) {
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols), cw = Math.min((r.w - g * (cols - 1)) / cols, (r.h - g * (rows - 1)) / rows * 4 / 3);
    if (!best || cw > best.cw) best = { cols, rows, cw };
  }
  const { cols, rows } = best, cw = best.cw * 0.97, ch = cw * 0.75, y0 = r.y + (r.h - rows * ch - (rows - 1) * g) / 2;
  return Array.from({ length: n }, (_, i) => {
    const row = Math.floor(i / cols), inRow = Math.min(cols, n - row * cols), x0 = r.x + (r.w - inRow * cw - (inRow - 1) * g) / 2;
    return { x: x0 + (i % cols) * (cw + g), y: y0 + row * (ch + g), w: cw, h: ch };
  });
}

// ---------- tiny drawing helpers (g = any 2D context) ----------
function fs(g, f, s, w) { if (f) { g.fillStyle = f; g.fill(); } if (s) { g.strokeStyle = s; g.lineWidth = w || 1.4; g.stroke(); } }
function rr(g, X, Y, w, h, r, f, s, lw) { g.beginPath(); g.roundRect(X, Y, Math.max(0, w), Math.max(0, h), r); fs(g, f, s, lw); }
function ov(g, X, Y, rx, ry, f, s, lw) { g.beginPath(); g.ellipse(X, Y, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, TAU); fs(g, f, s, lw); }
function lgr(g, x0, y0, x1, y1, ...cs) { const q = g.createLinearGradient(x0, y0, x1, y1); cs.forEach((c, i) => q.addColorStop(i / (cs.length - 1), c)); return q; }
function rgr(g, X, Y, r0, r1, ...cs) { const q = g.createRadialGradient(X, Y, r0, X, Y, r1); cs.forEach((c, i) => q.addColorStop(i / (cs.length - 1), c)); return q; }
function star(g, X, Y, R, f, s, lw) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? R * 0.45 : R; g.lineTo(X + Math.cos(a) * q, Y + Math.sin(a) * q); } g.closePath(); fs(g, f, s, lw); }
function twinkle(g, X, Y, r, c) { g.beginPath(); g.moveTo(X, Y - r); g.quadraticCurveTo(X, Y, X + r, Y); g.quadraticCurveTo(X, Y, X, Y + r); g.quadraticCurveTo(X, Y, X - r, Y); g.quadraticCurveTo(X, Y, X, Y - r); g.fillStyle = c; g.fill(); }
const CACHE = new Map();
function off(key, w, h, fn) {
  const px = cv._mgScale || 1, k = key + '@' + px;
  let c = CACHE.get(k); if (c) return c;
  c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w * px)); c.height = Math.max(1, Math.ceil(h * px));
  const g = c.getContext('2d'); g.setTransform(px, 0, 0, px, 0, 0); g.lineCap = 'round'; g.lineJoin = 'round'; fn(g);
  CACHE.set(k, c); if (CACHE.size > 90) CACHE.delete(CACHE.keys().next().value);
  return c;
}

// ---------- scene pictures (designed in a 160 × 120 box) ----------
function wallFloor(g, w0, w1, f0, f1, fy) {
  g.fillStyle = lgr(g, 0, 0, 0, fy, w0, w1); g.fillRect(0, 0, 160, fy);
  g.fillStyle = lgr(g, 0, fy, 0, 120, f0, f1); g.fillRect(0, fy, 160, 120 - fy);
  g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(0, fy, 160, 1.6); g.fillStyle = 'rgba(80,40,10,.1)'; g.fillRect(0, fy + 1.6, 160, 2);
}
function dots(g, col, fy = 92, step = 13, r = 1.2) { g.fillStyle = col; for (let yy = 7, row = 0; yy < fy - 4; yy += step, row++) for (let xx = (row % 2) * step / 2 + 5; xx < 160; xx += step) { g.beginPath(); g.arc(xx, yy, r, 0, TAU); g.fill(); } }
function sunG(g, X, Y, r) {
  g.fillStyle = 'rgba(255,240,150,.45)'; g.beginPath(); g.arc(X, Y, r * 1.7, 0, TAU); g.fill();
  g.strokeStyle = '#ffc93a'; g.lineWidth = r * 0.16; for (let i = 0; i < 8; i++) { const a = i * TAU / 8; g.beginPath(); g.moveTo(X + Math.cos(a) * r * 1.25, Y + Math.sin(a) * r * 1.25); g.lineTo(X + Math.cos(a) * r * 1.6, Y + Math.sin(a) * r * 1.6); g.stroke(); }
  ov(g, X, Y, r, r, rgr(g, X - r * 0.3, Y - r * 0.3, r * 0.1, r * 1.1, '#fff7c2', '#ffd84a', '#ffb81f'), '#e8960c', r * 0.12);
}
function cloudG(g, X, Y, s) {
  g.fillStyle = 'rgba(120,160,200,.18)'; g.beginPath(); g.ellipse(X + 1, Y + 2.5 * s, 13 * s, 3 * s, 0, 0, TAU); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(X - 7 * s, Y, 5 * s, 0, TAU); g.arc(X, Y - 3 * s, 7 * s, 0, TAU); g.arc(X + 8 * s, Y, 5.5 * s, 0, TAU); g.rect(X - 7 * s, Y, 15 * s, 5 * s); g.fill();

  get state() { return state; }, get level() { return level; }, get type() { return LV.t; }, get count() { return LEVELS.length; }, levels: LEVELS, sliceAt, get ri() { return ri; }, rd: () => RD, ly: () => LY, get errs() { return errs; },
