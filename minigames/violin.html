// =====================================================================
// flow
// =====================================================================
function resetPlay() {

}
function setKey(k) { if (k === KEY) return; KEY = k; buildSpots(); sel = spotOf(sel ? sel.m : 62) || SPOTS[4]; bgKey = ''; }

    fresh.forEach(k => MG.store.set('violin.seen.' + k, true));

    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => { MG.hide(); if (holdBeat) st = -4 * spb() - 0.6; } }] });
  }
}
function starsById() { const s = MG.store.get('violin.starsId', {}); return s && typeof s === 'object' ? s : {}; }
// stars by level number (current order), for the menu
function starsMap() { const s = starsById(), out = {}; LEVELS.forEach((l, i) => { if (s[l.id]) out[i + 1] = s[l.id]; }); return out; }

function win(stars, line) {
  if (state !== 'play') return;

  const sm = starsById(), old = sm[LV.id] || 0; if (stars > old) { sm[LV.id] = stars; MG.store.set('violin.starsId', sm); }
  MG.record('violin', totalStars());
  MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 260); hop = 1; mood = 'love'; moodT = 1.5;
  MG.fx.burst(W / 2, TOP * 0.6, { n: 50, colors: ['#ffd23f', '#ff8ac2', '#8fd0ff', '#8fe39a'], shape: 'star', speed: 320, up: 180, size: 7 });
  hud();

  setTimeout(() => {
    if (state !== 'over') return;
    MG.panel({
      title: `第 ${level} 關過關！`,
      html: `<div class="vl-stars">${'⭐'.repeat(stars)}<span style="opacity:.25">${'⭐'.repeat(3 - stars)}</span></div><p>${mkOf(LV)} ${LV.name}</p><p>${line || ''}</p>` + (next ? `<p>下一關：${mkOf(next)} ${next.name}</p>` : '<p>你是噗噗小提琴家！🎻</p>'),
      buttons: [...(next ? [{ label: '下一關', on: () => { MG.store.set('violin.pickLevel', level + 1); startLevel(level + 1); } }] : []), { label: '再拉一次', alt: !!next, on: () => startLevel(level) }, { label: '選關卡', alt: true, on: menu }],

// section headings inside the shared level grid (also when it is opened from the ☰ pause menu)
function decorateGrid() {
  const g = document.querySelector('.mg-over .mg-lvgrid');
  if (!g || g.dataset.secs || !document.getElementById('vlMenu')) return;
  g.dataset.secs = '1';
  let last = '';
  LEVELS.forEach((l, i) => {
    if (l.sec === last) return; last = l.sec;
    const b = g.querySelector(`.mg-lv[data-lv="${i + 1}"]`); if (!b) return;
    const sc = SECS.find(q => q.id === l.sec) || { nm: '', sub: '' };

// =====================================================================
// main loop
// =====================================================================
function update(dt) {

  idleT += dt; recSample();

    updateBow(dt);
    if (kind === 'follow') updateFollow(dt);
    else if (kind === 'long') updateLong(dt);
    else if (kind === 'pbub') updateBub(dt);
    else if (kind === 'pecho') updateEcho(dt);
    if (pb) updatePb(dt);
  } else { bowS *= Math.pow(0.001, dt); autoA *= Math.pow(0.001, dt); fingers.clear(); }
  // what sounds this frame
  const uv = state === 'play' && !MG.panelOpen() ? userVoice(dt) : { m: -1, amp: 0, sc: 0 };
  let m = uv.m, amp = uv.amp, sc = uv.sc;
  if (ov) { m = ov.m; amp = ov.amp; sc = 0; }
  if (MG.panelOpen() && !ov) amp = 0;
  curAmp = amp; scratch = sc; if (m >= 0) lastSoundM = m;
  voiceUpdate(m, amp, sc);
  // note-on events from the hand bow (start of a sound after silence)
  // a new bow stroke (start after a rest, or a change of direction) = a new note
  const on = amp > 0.08;
  if (on && !ov && handBow() && !pizzMode() && (!strokeOn || strokeDir !== bowDir)) { strokeOn = true; strokeDir = bowDir; const sp = curSpot(); if (sp) noteEvent(sp.m, bowDir, 'bow'); }
  if (on) silentT = 0; else { silentT += dt; if (silentT > 0.3) strokeOn = false; }
  soundOn = on;
  if (amp > 0.1) { noteSpawn -= dt; if (noteSpawn <= 0) { noteSpawn = 0.45; const sp = spotOf(m); spawnNoteFloat(sp && sp.f ? fcolOf(sp)[1] : sp ? STR[sp.s].bead : '#fff'); } }

}
kind = 'free';
cv.onfit = () => relayout();
MG.fit(cv, (sw, sh) => {
  const l = sw > sh * 1.05;
  if (l) { const h = 560; return [Math.round(Math.min(1400, Math.max(800, h * (sw - 12) / Math.max(1, sh - 12)))), h]; }
  const w = sw / sh > 0.62 ? 600 : 480; return [w, Math.round(Math.min(1040, Math.max(640, w * (sh - 12) / Math.max(1, sw - 12))))];
