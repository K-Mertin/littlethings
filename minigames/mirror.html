const levelOf = (n, v) => v ? { ...LEVELS[n - 1], map: '\n' + VARS[n][v - 1].split('|').join('\n') } : LEVELS[n - 1];

// ===== ENGINE START
// directions: 0 up, 1 right, 2 down, 3 left
const DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
const REFL = [[1, 0, 3, 2], [3, 2, 1, 0]];          // m=0 '/', m=1 '\'
const LAMPD = { '^': 0, '>': 1, 'v': 2, '<': 3 };
// parse a level map into cells
function parseLevel(L) {
  const rows = L.map.trim().split('\n').map(s => s.trim());
  const R = rows.length, C = Math.max(...rows.map(s => s.length));
  const cells = [], rail = [];
  let cart = null;
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const ch = rows[r][c] || '.', o = { k: 'empty', r, c };
    if (ch === '/' || ch === '\\') { o.k = 'mirror'; o.m = ch === '/' ? 0 : 1; o.rot = true; }
    else if (ch === '[' || ch === ']') { o.k = 'mirror'; o.m = ch === '[' ? 0 : 1; o.rot = false; }
    else if (ch === 'S' || ch === 's') { o.k = 'mirror'; o.m = ch === 'S' ? 0 : 1; o.rot = false; o.spin = true; }
    else if (ch in LAMPD) { o.k = 'lamp'; o.d = LAMPD[ch]; }
    else if (ch === '*') { o.k = 'target'; o.col = 'w'; }
    else if (ch === 'R' || ch === 'B' || ch === 'G') { o.k = 'target'; o.col = ch.toLowerCase(); }
    else if (ch === 'r' || ch === 'b' || ch === 'g') { o.k = 'filter'; o.col = ch; }
    else if (ch === '#') o.k = 'rock';
    else if (ch === 'o') o.k = 'glass';
    else if (ch === 'O') o.k = 'owl';

  x.fillStyle = 'rgba(255,255,255,.85)'; x.strokeStyle = '#ff9f1c'; x.lineWidth = 3; x.beginPath(); x.arc(px2, py2 + bob + sz * 0.5, sz * 0.52, 0, 7); x.fill(); x.stroke();
  x.globalAlpha = 1; x.fillText('👆', px2, py2 + bob); x.restore();
}
function drawFloats() {
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const f of floats) {
    let sz = Math.round(Math.max(18 * U, Math.min(30 * U, cs * 0.42)));
    x.font = `900 ${sz}px system-ui,"Noto Sans TC",sans-serif`;
    const tw = x.measureText(f.text).width;
    const fx = Math.max(tw / 2 + 8, Math.min(W - tw / 2 - 8, f.x)), fy = Math.max(sz, f.y - (1.2 - f.life) * 30);
    x.globalAlpha = Math.min(1, f.life * 2.5);
    x.lineWidth = Math.max(3, sz * 0.2); x.strokeStyle = '#fff'; x.strokeText(f.text, fx, fy);
    x.fillStyle = f.col; x.fillText(f.text, fx, fy);
  }
  x.globalAlpha = 1;
}

// ---------- little critters for life ----------
let critters = [];
function spawnCritters() {
  critters = [];
  const kinds = L.th === 'snow' ? ['flake', 'flake', 'flake', 'flake', 'flake', 'flake', 'bird'] : L.th === 'sunset' ? ['gull', 'gull', 'bfly', 'crab'] : L.th === 'space' ? ['spark', 'spark', 'spark', 'ufo'] : L.th === 'garden' ? ['bfly', 'bfly', 'bee', 'bird'] : L.th === 'night' ? ['ffly', 'ffly', 'ffly', 'ffly', 'ffly'] : ['spark', 'spark', 'spark', 'bat'];
  for (const k of kinds) critters.push({ k, x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 50, vy: (Math.random() - 0.5) * 30, ph: Math.random() * 6, col: PETALS[Math.floor(Math.random() * 5)], flee: 0 });
}
function stepCritters(dt) {
  for (const c of critters) {
    c.ph += dt; const sp = c.flee > 0 ? 3 : 1; c.flee = Math.max(0, c.flee - dt);
    c.vx += (Math.random() - 0.5) * 120 * dt; c.vy += (Math.random() - 0.5) * 120 * dt;
    const mx = c.k === 'ffly' || c.k === 'spark' ? 22 : 50; c.vx = Math.max(-mx, Math.min(mx, c.vx)); c.vy = Math.max(-mx, Math.min(mx, c.vy));
    if (c.k === 'flake') { c.vy = 18 + (c.ph * 7 % 1) * 4; c.vx = Math.sin(c.ph * 1.3) * 14; }
    if (c.k === 'crab') { c.vy = 0; c.y = H - 16 * U; c.vx = Math.max(-30, Math.min(30, c.vx)); }
    if (c.k === 'bird' || c.k === 'gull' || c.k === 'ufo') { c.vx = (c.vx >= 0 ? 1 : -1) * Math.max(25, Math.abs(c.vx)); c.vy *= 0.9; if (c.y > H * 0.3) c.vy -= 30 * dt; }
    c.x += c.vx * dt * sp; c.y += c.vy * dt * sp;
    if (c.k === 'flake' && c.y > H - 12) { c.y = 12; c.x = Math.random() * W; }
    if (c.x < 10 || c.x > W - 10) c.vx = -c.vx; if (c.y < 10 || c.y > H - 10) c.vy = -c.vy;
    c.x = Math.max(10, Math.min(W - 10, c.x)); c.y = Math.max(10, Math.min(H - 10, c.y));
  }
}
function pokeCritter(p) {
  const c = critters.find(c => Math.hypot(c.x - p.x, c.y - p.y) < Math.max(28, 30 * U)); if (!c) return false;
  c.flee = 1.5; c.vx = (c.x < p.x ? -1 : 1) * 40; MG.sfx('sparkle');
  say(c.x, c.y - 24, { bfly: '🦋', bee: 'Bzz! 🐝', ffly: '✨', spark: '✨', bat: 'Squeak! 🦇', flake: '❄️', bird: 'Tweet! 🐦', gull: 'Caw! 🕊️', crab: 'Snip! 🦀', ufo: 'Beep! 🛸' }[c.k], '#ff6a00'); return true;
}
function drawCritters() {
  for (const c of critters) {
    x.save(); x.translate(c.x, c.y);
    if (c.k === 'bfly') { const f = 0.25 + Math.abs(Math.sin(c.ph * 13)) * 0.75, r = 9 * U; x.fillStyle = c.col; x.strokeStyle = shade(c.col, -70); x.lineWidth = 1.2; for (const sd of [-1, 1]) { x.save(); x.scale(sd * f, 1); x.beginPath(); x.ellipse(r * 0.6, -r * 0.35, r * 0.6, r * 0.5, -0.5, 0, 7); x.fill(); x.stroke(); x.beginPath(); x.ellipse(r * 0.45, r * 0.35, r * 0.38, r * 0.32, 0.5, 0, 7); x.fill(); x.stroke(); x.restore(); } x.fillStyle = '#4a2a1a'; x.beginPath(); x.ellipse(0, 0, r * 0.14, r * 0.6, 0, 0, 7); x.fill(); }
    else if (c.k === 'bee') { const r = 7 * U, f = Math.abs(Math.sin(c.ph * 30)); x.fillStyle = 'rgba(255,255,255,.8)'; x.beginPath(); x.ellipse(-r * 0.2, -r * 0.9, r * 0.5, r * 0.3 + f * r * 0.3, -0.3, 0, 7); x.fill(); x.fillStyle = '#ffd23f'; x.strokeStyle = '#8a6a10'; x.lineWidth = 1.2; x.beginPath(); x.ellipse(0, 0, r, r * 0.7, 0, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#3a2a10'; x.fillRect(-r * 0.3, -r * 0.65, r * 0.22, r * 1.3); x.fillRect(r * 0.2, -r * 0.6, r * 0.2, r * 1.2); }
    else if (c.k === 'ffly' || c.k === 'spark') { const gl = 0.5 + 0.5 * Math.sin(c.ph * 3), r = 13 * U, col = c.k === 'ffly' ? '240,255,150' : '200,180,255'; const g2 = x.createRadialGradient(0, 0, 0, 0, 0, r); g2.addColorStop(0, `rgba(${col},${0.7 * gl + 0.2})`); g2.addColorStop(1, `rgba(${col},0)`); x.fillStyle = g2; x.beginPath(); x.arc(0, 0, r, 0, 7); x.fill(); x.fillStyle = '#fffbe0'; x.beginPath(); x.arc(0, 0, 2 * U, 0, 7); x.fill(); }
    else if (c.k === 'flake') { const r = 5 * U; x.rotate(c.ph); x.strokeStyle = 'rgba(255,255,255,.95)'; x.lineWidth = 1.6; x.lineCap = 'round'; x.beginPath(); for (let k = 0; k < 3; k++) { const an = k * Math.PI / 3; x.moveTo(-Math.cos(an) * r, -Math.sin(an) * r); x.lineTo(Math.cos(an) * r, Math.sin(an) * r); } x.stroke(); x.strokeStyle = 'rgba(120,170,220,.6)'; x.lineWidth = 0.8; x.stroke(); }
    else if (c.k === 'bird' || c.k === 'gull') { const r = 9 * U, f = Math.sin(c.ph * 10); x.scale(c.vx < 0 ? -1 : 1, 1); const body = c.k === 'gull' ? ['#ffffff', '#8a9ab0'] : ['#7ac8ff', '#2f78cf']; x.fillStyle = body[0]; x.strokeStyle = body[1]; x.lineWidth = 1.2; x.beginPath(); x.ellipse(0, 0, r * 0.7, r * 0.42, 0, 0, 7); x.fill(); x.stroke(); x.beginPath(); x.arc(r * 0.55, -r * 0.25, r * 0.3, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#ffb43a'; x.beginPath(); x.moveTo(r * 0.82, -r * 0.3); x.lineTo(r * 1.1, -r * 0.2); x.lineTo(r * 0.82, -r * 0.12); x.fill(); x.fillStyle = '#2a2a3a'; x.beginPath(); x.arc(r * 0.62, -r * 0.32, r * 0.07, 0, 7); x.fill(); x.fillStyle = body[0]; x.beginPath(); x.moveTo(-r * 0.2, -r * 0.1); x.quadraticCurveTo(-r * 0.1, -r * (0.5 + f * 0.6), r * 0.25, -r * 0.1); x.fill(); x.stroke(); }
    else if (c.k === 'crab') { const r = 9 * U, w = Math.sin(c.ph * 14) * 0.2; x.fillStyle = '#ff6a5a'; x.strokeStyle = '#a82a2a'; x.lineWidth = 1.2; for (const sd of [-1, 1]) { x.beginPath(); x.arc(sd * r * 0.9, -r * 0.5 + w * r, r * 0.3, 0, 7); x.fill(); x.stroke(); x.beginPath(); x.moveTo(sd * r * 0.5, r * 0.3); x.lineTo(sd * r * 0.9, r * 0.6); x.stroke(); } x.beginPath(); x.ellipse(0, 0, r * 0.7, r * 0.45, 0, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#fff'; for (const sd of [-1, 1]) { x.beginPath(); x.arc(sd * r * 0.22, -r * 0.45, r * 0.13, 0, 7); x.fill(); } x.fillStyle = '#2a1a1a'; for (const sd of [-1, 1]) { x.beginPath(); x.arc(sd * r * 0.22, -r * 0.43, r * 0.06, 0, 7); x.fill(); } }
    else if (c.k === 'ufo') { const r = 12 * U, b2 = Math.sin(c.ph * 3) * 2; x.translate(0, b2); x.fillStyle = 'rgba(160,240,255,.7)'; x.beginPath(); x.arc(0, -r * 0.15, r * 0.42, Math.PI, 0); x.fill(); x.fillStyle = '#b9c3e6'; x.strokeStyle = '#5a6496'; x.lineWidth = 1.2; x.beginPath(); x.ellipse(0, 0, r, r * 0.3, 0, 0, 7); x.fill(); x.stroke(); for (let k = 0; k < 3; k++) { x.fillStyle = (Math.floor(c.ph * 4) + k) % 3 ? '#ffe14a' : '#ff6aa8'; x.beginPath(); x.arc((k - 1) * r * 0.5, r * 0.05, r * 0.09, 0, 7); x.fill(); } }
    else if (c.k === 'bat') { const r = 9 * U, f = Math.sin(c.ph * 12); x.fillStyle = '#3a2a5a'; x.strokeStyle = '#1a1030'; x.lineWidth = 1; for (const sd of [-1, 1]) { x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(sd * r, -r * (0.6 + f * 0.4), sd * r * 1.5, -r * 0.1 * f); x.quadraticCurveTo(sd * r, r * 0.3, 0, r * 0.2); x.fill(); } blob(0, 0, r * 0.4, '#4a3a6a', '#1a1030', 1); x.fillStyle = '#fff'; for (const sd of [-1, 1]) { x.beginPath(); x.arc(sd * r * 0.15, -r * 0.05, r * 0.08, 0, 7); x.fill(); } }
    x.restore();
  }
}

function draw() {
  drawBG();
  if (!G) return;
  drawCritters();
  drawBeam();
  drawBoard();
  drawGoal();
  drawHero();
  drawTray();
  drawButtons();
  drawCue();
  MG.fx.draw(x);
  drawFloats();
  if (drag && drag.moved) { x.save(); x.globalAlpha = 0.92; x.translate(drag.x, drag.y - cs * 0.3); drawMirror(cs * 1.05, drag.m ? Math.PI / 4 : -Math.PI / 4, 'tray'); x.restore(); }
}

// ---------- menu ----------
function menu() {
  state = 'menu';
  const S = starsOf();
  MG.choose({
    id: 'mirror', title: '鏡子射光線',
    html: `<p>燈會射出一道光！點一下<b>鏡子</b>就會轉方向，光碰到鏡子會轉彎。讓光照到花苞和寶石，花會開、寶石會亮晶晶 ^_^</p><p>不限時間、不會輸，慢慢轉。卡住了可以按 💡 提示；想玩別的題目就按 🔀 換一題，每一關都有好幾題喔！</p><p>${LEVELS.length} 關，有 🌷花園、💎山洞、🌙晚上、❄️雪地、🌅海邊、🚀星空；玩法有 🌼 好幾朵花、🔩 固定鏡子、🧩 放鏡子、🦉 別吵醒貓頭鷹、🧊 透明玻璃、🎨 彩色玻璃、🔺 分光水晶、🔦 兩盞燈、🌀 會轉的鏡子、🛒 小車車，還有新的 🪟 分光鏡、🟣 紅＋藍＝紫、🚪 傳送門，最後是 👑 大挑戰！</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${lvName(n)}）${S[n] ? ' ' + '⭐'.repeat(S[n]) : ''}`, short: n => `${n}${TYPE[typeOf(n)][0] || (S[n] ? '✓' : '')}` },
    keys: '點鏡子轉方向　<kbd>←↑↓→</kbd> 移動　<kbd>空白鍵</kbd> 轉　<kbd>H</kbd> 提示　<kbd>R</kbd> 重來　<kbd>N</kbd> 換一題',
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
// a sample board behind the start panel
(() => { L = LEVELS[3]; TH = THEME[L.th]; G = parseLevel(L); level = 4; st = { m: {}, place: {} }; G.cells.forEach((o, i) => { if (o.k === 'mirror' || o.k === 'split') { st.m[i] = o.m; ang[i] = angV[i] = o.m ? Math.PI / 4 : -Math.PI / 4; } if (o.k === 'target') bloom[i] = 0; }); const s = solve(G, st); if (s) Object.assign(st.m, s.m); G.cells.forEach((o, i) => { if (o.k === 'mirror') ang[i] = angV[i] = st.m[i] ? Math.PI / 4 : -Math.PI / 4; }); cur = trace(G, st, 0); maxD = 99; grow = 99; for (const i of cur.lit) bloom[i] = 1; layout(); spawnCritters(); })();
menu();

// ---------- test hook ----------
window.MIRT = {
  get state() { return state; }, get level() { return level; }, get variant() { return vIdx; }, get hints() { return hints; }, count: LEVELS.length, typeOf: n => typeOf(n), levels: LEVELS,
  varCount: n => varCount(n), swap() { swapVariant(); MG.hide(); },
  start(n, v) { MG.hide(); startLevel(n, v); MG.hide(); },
  open(n, v) { MG.hide(); startLevel(n, v); },          // 和 start 一樣，但留著第一次的玩法說明
  types: () => LEVELS.map((_, k) => typeOf(k + 1)), mix: () => cur && cur.mix, idle: () => idleT,
  cells: () => G.cells.map((o, i) => ({ i, k: o.k, m: o.k === 'mirror' || o.k === 'split' ? (o.rot ? st.m[i] : o.m) : st.place[i], rot: !!o.rot, col: o.col })),
  tray: () => tray.slice(), lit: () => [...shownLit], owls: () => [...shownOwl], latched: () => Object.keys(latched).map(Number), get phase() { return phase; },
  // a solution from where the player is now (proves the level can be finished)
  plan: () => { const s = plan(); return s && { m: s.m, place: s.place }; },
  solveNow() {
    const s = plan(); if (!s) return false;
    for (const i of Object.keys(st.place).map(Number)) if (s.place[i] == null) unplace(i);
    for (const i in s.m) if (st.m[i] !== s.m[i]) rotateCell(+i, true);
    for (const i in s.place) { if (st.place[i] == null) { tray.pop(); place(+i, s.place[i]); } else if (st.place[i] !== s.place[i]) rotateCell(+i, true); }
    return goalOf(G, st).ok;
  },
  win() { return this.solveNow(); },
  check(n, v = 0) { const G2 = parseLevel(levelOf(n, v)), e = { m: {}, place: {} }; const s = solve(G2, e); if (!s) return { ok: false }; const full = { m: { ...s.m }, place: { ...s.place } }; return { ok: goalOf(G2, full).ok, atStart: goalOf(G2, e).ok }; },
  hint() { return showHint(); }, tap(i) { return rotateCell(i); },
  at(i) { const q = cellXY(i); return this.toClient(q.x, q.y); },
  trayAt(k) { const s = traySpots[k]; return s ? this.toClient(s.x, s.y) : null; },
  btn(id) { const b = btns.find(b => b.id === id); return b && this.toClient(b.x + b.w / 2, b.y + b.h / 2); },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh }; },
  dims: () => ({ W, H, cs, bx0, by0, side, tray: trayRect }),

MG.loop(dt => { for (const k in jiggle) jiggle[k] = Math.max(0, jiggle[k] - dt); update(dt); draw(); });
</script>
