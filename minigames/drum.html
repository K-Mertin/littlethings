<title>噗噗打鼓</title>

<style>
.mg-stage{padding:6px}
.mg-over{align-items:flex-start}.mg-card{margin:auto}
.mg-levels.mg-lvgrid{grid-template-columns:repeat(20,1fr)}
.mg-lvgrid .mg-lv{grid-column:span 4}
.mg-lvgrid .mg-lv.dr-song{grid-column:span 5;font-size:calc(15px * var(--ui));padding:0 2px}
.mg-card .dr-stars{font-size:calc(40px * var(--ui));letter-spacing:.12em;margin:2px 0 4px}
.dr-res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.dr-res div{background:#fff8e8;border:2px solid #f0dcae;border-radius:12px;padding:4px 2px;font-size:calc(13px * var(--ui));color:#7a6a50}
.dr-res b{display:block;font-size:calc(22px * var(--ui));color:#23312b}
.dr-new{display:flex;gap:12px;align-items:center;text-align:left;margin:6px 0}.dr-new b.ic{font-size:calc(42px * var(--ui));line-height:1;flex:none}
</style>

function padAtPoint(pt) {

}

  const p = pads[i]; if (!p) return;

}

  const k = KEYS.indexOf(e.key); if (k >= 0 && k < pads.length) tapPad(k, 0);
});

// =====================================================================
// game flow
// =====================================================================
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('prog', MODE ? MODE.prog() : ''); }
function startLevel(n) {
  level = clamp(n, 1, LEVELS.length); LV = LEVELS[level - 1]; MODE = M[LV.type];
  ensureAudio(); held = false; if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  newRunBus();
  pads = makePads(LV.pads); floats = []; pfx = []; MG.fx.clear(); finT = 0; songT = 0; beatOn = false; botT = 0.3; excite = 0; cele = 0; crewJump = 0;
  hero = { hit: 0, side: 1, mood: 'happy', moodT: 0, jump: 0, bubble: '' };
  layout(); MODE.init(); layout();
  state = 'play'; MG.hide(); hud();
  const key = LV.type === 'light' && LV.dbl ? 'light2' : LV.type;
  if (LV.type === 'song') {
    const first = !MG.store.get('drum.seen.song', false); MG.store.set('drum.seen.song', true);
    const go = () => { MG.hide(); state = 'play'; };
    state = 'intro';
    MG.panel({ title: `🎵 ${SONGS[LV.song].nm}`, html: (first ? `<div class="dr-new"><b class="ic">🎵</b><p>${INTRO.song[1]}</p></div>` : '') + `<p>想先聽聽看怎麼敲嗎？按 <b>👀 示範</b>，噗噗會先把整首歌敲一次給你看，看完就換你！</p>`,
      buttons: [{ label: '🥁 開始打', on: go }, { label: '👀 示範', alt: true, on: () => { go(); RH.startDemo(); } }] });
  } else if (!MG.store.get('drum.seen.' + key, false)) {
    MG.store.set('drum.seen.' + key, true);
    const I = INTRO[key];
    state = 'intro';
    const go = () => { MG.hide(); state = 'play'; };
    MG.panel({ title: I[0], html: `<div class="dr-new"><b class="ic">${I[0].split(' ')[0]}</b><p>${I[1]}</p></div>` + (LV.type === 'free' || LV.type === 'jam' ? `<p>🎯 ${TASKS[LV.task](LV.n)}</p>` : ''), buttons: [{ label: '開始', on: go }, ...(MODE === RH ? [{ label: '👀 示範', alt: true, on: () => { go(); RH.startDemo(); } }] : [])] });
  } else if (LV.type === 'free' || LV.type === 'jam') MG.toast('🎯 ' + TASKS[LV.task](LV.n), 2400);
}
function complete(st, delay = 0.8) {
  if (state !== 'play') return;
  state = 'finale'; stars = st; finT = 2.2 + delay;
  if (MODE === M.free) MODE.stopPlay();
  setTimeout(() => { if (state !== 'finale') return; MG.sfx('clear'); setTimeout(() => MG.sfx('yay'), 300); if (ac) { const t0 = ac.currentTime + 0.05; sound('crash', t0, 0.8, 0, drumBus); sound('kick', t0, 1, 0, drumBus); } }, delay * 1000);
  heroMood('love', 3); hero.jump = 1; beatOn = false; cele = 2.6 + delay; fireT = delay; hero.bubble = '🎉';
  const th = THEMES[LV.theme] || THEMES.room, cols = [th.acc, th.rug, th.beam, '#ffd23f', '#fff'];
  for (let k = 0; k < 3; k++) setTimeout(() => MG.fx.burst(W * (0.25 + k * 0.25), H * 0.45, { n: 24, colors: cols, shape: k % 2 ? 'star' : 'sq', speed: 300, up: 180, size: 7 }), delay * 1000 + k * 240);
  const was = progress[LV.id] || 0; if (st > was) { progress[LV.id] = st; MG.store.set('drum.stars', progress); }
  MG.record('drum', doneCount());
}
// a level-themed cheer on the win panel
const CHEER = { room: '🏠 客廳音樂會大成功！', stage: '🎭 大舞台的觀眾站起來拍手！', park: '🌳 公園裡的大家都在跳舞！', night: '🌙 星星都在幫你打拍子！', beach: '🏖️ 海邊的觀眾一起拍手！', city: '🌃 屋頂演唱會大成功！', forest: '🌲 森林裡的螢火蟲都亮起來了！' };
function winPanel() {
  state = 'over'; newRunBus();
  const nx = level < LEVELS.length ? level + 1 : null, res = MODE && MODE.result ? MODE.result() : '';
  MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<p class="dr-stars">${'⭐'.repeat(stars)}${'<span style="opacity:.22">⭐</span>'.repeat(3 - stars)}</p>${res}<p>${CHEER[LV.theme] ? CHEER[LV.theme] + '<br>' : ''}噗噗打鼓打得好棒 ^_^</p>` + (nx ? `<p>下一關：${TYPE[LEVELS[nx - 1].type][0]} ${lvName(nx)}</p>` : '<p>你是最棒的小鼓手！🥁</p>'),
    buttons: [
      ...(nx ? [{ label: '下一關', on: () => { MG.store.set('drum.pickLevel', nx); startLevel(nx); } }] : []),
      { label: '再玩一次', alt: !!nx, on: () => startLevel(level) },
      { label: '選關卡', alt: true, on: menu },
    ],
  });
}

// =====================================================================
// drawing
// =====================================================================
let drawMs = 0;
function draw() {
  const t0 = performance.now();
  c = x;
  background();
  beams();
  drawCrew();
  drawAudience();
  drawPads();
  if (R.band && MODE && (state === 'play' || state === 'finale' || state === 'over' || state === 'intro')) MODE.draw();
  else if (R.band) menuBand();
  drawHero();
  MG.fx.draw(x);
  drawFloats();
  drawMs = drawMs * 0.9 + (performance.now() - t0) * 0.1;
}
function menuBand() {
  const r = R.band; screenBoard(r);
  const ids = ALLP, n = ids.length, cols = Math.ceil(n / 2), sz = Math.min(r.w / cols, r.h / 2) * 0.9;
  ids.forEach((id, i) => { const sp = sprite(id, sz * 0.36); const cx0 = r.x + (i % cols + 0.5) * r.w / cols, cy0 = r.y + (Math.floor(i / cols) + 0.5) * r.h / 2; x.drawImage(sp.cvs, cx0 - sp.box / 2, cy0 - sp.box / 2, sp.box, sp.box); });
}

// =====================================================================
// menu
// =====================================================================
const stLabel = n => { const v = progress[LEVELS[n - 1].id]; return v ? ' ' + '⭐'.repeat(v) : ''; };
// section headings inside the shared level grid (a full-width title before each section's first level; also in the ☰ menu)
function decorateGrid() {
  const g = document.querySelector('.mg-over .mg-lvgrid');
  if (!g || g.dataset.sections) return;
  g.dataset.sections = '1';
  g.querySelectorAll('.mg-lv').forEach(b => { if ((LEVELS[+b.dataset.lv - 1] || {}).type === 'song') b.classList.add('dr-song'); });
  let last = '';
  LEVELS.forEach((L, i) => {
    if (L.type === last) return; last = L.type;
    const b = g.querySelector(`.mg-lv[data-lv="${i + 1}"]`); if (!b) return;
    const sec = SECTIONS.find(q => q[0] === L.type), n = LEVELS.filter(q => q.type === L.type).length;
    const h = document.createElement('div');
    h.textContent = `${sec ? sec[1] : ''}（${n}）`;
    h.style.cssText = 'grid-column:1/-1;text-align:left;font-weight:900;font-size:calc(15px * var(--ui));color:#7a4a1c;margin:calc(8px * var(--ui)) 0 0;padding:0 2px calc(2px * var(--ui));border-bottom:2px dashed #f0dcae';
    g.insertBefore(h, b);
  });
}
new MutationObserver(decorateGrid).observe(document.body, { childList: true, subtree: true });
function menu() {
  state = 'menu'; beatOn = false; newRunBus();
  const pick = clamp(MG.store.get('drum.pickLevel', 1), 1, LEVELS.length);
  LV = LEVELS[pick - 1]; MODE = null; pads = makePads(KIT); hero.bubble = ''; layout();
  MG.choose({
    id: 'drum', title: '噗噗打鼓',
    html: `<p>咚！答！嚓！整套爵士鼓給你敲，還有牛鈴、邦哥鼓、鈴鼓和 🐸 青蛙鼓。<b>用好幾根手指一起敲</b>也可以 ^_^</p><p>${LEVELS.length} 關分成 🎵 兒歌節奏（有 👀 示範）、🥁 節奏練習、🦜 你打我也打、🌟 亮亮鼓、🎨 自由打，還有 👐 兩個一起敲、📣 你叫我應、🧩 補上那一拍、🎸 樂隊一起玩和 🏆 大舞台。動物樂隊和觀眾都在台下等你喔！</p>`,
    modes: [{ id: 'wait', label: '🐢 等等我', sub: '等你敲對才往前，不會失敗' }, { id: 'beat', label: '🥁 跟著拍子', sub: '跟著音樂敲，越準越多星' }],
    modesTitle: '🎵 兒歌、🥁 節奏練習和樂隊關卡的玩法',
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${TYPE[LEVELS[n - 1].type][0]} ${lvName(n)}${stLabel(n)}`, short: n => LEVELS[n - 1].type === 'song' ? LEVELS[n - 1].nm : `${n}${TYPE[LEVELS[n - 1].type][0]}` },
    keys: '點鼓就會響，可以好幾根手指一起敲　<kbd>1</kbd>～<kbd>0</kbd> 敲鼓　<kbd>空白鍵</kbd> 大鼓',
    playing: () => state === 'play' || state === 'finale',
    onPause: () => { held = true; if (ac) ac.suspend().catch(() => {}); },
    restore: () => { held = false; if (ac) ac.resume().catch(() => {}); },
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}

// =====================================================================
// main loop
// =====================================================================
MG.loop(dt => {
  dt *= SPEED; t += dt; frameAt = performance.now();
  if (state === 'play' && MODE) MODE.update(dt);
  else if (state === 'finale' || state === 'over') songT += dt;
  for (const p of pads) { p.hit = Math.max(0, p.hit - dt * 6); p.wob = Math.max(0, p.wob - dt * 1.6); p.stick = Math.max(0, p.stick - dt); p.hint = Math.max(0, p.hint - dt); if (state !== 'play' && p.friend && p.friend.out) { p.friend.out += dt * 1.6; if (p.friend.out > 1) p.friend = null; } }
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  for (const f of pfx) f.life -= dt * 2.6; pfx = pfx.filter(f => f.life > 0);
  excite = Math.max(0, excite - dt * 0.35); crewJump = Math.max(0, crewJump - dt * 1.2);
  if (cele > 0) { cele -= dt; fireT -= dt; if (fireT <= 0 && cele > 0.3) { fireT = 0.45; const th = THEMES[LV.theme] || THEMES.room; MG.fx.burst(W * (0.15 + Math.random() * 0.7), R.stage.y + R.crew.h * (0.3 + Math.random() * 0.6), { n: 22, colors: [th.acc, th.beam, '#ffd23f', '#fff'], shape: 'star', speed: 240, up: 40, size: 5, life: 0.9 }); } }
  hero.hit = Math.max(0, hero.hit - dt); hero.jump = Math.max(0, hero.jump - dt * 2.5);
  if (hero.moodT > 0) { hero.moodT -= dt; if (hero.moodT <= 0) hero.mood = 'happy'; }
  MG.fx.step(dt);
  if (state === 'play') hud();
  if (state === 'finale') { finT -= dt; if (finT <= 0) winPanel(); }
  draw();
});

// =====================================================================
// test hook
// =====================================================================
window.DRUMT = {
  get state() { return state; }, get level() { return level; }, get type() { return LV.type; }, get mode() { return mode; }, levels: LEVELS.length, LEVELS,
  start: (n, m = 'wait') => { mode = m; MG.store.set('drum.seen.' + (LEVELS[n - 1].type === 'light' && LEVELS[n - 1].dbl ? 'light2' : LEVELS[n - 1].type), true); startLevel(n); MG.hide(); state = 'play'; },
  startRaw: (n, m = 'wait') => { mode = m; startLevel(n); }, get drawMs() { return drawMs; }, press: k => { const b = btns.find(q => q.k === k); if (b && MODE.press) MODE.press(b); return !!b; },
  loops: () => MODE && MODE.loops ? MODE.loops.slice() : null, segs: () => MODE === RH ? RH.segs.map(g => g.call ? 'band' : g.reply ? 'reply' : g.who) : null, auto: () => MODE === RH ? RH.notes.filter(n => n.auto).length : 0,
  win: () => complete(3, 0), finishNow: () => { if (state === 'finale') finT = 0; },
  set bot(v) { bot = v; }, get bot() { return bot; }, set speed(v) { SPEED = v; },
  hit: id => { const i = padIx(id); if (i >= 0) tapPad(i, 0); return i; },
  pads: () => pads.map(p => ({ id: p.id, cx: p.cx, cy: p.cy, R: p.R, lit: p.lit })),
  padAt(id) { const p = pads[padIx(id)], rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + p.cx * (rc.width - 2 * B) / W, y: rc.top + B + (p.cy + p.hy * 0.4) * (rc.height - 2 * B) / H }; },
  btnAt(k) { const b = btns.find(q => q.k === k), rc = cv.getBoundingClientRect(), B = 3; return b && { x: rc.left + B + (b.x + b.w / 2) * (rc.width - 2 * B) / W, y: rc.top + B + (b.y + b.h / 2) * (rc.height - 2 * B) / H }; },
  info: () => ({ songT, notes: MODE && MODE.notes ? MODE.notes.length : 0, judged: MODE && MODE.notes ? MODE.notes.filter(n => n.judged).length : 0, cnt: MODE && MODE.cnt, prog: MODE ? MODE.prog() : '' }),
  chart: n => buildChart(LEVELS[n - 1]).notes.length,
  audio: () => ({ state: ac ? ac.state : 'none', muted: isMuted(), master: master ? master.gain.value : null }),
  layout: () => JSON.parse(JSON.stringify(R)), progress: () => ({ ...progress }),
  demo: () => { if (MODE === RH) RH.startDemo(); }, get demoing() { return MODE === RH && !!RH.demo; }, get id() { return LV.id; },
  next: () => MODE === RH && state === 'play' && !RH.demo ? ((RH.notes.find(n => !n.judged && !n.auto)) || {}).id || null : null,
  want: () => MODE === M.copy && MODE.phase === 'you' ? MODE.rounds[MODE.ri][MODE.idx] : MODE === M.light ? (pads.find(p => p.lit) || {}).id || null : null,
};
menu();
</script>
