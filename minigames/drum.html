<script>

MG.init({ id: 'drum', title: '噗噗打鼓', stats: ['level', 'prog'] });

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

// =====================================================================

  cow: { nm: '牛鈴', c: '#7d93ad', kind: 'cow' },

const ORDER = ['crash', 'tom1', 'tom2', 'ohat', 'hat', 'snare', 'kick', 'floor', 'cow', 'bongo', 'tamb', 'frog'];

// =====================================================================
// public-domain children's songs (scale degree : length in eighth notes, ',' = an octave lower)
// =====================================================================

// =====================================================================

// =====================================================================
const L_ = (type, theme, nm, o = {}) => ({ type, theme, nm, ...o });
const RB = 'kick:x...x... snare:..x...x.';   // the basic rock beat
const LEVELS = [

  L_('lesson', 'room', '小鼓答答', { pads: ['snare'], bpm: 88, bars: ['snare:x.x.x.x.', 'snare:x...x...'], rep: 3 }),

  L_('lesson', 'park', '咚咚下樓梯', { pads: ['tom1', 'tom2', 'floor'], bpm: 84, bars: ['tom1:xx...... tom2:..xx.... floor:....x.x.'], rep: 4 }),
  L_('light', 'park', '好玩樂器', { pads: FUN, n: 12 }),

  L_('lesson', 'stage', '加上大鈸', { pads: ['crash', 'hat', 'snare', 'kick'], bpm: 78, bars: ['crash:x....... hat:..x.x.x. ' + RB, 'hat:x.x.x.x. ' + RB], rep: 3 }),
  L_('copy', 'stage', '咚咚鼓', { pads: ['tom1', 'tom2', 'snare', 'floor'], lens: [3, 4, 4, 5] }),
  L_('lesson', 'room', '第一次過門', { pads: ['tom1', 'tom2', 'snare', 'kick', 'floor'], bpm: 76, bars: [RB, RB, RB, 'snare:xx...... tom1:..xx.... tom2:....xx.. floor:......xx'], rep: 2 }),
  L_('song', 'room', '小綿羊', { pads: ['cow', 'bongo'], song: 'mary', bpm: 104 }),
  L_('light', 'stage', '全套亮亮鼓', { pads: KIT, n: 14 }),
  L_('lesson', 'night', '嗒嗒嗒嗒', { pads: ['hat', 'snare', 'kick'], bpm: 70, bars: ['hat:xxxxxxxx ' + RB], rep: 4 }),
  L_('lesson', 'stage', '開鈸關鈸', { pads: ['ohat', 'hat', 'snare', 'kick'], bpm: 74, bars: ['hat:x.x.x... ohat:......x. ' + RB], rep: 4 }),
  L_('copy', 'night', '五個鼓', { pads: ['crash', 'hat', 'tom1', 'snare', 'kick'], lens: [4, 4, 5] }),
  L_('song', 'stage', '倫敦鐵橋', { pads: ['tamb', 'snare', 'kick'], song: 'london', bpm: 100 }),
  L_('lesson', 'park', '動物樂隊', { pads: ['tamb', 'cow', 'bongo', 'frog'], bpm: 84, bars: ['cow:x...x... bongo:..xx..x.', 'tamb:x.x.x.x.', 'cow:x...x... bongo:..xx..x.', 'frog:x...x... tamb:..x...x.'], rep: 2 }),
  L_('free', 'stage', '錄音大師', { pads: ALLP, task: 'rec' }),
  L_('light', 'night', '兩個一起亮', { pads: ALLP, n: 10, dbl: 1 }),
  L_('lesson', 'night', '跳舞節奏', { pads: ['ohat', 'snare', 'kick'], bpm: 80, bars: ['kick:x.x.x.x. ohat:.x.x.x.x', 'kick:x.x.x.x. ohat:.x.x.x.x snare:..x...x.'], rep: 3 }),
  L_('song', 'park', '王老先生', { pads: ['frog', 'tom1', 'floor'], song: 'oldmac', bpm: 108 }),
  L_('copy', 'stage', '大挑戰', { pads: KIT, lens: [4, 5, 5, 6], hide: 1 }),
  L_('lesson', 'stage', '大鼓手出場', { pads: ['crash', 'hat', 'tom1', 'tom2', 'snare', 'kick', 'floor'], bpm: 76, bars: ['crash:x....... hat:..x.x.x. ' + RB, 'hat:x.x.x.x. kick:x...x.x. snare:..x...x.', 'hat:x.x.x.x. ' + RB, 'snare:x.x..... tom1:....x... tom2:.....x.. floor:......xx'], rep: 2, outro: 1 }),
];
const TYPE = { lesson: ['🎶', '跟著打'], song: ['🎵', '兒歌節奏'], copy: ['🦜', '你打我也打'], light: ['🌟', '亮亮鼓'], free: ['🎨', '自由打'] };
const THEMES = {
  room: { wall: ['#fff1d6', '#ffe0c2'], floor: ['#e8b98a', '#c98f5c'], rug: '#ff8fa3', acc: '#ff7a8a' },
  stage: { wall: ['#5a3a8f', '#2e1f5c'], floor: ['#c98a52', '#8f5a2c'], rug: '#e0506e', acc: '#ffd23f', dark: 1 },
  park: { wall: ['#bfe8ff', '#e8f8ff'], floor: ['#8fd86a', '#5cb848'], rug: '#ff7a7a', acc: '#4cc96a' },
  night: { wall: ['#1d1f5a', '#3b2f7a'], floor: ['#4a3a7a', '#2e2458'], rug: '#7ad0ff', acc: '#ffe27a', dark: 1 },
};
const INTRO = {
  lesson: ['🎶 跟著打', '上面的格子裡，彩色的球會<b>一顆一顆跑過來</b>。球碰到左邊的線、下面的鼓<b>亮起來有圈圈</b>的時候，就敲那個鼓！<br>🐢 <b>等等我</b>：會停下來等你敲對才往前，不會失敗。<br>🥁 <b>跟著拍子</b>：跟著音樂的拍子敲，越準星星越多。'],
  song: ['🎵 兒歌節奏', '用鼓敲出兒歌的節奏！球跑到線上就敲亮亮的鼓。選 🐢 <b>等等我</b> 的時候，<b>你敲一下，歌就唱一個音</b>，敲完就是一整首歌 ^_^'],
  copy: ['🦜 你打我也打', '鸚鵡老師先敲一段（鼓會亮、上面的格子會出現），<b>輪到你的時候噗噗會舉手</b>，照一樣的順序敲！敲錯了亮亮的鼓會提醒你。忘記了就點鸚鵡再聽一次。'],
  light: ['🌟 亮亮鼓', '果凍朋友會從鼓裡<b>探出頭來</b>，鼓就會亮亮的。快敲一下那個鼓，把朋友變成星星收進瓶子裡！'],
  light2: ['🌟 兩個一起亮', '這次會<b>兩個鼓一起亮</b>！用兩根手指一起敲，或是一個一個敲都可以。'],
  free: ['🎨 自由打', '整套鼓都是你的，想怎麼敲就怎麼敲！上面有 <b>🔴 錄音、▶ 播放</b>，還有 <b>🎵 伴奏</b>（節拍器／鼓聲）和 🐢🐰 快慢。完成小任務會出現 ✅。'],
};
const TASKS = { hits: n => `敲 ${n} 下鼓`, beat: n => `打開 🎵 伴奏，跟著敲 ${n} 下`, rec: () => '按 🔴 錄一段，再按 ▶ 播放給大家聽' };
const lvName = n => LEVELS[n - 1].nm;

// =====================================================================
// audio — synthesized drums, one AudioContext
// =====================================================================
let ac = null, master = null, drumBus = null, runBus = null, noiseBuf = null, held = false, openG = null;
const isMuted = () => !!MG.store.get('muted', false);
function ensureAudio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    try { ac = new AC({ latencyHint: 'interactive' }); } catch { try { ac = new AC(); } catch { ac = null; return null; } }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 3.5; comp.attack.value = 0.002; comp.release.value = 0.16;
    master = ac.createGain(); master.connect(comp); comp.connect(ac.destination);
    drumBus = ac.createGain(); drumBus.gain.value = 1; drumBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // iOS / Android: one silent sample inside the first touch unlocks the speaker
    try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch {}
    applyMute(); newRunBus();
  }
  if (ac.state === 'suspended' && !held) ac.resume().catch(() => {});
  return ac;
}
for (const ev of ['pointerdown', 'touchend', 'click', 'keydown']) addEventListener(ev, () => ensureAudio(), true);
function applyMute() { if (master) master.gain.value = isMuted() ? 0 : 0.9; }
document.querySelector('.mg-bar .mute').addEventListener('click', () => setTimeout(applyMute, 0));
document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend().catch(() => {}); else if (!held) ac.resume().catch(() => {}); });
// a per-round bus for scheduled sounds (backing beat, melody, playback): cutting it silences them at once
function newRunBus() { if (!ac) return; if (runBus) { try { runBus.gain.value = 0; runBus.disconnect(); } catch {} } runBus = ac.createGain(); runBus.gain.value = 1; runBus.connect(master); }
function env(t, peak, att, rel, dest) { const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + att); g.gain.exponentialRampToValueAtTime(0.0001, t + att + rel); g.connect(dest); return g; }
function osc(type, f, t, end, dest) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(dest); o.start(t); o.stop(end); return o; }
function nz(t, dur, dest) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.connect(dest); s.start(t, Math.random() * 0.5, dur); return s; }
function flt(type, f, q, dest) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b; }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const V = {
  kick(t, v, d) {
    const g = env(t, 1.0 * v, 0.002, 0.42, d), o = osc('sine', 165, t, t + 0.5, g);
    o.frequency.exponentialRampToValueAtTime(52, t + 0.12); o.frequency.exponentialRampToValueAtTime(42, t + 0.42);
    const g2 = env(t, 0.32 * v, 0.001, 0.025, d); nz(t, 0.03, flt('lowpass', 2600, 0.7, g2));
  },
  snare(t, v, d) {
    const g = env(t, 0.55 * v, 0.001, 0.19, d); nz(t, 0.25, flt('highpass', 1300, 0.6, flt('peaking', 3500, 1, g)));
    const g2 = env(t, 0.42 * v, 0.001, 0.09, d), o = osc('triangle', 230, t, t + 0.12, g2); o.frequency.exponentialRampToValueAtTime(165, t + 0.08);
  },
  tom(t, v, d, f) {
    const g = env(t, 0.82 * v, 0.002, 0.38, d), o = osc('sine', f, t, t + 0.45, g); o.frequency.exponentialRampToValueAtTime(f * 0.62, t + 0.32);
    const g3 = env(t, 0.12 * v, 0.002, 0.12, d); osc('triangle', f * 1.6, t, t + 0.16, g3);
    const g2 = env(t, 0.16 * v, 0.001, 0.035, d); nz(t, 0.05, flt('lowpass', 3200, 0.7, g2));
  },
  metal(t, v, d, dur, hp, vol) {
    const g = env(t, vol * v, 0.001, dur, d), bp = flt('bandpass', 10000, 0.5, flt('highpass', hp, 0.7, g));
    for (const r of [2, 3, 4.16, 5.43, 6.79, 8.21]) osc('square', 40 * r, t, t + dur + 0.05, bp);
    const gn = env(t, vol * 0.5 * v, 0.001, dur * 0.8, d); nz(t, dur + 0.05, flt('highpass', hp + 1000, 0.7, gn));
    return [g, gn];
  },
  hat(t, v, d) { choke(t); V.metal(t, v, d, 0.055, 7000, 0.5); },
  ohat(t, v, d) { choke(t); openG = V.metal(t, v, d, 0.55, 6500, 0.38); },
  crash(t, v, d) { V.metal(t, v, d, 1.5, 4200, 0.36); const g = env(t, 0.2 * v, 0.004, 1.3, d); nz(t, 1.4, flt('highpass', 3500, 0.6, g)); },
  cow(t, v, d) { const g = env(t, 0.34 * v, 0.001, 0.32, d), bp = flt('bandpass', 950, 1.4, g); osc('square', 562, t, t + 0.36, bp); osc('square', 845, t, t + 0.36, bp); },
  bongo(t, v, d, hi) {
    const f = hi ? 430 : 300, g = env(t, 0.62 * v, 0.001, 0.17, d), o = osc('sine', f * 1.3, t, t + 0.22, g); o.frequency.exponentialRampToValueAtTime(f, t + 0.03);
    const g2 = env(t, 0.16 * v, 0.001, 0.02, d); nz(t, 0.03, flt('bandpass', 2400, 1, g2));
  },
  tamb(t, v, d) {
    for (const [k, a] of [[0, 1], [0.022, 0.6], [0.05, 0.4]]) { const g = env(t + k, 0.3 * v * a, 0.001, 0.13 + k * 2, d); nz(t + k, 0.25, flt('bandpass', 10500, 1.6, flt('highpass', 6500, 0.7, g))); }
    const g2 = env(t, 0.06 * v, 0.001, 0.2, d), bp = flt('bandpass', 7500, 2, g2); osc('square', 4600, t, t + 0.24, bp); osc('square', 6300, t, t + 0.24, bp);
  },
  frog(t, v, d) {
    for (const [k, f] of [[0, 175], [0.12, 150]]) {
      const g = env(t + k, 0.3 * v, 0.006, 0.085, d), lp = flt('lowpass', 1000, 4, g), o = osc('sawtooth', f, t + k, t + k + 0.13, lp);
      o.frequency.exponentialRampToValueAtTime(f * 1.4, t + k + 0.07);
    }
    V.tom(t, 0.4 * v, d, 140);
  },

function padAtPoint(pt) {

    const lim = Math.min(Math.max(p.R * 1.12, 40), Math.min(p.cw, p.ch) * 0.55);

// one drum hit: sound right away, animate, tell the mode

  const p = pads[i]; if (!p) return;
  ensureAudio();
  const sd = p.id === 'bongo' ? (side || (Math.random() < 0.5 ? -1 : 1)) : side;
  if (ac) sound(p.id, ac.currentTime, 1, sd, drumBus);
  animPad(p, sd); heroHit(sd);
  if (state === 'play' && MODE) { if (MODE.hit) MODE.hit(p, sd); if (MODE.onHit) MODE.onHit(p, sd, user); hud(); }
}

function press(pt) {

  if (state === 'play') {
    const b = btns.find(q => inR(pt, q)); if (b && MODE.press) { MODE.press(b); hud(); return; }
    if (MODE.tapBand && inR(pt, R.band) && MODE.tapBand(pt)) return;
  }

  if (i >= 0) { const p = pads[i]; tapPad(i, p.id === 'bongo' ? (pt.x < p.cx ? -1 : 1) : (pt.x < p.cx ? 1 : -1)); return; }
  if (inR(pt, R.hero)) { hero.jump = 1; heroMood('tongue', 0.8); MG.sfx('boing'); }
}

const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '='];

    const I = INTRO[key];
    state = 'intro';
    MG.panel({ title: I[0], html: `<div class="dr-new"><b class="ic">${I[0].split(' ')[0]}</b><p>${I[1]}</p></div>` + (LV.type === 'free' ? `<p>🎯 ${TASKS[LV.task](LV.n)}</p>` : ''), buttons: [{ label: '開始', on: () => { MG.hide(); state = 'play'; } }] });
  } else if (LV.type === 'free') MG.toast('🎯 ' + TASKS[LV.task](LV.n), 2400);
}
function complete(st, delay = 0.8) {
  if (state !== 'play') return;
  state = 'finale'; stars = st; finT = 2.2 + delay;
  if (MODE === M.free) MODE.stopPlay();
  setTimeout(() => { if (state !== 'finale') return; MG.sfx('clear'); setTimeout(() => MG.sfx('yay'), 300); if (ac) { const t0 = ac.currentTime + 0.05; sound('crash', t0, 0.8, 0, drumBus); sound('kick', t0, 1, 0, drumBus); } }, delay * 1000);
  heroMood('love', 3); hero.jump = 1; beatOn = false;
  for (let k = 0; k < 3; k++) setTimeout(() => MG.fx.burst(W * (0.25 + k * 0.25), H * 0.4, { n: 24, colors: ['#ff5d8f', '#ffd23f', '#4cc96a', '#3d8bff', '#fff'], shape: k % 2 ? 'star' : 'sq', speed: 300, up: 180, size: 7 }), delay * 1000 + k * 240);
  const was = progress[level] || 0; if (st > was) { progress[level] = st; MG.store.set('drum.done', progress); }
  MG.record('drum', doneCount());
}
function winPanel() {
  state = 'over'; newRunBus();
  const nx = level < LEVELS.length ? level + 1 : null, res = MODE && MODE.result ? MODE.result() : '';
  MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<p class="dr-stars">${'⭐'.repeat(stars)}${'<span style="opacity:.22">⭐</span>'.repeat(3 - stars)}</p>${res}<p>噗噗打鼓打得好棒 ^_^</p>` + (nx ? `<p>下一關：${TYPE[LEVELS[nx - 1].type][0]} ${lvName(nx)}</p>` : '<p>你是最棒的小鼓手！🥁</p>'),
    buttons: [
      ...(nx ? [{ label: '下一關', on: () => { MG.store.set('drum.pickLevel', nx); startLevel(nx); } }] : []),
      { label: '再玩一次', alt: !!nx, on: () => startLevel(level) },
      { label: '選關卡', alt: true, on: menu },
    ],
  });
}

// =====================================================================
// drawing
// =====================================================================
function draw() {
  c = x;
  background();
  if (R.band && MODE && (state === 'play' || state === 'finale' || state === 'over' || state === 'intro')) MODE.draw();
  else if (R.band) menuBand();
  drawHero();
  drawPads();
  MG.fx.draw(x);
  drawFloats();
}
function menuBand() {
  const r = R.band; board(r);
  const ids = ALLP, n = ids.length, cols = Math.ceil(n / 2), sz = Math.min(r.w / cols, r.h / 2) * 0.9;
  ids.forEach((id, i) => { const sp = sprite(id, sz * 0.36); const cx0 = r.x + (i % cols + 0.5) * r.w / cols, cy0 = r.y + (Math.floor(i / cols) + 0.5) * r.h / 2; x.drawImage(sp.cvs, cx0 - sp.box / 2, cy0 - sp.box / 2, sp.box, sp.box); });
}

// =====================================================================
// menu
// =====================================================================
const stLabel = n => progress[n] ? ' ' + '⭐'.repeat(progress[n]) : '';
function menu() {
  state = 'menu'; beatOn = false; newRunBus();
  const pick = clamp(MG.store.get('drum.pickLevel', 1), 1, LEVELS.length);
  LV = LEVELS[pick - 1]; MODE = null; pads = makePads(KIT); hero.bubble = ''; layout();
  MG.choose({
    id: 'drum', title: '噗噗打鼓',
    html: `<p>咚！答！嚓！整套爵士鼓給你敲，還有牛鈴、邦哥鼓、鈴鼓和 🐸 青蛙鼓。<b>用好幾根手指一起敲</b>也可以 ^_^</p><p>30 關有 🎶 跟著打、🎵 兒歌節奏、🦜 你打我也打、🌟 亮亮鼓和 🎨 自由打（可以錄音、開伴奏）。</p>`,
    modes: [{ id: 'wait', label: '🐢 等等我', sub: '等你敲對才往前，不會失敗' }, { id: 'beat', label: '🥁 跟著拍子', sub: '跟著音樂敲，越準越多星' }],
    modesTitle: '🎶 跟著打和 🎵 兒歌的玩法',
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${TYPE[LEVELS[n - 1].type][0]} ${lvName(n)}${stLabel(n)}`, short: n => `${n}${TYPE[LEVELS[n - 1].type][0]}` },
    keys: '點鼓就會響，可以好幾根手指一起敲　<kbd>1</kbd>～<kbd>0</kbd> 敲鼓　<kbd>空白鍵</kbd> 大鼓',
    playing: () => state === 'play' || state === 'finale',
    onPause: () => { held = true; if (ac) ac.suspend().catch(() => {}); },
    restore: () => { held = false; if (ac) ac.resume().catch(() => {}); },
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}

// =====================================================================
// main loop
// =====================================================================
MG.loop(dt => {
  dt *= SPEED; t += dt; frameAt = performance.now();
  if (state === 'play' && MODE) MODE.update(dt);
  else if (state === 'finale' || state === 'over') songT += dt;
  for (const p of pads) { p.hit = Math.max(0, p.hit - dt * 6); p.wob = Math.max(0, p.wob - dt * 1.6); p.stick = Math.max(0, p.stick - dt); p.hint = Math.max(0, p.hint - dt); if (state !== 'play' && p.friend && p.friend.out) { p.friend.out += dt * 1.6; if (p.friend.out > 1) p.friend = null; } }
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  hero.hit = Math.max(0, hero.hit - dt); hero.jump = Math.max(0, hero.jump - dt * 2.5);
  if (hero.moodT > 0) { hero.moodT -= dt; if (hero.moodT <= 0) hero.mood = 'happy'; }
  MG.fx.step(dt);
  if (state === 'play') hud();
  if (state === 'finale') { finT -= dt; if (finT <= 0) winPanel(); }
  draw();
});

// =====================================================================
// test hook
// =====================================================================
window.DRUMT = {
  get state() { return state; }, get level() { return level; }, get type() { return LV.type; }, get mode() { return mode; }, levels: LEVELS.length, LEVELS,
  start: (n, m = 'wait') => { mode = m; MG.store.set('drum.seen.' + (LEVELS[n - 1].type === 'light' && LEVELS[n - 1].dbl ? 'light2' : LEVELS[n - 1].type), true); startLevel(n); MG.hide(); state = 'play'; },
  win: () => complete(3, 0), finishNow: () => { if (state === 'finale') finT = 0; },
  set bot(v) { bot = v; }, get bot() { return bot; }, set speed(v) { SPEED = v; },
  hit: id => { const i = padIx(id); if (i >= 0) tapPad(i, 0); return i; },
  pads: () => pads.map(p => ({ id: p.id, cx: p.cx, cy: p.cy, R: p.R, lit: p.lit })),
  padAt(id) { const p = pads[padIx(id)], rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + p.cx * (rc.width - 2 * B) / W, y: rc.top + B + (p.cy + p.hy * 0.4) * (rc.height - 2 * B) / H }; },
  btnAt(k) { const b = btns.find(q => q.k === k), rc = cv.getBoundingClientRect(), B = 3; return b && { x: rc.left + B + (b.x + b.w / 2) * (rc.width - 2 * B) / W, y: rc.top + B + (b.y + b.h / 2) * (rc.height - 2 * B) / H }; },
  info: () => ({ songT, notes: MODE && MODE.notes ? MODE.notes.length : 0, judged: MODE && MODE.notes ? MODE.notes.filter(n => n.judged).length : 0, cnt: MODE && MODE.cnt, prog: MODE ? MODE.prog() : '' }),
  chart: n => buildChart(LEVELS[n - 1]).notes.length,
  audio: () => ({ state: ac ? ac.state : 'none', muted: isMuted(), master: master ? master.gain.value : null }),
  layout: () => JSON.parse(JSON.stringify(R)), progress: () => ({ ...progress }),
  want: () => MODE === M.copy && MODE.phase === 'you' ? MODE.rounds[MODE.ri][MODE.idx] : MODE === M.light ? (pads.find(p => p.lit) || {}).id || null : null,
};
menu();
</script>
</body>
</html>
