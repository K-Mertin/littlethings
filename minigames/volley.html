}

  get balls() { return balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, hold: b.hold, srv: b.srv ? b.srv.kind : null })); }, get players() { return players.map(p => ({ x: p.x, y: p.y, ground: p.ground, side: p.side, kind: p.kind, ai: !!p.ai })); },
  get wind() { return wind; }, stages: STAGES.length, get pace() { return pace; }, get mode() { return mode; }, get crowd() { return crowd.length; },
  play: (n, p = 'normal', m = 'cpu') => { pace = p; mode = m; setStage(n); start(); MG.hide(); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) update(dt); },
  // finish the current match / challenge as a win (tests)
  win() { if (chal) { chal.n = ST.goal; chalWin(); } else { score = [WIN, 0]; endMatch(); } },
  // a simple helper "player": runs under the ball (or the target spot) and taps jump
  auto(sec, dt = 1 / 60) {
    for (let i = 0, n = Math.round(sec / dt); i < n && (state === 'play' || state === 'point'); i++) {
      const p = hero(), inp = input[0];
      let b = null, bt = 1e9; for (const q of balls) { if (q.hold > 0 && q.srv) continue; const lx = predictX(q, GROUND - R * 2); if (lx < NETX + 10) { const tt = (GROUND - q.y) / Math.max(50, q.vy + 400); if (tt < bt) { bt = tt; b = q; } } }
      let tx = b ? predictX(b, GROUND - R * 2) - (ST.chal === 'keep' ? 0 : 12) : 160;
      if (ST.chal === 'balloon' && b) { const q = chal.balloons.find(o => !o.pop); if (q) tx += q.x > NETX ? -10 : 6; }
      inp.l = tx < p.x - 6; inp.r = tx > p.x + 6; inp.jp = false;
      const aimX = ST.chal === 'target' ? chal.tx : ST.chal === 'cans' ? ((chal.blocks.find(q => !q.dead) || {}).x ?? chal.tx) : null;
      if (aimX != null && b && Math.abs(b.x - p.x) < 50 && p.y - b.y < 90 && b.vy > 0) {   // lean so the bump lands on the spot
        let bl = 0, bd = 1e9; const dx = b.x - p.x, vm = VM(), g = G();
        for (const ln of [-1, 0, 1]) { const vx = (250 + ln * 120 + dx * 2.5) * vm, vy = -560 * vm, y0 = p.y - (R + BR) * 0.7, tt = (-vy + Math.sqrt(vy * vy + 2 * g * (GROUND - BR - y0))) / g; let lx = b.x + vx * tt + 0.5 * wind * tt * tt; if (lx > W - BR) lx = 2 * (W - BR) - lx; if (Math.abs(lx - aimX) < bd) { bd = Math.abs(lx - aimX); bl = ln; } }
        inp.r = bl > 0; inp.l = bl < 0;
      }
      if (b && ST.chal !== 'keep' && p.ground && Math.abs(b.x - p.x) < 40 && p.y - b.y > 60 && p.y - b.y < 140 && b.vy > 0 && Math.random() < 0.08) inp.jp = true;
      update(dt);
    }
    input[0].l = input[0].r = false;
  },
  menu: () => menu(),
};
