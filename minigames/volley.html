<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗排球</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:linear-gradient(#bfe6ff,#fff3d6)}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:10px}
.modes .mg-btn{min-width:0;font-size:15px;min-height:56px;padding:4px 8px;line-height:1.25}
.modes .mg-btn small{display:block;font-weight:400;font-size:12px}
</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'volley', title: '噗噗排球', stats: ['score'] });
const W = 640, H = 360, cv = document.getElementById('cv'), x = cv.getContext('2d');   // W×H = the court (the rules live here)
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
// the canvas takes the stage's shape (CW×CH) and the court sits in it 1:1 at (OX, OY):
// wide screens get more room at the sides (scores there), tall screens more sky above and a big "touch pad" below
let CW = W, CH = H, OX = 0, OY = 0;
function layout(sw, sh) {
  const a = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));   // 22 = stage padding + canvas border
  if (a >= W / H) { CH = H; CW = Math.round(H * a); OX = Math.round((CW - W) / 2); OY = 0; }
  else { CW = W; CH = Math.round(W / a); OX = 0; const ex = CH - H; OY = Math.round(ex <= 130 ? ex : 130 + (ex - 130) * 0.22); }
  bgK = '';
  return [CW, CH];
}
const cssK = () => (parseFloat(cv.style.width) || CW) / CW;
const TXT = px => Math.min(px * 2.4, px * MG.textScale / Math.min(1.25, cssK()));
const courtX = e => cv.logical(e).x - OX;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

const GROUND = 318, NETX = 320, NETW = 8, NETTOP = 196, R = 30, GRAV_P = 1500, GRAV_B = 820, SPEED = 270, JUMP = 620;
let BR = 15, WIN = 7, REACH = R + BR + 34;
const AIS = [
  { name: '簡單', speed: 0.5, react: 0.32, err: 40, jump: 0.3, spike: 0.08, blunder: 0.4 },
  { name: '普通', speed: 0.8, react: 0.16, err: 18, jump: 0.65, spike: 0.35, blunder: 0.24 },
  { name: '困難', speed: 1.0, react: 0.06, err: 6, jump: 0.95, spike: 0.75, blunder: 0.05 },
];
// ---------- courts, friends and the level path ----------
const COURTS = {
  beach: { name: '海灘', e: '🏖️' }, park: { name: '公園', e: '🌳' }, snow: { name: '雪地', e: '❄️' }, night: { name: '夜晚海灘', e: '🌙' }, roof: { name: '屋頂', e: '🏙️' },
};
const FOES = {
  cpu: { name: '電腦', pal: 'pink', band: '#3d9bff' }, pink: { name: '粉紅噗噗', pal: 'pink', band: '#ffd23f' }, blue: { name: '藍藍', pal: 'blue', band: '#ff8a3d' },
  red: { name: '紅紅', pal: 'red', band: '#3d9bff' }, orange: { name: '橘橘', pal: 'orange', band: '#3d9bff' }, purple: { name: '紫紫', pal: 'purple', band: '#ffd23f' }, yellow: { name: '黃黃', pal: 'yellow', band: '#9a72f0' },
};
// ai: 0 簡單 1 普通 2 困難 · win: points to win · chal: keep (顛球) / target (丟圈圈) / balloon (打氣球) with a goal
// wind: gusts that push the ball · slip: icy ground · balls: two at once · bouncy: one free bounce · float: big slow beach ball
const STAGES = [
  { name: '對電腦・簡單', court: 'beach', foe: 'cpu', ai: 0, win: 7 },
  { name: '對電腦・普通', court: 'beach', foe: 'cpu', ai: 1, win: 7 },
  { name: '對電腦・困難', court: 'beach', foe: 'cpu', ai: 2, win: 7 },
  { name: '顛球 10 下', court: 'beach', chal: 'keep', goal: 10, mk: '🏐' },
  { name: '公園起風了', court: 'park', foe: 'blue', ai: 0, win: 5, wind: 70, mk: '🍃' },
  { name: '丟進圈圈', court: 'park', chal: 'target', goal: 5, mk: '🎯' },
  { name: '雪地滑溜溜', court: 'snow', foe: 'red', ai: 0, win: 5, slip: true, mk: '⛸️' },
  { name: '兩顆球', court: 'beach', foe: 'orange', ai: 0, win: 5, balls: 2, mk: '✌️' },
  { name: '打氣球', court: 'beach', chal: 'balloon', goal: 8, mk: '🎈' },
  { name: '夜晚燈籠球', court: 'night', foe: 'purple', ai: 0, win: 5, mk: '🏮' },
  { name: '屋頂彈彈球', court: 'roof', foe: 'yellow', ai: 1, win: 5, bouncy: true, mk: '💫' },
  { name: '大海灘球', court: 'beach', foe: 'pink', ai: 1, win: 5, float: true, mk: '🫧' },
  { name: '雪地顛球 20 下', court: 'snow', chal: 'keep', goal: 20, mk: '🏐' },
  { name: '大風吹', court: 'park', foe: 'blue', ai: 1, win: 5, wind: 130, mk: '🍃' },
  { name: '雪地兩顆球', court: 'snow', foe: 'red', ai: 1, win: 5, balls: 2, slip: true, mk: '✌️' },
  { name: '會動的圈圈', court: 'roof', chal: 'target', goal: 7, moving: true, mk: '🎯' },
  { name: '夜晚的風', court: 'night', foe: 'purple', ai: 1, win: 5, wind: 90, mk: '🏮' },
  { name: '彈彈海灘球', court: 'roof', foe: 'yellow', ai: 1, win: 5, bouncy: true, float: true, mk: '💫' },
  { name: '夜晚打氣球', court: 'night', chal: 'balloon', goal: 12, mk: '🎈' },
  { name: '冠軍決賽', court: 'beach', foe: 'pink', ai: 2, win: 7, mk: '🏆' },
];
// new things get a one-time explanation panel
const NEWS = {
  slow: ['🐢 慢慢打', '慢慢打的時候球會飛得比較慢，對手拿幾分都沒關係，<b>你先拿到分數就贏</b>！'],
  keep: ['🏐 顛球', '這裡沒有對手！球掉下來時跑到球下面讓它彈起來，一直不要讓球落地。頂到木牌上的數字就過關！'],
  target: ['🎯 丟進圈圈', '把球打過網，讓球掉進對面沙地上的<b>圈圈</b>裡！跳起來殺球可以打得比較遠，按著往後就打得高高近近的。'],
  balloon: ['🎈 打氣球', '天上飄著氣球，用球去碰它，「啵」一聲就破掉了！球掉到地上沒關係，會再發一次球。'],
  wind: ['🍃 起風了', '風會把球往旁邊吹。看看網子上的小旗子和上面的箭頭，就知道風往哪邊吹喔！'],
  slip: ['⛸️ 滑溜溜', '雪地很滑，跑起來會停不下來，要早一點出發、早一點停下來。'],
  balls: ['✌️ 兩顆球', '這一場有<b>兩顆球</b>一起打！哪一顆球掉到誰的地上，對面就得一分。'],
  night: ['🏮 燈籠球', '天黑了，球變成會發光的燈籠，燈籠旁邊才看得清楚。'],
  bouncy: ['💫 彈彈球', '屋頂上的球很有彈性，掉到地上會<b>先彈起來一次</b>，第二次落地才算分。'],
  float: ['🫧 大海灘球', '又大又輕的海灘球會慢慢飄，比較好接，但是打不遠喔。'],
};
const newsOf = S => [S.chal, S.wind && 'wind', S.slip && 'slip', S.balls > 1 && 'balls', S.court === 'night' && 'night', S.bouncy && 'bouncy', S.float && 'float'].filter(Boolean);

let hits = 0, rally = 0;
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
function rallyUp() { rally++; if (rally >= 6 && rally % 3 === 0) { snd('combo', Math.min(10, rally / 2)); if (rally % 6 === 0) snd('sparkle'); banner = { t: `Rally ×${rally} 🔥`, life: 0.8, x: W / 2, y: 86 }; } }
let bgC = null, bgK = '';
let mode = 'cpu', pace = 'normal', stage = 1, ST = STAGES[0], level = 0, players, ball, balls = [], score, server, state = 'menu', pauseT = 0, banner = null, t = 0, shake = 0, trail = [];
let chal = null, wind = 0, windPh = 0, flakes = [], leaves = [];
const input = [{ l: false, r: false, j: false, jp: false }, { l: false, r: false, j: false, jp: false }];
// ball physics for this level: a floaty beach ball and 🐢 slow play make it fall slower (and get hit softer, so it still flies the same arc)
const GM = () => (ST.float ? 0.55 : 1) * (pace === 'relax' ? 0.8 : 1), VM = () => (ST.float ? 0.74 : 1) * (pace === 'relax' ? 0.9 : 1);
const G = () => GRAV_B * GM();

function makePlayer(side) {
  return { side, x: side ? 480 : 160, y: GROUND - R, vx: 0, vy: 0, ground: true, spikeT: 0, squash: 0, mood: 'happy', moodT: 0,
    ai: side === 1 && mode === 'cpu' ? { tx: 480, rt: 0, seen: -2, off: 0 } : null };
}
function newBall(side, hold = 0.9) { return { x: side ? 480 : 160, y: 90, vx: 0, vy: 0, rot: 0, hold, last: -1, spiked: 0, bounced: false }; }
function resetRally(srv) {
  server = srv;
  players = ST.chal && mode !== 'pvp' ? [makePlayer(0)] : [makePlayer(0), makePlayer(1)];
  balls = [newBall(ST.chal ? 0 : srv)];
  if (ST.balls > 1 && !ST.chal) balls.push(newBall(1 - srv, 1.9));
  ball = balls[0]; trail = []; rally = 0;
}
function newMatch() { score = [0, 0]; resetRally(ST.chal ? 0 : Math.random() < 0.5 ? 0 : 1); state = 'play'; banner = { t: 'Go! 🚀', life: 1 }; MG.sfx('whoosh'); hud(); }
function hud() { if (chal) MG.stat('score', `${{ keep: '🏐', target: '🎯', balloon: '🎈' }[ST.chal]} ${chal.n}/${ST.goal}`); else MG.stat('score', `${score[0]} : ${score[1]}`); }

// ---------- input ----------
const KEYS1 = { a: 'l', A: 'l', d: 'r', D: 'r', w: 'j', W: 'j' }, KEYS2 = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'j' };
function keyMap(e) {
  if (mode === 'cpu') { const k = KEYS1[e.key] || KEYS2[e.key] || (e.key === ' ' ? 'j' : null); return k ? [0, k] : null; }
  if (KEYS1[e.key]) return [0, KEYS1[e.key]];
  if (KEYS2[e.key]) return [1, KEYS2[e.key]];
  if (e.key === 'Enter') return [1, 'j'];
  if (e.key === ' ') return [0, 'j'];
  return null;
}
addEventListener('keydown', e => { const m = keyMap(e); if (!m || MG.panelOpen()) return; e.preventDefault(); const [p, k] = m; if (k === 'j' && !input[p].j) input[p].jp = true; input[p][k] = true; });
addEventListener('keyup', e => { const m = keyMap(e); if (!m) return; input[m[0]][m[1]] = false; });
addEventListener('blur', () => input.forEach(i => { i.l = i.r = i.j = false; }));
// ---------- touch: one finger per player ----------
// hold and drag on your half of the sand -> your jelly runs to your finger;
// tap -> jump (and run to where you tapped); tap while in the air -> spike.
// No buttons near the screen edges, so tablet edge swipes and multi-finger
// system gestures are not triggered by play.
const touches = new Map(), tTarget = [null, null], tHold = [false, false];
let touchHintT = 0, touchSeq = 0;
const ownerOf = lx => mode === 'pvp' ? (lx < NETX ? 0 : 1) : 0;
const sideClamp = (p, lx) => p ? Math.max(NETX + NETW / 2 + R, Math.min(W - R, lx)) : Math.max(R, Math.min(NETX - NETW / 2 - R, lx));
// fingers are accepted during play and during the short pause after a point,
// so a finger that lands in that pause still works when the next rally starts
const inPlay = () => (state === 'play' || state === 'point') && !MG.panelOpen();
const fingersOf = p => [...touches.values()].filter(q => q.p === p);
// the finger that steers a player = the newest one that is "steering" (first finger, or one held for a while)
function steerFinger(p) { let best = null; for (const q of touches.values()) if (q.p === p && q.steer && (!best || q.seq > best.seq)) best = q; return best; }
function jumpNow(p) { if (state === 'play') input[p].jp = true; }
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || !inPlay() || e.target.closest('.mg-bar,.mg-over')) return;
  e.preventDefault();
  const lx = courtX(e), p = ownerOf(lx), pl = players[p]; if (!pl) return;
  const mine = fingersOf(p);
  if (mine.length >= 2) return;                     // a third finger (or a palm) on the same side does nothing
  const rec = { p, id: e.pointerId, seq: ++touchSeq, x0: e.clientX, y0: e.clientY, t0: performance.now(), lx: sideClamp(p, lx), moved: false, jumped: false, steer: mine.length === 0 };
  touches.set(e.pointerId, rec);
  if (mine.length) { jumpNow(p); rec.jumped = true; }          // hold with one finger, tap with another = jump / spike
  else if (!pl.ground) { jumpNow(p); rec.jumped = true; }       // tap while flying = spike
  if (rec.steer) { tTarget[p] = rec.lx; tHold[p] = true; }
  MG.unlock();
}, { passive: false });
addEventListener('pointermove', e => {
  const rec = touches.get(e.pointerId); if (!rec) return;
  e.preventDefault();
  const dx = e.clientX - rec.x0, dy = e.clientY - rec.y0;
  if (Math.hypot(dx, dy) > 14) rec.moved = true;
  rec.lx = sideClamp(rec.p, courtX(e));
  // a second finger that is held and dragged takes over the steering (the child switched fingers)
  if (!rec.steer && rec.moved && performance.now() - rec.t0 > 250) rec.steer = true;
  if (steerFinger(rec.p) === rec) { tTarget[rec.p] = rec.lx; tHold[rec.p] = true; }
  // quick upward flick also jumps
  if (!rec.jumped && dy < -30 && performance.now() - rec.t0 < 260 && players[rec.p] && players[rec.p].ground) { jumpNow(rec.p); rec.jumped = true; }
}, { passive: false });
function endTouch(e) {
  const rec = touches.get(e.pointerId); if (!rec) return;
  touches.delete(e.pointerId);
  if (e.type === 'pointerup' && !rec.jumped && !rec.moved && performance.now() - rec.t0 < 280) jumpNow(rec.p);     // a tap
  const next = steerFinger(rec.p) || fingersOf(rec.p)[0];
  if (next) { next.steer = true; tTarget[rec.p] = next.lx; tHold[rec.p] = true; }   // the other finger keeps steering
  else if (rec.steer) {
    tHold[rec.p] = false;
    if (rec.moved) tTarget[rec.p] = null;      // let go after dragging: stop; after a tap: keep running to the tapped spot
  }
}
addEventListener('pointerup', endTouch); addEventListener('pointercancel', endTouch);
// stop the browser from scrolling, zooming or long-press menus while playing
document.addEventListener('touchmove', e => { if ((state === 'play' || state === 'point') && !e.target.closest('.mg-over')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
function steerTouch() {
  for (const p of [0, 1]) {
    if (tTarget[p] == null || !players[p] || players[p].ai) continue;
    const d = tTarget[p] - players[p].x;
    input[p].l = d < -8; input[p].r = d > 8;
    if (Math.abs(d) <= 8 && !tHold[p]) { tTarget[p] = null; input[p].l = input[p].r = false; }
  }
}
function showPads() { touches.clear(); tTarget[0] = tTarget[1] = null; tHold[0] = tHold[1] = false; touchHintT = isTouch ? 4 : 0; }

// ---------- AI ----------
function predictX(b, targetY) {
  let bx = b.x, by = b.y, vx = b.vx, vy = b.vy;
  if (b.hold > 0) return bx;
  const g = G();
  for (let i = 0; i < 300; i++) {
    const dt = 1 / 60; vy += g * dt; vx += wind * dt; bx += vx * dt; by += vy * dt;
    if (bx < BR) { bx = BR; vx = -vx; } if (bx > W - BR) { bx = W - BR; vx = -vx; }
    if (vy > 0 && by >= targetY) return bx;
  }
  return bx;
}
// with two balls the friend watches the one coming to its side first
function aiBall() {
  if (balls.length < 2) return balls[0];
  let best = balls[0], bt = 1e9;
  for (const b of balls) { if (b.hold > 0) continue; const lx = predictX(b, GROUND - R * 2.2), tt = lx > NETX ? (GROUND - b.y) / Math.max(60, b.vy + 300) : 50 + (b.x > NETX ? 0 : 10); if (tt < bt) { bt = tt; best = b; } }
  return best;
}
function aiThink(p, dt) {
  const L0 = AIS[level], L = pace === 'relax' ? { ...L0, blunder: Math.min(0.6, L0.blunder + 0.22), speed: L0.speed * 0.85, spike: L0.spike * 0.4 } : L0, a = p.ai, inp = input[1];
  const keep = ball; ball = aiBall();
  a.rt -= dt;
  if (ball.last !== a.seen) { a.seen = ball.last; a.off = ball.last === 0 && Math.random() < L.blunder ? MG.pick([-1, 1]) * MG.rand(75, 115) : 0; a.adj = MG.pick([-1, 0, 0, 1]); }
  if (a.rt <= 0) {
    a.rt = L.react;
    const px = predictX(ball, GROUND - R * 2.2);
    if (px > NETX) a.tx = Math.max(NETX + R, Math.min(W - R, px + 10 + (a.off || 0) + MG.rand(-L.err, L.err)));
    else a.tx = 470 + MG.rand(-20, 20);
  }
  inp.l = inp.r = false;
  const d = a.tx - p.x;
  if (Math.abs(d) > 6) { if (Math.random() < L.speed + 0.15) { inp.l = d < 0; inp.r = d > 0; } }
  inp.jp = false;
  const dx = ball.x - p.x, dy = p.y - ball.y;
  if (p.ground && ball.x > NETX && Math.abs(dx) < 46 && dy > 50 && dy < 150 && ball.vy > -100 && Math.random() < L.jump * dt * 8) inp.jp = true;
  if (!p.ground && Math.hypot(dx, dy) < REACH && ball.x < 540 && Math.random() < L.spike * dt * 12) inp.jp = true;
  ball = keep;
}

// ---------- physics ----------
// make sure a shot from our side clears the net: if the planned arc would hit it,
// lift it just enough to pass over the top
function clearNet(toward) {
  const dxNet = (NETX - toward * (NETW / 2 + BR + 4)) - ball.x;
  if (dxNet * toward <= 0 || ball.vx * toward <= 0) return;
  const tn = dxNet / ball.vx, clearY = NETTOP - BR - 8;
  const vyMax = (clearY - ball.y - 0.5 * G() * tn * tn) / tn;
  if (ball.vy > vyMax) ball.vy = vyMax;
}
function spike(p) {
  if (ST.chal === 'keep') return bump(p);
  const toward = p.side ? -1 : 1, ln = lean(p), vm = VM();
  // hold toward the net = long and flat, hold away = steep and short, nothing = in between
  ball.vx = toward * (ln > 0 ? 680 : ln < 0 ? 470 : 600) * vm;
  ball.vy = (ln > 0 ? 110 : ln < 0 ? 360 : 230) * vm;
  clearNet(toward);
  const d = Math.hypot(ball.x - p.x, ball.y - p.y) || 1;
  if (d < R + BR) { ball.x = p.x + (ball.x - p.x) / d * (R + BR + 1); ball.y = p.y + (ball.y - p.y) / d * (R + BR + 1); }
  ball.spiked = 0.6; ball.bounced = false; p.spikeT = 0; p.hitCd = 0.25; shake = 0.25; MG.sfx('hit'); snd('whoosh');
  banner = { t: 'Spike! ⚡', life: 0.7, x: Math.max(90, Math.min(W - 90, ball.x)), y: Math.max(40, ball.y - 30) };
  MG.fx.burst(ball.x, ball.y, { n: 18, colors: ['#ffd23f', '#ff7a1c', '#fff'], speed: 260, up: 0, size: 5, shape: 'star', life: 0.5, grav: 0 });
  ball.last = p.side; p.mood = 'wow'; p.moodT = 0.4; hits++; rallyUp();
}
// 🏐 keep-ups: every touch sends the ball straight-ish up again over your own sand
function bump(p) {
  const d = Math.hypot(ball.x - p.x, ball.y - p.y) || 1;
  ball.x = p.x + (ball.x - p.x) / d * (R + BR + 0.5); ball.y = Math.min(ball.y, p.y - (R + BR) * 0.6);
  ball.vx = clamp((165 - ball.x) * 0.9 + MG.rand(-50, 50), -170, 170); ball.vy = -(540 + MG.rand(0, 60)) * VM();
  p.hitCd = 0.2; p.spikeT = 0; ball.last = 0;
  chal.n++; hud(); snd('pop'); snd('boing', null, 150); MG.sfx('match', Math.min(8, 1 + chal.n % 8));
  MG.fx.burst(ball.x, ball.y, { n: 8, colors: ['#fff', '#ffe36b'], speed: 120, up: 20, size: 3, life: 0.35 });
  if (chal.n % 5 === 0) { banner = { t: MG.praise(Math.min(5, chal.n / 5)), life: 0.9, x: W / 2, y: 86 }; snd('sparkle'); }
  p.mood = 'wow'; p.moodT = 0.4;
  if (chal.n >= ST.goal) chalWin();
}
function hitBall(p) {
  if (p.hitCd > 0) return;
  const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
  if (d > R + BR || d === 0) return;
  if (ST.chal === 'keep') return bump(p);
  if (p.spikeT > 0 && !p.ground) return spike(p);
  const nx = dx / d, ny = dy / d, vm = VM();
  ball.x = p.x + nx * (R + BR + 0.5); ball.y = p.y + ny * (R + BR + 0.5);

      x.strokeStyle = '#4a5260'; x.lineWidth = 2; x.beginPath(); x.moveTo(gx - 10, gy - fl); x.quadraticCurveTo(gx - 5, gy - 6, gx, gy); x.quadraticCurveTo(gx + 5, gy - 6, gx + 10, gy - fl); x.stroke(); }
  }
  drawNet();
  drawChal();
  if (state === 'play') for (const b of balls) if (b.hold <= 0) {   // where the ball will land
    const lx = predictX(b, GROUND - BR), mine = lx < NETX ? 0 : 1;
    x.strokeStyle = mine ? 'rgba(207,74,128,.65)' : 'rgba(46,154,76,.65)'; x.lineWidth = 2.5; x.setLineDash([5, 4]);
    x.beginPath(); x.ellipse(lx, GROUND + 3, 16, 5, 0, 0, 7); x.stroke(); x.setLineDash([]);
  }
  for (const p of [0, 1]) if (tTarget[p] != null && isTouch) {
    x.strokeStyle = p ? 'rgba(207,74,128,.8)' : 'rgba(46,154,76,.8)'; x.lineWidth = 3;
    x.beginPath(); x.ellipse(tTarget[p], GROUND + 6, 12, 4, 0, 0, 7); x.stroke();
  }
  for (const p of players) drawPlayer(p);
  for (const q of trail) { x.globalAlpha = q.life * 2; x.fillStyle = ST.court === 'night' ? '#ffb347' : '#ffffff'; x.beginPath(); x.arc(q.x, q.y, BR * q.life * 3, 0, 7); x.fill(); } x.globalAlpha = 1;
  for (const b of balls) drawBall(b);
  drawWeather();
  x.restore();
  if (ST.court === 'night') {   // dark night: the lantern ball lights up the court around it
    const lb = balls.find(b => b.hold <= 0) || balls[0];
    const bx = OX + lb.x, by = OY + lb.y, g = x.createRadialGradient(bx, by, 30, bx, by, 300);
    g.addColorStop(0, 'rgba(10,14,40,0)'); g.addColorStop(1, 'rgba(10,14,40,.55)');
    x.fillStyle = g; x.fillRect(0, 0, CW, OY + H);
    if (balls[1]) { const b2 = balls.find(b => b !== lb); if (b2) { x.fillStyle = 'rgba(255,200,90,.12)'; x.beginPath(); x.arc(OX + b2.x, OY + b2.y, 70, 0, 7); x.fill(); } }
  }
  x.save(); x.translate(OX, OY);
  if (touchHintT > 0 && state === 'play') {
    x.globalAlpha = Math.min(1, touchHintT); x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `700 ${Math.max(15, TXT(14))}px "Noto Sans TC",system-ui`;
    const tips = mode === 'pvp' ? [[160, '👆 ↔️ Move'], [480, '👆 ↔️ Move']] : [[320, '👆 ↔️ Move   👆 Jump']];
    for (const [tx, tt] of tips) { x.lineWidth = 4; x.strokeStyle = 'rgba(255,255,255,.95)'; x.strokeText(tt, tx, 150); x.fillStyle = '#2a3a5a'; x.fillText(tt, tx, 150); }
    x.globalAlpha = 1;
  }
  for (const b of balls) if (b.hold > 0 && state === 'play') { x.fillStyle = '#fff'; x.font = '900 16px "Noto Sans TC",system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('Serve 🏐', b.x, b.y - 30); }
  drawWindArrow();
  MG.fx.draw(x);
  x.restore();
  drawPad();
  drawScore();
  if (banner) {
    const k = Math.min(1, banner.life * 2.5), sc = 1 + Math.max(0, banner.life - 1) * 1.5;
    x.save(); x.globalAlpha = k; x.translate(OX + (banner.x ?? W / 2), OY + (banner.y ?? 120)); x.scale(sc, sc);
    x.font = '900 34px "Noto Sans TC",system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 7; x.strokeStyle = '#fff'; x.strokeText(banner.t, 0, 0);
    x.fillStyle = banner.x ? '#ff7a1c' : '#3a6fd8'; x.fillText(banner.t, 0, 0); x.restore();
  }
}

// scoreboard: in the sky above the court (tall screens), on the beach beside it (wide screens), or on the court's top edge
function drawScore() {
  const nm = names(), sc = score || [0, 0], big = MG.big, ink = big ? '#10233a' : '#2a3a5a';
  const card = (bx, by, bw, bh) => { x.fillStyle = big ? '#fff' : 'rgba(255,255,255,.88)'; x.strokeStyle = big ? '#1d4f9e' : '#7fb8e6'; x.lineWidth = big ? 3.5 : 2; x.beginPath(); x.roundRect(bx, by, bw, bh, Math.min(16, bh * 0.3)); x.fill(); x.stroke(); };
  const T = (t, px, py, f, c, w = 900) => { x.font = `${w} ${f}px "Noto Sans TC",system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; x.fillStyle = c; x.fillText(t, px, py); };
  const fcol = mode === 'cpu' ? MG.JELLY[foe().pal][3] : '#cf4a80';
  x.save(); x.textBaseline = 'middle'; x.textAlign = 'center';
  if (chal) {   // challenge card: icon + count / goal (+ hearts when balls can be dropped)
    const ic = { keep: '🏐', target: '🎯', balloon: '🎈' }[ST.chal], s = `${ic} ${chal.n} / ${ST.goal}`;
    const wide = OX >= 100, roomy = OY >= 80;
    const f = wide ? Math.min((OX - 30) / 5.5, TXT(30)) : roomy ? Math.min(52, TXT(30)) : 22 * Math.max(1, Math.min(1.4, TXT(18) / 22));
    const bw = Math.max(wide ? Math.min(OX - 24, 210) : 200, f * 5.2), bh = f * (chal.hearts || pace !== 'relax' ? 2.3 : 1.5);
    const cx = wide ? OX / 2 : CW / 2, by = wide ? 14 : roomy ? Math.max(8, (OY - 105 - bh) / 2) : 8;
    if (!wide && !roomy && balls.some(b => b.y + OY < by + bh + 20 && Math.abs(b.x - W / 2) < bw / 2 + 20)) x.globalAlpha = 0.3;
    card(cx - bw / 2, by, bw, bh); T(s, cx, by + f * 0.8, f, ink);
    if (pace !== 'relax' && ST.chal === 'keep') for (let i = 0; i < 3; i++) { const hx = cx + (i - 1) * f * 0.9, hy = by + f * 1.75; x.globalAlpha *= 1; T(i < chal.hearts ? '❤️' : '🤍', hx, hy, f * 0.62, ink); }
    x.restore(); return;
  }
  if (OX >= 100) {            // wide: one card per side
    const bw = Math.min(OX - 24, 200), f1 = Math.min(bw * 0.15, TXT(15)), f2 = Math.min(bw * 0.4, TXT(40)), bh = f1 * 2.6 + f2 * 1.2;
    for (const p of [0, 1]) {
      const cx = p ? OX + W + OX / 2 : OX / 2, by = 14;
      card(cx - bw / 2, by, bw, bh);
      T(nm[p], cx, by + f1 * 1.1, f1, p ? fcol : '#2e9a4c'); T(sc[p], cx, by + f1 * 2.1 + f2 * 0.6, f2, ink);
    }
    const wt = pace === 'relax' && mode === 'cpu' ? `你先拿 ${WIN} 分` : `先拿 ${WIN} 分`;
    x.lineWidth = 4; x.strokeStyle = 'rgba(255,255,255,.9)'; x.font = `700 ${f1 * 0.9}px "Noto Sans TC",system-ui`; x.strokeText(wt, OX / 2, 14 + bh + f1 * 1.1);
    T(wt, OX / 2, 14 + bh + f1 * 1.1, f1 * 0.9, big ? '#10233a' : '#3a5a7a', 700);
  } else {
    const roomy = OY >= 80;
    const f1 = roomy ? Math.min(30, TXT(15)) : 12 * Math.max(1, Math.min(1.5, TXT(11) / 12)), f2 = roomy ? Math.min(64, TXT(34)) : 24 * Math.max(1, Math.min(1.4, TXT(18) / 24));
    const bw = Math.max(220, f1 * 15), bh = f1 * 1.5 + f2 * 1.3, by = roomy ? Math.max(8, (OY - 105 - bh) / 2) : 8, cx = CW / 2;
    if (balls.some(b => b.y + OY < by + bh + 20 && Math.abs(b.x - W / 2) < bw / 2 + 20)) x.globalAlpha = 0.3;
    card(cx - bw / 2, by, bw, bh);
    const dx = bw * 0.3;
    T(nm[0], cx - dx, by + f1 * 0.95, f1, '#2e9a4c', 700); T(nm[1], cx + dx, by + f1 * 0.95, f1, fcol, 700);
    T(sc[0], cx - dx, by + f1 * 1.5 + f2 * 0.62, f2, ink); T(sc[1], cx + dx, by + f1 * 1.5 + f2 * 0.62, f2, ink);
    T(`先拿 ${WIN} 分`, cx, by + f1 * 0.95, f1 * 0.85, big ? '#10233a' : '#7a8aa8', 700); T(':', cx, by + f1 * 1.5 + f2 * 0.62, f2 * 0.7, ink);
  }
  x.restore();
}
// tall screens: the ground under the court is the touch pad — show it (a track with the jelly's spot + what a tap does)
function drawPad() {
  const top = OY + H + 6, h = CH - top - 10;
  if (h < 110) return;
  const big = MG.big, two = mode === 'pvp';
  x.save(); x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const p of two ? [0, 1] : [0]) {
    const x0 = two ? (p ? W / 2 + 8 : 12) : 12, w = two ? W / 2 - 20 : W - 24, col = p ? '207,74,128' : '46,154,76';
    const f = Math.min(h * 0.1, TXT(19), w / (two ? 9.5 : 16));
    x.fillStyle = `rgba(255,255,255,${big ? 0.6 : 0.35})`; x.strokeStyle = `rgba(${col},${big ? 0.9 : 0.55})`; x.lineWidth = big ? 4 : 3; x.setLineDash([10, 8]);
    x.beginPath(); x.roundRect(x0, top, w, h, 24); x.fill(); x.stroke(); x.setLineDash([]);
    // track: where the jelly is (its half of the court lines up with the pad)
    const ty = top + h * 0.46, pl = players && players[p], rr = Math.min(42, h * 0.13);
    x.strokeStyle = `rgba(${col},.3)`; x.lineWidth = 12; x.lineCap = 'round'; x.beginPath(); x.moveTo(p ? NETX + 34 : 34, ty + rr * 0.7); x.lineTo(p ? W - 34 : NETX - 34, ty + rr * 0.7); x.stroke();
    if (tTarget[p] != null) { x.strokeStyle = `rgba(${col},.85)`; x.lineWidth = 3; x.beginPath(); x.ellipse(tTarget[p], ty + rr * 0.7, 14, 6, 0, 0, 7); x.stroke(); }
    if (pl) MG.puPu(x, pl.x, ty, rr, pl.mood, 0, { pal: p ? MG.JELLY.pink : MG.JELLY.green, noLeaf: true, look: Math.max(-1, Math.min(1, pl.vx / 200)) });
    const ink = big ? '#10233a' : ST.court === 'night' || ST.court === 'roof' ? '#2a2a3a' : '#5a4320';
    x.font = `800 ${f}px "Noto Sans TC",system-ui`; x.fillStyle = ink;
    x.fillText(two ? '👆 按住左右拖＝移動' : '👆 按住這裡左右拖＝噗噗跟著跑', x0 + w / 2, top + h * 0.15);
    x.fillText(two ? '點一下＝跳' : ST.chal === 'keep' ? '跑到球下面，讓球彈起來！' : '點一下＝跳　跳起來再點一下＝殺球！', x0 + w / 2, top + h * 0.8);
    if (two) x.fillText('空中再點＝殺球', x0 + w / 2, top + h * 0.8 + f * 1.4);
  }
  x.restore();
}

// ---------- flow ----------
function endMatch() {
  state = 'over';
  const w = score[0] >= WIN && (score[0] > score[1] || pace === 'relax') ? 0 : 1, nm = names(), next = STAGES[stage];
  let extra = '';
  if (mode === 'cpu') {
    if (w === 0) {
      markClear(); if (stage <= 3 && pace !== 'relax') MG.record('volley', level + 1);
      extra = `<p class="new">打贏${stage <= 3 ? AIS[level].name + '的電腦' : nm[1]}！^_^</p>` + (next ? `<p>下一關：${COURTS[next.court].e} ${next.name}</p>` : '<p>你是排球冠軍！</p>');
    } else extra = '<p>差一點點！再來一局吧</p><p>🐢 慢慢打的時候不會輸喔</p>';
  }
  MG.sfx(mode === 'cpu' && w === 1 ? 'over' : 'win'); if (!(mode === 'cpu' && w === 1)) MG.sfx('yay');
  MG.panel({
    title: mode === 'cpu' ? (w === 0 ? '你贏了！' : `${nm[1]}贏了…`) : `${nm[w]} 贏了！`,
    html: `<div class="big">${score[0]} : ${score[1]}</div>${extra}`,
    buttons: [
      ...(mode === 'cpu' && w === 0 && next ? [{ label: '下一關', on: () => goStage(stage + 1) }] : []),
      { label: '再來一局', alt: mode === 'cpu' && w === 0 && !!next, on: start },
      ...(mode === 'cpu' && w === 1 && pace !== 'relax' ? [{ label: '🐢 慢慢打這關', alt: true, on: () => { pace = 'relax'; MG.store.set('volley.pickMode', 'relax'); start(); } }] : []),
      { label: '選關卡', alt: true, on: () => menu() },
    ],
  });
}
function setStage(n) {
  stage = clamp(n | 0, 1, STAGES.length); ST = STAGES[stage - 1];
  level = ST.ai || 0; WIN = ST.win || 5; BR = ST.float ? 22 : 15; REACH = R + BR + 34; bgK = ''; flakes = []; leaves = []; windPh = MG.rand(0, 6);
}
function goStage(n) { MG.store.set('volley.pickLevel', n); setStage(n); mode = 'cpu'; start(); }
function start() {
  endTok++;
  if (mode === 'pvp' && ST.chal) setStage(1);
  chalInit(); showPads(); newMatch(); MG.hide();
  const fresh = [...(pace === 'relax' && mode === 'cpu' ? ['slow'] : []), ...newsOf(ST)].filter(k => !(mode === 'pvp' && (k === 'keep' || k === 'target' || k === 'balloon')) && !MG.store.get('volley.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('volley.seen.' + k, true));
    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function menu() {
  if (state !== 'play' && state !== 'point') { state = 'menu'; resetRally(0); score = [0, 0]; chal = null; hud(); }
  const best = MG.best('volley') || 0, done = cleared();
  MG.choose({
    id: 'volley', title: '噗噗排球',
    html: `<p>把球打過網，讓球落在對方的地上就得分！</p>
      <p>${isTouch ? '<b>按住地上左右拖</b>，噗噗會跑到你的手指那裡；<b>點一下</b>就跳，<b>跳起來再點一下</b>就是殺球！地上的虛線圈是球會掉的地方。' : '<b>跳起來球靠近時再按一次跳就是殺球！</b>接球時按著往網子方向會打得比較遠，往後按會打得高高的。地上的虛線圈是球會掉的地方。'}</p>
      <p>一路打到冠軍決賽：公園有風、雪地很滑、夜晚的燈籠球、屋頂的彈彈球，還有 🏐 顛球、🎯 丟圈圈、🎈 打氣球小挑戰！${best ? `（已打贏${AIS[best - 1].name}的電腦 ✓）` : ''}</p>
      ${isTouch && innerHeight > innerWidth ? '<p class="new">📱 把手機橫放，球場會更大更好玩！</p>' : ''}`,
    modes: [{ id: 'relax', label: '🐢 慢慢打', sub: '球比較慢・不會輸' }, { id: 'normal', label: '🏐 正式比賽', sub: '先拿到分數就贏' }],
    levels: { count: STAGES.length, max: STAGES.length, label: n => `${n}（${COURTS[STAGES[n - 1].court].e} ${STAGES[n - 1].name}${done.includes(n) ? ' ✓' : ''}）`, short: n => `${n}${STAGES[n - 1].mk || ''}` },
    keys: isTouch ? '一人一根手指：按住拖＝移動，點一下＝跳，在空中點＝殺球' : '1 人：<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd> 或 <kbd>A</kbd><kbd>D</kbd><kbd>W</kbd>　2 人：左邊 <kbd>A</kbd><kbd>D</kbd><kbd>W</kbd>、右邊 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd>',
    extra: [{ label: '👥 兩人對打', alt: true, on: () => { const lv = +(document.querySelector('.mg-lv[aria-pressed="true"]') || {}).dataset?.lv || stage; MG.store.set('volley.pickLevel', lv); setStage(lv); mode = 'pvp'; pace = 'normal'; start(); } }],
    playing: () => state === 'play' || state === 'point',
    onPause: () => showPads(),
    start: (m, lv) => { pace = m; mode = 'cpu'; setStage(lv); start(); },
  });
  showPads();
}
MG.fit(cv, layout);
setStage(Math.min(MG.store.get('volley.pickLevel', 1), STAGES.length));
menu();
MG.loop(dt => { if (!MG.panelOpen() || state === 'menu' || state === 'over') update(dt); draw(); });

// ---------- hook for automated tests ----------
window.VOL = {
  get state() { return state; }, get stage() { return stage; }, get score() { return score && score.slice(); }, get chal() { return chal && { n: chal.n, hearts: chal.hearts, tx: chal.tx, tw: chal.tw, balloons: chal.balloons && chal.balloons.filter(q => !q.pop).map(q => ({ x: q.x, y: balloonY(q) })) }; },
  get balls() { return balls.map(b => ({ x: b.x, y: b.y, vx: b.vx, vy: b.vy, hold: b.hold })); }, get players() { return players.map(p => ({ x: p.x, y: p.y, ground: p.ground })); },
  get wind() { return wind; }, stages: STAGES.length, get pace() { return pace; }, get mode() { return mode; },
  play: (n, p = 'normal', m = 'cpu') => { pace = p; mode = m; setStage(n); start(); MG.hide(); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) update(dt); },
  // a simple helper "player": runs under the ball (or the target spot) and taps jump
  auto(sec, dt = 1 / 60) {
    for (let i = 0, n = Math.round(sec / dt); i < n && (state === 'play' || state === 'point'); i++) {
      const p = players[0], inp = input[0];
      let b = null, bt = 1e9; for (const q of balls) { if (q.hold > 0) continue; const lx = predictX(q, GROUND - R * 2); if (lx < NETX + 10) { const tt = (GROUND - q.y) / Math.max(50, q.vy + 400); if (tt < bt) { bt = tt; b = q; } } }
      let tx = b ? predictX(b, GROUND - R * 2) - (ST.chal === 'keep' ? 0 : 12) : 160;
      if (ST.chal === 'balloon' && b) { const q = chal.balloons.find(o => !o.pop); if (q) tx += q.x > NETX ? -10 : 6; }
      inp.l = tx < p.x - 6; inp.r = tx > p.x + 6; inp.jp = false;
      if (ST.chal === 'target' && b && Math.abs(b.x - p.x) < 50 && p.y - b.y < 90 && b.vy > 0) {   // lean so the bump lands in the ring
        let bl = 0, bd = 1e9; const dx = b.x - p.x, vm = VM(), g = G();
        for (const ln of [-1, 0, 1]) { const vx = (250 + ln * 120 + dx * 2.5) * vm, vy = -560 * vm, y0 = p.y - (R + BR) * 0.7, tt = (-vy + Math.sqrt(vy * vy + 2 * g * (GROUND - BR - y0))) / g; let lx = b.x + vx * tt; if (lx > W - BR) lx = 2 * (W - BR) - lx; if (Math.abs(lx - chal.tx) < bd) { bd = Math.abs(lx - chal.tx); bl = ln; } }
        inp.r = bl > 0; inp.l = bl < 0;
      }
      if (b && ST.chal !== 'keep' && p.ground && Math.abs(b.x - p.x) < 40 && p.y - b.y > 60 && p.y - b.y < 140 && b.vy > 0 && Math.random() < 0.08) inp.jp = true;
      update(dt);
    }
    input[0].l = input[0].r = false;
  },
  menu: () => menu(),
};
</script>
</body>
