<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗排球</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:linear-gradient(#bfe6ff,#fff3d6)}
html,body{overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:10px}
.modes .mg-btn{min-width:0;font-size:15px;min-height:56px;padding:4px 8px;line-height:1.25}
.modes .mg-btn small{display:block;font-weight:400;font-size:12px}
</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'volley', title: '噗噗排球', stats: ['score'] });
const W = 640, H = 360, cv = document.getElementById('cv'), x = cv.getContext('2d');
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('touch');
MG.fit(cv, W, H);

const GROUND = 318, NETX = 320, NETW = 8, NETTOP = 196, R = 30, BR = 15, WIN = 7;
const GRAV_P = 1500, GRAV_B = 820, SPEED = 270, JUMP = 620;
const LEVELS = [
  { name: '簡單', speed: 0.5, react: 0.32, err: 40, jump: 0.3, spike: 0.08, blunder: 0.4 },
  { name: '普通', speed: 0.8, react: 0.16, err: 18, jump: 0.65, spike: 0.35, blunder: 0.24 },
  { name: '困難', speed: 1.0, react: 0.06, err: 6, jump: 0.95, spike: 0.75, blunder: 0.05 },
];
let hits = 0;
let mode = 'cpu', level = 1, players, ball, score, server, state = 'menu', pauseT = 0, banner = null, t = 0, shake = 0, trail = [];
const input = [{ l: false, r: false, j: false, jp: false }, { l: false, r: false, j: false, jp: false }];

function makePlayer(side) {
  return { side, x: side ? 480 : 160, y: GROUND - R, vx: 0, vy: 0, ground: true, spikeT: 0, squash: 0, mood: 'happy', moodT: 0,
    ai: side === 1 && mode === 'cpu' ? { tx: 480, rt: 0, seen: -2, off: 0 } : null };
}
function resetRally(srv) {
  server = srv;
  players = [makePlayer(0), makePlayer(1)];
  ball = { x: srv ? 480 : 160, y: 90, vx: 0, vy: 0, rot: 0, hold: 0.9, last: -1, spiked: 0 };
  trail = [];
}
function newMatch() { score = [0, 0]; resetRally(Math.random() < 0.5 ? 0 : 1); state = 'play'; banner = { t: '開始！', life: 1 }; hud(); }
function hud() { MG.stat('score', `${score[0]} : ${score[1]}`); }

// ---------- input ----------
const KEYS1 = { a: 'l', A: 'l', d: 'r', D: 'r', w: 'j', W: 'j' }, KEYS2 = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'j' };
function keyMap(e) {
  if (mode === 'cpu') { const k = KEYS1[e.key] || KEYS2[e.key] || (e.key === ' ' ? 'j' : null); return k ? [0, k] : null; }
  if (KEYS1[e.key]) return [0, KEYS1[e.key]];
  if (KEYS2[e.key]) return [1, KEYS2[e.key]];
  if (e.key === 'Enter') return [1, 'j'];
  if (e.key === ' ') return [0, 'j'];
  return null;
}
addEventListener('keydown', e => { const m = keyMap(e); if (!m || MG.panelOpen()) return; e.preventDefault(); const [p, k] = m; if (k === 'j' && !input[p].j) input[p].jp = true; input[p][k] = true; });
addEventListener('keyup', e => { const m = keyMap(e); if (!m) return; input[m[0]][m[1]] = false; });
addEventListener('blur', () => input.forEach(i => { i.l = i.r = i.j = false; }));
// ---------- touch: one finger per player ----------
// hold and drag on your half of the sand -> your jelly runs to your finger;
// tap -> jump (and run to where you tapped); tap while in the air -> spike.
// No buttons near the screen edges, so tablet edge swipes and multi-finger
// system gestures are not triggered by play.
const touches = new Map(), tTarget = [null, null], tHold = [false, false];
let touchHintT = 0;
const ownerOf = lx => mode === 'pvp' ? (lx < NETX ? 0 : 1) : 0;
const sideClamp = (p, lx) => p ? Math.max(NETX + NETW / 2 + R, Math.min(W - R, lx)) : Math.max(R, Math.min(NETX - NETW / 2 - R, lx));
const inPlay = () => state === 'play' && !MG.panelOpen();
addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch' || !inPlay() || e.target.closest('.mg-bar,.mg-over')) return;
  e.preventDefault();
  const lx = cv.logical(e).x, p = ownerOf(lx), pl = players[p];
  const busy = [...touches.values()].some(q => q.p === p);
  const rec = { p, x0: e.clientX, y0: e.clientY, t0: performance.now(), moved: false, jumped: false, second: busy };
  touches.set(e.pointerId, rec);
  if (busy || !pl.ground) { input[p].jp = true; rec.jumped = true; }      // second finger, or already flying: jump / spike right now
  if (!busy) { tTarget[p] = sideClamp(p, lx); tHold[p] = true; }
  MG.unlock();
}, { passive: false });
addEventListener('pointermove', e => {
  const rec = touches.get(e.pointerId); if (!rec) return;
  e.preventDefault();
  const dx = e.clientX - rec.x0, dy = e.clientY - rec.y0;
  if (Math.hypot(dx, dy) > 14) rec.moved = true;
  if (!rec.second) tTarget[rec.p] = sideClamp(rec.p, cv.logical(e).x);
  // quick upward flick also jumps
  if (!rec.jumped && dy < -30 && performance.now() - rec.t0 < 260 && players[rec.p].ground) { input[rec.p].jp = true; rec.jumped = true; }
}, { passive: false });
function endTouch(e) {
  const rec = touches.get(e.pointerId); if (!rec) return;
  touches.delete(e.pointerId);
  if (!rec.jumped && !rec.moved && performance.now() - rec.t0 < 280) input[rec.p].jp = true;     // a tap
  if (!rec.second && ![...touches.values()].some(q => q.p === rec.p && !q.second)) {
    tHold[rec.p] = false;
    if (rec.moved) tTarget[rec.p] = null;      // let go after dragging: stop; after a tap: keep running to the tapped spot
  }
}
addEventListener('pointerup', endTouch); addEventListener('pointercancel', endTouch);
// stop the browser from scrolling, zooming or long-press menus while playing
document.addEventListener('touchmove', e => { if (state === 'play' || state === 'point') e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
function steerTouch() {
  for (const p of [0, 1]) {
    if (tTarget[p] == null || players[p].ai) continue;
    const d = tTarget[p] - players[p].x;
    input[p].l = d < -8; input[p].r = d > 8;
    if (Math.abs(d) <= 8 && !tHold[p]) { tTarget[p] = null; input[p].l = input[p].r = false; }
  }
}
function showPads() { touches.clear(); tTarget[0] = tTarget[1] = null; tHold[0] = tHold[1] = false; touchHintT = isTouch ? 4 : 0; }

// ---------- AI ----------
function predictX(targetY) {
  let bx = ball.x, by = ball.y, vx = ball.vx, vy = ball.vy;
  if (ball.hold > 0) return bx;
  for (let i = 0; i < 240; i++) {
    const dt = 1 / 60; vy += GRAV_B * dt; bx += vx * dt; by += vy * dt;
    if (bx < BR) { bx = BR; vx = -vx; } if (bx > W - BR) { bx = W - BR; vx = -vx; }
    if (vy > 0 && by >= targetY) return bx;
  }
  return bx;
}
function aiThink(p, dt) {
  const L = LEVELS[level], a = p.ai, inp = input[1];
  a.rt -= dt;
  if (ball.last !== a.seen) { a.seen = ball.last; a.off = ball.last === 0 && Math.random() < L.blunder ? MG.pick([-1, 1]) * MG.rand(75, 115) : 0; a.adj = MG.pick([-1, 0, 0, 1]); }
  if (a.rt <= 0) {
    a.rt = L.react;
    const px = predictX(GROUND - R * 2.2);
    if (px > NETX) a.tx = Math.max(NETX + R, Math.min(W - R, px + 10 + (a.off || 0) + MG.rand(-L.err, L.err)));
    else a.tx = 470 + MG.rand(-20, 20);
  }
  inp.l = inp.r = false;
  const d = a.tx - p.x;
  if (Math.abs(d) > 6) { if (Math.random() < L.speed + 0.15) { inp.l = d < 0; inp.r = d > 0; } }
  inp.jp = false;
  const dx = ball.x - p.x, dy = p.y - ball.y;
  if (p.ground && ball.x > NETX && Math.abs(dx) < 46 && dy > 50 && dy < 150 && ball.vy > -100 && Math.random() < L.jump * dt * 8) inp.jp = true;
  if (!p.ground && Math.hypot(dx, dy) < REACH && ball.x < 540 && Math.random() < L.spike * dt * 12) inp.jp = true;
}

// ---------- physics ----------
// make sure a shot from our side clears the net: if the planned arc would hit it,
// lift it just enough to pass over the top
function clearNet(toward) {
  const dxNet = (NETX - toward * (NETW / 2 + BR + 4)) - ball.x;
  if (dxNet * toward <= 0 || ball.vx * toward <= 0) return;
  const tn = dxNet / ball.vx, clearY = NETTOP - BR - 8;
  const vyMax = (clearY - ball.y - 0.5 * GRAV_B * tn * tn) / tn;
  if (ball.vy > vyMax) ball.vy = vyMax;
}
function spike(p) {
  const toward = p.side ? -1 : 1, ln = lean(p);
  // hold toward the net = long and flat, hold away = steep and short, nothing = in between
  ball.vx = toward * (ln > 0 ? 680 : ln < 0 ? 470 : 600);
  ball.vy = ln > 0 ? 110 : ln < 0 ? 360 : 230;
  clearNet(toward);
  const d = Math.hypot(ball.x - p.x, ball.y - p.y) || 1;
  if (d < R + BR) { ball.x = p.x + (ball.x - p.x) / d * (R + BR + 1); ball.y = p.y + (ball.y - p.y) / d * (R + BR + 1); }
  ball.spiked = 0.6; p.spikeT = 0; p.hitCd = 0.25; shake = 0.25; MG.sfx('hit');
  banner = { t: '殺球！', life: 0.7, x: ball.x, y: ball.y - 30 };
  MG.fx.burst(ball.x, ball.y, { n: 18, colors: ['#ffd23f', '#ff7a1c', '#fff'], speed: 260, up: 0, size: 5, shape: 'star', life: 0.5, grav: 0 });
  ball.last = p.side; p.mood = 'wow'; p.moodT = 0.4; hits++;
}
function hitBall(p) {
  if (p.hitCd > 0) return;
  const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
  if (d > R + BR || d === 0) return;
  if (p.spikeT > 0 && !p.ground) return spike(p);
  const nx = dx / d, ny = dy / d;
  ball.x = p.x + nx * (R + BR + 0.5); ball.y = p.y + ny * (R + BR + 0.5);
  const toward = p.side ? -1 : 1, ln = lean(p);
  if (!p.ground) {
    // jumping hit without the swing: a firm push over the net
    ball.vx = toward * (330 + ln * 90) + dx * 2; ball.vy = -380;
  } else {
    // bump: always goes up and over; leaning picks how far it goes
    ball.vx = toward * (250 + ln * 120) + dx * 2.5; ball.vy = -(560 + Math.max(0, -ny) * 40);
  }
  if (ball.vx * toward < 90) ball.vx = toward * 90;
  clearNet(toward);
  p.hitCd = 0.18;
  MG.sfx('pop'); MG.fx.burst(ball.x, ball.y, { n: 6, colors: ['#fff', '#ffe36b'], speed: 120, up: 20, size: 3, life: 0.35 });
  ball.last = p.side; p.mood = 'wow'; p.moodT = 0.4; hits++;
}
function netCollide() {
  const left = NETX - NETW / 2, right = NETX + NETW / 2;
  // top cap
  const dx = ball.x - NETX, dy = ball.y - NETTOP, d = Math.hypot(dx, dy);
  if (d < BR + 4 && ball.y < NETTOP) { const nx = dx / d, ny = dy / d, dot = ball.vx * nx + ball.vy * ny; if (dot < 0) { ball.vx -= 1.6 * dot * nx; ball.vy -= 1.6 * dot * ny; } ball.x = NETX + nx * (BR + 4); ball.y = NETTOP + ny * (BR + 4); MG.sfx('step'); return; }
  if (ball.y + BR > NETTOP && ball.x + BR > left && ball.x - BR < right) {
    if (ball.x < NETX) { ball.x = left - BR; ball.vx = -Math.abs(ball.vx) * 0.7; } else { ball.x = right + BR; ball.vx = Math.abs(ball.vx) * 0.7; }
    MG.sfx('step');
  }
}
function update(dt) {
  t += dt; shake = Math.max(0, shake - dt);
  if (banner) { banner.life -= dt; if (banner.life <= 0) banner = null; }
  MG.fx.step(dt);
  if (state === 'point') { pauseT -= dt; for (const p of players) stepPlayer(p, dt, true); if (pauseT <= 0) { if (score[0] >= WIN || score[1] >= WIN) return endMatch(); resetRally(server); state = 'play'; } return; }
  if (state !== 'play') return;
  steerTouch(); touchHintT = Math.max(0, touchHintT - dt);
  if (players[1].ai) aiThink(players[1], dt);
  for (const p of players) stepPlayer(p, dt, false);
  // ball
  if (ball.hold > 0) { ball.hold -= dt; ball.y = 90 + Math.sin(t * 6) * 3; }
  else {
    const sub = 3;
    for (let s = 0; s < sub; s++) {
      const h = dt / sub;
      ball.vy += GRAV_B * h; ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < BR) { ball.x = BR; ball.vx = Math.abs(ball.vx) * 0.9; }
      if (ball.x > W - BR) { ball.x = W - BR; ball.vx = -Math.abs(ball.vx) * 0.9; }
      if (ball.y < BR - 120) { ball.y = BR - 120; ball.vy = Math.abs(ball.vy) * 0.5; }
      netCollide();
      for (const p of players) hitBall(p);
      if (ball.y + BR >= GROUND) { ball.y = GROUND - BR; point(ball.x < NETX ? 1 : 0); break; }
    }
    ball.rot += ball.vx * dt / BR;
    ball.spiked = Math.max(0, ball.spiked - dt);
    if (ball.spiked > 0 || Math.hypot(ball.vx, ball.vy) > 560) trail.push({ x: ball.x, y: ball.y, life: 0.25 });
  }
  for (const q of trail) q.life -= dt; trail = trail.filter(q => q.life > 0);
}
function stepPlayer(p, dt, frozen) {
  const inp = input[p.side];
  const dir = frozen ? 0 : (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  // ease into and out of running instead of snapping to full speed
  const target = dir * SPEED * (p.ai ? (0.75 + LEVELS[level].speed * 0.25) : 1), acc = (p.ground ? 2600 : 1700) * dt;
  p.vx += Math.max(-acc, Math.min(acc, target - p.vx));
  if (!frozen && inp.jp) {
    if (p.ground) { p.vy = -JUMP; p.ground = false; p.squash = -0.2; p.cut = false; MG.sfx('jump'); }
    else trySpike(p);
  }
  inp.jp = false;
  p.spikeT = Math.max(0, p.spikeT - dt); p.hitCd = Math.max(0, (p.hitCd || 0) - dt); p.swing = Math.max(0, (p.swing || 0) - dt);
  p.vy += GRAV_P * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  if (p.y >= GROUND - R) { if (!p.ground) { p.squash = 0.22; MG.fx.burst(p.x, GROUND, { n: 6, colors: ['#f2d69a', '#e8c27a'], speed: 80, up: 40, size: 3, life: 0.4 }); } p.y = GROUND - R; p.vy = 0; p.ground = true; }
  const lo = p.side ? NETX + NETW / 2 + R : R, hi = p.side ? W - R : NETX - NETW / 2 - R;
  if (p.x < lo) { p.x = lo; p.vx = 0; } if (p.x > hi) { p.x = hi; p.vx = 0; }
  p.squash *= Math.pow(0.003, dt);
  p.moodT -= dt; if (p.moodT <= 0 && p.mood !== 'ouch') p.mood = 'happy';
}
// pressing jump in the air swings: if the ball is close it is spiked right away,
// otherwise the swing stays "armed" for a short moment
const REACH = R + BR + 34;
function trySpike(p) {
  p.swing = 0.22;
  if (ball.hold <= 0 && Math.hypot(ball.x - p.x, ball.y - p.y) < REACH && (p.side ? ball.x > NETX - 40 : ball.x < NETX + 40)) spike(p);
  else p.spikeT = 0.45;
}
// which way the player is leaning: +1 toward the net, -1 away, 0 none
function lean(p) {
  if (p.ai) return p.ai.adj || 0;
  const inp = input[p.side], dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
  return dir * (p.side ? -1 : 1);
}

function point(winner) {
  score[winner]++; server = winner; state = 'point'; pauseT = 1.4; hud();
  const loser = 1 - winner; players[winner].mood = 'love'; players[winner].moodT = 1.4; players[loser].mood = 'ouch'; players[loser].moodT = 1.4;
  MG.sfx(mode === 'cpu' && winner === 1 ? 'bad' : 'good'); shake = 0.2;
  MG.fx.burst(ball.x, GROUND, { n: 20, colors: ['#f2d69a', '#e8c27a', '#fff'], speed: 200, up: 160, size: 4, life: 0.7 });
  MG.fx.burst(winner ? 480 : 160, 120, { n: 24, colors: ['#ff8ac2', '#ffd23f', '#8fd0ff', '#b8f5a0'], speed: 220, up: 120, size: 5, shape: 'sq', life: 1 });
  banner = { t: `${names()[winner]} 得分！`, life: 1.3 };
}
const names = () => mode === 'cpu' ? ['噗噗', '電腦'] : ['綠噗噗', '粉噗噗'];

// ---------- draw ----------
let bgC = null, bgK = '';
function beach() {
  const k = cv._mgScale || 1; if (bgK === '' + k) return; bgK = '' + k;
  const c = document.createElement('canvas'); c.width = W * k; c.height = H * k; const g = c.getContext('2d'); g.scale(k, k);
  const sky = g.createLinearGradient(0, 0, 0, 200); sky.addColorStop(0, '#5fb8ff'); sky.addColorStop(1, '#d6f0ff'); g.fillStyle = sky; g.fillRect(0, 0, W, 210);
  const sun = g.createRadialGradient(560, 56, 5, 560, 56, 70); sun.addColorStop(0, 'rgba(255,250,200,1)'); sun.addColorStop(0.35, 'rgba(255,230,120,.9)'); sun.addColorStop(1, 'rgba(255,230,120,0)');
  g.fillStyle = sun; g.fillRect(480, 0, 160, 140);
  // distant island
  g.fillStyle = '#8fc3a8'; g.beginPath(); g.ellipse(120, 172, 90, 18, 0, Math.PI, 0); g.fill();
  // sea
  const sea = g.createLinearGradient(0, 168, 0, 262); sea.addColorStop(0, '#2b8fd0'); sea.addColorStop(1, '#6fd0ee'); g.fillStyle = sea; g.fillRect(0, 168, W, 96);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.5;
  for (let i = 0; i < 40; i++) { const wx = (i * 83) % W, wy = 178 + (i * 29) % 80; g.beginPath(); g.moveTo(wx, wy); g.quadraticCurveTo(wx + 7, wy - 3, wx + 14, wy); g.stroke(); }
  // sand
  const sand = g.createLinearGradient(0, 250, 0, H); sand.addColorStop(0, '#fbe7b5'); sand.addColorStop(1, '#efcf8a'); g.fillStyle = sand;
  g.beginPath(); g.moveTo(0, 258); for (let xx = 0; xx <= W; xx += 16) g.lineTo(xx, 256 + Math.sin(xx * 0.05) * 3); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.moveTo(0, 258); for (let xx = 0; xx <= W; xx += 16) g.lineTo(xx, 256 + Math.sin(xx * 0.05) * 3); for (let xx = W; xx >= 0; xx -= 16) g.lineTo(xx, 262 + Math.sin(xx * 0.05 + 1) * 3); g.fill();
  let sd = 9; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(180,130,60,${0.1 + rnd() * 0.15})`; g.fillRect(rnd() * W, 262 + rnd() * 98, 1.5, 1.5); }
  // court lines
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3; g.beginPath(); g.moveTo(16, GROUND + 3); g.lineTo(W - 16, GROUND + 3); g.stroke();
  // palms
  const palm = (px, s, flip) => {
    g.save(); g.translate(px, 300); g.scale(flip ? -s : s, s);
    g.strokeStyle = '#9a6a3a'; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(14, -80, 4, -170); g.stroke();
    g.strokeStyle = '#7a5028'; g.lineWidth = 2; for (let i = 0; i < 10; i++) { const yy = -i * 16; g.beginPath(); g.moveTo(-4 + i * 0.8, yy); g.lineTo(6 + i * 0.6, yy - 4); g.stroke(); }
    for (let i = 0; i < 6; i++) { g.save(); g.translate(4, -170); g.rotate(-2.8 + i * 0.75); g.fillStyle = i % 2 ? '#3aa845' : '#4cc157'; g.beginPath(); g.ellipse(48, 0, 50, 10, 0.15, 0, 7); g.fill(); g.restore(); }
    g.fillStyle = '#7a5028'; for (const [a, b] of [[-4, -164], [8, -166], [2, -158]]) { g.beginPath(); g.arc(a, b, 6, 0, 7); g.fill(); }
    g.restore();
  };
  palm(26, 0.95, false); palm(W - 26, 1, true);
  // beach umbrella + towel
  g.fillStyle = '#ffffff'; g.fillRect(96, 268, 3, 40);
  for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? '#fff' : '#ff6b5e'; g.beginPath(); g.moveTo(97, 262); g.arc(97, 276, 40, Math.PI + i * Math.PI / 4, Math.PI + (i + 1) * Math.PI / 4); g.closePath(); g.fill(); }
  g.fillStyle = '#8fd0ff'; g.save(); g.translate(540, 300); g.rotate(-0.08); g.fillRect(-30, -6, 60, 14); g.fillStyle = '#fff'; for (let i = 0; i < 4; i++) g.fillRect(-30 + i * 16, -6, 6, 14); g.restore();
  bgC = c;
}
function drawBall() {
  // shadow on sand
  const hgt = Math.max(0, GROUND - ball.y), s = Math.max(0.3, 1 - hgt / 320);
  x.fillStyle = `rgba(120,80,30,${0.3 * s})`; x.beginPath(); x.ellipse(ball.x, GROUND + 2, BR * 1.2 * s, 4 * s, 0, 0, 7); x.fill();
  for (const q of trail) { x.globalAlpha = q.life * 2; x.fillStyle = ball.spiked ? '#ffb347' : '#ffffff'; x.beginPath(); x.arc(q.x, q.y, BR * q.life * 3, 0, 7); x.fill(); } x.globalAlpha = 1;
  x.save(); x.translate(ball.x, ball.y); x.rotate(ball.rot);
  const g = x.createRadialGradient(-5, -6, 2, 0, 0, BR); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e8eef6'); x.fillStyle = g; x.beginPath(); x.arc(0, 0, BR, 0, 7); x.fill();
  x.save(); x.beginPath(); x.arc(0, 0, BR, 0, 7); x.clip();
  x.fillStyle = '#ffd23f'; x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, BR, -0.4, 0.9); x.fill();
  x.fillStyle = '#3d7bff'; x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, BR, 2.0, 3.3); x.fill();
  x.restore();
  x.strokeStyle = '#8a96a8'; x.lineWidth = 1.4; for (const a of [-0.4, 0.9, 2.0, 3.3, 4.6]) { x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(Math.cos(a + 0.4) * BR * 0.6, Math.sin(a + 0.4) * BR * 0.6, Math.cos(a) * BR, Math.sin(a) * BR); x.stroke(); }
  x.beginPath(); x.arc(0, 0, BR, 0, 7); x.stroke();
  x.restore();
  x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.ellipse(ball.x - 5, ball.y - 6, 4, 2.5, -0.6, 0, 7); x.fill();
}
function drawNet() {
  x.fillStyle = '#c0c6d0'; x.fillRect(NETX - 4, NETTOP - 6, 8, GROUND - NETTOP + 8);
  x.fillStyle = '#8a92a0'; x.fillRect(NETX + 1, NETTOP - 6, 3, GROUND - NETTOP + 8);
  x.save(); x.beginPath(); x.rect(NETX - 28, NETTOP + 4, 56, 74); x.clip();
  x.fillStyle = 'rgba(30,40,60,.35)'; x.fillRect(NETX - 28, NETTOP + 4, 56, 74);
  x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 1;
  for (let i = -80; i < 80; i += 7) { x.beginPath(); x.moveTo(NETX + i, NETTOP); x.lineTo(NETX + i + 80, NETTOP + 80); x.moveTo(NETX + i, NETTOP); x.lineTo(NETX + i - 80, NETTOP + 80); x.stroke(); }
  x.restore();
  x.fillStyle = '#fff'; x.fillRect(NETX - 30, NETTOP + 2, 60, 5); x.fillRect(NETX - 30, NETTOP + 76, 60, 3);
  x.fillStyle = '#ff5a4e'; x.beginPath(); x.arc(NETX, NETTOP - 6, 5, 0, 7); x.fill();
}
function drawPlayer(p) {
  const pal = p.side ? MG.JELLY.pink : MG.JELLY.green;
  const hgt = GROUND - (p.y + R), s = Math.max(0.4, 1 - hgt / 200);
  x.fillStyle = `rgba(120,80,30,${0.3 * s})`; x.beginPath(); x.ellipse(p.x, GROUND + 2, R * s, 5 * s, 0, 0, 7); x.fill();
  const look = Math.max(-1, Math.min(1, (ball.x - p.x) / 120));
  MG.puPu(x, p.x, p.y + 2, R * 0.92, p.mood, p.squash, { pal, look, arms: p.ground ? false : 'up', noLeaf: true });
  // sweatband
  x.save(); x.translate(p.x, p.y + 2); x.translate(0, R * 0.83); x.scale(1 + p.squash, 1 - p.squash); x.translate(0, -R * 0.83);
  x.fillStyle = p.side ? '#3d9bff' : '#ff5a4e'; x.beginPath(); x.ellipse(0, -R * 0.62, R * 0.72, R * 0.12, 0, Math.PI, 0); x.lineTo(R * 0.72, -R * 0.55); x.ellipse(0, -R * 0.55, R * 0.72, R * 0.12, 0, 0, Math.PI, true); x.fill();
  x.fillStyle = '#fff'; x.fillRect(-R * 0.1, -R * 0.74, R * 0.2, R * 0.12);
  x.restore();
  if (p.swing > 0) {   // swing arc
    const k = 1 - p.swing / 0.22, sd = p.side ? -1 : 1, a0 = sd > 0 ? -2.2 : -0.9;
    x.strokeStyle = `rgba(255,200,80,${0.9 - k * 0.6})`; x.lineWidth = 6; x.lineCap = 'round';
    x.beginPath(); x.arc(p.x, p.y, R + 14, sd > 0 ? a0 : a0 - k * 1.4, sd > 0 ? a0 + k * 1.4 : a0); x.stroke();
  } else if (p.spikeT > 0 && !p.ground) { x.strokeStyle = 'rgba(255,200,80,.7)'; x.lineWidth = 3; x.beginPath(); x.arc(p.x, p.y, R + 6, 0, 7); x.stroke(); }
}
function draw() {
  beach();
  x.save(); if (shake) x.translate(MG.rand(-1, 1) * shake * 16, MG.rand(-1, 1) * shake * 16);
  x.drawImage(bgC, 0, 0, W, H);
  // drifting clouds + seagull
  for (const [cx0, cy, sp, s] of [[80, 50, 6, 1], [330, 80, 4, 0.8], [520, 34, 8, 0.7]]) { const ox = ((cx0 + t * sp) % (W + 120)) - 60; x.fillStyle = '#fff'; for (const [a, b, r] of [[0, 0, 16], [18, -8, 20], [38, 0, 15]]) { x.beginPath(); x.arc(ox + a * s, cy + b * s, r * s, 0, 7); x.fill(); } }
  const gx = (t * 30) % (W + 80) - 40, gy = 100 + Math.sin(t) * 8, fl = Math.sin(t * 8) * 4;
  x.strokeStyle = '#4a5260'; x.lineWidth = 2; x.beginPath(); x.moveTo(gx - 10, gy - fl); x.quadraticCurveTo(gx - 5, gy - 6, gx, gy); x.quadraticCurveTo(gx + 5, gy - 6, gx + 10, gy - fl); x.stroke();
  drawNet();
  if (state === 'play' && ball.hold <= 0) {   // where the ball will land
    const lx = predictX(GROUND - BR), mine = lx < NETX ? 0 : 1;
    x.strokeStyle = mine ? 'rgba(207,74,128,.65)' : 'rgba(46,154,76,.65)'; x.lineWidth = 2.5; x.setLineDash([5, 4]);
    x.beginPath(); x.ellipse(lx, GROUND + 3, 16, 5, 0, 0, 7); x.stroke(); x.setLineDash([]);
  }
  for (const p of [0, 1]) if (tTarget[p] != null && isTouch) {
    x.strokeStyle = p ? 'rgba(207,74,128,.8)' : 'rgba(46,154,76,.8)'; x.lineWidth = 3;
    x.beginPath(); x.ellipse(tTarget[p], GROUND + 6, 12, 4, 0, 0, 7); x.stroke();
  }
  for (const p of players) drawPlayer(p);
  drawBall();
  if (touchHintT > 0 && state === 'play') {
    x.globalAlpha = Math.min(1, touchHintT); x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = '700 15px "Noto Sans TC",system-ui';
    const tips = mode === 'pvp' ? [[160, '👆 按住這半邊左右拖'], [480, '👆 按住這半邊左右拖']] : [[320, '👆 按住沙灘左右拖＝移動　點一下＝跳']];
    for (const [tx, tt] of tips) { x.lineWidth = 4; x.strokeStyle = 'rgba(255,255,255,.95)'; x.strokeText(tt, tx, 150); x.fillStyle = '#2a3a5a'; x.fillText(tt, tx, 150); }
    x.globalAlpha = 1;
  }
  if (ball.hold > 0 && state === 'play') { x.fillStyle = 'rgba(255,255,255,.9)'; x.font = '900 16px "Noto Sans TC",system-ui'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('發球', ball.x, ball.y - 30); }
  MG.fx.draw(x);
  x.restore();
  // scoreboard
  const nm = names();
  x.save(); if (ball.y < 70 && Math.abs(ball.x - W / 2) < 130) x.globalAlpha = 0.3;
  x.fillStyle = 'rgba(255,255,255,.88)'; x.strokeStyle = '#7fb8e6'; x.lineWidth = 2; x.beginPath(); x.roundRect(W / 2 - 110, 8, 220, 44, 14); x.fill(); x.stroke();
  x.textBaseline = 'middle'; x.textAlign = 'center';
  x.font = '700 12px "Noto Sans TC",system-ui'; x.fillStyle = '#2e9a4c'; x.fillText(nm[0], W / 2 - 66, 20); x.fillStyle = '#cf4a80'; x.fillText(nm[1], W / 2 + 66, 20);
  x.font = '900 24px system-ui,sans-serif'; x.fillStyle = '#2a3a5a'; x.fillText(score ? score[0] : 0, W / 2 - 66, 39); x.fillText(score ? score[1] : 0, W / 2 + 66, 39);
  x.font = '700 12px "Noto Sans TC",system-ui'; x.fillStyle = '#7a8aa8'; x.fillText(`先拿 ${WIN} 分`, W / 2, 22); x.font = '900 18px system-ui'; x.fillText(':', W / 2, 39); x.restore();
  if (banner) {
    const k = Math.min(1, banner.life * 2.5), sc = 1 + Math.max(0, banner.life - 1) * 1.5;
    x.save(); x.globalAlpha = k; x.translate(banner.x ?? W / 2, banner.y ?? 120); x.scale(sc, sc);
    x.font = '900 34px "Noto Sans TC",system-ui,sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 7; x.strokeStyle = '#fff'; x.strokeText(banner.t, 0, 0);
    x.fillStyle = banner.x ? '#ff7a1c' : '#3a6fd8'; x.fillText(banner.t, 0, 0); x.restore();
  }
}

// ---------- flow ----------
function endMatch() {
  state = 'over';
  const w = score[0] > score[1] ? 0 : 1, nm = names();
  let extra = '';
  if (mode === 'cpu') {
    if (w === 0) { MG.record('volley', level + 1); extra = `<p class="new">打贏${LEVELS[level].name}的電腦！^_^</p>` + (level < 2 ? `<p>要不要挑戰「${LEVELS[level + 1].name}」？</p>` : '<p>你是海灘排球冠軍！</p>'); }
    else extra = '<p>差一點點！再來一局吧</p>';
  }
  MG.sfx(mode === 'cpu' && w === 1 ? 'over' : 'win');
  MG.panel({
    title: mode === 'cpu' ? (w === 0 ? '你贏了！' : '電腦贏了…') : `${nm[w]} 贏了！`,
    html: `<div class="big">${score[0]} : ${score[1]}</div>${extra}`,
    buttons: [
      ...(mode === 'cpu' && w === 0 && level < 2 ? [{ label: `挑戰${LEVELS[level + 1].name}`, on: () => { level++; start(); } }] : []),
      { label: '再來一局', alt: mode === 'cpu' && w === 0 && level < 2, on: start },
      { label: '換模式', alt: true, on: menu },
    ],
  });
}
function start() { showPads(); newMatch(); MG.hide(); }
function menu() {
  state = 'menu'; resetRally(0); score = [0, 0]; hud();
  const best = MG.best('volley') || 0;
  MG.panel({
    title: '噗噗排球',
    html: `<p>把球打過網，讓球落在對方的沙灘上就得分，先拿 ${WIN} 分贏！</p>
      <p>${isTouch ? '<b>按住沙灘左右拖</b>，噗噗會跑到你的手指那裡；<b>點一下</b>就跳，<b>跳起來再點一下</b>就是殺球！兩人對打時，一人用一半的畫面、一根手指就好。沙灘上的虛線圈是球會掉的地方。' : '<b>跳起來球靠近時再按一次跳就是殺球！</b>接球時按著往網子方向會打得比較遠，往後按會打得高高的。沙灘上的虛線圈是球會掉的地方。'}</p>
      ${isTouch && innerHeight > innerWidth ? '<p class="new">📱 把手機橫放，球場會更大更好玩！</p>' : ''}
      <div class="modes">${LEVELS.map((L, i) => `<button class="mg-btn${i === 1 ? '' : ' alt'}" data-mode="cpu" data-lv="${i}">對電腦・${L.name}<small>${best > i ? '已打贏 ✓' : '　'}</small></button>`).join('')}
      <button class="mg-btn alt" data-mode="pvp">兩人對打<small>同一台裝置</small></button></div>`,
    keys: isTouch ? '一人一根手指：按住拖＝移動，點一下＝跳，在空中點＝殺球' : '1 人：<kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd> 或 <kbd>A</kbd><kbd>D</kbd><kbd>W</kbd>　2 人：左邊 <kbd>A</kbd><kbd>D</kbd><kbd>W</kbd>、右邊 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd>',
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { MG.sfx('click'); MG.unlock(); mode = b.dataset.mode; if (mode === 'cpu') level = +b.dataset.lv; start(); });
  setTimeout(() => document.querySelector('[data-lv="1"]')?.focus(), 30);
  showPads();
}
menu();
MG.loop(dt => { update(dt); draw(); });
</script>
</body>
