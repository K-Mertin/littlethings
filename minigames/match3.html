const goalsOf = L => L.g || (L.s ? ['s'] : L.c ? ['c'] : ['j']);

function mechOf(L) {

  if (L.gem) out.push('gem');
  if (/[LK]/.test(m)) out.push('lock');
  if (L.sp) out.push('make');
  return out;
}
const petCount = L => ((L.m || []).join('').match(/[PQ]/g) || []).length;
const MECH = {

const goalIcon = L => { if (L.fin) return '🌈'; const me = mechOf(L); return me.length ? MECH[me[me.length - 1]][0] : GOALI[goalsOf(L)[0]]; };

const goalEmoji = L => '🎯 ' + goalsOf(L).map(g => g === 's' ? `${L.s} ⭐` : g === 'c' ? L.c.map(([k, n]) => `${KINDS[k].em}×${n}`).join('  ') : g === 'f' ? `🍓×${L.f}⬇️` : g === 'p' ? `🐣×${petCount(L)}` : g === 'g' ? `💎×${L.gem}` : g === 'm' ? `🍭×${L.sp}` : `${GOALI[g]}→0`).join('  ');
const goalText = L => goalsOf(L).map(g => g === 's' ? `拿到 ${L.s} 分` : g === 'c' ? '消掉 ' + L.c.map(([k, n]) => `${n} 個${KINDS[k].nm}`).join('、') : { j: '把粉紅果凍格子全部消掉', f: `把 ${L.f} 顆草莓送到最下面`, b: '把木箱子全部敲破', a: '把小動物全部救出來', x: '把巧克力全部吃光', p: `救出果凍下的 ${petCount(L)} 隻小動物`, g: `收集 ${L.gem} 顆寶石`, l: '把泡泡全部戳破', m: `做出 ${L.sp} 個特別糖果` }[g]).join('，');

let L = LEVELS[0], N = 7, grid = [], jel = [], level = 1, mode = 'relax', state = 'menu', phase = 'idle';

// blk[r][c]: null = open cell, or { t: 'hole' | 'stone' | 'box' | 'cage' | 'choc', hp, an, hit }
let blk = [], fruitGot = 0, turnFx = true, chocFx = true, chocCalm = 0, chocCap = 0, chocAte = false, collected = [];

const snd = (() => { const last = {}; return (n, a) => { const now = performance.now(); if (now - (last[n] || 0) < 60) return; last[n] = now; MG.sfx(n, a); }; })();

// ---------- board rules ----------
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const kd = (r, c) => { const p = grid[r] && grid[r][c]; return p && p.sp !== 'star' && p.k >= 0 ? p.k : -1; };
const gemsOn = () => grid.reduce((a, row) => a + row.filter(p => p && p.gem).length, 0);
const locksLeft = () => grid.reduce((a, row) => a + row.filter(p => p && p.lock).length, 0);
const petsFree = () => pets.filter(q => q.free).length;
const isOpen = (r, c) => inB(r, c) && !blk[r][c];
const countBlk = t => blk.reduce((a, row) => a + row.filter(b => b && b.t === t).length, 0);
const fruitsOn = () => grid.reduce((a, row) => a + row.filter(p => p && p.fruit).length, 0);
// the lowest open cell of a column: a fruit that reaches it is collected
const bottomOf = c => { for (let r = N - 1; r >= 0; r--) if (!blk[r][c]) return r; return -1; };
const newFruit = (r, c) => { const p = newPiece(-1, r, c); p.fruit = true; return p; };
const newPiece = (k, r, c) => ({ k, sp: '', x: c, y: r, vy: 0, land: 0, flash: 0, popping: false, spent: false, id: ++uid });
const randKind = () => MG.randi(0, L.k - 1);

// all straight runs of 3+, joined into groups when they share a cell (so L / T shapes are one group)
function groupsNow() {
  const runs = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N;) {
    const k = kd(r, c); let e = c + 1;
    if (k >= 0) while (e < N && kd(r, e) === k) e++;
    if (k >= 0 && e - c >= 3) runs.push({ h: true, k, cells: Array.from({ length: e - c }, (_, i) => r * N + c + i) });
    c = e;
  }
  for (let c = 0; c < N; c++) for (let r = 0; r < N;) {
    const k = kd(r, c); let e = r + 1;
    if (k >= 0) while (e < N && kd(e, c) === k) e++;
    if (k >= 0 && e - r >= 3) runs.push({ h: false, k, cells: Array.from({ length: e - r }, (_, i) => (r + i) * N + c) });
    r = e;
  }
  const par = runs.map((_, i) => i), own = new Map();
  const root = i => par[i] === i ? i : (par[i] = root(par[i]));
  runs.forEach((run, i) => run.cells.forEach(key => { if (own.has(key)) par[root(i)] = root(own.get(key)); else own.set(key, i); }));

      const q = Math.min(1, k), e2 = q * q * (3 - 2 * q), px = e.x + (e.tx - e.x) * e2, py = e.y + (e.ty - e.y) * e2 - Math.sin(q * Math.PI) * cs * 1.6;
      const sc = (1 + Math.sin(q * Math.PI) * 0.5) * (q > 0.85 ? 1 - (q - 0.85) * 4 : 1);
      const s = e.what === 'gem' ? blkSprite('gem') : critSprite(e.what.slice(5), 'happy', 1);
      const d = e.s * sc * (e.what === 'gem' ? 1.2 : 1.5);
      x.drawImage(s.c, px - d / 2, py - d / 2, d, d);
      x.fillStyle = 'rgba(255,255,255,.9)'; twinkle(x, px - d * 0.4, py - d * 0.3, 4 + 3 * Math.sin(t * 20));
    } else if (e.type === 'flash') {
      x.fillStyle = `rgba(255,255,255,${a * 0.35})`; x.fillRect(lay.bx, lay.by, lay.B, lay.B);
    }
  }
}
function drawFloats() {
  for (const f of floats) {
    let sz = Math.round(lay.cs * f.size * (f.big ? Math.min(1.25, 0.8 + (1.3 - f.life) * 2) : 1));
    x.globalAlpha = Math.min(1, f.life * 2.5);
    x.font = `900 ${sz}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const fw = x.measureText(f.text).width; if (fw > lay.B * 0.95) { sz = Math.floor(sz * lay.B * 0.95 / fw); x.font = `900 ${sz}px ${FONT}`; }
    const fx2 = Math.max(lay.bx + x.measureText(f.text).width / 2, Math.min(lay.bx + lay.B - x.measureText(f.text).width / 2, f.x));
    x.lineWidth = Math.max(3, sz * 0.2); x.lineJoin = 'round'; x.strokeStyle = f.big ? WD.line : '#fff'; x.strokeText(f.text, fx2, f.y);
    if (f.big) { x.lineWidth = Math.max(2, sz * 0.1); x.strokeStyle = '#fff'; x.strokeText(f.text, fx2, f.y); }
    x.fillStyle = f.col; x.fillText(f.text, fx2, f.y);
  }
  x.globalAlpha = 1;
}
// hero on a little themed stage, rescued friends bouncing beside it
function drawStage() {
  const p = lay.pu, r = p.r, gy = p.y + r * 0.95, id = WD.id;
  const top = { candy: ['#fff', '#ffc4dc', '#e88ab0'], garden: ['#a6e07a', '#6bbf4c', '#4a9a34'], beach: ['#ffeec0', '#f4cf86', '#c99a50'], snow: ['#ffffff', '#e2f0fc', '#a8c8ea'], space: ['#d8ccf4', '#a898d8', '#7a6ab0'], rainbow: ['#ffffff', '#fff0f8', '#e0c8e8'] }[id];
  x.fillStyle = 'rgba(40,20,40,.15)'; x.beginPath(); x.ellipse(p.x, gy + r * 0.2, r * 1.35, r * 0.28, 0, 0, 7); x.fill();
  const g = x.createLinearGradient(0, gy - r * 0.15, 0, gy + r * 0.25); g.addColorStop(0, top[0]); g.addColorStop(1, top[1]);
  x.fillStyle = g; x.strokeStyle = top[2]; x.lineWidth = 2.5; x.beginPath(); x.ellipse(p.x, gy, r * 1.25, r * 0.24, 0, 0, 7); x.fill(); x.stroke();
  if (id === 'candy') { x.fillStyle = '#ff7aa8'; for (let i = -3; i <= 3; i++) { x.beginPath(); x.arc(p.x + i * r * 0.33, gy + r * 0.2, r * 0.07, 0, 7); x.fill(); } }
  if (id === 'garden') flower(x, p.x + r * 0.95, gy - r * 0.02, r * 0.09, '#ff8fb8');
  if (id === 'beach') { x.fillStyle = '#ff8a6a'; star5(x, p.x - r * 0.95, gy, r * 0.13, 0.5); }
}
function drawFriends() {
  const f = lay.friends; if (!f || !friends.length || f.w < 20) return;
  const fr = Math.max(12, Math.min(lay.pu.r * 0.42, 26)), step = fr * 2.25, fit = Math.max(1, Math.floor(f.w / step));
  const show = friends.slice(-fit);
  show.forEach((q, i) => {
    const hop = Math.abs(Math.sin(t * 3.2 + i * 1.3)) * fr * 0.35;
    const cx = f.x + fr + i * step, cy = f.y - hop;
    x.fillStyle = 'rgba(40,20,40,.15)'; x.beginPath(); x.ellipse(cx, f.y + fr * 0.95, fr * 0.8, fr * 0.18, 0, 0, 7); x.fill();
    const s = critSprite(q.kind, 'happy', 1), d = fr * 3.2;
    x.drawImage(s.c, cx - d / 2, cy - d * 0.55, d, d);
  });
  if (friends.length > fit) txt(`+${friends.length - fit}`, f.x + fit * step + 4, f.y, 14, WD.ink, 'left', 900);
}
function drawPuPu() {
  drawStage();
  const p = lay.pu, sq = squashT > 0 ? Math.sin(squashT * 18) * 0.12 : Math.sin(t * 2.4) * 0.03;
  const look = sel ? (cellX(sel.c) - p.x) / 300 : Math.sin(t * 0.7) * 0.4;
  const hop = party ? Math.abs(Math.sin(party.t * 6)) * p.r * 0.35 : 0;
  MG.puPu(x, p.x, p.y - hop, p.r, idleT > 14 && state === 'play' ? 'sleep' : party ? 'yay' : mood, sq, { look: Math.max(-1, Math.min(1, look)), arms: mood === 'wow' || mood === 'love' || party ? 'up' : true });
  drawFriends();
  if (say && lay.bubble.w > 50) {
    const b = lay.bubble; let sz = Math.min(21, Math.max(15, lay.pu.r * 0.42)) * RK();
    x.font = `800 ${sz}px ${FONT}`;
    while (sz > 11 && x.measureText(say.text).width + 26 > b.w) { sz--; x.font = `800 ${sz}px ${FONT}`; }   // long lines shrink to fit the bubble
    const w = Math.min(b.w, x.measureText(say.text).width + 26), h = sz + 18, bx = b.x, by = b.y;
    x.globalAlpha = Math.min(1, say.life * 3);
    x.fillStyle = 'rgba(70,30,60,.14)'; x.beginPath(); x.roundRect(bx + 1, by + 4, w, h, 14); x.fill();
    x.fillStyle = '#fff'; x.strokeStyle = WD.ui; x.lineWidth = 2.5;
    x.beginPath(); x.roundRect(bx, by, w, h, 14); x.fill(); x.stroke();
    x.beginPath(); x.moveTo(bx + 6, by + h - 12); x.lineTo(bx - 10, by + h + 4); x.lineTo(bx + 18, by + h - 2); x.closePath(); x.fill();
    x.beginPath(); x.moveTo(bx + 6, by + h - 12); x.lineTo(bx - 10, by + h + 4); x.lineTo(bx + 18, by + h - 2); x.stroke();
    x.fillStyle = '#fff'; x.fillRect(bx + 4, by + h - 13, 16, 10);
    txt(say.text, bx + w / 2, by + h / 2 + 1, sz, WD.ink);
    x.globalAlpha = 1;
  }
}
function drawHintBtn() {
  const b = lay.hint, busy = phase !== 'idle' || state !== 'play', press = hint && !hint.gentle;
  x.fillStyle = busy ? '#e6d3a0' : '#d89400'; x.beginPath(); x.roundRect(b.x, b.y + 5, b.w, b.h, 22); x.fill();
  const g = x.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, busy ? '#fff3cc' : '#fff4b8'); g.addColorStop(1, busy ? '#f2e0b0' : '#ffc93a');
  x.fillStyle = g; x.strokeStyle = busy ? '#d9c08a' : '#c98a00'; x.lineWidth = 3;
  x.beginPath(); x.roundRect(b.x, b.y + (press ? 3 : 0), b.w, b.h, 22); x.fill(); x.stroke();
  x.fillStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.roundRect(b.x + 12, b.y + (press ? 3 : 0) + 5, b.w - 24, b.h * 0.22, b.h * 0.11); x.fill();
  const sz = Math.min(30 * RK(), b.h * 0.42, b.w / 4.2);
  x.fillStyle = '#000'; x.font = `${sz}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('💡', b.x + b.w / 2 - sz * 1.15, b.y + b.h / 2 + (press ? 3 : 0));
  txt('提示', b.x + b.w / 2 + sz * 0.55, b.y + b.h / 2 + (press ? 3 : 0) + 1, sz, busy ? '#a89770' : '#6a4300', 'center', 900);
  if (!busy && idleT > 8 && state === 'play') { x.fillStyle = 'rgba(255,255,255,.9)'; twinkle(x, b.x + b.w - 14, b.y + 12, 6 + 3 * Math.sin(t * 6)); }
}
// level-themed win party: the world's own confetti rains over everything
function drawParty() {
  if (!party) return;
  for (const q of party.ps) {
    q.vy += 260 * party.dt; q.x += q.vx * party.dt; q.y += q.vy * party.dt; q.rot += q.vr * party.dt;
    if (q.y > cv.lh + 20) continue;
    x.globalAlpha = Math.max(0, Math.min(1, 4 - party.t * 0.8));
    if (WD.id === 'candy' && q.i % 3 === 0) { x.save(); x.translate(q.x, q.y); x.rotate(q.rot); x.drawImage(sprite(q.i % L.k, '').c, -9, -9, 18, 18); x.restore(); }
    else if (WD.id === 'garden' && q.i % 3 === 0) flower(x, q.x, q.y, 4, q.c);
    else if (WD.id === 'rainbow' || WD.id === 'space') { x.fillStyle = q.c; star5(x, q.x, q.y, 6, 0.45); }
    else bit(x, WD.id, q.x, q.y, 1.5, q.c, q.rot);
  }
  x.globalAlpha = 1;
}
// the background + empty board + jelly only change now and then, so they live on their own canvas
let bgLayer = null, bgDirty = true;
function draw() {
  if (!lay) { bgCandy(x, cv.lw, cv.lh); return; }
  const px = cv._mgScale || 1;
  if (!bgLayer) bgLayer = document.createElement('canvas');
  if (bgLayer.width !== cv.width || bgLayer.height !== cv.height) { bgLayer.width = cv.width; bgLayer.height = cv.height; bgDirty = true; }
  if (bgDirty) { const g = bgLayer.getContext('2d'); g.setTransform(px, 0, 0, px, 0, 0); backdrop(g); drawBoard(g); bgDirty = false; }
  x.drawImage(bgLayer, 0, 0, cv.lw, cv.lh);
  drawAmbient();
  drawBanner(); drawGoal(); drawInfo();
  const sh = shakeT > 0 ? shakeT * 14 : 0;
  if (sh) { x.save(); x.translate(Math.sin(t * 90) * sh, Math.cos(t * 77) * sh * 0.6); }
  drawPieces(); drawEffects();
  if (sh) x.restore();
  MG.fx.draw(x); drawFloats(); drawPuPu(); drawHintBtn(); drawParty();
}

// ---------- menu ----------
function menu() {
  state = 'menu'; sel = null; hint = null;
  MG.choose({
    id: 'match3', title: '噗噗消消樂',
    html: `<p>把<b>相鄰的兩顆糖果</b>交換，三個以上一樣的連成一排就會消掉！可以點一顆再點旁邊那顆，也可以用手指直接往旁邊滑。</p>` +
      `<p>一次消 4 個變<b>條紋糖</b>（消掉一整排），排成 L 或 T 變<b>包裝糖炸彈</b>，一次消 5 個變<b>🌈 彩虹星星</b>（跟誰換就消掉那個顏色全部）！</p>` +
      `<p>${LEVELS.length} 關，一路從 🍭糖果店、🌷小花園、🏖️海灘、⛄雪地 玩到 🚀太空，最後是 🌈彩虹終點！🆕 第 46 關起還有 🍭 做出特別糖果的新任務。</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '步數不限，達成目標就過關' }, { id: 'moves', label: '🎯 步數挑戰', sub: '步數有限，用完可以再試' }],
    levels: { count: LEVELS.length, max: LEVELS.length, fresh: n => n >= 46, label: n => `${n} ${goalIcon(LEVELS[n - 1])} ${lvName(LEVELS[n - 1])}`, short: n => `${n}${goalIcon(LEVELS[n - 1])}` },
    keys: '點一下再點旁邊，或用手指滑　<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 移動、<kbd>Enter</kbd> 選取、<kbd>H</kbd> 提示',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
setupLevel(1); menu();

// small hook for automated tests (read-only snapshot of the board)
window.M3T = {
  get state() { return state; }, get phase() { return phase; }, get level() { return level; }, get mode() { return mode; },
  get moves() { return moves; }, get score() { return score; }, get combo() { return combo; }, get busy() { return phase !== 'idle' || !!tween; },
  board: () => grid.map(row => row.map(p => p ? [p.k, p.sp] : null)),
  jelly: () => jel.map(row => row.slice()), hint: () => hint && { a: hint.a, b: hint.b, gentle: hint.gentle }, sel: () => sel,
  goalDone, findMoves: () => findMoves().length, get say() { return say && say.text; }, floats: () => floats.map(f => f.text),
  // client (CSS px) coords of a cell centre / the hint button
  at(r, c) { return toClient(cellX(c), cellY(r)); }, hintBtn() { return toClient(lay.hint.x + lay.hint.w / 2, lay.hint.y + lay.hint.h / 2); },
  get count() { return LEVELS.length; }, get fruitGot() { return fruitGot; }, get jellyLeft() { return jellyLeft; },
  blocks: () => blk.map(row => row.map(b => b ? b.t + (b.t === 'box' ? b.hp : '') : '')), board2: () => grid.map(row => row.map(p => p ? (p.lock ? 'L' : '') + (p.gem ? 'G' : '') + p.k : '')), progress: () => progressText(), mech: n => mechOf(LEVELS[n - 1]),
  start(n, m = 'relax') { mode = m; startLevel(n); MG.hide(); },
  play(n, m = 'relax') { mode = m; startLevel(n); },   // like start, but keeps the one-time intro panel
  get world() { return WD.id; }, get gemGot() { return gemGot; }, pets: () => pets.map(q => ({ ...q })), get locks() { return locksLeft(); }, get friends() { return friends.length; },
  win() { if (state === 'play') { for (const q of pets) q.free = true; win(); } },
  // test only: render n frames synchronously and return the average ms per frame
  bench(n = 60) { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); draw(); } return (performance.now() - t0) / n; },
  swap(a, b) { return trySwap(a, b); },
  // test only: play by always taking the 💡 hint move, stepping the game synchronously; returns the moves it needed (or -1)
  sim(max = 400) {
    for (let i = 0; i < 400000 && state === 'play'; i++) {
      if (phase === 'idle' && !tween) { if (moves >= max) return -1; const h = pickHint(); if (h) trySwap(h.a, h.b); }
      update(1 / 30);
    }
    return state === 'over' && goalDone() ? moves : -1;
  },
};
function toClient(lx, ly) {
  const rc = cv.getBoundingClientRect(), B = 3;
  return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh };
}

MG.loop(dt => {
  if (state === 'play' || state === 'over') update(dt); else { t += dt; MG.fx.step(dt); }
  draw();
});
</script>
