<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗消消樂</title>
<link rel="stylesheet" href="mini.css">
<style>.mg-stage{padding:6px}.m3-stars{font-size:38px;letter-spacing:.12em;margin:2px 0 4px}</style>
</head>
<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'match3', title: '噗噗消消樂', stats: ['level', 'moves'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
let land = false;

// ---------- pieces: every colour also has its own shape ----------
const KINDS = [
  { pal: MG.JELLY.red, shape: 'heart', nm: '紅愛心', em: '❤️' },
  { pal: MG.JELLY.yellow, shape: 'star', nm: '黃星星', em: '⭐' },
  { pal: MG.JELLY.green, shape: 'square', nm: '綠方糖', em: '🟩' },
  { pal: MG.JELLY.blue, shape: 'drop', nm: '藍水滴', em: '💧' },
  { pal: MG.JELLY.purple, shape: 'tri', nm: '紫三角', em: '🔺' },
  { pal: MG.JELLY.orange, shape: 'ball', nm: '橘糖球', em: '🟠' },
];
// ---------- levels ----------
// n = board size, k = how many kinds, mv = moves in 🎯 步數挑戰
// goal: s = reach points | c = [[kind, count], ...] clear that many | j = rows of the pink jelly map ('#' = jelly)
const LEVELS = [
  { n: 7, k: 4, mv: 15, s: 1000 },
  { n: 7, k: 4, mv: 14, c: [[0, 20]] },
  { n: 7, k: 4, mv: 14, j: ['.......', '.##.##.', '.#####.', '.#####.', '..###..', '...#...', '.......'] },
  { n: 7, k: 5, mv: 22, s: 1500 },
  { n: 7, k: 5, mv: 21, c: [[1, 14], [3, 14]] },
  { n: 8, k: 5, mv: 28, j: ['........', '........', '.######.', '........', '........', '.######.', '........', '........'] },
  { n: 8, k: 5, mv: 28, s: 2000 },
  { n: 8, k: 5, mv: 22, c: [[2, 18], [4, 18]] },
  { n: 8, k: 5, mv: 34, j: ['........', '.#....#.', '..#..#..', '...##...', '...##...', '..#..#..', '.#....#.', '........'] },
  { n: 8, k: 6, mv: 40, s: 2000 },
  { n: 8, k: 6, mv: 32, c: [[0, 14], [1, 14], [5, 14]] },
  { n: 8, k: 6, mv: 40, j: ['........', '...##...', '...##...', '.######.', '.######.', '...##...', '...##...', '........'] },
  { n: 8, k: 6, mv: 60, j: ['........', '.##..##.', '.######.', '.######.', '.######.', '..####..', '...##...', '........'] },
  { n: 8, k: 6, mv: 58, s: 3200 },
  { n: 8, k: 6, mv: 58, j: ['........', '.######.', '.######.', '.######.', '.######.', '.######.', '.######.', '........'] },
];
const goalIcon = L => L.s ? '⭐' : L.c ? '🍬' : '💗';
// the goal as numbers + emoji only (for the quick toast when a level starts)
const goalEmoji = L => L.s ? `🎯 ${L.s} ⭐` : L.c ? '🎯 ' + L.c.map(([k, n]) => `${KINDS[k].em}×${n}`).join('  ') : '🎯 💗 → 0';
const goalText = L => L.s ? `拿到 ${L.s} 分` : L.c ? '消掉 ' + L.c.map(([k, n]) => `${n} 個${KINDS[k].nm}`).join('、') : '把粉紅果凍格子全部消掉';

let L = LEVELS[0], N = 7, grid = [], jel = [], level = 1, mode = 'relax', state = 'menu', phase = 'idle';
let score = 0, moves = 0, combo = 0, bestCombo = 0, got = [], jellyLeft = 0;
let sel = null, drag = null, kc = null, hint = null, idleT = 0, t = 0;
let tween = null, popT = 0, popping = [], lastMoved = [], effects = [], floats = [];
let mood = 'happy', moodT = 0, squashT = 0, say = null, lay = null, uid = 0;
const POP = 0.26, SWAP = 0.17;
// sounds: the same one at most once per 60 ms, so big chains don't turn into noise
const snd = (() => { const last = {}; return (n, a) => { const now = performance.now(); if (now - (last[n] || 0) < 60) return; last[n] = now; MG.sfx(n, a); }; })();

// ---------- board rules ----------
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const kd = (r, c) => { const p = grid[r] && grid[r][c]; return p && p.sp !== 'star' ? p.k : -1; };
const newPiece = (k, r, c) => ({ k, sp: '', x: c, y: r, vy: 0, land: 0, flash: 0, popping: false, spent: false, id: ++uid });
const randKind = () => MG.randi(0, L.k - 1);

// all straight runs of 3+, joined into groups when they share a cell (so L / T shapes are one group)
function groupsNow() {
  const runs = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N;) {
    const k = kd(r, c); let e = c + 1;
    if (k >= 0) while (e < N && kd(r, e) === k) e++;
    if (k >= 0 && e - c >= 3) runs.push({ h: true, k, cells: Array.from({ length: e - c }, (_, i) => r * N + c + i) });
    c = e;
  }
  for (let c = 0; c < N; c++) for (let r = 0; r < N;) {
    const k = kd(r, c); let e = r + 1;
    if (k >= 0) while (e < N && kd(e, c) === k) e++;
    if (k >= 0 && e - r >= 3) runs.push({ h: false, k, cells: Array.from({ length: e - r }, (_, i) => (r + i) * N + c) });
    r = e;
  }
  const par = runs.map((_, i) => i), own = new Map();
  const root = i => par[i] === i ? i : (par[i] = root(par[i]));
  runs.forEach((run, i) => run.cells.forEach(key => { if (own.has(key)) par[root(i)] = root(own.get(key)); else own.set(key, i); }));
  const gs = new Map();
  runs.forEach((run, i) => {
    const rt = root(i); if (!gs.has(rt)) gs.set(rt, { runs: [], cells: new Set(), k: run.k });
    const g = gs.get(rt); g.runs.push(run); run.cells.forEach(key => g.cells.add(key));
  });
  return [...gs.values()];
}
// which special a group makes, and where it appears
function makeOf(g, moved) {
  const big = g.runs.reduce((a, b) => b.cells.length > a.cells.length ? b : a);
  const hasH = g.runs.some(q => q.h), hasV = g.runs.some(q => !q.h);
  let sp = '';
  if (big.cells.length >= 5) sp = 'star';
  else if (hasH && hasV) sp = 'bomb';
  else if (big.cells.length === 4) sp = big.h ? 'h' : 'v';
  if (!sp) return null;
  let at = moved.find(key => g.cells.has(key));
  if (at == null && sp === 'bomb') {
    const hs = new Set(g.runs.filter(q => q.h).flatMap(q => q.cells));
    at = g.runs.filter(q => !q.h).flatMap(q => q.cells).find(key => hs.has(key));
  }
  if (at == null) at = big.cells[Math.floor(big.cells.length / 2)];
  return { at, sp, k: g.k };
}
function lineLen(r, c) {
  const k = kd(r, c); if (k < 0) return 0;
  let a = 1, b = 1;
  for (let i = c - 1; i >= 0 && kd(r, i) === k; i--) a++;
  for (let i = c + 1; i < N && kd(r, i) === k; i++) a++;
  for (let i = r - 1; i >= 0 && kd(i, c) === k; i--) b++;
  for (let i = r + 1; i < N && kd(i, c) === k; i++) b++;
  return (a >= 3 ? a : 0) + (b >= 3 ? b : 0);
}
function swapGrid(a, b) { const t1 = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t1; }
// every swap that does something, with a rough "how good" value for the hint
function findMoves(rich = false) {
  const out = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {
    const r2 = r + dr, c2 = c + dc; if (!inB(r2, c2)) continue;
    const pa = grid[r][c], pb = grid[r2][c2]; if (!pa || !pb) continue;
    const a = { r, c }, b = { r: r2, c: c2 };
    if (pa.sp === 'star' || pb.sp === 'star') { out.push({ a, b, v: 12 }); continue; }
    if (pa.sp && pb.sp) { out.push({ a, b, v: 10 }); continue; }
    swapGrid(a, b);
    let v = lineLen(r, c) + lineLen(r2, c2);
    if (v && rich) v = worth(groupsNow());
    swapGrid(a, b);
    if (v) out.push({ a, b, v });
  }
  return out;
}
// how much a set of matches helps the goal (used by the 💡 hint): jelly cells and wanted colours count extra
function worth(groups) {
  let v = 0;
  for (const g of groups) {
    v += g.cells.size + (g.cells.size >= 4 ? 3 : 0) + (g.runs.length > 1 ? 3 : 0);
    for (const key of g.cells) {
      if (jel[Math.floor(key / N)][key % N] > 0) v += 4;
      if (L.c && L.c.some(([k, n], i) => k === g.k && got[i] < n)) v += 1.5;
    }
  }
  return v;
}
function genBoard() {
  for (let tries = 0; tries < 200; tries++) {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const bad = new Set();
      if (c >= 2 && kd(r, c - 1) === kd(r, c - 2)) bad.add(kd(r, c - 1));
      if (r >= 2 && kd(r - 1, c) === kd(r - 2, c)) bad.add(kd(r - 1, c));
      const ok = [...Array(L.k).keys()].filter(k => !bad.has(k));
      grid[r][c] = newPiece(MG.pick(ok), r, c);
    }
    if (findMoves().length >= 3) return;
  }
}

// ---------- level flow ----------
function setupLevel(n) {
  level = n; L = LEVELS[n - 1]; N = L.n;
  jel = Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => L.j && L.j[r][c] === '#' ? 1 : 0));
  jellyLeft = jel.flat().reduce((a, b) => a + b, 0);
  got = L.c ? L.c.map(() => 0) : [];
  score = 0; moves = 0; combo = 0; bestCombo = 0; sel = null; drag = null; kc = null; hint = null; idleT = 0;
  tween = null; popping = []; effects = []; floats = []; phase = 'idle'; say = null; mood = 'happy';
  genBoard(); MG.fx.clear(); layout(); sprites.clear(); bgDirty = true;
}
function startLevel(n) {
  setupLevel(n); state = 'play'; MG.hide(); hud();
  talk('Go! 🚀', 2);
  // landscape shows the goal big in the left column; a toast there would cover the top of the board
  if (land) talk('🎯 Goal 👈', 2.6); else MG.toast(goalEmoji(L), 2600);
}
function hud() {
  MG.stat('level', `第 ${level} 關`);
  MG.stat('moves', mode === 'moves' ? `剩 ${Math.max(0, L.mv - moves)} 步` : `${moves} 步`);
}
function goalDone() {
  if (L.s) return score >= L.s;
  if (L.c) return L.c.every(([, n], i) => got[i] >= n);
  return jellyLeft <= 0;
}
function starsNow() { const f = moves / L.mv; return f <= 0.7 ? 3 : f <= 1 ? 2 : 1; }
function win() {
  state = 'over'; sel = null; hint = null; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  mood = 'love'; moodT = 3; squashT = 0.5; talk(MG.WORDS.clear, 3);
  const rec = MG.record('match3', level), st = starsNow();
  MG.fx.burst(lay.bx + lay.B / 2, lay.by + lay.B / 2, { n: 60, colors: KINDS.map(k => k.pal[1]).concat('#fff'), shape: 'star', speed: 340, up: 180, size: 7, life: 1.2 });
  setTimeout(() => MG.panel({
    title: `第 ${level} 關完成！`,
    html: `<div class="m3-stars">${'⭐'.repeat(st)}${'☆'.repeat(3 - st)}</div><div class="big">${score} 分</div><p>走了 ${moves} 步${bestCombo >= 2 ? `，最多連鎖 ${bestCombo} 次` : ''} ^_^</p>` +
      (st < 3 ? `<p>${L.mv * 0.7 | 0} 步以內完成可以拿到三顆星喔</p>` : '<p>太厲害了，三顆星！</p>') +
      (rec.isNew ? '<p class="new">新紀錄！^_^</p>' : '') +
      (level < LEVELS.length ? `<p>下一關：${goalIcon(LEVELS[level])} ${goalText(LEVELS[level])}</p>` : '<p>十五關全部過關，你是消消樂大師！</p>'),
    buttons: [
      { label: level < LEVELS.length ? '下一關' : '回到第 1 關', on: () => { const nx = level < LEVELS.length ? level + 1 : 1; MG.store.set('match3.pickLevel', nx); startLevel(nx); } },
      { label: '這關再玩', alt: true, on: () => startLevel(level) },
      { label: '選關卡', alt: true, on: menu },
    ],
  }), 1100);
}
function outOfMoves() {
  state = 'over'; sel = null; hint = null; MG.sfx('over'); mood = 'ouch'; moodT = 3; talk('So close! 🤏', 3);
  setTimeout(() => MG.panel({
    title: '步數用完了！',
    html: `<p>還差一點點就過關了，再試一次吧 ^_^</p><div class="big">${score} 分</div><p>${goalIcon(L)} ${progressText()}</p><p>想慢慢玩的話，可以改成「🐢 慢慢玩」，步數不限喔</p>`,
    buttons: [
      { label: '再試一次', on: () => startLevel(level) },
      { label: '🐢 改成慢慢玩', alt: true, on: () => { mode = 'relax'; MG.store.set('match3.pickMode', 'relax'); startLevel(level); } },
      { label: '選關卡', alt: true, on: menu },
    ],
  }), 700);
}
function progressText() {
  if (L.s) return `${score} / ${L.s} 分`;
  if (L.c) return L.c.map(([k, n], i) => `${KINDS[k].nm} ${Math.min(n, got[i])}/${n}`).join('　');
  return `粉紅果凍還剩 ${jellyLeft} 格`;
}

// ---------- turn engine ----------
function trySwap(a, b) {
  if (state !== 'play' || phase !== 'idle') return false;
  if (!inB(b.r, b.c) || Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return false;
  sel = null; hint = null; idleT = 0;
  swapGrid(a, b);
  phase = 'tween';
  startTween([[grid[a.r][a.c], a], [grid[b.r][b.c], b]], SWAP, () => afterSwap(a, b));
  MG.sfx('flip');
  return true;
}
function afterSwap(a, b) {
  const pa = grid[a.r][a.c], pb = grid[b.r][b.c], ka = a.r * N + a.c, kb = b.r * N + b.c;
  let forced = [];
  if (pa.sp === 'star' || pb.sp === 'star') {
    if (pa.sp === 'star' && pb.sp === 'star') {
      pa.spent = pb.spent = true;
      for (let i = 0; i < N * N; i++) forced.push(i);
      effects.push({ type: 'ring', x: cellX(a.c), y: cellY(a.r), t: 0, big: true });
    } else {
      const s = pa.sp === 'star' ? pa : pb, o = s === pa ? pb : pa, sk = s === pa ? ka : kb;
      s.spent = true; forced.push(sk, sk === ka ? kb : ka);
      zapKind(o.k, sk, forced);
    }
  } else if (pa.sp && pb.sp) forced = [ka, kb];
  if (!forced.length && !groupsNow().length) {        // nothing happens: slide back
    swapGrid(a, b); MG.sfx('miss'); talk(MG.WORDS.oops, 1);
    startTween([[grid[a.r][a.c], a], [grid[b.r][b.c], b]], SWAP, () => { phase = 'idle'; });
    mood = 'ouch'; moodT = 0.6;
    return;
  }
  moves++; combo = 0; hud();
  runClear(forced, [ka, kb]);
}
function zapKind(k, from, out) {
  const fr = Math.floor(from / N), fc = from % N, to = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const p = grid[r][c]; if (p && p.sp !== 'star' && p.k === k) { out.push(r * N + c); to.push([cellX(c), cellY(r)]); } }
  effects.push({ type: 'zap', x: cellX(fc), y: cellY(fr), to, t: 0 });
}
function mostKind() {
  const cnt = Array(L.k).fill(0);
  for (const row of grid) for (const p of row) if (p && p.sp !== 'star' && !p.popping) cnt[p.k]++;
  return cnt.indexOf(Math.max(...cnt));
}
// cells a special clears when it goes off
function blast(r, c, p, out) {
  if (p.spent) return; p.spent = true;
  const col = p.sp === 'star' ? '#fff' : KINDS[p.k].pal[1];
  if (p.sp === 'h') { for (let i = 0; i < N; i++) out.push(r * N + i); effects.push({ type: 'beam', h: true, i: r, col, t: 0 }); snd('whoosh'); }
  else if (p.sp === 'v') { for (let i = 0; i < N; i++) out.push(i * N + c); effects.push({ type: 'beam', h: false, i: c, col, t: 0 }); snd('whoosh'); }
  else if (p.sp === 'bomb') { for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (inB(r + dr, c + dc)) out.push((r + dr) * N + c + dc); effects.push({ type: 'ring', x: cellX(c), y: cellY(r), t: 0, col }); snd('hit'); snd('boing'); }
  else if (p.sp === 'star') zapKind(mostKind(), r * N + c, out);
}
function hitCell(r, c, p) {
  if (p.sp !== 'star' && L.c) L.c.forEach(([k], i) => { if (k === p.k) got[i]++; });
  if (jel[r][c] > 0) {
    jel[r][c]--; jellyLeft--; bgDirty = true;
    MG.fx.burst(cellX(c), cellY(r), { n: 5, colors: ['#ff8fbd', '#ffc2dc', '#fff'], speed: 120, up: 30, size: 3.5, life: 0.5 });
  }
}
function runClear(forced, moved) {
  const groups = groupsNow();
  if (!groups.length && !forced.length) { endTurn(); return; }
  combo++; bestCombo = Math.max(bestCombo, combo);
  const clear = new Set(forced), prot = new Map();
  for (const g of groups) {
    g.cells.forEach(key => clear.add(key));
    const m = makeOf(g, moved); if (m && !prot.has(m.at)) prot.set(m.at, m);
  }
  // specials caught in the clear go off too (chains)
  const queue = [...clear], seen = new Set();
  while (queue.length) {
    const key = queue.pop(); if (seen.has(key)) continue; seen.add(key);
    const r = Math.floor(key / N), c = key % N, p = grid[r][c];
    if (!p || !p.sp) continue;
    const out = []; blast(r, c, p, out);
    for (const k2 of out) if (!prot.has(k2) && !clear.has(k2)) { clear.add(k2); queue.push(k2); }
  }
  let n = 0;
  for (const key of clear) {
    const r = Math.floor(key / N), c = key % N, p = grid[r][c];
    if (!p || p.popping) continue;
    hitCell(r, c, p);
    if (prot.has(key)) {           // this piece turns into a special one
      const m = prot.get(key); p.sp = m.sp; p.k = m.k; p.spent = false; p.flash = 0.5; n++;
      continue;
    }
    p.popping = true; popping.push([r, c]); n++;
    const pal = p.sp === 'star' ? ['#ff5a6e', '#ffc93a', '#4cc96a', '#3d9bff'] : KINDS[p.k].pal;
    MG.fx.burst(cellX(c), cellY(r), { n: p.sp ? 12 : 5, colors: [pal[1], pal[2], '#fff'], speed: p.sp ? 220 : 150, up: 50, size: p.sp ? 5 : 4, life: 0.55, shape: p.sp ? 'star' : 'dot' });
  }
  const pts = n * 10 * combo + prot.size * 30;
  score += pts;
  // feedback
  const mid = [...clear].reduce((a, key) => [a[0] + key % N, a[1] + Math.floor(key / N)], [0, 0]).map(v => v / Math.max(1, clear.size));
  floats.push({ x: cellX(mid[0]), y: cellY(mid[1]), text: `+${pts}`, life: 1, col: '#ff7a00', size: 0.42 });
  if (combo >= 2) {
    floats.push({ x: lay.bx + lay.B / 2, y: lay.by + lay.B * 0.42, text: MG.WORDS.chain(combo), life: 1.3, col: '#ff4f8a', size: 0.75, big: true });
    mood = 'wow'; moodT = 1.4; squashT = 0.4; talk(MG.praise(Math.min(5, combo)), 1.5);
  } else { mood = 'happy'; }
  if (prot.size) { const m = [...prot.values()][0]; talk({ h: 'Stripes! 🍭', v: 'Stripes! 🍭', bomb: 'Bomb! 💣', star: 'Rainbow! 🌈' }[m.sp], 1.6); mood = 'wow'; moodT = 1.2; snd('sparkle'); }
  // layered match sound: rises with the chain; a sparkle on big clears, the combo bells from chain 2 on
  snd('match', combo + (n >= 5 ? 1 : 0));
  if (combo >= 2) snd('combo', combo);
  if (n >= 6 && !prot.size) snd('sparkle');
  popT = 0; phase = 'pop';
  if (!popping.length) afterPop();
}
function afterPop() {
  for (const [r, c] of popping) grid[r][c] = null;
  popping = []; lastMoved = [];
  for (let c = 0; c < N; c++) {
    let w = N - 1;
    for (let r = N - 1; r >= 0; r--) {
      const p = grid[r][c]; if (!p) continue;
      if (r !== w) { grid[w][c] = p; grid[r][c] = null; p.vy = 0; lastMoved.push(w * N + c); }
      w--;
    }
    const need = w + 1;
    for (let i = 0; i <= w; i++) { const p = newPiece(randKind(), i, c); p.y = i - need - 0.25; grid[i][c] = p; lastMoved.push(i * N + c); }
  }
  phase = 'fall';
}
function endTurn() {
  phase = 'idle'; combo = 0; hud();
  if (goalDone()) { win(); return; }
  if (mode === 'moves' && moves >= L.mv) { outOfMoves(); return; }
  if (!findMoves().length) { MG.toast(`${MG.WORDS.stuck} Shuffle!`, 1900); shuffleBoard(); }
}
function shuffleBoard() {
  const cells = [], ps = [];

  const k = RK(), lab = MG.big ? '#8a1f4f' : '#c0507e', ink = MG.big ? '#2a1520' : '#4a2b3a';
  if (land) {
    const l1 = mode === 'moves' ? '剩下' : '走了';
    txt(l1, b.x + 16, b.y + b.h / 2, 15 * k, lab, 'left');
    const lw = x.measureText(l1).width;
    txt(`${mode === 'moves' ? Math.max(0, L.mv - moves) : moves} 步`, b.x + 24 + lw, b.y + b.h / 2, 26 * k, mode === 'moves' && L.mv - moves <= 3 ? '#e0344a' : ink, 'left', 900);
    txt(`${score} 分`, b.x + b.w - 16, b.y + b.h / 2, 22 * k, MG.big ? '#c25400' : '#ff7a00', 'right', 900);
  } else {
    txt(mode === 'moves' ? '剩下步數' : '走了', b.x + b.w / 2, b.y + 18 * k, 14 * k, lab);
    txt(`${mode === 'moves' ? Math.max(0, L.mv - moves) : moves}`, b.x + b.w / 2, b.y + b.h / 2 + 2, 30 * k, mode === 'moves' && L.mv - moves <= 3 ? '#e0344a' : ink, 'center', 900);
    txt(`${score} 分`, b.x + b.w / 2, b.y + b.h - 16 * k, 17 * k, MG.big ? '#c25400' : '#ff7a00', 'center', 900);
  }
}
function drawBoard(x) {
  const f = lay.frame, cs = lay.cs;
  x.fillStyle = 'rgba(150,70,120,.18)'; x.beginPath(); x.roundRect(f.x, f.y + 6, f.w, f.h, 20); x.fill();
  const g = x.createLinearGradient(0, f.y, 0, f.y + f.h); g.addColorStop(0, '#fff3f8'); g.addColorStop(1, '#f3e6ff');
  x.fillStyle = g; x.strokeStyle = '#e59ac0'; x.lineWidth = 3; x.beginPath(); x.roundRect(f.x, f.y, f.w, f.h, 20); x.fill(); x.stroke();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const px = lay.bx + c * cs, py = lay.by + r * cs;
    x.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.75)' : 'rgba(236,214,245,.6)';
    x.beginPath(); x.roundRect(px + 1, py + 1, cs - 2, cs - 2, cs * 0.16); x.fill();
    if (jel[r][c] > 0) x.drawImage(jellySprite().c, px, py, cs, cs);
  }
}
function drawPieces() {
  const cs = lay.cs;
  x.save(); x.beginPath(); x.rect(lay.bx - 4, lay.by - 2, lay.B + 8, lay.B + 6); x.clip();
  const hl = (hint && !hint.gentle && Math.floor(hint.t * 3) % 2 === 0);
  if (hint) for (const q of [hint.a, hint.b]) {
    x.fillStyle = hint.gentle ? 'rgba(255,214,90,.28)' : hl ? 'rgba(255,200,40,.6)' : 'rgba(255,214,90,.35)';
    x.beginPath(); x.roundRect(lay.bx + q.c * cs + 2, lay.by + q.r * cs + 2, cs - 4, cs - 4, cs * 0.2); x.fill();
  }
  if (sel) {
    x.fillStyle = 'rgba(255,236,120,.75)'; x.strokeStyle = '#ffb31a'; x.lineWidth = 3;
    x.beginPath(); x.roundRect(lay.bx + sel.c * cs + 2, lay.by + sel.r * cs + 2, cs - 4, cs - 4, cs * 0.2); x.fill(); x.stroke();
  }
  const late = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const p = grid[r][c]; if (!p) continue;
    if (p.popping || (tween && tween.items.length <= 2 && tween.items.some(it => it.p === p))) { late.push([p, r, c]); continue; }
    drawOne(p, r, c);
  }
  for (const [p, r, c] of late) drawOne(p, r, c);
  x.restore();
  if (kc) { x.strokeStyle = '#3d7bff'; x.lineWidth = 3; x.setLineDash([6, 5]); x.beginPath(); x.roundRect(lay.bx + kc.c * cs + 3, lay.by + kc.r * cs + 3, cs - 6, cs - 6, cs * 0.2); x.stroke(); x.setLineDash([]); }
  if (hint && !hint.gentle) {    // arrow between the two hint pieces
    const ax = cellX(hint.a.c), ay = cellY(hint.a.r), bx = cellX(hint.b.c), by = cellY(hint.b.r), wob = Math.sin(t * 8) * cs * 0.06;
    const mx = (ax + bx) / 2, my = (ay + by) / 2, hz = hint.a.r === hint.b.r;
    x.save(); x.translate(mx + (hz ? 0 : wob), my + (hz ? wob : 0)); if (!hz) x.rotate(Math.PI / 2);
    x.fillStyle = '#fff'; x.strokeStyle = '#ff8a00'; x.lineWidth = 3;
    const s = cs * 0.26;
    x.beginPath(); x.moveTo(-s * 1.4, 0); x.lineTo(-s * 0.6, -s * 0.7); x.lineTo(-s * 0.6, -s * 0.28); x.lineTo(s * 0.6, -s * 0.28); x.lineTo(s * 0.6, -s * 0.7); x.lineTo(s * 1.4, 0); x.lineTo(s * 0.6, s * 0.7); x.lineTo(s * 0.6, s * 0.28); x.lineTo(-s * 0.6, s * 0.28); x.lineTo(-s * 0.6, s * 0.7); x.closePath();
    x.fill(); x.stroke(); x.restore();
  }
}
function drawOne(p, r, c) {
  const cs = lay.cs, s = sprite(p.k, p.sp);
  let px = lay.bx + (p.x + 0.5) * cs, py = lay.by + (p.y + 0.5) * cs, sx = 1, sy = 1, rot = 0, a = 1;
  if (p.popping) { const k = popT / POP; const sc = k < 0.3 ? 1 + k / 0.3 * 0.22 : 1.22 * (1 - (k - 0.3) / 0.7); sx = sy = Math.max(0.01, sc); a = Math.min(1, 1.6 - k * 1.4); }
  if (p.land > 0) { const q = p.land / 0.2; sx *= 1 + 0.16 * Math.sin(q * Math.PI); sy *= 1 - 0.16 * Math.sin(q * Math.PI); py += cs * 0.06 * Math.sin(q * Math.PI); }
  if (sel && sel.r === r && sel.c === c && phase === 'idle') { const b = Math.sin(t * 9); sx *= 1.08 + b * 0.03; sy *= 1.08 - b * 0.03; py -= cs * 0.04; }
  if (hint && ((hint.a.r === r && hint.a.c === c) || (hint.b.r === r && hint.b.c === c))) rot = Math.sin(t * (hint.gentle ? 6 : 12)) * (hint.gentle ? 0.12 : 0.2);
  if (p.sp === 'star') rot += Math.sin(t * 2 + p.id) * 0.15;
  if (p.sp === 'bomb') { const b = 1 + Math.sin(t * 5 + p.id) * 0.04; sx *= b; sy *= b; }
  x.save(); x.globalAlpha = a; x.translate(px, py); if (rot) x.rotate(rot); x.scale(sx, sy);
  x.drawImage(s.c, -s.size / 2, -s.size / 2, s.size, s.size);
  x.restore();
  if (p.flash > 0) {
    const k = 1 - p.flash / 0.5;
    x.strokeStyle = `rgba(255,255,255,${1 - k})`; x.lineWidth = 4; x.beginPath(); x.arc(px, py, cs * (0.35 + k * 0.5), 0, 7); x.stroke();
  }
}
function drawEffects() {
  const cs = lay.cs;
  for (const e of effects) {
    const k = e.t / 0.55, a = 1 - k;
    if (e.type === 'beam') {
      x.save(); x.globalAlpha = a;
      const w = cs * (0.85 - k * 0.5);
      const gr = e.h ? x.createLinearGradient(0, cellY(e.i) - w / 2, 0, cellY(e.i) + w / 2) : x.createLinearGradient(cellX(e.i) - w / 2, 0, cellX(e.i) + w / 2, 0);
      gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(0.5, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = gr;
      if (e.h) x.fillRect(lay.bx, cellY(e.i) - w / 2, lay.B, w); else x.fillRect(cellX(e.i) - w / 2, lay.by, w, lay.B);
      x.fillStyle = e.col; x.globalAlpha = a * 0.5;
      if (e.h) x.fillRect(lay.bx, cellY(e.i) - 3, lay.B, 6); else x.fillRect(cellX(e.i) - 3, lay.by, 6, lay.B);
      x.restore();
    } else if (e.type === 'ring') {
      x.strokeStyle = `rgba(255,190,60,${a})`; x.lineWidth = 8 * a + 1;
      x.beginPath(); x.arc(e.x, e.y, cs * (e.big ? 6 : 1.6) * (0.3 + k), 0, 7); x.stroke();
      x.fillStyle = `rgba(255,255,255,${a * 0.5})`; x.beginPath(); x.arc(e.x, e.y, cs * (e.big ? 5 : 1.4) * (0.3 + k * 0.8), 0, 7); x.fill();
    } else if (e.type === 'zap') {
      x.strokeStyle = `rgba(255,255,255,${a})`; x.lineWidth = 4; x.lineCap = 'round';
      for (const [tx, ty] of e.to) { x.beginPath(); x.moveTo(e.x, e.y); x.lineTo(e.x + (tx - e.x) * Math.min(1, k * 3), e.y + (ty - e.y) * Math.min(1, k * 3)); x.stroke(); }
      x.strokeStyle = `rgba(255,120,200,${a * 0.6})`; x.lineWidth = 2;
      for (const [tx, ty] of e.to) { x.beginPath(); x.moveTo(e.x, e.y); x.lineTo(e.x + (tx - e.x) * Math.min(1, k * 3), e.y + (ty - e.y) * Math.min(1, k * 3)); x.stroke(); }
    }
  }
}
function drawFloats() {
  for (const f of floats) {
    let sz = Math.round(lay.cs * f.size * (f.big ? Math.min(1.25, 0.8 + (1.3 - f.life) * 2) : 1));
    x.globalAlpha = Math.min(1, f.life * 2.5);
    x.font = `900 ${sz}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    const fw = x.measureText(f.text).width; if (fw > lay.B * 0.95) { sz = Math.floor(sz * lay.B * 0.95 / fw); x.font = `900 ${sz}px ${FONT}`; }
    const fx2 = Math.max(lay.bx + x.measureText(f.text).width / 2, Math.min(lay.bx + lay.B - x.measureText(f.text).width / 2, f.x));
    x.lineWidth = Math.max(3, sz * 0.18); x.lineJoin = 'round'; x.strokeStyle = '#fff'; x.strokeText(f.text, fx2, f.y);
    x.fillStyle = f.col; x.fillText(f.text, fx2, f.y);
  }
  x.globalAlpha = 1;
}
function drawPuPu() {
  const p = lay.pu, sq = squashT > 0 ? Math.sin(squashT * 18) * 0.12 : Math.sin(t * 2.4) * 0.03;
  const look = sel ? (cellX(sel.c) - p.x) / 300 : Math.sin(t * 0.7) * 0.4;
  MG.puPu(x, p.x, p.y, p.r, idleT > 14 && state === 'play' ? 'sleep' : mood, sq, { look: Math.max(-1, Math.min(1, look)), arms: mood === 'wow' || mood === 'love' ? 'up' : true });
  if (say && lay.bubble.w > 50) {
    const b = lay.bubble; let sz = Math.min(22, Math.max(15, lay.pu.r * 0.42)) * RK();
    x.font = `800 ${sz}px ${FONT}`;
    while (sz > 11 && x.measureText(say.text).width + 26 > b.w) { sz--; x.font = `800 ${sz}px ${FONT}`; }   // long lines shrink to fit the bubble
    const w = Math.min(b.w, x.measureText(say.text).width + 26), h = sz + 18, bx = b.x, by = b.y;
    x.globalAlpha = Math.min(1, say.life * 3);

    x.beginPath(); x.moveTo(bx + 6, by + h - 12); x.lineTo(bx - 10, by + h + 4); x.lineTo(bx + 18, by + h - 2); x.stroke();
    x.fillStyle = '#fff'; x.fillRect(bx + 4, by + h - 13, 16, 10);

}
function drawHintBtn() {
  const b = lay.hint, busy = phase !== 'idle' || state !== 'play', press = hint && !hint.gentle;
  x.fillStyle = busy ? '#e6d3a0' : '#e0a400'; x.beginPath(); x.roundRect(b.x, b.y + 5, b.w, b.h, 20); x.fill();
  const g = x.createLinearGradient(0, b.y, 0, b.y + b.h); g.addColorStop(0, busy ? '#fff3cc' : '#fff1a8'); g.addColorStop(1, busy ? '#f2e0b0' : '#ffcf3a');
  x.fillStyle = g; x.strokeStyle = busy ? '#d9c08a' : '#c98a00'; x.lineWidth = 3;
  x.beginPath(); x.roundRect(b.x, b.y + (press ? 3 : 0), b.w, b.h, 20); x.fill(); x.stroke();
  const sz = Math.min(30 * RK(), b.h * 0.42, b.w / 4.2);
  x.fillStyle = '#000'; x.font = `${sz}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('💡', b.x + b.w / 2 - sz * 1.15, b.y + b.h / 2 + (press ? 3 : 0));
  txt('提示', b.x + b.w / 2 + sz * 0.55, b.y + b.h / 2 + (press ? 3 : 0) + 1, sz, busy ? '#a89770' : '#6a4300', 'center', 900);

function backdrop(x) {
  const W = cv.lw, H = cv.lh;
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ffe6f1'); g.addColorStop(1, '#e2f2ff');

// the background + empty board + jelly only change now and then, so they live on their own canvas
let bgLayer = null, bgDirty = true;
function draw() {

  if (bgLayer.width !== cv.width || bgLayer.height !== cv.height) { bgLayer.width = cv.width; bgLayer.height = cv.height; bgDirty = true; }
  if (bgDirty) { const g = bgLayer.getContext('2d'); g.setTransform(px, 0, 0, px, 0, 0); backdrop(g); drawBoard(g); bgDirty = false; }

// ---------- menu ----------
function menu() {
  state = 'menu'; sel = null; hint = null;
  MG.choose({
    id: 'match3', title: '噗噗消消樂',
    html: `<p>把<b>相鄰的兩顆糖果</b>交換，三個以上一樣的連成一排就會消掉！可以點一顆再點旁邊那顆，也可以用手指直接往旁邊滑。</p>` +
      `<p>一次消 4 個變<b>條紋糖</b>（消掉一整排），排成 L 或 T 變<b>包裝糖炸彈</b>，一次消 5 個變<b>🌈 彩虹星星</b>（跟誰換就消掉那個顏色全部）！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '步數不限，達成目標就過關' }, { id: 'moves', label: '🎯 步數挑戰', sub: '步數有限，用完可以再試' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n} ${goalIcon(LEVELS[n - 1])}` },
    keys: '點一下再點旁邊，或用手指滑　<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 移動、<kbd>Enter</kbd> 選取、<kbd>H</kbd> 提示',
    playing: () => state === 'play',
    start: (m, lv) => { mode = m; startLevel(lv); },
  });
}
setupLevel(1); menu();

// small hook for automated tests (read-only snapshot of the board)
window.M3T = {
  get state() { return state; }, get phase() { return phase; }, get level() { return level; }, get mode() { return mode; },
  get moves() { return moves; }, get score() { return score; }, get combo() { return combo; }, get busy() { return phase !== 'idle' || !!tween; },
  board: () => grid.map(row => row.map(p => p ? [p.k, p.sp] : null)),
  jelly: () => jel.map(row => row.slice()), hint: () => hint && { a: hint.a, b: hint.b, gentle: hint.gentle }, sel: () => sel,
  goalDone, findMoves: () => findMoves().length, get say() { return say && say.text; }, floats: () => floats.map(f => f.text),
  // client (CSS px) coords of a cell centre / the hint button

};
function toClient(lx, ly) {
  const rc = cv.getBoundingClientRect(), B = 3;
  return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh };

MG.loop(dt => {
  if (state === 'play' || state === 'over') update(dt); else { t += dt; MG.fx.step(dt); }
  draw();
});
