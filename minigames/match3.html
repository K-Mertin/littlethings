// ---------- pieces: every colour also has its own shape ----------

];
// ---------- levels ----------
// n = board size, k = how many kinds, mv = moves in 🎯 步數挑戰
// goal: s = reach points | c = [[kind, count], ...] clear that many | j = rows of the pink jelly map ('#' = jelly)
const LEVELS = [
  { n: 7, k: 4, mv: 15, s: 1000 },

  { n: 7, k: 4, mv: 14, j: ['.......', '.##.##.', '.#####.', '.#####.', '..###..', '...#...', '.......'] },

  { n: 8, k: 5, mv: 28, j: ['........', '........', '.######.', '........', '........', '.######.', '........', '........'] },
  { n: 8, k: 5, mv: 28, s: 2000 },
  { n: 8, k: 5, mv: 22, c: [[2, 18], [4, 18]] },
  { n: 8, k: 5, mv: 34, j: ['........', '.#....#.', '..#..#..', '...##...', '...##...', '..#..#..', '.#....#.', '........'] },
  { n: 8, k: 6, mv: 40, s: 2000 },
  { n: 8, k: 6, mv: 32, c: [[0, 14], [1, 14], [5, 14]] },
  { n: 8, k: 6, mv: 40, j: ['........', '...##...', '...##...', '.######.', '.######.', '...##...', '...##...', '........'] },
  { n: 8, k: 6, mv: 60, j: ['........', '.##..##.', '.######.', '.######.', '.######.', '..####..', '...##...', '........'] },
  { n: 8, k: 6, mv: 58, s: 3200 },
  { n: 8, k: 6, mv: 58, j: ['........', '.######.', '.######.', '.######.', '.######.', '.######.', '.######.', '........'] },
  // ---- 16–30: new ways to play (each one is explained once by a panel the first time it shows up) ----
  // m = board map: '.' candy  '#' jelly  '@' ice (jelly under ice, 2 hits)  ' ' hole  'S' stone  'B' box (2 hits)  'C' cage with an animal  'X' chocolate
  // g = goals: 'j' jelly/ice  'f' bring f fruits down  'b' boxes  'a' animals  'x' chocolate  'c' colours  's' points;  belt = [[row, dir], ...] moves one step after every move
  { n: 7, k: 4, mv: 16, g: ['f'], f: 2 },
  { n: 7, k: 4, mv: 20, g: ['j'], m: ['.......', '.@@.@@.', '.@###@.', '.@###@.', '.@@#@@.', '...@...', '.......'] },
  { n: 8, k: 4, mv: 32, g: ['j'], m: [' ##  ## ', '########', '########', '########', '########', ' ###### ', '  ####  ', '   ##   '] },
  { n: 7, k: 5, mv: 18, g: ['b'], m: ['.......', '.......', '..BBB..', '..B.B..', '..BBB..', '.......', '.......'] },
  { n: 7, k: 5, mv: 12, g: ['a'], m: ['.......', '.C...C.', '.......', '...C...', '.......', '.C...C.', '.......'] },
  { n: 7, k: 5, mv: 30, g: ['x'], m: ['.......', '.......', '.......', '.......', '.......', 'XX...XX', 'XX...XX'] },
  { n: 7, k: 5, mv: 15, g: ['c'], c: [[0, 15], [3, 15]], belt: [[2, 1], [4, -1]] },
  { n: 8, k: 4, mv: 55, g: ['f'], f: 3, m: ['........', '........', '..S..S..', '...  ...', '...  ...', '..S..S..', '........', '........'] },
  { n: 8, k: 5, mv: 50, g: ['j'], m: ['@@@..@@@', '@B@..@B@', '@@@..@@@', '........', '........', '###..###', '#B#..#B#', '###..###'] },
  { n: 8, k: 5, mv: 32, g: ['a', 'x'], m: ['.C....C.', '........', '........', '...CC...', '........', '........', 'XX....XX', 'XXX..XXX'] },
  { n: 8, k: 5, mv: 22, g: ['j'], belt: [[1, 1], [6, -1]], m: ['........', '########', '........', '..####..', '..####..', '........', '########', '........'] },
  { n: 8, k: 5, mv: 34, g: ['c'], c: [[1, 22], [4, 22]], m: ['S......S', '........', '..S..S..', '........', '........', '..S..S..', '........', 'S......S'] },
  { n: 8, k: 5, mv: 66, g: ['f', 'j'], f: 3, fmax: 2, m: ['........', '........', '........', '........', '@@@@@@@@', '@@@@@@@@', '........', '........'] },
  { n: 8, k: 6, mv: 60, g: ['x', 'a'], m: ['..C..C..', '........', '.B....B.', '........', '........', '........', '.XX..XX.', 'XXXXXXXX'] },
  { n: 8, k: 5, mv: 66, g: ['j', 'b', 'f'], f: 2, belt: [[3, 1]], m: ['@@@@@@@@', '@B@@@@B@', '@@@@@@@@', '........', '########', '#B####B#', '########', '########'] },
];
const ANIMALS = ['🐥', '🐰', '🐱', '🐶', '🐼', '🐹'];
const goalsOf = L => L.g || (L.s ? ['s'] : L.c ? ['c'] : ['j']);
// the new ways to play a level uses (for the menu marker and the one-time intro panel)
function mechOf(L) {
  const m = (L.m || []).join(''), out = [];
  if (L.f) out.push('fruit');
  if (m.includes('@')) out.push('ice');
  if (m.includes(' ') || m.includes('S')) out.push('shape');
  if (m.includes('B')) out.push('box');
  if (m.includes('C')) out.push('cage');
  if (m.includes('X')) out.push('choc');
  if (L.belt) out.push('belt');
  return out;
}
const MECH = {
  fruit: ['🍓', '草莓送到底', '🍓 草莓送到底', '草莓不能消掉，要把它<b>下面的糖果消掉</b>，讓草莓一路掉到最下面一排，就會收進籃子裡！'],
  ice: ['🧊', '冰塊果凍', '🧊 冰塊果凍', '藍色冰塊下面藏著粉紅果凍。在冰塊上消糖果，<b>第一次敲破冰塊、第二次消掉果凍</b>。'],
  shape: ['🧩', '特別形狀', '🧩 特別形狀', '棋盤有洞洞和🪨石頭，那裡不會有糖果。糖果會<b>直接掉過洞洞和石頭</b>，繼續往下掉喔！'],
  box: ['📦', '木箱子', '📦 木箱子', '木箱子不能移動。在它<b>旁邊</b>消掉糖果就能敲它，要敲<b>兩次</b>才會壞掉。條紋糖和炸彈也打得到喔！'],
  cage: ['🐥', '救出小動物', '🐥 救出小動物', '小動物被關在籠子裡了！在籠子<b>旁邊</b>消掉糖果，籠子就會打開，小動物就自由了。'],
  choc: ['🍫', '會長大的巧克力', '🍫 會長大的巧克力', '在巧克力<b>旁邊</b>消糖果可以吃掉它。如果好幾步都沒吃到，巧克力會<b>慢慢長大</b>，要快點吃光喔！'],
  belt: ['🛝', '輸送帶', '🛝 輸送帶', '有箭頭的那一排是輸送帶，<b>每走一步，整排糖果就往箭頭方向移一格</b>。移完也可能剛好連成一排喔！'],
};
const GOALI = { s: '⭐', c: '🍬', j: '💗', f: '🍓', b: '📦', a: '🐥', x: '🍫' };
const goalIcon = L => { const me = mechOf(L); return me.length ? MECH[me[me.length - 1]][0] : GOALI[goalsOf(L)[0]]; };
const lvName = L => { const me = mechOf(L); return me.length ? me.map(k => MECH[k][1]).join('＋') : { s: '拿分數', c: '收集糖果', j: '粉紅果凍' }[goalsOf(L)[0]]; };
// the goal as numbers + emoji only (for the quick toast when a level starts)
const goalEmoji = L => '🎯 ' + goalsOf(L).map(g => g === 's' ? `${L.s} ⭐` : g === 'c' ? L.c.map(([k, n]) => `${KINDS[k].em}×${n}`).join('  ') : g === 'f' ? `🍓×${L.f}⬇️` : `${GOALI[g]}→0`).join('  ');
const goalText = L => goalsOf(L).map(g => g === 's' ? `拿到 ${L.s} 分` : g === 'c' ? '消掉 ' + L.c.map(([k, n]) => `${n} 個${KINDS[k].nm}`).join('、') : { j: '把粉紅果凍格子全部消掉', f: `把 ${L.f} 顆草莓送到最下面`, b: '把木箱子全部敲破', a: '把小動物全部救出來', x: '把巧克力全部吃光' }[g]).join('，');

let L = LEVELS[0], N = 7, grid = [], jel = [], level = 1, mode = 'relax', state = 'menu', phase = 'idle';
let score = 0, moves = 0, combo = 0, bestCombo = 0, got = [], jellyLeft = 0;
// blk[r][c]: null = open cell, or { t: 'hole' | 'stone' | 'box' | 'cage' | 'choc', hp, an, hit }
let blk = [], fruitGot = 0, turnFx = true, chocFx = true, chocCalm = 0, chocCap = 0, chocAte = false, collected = [];
let sel = null, drag = null, kc = null, hint = null, idleT = 0, t = 0;
let tween = null, popT = 0, popping = [], lastMoved = [], effects = [], floats = [];
let mood = 'happy', moodT = 0, squashT = 0, say = null, lay = null, uid = 0;
const POP = 0.26, SWAP = 0.17;
// sounds: the same one at most once per 60 ms, so big chains don't turn into noise
const snd = (() => { const last = {}; return (n, a) => { const now = performance.now(); if (now - (last[n] || 0) < 60) return; last[n] = now; MG.sfx(n, a); }; })();

// ---------- board rules ----------
const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
const kd = (r, c) => { const p = grid[r] && grid[r][c]; return p && p.sp !== 'star' && p.k >= 0 ? p.k : -1; };
const isOpen = (r, c) => inB(r, c) && !blk[r][c];
const countBlk = t => blk.reduce((a, row) => a + row.filter(b => b && b.t === t).length, 0);
const fruitsOn = () => grid.reduce((a, row) => a + row.filter(p => p && p.fruit).length, 0);
// the lowest open cell of a column: a fruit that reaches it is collected
const bottomOf = c => { for (let r = N - 1; r >= 0; r--) if (!blk[r][c]) return r; return -1; };
const newFruit = (r, c) => { const p = newPiece(-1, r, c); p.fruit = true; return p; };
const newPiece = (k, r, c) => ({ k, sp: '', x: c, y: r, vy: 0, land: 0, flash: 0, popping: false, spent: false, id: ++uid });
const randKind = () => MG.randi(0, L.k - 1);

// all straight runs of 3+, joined into groups when they share a cell (so L / T shapes are one group)
function groupsNow() {
  const runs = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N;) {
    const k = kd(r, c); let e = c + 1;
    if (k >= 0) while (e < N && kd(r, e) === k) e++;
    if (k >= 0 && e - c >= 3) runs.push({ h: true, k, cells: Array.from({ length: e - c }, (_, i) => r * N + c + i) });
    c = e;
  }
  for (let c = 0; c < N; c++) for (let r = 0; r < N;) {
    const k = kd(r, c); let e = r + 1;
    if (k >= 0) while (e < N && kd(e, c) === k) e++;
    if (k >= 0 && e - r >= 3) runs.push({ h: false, k, cells: Array.from({ length: e - r }, (_, i) => (r + i) * N + c) });
    r = e;
  }
  const par = runs.map((_, i) => i), own = new Map();
  const root = i => par[i] === i ? i : (par[i] = root(par[i]));
  runs.forEach((run, i) => run.cells.forEach(key => { if (own.has(key)) par[root(i)] = root(own.get(key)); else own.set(key, i); }));
  const gs = new Map();
  runs.forEach((run, i) => {
    const rt = root(i); if (!gs.has(rt)) gs.set(rt, { runs: [], cells: new Set(), k: run.k });
    const g = gs.get(rt); g.runs.push(run); run.cells.forEach(key => g.cells.add(key));
  });
  return [...gs.values()];
}
// which special a group makes, and where it appears
function makeOf(g, moved) {
  const big = g.runs.reduce((a, b) => b.cells.length > a.cells.length ? b : a);
  const hasH = g.runs.some(q => q.h), hasV = g.runs.some(q => !q.h);
  let sp = '';
  if (big.cells.length >= 5) sp = 'star';
  else if (hasH && hasV) sp = 'bomb';
  else if (big.cells.length === 4) sp = big.h ? 'h' : 'v';
  if (!sp) return null;
  let at = moved.find(key => g.cells.has(key));
  if (at == null && sp === 'bomb') {
    const hs = new Set(g.runs.filter(q => q.h).flatMap(q => q.cells));
    at = g.runs.filter(q => !q.h).flatMap(q => q.cells).find(key => hs.has(key));
  }
  if (at == null) at = big.cells[Math.floor(big.cells.length / 2)];
  return { at, sp, k: g.k };
}
function lineLen(r, c) {
  const k = kd(r, c); if (k < 0) return 0;
  let a = 1, b = 1;
  for (let i = c - 1; i >= 0 && kd(r, i) === k; i--) a++;
  for (let i = c + 1; i < N && kd(r, i) === k; i++) a++;
  for (let i = r - 1; i >= 0 && kd(i, c) === k; i--) b++;
  for (let i = r + 1; i < N && kd(i, c) === k; i++) b++;
  return (a >= 3 ? a : 0) + (b >= 3 ? b : 0);
}
function swapGrid(a, b) { const t1 = grid[a.r][a.c]; grid[a.r][a.c] = grid[b.r][b.c]; grid[b.r][b.c] = t1; }
// every swap that does something, with a rough "how good" value for the hint
function findMoves(rich = false) {
  const out = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) for (const [dr, dc] of [[0, 1], [1, 0]]) {
    const r2 = r + dr, c2 = c + dc; if (!inB(r2, c2)) continue;
    const pa = grid[r][c], pb = grid[r2][c2]; if (!pa || !pb) continue;
    const a = { r, c }, b = { r: r2, c: c2 };
    if (pa.fruit && pb.fruit) continue;
    if ((pa.sp === 'star' || pb.sp === 'star') && !pa.fruit && !pb.fruit) { out.push({ a, b, v: 12 }); continue; }
    if (pa.sp && pb.sp) { out.push({ a, b, v: 10 }); continue; }
    swapGrid(a, b);
    let v = lineLen(r, c) + lineLen(r2, c2);
    if (v && rich) v = worth(groupsNow());
    swapGrid(a, b);
    if (v) out.push({ a, b, v });
  }
  return out;
}
// how much a set of matches helps the goal (used by the 💡 hint): jelly cells and wanted colours count extra
function worth(groups) {
  let v = 0;
  for (const g of groups) {
    v += g.cells.size + (g.cells.size >= 4 ? 3 : 0) + (g.runs.length > 1 ? 3 : 0);
    for (const key of g.cells) {
      if (jel[Math.floor(key / N)][key % N] > 0) v += 4;
      if (L.c && L.c.some(([k, n], i) => k === g.k && got[i] < n)) v += 1.5;
    }
    const near = new Set();
    for (const key of g.cells) {
      const r = Math.floor(key / N), c = key % N;
      for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const b = inB(r + dr, c + dc) && blk[r + dr][c + dc]; if (b && b.t !== 'hole' && b.t !== 'stone') near.add((r + dr) * N + c + dc); }
      // cells under a fruit: clearing them brings it down
      if (L.f) for (let rr = r - 1; rr >= 0; rr--) { const q = grid[rr][c]; if (q && q.fruit) { v += r === bottomOf(c) ? 14 : 7; break; } }
    }
    v += near.size * 3.5;
  }
  return v;
}
function genBoard() {
  for (let tries = 0; tries < 200; tries++) {
    grid = Array.from({ length: N }, () => Array(N).fill(null));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (blk[r][c]) continue;
      const bad = new Set();
      if (c >= 2 && kd(r, c - 1) === kd(r, c - 2)) bad.add(kd(r, c - 1));
      if (r >= 2 && kd(r - 1, c) === kd(r - 2, c)) bad.add(kd(r - 1, c));
      const ok = [...Array(L.k).keys()].filter(k => !bad.has(k));
      grid[r][c] = newPiece(MG.pick(ok), r, c);
    }
    if (L.f) {
      const cols = MG.shuffle([...Array(N).keys()].filter(c => c > 0 && c < N - 1).filter(c => { const top = blk.findIndex(row => !row[c]); return top >= 0 && top < bottomOf(c); }));
      cols.slice(0, Math.min(L.fmax || 1, L.f)).forEach(c => { const r = blk.findIndex(row => !row[c]); grid[r][c] = newFruit(r, c); });
    }
    if (findMoves().length >= 3) return;
  }
}

// ---------- level flow ----------
function setupLevel(n) {
  level = n; L = LEVELS[n - 1]; N = L.n;
  const map = L.m || L.j || [];
  const ch = (r, c) => (map[r] && map[r][c]) || '.';
  jel = Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => ch(r, c) === '#' ? 1 : ch(r, c) === '@' ? 2 : 0));
  const BT = { ' ': 'hole', S: 'stone', B: 'box', C: 'cage', X: 'choc' };
  blk = Array.from({ length: N }, (_, r) => Array.from({ length: N }, (_, c) => { const t = BT[ch(r, c)]; return t ? { t, hp: t === 'box' ? 2 : 1, an: t === 'cage' ? MG.pick(ANIMALS) : '', hit: 0 } : null; }));
  fruitGot = 0; turnFx = chocFx = true; chocCalm = 0; chocCap = countBlk('choc') + 3; chocAte = false; collected = [];
  jellyLeft = jel.flat().reduce((a, b) => a + b, 0);
  got = L.c ? L.c.map(() => 0) : [];
  score = 0; moves = 0; combo = 0; bestCombo = 0; sel = null; drag = null; kc = null; hint = null; idleT = 0;
  tween = null; popping = []; effects = []; floats = []; phase = 'idle'; say = null; mood = 'happy';
  genBoard(); MG.fx.clear(); layout(); sprites.clear(); bgDirty = true;
}
function startLevel(n) {
  setupLevel(n); state = 'play'; MG.hide(); hud();
  talk('Go! 🚀', 2);
  // landscape shows the goal big in the left column; a toast there would cover the top of the board
  if (land) talk('🎯 Goal 👈', 2.6); else MG.toast(goalEmoji(L), 2600);
  // the first time a new way to play shows up, explain it once
  const fresh = mechOf(L).filter(k => !MG.store.get('match3.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('match3.seen.' + k, true));
    MG.panel({ title: fresh.map(k => MECH[k][2]).join('＋'), html: fresh.map(k => `<p>${MECH[k][3]}</p>`).join('') + `<p>🎯 ${goalText(L)}</p>`, buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function hud() {
  MG.stat('level', `第 ${level} 關`);
  MG.stat('moves', mode === 'moves' ? `剩 ${Math.max(0, L.mv - moves)} 步` : `${moves} 步`);
}
function goalDone() { return goalsOf(L).every(goalOk); }
function goalOk(g) {
  if (g === 's') return score >= L.s;
  if (g === 'c') return L.c.every(([, n], i) => got[i] >= n);
  if (g === 'j') return jellyLeft <= 0;
  if (g === 'f') return fruitGot >= L.f;
  return countBlk({ b: 'box', a: 'cage', x: 'choc' }[g]) === 0;
}
function starsNow() { const f = moves / L.mv; return f <= 0.7 ? 3 : f <= 1 ? 2 : 1; }
function win() {
  state = 'over'; sel = null; hint = null; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  mood = 'love'; moodT = 3; squashT = 0.5; talk(MG.WORDS.clear, 3);
  const rec = MG.record('match3', level), st = starsNow();
  MG.fx.burst(lay.bx + lay.B / 2, lay.by + lay.B / 2, { n: 60, colors: KINDS.map(k => k.pal[1]).concat('#fff'), shape: 'star', speed: 340, up: 180, size: 7, life: 1.2 });
  setTimeout(() => MG.panel({
    title: `第 ${level} 關完成！`,

  // client (CSS px) coords of a cell centre / the hint button
  at(r, c) { return toClient(cellX(c), cellY(r)); }, hintBtn() { return toClient(lay.hint.x + lay.hint.w / 2, lay.hint.y + lay.hint.h / 2); },
  get count() { return LEVELS.length; }, get fruitGot() { return fruitGot; }, get jellyLeft() { return jellyLeft; },
  blocks: () => blk.map(row => row.map(b => b ? b.t + (b.t === 'box' ? b.hp : '') : '')), progress: () => progressText(), mech: n => mechOf(LEVELS[n - 1]),
  start(n, m = 'relax') { mode = m; startLevel(n); MG.hide(); },
  swap(a, b) { return trySwap(a, b); },
  // test only: play by always taking the 💡 hint move, stepping the game synchronously; returns the moves it needed (or -1)
  sim(max = 400) {
    for (let i = 0; i < 400000 && state === 'play'; i++) {
      if (phase === 'idle' && !tween) { if (moves >= max) return -1; const h = pickHint(); if (h) trySwap(h.a, h.b); }
      update(1 / 30);
    }
    return state === 'over' && goalDone() ? moves : -1;
  },
};
function toClient(lx, ly) {
  const rc = cv.getBoundingClientRect(), B = 3;
  return { x: rc.left + B + lx * (rc.width - 2 * B) / cv.lw, y: rc.top + B + ly * (rc.height - 2 * B) / cv.lh };
}

MG.loop(dt => {
  if (state === 'play' || state === 'over') update(dt); else { t += dt; MG.fx.step(dt); }
  draw();
});
</script>
