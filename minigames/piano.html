function update(dt) {
  t += dt; clock += dt; frameN++;
  for (const [m, v] of lit) { if (v - dt <= 0) lit.delete(m); else lit.set(m, v - dt); }
  for (const [m, v] of flash) { if (v - dt <= 0) flash.delete(m); else flash.set(m, v - dt); }
  for (const f of floats) { f.life -= dt; f.x += f.vx * dt + Math.sin(t * 3 + f.ph) * 14 * dt; f.y += f.vy * dt; }
  if (floats.length && floats[0].life <= 0) floats = floats.filter(f => f.life > 0);
  hopT += dt; pressT = Math.max(0, pressT - dt); moodT = Math.max(0, moodT - dt);
  if (say) { say.life -= dt; if (say.life <= 0) say = null; }
  for (const [m, v] of capFlash) { const nv = v - dt * 4; if (nv <= 0) capFlash.delete(m); else capFlash.set(m, nv); }
  if (state === 'play' && mode === 'learn') updateLearn(dt);
  if (pb) updatePb();
  MG.fx.step(dt);

    const dig = +mt[2], d = (1 / Math.pow(2, mt[4].length)) * (mt[5] ? 1.5 : 1);
    if (dig === 0) { if (out.length) out[out.length - 1].d += d; continue; }
    const oct = (mt[3].match(/['’ˊ]/g) || []).length - (mt[3].match(/,/g) || []).length;
    const acc = mt[1] === '#' || mt[1] === '♯' ? 1 : mt[1] ? -1 : 0;
    out.push({ m: base + DEG[dig - 1] + 12 * oct + acc, d });
  }
  return fitRange(out);
}
// a recording from 自由彈 → notes with beats (quantised to half beats at the chosen speed)
function fromRecording(bpm) {
  const r = (rec.notes || []).filter((x, i, a) => i === 0 || x[0] - a[i - 1][0] > 0.06);   // chords: keep the first note
  return fitRange(r.map((x, i) => {
    const gap = i + 1 < r.length ? r[i + 1][0] - x[0] : 0.6 * 2;
    return { m: x[1], d: Math.max(0.5, Math.min(4, Math.round(gap * bpm / 60 * 2) / 2)) };
  }));
}

}

function myRead() {
  const txt = (document.getElementById('myTxt') || {}).value || '', key = (document.getElementById('myKey') || {}).value || 'C', bpm = +((document.getElementById('mySpd') || {}).value || 100);
  const notes = myEditor.recNotes && !txt.trim() ? myEditor.recNotes : parseJianpu(txt, key);
  if (notes.length < 3) { MG.sfx('miss'); myEditor.msg('至少要 3 個音喔 🎵'); return null; }

}
function myUseRec() {
  const bpm = +((document.getElementById('mySpd') || {}).value || 100);
  const notes = fromRecording(bpm);
  if (notes.length < 3) { MG.sfx('miss'); myEditor.msg('還沒有錄音：先到「自由彈」按 ⏺ 彈一段 🎹'); return; }
  myEditor.recNotes = notes;
  const t = document.getElementById('myTxt'); if (t) t.value = '';
  // show the recording as 簡譜 in C so it can still be edited by hand
  const deg = { 0: '1', 2: '2', 4: '3', 5: '4', 7: '5', 9: '6', 11: '7', 1: '#1', 3: '#2', 6: '#4', 8: '#5', 10: '#6' };
  const js = notes.map(x => { const pc = x.m % 12, o = Math.floor(x.m / 12) - 5; return deg[pc] + (o > 0 ? "'".repeat(o) : ',' .repeat(-o)) + (x.d === 0.5 ? '_' : x.d === 1.5 ? '.' : '') + (x.d >= 2 ? ' -'.repeat(Math.round(x.d) - 1) : ''); }).join(' ');
  if (t) t.value = js; const k = document.getElementById('myKey'); if (k) k.value = 'C';

  MG.sfx('pop'); myEditor.msg(`拿到 ${notes.length} 個音 ✓ 可以試聽或改一改`);
}
function mySave(ed) {
  const r = myRead(); if (!r) return;

  const list = myList();
  if (!ed && list.length >= MY_MAX) { MG.sfx('miss'); myEditor.msg(`最多存 ${MY_MAX} 首，先刪掉一首 🗑️`); return; }
  const item = { id: ed ? ed.id : 'my' + Date.now().toString(36), nm, key: r.key, bpm: r.bpm, src: r.txt, n: toSongStr(r.notes) };
  const next = ed ? list.map(x => x.id === ed.id ? item : x) : list.concat(item);
  MG.store.set('piano.my', next); rebuildSongs();
  const idx = SONGS.findIndex(s => s.id === item.id);
  MG.store.set('piano.pickMode', 'learn'); MG.store.set('piano.pickLevel', idx + 1);
  clearTimeout(myPrevT); MG.sfx('yay'); MG.toast('Saved! 🎼', 1400);
  mode = 'learn'; MG.hide(); menu();
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('#myOpen, [data-my]'); if (!b) return;
