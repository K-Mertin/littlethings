const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);

// =====================================================================
// sounds: heartbeat, a-choo, honk, drip, gulp, scrub, siren, x-ray beep, water…
// =====================================================================
let AC = null;
const isMuted = () => !!MG.store.get('muted', false);
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
addEventListener('pointerdown', () => actx(), true);
function tn(f0, f1, dur, type = 'sine', vol = 0.1, delay = 0) {
  const a = AC; if (!a || isMuted()) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
let NB = null;
function nz(dur, f0, f1, vol = 0.06, delay = 0, q = 1.2, type = 'bandpass') {
  const a = AC; if (!a || isMuted()) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = NB; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);

}

  hic: () => { tn(520, 980, 0.08, 'sine', 0.14); nz(0.06, 1800, 2400, 0.04, 0, 2); },

  tweet: () => { for (let i = 0; i < 3; i++) tn(2600, 3600, 0.07, 'sine', 0.06, i * 0.1); },
  blub: () => { tn(300, 700, 0.09, 'sine', 0.12); tn(360, 820, 0.08, 'sine', 0.08, 0.12); },

const sndT = {};
function snd(n, gap = 60) { const q = performance.now(); if (q - (sndT[n] || 0) < gap) return; sndT[n] = q; actx(); if (SND[n]) SND[n](); }

function rr(x0, y0, w, h, r) { x.beginPath(); x.roundRect(x0, y0, w, h, r); }
