<script>
'use strict';
MG.init({ id: 'doctor', title: '噗噗小醫生', stats: ['level', 'info'] });
const cv = document.getElementById('cv');
let x = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k * k * (3 - 2 * k);

// =====================================================================
// sounds: heartbeat, a-choo, honk, drip, gulp, scrub, siren, x-ray beep, water…
// =====================================================================
let AC = null;
const isMuted = () => !!MG.store.get('muted', false);
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
addEventListener('pointerdown', () => actx(), true);
function tn(f0, f1, dur, type = 'sine', vol = 0.1, delay = 0) {
  const a = AC; if (!a || isMuted()) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
let NB = null;
function nz(dur, f0, f1, vol = 0.06, delay = 0, q = 1.2, type = 'bandpass') {
  const a = AC; if (!a || isMuted()) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = NB; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.05, dur * 0.3)); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t0); s.stop(t0 + dur + 0.03);
}
const SND = {
  heart: () => { tn(95, 60, 0.12, 'sine', 0.3); tn(85, 55, 0.12, 'sine', 0.24, 0.17); },
  achoo: () => { nz(0.35, 600, 1400, 0.05, 0, 1); nz(0.28, 3000, 900, 0.18, 0.38, 0.8); tn(520, 300, 0.2, 'triangle', 0.06, 0.38); },
  honk: () => { nz(0.35, 500, 300, 0.12, 0, 2); tn(180, 150, 0.3, 'sawtooth', 0.05); },
  drip: () => { tn(1400, 2400, 0.08, 'sine', 0.12); tn(900, 700, 0.1, 'sine', 0.06, 0.05); },
  gulp: () => { tn(420, 160, 0.14, 'sine', 0.16); tn(360, 140, 0.14, 'sine', 0.12, 0.2); },
  scrub: () => nz(0.12, 2600 + Math.random() * 1500, 4200, 0.05, 0, 1.5),
  rub: () => nz(0.14, 800, 1300, 0.05, 0, 1.2),
  siren: () => { for (let i = 0; i < 4; i++) { tn(740, 740, 0.22, 'triangle', 0.06, i * 0.46); tn(560, 560, 0.22, 'triangle', 0.06, i * 0.46 + 0.23); } },
  beep: () => tn(1320, 1320, 0.07, 'square', 0.035),
  water: () => nz(0.5, 2500, 5200, 0.05, 0, 0.6, 'highpass'),
  pull: () => { tn(300, 900, 0.18, 'sine', 0.12); },
  gurgle: () => { for (let i = 0; i < 4; i++) tn(160 + Math.random() * 120, 90, 0.1, 'sine', 0.12, i * 0.09); },
  ring: () => { for (let i = 0; i < 6; i++) tn(1500, 1500, 0.05, 'square', 0.03, i * 0.09); },
  giggle: () => { [700, 820, 700, 880].forEach((f, i) => tn(f, f * 1.1, 0.07, 'sine', 0.09, i * 0.08)); },
  frost: () => { for (let i = 0; i < 3; i++) tn(2400 + Math.random() * 1600, 3200, 0.05, 'sine', 0.025, i * 0.04); },
  dance: () => { const N = [523, 659, 784, 659, 880, 784, 1046]; N.forEach((f, i) => { tn(f, f, 0.16, 'triangle', 0.06, i * 0.15); tn(f / 2, f / 2, 0.12, 'sine', 0.05, i * 0.15); }); },
};
const sndT = {};
function snd(n, gap = 60) { const q = performance.now(); if (q - (sndT[n] || 0) < gap) return; sndT[n] = q; actx(); if (SND[n]) SND[n](); }
function mgs(n, a, gap = 60) { const q = performance.now(), k = 'mg.' + n; if (q - (sndT[k] || 0) < gap) return; sndT[k] = q; MG.sfx(n, a); }

// =====================================================================
// tools: each one is drawn with its working point ("tip") at 0,0 and its body going up (−y), then turned by ang
// =====================================================================
const TOOLS = {
  thermo: { nm: '體溫計', len: 2.2, ang: -0.6 },
  stetho: { nm: '聽診器', len: 2.2, ang: -0.35 },
  bandage: { nm: 'OK 繃', len: 0, ang: -0.5 },
  tweezers: { nm: '小鑷子', len: 2.1, ang: -0.5 },
  ice: { nm: '冰袋', len: 0, ang: -0.15 },
  drops: { nm: '眼藥水', len: 2.0, ang: 0.15 },
  brush: { nm: '牙刷', len: 2.4, ang: -0.9 },
  magnifier: { nm: '放大鏡', len: -1.1, ang: 0.65 },
  spoon: { nm: '藥水', len: 2.2, ang: -0.55 },
  tissue: { nm: '衛生紙', len: 0, ang: -0.1 },
  xray: { nm: 'X 光', len: 0, ang: 0 },
  soap: { nm: '泡泡海綿', len: 0, ang: -0.15 },
  shower: { nm: '蓮蓬頭', len: 2.0, ang: -0.35 },
  towel: { nm: '毛巾', len: 0, ang: -0.1 },
  cup: { nm: '漱口杯', len: 0, ang: 0 },
  comb: { nm: '梳子', len: 0, ang: -0.25 },
  hammer: { nm: '小槌子', len: 2.1, ang: -0.7 },
  treat: { nm: '小點心', len: 0, ang: -0.3 },
};
const TOOL_ORDER = ['thermo', 'stetho', 'bandage', 'tweezers', 'ice', 'drops', 'brush', 'cup', 'magnifier', 'spoon', 'tissue', 'xray', 'hammer', 'soap', 'shower', 'towel', 'comb', 'treat'];
function rr(x0, y0, w, h, r) { x.beginPath(); x.roundRect(x0, y0, w, h, r); }
function fs(fill, stroke, lw) { if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); } }
function circ(cx, cy, r) { x.beginPath(); x.arc(cx, cy, r, 0, TAU); }
function ell(cx, cy, rx, ry, a = 0) { x.beginPath(); x.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), a, 0, TAU); }
function lgr(x0, y0, x1, y1, a, b) { const g = x.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function heartPath(cx, cy, s) { x.beginPath(); x.moveTo(cx, cy + s * 0.85); x.bezierCurveTo(cx - s * 1.4, cy - s * 0.1, cx - s * 0.6, cy - s * 1.2, cx, cy - s * 0.45); x.bezierCurveTo(cx + s * 0.6, cy - s * 1.2, cx + s * 1.4, cy - s * 0.1, cx, cy + s * 0.85); }
function starPath(cx, cy, R, r) { x.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; x.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } x.closePath(); }

const DRAW = {
  thermo(s, k) {
    rr(-0.17 * s, -2.2 * s, 0.34 * s, 2.05 * s, 0.17 * s); fs(lgr(-0.17 * s, 0, 0.17 * s, 0, '#ffffff', '#dfe9f7'), '#7d8fb0', 0.07 * s);
    const lv = 0.35 + 1.25 * (k || 0);
    rr(-0.06 * s, -(0.15 + lv) * s, 0.12 * s, lv * s, 0.05 * s); fs('#ff5a6a');
    x.strokeStyle = '#9fb0cc'; x.lineWidth = 0.04 * s; for (let i = 0; i < 6; i++) { x.beginPath(); x.moveTo(0.06 * s, -(0.55 + i * 0.22) * s); x.lineTo(0.15 * s, -(0.55 + i * 0.22) * s); x.stroke(); }
    circ(0, -0.05 * s, 0.22 * s); fs('#ff5a6a', '#c0394a', 0.06 * s);
    circ(-0.07 * s, -0.12 * s, 0.06 * s); fs('rgba(255,255,255,.75)');
    rr(-0.2 * s, -2.3 * s, 0.4 * s, 0.45 * s, 0.14 * s); fs('#59b4ff', '#2f78cf', 0.06 * s);
    rr(-0.1 * s, -2.2 * s, 0.07 * s, 1.7 * s, 0.03 * s); fs('rgba(255,255,255,.8)');
  },
  stetho(s) {
    x.lineCap = 'round'; x.lineJoin = 'round';
    const tube = () => { x.beginPath(); x.moveTo(0, -0.3 * s); x.bezierCurveTo(0, -0.9 * s, 0.35 * s, -1.1 * s, 0, -1.35 * s); x.moveTo(0, -1.35 * s); x.quadraticCurveTo(-0.55 * s, -1.6 * s, -0.48 * s, -2.15 * s); x.moveTo(0, -1.35 * s); x.quadraticCurveTo(0.55 * s, -1.6 * s, 0.48 * s, -2.15 * s); };
    tube(); x.strokeStyle = '#c4407a'; x.lineWidth = 0.22 * s; x.stroke();
    tube(); x.strokeStyle = '#ff7aa8'; x.lineWidth = 0.13 * s; x.stroke();
    for (const sd of [-1, 1]) { circ(sd * 0.48 * s, -2.2 * s, 0.11 * s); fs('#ffe36b', '#a87400', 0.05 * s); }
    circ(0, 0, 0.36 * s); fs(lgr(-0.3 * s, -0.3 * s, 0.3 * s, 0.3 * s, '#ffffff', '#aebbd0'), '#6f7f99', 0.07 * s);
    circ(0, 0, 0.22 * s); fs('#e9eef6', '#93a2bb', 0.04 * s);
    circ(-0.1 * s, -0.12 * s, 0.07 * s); fs('rgba(255,255,255,.9)');
  },
  bandage(s) {
    rr(-1.05 * s, -0.38 * s, 2.1 * s, 0.76 * s, 0.38 * s); fs('#ffd7ad', '#cf9a63', 0.07 * s);
    rr(-0.36 * s, -0.27 * s, 0.72 * s, 0.54 * s, 0.1 * s); fs('#fff3e3', '#e8bd8c', 0.04 * s);
    x.fillStyle = '#e3ae78'; for (const px of [-0.75, -0.55, 0.55, 0.75]) for (const py of [-0.12, 0.12]) { circ(px * s, py * s, 0.035 * s); x.fill(); }
    heartPath(0, 0.02 * s, 0.14 * s); fs('#ff7aa0');
  },
  tweezers(s, k) {
    const sp = 0.1 + 0.18 * (1 - (k || 0));
    for (const sd of [-1, 1]) {
      x.beginPath(); x.moveTo(sd * 0.03 * s, 0); x.lineTo(sd * sp * s, -1.2 * s); x.lineTo(sd * 0.2 * s, -2.05 * s); x.lineTo(sd * 0.06 * s, -2.1 * s); x.lineTo(sd * (sp - 0.12) * s, -1.2 * s); x.lineTo(0, -0.05 * s); x.closePath();
      fs(lgr(-0.3 * s, 0, 0.3 * s, 0, '#f4f7fb', '#b9c4d6'), '#7d8aa2', 0.06 * s);
    }
    rr(-0.22 * s, -2.2 * s, 0.44 * s, 0.22 * s, 0.1 * s); fs('#ff9f43', '#c06a14', 0.05 * s);
  },
  ice(s) {
    rr(-0.26 * s, -1.0 * s, 0.52 * s, 0.36 * s, 0.1 * s); fs('#ff8fb0', '#c94f78', 0.06 * s);
    x.beginPath(); x.moveTo(-0.85 * s, -0.4 * s); x.bezierCurveTo(-0.95 * s, -0.8 * s, -0.4 * s, -0.75 * s, 0, -0.68 * s); x.bezierCurveTo(0.4 * s, -0.75 * s, 0.95 * s, -0.8 * s, 0.85 * s, -0.4 * s);
    x.bezierCurveTo(1.05 * s, 0.1 * s, 0.85 * s, 0.6 * s, 0, 0.62 * s); x.bezierCurveTo(-0.85 * s, 0.6 * s, -1.05 * s, 0.1 * s, -0.85 * s, -0.4 * s); x.closePath();
    fs(lgr(0, -0.7 * s, 0, 0.6 * s, '#d9f2ff', '#7cc6f5'), '#3f8fc8', 0.07 * s);
    for (const [cx, cy, a] of [[-0.35, 0.05, 0.3], [0.3, -0.1, -0.2], [0.05, 0.3, 0.1]]) { x.save(); x.translate(cx * s, cy * s); x.rotate(a); rr(-0.17 * s, -0.17 * s, 0.34 * s, 0.34 * s, 0.07 * s); fs('rgba(255,255,255,.7)', 'rgba(63,143,200,.5)', 0.035 * s); x.restore(); }
    x.strokeStyle = '#fff'; x.lineWidth = 0.05 * s; x.lineCap = 'round'; for (let i = 0; i < 3; i++) { const a = i * Math.PI / 3; x.beginPath(); x.moveTo(0.55 * s + Math.cos(a) * 0.14 * s, 0.25 * s + Math.sin(a) * 0.14 * s); x.lineTo(0.55 * s - Math.cos(a) * 0.14 * s, 0.25 * s - Math.sin(a) * 0.14 * s); x.stroke(); }
    ell(-0.45 * s, -0.4 * s, 0.18 * s, 0.08 * s, -0.4); fs('rgba(255,255,255,.85)');
  },
  drops(s) {
    x.beginPath(); x.moveTo(-0.05 * s, 0); x.lineTo(0.05 * s, 0); x.lineTo(0.15 * s, -0.45 * s); x.lineTo(-0.15 * s, -0.45 * s); x.closePath(); fs('#fff', '#7d8fb0', 0.05 * s);
    rr(-0.42 * s, -1.6 * s, 0.84 * s, 1.18 * s, 0.22 * s); fs(lgr(-0.4 * s, 0, 0.4 * s, 0, '#e6f7ff', '#a9dcff'), '#3f8fc8', 0.07 * s);
    rr(-0.36 * s, -1.0 * s, 0.72 * s, 0.52 * s, 0.14 * s); fs('#7fd0ff');
    rr(-0.3 * s, -1.42 * s, 0.6 * s, 0.36 * s, 0.08 * s); fs('#fff');
    ell(0, -1.24 * s, 0.16 * s, 0.1 * s); fs('#fff', '#3f8fc8', 0.04 * s); circ(0, -1.24 * s, 0.05 * s); fs('#2f78cf');
    rr(-0.3 * s, -2.0 * s, 0.6 * s, 0.44 * s, 0.14 * s); fs('#ff6f91', '#c0406a', 0.06 * s);
    rr(-0.34 * s, -1.5 * s, 0.08 * s, 0.9 * s, 0.04 * s); fs('rgba(255,255,255,.7)');
  },
  brush(s) {
    rr(-0.13 * s, -2.4 * s, 0.26 * s, 1.75 * s, 0.13 * s); fs(lgr(-0.13 * s, 0, 0.13 * s, 0, '#9be0ff', '#3d9ee8'), '#2a6fb5', 0.06 * s);
    rr(-0.17 * s, -0.8 * s, 0.34 * s, 0.85 * s, 0.14 * s); fs('#5fc4ff', '#2a6fb5', 0.06 * s);
    rr(0.15 * s, -0.75 * s, 0.26 * s, 0.72 * s, 0.05 * s); fs('#fff', '#9fb6cf', 0.04 * s);
    x.strokeStyle = '#8fd0ff'; x.lineWidth = 0.05 * s; for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(0.18 * s, -(0.65 - i * 0.17) * s); x.lineTo(0.38 * s, -(0.65 - i * 0.17) * s); x.stroke(); }
    x.beginPath(); x.moveTo(0.4 * s, -0.7 * s); x.bezierCurveTo(0.65 * s, -0.75 * s, 0.6 * s, -0.4 * s, 0.48 * s, -0.35 * s); x.bezierCurveTo(0.62 * s, -0.25 * s, 0.55 * s, -0.05 * s, 0.4 * s, -0.08 * s); fs('#c9f3ff', '#6cc0e8', 0.04 * s);
    rr(-0.09 * s, -2.25 * s, 0.06 * s, 1.4 * s, 0.03 * s); fs('rgba(255,255,255,.7)');
  },
  magnifier(s) {
    x.lineCap = 'round';
    rr(-0.15 * s, 0.6 * s, 0.3 * s, 1.15 * s, 0.15 * s); fs(lgr(-0.15 * s, 0, 0.15 * s, 0, '#c98a52', '#8b5a2b'), '#5e3a1a', 0.06 * s);
    circ(0, 0, 0.66 * s); x.strokeStyle = '#b07510'; x.lineWidth = 0.24 * s; x.stroke(); x.strokeStyle = '#ffc24a'; x.lineWidth = 0.15 * s; x.stroke();
    circ(0, 0, 0.58 * s); fs('rgba(215,240,255,.35)');
    x.beginPath(); x.arc(0, 0, 0.42 * s, Math.PI * 1.05, Math.PI * 1.45); x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = 0.09 * s; x.stroke();
  },
  spoon(s, k) {
    rr(-0.08 * s, -2.2 * s, 0.16 * s, 1.65 * s, 0.08 * s); fs(lgr(-0.08 * s, 0, 0.08 * s, 0, '#ffffff', '#b9c4d6'), '#7d8aa2', 0.05 * s);
    circ(0, -2.2 * s, 0.13 * s); fs('#ff9fc0', '#c94f78', 0.05 * s);
    ell(0, -0.22 * s, 0.36 * s, 0.44 * s); fs(lgr(-0.3 * s, 0, 0.3 * s, 0, '#ffffff', '#b9c4d6'), '#7d8aa2', 0.06 * s);
    if (!(k >= 1)) { ell(0, -0.2 * s, 0.26 * s, 0.32 * s); fs('#ff6fa8'); ell(-0.08 * s, -0.3 * s, 0.08 * s, 0.05 * s, -0.5); fs('rgba(255,255,255,.8)'); }
  },
  tissue(s) {
    x.beginPath(); x.moveTo(-0.8 * s, -0.6 * s); x.quadraticCurveTo(-0.3 * s, -0.85 * s, 0, -0.62 * s); x.quadraticCurveTo(0.35 * s, -0.4 * s, 0.82 * s, -0.66 * s);
    x.quadraticCurveTo(0.65 * s, 0, 0.85 * s, 0.6 * s); x.quadraticCurveTo(0.3 * s, 0.75 * s, 0, 0.6 * s); x.quadraticCurveTo(-0.4 * s, 0.45 * s, -0.82 * s, 0.68 * s); x.quadraticCurveTo(-0.62 * s, 0, -0.8 * s, -0.6 * s); x.closePath();
    fs(lgr(-0.8 * s, -0.6 * s, 0.8 * s, 0.6 * s, '#ffffff', '#dcecfb'), '#7f9cc6', 0.08 * s);
    x.strokeStyle = 'rgba(127,156,198,.6)'; x.lineWidth = 0.05 * s; x.beginPath(); x.moveTo(-0.1 * s, -0.55 * s); x.quadraticCurveTo(0.1 * s, 0, -0.05 * s, 0.55 * s); x.stroke();
    heartPath(0.42 * s, 0.25 * s, 0.13 * s); fs('#bfe3ff');
  },
  xray(s) {
    rr(-1.05 * s, -0.85 * s, 2.1 * s, 1.7 * s, 0.25 * s); fs('#33466f', '#1c2a4a', 0.1 * s);
    rr(-0.88 * s, -0.68 * s, 1.76 * s, 1.36 * s, 0.12 * s); fs(lgr(0, -0.7 * s, 0, 0.7 * s, '#8ec8ff', '#3f84d6'));
    x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 0.03 * s; for (let i = -3; i <= 3; i++) { x.beginPath(); x.moveTo(i * 0.25 * s, -0.68 * s); x.lineTo(i * 0.25 * s, 0.68 * s); x.stroke(); }
    // a tiny bone icon on the screen
    x.strokeStyle = '#fff'; x.lineWidth = 0.12 * s; x.lineCap = 'round'; x.beginPath(); x.moveTo(-0.3 * s, 0.2 * s); x.lineTo(0.3 * s, -0.2 * s); x.stroke();
    for (const [bx, by] of [[-0.36, 0.14], [-0.24, 0.28], [0.36, -0.14], [0.24, -0.28]]) { circ(bx * s, by * s, 0.08 * s); fs('#fff'); }
    circ(0.82 * s, -0.95 * s, 0.1 * s); fs('#7cff9a', '#2a8a48', 0.04 * s);
    rr(-0.95 * s, -0.78 * s, 0.6 * s, 0.1 * s, 0.05 * s); fs('rgba(255,255,255,.35)');
  },
  soap(s) {
    rr(-0.85 * s, -0.5 * s, 1.7 * s, 1.05 * s, 0.35 * s); fs(lgr(0, -0.5 * s, 0, 0.55 * s, '#fff1a0', '#ffcf3a'), '#c99a10', 0.07 * s);
    x.fillStyle = 'rgba(200,150,20,.35)'; for (const [hx, hy, hr] of [[-0.45, 0.1, 0.09], [0.1, 0.25, 0.07], [0.5, 0.05, 0.1], [-0.1, -0.05, 0.06]]) { circ(hx * s, hy * s, hr * s); x.fill(); }
    for (const [bx, by, br] of [[-0.4, -0.6, 0.22], [0.05, -0.72, 0.28], [0.48, -0.55, 0.2], [0.75, -0.85, 0.12]]) { circ(bx * s, by * s, br * s); fs('rgba(255,255,255,.85)', '#9fd0f0', 0.04 * s); circ((bx - br * 0.35) * s, (by - br * 0.35) * s, br * 0.25 * s); fs('#fff'); }

function setupHouses() {

let dragId = null;

  // tapping the patient: a little giggle

function update(dt) {
  t += dt; phaseT += dt; MG.fx.step(dt);
  for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  if (heroT > 0) { heroT -= dt; if (heroT <= 0) heroMood = 'happy'; }
  if (state !== 'play') return;
  if (hintA) { hintA.t += dt; if (hintA.t > 3.2) hintA = null; }
  if (phase === 'call') { ambT += dt; for (const h of houses) h.wave = Math.max(0, h.wave - dt); if (Math.floor(ambT / 3) !== Math.floor((ambT - dt) / 3)) snd('ring'); return; }

  if (!pat) return;
  pat.giggle = Math.max(0, pat.giggle - dt); pat.cheer = Math.max(0, pat.cheer - dt * 1.4); pat.kick = Math.max(0, pat.kick - dt * 2.2);

  if (phase === 'enter') {
    const k = Math.min(1, phaseT / 0.7); pat.ox = -S.w * 0.7 * (1 - ease(k));
    if (k >= 1) { pat.ox = 0; phase = 'treat'; phaseT = 0; mgs('boing'); hud(); }
    return;
  }
  if (phase === 'leave') {
    const k = Math.min(1, phaseT / 0.7); pat.ox = S.w * 0.8 * ease(k);
    if (k >= 1) { pi++; if (LV.ty === 'free') pi = pats.length - 1; pat = pats[pi]; toys = []; enterPatient(); hud(); }
    return;
  }
  if (phase === 'dance') { if (phaseT > 2.4) { pat.dance = 0; afterDance(); } return; }
  // dentist: zoom into the mouth once the patient is on the bed, back out when done
  if (LV.ty === 'dentist') { const want = pat.probs.every(p => p.cured) ? 0 : 1; pat.close = clamp((pat.close || 0) + (want ? dt : -dt) * 2.2, 0, 1); }
  // sneezing
  const sneezy = pat.probs.some(p => p.ty === 'sneeze' && !p.cured);
  if (sneezy) { pat.sneezeT -= dt; if (pat.sneezeT <= 0) { pat.sneezeA = 1; pat.sneezeT = 3.6 + Math.random(); snd('achoo'); later(() => { const q = spotPos('nose'); MG.fx.burst(q.x, q.y + 6, { n: 12, colors: ['#ffffff', '#dff1ff'], speed: 120, up: -20, size: 7, grav: -40, life: 0.8, angle: Math.PI / 2, spread: 1.6 }); say('Achoo! 🤧', q.x + P.R * 0.6, q.y - P.R * 0.2, '#6f8fb8'); }, 380); } }
  pat.sneezeA = Math.max(0, pat.sneezeA - dt * 1.3);
  for (const pr of pat.probs) if (pr.fly) { for (const b of pr.fly) { b.t += dt; b.x += b.vx * dt; b.y -= 120 * dt; } pr.fly = pr.fly.filter(b => b.t < 1.6); }
  // toys bouncing out of a tummy
  for (const ty of toys) if (!ty.rest) { ty.vy += P.R * 9 * dt; ty.x += ty.vx * dt; ty.y += ty.vy * dt; ty.rot += dt * 6; const fl = bedTop + P.R * 0.05; if (ty.y > fl) { ty.y = fl; ty.vy *= -0.4; ty.vx *= 0.6; if (Math.abs(ty.vy) < P.R * 0.6) { ty.rest = true; ty.rot = 0; } else mgs('boing', 0, 200); } ty.x = clamp(ty.x, S.x + P.R * 0.4, S.x + S.w - P.R * 0.4); }
  // the tool in the hand
  if (drag) {
    const tx = drag.x, ty = drag.y - drag.off, T = findTarget(drag.id, tx, ty);
    if (T && (!drag.tgt || drag.tgt.sp !== T.sp)) { drag.tgt = T; drag.rub = 0; }
    if (!T) drag.tgt = null;
    xrayLook = drag.id === 'xray' && onPatient(tx, ty) ? Math.min(1, xrayLook + dt * 4) : Math.max(0, xrayLook - dt * 4);
    if (drag.tgt) {
      const { pr, sp } = drag.tgt, st = pr.d.steps[pr.si];

      if (st.act === 'tap') { sp.hit += dt; if (sp.hit > 0.18) { drag.tgt = null; completeSpot(pr, sp); } }
      else if (st.act === 'hold') {
        sp.prog += dt / (st.need || 1);

      } else {

      short: n => `${n}${MK[LEVELS[n - 1].ty] || ''}${done.has(n) ? '<small>✓</small>' : ''}` },
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}

// behind the start panel: a sample patient
LV = LEVELS[0]; tools = ['thermo', 'stetho', 'bandage', 'ice', 'spoon']; layout(); pat = makePatient({ a: 'bunny', p: ['scrape', 'bump'] }); pats = [pat]; pat.ox = 0; phase = 'treat';
menu();

// test hook
window.DOCT = {
  get state() { return state; }, get phase() { return phase; }, get level() { return level; }, get type() { return LV.ty; }, get pi() { return pi; }, get count() { return pats.length; }, get freeCount() { return freeCount; },
  tools: () => tools.slice(), start: n => startLevel(n), win: () => win(), levels: LEVELS.length,
  probs: () => pat ? pat.probs.map(p => ({ ty: p.ty, si: p.si, cured: p.cured, tool: p.d.steps[p.si].t, act: p.d.steps[p.si].act, spots: p.spots.map(s => ({ key: s.key, done: s.done })) })) : [],
  next: () => { const n = nextTarget(); return n && { tool: n.tool, key: n.sp.key, act: n.pr.d.steps[n.pr.si].act }; },
  // finish the next step right away (solver for tests)
  step() { const n = nextTarget(); if (!n) return false; completeSpot(n.pr, n.sp); return true; },
  // screen (client) coordinates for real-input tests
  client(lx, ly) { const r = cv.getBoundingClientRect(), B = 3; return { x: r.left + B + lx * (r.width - 2 * B) / cv.lw, y: r.top + B + ly * (r.height - 2 * B) / cv.lh }; },
  toolXY(id) { const s = slots.find(s => s.id === id); return s && this.client(s.x + s.w / 2, s.y + s.h / 2); },
  spotXY(key) { const q = spotPos(key); return this.client(q.x, q.y); },
  houseXY(i) { const h = houses[i ?? ambTarget]; return this.client(h.x, h.y); }, get ambTarget() { return ambTarget; },
  get dragOff() { return drag ? drag.off : null; }, get R() { return P.R; }, scale() { const r = cv.getBoundingClientRect(); return (r.width - 6) / cv.lw; },
};

MG.loop(dt => { update(dt); draw(); });
</script>
