function tn(f0, f1, dur, type = 'sine', vol = 0.1, delay = 0) {
  const a = AC; if (!a || isMuted()) return;

  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}

  const a = AC; if (!a || isMuted()) return;

  const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.25); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);

function fp(p, fill, stroke, lw) { if (fill) { x.fillStyle = fill; x.fill(p); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(p); } }

function ell(cx, cy, rx, ry, a = 0) { x.beginPath(); x.ellipse(cx, cy, Math.max(0.01, rx), Math.max(0.01, ry), a, 0, TAU); }

function starPath(cx, cy, R, r, n = 5) { x.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; x.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } x.closePath(); }
function heartPath(cx, cy, s) { x.beginPath(); x.moveTo(cx, cy + s * 0.85); x.bezierCurveTo(cx - s * 1.4, cy - s * 0.1, cx - s * 0.6, cy - s * 1.2, cx, cy - s * 0.45); x.bezierCurveTo(cx + s * 0.6, cy - s * 1.2, cx + s * 1.4, cy - s * 0.1, cx, cy + s * 0.85); x.closePath(); }
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
const SHC = new Map();
function shade(hex, k) {
  const key = hex + k; let v = SHC.get(key); if (v) return v;
  const [r, g, b] = hex2rgb(hex), m = k > 0 ? 255 : 0, a = Math.abs(k);
  v = `rgb(${Math.round(r + (m - r) * a)},${Math.round(g + (m - g) * a)},${Math.round(b + (m - b) * a)})`; SHC.set(key, v); return v;
}

  tyreS: () => car ? [...car.tyreS] : [], glass: () => car.d.glassPts.slice(), wheels: () => car.d.wheels.slice(), get bonus() { return bonusN; }, get hidden() { return car && car.hidden && { ...car.hidden, ...CWT.carXY(car.hidden.x, car.hidden.y) }; },
  slots: () => slots.map(s => ({ kind: s.kind, id: s.id })), get theme() { return theme; }, undoN: () => undoSt.length, deco: () => car ? car.deco.slice() : [], get pattern() { return car && car.pattern; },
  get tool() { return curTool(); }, get reqSpec() { return car && car.sp.req || null; },
  fingerScreen(id, cx, cy, touch = true) { const r = cv.getBoundingClientRect(), B = 3, sx = (r.width - 2 * B) / cv.lw, sy = (r.height - 2 * B) / cv.lh; const off = touch ? clamp(TOOLS[id].ds * VS * 0.95, 40, 110) : 0; return { x: cx, y: cy + off * sy }; },
  revealHidden() { if (car && car.hidden) { car.hidden.st = 1; } },
};

MG.loop(dt => { update(dt); draw(); });
</script>
