<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗的小寵物</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:linear-gradient(#ffeef6,#fff6e0)}
.mg-stage{padding:6px}
.mg-stage canvas{border-color:#e7b7cf;box-shadow:0 6px 0 #e7b7cf55}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.pt-pets{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:10px 0 2px}
.pt-card{font:inherit;border:3px solid #f0d3e0;border-radius:14px;background:#fff;padding:6px 4px 8px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:120px}
.pt-card img{width:76px;height:76px;display:block;pointer-events:none}
.pt-card b{font-size:16px;line-height:1.2}
.pt-card small{font-size:12px;color:var(--mute)}
.pt-card[aria-pressed=true]{border-color:#ff7aa8;background:#fff0f6;box-shadow:0 0 0 3px #ffd0e2}
.pt-names{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.pt-names button{font:inherit;font-size:17px;font-weight:700;min-height:50px;border:3px solid #e2cf9c;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.pt-names button[aria-pressed=true]{border-color:#ff7aa8;background:#fff0f6;box-shadow:0 0 0 3px #ffd0e2}
.pt-in{font:inherit;font-size:18px;width:100%;margin-top:10px;padding:10px 12px;border:3px solid #e2cf9c;border-radius:12px;text-align:center;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.pt-in:focus{outline:none;border-color:#ff7aa8}
.pt-prev{display:block;margin:2px auto 0;width:120px;height:120px}
.pt-head{display:flex;align-items:center;justify-content:center;gap:14px}
.pt-coin{font-size:24px;font-weight:900;color:#b77a00;background:#fff4c8;border:3px solid #f1cf6a;border-radius:999px;padding:4px 16px;white-space:nowrap}
.pt-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pt-tabs button{font:inherit;font-size:15px;font-weight:700;min-height:52px;border:3px solid #e2cf9c;border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.pt-tabs button b{font-size:22px;font-weight:400}
.pt-tabs button[aria-selected=true]{border-color:#ff7aa8;background:#ff8db5;color:#fff}
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px;text-align:center}
.pt-item{position:relative;font:inherit;border:3px solid #eedde3;border-radius:14px;background:#fff;padding:4px 2px 6px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:112px}
.pt-item img{width:64px;height:64px;display:block;pointer-events:none}
.pt-item .fd{font-size:44px;line-height:64px;height:64px}
.pt-item span{font-size:12px;line-height:1.2;white-space:nowrap}
.pt-item i{font-style:normal;font-size:13px;font-weight:900;color:#b77a00}
.pt-item i.own{color:#2e9a4c}
.pt-item[aria-pressed=true]{border-color:#ff7aa8;background:#fff0f6;box-shadow:0 0 0 3px #ffd0e2}
.pt-item.poor{opacity:.6}
.pt-item.shake{animation:ptShake .35s}
@keyframes ptShake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.pt-tip{font-size:13px!important;margin:8px 0 0!important}
</style>
</head>
<body>
<main class="mg-stage" id="stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'pet', title: '噗噗的小寵物', stats: ['coins', 'love'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), stageEl = document.getElementById('stage');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ======================================================================
// data
// ======================================================================
const KINDS = [
  { id: 'cat', nm: '小果凍貓', ic: '🐱', pal: ['#fff0f8', '#ffc2e2', '#f79acb', '#de72ad', '#a1457c'], egg: ['#ffe3f1', '#ff9fcb'], mark: '#ff6fae',
    like: ['milk', 'fish'], dislike: ['carrot'], names: ['果凍', '咪咪', '粉粉', '布丁', '喵喵', '桃桃'] },
  { id: 'bunny', nm: '圓圓兔', ic: '🐰', pal: ['#ffffff', '#f7f3ff', '#e4dafb', '#c6b6ef', '#7d68b0'], egg: ['#f6f1ff', '#c9b6f5'], mark: '#a98ee8',
    like: ['carrot', 'strawberry'], dislike: ['fish'], names: ['圓圓', '麻糬', '雪球', '跳跳', '小白', '湯圓'] },
  { id: 'puppy', nm: '棉花小狗', ic: '🐶', pal: ['#fffdf7', '#fff2da', '#f7dfb4', '#e5c08b', '#9a7448'], egg: ['#fff6e2', '#f0cf94'], mark: '#c9905a',
    like: ['cookie', 'onigiri'], dislike: ['lemon'], names: ['棉花', '豆豆', '旺旺', '餅乾', '奶茶', '球球'] },
  { id: 'dragon', nm: '泡泡龍寶寶', ic: '🐲', pal: ['#ecfff7', '#b0f2d8', '#68d8b0', '#3cb58d', '#1e7a5d'], egg: ['#e6fff4', '#8fe3c2'], mark: '#3cb58d',
    like: ['melon', 'apple'], dislike: ['carrot'], names: ['泡泡', '小龍', '嘟嘟', '青青', '阿噗', '波波'] },
  { id: 'chick', nm: '星星小雞', ic: '🐥', pal: ['#fffce6', '#fff28a', '#ffdc4e', '#f2b81e', '#a87a00'], egg: ['#fffbe6', '#ffe27a'], mark: '#ffb21f',
    like: ['corn', 'strawberry'], dislike: ['lemon'], names: ['星星', '啾啾', '小黃', '金金', '皮皮', '蛋黃'] },
];
const FOODS = {
  apple: { ic: '🍎', nm: '蘋果', v: 18, price: 0 }, banana: { ic: '🍌', nm: '香蕉', v: 18, price: 0 },
  cookie: { ic: '🍪', nm: '餅乾', v: 12, fun: 4, price: 0 }, milk: { ic: '🥛', nm: '牛奶', v: 15, energy: 5, price: 0 },
  carrot: { ic: '🥕', nm: '紅蘿蔔', v: 16, price: 8 }, strawberry: { ic: '🍓', nm: '草莓', v: 14, fun: 2, price: 8 },
  corn: { ic: '🌽', nm: '玉米', v: 16, price: 8 }, fish: { ic: '🐟', nm: '小魚', v: 20, price: 10 },
  onigiri: { ic: '🍙', nm: '飯糰', v: 22, price: 10 }, melon: { ic: '🍉', nm: '西瓜', v: 18, fun: 2, price: 12 },
  cake: { ic: '🍰', nm: '蛋糕', v: 24, fun: 6, price: 15 }, pudding: { ic: '🍮', nm: '布丁', v: 20, fun: 5, price: 15 },
  lemon: { ic: '🍋', nm: '檸檬', v: 8, price: 5 },
};
const FOOD_ORDER = Object.keys(FOODS);
const START_FOODS = ['apple', 'banana', 'cookie', 'milk'];
const WEAR = [
  { id: 'cap', slot: 'hat', nm: '小帽子', price: 12 }, { id: 'party', slot: 'hat', nm: '派對帽', price: 15 }, { id: 'flower', slot: 'hat', nm: '花圈', price: 18 },
  { id: 'beanie', slot: 'hat', nm: '毛線帽', price: 20 }, { id: 'crown', slot: 'hat', nm: '小皇冠', price: 35 },
  { id: 'bowPink', slot: 'acc', nm: '粉紅蝴蝶結', price: 10 }, { id: 'bowBlue', slot: 'acc', nm: '藍色蝴蝶結', price: 10 }, { id: 'clip', slot: 'acc', nm: '星星髮夾', price: 12 },
  { id: 'round', slot: 'glasses', nm: '圓圓眼鏡', price: 15 }, { id: 'sun', slot: 'glasses', nm: '太陽眼鏡', price: 20 }, { id: 'heart', slot: 'glasses', nm: '愛心眼鏡', price: 22 },
  { id: 'scarf', slot: 'neck', nm: '小圍巾', price: 18 }, { id: 'bell', slot: 'neck', nm: '鈴鐺項圈', price: 14 },
];
const WALLS = [{ id: 'cream', nm: '奶油色', price: 0 }, { id: 'mint', nm: '薄荷點點', price: 15 }, { id: 'stripe', nm: '粉紅條紋', price: 15 }, { id: 'sky', nm: '藍天白雲', price: 25 }, { id: 'stars', nm: '星星夜空', price: 25 }];
const FURN = [{ id: 'rug', nm: '圓地毯', price: 12 }, { id: 'plant', nm: '小盆栽', price: 12 }, { id: 'garland', nm: '彩色旗子', price: 15 }, { id: 'frame', nm: '噗噗掛畫', price: 18 }, { id: 'teddy', nm: '小熊玩偶', price: 22 }, { id: 'fishbowl', nm: '小魚缸', price: 28 }];
const SLOTS = ['hat', 'acc', 'glasses', 'neck'];
const WEAR_BY = Object.fromEntries(WEAR.map(w => [w.id, w]));
const STAGES = [{ nm: '寶寶', need: 0, sc: 0.8 }, { nm: '小朋友', need: 20, sc: 0.93 }, { nm: '大朋友', need: 60, sc: 1.05 }];
const NEEDS = [
  { k: 'food', ic: '🍎', wish: '🍎', room: 'kitchen', col: '#ff8a7a' },
  { k: 'clean', ic: '🛁', wish: '🛁', room: 'bath', col: '#6cc2ff' },
  { k: 'fun', ic: '😊', wish: '🎾', room: 'play', col: '#ffc23a' },
  { k: 'energy', ic: '💤', wish: '💤', room: 'bed', col: '#a58cff' },
];
const ROOMS = [{ id: 'kitchen', ic: '🍽️', nm: '廚房' }, { id: 'bath', ic: '🛁', nm: '浴室' }, { id: 'play', ic: '🎾', nm: '遊戲室' }, { id: 'bed', ic: '🛏️', nm: '臥室' }];
const TABS = [...ROOMS, { id: 'shop', ic: '🛍️', nm: '小商店' }];
// needs drop only while the page is open (per second), never below FLOOR; offline: small capped drop, never below OFF_FLOOR
const DECAY = { food: 0.10, clean: 0.06, fun: 0.085, energy: 0.05 };
const FLOOR = 10, OFF_RATE = 0.25, OFF_CAP = 25, OFF_FLOOR = 40, LOW = 35, MAX_PETS = 3;
const stageOf = love => love >= STAGES[2].need ? 2 : love >= STAGES[1].need ? 1 : 0;
const loveLv = love => 1 + Math.floor(love / 10);

// ======================================================================
// save (MG.store) — everything is sanitised so a broken / empty store never gives NaN
// ======================================================================
const SAVE_KEY = 'pet.save';
const ALL_ITEMS = new Set([...WEAR.map(w => w.id), ...WALLS.map(w => 'wall:' + w.id), ...FURN.map(f => 'furn:' + f.id)]);
function num(v, d, lo, hi) { v = Number(v); if (!Number.isFinite(v)) v = d; return v < lo ? lo : v > hi ? hi : v; }
function freshSave() { return { v: 1, coins: 20, owned: [], wall: 'cream', furn: [], foods: START_FOODS.slice(), cur: 0, pets: [], lastSeen: Date.now(), adopt: false }; }
function newPet(kind, petName) {
  return { kind, name: petName, love: 0, stage: 0, food: 70, clean: 90, fun: 70, energy: 85, outfit: {}, seed: (Math.random() * 1e9) | 0, born: Date.now(), care: 0 };
}
function cleanPet(p) {
  if (!p || typeof p !== 'object') return null;
  const kind = Math.round(num(p.kind, 0, 0, KINDS.length - 1));
  const q = {
    kind, name: (typeof p.name === 'string' && p.name.trim() ? p.name.trim() : KINDS[kind].names[0]).slice(0, 8),
    love: Math.round(num(p.love, 0, 0, 99999)), food: num(p.food, 70, FLOOR, 100), clean: num(p.clean, 80, FLOOR, 100),
    fun: num(p.fun, 70, FLOOR, 100), energy: num(p.energy, 80, FLOOR, 100), outfit: {}, seed: Math.round(num(p.seed, 12345, 0, 2e9)),
    born: num(p.born, Date.now(), 0, 9e15), care: Math.round(num(p.care, 0, 0, 1e9)),
  };
  q.stage = Math.round(num(p.stage, stageOf(q.love), 0, 2));
  if (q.stage > stageOf(q.love)) q.stage = stageOf(q.love);
  const o = p.outfit && typeof p.outfit === 'object' ? p.outfit : {};
  for (const s of SLOTS) if (typeof o[s] === 'string' && WEAR_BY[o[s]] && WEAR_BY[o[s]].slot === s) q.outfit[s] = o[s];
  return q;
}
function loadSave() {
  const raw = MG.store.get(SAVE_KEY, null), s = freshSave();
  if (!raw || typeof raw !== 'object') return s;
  s.coins = Math.round(num(raw.coins, 20, 0, 999999));
  s.owned = Array.isArray(raw.owned) ? [...new Set(raw.owned.filter(id => typeof id === 'string' && ALL_ITEMS.has(id)))] : [];
  s.wall = WALLS.some(w => w.id === raw.wall) && (raw.wall === 'cream' || s.owned.includes('wall:' + raw.wall)) ? raw.wall : 'cream';
  s.furn = Array.isArray(raw.furn) ? [...new Set(raw.furn.filter(id => FURN.some(f => f.id === id) && s.owned.includes('furn:' + id)))] : [];
  s.foods = Array.isArray(raw.foods) ? [...new Set([...START_FOODS, ...raw.foods.filter(f => FOODS[f])])] : START_FOODS.slice();
  s.pets = (Array.isArray(raw.pets) ? raw.pets : []).map(cleanPet).filter(Boolean).slice(0, MAX_PETS);
  for (const p of s.pets) for (const sl of SLOTS) if (p.outfit[sl] && !s.owned.includes(p.outfit[sl])) delete p.outfit[sl];
  s.cur = Math.round(num(raw.cur, 0, 0, Math.max(0, s.pets.length - 1)));
  s.lastSeen = num(raw.lastSeen, Date.now(), 0, 9e15);
  s.adopt = !!raw.adopt;
  return s;
}
// a small, capped drop for the time the page was closed — never below OFF_FLOOR, and a need that is already lower is left alone
function offlineDecay(s, now = Date.now()) {
  const mins = clamp((now - s.lastSeen) / 60000, 0, 1e7);
  if (mins < 0.5) return;
  const drop = Math.min(OFF_CAP, mins * OFF_RATE);
  for (const p of s.pets) for (const n of NEEDS) { const v = p[n.k]; if (v > OFF_FLOOR) p[n.k] = Math.max(OFF_FLOOR, v - drop * (n.k === 'clean' ? 0.8 : 1)); }
}
let SV = loadSave();
offlineDecay(SV);
let dirty = true, saveT = 0;
function persist() { SV.lastSeen = Date.now(); MG.store.set(SAVE_KEY, SV); dirty = false; saveT = 0; }
persist();
addEventListener('pagehide', persist);
document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
const pet = () => SV.pets[SV.cur] || null;
const owns = id => SV.owned.includes(id);
function maxLove() { return SV.pets.reduce((m, p) => Math.max(m, p.love), 0); }
const canAdopt = () => SV.pets.length > 0 && SV.pets.length < MAX_PETS && SV.pets.some(p => stageOf(p.love) >= 1);

// ======================================================================
// sounds — a few extra synth voices (munch, giggle, bubbles, water, lullaby) on top of MG.sfx
// ======================================================================
let AC = null, muted = MG.store.get('muted', false);
function au() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
addEventListener('pointerdown', au); addEventListener('keydown', au);
document.querySelector('.mg-bar .mute').addEventListener('click', () => setTimeout(() => { muted = MG.store.get('muted', false); }, 0));
function osc(type, f0, f1, dur, vol, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.03);
}
let NB = null;
function nz(dur, f0, f1, vol, delay = 0, q = 1.2) {
  if (!AC || muted) return;
  if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NB; f.type = 'bandpass'; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
function bellN(f, dur, vol, delay = 0) { osc('sine', f, f, dur, vol, delay); osc('sine', f * 2, f * 2, dur * 0.6, vol * 0.3, delay); }
const VOICE = {
  munch: () => { nz(0.06, 700, 300, 0.16, 0, 2); osc('triangle', 180, 120, 0.06, 0.06); },
  giggle: () => { const b = 820 + Math.random() * 200; for (let i = 0; i < 4; i++) osc('sine', b + i * 60, b * 1.5 + i * 40, 0.06, 0.07, i * 0.075); },
  squeak: () => { osc('sine', 900, 1500, 0.08, 0.08); osc('sine', 1500, 1100, 0.07, 0.06, 0.08); },
  bubble: () => osc('sine', 300 + Math.random() * 300, 900 + Math.random() * 500, 0.07, 0.07),
  pop: () => { osc('sine', 700 + Math.random() * 400, 1700, 0.05, 0.09); nz(0.04, 3000, 5000, 0.04); },
  water: () => nz(0.28, 2500, 4200, 0.05, 0, 0.6),
  rub: () => nz(0.12, 1200, 2200, 0.035, 0, 0.8),
  crack: () => { nz(0.05, 3200, 1600, 0.18, 0, 3); osc('triangle', 420, 260, 0.06, 0.08); },
  yawn: () => osc('sine', 520, 260, 0.6, 0.07),
  hop: () => osc('triangle', 300, 620, 0.09, 0.06),
  yuck: () => { osc('sawtooth', 300, 160, 0.18, 0.04); osc('sine', 500, 300, 0.2, 0.05, 0.05); },
};
const sndAt = {};
function snd(n, gap = 60) { const now = performance.now(); if (now - (sndAt[n] || 0) < gap) return; sndAt[n] = now; if (VOICE[n]) VOICE[n](); else MG.sfx(n); }
// lullaby (a simple music-box tune, looped while the pet sleeps)
const LULL = [392, 330, 392, 330, 349, 294, 349, 294, 330, 262, 330, 392, 523, 0, 392, 0, 440, 392, 349, 330, 294, 330, 262, 0];
let lullI = 0, lullT = 0;

// ======================================================================
// layout
// ======================================================================
let W = 480, H = 860, land = false;
const LY = { scene: { x: 0, y: 0, w: 1, h: 1 }, tabs: [], tray: { x: 0, y: 0, w: 1, h: 1 }, hud: null, panel: null, floorY: 0, baseR: 80, home: 0 };
let room = 'play', playMode = 'ball';
function layout() {
  W = cv.lw; H = cv.lh; land = W > H; LY.tabs = [];
  if (land) {
    const tw = 104, n = TABS.length, g = 10, th = (H - 16 - g * (n - 1)) / n;
    TABS.forEach((t, i) => LY.tabs.push({ id: t.id, x: 8, y: 8 + i * (th + g), w: tw, h: th }));
    LY.panel = { x: W - 220, y: 8, w: 212, h: H - 16 }; LY.hud = null;
    LY.scene = { x: 8 + tw + 10, y: 8, w: W - (8 + tw + 10) - 230, h: H - 16 };
  } else {
    const n = TABS.length, g = 8, tw = (W - 16 - g * (n - 1)) / n, th = 92;
    TABS.forEach((t, i) => LY.tabs.push({ id: t.id, x: 8 + i * (tw + g), y: H - th - 8, w: tw, h: th }));
    LY.hud = { x: 8, y: 8, w: W - 16, h: 112 }; LY.panel = null;
    LY.scene = { x: 8, y: 128, w: W - 16, h: H - 128 - th - 18 };
  }
  roomLayout();
}
function trayRows() { const s = LY.scene, per = Math.max(3, Math.floor((s.w - 16) / 74)); return { per, rows: Math.ceil(SV.foods.length / per) }; }
function roomLayout() {
  const s = LY.scene;
  let th = 100;
  if (room === 'kitchen') th = trayRows().rows * 74 + 18;
  LY.tray = { x: s.x + 8, y: s.y + s.h - th - 8, w: s.w - 16, h: th };
  LY.floorY = LY.tray.y - 14;
  LY.baseR = Math.max(40, Math.min(s.w * (land ? 0.2 : 0.23), (LY.floorY - s.y) * (land ? 0.27 : 0.3), 150));
  LY.home = s.x + s.w / 2;
}


// ======================================================================
// drawing helpers
// ======================================================================
function rr(g, x0, y0, w, h, r) { g.beginPath(); g.roundRect(x0, y0, w, h, r); }
function dot(g, cx, cy, r) { g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); }

  if (state === 'eggs') { const n = parseInt(k, 10); if (n >= 1 && n <= 5) { e.preventDefault(); pickEgg(n - 1); } return; }
  if (state === 'hatch') { if (k === ' ' || k === 'Enter') { e.preventDefault(); tapEgg(); } return; }
  if (state !== 'play' || !pet()) return;
  const n = parseInt(k, 10);
  if (n >= 1 && n <= 4) { e.preventDefault(); goRoom(ROOMS[n - 1].id); return; }
  if (k === '5' || k === 's' || k === 'S') { e.preventDefault(); openShop(); return; }
  if (k === 'ArrowRight' || k === 'ArrowLeft') { e.preventDefault(); const i = ROOMS.findIndex(r => r.id === room); goRoom(ROOMS[(i + (k === 'ArrowRight' ? 1 : -1) + 4) % 4].id); return; }
  if (k === 'ArrowUp' || k === 'ArrowDown') {
    if (room === 'play') { e.preventDefault(); const i = MODES.findIndex(m => m.id === playMode); playMode = MODES[(i + (k === 'ArrowDown' ? 1 : 2)) % 3].id; bubbles = []; if (playMode === 'ball') placeBallHome(); MG.sfx('click'); }
    return;
  }
  if (k === ' ' || k === 'Enter') {
    e.preventDefault();
    if (room === 'kitchen') { const list = FOOD_ORDER.filter(f => SV.foods.includes(f)); const f = list[(keyFood++) % list.length]; const m = mouthPos(); feed(f, m.x, m.y); }
    else if (room === 'bath') { const tl = suggestTool(), g = geom(); for (let i = 0; i < 40; i++) useTool(tl, g.cx + Math.sin(i * 0.7) * g.r * 0.6, g.cy + (tl === 'shower' ? -g.r * 1.1 : Math.cos(i * 0.9) * g.r * 0.4), 20); }
    else if (room === 'play') { if (playMode === 'ball') throwBall(LY.scene.x + MG.rand(0.15, 0.85) * LY.scene.w); else if (playMode === 'bubble') { const b = bubbles.find(q => !q.gone); if (b) popBubble(b); } else rubPet(160); }
    else if (room === 'bed') toggleLamp();
  }
});
let keyFood = 0;

// ======================================================================
// panels: start / menu / naming / shop / reset

const thumbCache = new Map();
function petThumb(p, size = 96, outfit = p.outfit) {
  const key = `${p.kind}|${stageOf(p.love)}|${JSON.stringify(outfit || {})}|${size}`;
  if (thumbCache.has(key)) return thumbCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = size * 2; const g = c.getContext('2d'); g.scale(2, 2);
  const r = size * 0.3; drawPet(g, p, size / 2 + (p.kind === 3 ? -size * 0.06 : 0), size * 0.9, r, { face: 'happy', outfit, time: 0.4 });
  const url = c.toDataURL(); thumbCache.set(key, url); return url;
}
function itemThumb(kind, id) {
  const key = `${kind}|${id}|${pet() ? pet().kind : 0}`; if (thumbCache.has(key)) return thumbCache.get(key);
  const c = document.createElement('canvas'), S = 64; c.width = c.height = S * 2; const g = c.getContext('2d'); g.scale(2, 2);
  if (kind === 'wear') {
    const w = WEAR_BY[id], p = pet() || { kind: 0, love: 30 }, q = { kind: p.kind, love: 30 };
    const big = w.slot === 'glasses' ? 1.6 : w.slot === 'neck' ? 1.3 : 1.15, r = S * 0.3 * big;
    g.save(); const cy = w.slot === 'hat' ? S * 0.98 + r * 0.5 : w.slot === 'glasses' ? S * 0.6 + r * 0.9 : w.slot === 'neck' ? S * 0.35 + r * 0.5 : S * 0.85 + r * 0.3;
    drawPet(g, q, S / 2, cy, r, { face: 'happy', outfit: { [w.slot]: id }, time: 0.4 }); g.restore();
  } else if (kind === 'wall') { g.save(); rr(g, 6, 6, S - 12, S - 12, 10); g.clip(); paintWall(g, id, { x: 0, y: 0, w: S, h: S }); g.restore(); g.strokeStyle = '#e2c4d0'; g.lineWidth = 2; rr(g, 6, 6, S - 12, S - 12, 10); g.stroke(); }
  else if (kind === 'furn') {
    if (id === 'garland') { paintFurn(g, 'garland', 4, 18, S - 8); }
    else if (id === 'frame') paintFurn(g, 'frame', S / 2, S / 2, 52);
    else if (id === 'rug') paintFurn(g, 'rug', S / 2, S * 0.6, 18);
    else paintFurn(g, id, S / 2, S - 6, id === 'teddy' ? 52 : id === 'fishbowl' ? 70 : 64);
  }
  const url = c.toDataURL(); thumbCache.set(key, url); return url;
}
function keysHelp() { return '拖食物餵牠、拖肥皂洗澡、點一下丟球　電腦：<kbd>1</kbd>～<kbd>4</kbd> 換房間、<kbd>S</kbd> 商店、<kbd>空白鍵</kbd> 照顧'; }

}
function adopt(kind, petName) {
  if (SV.pets.length >= MAX_PETS) { startCare(SV.cur); return; }
  SV.pets.push(newPet(kind, String(petName).slice(0, 8))); SV.cur = SV.pets.length - 1; dirty = true; persist();
  hatch = null; state = 'play'; MG.hide(); layout(); resetTransient(); room = 'play'; roomLayout(); placeBallHome(); layerKey = '';
  MG.sfx('yay'); const g = geom(); addFloat('Hello! 👋', g.cx, g.cy - g.r * 1.3, { size: 30 }); say('❤️', 2); hop(520);

      `<div class="pt-tabs" role="tablist">${[['wear', '👒', '穿戴'], ['room', '🏠', '房間'], ['food', '🍓', '食物']].map(([id, ic, nm]) => `<button type="button" role="tab" data-tab="${id}" aria-selected="${id === shopTab}"><b class="emo">${ic}</b>${nm}</button>`).join('')}</div>` +

let shopRoomBuy = false;
function shopItems() {

  const c = document.getElementById('ptPrev'); if (c) { const g = c.getContext('2d'); g.setTransform(2, 0, 0, 2, 0, 0); g.clearRect(0, 0, 120, 120); const p = pet(); drawPet(g, p, 60, 108, 34, { face: 'happy', outfit: p.outfit, time: t }); }

// hook for automated tests

  foods: () => foodSlots().map(s => s.id),
