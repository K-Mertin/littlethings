<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗蓋房子</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:linear-gradient(#e3f4ff,#fff6e0)}
.bld{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top)) 0 0 0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom))}
@media (min-aspect-ratio:1/1){.bld{grid-template-rows:none;grid-template-columns:minmax(0,1fr) clamp(250px,33%,370px)}}
.view{position:relative;min-height:0;min-width:0;overflow:hidden}
.view canvas{position:absolute;left:0;top:0;display:block;border:3px solid #fff;border-radius:14px;box-shadow:0 6px 18px rgba(50,100,150,.25);touch-action:none;background:#bfe6ff}
.side{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:7px;z-index:2}
.side button{width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.86);box-shadow:0 3px 0 rgba(40,80,120,.28);
  font-size:22px;cursor:pointer;padding:0;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;color:#3a2f22}
.side button:active{transform:scale(.9)}
.side button[aria-pressed=true]{background:#fff3c4;border-color:#ffb72b}
@media (max-height:470px){.side{gap:4px;top:6px;right:6px}.side button{width:42px;height:42px;font-size:19px}}
.pal{background:#fffdf7;border:3px solid #f1d7a6;border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden;box-shadow:0 4px 0 #f1d7a6}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;background:#fff3dc;border-bottom:2px solid #f1d7a6;flex:none}
.tabs button{position:relative;font:inherit;font-size:13px;font-weight:700;color:#7a5a2a;background:#fff;border:2px solid #f1d7a6;border-radius:14px;
  padding:3px 0 2px;cursor:pointer;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 3px 0 #f1d7a6}
.tabs button b{font-size:24px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tabs button span{line-height:1.2;white-space:nowrap}
.tabs button[aria-selected=true]{background:#ffb72b;border-color:#e09a10;color:#fff;box-shadow:0 3px 0 #c98a00;transform:translateY(-1px)}
@media (max-width:420px),(max-height:470px){.tabs{gap:3px;padding:4px}.tabs button{font-size:11px;min-height:48px;border-radius:10px}.tabs button b{font-size:20px}}
.sw{display:flex;gap:7px;padding:7px 8px 3px;overflow-x:auto;flex:none;touch-action:pan-x;scrollbar-width:none}
.sw::-webkit-scrollbar{display:none}
.sw[hidden]{display:none}
.sw button{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e6d6b8;padding:0;cursor:pointer;overflow:hidden;background:#fff}
.sw button canvas{width:100%;height:100%;display:block;pointer-events:none}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px #3a2f22;transform:scale(1.06)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));align-content:start;gap:7px;padding:8px;overflow-y:auto;min-height:0;max-height:min(150px,22vh);touch-action:pan-y}
@media (min-aspect-ratio:1/1){.items{max-height:none;flex:1}}
@media (min-width:700px) and (min-height:700px){.items{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}}
.items button{position:relative;aspect-ratio:1;border:2px solid #efe0c2;border-radius:14px;background:#fff;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.items button canvas{width:86%;height:86%;display:block;pointer-events:none}
.items button[aria-pressed=true]{border-color:#ffb72b;background:#fff6dc;box-shadow:0 0 0 3px #ffe08a}
.items button:active{transform:scale(.94)}
.acts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 8px 8px;border-top:2px dashed #f1d7a6;flex:none}
.acts button{font:inherit;font-size:12px;font-weight:700;color:#6b4a22;min-height:50px;border-radius:12px;border:2px solid #e2cf9c;background:linear-gradient(#fff,#f6ecd2);
  box-shadow:0 3px 0 #d8c08a;cursor:pointer;padding:2px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.15}
.acts button b{font-size:21px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-weight:400}
.acts button:active{transform:translateY(2px);box-shadow:0 1px 0 #d8c08a}
.acts button[aria-pressed=true]{background:#ffe9a8;border-color:#e09a10;box-shadow:0 3px 0 #c98a00}
.acts button:disabled{opacity:.4}
.acts button.warn{background:#ff7a6e;border-color:#d0483c;color:#fff;box-shadow:0 3px 0 #a8342a;animation:wob .5s ease-in-out infinite alternate}
@keyframes wob{from{transform:rotate(-3deg) scale(1.03)}to{transform:rotate(3deg) scale(1.08)}}
@media (max-height:470px){.acts button{min-height:46px}.acts button span{display:none}.sw button{width:34px;height:34px}}
.mg-pick:has(> [data-pk="sky"]){grid-template-columns:repeat(3,1fr)}
.mg-lv small{font-size:11px;color:#e09a10;margin-left:2px}
.bd-stars{font-size:40px;letter-spacing:.12em;margin:2px 0 6px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
@media (min-width:460px){.gal{grid-template-columns:repeat(4,1fr)}}
.gal button{position:relative;aspect-ratio:4/3;border:3px solid #eedcb8;border-radius:12px;background:#fffaf0;padding:0;cursor:pointer;overflow:hidden;font-size:26px;color:#d9c39a}
.gal button canvas{width:100%;height:100%;display:block;pointer-events:none}
.gal button[aria-pressed=true]{border-color:#ffb72b;box-shadow:0 0 0 3px #ffe08a}
.gal button.fresh::after{content:"NEW";position:absolute;top:3px;left:4px;background:#ff5a6e;color:#fff;font-size:10px;font-weight:900;border-radius:6px;padding:0 4px}
.gal button i{position:absolute;right:4px;bottom:2px;font-style:normal;font-size:11px;color:#8a7a62;background:rgba(255,255,255,.8);border-radius:6px;padding:0 4px}
.gal-acts{display:flex;gap:8px;justify-content:center;margin-top:8px}
.gal-acts .mg-btn{min-width:0;flex:1;font-size:16px}
.gal-acts .mg-btn.warn{background:linear-gradient(#ff8a7e,#ff5a4e);border-color:#c0392b;box-shadow:0 4px 0 #a8342a}
</style>
</head>
<body>
<div class="bld">
  <div class="view" id="view">
    <canvas id="cv" aria-label="蓋房子的空地"></canvas>
    <div class="side" id="side">
      <button type="button" id="bZoom" aria-label="放大縮小">🔍</button>
      <button type="button" id="bSky" aria-label="換天空">☀️</button>
      <button type="button" id="bShake" aria-label="搖一搖">🌪️</button>
      <button type="button" id="bSnap" aria-label="拍照">📸</button>
      <button type="button" id="bGal" aria-label="相簿">🖼️</button>
    </div>
  </div>
  <section class="pal" aria-label="積木盒">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="sw" id="sw"></div>
    <div class="items" id="items"></div>
    <div class="acts">
      <button type="button" id="tMove" aria-label="移動"><b>✋</b><span>移動</span></button>
      <button type="button" id="tErase" aria-label="擦掉"><b>🧽</b><span>擦掉</span></button>
      <button type="button" id="tUndo" aria-label="復原"><b>↶</b><span>復原</span></button>
      <button type="button" id="tRedo" aria-label="重做"><b>↷</b><span>重做</span></button>
      <button type="button" id="tClear" aria-label="全部清掉"><b>🗑️</b><span>清空</span></button>
    </div>
  </section>
</div>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'build', title: '噗噗蓋房子', stats: ['info'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), viewEl = document.getElementById('view');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const COLS = 36, ROWS = 14, HEADR = 0.8, GROUNDR = 1.05, PADLC = 0.5, SIDEW = 64, BARH = 44, BARM = 56, MAX_RES = 12, GAL_N = 12;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const idx = (c, r) => r * COLS + c;
const inGrid = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS;

// =====================================================================
// catalogue
// =====================================================================
const MATS = [
  { id: 'brick', nm: '紅磚', base: '#e5684c', dark: '#9a3a26', light: '#ff9c80', snd: 'clack' },
  { id: 'wood', nm: '木頭', base: '#d9a05a', dark: '#87582a', light: '#f5d29a', snd: 'knock' },
  { id: 'stone', nm: '石頭', base: '#aab3be', dark: '#5f6a79', light: '#e2e7ee', snd: 'thud' },
  { id: 'glass', nm: '玻璃', base: '#a8defc', dark: '#3f8fc4', light: '#eaf8ff', snd: 'ting' },
  { id: 'candy', nm: '糖果', base: '#ff8fc4', dark: '#c84a86', light: '#ffd8ec', snd: 'squish' },
  { id: 'yellow', nm: '黃色', base: '#ffd23f', dark: '#c08a00', light: '#fff1a6', snd: 'pop' },
  { id: 'orange', nm: '橘色', base: '#ff9a3c', dark: '#b55c12', light: '#ffd09c', snd: 'pop' },
  { id: 'green', nm: '綠色', base: '#5ccb62', dark: '#2a8a3a', light: '#b8f0ac', snd: 'pop' },
  { id: 'mint', nm: '薄荷', base: '#4fd6c0', dark: '#1e8f7c', light: '#b8f5ea', snd: 'pop' },
  { id: 'blue', nm: '藍色', base: '#4c9cf0', dark: '#1d5aa8', light: '#acd6ff', snd: 'pop' },
  { id: 'purple', nm: '紫色', base: '#a37cf2', dark: '#5c3cae', light: '#dccbff', snd: 'pop' },
  { id: 'white', nm: '白色', base: '#f6f2ea', dark: '#a39a88', light: '#ffffff', snd: 'pop' },
  // added later (append only: saved buildings keep their ids)
  { id: 'ice', nm: '冰塊', base: '#bfe9ff', dark: '#5aa7d6', light: '#f4fcff', snd: 'ting' },
  { id: 'leaf', nm: '葉子', base: '#57b84a', dark: '#2b7a2a', light: '#a6e48a', snd: 'soft' },
  { id: 'metal', nm: '鐵板', base: '#a9b4c2', dark: '#58636f', light: '#e9eef4', snd: 'clank' },
  { id: 'star', nm: '星星', base: '#ffd23f', dark: '#c48f00', light: '#fff6b8', snd: 'shine' },
];
const MBY = Object.fromEntries(MATS.map(m => [m.id, m]));
const ROOFC = [
  { id: 'red', base: '#ef5a4a', dark: '#9e2a1e', light: '#ff9a8a' },
  { id: 'blue', base: '#4a86e8', dark: '#1d4f9e', light: '#9cc2ff' },
  { id: 'green', base: '#4cba57', dark: '#22762e', light: '#a6e8a0' },
  { id: 'purple', base: '#9a6ff0', dark: '#55309e', light: '#d4c0ff' },
  { id: 'orange', base: '#ff9233', dark: '#a8540e', light: '#ffcc90' },
  { id: 'brown', base: '#b0744a', dark: '#6a4020', light: '#e0b088' },
  { id: 'pink', base: '#ff86bd', dark: '#b8407a', light: '#ffd0e6' },
  { id: 'grey', base: '#8e98a6', dark: '#4a5462', light: '#d0d8e2' },
];
const BSH = [{ id: '11', w: 1, h: 1 }, { id: '21', w: 2, h: 1 }, { id: '31', w: 3, h: 1 }, { id: '22', w: 2, h: 2 }, { id: '12', w: 1, h: 2 }, { id: 'sR', w: 1, h: 1, stair: 'R' }, { id: 'sL', w: 1, h: 1, stair: 'L' }];
const RSH = [{ id: 'sl', w: 1, h: 1 }, { id: 'sr', w: 1, h: 1 }, { id: 'g2', w: 2, h: 1 }, { id: 'g3', w: 3, h: 2 }, { id: 'g4', w: 4, h: 2 }, { id: 'dm', w: 2, h: 1 }, { id: 'c1', w: 1, h: 2 }, { id: 'c2', w: 2, h: 2 }, { id: 'cr', w: 1, h: 1 }];
const TABS = [
  { id: 'block', nm: '積木', ic: '🧱' }, { id: 'roof', nm: '屋頂', ic: '🏠' }, { id: 'door', nm: '門窗', ic: '🚪' },
  { id: 'deco', nm: '裝飾', ic: '🌷' }, { id: 'res', nm: '住戶', ic: '🐾' },
];

// ---------- small drawing helpers ----------
const P2 = () => new Path2D();
const LW = s => Math.max(1.1, s * 0.045);
function lgr(g, y0, y1, cols) { const gr = g.createLinearGradient(0, y0, 0, y1); cols.forEach((c, i) => gr.addColorStop(i / (cols.length - 1), c)); return gr; }
function fs(g, path, fill, stroke, lw) { if (fill) { g.fillStyle = fill; g.fill(path); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.lineJoin = 'round'; g.stroke(path); } }
function circ(g, cx, cy, r, fill, stroke, lw) { const p = P2(); p.arc(cx, cy, r, 0, Math.PI * 2); fs(g, p, fill, stroke, lw); }
function rrp(X, Y, w, h, r) { const p = P2(); p.roundRect(X, Y, w, h, r); return p; }
function line(g, x0, y0, x1, y1) { g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const glassF = (g, y0, y1, n) => lgr(g, y0, y1, n ? ['#fff8c8', '#ffd34a'] : ['#eef9ff', '#86c9ef']);
function shine(g, X, Y, w, h, n, s) { if (n) return; g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = Math.max(1, s * 0.045); g.lineCap = 'round'; line(g, X + w * 0.22, Y + h * 0.72, X + w * 0.55, Y + h * 0.25); }
function starPath(cx, cy, R, r) { const p = P2(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; i ? p.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q) : p.moveTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } p.closePath(); return p; }

// ---------- blocks ----------
function drawBlock(g, s, w, h, m, stair, n) {
  const pw = w * s, ph = h * s, i = Math.max(0.8, s * 0.03);
  const path = P2();
  if (stair) {
    const pts = stair === 'R' ? [[0, 1], [0, 2 / 3], [1 / 3, 2 / 3], [1 / 3, 1 / 3], [2 / 3, 1 / 3], [2 / 3, 0], [1, 0], [1, 1]] : [[0, 0], [1 / 3, 0], [1 / 3, 1 / 3], [2 / 3, 1 / 3], [2 / 3, 2 / 3], [1, 2 / 3], [1, 1], [0, 1]];
    pts.forEach(([a, b], k) => { const X = i + a * (pw - 2 * i), Y = i + b * (ph - 2 * i); k ? path.lineTo(X, Y) : path.moveTo(X, Y); }); path.closePath();
  } else path.roundRect(i, i, pw - 2 * i, ph - 2 * i, s * 0.1);
  g.save(); g.clip(path);
  const glass = m.id === 'glass';
  g.fillStyle = glass ? lgr(g, 0, ph, n ? ['#fff6c0', '#ffd860', '#ffc23a'] : ['#e6f7ff', '#b4e2fb', '#86c6ee']) : lgr(g, 0, ph, [m.light, m.base, m.base, m.dark]);
  if (!glass && h > 1) g.fillStyle = lgr(g, 0, ph, [m.light, m.base, m.base, m.base, m.dark]);
  g.fillRect(0, 0, pw, ph);
  const lw = Math.max(1, s * 0.045);
  if (m.id === 'brick') {
    const rh = s / 3;
    for (let row = 0; row * rh < ph; row++) {
      const off = row % 2 ? s * 0.25 : 0;
      for (let X = off - s * 0.5; X < pw; X += s * 0.5) { const v = hash(row * 7 + 3, Math.round(X / s * 4) + 11); g.fillStyle = v < 0.33 ? 'rgba(0,0,0,.07)' : v < 0.66 ? 'rgba(255,255,255,.1)' : 'rgba(0,0,0,0)'; g.fillRect(X, row * rh, s * 0.5, rh); }
    }
    g.strokeStyle = 'rgba(255,232,210,.85)'; g.lineWidth = lw;
    for (let row = 1; row * rh < ph; row++) line(g, 0, row * rh, pw, row * rh);
    for (let row = 0; row * rh < ph; row++) { const off = row % 2 ? s * 0.25 : 0; for (let X = off + s * 0.5; X < pw; X += s * 0.5) line(g, X, row * rh, X, row * rh + rh); }
  } else if (m.id === 'wood') {
    const rh = s / 3;
    g.strokeStyle = 'rgba(110,62,20,.45)'; g.lineWidth = lw;
    for (let row = 1; row * rh < ph; row++) line(g, 0, row * rh, pw, row * rh);
    g.strokeStyle = 'rgba(120,70,25,.25)'; g.lineWidth = Math.max(0.8, s * 0.025);
    for (let row = 0; row * rh < ph; row++) for (let c = 0; c < w; c++) { const v = hash(row, c + 5); g.beginPath(); g.ellipse(c * s + s * (0.25 + v * 0.5), row * rh + rh * 0.5, s * 0.12, rh * 0.18, 0, 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = 'rgba(90,50,20,.55)';
    for (let row = 0; row * rh < ph; row++) for (const X of [s * 0.12, pw - s * 0.12]) { g.beginPath(); g.arc(X, row * rh + rh * 0.5, s * 0.03, 0, 7); g.fill(); }
  } else if (m.id === 'stone') {
    for (let c = 0; c < w; c++) for (let r = 0; r < h; r++) for (let k = 0; k < 4; k++) {
      const sx = c * s + (k % 2) * s * 0.5, sy = r * s + (k >> 1) * s * 0.5, v = hash(c * 13 + k, r * 7 + 1);
      const st = rrp(sx + s * 0.05, sy + s * 0.05, s * 0.4, s * 0.4, s * 0.12);
      fs(g, st, v < 0.4 ? 'rgba(255,255,255,.22)' : v < 0.75 ? 'rgba(0,0,0,.06)' : 'rgba(0,0,0,.12)', 'rgba(70,80,95,.4)', Math.max(0.8, s * 0.03));
    }
  } else if (glass) {
    g.strokeStyle = n ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.95)'; g.lineWidth = Math.max(1.4, s * 0.07);
    for (let c = 0; c < w; c++) for (let r = 0; r < h; r++) { g.strokeRect(c * s + s * 0.12, r * s + s * 0.12, s * 0.76, s * 0.76); if (!n) { g.save(); g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = Math.max(1, s * 0.05); g.lineCap = 'round'; line(g, c * s + s * 0.28, r * s + s * 0.62, c * s + s * 0.55, r * s + s * 0.3); line(g, c * s + s * 0.42, r * s + s * 0.7, c * s + s * 0.62, r * s + s * 0.46); g.restore(); } }
  } else if (m.id === 'candy') {
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = s * 0.16;
    for (let k = -ph; k < pw + ph; k += s * 0.46) line(g, k, ph, k + ph, 0);
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(s * 0.32, s * 0.24, s * 0.2, s * 0.08, -0.3, 0, 7); g.fill();
  } else if (m.id === 'ice') {
    g.fillStyle = lgr(g, 0, ph, n ? ['#d8e6ff', '#9cb8e8', '#7a98d0'] : ['#f6fdff', '#cdeeff', '#a2dcf7']); g.fillRect(0, 0, pw, ph);
    for (let c = 0; c < w; c++) for (let r = 0; r < h; r++) {
      const X = c * s, Y = r * s, v = hash(c + 3, r + 17);
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = Math.max(1, s * 0.05); g.lineCap = 'round';
      line(g, X + s * 0.2, Y + s * 0.7, X + s * 0.45, Y + s * 0.22); line(g, X + s * 0.38, Y + s * 0.78, X + s * 0.56, Y + s * 0.44);
      g.strokeStyle = 'rgba(90,167,214,.45)'; g.lineWidth = Math.max(0.8, s * 0.025);
      g.beginPath(); g.moveTo(X + s * (0.6 + v * 0.2), Y + s * 0.15); g.lineTo(X + s * 0.7, Y + s * 0.42); g.lineTo(X + s * 0.86, Y + s * 0.5); g.moveTo(X + s * 0.7, Y + s * 0.42); g.lineTo(X + s * 0.64, Y + s * 0.62); g.stroke();
      fs(g, starPath(X + s * 0.76, Y + s * 0.78, s * 0.07, s * 0.025), '#ffffff');
    }
  } else if (m.id === 'leaf') {
    for (let c = 0; c < w; c++) for (let r = 0; r < h; r++) for (let k = 0; k < 5; k++) {
      const v = hash(c * 5 + k, r * 3 + 2), X = c * s + s * (0.12 + ((k * 0.37 + v * 0.3) % 0.8)), Y = r * s + s * (0.12 + ((k * 0.53 + v * 0.2) % 0.8)), a = v * 6;

function renderCreation(list, skyId, tw, th) {
  const dpr = Math.min(2, devicePixelRatio || 1), c = document.createElement('canvas'); c.width = tw * dpr; c.height = th * dpr; const g = c.getContext('2d'); g.scale(dpr, dpr);

  t += dt; frames++;
  stepZoom(dt);
  if (shakeT > 0) shakeT = Math.max(0, shakeT - dt);
  if (gest && gest.type === 'arrow' && t - gest.t0 > 0.25) panStep(gest.d, dt * 9);
  // edge auto-scroll while placing / dragging

    const p = gest.lastP, e = 34; let dx = 0; if (p.x < e) dx = -1; else if (p.x > W - e) dx = 1;

  }
