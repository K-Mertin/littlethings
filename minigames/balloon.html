let level = 1, LV = LEVELS[0], mode = 'relax';
const R = () => land ? 31 : 33;   // balloon radius
const GL = () => H - (land ? 26 : 34);   // ground line where the hero stands
const HR = () => land ? 26 : 29;   // hero radius
const SG = () => { const w = Math.min(W - 20, land ? 320 : 272), h = 74; return { x: (W - w) / 2, y: 8, w, h }; };

// ---------- state ----------
let state = 'ready', t = 0, left = 60, prog = 0, misses = 0, combo = 0, comboT = 0, winT = 0, spawnT = 0, hintT = 0, flash = 0, wind = 0;
let balloons = [], gifts = [], pops = [], rings = [], strs = [], streaks = [], fishes = [], clouds = [], motes = [];
let tcol = 0, actCols = [0, 2], next = 1, tN = 1, round = 0, cnt = 0, pauseT = 0, swapN = 0, uid = 0, lastPick = -1;
let hero = null, dragId = null, idleT = 0;
// v2: stages (mix), shapes, patterns, rescue friends, bonus gold, critters, props, weather, mid-level events
let stageI = 0, stageT = 0, tshape = 'o', pat = null, patT = 0, savedKinds = [];
let goldN = 0, friendN = 0, goldSpawned = 0, friendDone = false, midDone = false;
let paras = [], homeFriends = [], critters = [], critT = 4, planeDone = false, visitor = null, rockets = [], lanterns = [], drops = [], flakes = [], props = [], flies = [];
let rainOn = 0, rainbowA = 0, rainbowT = 0, ripples = [];
let bgC = null, bgK = '', SPR = new Map();
cv.onfit = () => { bgK = ''; SPR = new Map(); if (hero) { hero.x = clamp(hero.x, 30, W - 30); hero.tx = clamp(hero.tx, 30, W - 30); } };
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  land = asp > 1.15;
  if (land) { H = 440; W = Math.round(clamp(H * asp, 560, 1100)); }

});
addEventListener('mg-big', () => { bgK = ''; });
const TS = () => MG.textScale;
const FF = '"Noto Sans TC",system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const F = (px, w = 900) => `${w} ${Math.round(px * TS())}px ${FF}`;

const goalOf = () => LV.type === 'order' ? LV.n : LV.type === 'count' || LV.type === 'pattern' ? (LV.rounds || LV.pats).length : LV.goal;
const sea = () => LV.theme === 'sea';
const night = () => LV.theme === 'night' || LV.theme === 'fire';   // dark sky: glowing balloons
const DEF = () => LEVELS[level - 1];
const nStages = () => DEF().stages ? DEF().stages.length : 1;
const hasRescue = () => DEF().type === 'rescue' || !!(DEF().stages && DEF().stages.some(s => s.type === 'rescue'));
const frac = () => (stageI + Math.min(1, prog / Math.max(1, goalOf()))) / nStages();
function applyStage() { const d = DEF(); LV = d.stages ? Object.assign({}, d, d.stages[stageI]) : d; }
const ANIMALS = ['chick', 'kitten', 'bunny', 'puppy', 'piglet'];
// per-goal state (a mix level runs this again for every stage)
function initGoal() {
  prog = 0; next = 1; round = 0; cnt = 0; pauseT = 0; swapN = 0; hintT = 0; patT = 0; savedKinds = [];
  actCols = MG.shuffle([0, 1, 2, 3, 4, 5, 6]).slice(0, LV.cols || 7);
  tcol = actCols[0]; tN = LV.maxK ? MG.randi(1, LV.maxK) : 1;
  tshape = LV.shapes ? MG.pick(LV.shapes) : 'o';
  pat = null; if (LV.type === 'pattern') newPattern();
}
function newPattern() {
  const code = LV.pats[Math.min(round, LV.pats.length - 1)], fill = LV.fill || 2, letters = [...new Set(code)];
  const cols = MG.shuffle([0, 1, 2, 3, 4, 5, 6]), shs = MG.shuffle(['h', 's', 'o', 'bunny', 'bear', 'cat']), byShape = LV.pdim === 'shape';
  const units = {}; letters.forEach((L, i) => { units[L] = { col: cols[i], shape: byShape ? shs[i] : 'o' }; });
  const extra = { col: cols[letters.length], shape: byShape ? shs[letters.length] : 'o' };
  const cells = []; for (let i = 0; i < 6; i++) cells.push(units[code[i % code.length]]);
  pat = { cells, pos: 6 - fill, units: letters.map(L => units[L]), extra, done: 0 };
}
const patNeed = () => pat && pat.pos < 6 ? pat.cells[pat.pos] : null;

  MG.fx.clear(); balloons = []; gifts = []; pops = []; rings = []; strs = []; streaks = [];

  goldN = 0; friendN = 0; goldSpawned = 0; friendDone = false; midDone = false;

  hud();
}
function hud() {

// ---------- balloon sprites (cached per colour / size / look) ----------
function balloonPath(g, r) {
  g.beginPath();
  g.moveTo(0, r * 1.05);
  g.bezierCurveTo(-r * 0.55, r * 0.95, -r * 1.0, r * 0.38, -r * 1.0, -r * 0.18);
  g.bezierCurveTo(-r * 1.0, -r * 0.82, -r * 0.56, -r * 1.15, 0, -r * 1.15);
  g.bezierCurveTo(r * 0.56, -r * 1.15, r * 1.0, -r * 0.82, r * 1.0, -r * 0.18);
  g.bezierCurveTo(r * 1.0, r * 0.38, r * 0.55, r * 0.95, 0, r * 1.05);
  g.closePath();
}
// ---------- balloon shapes: o round · h heart · s star · bunny / bear / cat animal balloons ----------
const DECO = ['h', 's', 'bunny', 'bear', 'cat'];
const GOLD = ['#fffbe0', '#ffe680', '#ffc935', '#e09a10', '#a86a00'];
const palOf = ci => ci === 'g' ? GOLD : PAL[ci];
const knotY = sh => sh === 's' ? 0.55 : 1.0;   // where the knot sits under each shape (× r)
const topOf = sh => sh === 'bunny' ? 1.95 : sh === 'cat' ? 1.52 : sh === 'bear' ? 1.25 : 1.2;
function roundPoly(g, pts, rad) {
  const n = pts.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = m(pts[n - 1], pts[0]);
  g.beginPath(); g.moveTo(s[0], s[1]);
  for (let i = 0; i < n; i++) { const p = pts[i], q = m(p, pts[(i + 1) % n]); g.arcTo(p[0], p[1], q[0], q[1], rad); }
  g.closePath();
}
function shapePath(g, r, sh) {
  if (sh === 'h') {
    g.beginPath(); g.moveTo(0, r * 1.02);
    g.bezierCurveTo(-r * 0.25, r * 0.78, -r * 1.18, r * 0.22, -r * 1.12, -r * 0.36);
    g.bezierCurveTo(-r * 1.06, -r * 1.08, -r * 0.2, -r * 1.18, 0, -r * 0.56);
    g.bezierCurveTo(r * 0.2, -r * 1.18, r * 1.06, -r * 1.08, r * 1.12, -r * 0.36);
    g.bezierCurveTo(r * 1.18, r * 0.22, r * 0.25, r * 0.78, 0, r * 1.02); g.closePath(); return;
  }
  if (sh === 's') { const pts = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.6 : r * 1.2; pts.push([Math.cos(a) * rr, -r * 0.05 + Math.sin(a) * rr]); } roundPoly(g, pts, r * 0.18); return; }
  balloonPath(g, r);
}
function earsOf(g, r, sh, pal, fill) {
  g.strokeStyle = pal[4]; g.lineWidth = Math.max(1.2, r * 0.065); g.lineJoin = 'round';
  for (const sd of [-1, 1]) {
    g.fillStyle = fill; g.beginPath();

function hitTest(px, py) {
  const hits = [];

    const b = balloons[i]; if (b.dead) continue;

      if (Math.hypot(px - b.x, (py - (b.y - b.br * 0.15)) * 0.95) < ext) hits.push(b);
      continue;
    }
    if (b.pass && Math.hypot(px - b.x, py - (b.y + b.r * 2.35)) < b.r) { hits.push(b); continue; }
    const s = 1 + (b.grow || 0) * 0.12, rr = b.r * s;

    const dx = (px - b.x) / (rr + 12), dy = (py - cy) / ((sea() ? rr : rr * 1.12) + 12);

  for (const b of balloons) drawBalloon(b);
  drawParas();
  drawHero();
  for (const s of strs) { x.save(); x.translate(s.x, s.y); x.rotate(s.rot); x.globalAlpha = Math.min(1, s.life); x.strokeStyle = s.col; x.lineWidth = 1.5; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(6, s.len * 0.5, 0, s.len); x.stroke(); x.restore(); } x.globalAlpha = 1;
  for (const r of rings) { const k = 1 - r.life / r.max; x.strokeStyle = r.c; x.globalAlpha = 1 - k; x.lineWidth = 4 * (1 - k) + 1; x.beginPath(); x.arc(r.x, r.y, r.r * (0.6 + k * 0.9), 0, 7); x.stroke();
    x.lineWidth = 3; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r0 = r.r * (0.9 + k), r1 = r.r * (1.15 + k * 1.3); x.beginPath(); x.moveTo(r.x + Math.cos(a) * r0, r.y + Math.sin(a) * r0); x.lineTo(r.x + Math.cos(a) * r1, r.y + Math.sin(a) * r1); x.stroke(); } }
  x.globalAlpha = 1;
  MG.fx.draw(x);
  drawWeather();
  drawSign();
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const p of pops) {
    const k = p.life / p.max, sc = k > 0.85 ? 1 + (k - 0.85) * 3 : 1;
    x.globalAlpha = Math.min(1, k * 2.5); x.font = F(p.size * sc); x.lineWidth = MG.big ? 6 : 5; x.strokeStyle = '#fff';
    const px = clamp(p.x, 60, W - 60), py = Math.max(SG().y + SG().h + (nStages() > 1 ? 30 : 18), p.y);
    x.strokeText(p.t, px, py); x.fillStyle = p.c; x.fillText(p.t, px, py);
  }
  x.globalAlpha = 1;
}

// ---------- flow ----------
function setLevel(n) { level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; bgK = ''; }
const rest = MG.barButton('休息一下', () => menu());
function start(m, lv) {
  if (m) mode = m; if (lv) setLevel(lv);
  reset(); state = 'play'; MG.hide(); rest.show(false);
  const fresh = newsOf(LV).filter(k => NEWS[k] && !MG.store.get('balloon.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('balloon.seen.' + k, true));
    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function starsOf() { const s = MG.store.get('balloon.stars', {}); return s && typeof s === 'object' ? s : {}; }
function win() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const st = misses <= 1 ? 3 : misses <= 4 ? 2 : 1;
  const all = starsOf(); const old = all[level] || 0; if (st > old) { all[level] = st; MG.store.set('balloon.stars', all); }
  let maxDone = 0; for (const k in all) maxDone = Math.max(maxDone, +k); MG.record('balloon', maxDone);
  const next = level < LEVELS.length ? LEVELS[level] : null;
  if (next) MG.store.set('balloon.pickLevel', level + 1);
  MG.fx.burst(W / 2, H * 0.45, { n: 60, colors: CONF, shape: 'star', speed: 340, up: 200, size: 7, life: 1.2 });
  setTimeout(() => {
    if (state !== 'over') return;
    MG.panel({
      title: `第 ${level} 關過關！`,
      html: `<div class="big">${'⭐'.repeat(st)}${'<span style="opacity:.25">⭐</span>'.repeat(3 - st)}</div><p>${THEME_E[LV.theme]} ${LV.name} 完成 ^_^${mode === 'timed' ? `　還剩 ${Math.ceil(left)} 秒` : `　用了 ${mmss(t)}`}</p>` +
        (goldN || friendN ? `<p>${goldN ? `找到 🌟 金色氣球 ×${goldN}　` : ''}${friendN ? `救了 🐣 小朋友 ×${friendN}` : ''}</p>` : '') +
        (st < 3 ? '<p>只戳對的氣球，就能拿到三顆星喔！</p>' : '') +
        (next ? `<p>下一關：${THEME_E[next.theme]} ${next.name}</p>` : '<p>全部過關了！你是氣球大王 🎈👑</p>'),
      buttons: [...(next ? [{ label: '下一關', on: () => start(null, level + 1) }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
    });
  }, 650);
}
function fail() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('over');
  MG.panel({
    title: '時間到！',
    html: `<div class="big">${prog} / ${goalOf()}</div><p>差一點點！再試一次吧</p><p>🐢 慢慢玩沒有時間限制喔</p>`,
    buttons: [{ label: '再試一次', on: () => start() }, { label: '🐢 慢慢玩這關', alt: true, on: () => { MG.store.set('balloon.pickMode', 'relax'); start('relax'); } }, { label: '選關卡', alt: true, on: menu }],
  });
}
function goalWords(L) {
  if (L.stages) return `${L.stages.length} 個任務 ${L.stages.map(s => STAGE_E[s.type]).join('→')}`;
  return { all: `戳破 ${L.goal} 個氣球`, color: '只戳木牌上的顏色', order: `照順序 1 → ${L.n}`, count: `數數看 ${L.rounds && L.rounds.join('、')}`, bunch: '找一樣多顆的那一串', gift: `接住 ${L.goal} 個禮物`, big: `戳破 ${L.goal} 個大氣球`, party: '全部戳破！', rescue: `救 ${L.goal} 隻小動物回家`, shape: '只戳木牌上的形狀', pattern: '照規律排排看' }[L.type];
}
function menu() {
  state = 'ready'; rest.show(false);
  const st = starsOf();
  MG.choose({
    id: 'balloon', title: '氣球砰砰',
    html: `<p>彩色氣球飄上來了！點一下就「砰」地破掉。看上面木牌的提示：🎨 找顏色、🔢 照 1、2、3 的順序、✋ 數數看、👀 找一樣多顆的一串、🎁 接禮物、💪 戳三下的大氣球、🐣 救小動物、💖 找形狀、🔁 排排看，還有 🧩 好幾個任務的大關卡！</p><p>愛心、星星、小兔子氣球都來了；找找看 🌟 金色氣球，點點太陽、小鳥和雪人也會有驚喜喔！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・氣球飄比較慢' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '每一關有時間限制' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${THEME_E[LEVELS[n - 1].theme]} ${LEVELS[n - 1].name}：${goalWords(LEVELS[n - 1])}${st[n] ? ' ' + '⭐'.repeat(st[n]) : ''}）`, short: n => `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '用手指（或滑鼠）點氣球　接禮物時在下面左右拖，鍵盤也可以按 <kbd>←</kbd><kbd>→</kbd>',
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),
  });
}
setLevel(Math.min(MG.store.get('balloon.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) update(dt);
  else { t += dt; MG.fx.step(dt); for (const p of pops) { p.y -= 34 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0); }
  draw();
});

// ---------- hook for automated tests ----------
window.BALLOONT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get prog() { return prog; }, get goal() { return goalOf(); }, get type() { return LV.type; },
  get misses() { return misses; }, get next() { return next; }, get tN() { return tN; }, get tcol() { return tcol; }, get size() { return [W, H, land]; }, levels: LEVELS.length,
  balloons: () => balloons.map((b, i) => ({ i, id: b.id, kind: b.kind, x: b.x, y: b.y, col: b.col, num: b.num, k: b.k, gift: !!b.gift, valid: isValid(b) })),
  gifts: () => gifts.map(g => ({ x: g.x, y: g.y, landed: g.landed })), get hero() { return { x: hero.x, tx: hero.tx }; },
  // v2
  get stage() { return stageI; }, get stages() { return nStages(); }, get stageT() { return stageT; }, get tshape() { return tshape; }, get theme() { return LV.theme; },
  get need() { return patNeed(); }, get gold() { return goldN; }, get friends() { return friendN; }, get home() { return homeFriends.slice(); },
  paras: () => paras.map(p => ({ x: p.x, y: p.y, st: p.st, bonus: p.bonus })),
  critters: () => critters.map((c, i) => ({ i, k: c.k, x: c.x, y: c.y })), tapCritter(i) { const c = critters[i]; if (c) tapCritter(c); },
  props: () => props.map((p, i) => ({ i, k: p.k, x: p.x, y: p.ground ? p.y - p.r * 0.9 : p.y })),
  get visitor() { return visitor && { k: visitor.k, x: visitor.x, y: visitor.y }; },
  spawnSpecial: (w) => spawnSpecial(w), midEvent: () => { midDone = true; midEvent(); },
  start: (lv, m = 'relax') => start(m, lv), win: () => { if (state === 'play') startWin(); }, menu: () => menu(),
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play' && !MG.panelOpen()) update(dt); },
  tap(i) { const b = balloons[i]; if (b) tapBalloon(b, b.x, b.y); },
  // client coordinates of a balloon (for real touch / mouse input)
  toClient(i) { const b = balloons[i], rc = cv.getBoundingClientRect(), B = 3; const yy = b.kind === 'bunch' ? b.y : b.y; return { x: rc.left + B + b.x * (rc.width - 2 * B) / W, y: rc.top + B + yy * (rc.height - 2 * B) / H }; },
  logToClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  // one helpful move: tap a right balloon that is well on screen, or walk under a falling gift
  auto() {
    if (state !== 'play' || winT) return false;
    const fall = gifts.filter(g => !g.landed).sort((a, b) => b.y - a.y)[0];
    if (giftMode() && fall) hero.tx = clamp(fall.x, 30, W - 30);
    const ok = balloons.filter(b => isValid(b) && b.y < H - 40 && b.y > 90 && !b.pop);
    if (ok.length) { tapBalloon(ok[0], ok[0].x, ok[0].y); return true; }
    return false;
  },
};
</script>
