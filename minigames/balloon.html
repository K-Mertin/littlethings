<script>
'use strict';
MG.init({ id: 'balloon', title: '氣球砰砰', stats: ['lv', 'time'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
let W = 360, H = 640, land = false;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;

// ---------- colours (the ones kids learn first) ----------
const J = MG.JELLY;
const PAL = [J.red, J.yellow, J.blue, J.green, J.purple, J.orange, J.pink];

// ---------- levels ----------
// type: all 全部戳破 · color 只戳這個顏色 · order 照 1→N 的順序 · count 數到 N · bunch 找有 N 顆的那一串 · gift 接禮物 · big 戳三下的大氣球 · party 大派對
// theme: day / sunset / night / sea / party · wind: 大風 · swap: 目標顏色會換 · sp: 0..1 速度 · on: 畫面上最多幾個 · time: ⏱ 秒數
const LEVELS = [
  { name: '氣球飛飛', type: 'all', theme: 'day', goal: 8, sp: 0, on: 4, time: 60, mk: '🎈' },
  { name: '好多氣球', type: 'all', theme: 'day', goal: 12, sp: 0.1, on: 5, time: 60 },
  { name: '找顏色', type: 'color', theme: 'day', cols: 2, goal: 8, sp: 0.08, on: 5, time: 70, mk: '🎨' },
  { name: '1 數到 5', type: 'order', theme: 'day', n: 5, sp: 0.05, on: 4, time: 80, mk: '🔢' },
  { name: '數數看', type: 'count', theme: 'day', rounds: [2, 3, 4], sp: 0.1, on: 5, time: 70, mk: '✋' },
  { name: '禮物降落', type: 'gift', theme: 'sunset', goal: 4, sp: 0.1, on: 4, time: 80, mk: '🎁' },
  { name: '三種顏色', type: 'color', theme: 'sunset', cols: 3, goal: 10, sp: 0.18, on: 6, time: 70, mk: '🎨' },
  { name: '大大氣球', type: 'big', theme: 'sunset', goal: 3, sp: 0.12, on: 3, time: 80, mk: '💪' },
  { name: '一串氣球', type: 'bunch', theme: 'sunset', maxK: 3, goal: 5, sp: 0.1, on: 3, time: 90, mk: '👀' },
  { name: '大風吹', type: 'all', theme: 'sunset', wind: 1, goal: 15, sp: 0.22, on: 6, time: 60, mk: '💨' },
  { name: '1 數到 7', type: 'order', theme: 'night', n: 7, sp: 0.15, on: 5, time: 90, mk: '🔢' },
  { name: '變變顏色', type: 'color', theme: 'night', cols: 3, swap: 1, goal: 12, sp: 0.22, on: 6, time: 80, mk: '🔄' },
  { name: '夜晚的禮物', type: 'gift', theme: 'night', wind: 1, goal: 5, sp: 0.18, on: 5, time: 90, mk: '🎁' },
  { name: '月光數數', type: 'count', theme: 'night', rounds: [3, 5, 4], sp: 0.22, on: 6, time: 80, mk: '✋' },
  { name: '月亮大氣球', type: 'big', theme: 'night', goal: 4, sp: 0.22, on: 4, time: 90, mk: '💪' },
  { name: '海底泡泡', type: 'all', theme: 'sea', goal: 15, sp: 0.22, on: 6, time: 60, mk: '🫧' },
  { name: '彩色小魚', type: 'color', theme: 'sea', cols: 4, goal: 12, sp: 0.28, on: 7, time: 80, mk: '🎨' },
  { name: '泡泡 1 到 8', type: 'order', theme: 'sea', n: 8, sp: 0.22, on: 6, time: 100, mk: '🔢' },
  { name: '泡泡一串串', type: 'bunch', theme: 'sea', maxK: 4, goal: 6, sp: 0.22, on: 3, time: 100, mk: '👀' },
  { name: '風中的顏色', type: 'color', theme: 'day', cols: 4, swap: 1, wind: 1, goal: 14, sp: 0.32, on: 7, time: 80, mk: '💨' },
  { name: '1 數到 10', type: 'order', theme: 'sunset', n: 10, wind: 1, sp: 0.28, on: 6, time: 120, mk: '🔟' },
  { name: '海底數數', type: 'count', theme: 'sea', rounds: [6, 8, 7], sp: 0.32, on: 7, time: 90, mk: '✋' },
  { name: '星空氣球串', type: 'bunch', theme: 'night', maxK: 5, goal: 6, sp: 0.28, on: 3, time: 110, mk: '👀' },
  { name: '氣球大派對', type: 'party', theme: 'party', goal: 30, sp: 0.38, on: 8, time: 90, mk: '🏆' },
];
const THEME_E = { day: '☀️', sunset: '🌇', night: '🌙', sea: '🫧', party: '🎉' };
// the first time something new shows up, a short panel explains it once
const NEWS = {
  all: ['🎈 氣球砰砰', '氣球從下面飄上來了！用手指<b>點一下氣球</b>就會「砰」地破掉，彩色紙花飛出來。把木牌上的數量戳完就過關！'],
  color: ['🎨 找顏色', '看看上面木牌的<b>大氣球是什麼顏色</b>，只戳一樣顏色的氣球！戳到別的顏色沒關係，它只會彈一下。'],
  order: ['🔢 照順序戳', '氣球上有數字和小圓點。從 <b>1</b> 開始，照 1、2、3…的順序戳！木牌上會告訴你下一個要找哪一個。'],
  count: ['✋ 數數看', '木牌上寫著要戳<b>幾個</b>氣球，每戳一個，小圓點就亮一個，跟著一起數：1、2、3！'],
  bunch: ['👀 一串氣球', '氣球綁成一串一串的。數一數，找到<b>跟木牌一樣多顆</b>的那一串，點一下整串都會砰砰破掉！'],
  gift: ['🎁 接禮物', '有些氣球綁著禮物！戳破氣球，禮物會掉下來，<b>用手指在下面拖噗噗</b>，拿籃子接住。掉在地上也可以走過去撿喔。'],
  big: ['💪 大大氣球', '好大的氣球！要<b>戳三下</b>才會破，每戳一下就會變更大，最後「砰！」跑出好多小氣球。'],
  wind: ['💨 起風了', '風會把氣球吹得左右飄，看清楚再戳！'],
  swap: ['🔄 換顏色', '戳了幾個以後，木牌上的<b>顏色會換</b>，記得看一看上面喔！'],
  sea: ['🫧 海底泡泡', '這次在海底！泡泡裡住著小魚，戳破泡泡讓小魚游出來。'],
  party: ['🎉 大派對', '所有的氣球都來了：大氣球、禮物氣球、普通氣球，全部戳破吧！'],
};
const newsOf = L => [L.type, L.wind && 'wind', L.swap && 'swap', L.theme === 'sea' && 'sea'].filter(Boolean);

let level = 1, LV = LEVELS[0], mode = 'relax';
const R = () => land ? 31 : 33;   // balloon radius
const GL = () => H - (land ? 26 : 34);   // ground line where the hero stands
const HR = () => land ? 26 : 29;   // hero radius
const SG = () => { const w = Math.min(W - 20, land ? 320 : 272), h = 74; return { x: (W - w) / 2, y: 8, w, h }; };

// ---------- state ----------
let state = 'ready', t = 0, left = 60, prog = 0, misses = 0, combo = 0, comboT = 0, winT = 0, spawnT = 0, hintT = 0, flash = 0, wind = 0;
let balloons = [], gifts = [], pops = [], rings = [], strs = [], streaks = [], fishes = [], clouds = [], motes = [];
let tcol = 0, actCols = [0, 2], next = 1, tN = 1, round = 0, cnt = 0, pauseT = 0, swapN = 0, uid = 0, lastPick = -1;
let hero = null, dragId = null, idleT = 0;
let bgC = null, bgK = '', SPR = new Map();
cv.onfit = () => { bgK = ''; SPR = new Map(); if (hero) { hero.x = clamp(hero.x, 30, W - 30); hero.tx = clamp(hero.tx, 30, W - 30); } };
MG.fit(cv, (sw, sh) => {
  const asp = Math.max(0.3, (sw - 22) / Math.max(1, sh - 22));
  land = asp > 1.15;
  if (land) { H = 440; W = Math.round(clamp(H * asp, 560, 1100)); }
  else { W = 360; H = Math.round(clamp(W / asp, 440, 860)); }
  return [W, H];
});
addEventListener('mg-big', () => { bgK = ''; });
const TS = () => MG.textScale;
const FF = '"Noto Sans TC",system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const F = (px, w = 900) => `${w} ${Math.round(px * TS())}px ${FF}`;
const mmss = v => `${Math.floor(v / 60)}:${String(Math.floor(v % 60)).padStart(2, '0')}`;

const goalOf = () => LV.type === 'order' ? LV.n : LV.type === 'count' ? LV.rounds.length : LV.goal;
const sea = () => LV.theme === 'sea';
const night = () => LV.theme === 'night';

function reset() {
  MG.fx.clear(); balloons = []; gifts = []; pops = []; rings = []; strs = []; streaks = [];
  t = 0; left = LV.time || 60; prog = 0; misses = 0; combo = 0; comboT = 0; winT = 0; spawnT = 0.3; hintT = 0; flash = 0; wind = 0; pauseT = 0; swapN = 0;
  next = 1; round = 0; cnt = 0; idleT = 0;
  actCols = MG.shuffle([0, 1, 2, 3, 4, 5, 6]).slice(0, LV.cols || 7);
  tcol = actCols[0]; tN = LV.maxK ? MG.randi(1, LV.maxK) : 1;
  hero = { x: land ? 62 : 48, tx: land ? 62 : 48, mood: 'happy', moodT: 0, look: 0, arms: 0, sq: 0, walk: 0 };
  if (LV.type === 'gift' || LV.type === 'party') hero.x = hero.tx = W / 2;
  clouds = []; for (let i = 0; i < 4; i++) clouds.push({ x: Math.random() * W, y: 90 + i * (H * 0.16) + Math.random() * 30, s: 0.7 + Math.random() * 0.6, v: 4 + Math.random() * 6 });
  fishes = []; for (let i = 0; i < 3; i++) fishes.push({ x: Math.random() * W, y: H * (0.3 + i * 0.18), v: (Math.random() < 0.5 ? -1 : 1) * (14 + Math.random() * 10), c: MG.pick(PAL)[2] });
  for (let i = 0; i < Math.min(2, LV.on - 1); i++) if (spawn(i === 0 && needValid())) balloons[balloons.length - 1].y = H * (0.48 + 0.22 * i);
  motes = []; for (let i = 0; i < 26; i++) motes.push({ x: Math.random(), y: Math.random(), ph: Math.random() * 6, s: 0.6 + Math.random() });
  hud();
}
function hud() {
  MG.stat('lv', `第 ${level} 關`);
  MG.stat('time', mode === 'timed' ? `⏱ ${Math.ceil(Math.max(0, left))}` : `🐢 ${mmss(t)}`);
}

// ---------- balloon sprites (cached per colour / size / look) ----------
function balloonPath(g, r) {
  g.beginPath();
  g.moveTo(0, r * 1.05);
  g.bezierCurveTo(-r * 0.55, r * 0.95, -r * 1.0, r * 0.38, -r * 1.0, -r * 0.18);
  g.bezierCurveTo(-r * 1.0, -r * 0.82, -r * 0.56, -r * 1.15, 0, -r * 1.15);
  g.bezierCurveTo(r * 0.56, -r * 1.15, r * 1.0, -r * 0.82, r * 1.0, -r * 0.18);
  g.bezierCurveTo(r * 1.0, r * 0.38, r * 0.55, r * 0.95, 0, r * 1.05);
  g.closePath();
}
function fishShape(g, cx, cy, s, pal, dir = 1) {
  g.save(); g.translate(cx, cy); g.scale(dir, 1);
  g.fillStyle = pal[2]; g.strokeStyle = pal[4]; g.lineWidth = Math.max(1, s * 0.12); g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-s * 0.7, 0); g.lineTo(-s * 1.25, -s * 0.5); g.lineTo(-s * 1.15, 0); g.lineTo(-s * 1.25, s * 0.5); g.closePath(); g.fill(); g.stroke();
  const fg = g.createLinearGradient(0, -s * 0.6, 0, s * 0.6); fg.addColorStop(0, pal[1]); fg.addColorStop(1, pal[3]);
  g.fillStyle = fg; g.beginPath(); g.ellipse(0, 0, s * 0.9, s * 0.62, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = pal[0]; g.beginPath(); g.ellipse(-s * 0.05, s * 0.18, s * 0.5, s * 0.22, 0, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(s * 0.42, -s * 0.12, s * 0.2, 0, 7); g.fill();
  g.fillStyle = '#1d2433'; g.beginPath(); g.arc(s * 0.46, -s * 0.12, s * 0.11, 0, 7); g.fill();
  g.strokeStyle = pal[4]; g.lineWidth = Math.max(0.8, s * 0.08); g.beginPath(); g.arc(s * 0.62, s * 0.14, s * 0.12, 0.2, 2.2); g.stroke();
  g.restore();
}
// style: 'b' balloon · 'n' glowing night balloon · 's' sea bubble with a fish · 'q' sea bubble, empty (numbers)
function sprite(ci, r, style) {
  const k = cv._mgScale || 1, key = ci + ':' + r + ':' + style + ':' + k;
  let sp = SPR.get(key); if (sp) return sp;
  const pal = PAL[ci], bub = style === 's' || style === 'q';
  const pad = style === 'n' ? r * 0.8 : r * 0.14, top = bub ? r : r * 1.15, bot = bub ? r : r * 1.22;
  const w = 2 * r + 2 * pad, h = top + bot + 2 * pad;
  const c = document.createElement('canvas'); c.width = Math.ceil(w * k); c.height = Math.ceil(h * k);
  const g = c.getContext('2d'); g.scale(k, k); g.translate(r + pad, top + pad);
  if (bub) {
    const bg = g.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
    bg.addColorStop(0, 'rgba(255,255,255,.18)'); bg.addColorStop(0.7, 'rgba(255,255,255,.08)'); bg.addColorStop(1, pal[1] + 'aa');
    g.fillStyle = bg; g.beginPath(); g.arc(0, 0, r, 0, 7); g.fill();
    if (style === 's') fishShape(g, r * 0.05, r * 0.08, r * 0.5, pal, 1);
    else { g.fillStyle = pal[1] + '66'; g.beginPath(); g.arc(0, 0, r * 0.8, 0, 7); g.fill(); }
    g.strokeStyle = pal[2]; g.lineWidth = r * 0.09; g.beginPath(); g.arc(0, 0, r - r * 0.05, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = r * 0.045; g.beginPath(); g.arc(0, 0, r - r * 0.05, 0, 7); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = r * 0.09; g.lineCap = 'round'; g.beginPath(); g.arc(0, 0, r * 0.72, 3.5, 4.4); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(-r * 0.2, -r * 0.62, r * 0.07, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(r * 0.45, r * 0.5, r * 0.18, r * 0.08, -0.7, 0, 7); g.fill();
  } else {
    if (style === 'n') {   // a soft lantern glow around it
      const gl = g.createRadialGradient(0, 0, r * 0.6, 0, 0, r * 1.75);
      gl.addColorStop(0, pal[1] + '88'); gl.addColorStop(1, pal[1] + '00');
      g.fillStyle = gl; g.beginPath(); g.arc(0, 0, r * 1.8, 0, 7); g.fill();
    }
    // knot
    g.fillStyle = pal[3]; g.strokeStyle = pal[4]; g.lineWidth = r * 0.05; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(-r * 0.09, r * 1.0); g.lineTo(r * 0.09, r * 1.0); g.lineTo(r * 0.14, r * 1.2); g.lineTo(-r * 0.14, r * 1.2); g.closePath(); g.fill(); g.stroke();
    const bg = g.createRadialGradient(-r * 0.38, -r * 0.5, r * 0.08, 0, 0, r * 1.25);
    bg.addColorStop(0, pal[0]); bg.addColorStop(0.3, pal[1]); bg.addColorStop(0.75, pal[2]); bg.addColorStop(1, pal[3]);
    g.fillStyle = bg; balloonPath(g, r); g.fill();
    g.save(); balloonPath(g, r); g.clip();
    g.fillStyle = 'rgba(40,20,60,.12)'; g.beginPath(); g.ellipse(r * 0.55, r * 0.45, r * 0.75, r * 0.9, -0.4, 0, 7); g.fill();
    g.fillStyle = style === 'n' ? 'rgba(255,255,230,.25)' : 'rgba(255,255,255,.12)'; g.beginPath(); g.ellipse(-r * 0.1, -r * 0.1, r * 0.55, r * 0.6, 0, 0, 7); g.fill();
    g.restore();
    g.strokeStyle = pal[4]; g.lineWidth = Math.max(1.2, r * 0.065); balloonPath(g, r); g.stroke();
    // shine
    g.save(); g.translate(-r * 0.45, -r * 0.5); g.rotate(0.55);
    g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.ellipse(0, 0, r * 0.15, r * 0.3, 0, 0, 7); g.fill(); g.restore();
    g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.arc(-r * 0.12, -r * 0.82, r * 0.07, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = r * 0.05; g.lineCap = 'round'; g.beginPath(); g.arc(0, 0, r * 0.82, 0.25, 0.9); g.stroke();
  }
  sp = { c, ox: r + pad, oy: top + pad, w, h }; SPR.set(key, sp); return sp;
}
const styleOf = (b) => sea() ? (b.num ? 'q' : 's') : night() ? 'n' : 'b';
function blit(sp, cx, cy) { x.drawImage(sp.c, cx - sp.ox, cy - sp.oy, sp.w, sp.h); }

// little dot pattern (like dice) so numbers can be counted, not read
function dots(cx, cy, n, rr, fill, stroke) {
  const rows = n <= 5 ? [n] : [5, n - 5], gap = rr * 2.7;
  rows.forEach((m, ri) => {
    const yy = cy + (ri - (rows.length - 1) / 2) * gap;
    for (let i = 0; i < m; i++) {
      const xx = cx + (i - (m - 1) / 2) * gap;
      x.fillStyle = fill; x.beginPath(); x.arc(xx, yy, rr, 0, 7); x.fill();
      if (stroke) { x.strokeStyle = stroke; x.lineWidth = Math.max(1, rr * 0.45); x.stroke(); }
    }
  });
}
function giftBox(cx, cy, s, ci, rot = 0) {
  const pal = PAL[ci], rib = ci === 1 ? PAL[0] : PAL[1];
  x.save(); x.translate(cx, cy); x.rotate(rot);
  x.fillStyle = 'rgba(40,30,60,.18)'; x.beginPath(); x.ellipse(s * 0.1, s * 0.62, s * 0.7, s * 0.12, 0, 0, 7); x.fill();
  const g = x.createLinearGradient(-s, -s, s, s); g.addColorStop(0, pal[1]); g.addColorStop(1, pal[3]);
  x.fillStyle = g; x.strokeStyle = pal[4]; x.lineWidth = Math.max(1.2, s * 0.09); x.lineJoin = 'round';
  x.beginPath(); x.roundRect(-s * 0.62, -s * 0.3, s * 1.24, s * 0.9, s * 0.1); x.fill(); x.stroke();
  x.beginPath(); x.roundRect(-s * 0.72, -s * 0.52, s * 1.44, s * 0.28, s * 0.08); x.fill(); x.stroke();
  x.fillStyle = rib[1]; x.fillRect(-s * 0.1, -s * 0.52, s * 0.2, s * 1.12);
  x.strokeStyle = rib[3]; x.lineWidth = Math.max(1, s * 0.07);
  for (const sd of [-1, 1]) { x.fillStyle = rib[1]; x.beginPath(); x.ellipse(sd * s * 0.24, -s * 0.66, s * 0.24, s * 0.15, sd * -0.5, 0, 7); x.fill(); x.stroke(); }
  x.fillStyle = rib[2]; x.beginPath(); x.arc(0, -s * 0.58, s * 0.1, 0, 7); x.fill();
  x.fillStyle = 'rgba(255,255,255,.45)'; x.fillRect(-s * 0.5, -s * 0.2, s * 0.14, s * 0.6);
  x.restore();
}

// ---------- spawning ----------
const speedK = () => (mode === 'relax' ? 0.8 : 1);
function riseV(mul = 1) { const T = lerp(10, 5.2, LV.sp || 0) * mul / speedK(); return (H + 120) / T * MG.rand(0.88, 1.12); }
function spotX(half) {
  const lo = half + 6, hi = W - half - 6; let best = W / 2, bs = -1;
  for (let i = 0; i < 10; i++) {
    const c = MG.rand(lo, hi);
    let d = 1e9; for (const b of balloons) if (b.y > H * 0.45) d = Math.min(d, Math.abs(b.x0 - c));
    if (d > bs) { bs = d; best = c; }
  }
  return best;
}
function isValid(b) {
  switch (LV.type) {
    case 'color': return b.kind === 'b' && b.col === tcol;
    case 'order': return b.num === next;
    case 'bunch': return b.kind === 'bunch' && b.k === tN && !b.pop;
    case 'gift': return !!b.gift;
    case 'big': return b.kind === 'big';
    default: return true;
  }
}
function spawn(force) {
  const r = R(), T = LV.type;

      x.font = `900 ${n >= 10 ? 17 : 21}px system-ui,sans-serif`; x.lineWidth = 3.5; x.lineJoin = 'round'; x.strokeStyle = sea() ? '#fff' : PAL[ci][4]; x.strokeText(String(n), ix, iy - 7 + bob); x.fillStyle = sea() ? PAL[ci][4] : '#fff'; x.fillText(String(n), ix, iy - 7 + bob);
      dots(ix, iy + 9 + bob, n, n > 5 ? 1.6 : 1.9, sea() ? PAL[ci][3] : '#fff', sea() ? '#fff' : PAL[ci][4]);
    } else star(ix, iy, 20, '#ffd23f', '#b88400');
    // the number line 1 … N
    const N = LV.n, cw = Math.min(26, aw / N), r = Math.min(11, cw * 0.44), cy = ay + ah / 2;
    for (let i = 1; i <= N; i++) {
      const cx = ax + cw * (i - 0.5) + (aw - cw * N) / 2, isDone = i < next, isNext = i === next;
      x.fillStyle = isDone ? PAL[(i - 1) % PAL.length][2] : '#fff'; x.strokeStyle = isNext ? '#ff8a00' : isDone ? PAL[(i - 1) % PAL.length][4] : '#e2c890'; x.lineWidth = isNext ? 3 : 1.6;
      x.beginPath(); x.arc(cx, cy + (isNext ? Math.sin(t * 6) * 2 : 0), r * (isNext ? 1.12 : 1), 0, 7); x.fill(); x.stroke();
      x.fillStyle = isDone ? '#fff' : isNext ? '#d06a00' : '#b8a27a'; x.font = `900 ${Math.round(r * (i >= 10 ? 0.95 : 1.15))}px system-ui,sans-serif`; x.fillText(String(i), cx, cy + 1 + (isNext ? Math.sin(t * 6) * 2 : 0));
    }
  } else if (T === 'count') {
    const N = LV.rounds[Math.min(round, LV.rounds.length - 1)];
    x.font = '900 30px system-ui,sans-serif'; x.fillStyle = '#ff7a00'; x.strokeStyle = '#fff'; x.lineWidth = 4; x.strokeText(String(N), ix, iy - 4 + bob); x.fillText(String(N), ix, iy - 4 + bob);
    dots(ix, iy + 17 + bob, N, N > 5 ? 1.7 : 2.1, '#ff9a3c');
    // N circles to fill: 1, 2, 3 …
    const cw = Math.min(30, aw / N), r = Math.min(12, cw * 0.42), cy = ay + ah * 0.4;
    for (let i = 0; i < N; i++) {
      const cx = ax + cw * (i + 0.5) + (aw - cw * N) / 2, on = i < cnt || pauseT > 0;
      x.fillStyle = on ? CONF[i % 7] : '#fff'; x.strokeStyle = on ? 'rgba(0,0,0,.2)' : '#e2c890'; x.lineWidth = 2; x.beginPath(); x.arc(cx, cy, r * (on ? 1.08 : 1), 0, 7); x.fill(); x.stroke();
      if (on) { x.fillStyle = '#fff'; x.font = `900 ${Math.round(r * 1.1)}px system-ui,sans-serif`; x.fillText(String(i + 1), cx, cy + 1); }
    }
    roundPips(ax + aw / 2, ay + ah * 0.9, LV.rounds.length, round);
  } else if (T === 'bunch') {
    x.font = '900 30px system-ui,sans-serif'; x.fillStyle = '#ff7a00'; x.strokeStyle = '#fff'; x.lineWidth = 4; x.strokeText(String(tN), ix, iy - 4 + bob); x.fillText(String(tN), ix, iy - 4 + bob);
    dots(ix, iy + 17 + bob, tN, 2.1, '#ff9a3c');
    // a picture of N little balloons
    const bw = Math.min(26, aw / Math.max(tN, 3)), cy = ay + ah * 0.36;
    for (let i = 0; i < tN; i++) blit(sprite(CONF_I[i], 9, sea() ? 's' : 'b'), ax + bw * (i + 0.5) + (aw - bw * tN) / 2, cy + Math.sin(t * 3 + i) * 1.5);
    roundPips(ax + aw / 2, ay + ah * 0.9, goalOf(), prog);
  } else if (T === 'gift') {
    giftBox(ix, iy + 4 + bob * 0.5, 22, 4);
    pips(ax, ay, aw, ah, prog, goalOf(), PAL[4]);
  } else if (T === 'big') {
    blit(sprite(0, 22, night() ? 'b' : 'b'), ix, iy - 2 + bob);
    x.fillStyle = '#3a2040'; for (const sd of [-1, 1]) { x.beginPath(); x.arc(ix + sd * 6, iy - 6 + bob, 2, 0, 7); x.fill(); }
    x.strokeStyle = '#3a2040'; x.lineWidth = 1.6; x.beginPath(); x.arc(ix, iy - 2 + bob, 4, 0.3, Math.PI - 0.3); x.stroke();
    pips(ax, ay, aw, ah, prog, goalOf(), PAL[0]);
  } else {   // all / party: three balloons
    for (const [dx, dy, ci] of [[-12, 4, 0], [12, 4, 2], [0, -6, 1]]) blit(sprite(ci, 13, sea() ? 's' : 'b'), ix + dx, iy + dy - 4 + bob);
    pips(ax, ay, aw, ah, prog, goalOf(), PAL[0]);
  }
  x.restore();
}
const CONF_I = [0, 2, 1, 3, 4, 5, 6];
function roundPips(cx, cy, n, done) {
  const gap = 15;
  for (let i = 0; i < n; i++) star(cx + (i - (n - 1) / 2) * gap, cy, 6, i < done ? '#ffd23f' : '#fff', i < done ? '#b88400' : '#e2c890');
}
// progress: little balloons that fill up (few) or a bar with a number (many)
function pips(ax, ay, aw, ah, n, goal, pal) {
  if (goal <= 10) {
    const cw = Math.min(28, aw / goal), r = Math.min(11, cw * 0.42), cy = ay + ah / 2;
    for (let i = 0; i < goal; i++) {
      const cx = ax + cw * (i + 0.5) + (aw - cw * goal) / 2, on = i < n;
      x.fillStyle = on ? pal[2] : '#fff'; x.strokeStyle = on ? pal[4] : '#e2c890'; x.lineWidth = 2;
      x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); x.stroke();
      if (on) { x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.arc(cx - r * 0.35, cy - r * 0.35, r * 0.25, 0, 7); x.fill(); }
    }
    return;
  }
  const by = ay + ah * 0.62, bh = 14;
  x.fillStyle = '#f3e2bd'; x.beginPath(); x.roundRect(ax, by - bh / 2, aw, bh, bh / 2); x.fill();
  const k = Math.min(1, n / goal);
  if (k > 0) { const gg = x.createLinearGradient(ax, 0, ax + aw, 0); gg.addColorStop(0, '#ff8ac2'); gg.addColorStop(0.5, '#ffd23f'); gg.addColorStop(1, '#6fdc83'); x.fillStyle = gg; x.beginPath(); x.roundRect(ax, by - bh / 2, Math.max(bh, aw * k), bh, bh / 2); x.fill(); }
  x.font = F(17); x.fillStyle = '#8a5a14'; x.fillText(`${n} / ${goal}`, ax + aw / 2, ay + ah * 0.2);
}
function draw() {
  background();
  x.drawImage(bgC, 0, 0, W, H);
  const th = LV.theme;
  if (th === 'night') for (const m of motes) { const a = (Math.sin(t * 2 + m.ph * 3) + 1) / 2; x.fillStyle = `rgba(255,255,210,${0.25 + a * 0.7})`; x.beginPath(); x.arc(m.x * W, m.y * H * 0.62, 0.8 + a * m.s * 1.2, 0, 7); x.fill(); }
  if (th === 'sea') {
    for (const m of motes) { const yy = ((m.y * H - t * 26 * m.s) % H + H) % H, xx = m.x * W + Math.sin(t + m.ph) * 8; x.strokeStyle = 'rgba(255,255,255,.45)'; x.lineWidth = 1.2; x.beginPath(); x.arc(xx, yy, 1.5 + m.s * 2, 0, 7); x.stroke(); }
    for (const f of fishes) { x.globalAlpha = f.free ? Math.min(1, f.free) : 0.5; fishShape(x, f.x, f.y, f.free ? 14 : 11, f.pal || [f.c, f.c, f.c, f.c, 'rgba(0,0,0,.25)'], Math.sign(f.v)); } x.globalAlpha = 1;
  } else if (th !== 'night') for (const c of clouds) cloudShape(c.x, c.y, c.s, th === 'sunset' ? 0.55 : 0.85);
  else for (const c of clouds) cloudShape(c.x, c.y, c.s * 0.9, 0.1);
  for (const s of streaks) { const a = Math.min(1, s.life) * 0.6; x.strokeStyle = `rgba(255,255,255,${a})`; x.lineWidth = 2.4; x.lineCap = 'round'; x.beginPath(); x.moveTo(s.x, s.y); x.quadraticCurveTo(s.x + s.l * 0.5 * Math.sign(wind), s.y - 6, s.x + s.l * Math.sign(wind), s.y); x.stroke(); }
  // gifts on the ground / falling
  for (const g of gifts) giftBox(g.x, g.y, 15, g.col, g.rot);
  for (const b of balloons) drawBalloon(b);
  drawHero();
  for (const s of strs) { x.save(); x.translate(s.x, s.y); x.rotate(s.rot); x.globalAlpha = Math.min(1, s.life); x.strokeStyle = s.col; x.lineWidth = 1.5; x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(6, s.len * 0.5, 0, s.len); x.stroke(); x.restore(); } x.globalAlpha = 1;
  for (const r of rings) { const k = 1 - r.life / r.max; x.strokeStyle = r.c; x.globalAlpha = 1 - k; x.lineWidth = 4 * (1 - k) + 1; x.beginPath(); x.arc(r.x, r.y, r.r * (0.6 + k * 0.9), 0, 7); x.stroke();
    x.lineWidth = 3; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r0 = r.r * (0.9 + k), r1 = r.r * (1.15 + k * 1.3); x.beginPath(); x.moveTo(r.x + Math.cos(a) * r0, r.y + Math.sin(a) * r0); x.lineTo(r.x + Math.cos(a) * r1, r.y + Math.sin(a) * r1); x.stroke(); } }
  x.globalAlpha = 1;
  MG.fx.draw(x);
  drawSign();
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineJoin = 'round';
  for (const p of pops) {
    const k = p.life / p.max, sc = k > 0.85 ? 1 + (k - 0.85) * 3 : 1;
    x.globalAlpha = Math.min(1, k * 2.5); x.font = F(p.size * sc); x.lineWidth = MG.big ? 6 : 5; x.strokeStyle = '#fff';
    const px = clamp(p.x, 60, W - 60), py = Math.max(SG().y + SG().h + 18, p.y);
    x.strokeText(p.t, px, py); x.fillStyle = p.c; x.fillText(p.t, px, py);
  }
  x.globalAlpha = 1;
}

// ---------- flow ----------
function setLevel(n) { level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; bgK = ''; }
const rest = MG.barButton('休息一下', () => menu());
function start(m, lv) {
  if (m) mode = m; if (lv) setLevel(lv);
  reset(); state = 'play'; MG.hide(); rest.show(false);
  const fresh = newsOf(LV).filter(k => NEWS[k] && !MG.store.get('balloon.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('balloon.seen.' + k, true));
    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function starsOf() { const s = MG.store.get('balloon.stars', {}); return s && typeof s === 'object' ? s : {}; }
function win() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  const st = misses <= 1 ? 3 : misses <= 4 ? 2 : 1;
  const all = starsOf(); const old = all[level] || 0; if (st > old) { all[level] = st; MG.store.set('balloon.stars', all); }
  let maxDone = 0; for (const k in all) maxDone = Math.max(maxDone, +k); MG.record('balloon', maxDone);
  const next = level < LEVELS.length ? LEVELS[level] : null;
  if (next) MG.store.set('balloon.pickLevel', level + 1);
  MG.fx.burst(W / 2, H * 0.45, { n: 60, colors: CONF, shape: 'star', speed: 340, up: 200, size: 7, life: 1.2 });
  setTimeout(() => {
    if (state !== 'over') return;
    MG.panel({
      title: `第 ${level} 關過關！`,
      html: `<div class="big">${'⭐'.repeat(st)}${'<span style="opacity:.25">⭐</span>'.repeat(3 - st)}</div><p>${THEME_E[LV.theme]} ${LV.name} 完成 ^_^${mode === 'timed' ? `　還剩 ${Math.ceil(left)} 秒` : `　用了 ${mmss(t)}`}</p>` +
        (st < 3 ? '<p>只戳對的氣球，就能拿到三顆星喔！</p>' : '') +
        (next ? `<p>下一關：${THEME_E[next.theme]} ${next.name}</p>` : '<p>全部過關了！你是氣球大王 🎈👑</p>'),
      buttons: [...(next ? [{ label: '下一關', on: () => start(null, level + 1) }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
    });
  }, 650);
}
function fail() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('over');
  MG.panel({
    title: '時間到！',
    html: `<div class="big">${prog} / ${goalOf()}</div><p>差一點點！再試一次吧</p><p>🐢 慢慢玩沒有時間限制喔</p>`,
    buttons: [{ label: '再試一次', on: () => start() }, { label: '🐢 慢慢玩這關', alt: true, on: () => { MG.store.set('balloon.pickMode', 'relax'); start('relax'); } }, { label: '選關卡', alt: true, on: menu }],
  });
}
function goalWords(L) {
  return { all: `戳破 ${L.goal} 個氣球`, color: '只戳木牌上的顏色', order: `照順序 1 → ${L.n}`, count: `數數看 ${L.rounds && L.rounds.join('、')}`, bunch: '找一樣多顆的那一串', gift: `接住 ${L.goal} 個禮物`, big: `戳破 ${L.goal} 個大氣球`, party: '全部戳破！' }[L.type];
}
function menu() {
  state = 'ready'; rest.show(false);
  const st = starsOf();
  MG.choose({
    id: 'balloon', title: '氣球砰砰',
    html: `<p>彩色氣球飄上來了！點一下就「砰」地破掉。看上面木牌的提示：🎨 找顏色、🔢 照 1、2、3 的順序、✋ 數數看、👀 找一樣多顆的一串、🎁 接禮物、💪 戳三下的大氣球，還有 💨 大風和 🫧 海底泡泡！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '不限時間・氣球飄比較慢' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '每一關有時間限制' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${n}（${THEME_E[LEVELS[n - 1].theme]} ${LEVELS[n - 1].name}：${goalWords(LEVELS[n - 1])}${st[n] ? ' ' + '⭐'.repeat(st[n]) : ''}）`, short: n => `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '用手指（或滑鼠）點氣球　接禮物時在下面左右拖，鍵盤也可以按 <kbd>←</kbd><kbd>→</kbd>',
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),
  });
}
setLevel(Math.min(MG.store.get('balloon.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) update(dt);
  else { t += dt; MG.fx.step(dt); for (const p of pops) { p.y -= 34 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0); }
  draw();
});

// ---------- hook for automated tests ----------
window.BALLOONT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get prog() { return prog; }, get goal() { return goalOf(); }, get type() { return LV.type; },
  get misses() { return misses; }, get next() { return next; }, get tN() { return tN; }, get tcol() { return tcol; }, get size() { return [W, H, land]; }, levels: LEVELS.length,
  balloons: () => balloons.map((b, i) => ({ i, id: b.id, kind: b.kind, x: b.x, y: b.y, col: b.col, num: b.num, k: b.k, gift: !!b.gift, valid: isValid(b) })),
  gifts: () => gifts.map(g => ({ x: g.x, y: g.y, landed: g.landed })), get hero() { return { x: hero.x, tx: hero.tx }; },
  start: (lv, m = 'relax') => start(m, lv), win: () => { if (state === 'play') startWin(); }, menu: () => menu(),
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play' && !MG.panelOpen()) update(dt); },
  tap(i) { const b = balloons[i]; if (b) tapBalloon(b, b.x, b.y); },
  // client coordinates of a balloon (for real touch / mouse input)
  toClient(i) { const b = balloons[i], rc = cv.getBoundingClientRect(), B = 3; const yy = b.kind === 'bunch' ? b.y : b.y; return { x: rc.left + B + b.x * (rc.width - 2 * B) / W, y: rc.top + B + yy * (rc.height - 2 * B) / H }; },
  logToClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  // one helpful move: tap a right balloon that is well on screen, or walk under a falling gift
  auto() {
    if (state !== 'play' || winT) return false;
    const fall = gifts.filter(g => !g.landed).sort((a, b) => b.y - a.y)[0];
    if (giftMode() && fall) hero.tx = clamp(fall.x, 30, W - 30);
    const ok = balloons.filter(b => isValid(b) && b.y < H - 40 && b.y > 90 && !b.pop);
    if (ok.length) { tapBalloon(ok[0], ok[0].x, ok[0].y); return true; }
    return false;
  },
};
</script>
