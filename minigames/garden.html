const newsOf = L => L.free ? ['free'] : ['basic', L.goal.basket && 'harvest', L.weeds && 'weeds', L.goal.pattern && (L.marks ? 'pattern' : 'picture'), L.bugs && 'bugs', L.goal.fly && 'fly', L.clouds && 'clouds', L.bees && 'bees', L.goal.giant && 'giant', L.night && 'night', L.frost && 'frost', L.goal.feed && 'feed', L.goal.make && 'make', L.rain && 'rain', L.goal.frog && 'frog'].filter(Boolean);

const seedOfTool = () => { const tl = tools[selTool]; return tl && (tl.kind === 'seed' ? tl.id : tl.kind === 'bag' ? freeSeed : null); };

// ---------- layout ----------
function layout() {
  land = W > H * 1.05;
  const ts = Math.min(1.2, MG.textScale);
  if (land) {
    const tw = Math.round(clamp(W * 0.12, 96, 150) * ts);

    L.gx = tw; L.gw = W - tw; L.gy = L.skyH; L.gh = H - L.skyH;
  } else {
    const th = Math.round(clamp(H * 0.115, 86, 124) * ts);
    L.tray = { x: 0, y: H - th, w: W, h: th }; L.skyH = Math.round(clamp(H * 0.17, 108, 196));
    L.gx = 0; L.gw = W; L.gy = L.skyH; L.gh = L.tray.y - L.skyH;
  }
  const cwid = Math.min(L.gw * (land ? 0.5 : 0.66), 420);
  L.card = { x: L.gx + 10, y: 8, w: cwid, h: L.skyH - 18 };
  L.sun = { x: L.gx + L.gw - L.skyH * 0.62, y: L.skyH * 0.42, r: L.skyH * 0.2 };
  const hvr = clamp(L.skyH * 0.16, 18, 30); L.hive = { x: L.gx + hvr * 2.6, y: L.gy + hvr * 1.6, r: hvr };
  placePlots(); placeTray(); placeScenery(); SPR.clear(); bgKey = '';
  hero.x = hero.tx = hero.hx; hero.y = hero.ty = hero.hy;
  if (L.pond) frogs.forEach((f, k) => { const a = TAU * k / frogs.length + 0.5; f.hx = L.pond.x + Math.cos(a) * L.pond.rx * 0.8; f.hy = L.pond.y + Math.sin(a) * L.pond.ry * 0.8 + L.cw * 0.04; if (f.state === 'bank') { f.x = f.hx; f.y = f.hy; } });
}
const heroR = () => clamp(L.cw * 0.19, 20, 40);
const visR = () => L.vis ? clamp(Math.min(L.vis.w * 0.2, L.vis.h * 0.3), 22, 56) : 30;
function placePlots() {
  const n = plots.length; if (!n) return;
  let ax = L.gx + 8, aw = L.gw - 16, ay = L.gy + 2, ah = L.gh - 8;
  L.vis = null; L.pond = null; L.beds = null;
  if (LV.free) { ax += aw * 0.05; aw *= 0.9; ah *= 0.8; }
  const G = LV.goal || {};

    else { const rh = clamp(ah * 0.25, 110, 220); L.vis = { x: ax + aw * 0.5, y: ay + ah - 4, w: aw, h: rh }; ah -= rh; }
  }
  if (LV.lay === 'ring' || LV.lay === 'arc') { curveLayout(ax, ay, aw, ah, LV.lay === 'ring'); return; }
  const ASP = 1.1, rowsL = LV.lay === 'rows';
  let best = null;
  for (let cols = 1; cols <= n; cols++) { const rows = Math.ceil(n / cols), cw = Math.min(aw / cols, ah / rows / ASP); if (!best || cw > best.cw + 0.5) best = { cols, rows, cw }; }
  let cw = Math.min(best.cw, 270);
  if (LV.goal && LV.goal.giant) cw = Math.min(aw * 0.78, ah / ASP * 0.92, 420);
  const ch = cw * ASP, rows = best.rows, cols = best.cols;
