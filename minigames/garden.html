<script>
'use strict';
MG.init({ id: 'garden', title: '噗噗小花園', stats: ['level', 'goal'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, sat = v => clamp(v, 0, 1);
const lerp = (a, b, k) => a + (b - a) * k, ease = k => k * k * (3 - 2 * k), TAU = Math.PI * 2;
let W = 400, H = 700, land = false, t = 0;

// ---------- colours ----------
const MIXC = new Map();
function rgb(h) { h = h.replace('#', ''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) {
  k = Math.round(sat(k) * 40) / 40; const key = a + b + k; let v = MIXC.get(key); if (v) return v;
  const A = rgb(a), B = rgb(b); v = '#' + A.map((q, i) => Math.round(lerp(q, B[i], k)).toString(16).padStart(2, '0')).join(''); MIXC.set(key, v); return v;
}
const dark = (c, k = 0.45) => mix(c, '#3a2214', k), light = (c, k = 0.5) => mix(c, '#ffffff', k);
const FC = { r: '#ff5a6e', o: '#ff9a3c', y: '#ffd23f', p: '#ff8fc8', v: '#a77cf2', b: '#5aa8ff', w: '#fdfbff' };
const outOf = c => c === FC.w ? '#a99cc4' : dark(c);
const LEAF = ['#9be37a', '#5cc85a', '#2f8a3c'];          // light, mid, outline

// ---------- seeds, plants ----------
const SEEDS = {};
for (const c of 'roypvbw') SEEDS['tulip-' + c] = { t: 'tulip', c };
SEEDS.sun = { t: 'sun', c: 'y' }; SEEDS.moon = { t: 'moon', c: 'w' };
for (const k of ['carrot', 'cabbage', 'tomato', 'straw', 'pumpkin', 'melon', 'apple']) SEEDS[k] = { t: k };
const ALL_SEEDS = Object.keys(SEEDS);
const FLOWERS = new Set(['tulip', 'sun', 'moon']);
const FRUITS = { tomato: 3, straw: 3, apple: 4 };               // picked: the plant grows new ones
const NEEDS_BEE = new Set(['tomato', 'straw', 'pumpkin', 'melon', 'apple']);
const PACK = { carrot: '#ff9a3c', cabbage: '#6cc85a', tomato: '#ff5a5a', straw: '#ff6f8f', pumpkin: '#ff9a2e', melon: '#3fb35e', apple: '#ef4f4f', sun: '#ffc12e', moon: '#8f9cff' };
const FRP = { tomato: [[-0.13, -0.3], [0.11, -0.42], [-0.05, -0.53]], straw: [[-0.2, -0.05], [0.19, -0.07], [0.02, -0.13]], apple: [[-0.15, -0.52], [0.14, -0.58], [-0.02, -0.7], [0.19, -0.44]], pumpkin: [[0.03, -0.02]], melon: [[0.02, -0.03]] };
const BEE_CAP = 0.78, WET = 1 / 4.2, DRY = 1 / 24;

// ---------- levels (append only) ----------
// goal: bloom n · pattern (string of tulip colours, or seed ids) · basket {kind: n} · giant size · fly n butterflies
// flags: weeds, bugs, clouds, bees, night, frost, marks (pattern flags in front of the plots)
const LEVELS = [
  { name: '我的花園', free: true, th: 'home', mk: '🏡' },
  { name: '三朵小花', th: 'spring', n: 3, seeds: ['tulip-r'], goal: { bloom: 3 }, mk: '🌷' },
  { name: '紅花黃花', th: 'spring', n: 4, seeds: ['tulip-r', 'tulip-y'], goal: { bloom: 4 } },
  { name: '第一籃蘿蔔', th: 'spring', n: 4, seeds: ['carrot'], goal: { basket: { carrot: 6 } }, mk: '🥕' },
  { name: '拔拔雜草', th: 'spring', n: 4, seeds: ['tulip-p', 'tulip-y'], goal: { bloom: 4 }, weeds: 1, mk: '🌿' },
  { name: '顏色排排站', th: 'spring', n: 4, seeds: ['tulip-r', 'tulip-y'], goal: { pattern: 'ryry' }, marks: 1, mk: '🎨' },
  { name: '趕走小蟲', th: 'spring', n: 3, seeds: ['tomato'], goal: { basket: { tomato: 9 } }, bugs: 1, mk: '🐛' },
  { name: '蝴蝶來了', th: 'spring', n: 4, seeds: ['tulip-r', 'tulip-y', 'tulip-v'], goal: { fly: 4 }, mk: '🦋' },
  { name: '雲朵走開', th: 'summer', n: 4, seeds: ['sun'], goal: { bloom: 4 }, clouds: 1, mk: '☁️' },
  { name: '蜜蜂幫忙', th: 'summer', n: 4, seeds: ['straw'], goal: { basket: { straw: 9 } }, bees: 1, mk: '🐝' },
  { name: '夏天西瓜', th: 'summer', n: 4, seeds: ['melon', 'straw'], goal: { basket: { melon: 3, straw: 6 } }, mk: '🍉' },
  { name: '大南瓜', th: 'autumn', n: 1, seeds: ['pumpkin'], goal: { giant: 2.2 }, mk: '🎃' },
  { name: '彩虹花圃', th: 'spring', n: 5, seeds: ['tulip-r', 'tulip-o', 'tulip-y', 'tulip-b', 'tulip-v'], goal: { pattern: 'roybv' }, marks: 1, mk: '🌈' },
  { name: '螢火蟲之夜', th: 'night', n: 4, seeds: ['moon'], goal: { bloom: 4 }, night: 1, mk: '🌙' },
  { name: '秋天蘋果', th: 'autumn', n: 3, seeds: ['apple'], goal: { basket: { apple: 8 } }, bugs: 1, mk: '🍎' },
  { name: '冬天溫室', th: 'winter', n: 4, seeds: ['tulip-p', 'tulip-w'], goal: { bloom: 4 }, frost: 1, mk: '❄️' },
  { name: '看圖種花', th: 'spring', n: 4, seeds: ['tulip-r', 'tulip-y', 'tulip-b'], goal: { pattern: 'ybbr' }, mk: '🖼️' },
  { name: '蝴蝶花園', th: 'summer', n: 5, seeds: ['tulip-r', 'tulip-p', 'tulip-y', 'tulip-v'], goal: { fly: 6 }, clouds: 1, mk: '🦋' },
  { name: '夏日大豐收', th: 'summer', n: 6, seeds: ['tomato', 'straw', 'melon'], goal: { basket: { tomato: 6, straw: 6, melon: 2 } }, bees: 1, weeds: 1, mk: '🧺' },
  { name: '溫室蔬菜', th: 'winter', n: 4, seeds: ['carrot', 'cabbage'], goal: { basket: { carrot: 3, cabbage: 2 } }, frost: 1, bugs: 1, mk: '❄️' },
  { name: '月光花排排', th: 'night', n: 4, seeds: ['moon', 'tulip-p'], goal: { pattern: ['moon', 'tulip-p', 'tulip-p', 'moon'] }, night: 1, mk: '🌙' },
  { name: '超級大南瓜', th: 'autumn', n: 1, seeds: ['pumpkin'], goal: { giant: 3 }, bugs: 1, weeds: 1, clouds: 1, mk: '🎃' },
  { name: '螢火蟲菜園', th: 'night', n: 4, seeds: ['carrot', 'cabbage'], goal: { basket: { carrot: 2, cabbage: 2 } }, night: 1, weeds: 1, mk: '🌙' },
  { name: '南瓜和蘋果', th: 'autumn', n: 4, seeds: ['pumpkin', 'apple'], goal: { basket: { pumpkin: 2, apple: 4 } }, bees: 1, bugs: 1, mk: '🐝' },
  { name: '春天大花圃', th: 'spring', n: 6, seeds: ['tulip-r', 'tulip-y', 'tulip-p'], goal: { pattern: 'ryppyr' }, weeds: 1, bugs: 1, mk: '🖼️' },
  { name: '冰雪花窗', th: 'winter', n: 5, seeds: ['tulip-b', 'tulip-w', 'tulip-v'], goal: { pattern: 'bwvwb' }, marks: 1, frost: 1, mk: '❄️' },
  { name: '花園大挑戰', th: 'summer', n: 6, seeds: ['tomato', 'carrot', 'straw'], goal: { basket: { tomato: 6, carrot: 3, straw: 6 } }, bees: 1, weeds: 1, bugs: 1, clouds: 1, mk: '🏆' },
];
const THEME_E = { home: '🏡', spring: '🌸', summer: '☀️', autumn: '🍂', winter: '❄️', night: '🌙' };
const patOf = L => !L.goal || !L.goal.pattern ? null : typeof L.goal.pattern === 'string' ? [...L.goal.pattern].map(c => 'tulip-' + c) : L.goal.pattern;
const NEWS = {
  basic: ['🌱 種花', '點下面的<b>種子包</b>，再點一下土，就會種下種子。<br>拿<b>澆水壺</b>在小芽上面滑一滑，有喝水的植物會長得<b>超快</b>！'],
  harvest: ['🧺 採收', '蔬菜水果長大了會閃閃發亮，<b>點一下</b>就會飛進籃子裡。看看上面的紙條要收幾個！'],
  weeds: ['🌿 雜草', '雜草會讓植物長得很慢。<b>點一下雜草</b>就能把它拔起來！'],
  pattern: ['🎨 排顏色', '照著紙條上的顏色種花，每塊土前面的<b>小旗子</b>會告訴你要種什麼顏色。種錯了沒關係，拿別的種子包再點一次就能重種！'],
  picture: ['🖼️ 看圖種花', '這次沒有小旗子了！看看紙條上的圖，<b>照一樣的位置</b>種出一樣的花。種錯了換一包種子再點一次就好。'],
  bugs: ['🐛 小蟲蟲', '毛毛蟲和蝸牛會來偷吃葉子，被吃的時候植物就不長了。<b>點一下</b>請牠們去別的地方玩！'],
  fly: ['🦋 蝴蝶', '蝴蝶喜歡和自己<b>一樣顏色</b>的花。種出蝴蝶想要的花，牠就會飛下來停在上面！'],
  clouds: ['☁️ 雲朵', '雲朵擋住太陽的時候，植物就不長了。<b>點一下雲朵</b>把它吹走！'],
  bees: ['🐝 蜜蜂', '水果要先開花，再請蜜蜂幫忙才會結果。花上面出現 🐝 泡泡時，把<b>蜜蜂拖到花上</b>，或是點一下那朵花！'],
  giant: ['🎃 大南瓜', '先種出南瓜，再<b>一直澆水</b>讓它越長越大，長到旁邊尺上的 ⭐ 就成功了！'],
  night: ['🌙 晚上的花園', '晚上太暗了，植物不會長。<b>點一下螢火蟲</b>或植物，螢火蟲就會飛過去幫忙照亮！'],
  frost: ['❄️ 冬天溫室', '溫室的玻璃結霜了，太陽照不進來。用手指在霜上<b>擦一擦</b>，擦乾淨植物才會長大！'],
  free: ['🏡 我的花園', '這是你自己的花園！想種什麼就種什麼，還可以放上小矮人、小椅子、路燈……<b>拖一拖</b>可以移動裝飾，拖回下面的櫃子就收起來。花園會自動記住喔！'],
};
const newsOf = L => L.free ? ['free'] : ['basic', L.goal.basket && 'harvest', L.weeds && 'weeds', L.goal.pattern && (L.marks ? 'pattern' : 'picture'), L.bugs && 'bugs', L.goal.fly && 'fly', L.clouds && 'clouds', L.bees && 'bees', L.goal.giant && 'giant', L.night && 'night', L.frost && 'frost'].filter(Boolean);
const DECOS = ['gnome', 'bath', 'bench', 'lamp', 'mush', 'pin', 'scare', 'bunny'];

// ---------- state ----------
let level = 1, LV = LEVELS[1], state = 'menu';
let plots = [], tools = [], selTool = 0, got = {}, flyN = 0, shadeK = 0, idle = 0, goalZoom = 0, winT = 0, wrongT = 0;
let bugs = [], clouds = [], bflies = [], bees = [], ffs = [], drops = [], amb = [], floats = [], flyers = [], decos = [], hint = null;
let weedT = 0, bugT = 0, cloudT = 0, bflyT = 0, saveT = 0, waterSnd = 0, wipeSnd = 0, freeSeed = 'tulip-r', freeDeco = 'gnome', freeHarvest = 0;
let picker = null, ptr = null, heroMood = { m: 'happy', t: 0 }, heroHop = 0;
const L = { tray: { x: 0, y: 0, w: 0, h: 0 }, card: {}, sun: {}, skyH: 100, gx: 0, gy: 0, gw: 0, gh: 0, cw: 100, rows: 1, cols: 1, hero: {}, hive: {} };
const isTask = () => !LV.free;
const seedOfTool = () => { const tl = tools[selTool]; return tl && (tl.kind === 'seed' ? tl.id : tl.kind === 'bag' ? freeSeed : null); };

function newPlot(i) { return { i, seed: null, t: null, c: null, g: 0, w: 0, pol: false, weed: null, frost: 0, frostT: 0, bounce: 0, lit: 0, sz: 1, shake: 0, nib: 0, cx: 0, cy: 0, s: 100, row: 0, col: 0, bub: 0 }; }

// ---------- layout ----------
function layout() {
  land = W > H * 1.05;
  const ts = Math.min(1.2, MG.textScale);
  if (land) {
    const tw = Math.round(clamp(W * 0.12, 96, 150) * ts);
    L.tray = { x: 0, y: 0, w: tw, h: H }; L.skyH = Math.round(clamp(H * 0.2, 96, 168));
    L.gx = tw; L.gw = W - tw; L.gy = L.skyH; L.gh = H - L.skyH;
  } else {
    const th = Math.round(clamp(H * 0.115, 86, 124) * ts);
    L.tray = { x: 0, y: H - th, w: W, h: th }; L.skyH = Math.round(clamp(H * 0.17, 108, 196));
    L.gx = 0; L.gw = W; L.gy = L.skyH; L.gh = L.tray.y - L.skyH;
  }
  const cwid = Math.min(L.gw * (land ? 0.5 : 0.66), 420);
  L.card = { x: L.gx + 10, y: 8, w: cwid, h: L.skyH - 18 };
  L.sun = { x: L.gx + L.gw - L.skyH * 0.62, y: L.skyH * 0.42, r: L.skyH * 0.2 };
  const hr = clamp(L.skyH * 0.19, 20, 34);
  L.hero = { x: L.gx + L.gw - hr * 1.35, y: L.gy - hr * 0.35, r: hr };
  const hvr = clamp(L.skyH * 0.16, 18, 30); L.hive = { x: L.gx + hvr * 2.6, y: L.gy + hvr * 1.6, r: hvr };
  placePlots(); placeTray(); bgKey = '';
}
function placePlots() {
  const n = plots.length; if (!n) return;
  let ax = L.gx + 8, aw = L.gw - 16, ay = L.gy + 2, ah = L.gh - 8;
  if (LV.free) { ax += aw * 0.05; aw *= 0.9; ah *= 0.8; }
  const ASP = 1.1;
  let best = null;
  for (let cols = 1; cols <= n; cols++) { const rows = Math.ceil(n / cols), cw = Math.min(aw / cols, ah / rows / ASP); if (!best || cw > best.cw + 0.5) best = { cols, rows, cw }; }
  let cw = Math.min(best.cw, 270);
  if (LV.goal && LV.goal.giant) cw = Math.min(aw * 0.78, ah / ASP * 0.92, 420);
  const ch = cw * ASP, rows = best.rows, cols = best.cols;
  L.cw = cw; L.rows = rows; L.cols = cols;
  // spread the grid over the free room (gaps between rows / columns) so the garden fills the screen
  const gy2 = Math.min(ch * 0.4, (ah - rows * ch) / (rows + 1)), gx2 = Math.min(cw * 0.5, (aw - cols * cw) / (cols + 1));
  const y0 = ay + (ah - rows * ch - (rows - 1) * gy2) / 2;
  let i = 0;
  for (let r = 0; r < rows; r++) {
    const cnt = Math.min(cols, n - r * cols), x0 = ax + (aw - cnt * cw - (cnt - 1) * gx2) / 2;
    for (let c = 0; c < cnt; c++, i++) { const P = plots[i]; P.row = r; P.col = c + (cols - cnt) / 2; P.cx = x0 + c * (cw + gx2) + cw / 2; P.cy = y0 + r * (ch + gy2) + ch * 0.82; P.s = cw; P.w2 = cw * 0.4; P.h2 = cw * 0.12; }
  }
}
function placeTray() {
  const T = L.tray, n = tools.length, gap = 8;
  if (land) {
    const b = Math.min(T.w - 18, (H - 24 - gap * (n - 1)) / n, 116), tot = n * b + (n - 1) * gap, y0 = (H - tot) / 2;
    tools.forEach((tl, k) => Object.assign(tl, { x: (T.w - b) / 2, y: y0 + k * (b + gap), w: b, h: b }));
  } else {
    const b = Math.min(T.h - 18, (W - 20 - gap * (n - 1)) / n, 112), tot = n * b + (n - 1) * gap, x0 = (W - tot) / 2;
    tools.forEach((tl, k) => Object.assign(tl, { x: x0 + k * (b + gap), y: T.y + (T.h - b) / 2 + 2, w: b, h: b }));
  }
}
MG.fit(cv, (sw, sh) => {
  const cs = getComputedStyle(cv.parentElement);
  W = Math.max(300, Math.round(sw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 6));
  H = Math.max(300, Math.round(sh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 6));
  return [W, H];
});
cv.onfit = () => layout();
addEventListener('mg-big', () => layout());

// ---------- level flow ----------
function cleared() { const c = MG.store.get('garden.clear', []); return Array.isArray(c) ? c : []; }
function setLevel(n) {
  if (LV && LV.free && plots.length) saveFree();
  level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1];
  bugs = []; clouds = []; bflies = []; bees = []; ffs = []; drops = []; amb = []; floats = []; flyers = []; hint = null; picker = null; ptr = null;
  got = {}; flyN = 0; shadeK = 0; idle = 0; winT = 0; wrongT = 0; MG.fx.clear();
  weedT = 5; bugT = 6; cloudT = 3; bflyT = 1.5;
  if (LV.free) {
    const S = MG.store.get('garden.free', null);
    plots = Array.from({ length: 8 }, (_, i) => newPlot(i)); decos = []; freeHarvest = 0;
    if (S && Array.isArray(S.plots)) {
      S.plots.slice(0, 8).forEach((q, i) => { if (q && q.s && SEEDS[q.s]) { const P = plots[i]; P.seed = q.s; P.t = SEEDS[q.s].t; P.c = SEEDS[q.s].c || null; P.g = clamp(+q.g || 0, 0, 1); P.w = clamp(+q.w || 0, 0, 1); P.pol = true; } });
      if (Array.isArray(S.decos)) decos = S.decos.filter(d => d && DECOS.includes(d.k)).slice(0, 24).map(d => ({ k: d.k, u: clamp(+d.u || 0, 0, 1), v: clamp(+d.v || 0, 0, 1) }));
      freeHarvest = S.harvest | 0; if (S.seed && SEEDS[S.seed]) freeSeed = S.seed; if (DECOS.includes(S.deco)) freeDeco = S.deco;
    } else decos = [{ k: 'gnome', u: 0.14, v: 0.93 }, { k: 'bench', u: 0.5, v: 0.95 }, { k: 'mush', u: 0.86, v: 0.92 }];   // a brand-new garden starts with a few friends
    tools = [{ kind: 'bag' }, { kind: 'can' }, { kind: 'deco' }];
  } else {
    plots = Array.from({ length: LV.n }, (_, i) => newPlot(i)); decos = [];
    tools = LV.seeds.map(id => ({ kind: 'seed', id })).concat([{ kind: 'can' }]);
  }
  selTool = 0;
  if (LV.frost) plots.forEach(P => P.frost = 1);
  if (LV.bees) for (let k = 0; k < 2; k++) bees.push({ k, x: 0, y: 0, state: 'home', plot: -1, ph: k * 3 });
  if (LV.night) for (let k = 0; k < 5; k++) ffs.push({ k, x: 0.2 + Math.random() * 0.6, y: 0.2 + Math.random() * 0.6, rx: 0, ry: 0, state: 'wander', plot: -1, tm: 0, ph: Math.random() * 6, vx: 0, vy: 0, init: false });
  layout();
  for (const f of ffs) { f.rx = L.gx + f.x * L.gw; f.ry = L.gy + f.y * L.gh; }
  hud();
}
function startLevel(n) {
  setLevel(n); state = 'play'; MG.hide(); goalZoom = LV.free ? 0 : 2.1; heroMood = { m: 'wow', t: 1 };
  MG.sfx('whoosh');
  const fresh = newsOf(LV).filter(k => !MG.store.get('garden.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('garden.seen.' + k, true));
    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function goalText() {
  const G = LV.goal;
  if (LV.free) return `🧺 ${freeHarvest}`;
  if (G.bloom) return `🌷 ${Math.min(G.bloom, bloomCount())}/${G.bloom}`;
  if (G.pattern) return `🎨 ${patternDone()}/${plots.length}`;
  if (G.basket) { let a = 0, b = 0; for (const k in G.basket) { a += Math.min(G.basket[k], got[k] || 0); b += G.basket[k]; } return `🧺 ${a}/${b}`; }
  if (G.giant) return `🎃 ${Math.min(100, Math.round(giantProg() * 100))}%`;
  if (G.fly) return `🦋 ${Math.min(G.fly, flyN)}/${G.fly}`;
  return '';
}
function hud() { MG.stat('level', LV.free ? '🏡' : `第 ${level} 關`); MG.stat('goal', goalText()); }
const bloomCount = () => plots.filter(P => P.t && FLOWERS.has(P.t) && P.g >= 1).length;
function patternDone() { const pat = patOf(LV); return plots.filter((P, i) => P.seed === pat[i] && P.g >= 1).length; }
function giantProg() { const P = plots[0]; if (!P || P.t !== 'pumpkin') return 0; return P.g < 1 ? P.g * 0.25 : 0.25 + 0.75 * sat((P.sz - 1) / (LV.goal.giant - 1)); }
function goalMet() {
  const G = LV.goal; if (!G) return false;
  if (G.bloom) return bloomCount() >= G.bloom;
  if (G.pattern) return patternDone() === plots.length;
  if (G.basket) return !flyers.length && Object.keys(G.basket).every(k => (got[k] || 0) >= G.basket[k]);
  if (G.giant) return plots[0].t === 'pumpkin' && plots[0].g >= 1 && plots[0].sz >= G.giant;
  if (G.fly) return flyN >= G.fly;
  return false;
}

}

// ---------- free garden memory ----------
function saveFree() {
  if (!LV.free) return;
  MG.store.set('garden.free', { plots: plots.map(P => P.seed ? { s: P.seed, g: +P.g.toFixed(3), w: +P.w.toFixed(2) } : null), decos: decos.map(d => ({ k: d.k, u: +d.u.toFixed(4), v: +d.v.toFixed(4) })), harvest: freeHarvest, seed: freeSeed, deco: freeDeco });
}
addEventListener('pagehide', () => saveFree());
document.addEventListener('visibilitychange', () => { if (document.hidden) saveFree(); });

// ---------- actions ----------
function say(px, py, text, col = '#ff6a00', big = 1) { floats.push({ x: px, y: py, text, col, life: 1.3, big }); if (floats.length > 8) floats.shift(); }
function hop(m = 'wow', d = 1) { heroMood = { m, t: d }; heroHop = 1; }
function selectTool(k) {
  if (k < 0 || k >= tools.length) return;
  const tl = tools[k];
  if (tl.kind === 'bag' && selTool === k) { openPicker('seed'); return; }
  if (tl.kind === 'deco') { openPicker('deco'); selTool = k; return; }

}
function plantAt(P, id, isDown) {
  if (!id || state !== 'play') return false;
  if (P.weed && P.weed.k > 0.3) { if (isDown) pullWeed(P); return false; }
  if (P.seed === id) return false;
  if (P.seed && !isDown) return false;
  const dug = !!P.seed;
  P.seed = id; P.t = SEEDS[id].t; P.c = SEEDS[id].c || null; P.g = 0.001; P.pol = false; P.sz = 1; P.bounce = 1; P.lit = Math.min(P.lit, 0);
  MG.sfx(dug ? 'whoosh' : 'place'); MG.sfx('pop');
  MG.fx.burst(P.cx, P.cy - P.h2 * 0.2, { n: dug ? 16 : 9, colors: ['#8a5a34', '#a8774a', '#6b4426'], speed: dug ? 170 : 110, up: 110, size: 3.5, shape: 'sq', life: 0.55 });
  if (dug) say(P.cx, P.cy - P.s * 0.5, 'New! 🌱', '#2f8a48');
  if (isTask() && plots.every(Q => Q.seed) && tools[selTool].kind === 'seed' && !LV.goal.pattern && !LV.goal.fly) {   // everything planted: hand over the watering can
    const ci = tools.findIndex(tl => tl.kind === 'can'); if (ci >= 0) { selTool = ci; tools[ci].pop = 1.4; }
  }

}
function pullWeed(P) {
  if (!P.weed) return;
  const wp = weedPos(P);
  P.weed = null; MG.sfx('boing'); MG.sfx('pop');
  MG.fx.burst(wp.x, wp.y, { n: 12, colors: ['#8a5a34', '#6a9a3a', '#a8774a'], speed: 160, up: 140, size: 3.5, shape: 'sq', life: 0.6 });
  amb.push({ kind: 'weedfly', x: wp.x, y: wp.y, vx: MG.rand(-90, 90), vy: -320, rot: 0, vr: MG.rand(-8, 8), s: P.s, life: 1.4 });
  say(wp.x, wp.y - P.s * 0.25, MG.praise(MG.randi(1, 3)), '#2f8a48');
}
function harvest(P) {
  if (!ripe(P)) return;
  const kind = P.t, pts = fruitPts(P, 1), n = FRUITS[kind] || 1;
  for (let k = 0; k < n; k++) { const q = pts[k] || { x: P.cx, y: P.cy - P.s * 0.15 }; flyers.push({ kind, x0: q.x, y0: q.y, t: -k * 0.12, dur: 0.75, r: P.s * 0.07 }); }
  if (FRUITS[kind]) { P.g = 0.6; P.pol = false; }
  else { P.seed = null; P.t = null; P.c = null; P.g = 0; P.sz = 1; }
  P.bounce = 1; MG.sfx('coin'); MG.sfx('pop'); hop('wow', 0.8);
  MG.fx.burst(P.cx, P.cy - P.s * 0.25, { n: 14, colors: ['#ffd23f', '#fff3a0', '#fff'], shape: 'star', speed: 180, up: 120, size: 5, life: 0.7 });
  say(P.cx, P.cy - P.s * 0.55, n > 1 ? `+${n} ✨` : MG.praise(MG.randi(2, 4)), '#e07a00');
}
function shoo(b) {
  if (b.state === 'fly') return;
  b.state = 'fly'; b.vx = (b.x < L.gx + L.gw / 2 ? -1 : 1) * 160; b.vy = -380; MG.sfx('boing'); MG.sfx('whoosh');
  MG.fx.burst(b.x, b.y, { n: 10, colors: ['#ffd23f', '#fff'], shape: 'star', speed: 150, up: 90, size: 4, life: 0.5 });
  say(b.x, b.y - 40, 'Bye bye! 👋', '#3d8bff');
}
function blowCloud(c) {
  if (c.state === 'out') return;
  c.state = 'out'; c.vx = -900; c.vy = -60; MG.sfx('whoosh'); MG.sfx('good'); cloudT = MG.rand(6, 9);
  say(c.x, c.y + 30, 'Whoosh! 💨', '#3d8bff');
}
function pollinate(P, bee) {
  if (P.pol) return;
  P.pol = true; P.bounce = 1; MG.sfx('perfect'); MG.sfx('sparkle'); hop('wow', 0.6);
  const f = flowerPt(P); MG.fx.burst(f.x, f.y, { n: 16, colors: ['#ffd23f', '#fff7a0', '#fff'], shape: 'star', speed: 160, up: 80, size: 4.5, life: 0.7 });
  say(f.x, f.y - 30, 'Buzz! 🐝', '#e09a00');
  if (bee) { bee.state = 'back'; bee.plot = -1; }
}
function callBee(P) {
  if (!needsBee(P) || bees.some(b => b.plot === P.i)) return;
  const b = bees.find(b => b.state === 'home'); if (!b) return;
  b.state = 'go'; b.plot = P.i; MG.sfx('flip');
}
function callFirefly(P) {
  if (!LV.night || !P.t || P.lit > 0 || ffs.some(f => f.plot === P.i)) return false;
  let best = null, bd = 1e9;
  for (const f of ffs) if (f.state === 'wander') { const d = Math.hypot(f.rx - P.cx, f.ry - P.cy); if (d < bd) { bd = d; best = f; } }
  if (!best) best = ffs.slice().sort((a, b) => a.tm - b.tm)[0];
  if (!best) return false;
  if (best.plot >= 0) plots[best.plot].lit = 0;
  best.state = 'go'; best.plot = P.i; best.tm = 0; MG.sfx('perfect'); return true;
}
function sendFirefly(f) {
  const cand = plots.filter(P => P.t && P.lit <= 0 && !ffs.some(q => q.plot === P.i));
  const pool = cand.length ? cand : plots.filter(P => !ffs.some(q => q.plot === P.i));
  if (!pool.length) { MG.sfx('sparkle'); return; }
  pool.sort((a, b) => Math.hypot(a.cx - f.rx, a.cy - f.ry) - Math.hypot(b.cx - f.rx, b.cy - f.ry));
  if (f.plot >= 0) plots[f.plot].lit = 0;
  f.state = 'go'; f.plot = pool[0].i; f.tm = 0; MG.sfx('perfect'); MG.sfx('sparkle');
}
function wipe(P, amt) {
  if (P.frost <= 0) return;
  const was = P.frost; P.frost = Math.max(0, P.frost - amt); P.frostT = 0;
  wipeSnd -= amt; if (wipeSnd < 0) { MG.sfx('tick'); wipeSnd = 0.12; }
  if (Math.random() < amt * 3) MG.fx.burst(P.cx + MG.rand(-P.w2, P.w2), P.cy - P.s * MG.rand(0.2, 0.6), { n: 2, colors: ['#ffffff', '#cfeaff'], speed: 60, up: 20, size: 2.5, life: 0.5 });
  if (was > 0.3 && P.frost <= 0.3) { MG.sfx('sparkle'); say(P.cx, P.cy - P.s * 0.6, 'Shiny! ✨', '#3d8bff'); }
}
function placeDeco(p) {
  if (decos.length >= 24) { MG.toast('🈵'); return; }
  decos.push({ k: freeDeco, u: sat((p.x - L.gx) / L.gw), v: sat((p.y - L.gy) / L.gh), pop: 1 });
  MG.sfx('place'); MG.sfx('pop'); MG.fx.burst(p.x, p.y, { n: 10, colors: ['#ffd23f', '#fff'], shape: 'star', speed: 140, up: 80, size: 4, life: 0.5 }); saveFree();
}

// ---------- queries ----------
const ripe = P => P.t && !FLOWERS.has(P.t) && P.g >= 1 && !(LV.goal && LV.goal.giant);
const needsBee = P => LV.bees && P.t && NEEDS_BEE.has(P.t) && !P.pol && P.g >= BEE_CAP - 0.002;
const bugOn = P => bugs.some(b => b.plot === P.i && b.state === 'eat');
const thirsty = P => P.t && P.w <= 0.02 && (P.g < 1 || (LV.goal && LV.goal.giant)) && !needsBee(P);
function plantH(P) {
  const p = sat((P.g - 0.12) / 0.88), e = ease(sat(p / 0.75));
  switch (P.t) {
    case 'tulip': case 'moon': return 0.12 + 0.48 * e;
    case 'sun': return 0.16 + 0.62 * e;
    case 'carrot': return 0.08 + 0.32 * e;
    case 'cabbage': return 0.08 + 0.24 * e;
    case 'tomato': return 0.12 + 0.56 * e;
    case 'straw': return 0.08 + 0.22 * e;
    case 'pumpkin': return 0.08 + Math.max(0.18 * e, 0.24 * (P.sz || 1) * sat((p - 0.75) / 0.25));
    case 'melon': return 0.08 + 0.18 * e;
    case 'apple': return 0.14 + 0.66 * e;
  }
  return 0.1;
}
function flowerPt(P) {
  const s = P.s, by = P.cy - P.h2 * 0.15;
  if (FLOWERS.has(P.t)) return { x: P.cx + sway(P) * s * 0.3, y: by - s * (plantH(P) - 0.08) };
  const f = (FRP[P.t] || [[0, -0.2]])[0]; return { x: P.cx + f[0] * s, y: by + f[1] * s - s * 0.03 };
}
function fruitPts(P, sc = 1) {
  const s = P.s, by = P.cy - P.h2 * 0.15;
  if (FRP[P.t]) return FRP[P.t].map(([fx, fy]) => ({ x: P.cx + fx * s * sc, y: by + fy * s * sc }));
  return [{ x: P.cx, y: by - s * 0.06 }];
}
function weedPos(P) { return { x: P.cx + P.w2 * 0.62 * (P.i % 2 ? -1 : 1), y: P.cy + P.h2 * 0.15 }; }
const sway = P => Math.sin(t * 1.4 + P.i * 1.7) * 0.05;
function plotAt(p) {
  let best = -1, bd = 1e9;
  for (const P of plots) {
    const dx = Math.abs(p.x - P.cx), top = P.cy - P.s * 0.86, bot = P.cy + P.h2 * 1.6;
    if (dx < P.s * 0.5 && p.y > top && p.y < bot) { const d = dx + Math.abs(p.y - (P.cy - P.s * 0.25)) * 0.3; if (d < bd) { bd = d; best = P.i; } }
  }
  return best;
}
function trayHit(p) { return tools.findIndex(tl => p.x >= tl.x - 4 && p.x <= tl.x + tl.w + 4 && p.y >= tl.y - 4 && p.y <= tl.y + tl.h + 4); }
const inTray = p => p.x >= L.tray.x && p.x <= L.tray.x + L.tray.w && p.y >= L.tray.y && p.y <= L.tray.y + L.tray.h;
const near = (a, bx, by, r) => Math.hypot(a.x - bx, a.y - by) < r;
const hitR = () => Math.max(34, L.cw * 0.22);
function decoXY(d) { return { x: L.gx + d.u * L.gw, y: L.gy + d.v * L.gh }; }
const decoS = () => clamp(L.cw * 0.42, 40, 84);
function decoHit(p) { const s = decoS(); for (let i = decos.length - 1; i >= 0; i--) { const q = decoXY(decos[i]); if (Math.abs(p.x - q.x) < s * 0.55 && p.y < q.y + s * 0.15 && p.y > q.y - s * 1.05) return decos[i]; } return null; }

// ---------- input ----------
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  if (ptr && ptr.id !== e.pointerId) return;
  const p = cv.logical(e); idle = 0; hint = null;
  ptr = { id: e.pointerId, x: p.x, y: p.y, mode: down(p), d: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch {}
});
cv.addEventListener('pointermove', e => {
  if (!ptr || ptr.id !== e.pointerId || state !== 'play') return;
  const p = cv.logical(e), d = Math.hypot(p.x - ptr.x, p.y - ptr.y); ptr.d += d; idle = 0;
  move(p, d); ptr.x = p.x; ptr.y = p.y;
});
const upFn = e => { if (!ptr || ptr.id !== e.pointerId) return; up(ptr); ptr = null; };
cv.addEventListener('pointerup', upFn); cv.addEventListener('pointercancel', upFn);
addEventListener('keydown', e => { if (state !== 'play' || MG.panelOpen()) return; const n = parseInt(e.key, 10); if (n >= 1 && n <= tools.length) selectTool(n - 1); if (e.key === 'Escape' && picker) picker = null; });

let lastDown = null;
function down(p) {
  lastDown = { x: p.x, y: p.y, plot: plotAt(p) };
  if (picker) { pickerTap(p); return 'none'; }
  const ti = trayHit(p);
  if (ti >= 0) { selectTool(ti); return picker ? 'none' : 'tool'; }
  if (inTray(p)) return 'none';
  if (LV.free) { const d = decoHit(p); if (d) { decos.splice(decos.indexOf(d), 1); decos.push(d); ptr0 = { d, ox: decoXY(d).x - p.x, oy: decoXY(d).y - p.y }; MG.sfx('tick'); return 'deco'; } }
  for (const c of clouds) if (c.state !== 'out' && Math.abs(p.x - c.x) < c.w * 0.62 && Math.abs(p.y - c.y) < c.w * 0.38) { blowCloud(c); return 'none'; }
  for (const b of bees) if (near(p, b.x, b.y, hitR() * 0.9) && b.state !== 'go') { b.state = 'drag'; MG.sfx('flip'); return 'bee'; }
  for (const b of bugs) if (b.state !== 'fly' && near(p, b.x, b.y - L.cw * 0.03, hitR())) { shoo(b); return 'none'; }
  for (const f of ffs) if (f.state === 'wander' && near(p, f.rx, f.ry, hitR())) { sendFirefly(f); return 'none'; }
  const pi = plotAt(p);
  if (pi >= 0) {
    const P = plots[pi];
    if (P.weed && P.weed.k > 0.3) { const wp = weedPos(P); if (near(p, wp.x, wp.y - P.s * 0.06, Math.max(30, P.s * 0.22)) || !P.seed) { pullWeed(P); return 'none'; } }
    if (ripe(P) && p.y < P.cy + P.h2) { harvest(P); return 'none'; }
    if (needsBee(P)) callBee(P);
    if (LV.night && P.t && P.lit <= 0) callFirefly(P);
    if (LV.frost && P.frost > 0.3) { wipe(P, 0.06); return 'tool'; }
  }
  for (const b of bflies) if (near(p, b.x, b.y, hitR() * 0.8)) { MG.sfx('sparkle'); b.ph += 2; }
  useTool(p, true);
  return 'tool';
}
let ptr0 = null;
function useTool(p, isDown, dist = 0) {
  const tl = tools[selTool]; if (!tl) return;
  const pi = plotAt(p), P = pi >= 0 ? plots[pi] : null;
  if (P && LV.frost && P.frost > 0 && (!isDown || P.frost > 0.3)) { if (!isDown) wipe(P, dist / (P.s * 2.4)); if (P.frost > 0.3) return; }
  if (tl.kind === 'seed' || tl.kind === 'bag') { if (P) plantAt(P, seedOfTool(), isDown); }
  else if (tl.kind === 'deco' && isDown && LV.free && p.y > L.gy - 10) placeDeco(p);
}
function move(p, d) {
  if (ptr.mode === 'bee') { const b = bees.find(b => b.state === 'drag'); if (b) { b.x = p.x; b.y = p.y - 10; for (const P of plots) if (needsBee(P)) { const f = flowerPt(P); if (near(b, f.x, f.y, Math.max(34, P.s * 0.22))) pollinate(P, b); } } return; }
  if (ptr.mode === 'deco' && ptr0) { const d0 = ptr0.d; d0.u = sat((p.x + ptr0.ox - L.gx) / L.gw); d0.v = clamp((p.y + ptr0.oy - L.gy) / L.gh, -0.05, 1.3); return; }
  if (ptr.mode === 'tool') useTool(p, false, d);
}
function up(pt) {
  if (pt.mode === 'bee') { const b = bees.find(b => b.state === 'drag'); if (b) b.state = 'back'; }
  if (pt.mode === 'deco' && ptr0) {
    const d0 = ptr0.d, q = decoXY(d0); ptr0 = null;
    if (inTray({ x: q.x, y: q.y - 10 }) || d0.v > 1.02 || q.x < L.gx) { decos.splice(decos.indexOf(d0), 1); MG.sfx('whoosh'); MG.fx.burst(q.x, Math.min(q.y, H - 20), { n: 12, colors: ['#fff', '#ffd23f'], speed: 150, size: 4, life: 0.5 }); }
    else { d0.v = Math.min(d0.v, 1); MG.sfx('place'); }
    saveFree();
  }
}

// ---------- seed / deco picker (my garden) ----------
function openPicker(kind) {
  picker = { kind, items: kind === 'seed' ? ALL_SEEDS : DECOS, t: 0 }; MG.sfx('flip');
}
function pickerRects() {
  const n = picker.items.length, cols = land ? Math.min(8, n) : 4, rows = Math.ceil(n / cols);
  const pw = Math.min(W - 24, cols * 96 + 30), cs = (pw - 30) / cols, ph = rows * cs + 30;
  const px = (W - pw) / 2, py = Math.max(10, (H - ph) / 2);
  return { px, py, pw, ph, cs, cells: picker.items.map((id, k) => ({ id, x: px + 15 + (k % cols) * cs, y: py + 15 + Math.floor(k / cols) * cs, s: cs })) };
}
function pickerTap(p) {
  const R = pickerRects(), c = R.cells.find(c => p.x > c.x && p.x < c.x + c.s && p.y > c.y && p.y < c.y + c.s);
  if (c) {
    if (picker.kind === 'seed') { freeSeed = c.id; selTool = 0; } else { freeDeco = c.id; selTool = tools.findIndex(tl => tl.kind === 'deco'); }
    tools[selTool].pop = 1.3; MG.sfx('pop'); saveFree();
  } else MG.sfx('tick');
  picker = null;
}

// ---------- spawning ----------
function spawnWeed() {
  const free = plots.filter(P => !P.weed && !(LV.goal && LV.goal.giant && false));
  if (!free.length || plots.filter(P => P.weed).length >= Math.max(1, Math.ceil(plots.length / 2))) return;
  const pref = free.filter(P => P.t); const P = MG.pick(pref.length ? pref : free);
  P.weed = { k: 0 }; MG.sfx('boing');
}
function spawnBug() {
  const cand = plots.filter(P => P.t && P.g > 0.2 && !bugs.some(b => b.plot === P.i));
  if (!cand.length || bugs.filter(b => b.state !== 'fly').length >= 2) return;
  const P = MG.pick(cand), left = Math.random() < 0.5;

// ---------- main draw ----------
function draw() {

    if (ripe(P)) for (let k = 0; k < 2; k++) { const q = fruitPts(P)[k % fruitPts(P).length]; twinkle(q.x + Math.cos(t * 2 + k * 3) * P.s * 0.08, q.y - P.s * 0.06 + Math.sin(t * 2.5 + k) * P.s * 0.04, P.s * 0.03 * (0.6 + 0.4 * Math.sin(t * 6 + k * 2)), 0.95); }

function markDraw(P, id) {

  const wob = P.shake > 0 ? Math.sin(P.shake * 30) * 0.15 : 0;

  x.fillStyle = '#c98d55'; x.strokeStyle = '#7a4f2a'; x.lineWidth = 1.5; x.beginPath(); x.roundRect(-2.5, -h, 5, h, 2); x.fill(); x.stroke();
  x.fillStyle = c; x.strokeStyle = outOf(c); x.lineWidth = 2; x.beginPath(); x.moveTo(2, -h); x.lineTo(2 + h * 0.5, -h * 0.82); x.lineTo(2, -h * 0.64); x.closePath(); x.fill(); x.stroke();

  x.fillStyle = '#f6e2b0'; x.strokeStyle = '#a8774a'; x.lineWidth = 2; x.beginPath(); x.roundRect(rx - 7, top, 14, by - top, 4); x.fill(); x.stroke();

  x.fillStyle = '#ffd23f'; x.strokeStyle = '#b88a00'; x.lineWidth = 1.8; star5(rx, top - 4, 14 + Math.sin(t * 4) * 1.5, 6.5, Math.sin(t) * 0.2); x.fill(); x.stroke();
  const cur = by - s * (0.08 + 0.24 * (P.g >= 1 ? P.sz : 0.4 * P.g));

let nightC = null;

  const k = 0.35, w = Math.ceil(W * k), h = Math.ceil(H * k);

  hole(L.sun.x, L.sun.y, L.sun.r * 2.4, 0.7);
  x.drawImage(nightC, 0, 0, W, H);
  // glows on top

}
function drawFloats() {

  for (const f of floats) {
    let sz = Math.round(clamp(L.cw * 0.13, 17, 28) * MG.textScale * f.big);
    x.font = `900 ${sz}px system-ui,"Noto Sans TC",sans-serif`;
    const tw = x.measureText(f.text).width, fx = clamp(f.x, tw / 2 + 8, W - tw / 2 - 8), fy = Math.max(sz, f.y - (1.3 - f.life) * 34);

function drawPicker() {

  x.fillStyle = '#fffaf0'; x.strokeStyle = '#c99a5a'; x.lineWidth = 3; x.beginPath(); x.roundRect(R.px, R.py, R.pw, R.ph, 20); x.fill(); x.stroke();

// ---------- boot ----------
setLevel(Math.min(MG.store.get('garden.pickLevel', 1), LEVELS.length));
menu();
MG.loop(dt => { update(dt); draw(); });

// ---------- hook for automated tests ----------
window.GDN = {
  get state() { return state; }, get level() { return level; }, levels: LEVELS.length, get goal() { return LV.goal; }, get got() { return { ...got }; }, get flyN() { return flyN; },
  start: n => startLevel(n), menu: () => menu(), win: () => win(), goalMet: () => goalMet(), text: () => goalText(),
  plots: () => plots.map(P => ({ seed: P.seed, g: +P.g.toFixed(3), w: +P.w.toFixed(2), pol: P.pol, weed: !!P.weed, frost: +P.frost.toFixed(2), lit: P.lit, sz: +P.sz.toFixed(2), ripe: !!ripe(P), bee: !!needsBee(P) })),
  tools: () => tools.map(tl => ({ kind: tl.kind, id: tl.id })), get sel() { return selTool; }, select: k => selectTool(k), get picker() { return picker && picker.kind; },
  bees: () => bees.map(b => ({ x: b.x, y: b.y, state: b.state, plot: b.plot })), lastDown: () => lastDown,
  decos: () => decos.map(d => ({ ...d })), get harvest() { return freeHarvest; },
  counts: () => ({ bugs: bugs.length, clouds: clouds.filter(c => c.state === 'cover').length, bflies: bflies.length, bees: bees.length, ffs: ffs.length, weeds: plots.filter(P => P.weed).length }),
  // simulate time (and optionally let a scripted gardener play)
  step(sec, auto = false, dt = 1 / 30) { for (let i = 0, n = Math.round(sec / dt); i < n && state === 'play'; i++) { if (auto) gardener(); update(dt); } return state; },
  hint: () => { const h = suggest(); return h && { a: h.a, b: h.b || null }; },
  toClient(lx, ly) { const r = cv.getBoundingClientRect(), B = 3; return { x: r.left + B + lx * (r.width - 2 * B) / W, y: r.top + B + ly * (r.height - 2 * B) / H }; },
  plotPt: i => { const P = plots[i]; return GDN.toClient(P.cx, P.cy - P.s * 0.1); }, toolPt: k => { const q = toolPt(k); return GDN.toClient(q.x, q.y); },
  cloudPt: () => { const c = clouds.find(c => c.state !== 'out'); return c && GDN.toClient(c.x, c.y); },
  bugPt: () => { const b = bugs.find(b => b.state !== 'fly'); return b && GDN.toClient(b.x, b.y - L.cw * 0.03); },
  weedPt: () => { const P = plots.find(P => P.weed && P.weed.k > 0.3); if (!P) return null; const q = weedPos(P); return GDN.toClient(q.x, q.y - P.s * 0.06); },
  beePt: () => { const b = bees.find(b => b.state === 'home'); return b && GDN.toClient(b.x, b.y); }, flowerPt: i => { const q = flowerPt(plots[i]); return GDN.toClient(q.x, q.y); },
  fruitPt: i => { const q = fruitPts(plots[i])[0]; return GDN.toClient(q.x, q.y); }, ffPt: () => { const f = ffs.find(f => f.state === 'wander'); return f && GDN.toClient(f.rx, f.ry); },

// a scripted gardener used by the tests: does what a kid would do, one action per call
function gardener() {

  const b = bugs.find(b => b.state === 'eat'); if (b) { shoo(b); return; }
