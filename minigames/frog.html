let pd = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || MG.panelOpen()) return;

});
cv.addEventListener('pointermove', e => {
  if (!pd || pd.id !== e.pointerId || pd.done) return;
  const dx = e.clientX - pd.x, dy = e.clientY - pd.y;
  if (Math.hypot(dx, dy) > 30) { pd.done = true; move(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'l' : 'r') : (dy < 0 ? 'u' : 'd')); }
});
addEventListener('pointerup', e => {

  const d = pd; pd = null; if (d.done) return;
  move(tapDir(d.p));
});
addEventListener('pointercancel', () => { pd = null; });
function tapDir(p) {
  const hx = colX(heroXF()), hy = rowY(heroRowF()) + CS / 2;
  const dxc = (p.x - hx) / CS, dyc = (p.y - hy) / CS;
  if (Math.abs(dyc) < 0.6 && Math.abs(dxc) >= 0.55) return dxc < 0 ? 'l' : 'r';
  if (dyc >= 0.6 && dyc < 1.7 && Math.abs(dxc) < 0.8) return 'd';

function drawNight(r0, r1) {

    const row = rowOf(Wd, r);
    if ((row.t === 'g') && r % 3 === 0) { lamps.push([colX(-half(COLS)) - CS * 0.1, y + CS * 0.3]); lamps.push([colX(half(COLS)) + CS * 0.1, y + CS * 0.3]); }

      const ix = itemX(row, n, tau), sx = colX(ix), dir = Math.sign(row.v); if (sx < -CS * 4 || sx > W + CS * 4) continue;
      const fx = sx + dir * row.len * CS / 2, cy = y + CS * 0.52;
      const gg = g.createLinearGradient(fx, 0, fx + dir * CS * 3.2, 0); gg.addColorStop(0, 'rgba(0,0,0,.95)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gg; g.beginPath(); g.moveTo(fx, cy - 5); g.lineTo(fx + dir * CS * 3.2, cy - CS * 0.7); g.lineTo(fx + dir * CS * 3.2, cy + CS * 0.6); g.lineTo(fx, cy + 5); g.closePath(); g.fill();

    if (row.t === 't') { const sp = trainSpan(row, tau); if (sp) hole(colX(sp[2]), y + CS / 2, CS * 2.4, 0.95); if (trainWarn(row, tau)) hole(Math.max(16, colX(-half(COLS)) - CS * 0.15), y, CS * 1.1, 0.8); }

  Wd.ducks.forEach((d, i) => { if (!(hero.dm >> i & 1)) hole(colX(d.c), rowY(d.r) + CS * 0.5, CS * 0.8, 0.7); });
  Wd.berries.forEach((b, i) => { if (!(hero.bm >> i & 1)) hole(colX(b.c), rowY(b.r) + CS * 0.5, CS * 0.7, 0.75); });
  Wd.friends.forEach(f => { if (!f.hide || f.seen) hole(colX(f.c) + CS * 0.2, rowY(f.r) + CS * 0.6, CS * 0.65, 0.6); });

  x.save(); x.globalCompositeOperation = 'lighter';
  for (const [lx, ly] of lamps) { const gg = x.createRadialGradient(lx, ly, 1, lx, ly, CS * 0.5); gg.addColorStop(0, 'rgba(255,230,150,.55)'); gg.addColorStop(1, 'rgba(255,230,150,0)'); x.fillStyle = gg; x.beginPath(); x.arc(lx, ly, CS * 0.5, 0, 7); x.fill(); }
  for (let r = r0; r <= r1; r++) {
    if (rowT(r) !== 'r') continue; const row = rowOf(Wd, r), y = rowY(r), dir = Math.sign(row.v);
    for (let n = 0; n < row.N; n++) { const sx = colX(itemX(row, n, tau)); if (sx < -CS * 2 || sx > W + CS * 2) continue; const fx = sx + dir * (row.len * CS / 2 - 3), cy = y + CS * 0.52; const gg = x.createRadialGradient(fx, cy, 1, fx, cy, 12); gg.addColorStop(0, 'rgba(255,250,200,.9)'); gg.addColorStop(1, 'rgba(255,250,200,0)'); x.fillStyle = gg; x.beginPath(); x.arc(fx, cy, 12, 0, 7); x.fill(); }
  }
