  { name: '冰河', ty: 'snow', th: 'snow', rows: [S, G(), Wl(0.6, 'floe', 2.6, 4.2, 0), Wl(-0.7, 'floe', 3, 4.6, 1), G({ ice: [-3, -2, -1, 1, 2, 3] }), I({ obs: [-2, 2] }), G({ obs: [0] }), R(0.9, 'car', 4.6, 0), G(), Wl(0.7, 'floe', 3, 4.4, 2), Wl(-0.6, 'floe', 2.6, 4.2, 0), HM] },

  { name: '星星大冒險', spd: 1.15, ty: 'star', th: 'day', rows: [S, R(1.1, 'car', 4.2, 0), R(-1, 'van', 4.8, 1), G({ obs: [1] }), Wl(0.8, 'log', 3, 4.6, 0), Wl(-0.9, 'turtle', 2, 3.6, 1), P([-3, -1, 0, 1, 3]), Wl(0.8, 'log', 2.6, 4.2, 2), G(), T(8, 2, { dir: 1 }), G({ obs: [-1] }), R(1.2, 'car', 4.2, 1), R(-1.3, 'truck', 5, 0), G(), HM], stars: [[3, -3], [6, 3], [10, 2]] },
  { name: '小鴨大搬家', spd: 1.15, ty: 'duck', th: 'day', rows: [S, R(1, 'car', 4.4, 0), G(), Wl(0.7, 'log', 3, 4.4, 0), Wl(-0.8, 'turtle', 3, 4.6, 1), G({ obs: [0] }), R(1.1, 'car', 4.2, 1), R(-1.1, 'van', 4.8, 2), G(), Wl(0.8, 'log', 3, 4.6, 1), HM], ducks: [[2, -3], [5, 3], [8, -1]] },
  { name: '夜晚火車', spd: 1.15, ty: 'night', th: 'night', rows: [S, R(1.1, 'car', 4.2, 0), G(), T(8, 0, { dir: 1 }), G(), R(-1.2, 'car', 4.4, 1), R(1.1, 'truck', 5, 2), G(), T(9, 4, { dir: -1 }), G(), R(-1.2, 'bus', 5.8, 0), G(), HM] },
  { name: '城市大冒險', ty: 'light', th: 'city', rows: [S, R(1.1, 'car', 4.4, 0), G(), LT(2.2, 'car', 3), LT(-2.1, 'van', 2), G(), T(8, 1, { dir: 1 }), G(), Wl(0.8, 'log', 3, 4.6, 0), Wl(-0.9, 'turtle', 2, 3.6, 1), Wl(0.8, 'log', 3, 4.4, 2), G(), HM] },
  { name: '回家大挑戰', spd: 1.25, ty: 'final', th: 'sunset', rows: [S, R(1.2, 'car', 4.2, 0), R(-1.2, 'van', 4.8, 1), G({ obs: [-3, 3] }), Wl(0.9, 'log', 3, 4.6, 0), Wl(-1, 'turtle', 3, 4.6, 1, { dive: 1 }), Wl(0.9, 'log', 2.6, 4.2, 2), G(), T(8, 2, { dir: -1 }), G({ obs: [0] }), R(1.3, 'car', 4.2, 1), R(-1.3, 'truck', 5, 0), R(1.2, 'bus', 5.8, 2), G(), Wl(-0.8, 'log', 3, 4.6, 1), Wl(0.9, 'turtle', 2, 3.6, 0, { dive: 1 }), HM] },
  { name: '一直跳', ty: 'endless', th: 'day', endless: true, rows: [] },

const N_LV = LEVELS.length, ENDLESS = N_LV;
const NEWS = {
  road: ['🚗 過馬路', '幫噗噗走到最上面的家！<b>點一下畫面</b>往前跳一格；<b>往左、往右、往下滑</b>，或是點噗噗旁邊的格子，就往那邊跳。<br>小汽車開得慢慢的，看準空隙再跳！被撞到只會「Oops 💦」退回草地，沒關係的。'],
  river: ['🪵 小河', '河水不能走，要跳到<b>木頭</b>或<b>荷葉</b>上面！站在木頭上會跟著漂喔，記得在漂到旁邊以前跳上岸。'],
  turtle: ['🐢 烏龜', '游泳的烏龜很友善，<b>烏龜背上也可以站</b>！'],
  dive: ['🫧 潛水烏龜', '有些烏龜會<b>冒泡泡 🫧</b>，冒泡泡就是牠快要潛到水裡了，趕快跳到別的地方！'],

  duck: ['🦆 帶小鴨回家', '小鴨子迷路了！跳到小鴨那一格，就能把牠<b>頂在頭上</b>，一次帶一隻回家。送到家以後噗噗會飛回起點，再去接下一隻。'],
  light: ['🚦 紅綠燈', '車子看到<b>紅燈</b>會停下來。等<b>小綠人</b>亮了，從<b>斑馬線</b>走過去最安全！'],
  night: ['🌙 晚上', '天黑黑！看車子亮亮的<b>車燈</b>，就知道車子從哪裡開過來。'],
  snow: ['❄️ 滑滑冰', '踩到亮亮的<b>冰</b>會一直滑，滑到雪地或撞到雪人才會停下來。可以利用雪人停住喔！'],
  train: ['🚂 平交道', '聽到<b>噹噹噹</b>、看到紅燈一閃一閃，就是火車要來了！在軌道前面等火車開過去再走。'],
  endless: ['♾️ 一直跳', '這條路跳不完！看看你可以跳多遠？'],
};
function featuresOf(L) {
  if (L.endless) return ['endless'];
  const f = [], rows = L.rows;
  if (rows.some(r => r.t === 'r')) f.push('road');
  if (rows.some(r => r.t === 'w' && r.k !== 'turtle')) f.push('river');
  if (rows.some(r => r.k === 'turtle')) f.push('turtle');
  if (rows.some(r => r.dive)) f.push('dive');
  if (L.stars) f.push('star');
  if (L.ducks) f.push('duck');
  if (rows.some(r => r.light)) f.push('light');
  if (L.th === 'night') f.push('night');
  if (rows.some(r => r.t === 'i' || (r.ice && r.ice.length))) f.push('snow');
  if (rows.some(r => r.t === 't')) f.push('train');
  return f;
}

// =====================================================================
// world: every moving thing is a pure function of the hazard clock τ, so the solver and the game agree
// =====================================================================
function prepRow(src, idx, spd = 1) {
  const r = { ...src, i: idx };
  if (r.v && !r.light) r.v *= spd;
  if (r.t === 'r') {
    r.len = VLEN[r.k] || 1.3;
    if (r.light) { r.sp = Math.abs(r.v) * ECYC / r.m; r.ph = r.sp / 2; }
  } else if (r.t === 'w' && !(r.k === 'pad' && !r.v)) {
    r.len = r.k === 'pad' ? 1 : r.len;
  }
  if ((r.t === 'r' || r.t === 'w') && r.sp) { r.L = r.sp * Math.ceil(LOOPW / r.sp); r.N = Math.round(r.L / r.sp); }
  r.obs = r.obs || []; r.ice = r.ice || [];
  return r;
}
function buildWorld(n) {
  const L = LEVELS[n - 1];
  const rows = L.endless ? [] : L.rows.map((rw, i) => prepRow(rw, i, L.spd || 1));
  return { n, def: L, rows, top: L.endless ? Infinity : rows.length - 1, stars: (L.stars || []).map(([r, c]) => ({ r, c })), ducks: (L.ducks || []).map(([r, c]) => ({ r, c })), endless: !!L.endless };
}
const wrapL = (p, L) => mod(p + L / 2, L) - L / 2;
function lightE(tau) {
  const k = Math.floor(tau / LCYC), u = tau - k * LCYC;
  let e;
  if (u < RAMP) e = u * u / (2 * RAMP);
  else if (u < TG) e = RAMP / 2 + (u - RAMP);
  else if (u < TG + TY) { const s = u - TG; e = RAMP / 2 + TG - RAMP + s - s * s / (2 * TY); }
  else e = ECYC;
  return k * ECYC + e;
}
function lightPhase(tau) { const u = mod(tau, LCYC); return u < TG ? 'go' : u < TG + TY ? 'slow' : 'stop'; }
function itemX(row, n, tau) { return wrapL(row.ph + row.v * (row.light ? lightE(tau) : tau) + n * row.sp, row.L); }
function diveState(row, n, tau) {
  if (!row.dive || n % 2 === 0) return 'up';
  const u = mod(tau + n * 1.9 + row.ph * 1.3, 5.2);
  return u < 3.4 ? 'up' : u < 4.2 ? 'sink' : 'under';
}
function trainSpan(row, tau) {
  const u = mod(tau + row.ph, row.per);
  if (u >= TRAIN_RUN) return null;
  const head = -row.dir * TRAIN_START + row.dir * TRAIN_SP * u, tail = head - row.dir * TRAIN_LEN;
  return [Math.min(head, tail), Math.max(head, tail), head];
}
const trainWarn = (row, tau) => { const u = mod(tau + row.ph, row.per); return u < TRAIN_RUN || u > row.per - TRAIN_WARN; };
const isLand = row => row.t === 'g' || row.t === 's' || row.t === 'i' || row.t === 'h';
const isIce = (row, c) => row.t === 'i' || (row.t === 'g' && row.ice.includes(c));
// m > 0 makes everything stricter (the solver), m = 0 is the game's own (kind) rule
function danger(Wd, r, hx, tau, m = 0) {
  const row = rowOf(Wd, r);
  if (row.t === 'r') {
    const hw = row.len / 2 - 0.1 + 0.26 + m;
    for (let n = 0; n < row.N; n++) if (Math.abs(hx - itemX(row, n, tau)) < hw) return 'car';
    return null;
  }
  if (row.t === 'w') return support(row, hx, tau, m) ? null : 'water';
  if (row.t === 't') { const s = trainSpan(row, tau); if (s && hx > s[0] - 0.3 - m && hx < s[1] + 0.3 + m) return 'train'; return null; }
  return null;
}
function support(row, hx, tau, m = 0, extra = 0) {
  if (row.k === 'pad' && !row.v) { for (const c of row.pads) if (Math.abs(hx - c) <= 0.6 - m + extra) return { x: c, len: 1 }; return null; }
  const hw = row.len / 2 + 0.12 - m + extra;
  for (let n = 0; n < row.N; n++) {
    const ds = diveState(row, n, tau);
    if (ds === 'under' || (m > 0 && ds === 'sink')) continue;
    const ix = itemX(row, n, tau);
    if (Math.abs(hx - ix) <= hw) return { x: ix, len: row.len };
  }
  return null;
}
const DUMMY_G = prepRow({ t: 'g' }, -1);
function rowOf(Wd, r) {
  if (Wd.endless) { ensureRows(Wd, r + 2); return r < 0 ? DUMMY_G : Wd.rows[r]; }
  return r < 0 || r > Wd.top ? DUMMY_G : Wd.rows[r];
}
const half = C => (C - 1) / 2;
function freeCol(row, c) { return !row.obs.includes(c); }
function landCol(row, xf, C) {
  const h = half(C), c0 = clamp(Math.round(xf), -h, h);
  if (freeCol(row, c0)) return c0;
  const cand = []; for (let c = -h; c <= h; c++) if (freeCol(row, c)) cand.push(c);
  cand.sort((a, b) => Math.abs(a - xf) - Math.abs(b - xf));
  return cand.length ? cand[0] : c0;
}
// where a hop ends: null = blocked
function target(Wd, st, dir, C) {
  const { r, x: hx } = st, h = half(C);
  let r2 = r, x2 = hx;
  if (dir === 'u') r2++; else if (dir === 'd') r2--; else x2 += dir === 'l' ? -1 : 1;
  if (r2 < 0 || r2 > Wd.top) return null;
  const row = rowOf(Wd, r2);
  if (dir === 'l' || dir === 'r') {
    if (Math.abs(x2) > h + 1e-6) { if (row.t !== 'w') return null; x2 = clamp(x2, -h, h); if (Math.abs(x2 - hx) < 0.2) return null; }
  }
  if (row.t === 'h' && !goalsOk(Wd, st)) return { blocked: 'home' };
  if (isLand(row) || row.t === 'r' || row.t === 't') {
    if (dir === 'l' || dir === 'r') { x2 = Math.round(x2); if (!freeCol(row, x2)) return null; }
    else if (rowOf(Wd, r).t === 'w') x2 = landCol(row, x2, C);
    else { x2 = Math.round(x2); if (!freeCol(row, x2)) return null; }
  }
  return { r: r2, x: x2 };
}

    if (tt === 'gd' && r === Wd.top + 1) drawPondLife(y);
    if (tt === 'm' || tt === 'gd') { if (!flying && r === hRow) drawHero(); continue; }
    const row = rowOf(Wd, r);
    if (row.t === 'w') {
      if (row.k === 'pad' && !row.v) { for (const c of row.pads) blit(padSprite(mod(c * 3 + r, 4) === 0), colX(c), y + CS / 2); }
      else for (let n = 0; n < row.N; n++) {
        const ix = itemX(row, n, tau), sx = colX(ix);
        if (sx < -row.len * CS || sx > W + row.len * CS) continue;
        if (row.k === 'log' || row.k === 'floe') blit(logSprite(row.len, row.k === 'floe'), sx, y + CS / 2);
        else if (row.k === 'pad') blit(padSprite(n % 3 === 0), sx, y + CS / 2);
        else { const ds = diveState(row, n, tau); for (let k = 0; k < row.len; k++) drawTurtle(sx + (k - (row.len - 1) / 2) * CS, y + CS / 2, Math.sign(row.v), ds, t + n * 0.7 + k * 0.4); }
      }
    }
    if (isLand(row)) {
      for (const c of row.obs) blit(obstacleSprite(obstacleKind(r, c)), colX(c), y + CS * 0.62);
    }
    // stars and ducklings waiting here
    Wd.stars.forEach((s, i) => { if (s.r === r && !(hero.sm >> i & 1)) { const b = Math.sin(t * 3 + i) * 3, pulse = starFx.length ? 1.25 + Math.sin(t * 16) * 0.1 : 1; drawStar(colX(s.c), y + CS * 0.45 + b, CS * 0.26 * pulse, true); } });
    Wd.ducks.forEach((d, i) => { if (d.r === r && !(hero.dm >> i & 1) && hero.carry !== i) { drawDuck(colX(d.c), y + CS * 0.5, CS * 0.27, d.c > 0, Math.abs(Math.sin(t * 4 + i)) * -3); if (starFx.length) { x.font = F(14); x.textAlign = 'center'; x.fillText('❗', colX(d.c), y - 2); } } });
    if (row.t === 'r') {
      const dir = Math.sign(row.v), stopped = row.light && lightPhase(tau) !== 'go';
      for (let n = 0; n < row.N; n++) {
        const ix = itemX(row, n, tau), sx = colX(ix);
        if (sx < -row.len * CS || sx > W + row.len * CS) continue;
        const ci = mod(n * 7 + r * 3, CARPAL.length);
        const bob = stopped ? 0 : Math.abs(Math.sin(t * 9 + n)) * 1.2;
        blit(vehicleSprite(row.k, ci, dir), sx, y + CS * 0.5 - bob);
        if (stopped) { x.fillStyle = 'rgba(255,60,60,.45)'; x.beginPath(); x.arc(sx - dir * (row.len * CS / 2), y + CS * 0.5, 6, 0, 7); x.fill(); }
      }
    }
    if (row.t === 't') drawTrain(row, y);
    if (!flying && r === hRow) drawHero();
    if (row.t === 't') drawCrossing(row, y);
    if ((row.t === 'g' || row.t === 's') && rowOf(Wd, r + 1).light && !rowOf(Wd, r - 1).light) drawSignal(y);
  }
  if (flying) drawHero();
  MG.fx.draw(x);
  if (theme() === 'night') drawNight(r0, r1);
  if (theme() === 'snow') drawSnow();
  if (theme() === 'sunset') { const sg = x.createLinearGradient(0, 0, 0, H); sg.addColorStop(0, 'rgba(255,140,70,.42)'); sg.addColorStop(0.55, 'rgba(255,190,120,.14)'); sg.addColorStop(1, 'rgba(255,110,130,.22)'); x.fillStyle = sg; x.fillRect(0, 0, W, H); }

}
function drawPondLife(y) {
  const fx = W / 2, jump = state === 'won' ? Math.abs(Math.sin(t * 7)) * 10 : (hero && hero.r >= Wd.top - 1 ? Math.abs(Math.sin(t * 5)) * 4 : 0);
  blit(padSprite(false), fx, y + CS * 0.55);
  drawFrog(fx, y + CS * 0.36, CS * 0.32, jump, state === 'won' || (hero && hero.r >= Wd.top - 2) ? Math.sin(t * 9) * 0.6 : Math.sin(t * 2) * 0.15);
  // ducklings that made it home swim around the frog
  deliveredFx.forEach((d, k) => {
    const p = Math.min(1, d.t / 0.6), tx = fx + (k - 1) * CS * 0.9 + (k === 1 ? CS * 1.5 : 0), ty = y + CS * 0.62;
    const sx = colX(d.x) + (tx - colX(d.x)) * p, sy = (y + CS * 1.5) + (ty - y - CS * 1.5) * p - Math.sin(p * Math.PI) * 30;
    drawDuck(sx + (p >= 1 ? Math.sin(t * 1.5 + k) * 6 : 0), sy, CS * 0.22, Math.cos(t * 1.5 + k) < 0, p >= 1 ? Math.sin(t * 3 + k) * 1.2 : 0);
  });
}
function drawHero() {
  if (!hero) return;
  const R = CS * 0.34;
  let r = heroRowF(), hx = heroXF(), lift = 0, sq = 0;
  if (hero.st === 'hop') { const p = clamp(hero.t / HOP, 0, 1); lift = Math.sin(p * Math.PI) * CS * 0.3; sq = -0.14 * Math.sin(p * Math.PI); }
  else if (hero.st === 'fly') { const p = clamp(hero.t / hero.flyD, 0, 1); lift = Math.sin(p * Math.PI) * CS * (hero.flyK === 'home' ? 2.2 : 1.2); sq = -0.08; }
  else if (hero.st === 'oops') { hx += Math.sin(hero.t * 50) * 0.06; sq = 0.12; }
  else if (hero.st === 'won') { lift = Math.abs(Math.sin(hero.t * 7)) * CS * 0.25; sq = -0.06 * Math.sin(hero.t * 14); }
  else { const lt = hero.landT; sq = lt < 0.18 ? 0.16 * (1 - lt / 0.18) : Math.sin(t * 3) * 0.025; }
  if (hero.bonk > 0 && hero.st === 'idle') { const k = hero.bonk / 0.25, d = hero.bdir; hx += (d === 'l' ? -1 : d === 'r' ? 1 : 0) * 0.12 * Math.sin(k * Math.PI); r += (d === 'u' ? 1 : d === 'd' ? -1 : 0) * 0.12 * Math.sin(k * Math.PI); }
  const sx = colX(hx), cy = rowY(r) + CS * 0.82 - R - lift;
  if (lift > 2) { x.fillStyle = 'rgba(30,40,20,.16)'; x.beginPath(); x.ellipse(sx, rowY(r) + CS * 0.84, R * 0.8, R * 0.18, 0, 0, 7); x.fill(); }
  if (hero.st === 'fly' && hero.flyK === 'home') MG.fx.burst(sx, cy, { n: 1, colors: ['#ffd23f', '#fff', '#ff8ac2'], shape: 'star', speed: 30, up: 0, size: 4, life: 0.5, grav: 40 });
  MG.puPu(x, sx, cy, R, hero.mood, sq, { look: hero.look, arms: hero.st === 'won' || hero.carry >= 0 ? 'up' : undefined });
  if (hero.carry >= 0) drawDuck(sx, cy - R * 1.05 + R * MG.hatDrop, R * 0.55, hero.look < 0, Math.sin(t * 6) * 1.2);
  // first level: a pulsing hint above the hero until the first hop
  if (!firstMove && level === 1 && state === 'play' && !MG.panelOpen()) {
    const a = (Math.sin(t * 5) + 1) / 2; x.globalAlpha = 0.6 + a * 0.4; x.font = F(26); x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('👆', sx + 4, cy - R * 2.2 - a * 6); x.globalAlpha = 1;
  }
}
function drawNight(r0, r1) {
  const k = 0.5, cw = Math.ceil(W * k), ch = Math.ceil(H * k);
  if (!dark || dark.width !== cw || dark.height !== ch) { dark = document.createElement('canvas'); dark.width = cw; dark.height = ch; }
  const g = dark.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.clearRect(0, 0, cw, ch);
  g.fillStyle = 'rgba(14,20,58,.74)'; g.fillRect(0, 0, cw, ch);
  g.scale(k, k); g.globalCompositeOperation = 'destination-out';
  const hole = (cx, cy, rr, a = 1) => { const gg = g.createRadialGradient(cx, cy, rr * 0.15, cx, cy, rr); gg.addColorStop(0, `rgba(0,0,0,${a})`); gg.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gg; g.beginPath(); g.arc(cx, cy, rr, 0, 7); g.fill(); };
  hole(colX(heroXF()), rowY(heroRowF()) + CS * 0.5, CS * 2.3, 0.95);
  const lamps = [];
  for (let r = r0; r <= r1; r++) {
    const tt = rowT(r), y = rowY(r);
    if (tt === 'gd' && r === Wd.top + 1) hole(W / 2, y + CS * 0.4, CS * 1.6, 0.8);
    if (tt !== 'r' && tt !== 'g' && tt !== 's' && tt !== 't' && tt !== 'w') continue;
    const row = rowOf(Wd, r);
    if ((row.t === 'g') && r % 3 === 0) { lamps.push([colX(-half(COLS)) - CS * 0.1, y + CS * 0.3]); lamps.push([colX(half(COLS)) + CS * 0.1, y + CS * 0.3]); }
    if (row.t === 'r') for (let n = 0; n < row.N; n++) {
      const ix = itemX(row, n, tau), sx = colX(ix), dir = Math.sign(row.v); if (sx < -CS * 4 || sx > W + CS * 4) continue;
      const fx = sx + dir * row.len * CS / 2, cy = y + CS * 0.52;
      const gg = g.createLinearGradient(fx, 0, fx + dir * CS * 3.2, 0); gg.addColorStop(0, 'rgba(0,0,0,.95)'); gg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gg; g.beginPath(); g.moveTo(fx, cy - 5); g.lineTo(fx + dir * CS * 3.2, cy - CS * 0.7); g.lineTo(fx + dir * CS * 3.2, cy + CS * 0.6); g.lineTo(fx, cy + 5); g.closePath(); g.fill();
      hole(sx, cy, CS * 0.9, 0.5);
    }
    if (row.t === 't') { const sp = trainSpan(row, tau); if (sp) hole(colX(sp[2]), y + CS / 2, CS * 2.4, 0.95); if (trainWarn(row, tau)) hole(Math.max(16, colX(-half(COLS)) - CS * 0.15), y, CS * 1.1, 0.8); }
    if (row.t === 'w' && row.k === 'log') for (let n = 0; n < row.N; n += 2) { const sx = colX(itemX(row, n, tau)); hole(sx, y + CS * 0.3, CS * 0.5, 0.7); }
  }
  for (const [lx, ly] of lamps) hole(lx, ly, CS * 1.5, 0.75);
  Wd.stars.forEach((s, i) => { if (!(hero.sm >> i & 1)) hole(colX(s.c), rowY(s.r) + CS * 0.45, CS * 0.9, 0.9); });
  Wd.ducks.forEach((d, i) => { if (!(hero.dm >> i & 1)) hole(colX(d.c), rowY(d.r) + CS * 0.5, CS * 0.8, 0.7); });
  x.drawImage(dark, 0, 0, W, H);
  // warm glows on top
  x.save(); x.globalCompositeOperation = 'lighter';
  for (const [lx, ly] of lamps) { const gg = x.createRadialGradient(lx, ly, 1, lx, ly, CS * 0.5); gg.addColorStop(0, 'rgba(255,230,150,.55)'); gg.addColorStop(1, 'rgba(255,230,150,0)'); x.fillStyle = gg; x.beginPath(); x.arc(lx, ly, CS * 0.5, 0, 7); x.fill(); }
  for (let r = r0; r <= r1; r++) {
    if (rowT(r) !== 'r') continue; const row = rowOf(Wd, r), y = rowY(r), dir = Math.sign(row.v);
    for (let n = 0; n < row.N; n++) { const sx = colX(itemX(row, n, tau)); if (sx < -CS * 2 || sx > W + CS * 2) continue; const fx = sx + dir * (row.len * CS / 2 - 3), cy = y + CS * 0.52; const gg = x.createRadialGradient(fx, cy, 1, fx, cy, 12); gg.addColorStop(0, 'rgba(255,250,200,.9)'); gg.addColorStop(1, 'rgba(255,250,200,0)'); x.fillStyle = gg; x.beginPath(); x.arc(fx, cy, 12, 0, 7); x.fill(); }
  }
  for (let i = 0; i < 10; i++) { const fx = mod(i * 83 + Math.sin(t * 0.6 + i) * 40, W), fy = mod(i * 131 + Math.cos(t * 0.5 + i * 2) * 30, H), a = (Math.sin(t * 3 + i * 2) + 1) / 2; x.fillStyle = `rgba(255,255,160,${0.25 + a * 0.6})`; x.beginPath(); x.arc(fx, fy, 1.8, 0, 7); x.fill(); }
  x.restore();
  // lamp posts drawn above the darkness edge
  for (const [lx, ly] of lamps) { x.fillStyle = '#4a5260'; x.fillRect(lx - 1.5, ly, 3, CS * 0.6); x.fillStyle = '#fff6c8'; x.beginPath(); x.arc(lx, ly, 4, 0, 7); x.fill(); }
}
function drawSnow() {
  x.fillStyle = 'rgba(255,255,255,.9)';
  for (const f of flakes) { const fx = mod(f.x * W + Math.sin(t * 0.8 + f.ph) * 14, W), fy = mod(f.y * H + t * f.v * H, H); x.beginPath(); x.arc(fx, fy, f.s, 0, 7); x.fill(); }
}
function drawPops() {
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const p of pops) {
    const sx = clamp(colX(p.x), 70, W - 70), sy = rowY(p.r) + p.dy - 6;
    x.globalAlpha = Math.min(1, p.life * 2); x.font = F(19); x.lineWidth = MG.big ? 5 : 4; x.strokeStyle = '#fff'; x.lineJoin = 'round';
    x.strokeText(p.text, sx, sy); x.fillStyle = p.col; x.fillText(p.text, sx, sy);

}
function drawHud() {
  if (!hero) return;
  const items = [];
  if (Wd.stars.length) items.push(...Wd.stars.map((s, i) => ({ k: 'star', on: !!(hero.sm >> i & 1) })));
  if (Wd.ducks.length) items.push(...Wd.ducks.map((d, i) => ({ k: 'duck', on: !!(hero.dm >> i & 1), carry: hero.carry === i })));
  const sz = 30 * MG.textScale;
  if (items.length) {
    const w = items.length * sz + 16, px = W / 2 - w / 2, py = 8;
    x.fillStyle = 'rgba(255,255,255,.88)'; x.strokeStyle = 'rgba(35,49,43,.12)'; x.lineWidth = 1.5; x.beginPath(); x.roundRect(px, py, w, sz + 8, (sz + 8) / 2); x.fill(); x.stroke();
    items.forEach((it, i) => {
      const cx = px + 8 + sz * (i + 0.5), cy = py + 4 + sz / 2;
      if (it.k === 'star') { if (it.on) drawStar(cx, cy, sz * 0.4, false); else { x.globalAlpha = 0.3; drawStar(cx, cy, sz * 0.4, false); x.globalAlpha = 1; } }
      else { x.globalAlpha = it.on ? 1 : it.carry ? 0.75 : 0.28; drawDuck(cx, cy - 1, sz * 0.32, false); x.globalAlpha = 1; if (it.on) { x.fillStyle = '#2fb565'; x.font = F(11); x.fillText('✓', cx + sz * 0.32, cy + sz * 0.3); } }
    });
  }
  if (Wd.endless) {
    const txt = `🐸 ${hero.best}`; x.font = F(20); const w = x.measureText(txt).width + 26;
    x.fillStyle = 'rgba(255,255,255,.88)'; x.beginPath(); x.roundRect(W / 2 - w / 2, 8, w, 32, 16); x.fill();
    x.fillStyle = '#23312b'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, W / 2, 25);
  } else if (Wd.top + 2.2 >= H / CS) {
    // a slim progress rail on the right: home at the top, the hero's dot climbing
    const bx = W - 12, by0 = 52, by1 = H - 20, p = clamp(heroRowF() / Wd.top, 0, 1);
    x.fillStyle = 'rgba(255,255,255,.6)'; x.beginPath(); x.roundRect(bx - 3, by0, 6, by1 - by0, 3); x.fill();
    x.fillStyle = 'rgba(76,201,106,.85)'; x.beginPath(); x.roundRect(bx - 3, by1 - (by1 - by0) * p, 6, (by1 - by0) * p, 3); x.fill();
    x.font = F(14); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('🏠', bx - 2, by0 - 10);
    x.fillStyle = MG.hero === 'niu' ? '#dba06c' : '#4cc96a'; x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.arc(bx, by1 - (by1 - by0) * p, 6, 0, 7); x.fill(); x.stroke();

// =====================================================================
// menu & loop
// =====================================================================
const lvShort = n => `${n}${TYPES[LEVELS[n - 1].ty][0]}`;
function lvLabel(n) { const L = LEVELS[n - 1], b = loadBest()[n - 1] || 0; return `${n}（${TYPES[L.ty][0]} ${L.name}${b ? ' ' + '⭐'.repeat(b) : ''}）`; }
function menu() {
  state = 'menu'; rest.show(false);
  if (!Wd) { Wd = buildWorld(clamp(MG.store.get('frog.pickLevel', 1), 1, N_LV)); if (Wd.endless) ensureRows(Wd, 40); hero = newHero(); cam = camTarget(); }
  MG.choose({
    id: 'frog', title: '青蛙過馬路', levelsTitle: '選一關',
    html: '<p>青蛙好朋友在池塘等噗噗回家！<b>點一下畫面</b>往前跳，<b>往左右滑</b>（或點旁邊的格子）換位置，<b>往下滑</b>往後退。</p>' +
      '<p>躲開慢慢開的小車子、跳上木頭和烏龜過小河，還有 ⭐ 撿星星、🦆 帶小鴨回家、🚦 紅綠燈、🚂 平交道、🌙 晚上、❄️ 滑滑冰和 ♾️ 一直跳！</p>',
    modesTitle: '想怎麼玩？',
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '車子開慢慢・碰到也沒關係' }, { id: 'chal', label: '⭐ 挑戰', sub: '3 顆愛心・車子快一點' }],
    levels: { count: N_LV, max: N_LV, label: lvLabel, short: lvShort },
    keys: '點畫面往前跳・滑一下換方向　電腦：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>',
    playing: () => state === 'play',
    onPause: () => { pd = null; },
    start: (m, lv) => startLevel(lv, m),
  });
}
menu();
let frozen = false;   // tests drive the clock themselves
MG.loop(dt => {
  if (frozen) { draw(dt); return; }
  if (state === 'play' && !MG.panelOpen()) update(dt);
  else { MG.fx.step(dt); if (state === 'won') { t += dt; tau = t * sc; if (hero) hero.t += dt; for (const d of deliveredFx) d.t += dt; for (const p of pops) { p.life -= dt; p.dy -= 26 * dt; } pops = pops.filter(p => p.life > 0); } else if (state === 'menu') { t += dt; tau = t * sc; } }
  draw(dt);
});

// ---------- hook for automated tests ----------
window.FROGT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, levels: N_LV, get cols() { return COLS; }, get size() { return [W, H]; },
  hero: () => hero && { r: hero.r, x: hero.x, st: hero.st, carry: hero.carry, sm: hero.sm, dm: hero.dm, best: hero.best },
  get bumps() { return bumps; }, get hearts() { return hearts; }, get t() { return t; }, top: () => Wd && Wd.top, feats: n => featuresOf(LEVELS[n - 1]), type: n => LEVELS[n - 1].ty,
  start(n, m = 'relax') { startLevel(n, m); MG.hide(); },
  solve: (n, m = 'relax') => solve(n, m),
  autoplay(plan, save = false) { bot = { plan, i: 0, save }; t = 0; tau = 0; frozen = true; },
  set frozen(v) { frozen = v; },
  greedy() { bot = { greedy: true, next: 0, plan: [] }; frozen = true; },
  step(sec, dt = HOP / 9) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play') update(dt); },
  move: d => move(d), win: () => win(),
  danger: (dr = 1, ahead = 0.35) => { const r = hero.r + dr; for (let k = 0; k <= 6; k++) if (danger(Wd, r, hero.x, tau + ahead * k / 6 * sc, 0.25)) return true; return false; },
  heroClient() { const rc = cv.getBoundingClientRect(), B = 3, sx = colX(heroXF()), sy = rowY(heroRowF()) + CS * 0.5; return { x: rc.left + B + sx * (rc.width - 2 * B) / W, y: rc.top + B + sy * (rc.height - 2 * B) / H, cell: CS * (rc.width - 2 * B) / W }; },
  menu: () => menu(),
};
