<script>
'use strict';
MG.init({ id: 'salon', title: '噗噗美髮店', stats: ['level', 'info'] });
const cv = document.getElementById('cv');
let x = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';

// =====================================================================
// sounds: snip, buzz, spray, bubbles, dryer, curl boing, sparkle, animal voices…
// =====================================================================
let AC = null;
const isMuted = () => !!MG.store.get('muted', false);
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
addEventListener('pointerdown', () => actx(), true);
function tn(f0, f1, dur, type = 'sine', vol = 0.1, delay = 0) {
  const a = AC; if (!a || isMuted()) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
let NB = null;
function nz(dur, f0, f1, vol = 0.06, delay = 0, q = 1.2, type = 'bandpass') {
  const a = AC; if (!a || isMuted()) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = NB; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.04, dur * 0.3)); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
  s.connect(f).connect(g).connect(a.destination); s.start(t0); s.stop(t0 + dur + 0.03);
}
const SND = {
  snip: () => { nz(0.05, 6000, 8000, 0.08, 0, 2.5); tn(2600, 1900, 0.035, 'square', 0.035); tn(2200, 1600, 0.03, 'square', 0.03, 0.05); },
  buzz: () => { tn(118, 122, 0.16, 'sawtooth', 0.045); nz(0.16, 1500, 1700, 0.035, 0, 4); },
  spray: () => nz(0.2, 3500, 6500, 0.05, 0, 0.7, 'highpass'),
  bubble: () => { const f = 500 + Math.random() * 500; tn(f, f * 2.2, 0.07, 'sine', 0.07); },
  dryer: () => { nz(0.32, 900, 1300, 0.045, 0, 0.7); tn(210, 214, 0.32, 'triangle', 0.015); },
  comb: () => nz(0.09, 2800 + Math.random() * 1500, 4600, 0.035, 0, 1.6),
  curl: () => { tn(330, 990, 0.14, 'sine', 0.07); tn(660, 1320, 0.1, 'sine', 0.03, 0.06); },
  drip: () => { tn(1300, 2300, 0.07, 'sine', 0.1); tn(850, 650, 0.09, 'sine', 0.05, 0.05); },
  grow: () => { [523, 659, 784].forEach((f, i) => tn(f, f * 1.02, 0.12, 'triangle', 0.045, i * 0.05)); },
  pssh: () => nz(0.22, 4500, 8000, 0.05, 0, 0.6, 'highpass'),
  twinkle: () => { [1568, 2093, 2637].forEach((f, i) => tn(f, f, 0.12, 'sine', 0.035, i * 0.05)); },
  place: () => { tn(500, 760, 0.08, 'triangle', 0.1); tn(1200, 1500, 0.06, 'sine', 0.04, 0.06); },
  hop: () => tn(320, 720, 0.12, 'triangle', 0.09),
  pick: () => tn(700, 900, 0.05, 'triangle', 0.06),
  back: () => tn(500, 300, 0.08, 'triangle', 0.06),
  wow: () => { tn(420, 840, 0.25, 'sine', 0.08); tn(840, 1260, 0.3, 'sine', 0.05, 0.2); },
  camera: () => { nz(0.06, 2500, 1200, 0.14, 0, 1); tn(1800, 1800, 0.04, 'square', 0.035, 0.08); nz(0.12, 6000, 3000, 0.05, 0.1, 1); },
  door: () => { tn(1568, 1568, 0.3, 'sine', 0.05); tn(1319, 1319, 0.4, 'sine', 0.05, 0.16); },
  wool: () => { tn(240, 420, 0.1, 'sine', 0.06); },
  cat: () => { tn(620, 980, 0.14, 'sine', 0.08); tn(980, 560, 0.3, 'sine', 0.08, 0.14); },
  bunny: () => { [700, 820, 700, 880].forEach((f, i) => tn(f, f * 1.1, 0.07, 'sine', 0.08, i * 0.08)); },
  dog: () => { tn(330, 170, 0.11, 'square', 0.05); tn(350, 180, 0.11, 'square', 0.05, 0.18); },
  lion: () => { nz(0.55, 380, 160, 0.09, 0, 1.2); tn(160, 95, 0.5, 'sawtooth', 0.035); },
  sheep: () => { for (let i = 0; i < 6; i++) tn(430, 410, 0.07, 'sawtooth', 0.025, i * 0.06); },
  alpaca: () => { tn(560, 720, 0.25, 'sine', 0.07); tn(720, 600, 0.3, 'sine', 0.06, 0.25); },
  bear: () => { tn(210, 150, 0.4, 'triangle', 0.09); },
};
const sndT = {};
function snd(n, gap = 60) { const q = performance.now(); if (q - (sndT[n] || 0) < gap) return; sndT[n] = q; actx(); if (SND[n]) SND[n](); }
function mgs(n, a, gap = 60) { const q = performance.now(), k = 'mg.' + n; if (q - (sndT[k] || 0) < gap) return; sndT[k] = q; MG.sfx(n, a); }

// =====================================================================
// little drawing helpers + colours
// =====================================================================
function rr(x0, y0, w, h, r) { x.beginPath(); x.roundRect(x0, y0, w, h, r); }
function fs(fill, stroke, lw) { if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); } }
function circ(cx, cy, r) { x.beginPath(); x.arc(cx, cy, Math.max(0.001, r), 0, TAU); }
function ell(cx, cy, rx, ry, a = 0) { x.beginPath(); x.ellipse(cx, cy, Math.max(0.001, rx), Math.max(0.001, ry), a, 0, TAU); }
function lgr(x0, y0, x1, y1, a, b) { const g = x.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; }
function heartPath(cx, cy, s) { x.beginPath(); x.moveTo(cx, cy + s * 0.85); x.bezierCurveTo(cx - s * 1.4, cy - s * 0.1, cx - s * 0.6, cy - s * 1.2, cx, cy - s * 0.45); x.bezierCurveTo(cx + s * 0.6, cy - s * 1.2, cx + s * 1.4, cy - s * 0.1, cx, cy + s * 0.85); }
function starPath(cx, cy, R, r, n = 5) { x.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; x.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } x.closePath(); }
function twinkle(cx, cy, r, col = '#fff') { x.fillStyle = col; x.beginPath(); x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r); x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill(); }
const HEXC = new Map();
function hexRGB(h) { let v = HEXC.get(h); if (v) return v; let s = h.replace('#', ''); if (s.length === 3) s = s.split('').map(c => c + c).join(''); const n = parseInt(s, 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; HEXC.set(h, v); return v; }
const MIXC = new Map();
function mix(a, b, k) {
  const key = a + b + k.toFixed(3); let v = MIXC.get(key); if (v) return v;
  const A = hexRGB(a), B = hexRGB(b);
  v = '#' + [0, 1, 2].map(i => Math.round(clamp(A[i] + (B[i] - A[i]) * k, 0, 255)).toString(16).padStart(2, '0')).join('');
  MIXC.set(key, v); return v;
}
const shade = (h, k) => k >= 0 ? mix(h, '#ffffff', k) : mix(h, '#3a1f2a', -k);

// =====================================================================

  ],

    { id: 'top', layer: 'front', cx: 0, cy: HY - 0.72, rx: 0.5, ry: 0.26, arcs: [[-PI, 0]], n: 12, k: [0.2, 1], len: [0.2, 0.3], w: 0.24, curl: 1 },

// tools

};

// =====================================================================

// =====================================================================
const LEVELS = [
  { ty: 'comb', nm: '亂糟糟的小貓', c: [{ sp: 'cat', messy: ['top', 'cheek', 'chest'], g: ['comb'] }] },

  { ty: 'cut', nm: '小熊修一修', c: [{ sp: 'bear', long: { z: ['top', 'cheek', 'chest'] }, g: ['cut'] }] },

function layout() {
  W = cv.lw; H = cv.lh; land = W > H * 1.05; U = clamp(Math.min(W, H) / 420, 0.8, 1.9);
  const n = Math.max(1, tools.length), g = 8;
  slots = []; pal = []; palBox = null; btns = [];
  const np = palCols.length;
  if (land) {
    const cols = n <= 6 ? 1 : n <= 12 ? 2 : 3, rows = Math.ceil(n / cols);
    slotSz = Math.min((H - 2 * g - 12) / rows, 112 * U, W * 0.1, W * 0.21 / cols);
    const tw = cols * slotSz + 12, th = Math.min(H - 2 * g, rows * slotSz + 28);
    tray = { x: W - tw - g, y: (H - th) / 2, w: tw, h: th };
    const y0 = tray.y + (tray.h - rows * slotSz) / 2;
    tools.forEach((id, i) => slots.push({ id, x: tray.x + 6 + (i % cols) * slotSz, y: y0 + Math.floor(i / cols) * slotSz, w: slotSz, h: slotSz }));
    let right = tray.x - g;
    if (np) {
      const pr = Math.min(18 * U, slotSz * 0.34, (H - 2 * g - 24) / np / 2.5), pw = pr * 2.7, tot = np * pr * 2.5;
      palBox = { x: right - pw, y: H / 2 - tot / 2 - 10, w: pw, h: tot + 20 };
      palCols.forEach((c, i) => pal.push({ c, x: right - pw / 2, y: H / 2 - tot / 2 + pr * 1.25 + i * pr * 2.5, r: pr }));
      right -= pw + g;
    }
    S = { x: 0, y: 0, w: right, h: H };
    const lw = clamp(S.w * 0.28, 150, H * 0.42);
    const R = Math.min((H - 12) / 5.05, (S.w - lw) / 4.1);
    const cx = lw + (S.w - lw) * 0.52, cy = H - 1.63 * R - 6;
    CU = { x: cx, y: cy, R };
    mir = { x: 14, y: 14, w: lw - 20, h: Math.min(H * 0.5, (lw - 20) * 1.15) };
    const cw = Math.min(lw - 30, (H - mir.h - 40) / 1.18);
    card = { w: cw, h: cw * 1.18, x: 14 + (lw - 20 - cw) / 2 + 6, y: mir.y + mir.h + 14, rot: 0.04 };
  } else {
    const per = Math.min(n, Math.max(4, Math.floor((W - 20) / 66))), rows = Math.ceil(n / per);
    slotSz = Math.min((W - 2 * g - 12) / per, H * 0.105, 112 * U);
    const th = rows * slotSz + 12, tw = Math.min(W - 2 * g, Math.min(n, per) * slotSz + 28);
    tray = { x: (W - tw) / 2, y: H - th - g, w: tw, h: th };
    for (let r = 0; r < rows; r++) {
      const ids = tools.slice(r * per, r * per + per), x0 = tray.x + (tray.w - ids.length * slotSz) / 2;
      ids.forEach((id, k) => slots.push({ id, x: x0 + k * slotSz, y: tray.y + 6 + r * slotSz, w: slotSz, h: slotSz }));
    }
    let bottom = tray.y - g;
    if (np) {
      const pr = Math.min(20 * U, slotSz * 0.34, (W - 40) / np / 2.6), ph = pr * 2.5, tot = np * pr * 2.6;
      palBox = { x: W / 2 - tot / 2 - 10, y: bottom - ph, w: tot + 20, h: ph };
      palCols.forEach((c, i) => pal.push({ c, x: W / 2 - tot / 2 + pr * 1.3 + i * pr * 2.6, y: bottom - ph / 2, r: pr }));
      bottom -= ph + g;
    }
    S = { x: 0, y: 0, w: W, h: bottom };
    const cw = clamp(W * 0.36, 110, S.h * 0.27);
    const tb = cw * 1.18 + 22;
    const R = Math.max(30, Math.min(W / 4.25, (S.h - tb) / 4.5));
    const cx = W * 0.53, cy = Math.min(S.h - 1.6 * R - 4, tb + 3.0 * R + (S.h - tb - 4.5 * R) / 2);
    CU = { x: cx, y: cy, R };
    card = { w: cw, h: cw * 1.18, x: W - cw - 14, y: 12, rot: 0.035 };
    mir = { x: 12, y: 12, w: Math.min(card.x - 30, cw * 1.25), h: tb - 22 };
  }
  floorY = CU.y + 1.0 * CU.R;
  const hr = CU.R * 0.42;
  hero = { x: Math.max(hr * 1.1, CU.x - 1.78 * CU.R), y: CU.y + 1.48 * CU.R - hr, r: hr };
  basket = null;
  if (cust && cust.goals.some(g => g.k === 'shear')) basket = { x: Math.min(S.w - CU.R * 0.5, CU.x + 1.72 * CU.R), y: CU.y + 1.3 * CU.R, s: CU.R * 0.42 };
  if (LV.free) {
    const bs = Math.min(card.w * 0.46, 76 * U);
    btns = [{ id: 'photo', x: card.x + card.w / 2 - bs - 6, y: card.y + card.h / 2 - bs / 2, w: bs, h: bs, on: takePhoto }, { id: 'next', x: card.x + card.w / 2 + 6, y: card.y + card.h / 2 - bs / 2, w: bs, h: bs, on: nextFree }];
  }

}

}

function hud() {

const goalReady = (c, g) => g.needs.every(i => c.goals[i].done);
function evalGoals(c) {
  for (const g of c.goals) {
    if (g.done) continue;
    if (g.k === 'acc') { g.p = c.acc.some(a => a.k === g.acc) ? 1 : 0; if (g.p) completeGoal(c, g); continue; }
    if (!goalReady(c, g)) { g.p = 0; continue; }
    const D = GD[g.k]; let ok = 0;
    for (const i of g.idx) if (D.ok(c.strands[i])) ok++;
    g.p = g.idx.length ? ok / g.idx.length : 1;
    if (g.p >= (g.frac || D.frac || 0.88)) completeGoal(c, g);
  }
}
function completeGoal(c, g) {

  const n = c.goals.filter(q => q.done).length;
  mgs('match', n + 1); mgs('sparkle');
  c.mood = 'happy'; c.moodT = 1.1; c.hop = 1; heroMood = 'wow'; heroT = 1.2;
  const ch = chipPos(c.goals.indexOf(g));
  if (ch) MG.fx.burst(ch.x, ch.y, { n: 16, colors: ['#ffd23f', '#fff', '#ff9cc8'], shape: 'star', speed: 160, up: 80, size: 5 });
  say(MG.praise(Math.min(5, n + 1)), CU.x, CU.y - CU.R * 3.0, '#ff6a9a');

}

// =====================================================================
// using the tools
// =====================================================================
const toLocal = (px, py) => ({ x: (px - CU.x) / CU.R, y: (py - CU.y) / CU.R });
const toScreen = (lx, ly) => ({ x: CU.x + lx * CU.R, y: CU.y + ly * CU.R });
function nearStrand(s, lx, ly, r) {   // index of the nearest point within r, or -1
  const P = s.pts; let best = -1, bd = r * r;
  for (let i = 0; i < s.np; i++) { const dx = P[2 * i] - lx, dy = P[2 * i + 1] - ly, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = i; } }
  return best;
}
function segDist2(px, py, ax, ay, bx, by) { const vx = bx - ax, vy = by - ay, l = vx * vx + vy * vy; let k = l ? ((px - ax) * vx + (py - ay) * vy) / l : 0; k = clamp(k, 0, 1); const dx = ax + vx * k - px, dy = ay + vy * k - py; return dx * dx + dy * dy; }
function toolTip() { if (!drag) return null; return { x: drag.x + drag.tx, y: drag.y + drag.ty }; }
function applyTool(dt) {
  const c = cust, tp = toolTip(); if (!c || !tp) return;
  const id = drag.id, T = TOOLS[id]; if (T.acc) return;
  const p = toLocal(tp.x, tp.y), prev = drag.last ? toLocal(drag.last.x, drag.last.y) : p;
  const mv = Math.min(0.4, Math.hypot(p.x - prev.x, p.y - prev.y));
  drag.last = { x: tp.x, y: tp.y };
  drag.moved += mv;
  let hit = 0;
  if (id === 'scissors') {
    if (mv < 0.004) return;
    drag.open = 0.05 + Math.abs(Math.sin(drag.moved * 9)) * 0.32;
    for (const s of c.strands) {
      if (s.L < 0.08) continue;
      const P = s.pts;
      for (let i = 1; i < s.np; i++) {
        if (segDist2(P[2 * i], P[2 * i + 1], prev.x, prev.y, p.x, p.y) < T.r * T.r) {

  const word = ['Wow! 😍', 'So pretty! 💖', 'I love it! 🥰'][level % 3];
  x.lineWidth = sz * 0.22; x.strokeStyle = '#fff'; x.strokeText(word, W / 2, my + mh + sz * 0.3 < H - sz ? my + mh + sz * 0.8 : my - sz * 0.6); x.fillStyle = '#ff4f8a'; x.fillText(word, W / 2, my + mh + sz * 0.3 < H - sz ? my + mh + sz * 0.8 : my - sz * 0.6);
  x.restore();
}
function draw() {
  x.clearRect(0, 0, W, H);
  buildBg(); x.drawImage(bgCan, 0, 0, W, H);
  drawMirror();
  drawCard();
  // hair on the floor
  for (const b of bits) if (b.rest) { x.save(); x.translate(b.x, b.y); x.rotate(b.rot); x.beginPath(); x.moveTo(b.pts[0], b.pts[1]); for (let k = 2; k < b.pts.length; k += 2) x.lineTo(b.pts[k], b.pts[k + 1]); x.lineCap = 'round'; x.strokeStyle = b.o; x.lineWidth = b.w + 3; x.stroke(); x.strokeStyle = b.f; x.lineWidth = b.w; x.stroke(); x.restore(); }
  if (cust) {
    const c = cust, R = CU.R, hop = -Math.abs(Math.sin(c.hop * PI * 2)) * R * 0.12 * c.hop - (phase === 'enter' || phase === 'leave' ? Math.abs(Math.sin(phaseT * 12)) * R * 0.15 : 0);
    x.save(); x.translate(CU.x + c.ox * W, CU.y + hop); x.scale(R, R); drawCustomer(c); x.restore();
  }
  // armrests in front
  x.save(); x.translate(CU.x, CU.y); x.scale(CU.R, CU.R);
  for (const sd of [-1, 1]) { rr(sd * 1.2 - 0.17, 0.12, 0.34, 0.16, 0.08); fs(lgr(0, 0.1, 0, 0.3, '#ffb0cf', '#f06a9e'), '#b8326e', 0.04); rr(sd * 1.2 - 0.04, 0.26, 0.08, 0.36, 0.03); fs('#c9d2de', '#6f7f99', 0.03); }
  x.restore();
  drawHero();
  drawBasket();
  drawTray();
  drawGuides();
  drawHintArrow();
  for (const b of bits) if (!b.rest) { x.save(); x.translate(b.x, b.y); x.rotate(b.rot); x.beginPath(); x.moveTo(b.pts[0], b.pts[1]); for (let k = 2; k < b.pts.length; k += 2) x.lineTo(b.pts[k], b.pts[k + 1]); x.lineCap = 'round'; x.strokeStyle = b.o; x.lineWidth = b.w + 3; x.stroke(); x.strokeStyle = b.f; x.lineWidth = b.w; x.stroke(); x.restore(); }
  drawBitsAir();
  MG.fx.draw(x);
  drawDragTool();
  drawFloats();
  drawMirrorMoment();
  if (flash > 0) { x.fillStyle = `rgba(255,255,255,${flash.toFixed(3)})`; x.fillRect(0, 0, W, H); }
}
function drawBitsAir() {
  if (basket) for (const q of puffs) { const e = ease(q.t), px = lerp(q.sx, basket.x, e), py = lerp(q.sy, basket.y - basket.s * 0.5, e) - Math.sin(q.t * PI) * CU.R * 0.6; for (const [dx, dy] of [[0, 0], [0.6, 0.2], [-0.5, 0.3]]) { circ(px + dx * q.s, py + dy * q.s, q.s * 0.8); fs(q.col, '#d6c8b8', 1.5); } }
  for (const b of bubbles) { x.globalAlpha = clamp(b.life * 2, 0, 1); circ(b.x, b.y, b.r); fs('rgba(255,255,255,.7)', '#8cc3f0', 1.5); circ(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.25); fs('#fff'); }
  x.globalAlpha = 1; x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineCap = 'round'; x.lineWidth = 3;
  for (const w of winds) { x.globalAlpha = clamp(w.life * 3, 0, 1); x.beginPath(); x.moveTo(w.x, w.y); x.quadraticCurveTo(w.x - w.len * 0.5, w.y - 6, w.x - w.len, w.y); x.stroke(); }
  x.globalAlpha = 1;
}

// =====================================================================
// menu
// =====================================================================
function menu() {
  state = 'menu';
  const done = new Set(MG.store.get('salon.done', []));
  const icon = n => { const L = LEVELS[n - 1]; return L.free ? '📸' : L.c.length > 1 ? '🪑' : SP[L.c[0].sp].ic; };
  MG.choose({
    id: 'salon', title: '噗噗美髮店',
    html: `<p>噗噗開了一家美髮店！小動物客人坐上椅子，牆上的<b>照片</b>是牠想要的樣子。</p><p>從工具盒<b>拖工具</b>到毛上：梳子、剪刀、電剪、洗髮精、吹風機、捲髮棒、染髮噴罐、生髮水、亮晶晶，還有蝴蝶結和皇冠！</p><p>做好了，客人會照鏡子開心地拍照 📸。不會失敗，也不用計時，慢慢玩 ^_^</p>`,
    extra: [{ label: `📸 照片牆（${MG.store.get('salon.wall', []).length}）`, alt: true, on: () => showWall(menu) }],
    levels: { count: LEVELS.length, max: LEVELS.length,
      label: n => `${icon(n)} ${LEVELS[n - 1].nm}・${TYI[LEVELS[n - 1].ty]}${done.has(n) ? ' ✓' : ''}`,
      short: n => `${n}${TYI[LEVELS[n - 1].ty]}${done.has(n) ? '<small>✓</small>' : ''}` },
    playing: () => state === 'play',
    start: (m, lv) => startLevel(lv),
  });
}
// behind the start panel: a sample customer
LV = LEVELS[0]; tools = ['comb', 'scissors', 'dryer', 'curler', 'bow']; palCols = []; layout();
cust = makeCustomer({ sp: 'lion', g: [] }); cust.ox = 0; phase = 'work'; layout();
menu();

// =====================================================================
// test hook
// =====================================================================
window.SALT = {
  get state() { return state; }, get phase() { return phase; }, get level() { return level; }, levels: LEVELS.length, get qi() { return qi; }, get queueLen() { return queue.length; },
  start: n => startLevel(n), win: () => win(), tools: () => tools.slice(), pal: () => palCols.slice(), get dyeCol() { return dyeCol; },
  goals: () => cust ? cust.goals.map(g => ({ k: g.k, done: g.done, p: +g.p.toFixed(2), acc: g.acc, n: g.idx.length, ready: goalReady(cust, g) })) : [],
  // finish every goal the way a player would end up (solver for tests)
  solve() { if (!cust) return false; for (let r = 0; r < 12; r++) { for (const g of cust.goals) if (!g.done && goalReady(cust, g)) applyIdeal(cust, g); evalGoals(cust); } return cust.goals.every(g => g.done); },
  skip() { phaseT = 99; },
  client(lx, ly) { const r = cv.getBoundingClientRect(), B = 3; return { x: r.left + B + lx * (r.width - 2 * B) / cv.lw, y: r.top + B + ly * (r.height - 2 * B) / cv.lh }; },
  toolXY(id) { const s = slots.find(s => s.id === id); return s && this.client(s.x + s.w / 2, s.y + s.h / 2); },
  palXY(i) { const p = pal[i]; return p && this.client(p.x, p.y); },
  // screen points along the strands of goal i that still need work (u = 0..1 along the strand)
  goalPts(i, u = 0.6) { const g = cust.goals[i]; return g.idx.map(k => cust.strands[k]).filter(s => !GD[g.k].ok(s)).map(s => { const j = Math.round((s.np - 1) * u), q = toScreen(s.pts[2 * j], s.pts[2 * j + 1]); return this.client(q.x, q.y); }); },
  cutPts(i) { const g = cust.goals[i]; return g.idx.map(k => cust.strands[k]).filter(s => s.L > s.tl + 0.07).map(s => { const u = clamp((s.tl + 0.03) / s.L, 0, 1), j = Math.round((s.np - 1) * u), q = toScreen(s.pts[2 * j], s.pts[2 * j + 1]); return this.client(q.x, q.y); }); },
  goalPtsCol(i, col) { const g = cust.goals[i]; return g.idx.map(k => cust.strands[k]).filter(s => s.tc === col && s.col !== s.tc).map(s => { const j = Math.round((s.np - 1) * 0.7), q = toScreen(s.pts[2 * j], s.pts[2 * j + 1]); return this.client(q.x, q.y); }); },
  headXY() { const q = toScreen(0, HY - 0.6); return this.client(q.x, q.y); },
  tipOffset() { return drag ? { x: drag.tx, y: drag.ty } : null; }, get dragId() { return drag ? drag.id : null; },
  get wall() { return MG.store.get('salon.wall', []).length; }, get bits() { return bits.length; }, get woolN() { return woolN; },
  get frames() { return frames; }, get strands() { return cust ? cust.strands.length : 0; },
  photo: () => takePhoto(), nextFree: () => nextFree(), get freeN() { return freeN; },
};

let frames = 0;
MG.loop(dt => { frames++; update(dt); draw(); });
