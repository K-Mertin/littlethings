const hash = (a, b) => { let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; };

].filter(Boolean);

// colours per theme: snow (light, shade), side powder, shade rgba prefix, pine greens, fence
const PAL = {
  day: { snow: ['#ffffff', '#e4effb'], side: ['#dce9f8', '#c9dcf2'], shade: 'rgba(110,150,210,', pine: ['#55c08a', '#2f9a6a', '#1b6b4e'], fence: '#ff7a3c', track: 'rgba(130,160,210,.5)' },

// =====================================================================

let W = 360, H = 640, land = false, CW = 360, CX0 = 0, KX = 1;
MG.fit(cv, (sw, sh) => {

  land = asp > 1.1;
  if (land) { H = 540; W = Math.round(clamp(H * asp, 560, 1100)); } else { W = 360; H = Math.round(clamp(W / asp, 480, 900)); }
  CW = land ? Math.round(Math.min(560, W * 0.58)) : W; CX0 = Math.round((W - CW) / 2); KX = CW / 360;
  return [W, H];
});
cv.onfit = () => { bgK = ''; };
addEventListener('mg-big', () => { bgK = ''; });

// sprite cache (rebuilt when the backing scale changes)
const SPR = new Map();
function spr(key, w, h, fn) {
  const s = cv._mgScale || 1, k = key + '@' + s;
  let c = SPR.get(k);
  if (!c) { c = document.createElement('canvas'); c.width = Math.ceil(w * s); c.height = Math.ceil(h * s); const g = c.getContext('2d'); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round'; fn(g); SPR.set(k, c); if (SPR.size > 260) SPR.delete(SPR.keys().next().value); }
  return c;
}

const RIDE_V = () => mode === 'slow' ? 112 : 132;

const LAT = () => (LV.veh === 'sled' ? 255 : 310) * (mode === 'slow' ? 0.95 : 1);
const AIR_T = () => mode === 'slow' ? 1.2 : 1.02;
const heroY0 = () => H * (LV.chase ? 0.42 : land ? 0.3 : 0.28);

// ---------- level builder (seeded: the same level always looks the same) ----------
function genLevel(n) {
  const L = LEVELS[n - 1], rng = mulberry(n * 7919 + 101), R = (a, b) => a + rng() * (b - a), RI = (a, b) => Math.floor(R(a, b + 1));
  const len = Math.round(3300 + n * 90 + (L.path ? 300 : 0) + (L.goal === 'gates' ? L.n * 40 : 0));
  const O = [], prot = [];
  const add = o => { O.push(o); return o; };
  const protect = (u, y0, y1, hw) => prot.push({ u, y0, y1, hw });
  const free = (u, y, pad = 0) => prot.every(p => y < p.y0 || y > p.y1 || Math.abs(u - p.u) > p.hw + pad);
  const Y0 = 430, Y1 = len - 280;
  let pc = null, pp = null; const phw = 74;
  if (L.path) { const ph = R(0, 6); pc = y => 180 + 92 * Math.sin(y / 290 + ph) * clamp((y - 200) / 500, 0, 1); }
  const lane = y => pc ? pc(y) : 180;
  protect(180, -200, 380, 70);
  const liftEnd = L.ride ? (L.goal === 'balloon' ? 2100 : 1500) : LIFT_END;
  if (L.lift || L.ride) protect(LIFT_U + 15, -200, liftEnd + 80, 34);   // nothing under the chairlift
  // stars
  const starLine = (u0, y0, cnt, pat, dir) => {
    for (let j = 0; j < cnt; j++) {
      const sy = y0 + j * 48;
      let u = pc ? pc(sy) : pat === 0 ? u0 : pat === 1 ? u0 + Math.sin(j * 1.2) * 40 : u0 + dir * (j - cnt / 2) * 26;
      u = clamp(u, 30, 330); add({ k: 'star', u, y: sy }); protect(u, sy - 60, sy + 30, 30);
    }
  };
  // ramps / rails: an even row of features with clear run-ups
  const addRamp = (u, y) => { add({ k: 'ramp', u, y, w: 84 }); protect(u, y - 240, y + 340, 58); add({ k: 'star', u, y: y + 350 }); add({ k: 'star', u, y: y + 396 }); };
  const addRail = (u, y) => { const y2 = y + R(200, 260); add({ k: 'rail', u, y, y2 }); protect(u, y - 190, y2 + 70, 44); add({ k: 'star', u, y: y2 + 60 }); };
  const fits = (u, y0, y1, hw) => { for (let y = y0; y <= y1; y += 30) if (!free(u, y, hw)) return false; return true; };
  const extra = (count, fn, run0, run1) => { for (let i = 0, tries = 0; i < count && tries < 80; tries++) { const y = R(Y0 + 100, Y1 - 300), u = R(90, 270); if (fits(u, y - run0, y + run1, 30)) { fn(u, y); i++; } } };

  if (L.goal === 'gates') {
    const N = L.n, sp = (Y1 - Y0) / (N - 1), A = Math.min(105, 45 + n * 2.2), gw = L.gw;
    for (let i = 0; i < N; i++) {

const HUDC = { day: ['#eaf4ff', '#5a8ad0'], forest: ['#e6f6ec', '#3f9a6a'], sunset: ['#ffeef0', '#d0607a'], night: ['#e8ecff', '#5a62c0'], candy: ['#fff0f8', '#e0509a'], aurora: ['#e6fff6', '#3fa088'] };

function lvLabel(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n}. ${L.mk} ${L.nm}　${'★'.repeat(b)}${'☆'.repeat(3 - b)}`; }
function lvShort(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n}${L.mk}<small>${'★'.repeat(b)}${'☆'.repeat(3 - b)}</small>`; }
function menu() {

  get ph() { return S.ph; }, get goal() { return goalPair(); }, get hatC() { return S.hatC; }, get rideY() { return S.rideY; }, get rating() { return rating(); }, get stars() { return S.stars; }, get bumps() { return S.bumps; }, get len() { return S.len; },

function pilot() {

  const ahead = LV.goal === 'roll' ? ballOff(S.rb) : 0;
