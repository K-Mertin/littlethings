'use strict';
// 小羊回家：兩種「讓大家出去」的益智玩法輪流出現 — 👆 點動物走出柵欄（Sheep Out）和 🧱 推推滑滑（華容道 / 塞車）
MG.init({ id: 'sheep', title: '小羊回家', stats: ['level', 'moves'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
// ===== ENGINE START (pure rules + solvers, no DOM; the build script runs this same code) =====
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];

// ---------- 🐑 tap-out: tap an animal, it walks straight ahead and leaves through a gap in the fence ----------
// def: { k:'t', W, H, an:[[x, y, dir, len, colour, sleeping]], ex: null (every side open) | [[side, index, colour]],
//        rk:[[x,y]] rocks/bushes, tn:[[x,y,dir]] fixed 🔄 turn tiles, sp:[[x,y,dir]] signposts you can turn by tapping, cr:[[x,y]] 🥕 carrots }
// sides: 0 right (index = y) · 1 bottom (index = x) · 2 left (index = y) · 3 top (index = x); colour 0 = any animal may pass
function tBoard(def) {
  const W = def.W, H = def.H, N = W * H;
  const B = { k: 't', W, H, N, rock: new Uint8Array(N), turn: new Int8Array(N).fill(-1), sign: new Int8Array(N).fill(-1), carrot: new Int8Array(N).fill(-1),
    len: def.an.map(a => a[3] || 1), col: def.an.map(a => a[4] || 0), n: def.an.length, nc: (def.cr || []).length, ns: (def.sp || []).length,
    signs: (def.sp || []).map(([x, y]) => y * W + x), exit: [0, 1, 2, 3].map(s => new Int8Array(s % 2 ? W : H).fill(def.ex ? -1 : 0)) };
  for (const [x, y] of def.rk || []) B.rock[y * W + x] = 1;
  for (const [x, y, d] of def.tn || []) B.turn[y * W + x] = d;
  (def.sp || []).forEach(([x, y], k) => B.sign[y * W + x] = k);
  (def.cr || []).forEach(([x, y], k) => B.carrot[y * W + x] = k);
  if (def.ex) for (const [s, i, c] of def.ex) B.exit[s][i] = c || 0;
  return B;
}
// state: a = animals { x, y (head), d, g gone, w awake }, c = carrots still on the ground (bits), s = signpost directions
function tInit(def) { return { a: def.an.map(([x, y, d, , , sl]) => ({ x, y, d, g: 0, w: sl ? 0 : 1 })), c: (1 << (def.cr || []).length) - 1, s: (def.sp || []).map(q => q[2]) }; }
function tClone(S) { return { a: S.a.map(a => ({ ...a })), c: S.c, s: S.s.slice() }; }
function tCells(B, a, i) { const out = []; for (let k = 0; k < B.len[i]; k++) out.push([a.x - DX[a.d] * k, a.y - DY[a.d] * k]); return out; }
function tOcc(B, S, skip) {
  const o = new Int16Array(B.N).fill(-1);
  S.a.forEach((a, i) => { if (a.g || i === skip) return; for (const [x, y] of tCells(B, a, i)) if (x >= 0 && y >= 0 && x < B.W && y < B.H) o[y * B.W + x] = i; });
  return o;
}
// what happens when animal i is tapped: { kind: 'exit' | 'stop' (ate a 🥕) | 'bump' | 'sleep', path: [[x,y,d]…], who (animal bumped into), why, side, idx }
function tTap(B, S, i) {
  const a = S.a[i]; if (!a || a.g) return null;
  if (!a.w) return { kind: 'sleep', path: [] };
  const o = tOcc(B, S, i), path = [];
  let x = a.x, y = a.y, d = a.d;
  for (let steps = 0; steps < B.N * 4 + 8; steps++) {
    const nx = x + DX[d], ny = y + DY[d];
    if (nx < 0 || ny < 0 || nx >= B.W || ny >= B.H) {
      const side = d, idx = d % 2 ? x : y, ec = B.exit[side][idx];
      if (ec < 0) return { kind: 'bump', path, why: 'fence', side, idx };
      if (ec > 0 && ec !== B.col[i]) return { kind: 'bump', path, why: 'door', side, idx, ec };
      return { kind: 'exit', path, side, idx };
    }
    const p = ny * B.W + nx;
    if (B.rock[p]) return { kind: 'bump', path, why: 'rock', at: p };
    if (o[p] >= 0) return { kind: 'bump', path, why: 'animal', who: o[p] };
    x = nx; y = ny; path.push([x, y, d]);
    const ck = B.carrot[p];
    if (ck >= 0 && (S.c >> ck & 1)) return { kind: 'stop', path, carrot: ck };
    if (B.turn[p] >= 0) d = B.turn[p];
    else if (B.sign[p] >= 0) d = S.s[B.sign[p]];
  }
  return { kind: 'bump', path: path.slice(0, 2), why: 'loop' };
}
// the new state after a tap (null when nothing changes)
function tApply(B, S, i, r) {
  if (!r) return null;
  if (r.kind === 'exit') { const N = tClone(S); N.a[i].g = 1; return N; }
  if (r.kind === 'stop') { const N = tClone(S), q = r.path[r.path.length - 1]; N.a[i].x = q[0]; N.a[i].y = q[1]; N.a[i].d = q[2]; N.c &= ~(1 << r.carrot); return N; }
  if (r.kind === 'bump' && r.why === 'animal' && !S.a[r.who].w) { const N = tClone(S); N.a[r.who].w = 1; return N; }
  return null;
}
function tTurnSign(B, S, k) { const N = tClone(S); N.s[k] = (N.s[k] + 1) % 4; return N; }
const tWon = (B, S) => S.a.every(a => a.g) && !S.c;
const tKey = S => S.a.map(a => a.g ? '-' : `${a.x},${a.y},${a.d}${a.w ? '' : 'z'}`).join(' ') + '|' + S.c + '|' + S.s.join('');
// every move from S: [action, newState] — action i = tap animal i, action -1-k = turn signpost k
function tNext(B, S) {
  const out = [];
  for (let i = 0; i < B.n; i++) { if (S.a[i].g || !S.a[i].w) continue; const N = tApply(B, S, i, tTap(B, S, i)); if (N) out.push([i, N]); }
  for (let k = 0; k < B.ns; k++) out.push([-1 - k, tTurnSign(B, S, k)]);
  return out;
}
// breadth-first search: the fewest taps to get everyone out (null = no way any more)
function tSolve(B, S0, limit = 200000) {
  if (tWon(B, S0)) return [];
  const seen = new Map([[tKey(S0), null]]), q = [S0], keys = [tKey(S0)];
  for (let h = 0; h < q.length; h++) {
    if (q.length > limit) return null;
    for (const [act, N] of tNext(B, q[h])) {
      const k = tKey(N); if (seen.has(k)) continue;
      seen.set(k, [keys[h], act]);
      if (tWon(B, N)) { const path = []; let kk = k; while (seen.get(kk)) { const [pk, a] = seen.get(kk); path.push(a); kk = pk; } return path.reverse(); }
      q.push(N); keys.push(k);
    }
  }
  return null;
}

// ---------- 🧱 sliding blocks (華容道 / Rush Hour): drag pieces until the hero (piece 0) reaches the exit ----------
// def: { k:'s', W, H, p:[[x, y, w, h, kind, lock]], g:[gx, gy] hero goal, ed: exit side, ice:[[x,y]] }   lock: 0 free · 1 left/right only · 2 up/down only
function sBoard(def) {
  const W = def.W, H = def.H, N = W * H, ice = new Uint8Array(N);
  for (const [x, y] of def.ice || []) ice[y * W + x] = 1;
  const p = def.p, cls = p.map((q, i) => i === 0 ? 'H' : `${q[2]}${q[3]}${q[5] || 0}`);
  return { k: 's', W, H, N, ice, hasIce: (def.ice || []).length > 0, n: p.length, w: p.map(q => q[2]), h: p.map(q => q[3]), lock: p.map(q => q[5] || 0), kind: p.map(q => q[4]), cls, gx: def.g[0], gy: def.g[1], ed: def.ed };
}
function sInit(def) { const P = []; for (const q of def.p) P.push(q[0], q[1]); return P; }
function sOcc(B, P) { const o = new Int16Array(B.N).fill(-1); for (let i = 0; i < B.n; i++) for (let yy = 0; yy < B.h[i]; yy++) for (let xx = 0; xx < B.w[i]; xx++) o[(P[2 * i + 1] + yy) * B.W + P[2 * i] + xx] = i; return o; }
function sFree(B, o, i, x, y) {
  if (x < 0 || y < 0 || x + B.w[i] > B.W || y + B.h[i] > B.H) return false;
  for (let yy = 0; yy < B.h[i]; yy++) for (let xx = 0; xx < B.w[i]; xx++) { const v = o[(y + yy) * B.W + x + xx]; if (v >= 0 && v !== i) return false; }
  return true;
}
function sOnIce(B, i, x, y) { if (!B.hasIce) return false; for (let yy = 0; yy < B.h[i]; yy++) for (let xx = 0; xx < B.w[i]; xx++) if (B.ice[(y + yy) * B.W + x + xx]) return true; return false; }
const sDirOK = (B, i, d) => !B.lock[i] || (B.lock[i] === 1 ? d % 2 === 0 : d % 2 === 1);
// how far piece i can go in direction d (ignoring ice)
function sReach(B, P, i, d, o = sOcc(B, P)) { if (!sDirOK(B, i, d)) return 0; let x = P[2 * i], y = P[2 * i + 1], k = 0; while (sFree(B, o, i, x + DX[d], y + DY[d])) { x += DX[d]; y += DY[d]; k++; } return k; }
// where piece i comes to rest after being let go k cells away in direction d (ice keeps it sliding)
function sSettle(B, P, i, d, k, o = sOcc(B, P)) {
  let x = P[2 * i] + DX[d] * k, y = P[2 * i + 1] + DY[d] * k, slid = 0;
  while (k > 0 && sOnIce(B, i, x, y) && sFree(B, o, i, x + DX[d], y + DY[d])) { x += DX[d]; y += DY[d]; slid++; }
  return { x, y, k: k + slid, slid };
}
// every move: [i, d, k, x, y] (one straight drag of one piece = one move)
function sMoves(B, P) {
  const o = sOcc(B, P), out = [];
  for (let i = 0; i < B.n; i++) for (let d = 0; d < 4; d++) {
    if (!sDirOK(B, i, d)) continue;
    let x = P[2 * i], y = P[2 * i + 1], k = 0;
    while (sFree(B, o, i, x + DX[d], y + DY[d])) {
      x += DX[d]; y += DY[d]; k++;
      if (!sOnIce(B, i, x, y) || !sFree(B, o, i, x + DX[d], y + DY[d])) out.push([i, d, k, x, y]);
    }
  }
  return out;
}
function sKey(B, P) {
  const g = {};
  for (let i = 0; i < B.n; i++) (g[B.cls[i]] = g[B.cls[i]] || []).push(P[2 * i + 1] * B.W + P[2 * i]);
  return Object.keys(g).sort().map(c => c + ':' + g[c].sort((a, b) => a - b).join(',')).join(';');
}
const sWon = (B, P) => P[0] === B.gx && P[1] === B.gy;
// breadth-first search: the fewest drags to bring the hero to the exit → [[i, d, k], …] (null = not found)
function sSolve(B, P0, limit = 400000) {
  if (sWon(B, P0)) return [];
  const k0 = sKey(B, P0), seen = new Map([[k0, null]]), q = [P0], keys = [k0];
  for (let h = 0; h < q.length; h++) {
    if (q.length > limit) return null;
    const P = q[h];
    for (const [i, d, k, x, y] of sMoves(B, P)) {
      const N = P.slice(); N[2 * i] = x; N[2 * i + 1] = y;
      const key = sKey(B, N); if (seen.has(key)) continue;
      seen.set(key, [keys[h], [i, d, k]]);
      if (sWon(B, N)) { const path = []; let kk = key; while (seen.get(kk)) { const [pk, m] = seen.get(kk); path.push(m); kk = pk; } return path.reverse(); }
      q.push(N); keys.push(key);
    }
  }
  return null;
}
// ===== ENGINE END =====

    if (!path) { stuckT = 5; MG.toast(`${MG.WORDS.oops} ↩️`, 2400); MG.sfx('miss'); return; }

// ---------- backgrounds (cached) ----------
function paintBg(g, w, h, th) {

  g.lineTo(w, h); g.lineTo(0, h); g.fill();

  else if (th === 3) for (let i = 0; i < 6; i++) pine(g, w * hash(i, 21), horizon * (0.95 + hash(i, 22) * 0.15), 12 + hash(i, 23) * 12, false, '#1f3d36');

  for (let i = 0; i <= 4; i++) g.quadraticCurveTo(w * (i + 0.5) / 4, horizon * (1.02 + hash(i, 41) * 0.12), w * (i + 1) / 4, horizon * (1.16 + hash(i, 42) * 0.06));
  g.lineTo(w, h); g.lineTo(0, h); g.fill();

    g.fillStyle = '#d9534a'; g.strokeStyle = '#8e2f2a'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(bx - s, by); g.lineTo(bx - s, by - s * 0.9); g.lineTo(bx, by - s * 1.5); g.lineTo(bx + s, by - s * 0.9); g.lineTo(bx + s, by); g.closePath(); g.fill(); g.stroke();

  solveVar(n, v) { const d = LEVELS[n - 1].v[v]; return d.k === 't' ? tSolve(tBoard(d), tInit(d), 400000) : sSolve(sBoard(d), sInit(d), 900000); },
  solveNow: () => fam === 't' ? tSolve(B, S, 400000) : sSolve(B, S, 900000),
  tap: i => tapAnimal(i), sign: k => turnSign(k), slide: (i, d, k) => slideTo(i, d, k), finish() { finishAll(); if (fam === 't') homeN = S.a.filter(a => a.g).length; if (sanim) sanim = null; },
  win() { const sol = this.solveNow(); if (!sol) return false; for (const m of sol) { this.finish(); if (fam === 't') { m >= 0 ? tapAnimal(m) : turnSign(-1 - m); } else { slideTo(m[0], m[1], m[2]); sanim = null; } } this.finish(); return fam === 't' ? tWon(B, S) : sWon(B, S); },
  hint: () => { showHint(); return hint && { ...hint }; }, undo: () => undo(), restart: () => restart(), nextVar: () => nextVar(),
  won: () => fam === 't' ? tWon(B, S) : sWon(B, S), st: () => JSON.parse(JSON.stringify(S)), def: () => JSON.parse(JSON.stringify(D)), floats: () => floats.map(f => f.text),
  dims: () => ({ W, H, cs, ox, oy, land, btns: btns.map(b => ({ ...b })) }),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), Bd = 3; return { x: rc.left + Bd + lx * (rc.width - 2 * Bd) / W, y: rc.top + Bd + ly * (rc.height - 2 * Bd) / H }; },
  cellClient(cx0, cy0) { return this.toClient(CX(cx0), CY(cy0)); },
  pieceClient(i) { return this.toClient(ox + (S[2 * i] + B.w[i] / 2) * cs, oy + (S[2 * i + 1] + B.h[i] / 2) * cs); },
  get anims() { return anims.length + hoppers.length + (sanim ? 1 : 0) + (heroOut && !heroOut.done ? 1 : 0); },
};

MG.loop(dt => {
  t += dt; MG.fx.step(dt);
  if (fam === 't') stepAnims(dt); else stepSlide(dt);
  for (const f of floats) { f.life -= dt; f.y -= dt * 30; } floats = floats.filter(f => f.life > 0);
  for (const k in bumpShake) { bumpShake[k] -= dt; if (bumpShake[k] <= 0) delete bumpShake[k]; }
  for (const k in signSpin) { signSpin[k] -= dt * 4; if (signSpin[k] <= 0) delete signSpin[k]; }
  for (const k in eatT) if (eatT[k] >= 0) eatT[k] += dt;
  if (hint) { hint.t += dt; if (hint.t > 8) hint = null; }
  if (stuckT > 0) stuckT -= dt;
  if (pressT > 0) pressT -= dt;
  if (barnBounce > 0) barnBounce = Math.max(0, barnBounce - dt * 1.6);
  if (state === 'won') winT += dt;
  stepAmbient(dt);
  draw();
});
</script>
