.mg-pick:has(> .mg-opt:nth-child(3):last-child){grid-template-columns:1fr 1fr 1fr}

.mg-card .stars{color:#ffb300;letter-spacing:4px;text-shadow:0 2px 0 #d98a00}

.k2-gal figcaption{font-size:12px;color:var(--mute)}
.mg-pick:has(> .mg-opt:nth-child(5)){grid-template-columns:repeat(6,1fr)}

.mg-pick:has(> .mg-opt:nth-child(5)) .mg-opt:nth-child(4){grid-column:2 / span 2}
.mg-pick:has(> .mg-opt:nth-child(5)) .mg-opt small{font-size:calc(11.5px * var(--ui))}
.k2-card{display:block;width:min(100%,300px);aspect-ratio:3/2;margin:6px auto;background:#fffaf0;border:4px solid #ffcf4a;border-radius:16px;box-shadow:0 4px 0 #e8a400}
.k2-new{background:#fff6d8;border-radius:14px;padding:6px 10px;margin:8px 0;text-align:left}
.k2-new p{margin:3px 0!important}

function draw() {

// =====================================================================
// flow
// =====================================================================
let hudS = '';
function hud() {
  const info = state === 'menu' ? '🎂🍣🍦🍕🧋' : (mode === 'challenge' ? `👥${special ? '' : ' '}${served}/${needN}` : mode === 'free' ? '🎨 自由做' : `👥 ${served}`) + (special ? ` 🌟${spDone}${spGoal ? '/' + spGoal : ''}` : '');
  const s = info + '|' + coins; if (s === hudS) return; hudS = s; MG.stat('info', info); MG.stat('coins', `🪙 ${coins}`);
}
function starsAll() { const s = MG.store.get('kitchen2.stars', {}) || {}; for (const k of SHOPS) if (!Array.isArray(s[k])) s[k] = []; return s; }
function startShop() {
  wk = freshWork(); hist = []; pend = null; plates = []; drag = null; pops = []; MG.fx.clear(); dropA = null; knifeA = null; flashT = 0; wob = 0; wobV = 0;
  served = 0; correct = 0; combo = 0; earned = 0; spawned = 0; idle = 0; stepT = 0;

  introPanels();
}
// 🌟 今日特餐: one fancy recipe per shop and level that changes every day
function makeSpecial() {
  const dayN = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
  return makeOrder(shop, 6, seeded(dayN * 97 + SHOPS.indexOf(shop) * 31 + level * 7 + 11));
}
// new shops, the special and the new decorations are explained once; the special's recipe card shows every time
const NEWS = {
  pizza: ['🍕 披薩店開張！', '用手指在麵團上滑來滑去把它推開，抹上醬料、撒起司、放配料，送進烤箱烤好，再切三刀就完成了！'],
  drink: ['🧋 飲料店開張！', '先選珍珠，再把飲料倒進杯子。蓋上蓋子左右搖一搖（手指左右滑或一直點），最後加上配料就能送給客人。'],
  special: ['🌟 今日特餐', '每天的特餐都不一樣！有 ⭐ 的客人要點特餐，做好可以拿到雙倍金幣。'],
  newi: ['🎁 新材料', '第 9、10 關有新的材料可以用，客人也會點喔！'],
};
function introPanels() {
  const keys = [];

  if (level >= 9 && mode !== 'free' && !MG.store.get('kitchen2.seen.newi.' + shop, false)) keys.push('newi');
  if (!keys.length && !special) return;
  keys.forEach(k => MG.store.set('kitchen2.seen.' + (k === 'newi' ? 'newi.' + shop : k), true));
  const items = level >= 9 && keys.includes('newi') ? NEWI[shop] : [];
  state = 'intro';
  MG.panel({
    title: special ? '🌟 今日特餐' : '新東西！✨',
    html: (keys.length ? `<div class="k2-new">${keys.map(k => `<p><b>${NEWS[k][0]}</b><br>${NEWS[k][1]}</p>`).join('')}</div>` : '') +
      (items.length ? `<canvas class="k2-card" id="k2new" width="600" height="400"></canvas>` : '') +
      (special ? `<canvas class="k2-card" id="k2sp" width="600" height="400"></canvas><p>照這張食譜做${spGoal ? ` ${spGoal} 份` : ''}特餐給有 ⭐ 的客人！</p>` : ''),
    buttons: [{ label: '開店！', on: () => { state = 'play'; MG.hide(); } }],

  const cs = document.getElementById('k2sp');
  if (cs) { const g = cs.getContext('2d'); g.scale(2, 2); g.fillStyle = '#fffaf0'; g.fillRect(0, 0, 300, 200); drawOrder(g, shop, special, { x: 14, y: 12, w: 272, h: 176 }); }
  const cn = document.getElementById('k2new');
  if (cn) { const g = cn.getContext('2d'); g.scale(2, 2); g.fillStyle = '#fffaf0'; g.fillRect(0, 0, 300, 200); items.forEach((id, i) => { drawIcon(g, id, 85 + i * 130, 100, 46); }); }
}
function endLevel() {
  state = 'over'; drag = null;

  const all = starsAll(); all[shop][level - 1] = Math.max(all[shop][level - 1] || 0, st); MG.store.set('kitchen2.stars', all);
  MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 400);
  const nx = level < NLV;
  MG.panel({
    title: `第 ${level} 關 打烊囉！`,
    html: `<div class="big stars">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</div><p>招待了 ${needN} 位客人，做對 ${correct} 份，賺了 🪙 ${earned}</p>` +
      (st === 3 ? '<p class="new">每一份都做對了，太厲害了！</p>' : '<p>星星看的是做得對不對，不是快不快喔，慢慢看清楚泡泡再做 ^_^</p>') +
      (special ? `<p>🌟 今日特餐做了 ${spDone} 份</p>` : '') + `<p>總共招待了 ${totalServed} 位客人</p>`,
    buttons: [

}
function lvLabel(n) { const s = (starsAll()[shop] || [])[n - 1] || 0, mk = n >= 9 ? '🎁' : n >= 7 ? '🌟' : ''; return s ? `${n}${mk} ${'⭐'.repeat(s)}` : `第 ${n} 關${mk}`; }
const MENU = {

  picks: [{ key: 'shop', title: '要開哪一家店？', def: 'cake', options: [{ id: 'cake', label: '🎂 蛋糕店', sub: '烤・抹・裝飾' }, { id: 'sushi', label: '🍣 壽司店', sub: '捲・切・握' }, { id: 'ice', label: '🍦 冰淇淋店', sub: '疊・淋・撒' }, { id: 'pizza', label: '🍕 披薩店', sub: '推・抹・烤' }, { id: 'drink', label: '🧋 飲料店', sub: '倒・搖・加' }] }],
  modesTitle: '怎麼玩？',
  modes: [{ id: 'relax', label: '🐢 慢慢做', sub: '客人一直等' }, { id: 'challenge', label: '⭐ 開店挑戰', sub: '做對拿星星' }, { id: 'free', label: '🎨 自由做', sub: '沒有客人', noLevels: true }],
  levelsTitle: '第幾關？（越後面越複雜・🌟 今日特餐・🎁 新材料）', levels: { count: NLV, max: NLV, label: lvLabel },
  extra: [{ label: '📸 蛋糕相簿', alt: true, on: () => showGallery() }],

  playing: () => state === 'play',
  restore: () => { state = 'play'; },

}

}
function showGallery() {

    title: '📸 蛋糕相簿',
    html: g.length ? `<p>做好的蛋糕都會拍照存在這裡（最多 ${24} 張）</p><div class="k2-gal">${g.slice().reverse().map((_, i) => `<figure><canvas width="240" height="200" data-gi="${g.length - 1 - i}"></canvas></figure>`).join('')}</div>` : '<p>還沒有照片喔！到蛋糕店做一個蛋糕，吹完蠟燭就會拍照 ^_^</p>',

  const bgG = g.createLinearGradient(0, 0, 0, c.height); bgG.addColorStop(0, '#fff3f8'); bgG.addColorStop(1, '#ffe0ec'); g.fillStyle = bgG; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 14; i++) circ(g, (i * 53) % c.width, (i * 37) % (c.height * 0.5), 3, 'rgba(255,140,185,.25)');
  drawCake(g, { shape: e.s, cream: e.c, creamDone: true, phase: 'sponge', items: e.i || [], spr: e.p || [], pipe: e.q || [] }, c.width / 2, c.height * 0.44, c.height * 0.34, { board: true });
}

// =====================================================================
// boot
// =====================================================================
wk = freshWork();
hud(); menu();
let frameN = 0;
MG.loop(dt => {
  const t0 = performance.now();
  t += dt; frameN++;
  if (state === 'play') update(dt);
  for (const p of pops) { p.y -= 34 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0);
  MG.fx.step(dt); flashT = Math.max(0, flashT - dt);

  frameMs = frameMs * 0.95 + (performance.now() - t0) * 0.05;

// test hook (read-only snapshots + a few helpers)
function toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; }
window.K2 = {
  get state() { return state; }, get shop() { return shop; }, get mode() { return mode; }, get level() { return level; }, get step() { return wk.step; },
  get coins() { return coins; }, get served() { return served; }, get correct() { return correct; }, get needN() { return needN; }, get totalServed() { return totalServed; }, get pend() { return !!pend; },
  get frameMs() { return frameMs; }, get frames() { return frameN; },

  judge: (sh, o, d) => judge(sh, o, d), makeOrder: (sh, lv) => makeOrder(sh, lv), canonCake, canonIce,
  tray: () => trayItems().map(r => ({ id: r.id, ...toClient(r.x + r.w / 2, r.y + r.h / 2), locked: !isUnlocked(r.id) })),
  cards: () => cards().map(r => ({ id: r.id, ...toClient(r.x + r.w / 2, r.y + r.h / 2) })),
  pt: (lx, ly) => toClient(lx, ly),
  geo: () => ({ W, H, land, undo: toClient(Lo.undo.x, Lo.undo.y), next: toClient(Lo.next.x, Lo.next.y), cake: toClient(Lo.cakeC.x, Lo.cakeC.y), cakeR: Lo.cakeR * cv.getBoundingClientRect().width / W,
    nori: { a: toClient(Lo.nori.x, Lo.nori.y), b: toClient(Lo.nori.x + Lo.nori.w, Lo.nori.y + Lo.nori.h) }, mat: { a: toClient(Lo.mat.x, Lo.mat.y), b: toClient(Lo.mat.x + Lo.mat.w, Lo.mat.y + Lo.mat.h) },
    board: toClient(Lo.board.x + Lo.board.w / 2, Lo.board.y + Lo.board.h / 2), geta: toClient(Lo.geta.x + Lo.geta.w / 2, Lo.geta.y + Lo.geta.h / 2), oven: toClient(Lo.oven.x + Lo.oven.w / 2, Lo.oven.y + Lo.oven.h / 2),
    ice: toClient(Lo.ice.cx, Lo.ice.baseY + (wk.scoops && wk.scoops.length ? stackTopY() : 0) * Lo.ice.r), product: (() => { const r = productRect(); return toClient(r.x + r.w / 2, r.y + r.h / 2); })(),
    seats: seats.map((_, i) => { const g = seatGeo(i); return toClient(g.fx, g.fy); }), friend: toClient(friendPos().x, friendPos().y), belt: toClient(W * 0.3, Lo.beltY),
    flames: wk.step === 'party' ? candleFlames().map(f => toClient(f.x, f.y)) : [], scale: cv.getBoundingClientRect().width / W,
    piz: toClient(Lo.piz.x, Lo.piz.y), pizR: Lo.piz.r * cv.getBoundingClientRect().width / W, cup: toClient(Lo.cup.cx, Lo.cup.by - Lo.cup.s * 1.5), cupS: Lo.cup.s * cv.getBoundingClientRect().width / W }),
  get special() { return special && JSON.parse(JSON.stringify(special)); }, get spDone() { return spDone; }, next: () => doNext(), tapItem: id => trayTap(id), ready: () => state === 'intro' && (state = 'play', MG.hide()),
  gallery: () => MG.store.get('kitchen2.gallery', []), unlocks: () => [...unlocks], stars: () => starsAll(),
  ff: sec => { for (let i = 0; i < sec * 30; i++) update(1 / 30); },
