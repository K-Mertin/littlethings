<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗小廚房 第二季</title>
<link rel="stylesheet" href="mini.css">
<style>
.mg-pick:has(> .mg-opt:nth-child(3):last-child){grid-template-columns:1fr 1fr 1fr}
.mg-pick:has(> .mg-opt:nth-child(3):last-child) .mg-opt{font-size:15px;padding:8px 3px}
.mg-card .stars{color:#ffb300;letter-spacing:4px;text-shadow:0 2px 0 #d98a00}
.k2-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:8px}
.k2-gal canvas{width:100%;aspect-ratio:6/5;background:#fff6f9;border:3px solid #f3c4d6;border-radius:12px;display:block}
.k2-gal figure{margin:0}
.k2-gal figcaption{font-size:12px;color:var(--mute)}
.mg-pick:has(> .mg-opt:nth-child(5)){grid-template-columns:repeat(6,1fr)}
.mg-pick:has(> .mg-opt:nth-child(5)) .mg-opt{grid-column:span 2;font-size:calc(15px * var(--ui));padding:8px 2px}
.mg-pick:has(> .mg-opt:nth-child(5)) .mg-opt:nth-child(4){grid-column:2 / span 2}
.mg-pick:has(> .mg-opt:nth-child(5)) .mg-opt small{font-size:calc(11.5px * var(--ui))}
.mg-pick:has(> .mg-opt:nth-child(7)){grid-template-columns:repeat(8,1fr)}
.mg-pick:has(> .mg-opt:nth-child(7)) .mg-opt{grid-column:span 2;font-size:calc(14px * var(--ui));padding:7px 1px}
.mg-pick:has(> .mg-opt:nth-child(7)) .mg-opt:nth-child(4){grid-column:auto / span 2}
.mg-pick:has(> .mg-opt:nth-child(7)) .mg-opt:nth-child(5){grid-column:2 / span 2}
.mg-pick:has(> .mg-opt:nth-child(7)) .mg-opt small{font-size:calc(10.5px * var(--ui))}
.k2-card{display:block;width:min(100%,300px);aspect-ratio:3/2;margin:6px auto;background:#fffaf0;border:4px solid #ffcf4a;border-radius:16px;box-shadow:0 4px 0 #e8a400}
.k2-new{background:#fff6d8;border-radius:14px;padding:6px 10px;margin:8px 0;text-align:left}
.k2-new p{margin:3px 0!important}
</style>
</head>

// a little picture for each new kind of level

function endLevel() {

      ...(nx ? [{ label: '下一關', on: () => { level++; MG.store.set('kitchen2.pickLevel', level); startShop(); } }] : []),

}
