// =====================================================================================
// fruits & veggies, all drawn in code: p = silhouette path, sk = skin [light, mid, dark], ln = outline,
// fl = flesh [light, dark], tex = skin texture (clipped), top = stem / leaves, ins = what the cut face shows,

const SH = (g, r, a, b, c) => { const q = g.createRadialGradient(-r * 0.38, -r * 0.42, r * 0.05, -r * 0.05, 0, r * 1.15); q.addColorStop(0, a); q.addColorStop(0.45, b); q.addColorStop(1, c); return q; };
const ell = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 7); };
function leaf(g, x, y, s, rot, c = '#4fbf4a', d = '#2a7f34') {
  g.save(); g.translate(x, y); g.rotate(rot);
  const lg = g.createLinearGradient(0, -s * 0.4, 0, s * 0.4); lg.addColorStop(0, '#a6ee7a'); lg.addColorStop(1, c);
  g.fillStyle = lg; g.strokeStyle = d; g.lineWidth = Math.max(1, s * 0.11);
  g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(s * 0.5, -s * 0.55, s * 1.1, 0); g.quadraticCurveTo(s * 0.5, s * 0.55, 0, 0); g.fill(); g.stroke();
  g.strokeStyle = 'rgba(42,127,52,.55)'; g.lineWidth = Math.max(0.6, s * 0.06); g.beginPath(); g.moveTo(s * 0.12, 0); g.lineTo(s * 0.88, 0); g.stroke();
  g.restore();
}
function stem(g, x0, y0, x1, y1, w, c = '#7a5520') { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo((x0 + x1) / 2 + w, (y0 + y1) / 2, x1, y1); g.stroke(); }
function seeded(n) { let s = n * 9301 + 49297; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function dots(g, r, n, col, sz, seed = 3) { const rnd = seeded(seed); g.fillStyle = col; for (let i = 0; i < n; i++) { const a = rnd() * 7, d = Math.sqrt(rnd()) * r; g.beginPath(); g.arc(Math.cos(a) * d, Math.sin(a) * d, sz * (0.6 + rnd() * 0.6), 0, 7); g.fill(); } }
function citrus(g, r, n, pith) {   // segments with white pith

  for (let i = 0; i < n; i++) { const a = i * 2 * PI / n; g.beginPath(); g.moveTo(Math.cos(a) * r * 0.1, Math.sin(a) * r * 0.1); g.lineTo(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86); g.stroke(); }
  g.fillStyle = pith; g.beginPath(); g.arc(0, 0, r * 0.12, 0, 7); g.fill();

function isValid(o) {

  switch (ST.ty) {
    case 'only': return o.type === ST.tgt;
    case 'color': return DEF[o.type].c === tcol;
    case 'order': return o.num === next;

  if (flakes.length) { ctx.fillStyle = 'rgba(255,255,255,.9)'; for (const f of flakes) { ctx.beginPath(); ctx.arc(f.x * W, f.y * TY, f.s, 0, 7); ctx.fill(); } }
  for (const f of flies) { const a = (Math.sin(t * 4 + f.ph) + 1) / 2 * Math.min(1, f.life); ctx.fillStyle = `rgba(255,250,150,${0.18 * a})`; ctx.beginPath(); ctx.arc(f.x, f.y, 9, 0, 7); ctx.fill(); ctx.fillStyle = `rgba(255,255,200,${0.4 + 0.6 * a})`; ctx.beginPath(); ctx.arc(f.x, f.y, 2.2, 0, 7); ctx.fill(); }
  // juice splats on the scenery
  for (const s of splats) { ctx.globalAlpha = Math.min(0.75, s.life / s.max * 1.2); ctx.fillStyle = s.c; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.75, 0, 7); for (const [dx, dy, rr] of s.blobs) { ctx.moveTo(s.x + dx + rr, s.y + dy); ctx.arc(s.x + dx, s.y + dy, rr, 0, 7); } ctx.fill(); ctx.globalAlpha *= 0.6; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x - s.r * 0.25, s.y - s.r * 0.25, s.r * 0.16, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // table props: 噗噗, served cups, the blender
  const mood = heroMood || (winT ? 'love' : 'happy'), sq = heroSq > 0 ? Math.sin(heroSq / 0.25 * PI) * 0.12 : Math.sin(t * 2.4) * 0.025;
  const hr = land ? 26 : 30; MG.puPu(ctx, HX, SY0 - hr * 0.97, hr, mood, sq, { arms: heroMood === 'love' || heroMood === 'wow' || winT ? 'up' : false, look: heroLook });
  cups.forEach((c, i) => { const p = cupPos(i); drawCup(c, p.x, p.y); });
  drawJar();
  for (const o of objs) if (o.kind === 'friend') drawFriend(o);
  for (const o of objs) if (o.kind !== 'friend') drawObj(o);
  for (const p of pieces) drawPiece(p);
  for (const s of shards) { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot); ctx.globalAlpha = Math.min(1, s.life * 2); ctx.fillStyle = 'rgba(210,240,255,.9)'; ctx.strokeStyle = '#6fb8e8'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, -s.s); ctx.lineTo(s.s * 0.7, s.s * 0.6); ctx.lineTo(-s.s * 0.6, s.s * 0.4); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); }
  ctx.globalAlpha = 1;
  for (const r of rings) { const k = 1 - r.life / r.max; ctx.strokeStyle = r.c; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (1 + k * 0.6), 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1;
  MG.fx.draw(ctx);
  // juice drops flying to the blender
  for (const d of drops) { if (d.t < 0) continue; const u = Math.min(1, d.t), iu = 1 - u, px = iu * iu * d.x0 + 2 * iu * u * d.cx + u * u * d.x1, py = iu * iu * d.y0 + 2 * iu * u * d.cy + u * u * d.y1;
    if (d.chunk) { ctx.fillStyle = d.f; ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1; ctx.save(); ctx.translate(px, py); ctx.rotate(u * 6); ctx.beginPath(); ctx.roundRect(-5, -4, 10, 8, 3); ctx.fill(); ctx.stroke(); ctx.restore(); }
    else { const vx = 2 * iu * (d.cx - d.x0) + 2 * u * (d.x1 - d.cx), vy = 2 * iu * (d.cy - d.y0) + 2 * u * (d.y1 - d.cy), a = Math.atan2(vy, vx);
      ctx.save(); ctx.translate(px, py); ctx.rotate(a - PI / 2); ctx.fillStyle = d.c; ctx.beginPath(); ctx.moveTo(0, 9); ctx.bezierCurveTo(5, 2, 5, -5, 0, -5); ctx.bezierCurveTo(-5, -5, -5, 2, 0, 9); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-1.5, -1.5, 1.4, 0, 7); ctx.fill(); ctx.restore(); } }
  // blade trails
  const now = performance.now();
  for (const s of trails) {
    const pts = s.pts.filter(p => now - p.t < 170); if (pts.length < 2) continue;
    for (let pass = 0; pass < 2; pass++) for (let i = 1; i < pts.length; i++) { const k = 1 - (now - pts[i].t) / 170; ctx.strokeStyle = pass ? `rgba(255,255,255,${0.95 * k})` : (LV.th === 'night' ? `rgba(255,230,120,${0.45 * k})` : `rgba(120,200,255,${0.45 * k})`); ctx.lineWidth = (pass ? 5 : 13) * k + 1; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke(); }
  }
  if (slowT > 0) { const a = Math.min(1, slowT) * 0.35; const q = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75); q.addColorStop(0, 'rgba(120,190,255,0)'); q.addColorStop(1, `rgba(120,190,255,${a})`); ctx.fillStyle = q; ctx.fillRect(0, 0, W, H); }
  drawSign();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const p of pops) { const k = p.life / p.max, sc = k > 0.85 ? 1 + (k - 0.85) * 3 : 1; ctx.globalAlpha = Math.min(1, k * 2.5); ctx.font = F(p.size * sc); ctx.lineWidth = MG.big ? 6 : 5; ctx.strokeStyle = '#fff'; const px = clamp(p.x, 70, W - 70), py = Math.max(SYc + SHh + 22, p.y); ctx.strokeText(p.t, px, py); ctx.fillStyle = p.c; ctx.fillText(p.t, px, py); }
  ctx.globalAlpha = 1;
  ctx.restore();
}

// =====================================================================================
// flow
// =====================================================================================
function setLevel(n) { level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; ST = LV; bgK = ''; }
function start(m, lv) {
  if (m) mode = m; if (lv) setLevel(lv);
  reset(); state = 'play'; MG.hide();
  const fresh = newsOf(LV).filter(k => !MG.store.get('slice.seen.' + k, false));
  if (fresh.length) {
    fresh.forEach(k => MG.store.set('slice.seen.' + k, true));
    MG.panel({ title: fresh.map(k => NEWS[k][0]).join('＋'), html: fresh.map(k => `<p>${NEWS[k][1]}</p>`).join(''), buttons: [{ label: '開始', on: () => MG.hide() }] });
  }
}
function starsOf() { const s = MG.store.get('slice.stars', {}); return s && typeof s === 'object' ? s : {}; }
function win() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
  for (const s of ptrs.values()) s.live = false; ptrs.clear();
  const st = mode === 'relax' ? 3 : oops <= 1 ? 3 : oops <= 4 ? 2 : 1;
  const all = starsOf(); if (st > (all[level] || 0)) { all[level] = st; MG.store.set('slice.stars', all); }
  let maxDone = 0; for (const k in all) maxDone = Math.max(maxDone, +k); MG.record('slice', maxDone);
  const nx = level < LEVELS.length ? LEVELS[level] : null; if (nx) MG.store.set('slice.pickLevel', level + 1);
  MG.fx.burst(W / 2, H * 0.45, { n: 60, colors: ['#ffd23f', '#ff8ac2', '#8fd0ff', '#8fe39a', '#ff9a1f'], shape: 'star', speed: 340, up: 200, size: 7, life: 1.2 });
  setTimeout(() => {
    if (state !== 'over') return;
    MG.panel({
      title: `第 ${level} 關過關！`,
      html: `<div class="big">${'⭐'.repeat(st)}${'<span style="opacity:.25">⭐</span>'.repeat(3 - st)}</div><p>${THEME_E[LV.th]} ${LV.n} 完成 ^_^${mode === 'timed' ? `　還剩 ${Math.ceil(left)} 秒` : `　用了 ${mmss(t)}`}</p>` +
        (sliced ? `<p>切了 ${sliced} 個${bestCombo >= 2 ? `　最多一刀 ${bestCombo} 個` : ''}${cups.length ? `　做了 ${cups.length} 份 ${cont() === 'pot' ? '🍲' : cont() === 'bowl' ? '🥗' : '🧃'}` : ''}</p>` : '') +
        (st < 3 ? '<p>不要切到小動物和不對的水果，就能拿到三顆星喔！</p>' : '') +
        (nx ? `<p>下一關：${THEME_E[nx.th]} ${nx.n}</p>` : '<p>全部過關了！你是水果切切大師 🍉👑</p>'),
      buttons: [...(nx ? [{ label: '下一關', on: () => start(null, level + 1) }] : []), { label: '再玩一次', alt: !!nx, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
    });
  }, 500);
}
function fail() {
  if (state !== 'play') return;
  state = 'over'; MG.sfx('over'); ptrs.clear();
  MG.panel({
    title: '時間到！',
    html: `<div class="big">${prog} / ${goal()}</div><p>差一點點！再試一次吧</p><p>🐢 慢慢玩沒有時間限制喔</p>`,
    buttons: [{ label: '再試一次', on: () => start() }, { label: '🐢 慢慢玩這關', alt: true, on: () => { MG.store.set('slice.pickMode', 'relax'); start('relax'); } }, { label: '選關卡', alt: true, on: menu }],
  });
}
function menu() {
  state = 'ready'; ptrs.clear();
  const st = starsOf();
  MG.choose({
    id: 'slice', title: '水果切切樂',
    html: `<p>水果被拋上來了！用手指<b>劃過去</b>就能把水果切成兩半，果汁會飛進果汁機，做成一杯杯好喝的果汁。</p><p>拉著氣球的小動物<b>不要切</b>喔！36 關有 🎯 只切一種、🎨 找顏色、🔢 照順序、📋 照食譜、✖️ 一刀好幾個、🍉 大西瓜、🫧 泡泡、🧊 冰凍、🍌 慢動作、🥕 蔬菜和 🏮 夜晚燈籠，🆕 還有 ⬇️ 照箭頭的方向切！</p>`,
    modes: [{ id: 'relax', label: '🐢 慢慢玩', sub: '沒有時間限制・水果飛比較慢' }, { id: 'timed', label: '⏱ 計時挑戰', sub: '每一關有時間限制' }],
    levels: { count: LEVELS.length, max: LEVELS.length, fresh: n => n >= 31, label: n => `${n}（${THEME_E[LEVELS[n - 1].th]} ${LEVELS[n - 1].n}：${goalWords(LEVELS[n - 1])}${st[n] ? ' ' + '⭐'.repeat(st[n]) : ''}）`, short: n => `${n}${LEVELS[n - 1].mk || ''}` },
    keys: '用手指（或滑鼠）按住劃過水果就能切，點一下水果也可以切　好幾根手指可以一起切喔',
    playing: () => state === 'play',
    start: (m, lv) => start(m, lv),

setLevel(Math.min(MG.store.get('slice.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) update(dt);
  else { t += dt; MG.fx.step(dt); for (const p of pops) { p.y -= 32 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0); for (const c of cups) c.t += dt; }
  draw();

// =====================================================================================
// hook for automated tests
// =====================================================================================
function autoStroke(pts) { const s = { id: ++sidN, pts: [], n: 0 }; for (let i = 0; i < pts.length; i++) { const a = pts[Math.max(0, i - 1)], b = pts[i]; cutSeg(a.x, a.y, b.x, b.y, s); } evalStroke(s); return s; }
window.SLICET = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, get prog() { return prog; }, get goal() { return goal(); }, get type() { return ST.ty; },
  get stage() { return stageI; }, get stages() { return nStages(); }, get oops() { return oops; }, get slowT() { return slowT; }, get next() { return next; }, get tcol() { return tcol; },
  get card() { return card && card.items.map(i => i.slice()); }, get size() { return [W, H, land]; }, get cups() { return cups.length; }, get fill() { return total(); }, levels: LEVELS.length,
  objs: () => objs.filter(o => !o.dead).map(o => ({ id: o.id, kind: o.kind, type: o.type, fk: o.fk, x: o.x, y: o.y, r: o.r, bub: !!o.bub, ice: !!o.ice, hp: o.hp, num: o.num, valid: isValid(o) })),
  start: (lv, m = 'relax') => start(m, lv), win: () => { if (state === 'play') startWin(); }, menu: () => menu(),
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) if (state === 'play' && !MG.panelOpen()) update(dt); },
  cut: (pts) => autoStroke(pts),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  // one helpful swipe: a right fruit (or a whole row of them on combo levels)
  auto() {
    if (state !== 'play' || winT || stageT) return false;
    const on = objs.filter(o => !o.dead && o.kind !== 'friend' && o.cool <= 0 && o.x > 4 && o.x < W - 4 && o.y > apexMin() - 30 && o.y < TY);
    if (ST.ty === 'combo') {
      const v = on.filter(o => !o.bub && !o.ice).sort((a, b) => a.x - b.x);
      if (v.length >= ST.need) { autoStroke(v.map(o => ({ x: o.x, y: o.y }))); return true; }
      return false;
    }
    const v = on.filter(o => o.bub || o.ice || isValid(o)).sort((a, b) => (b.big ? 1 : 0) - (a.big ? 1 : 0));
    if (!v.length) return false;
    const o = v[0];
    if (o.dir != null && ST.ty === 'dir') { const a = DIR_A[o.dir]; const d = hitR(o) + 14; autoStroke([{ x: o.x - Math.cos(a) * d, y: o.y - Math.sin(a) * d }, { x: o.x + Math.cos(a) * d, y: o.y + Math.sin(a) * d }]); return true; }
    autoStroke([{ x: o.x - 6, y: o.y - 3 }, { x: o.x + 6, y: o.y + 3 }]); return true;
  },
};
