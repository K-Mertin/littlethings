<script>
'use strict';
MG.init({ id: 'market', title: '噗噗超市', stats: ['level'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k, ease = k => k * k * (3 - 2 * k);

// =====================================================================
// sounds: scanner beep, cash register, coin clinks, cart rattle, a rising note for every number we count
// =====================================================================
let AC = null;
const isMuted = () => !!MG.store.get('muted', false);
function actx() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
addEventListener('pointerdown', () => actx(), true); addEventListener('keydown', () => actx(), true);
function tn(f0, f1, dur, type = 'sine', vol = 0.1, delay = 0) {
  const a = AC; if (!a || isMuted()) return;
  const t0 = a.currentTime + delay, o = a.createOscillator(), gn = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); gn.gain.exponentialRampToValueAtTime(0.0006, t0 + dur);
  o.connect(gn).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.03);
}
function bl(f, dur = 0.35, vol = 0.07, delay = 0) { tn(f, f, dur, 'sine', vol, delay); tn(f * 2, f * 2, dur * 0.6, 'sine', vol * 0.3, delay); }
let NB = null;
function nz(dur, f0, f1, vol = 0.06, delay = 0, q = 1.2, type = 'bandpass') {
  const a = AC; if (!a || isMuted()) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain();
  s.buffer = NB; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  gn.gain.setValueAtTime(0.0001, t0); gn.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(0.05, dur * 0.3)); gn.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);

const SND = {
  beep: () => { tn(1760, 1760, 0.08, 'square', 0.045); tn(2349, 2349, 0.09, 'square', 0.04, 0.085); },
  cash: () => { nz(0.05, 5200, 3000, 0.09); tn(1319, 1319, 0.1, 'square', 0.035, 0.03); bl(1760, 0.5, 0.08, 0.1); bl(2637, 0.6, 0.05, 0.17); },
  clink: (k = 0) => { const f = 2093 * Math.pow(2, (k % 6) / 24); bl(f, 0.22, 0.06); bl(f * 1.26, 0.18, 0.035, 0.035); nz(0.04, 6000, 4000, 0.03); },
  rattle: () => { nz(0.4, 260, 520, 0.06, 0, 1.4); for (let i = 0; i < 4; i++) tn(380 + i * 30, 300, 0.03, 'square', 0.02, i * 0.08); },
  belt: () => nz(0.35, 160, 240, 0.05, 0, 0.8, 'lowpass'),
  bag: () => { nz(0.16, 2600, 1400, 0.06, 0, 0.8); nz(0.12, 2000, 1200, 0.04, 0.12, 0.8); },
  thud: () => tn(240, 90, 0.12, 'sine', 0.15),
  nope: () => { tn(330, 250, 0.1, 'sine', 0.09); tn(300, 220, 0.12, 'sine', 0.08, 0.1); },
  ding: () => { bl(1568, 1.0, 0.1); bl(2093, 1.1, 0.06, 0.03); },
  print: () => { for (let i = 0; i < 7; i++) tn(900, 760, 0.03, 'square', 0.022, i * 0.05); },
  door: () => { bl(1319, 0.5, 0.07); bl(988, 0.7, 0.07, 0.2); },
  pop: () => tn(500, 1100, 0.08, 'sine', 0.1),
  squeak: () => { tn(1900, 2600, 0.07, 'sine', 0.07); tn(2100, 2900, 0.07, 'sine', 0.06, 0.1); },
  chirp: () => { tn(2600, 3400, 0.06, 'sine', 0.05); tn(2800, 3600, 0.06, 'sine', 0.05, 0.09); tn(2500, 3300, 0.07, 'sine', 0.045, 0.2); },
  honk: () => { tn(520, 500, 0.12, 'square', 0.035); tn(520, 500, 0.14, 'square', 0.035, 0.18); },
  sizzle: () => nz(0.45, 4000, 6000, 0.035, 0, 0.6, 'highpass'),

const sndT = {};
function snd(n, a, gap = 40) { const q = performance.now(); if (q - (sndT[n] || 0) < gap) return; sndT[n] = q; actx(); if (SND[n]) SND[n](a); }
const NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093, 2349];
function countNote(n) { actx(); bl(NOTES[clamp(n - 1, 0, NOTES.length - 1)], 0.4, 0.085); }

// =====================================================================
// drawing helpers
// =====================================================================
function rr(g, X, Y, w, h, r, fill, stroke, lw = 2) { if (w <= 0 || h <= 0) return; g.beginPath(); g.roundRect(X, Y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function circ(g, cx, cy, r, fill, stroke, lw = 2) { g.beginPath(); g.arc(cx, cy, Math.max(0.1, r), 0, TAU); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function ell(g, cx, cy, rx, ry, rot, fill, stroke, lw = 2) { g.beginPath(); g.ellipse(cx, cy, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function shade(c, k) { return k >= 0 ? mix(c, '#ffffff', k) : mix(c, '#000000', -k); }
function txt(g, s, X, Y, size, col, align = 'center', weight = 900, outline = null, ow = 4) {
  g.font = `${weight} ${Math.round(size)}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  if (outline) { g.lineJoin = 'round'; g.lineWidth = ow; g.strokeStyle = outline; g.strokeText(s, X, Y); }
  g.fillStyle = col; g.fillText(s, X, Y);
}
function shadowed(g, blur, oy, col, fn) { g.save(); g.shadowColor = col; g.shadowBlur = blur; g.shadowOffsetY = oy; fn(); g.restore(); }
// n dots in rows of `per`, centred on (cx, cy)
function pips(g, n, cx, cy, r, col, per = 5, filled = n, empty = '#e4d8bf') {
  const rows = Math.ceil(n / per), gap = r * 2.7;
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / per), inRow = Math.min(per, n - row * per), col2 = i % per;
    const px = cx + (col2 - (inRow - 1) / 2) * gap, py = cy + (row - (rows - 1) / 2) * gap;
    circ(g, px, py, r, i < filled ? col : empty, i < filled ? shade(col, -0.3) : null, Math.max(1, r * 0.3));
  }
}
// best grid of n cells inside R (cells about asp wide per 1 high)
function gridFit(R, n, asp = 1, gap = 8) {
  let best = null;
  for (let cols = 1; cols <= Math.max(1, n); cols++) {
    const rows = Math.ceil(n / cols), cw = (R.w - gap * (cols - 1)) / cols, ch = (R.h - gap * (rows - 1)) / rows;
    const s = Math.min(cw / asp, ch); if (!best || s > best.s + 0.01) best = { cols, rows, cw, ch, s };
  }
  const { cols, rows, cw, ch } = best, cells = [];
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols), c = i % cols, inRow = r === rows - 1 ? n - cols * (rows - 1) : cols, off = (cols - inRow) * (cw + gap) / 2;
    const X = R.x + off + c * (cw + gap), Y = R.y + r * (ch + gap);
    cells.push({ x: X, y: Y, w: cw, h: ch, cx: X + cw / 2, cy: Y + ch / 2, row: r });
  }

}
function bubble(g, X, Y, w, h, tx, ty, fill = '#fff', stroke = '#e0c9a0') {
  const r = Math.min(22, h * 0.3);

  let bx, by, nx, ny;
  if (ty > Y + h) { bx = clamp(tx, X + r + 10, X + w - r - 10); by = Y + h; nx = 1; ny = 0; }
  else if (tx < X) { bx = X; by = clamp(ty, Y + r + 10, Y + h - r - 10); nx = 0; ny = 1; }
  else if (tx > X + w) { bx = X + w; by = clamp(ty, Y + r + 10, Y + h - r - 10); nx = 0; ny = 1; }
  else { bx = clamp(tx, X + r + 10, X + w - r - 10); by = Y; nx = 1; ny = 0; }
  const dd = Math.hypot(tx - bx, ty - by) || 1, L2 = Math.min(dd, 34), px = bx + (tx - bx) / dd * L2, py = by + (ty - by) / dd * L2;
  const path = () => { g.beginPath(); g.roundRect(X, Y, w, h, r); g.moveTo(bx - nx * 11, by - ny * 11); g.lineTo(px, py); g.lineTo(bx + nx * 11, by + ny * 11); };
  shadowed(g, 10, 4, 'rgba(90,60,30,.18)', () => { path(); g.fillStyle = fill; g.fill(); });
  g.beginPath(); g.roundRect(X, Y, w, h, r); g.strokeStyle = stroke; g.lineWidth = 3; g.stroke();
  g.beginPath(); g.moveTo(bx - nx * 11, by - ny * 11); g.lineTo(px, py); g.lineTo(bx + nx * 11, by + ny * 11); g.stroke();
  g.beginPath(); g.moveTo(bx - nx * 9.5, by - ny * 9.5); g.lineTo(bx + nx * 9.5, by + ny * 9.5); g.strokeStyle = fill; g.lineWidth = 4; g.stroke();
}

// =====================================================================
// item pictures (drawn once into small cached canvases; 100-unit box centred on 0,0)
// =====================================================================
const F = (g, fill, stroke, lw = 4) => { if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } };
const RG = (g, a, b, c, x0 = -14, y0 = -16, R = 56) => { const q = g.createRadialGradient(x0, y0, 2, 0, 0, R); q.addColorStop(0, a); q.addColorStop(0.45, b); q.addColorStop(1, c); return q; };
const LG = (g, y0, y1, a, b) => { const q = g.createLinearGradient(0, y0, 0, y1); q.addColorStop(0, a); q.addColorStop(1, b); return q; };
const shine = (g, X, Y, rx, ry, rot = 0.4, a = 0.6) => ell(g, X, Y, rx, ry, rot, `rgba(255,255,255,${a})`);
function leaf(g, X, Y, len, rot) {
  g.save(); g.translate(X, Y); g.rotate(rot);

  g.beginPath(); g.moveTo(-len * 0.7, 0); g.lineTo(len * 0.7, 0); F(g, null, 'rgba(47,138,58,.6)', 2);

function star(g, cx, cy, R, r, n = 5, sy = 1, rot = -Math.PI / 2) { g.beginPath(); for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, q = i % 2 ? r : R; g.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q * sy); } g.closePath(); }
function coinArt(g, R, a, b, c, d, label, dots) {

  circ(g, 0, 0, R * 0.76, null, 'rgba(255,255,255,.6)', 2.5);
  circ(g, 0, 0, R * 0.72, null, shade(c, -0.12), 1.5);
  for (let i = 0; i < dots; i++) { const an = -Math.PI / 2 + i * TAU / dots; circ(g, Math.cos(an) * R * 0.875, Math.sin(an) * R * 0.875, R * 0.07, d); }

  g.fillStyle = 'rgba(255,255,255,.75)'; g.fillText(label, 1.5, 4); g.fillStyle = d; g.fillText(label, 0, 2);

const ART = {
  apple(g) {
    g.beginPath(); g.moveTo(0, -22); g.bezierCurveTo(16, -36, 44, -28, 41, 0); g.bezierCurveTo(39, 26, 18, 42, 0, 36); g.bezierCurveTo(-18, 42, -39, 26, -41, 0); g.bezierCurveTo(-44, -28, -16, -36, 0, -22); g.closePath();
    F(g, RG(g, '#ffb3a6', '#f2453a', '#b81f1a'), '#8e1a16');
    g.beginPath(); g.moveTo(0, -22); g.quadraticCurveTo(1, -34, 7, -42); F(g, null, '#7a4a20', 5);
    leaf(g, 18, -36, 13, -0.5); shine(g, -20, -8, 6, 11, 0.35);
  },
  banana(g) {
    for (const [dx, dy, ro] of [[-3, -9, -0.12], [3, 7, 0.1]]) {
      g.save(); g.translate(dx, dy); g.rotate(ro);
      g.beginPath(); g.moveTo(-42, -16); g.quadraticCurveTo(-2, 50, 42, -18); g.quadraticCurveTo(40, -10, 36, -9); g.quadraticCurveTo(-2, 8, -36, -8); g.closePath();
      F(g, LG(g, -20, 30, '#fff4a8', '#ffcf2e'), '#b8860b');
      g.beginPath(); g.moveTo(-24, 6); g.quadraticCurveTo(0, 26, 24, 4); F(g, null, 'rgba(255,255,255,.6)', 4);
      circ(g, -42, -16, 4.5, '#7a5520'); circ(g, 42, -18, 3.5, '#5a3a10');
      g.restore();
    }
  },
  grapes(g) {
    g.beginPath(); g.moveTo(0, -28); g.quadraticCurveTo(2, -38, 8, -44); F(g, null, '#7a4a20', 5);
    leaf(g, -14, -34, 14, 0.4);
    for (const [X, Y] of [[0, 22], [-11, 5], [11, 5], [-22, -12], [0, -14], [22, -12]]) {
      const q = g.createRadialGradient(X - 4, Y - 5, 1, X, Y, 15); q.addColorStop(0, '#e8d4ff'); q.addColorStop(0.45, '#9a6ae8'); q.addColorStop(1, '#5f3aae');

  },
  orange(g) {
    circ(g, 0, 4, 38, RG(g, '#ffe0b0', '#ffa13a', '#e0680f', -14, -12, 60), '#a84e0a', 4);
    for (const [X, Y] of [[-14, 18], [10, 22], [22, 4], [-24, 0], [4, -8], [16, -16], [-8, 28]]) circ(g, X, Y, 1.6, 'rgba(180,80,10,.35)');

  strawberry(g) {

    shine(g, -18, -4, 5, 9, 0.4);
  },
  melon(g) {
    g.beginPath(); g.ellipse(0, 4, 46, 36, 0, 0, TAU); F(g, RG(g, '#c8f5a0', '#56c04a', '#257a30', -16, -14, 60));

  carrot(g) {

    g.restore();
  },
  broccoli(g) {
    g.beginPath(); g.moveTo(-12, 4); g.lineTo(12, 4); g.lineTo(15, 40); g.quadraticCurveTo(0, 46, -15, 40); g.closePath(); F(g, LG(g, 0, 40, '#e0f8bc', '#9ad46a'), '#4f8a2a', 3.5);
    for (const [X, Y, R] of [[-23, -6, 16], [23, -6, 16], [-11, -22, 17], [12, -22, 17], [0, -4, 17]]) {
      const q = g.createRadialGradient(X - 5, Y - 6, 1, X, Y, R * 1.1); q.addColorStop(0, '#b8f08a'); q.addColorStop(0.5, '#4caf3a'); q.addColorStop(1, '#2a7a28');
      circ(g, X, Y, R, q, '#21602a', 3.5); circ(g, X - 5, Y - 4, 2.2, 'rgba(255,255,255,.4)'); circ(g, X + 4, Y + 3, 1.8, 'rgba(20,80,20,.35)');
    }
  },
  tomato(g) {
    g.beginPath(); g.ellipse(0, 6, 40, 34, 0, 0, TAU); F(g, RG(g, '#ffb0a0', '#f5463a', '#c0201a'), '#8e1a16');
    g.beginPath(); g.moveTo(-14, -22); g.quadraticCurveTo(-22, 8, -12, 36); g.moveTo(14, -22); g.quadraticCurveTo(22, 8, 12, 36); F(g, null, 'rgba(150,20,20,.22)', 3);

    shine(g, -20, -6, 7, 10, 0.5);
  },
  corn(g) {
    g.save(); g.rotate(0.35);
    g.beginPath(); g.ellipse(0, -4, 19, 40, 0, 0, TAU); F(g, LG(g, -40, 40, '#fff2a0', '#ffc93a'));
    g.save(); g.clip();

function makeList(rec) {

  for (let tries = 0; tries < 300; tries++) {
    const picks = [];
    for (const a of MG.shuffle(L.aisles.slice())) { if (picks.length >= L.n) break; picks.push(MG.pick(pool(a))); }
    while (picks.length < L.n) { const c = pool(MG.pick(L.aisles)).filter(k => !picks.includes(k)); if (c.length) picks.push(MG.pick(c)); }
    const need = picks.map(id => ({ id, n: MG.randi(1, L.cnt), got: 0 }));
    const tot = need.reduce((a, e) => a + e.n * priceOf(e.id), 0);
    if (tot <= (L.max || 10) && tot >= (L.min || 1)) return need;

}

// input: drag with a finger or tap; every scene has pick / drop / tap (and press for buttons)
// =====================================================================
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || MG.panelOpen() || drag || !S) return;
  const p = cv.logical(e);
  if (S.press && S.press(p)) return;
  if (tapExtras(p)) return;
  const d = S.pick && S.pick(p); if (!d) return;
  drag = { d, pid: e.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false };
  try { cv.setPointerCapture(e.pointerId); } catch {}
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const p = cv.logical(e); drag.x = p.x; drag.y = p.y;
  if (!drag.moved && Math.hypot(p.x - drag.sx, p.y - drag.sy) > 12) { drag.moved = true; snd('pop'); }
});
cv.addEventListener('pointerup', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag.d, p = cv.logical(e), mv = drag.moved; drag = null;
  if (state !== 'play' || !S) return;
  if (mv) S.drop(d, p); else S.tap(d);
});
cv.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) drag = null; });

// =====================================================================
// main loop
// =====================================================================
function update(dt) {
  heroMT = Math.max(0, heroMT - dt); heroHop = Math.max(0, heroHop - dt);
  for (const tm of timers.slice()) { tm.t -= dt; if (tm.t <= 0) { const i = timers.indexOf(tm); if (i < 0) continue; timers.splice(i, 1); tm.fn(); } }
  for (const f of flys.slice()) { f.t += dt; if (f.t >= f.dur) { const i = flys.indexOf(f); if (i < 0) continue; flys.splice(i, 1); if (f.done && f.sc === S) f.done(); } }
  for (const p of pops) p.life -= dt; pops = pops.filter(p => p.life > 0);
  MG.fx.step(dt);
  if (S && S.update) S.update(dt);
}
function drawFlys() {
  for (const f of flys) {
    const k = clamp(f.t / f.dur, 0, 1), e = ease(k), dd = Math.hypot(f.x1 - f.x0, f.y1 - f.y0);
    const px = lerp(f.x0, f.x1, e), py = lerp(f.y0, f.y1, e) - Math.sin(Math.PI * k) * Math.min(dd, 400) * f.arc, s2 = lerp(f.s0, f.s1, e), a = f.fade ? 1 - k * 0.9 : 1;
    if (f.kind === 'item') spr(x, f.id, px, py, s2, f.spin * k * 6, a);
    else if (f.kind === 'coin') spr(x, 'c' + f.id, px, py, s2, 0, a);
    else drawBag(x, px, py + s2 * 0.6, s2, s2 * 1.2, (S && S.bagItems) || []);
  }
}
function drawPops() {
  for (const p of pops) {
    const k = 1.25 - p.life, sz = 22 * U * p.sz * MG.textScale * (k < 0.12 ? 0.6 + k / 0.12 * 0.4 : 1);
    x.globalAlpha = clamp(p.life * 2.5, 0, 1);
    x.font = `900 ${Math.round(sz)}px ${FONT}`; const tw = x.measureText(p.text).width;
    const px = clamp(p.x, tw / 2 + 6, W - tw / 2 - 6), py = Math.max(sz, p.y - k * 34);
    txt(x, p.text, px, py, sz, p.col, 'center', 900, '#fff', Math.max(3, sz * 0.24));
  }
  x.globalAlpha = 1;
}
function drawDragGhost() {
  if (!drag || !drag.moved) return;
  const d = drag.d;
  shadowed(x, 14, 8, 'rgba(0,0,0,.25)', () => spr(x, d.coin ? 'c' + d.v : d.id, drag.x, drag.y - 8, d.s * 1.12, Math.sin(t * 10) * 0.06));
}
function drawTopCard() {
  const T = Lo.top; if (!T) return;
  shadowed(x, 10, 3, 'rgba(90,70,40,.16)', () => rr(x, T.x, T.y, T.w, T.h, 18, 'rgba(255,253,246,.97)'));
  rr(x, T.x, T.y, T.w, T.h, 18, null, '#efdcb6', 2.5);
  if (S && S.top) S.top(x, T);
}
function draw() {
  x.lineJoin = 'round'; x.lineCap = 'round';
  drawBG();
  ambientDraw(x);
  if (S) S.draw(x);
  drawTopCard();
  drawFlys(); MG.fx.draw(x); drawPops(); drawDragGhost(); floatsDraw();
}
// a shopping scene behind the start menu
L = LEVELS[0]; S = mkAisle('list'); layout();
menu();
MG.loop(dt => { t += dt; floatsStep(dt); if (state === 'play' && !MG.panelOpen()) update(dt); else { MG.fx.step(dt); heroHop = Math.max(0, heroHop - dt); if (S && S.update && state !== 'play') S.update(dt); } draw(); });

// ---------- hook for automated tests ----------
function toClient(q) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + q.x * (rc.width - 2 * B) / W, y: rc.top + B + q.y * (rc.height - 2 * B) / H }; }
window.MKT = {
  get state() { return state; }, get level() { return level; }, get scene() { return S && S.t; }, get phase() { return S && S.ph; }, levels: LEVELS.length,
  start: lv => startLevel(lv), menu: () => menu(), win: () => win(),
  next: () => { const q = S && S.next && S.next(); return q ? toClient(q) : null; },
  get busy() { return flys.length; }, get panel() { return MG.panelOpen(); }, dbg: () => JSON.stringify({ timers: timers.length, need: S && S.need, done: S && S.done, cart: cartItems }),
  info: () => ({ t: S && S.t, ph: S && S.ph, cart: cartItems.length, total: S && S.total, paid: S && S.paid, ci: S && S.ci, phase: phases[phaseI], phases: phases.slice(), req: S && S.req ? (S.req.id || 'none') : null }),
  coupon: () => { const q = S && S.coupon && couponPos(S); return q ? toClient(q) : null; },
  gotoCoupon: () => { if (S && S.coupon && S.tabs && S.cur !== S.coupon.a) goAisle(S, S.coupon.a); },
  candy: () => S && S.candy ? toClient({ x: S.candy.x, y: S.candy.y - S.candy.r * 0.8 }) : null,
  get coupons() { return couponsGot().length; },
};
