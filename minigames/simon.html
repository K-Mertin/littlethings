<script>
'use strict';
MG.init({ id: 'simon', title: '噗噗聽聽看', stats: ['a', 'b'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei","Noto Sans CJK TC",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// =====================================================================
// sounds — everything synthesized with WebAudio (follows the 🔊 button)
// =====================================================================
const ANIMALS = ['cat', 'dog', 'duck', 'cow', 'sheep', 'frog', 'bird', 'pig', 'rooster', 'lion', 'owl', 'elephant', 'bee'];
const INSTS = ['piano', 'xylo', 'drum', 'bell', 'trumpet', 'flute', 'guitar', 'violin', 'chimes', 'musicbox', 'voice', 'triangle'];
const VEHICLES = ['car', 'train', 'police', 'fire', 'plane', 'ship', 'bicycle', 'motor'];
const WEATHER = ['rain', 'thunder', 'wind', 'waves', 'drip', 'snow'];
const KITCHEN = ['sizzle', 'kettle', 'chop', 'bubble', 'slurp', 'clink', 'popcorn', 'timer'];
const SETS = { animal: ANIMALS, inst: INSTS, vehicle: VEHICLES, weather: WEATHER, kitchen: KITCHEN };
const PITCHES = [60, 62, 64, 65, 67, 69, 71, 72];
const PITCH_PICK = { 4: [60, 64, 67, 72], 6: [60, 62, 64, 67, 69, 72], 8: PITCHES };
const INFO = {
  cat: { ic: '🐱' }, dog: { ic: '🐶' }, duck: { ic: '🦆' }, cow: { ic: '🐮' }, sheep: { ic: '🐑' }, frog: { ic: '🐸' }, bird: { ic: '🐦' },
  pig: { ic: '🐷' }, rooster: { ic: '🐓' }, lion: { ic: '🦁' }, owl: { ic: '🦉' }, elephant: { ic: '🐘' }, bee: { ic: '🐝' },
  piano: { ic: '🎹' }, xylo: { draw: 'xylo' }, drum: { ic: '🥁' }, bell: { ic: '🔔' }, trumpet: { ic: '🎺' }, flute: { draw: 'flute' },
  guitar: { ic: '🎸' }, violin: { ic: '🎻' }, chimes: { ic: '🎐' }, musicbox: { ic: '🎠' }, voice: { ic: '🎤' }, triangle: { draw: 'tri' },
  car: { ic: '🚗' }, train: { ic: '🚂' }, police: { ic: '🚓' }, fire: { ic: '🚒' }, plane: { ic: '✈️' }, ship: { ic: '🚢' }, bicycle: { ic: '🚲' }, motor: { ic: '🏍️' },
  rain: { ic: '🌧️' }, thunder: { ic: '⛈️' }, wind: { ic: '🌬️' }, waves: { ic: '🌊' }, drip: { ic: '💧' }, snow: { ic: '☃️' },
  sizzle: { ic: '🍳' }, kettle: { ic: '☕' }, chop: { ic: '🥕' }, bubble: { ic: '🍲' }, slurp: { ic: '🥤' }, clink: { ic: '🥄' }, popcorn: { ic: '🍿' }, timer: { ic: '⏲️' },
  dk: { ic: '🥁' }, ds: { ic: '🥁' },
};
for (const m of PITCHES) INFO['n' + m] = { draw: 'note', m };
const SOLFA = { 60: 'Do', 62: 'Re', 64: 'Mi', 65: 'Fa', 67: 'Sol', 69: 'La', 71: 'Si', 72: 'Do' };
const NUMS = { 60: '1', 62: '2', 64: '3', 65: '4', 67: '5', 69: '6', 71: '7', 72: '1' };
const NCOL = { 60: ['#ff7b84', '#c9414d'], 62: ['#ffa04d', '#c46a12'], 64: ['#ffcc1f', '#a88300'], 65: ['#5ccf63', '#2c8a34'], 67: ['#4cb2f5', '#1f6fad'], 69: ['#8f7cf7', '#5642c2'], 71: ['#f76fc0', '#b23a82'], 72: ['#ff5d6c', '#a8263a'] };
// sound lengths in seconds (also used when the sound is switched off)
const DUR = { cat: .6, dog: .55, duck: .46, cow: 1.1, sheep: .9, frog: .4, bird: .55, pig: .55, rooster: 1.05, lion: 1.15, owl: .85, elephant: .85, bee: 1,
  piano: 1.1, xylo: .7, drum: .72, bell: 1.3, trumpet: .85, flute: .85, guitar: 1.05, violin: .95, chimes: 1, musicbox: .95, voice: .65, triangle: 1.1,
  car: .45, train: 1.1, police: 1.05, fire: 1, plane: 1.1, ship: 1.1, bicycle: .6, motor: 1, rain: 1, thunder: 1.15, wind: 1.1, waves: 1.15, drip: .65, snow: .9,
  sizzle: 1, kettle: 1.05, chop: .6, bubble: .9, slurp: .6, clink: .9, popcorn: .8, timer: 1.1, dk: .35, ds: .25 };
const VOL = { trumpet: .34, elephant: .4, guitar: .42, drum: .6, lion: .55, bee: .45, chimes: .55, triangle: .45, bell: .5, voice: .45,
  thunder: .6, ship: .45, motor: .5, plane: .5, sizzle: .4, rain: .5, police: .35, fire: .4, car: .4, dk: .75, ds: .6 };

let ac2 = null, master = null, echoIn = null, nBuf = null;
const AU = { plays: 0, skipped: 0, made: 0, freed: 0, peak: 0 };
const liveV = new Set();
const isMuted = () => !!MG.store.get('muted', false);
function audio() {
  if (isMuted()) return null;
  if (!ac2) {
    try { ac2 = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
    const comp = ac2.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
    master = ac2.createGain(); master.gain.value = 0.8; master.connect(comp); comp.connect(ac2.destination);
    // a soft echo for the music box and the jelly pads (built once, never freed)
    const dl = ac2.createDelay(1), fb = ac2.createGain(), lp = ac2.createBiquadFilter();
    dl.delayTime.value = 0.17; fb.gain.value = 0.3; lp.type = 'lowpass'; lp.frequency.value = 3000;
    echoIn = ac2.createGain(); echoIn.gain.value = 0.25;
    echoIn.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
    nBuf = ac2.createBuffer(1, ac2.sampleRate, ac2.sampleRate);
    const d = nBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac2.state === 'suspended') ac2.resume();
  return ac2;
}
addEventListener('pointerdown', () => audio(), true);
addEventListener('keydown', () => audio(), true);
// one voice = every node one sound needs; when all of its sources have ended, all nodes get disconnected (no leaks)
function mkVoice(vol) {
  const V = { nodes: [], srcs: 0, done: 0, freed: false, stolen: false };
  V.add = n => { V.nodes.push(n); AU.made++; return n; };
  V.bus = V.add(ac2.createGain()); V.bus.gain.value = vol; V.bus.connect(master);
  V.start = (s, t0, t1) => { V.srcs++; s.onended = () => { if (++V.done >= V.srcs) freeVoice(V); }; s.start(t0); s.stop(Math.max(t0 + 0.01, t1)); };
  liveV.add(V); AU.peak = Math.max(AU.peak, liveV.size);
  if (liveV.size > 18) {   // voice stealing: fade the oldest so the mix stays clean
    for (const o of liveV) if (!o.stolen && o !== V) { o.stolen = true; try { const n = ac2.currentTime; o.bus.gain.cancelScheduledValues(n); o.bus.gain.setTargetAtTime(0, n, 0.03); } catch {} break; }
  }
  return V;
}
function freeVoice(V) {
  if (V.freed) return; V.freed = true;
  for (const n of V.nodes) { try { n.disconnect(); } catch {} }
  AU.freed += V.nodes.length; V.nodes.length = 0; liveV.delete(V);
}
// automation points [[dt, value], …] — exponential ramps (values kept above zero)
function P(param, pts, t) {
  param.setValueAtTime(pts[0][1], t + pts[0][0]);
  for (let i = 1; i < pts.length; i++) param.exponentialRampToValueAtTime(Math.max(1e-4, pts[i][1]), t + pts[i][0]);
}
const E = (att, peak, dur) => [[0, 1e-4], [att, peak], [dur, 1e-4]];
function O(V, t, type, f, g, dest = V.bus) {
  const o = V.add(ac2.createOscillator()), gn = V.add(ac2.createGain()); o.type = type;
  if (typeof f === 'number') o.frequency.setValueAtTime(f, t); else P(o.frequency, f, t);
  P(gn.gain, g, t); o.connect(gn); gn.connect(dest);
  V.start(o, t + g[0][0], t + g[g.length - 1][0] + 0.03);
  return { o, g: gn };
}
function F(V, type, f, q = 1, dest = V.bus, t = 0) {
  const b = V.add(ac2.createBiquadFilter()); b.type = type; b.Q.value = q;
  if (typeof f === 'number') b.frequency.value = f; else P(b.frequency, f, t);
  b.connect(dest); return b;
}
function N(V, t, g, dest) {
  const s = V.add(ac2.createBufferSource()), gn = V.add(ac2.createGain()); s.buffer = nBuf; s.loop = true;
  P(gn.gain, g, t); s.connect(gn); gn.connect(dest);
  V.start(s, t + g[0][0], t + g[g.length - 1][0] + 0.03);
}
function L(V, t, dur, rate, depth, param) {
  const o = V.add(ac2.createOscillator()), gn = V.add(ac2.createGain());
  o.frequency.value = rate; gn.gain.value = depth; o.connect(gn); gn.connect(param); V.start(o, t, t + dur);
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
// cartoon animal voices and toy instruments
const SND = {
  cat(V, t) {   // "meow": rising then falling nasal voice
    const bp = F(V, 'bandpass', [[0, 800], [0.14, 2000], [0.5, 1000]], 3, V.bus, t);
    O(V, t, 'sawtooth', [[0, 470], [0.14, 650], [0.55, 430]], [[0, 1e-4], [0.05, 1], [0.32, 0.65], [0.58, 1e-4]], bp);
    O(V, t, 'sine', [[0, 520], [0.14, 720], [0.55, 480]], [[0, 1e-4], [0.06, 0.2], [0.55, 1e-4]]);
  },
  dog(V, t) {   // "woof woof"
    for (const k of [0, 0.3]) {
      const s = t + k, lp = F(V, 'lowpass', [[0, 1500], [0.18, 450]], 1, V.bus, s);
      O(V, s, 'square', [[0, 260], [0.16, 170]], [[0, 1e-4], [0.012, 0.55], [0.2, 1e-4]], lp);
      O(V, s, 'sine', [[0, 320], [0.15, 220]], [[0, 1e-4], [0.01, 0.4], [0.17, 1e-4]]);
      N(V, s, [[0, 1e-4], [0.008, 0.2], [0.07, 1e-4]], F(V, 'bandpass', 1000, 1));
    }
  },
  duck(V, t) {  // "quack quack"
    for (const k of [0, 0.25]) {
      const s = t + k, bp = F(V, 'bandpass', [[0, 1100], [0.18, 1500]], 4, V.bus, s);
      O(V, s, 'sawtooth', [[0, 340], [0.18, 285]], [[0, 1e-4], [0.01, 1.4], [0.07, 0.9], [0.19, 1e-4]], bp);
    }
  },
  cow(V, t) {   // "mooo": low, opening up
    const lp = F(V, 'lowpass', [[0, 260], [0.28, 950], [0.95, 330]], 5, V.bus, t);
    const a1 = O(V, t, 'sawtooth', [[0, 150], [0.3, 142], [1.02, 104]], [[0, 1e-4], [0.2, 0.85], [0.75, 0.6], [1.08, 1e-4]], lp);
    O(V, t, 'sawtooth', [[0, 151.5], [0.3, 143.5], [1.02, 105]], [[0, 1e-4], [0.2, 0.5], [0.75, 0.35], [1.08, 1e-4]], lp);
    L(V, t, 1.1, 5, 2.5, a1.o.frequency);
  },
  sheep(V, t) { // "baa-aa": shaky voice
    const bp = F(V, 'bandpass', [[0, 900], [0.1, 1350], [0.8, 1050]], 3, V.bus, t);
    const a1 = O(V, t, 'sawtooth', [[0, 420], [0.1, 480], [0.82, 430]], [[0, 1e-4], [0.05, 0.8], [0.66, 0.55], [0.86, 1e-4]], bp);
    L(V, t, 0.88, 8.5, 0.32, a1.g.gain); L(V, t, 0.88, 8.5, 12, a1.o.frequency);
  },
  frog(V, t) {  // "ribbit": two buzzy croaks
    for (const k of [0, 0.22]) {
      const s = t + k, lp = F(V, 'lowpass', 900, 5);
      const a1 = O(V, s, 'square', [[0, 150], [0.13, 112]], [[0, 1e-4], [0.01, 0.7], [0.14, 1e-4]], lp);
      L(V, s, 0.15, 38, 0.45, a1.g.gain);
    }
  },
  bird(V, t) {  // "tweet tweet"
    [0, 0.12, 0.24, 0.42].forEach((k, i) => O(V, t + k, 'sine', [[0, i === 3 ? 3000 : 2600], [0.05, 4300], [0.09, 3200]], [[0, 1e-4], [0.008, 0.42], [0.1, 1e-4]]));
  },
  pig(V, t) {   // "oink oink"
    for (const k of [0, 0.3]) {
      const s = t + k, bp = F(V, 'bandpass', [[0, 520], [0.18, 760]], 2.5, V.bus, s);
      const a1 = O(V, s, 'sawtooth', [[0, 190], [0.07, 245], [0.2, 165]], [[0, 1e-4], [0.02, 1], [0.21, 1e-4]], bp);
      L(V, s, 0.22, 32, 0.45, a1.g.gain);
      N(V, s, [[0, 1e-4], [0.02, 0.3], [0.12, 1e-4]], F(V, 'bandpass', 700, 2));
    }
  },
  rooster(V, t) { // "cock-a-doodle-doo"
    const bp = F(V, 'bandpass', 1500, 2.5);
    [[0, 0.12, 520, 600], [0.15, 0.1, 600, 640], [0.28, 0.12, 720, 760], [0.43, 0.58, 860, 560]].forEach(([k, d, f0, f1]) => {
      const a1 = O(V, t + k, 'sawtooth', [[0, f0], [d, f1]], [[0, 1e-4], [0.015, 1], [d * 0.7, 0.8], [d, 1e-4]], bp);
      if (d > 0.3) L(V, t + k, d, 7, 18, a1.o.frequency);
    });
  },
  lion(V, t) {  // "roar": growly noise + low buzz
    const lp = F(V, 'lowpass', [[0, 700], [0.3, 520], [1.05, 200]], 1.5, V.bus, t);
    N(V, t, [[0, 1e-4], [0.22, 0.9], [0.7, 0.6], [1.12, 1e-4]], lp);
    const a1 = O(V, t, 'sawtooth', [[0, 120], [0.3, 100], [1.05, 72]], [[0, 1e-4], [0.2, 0.9], [0.7, 0.6], [1.12, 1e-4]], F(V, 'lowpass', 650, 2));
    L(V, t, 1.15, 23, 0.5, a1.g.gain);
  },
  owl(V, t) {   // "hoo-hooo"
    [[0, 0.3], [0.4, 0.42]].forEach(([k, d]) => {
      const s = t + k;
      O(V, s, 'sine', [[0, 400], [0.08, 430], [d, 370]], [[0, 1e-4], [0.07, 0.65], [d, 1e-4]]);
      N(V, s, [[0, 1e-4], [0.06, 0.05], [d, 1e-4]], F(V, 'bandpass', 600, 3));
    });
  },
  elephant(V, t) { // trumpeting
    const bp = F(V, 'bandpass', [[0, 900], [0.15, 2100], [0.7, 1400]], 2, V.bus, t);
    const a1 = O(V, t, 'sawtooth', [[0, 300], [0.12, 640], [0.5, 580], [0.78, 430]], [[0, 1e-4], [0.08, 1], [0.5, 0.8], [0.82, 1e-4]], bp);
    O(V, t, 'square', [[0, 303], [0.12, 646], [0.5, 585], [0.78, 434]], [[0, 1e-4], [0.08, 0.35], [0.5, 0.3], [0.82, 1e-4]], bp);
    L(V, t, 0.85, 7, 22, a1.o.frequency);
  },
  bee(V, t) {   // "bzzzz", flying around
    const lp = F(V, 'lowpass', 1500, 1);
    const a1 = O(V, t, 'sawtooth', [[0, 210], [0.45, 245], [0.95, 200]], [[0, 1e-4], [0.1, 0.5], [0.82, 0.45], [0.98, 1e-4]], lp);
    L(V, t, 1, 55, 0.25, a1.g.gain); L(V, t, 1, 5, 22, a1.o.frequency);
  },
  piano(V, t) { // do-mi-sol
    [60, 64, 67].forEach((m, i) => {
      const s = t + i * 0.14, f = hz(m), d = i === 2 ? 1 : 0.55;
      O(V, s, 'sine', f, E(0.005, 0.7, d)); O(V, s, 'sine', f * 2.002, E(0.005, 0.25, d * 0.6)); O(V, s, 'triangle', f * 3.01, E(0.005, 0.08, d * 0.35));
    });
  },
  xylo(V, t) {  // quick tink-tink-tonk down
    [79, 76, 72].forEach((m, i) => {
      const s = t + i * 0.11, f = hz(m);
      O(V, s, 'sine', f, E(0.002, 0.8, 0.45)); O(V, s, 'sine', f * 4, E(0.002, 0.25, 0.08)); O(V, s, 'sine', f * 10, E(0.002, 0.05, 0.03));
    });
  },
  drum(V, t) {  // boom-tak-boom
    for (const k of [0, 0.38]) O(V, t + k, 'sine', [[0, 160], [0.25, 45]], E(0.004, 1.1, 0.32));
    const s = t + 0.19;
    N(V, s, E(0.002, 0.6, 0.16), F(V, 'bandpass', 2200, 0.8)); O(V, s, 'triangle', [[0, 240], [0.08, 160]], E(0.002, 0.4, 0.1));
  },
  bell(V, t) {  // ding-dong
    [[0, 784], [0.45, 622]].forEach(([k, f]) => {
      const s = t + k;
      [[1, 0.55, 0.85], [2, 0.25, 0.6], [2.76, 0.18, 0.45], [5.4, 0.07, 0.22]].forEach(([mul, v, d]) => O(V, s, 'sine', f * mul, E(0.003, v, d)));
    });
  },
  trumpet(V, t) { // ta-ta-taaa
    [[0, 0.1, 67], [0.14, 0.1, 67], [0.28, 0.5, 72]].forEach(([k, d, m]) => {
      const s = t + k, f = hz(m), lp = F(V, 'lowpass', [[0, 500], [0.04, 3200], [d, 1400]], 2, V.bus, s);
      const a1 = O(V, s, 'sawtooth', f, [[0, 1e-4], [0.03, 0.6], [d * 0.8, 0.5], [d + 0.04, 1e-4]], lp);
      if (d > 0.3) L(V, s, d, 5.5, 5, a1.o.frequency);
    });
  },
  flute(V, t) { // airy, two soft notes
    const a1 = O(V, t, 'sine', [[0, 784], [0.32, 784], [0.36, 1046], [0.78, 1046]], [[0, 1e-4], [0.08, 0.55], [0.65, 0.5], [0.82, 1e-4]]);
    O(V, t, 'sine', [[0, 1568], [0.32, 1568], [0.36, 2092], [0.78, 2092]], [[0, 1e-4], [0.08, 0.08], [0.82, 1e-4]]);
    L(V, t + 0.15, 0.67, 5, 9, a1.o.frequency);
    N(V, t, [[0, 1e-4], [0.05, 0.09], [0.6, 0.05], [0.82, 1e-4]], F(V, 'bandpass', 2600, 1.5));
  },
  guitar(V, t) { // strum
    [48, 55, 60, 64, 67].forEach((m, i) => {
      const s = t + i * 0.035, f = hz(m), lp = F(V, 'lowpass', [[0, f * 9], [0.7, f * 1.4]], 1, V.bus, s);
      O(V, s, 'sawtooth', f, E(0.003, 0.32, 0.95), lp); O(V, s, 'triangle', f, E(0.003, 0.25, 0.8));
    });
  },
  violin(V, t) { // bowed with vibrato
    const bp = F(V, 'bandpass', 1100, 0.7), lp = F(V, 'lowpass', 3200, 0.7), fp = [[0, 440], [0.42, 440], [0.46, 494], [0.9, 494]];
    const a1 = O(V, t, 'sawtooth', fp, [[0, 1e-4], [0.14, 0.7], [0.4, 0.45], [0.48, 0.65], [0.85, 0.5], [0.95, 1e-4]], bp);
    const a2 = O(V, t, 'sawtooth', fp, [[0, 1e-4], [0.14, 0.18], [0.85, 0.14], [0.95, 1e-4]], lp);
    L(V, t + 0.12, 0.83, 6, 6, a1.o.frequency); L(V, t + 0.12, 0.83, 6, 6, a2.o.frequency);

const PADS_PICK = { key: 'pads', title: '幾個果凍？', def: '4', options: [{ id: '4', label: '🍬 4 個', sub: '簡單' }, { id: '6', label: '🍭 6 個', sub: '比較難' }] };
const TUNE_PICK = { key: 'tune', title: '彈什麼？', def: 'rand', options: [{ id: 'rand', label: '🎲 隨機', sub: '每次都不一樣' }, { id: 'song', label: '🎶 兒歌旋律', sub: '小星星、小蜜蜂…' }] };
const HELP = '<p>🔊 <b>聲音配對</b>：翻開的牌只會發出聲音，找出兩張<b>聲音一樣</b>的牌！後面還有 🖼️ 聽聲找圖、🍀 三張一組。<br>🌈 <b>跟著彈</b>：噗噗先彈，你照著按果凍，每次多一個音。後面還有 🥁 節奏、🙈 閉眼聽、🎶 整首兒歌。</p><p class="sm-snd">記得打開聲音喔 🔊</p>';
function starsOf(key, n) { const m = MG.store.get(key, {}) || {}; const s = +m[n] || 0; return s ? '⭐'.repeat(s) : ''; }
const MENU = {
  id: 'simon', title: '噗噗聽聽看', menuLabel: '☰ 選關', html: HELP, modesTitle: '想怎麼玩？', levelsTitle: '選一關',
  picks: [], modes: [], levels: { count: 20, max: 20, label: n => n }, _game: 'pairs',
  playing: () => state === 'play',
  restore: () => { if (MENU._game !== game) setupMenu(game, true); },
  start: (m, l, pk) => {
    mode = m === 'challenge' ? 'challenge' : 'relax';
    const g = (pk && pk.game) === 'simon' ? 'simon' : 'pairs';
    MG.store.set('simon.lv.' + g, l);
    if (g === 'pairs') { pickSet = (pk && pk.set) || MG.store.get('simon.pick.set', 'auto'); startPairs(l); }
    else {
      padsN = ((pk && pk.pads) || MG.store.get('simon.pick.pads', '4')) === '6' ? 6 : 4;
      tuneMode = ((pk && pk.tune) || MG.store.get('simon.pick.tune', 'rand')) === 'song' ? 'song' : 'rand';
      startSimon(l);
    }
    setupMenu(g, true);
  },
};
function setupMenu(g, keepLevel) {
  MENU._game = g;
  if (g === 'pairs') {
    const ps = MG.store.get('simon.pick.set', 'auto');
    MENU.picks = [GAME_PICK, SET_PICK];
    MENU.modes = [{ id: 'relax', label: '🐢 慢慢玩', sub: '不計時、有 👂 提示' }, { id: 'challenge', label: '⭐ 挑戰', sub: '⏱ 計時、最快紀錄' }];
    MENU.levels.label = n => `${lvNameP(n, ps)} ${starsOf('simon.pstars', n)}`; MENU.levels.short = n => lvShortP(n, ps);
    MENU.keys = '點牌翻開、聽聲音　電腦：<kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 選牌、<kbd>Enter</kbd> 翻牌、<kbd>H</kbd> 提示';
  } else {
    MENU.picks = [GAME_PICK, PADS_PICK, TUNE_PICK];
    MENU.modes = [{ id: 'relax', label: '🐢 慢慢玩', sub: '錯了再聽一次，不會結束' }, { id: 'challenge', label: '⭐ 挑戰', sub: '❤️❤️❤️ 三次機會' }];
    MENU.levels.label = n => `${lvNameS(n)} ${starsOf('simon.sstars', n)}`; MENU.levels.short = lvShortS;
    MENU.keys = '點果凍跟著彈（好幾根手指也可以）　電腦：<kbd>1</kbd>～<kbd>6</kbd> 彈果凍、<kbd>空白鍵</kbd> 再聽一次';
  }
  if (!keepLevel) MG.store.set('simon.pickLevel', MG.store.get('simon.lv.' + g, 1));
}
function preview(g) {
  game = g; lv = MG.store.get('simon.lv.' + g, 1);
  if (g === 'pairs') { const ps = pairsSetup(lv, MG.store.get('simon.pick.set', 'auto')); nPairs = ps.n; matched = 0; group = ps.ty === 'tri' ? 3 : 2; pairTy = ps.ty; makeCards(genPairs(ps.n, ps.set, group), ps.ty); pads = []; }
  else { padsN = MG.store.get('simon.pick.pads', '4') === '6' ? 6 : 4; const S = SLV[lv - 1] || {}; sKind = S.k || 'norm'; makePads(sKind === 'norm' ? padsN : S.pads || 4, sKind, S.set); cards = []; seq = []; phase = 'idle'; }
  layout();
}
function rerender() {
  const ov = document.querySelector('.mg-over'); if (!ov) return;
  const prev = MENU._game;
  ov.querySelectorAll('.mg-opt[data-pk][aria-pressed="true"]').forEach(b => MG.store.set('simon.pick.' + b.dataset.pk, b.dataset.pv));
  const mb = ov.querySelector('.mg-opt[data-mode][aria-pressed="true"]'); if (mb) MG.store.set('simon.pickMode', mb.dataset.mode);
  const lb = ov.querySelector('.mg-lv[aria-pressed="true"]'); if (lb) MG.store.set('simon.lv.' + prev, +lb.dataset.lv);
  const g = MG.store.get('simon.pick.game', 'pairs') === 'simon' ? 'simon' : 'pairs', st = ov.scrollTop;
  setupMenu(g);
  if (state !== 'play') { clearAll(); state = 'menu'; preview(g); }
  MG.choose(MENU);
  ov.scrollTop = st;
}
// MG.choose re-renders the panel by itself from the ☰ button too, so bind the "switch game" buttons whenever the panel changes
new MutationObserver(() => {
  const ov = document.querySelector('.mg-over'); if (!ov || ov.hidden) return;
  ov.querySelectorAll('.mg-opt[data-pk="game"]:not([data-sm]),.mg-opt[data-pk="set"]:not([data-sm])').forEach(b => { b.dataset.sm = '1'; b.addEventListener('click', rerender); });
}).observe(document.body, { childList: true, subtree: true });
function menu() {
  clearAll(); state = 'menu';
  const g = MG.store.get('simon.pick.game', 'pairs') === 'simon' ? 'simon' : 'pairs';
  setupMenu(g); preview(g);
  MG.choose(MENU);
  hud(true);
}

cv.onfit = () => layout();
MG.fit(cv, (sw, sh) => {
  const l = sw > sh * 1.05;
  if (l) { const h = 560; return [Math.round(clamp(h * (sw - 12) / Math.max(1, sh - 12), 760, 1400)), h]; }
  const w = 480; return [w, Math.round(clamp(w * (sh - 12) / Math.max(1, sw - 12), 600, 1000))];
});
menu();

// ---------- hook for automated tests ----------
function toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; }
window.SIM = {
  get state() { return state; }, get game() { return game; }, get mode() { return mode; }, get level() { return lv; }, get phase() { return phase; },
  get seq() { return seq.slice(); }, get inIdx() { return inIdx; }, get hearts() { return hearts; }, get mistakes() { return mistakes; }, get target() { return target; }, get endless() { return endless; },
  get moves() { return moves; }, get matched() { return matched; }, get nPairs() { return nPairs; }, get set() { return setNow; }, get opened() { return opened.slice(); }, get streak() { return streak; },
  get hinting() { return hinting; }, get padsN() { return padsN; }, get kind() { return sKind; }, get pairTy() { return pairTy; }, get group() { return group; }, get rounds() { return rounds; }, get intro() { return introUp; },
  rhythm: () => rhythmGaps(), slv: () => SLV.map(q => ({ ...q })), lvp: () => LV_P.map(q => q.slice()), get tune() { return tune && tune.nm; }, get frames() { return frames; }, get gt() { return gt; }, get word() { return lastWord; },
  get speed() { return speed; }, set speed(v) { speed = v; },
  cards: () => cards.map((c, i) => ({ i, snd: c.snd, pic: c.pic, up: c.up, done: c.done, heard: c.heard, ...toClient(c.x + cs / 2, c.y + cs / 2) })),
  pads: () => pads.map((p, i) => ({ i, m: p.m, snd: p.snd, ...toClient(p.cx, p.y + p.h * 0.5), w: p.w, h: p.h })),
  btn: () => toClient(btn.x + btn.w / 2, btn.y + btn.h / 2),
  dims: () => ({ W, H, land, cs, cssCard: cs * cv.getBoundingClientRect().width / W, area: { ...area } }),
  genPairs, pairsSetup, nextRandom, tunePads: (i, n) => tunePads(TUNES[n][i], n), tunes: () => ({ 4: TUNES[4].map(q => q.nm), 6: TUNES[6].map(q => q.nm) }),
  flip: i => flipCard(i), tap: k => padTap(k), hint: () => doHint(), replay: () => replaySeq(),
  play: id => playSnd(id), playPad: m => playPad(m, 0.5), ids: () => [...ANIMALS, ...INSTS, ...VEHICLES, ...WEATHER, ...KITCHEN, 'dk', 'ds', ...PITCHES.map(m => 'n' + m)],
  audio: () => ({ ...AU, live: liveV.size, nodes: AU.made - AU.freed, ctx: ac2 ? ac2.state : 'none' }),
  events: () => evLog.slice(), floats: () => floats.map(f => f.text),
  startPairs: (l, o = {}) => { if (o.set) pickSet = o.set; if (o.mode) mode = o.mode; startPairs(l); },
  startSimon: (l, o = {}) => { if (o.pads) padsN = o.pads; if (o.mode) mode = o.mode; if (o.tune) tuneMode = o.tune; startSimon(l); },
  menu: () => menu(),
};

MG.loop(dt => { update(dt); draw(); });
</script>
</body>
