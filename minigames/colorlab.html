<script>
'use strict';
MG.init({ id: 'colorlab', title: '顏色實驗室', stats: ['level', 'prog'] });
const cv = document.getElementById('cv'); let x = cv.getContext('2d');
const TAU = Math.PI * 2, clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (k = clamp(k, 0, 1), k * k * (3 - 2 * k));
const INKC = '#3a2633', FONT = '"Noto Sans TC",system-ui,sans-serif';
let SPEED = 1, T = 0;

// ================= colours: parts of red / yellow / blue / white / black → one paint colour =================
// red+yellow+blue are blended on a "paint" colour cube (red+yellow = orange, not the screen's light mixing);
// white lightens and black darkens by how much of them is in the bowl.
const RYB = { '000': [255, 255, 255], '100': [235, 56, 62], '010': [255, 212, 48], '001': [44, 112, 222], '110': [255, 138, 36], '101': [146, 70, 186], '011': [62, 176, 78], '111': [124, 78, 44] };
function ryb(r, y, b) {
  const o = [0, 0, 0];
  for (let i = 0; i < 8; i++) {
    const a = i >> 2 & 1, c = i >> 1 & 1, d = i & 1, w = (a ? r : 1 - r) * (c ? y : 1 - y) * (d ? b : 1 - b);
    if (w) { const k = RYB['' + a + c + d]; for (let j = 0; j < 3; j++) o[j] += k[j] * w; }
  }
  return o;
}
const DARK = [34, 30, 46];
function mixRGB(v) {
  const [R, Y, B, Wh, K] = v, tot = R + Y + B + Wh + K; if (!tot) return null;
  const c = R + Y + B; let col;
  if (c) { const m = Math.max(R, Y, B); col = ryb(R / m, Y / m, B / m).map(q => lerp(q, 255, Wh / tot * 0.82)); }
  else col = Wh ? [246, 244, 240] : DARK.slice();
  if (K) { const f = c || Wh ? Math.min(1, K / tot * 1.25) : 1; col = col.map((q, i) => lerp(q, DARK[i], f)); }
  return col.map(Math.round);
}
const css = (c, a = 1) => a < 1 ? `rgba(${c[0]},${c[1]},${c[2]},${a})` : `rgb(${c[0]},${c[1]},${c[2]})`;
const lerpC = (a, b, k) => a.map((q, i) => Math.round(lerp(q, b[i], k)));
const hx = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const lineOf = c => css(c.map((q, i) => Math.round(q * 0.52 + [40, 20, 60][i] * 0.3)));
// recipes: [red, yellow, blue, white, black]
const COL = { red: [1, 0, 0, 0, 0], yellow: [0, 1, 0, 0, 0], blue: [0, 0, 1, 0, 0], white: [0, 0, 0, 1, 0], black: [0, 0, 0, 0, 1],
  orange: [1, 1, 0, 0, 0], green: [0, 1, 1, 0, 0], purple: [1, 0, 1, 0, 0], pink: [1, 0, 0, 1, 0], sky: [0, 0, 1, 1, 0], navy: [0, 0, 1, 0, 1], deep: [0, 0, 2, 0, 1],
  dgreen: [0, 1, 1, 0, 1], brown: [1, 1, 1, 0, 0], gray: [0, 0, 0, 1, 1], dgray: [0, 0, 0, 1, 2], cream: [0, 1, 0, 1, 0], gold: [1, 2, 0, 0, 0], lime: [0, 2, 1, 0, 0],
  teal: [0, 1, 2, 0, 0], magenta: [2, 0, 1, 0, 0], maroon: [1, 0, 0, 0, 1], rosy: [2, 0, 0, 1, 0], peach: [1, 1, 0, 1, 0], mint: [0, 1, 1, 1, 0], lilac: [1, 0, 1, 1, 0] };
const sum = v => v.reduce((a, b) => a + b, 0);
const same = (m, t) => { const a = sum(m), b = sum(t); return a > 0 && m.every((q, i) => q * b === t[i] * a); };
const CAP = 6;
function multOf(m, t, cap = CAP) { const st = sum(t); for (let k = 1; k * st <= cap; k++) if (t.every((q, i) => q * k >= m[i])) return k; return 0; }
const POT = [0, 1, 2, 3, 4].map(i => mixRGB(COL[['red', 'yellow', 'blue', 'white', 'black'][i]]));

// ================= levels =================
// t: mix / tint / shade / amount / multi / rainbow / fix / guess (all "mix in the bowl, paint the picture"),
//    sort (warm-up: put things in the right basket), light (torches: light mixes differently), studio (free painting)
const LEVELS = [
  { t: 'mix', pic: 'sun', pots: 'RYB', intro: 'mix', name: '太陽公公' },
  { t: 'sort', sort: 'rgb', intro: 'sort', name: '紅黃藍分一分' },
  { t: 'mix', pic: 'fish', pots: 'RYB', intro: 'mix2', name: '橘色小魚' },
  { t: 'mix', pic: 'frog', pots: 'RYB', name: '綠色青蛙' },
  { t: 'mix', pic: 'grapes', pots: 'RYB', name: '紫色葡萄' },
  { t: 'guess', pic: 'balloons', cols: ['orange', 'green', 'purple'], opts: ['orange', 'green', 'purple'], intro: 'guess', name: '猜猜看：氣球' },
  { t: 'tint', pic: 'pig', pots: 'RYBW', intro: 'tint', name: '粉紅小豬' },
  { t: 'tint', pic: 'whale', pots: 'RYBW', name: '淺藍鯨魚' },
  { t: 'rainbow', pic: 'rainbow', pots: 'RYB', intro: 'rainbow', name: '畫彩虹' },
  { t: 'sort', sort: 'warm', intro: 'warm', name: '暖暖色、涼涼色' },
  { t: 'shade', pic: 'night', pots: 'RYBWK', intro: 'shade', name: '晚安夜空' },
  { t: 'multi', pic: 'flower', pots: 'RYBW', intro: 'multi', name: '盆栽小花' },
  { t: 'fix', pic: 'fruits', pots: 'RYB', wrong: { carrot: 'blue', grapes: 'green', pear: 'purple' }, pre: { carrot: 'red', grapes: 'blue', pear: 'yellow' }, intro: 'fix', name: '修好水果' },
  { t: 'light', rounds: [['star', 'yellow'], ['heart', 'magenta'], ['moon', 'cyan'], ['balloon', 'white']], intro: 'light', name: '手電筒魔法' },
  { t: 'amount', pic: 'lion', pots: 'RYB', intro: 'amount', name: '小獅子' },
  { t: 'multi', pic: 'car', pots: 'RYBWK', name: '小汽車' },
  { t: 'guess', pic: 'balloons', cols: ['pink', 'sky', 'gray'], opts: ['pink', 'sky', 'gray', 'purple'], name: '猜猜看：淡淡的顏色' },
  { t: 'mix', pic: 'bear', pots: 'RYBW', intro: 'three', name: '咖啡色小熊' },
  { t: 'amount', pic: 'parrot', pots: 'RYB', name: '鸚鵡' },
  { t: 'rainbow', pic: 'rainbow', cols: ['pink', 'peach', 'cream', 'mint', 'sky', 'lilac'], pots: 'RYBW', name: '粉彩彩虹' },
  { t: 'sort', sort: 'tone', intro: 'tone', name: '淺色、深色' },
  { t: 'fix', pic: 'tree', pots: 'RYBK', wrong: { crown: 'orange', trunk: 'purple', grass: 'blue' }, pre: { crown: 'green', trunk: 'orange', grass: 'yellow' }, name: '修好大樹' },
  { t: 'light', rounds: [['fish', 'cyan'], ['flower', 'red'], ['star', 'yellow'], ['heart', 'white'], ['moon', 'magenta'], ['balloon', 'green']], name: '彩色燈光秀' },
  { t: 'multi', pic: 'butterfly', pots: 'RYB', name: '蝴蝶' },
  { t: 'amount', pic: 'melon', pots: 'RYBWK', name: '西瓜' },
  { t: 'guess', pic: 'balloons', cols: ['purple', 'green', 'gray', 'pink', 'orange'], opts: ['purple', 'green', 'gray', 'pink', 'orange', 'sky'], name: '猜猜看：五顆氣球' },
  { t: 'multi', pic: 'house', pots: 'RYBWK', name: '我的小房子' },
  { t: 'amount', pic: 'night', cols: { sky: 'deep', moon: 'cream', stars: 'gold' }, pots: 'RYBWK', name: '星星月亮' },
  { t: 'multi', pic: 'sea', pots: 'RYBW', name: '海底世界' },
  { t: 'studio', intro: 'studio', name: '自由畫室' },
];
const MK = { sort: '🧺', guess: '❓', tint: '🤍', shade: '🖤', amount: '🥄', rainbow: '🌈', multi: '🧩', fix: '🩹', light: '🔦', studio: '🖌️' };
const NEWS = {
  mix: ['🎨 顏色實驗室', '點下面的顏料罐，把顏料倒進大碗裡。調出和小水滴一樣的顏色，再點一下圖畫，畫筆就會幫你塗上去！'],
  sort: ['🧺 顏色分一分', '把中間的東西放進同樣顏色的籃子裡！點籃子，或把東西拖過去都可以。'],
  mix2: ['✨ 兩種顏色變魔術', '兩種顏色混在一起，會變出新的顏色喔！<br>紅＋黃＝橘色、黃＋藍＝綠色、紅＋藍＝紫色。'],
  guess: ['❓ 猜猜看', '這個顏色是哪兩個顏色變出來的？點一張顏料卡試試看。猜錯也沒關係，倒掉再試一次！'],
  tint: ['🤍 加白色變淡淡的', '加一點白色，顏色就會變淺：紅＋白＝粉紅色、藍＋白＝淺藍色。'],
  rainbow: ['🌈 畫彩虹', '彩虹要從外面一圈一圈往裡面畫：紅、橘、黃、綠、藍、紫！虛線閃閃的那一圈，就是現在要畫的。'],
  warm: ['☀️❄️ 暖暖色和涼涼色', '紅、橘、黃像太陽一樣暖暖的；藍、綠、紫像冰塊和大海一樣涼涼的。把它們分到對的籃子！'],
  shade: ['🖤 加黑色變深深的', '加一點黑色，顏色就會變深：藍＋黑＝深藍色的夜空。'],
  multi: ['🧩 好多地方要塗', '這張圖有好幾個地方，每個地方的顏色都不一樣。看小水滴的顏色，一個一個調出來！'],
  fix: ['🩹 修好顏色', '糟糕，圖畫塗錯顏色了！碗裡已經有一點顏料，想一想還要加什麼，才會變成對的顏色。'],
  light: ['🔦 手電筒魔法', '燈光混在一起跟顏料不一樣喔！紅光＋綠光會變黃色，三種光全部打開會變白色。點手電筒就能打開或關掉。'],
  amount: ['🥄 份量也很重要', '加越多的那個顏色，就越像那個顏色。2 匙黃＋1 匙紅，會變成黃黃的橘色。看泡泡裡的小圓點數一數！'],
  three: ['🟤 三種顏色', '紅、黃、藍三種顏色全部混在一起，會變成咖啡色喔！'],
  tone: ['🌗 淺色和深色', '淡淡的顏色放進白天（太陽）的籃子，深深的顏色放進晚上（月亮）的籃子。'],
  studio: ['🖌️ 自由畫室', '想塗什麼顏色都可以！調好顏色後點圖畫的地方就會塗上去。按 ◀ ▶ 換圖，畫好了按 ✓。'],
};
const potList = () => [...(L && L.pots || 'RYBWK')].map(ch => 'RYBWK'.indexOf(ch));

// ================= small drawing helpers (picture space is 200×200) =================
const E = (p, cx, cy, rx, ry = rx, rot = 0) => { p.moveTo(cx + rx * Math.cos(rot), cy + rx * Math.sin(rot)); p.ellipse(cx, cy, rx, ry, rot, 0, TAU); };
function rotP(p, cx, cy, a, dx = 0, dy = 0) {
  const c = Math.cos(a), s = Math.sin(a), Tq = (X, Y) => [cx + dx + (X - cx) * c - (Y - cy) * s, cy + dy + (X - cx) * s + (Y - cy) * c];
  return { moveTo: (a1, b1) => p.moveTo(...Tq(a1, b1)), lineTo: (a1, b1) => p.lineTo(...Tq(a1, b1)), closePath: () => p.closePath(),
    quadraticCurveTo: (a1, b1, a2, b2) => p.quadraticCurveTo(...Tq(a1, b1), ...Tq(a2, b2)),
    bezierCurveTo: (a1, b1, a2, b2, a3, b3) => p.bezierCurveTo(...Tq(a1, b1), ...Tq(a2, b2), ...Tq(a3, b3)) };
}
function starPath(p, cx, cy, R, r = R * 0.48, rot = 0) { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, q = i % 2 ? r : R; if (!i) p.moveTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); else p.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } p.closePath(); }
function scallop(p, cx, cy, rx, ry, n, out, w = 0) { for (let i = 0; i <= n; i++) { const a = w + i * TAU / n, X = cx + Math.cos(a) * rx, Y = cy + Math.sin(a) * ry; if (!i) p.moveTo(X, Y); else { const am = a - Math.PI / n; p.quadraticCurveTo(cx + Math.cos(am) * rx * out, cy + Math.sin(am) * ry * out, X, Y); } } p.closePath(); }
// a painted shape: flat colour, a soft shade inside the lower-right edge, a light rim top-left, coloured outline
function fillStyled(p, c, lw = 3) {
  x.fillStyle = css(c); x.fill(p);
  x.save(); x.clip(p);
  x.translate(3, 4); x.strokeStyle = 'rgba(60,30,70,.16)'; x.lineWidth = 11; x.stroke(p);
  x.translate(-6, -7); x.strokeStyle = 'rgba(255,255,255,.38)'; x.lineWidth = 7; x.stroke(p);
  x.restore();
  void lw;
}
function outline(p, c, lw = 3) { x.lineJoin = 'round'; x.lineCap = 'round'; x.strokeStyle = c ? lineOf(c) : '#c4b298'; x.lineWidth = lw; x.stroke(p); }
function shp(build, col, lw = 3) { const p = new Path2D(); build(p); const c = typeof col === 'string' ? hx(col) : col; fillStyled(p, c); outline(p, c, lw); return p; }
function cloudPath(p, cx, cy, s) { p.moveTo(cx - 28 * s, cy + 10 * s); p.bezierCurveTo(cx - 42 * s, cy + 10 * s, cx - 40 * s, cy - 12 * s, cx - 22 * s, cy - 8 * s); p.bezierCurveTo(cx - 20 * s, cy - 28 * s, cx + 8 * s, cy - 30 * s, cx + 10 * s, cy - 12 * s); p.bezierCurveTo(cx + 24 * s, cy - 22 * s, cx + 42 * s, cy - 6 * s, cx + 30 * s, cy + 10 * s); p.closePath(); }
function cloudShape(cx, cy, s, aw = -1) { shp(p => cloudPath(p, cx, cy, s), '#ffffff'); if (aw >= 0) face(cx, cy - 2 * s, 0.5 * s, aw, { my: 10 }); }
// a little face: aw > .5 = awake (eyes open, smiling), otherwise sleeping; o.sad = frown (a wrongly painted thing)
function face(cx, cy, s, aw, o = {}) {
  x.save(); x.translate(cx, cy); x.scale(s, s); x.lineCap = 'round'; x.lineJoin = 'round';
  const ex = o.ex ?? 15, my = o.my ?? 11, blink = aw > 0.5 && ((T * 0.9 + cx * 0.013) % 3.3) < 0.1;
  x.strokeStyle = INKC; x.lineWidth = 2.6;
  for (const sd of [-1, 1]) {
    if (aw > 0.5 && !blink) {
      x.fillStyle = INKC; x.beginPath(); x.ellipse(sd * ex, 0, 4.6, 6, 0, 0, TAU); x.fill();
      x.fillStyle = '#fff'; x.beginPath(); x.arc(sd * ex - 1.5, -2.4, 1.9, 0, TAU); x.fill();
    } else { x.beginPath(); x.arc(sd * ex, -1, 4.6, 0.3, Math.PI - 0.3); x.stroke(); }
  }
  if (o.cheek !== false) { x.fillStyle = 'rgba(255,110,140,.42)'; for (const sd of [-1, 1]) { x.beginPath(); x.ellipse(sd * (ex + 9), o.cheekY ?? my - 4, 5.5, 3.4, 0, 0, TAU); x.fill(); } }
  if (o.sad) { x.beginPath(); x.arc(0, my + 6, 6, Math.PI + 0.55, -0.55); x.stroke(); x.fillStyle = 'rgba(120,200,255,.9)'; x.beginPath(); x.moveTo(ex + 6, -8); x.quadraticCurveTo(ex + 11, 0, ex + 6, 2); x.quadraticCurveTo(ex + 1, 0, ex + 6, -8); x.fill(); }
  else if (aw > 0.5) { x.fillStyle = '#7a2a3a'; x.beginPath(); x.moveTo(-7, my - 2); x.quadraticCurveTo(0, my + 9, 7, my - 2); x.closePath(); x.fill(); x.stroke(); }
  else { x.beginPath(); x.arc(0, my - 3, 4, 0.4, Math.PI - 0.4); x.stroke(); }
  x.restore();
}
function eye1(cx, cy, r, aw) {
  x.lineCap = 'round';
  if (aw > 0.5 && ((T + cx * 0.02) % 3.1) > 0.1) {
    x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); x.strokeStyle = INKC; x.lineWidth = 2.2; x.stroke();
    x.fillStyle = INKC; x.beginPath(); x.arc(cx + r * 0.18, cy + r * 0.05, r * 0.58, 0, TAU); x.fill();
    x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, cy - r * 0.22, r * 0.22, 0, TAU); x.fill();
  } else { x.strokeStyle = INKC; x.lineWidth = 2.6; x.beginPath(); x.arc(cx, cy - 1, r * 0.7, 0.3, Math.PI - 0.3); x.stroke(); }
}
function smileLine(x0, y0, x1, y1, bend, aw) { x.strokeStyle = INKC; x.lineWidth = 2.6; x.lineCap = 'round'; x.beginPath(); x.moveTo(x0, y0); x.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 + bend * (aw > 0.5 ? 1 : 0.4), x1, y1); x.stroke(); }
function bubbles(t, list) { for (const [bx, by, r] of list) { const yy = by + Math.sin(t * 1.6 + bx) * 3; x.strokeStyle = 'rgba(90,160,230,.7)'; x.lineWidth = 2; x.fillStyle = 'rgba(220,240,255,.55)'; x.beginPath(); x.arc(bx, yy, r, 0, TAU); x.fill(); x.stroke(); x.fillStyle = '#fff'; x.beginPath(); x.arc(bx - r * 0.35, yy - r * 0.35, r * 0.25, 0, TAU); x.fill(); } }
function weedP(p, x0, y0, sway, h = 1) { const s = sway; p.moveTo(x0 - 7, y0); p.bezierCurveTo(x0 - 24, y0 - 30 * h, x0 + 14, y0 - 52 * h, x0 + s, y0 - 84 * h); p.bezierCurveTo(x0 + 24 + s * 0.3, y0 - 52 * h, x0 - 8, y0 - 30 * h, x0 + 7, y0); p.closePath(); }
function grassTufts(list, col = '#6cc46a') { for (const [gx, gy, s] of list) shp(p => { p.moveTo(gx - 9 * s, gy); p.quadraticCurveTo(gx - 8 * s, gy - 10 * s, gx - 12 * s, gy - 18 * s); p.quadraticCurveTo(gx - 3 * s, gy - 10 * s, gx, gy - 20 * s); p.quadraticCurveTo(gx + 3 * s, gy - 10 * s, gx + 12 * s, gy - 17 * s); p.quadraticCurveTo(gx + 8 * s, gy - 8 * s, gx + 9 * s, gy); p.closePath(); }, col, 2.2); }
function miniFlower(fx, fy, s, col) { const p = new Path2D(); for (let i = 0; i < 5; i++) { const a = i * TAU / 5; E(p, fx + Math.cos(a) * 6 * s, fy + Math.sin(a) * 6 * s, 5 * s); } const c = hx(col); fillStyled(p, c); outline(p, c, 2); shp(q => E(q, fx, fy, 4 * s), '#ffd23f', 2); }

// ================= the pictures =================
// parts: { id, c (colour name), b: [x, y] where the little colour drop points, path(p, t, A) }
// A.on(id) 0/1 painted right, A.live 0..1 = whole picture done (comes alive), A.sad(id) = painted wrong (fix levels)
const STARS = [[134, 40, 11, 0], [172, 80, 8, 1], [120, 104, 7, 2], [166, 130, 9, 3], [36, 128, 6, 4]];
const flap = (t, A) => 1 - 0.32 * A.live * (0.5 + 0.5 * Math.sin(t * 9));
const PICS = {
  sun: () => ({ parts: [
      { id: 'rays', c: 'yellow', path: (p, t, A) => { const rot = 0.13 + t * 0.5 * A.live; for (let i = 0; i < 12; i++) { const a = rot + i * TAU / 12, w = 0.17; p.moveTo(100 + Math.cos(a - w) * 54, 100 + Math.sin(a - w) * 54); p.quadraticCurveTo(100 + Math.cos(a) * 104, 100 + Math.sin(a) * 104, 100 + Math.cos(a + w) * 54, 100 + Math.sin(a + w) * 54); p.closePath(); } } },
      { id: 'sun', c: 'yellow', b: [138, 80], path: p => E(p, 100, 100, 58) }],
    back: () => { cloudShape(34, 176, 0.95); cloudShape(172, 26, 0.7); },
    front: (t, A) => face(100, 100, 1.5, A.on('sun'), { my: 14 }),
    move: (t, A) => [0, Math.sin(t * 2.4) * 4 * A.live, 0] }),
  fish: () => ({ parts: [
      { id: 'fins', c: 'orange', path: (p, t, A) => {
          const q = rotP(p, 64, 100, Math.sin(t * 9) * 0.3 * A.on('body'));
          q.moveTo(68, 100); q.quadraticCurveTo(48, 84, 26, 60); q.quadraticCurveTo(40, 100, 26, 140); q.quadraticCurveTo(48, 116, 68, 100); q.closePath();

    hintOn = true; pointT = 3.5; bubWob = 0.5; MG.sfx('sparkle'); return;
  }
  for (const a of G.arrows) if (near(p, a.x, a.y, 34)) { MG.sfx('flip'); studioPic = (studioPic + (a.id === 'next' ? 1 : STUDIO_PICS.length - 1)) % STUDIO_PICS.length; MG.store.set('colorlab.studioPic', studioPic); setupPic(STUDIO_PICS[studioPic]); MG.sfx('whoosh'); return; }
  const cells = G.cells;
  for (let i = 0; i < cells.length; i++) if (inCell(p, cells[i])) { if (L.t === 'guess') tapOption(i); else addPaint(potList()[i]); return; }
  const onCard = p.x > G.cardX && p.x < G.cardX + G.P && p.y > G.cardY && p.y < G.cardY + G.P;
  const onBowl = Math.abs(p.x - G.bowlX) < G.br * 1.1 && p.y > G.rimY - G.br * 1.2 && p.y < G.rimY + G.br;
  if (studio && onCard) { const h = partAt(p); if (h && sum(landed) && !blobs.length && phase === 'mix') doPaint([h.i], [h.lx, h.ly]); else if (h && !sum(landed)) { MG.sfx('miss'); bowlWob = 0.4; say('🎨 ?', G.bowlX, G.rimY - G.br, '#8a5a20'); } return; }
  if (phase === 'ready' && (onCard || onBowl)) { doPaint(matchParts(landed)); return; }
  if (onBowl && sum(landed)) { stir = { a: Math.atan2(p.y - G.rimY, p.x - G.bowlX) }; try { cv.setPointerCapture(e.pointerId); } catch {} return; }
  if (onCard && !studio) { bubWob = 0.5; MG.sfx('tick'); }
}
let sortDragId = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || MG.panelOpen()) return;
  const p = cv.logical(e); idle = 0;
  if (L.t === 'light') { G.torches.forEach((t, i) => { if (near(p, t.x, t.y - t.r * 0.2, t.r * 1.15)) toggleTorch(i); }); return; }
  if (L.t === 'sort') {
    const it = SO.it;
    if (it && it.st === 'idle' && near(p, G.ix, G.iy, G.iR * 1.3)) { it.drag = true; it.dx = p.x; it.dy = p.y; sortDragId = e.pointerId; MG.sfx('tick'); try { cv.setPointerCapture(e.pointerId); } catch {} return; }
    G.baskets.forEach((b, j) => { if (Math.abs(p.x - b.x) < b.w / 2 + 6 && p.y > b.y - b.h / 2 - 10 && p.y < b.y + b.h / 2 + 10) dropInto(j); });
    return;
  }
  mixDown(p, e);
});
cv.addEventListener('pointermove', e => {
  if (state !== 'play') return;
  const p = cv.logical(e);
  if (L.t === 'sort' && SO.it && SO.it.drag && e.pointerId === sortDragId) { SO.it.dx = p.x; SO.it.dy = p.y; return; }
  if (stir) { const a = Math.atan2(p.y - G.rimY, p.x - G.bowlX); let d = a - stir.a; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; if (Math.abs(d) > 0.4) { stir.a = a; stirBoost = 0.35; bowlWob = 0.15; if (!swirl && showTo) swirl = { t: 0.6, c: showTo, from: showTo, rot: 0 }; if (Math.random() < 0.25) MG.sfx('whoosh'); } }
});
const endPtr = e => {
  stir = null;
  if (L.t === 'sort' && SO && SO.it && SO.it.drag && e.pointerId === sortDragId) {
    const it = SO.it, p = cv.logical(e); sortDragId = null; let hit = -1;
    G.baskets.forEach((b, j) => { if (Math.abs(p.x - b.x) < b.w / 2 + 6 && p.y > b.y - b.h / 2 - 30) hit = j; });
    if (hit >= 0) dropInto(hit, true); else { it.drag = false; MG.sfx('place'); }
  }
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
addEventListener('keydown', e => {
  if (state !== 'play' || MG.panelOpen()) return;
  const n = parseInt(e.key, 10);
  if (L.t === 'light') { if (n >= 1 && n <= 3) toggleTorch(n - 1); return; }
  if (L.t === 'sort') { if (n >= 1 && n <= SO.baskets.length) dropInto(n - 1); return; }
  if (n >= 1 && n <= G.cells.length) { if (L.t === 'guess') tapOption(n - 1); else addPaint(potList()[n - 1]); }
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (phase === 'ready') doPaint(matchParts(landed)); }
  else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); pourOut(); }
  else if (e.key === 'h' || e.key === 'H') { hintOn = true; pointT = 3.5; }
});

// ================= start =================
level = clamp(MG.store.get('colorlab.pickLevel', 1) | 0, 1, LEVELS.length); L = LEVELS[level - 1]; studio = L.t === 'studio';
if (L.t === 'sort') setupSort(); else if (L.t === 'light') setupLight(); else setupPic(studio ? STUDIO_PICS[studioPic % STUDIO_PICS.length] : L.pic);
layout(); hud(); menu();
MG.loop(dt0 => {
  const dt = dt0 * SPEED; T += dt; idle += dt;
  MG.fx.step(dt); for (const f of floats) f.life -= dt; floats = floats.filter(f => f.life > 0);
  if ((state === 'play' && !MG.panelOpen()) || state === 'over') update(dt);
  draw();
});

// ---------- hook for automated tests ----------
window.COLORLAB = {
  get state() { return state; }, get level() { return level; }, get phase() { return phase; }, get type() { return L.t; }, levels: LEVELS.length,
  set speed(v) { SPEED = v; }, get mix() { return mix.slice(); }, get funny() { return funny; },
  parts: () => PS.map(s => ({ name: s.name, done: s.done, wrong: s.wrong })),
  start: n => startLevel(n), win: () => win(), menu: () => menu(),
  // check every level can be finished with the paints it offers
  check() {
    const bad = [];
    LEVELS.forEach((lv, n) => {
      if (['sort', 'light', 'studio'].includes(lv.t)) return;
      const pc = PICS[lv.pic](lv), pots = [...(lv.pots || 'RYBWK')].map(ch => 'RYBWK'.indexOf(ch));
      pc.parts.forEach((pt, i) => {
        const name = (Array.isArray(lv.cols) && lv.pic !== 'balloons' ? lv.cols[i] : lv.cols && !Array.isArray(lv.cols) && lv.cols[pt.id]) || pt.c, t = COL[name];
        if (!t) { bad.push(`${n + 1}:${pt.id} no colour ${name}`); return; }
        if (lv.t !== 'guess' && t.some((q, k) => q && !pots.includes(k))) bad.push(`${n + 1}:${pt.id} needs a missing pot`);
        if (sum(t) > CAP) bad.push(`${n + 1}:${pt.id} too big`);
        if (lv.pre && lv.pre[pt.id] && !multOf(COL[lv.pre[pt.id]], t)) bad.push(`${n + 1}:${pt.id} pre can't reach`);
        if (lv.t === 'guess' && !lv.opts.some(o => same(COL[o], t))) bad.push(`${n + 1}:${pt.id} no right card`);
      });
    });
    return bad;
  },
  // one sensible step toward finishing the level (used by the test playthrough)
  auto() {
    if (state !== 'play' || MG.panelOpen()) return 'wait';
    if (L.t === 'light') { if (LI.ok) return 'wait'; const tg = LIGHT[LI.rounds[LI.ri][1]], i = [0, 1, 2].find(k => LI.on[k] !== tg[k]); if (i != null) toggleTorch(i); return 'torch'; }
    if (L.t === 'sort') { if (!SO.it || SO.it.st !== 'idle') return 'wait'; dropInto(basketFor(SO.it.c)); return 'sort'; }
    if (studio) { if (!sum(landed)) { addPaint(0); return 'paint'; } if (phase === 'mix' && !blobs.length && !swirl) { if (!PS[0].col) { doPaint([0]); return 'brush'; } aliveT = 0; phase = 'alive'; return 'done'; } return 'wait'; }
    if (phase === 'ready') { doPaint(matchParts(landed)); return 'brush'; }
    if (phase !== 'mix' || blobs.length || swirl || tip || autoOut > 0) return 'wait';
    if (L.t === 'guess') { const i = L.opts.findIndex(o => same(COL[o], PS[cur].t)); tapOption(i); return 'guess'; }
    const np = nextPot(); if (np === 'sink') { pourOut(); return 'sink'; } if (np != null) { addPaint(np); return 'pot'; }
    return 'wait';
  },
  // client coordinates of things, for real taps
  at(what, i = 0) {
    const r = cv.getBoundingClientRect(), B = 3, f = (lx, ly) => ({ x: r.left + B + lx * (r.width - 2 * B) / W, y: r.top + B + ly * (r.height - 2 * B) / H });
    if (what === 'cell') return f(G.cells[i].x, G.cells[i].y);
    if (what === 'sink') return f(G.btnX, G.sinkY);
    if (what === 'hint') return f(G.btnX, G.hintY);
    if (what === 'bowl') return f(G.bowlX, G.rimY + G.br * 0.4);
    if (what === 'card') return f(G.cardX + G.P / 2, G.cardY + G.P / 2);
    if (what === 'part') { const b = pic.parts[i].b || [100, 100]; return f(G.ox + b[0] * G.k, G.oy + b[1] * G.k); }
    if (what === 'torch') return f(G.torches[i].x, G.torches[i].y);
    if (what === 'basket') return f(G.baskets[i].x, G.baskets[i].y);
    if (what === 'item') return f(G.ix, G.iy);
    return null;
  },
  needPot: () => nextPot(), potIndex: k => potList().indexOf(k), basketFor: () => SO && SO.it ? basketFor(SO.it.c) : -1,
};
</script>
