<body>
<main class="mg-stage" id="stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'duel', title: '噗噗對對碰', stats: ['score'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
const SIM = { on: false };

// ---------- the two players ----------
const COL = [
  { nm: '綠色噗噗', ic: '💚', pal: MG.JELLY.green, main: '#3cb85a', dark: '#1f6e35', soft: '#dcf7d2', bg: ['#effde6', '#d3f3c4'], bub: ['#e3ffe0', '#7fe08e', '#2fa64a'] },
  { nm: '粉紅噗噗', ic: '💗', pal: MG.JELLY.pink, main: '#f06a9e', dark: '#9a2f5d', soft: '#ffe0ec', bg: ['#fff1f6', '#ffd7e6'], bub: ['#ffe8f1', '#ff9cc2', '#d84b85'] },
];
// append-only: level numbers keep their meaning for saved picks
const IDS = ['mole', 'fruit', 'bubble', 'quick', 'balloon', 'find'];          // levels 1–6 (7 = 🎲 random)
const NEW_IDS = ['color', 'animal', 'tug', 'memory', 'dots', 'run'];         // levels 8–13 (14 = 🏆 tournament)
const NEW2_IDS = ['fish', 'drum', 'stack', 'count', 'frog', 'simon'];        // levels 15–20
const ALL_IDS = IDS.concat(NEW_IDS, NEW2_IDS);
const LV_RANDOM = 7, LV_CUP = 14, LV_COUNT = 20;
const cidOf = n => n <= 6 ? IDS[n - 1] : n >= 8 && n <= 13 ? NEW_IDS[n - 8] : n >= 15 && n <= 20 ? NEW2_IDS[n - 15] : null;
// 每關多長：0 短 / 1 中 / 2 長 — a contest field can be [short, medium, long]
let LEN = 1;
const LENS = ['short', 'med', 'long'];
const L3 = v => Array.isArray(v) ? v[LEN] : v;
const AI = {
  easy: { react: [0.5, 0.88], speed: 580, miss: 0.26, decoy: 0.18, wrong: 0.22, rate: 3.9, qd: [0.52, 0.85], early: 0.1, find: [1.9, 3.2], err: 55, memo: 0.35 },
  normal: { react: [0.32, 0.58], speed: 820, miss: 0.15, decoy: 0.08, wrong: 0.12, rate: 5.2, qd: [0.38, 0.58], early: 0.06, find: [1.4, 2.4], err: 30, memo: 0.6 },
  hard: { react: [0.18, 0.32], speed: 1250, miss: 0.05, decoy: 0.02, wrong: 0.04, rate: 7.4, qd: [0.24, 0.36], early: 0.03, find: [0.8, 1.4], err: 10, memo: 0.85 },
};
const LVN = { easy: '🐣 簡單', normal: '⭐ 普通', hard: '🔥 厲害' };

// ---------- layout: two halves; in 面對面 the top half is turned 180° ----------
let W = 600, H = 900, LAY = 'face', HW = 600, HH = 445;
const DIV = 10, HUD = 50;
function layoutHalves() { if (LAY === 'face') { HW = W; HH = (H - DIV) / 2; } else { HW = (W - DIV) / 2; HH = H; } }
function halfRect(p) {
  if (LAY === 'face') return p === 0 ? { x: 0, y: (H + DIV) / 2, w: W, h: HH } : { x: 0, y: 0, w: W, h: HH };
  return p === 0 ? { x: 0, y: 0, w: HW, h: H } : { x: (W + DIV) / 2, y: 0, w: HW, h: H };
}
const rotated = p => LAY === 'face' && p === 1;
function toLocal(p, sx, sy) { const r = halfRect(p); return rotated(p) ? { x: r.x + r.w - sx, y: r.y + r.h - sy } : { x: sx - r.x, y: sy - r.y }; }
function toScreen(p, lx, ly) { const r = halfRect(p); return rotated(p) ? { x: r.x + r.w - lx, y: r.y + r.h - ly } : { x: r.x + lx, y: r.y + ly }; }
const halfAt = (sx, sy) => LAY === 'face' ? (sy >= H / 2 ? 0 : 1) : (sx < W / 2 ? 0 : 1);
const AR = () => ({ x: 0, y: HUD, w: HW, h: HH - HUD });
cv.onfit = () => { layoutHalves(); bgKey[0] = bgKey[1] = ''; if (R && R.C.relayout) R.C.relayout(); for (const p of [0, 1]) if (BOT[p]) { BOT[p].f.x = clamp(BOT[p].f.x, 0, HW); BOT[p].f.tx = clamp(BOT[p].f.tx, 0, HW); } };
function fitSize(sw, sh) {
  const ls = sw > sh;
  if (LAY === 'face') { if (!ls) { W = 600; H = Math.round(clamp(600 * sh / sw, 760, 1240)); } else { H = 660; W = Math.round(clamp(660 * sw / sh, 720, 1320)); } }
  else if (ls) { H = 430; W = Math.round(clamp(430 * sw / sh, 600, 1400)); } else { W = 620; H = Math.round(clamp(620 * sh / sw, 700, 1300)); }
  layoutHalves(); return [W, H];
}
let refit = () => {};

// ---------- helpers ----------
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
function rr(g, x0, y0, w, h, r) { g.beginPath(); g.roundRect(x0, y0, w, h, r); }
function dot(g, cx, cy, r) { g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill(); }
function txt(s, px, py, size, col = '#fff', align = 'center', weight = 900, stroke = null, sw = 5, g = x) {
  g.font = `${weight} ${size}px ${FONT}`; g.textAlign = align; g.textBaseline = 'middle';
  if (stroke) { g.lineJoin = 'round'; g.lineWidth = sw; g.strokeStyle = stroke; g.strokeText(s, px, py); }
  g.fillStyle = col; g.fillText(s, px, py);
}
function emo(s, px, py, size, g = x) { g.font = `${size}px ${EMOJI}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000'; g.fillText(s, px, py); }
function star5(g, cx, cy, R0, r0, rot = 0) { g.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, q = i % 2 ? r0 : R0; g.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } g.closePath(); }
// particles in a player's own (local) coordinates, so confetti falls "down" for both players
function mkFx() {
  let ps = [];
  return {
    burst(px, py, o = {}) {
      if (SIM.on) return;
      const n = o.n ?? 10, cols = o.colors ?? ['#fff'];
      for (let i = 0; i < n; i++) {
        const a = MG.rand(0, Math.PI * 2), sp = MG.rand(0.4, 1) * (o.speed ?? 160);
        ps.push({ x: px, y: py, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up ?? 60), g: o.grav ?? 500, life: MG.rand(0.6, 1) * (o.life ?? 0.7), max: o.life ?? 0.7, s: MG.rand(0.6, 1) * (o.size ?? 4), col: MG.pick(cols), shape: o.shape ?? 'dot', rot: MG.rand(0, 6), vr: MG.rand(-8, 8) });
      }
      if (ps.length > 260) ps.splice(0, ps.length - 260);
    },
    step(dt) { for (const p of ps) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= Math.pow(0.4, dt); p.rot += p.vr * dt; p.life -= dt; } ps = ps.filter(p => p.life > 0); },
    draw(g) {
      for (const p of ps) {
        g.globalAlpha = clamp(p.life / p.max * 1.6, 0, 1); g.fillStyle = p.col;
        if (p.shape === 'star') { star5(g, p.x, p.y, p.s, p.s * 0.45, p.rot); g.fill(); }
        else if (p.shape === 'sq') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6); g.restore(); }
        else dot(g, p.x, p.y, p.s);
      }
      g.globalAlpha = 1;
    },
    clear() { ps = []; }, get n() { return ps.length; },
  };
}
const CONF = ['#ff8fbf', '#ffd23f', '#4cc96a', '#4c9cf0', '#a07cf2', '#ff7a1c', '#fff'];

// ---------- sounds: synthesized; each player has their own pitch so you can hear who scored ----------
let AC = null, noiseB = null;
function au() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
addEventListener('pointerdown', au); addEventListener('keydown', au);
const quiet = () => SIM.on || !AC || MG.store.get('muted', false);
function bl(f, dur = 0.3, vol = 0.08, delay = 0, type = 'sine') {
  const t0 = AC.currentTime + delay;
  for (const [mul, v] of type === 'sine' ? [[1, 1], [2, 0.3], [3.01, 0.1]] : [[1, 1]]) {
    const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f * mul, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol * v, t0 + 0.008); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
}
function sweep(f0, f1, dur, vol = 0.1, type = 'sine', delay = 0) {
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur); o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function hiss(dur, f0, f1, vol = 0.06, delay = 0) {
  if (!noiseB) { noiseB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = noiseB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseB; bp.type = 'bandpass'; bp.Q.value = 1.1; bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * 0.2); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
  s.connect(bp).connect(g).connect(AC.destination); s.start(t0); s.stop(t0 + dur + 0.02);
}
const PITCH = [1, 1.335], SNDT = {};
// ps(player, kind, n): player sounds — P1 lower, P2 a fourth higher
function ps(p, kind, n = 0) {
  if (quiet()) return;
  const key = p + kind, now = performance.now(); if (now - (SNDT[key] || 0) < 60) return; SNDT[key] = now;
  const k = PITCH[p] || 1;
  switch (kind) {
    case 'score': [0, 4, 7].forEach((st, i) => bl(660 * k * Math.pow(2, st / 12), 0.3, 0.075, i * 0.045)); break;
    case 'gold': [0, 4, 7, 12].forEach((st, i) => bl(784 * k * Math.pow(2, st / 12), 0.35, 0.07, i * 0.05)); for (let i = 0; i < 5; i++) bl(1800 + Math.random() * 1500, 0.16, 0.022, 0.15 + i * 0.035); break;
    case 'bonk': sweep(190 * k, 70, 0.12, 0.13, 'square'); bl(880 * k, 0.2, 0.06, 0.03); break;
    case 'whiff': hiss(0.12, 900, 2400, 0.03); break;
    case 'pop': sweep(380 * k, 1300 * k, 0.08, 0.12); bl(1046 * k, 0.18, 0.05, 0.05); break;
    case 'oops': sweep(420 * k, 260 * k, 0.22, 0.08); break;
    case 'catch': bl(523 * k, 0.16, 0.08); bl(784 * k, 0.24, 0.07, 0.06); break;
    case 'tap': bl(990 * k, 0.1, 0.07); break;
    case 'puff': sweep((260 + n * 26) * k, (340 + n * 30) * k, 0.09, 0.07, 'triangle'); hiss(0.08, 600, 1500, 0.025); break;
    case 'boom': hiss(0.3, 3000, 400, 0.14); [0, 4, 7, 12].forEach((st, i) => bl(523 * k * Math.pow(2, st / 12), 0.4, 0.07, 0.05 + i * 0.05)); break;
    case 'ready': bl(740 * k, 0.12, 0.06); break;
    case 'win': [0, 4, 7, 4, 7, 12].forEach((st, i) => bl(523 * k * Math.pow(2, st / 12), 0.28, 0.08, i * 0.1)); hiss(0.35, 2000, 6000, 0.03, 0.5); break;
    case 'cheer': [0, 4, 7].forEach((st, i) => bl(440 * k * Math.pow(2, st / 12), 0.35, 0.06, i * 0.09)); break;
    case 'drum': sweep((n ? 230 : 150) * k, n ? 90 : 55, 0.2, 0.24, 'sine'); hiss(0.06, n ? 2600 : 1600, 700, 0.06); break;
    case 'splash': hiss(0.32, 1400, 300, 0.1); bl(1318 * k, 0.12, 0.04, 0.02); break;
    case 'thud': sweep(240 * k, 90, 0.12, 0.13, 'triangle'); bl(660 * k, 0.14, 0.04, 0.03); break;
    case 'hop': sweep(300 * k, 760 * k, 0.13, 0.1, 'triangle'); hiss(0.1, 1500, 600, 0.03, 0.1); break;
    case 'chomp': sweep(320, 110, 0.1, 0.13, 'square'); sweep(300, 100, 0.1, 0.11, 'square', 0.12); break;
    case 'note': { const nk = 'n' + n; if (now - (SNDT[nk] || 0) < 60) break; SNDT[nk] = now; bl(SIMP[n].f, 0.42, 0.1); bl(SIMP[n].f * 2, 0.25, 0.03, 0.01); break; }
  }
}
function gs(kind) {   // shared (both players) sounds
  if (quiet()) return;
  if (kind === 'tick') bl(880, 0.08, 0.07, 0, 'triangle');
  else if (kind === 'go') { bl(1046, 0.25, 0.09); bl(1318, 0.3, 0.08, 0.06); hiss(0.25, 400, 3000, 0.05); }
  else if (kind === 'flash') { sweep(500, 1400, 0.12, 0.1, 'square'); bl(1568, 0.3, 0.07, 0.04); }
  else if (kind === 'whoosh') hiss(0.25, 400, 3000, 0.06);
  else if (kind === 'yay') { [523, 659, 784, 1046, 1319].forEach((f, i) => bl(f, 0.5, 0.08, i * 0.07)); hiss(0.4, 2000, 6000, 0.03, 0.3); }
}

// ---------- state ----------
let state = 'menu', mode = 'race', lvl = 7, who = 'p2', BIG = [false, false], BOT = [null, null];
let match = null, R = null, phT = 0, t = 0, frameN = 0, frameNow = performance.now(), lastHud = '';
const FL = [[], []], PX = [mkFx(), mkFx()], MOOD = [{ m: 'happy', t: 0 }, { m: 'happy', t: 0 }], READY = [false, false], RIP = [[], []];
const ST = Object.assign({ rounds: 0, g: 0, p: 0, d: 0, cpu: { easy: [0, 0, 0], normal: [0, 0, 0], hard: [0, 0, 0] } }, MG.store.get('duel.stats', {}));
const prog = () => mode === 'race' ? clamp(R.t / (R.dur || 30), 0, 1) : Math.min(0.35, R.t / (120 * [1, 1.6, 2.4][LEN]));
const names = () => BOT[1] && !BOT[0] ? ['你', '電腦噗噗'] : [COL[0].nm, COL[1].nm];
function float(p, fx, fy, text, col = '#fff6b0', size = 26, sub = null) { if (SIM.on) return; FL[p].push({ x: fx, y: fy, text, col, size, life: 1.1, sub }); if (FL[p].length > 12) FL[p].shift(); }
function mood(p, m, d = 0.7) { MOOD[p].m = m; MOOD[p].t = d; }
function addScore(p, pts, x0, y0, text, gold = false) {
  R.S[p].score += pts;
  if (SIM.on) return;
  float(p, x0, y0, text, gold ? '#ffe14a' : '#fff6b0', 26, text.startsWith('+') ? null : `+${pts} ⭐`);
  ps(p, gold ? 'gold' : 'score'); mood(p, 'wow', 0.5);
  PX[p].burst(x0, y0 + 24, { n: gold ? 18 : 10, colors: gold ? ['#ffd23f', '#fff3a0', '#ffb300', '#fff'] : [COL[p].main, '#ffe14a', '#fff'], shape: 'star', speed: 190, up: 90, size: 6, life: 0.7 });
}
function oops(p, x0, y0, text = 'Oops! 🙈') { if (SIM.on) return; float(p, x0, y0, text, '#ffd0dc', 24); ps(p, 'oops'); mood(p, 'ouch', 0.6); }
// a CPU (or test bot) "ghost finger" that really moves to the target before it taps
// each round a bot has a slightly better or worse "day" (form), so results are not always the same
function withForm(lv) {
  const k = MG.rand(0.78, 1.22), sc = a => [a[0] / k, a[1] / k];
  return { ...lv, speed: lv.speed * k, rate: lv.rate * k, react: sc(lv.react), qd: sc(lv.qd), find: sc(lv.find), miss: clamp(lv.miss / k, 0, 0.6), form: k };
}
function mkBot(lv0) { const lv = withForm(lv0); return { lv, base: lv0, f: { x: HW / 2, y: HH + 60, tx: HW / 2, ty: HH - 70, act: null, press: 0, vis: 0, drag: false }, cool: 0.4, tgt: null, off: 0, qid: -1 }; }
function aim(b, tx, ty, act) { b.f.tx = clamp(tx, 6, HW - 6); b.f.ty = clamp(ty, HUD + 4, HH - 4); b.f.act = act; }
function botStep(p, dt) {
  const b = BOT[p], f = b.f, dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy), sp = b.lv.speed * dt;
  if (d > sp) { f.x += dx / d * sp; f.y += dy / d * sp; }
  else { f.x = f.tx; f.y = f.ty; if (f.act && state === 'play') { const a = f.act; f.act = null; f.press = 0.14; if (!SIM.on) RIP[p].push({ x: f.x, y: f.y, life: 0.35 }); a(f.x, f.y); } }
  f.press = Math.max(0, f.press - dt); f.vis = Math.min(1, f.vis + dt * 3);
  if (state === 'play') R.C.ai(p, b, dt);
}

// =====================================================================
// the six contests. Everything happens in each player's own local coordinates
// (0..HW × 0..HH, HUD band at the top = toward the middle of the table).
// One shared seeded schedule feeds BOTH halves the same things at the same moment.
// =====================================================================
const CON = {};
const FRUITS = ['🍎', '🍌', '🍇', '🍓', '🍊', '🍉', '🍑', '🍒'];

// ---- 1. 打地鼠 ----
CON.mole = {
  icon: '🐹', nm: '打地鼠', cue: 'Bonk the moles! 🔨', dur: [30, 50, 75], goal: [12, 20, 30],
  geo() {
    const A = AR(), a = A.w / A.h;
    const [c, r] = a >= 2.1 ? [4, 2] : a >= 1.15 ? [3, 2] : a >= 0.62 ? [2, 3] : [2, 4];
    const cw = A.w / c, ch = A.h / r, s = Math.min(cw * 0.3, ch * 0.33, 66) / 40;
    const holes = [];
    for (let j = 0; j < r; j++) for (let i = 0; i < c; i++) holes.push({ x: A.x + cw * (i + 0.5), y: A.y + ch * (j + 0.5) + 34 * s });
    return { holes, s, n: holes.length, key: `${c}x${r}:${A.w}x${A.h}` };
  },
  setup() { R.g = this.geo(); R.busy = new Array(8).fill(0); R.next = 0.6; for (const p of [0, 1]) { R.S[p].h = new Array(8).fill(null); R.S[p].hits = []; } },
  relayout() { R.g = this.geo(); },
  gen() {
    while (R.t >= R.next) {
      const n = R.g.n, free = [];
      for (let i = 0; i < n; i++) if (R.busy[i] <= R.next) free.push(i);
      if (free.length) {
        const i = free[(R.rnd() * free.length) | 0], q = R.rnd();
        const kind = q < 0.09 ? 'gold' : q < 0.22 ? 'bunny' : 'mole';
        const stay = kind === 'bunny' ? 2.0 : (mode === 'slow' ? 1.75 : 1.25 - prog() * 0.4) * (kind === 'gold' ? 0.75 : 1);
        R.busy[i] = R.next + stay + 0.45; const id = ++R.seq;
        for (const p of [0, 1]) { R.S[p].h[i] = { id, kind, st: 'rise', up: 0, stay: stay * (BIG[p] ? 1.4 : 1), t: 0, hitT: 0 }; R.log.push({ p, id, t: +R.t.toFixed(4), i, kind }); }
      }
      R.next += (mode === 'slow' ? 1.15 : 0.85 - prog() * 0.32) * (0.75 + R.rnd() * 0.5);
    }
  },
  update(dt) {
    for (const p of [0, 1]) {
      const S = R.S[p];
      for (let i = 0; i < 8; i++) {
        const m = S.h[i]; if (!m) continue; m.t += dt;

// the biggest square cells for n items inside rect r (last row centred)
function fitGrid(r, n, max = 1e9) {

}

  else if (kind === 'heart') { g.moveTo(cx, cy + r * 0.95); g.bezierCurveTo(cx - r * 1.5, cy - r * 0.05, cx - r * 0.65, cy - r * 1.2, cx, cy - r * 0.42); g.bezierCurveTo(cx + r * 0.65, cy - r * 1.2, cx + r * 1.5, cy - r * 0.05, cx, cy + r * 0.95); g.closePath(); }
  else if (kind === 'square') g.roundRect(cx - r * 0.85, cy - r * 0.85, r * 1.7, r * 1.7, r * 0.25);
  else { g.moveTo(cx, cy - r); g.lineTo(cx + r * 0.98, cy + r * 0.72); g.lineTo(cx - r * 0.98, cy + r * 0.72); g.closePath(); }
}

// ---- 15. 釣魚 ----
const FISHE = ['🐟', '🐠', '🐡'];
CON.fish = {
  icon: '🎣', nm: '釣魚', cue: 'Wait for the splash… tap! 🎣', dur: [30, 50, 75], goal: [10, 16, 24],
  geo() {
    const A = AR(), dock = clamp(A.h * 0.2, 46, 92), pt = A.y + 22, ph = HH - dock - pt;
    const s = clamp(Math.min(A.w * 0.055, ph * 0.12), 15, 28), gap = Math.min(A.w * 0.32, 230);
    const bob = [0, 1, 2].map(i => ({ x: HW / 2 + (i - 1) * gap, y: pt + ph * (i === 1 ? 0.34 : 0.56) }));
    return { A, dock, pt, ph, s, gap, bob, key: `${HW}x${HH}` };
  },
  setup() { R.g = this.geo(); R.busy = [0, 0, 0]; R.next = 0.9; for (const p of [0, 1]) Object.assign(R.S[p], { ev: [null, null, null], fly: [], spl: [], caught: 0 }); },
  relayout() { R.g = this.geo(); },
  gen() {
    while (R.t >= R.next) {
      const free = [0, 1, 2].filter(i => R.busy[i] <= R.next);
      if (free.length) {
        const i = free[(R.rnd() * free.length) | 0], nib = (R.rnd() * 3) | 0, gold = R.rnd() < 0.1, k = (R.rnd() * 3) | 0, id = ++R.seq, t0 = R.next;
        const w = mode === 'slow' ? 1.9 : 1.4 - prog() * 0.35, nibEnd = t0 + 0.5 + nib * 0.65;
        R.busy[i] = nibEnd + w * 1.4 + 0.9;
        for (const p of [0, 1]) { R.S[p].ev[i] = { id, t0, nibEnd, biteEnd: nibEnd + w * (BIG[p] ? 1.45 : 1), gold, k, st: null, ct: 0, bit: false }; R.log.push({ p, id, t: +t0.toFixed(4), i, nib, gold }); }
      }
      R.next += (mode === 'slow' ? 1.5 : 1.05 - prog() * 0.3) * (0.75 + R.rnd() * 0.5);
    }
  },
  phase(e) { if (!e) return 'idle'; if (e.st) return e.st; return R.t < e.t0 + 0.5 ? 'come' : R.t < e.nibEnd ? 'nib' : R.t < e.biteEnd ? 'bite' : 'gone'; },
  update(dt) {
    for (const p of [0, 1]) {
      const S = R.S[p];
      for (let i = 0; i < 3; i++) {
        const e = S.ev[i]; if (!e) continue;
        if (e.st) { e.ct += dt; if (e.ct > 0.9) S.ev[i] = null; continue; }
        if (!e.bit && R.t >= e.nibEnd) { e.bit = true; ps(p, 'splash'); }
        if (R.t >= e.biteEnd) { e.st = 'gone'; e.ct = 0; }
      }

  tap(p, lx, ly) {

    if (bi < 0 || bd > rad) { ps(p, 'whiff'); return; }
    const b = G.bob[bi], e = S.ev[bi], ph = this.phase(e);
    if (!SIM.on) S.spl.push({ x: b.x, y: b.y, t: 0 });
    if (ph === 'bite') {
      e.st = 'caught'; e.ct = 0; S.caught++; if (!SIM.on) S.fly.push({ i: bi, t: 0, gold: e.gold, k: e.k });
      addScore(p, e.gold ? 2 : 1, b.x, b.y - G.s * 2.6, e.gold ? 'Gold fish! 🌟' : MG.pick(['Got one! 🐟', 'Yay! 🎣', 'Nice! 👍']), e.gold); ps(p, 'catch');
    } else if (ph === 'nib' || ph === 'come') { e.st = 'fled'; e.ct = 0; oops(p, b.x, b.y - G.s * 2.6, 'Too soon! 🙈'); }

  },

    let sd = 61 + p; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.lineCap = 'round';
