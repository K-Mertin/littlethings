<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<link rel="stylesheet" href="mini.css">
<style>

</head>
<body>
<main class="mg-stage" id="stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'runner', title: '噗噗跑跑跑', stats: ['level', 'info'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), stageEl = document.getElementById('stage');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

// =====================================================================
// physics constants (world units: 1 tile U = 40, ground surface at y = 0, up is negative)
// fixed 120 Hz steps → the same inputs always give exactly the same run, whatever the frame rate
// =====================================================================
const U = 40, STEP = 1 / 120, G = 2900, GH = 1300, V0 = 620, V2 = 560, HOLD = 0.24, VSPR = 1080, COY = 0.1, BUF = 0.12, MAXV = 1500;
const BODY = 19, HIT_R = 13, GET_R = 26, INV = 1.2, REF = 240;
const LEVELS = 12, ENDLESS = 13;
const TAP = 5, MID = 15, HI = 29;                 // jump hold lengths in steps (used for the star arcs and the bot)

const THEMES = [
  { id: 'meadow', nm: '草原', ic: '🌼', sky: ['#78c6ff', '#dff4ff'], grass: '#74cf55', grassD: '#3d9a35', dirt: '#c98b4f', dirtD: '#9a602e', ink: '#2f6b2a', far: ['#a9e08f', '#8dcf72'], card: '#5cb85a' },
  { id: 'beach', nm: '海邊', ic: '🏖️', sky: ['#62c4ff', '#fff3d6'], grass: '#ffe7a8', grassD: '#dcae5c', dirt: '#f0c777', dirtD: '#cf9d55', ink: '#1d5b8a', far: ['#46b8e8', '#2a93cf'], card: '#4aa8d8' },
  { id: 'candy', nm: '糖果森林', ic: '🍭', sky: ['#ffb3d9', '#fff2f8'], grass: '#fff7fb', grassD: '#ff8fbf', dirt: '#a8653f', dirtD: '#7a4226', ink: '#a8366e', far: ['#f7b7e0', '#d9a0f0'], card: '#ff8fc0' },
  { id: 'night', nm: '夜晚星空', ic: '🌙', sky: ['#0f1440', '#3d3b8f'], grass: '#4f92b4', grassD: '#2b5878', dirt: '#2a2f60', dirtD: '#1a1d47', ink: '#3a3488', far: ['#2b3170', '#222759'], card: '#8f84ff' },
];
const themeOfLevel = n => Math.min(3, Math.floor((n - 1) / 3));
const spdFor = (lvl, mode) => (mode === 'slow' ? 0.74 : 1) * (225 + 4 * (lvl - 1));

// =====================================================================
// the 12 levels — one token per piece, numbers are empty ground (in tiles)
//   r rock · R big rock · rr two rocks · p puddle · pp wide puddle · c rolling pinecone · cc two of them
//   b bird (run under!) · bb two birds · rb rock then bird · g1 g2 g3 gaps · s spring mushroom · sP spring up to a high platform
//   P:h:w floating platform · st stairs · cl cloud bridge over a big gap · f fruit · F high fruit (double jump) · dj double-jump stars
//   *n a line of n stars · K checkpoint flag
// =====================================================================
const LV_SRC = [
  '10 *4 4 r 4 *3 4 r 5 f 4 *5 4 p 5 r 4 *4 4 p 4 K 4 r 4 f 4 *4 4 r 4 p 5 *5 4 r 4 f 4 p 4 K 4 *4 4 r 4 r 4 f 4 p 4 *4 4 r 5 *6',
  '8 *4 4 r 4 g1 4 *4 4 p 4 g1 5 f 4 R 4 *4 4 P:2:4 4 K 4 r 3 g2 4 *4 4 p 3 r 4 P:2:5 4 g1 3 f 4 K 4 R 3 g2 4 *4 4 p 3 r 3 g1 4 P:2:4 4 r 3 p 4 f 3 r 3 *4 3 4 *6',
  '8 *4 4 c 4 r 4 b 4 s 4 *4 3 g2 4 K 4 c 3 p 3 b 4 rr 4 P:2:4 3 s 4 K 4 c 3 g2 3 b 3 R 3 c 4 st 4 f 3 K 4 r 3 b 4 s 4 c 3 p 4 g2 4 *4 3 rr 4 f 3 4 *6',
  '8 *4 3 p 3 r 3 g2 4 c 3 b 3 s 4 K 3 pp 3 rr 4 cl 4 f 3 *4 3 K 3 c 3 cc 4 g3 3 b 4 R 4 st 4 K 3 p 3 r 3 s 4 3 c 3 b 3 g2 3 f 3 pp 3 s 3 r 3 *4 3 4 *6',
  '8 *4 3 rr 3 b 3 g2 3 c 3 P:2.5:4 3 pp 4 K 3 s 3 g3 3 cc 3 f 3 rb 4 K 3 cl 3 R 3 b 3 dj 4 K 3 p 3 g2 3 c 3 st 4 K 3 c 3 rr 3 b 3 s 3 g3 3 pp 3 f 3 R 3 4 *6',
  '8 *4 3 c 3 g2 3 R 3 b 3 sP 3 K 3 rr 3 cc 3 g3 3 rb 3 dj 3 K 3 pp 3 cl 3 c 3 b 3 s 3 K 3 R 3 g3 3 st 3 F 4 K 3 cc 3 g2 3 b 3 rr 3 s 3 pp 3 rb 3 f 3 4 *6',
  '8 *4 3 r 3 c 3 pp 3 g2 3 b 3 s 3 K 3 st 3 rr 3 cc 3 rb 3 K 3 dj 3 g3 3 P:2:4 3 R 3 c 3 K 3 cl 3 b 3 sP 3 K 3 r 3 g3 3 bb 3 s 3 pp 3 c 3 rr 3 dj 3 f 3 R 3 4 *6',
  '7 *4 3 cc 3 g2 3 rb 3 s 3 pp 3 K 3 R 2.5 g3 3 b 2.5 c 3 dj 3 K 3 st 3 rr 3 cl 3 K 3 bb 3 sP 3 g2 2.5 r 2.5 F 4 K 3 c 3 rr 3 b 3 g3 3 s 3 pp 3 cc 3 R 3 f 3 *4 3 4 *6',
  '7 *4 3 rr 2.5 c 2.5 g3 3 b 2.5 R 3 s 3 K 3 cc 2.5 rb 2.5 pp 3 dj 3 K 3 cl 2.5 g2 2.5 c 3 sP 3 K 3 st 2.5 bb 2.5 rr 3 F 4 K 3 c 3 g3 3 rb 3 s 3 R 3 cc 3 pp 3 g2 3 dj 3 *4 3 4 *6',
  '7 *4 3 c 2.5 rr 2.5 b 2.5 g3 3 s 2.5 K 3 cc 2.5 R 2.5 rb 2.5 cl 3 K 3 dj 2.5 pp 2.5 g3 2.5 bb 3 K 3 sP 2.5 c 2.5 st 2.5 F 4 K 3 rr 2.5 c 2.5 b 2.5 s 3 g3 2.5 cc 2.5 R 2.5 pp 2.5 rb 2.5 cl 3 f 3 4 *6',
  '7 *4 2.5 rb 2.5 g3 2.5 cc 2.5 s 2.5 R 2.5 K 3 bb 2.5 rr 2.5 cl 2.5 c 3 K 2.5 dj 2.5 g3 2.5 pp 2.5 rb 2.5 K 3 sP 2.5 cc 2.5 st 2.5 g2 2.5 F 4 K 3 cc 2.5 b 2.5 g3 2.5 R 2.5 s 2.5 rr 2.5 rb 2.5 pp 2.5 c 2.5 dj 3 4 *6',
  '7 *4 2.5 cc 2 rr 2 g3 2.5 bb 2.5 rb 2.5 K 2.5 s 2 R 2 c 2 cl 2.5 dj 2.5 K 2.5 g3 2 rr 2 bb 2.5 sP 2.5 K 2.5 rb 2 cc 2 st 2 g3 2.5 F 2.5 rr 4 K 2.5 bb 2 rr 2 s 2 g3 2 cc 2 R 2 rb 2 pp 2 c 2 cl 2.5 dj 2.5 4 *6',
];
// endless mode: pieces unlock as you run further (second value = difficulty 0..1 needed)
const POOL = [['r', 0], ['p', 0], ['f', 0], ['*4', 0], ['r', 0], ['c', 0.08], ['g1', 0.1], ['R', 0.2], ['pp', 0.22], ['b', 0.25], ['s', 0.18], ['P:2:4', 0.3],
  ['g2', 0.3], ['cc', 0.45], ['rr', 0.45], ['rb', 0.55], ['cl', 0.5], ['dj', 0.45], ['st', 0.4], ['g3', 0.55], ['sP', 0.6], ['bb', 0.65], ['F', 0.7]];
const REGION = 300 * U;                                    // endless: the scenery changes every 300 m
const themeAtX = xw => Math.floor(Math.max(0, xw) / REGION) % 4;
const endlessSpd = (xw, slow) => (slow ? 0.74 : 1) * (215 + 55 * Math.min(1, Math.max(0, xw) / (1600 * U)));

// =====================================================================
// core simulation (pure: state S + level LV; ev = optional event callback)
// =====================================================================
const coneX = (o, px) => o.x - 0.5 * Math.max(0, px - (o.x - 520));
const birdX = (o, px) => o.x - 0.3 * Math.max(0, px - (o.x - 600));
const birdY = (o, px) => o.y + Math.sin((px - o.x) * 0.025) * 7;
const CONE_MEET = 520 * 0.5 / 1.5, BIRD_MEET = 600 * 0.3 / 1.3;
function newState(LV, spd, slow) {
  return { n: 0, x: LV.start, px: LV.start, y: 0, py: 0, vy: 0, gnd: true, coy: 0, buf: 0, held: false, holdT: HOLD, jumps: 0, inv: 0, hearts: 3,
    streak: 0, got: 0, hits: 0, falls: 0, os: new Uint8Array(LV.ring), lo: 0, gi: 0, pitG: -1, done: false, dead: false, spd, slow: !!slow, flipT: 0, rel: -1, acts: null };
}
function cloneS(S) { const c = Object.assign({}, S); c.os = S.os.slice(); return c; }
function press(S) { S.buf = BUF; S.held = true; }
function release(S) { S.held = false; }
function circRect(cx, cy, r, x0, y0, x1, y1) { const nx = cx < x0 ? x0 : cx > x1 ? x1 : cx, ny = cy < y0 ? y0 : cy > y1 ? y1 : cy, dx = cx - nx, dy = cy - ny; return dx * dx + dy * dy < r * r; }
function hazHit(o, S, px, bx, by) {
  switch (o.ty) {
    case 'rock': return circRect(bx, by, HIT_R, o.x - o.w / 2 + 6, -o.h + 6, o.x + o.w / 2 - 6, 0);
    case 'puddle': return S.y > -5 && Math.abs(px - o.x) < o.w / 2 - 8;
    case 'cone': { const dx = coneX(o, px) - bx, dy = -15 - by; return dx * dx + dy * dy < (HIT_R + 10) * (HIT_R + 10); }
    case 'bird': { const dx = birdX(o, px) - bx, dy = birdY(o, px) - by; return dx * dx + dy * dy < (HIT_R + 11) * (HIT_R + 11); }
  }
  return false;
}
function hazRight(o, px) { return o.ty === 'cone' ? coneX(o, px) + 12 : o.ty === 'bird' ? birdX(o, px) + 14 : o.x + o.w / 2; }
function inGap(LV, S, px) { const g = LV.gaps[S.gi]; return !!g && px > g[0] + 8 && px < g[1] - 8; }
function hurt(S, ev, o) {
  S.hits++; S.streak = 0; S.inv = INV;
  if (!S.slow) S.hearts--;
  if (S.hearts <= 0) { S.dead = true; ev && ev('dead'); }
}
function step(S, LV, ev) {
  S.px = S.x; S.py = S.y; S.n++;
  if (LV.endless) S.spd = endlessSpd(S.x, S.slow);
  S.x += S.spd * STEP;
  const px = S.x;
  if (S.inv > 0) S.inv -= STEP;
  if (S.flipT > 0) S.flipT -= STEP;
  if (S.buf > 0) {
    if (S.gnd || S.coy > 0) { S.vy = -V0; S.gnd = false; S.coy = 0; S.jumps = 1; S.holdT = 0; S.buf = 0; ev && ev('jump'); }
    else if (S.jumps < 2) { S.vy = -V2; S.jumps = 2; S.holdT = 0; S.buf = 0; S.flipT = 0.42; ev && ev('dj'); }
    else S.buf -= STEP;
  }
  let g = G;
  if (!S.gnd && S.vy < 0 && S.held && S.holdT < HOLD) { g = GH; S.holdT += STEP; }
  if (!S.gnd && S.coy > 0) S.coy -= STEP;
  S.vy = Math.min(MAXV, S.vy + g * STEP);
  const ny = S.y + S.vy * STEP, objs = LV.objs, gs = LV.gaps;
  while (S.lo < objs.length && objs[S.lo].k1 < px - 40) S.lo++;
  while (S.gi < gs.length && gs[S.gi][1] - 8 <= px) { if (S.pitG !== S.gi) ev && ev('gap', gs[S.gi]); S.gi++; }
  const solid = !inGap(LV, S, px);
  let sup = null;
  if (S.vy >= 0) {
    if (solid && S.y <= 0.01 && ny >= 0) sup = 0;
    for (let i = S.lo; i < objs.length; i++) {
      const o = objs[i]; if (o.k0 > px + 40) break;
      if (o.ty === 'plat' && px > o.x - 8 && px < o.x + o.w + 8 && S.y <= o.y + 0.01 && ny >= o.y && (sup === null || o.y < sup)) sup = o.y;
    }
  }
  if (sup !== null) { const imp = S.vy; S.y = sup; S.vy = 0; if (!S.gnd) { S.gnd = true; S.jumps = 0; S.coy = 0; ev && ev('land', imp); } }
  else { if (S.gnd) { S.gnd = false; S.coy = COY; } S.y = ny; }
  // fell into a hole: a bubble pops 噗噗 back up (costs a heart in 挑戰)
  if (S.y > 26 || (S.y > 3 && solid)) {
    S.vy = -1000; S.y = Math.min(S.y, 26); S.jumps = 1; S.holdT = HOLD; S.gnd = false; S.coy = 0; S.pitG = S.gi; S.falls++;
    ev && ev('pit');
    if (S.inv <= 0) { hurt(S, ev); if (S.dead) return; }
  }
  const bx = px, by = S.y - BODY;
  for (let i = S.lo; i < objs.length; i++) {
    const o = objs[i]; if (o.k0 > px + 40) break;
    const st = S.os[o.slot];
    switch (o.ty) {
      case 'star': case 'fruit':
        if (!st) { const dx = o.x - bx, dy = o.y - by; if (dx * dx + dy * dy < GET_R * GET_R) { S.os[o.slot] = 1; S.got += o.val; S.streak++; ev && ev(o.ty, o); } }
        break;
      case 'spring':
        if (S.vy >= 0 && S.y > -16 && S.y <= 3 && Math.abs(px - o.x) < 20) { S.vy = -VSPR; S.y = Math.min(S.y, 0); S.gnd = false; S.jumps = 1; S.holdT = HOLD; S.coy = 0; ev && ev('spring', o); }
        break;
      case 'check':
        if (!st && px >= o.x) { S.os[o.slot] = 1; ev && ev('cp', o); }
        break;
      case 'plat': case 'deco': break;
      default:
        if (st) break;
        if (S.inv <= 0 && hazHit(o, S, px, bx, by)) { S.os[o.slot] = 1; ev && ev('hit', o); hurt(S, ev, o); if (S.dead) return; }
        else if (px > hazRight(o, px) + 14) { S.os[o.slot] = 2; ev && ev('pass', o); }
    }
  }
  if (!S.done && px >= LV.end) { S.done = true; ev && ev('finish'); }
}

// =====================================================================
// level builder (shared by the 12 levels and the endless generator)
// =====================================================================
const TRJ = new Map();
function traj(spd, kind, hold) {     // feet path [x, y] of a jump that starts at x = 0
  const key = kind + ':' + spd.toFixed(2) + ':' + hold;
  if (TRJ.has(key)) return TRJ.get(key);
  const L0 = { objs: [], gaps: [], end: 1e12, ring: 1, start: 0 }, S = newState(L0, spd, true), pts = [];
  let rel = -1, dj = false;
  if (kind === 'spring') { S.vy = -VSPR; S.gnd = false; S.jumps = 1; S.holdT = HOLD; } else { press(S); rel = hold; }
  for (let i = 0; i < 900; i++) {
    if (i === rel) release(S);
    if (kind === 'dj' && !dj && i > 3 && S.vy > -60) { press(S); dj = true; rel = i + HI; }
    step(S, L0, null);
    pts.push([S.x, S.y]);
    if (S.gnd) break;
  }
  TRJ.set(key, pts);
  return pts;
}
function mkBuilder(spd0, opts = {}) {
  const B = { objs: [], gaps: [], c: opts.c || 0, spd: spd0, th: opts.th || 0, slow: !!opts.slow, ids: 0 };
  const add = (ty, xw, yw, extra) => { const o = Object.assign({ ty, x: xw, y: yw, w: 0, h: 0, th: B.th, id: B.ids++, src: B.cur }, extra); B.objs.push(o); return o; };
  const star = (xw, yw) => add('star', xw, yw, { val: 1 });
  const fruit = (xw, yw) => add('fruit', xw, yw, { val: 3 });
  // stars along a jump: cx = where the middle of the jump should be (or tx = take-off x)
  const arc = (pts, n, { cx = null, tx = null, a = 0.14, b = 0.86, fruitMid = false, upTo = 1 } = {}) => {
    const D = pts[pts.length - 1][0], t0 = tx != null ? tx : cx - D / 2, L = pts.length - 1;
    for (let i = 0; i < n; i++) {
      const fr = n === 1 ? (a + b) / 2 : a + (b - a) * i / (n - 1);
      if (fr > upTo) break;
      const p = pts[Math.round(fr * L)];
      if (fruitMid && i === (n - 1) >> 1) fruit(t0 + p[0], p[1] - BODY); else star(t0 + p[0], p[1] - BODY);
    }
    return t0;
  };
  const apex = pts => { let m = 0; for (let i = 1; i < pts.length; i++) if (pts[i][1] < pts[m][1]) m = i; return m; };
  const rock = (xw, big) => add('rock', xw, 0, { w: big ? 56 : 44, h: big ? 52 : 34, big: !!big });
  const puddle = (xw, w) => add('puddle', xw, 0, { w, h: 10 });
  const cone = meet => add('cone', meet + CONE_MEET, 0, { w: 30, h: 30, meet });
  const bird = meet => add('bird', meet + BIRD_MEET, -86, { w: 34, h: 24, meet });
  const plat = (x0, h, w, cloud) => add('plat', x0, -h * U, { w: w * U, h: 18, cloud: !!cloud });
  const gap = (x0, w) => { B.gaps.push([x0, x0 + w]); return x0 + w; };
  B.tok = (tok) => {
    B.cur = tok + '@' + Math.round(B.c / U);
    const f = B.spd / REF, S = B.spd, c = B.c;
    let m;
    if (/^\d+(\.\d+)?$/.test(tok)) { B.c += +tok * U; return; }
    if ((m = /^\*(\d+)$/.exec(tok))) { const n = +m[1]; for (let i = 0; i < n; i++) star(c + (i + 0.5) * U, -BODY); B.c += n * U; return; }
    if ((m = /^P:([\d.]+):([\d.]+)$/.exec(tok))) {
      const h = +m[1], w = +m[2], x0 = c + 1.2 * U * f; plat(x0, h, w);
      for (let i = 0; i < w - 1; i++) star(x0 + (i + 1) * U, -h * U - BODY);
      B.c = x0 + w * U + 1.5 * U * f; return;
    }
    switch (tok) {
      case 'r': { const xr = c + 2.5 * U * f; rock(xr); arc(traj(S, 'j', TAP), 3, { cx: xr }); B.c += 5 * U * f; return; }
      case 'R': { const xr = c + 3 * U * f; rock(xr, true); arc(traj(S, 'j', MID), 4, { cx: xr }); B.c += 6 * U * f; return; }
      case 'rr': { const xa = c + 2.6 * U * f, xb = xa + 1.6 * U * f; rock(xa); rock(xb); arc(traj(S, 'j', HI), 5, { cx: (xa + xb) / 2 }); B.c += 6.6 * U * f; return; }
      case 'p': { const xp = c + 2.5 * U * f; puddle(xp, 64); arc(traj(S, 'j', TAP), 3, { cx: xp }); B.c += 5 * U * f; return; }
      case 'pp': { const xp = c + 3 * U * f; puddle(xp, 116); arc(traj(S, 'j', MID), 4, { cx: xp }); B.c += 6 * U * f; return; }
      case 'c': { const mt = c + 3 * U * f; cone(mt); arc(traj(S, 'j', TAP), 3, { cx: mt }); B.c += 6 * U * f; return; }
      case 'cc': { const ma = c + 3 * U * f, mb = ma + 3.2 * U * f; cone(ma); cone(mb); arc(traj(S, 'j', TAP), 3, { cx: ma }); arc(traj(S, 'j', TAP), 3, { cx: mb }); B.c += 8.4 * U * f; return; }
      case 'b': { const mt = c + 3 * U * f; bird(mt); for (let i = -2; i <= 1; i++) star(mt + (i + 0.5) * U, -BODY); B.c += 6 * U * f; return; }
      case 'bb': { const ma = c + 3 * U * f, mb = ma + 2.6 * U * f; bird(ma); bird(mb); for (let i = -1; i <= 4; i++) star(ma + (i - 0.2) * U * f, -BODY); B.c += 8.6 * U * f; return; }
      case 'rb': { const xr = c + 2.5 * U * f, mt = c + 6.4 * U * f; rock(xr); arc(traj(S, 'j', TAP), 3, { cx: xr }); bird(mt); for (let i = -1; i <= 1; i++) star(mt + i * U * 0.9, -BODY); B.c += 8.6 * U * f; return; }
      case 'g1': case 'g2': case 'g3': {
        const w = { g1: 1.4, g2: 2, g3: 2.8 }[tok] * U * f * (B.slow ? 0.85 : 1), hold = { g1: TAP, g2: MID, g3: HI }[tok], x0 = c + 2 * U * f;
        gap(x0, w); arc(traj(S, 'j', hold), { g1: 3, g2: 4, g3: 5 }[tok], { cx: x0 + w / 2 });
        B.c = x0 + w + 2 * U * f; return;
      }
      case 's': {
        const xs = c + 1.6 * U * f; add('spring', xs, 0, { w: 40, h: 24 });
        const pts = traj(S, 'spring', 0);
        arc(pts, 7, { tx: xs - 20, a: 0.12, b: 0.88, fruitMid: true });
        B.c = xs - 20 + pts[pts.length - 1][0] + 1.6 * U * f; return;
      }
      case 'sP': {
        const xs = c + 1.6 * U * f; add('spring', xs, 0, { w: 40, h: 24 });
        const pts = traj(S, 'spring', 0), tx = xs - 20, top = -4.2 * U, ai = apex(pts);
        let k = ai; while (k < pts.length - 1 && pts[k][1] < top) k++;
        const px0 = tx + pts[k][0] - 30, pw = 5;
        plat(px0, 4.2, pw);
        arc(pts.slice(0, ai + 1), 3, { tx, a: 0.3, b: 0.85 });
        for (let i = 0; i < pw - 1; i++) (i === pw - 2 ? fruit : star)(px0 + (i + 1) * U, top - BODY);

    case 'land': { const imp = o || 0; sqv = Math.min(0.32, 0.08 + imp / 3200); sqT = 0; if (imp > 500) { snd('step'); dustAt(bx, S.y, imp > 900 ? 9 : 5); } break; }
    case 'star': coinSnd(S.streak); MG.fx.burst(o.x, o.y, { n: 8, colors: ['#ffd23f', '#fff3a0', '#fff'], shape: 'star', speed: 110, up: 40, size: 4, life: 0.5, grav: 200 }); pop(o.x, o.y - 10, MG.WORDS.bonus(1), '#fff3a0'); combo(); mood = 'wow'; moodT = 0.35; break;
    case 'fruit': coinSnd(S.streak, true); MG.fx.burst(o.x, o.y, { n: 14, colors: ['#ff5a6e', '#ffd0d8', '#7ad66a', '#fff'], shape: 'dot', speed: 150, up: 60, size: 4, life: 0.7 }); pop(o.x, o.y - 12, 'Yum! 🍓', '#ffd0dc', 1.1); combo(); mood = 'tongue'; moodT = 0.6; break;

    while (iqi < IQ.length && IQ[iqi].t <= S.n * STEP + 1e-9) { IQ[iqi].d ? press(S) : release(S); iqi++; }
    acc -= STEP;
    if (state === 'done') { S.spd *= 0.985; release(S); }
    step(S, LV, state === 'play' ? onEv : (ty, o) => { if (ty === 'land') onEv(ty, o); });
    if (S.dead && state === 'play') { fail(); break; }
    if (state === 'done' && doneT > 0.6 && S.gnd && ((S.n % 70) === 0)) { press(S); S.held = false; }
  }
  if (iqi > 256) { IQ.splice(0, iqi); iqi = 0; }
}

  modes: [{ id: 'slow', label: '🐢 慢慢跑', sub: '跑慢一點，撞到也沒關係' }, { id: 'chal', label: '⭐ 挑戰', sub: '3 顆愛心＋🚩 旗子' }],
  levels: { count: ENDLESS, max: ENDLESS, label: lvLabel },
  keys: '點畫面跳、按久跳更高、空中再點一下二段跳　電腦：<kbd>空白鍵</kbd> 或 <kbd>↑</kbd>',
  playing: () => state === 'play' || state === 'ready',
  onPause: () => { ptrs.clear(); keyHeld = false; if (S) release(S); },
  restore: () => { ptrs.clear(); keyHeld = false; if (S) { IQ.push({ t: S.n * STEP, d: 0 }); } if (state === 'play') { state = 'ready'; readyT = 0.8; } },
  start: (m, lv) => startLevel(lv, m === 'chal' ? 'chal' : 'slow'),
};
function menu() {
  state = 'menu';
  bestStars = loadBest();
  if (!LV) { LV = buildLevel(1, 'slow'); S = newState(LV, LV.spd, true); camX = -plX; }
  MG.choose(MENU);
  hud(true);
}
menu();

// =====================================================================
// bot for the endless test run: replans a couple of seconds ahead every second
// =====================================================================
function botTick() {
  if (S.n < bot.next || S.held) return;
  const r = plan(LV, S, { beam: bot.beam, horizon: Math.round(2.4 / STEP) });
  bot.next = S.n + Math.round(0.8 / STEP);
  if (!r) return;
  IQ = IQ.slice(iqi); iqi = 0;
  let lastRel = 0;
  for (let i = 0; i < r.evs.length; i += 2) { const p = r.evs[i], q = r.evs[i + 1]; if (p.t > (S.n + Math.round(0.8 / STEP)) * STEP) break; IQ.push(p, q); lastRel = q.t; }
  IQ.sort((a, b) => a.t - b.t || a.d - b.d);
  bot.next = Math.max(bot.next, Math.ceil(lastRel / STEP) + 1);
}

// test hook (read-only snapshots + helpers for automated tests)
window.RUN = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; },
  get S() { return S && { x: S.x, y: S.y, vy: S.vy, gnd: S.gnd, hearts: S.hearts, got: S.got, hits: S.hits, falls: S.falls, done: S.done, dead: S.dead, n: S.n, inv: S.inv, streak: S.streak, jumps: S.jumps, spd: S.spd }; },
  get LV() { return LV && { n: LV.n, total: LV.total, end: LV.end, objs: LV.objs.length, gaps: LV.gaps.length, cps: LV.cps.slice(), endless: LV.endless }; },
  get floats() { return floats.map(f => f.text); }, get frames() { return frames; }, get cp() { return !!cpSnap; },
  get sprites() { return sprites.size; }, get bgSets() { return bgSets.size; }, get iq() { return IQ.length; },
  layout: () => ({ W, H, land, k, gyS, AH, padH, plX, pad: A.pad, rest: A.rest }),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  levelInfo(n, m = 'chal') { const L = buildLevel(n, m); return { total: L.total, end: L.end, secs: L.end / L.spd, objs: L.objs.length, gaps: L.gaps.length, spd: L.spd, cps: L.cps.length }; },
  plan(n, m = 'chal', beam = 260) { const L = buildLevel(n, m); return plan(L, newState(L, L.spd, m === 'slow'), { beam }); },
  simulate,
  autoplay(evs) { autoplay = true; IQ = evs.map(e => ({ t: e.t, d: e.d })); iqi = 0; },
  stopAuto() { autoplay = false; bot = null; IQ = []; iqi = 0; if (S) release(S); },
  endlessBot(beam = 60) { autoplay = true; bot = { next: 0, beam }; },
  setSpeed(v) { speedMul = v; },
  start: (n, m) => startLevel(n, m),
  fast(seconds, fps = 60) { const n = Math.round(seconds * fps); for (let i = 0; i < n; i++) { if (state !== 'play' && state !== 'ready' && !(state === 'done' && doneT < 0.3)) break; update(1 / fps); draw(); } return { state, x: S.x, objs: LV.objs.length }; },
  rating,
};

MG.loop(dt => { update(dt); draw(); });
</script>
