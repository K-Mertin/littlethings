const ptrs = new Set(); let keyHeld = false;
const inRect = (p, b) => b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function inputDown() { if (state !== 'play' || autoplay) return; IQ.push({ t: S.n * STEP, d: 1 }); padPress = 0.18; }
function inputUp() { if (!S || autoplay) return; IQ.push({ t: S.n * STEP, d: 0 }); }
function inputSlide() { if (state !== 'play' || autoplay || !LV.hasLow) return; IQ.push({ t: S.n * STEP, d: 2 }); slidePress = 0.2; }
stageEl.addEventListener('pointerdown', e => {
  if (MG.panelOpen()) return;
  e.preventDefault();
  const p = cv.logical(e);
  if (A.rest && state === 'play' && inRect(p, A.rest)) { snd('yay'); endlessPanel(); return; }
  if (A.slide && inRect(p, A.slide)) { inputSlide(); return; }
  ptrs.add(e.pointerId);
  try { stageEl.setPointerCapture(e.pointerId); } catch {}
  inputDown();
});
const ptrEnd = e => { if (ptrs.delete(e.pointerId) && !ptrs.size && !keyHeld) inputUp(); };
stageEl.addEventListener('pointerup', ptrEnd); stageEl.addEventListener('pointercancel', ptrEnd);
stageEl.addEventListener('contextmenu', e => e.preventDefault());
const JUMP_KEYS = new Set([' ', 'Spacebar', 'ArrowUp', 'w', 'W']);
addEventListener('keydown', e => {
  if ((e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') && !MG.panelOpen()) { e.preventDefault(); if (!e.repeat) inputSlide(); return; }
  if (!JUMP_KEYS.has(e.key) || MG.panelOpen()) return;
  e.preventDefault();
  if (e.repeat) return;
  keyHeld = true; inputDown();
});
addEventListener('keyup', e => { if (!JUMP_KEYS.has(e.key)) return; keyHeld = false; if (!ptrs.size) inputUp(); });

// =====================================================================
function advance(dt) {
  acc += dt;
  let guard = 0;
  while (acc >= STEP - 1e-9 && guard++ < 400) {
    if (bot) botTick();
    while (iqi < IQ.length && IQ[iqi].t <= S.n * STEP + 1e-9) { const d = IQ[iqi].d; d === 2 ? slideCmd(S) : d ? press(S) : release(S); iqi++; }
    acc -= STEP;
    if (state === 'done') { S.spd *= 0.985; release(S); }
    step(S, LV, state === 'play' ? onEv : (ty, o) => { if (ty === 'land') onEv(ty, o); });
    if (S.dead && state === 'play') { fail(); break; }
    if (state === 'done' && doneT > 0.6 && S.gnd && ((S.n % 70) === 0)) { press(S); S.held = false; }
  }
  if (iqi > 256) { IQ.splice(0, iqi); iqi = 0; }
}

function botTick() {
  if (S.n < bot.next || S.held) return;
  const r = plan(LV, S, { beam: bot.beam, horizon: Math.round(2.4 / STEP) });
  bot.next = S.n + Math.round(0.8 / STEP);
  if (!r) return;
  IQ = IQ.slice(iqi); iqi = 0;
  let lastRel = 0; const lim = (S.n + Math.round(0.8 / STEP)) * STEP;
  for (let i = 0; i < r.evs.length; i++) {
    const p = r.evs[i]; if (p.t > lim) break;
    if (p.d === 2) { IQ.push(p); continue; }
    if (p.d === 1) { const j = r.evs.findIndex((q, k) => k > i && q.d === 0); IQ.push(p); if (j > 0) { IQ.push(r.evs[j]); lastRel = Math.max(lastRel, r.evs[j].t); } }
  }
  IQ.sort((a, b) => a.t - b.t || a.d - b.d);
  bot.next = Math.max(bot.next, Math.ceil(lastRel / STEP) + 1);
}

  get floats() { return floats.map(f => f.text); }, get frames() { return frames; }, get cp() { return !!cpSnap; },
  get sprites() { return sprites.size; }, get bgSets() { return bgSets.size; }, get iq() { return IQ.length; },
  layout: () => ({ W, H, land, k, gyS, AH, padH, plX, pad: A.pad, rest: A.rest }),
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
  levelInfo(n, m = 'chal') { const L = buildLevel(n, m); return { total: L.total, end: L.end, secs: L.end / L.spd, objs: L.objs.length, gaps: L.gaps.length, spd: L.spd, cps: L.cps.length }; },
  plan(n, m = 'chal', beam = 260) { const L = buildLevel(n, m); return plan(L, newState(L, L.spd, m === 'slow'), { beam }); },
  simulate,
  autoplay(evs) { autoplay = true; IQ = evs.map(e => ({ t: e.t, d: e.d })); iqi = 0; },
  stopAuto() { autoplay = false; bot = null; IQ = []; iqi = 0; if (S) release(S); },
  endlessBot(beam = 60) { autoplay = true; bot = { next: 0, beam }; },
  setSpeed(v) { speedMul = v; },
  start: (n, m) => startLevel(n, m),
  fast(seconds, fps = 60) { const n = Math.round(seconds * fps); for (let i = 0; i < n; i++) { if (state !== 'play' && state !== 'ready' && !(state === 'done' && doneT < 0.3)) break; update(1 / fps); draw(); } return { state, x: S.x, objs: LV.objs.length }; },
  rating,
  news: n => newsOf(n), word: () => LV && LV.word, chase: () => LV && LV.chase && Math.round(chaseD),
  // endless: generate far ahead without playing and count the pieces per scenery (checks every scenery can build its pieces)
  endlessScan(meters = 2600, mode = 'chal') { const L = buildEndless(mode, 7), S0 = newState(L, L.spd, mode === 'slow'), per = {}; endlessGen(L, S0, meters * U); for (const o of L.objs) { const k = o.th + ':' + o.ty; per[k] = (per[k] || 0) + 1; } return per; },
};

MG.loop(dt => { update(dt); draw(); });
</script>
