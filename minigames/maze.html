<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗走迷宮</title>
<link rel="stylesheet" href="mini.css">

<body>
<main class="mg-stage" id="stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'maze', title: '噗噗走迷宮', stats: ['level', 'info'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d'), stageEl = document.getElementById('stage');
const FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

// ---------- themes (rotate by level) ----------
const THEMES = [
  { id: 'garden', nm: '草地花園', ic: '🌷', goal: '小房子', friend: 'pink', floor: '#f4e4b6', floor2: 'rgba(200,160,80,.10)', route: '#ff7a1a', old: 'rgba(140,100,40,.40)', ink: '#2f6b2a', card: '#6cbf55' },
  { id: 'sea', nm: '海底世界', ic: '🐠', goal: '寶箱', friend: 'orange', floor: '#c6ecf4', floor2: 'rgba(60,150,190,.09)', route: '#ff4f9a', old: 'rgba(40,110,150,.38)', ink: '#1d5b8a', card: '#4aa8d8' },
  { id: 'snow', nm: '雪地', ic: '⛄', goal: '雪屋', friend: 'blue', floor: '#f3f9ff', floor2: 'rgba(120,170,220,.10)', route: '#ff5a7a', old: 'rgba(80,130,190,.40)', ink: '#2d5a8c', card: '#8fbbe6' },
  { id: 'candy', nm: '糖果王國', ic: '🍭', goal: '大蛋糕', friend: 'purple', floor: '#fff3df', floor2: 'rgba(230,140,180,.10)', route: '#7a4cff', old: 'rgba(200,100,150,.42)', ink: '#a8366e', card: '#ff9cc2' },
  { id: 'night', nm: '夜空', ic: '🌙', goal: '月亮', friend: 'yellow', floor: '#525dae', floor2: 'rgba(255,255,255,.05)', route: '#ffe14a', old: 'rgba(210,210,255,.42)', ink: '#3a3488', card: '#9d8cff' },
];
// [long side, short side] per level (landscape: long = columns; portrait: long = rows)
const SIZES = [[5, 5], [6, 5], [7, 6], [8, 6], [9, 7], [10, 8], [11, 8], [12, 9], [13, 10], [15, 11], [16, 12], [18, 14]];
const STARS = [1, 1, 2, 2, 2, 3, 3, 3, 4, 4, 5, 5];
const LEVELS = SIZES.length, MIN_CSS = 26, PAD_FROM = 7;
const TH = () => THEMES[(level - 1) % THEMES.length];

// ---------- maze generation: seeded "growing tree" → a perfect maze (one path between any two cells) ----------
// canonical cells: i = v * L + u; u runs along the long side. Openings are bits: 1 = +u, 2 = +v, 4 = −u, 8 = −v
const DU = [1, 0, -1, 0], DV = [0, 1, 0, -1];
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const bits = n => (n & 1) + (n >> 1 & 1) + (n >> 2 & 1) + (n >> 3 & 1);
function genMaze(Lw, Sh, sd, lvl) {
  const n = Lw * Sh, rnd = mulberry(sd), ps = new Uint8Array(n), seen = new Uint8Array(n);
  const nb = (i, k) => { const u = i % Lw + DU[k], v = (i / Lw | 0) + DV[k]; return u < 0 || v < 0 || u >= Lw || v >= Sh ? -1 : v * Lw + u; };
  const act = [(rnd() * n) | 0]; seen[act[0]] = 1;
  while (act.length) {
    const ai = rnd() < 0.7 ? act.length - 1 : (rnd() * act.length) | 0, i = act[ai], opts = [];
    for (let k = 0; k < 4; k++) { const j = nb(i, k); if (j >= 0 && !seen[j]) opts.push(k); }
    if (!opts.length) { act.splice(ai, 1); continue; }
    const k = opts[(rnd() * opts.length) | 0], j = nb(i, k);
    ps[i] |= 1 << k; ps[j] |= 1 << ((k + 2) % 4); seen[j] = 1; act.push(j);
  }
  const start = 0, goal = n - 1;
  // stars ⭐ go into dead ends, spread out (farthest from what is already chosen)
  const ends = [];
  for (let i = 0; i < n; i++) if (bits(ps[i]) === 1 && i !== start && i !== goal) ends.push(i);
  for (let i = ends.length - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [ends[i], ends[j]] = [ends[j], ends[i]]; }
  const want = Math.min(STARS[Math.max(0, Math.min(LEVELS, lvl) - 1)], ends.length), stars = [], taken = [start, goal];
  const md = (a, b) => Math.abs(a % Lw - b % Lw) + Math.abs((a / Lw | 0) - (b / Lw | 0));
  while (stars.length < want) {
    let best = -1, bd = -1;
    for (const e of ends) { if (stars.includes(e)) continue; const d = Math.min(...taken.map(q => md(e, q))); if (d > bd) { bd = d; best = e; } }
    stars.push(best); taken.push(best);
  }
  return { ps, start, goal, stars };
}

// ---------- state ----------
let state = 'menu', mode = 'slow', tapOn = true, fogOn = false, level = 1, seed = 1, mazeId = 0;
let L = 5, S = 5, pass = new Uint8Array(25), startI = 0, goalI = 24, stars = [], got = 0, dG = null;
let pos = 0, nxt = -1, tt = 0, queue = [], steps = 0, elapsed = 0, hints = 3, hintT = 0, hintGentle = false, idleT = 0;
let visited = new Uint8Array(25), edges = new Set(), log = [], bad = 0, frames = 0;
let landT = 0, bumpT = 0, bumpD = 0, faceX = 0, winT = 0, t = 0, mood = 'happy', moodT = 0, stepSnd = 0, freshT = 0;
let W = 480, H = 800, land = false, cs = 40, ox = 0, oy = 0, C = 5, R = 5, headerH = 0, showPad = false;
const SND = {}; const snd = (n, a, gap = 60) => { const now = performance.now(); if (now - (SND[n] || 0) < gap) return; SND[n] = now; MG.sfx(n, a); };
let floats = [], pressed = null, pressT = 0, lastTap = 0;
let layer = null, layerKey = '', fogMem = null, fogF = null, fogDirty = true, routeCache = { id: -1, par: null };
const A = { maze: { x: 0, y: 0, w: 1, h: 1 } };
let btns = [], padBtns = [];
const isTouch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ---------- grid helpers (canonical ↔ what is on screen) ----------
// landscape: column = u, row = v.  portrait: column = v, row = u (the maze is just turned over)
function nb(i, k) { const u = i % L + DU[k], v = (i / L | 0) + DV[k]; return u < 0 || v < 0 || u >= L || v >= S ? -1 : v * L + u; }
const canonDir = d => land ? d : [1, 0, 3, 2][d];            // screen direction (0 →, 1 ↓, 2 ←, 3 ↑) → canonical direction
function disp(i) { const u = i % L, v = i / L | 0; return land ? { c: u, r: v } : { c: v, r: u }; }
function fromDisp(c, r) { if (c < 0 || r < 0 || c >= C || r >= R) return -1; return land ? r * L + c : c * L + r; }
function center(i) { const d = disp(i); return { x: ox + (d.c + 0.5) * cs, y: oy + (d.r + 0.5) * cs }; }
function linkDir(a, b) { for (let k = 0; k < 4; k++) if (nb(a, k) === b) return k; return -1; }
const canPass = (a, b) => { const k = linkDir(a, b); return k >= 0 && !!(pass[a] & (1 << k)); };
function bfs(src) {
  const n = L * S, dist = new Int16Array(n).fill(-1), par = new Int16Array(n).fill(-1), q = [src]; dist[src] = 0;
  for (let h = 0; h < q.length; h++) { const i = q[h]; for (let k = 0; k < 4; k++) if (pass[i] & (1 << k)) { const j = nb(i, k); if (dist[j] < 0) { dist[j] = dist[i] + 1; par[j] = i; q.push(j); } } }
  return { dist, par };
}
function pathBetween(a, b) {      // cells after a, up to and including b
  if (a === b) return [];
  const { par } = bfs(a), out = [];
  for (let i = b; i !== a && i >= 0; i = par[i]) out.push(i);
  return out.reverse();
}
function pathToGoal(from, max = 1e9) { const out = []; let i = from; while (i !== goalI && out.length < max) { let nx = -1; for (let k = 0; k < 4; k++) if (pass[i] & (1 << k)) { const j = nb(i, k); if (dG[j] === dG[i] - 1) { nx = j; break; } } if (nx < 0) break; out.push(nx); i = nx; } return out; }

// ---------- layout ----------
function cssScale() { const r = cv.getBoundingClientRect(); return Math.max(0.1, (r.width - 6) / W); }
function mkPad(cx, cy, s) {
  const g = 4;
  for (const [dx, dy, d] of [[1, 0, 0], [0, 1, 1], [-1, 0, 2], [0, -1, 3]]) padBtns.push({ id: 'pad', d, x: cx + dx * (s + g) - s / 2, y: cy + dy * (s + g) - s / 2, w: s, h: s });
}
function layoutAreas() {
  W = cv.lw; H = cv.lh; land = W > H; btns = []; padBtns = [];
  if (land) {
    const PW = 216, px0 = W - PW;
    A.panel = { x: px0 + 2, y: 10, w: PW - 12, h: H - 20 }; A.strip = null;
    A.maze = { x: 12, y: 12, w: px0 - 22, h: H - 24 };
    const bx = px0 + 18, bw = PW - 44;
    btns.push({ id: 'hint', x: bx, y: 196, w: bw, h: 58 }, { id: 'fresh', x: bx, y: 266, w: bw, h: 58 });
    if (showPad) mkPad(px0 + PW / 2 - 4, H - 108, 58);
  } else {
    const B = showPad ? 188 : 86;
    A.strip = { x: 8, y: H - B, w: W - 16, h: B - 8 }; A.panel = null;
    A.maze = { x: 10, y: 10, w: W - 20, h: H - B - 20 };
    if (showPad) { btns.push({ id: 'hint', x: 18, y: H - B + 14, w: 124, h: 58 }, { id: 'fresh', x: W - 142, y: H - B + 14, w: 124, h: 58 }); mkPad(W / 2, H - B / 2 - 4, 52); }
    else btns.push({ id: 'hint', x: 18, y: H - B + 11, w: 150, h: 58 }, { id: 'fresh', x: W - 168, y: H - B + 11, w: 150, h: 58 });
  }
}
function placeMaze() {
  C = land ? L : S; R = land ? S : L;
  const m = A.maze;
  cs = Math.min(m.w / C, m.h / R);
  ox = m.x + (m.w - C * cs) / 2;
  const gap = m.h - R * cs;
  headerH = !land && gap >= 44 ? Math.min(60, gap) : 0;
  oy = m.y + headerH + (m.h - headerH - R * cs) / 2;
}
function pickDims(n) {
  const [lg, sh] = SIZES[n - 1], k = cssScale();
  const maxC = Math.max(4, Math.floor(A.maze.w * k / MIN_CSS)), maxR = Math.max(4, Math.floor(A.maze.h * k / MIN_CSS));
  const c = Math.min(land ? lg : sh, maxC), r = Math.min(land ? sh : lg, maxR);
  return land ? [c, r] : [r, c];
}
function relayout() { layoutAreas(); placeMaze(); layerKey = ''; fogDirty = true; }
cv.onfit = () => relayout();
MG.fit(cv, (sw, sh) => {
  const l = sw > sh * 1.05;
  if (l) { H = 600; W = Math.round(Math.min(1300, Math.max(800, H * sw / sh))); }
  else { W = 480; H = Math.round(Math.min(1000, Math.max(640, W * sh / sw))); }
  return [W, H];
});

// ---------- flow ----------
function buildMaze() {
  const m = genMaze(L, S, seed, level);
  pass = m.ps; startI = m.start; goalI = m.goal;
  stars = m.stars.map(i => ({ i, got: false }));
  dG = bfs(goalI).dist; mazeId++;
}
function resetRun() {
  pos = startI; nxt = -1; tt = 0; queue = []; steps = 0; elapsed = 0; got = 0; hints = 3; hintT = 0; idleT = 0;
  visited = new Uint8Array(L * S); visited[pos] = 1; edges = new Set(); log = [pos]; bad = 0;
  landT = 0; bumpT = 0; faceX = 0; winT = 0; floats = []; MG.fx.clear(); mood = 'happy'; moodT = 0; freshT = 0;
  fogDirty = true; layerKey = '';
}
function startLevel(n, how = 'new') {
  level = n; showPad = isTouch && n >= PAD_FROM;
  layoutAreas();
  if (how !== 'same') { seed = ((Math.random() * 2147483646) | 0) + 1; [L, S] = pickDims(n); }
  buildMaze(); placeMaze(); resetRun();
  state = 'play'; MG.hide();
  const th = TH();
  MG.toast(`第 ${n} 關　Go! 🚀 ${th.ic}`, 2200);
  hud(true);
}
function newMaze() { MG.sfx('flip'); startLevel(level, 'new'); }
function win() {
  state = 'won'; queue = []; winT = 0; mood = 'love'; moodT = 99;
  MG.sfx('win'); MG.sfx('yay');
  const g = center(goalI);
  floats.push({ x: g.x, y: g.y - cs * 0.6, text: MG.WORDS.clear, life: 1.6 });
  for (let i = 0; i < 5; i++) setTimeout(() => { if (state === 'won') MG.fx.burst(g.x + MG.rand(-cs, cs), g.y - cs * 0.3, { n: 16, colors: ['#ff8fbf', '#ffd23f', '#4cc96a', '#4c9cf0', '#a07cf2', '#fff'], shape: MG.pick(['star', 'sq']), speed: 260, up: 180, size: Math.max(4, cs * 0.12), life: 1.2 }); }, i * 160);
  const rec = MG.record('maze', level);
  let bestT = null, newT = false;
  if (mode === 'timed') { const k = 'maze.time.' + level, old = MG.store.get(k, null); newT = old == null || elapsed < old; if (newT) MG.store.set(k, elapsed); bestT = newT ? elapsed : old; }
  const at = mazeId, total = stars.length;
  setTimeout(() => {
    if (state !== 'won' || mazeId !== at || MG.panelOpen()) return;
    const nx = level < LEVELS;
    MG.panel({
      title: `第 ${level} 關完成！`,
      html: (total ? `<div class="mz-stars">${'⭐'.repeat(got)}${'☆'.repeat(total - got)}</div>` : '') +
        `<p>噗噗找到${TH().goal}了！走了 ${steps} 步${mode === 'timed' ? `，用了 <b>${mmss(elapsed)}</b>` : `，花了 ${mmss(elapsed)}`} ^_^</p>` +
        (total ? (got === total ? '<p>星星全部撿到了，太厲害了！</p>' : `<p>撿到 ${got} 顆星星，死路裡還藏著 ${total - got} 顆喔</p>`) : '') +
        (mode === 'timed' ? (newT ? '<p class="new">這關最快紀錄！^_^</p>' : `<p>這關最快：${mmss(bestT)}</p>`) : '') +
        (rec.isNew && level > 1 ? '<p class="new">走到新的一關了！</p>' : '') +
        (nx ? `<p>下一關：${THEMES[level % THEMES.length].ic} ${THEMES[level % THEMES.length].nm}，迷宮更大一點</p>` : '<p>十二關全部走完了，你是迷宮大師！</p>'),
      buttons: [
        { label: nx ? '下一關' : '回到第 1 關', on: () => { const n = nx ? level + 1 : 1; MG.store.set('maze.pickLevel', n); startLevel(n); } },
        { label: '這關再玩', alt: true, on: () => startLevel(level, 'same') },
        { label: '換一個迷宮', alt: true, on: () => startLevel(level, 'new') },
        { label: '選關卡', alt: true, on: menu },
      ],
    });
  }, 1500);
}
let lastHud = '';
function hud(force) {
  const s = `${level}|${mode}|${got}|${stars.length}|${mode === 'timed' ? Math.floor(elapsed) : 0}`;
  if (s === lastHud && !force) return; lastHud = s;
  MG.stat('level', `第 ${level} 關`);
  MG.stat('info', mode === 'timed' ? `⏱ ${mmss(elapsed)}` : `⭐ ${got}/${stars.length}`);
}

// ---------- movement: a queue of cells, walked one by one with a little hop ----------
const headCell = () => queue.length ? queue[queue.length - 1] : nxt >= 0 ? nxt : pos;
function beforeHead() { if (queue.length >= 2) return queue[queue.length - 2]; if (queue.length === 1) return nxt >= 0 ? nxt : pos; return nxt >= 0 ? pos : -1; }
// add one step from the head of the plan (only through an opening); stepping back onto the previous cell cancels instead
function stepTo(j) {
  const h = headCell();
  if (!canPass(h, j)) return false;
  if (j === beforeHead()) {
    if (queue.length) queue.pop();
    else if (nxt >= 0) { const a = pos; pos = nxt; nxt = a; tt = 1 - tt; }   // turn around in the middle of a hop
    return true;
  }
  queue.push(j); return true;
}
function clearPlan() { queue = []; }
function slide(dScreen) {
  if (state !== 'play') return;
  idleT = 0;
  let k = canonDir(dScreen), cur = headCell();
  if (!(pass[cur] & (1 << k))) { bump(dScreen); return; }
  for (let n = 0; n < 500; n++) {
    const j = nb(cur, k); stepTo(j);
    const prev = cur; cur = j;
    if (cur === goalI || bits(pass[cur]) !== 2) break;       // stop at a junction, a dead end or the goal
    for (let q = 0; q < 4; q++) if ((pass[cur] & (1 << q)) && nb(cur, q) !== prev) { k = q; break; }   // follow the bend
  }
}
function bump(d) { bumpT = 0.25; bumpD = d; MG.sfx('tick'); }
function walkTo(target) {
  if (target < 0 || state !== 'play') return;
  idleT = 0; clearPlan();
  const from = nxt >= 0 ? nxt : pos;
  if (target === pos && nxt >= 0) { stepTo(pos); return; }
  for (const c of pathBetween(from, target)) queue.push(c);
}
function arrive(i) {
  const prev = pos; pos = i;
  if (log[log.length - 1] !== i) {
    steps++; log.push(i);
    edges.add(Math.min(prev, i) * 4096 + Math.max(prev, i));
    if (!visited[i]) { visited[i] = 1; punchFog(i); }
    if (t - stepSnd > 0.06) { MG.sfx('step'); stepSnd = t; }
  }
  const st = stars.find(s => s.i === i && !s.got);
  if (st) {
    st.got = true; got++; MG.sfx('coin'); snd('match', got); mood = 'wow'; moodT = 0.9;
    const c = center(i);
    MG.fx.burst(c.x, c.y, { n: 14, colors: ['#ffd23f', '#fff3a0', '#fff'], shape: 'star', speed: 170, up: 90, size: Math.max(3, cs * 0.1), life: 0.8 });
    floats.push({ x: c.x, y: c.y - cs * 0.3, text: '+1 ⭐', life: 1 });
    if (got === stars.length && got > 1) { snd('sparkle'); floats.push({ x: c.x, y: c.y - cs * 0.3 - Math.max(16, cs * 0.45), text: `All ⭐ ${MG.praise(4)}`, life: 1.4 }); }
    hud();
  }
  if (i === goalI && state === 'play') { nxt = -1; tt = 0; win(); }
}
function update(dt) {
  if (state === 'play') { elapsed += dt; idleT += dt; }
  if (nxt < 0 && queue.length && state === 'play') { nxt = queue.shift(); tt = 0; }
  if (nxt >= 0) {
    if (!canPass(pos, nxt)) { bad++; nxt = -1; queue = []; }      // never through a wall (counted for the tests)
    else {
      const dur = 0.13 / (1 + Math.min(queue.length, 6) * 0.14);
      tt += dt / dur;
      const dx = center(nxt).x - center(pos).x; if (Math.abs(dx) > 1) faceX = dx > 0 ? 1 : -1;
      while (tt >= 1 && nxt >= 0) {
        const to = nxt; tt -= 1; nxt = -1; arrive(to);
        if (state === 'play' && queue.length) { nxt = queue.shift(); if (!canPass(pos, nxt)) { bad++; nxt = -1; queue = []; } }
        else { tt = 0; landT = 0.3; }
      }
      idleT = 0;
    }
  }
  landT = Math.max(0, landT - dt); bumpT = Math.max(0, bumpT - dt); hintT = Math.max(0, hintT - dt); freshT = Math.max(0, freshT - dt);
  moodT = Math.max(0, moodT - dt); if (!moodT && mood !== 'happy' && state === 'play') mood = 'happy';
  if (state === 'won') winT += dt;
  // a little help for the youngest: standing still for a long time shows the next few steps
  if (state === 'play' && mode === 'slow' && idleT > 15 && hintT <= 0) { hintT = 2.2; hintGentle = true; idleT = 0; }
  for (const f of floats) { f.life -= dt; f.y -= 30 * dt; } floats = floats.filter(f => f.life > 0);
  pressT = Math.max(0, pressT - dt);
  MG.fx.step(dt);
  hud();
}
function useHint() {
  if (state !== 'play') return;
  if (mode === 'timed') { if (hints <= 0) { MG.toast('💡 ×0'); MG.sfx('miss'); return; } hints--; }
  hintT = 2.4; hintGentle = false; idleT = 0; MG.sfx('pop'); snd('sparkle');
}
function pressFresh() {
  if (state !== 'play') return;
  if (freshT > 0 || steps === 0) { freshT = 0; newMaze(); return; }
  freshT = 2.5; MG.toast('🔄 Tap again → new 🧩', 2200);
}

// ---------- input ----------
let drag = null;
const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function hitButton(p) {
  for (const b of btns) if (inRect(p, { x: b.x - 4, y: b.y - 4, w: b.w + 8, h: b.h + 8 })) return b;
  for (const b of padBtns) if (inRect(p, { x: b.x - 2, y: b.y - 2, w: b.w + 4, h: b.h + 4 })) return b;
  return null;
}
function pressButton(b) {
  pressed = b; pressT = 0.15;
  if (b.id === 'hint') useHint(); else if (b.id === 'fresh') pressFresh(); else if (b.id === 'pad') slide(b.d);
}
function playerXY() {
  const a = center(pos);
  if (nxt < 0) return { x: a.x, y: a.y, hop: 0 };
  const b = center(nxt), e = tt * tt * (3 - 2 * tt);

// ---------- live drawing ----------
function drawTrail(th) {
  if (!edges.size && nxt < 0) return;

  for (let i = pos; i !== startI && i >= 0 && par[i] >= 0; i = par[i]) route.add(Math.min(i, par[i]) * 4096 + Math.max(i, par[i]));
  const dotsOn = (a, b, col, r, step) => { const n = Math.max(1, Math.round(Math.hypot(b.x - a.x, b.y - a.y) / step)); x.fillStyle = col; for (let k = 0; k < n; k++) dot(x, a.x + (b.x - a.x) * k / n, a.y + (b.y - a.y) * k / n, r); };

  for (const e of route) { const a = center(Math.floor(e / 4096)), b = center(e % 4096); dotsOn(a, b, 'rgba(255,255,255,.7)', cs * 0.095, cs * 0.25); dotsOn(a, b, th.route, cs * 0.07, cs * 0.25); }

}
function routeTree() { if (routeCache.id !== mazeId) routeCache = { id: mazeId, par: bfs(startI).par }; return routeCache; }
function drawStars() {
