const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };

const lvIc = L => L.mk || WORLDS[L.w].ic;

// one short Chinese panel the first time each new thing shows up

function newsOf() {
  const k = ['move'];
  if (endless) k.push('endless', 'hearts');
  else {
    if (mode === 'chal') k.push('hearts');
    for (const m of Object.keys(LV.mix)) k.push(m);
    if (LV.grav) k.push('grav'); if (LV.dark) k.push('dark'); if (LV.zap) k.push('zap'); if (LV.need) k.push('need'); if (LV.ring) k.push('ring');
    for (const p of LV.pw || []) k.push(p);
    if (LV.storm) k.push('storm');
  }
  return k.filter((q, i, a) => NEWS[q] && a.indexOf(q) === i);
}

// =====================================================================
// state + layout
// =====================================================================
let level = 1, LV = LEVELS[0], mode = 'slow', state = 'menu', endless = false, t = 0;
let S = null, C = null, objs = [], pops = [], amb = [], testSeed = null;
const ptrs = new Map(), keys = new Set();
let W = 400, H = 700, land = false;
const SPR = new Map();
let bgC = null, bgK = '', tiles = null, darkC = null;
cv.onfit = () => {
  const ow = W, oh = H; W = cv.lw; H = cv.lh; land = W > H; SPR.clear(); bgK = ''; darkC = null;
  if (S && C && (ow !== W || oh !== H)) {
    const kx = W / ow, ky = H / oh;
    for (const o of objs) { o.x0 *= kx; o.vx *= kx; o.y0 *= ky; o.vy *= ky; if (o.A) o.A *= kx; if (o.splitY) o.splitY *= ky; place(o); }
    C.x = clamp(C.x * kx, 30, W - 30); C.tx = clamp(C.tx * kx, 30, W - 30);
    for (const p of ptrs.values()) if (!p.btn) { p.cx = C.tx; p.fx = null; }
  }
};
MG.fit(cv, (sw, sh) => {
  if (sw > sh * 1.1) { const h = 560; return [Math.round(clamp(h * sw / sh, 760, 1300)), h]; }
  const w = 400; return [w, Math.round(clamp(w * sh / sw, 560, 900))];
});
addEventListener('mg-big', () => { SPR.clear(); });
function spr(key, w, h, fn) {
  const s = cv._mgScale || 1, k = key + '@' + s;
  let c = SPR.get(k);
  if (!c) { c = document.createElement('canvas'); c.width = Math.ceil(w * s); c.height = Math.ceil(h * s); const g = c.getContext('2d'); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round'; fn(g); SPR.set(k, c); }
  return c;
}
const blit = (c, cx, cy, w, h, rot = 0, sc = 1) => { if (!rot && sc === 1) { x.drawImage(c, cx - w / 2, cy - h / 2, w, h); return; } x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc); x.drawImage(c, -w / 2, -h / 2, w, h); x.restore(); };

const capY = () => H - (land ? 116 : Math.max(140, H * 0.165));
const SK = () => land ? 1.22 : 1.3;   // 泡泡船畫大一點
const BR = () => land ? 34 : 31;
const btnPos = d => { const r = BR(); return { x: d < 0 ? 14 + r : W - 14 - r, y: H - 12 - r, r }; };
const WD = () => WORLDS[endless ? (S ? S.ew : 0) : LV.w];
const capHR = () => 20 * C.sc;
const slowK = () => mode === 'slow' ? 0.78 : 1;
const spd = () => endless ? Math.min(1.3, 0.95 + S.t / 240) : LV.sp;
const FALL = () => H * 0.3 * spd() * slowK();
const INT = () => (endless ? Math.min(1.65, 0.85 + S.t / 95) : LV.sp) * (S.storm ? 1.25 : 1) * (mode === 'slow' ? 0.82 : 1);
const WF = () => Math.pow(W / 400, 0.8);
const maxHearts = () => endless ? (mode === 'slow' ? 5 : 3) : 3;
const usesHearts = () => endless || mode === 'chal';

  get wave() { return S.wave && S.wave.ty; }, get rings() { return S.rings; }, get fin() { return S.fin; }, get storm() { return S.storm; },
  set seed(v) { testSeed = v; }, setHero: h => MG.setHero(h),
  cap: () => ({ x: C.x, tx: C.tx, y: capY(), shield: C.shield, shrink: C.shrink, slow: C.slow, sc: C.sc }),
  objs: () => objs.map(o => ({ kind: o.kind, x: o.x, y: o.y, r: o.r, t: o.t, what: o.what })),
  layout: () => ({ W, H, land, capY: capY(), btnL: btnPos(-1), btnR: btnPos(1) }),
  start: (lv, m = 'slow') => start(m, lv), endlessStart: (m = 'slow') => startEndless(m), menu: () => menu(),
  spawn(ty) { if (!S.wave || S.wave.ty !== ty) { S.wave = { ty, t: WAVE_T[ty], age: 0, acc: 0.99, gc: W / 2, gs: -1, n: 0 }; } },
  pow: what => addPow(what),
  aim() { const o = C.tx; pilot(); const r = C.tx; C.tx = o; return r; },
  win: () => { S.p = 1; }, finish() { S.p = 1; beginFinish(); for (let i = 0; i < 300 && state === 'play'; i++) update(1 / 30); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) { if (state !== 'play') break; update(dt); } },
  bench(n = 60) { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); draw(); } x.getImageData(0, 0, 1, 1); return (performance.now() - t0) / n; },
  auto(sec, dt = 1 / 30) {
    for (let i = 0, n = Math.round(sec / dt); i < n && state === 'play'; i++) { pilot(); if (LV.zap && i % 12 === 0) { const o = objs.find(q => q.haz && !q.dead && q.t > 0 && q.kind !== 'comet' && q.y > 40 && q.y < capY() - 60); if (o) zap(o); } update(dt); }
    return { state, p: S.p, hits: S.hits, hearts: S.hearts, stars: S.stars, whoosh: S.whoosh, t: S.t };
  },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
};
// look ahead ~1.5 s: for every place the ship could go, how close would the meteors come? go where it stays clearest
function pilot() {
  if (S.fin) return;
  const cy = capY() - 4, hr = capHR(), k = S.tk, hz = objs.filter(o => o.haz && !o.dead && o.y < cy + 80);
  const vmax = 640, steps = 15, dtau = 0.1;
  const fut = hz.map(o => { const a = []; for (let s = 1; s <= steps; s++) { const tt = o.t + s * dtau * k; a.push(tt < 0 ? null : posAt(o, tt)); } return a; });
  let bx = C.x, bs = -1e9;
  for (let cx = 28; cx <= W - 28; cx += 8) {
    let mg = 80;
    for (let s = 1; s <= steps; s++) {
      const tau = s * dtau, xs = C.x + Math.sign(cx - C.x) * Math.min(Math.abs(cx - C.x), vmax * tau);
      for (let i = 0; i < hz.length; i++) { const p = fut[i][s - 1]; if (!p) continue; const dy = p[1] - cy; if (dy < -140 || dy > 60) continue; const gap = Math.hypot(p[0] - xs, dy) - hz[i].hr - hr; const w = gap + s * 1.2; if (w < mg) mg = w; }
    }
    let sc = Math.min(mg, 60) - Math.abs(cx - C.x) * 0.01 - Math.abs(cx - W / 2) * 0.006;
    for (const o of objs) if ((o.kind === 'star' || o.kind === 'pow') && o.y > cy - 220 && o.y < cy && Math.abs(o.x - cx) < 20) sc += 6;
    for (const o of objs) if (o.kind === 'ring' && !o.done && o.y > cy - 320 && Math.abs(o.x - cx) < o.r * 0.5) sc += 14;
    if (sc > bs) { bs = sc; bx = cx; }
  }
  C.tx = bx;
}
