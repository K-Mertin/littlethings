<!doctype html>

<title>噗噗躲隕石</title>

<style>
.mg-stage{padding:6px}
.mg-stage canvas{background:#120d33;border-color:#e9e4ff}
.mg-levels.mg-lvgrid{grid-template-columns:repeat(auto-fill,minmax(calc(58px * var(--ui)),1fr))}
.mg-lvgrid .mg-lv{min-height:50px;line-height:1.15;padding:2px 2px;white-space:normal}
.mg-lvgrid .mg-lv small{display:block;font-size:11px;font-weight:700;color:#e0a100;letter-spacing:.04em}
.mg-lvgrid .mg-lv[aria-pressed=true] small{color:#fff}
.mt-stars{font-size:44px;letter-spacing:.12em;margin:2px 0 4px;color:#ffc21a}
.mt-stars i{font-style:normal;color:#d9d2c4}
.mt-new{display:flex;gap:12px;align-items:center;text-align:left;margin:8px 0}
.mt-new b.ic{font-size:42px;line-height:1;flex:none}

@media (max-width:380px){.mg-bar{gap:4px;padding-left:4px;padding-right:4px}html.mg-big .mg-bar .stat{font-size:13px;padding:3px 5px}}

<body>
<main class="mg-stage"><canvas id="cv" aria-label="遊戲畫面"></canvas></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'meteor', title: '噗噗躲隕石', stats: ['level', 'info'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
const EMO = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const TS = () => MG.textScale, F = (px, w = 900) => `${w} ${Math.round(px * TS())}px system-ui,"Noto Sans TC",${EMO}`;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let q = Math.imul(a ^ a >>> 15, 1 | a); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }
const ease = k => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
const easeBack = k => { const c = 1.7; k = clamp(k, 0, 1) - 1; return 1 + k * k * ((c + 1) * k + c); };

  { w: 4, nm: '黑夜點點樂', mk: '👆', len: 40, sp: 0.95, mix: { rain: 1, crack: 0.8 }, zap: 1, dark: 1 },
  { w: 5, nm: '星星回家', mk: '🌟', len: 999, sp: 0.95, mix: { rain: 0.7, zig: 0.6 }, stars: 3.2, need: 22, pw: ['shield'] },

const lvIc = L => L.mk || WORLDS[L.w].ic;

// one short Chinese panel the first time each new thing shows up
const NEWS = {
  move: ['👆', '開動泡泡船', '<b>手指按住畫面左右拖一拖</b>，噗噗的泡泡船就會跟著移動！也可以按住下面的 ◀ ▶（電腦用 ← → 鍵）。一路飛到前面的星球就過關！'],

  side: ['↘️', '斜斜飛來的隕石', '有些隕石會從<b>旁邊斜斜衝過來</b>！畫面邊邊先出現 <b>❗ 箭頭</b>，就知道它要從那裡來了。'],

  junk: ['🛰️', '太空垃圾', '舊舊的人造衛星在太空裡<b>彈來彈去</b>，撞到牆壁會彈回來，要小心喔！'],

};
function newsOf() {
  const k = ['move'];
  if (endless) k.push('endless', 'hearts');
  else {
    if (mode === 'chal') k.push('hearts');
    for (const m of Object.keys(LV.mix)) k.push(m);
    if (LV.grav) k.push('grav'); if (LV.dark) k.push('dark'); if (LV.zap) k.push('zap'); if (LV.need) k.push('need');
    for (const p of LV.pw || []) k.push(p);
    if (LV.storm) k.push('storm');
  }
  return k.filter((q, i, a) => NEWS[q] && a.indexOf(q) === i);
}

// =====================================================================
// state + layout
// =====================================================================
let level = 1, LV = LEVELS[0], mode = 'slow', state = 'menu', endless = false, t = 0;
let S = null, C = null, objs = [], pops = [], amb = [], testSeed = null;
const ptrs = new Map(), keys = new Set();
let W = 400, H = 700, land = false;
const SPR = new Map();
let bgC = null, bgK = '', tiles = null, darkC = null;
cv.onfit = () => {
  const ow = W, oh = H; W = cv.lw; H = cv.lh; land = W > H; SPR.clear(); bgK = ''; darkC = null;
  if (S && C && (ow !== W || oh !== H)) {
    const kx = W / ow, ky = H / oh;
    for (const o of objs) { o.x0 *= kx; o.vx *= kx; o.y0 *= ky; o.vy *= ky; if (o.A) o.A *= kx; if (o.splitY) o.splitY *= ky; place(o); }
    C.x = clamp(C.x * kx, 30, W - 30); C.tx = clamp(C.tx * kx, 30, W - 30);
    for (const p of ptrs.values()) if (!p.btn) { p.cx = C.tx; p.fx = null; }
  }
};
MG.fit(cv, (sw, sh) => {
  if (sw > sh * 1.1) { const h = 560; return [Math.round(clamp(h * sw / sh, 760, 1300)), h]; }
  const w = 400; return [w, Math.round(clamp(w * sh / sw, 560, 900))];
});
addEventListener('mg-big', () => { SPR.clear(); });
function spr(key, w, h, fn) {
  const s = cv._mgScale || 1, k = key + '@' + s;
  let c = SPR.get(k);
  if (!c) { c = document.createElement('canvas'); c.width = Math.ceil(w * s); c.height = Math.ceil(h * s); const g = c.getContext('2d'); g.scale(s, s); g.lineCap = 'round'; g.lineJoin = 'round'; fn(g); SPR.set(k, c); }
  return c;
}
const blit = (c, cx, cy, w, h, rot = 0, sc = 1) => { if (!rot && sc === 1) { x.drawImage(c, cx - w / 2, cy - h / 2, w, h); return; } x.save(); x.translate(cx, cy); x.rotate(rot); x.scale(sc, sc); x.drawImage(c, -w / 2, -h / 2, w, h); x.restore(); };

const capY = () => H - (land ? 108 : Math.max(122, H * 0.15));
const BR = () => land ? 34 : 31;
const btnPos = d => { const r = BR(); return { x: d < 0 ? 14 + r : W - 14 - r, y: H - 12 - r, r }; };
const WD = () => WORLDS[endless ? (S ? S.ew : 0) : LV.w];
const capHR = () => 19 * C.sc;
const slowK = () => mode === 'slow' ? 0.78 : 1;
const spd = () => endless ? Math.min(1.3, 0.95 + S.t / 240) : LV.sp;
const FALL = () => H * 0.3 * spd() * slowK();
const INT = () => (endless ? Math.min(1.65, 0.85 + S.t / 95) : LV.sp) * (S.storm ? 1.25 : 1) * (mode === 'slow' ? 0.82 : 1);
const WF = () => Math.pow(W / 400, 0.8);
const maxHearts = () => endless ? (mode === 'slow' ? 5 : 3) : 3;
const usesHearts = () => endless || mode === 'chal';

function reset() {
  MG.fx.clear(); objs = []; pops = []; ptrs.clear(); keys.clear();
  C = { x: W / 2, tx: W / 2, vx: 0, tilt: 0, inv: 0, wob: 0, mood: 0, shield: 0, shrink: 0, slow: 0, sc: 1, fly: 0, cool: 0, spin: 0 };
  const seed = testSeed != null ? testSeed : (level * 7919 + (Date.now() & 0xffff));
  S = { t: 0, p: 0, rng: mulberry(seed), wave: null, restT: 1.5, last: [], waves: 0, stars: 0, hits: 0, hearts: maxHearts(), whoosh: 0, wT: 0,
    pwI: 0, pwT: 14, heartT: 28, storm: false, fin: 0, wellT: 2.5, starT: 1.2, goT: 1.4, tk: 1, banner: null, mile: 0, ew: 0, chain: 0, failT: 0, arrived: false, deco: Math.random() * 1000, dist: 0 };
  hud();
}
const rnd = () => S.rng(), rr = (a, b) => a + rnd() * (b - a);
function hud() {
  MG.stat('level', endless ? '♾️ 無限' : `第 ${level} 關`);
  MG.stat('info', !endless && LV && LV.need && S ? `🌟 ${Math.min(S.stars, LV.need)}/${LV.need}` : `⭐ ${S ? S.stars : 0}`);

// ---------- the hero: 噗噗 inside a glass bubble on a little saucer ----------

  const fg = x.createLinearGradient(0, 22, 0, 26 + fl); fg.addColorStop(0, '#fff8d0'); fg.addColorStop(0.4, '#9ff0ff'); fg.addColorStop(1, 'rgba(120,180,255,0)');
  x.fillStyle = fg; x.beginPath(); x.moveTo(-9, 22); x.quadraticCurveTo(-7, 26 + fl * 0.6, 0, 26 + fl); x.quadraticCurveTo(7, 26 + fl * 0.6, 9, 22); x.closePath(); x.fill();

  x.restore();
  x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 3.4; x.beginPath(); x.arc(0, by, br - 5, Math.PI * 1.08, Math.PI * 1.42); x.stroke();
  x.fillStyle = 'rgba(255,255,255,.85)'; x.beginPath(); x.arc(11, by - 13, 2.6, 0, TAU); x.fill();
  x.strokeStyle = OL; x.lineWidth = 2.6; x.beginPath(); x.arc(0, by, br, Math.PI * 0.86, Math.PI * 2.14); x.stroke();
  // saucer front rim with blinking lights

  x.fillStyle = sg; x.strokeStyle = '#a8344a'; x.lineWidth = 2.6; x.beginPath(); x.ellipse(0, 13, 42, 13, 0, 0, TAU); x.fill(); x.stroke();

// ---------- the dark side: only a flashlight cone in front of the ship ----------

    for (const sd of [-1, 1]) {

// ---------- HUD ----------
function heartPath(cx, cy, s) { x.beginPath(); x.moveTo(cx, cy + s * 0.9); x.bezierCurveTo(cx - s * 1.5, cy - s * 0.1, cx - s * 0.7, cy - s * 1.3, cx, cy - s * 0.45); x.bezierCurveTo(cx + s * 0.7, cy - s * 1.3, cx + s * 1.5, cy - s * 0.1, cx, cy + s * 0.9); x.closePath(); }
function drawHUD() {
  const s = TS();
  // left: hearts (挑戰 / 無限) or the turtle (慢慢玩)
  const h = Math.round(40 * s), y0 = 10, x0 = 10;
  if (usesHearts()) {
    const n = maxHearts(), hs = 11 * s, w = 18 + n * hs * 2.5;
    x.fillStyle = 'rgba(20,10,50,.45)'; x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 2; x.beginPath(); x.roundRect(x0, y0, w, h, h / 2); x.fill(); x.stroke();
    for (let i = 0; i < n; i++) {
      const cx = x0 + 12 + hs * 1.2 + i * hs * 2.5, cy = y0 + h / 2 + 1, full = i < S.hearts;
      heartPath(cx, cy, hs); x.fillStyle = full ? '#ff5d7a' : 'rgba(255,255,255,.18)'; x.fill(); x.strokeStyle = full ? '#fff' : 'rgba(255,255,255,.5)'; x.lineWidth = 2; x.stroke();
      if (full) { x.fillStyle = 'rgba(255,255,255,.7)'; x.beginPath(); x.ellipse(cx - hs * 0.45, cy - hs * 0.35, hs * 0.22, hs * 0.13, -0.6, 0, TAU); x.fill(); }
    }
  } else {
    const w = Math.round(52 * s);
    x.fillStyle = 'rgba(20,10,50,.45)'; x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 2; x.beginPath(); x.roundRect(x0, y0, w, h, h / 2); x.fill(); x.stroke();
    x.font = `${Math.round(22 * s)}px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.fillText('🐢', x0 + w / 2, y0 + h / 2 + 1);
  }
  // power-up timers under it
  let py = y0 + h + 8;
  for (const [v, e, max] of [[C.shield, '🛡️', 8], [C.shrink, '🤏', 8], [C.slow, '⏳', 6]]) if (v > 0) {
    const cx = x0 + 20, cy = py + 20;
    x.fillStyle = 'rgba(20,10,50,.5)'; x.beginPath(); x.arc(cx, cy, 20, 0, TAU); x.fill();
    x.strokeStyle = '#ffe066'; x.lineWidth = 3; x.beginPath(); x.arc(cx, cy, 18, -Math.PI / 2, -Math.PI / 2 + TAU * v / max); x.stroke();
    x.fillStyle = '#fff'; x.font = `18px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(e, cx, cy + 1); py += 46;
  }
  if (endless) {
    const sec = Math.floor(S.t), best = MG.store.get('meteor.endless', 0), w = Math.round(120 * s);
    x.fillStyle = 'rgba(20,10,50,.45)'; x.strokeStyle = 'rgba(255,255,255,.6)'; x.lineWidth = 2; x.beginPath(); x.roundRect(W / 2 - w / 2, y0, w, h, h / 2); x.fill(); x.stroke();
    x.fillStyle = '#fff'; x.font = F(22); x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(`⏱ ${sec}`, W / 2, y0 + h / 2 + 1);
    if (best) { x.font = F(13, 800); x.fillStyle = 'rgba(255,240,170,.9)'; x.fillText(`🏆 ${best}`, W / 2, y0 + h + 12 * s); }
    return;
  }
  // right: the path to the planet (the little ship climbs up as you fly)
  const d = destPos(), tx = W - 20, top = d.y + d.r + 16, bot = capY() + 8;
  if (bot - top > 60) {
    x.save(); x.lineCap = 'round';
    x.strokeStyle = 'rgba(20,10,50,.45)'; x.lineWidth = 12; x.beginPath(); x.moveTo(tx, bot); x.lineTo(tx, top); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 6; x.stroke();
    const my = lerp(bot, top, S.p);
    const pg = x.createLinearGradient(0, bot, 0, top); pg.addColorStop(0, '#9bffea'); pg.addColorStop(1, '#ffe066');
    x.strokeStyle = pg; x.lineWidth = 6; x.beginPath(); x.moveTo(tx, bot); x.lineTo(tx, my); x.stroke();
    for (const k of [0.25, 0.5, 0.75]) { const yy = lerp(bot, top, k); x.fillStyle = S.p >= k ? '#ffe066' : 'rgba(255,255,255,.5)'; x.beginPath(); x.arc(tx, yy, 3, 0, TAU); x.fill(); }
    x.fillStyle = '#ff7d93'; x.strokeStyle = '#fff'; x.lineWidth = 2; x.beginPath(); x.ellipse(tx, my + 3, 11, 4.5, 0, 0, TAU); x.fill(); x.stroke();
    x.fillStyle = 'rgba(190,240,255,.95)'; x.beginPath(); x.arc(tx, my - 2, 6.5, Math.PI, 0); x.fill(); x.stroke();
    x.fillStyle = MG.hero === 'niu' ? '#fffbf3' : '#4cc96a'; x.beginPath(); x.arc(tx, my - 1, 3.4, Math.PI, 0); x.fill();
    if (LV.storm) { const sy = lerp(bot, top, 0.66); x.font = `${Math.round(14 * s)}px ${EMO}`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#fff'; x.fillText('🌠', tx - 18, sy); }
    x.restore();
  }
}
function drawButtons() {
  for (const d of [-1, 1]) {
    const b = btnPos(d), on = [...ptrs.values()].some(p => p.btn === d) || keys.has(d < 0 ? 'ArrowLeft' : 'ArrowRight');
    x.save(); x.globalAlpha = on ? 0.95 : 0.55;
    const g = x.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.35, 2, b.x, b.y, b.r); g.addColorStop(0, on ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.32)'); g.addColorStop(1, on ? 'rgba(160,230,255,.55)' : 'rgba(255,255,255,.1)');
    x.fillStyle = g; x.beginPath(); x.arc(b.x, b.y, b.r * (on ? 0.94 : 1), 0, TAU); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 2.5; x.stroke();
    x.fillStyle = '#fff'; x.strokeStyle = 'rgba(40,30,90,.6)'; x.lineWidth = 2; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(b.x + d * b.r * 0.45, b.y); x.lineTo(b.x - d * b.r * 0.25, b.y - b.r * 0.42); x.lineTo(b.x - d * b.r * 0.25, b.y + b.r * 0.42); x.closePath(); x.fill(); x.stroke();
    x.restore();
  }
}
function draw() {
  drawBG();
  drawAmb();
  if (!S) return;
  if (S.tk < 0.95) { x.fillStyle = `rgba(120,100,255,${(1 - S.tk) * 0.22})`; x.fillRect(0, 0, W, H); }
  drawDest();
  for (const o of objs) if (o.kind === 'well') drawWell(o);
  const dark = !endless && LV.dark && !S.fin;
  for (const o of objs) if (o.kind === 'star' && o.y > -30) { const c = starSprite(); blit(c, o.x, o.y, 40, 40, Math.sin(o.ph * 2) * 0.15, 1 + Math.sin(o.ph * 5) * 0.07); }
  for (const o of objs) if (o.kind === 'pow') drawPow(o);
  for (const o of objs) if (o.haz && o.t >= 0 && o.kind !== 'comet') drawHazard(o);
  for (const o of objs) if (o.kind === 'comet' && o.t >= 0) drawHazard(o);
  if (state !== 'menu') drawCapsule();
  MG.fx.draw(x);
  if (dark && state !== 'menu') drawDark();
  for (const o of objs) if (o.kind === 'comet' || o.kind === 'side') drawWarn(o);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (const p of pops) { x.globalAlpha = Math.min(1, p.life * 2.5); x.font = F(19); x.lineWidth = 4; x.strokeStyle = 'rgba(30,15,70,.85)'; const px = clamp(p.x, 90, W - 90), py = Math.max(70 * TS(), p.y); x.strokeText(p.t, px, py); x.fillStyle = p.c; x.fillText(p.t, px, py); }
  x.globalAlpha = 1;
  if (state === 'play' && S.goT > 0) { const a = Math.min(1, S.goT * 2); x.globalAlpha = a; x.font = F(40); x.lineWidth = 6; x.strokeStyle = 'rgba(30,15,70,.85)'; const tx = 'Go! 🫧'; x.strokeText(tx, W / 2, H * 0.42); x.fillStyle = '#ffe066'; x.fillText(tx, W / 2, H * 0.42); x.globalAlpha = 1; }
  if (S.banner) { const k = S.banner.t, a = Math.min(1, k * 2, (2.2 - k) * 4), sc = easeBack(Math.min(1, (2.2 - k) * 3)); x.save(); x.globalAlpha = a; x.translate(W / 2, H * 0.38); x.scale(sc, sc); x.font = F(32); x.lineWidth = 7; x.strokeStyle = 'rgba(40,10,40,.85)'; x.strokeText(S.banner.txt, 0, 0); x.fillStyle = '#ffd0a0'; x.fillText(S.banner.txt, 0, 0); x.restore(); }
  if (state === 'play' || state === 'fail' || state === 'win') drawHUD();
  if (state === 'play' && !S.fin) drawButtons();
}

// =====================================================================
// flow
// =====================================================================
function setLevel(n) { const old = LV; level = clamp(n | 0, 1, LEVELS.length); LV = LEVELS[level - 1]; bgK = ''; if (old.w !== LV.w) amb = []; }
function showNews() {
  const all = newsOf(), fresh = all.filter(k => !MG.store.get('meteor.seen.' + k, false)).slice(0, 3);
  if (!fresh.length) return;
  fresh.forEach(k => MG.store.set('meteor.seen.' + k, true));
  MG.sfx('sparkle'); ptrs.clear();
  MG.panel({ title: fresh.map(k => NEWS[k][1]).join('＋'), html: fresh.map(k => `<div class="mt-new"><b class="ic">${NEWS[k][0]}</b><p>${NEWS[k][2]}</p></div>`).join(''), buttons: [{ label: '出發！', on: () => { MG.hide(); S.goT = 1.4; } }] });
}
function start(m, lv) {
  if (m) mode = m; if (lv) setLevel(lv);
  endless = false; reset(); state = 'play'; MG.hide(); bgK = '';
  MG.sfx('jump');
  showNews();
}
function startEndless(m) {
  if (!m) { const b = document.querySelector('.mg-opt[data-mode][aria-pressed=true]'); m = b ? b.dataset.mode : mode; }
  mode = m; MG.store.set('meteor.pickMode', m);
  endless = true; reset(); state = 'play'; MG.hide(); bgK = ''; amb = [];
  MG.sfx('jump');
  showNews();
}
const rating = () => S.hits <= 1 ? 3 : S.hits <= 3 ? 2 : 1;
const best = () => { const b = MG.store.get('meteor.best', []); return Array.isArray(b) ? b : []; };
function showWin() {
  if (state !== 'play') return;
  state = 'win';
  const b = best(), r = rating(), old = b[level - 1] || 0;
  if (r > old) { b[level - 1] = r; MG.store.set('meteor.best', b); }
  MG.record('meteor', best().reduce((a, v) => a + (v || 0), 0));
  const next = level < LEVELS.length ? LEVELS[level] : null, Wd = WORLDS[LV.w];
  const worldDone = !next || next.w !== LV.w;
  MG.panel({
    title: `第 ${level} 關過關！`,
    html: `<div class="mt-stars">${'★'.repeat(r)}<i>${'★'.repeat(3 - r)}</i></div><p>${lvIc(LV)} ${LV.nm}：飛到${Wd.nm}了 ^_^</p><p>⭐ ${S.stars} 顆星星・😎 Whoosh ${S.whoosh} 次${S.hits ? `・撞到 ${S.hits} 次` : '・一次都沒撞到！'}</p>` +
      (r > old && old ? '<p class="new">比上次更棒！</p>' : '') +
      (next ? (worldDone ? `<p>下一站：${WORLDS[next.w].ic} ${WORLDS[next.w].nm}！</p>` : `<p>下一關：${lvIc(next)} ${next.nm}</p>`) : '<p>噗噗平安回到家了！你是躲隕石大英雄！🏆</p>'),
    buttons: [...(next ? [{ label: '下一關', on: () => { MG.store.set('meteor.pickLevel', level + 1); start(null, level + 1); } }] : []), { label: '再玩一次', alt: !!next, on: () => start() }, { label: '選關卡', alt: true, on: menu }],
  });
}
function lvLabel(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n} ${lvIc(L)} ${L.nm}　${'★'.repeat(b)}${'☆'.repeat(3 - b)}`; }
function lvShort(n) { const L = LEVELS[n - 1], b = best()[n - 1] || 0; return `${n}${L.mk || ''}<small>${'★'.repeat(b)}${'☆'.repeat(3 - b)}</small>`; }
function menu() {
  state = 'menu'; ptrs.clear(); endless = false;
  if (!S) reset();
  const eb = MG.store.get('meteor.endless', 0);
  MG.choose({
    id: 'meteor', title: '噗噗躲隕石', levelsTitle: '選一關',
    html: '<p>噗噗坐著泡泡船要回家！<b>手指按住畫面左右拖</b>，躲開愛睏的隕石，一路飛到前面的星球就過關。擦過隕石還會 Whoosh 😎！</p><p class="mt-route">🌙 月亮 → 🔴 火星 → ❄️ 冰冰星 → 🪐 大環星 → 🌌 彩虹星雲 → 🏡 噗噗星</p><p>🆕 第 37 關起：👆 用手指點隕石變星星、🌟 收集星星回家！</p>',
    modesTitle: '想怎麼玩？',
    modes: [{ id: 'slow', label: '🐢 慢慢玩', sub: '慢一點，撞到只掉 1 顆星' }, { id: 'chal', label: '⭐ 挑戰', sub: '快一點，有 3 顆愛心' }],
    levels: { count: LEVELS.length, max: LEVELS.length, label: lvLabel, short: lvShort, fresh: n => n >= 37 },
    keys: '手指按住左右拖，或按住 ◀ ▶　電腦：<kbd>←</kbd><kbd>→</kbd>',
    extra: [{ label: `♾️ 無限躲躲${eb ? `（最久 ${eb} 秒）` : ''}`, alt: true, on: () => startEndless() }],
    playing: () => state === 'play',
    onPause: () => { ptrs.clear(); keys.clear(); },
    restore: () => { ptrs.clear(); keys.clear(); },
    start: (m, lv) => start(m, lv),
  });
}
setLevel(Math.min(MG.store.get('meteor.pickLevel', 1), LEVELS.length));
reset(); menu();
MG.loop(dt => {
  if (state === 'play' && !MG.panelOpen()) update(dt);
  else { t += dt; MG.fx.step(dt); updAmb(dt); for (const p of pops) { p.y -= 34 * dt; p.life -= dt; } pops = pops.filter(p => p.life > 0); if (state === 'menu' && S) S.dist += 40 * dt; }
  draw();
});

// =====================================================================
// hook for automated tests (+ an autopilot that dodges, used to check every level can be survived)
// =====================================================================
window.METEORT = {
  get state() { return state; }, get level() { return level; }, get mode() { return mode; }, levels: LEVELS.length, get endless() { return endless; },
  get p() { return S.p; }, get hits() { return S.hits; }, get hearts() { return S.hearts; }, get stars() { return S.stars; }, get whoosh() { return S.whoosh; }, get t() { return S.t; },
  get wave() { return S.wave && S.wave.ty; }, get storm() { return S.storm; },
  set seed(v) { testSeed = v; }, setHero: h => MG.setHero(h),
  cap: () => ({ x: C.x, tx: C.tx, y: capY(), shield: C.shield, shrink: C.shrink, slow: C.slow, sc: C.sc }),
  objs: () => objs.map(o => ({ kind: o.kind, x: o.x, y: o.y, r: o.r, t: o.t, what: o.what })),
  layout: () => ({ W, H, land, capY: capY(), btnL: btnPos(-1), btnR: btnPos(1) }),
  start: (lv, m = 'slow') => start(m, lv), endlessStart: (m = 'slow') => startEndless(m), menu: () => menu(),
  spawn(ty) { if (!S.wave || S.wave.ty !== ty) { S.wave = { ty, t: WAVE_T[ty], age: 0, acc: 0.99, gc: W / 2, gs: -1, n: 0 }; } },
  pow: what => addPow(what),
  aim() { const o = C.tx; pilot(); const r = C.tx; C.tx = o; return r; },
  win: () => { S.p = 1; }, finish() { S.p = 1; beginFinish(); for (let i = 0; i < 300 && state === 'play'; i++) update(1 / 30); },
  step(sec, dt = 1 / 60) { for (let i = 0, n = Math.round(sec / dt); i < n; i++) { if (state !== 'play') break; update(dt); } },
  bench(n = 60) { const t0 = performance.now(); for (let i = 0; i < n; i++) { update(1 / 60); draw(); } x.getImageData(0, 0, 1, 1); return (performance.now() - t0) / n; },
  auto(sec, dt = 1 / 30) {
    for (let i = 0, n = Math.round(sec / dt); i < n && state === 'play'; i++) { pilot(); if (LV.zap && i % 12 === 0) { const o = objs.find(q => q.haz && !q.dead && q.t > 0 && q.kind !== 'comet' && q.y > 40 && q.y < capY() - 60); if (o) zap(o); } update(dt); }
    return { state, p: S.p, hits: S.hits, hearts: S.hearts, stars: S.stars, whoosh: S.whoosh, t: S.t };
  },
  toClient(lx, ly) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + lx * (rc.width - 2 * B) / W, y: rc.top + B + ly * (rc.height - 2 * B) / H }; },
};
// look ahead ~1.5 s: for every place the ship could go, how close would the meteors come? go where it stays clearest
function pilot() {
  if (S.fin) return;
  const cy = capY() - 4, hr = capHR(), k = S.tk, hz = objs.filter(o => o.haz && !o.dead && o.y < cy + 80);
  const vmax = 640, steps = 15, dtau = 0.1;
  const fut = hz.map(o => { const a = []; for (let s = 1; s <= steps; s++) { const tt = o.t + s * dtau * k; a.push(tt < 0 ? null : posAt(o, tt)); } return a; });
  let bx = C.x, bs = -1e9;
  for (let cx = 28; cx <= W - 28; cx += 8) {
    let mg = 80;
    for (let s = 1; s <= steps; s++) {
      const tau = s * dtau, xs = C.x + Math.sign(cx - C.x) * Math.min(Math.abs(cx - C.x), vmax * tau);
      for (let i = 0; i < hz.length; i++) { const p = fut[i][s - 1]; if (!p) continue; const dy = p[1] - cy; if (dy < -140 || dy > 60) continue; const gap = Math.hypot(p[0] - xs, dy) - hz[i].hr - hr; const w = gap + s * 1.2; if (w < mg) mg = w; }
    }
    let sc = Math.min(mg, 60) - Math.abs(cx - C.x) * 0.01 - Math.abs(cx - W / 2) * 0.006;
    for (const o of objs) if ((o.kind === 'star' || o.kind === 'pow') && o.y > cy - 220 && o.y < cy && Math.abs(o.x - cx) < 20) sc += 6;
    if (sc > bs) { bs = sc; bx = cx; }
  }
  C.tx = bx;
}
