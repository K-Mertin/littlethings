<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>噗噗畫畫板</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:radial-gradient(rgba(140,120,230,.13) 1.2px,transparent 1.4px) 0 0/20px 20px,radial-gradient(120% 80% at 10% 0%,#f4f9ff 0,transparent 60%),linear-gradient(#eef5ff,#fff0f7)}
.studio{position:fixed;inset:calc(var(--bar-h) + env(safe-area-inset-top)) 0 0 0;display:grid;gap:8px;
  padding:8px 8px max(8px,env(safe-area-inset-bottom));grid-template-rows:minmax(0,calc(100vw - 16px)) minmax(auto,1fr)}
@media (min-aspect-ratio:1/1){.studio{grid-template-rows:none;grid-template-columns:minmax(0,calc(100dvh - var(--bar-h) - env(safe-area-inset-top) - 16px - max(0px,env(safe-area-inset-bottom) - 8px))) minmax(250px,1fr)}}
.easel{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
.easel canvas{display:block;background:#fff;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 1px rgba(110,90,190,.16),0 2px 0 #e3dcf7,0 10px 24px rgba(90,70,160,.2);touch-action:none;cursor:crosshair}
.tools{min-height:0;min-width:0;display:flex;flex-direction:column;gap:7px;padding:8px;border-radius:18px;border:3px solid #e2dbf8;box-shadow:0 4px 0 #e2dbf8;
  background:radial-gradient(rgba(150,130,230,.09) 1px,transparent 1.2px) 0 0/14px 14px,#fffdfb}
.brushes{flex:1.35 1 0;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:6px}
.brushes button{position:relative;min-width:0;min-height:0;padding:0;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(#fff,#f4f1ff);
  box-shadow:inset 0 0 0 2px #e6e0fb,0 3px 0 #e6e0fb;transition:transform .12s;overflow:hidden}
.brushes button canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.brushes button[aria-pressed=true]{background:linear-gradient(#fffbe6,#fff1c2);box-shadow:inset 0 0 0 3px #ffb72b,0 3px 0 #f0a020;transform:translateY(-2px)}
.brushes button.nudge{animation:nudge .9s ease 2}
@keyframes nudge{0%,100%{transform:scale(1)}25%{transform:scale(1.14) rotate(-6deg)}50%{transform:scale(1.04)}75%{transform:scale(1.12) rotate(6deg)}}
.pal{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(9,1fr);grid-auto-rows:1fr;gap:4px}
.pal button{min-width:0;min-height:0;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;container-type:size}
.pal button i{display:block;width:min(92cqw,92cqh,64px);height:min(92cqw,92cqh,64px);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e4dcf0,0 3px 0 2px rgba(110,80,150,.16);transition:transform .12s;
  background-image:radial-gradient(circle at 33% 28%,rgba(255,255,255,.75) 0 11%,rgba(255,255,255,0) 13%),radial-gradient(circle at 45% 40%,rgba(255,255,255,.16),rgba(255,255,255,0) 50%,rgba(40,20,30,.16) 100%)}
.pal button[aria-pressed=true] i{box-shadow:0 0 0 3px #3a2f48,0 4px 8px rgba(60,40,80,.3);transform:scale(1.13)}
.acts{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.acts button{min-width:0;height:clamp(40px,6.2vh,60px);padding:0;border:0;border-radius:13px;cursor:pointer;font:800 clamp(17px,2.6vh,24px)/1 system-ui,sans-serif;color:#4a3d6a;
  background:#fff;box-shadow:inset 0 0 0 2px #e6e0fb,0 3px 0 #e6e0fb;display:flex;align-items:center;justify-content:center}
.acts button:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #e6e0fb}
.acts button[aria-pressed=true]{background:#efe8ff;box-shadow:inset 0 0 0 3px #9b7cf0,0 3px 0 #c9b8f8}
.acts .sz i{display:block;border-radius:50%;background:#4a3d6a}
.acts button:disabled{opacity:.35}
@media (min-aspect-ratio:1/1){.pal{grid-template-columns:repeat(6,1fr)}.acts{grid-template-columns:repeat(4,1fr)}.acts button{height:clamp(42px,7vh,62px)}}
@media (min-aspect-ratio:19/10){.pal{grid-template-columns:repeat(9,1fr)}.acts{grid-template-columns:repeat(8,1fr)}.brushes{grid-template-columns:repeat(10,1fr)}}
/* the start / gallery panels */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.gal button,.papers button,.stamps button{border:3px solid #e6dcf7;border-radius:14px;background:#fff;box-shadow:0 3px 0 #ece4fa;padding:3px;cursor:pointer;font:inherit;color:#5a4a7a;font-size:calc(13px * var(--ui))}
.gal img{width:100%;display:block;border-radius:9px;aspect-ratio:1}
.papers,.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.papers canvas,.stamps canvas{width:100%;display:block;border-radius:9px}
.papers button[aria-pressed=true],.stamps button[aria-pressed=true]{border-color:#ffb72b}
.view img{width:100%;max-width:340px;border-radius:14px;box-shadow:0 6px 16px rgba(80,60,140,.25)}
.mg-lv.dn{position:relative}
.mg-lv.dn{background:#e3f7e6}
.mg-lv.dn::after{content:"✓";position:absolute;top:1px;right:3px;font-size:11px;line-height:1;color:#2f9a4a;font-weight:900}
html.mg-big .acts button{font-size:clamp(20px,3vh,28px)}
html.mg-big .brushes button{box-shadow:inset 0 0 0 2px #a99ad6,0 3px 0 #a99ad6}
html.mg-big .pal button i{box-shadow:0 0 0 2px #7d6e98}
</style>
</head>
<body>
<div class="studio">
  <div class="easel"><canvas id="cv" aria-label="畫畫紙"></canvas></div>
  <section class="tools" aria-label="畫筆和顏色">
    <div class="brushes" id="brushes"></div>
    <div class="pal" id="pal"></div>
    <div class="acts" id="acts">
      <button type="button" class="sz" data-sz="0" aria-label="細"><i style="width:8px;height:8px"></i></button>
      <button type="button" class="sz" data-sz="1" aria-label="中"><i style="width:14px;height:14px"></i></button>
      <button type="button" class="sz" data-sz="2" aria-label="粗"><i style="width:22px;height:22px"></i></button>
      <button type="button" id="undo" aria-label="復原">↶</button>
      <button type="button" id="redo" aria-label="重做">↷</button>
      <button type="button" id="mir" aria-label="對稱畫">🦋</button>
      <button type="button" id="paper" aria-label="換紙">📄</button>
      <button type="button" id="gal" aria-label="我的畫冊">🖼</button>
    </div>
  </section>
</div>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'draw', title: '噗噗畫畫板', stats: ['level'] });
const cv = document.getElementById('cv'), x = cv.getContext('2d');
// picture space 600×600; every layer is a fixed 1200×1200 bitmap so drawings look the same on every screen
const S = 600, K = 2, PX = S * K;
const refit = MG.fit(cv, S, S);
try { new ResizeObserver(() => refit()).observe(cv.parentElement); } catch {}
function layer() { const c = document.createElement('canvas'); c.width = c.height = PX; const g = c.getContext('2d'); g.setTransform(K, 0, 0, K, 0, 0); g.lineCap = 'round'; g.lineJoin = 'round'; return [c, g]; }
const wipeL = g => { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, PX, PX); g.restore(); };
const [paperC, paperX] = layer(), [inkC, inkX] = layer(), [tmpC, tmpX] = layer();
let actorC = null, actorX = null, lineC = null, lineX = null, actorOn = false, lineOn = false;
function useActor() { if (!actorC) [actorC, actorX] = layer(); wipeL(actorX); actorOn = true; return actorX; }
function useLine() { if (!lineC) [lineC, lineX] = layer(); wipeL(lineX); lineOn = true; return lineX; }

// ---------- small helpers ----------
const RNG = s => () => { s = s + 0x6D2B79F5 | 0; let q = Math.imul(s ^ s >>> 15, 1 | s); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; };
const hexRGB = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (h, h2, a) => { const p = hexRGB(h), q = hexRGB(h2); return `rgb(${p.map((v, i) => Math.round(v + (q[i] - v) * a)).join(',')})`; };
const dark = (h, a = 0.4) => mix(h, '#1d1428', a), light = (h, a = 0.5) => mix(h, '#ffffff', a);
const lum = h => { const [r, g, b] = hexRGB(h); return (r * 0.3 + g * 0.59 + b * 0.11) / 255; };
const dist = (a, b, c, d) => Math.hypot(a - c, b - d);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const INK = '#3a2a48';

// ---------- smooth strokes (quadratic curves through the midpoints) ----------
function tracePath(c, p) {
  const n = p.length >> 1; c.beginPath(); c.moveTo(p[0], p[1]);
  if (n === 1) { c.lineTo(p[0] + 0.01, p[1]); return; }
  for (let i = 1; i < n - 1; i++) { const x1 = p[i * 2], y1 = p[i * 2 + 1], x2 = p[i * 2 + 2], y2 = p[i * 2 + 3]; c.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2); }
  c.lineTo(p[n * 2 - 2], p[n * 2 - 1]);
}
function samplePts(p, step = 3) {
  const n = p.length >> 1, out = [[p[0], p[1]]]; if (n === 1) return out;
  let cx = p[0], cy = p[1];
  const seg = (qx, qy, ex, ey) => { const L = Math.hypot(qx - cx, qy - cy) + Math.hypot(ex - qx, ey - qy), k = Math.max(1, Math.ceil(L / step));
    for (let j = 1; j <= k; j++) { const u = j / k, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), d = u * u; out.push([a * cx + b * qx + d * ex, a * cy + b * qy + d * ey]); } cx = ex; cy = ey; };
  for (let i = 1; i < n - 1; i++) { const x1 = p[i * 2], y1 = p[i * 2 + 1], x2 = p[i * 2 + 2], y2 = p[i * 2 + 3]; seg(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2); }
  const lx = p[n * 2 - 2], ly = p[n * 2 - 1]; seg((cx + lx) / 2, (cy + ly) / 2, lx, ly);
  return out;
}
// keep stored strokes small: drop points that sit on a straight-enough line (Ramer–Douglas–Peucker)
function simplify(p, eps = 0.7) {
  const n = p.length >> 1; if (n < 3) return p.map(Math.round);
  const keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1; const st = [[0, n - 1]];
  while (st.length) { const [a, b] = st.pop(); let md = 0, mi = -1; const ax = p[a * 2], ay = p[a * 2 + 1], bx = p[b * 2], by = p[b * 2 + 1], L = Math.hypot(bx - ax, by - ay) || 1;
    for (let i = a + 1; i < b; i++) { const d = Math.abs((bx - ax) * (ay - p[i * 2 + 1]) - (ax - p[i * 2]) * (by - ay)) / L; if (d > md) { md = d; mi = i; } }
    if (md > eps) { keep[mi] = 1; st.push([a, mi], [mi, b]); } }
  const out = []; for (let i = 0; i < n; i++) if (keep[i]) out.push(Math.round(p[i * 2] * 2) / 2, Math.round(p[i * 2 + 1] * 2) / 2); return out;
}
const mirP = p => p.map((v, i) => i % 2 ? v : S - v);

// ---------- brushes ----------
const BR = {
  crayon: { w: [7, 13, 22], snd: 'tick', every: 70 }, marker: { w: [9, 17, 28], snd: 'tick', every: 90 }, rainbow: { w: [8, 14, 22], snd: 'perfect', every: 160 },
  glitter: { w: [7, 11, 17], snd: 'sparkle', every: 130 }, spray: { w: [14, 24, 38], snd: 'whoosh', every: 150 }, neon: { w: [6, 10, 15], snd: 'tick', every: 90 },
  magic: { w: [10, 14, 20], snd: 'sparkle', every: 110 }, stamp: { w: [22, 34, 50] }, fill: { w: [0, 0, 0] }, eraser: { w: [16, 30, 58], snd: 'step', every: 80 },
};
const TOOLS = ['crayon', 'marker', 'rainbow', 'glitter', 'spray', 'neon', 'magic', 'stamp', 'fill', 'eraser'];
const TOOL_NAME = { crayon: '蠟筆', marker: '麥克筆', rainbow: '彩虹筆', glitter: '亮粉筆', spray: '噴漆', neon: '霓虹筆', magic: '魔法筆', stamp: '印章', fill: '倒顏色', eraser: '橡皮擦' };
const STAMPS = ['star', 'heart', 'flower', 'cat', 'fish', 'bird', 'bunny', 'butterfly'];
// crayon grain: speckles cut out of the stroke (never more than half, so the bucket still sees crayon lines as walls)
const GRAIN = (() => { const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d'), im = g.createImageData(96, 96), d = im.data, r = RNG(7);
  for (let i = 0; i < d.length; i += 4) { const v = r(); d[i + 3] = v < 0.45 ? 0 : Math.round(((v - 0.45) / 0.55) ** 2 * 0.55 * 255); }
  g.putImageData(im, 0, 0); return tmpX.createPattern(c, 'repeat'); })();
function viaTmp(c, fn, alpha) {
  tmpX.setTransform(1, 0, 0, 1, 0, 0); tmpX.globalAlpha = 1; tmpX.globalCompositeOperation = 'source-over'; tmpX.clearRect(0, 0, PX, PX); tmpX.setTransform(K, 0, 0, K, 0, 0);
  tmpX.lineCap = 'round'; tmpX.lineJoin = 'round'; tmpX.save(); fn(tmpX); tmpX.restore();
  c.save(); c.globalAlpha *= alpha; c.drawImage(tmpC, 0, 0, S, S); c.restore();
}
function bbox(p, pad) { let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]); } return [x0 - pad, y0 - pad, x1 - x0 + pad * 2, y1 - y0 + pad * 2]; }
function twinkleAt(c, X, Y, s) { c.beginPath(); c.moveTo(X, Y - s); c.quadraticCurveTo(X, Y, X + s, Y); c.quadraticCurveTo(X, Y, X, Y + s); c.quadraticCurveTo(X, Y, X - s, Y); c.quadraticCurveTo(X, Y, X, Y - s); c.fill(); }
function renderStroke(c, e, p, tt = 0) {
  const w = e.w, col = e.c;
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  switch (e.b) {
    case 'crayon': viaTmp(c, g => { g.strokeStyle = col; g.lineWidth = w; tracePath(g, p); g.stroke();
      const [bx, by, bw, bh] = bbox(p, w); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'destination-out'; g.fillStyle = GRAIN; g.fillRect(bx * K, by * K, bw * K, bh * K); }, 1); break;
    case 'marker': viaTmp(c, g => { g.strokeStyle = col; g.lineWidth = w; tracePath(g, p); g.stroke(); g.translate(-w * 0.16, -w * 0.18); g.strokeStyle = 'rgba(255,255,255,.25)'; g.lineWidth = w * 0.26; tracePath(g, p); g.stroke(); }, 0.8); break;
    case 'rainbow': {
      const s = samplePts(p, 2.5); let d = 0; const h0 = (e.sd || 0) % 360; c.lineWidth = w;
      if (s.length === 1) { c.fillStyle = `hsl(${h0} 92% 60%)`; c.beginPath(); c.arc(s[0][0], s[0][1], w / 2, 0, 7); c.fill(); }
      for (let i = 1; i < s.length; i++) { c.strokeStyle = `hsl(${(h0 + d * 1.1) % 360} 92% 60%)`; c.beginPath(); c.moveTo(s[i - 1][0], s[i - 1][1]); c.lineTo(s[i][0], s[i][1]); c.stroke(); d += dist(s[i - 1][0], s[i - 1][1], s[i][0], s[i][1]); }
      c.translate(-w * 0.15, -w * 0.18); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = w * 0.22; tracePath(c, p); c.stroke(); break; }
    case 'glitter': {
      c.strokeStyle = col; c.lineWidth = w; tracePath(c, p); c.stroke();
      const r = RNG(e.sd || 1), s = samplePts(p, 4), lc = light(col, 0.7);
      s.forEach(([px, py], k) => {
        for (let j = 0; j < 2; j++) { const ox = (r() - 0.5) * w * 1.1, oy = (r() - 0.5) * w * 1.1, rad = 0.6 + r() * 1.3, wh = r() < 0.55; c.globalAlpha = 0.65 + r() * 0.35; c.fillStyle = wh ? '#fff' : lc; c.beginPath(); c.arc(px + ox, py + oy, rad, 0, 7); c.fill(); }
        const tw = r(); if (k % 6 === 3) { c.globalAlpha = 1; c.fillStyle = '#fff'; twinkleAt(c, px + (r() - 0.5) * w, py + (r() - 0.5) * w, w * (0.4 + tw * 0.35)); }
      });
      c.globalAlpha = 1; c.translate(-w * 0.15, -w * 0.18); c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = w * 0.22; tracePath(c, p); c.stroke(); break; }
    case 'spray': {
      const r = RNG(e.sd || 1), s = samplePts(p, 3), R = w, rep = s.length < 3 ? 6 : 1; c.fillStyle = col;
      for (let q = 0; q < rep; q++) for (const [px, py] of s) for (let j = 0; j < 9; j++) { const a = r() * 6.283, d = R * Math.sqrt(r()), sz = 0.9 + r() * 1.4; c.globalAlpha = 0.3 + r() * 0.5; c.fillRect(px + Math.cos(a) * d - sz / 2, py + Math.sin(a) * d - sz / 2, sz, sz); }
      break; }
    case 'neon': {
      const sc = Math.abs(c.getTransform().a) || 1;
      c.shadowColor = col; c.shadowBlur = w * 2.4 * sc; c.strokeStyle = col; c.lineWidth = w; tracePath(c, p); c.stroke();
      c.shadowBlur = w * 1.1 * sc; c.strokeStyle = light(col, 0.5); c.lineWidth = w * 0.55; c.stroke();
      c.shadowBlur = 0; c.strokeStyle = 'rgba(255,255,255,.92)'; c.lineWidth = w * 0.22; c.stroke(); break; }
    case 'eraser': c.globalCompositeOperation = 'destination-out'; c.strokeStyle = '#000'; c.lineWidth = w; tracePath(c, p); c.stroke(); break;
    case 'magic': {   // only while drawing: a shimmering trail of rainbow sparkles
      const s = samplePts(p, 7);
      s.forEach(([px, py], i) => { c.fillStyle = `hsl(${(i * 24 + tt * 260) % 360} 90% 62%)`; c.beginPath(); c.arc(px, py, w * 0.42, 0, 7); c.fill(); });
      c.fillStyle = '#fff'; s.forEach(([px, py], i) => { if (i % 3 === 0) twinkleAt(c, px, py, w * 0.45 * (0.7 + 0.3 * Math.sin(tt * 9 + i))); });
      break; }
  }
  c.restore();
}
function renderRoad(c, p) {
  c.save(); c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = '#4a4b5e'; c.lineWidth = 32; tracePath(c, p); c.stroke();
  c.strokeStyle = '#6e7086'; c.lineWidth = 26; c.stroke();
  c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 6; c.translate(-3, -5); c.stroke(); c.translate(3, 5);
  c.setLineDash([12, 13]); c.strokeStyle = '#ffe066'; c.lineWidth = 3.4; c.stroke(); c.restore();
}

// ---------- stamps (drawn in the chosen colour) ----------
function miniFace(c, fy, s, eyeCol = INK) {
  c.fillStyle = eyeCol; for (const sd of [-1, 1]) { c.beginPath(); c.ellipse(sd * s * 0.32, fy, s * 0.09, s * 0.12, 0, 0, 7); c.fill(); }
  c.fillStyle = '#fff'; for (const sd of [-1, 1]) { c.beginPath(); c.arc(sd * s * 0.32 - s * 0.03, fy - s * 0.05, s * 0.035, 0, 7); c.fill(); }
  c.strokeStyle = eyeCol; c.lineWidth = Math.max(1.2, s * 0.07); c.beginPath(); c.arc(0, fy + s * 0.1, s * 0.16, 0.3, Math.PI - 0.3); c.stroke();
  c.fillStyle = 'rgba(255,110,140,.45)'; for (const sd of [-1, 1]) { c.beginPath(); c.ellipse(sd * s * 0.55, fy + s * 0.12, s * 0.12, s * 0.07, 0, 0, 7); c.fill(); }
}
function heartPath(c, s) { c.beginPath(); c.moveTo(0, s * 0.9); c.bezierCurveTo(-s * 1.5, -s * 0.1, -s * 0.7, -s * 1.15, 0, -s * 0.45); c.bezierCurveTo(s * 0.7, -s * 1.15, s * 1.5, -s * 0.1, 0, s * 0.9); c.closePath(); }
function starPath(c, R, r, n = 5) { c.beginPath(); for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; c.lineTo(Math.cos(a) * q, Math.sin(a) * q); } c.closePath(); }
function drawStamp(c, k, X, Y, r, col, a = 0) {
  if (!(r > 2)) return;
  const o = dark(col, 0.45), lw = Math.max(1.6, r * 0.09), eye = lum(col) < 0.25 ? '#fff' : INK;
  c.save(); c.translate(X, Y); c.rotate(a); c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = lw; c.strokeStyle = o; c.fillStyle = col;
  const shine = (sx, sy, rx, ry, rot = -0.6) => { c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.ellipse(sx, sy, rx, ry, rot, 0, 7); c.fill(); };
  switch (k) {

    return out;
  },
  toClient(px, py) { const rc = cv.getBoundingClientRect(), B = 3; return { x: rc.left + B + px * (rc.width - 2 * B) / S, y: rc.top + B + py * (rc.height - 2 * B) / S }; },
  win() { if (state === 'play') { for (const g of L.goals) g.done = true; win(); } },
  gallery: () => MG.store.get(GKEY, []).length, saveGallery: () => saveGallery(),
};
</script>
