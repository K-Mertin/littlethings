<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>翻翻記憶</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:radial-gradient(ellipse at 50% 40%,#3f9c5e 0%,#2f7d49 55%,#235f38 100%)}
body.game::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.2px),radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
#board{display:grid;gap:var(--gap);touch-action:manipulation;position:relative}
.card{position:relative;width:var(--cw,var(--cs));height:var(--ch,var(--cs));perspective:700px;cursor:pointer;border:0;padding:0;background:none;transition:transform .15s}
@media (hover:hover){.card:not(.up):not(.done):hover{transform:translateY(-3px)}}
.card .in{position:absolute;inset:0;transition:transform .36s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .b{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3Cpattern%20id%3D%22p%22%20width%3D%2212%22%20height%3D%2212%22%20patternUnits%3D%22userSpaceOnUse%22%20patternTransform%3D%22rotate%2845%29%22%3E%3Crect%20width%3D%2212%22%20height%3D%2212%22%20fill%3D%22%234c88dd%22/%3E%3Crect%20width%3D%226%22%20height%3D%2212%22%20fill%3D%22%235a96ea%22/%3E%3C/pattern%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%22.38%22%20cy%3D%22.3%22%20r%3D%22.75%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c8ffc9%22/%3E%3Cstop%20offset%3D%22.45%22%20stop-color%3D%22%236fdc83%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232a9447%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22url%28%23p%29%22/%3E%3Crect%20x%3D%227%22%20y%3D%227%22%20width%3D%2286%22%20height%3D%2286%22%20rx%3D%229%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.75%22%20stroke-width%3D%222.5%22%20stroke-dasharray%3D%221%205%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2227%22%20fill%3D%22%232a5cab%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2227%22%20fill%3D%22none%22%20stroke%3D%22%23ffd25a%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M31%2062%20C29%2044%2038%2033%2050%2033%20C62%2033%2071%2044%2069%2062%20Q50%2070%2031%2062Z%22%20fill%3D%22url%28%23g%29%22%20stroke%3D%22%231f6e35%22%20stroke-width%3D%222%22/%3E%3Cellipse%20cx%3D%2255%22%20cy%3D%2230%22%20rx%3D%226%22%20ry%3D%223%22%20fill%3D%22%23ffd25a%22%20stroke%3D%22%23b86d00%22%20stroke-width%3D%221.2%22%20transform%3D%22rotate%28-25%2055%2030%29%22/%3E%3Cellipse%20cx%3D%2242%22%20cy%3D%2249%22%20rx%3D%222.2%22%20ry%3D%223.2%22%20fill%3D%22%2318261a%22/%3E%3Cellipse%20cx%3D%2258%22%20cy%3D%2249%22%20rx%3D%222.2%22%20ry%3D%223.2%22%20fill%3D%22%2318261a%22/%3E%3Cpath%20d%3D%22M45%2056%20Q50%2061%2055%2056%22%20fill%3D%22none%22%20stroke%3D%22%2318261a%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2242%22%20rx%3D%224%22%20ry%3D%222.2%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22%20transform%3D%22rotate%28-35%2040%2042%29%22/%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2214%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3Ccircle%20cx%3D%2286%22%20cy%3D%2214%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2286%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3Ccircle%20cx%3D%2286%22%20cy%3D%2286%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3C/svg%3E") center/cover,#4c88dd;border:3px solid #fff;box-shadow:0 5px 0 #1d4f9e,0 8px 14px rgba(0,0,0,.35)}
.card .b::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 40%)}
.card .f{transform:rotateY(180deg);background:radial-gradient(circle at 50% 38%,#ffffff 0%,#fff8e6 60%,#f6e7c2 100%);border:3px solid #fff;
  box-shadow:0 5px 0 #c9a95a,0 8px 14px rgba(0,0,0,.3),inset 0 0 0 4px #f1dfb2;font-size:calc(var(--cs) * .56);line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card .f span{filter:drop-shadow(0 3px 2px rgba(80,50,10,.25));transform:translateY(-2%)}
.card .f::before,.card .f::after{content:"✿";position:absolute;font:calc(var(--cs) * .13) system-ui,sans-serif;color:#e2c787}
.card .f::before{top:6%;left:9%}.card .f::after{bottom:6%;right:9%}
.card.done .f{background:radial-gradient(circle at 50% 38%,#ffffff 0%,#eaffde 60%,#c9f0b4 100%);box-shadow:0 5px 0 #3aa85a,0 8px 14px rgba(0,0,0,.3),inset 0 0 0 4px #b8e8a0}
.card.done .f::before,.card.done .f::after{color:#7fcf8f}
.card.done{animation:yay .45s ease}
.card.done .in::after{content:"";position:absolute;inset:-12%;border-radius:50%;pointer-events:none;transform:rotateY(180deg);
  background:radial-gradient(circle,rgba(255,255,200,.9) 0%,rgba(255,240,150,.4) 35%,rgba(255,240,150,0) 65%);animation:glow .6s ease-out forwards}
.card.bad .f{background:radial-gradient(circle at 50% 38%,#fff 0%,#ffe9e6 70%,#ffd0ca 100%);box-shadow:0 5px 0 #e0645a,0 8px 14px rgba(0,0,0,.3),inset 0 0 0 4px #ffc2ba}
.card.bad .in{animation:shake .3s ease}
.card:focus-visible{outline:3px solid #ffd25a;outline-offset:4px;border-radius:14px}
.spark{position:absolute;pointer-events:none;font:16px system-ui,sans-serif;color:#ffe066;text-shadow:0 0 6px #fff6b0;animation:spark .7s ease-out forwards;z-index:5}
@keyframes yay{40%{transform:scale(1.14) rotate(-3deg)}70%{transform:scale(.97)}}
@keyframes glow{from{opacity:1;transform:rotateY(180deg) scale(.6)}to{opacity:0;transform:rotateY(180deg) scale(1.3)}}
@keyframes shake{20%,60%{translate:-4px 0}40%,80%{translate:4px 0}}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}.card.done,.card.bad .in,.spark{animation:none}}
.word{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;font:900 clamp(20px,calc(var(--cs) * .32),34px) system-ui,"Noto Sans TC",sans-serif;color:#ffe066;
  -webkit-text-stroke:1.5px #7a4a00;paint-order:stroke fill;text-shadow:0 3px 0 #7a4a00,0 0 10px rgba(255,255,255,.7);animation:word .9s ease-out forwards}
.word.miss{color:#fff;-webkit-text-stroke:1.5px #3a6a9a;text-shadow:0 3px 0 #3a6a9a;font-size:clamp(16px,calc(var(--cs) * .24),26px)}
@keyframes word{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}35%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
@media (prefers-reduced-motion:reduce){.word{animation:none;opacity:1}}
.sizes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.sizes .mg-btn{min-width:96px;font-size:16px}
.sizes small{display:block;font-weight:400;font-size:12px;opacity:.85}
/* 👓 大字模式: bigger words, thicker card edges, stronger contrast */
html.mg-big .card .f{font-size:calc(var(--cs) * .62);border-width:4px}
html.mg-big .card .b{border-width:4px}
html.mg-big .card .f::before,html.mg-big .card .f::after{color:#c9a95a}
html.mg-big .word{font-size:clamp(26px,calc(var(--cs) * .38),44px);-webkit-text-stroke:2px #5a3500}
html.mg-big .word.miss{font-size:clamp(22px,calc(var(--cs) * .3),34px);-webkit-text-stroke:2px #1f4a7a}
html.mg-big .sizes .mg-btn{font-size:20px;min-width:110px}
html.mg-big .sizes small{font-size:15px;opacity:1}
</style>
</head>
<body>
<main class="mg-stage"><div id="board" role="grid" aria-label="翻牌"></div></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'memory', title: '翻翻記憶', stats: ['moves', 'time'] });
const SETS = ['🐶', '🐱', '🐰', '🦊', '🐼', '🐸', '🐵', '🐧', '🐙', '🦁', '🐷', '🐨', '🦄', '🐢', '🐝', '🐳', '🦉', '🐞'];
const SIZES = { easy: { pairs: 6, label: '簡單', note: '12 張' }, normal: { pairs: 10, label: '普通', note: '20 張' }, hard: { pairs: 15, label: '困難', note: '30 張' } };
const board = document.getElementById('board'), stage = board.parentElement;
let size = 'easy', cards = [], open = [], moves = 0, matched = 0, time = 0, state = 'ready', lock = false, streak = 0, lastWord = '';

function layout() {
  const n = SIZES[size].pairs * 2, st = getComputedStyle(stage);
  // the card size comes from the screen: the grid fills the stage, cards may be a little taller or wider than square
  const aw = stage.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
  const ah = stage.clientHeight - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom) - 5;   // room for the card shadow
  const gap = Math.round(Math.max(6, Math.min(16, Math.min(aw, ah) * 0.018)));
  // try every column count and keep the one that gives the biggest picture (and then the most covered area)
  let best = null;
  for (let c = 2; c <= n; c++) {
    const r = Math.ceil(n / c); if (r * c - n >= c) continue;
    let cw = (aw - gap * (c - 1)) / c, ch = (ah - gap * (r - 1)) / r;
    ch = Math.min(ch, cw * 1.5); cw = Math.min(cw, ch * 1.5);
    const score = Math.min(cw, ch) * Math.sqrt(c * cw * r * ch / (aw * ah));   // picture size, nudged towards covering more of the stage
    if (!best || score > best.score) best = { score, c, cw: Math.floor(cw), ch: Math.floor(ch) };
  }
  const cs = Math.min(best.cw, best.ch);
  board.style.setProperty('--cs', cs + 'px');
  board.style.setProperty('--cw', best.cw + 'px');
  board.style.setProperty('--ch', best.ch + 'px');
  board.style.setProperty('--gap', gap + 'px');
  board.style.gridTemplateColumns = `repeat(${best.c}, ${best.cw}px)`;
}
addEventListener('resize', layout);

function deal() {
  const pairs = SIZES[size].pairs;
  const faces = MG.shuffle(MG.shuffle([...SETS]).slice(0, pairs).flatMap(f => [f, f]));
  board.innerHTML = '';
  cards = faces.map((f, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.setAttribute('aria-label', '蓋著的牌');
    b.innerHTML = `<div class="in"><div class="b"></div><div class="f"><span>${f}</span></div></div>`;
    b.onclick = () => flip(i);
    board.append(b);
    return { el: b, face: f, up: false, done: false };
  });
  open = []; moves = 0; matched = 0; time = 0; lock = false; streak = 0;
  layout(); hud();
}
function hud() { MG.stat('moves', `${moves} 步`); MG.stat('time', `⏱ ${fmt(time)}`); }
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function flip(i) {
  const c = cards[i];
  if (state !== 'play' || lock || c.up || c.done) return;
  c.up = true; c.el.classList.add('up'); c.el.setAttribute('aria-label', c.face); MG.sfx('flip');
  open.push(c);
  if (open.length < 2) return;
  moves++; hud();
  const [a, b] = open;
  if (a.face === b.face) {
    a.done = b.done = true; open = []; streak++;
    const st = streak, last = matched + 1 === SIZES[size].pairs;
    setTimeout(() => {
      a.el.classList.add('done'); b.el.classList.add('done'); sparks(a.el); sparks(b.el);
      // layered match sound: rises with the streak of pairs found in a row
      MG.sfx('match', st); if (st >= 2) MG.sfx('combo', st); else MG.sfx('sparkle');
      word(a.el, b.el, last ? MG.WORDS.clear : st >= 2 ? MG.WORDS.combo(st) : MG.praise(1 + (matched % 3)));
    }, 180);
    matched++;
    if (matched === SIZES[size].pairs) win();
  } else {
    lock = true; streak = 0;
    setTimeout(() => { a.el.classList.add('bad'); b.el.classList.add('bad'); MG.sfx('miss'); word(a.el, b.el, MG.WORDS.oops, true); }, 260);
    setTimeout(() => {
      for (const q of [a, b]) { q.up = false; q.el.classList.remove('up', 'bad'); q.el.setAttribute('aria-label', '蓋著的牌'); }
      open = []; lock = false;
    }, 850);
  }
}
function sparks(el) {
  const r = el.getBoundingClientRect(), br = board.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const sp = document.createElement('span'); sp.className = 'spark'; sp.textContent = i % 2 ? '✦' : '★';
    const a = i / 6 * Math.PI * 2, d = r.width * 0.6;
    sp.style.left = (r.left - br.left + r.width / 2 - 8) + 'px'; sp.style.top = (r.top - br.top + r.height / 2 - 10) + 'px';
    sp.style.setProperty('--dx', Math.cos(a) * d + 'px'); sp.style.setProperty('--dy', Math.sin(a) * d + 'px');
    board.append(sp); setTimeout(() => sp.remove(), 750);
  }
}
// a short English + emoji word that pops up between the two cards
function word(e1, e2, text, miss = false) {
  const r1 = e1.getBoundingClientRect(), r2 = e2.getBoundingClientRect(), br = board.getBoundingClientRect();
  const w = document.createElement('span'); w.className = 'word' + (miss ? ' miss' : ''); w.textContent = text; lastWord = text;
  board.append(w);
  // keep it inside the board horizontally
  const cx = (r1.left + r1.right + r2.left + r2.right) / 4 - br.left, half = w.offsetWidth / 2 + 4;
  w.style.left = Math.max(half, Math.min(br.width - half, cx)) + 'px';
  w.style.top = ((r1.top + r1.bottom + r2.top + r2.bottom) / 4 - br.top) + 'px';
  setTimeout(() => w.remove(), 950);
}
function win() {
  state = 'over';
  const key = 'memory.' + size, rec = MG.record(key, Math.round(time * 10) / 10, true);
  const mv = MG.record('memory.moves.' + size, moves, true);
  setTimeout(() => {
    MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
    MG.panel({
      title: '全部配對完成！',
      html: `<div class="big">${fmt(time)}</div><p>${SIZES[size].label}　${moves} 步</p>` +
        (rec.isNew ? `<p class="new">最快紀錄！^_^</p>` : `<p>最快：${fmt(rec.best)}</p>`) + (mv.isNew && !rec.isNew ? `<p class="new">最少步數紀錄！</p>` : ''),
      buttons: [{ label: '再玩一次', on: () => start(size) }, { label: '換難度', alt: true, on: menu }, { label: '回遊戲區', alt: true, on: () => location.href = 'index.html' }],
    });
  }, 500);
}
function start(sz) { size = sz; deal(); state = 'play'; MG.hide(); }
function menu() {
  MG.panel({
    title: '翻翻記憶',
    html: `<p>翻開兩張牌，一樣的就配對成功。用最少的步數、最快的時間全部找完！</p>
      <div class="sizes">${Object.entries(SIZES).map(([k, s]) => {
        const b = MG.best('memory.' + k);
        return `<button class="mg-btn${k === 'easy' ? '' : ' alt'}" data-size="${k}">${s.label}<small>${s.note}${b != null ? '・最快 ' + fmt(b) : ''}</small></button>`;
      }).join('')}</div>`,
    keys: '點牌翻開　鍵盤可用 <kbd>Tab</kbd> 移動、<kbd>Enter</kbd> 翻牌',
  });
  document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => { MG.sfx('click'); MG.unlock(); start(b.dataset.size); });
  setTimeout(() => document.querySelector('[data-size]')?.focus(), 30);
}
MG.pauseMenu({ label: '☰ 換大小', playing: () => state === 'play', open: () => menu() });
deal(); menu();
window.MMT = { get state() { return state; }, get word() { return lastWord; }, faces: () => cards.map(c => c.face), get lock() { return lock; } };
MG.loop(dt => { if (state === 'play' && moves + open.length > 0) { time += dt; hud(); } });
</script>
</body>
</html>
