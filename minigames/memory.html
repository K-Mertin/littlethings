<!doctype html>
<html lang="zh-Hant">
<head>

<title>翻翻記憶</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:radial-gradient(ellipse at 50% 40%,#3f9c5e 0%,#2f7d49 55%,#235f38 100%)}
body.game::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.2px),radial-gradient(rgba(0,0,0,.35) 1px,transparent 1.2px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
#board{display:grid;gap:var(--gap);touch-action:manipulation;position:relative}
.card{position:relative;width:var(--cw,var(--cs));height:var(--ch,var(--cs));perspective:700px;cursor:pointer;border:0;padding:0;background:none;transition:transform .15s}
@media (hover:hover){.card:not(.up):not(.done):hover{transform:translateY(-3px)}}
.card .in{position:absolute;inset:0;transition:transform .36s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .b{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3Cpattern%20id%3D%22p%22%20width%3D%2212%22%20height%3D%2212%22%20patternUnits%3D%22userSpaceOnUse%22%20patternTransform%3D%22rotate%2845%29%22%3E%3Crect%20width%3D%2212%22%20height%3D%2212%22%20fill%3D%22%234c88dd%22/%3E%3Crect%20width%3D%226%22%20height%3D%2212%22%20fill%3D%22%235a96ea%22/%3E%3C/pattern%3E%3CradialGradient%20id%3D%22g%22%20cx%3D%22.38%22%20cy%3D%22.3%22%20r%3D%22.75%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23c8ffc9%22/%3E%3Cstop%20offset%3D%22.45%22%20stop-color%3D%22%236fdc83%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232a9447%22/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22url%28%23p%29%22/%3E%3Crect%20x%3D%227%22%20y%3D%227%22%20width%3D%2286%22%20height%3D%2286%22%20rx%3D%229%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-opacity%3D%22.75%22%20stroke-width%3D%222.5%22%20stroke-dasharray%3D%221%205%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2227%22%20fill%3D%22%232a5cab%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2227%22%20fill%3D%22none%22%20stroke%3D%22%23ffd25a%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M31%2062%20C29%2044%2038%2033%2050%2033%20C62%2033%2071%2044%2069%2062%20Q50%2070%2031%2062Z%22%20fill%3D%22url%28%23g%29%22%20stroke%3D%22%231f6e35%22%20stroke-width%3D%222%22/%3E%3Cellipse%20cx%3D%2255%22%20cy%3D%2230%22%20rx%3D%226%22%20ry%3D%223%22%20fill%3D%22%23ffd25a%22%20stroke%3D%22%23b86d00%22%20stroke-width%3D%221.2%22%20transform%3D%22rotate%28-25%2055%2030%29%22/%3E%3Cellipse%20cx%3D%2242%22%20cy%3D%2249%22%20rx%3D%222.2%22%20ry%3D%223.2%22%20fill%3D%22%2318261a%22/%3E%3Cellipse%20cx%3D%2258%22%20cy%3D%2249%22%20rx%3D%222.2%22%20ry%3D%223.2%22%20fill%3D%22%2318261a%22/%3E%3Cpath%20d%3D%22M45%2056%20Q50%2061%2055%2056%22%20fill%3D%22none%22%20stroke%3D%22%2318261a%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22/%3E%3Cellipse%20cx%3D%2240%22%20cy%3D%2242%22%20rx%3D%224%22%20ry%3D%222.2%22%20fill%3D%22%23fff%22%20opacity%3D%22.7%22%20transform%3D%22rotate%28-35%2040%2042%29%22/%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2214%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3Ccircle%20cx%3D%2286%22%20cy%3D%2214%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3Ccircle%20cx%3D%2214%22%20cy%3D%2286%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3Ccircle%20cx%3D%2286%22%20cy%3D%2286%22%20r%3D%223%22%20fill%3D%22%23ffd25a%22/%3E%3C/svg%3E") center/cover,#4c88dd;border:3px solid #fff;box-shadow:0 5px 0 #1d4f9e,0 8px 14px rgba(0,0,0,.35)}
.card .b::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 40%)}
.card .f{transform:rotateY(180deg);background:radial-gradient(circle at 50% 38%,#ffffff 0%,#fff8e6 60%,#f6e7c2 100%);border:3px solid #fff;
  box-shadow:0 5px 0 #c9a95a,0 8px 14px rgba(0,0,0,.3),inset 0 0 0 4px #f1dfb2;font-size:calc(var(--cs) * .56);line-height:1;
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card .f span{filter:drop-shadow(0 3px 2px rgba(80,50,10,.25));transform:translateY(-2%)}
.card .f::before,.card .f::after{content:"✿";position:absolute;font:calc(var(--cs) * .13) system-ui,sans-serif;color:#e2c787}
.card .f::before{top:6%;left:9%}.card .f::after{bottom:6%;right:9%}
.card .f span.sil{filter:brightness(0);opacity:.78}
.card .f span.baby{position:relative;font-size:.62em;transform:translateY(8%)}
.card .f span.baby i{position:absolute;right:-.5em;bottom:-.15em;font-style:normal;font-size:.55em}
.card .f b.num{font:900 calc(var(--cs) * .62)/1 system-ui,"Noto Sans TC",sans-serif;-webkit-text-stroke:2px rgba(0,0,0,.18);text-shadow:0 3px 0 rgba(0,0,0,.12)}
.card .f svg.pic{width:78%;height:78%;filter:drop-shadow(0 3px 2px rgba(80,50,10,.2))}
.card.done .f{background:radial-gradient(circle at 50% 38%,#ffffff 0%,#eaffde 60%,#c9f0b4 100%);box-shadow:0 5px 0 #3aa85a,0 8px 14px rgba(0,0,0,.3),inset 0 0 0 4px #b8e8a0}
.card.done .f::before,.card.done .f::after{color:#7fcf8f}
.card.done{animation:yay .45s ease}
.card.done .in::after{content:"";position:absolute;inset:-12%;border-radius:50%;pointer-events:none;transform:rotateY(180deg);
  background:radial-gradient(circle,rgba(255,255,200,.9) 0%,rgba(255,240,150,.4) 35%,rgba(255,240,150,0) 65%);animation:glow .6s ease-out forwards}
.card.bad .f{background:radial-gradient(circle at 50% 38%,#fff 0%,#ffe9e6 70%,#ffd0ca 100%);box-shadow:0 5px 0 #e0645a,0 8px 14px rgba(0,0,0,.3),inset 0 0 0 4px #ffc2ba}
.card.bad .in{animation:shake .3s ease}
.card:focus-visible{outline:3px solid #ffd25a;outline-offset:4px;border-radius:14px}
.spark{position:absolute;pointer-events:none;font:16px system-ui,sans-serif;color:#ffe066;text-shadow:0 0 6px #fff6b0;animation:spark .7s ease-out forwards;z-index:5}
@keyframes yay{40%{transform:scale(1.14) rotate(-3deg)}70%{transform:scale(.97)}}
@keyframes glow{from{opacity:1;transform:rotateY(180deg) scale(.6)}to{opacity:0;transform:rotateY(180deg) scale(1.3)}}
@keyframes shake{20%,60%{translate:-4px 0}40%,80%{translate:4px 0}}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}.card.done,.card.bad .in,.spark{animation:none}}
.word{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;font:900 clamp(20px,calc(var(--cs) * .32),34px) system-ui,"Noto Sans TC",sans-serif;color:#ffe066;
  -webkit-text-stroke:1.5px #7a4a00;paint-order:stroke fill;text-shadow:0 3px 0 #7a4a00,0 0 10px rgba(255,255,255,.7);animation:word .9s ease-out forwards}
.word.miss{color:#fff;-webkit-text-stroke:1.5px #3a6a9a;text-shadow:0 3px 0 #3a6a9a;font-size:clamp(16px,calc(var(--cs) * .24),26px)}
@keyframes word{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}35%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
@media (prefers-reduced-motion:reduce){.word{animation:none;opacity:1}}
/* 👓 大字模式: bigger words, thicker card edges, stronger contrast */
html.mg-big .card .f{font-size:calc(var(--cs) * .62);border-width:4px}
html.mg-big .card .b{border-width:4px}
html.mg-big .card .f::before,html.mg-big .card .f::after{color:#c9a95a}
html.mg-big .word{font-size:clamp(26px,calc(var(--cs) * .38),44px);-webkit-text-stroke:2px #5a3500}
html.mg-big .word.miss{font-size:clamp(22px,calc(var(--cs) * .3),34px);-webkit-text-stroke:2px #1f4a7a}
</style>
</head>
<body>
<main class="mg-stage"><div id="board" role="grid" aria-label="翻牌"></div></main>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'memory', title: '翻翻記憶', stats: ['level', 'moves', 'time'] });
// 牛牛 on the card backs (caramel stripes) when 牛牛 is the hero
if (MG.hero === 'niu') {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="p" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#e2a06c"/><rect width="6" height="12" fill="#ebb07e"/></pattern></defs><rect width="100" height="100" fill="url(#p)"/><rect x="7" y="7" width="86" height="86" rx="9" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="1 5" stroke-linecap="round"/><circle cx="50" cy="50" r="28" fill="#ff8ea2" stroke="#ffd25a" stroke-width="3"/><g transform="translate(50 51) scale(.25) translate(-100 -120)">${MG.niuSVG('happy', { noShadow: 1 })}</g>${[[14, 14], [86, 14], [14, 86], [86, 86]].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="3" fill="#ffd25a"/>`).join('')}</svg>`;
  const st = document.createElement('style');
  st.textContent = `.card .b{background:url("data:image/svg+xml,${encodeURIComponent(svg)}") center/cover,#e2a06c;box-shadow:0 5px 0 #9a6234,0 8px 14px rgba(0,0,0,.35)}`;
  document.head.append(st);
}
// ---------- card sets (each card face = HTML + a match key) ----------
const SETS = ['🐶', '🐱', '🐰', '🦊', '🐼', '🐸', '🐵', '🐧', '🐙', '🦁', '🐷', '🐨', '🦄', '🐢', '🐝', '🐳', '🦉', '🐞'];
const EMO = {
  animals: SETS,
  cars: ['🚗', '🚌', '🚓', '🚑', '🚒', '🚜', '🚲', '🚀', '✈️', '🚁', '🚂', '🚢', '🛵', '🚚', '⛵', '🏎️'],
  food: ['🍎', '🍌', '🍇', '🍓', '🍉', '🍒', '🍑', '🍍', '🥕', '🌽', '🍞', '🧀', '🍩', '🍪', '🍰', '🍦', '🍕', '🍔'],
  ocean: ['🐠', '🐟', '🐡', '🦈', '🐙', '🦑', '🦀', '🦞', '🦐', '🐳', '🐋', '🐬', '🦭', '🐢', '🐚'],
  dino: ['🦖', '🦕', '🐊', '🦎', '🐢', '🐍', '🐉', '🐲'],
  shadow: ['🐘', '🦒', '🐇', '🐌', '🦋', '🐢', '🐓', '🦀', '🐳', '🦆', '🐈', '🐎', '🦕', '🦖', '✈️', '🚲', '🍌', '🍎', '☂️', '🎸', '🔑', '⛄', '🐿️', '🦩'],
};
EMO.mix = [...EMO.animals, ...EMO.food, ...EMO.cars];
const MAMA = [['🐔', '🐣'], ['🦋', '🐛'], ['🐘'], ['🦒'], ['🐼'], ['🐨'], ['🐻'], ['🐰'], ['🐑'], ['🐷'], ['🐴'], ['🦁'], ['🐒'], ['🐧'], ['🦆'], ['🐮']];
const NUMC = ['#ff4f5e', '#ff8a2a', '#e8a400', '#3fbf5a', '#2fbfa8', '#3d7bff', '#7a5cff', '#c45cff', '#ff5aa8', '#8a5a34'];
const DOTS = { 1: [[50, 50]], 2: [[30, 30], [70, 70]], 3: [[27, 27], [50, 50], [73, 73]], 4: [[30, 30], [70, 30], [30, 70], [70, 70]], 5: [[28, 28], [72, 28], [50, 50], [28, 72], [72, 72]],
  6: [[32, 24], [68, 24], [32, 50], [68, 50], [32, 76], [68, 76]], 7: [[30, 22], [70, 22], [30, 50], [50, 50], [70, 50], [30, 78], [70, 78]],
  8: [[32, 18], [68, 18], [32, 39], [68, 39], [32, 61], [68, 61], [32, 82], [68, 82]], 9: [[24, 24], [50, 24], [76, 24], [24, 50], [50, 50], [76, 50], [24, 76], [50, 76], [76, 76]],
  10: [[16, 36], [33, 36], [50, 36], [67, 36], [84, 36], [16, 64], [33, 64], [50, 64], [67, 64], [84, 64]] };
const SHAPES = {
  circle: '<circle cx="50" cy="50" r="34"/>', square: '<rect x="17" y="17" width="66" height="66" rx="10"/>', tri: '<path d="M50 13 L88 82 H12Z"/>',
  star: '<path d="M50 10 L61 37 L90 38 L67 56 L75 85 L50 68 L25 85 L33 56 L10 38 L39 37Z"/>', heart: '<path d="M50 86 C10 60 10 26 32 20 C42 18 48 24 50 30 C52 24 58 18 68 20 C90 26 90 60 50 86Z"/>',
  diamond: '<path d="M50 10 L86 50 L50 90 L14 50Z"/>' };
const SHC = { red: '#ff4f5e', blue: '#3d7bff', yellow: '#ffc21f', green: '#3fbf5a', purple: '#9a5cff' };
const svg = inner => `<svg class="pic" viewBox="0 0 100 100" aria-hidden="true">${inner}</svg>`;
// one "kind" of thing to find: a list of faces that all belong together (k faces for a pair / triple)
function groups(L) {
  const n = L.n, k = L.k || 2;
  if (L.how === 'num') return MG.shuffle([...Array(10)].map((_, i) => i + 1)).slice(0, n).map(v => {
    const c = NUMC[v - 1], num = `<b class="num" style="color:${c}">${v}</b>`, dots = svg(DOTS[v].map(([a, b]) => `<circle cx="${a}" cy="${b}" r="${v > 9 ? 6.5 : v > 6 ? 7.5 : 9}" fill="${c}" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>`).join(''));
    return { key: 'n' + v, faces: k === 3 ? [num, dots, dots] : [num, dots], label: String(v) };
  });
  if (L.how === 'shape') {
    const all = []; for (const sh in SHAPES) for (const cn in SHC) all.push([sh, cn]);
    return MG.shuffle(all).slice(0, n).map(([sh, cn]) => { const f = svg(`<g fill="${SHC[cn]}" stroke="rgba(0,0,0,.28)" stroke-width="3" stroke-linejoin="round">${SHAPES[sh]}</g>`); return { key: sh + cn, faces: Array(k).fill(f), label: sh + ' ' + cn }; });
  }
  if (L.how === 'mama') return MG.shuffle([...MAMA]).slice(0, n).map(([m, b]) => ({ key: m, faces: [`<span>${m}</span>`, b ? `<span>${b}</span>` : `<span class="baby">${m}<i>🍼</i></span>`], label: m }));
  const pool = EMO[L.how === 'shadow' ? 'shadow' : L.set];
  return MG.shuffle([...pool]).slice(0, n).map(e => ({ key: e, faces: L.how === 'shadow' ? [`<span>${e}</span>`, `<span class="sil">${e}</span>`] : Array(k).fill(`<span>${e}</span>`), label: e }));
}
// ---------- the level list (1 / 10 / 20 are the old 簡單 / 普通 / 困難 boards and keep their records) ----------
const LEVELS = [
  { set: 'animals', n: 6, name: '🐶 動物朋友', rec: 'easy' },
  { set: 'cars', n: 6, name: '🚗 交通工具' },
  { set: 'food', n: 6, name: '🍎 好吃的東西' },
  { set: 'animals', n: 8, peek: 1, name: '👀 先偷看一下' },
  { how: 'num', n: 5, name: '🔢 數字和點點' },
  { set: 'ocean', n: 8, name: '🐠 海洋世界' },
  { how: 'shadow', n: 6, name: '🌑 找影子' },
  { set: 'dino', n: 8, name: '🦖 恐龍朋友' },
  { how: 'mama', n: 6, name: '🍼 媽媽和寶寶' },
  { set: 'animals', n: 10, name: '🐶 動物朋友（大）', rec: 'normal' },
  { how: 'shape', n: 8, name: '🔷 形狀和顏色' },
  { set: 'food', n: 8, shuf: 1, name: '🔀 會換位置的牌' },
  { how: 'shadow', n: 8, name: '🌑 找影子' },
  { set: 'animals', n: 4, k: 3, name: '🍀 三張一樣' },
  { how: 'num', n: 8, name: '🔢 數字和點點' },
  { set: 'cars', n: 10, peek: 1, name: '👀 先偷看一下' },
  { how: 'mama', n: 8, name: '🍼 媽媽和寶寶' },
  { set: 'ocean', n: 5, k: 3, name: '🍀 三張一樣' },
  { set: 'animals', n: 10, shuf: 1, name: '🔀 會換位置的牌' },
  { set: 'animals', n: 15, name: '🐶 動物朋友（超大）', rec: 'hard' },
  { how: 'shape', n: 10, name: '🔷 形狀和顏色' },
  { how: 'shadow', n: 10, name: '🌑 找影子' },
  { set: 'food', n: 12, name: '🍎 好吃的東西（大）' },
  { set: 'food', n: 6, k: 3, name: '🍀 三張一樣' },
  { how: 'num', n: 10, name: '🔢 數字和點點' },
  { how: 'shadow', n: 10, shuf: 1, name: '🔀 會換位置的影子' },
  { set: 'ocean', n: 15, name: '🐠 海洋世界（超大）' },
  { how: 'mama', n: 12, name: '🍼 媽媽和寶寶（大）' },
  { set: 'cars', n: 8, k: 3, name: '🍀 三張一樣（大）' },
  { set: 'mix', n: 18, name: '🌈 超級大挑戰' },
];
const NEWS = {
  peek: ['👀 先偷看一下', '一開始所有的牌會翻開一下下，<b>趁這個時候記住</b>它們在哪裡，然後牌會蓋起來喔！'],
  num: ['🔢 數字和點點', '一張牌是數字，另一張是點點。<b>數字和點點一樣多</b>就配對成功！例如 3 和 ●●●。'],
  shadow: ['🌑 找影子', '一張是彩色的圖，另一張是黑黑的影子。把<b>圖和它的影子</b>配在一起！'],
  mama: ['🍼 媽媽和寶寶', '把動物媽媽和牠的寶寶配在一起！寶寶比較小、拿著奶瓶 🍼，雞媽媽的寶寶是小雞 🐣、蝴蝶的寶寶是毛毛蟲 🐛。'],
  shape: ['🔷 形狀和顏色', '這些牌長得很像！要<b>形狀一樣、顏色也一樣</b>才算配對喔。'],
  shuf: ['🔀 會換位置的牌', '配錯的時候，有兩張蓋著的牌會<b>偷偷換位置</b>。眼睛看好它們跑去哪裡！'],
  triple: ['🍀 三張一樣', '這次每種圖有<b>三張</b>！要連續翻出三張一樣的才算成功，翻到不一樣的就重來。'],
};
const flagsOf = L => [L.peek && 'peek', L.how, L.shuf && 'shuf', L.k === 3 && 'triple'].filter(f => f && NEWS[f]);
const lvShort = n => { const L = LEVELS[n - 1]; return `${n}${L.k === 3 ? '🍀' : L.shuf ? '🔀' : L.peek ? '👀' : L.how === 'num' ? '🔢' : L.how === 'shadow' ? '🌑' : L.how === 'mama' ? '🍼' : L.how === 'shape' ? '🔷' : n === LEVELS.length ? '🌈' : ''}`; };
const recKey = n => LEVELS[n - 1].rec ? 'memory.' + LEVELS[n - 1].rec : 'memory.L' + n;
const movesKey = n => LEVELS[n - 1].rec ? 'memory.moves.' + LEVELS[n - 1].rec : 'memory.moves.L' + n;

const board = document.getElementById('board'), stage = board.parentElement;
let level = 1, L = LEVELS[0], K = 2, groupsN = 6, cards = [], open = [], moves = 0, matched = 0, time = 0, state = 'ready', lock = false, streak = 0, lastWord = '', peekT = 0, swaps = 0;

function layout() {
  const n = cards.length || groupsN * K, st = getComputedStyle(stage);
  // the card size comes from the screen: the grid fills the stage, cards may be a little taller or wider than square
  const aw = stage.clientWidth - parseFloat(st.paddingLeft) - parseFloat(st.paddingRight);
  const ah = stage.clientHeight - parseFloat(st.paddingTop) - parseFloat(st.paddingBottom) - 5;   // room for the card shadow
  const gap = Math.round(Math.max(5, Math.min(16, Math.min(aw, ah) * (n > 30 ? 0.012 : 0.018))));
  // try every column count and keep the one that gives the biggest picture (and then the most covered area)
  let best = null;
  for (let c = 2; c <= n; c++) {
    const r = Math.ceil(n / c); if (r * c - n >= c) continue;
    let cw = (aw - gap * (c - 1)) / c, ch = (ah - gap * (r - 1)) / r;
    ch = Math.min(ch, cw * 1.5); cw = Math.min(cw, ch * 1.5);
    const score = Math.min(cw, ch) * Math.sqrt(c * cw * r * ch / (aw * ah));   // picture size, nudged towards covering more of the stage
    if (!best || score > best.score) best = { score, c, cw: Math.floor(cw), ch: Math.floor(ch) };
  }
  const cs = Math.min(best.cw, best.ch);
  board.style.setProperty('--cs', cs + 'px');
  board.style.setProperty('--cw', best.cw + 'px');
  board.style.setProperty('--ch', best.ch + 'px');
  board.style.setProperty('--gap', gap + 'px');
  board.style.gridTemplateColumns = `repeat(${best.c}, ${best.cw}px)`;
}
addEventListener('resize', layout);

function deal(lv) {
  level = lv; L = LEVELS[lv - 1]; K = L.k || 2; groupsN = L.n;
  const gs = groups(L);
  const list = MG.shuffle(gs.flatMap(g => g.faces.map(f => ({ key: g.key, html: f, label: g.label }))));
  board.innerHTML = '';
  cards = list.map(q => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.setAttribute('aria-label', '蓋著的牌');
    b.innerHTML = `<div class="in"><div class="b"></div><div class="f">${q.html}</div></div>`;
    const c = { el: b, face: q.key, label: q.label, up: false, done: false };
    b.onclick = () => flip(c);
    board.append(b);
    return c;
  });
  open = []; moves = 0; matched = 0; time = 0; lock = false; streak = 0; peekT = 0; swaps = 0;
  layout(); hud();
}
function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('moves', `${moves} 步`); MG.stat('time', `⏱ ${fmt(time)}`); }
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function flip(c) {
  if (state !== 'play' || lock || c.up || c.done) return;
  c.up = true; c.el.classList.add('up'); c.el.setAttribute('aria-label', c.label); MG.sfx('flip');
  open.push(c);
  const same = open.every(q => q.face === open[0].face);
  if (same && open.length < K) { if (open.length >= 2) { MG.sfx('good'); word(open[0].el, c.el, '✨ 2/3'); } return; }
  moves++; hud();
  if (same) {
    const grp = open; grp.forEach(q => q.done = true); open = []; streak++;
    const st = streak, last = matched + 1 === groupsN;
    setTimeout(() => {
      grp.forEach(q => { q.el.classList.add('done'); sparks(q.el); });
      // layered match sound: rises with the streak of pairs found in a row
      MG.sfx('match', st); if (st >= 2) MG.sfx('combo', st); else MG.sfx('sparkle');
      word(grp[0].el, grp[grp.length - 1].el, last ? MG.WORDS.clear : st >= 2 ? MG.WORDS.combo(st) : MG.praise(1 + (matched % 3)));
    }, 180);
    matched++;
    if (matched === groupsN) win();
  } else {
    lock = true; streak = 0;
    const grp = open;
    setTimeout(() => { grp.forEach(q => q.el.classList.add('bad')); MG.sfx('miss'); word(grp[0].el, grp[grp.length - 1].el, MG.WORDS.oops, true); }, 260);
    setTimeout(() => {
      for (const q of grp) { q.up = false; q.el.classList.remove('up', 'bad'); q.el.setAttribute('aria-label', '蓋著的牌'); }
      open = [];
      if (L.shuf && state === 'play') shuffleTwo(grp[grp.length - 1]); else lock = false;
    }, 850);
  }
}
// 🔀 after a miss two covered cards slide to each other's place (slowly, so sharp eyes can follow them)
function shuffleTwo(prefer) {
  const covered = cards.filter(q => !q.done && !q.up);
  if (covered.length < 3) { lock = false; return; }
  const a = covered.includes(prefer) ? prefer : MG.pick(covered);
  const b = MG.pick(covered.filter(q => q !== a));
  const ra = a.el.getBoundingClientRect(), rb = b.el.getBoundingClientRect();
  // swap them in the grid and in the list
  const ia = cards.indexOf(a), ib = cards.indexOf(b); cards[ia] = b; cards[ib] = a;
  const mark = document.createComment('');
  a.el.replaceWith(mark); b.el.replaceWith(a.el); mark.replaceWith(b.el);
  swaps++;
  for (const [q, from] of [[a, ra], [b, rb]]) {
    const to = q.el.getBoundingClientRect();
    q.el.style.transition = 'none'; q.el.style.transform = `translate(${from.left - to.left}px,${from.top - to.top}px)`; q.el.style.zIndex = 4;
  }
  void board.offsetWidth;
  MG.sfx('whoosh');
  for (const q of [a, b]) { q.el.style.transition = 'transform .7s cubic-bezier(.45,0,.3,1)'; q.el.style.transform = ''; }
  setTimeout(() => { for (const q of [a, b]) { q.el.style.transition = ''; q.el.style.zIndex = ''; } lock = false; }, 720);
}
function sparks(el) {
  const r = el.getBoundingClientRect(), br = board.getBoundingClientRect();
  for (let i = 0; i < 6; i++) {
    const sp = document.createElement('span'); sp.className = 'spark'; sp.textContent = i % 2 ? '✦' : '★';
    const a = i / 6 * Math.PI * 2, d = r.width * 0.6;
    sp.style.left = (r.left - br.left + r.width / 2 - 8) + 'px'; sp.style.top = (r.top - br.top + r.height / 2 - 10) + 'px';
    sp.style.setProperty('--dx', Math.cos(a) * d + 'px'); sp.style.setProperty('--dy', Math.sin(a) * d + 'px');
    board.append(sp); setTimeout(() => sp.remove(), 750);
  }
}
// a short English + emoji word that pops up between the two cards
function word(e1, e2, text, miss = false) {
  const r1 = e1.getBoundingClientRect(), r2 = e2.getBoundingClientRect(), br = board.getBoundingClientRect();
  const w = document.createElement('span'); w.className = 'word' + (miss ? ' miss' : ''); w.textContent = text; lastWord = text;
  board.append(w);
  // keep it inside the board horizontally
  const cx = (r1.left + r1.right + r2.left + r2.right) / 4 - br.left, half = w.offsetWidth / 2 + 4;
  w.style.left = Math.max(half, Math.min(br.width - half, cx)) + 'px';
  w.style.top = ((r1.top + r1.bottom + r2.top + r2.bottom) / 4 - br.top) + 'px';
  setTimeout(() => w.remove(), 950);
}
function win() {
  state = 'over';
  const rec = MG.record(recKey(level), Math.round(time * 10) / 10, true);
  const mv = MG.record(movesKey(level), moves, true);
  const done = MG.store.get('memory.done', []); if (!done.includes(level)) { done.push(level); MG.store.set('memory.done', done); }
  const lv = level;
  setTimeout(() => {
    if (state !== 'over' || level !== lv) return;
    MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
    const nx = LEVELS[level];
    MG.panel({
      title: `第 ${level} 關完成！`,
      html: `<div class="big">${fmt(time)}</div><p>${L.name}　${moves} 步</p>` +
        (rec.isNew ? `<p class="new">最快紀錄！^_^</p>` : `<p>最快：${fmt(rec.best)}</p>`) + (mv.isNew && !rec.isNew ? `<p class="new">最少步數紀錄！</p>` : '') +
        (nx ? `<p>下一關：${nx.name}</p>` : '<p>全部 30 關都過了，你是記憶大師！^_^</p>'),
      buttons: [...(nx ? [{ label: '下一關', on: () => { MG.store.set('memory.pickLevel', level + 1); start(level + 1); } }] : []), { label: '再玩一次', alt: !!nx, on: () => start(level) }, { label: '選關卡', alt: true, on: menu }],
    });
  }, 500);
}
function begin() {
  MG.hide();
  if (L.peek) {   // 👀 every card shows its face for a moment, then they all turn over
    state = 'peek'; peekT = 1.6 + cards.length * 0.13;
    cards.forEach(q => q.el.classList.add('up')); MG.sfx('whoosh'); MG.toast('👀 Look!', 1200);
  } else state = 'play';
}
function start(lv) {
  deal(lv); MG.hide();
  // the first time a new way to play shows up, explain it once
  const fresh = flagsOf(L).filter(f => !MG.store.get('memory.seen.' + f, false));
  if (fresh.length) {
    state = 'intro'; fresh.forEach(f => MG.store.set('memory.seen.' + f, true));
    MG.panel({ title: fresh.map(f => NEWS[f][0]).join('＋'), html: fresh.map(f => `<p>${NEWS[f][1]}</p>`).join(''), buttons: [{ label: '開始', on: begin }] });
  } else begin();
}
function menu() {
  if (state !== 'play' && state !== 'peek') state = 'ready';
  const done = MG.store.get('memory.done', []);
  MG.choose({
    id: 'memory', title: '翻翻記憶',
    html: `<p>翻開兩張牌，一樣的就配對成功。用最少的步數、最快的時間全部找完！不限時間，慢慢翻 ^_^</p><p>30 關裡有 🚗 交通工具、🍎 食物、🐠 海洋、🦖 恐龍，還有 👀 先偷看、🔢 數字和點點、🌑 找影子、🍼 媽媽和寶寶、🔷 形狀顏色、🔀 會換位置、🍀 三張一樣！</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${LEVELS[n - 1].name}・${LEVELS[n - 1].n * (LEVELS[n - 1].k || 2)} 張${done.includes(n) ? ' ✓' : ''}${MG.best(recKey(n)) != null ? '・最快 ' + fmt(MG.best(recKey(n))) : ''}`, short: lvShort },
    keys: '點牌翻開　鍵盤可用 <kbd>Tab</kbd> 移動、<kbd>Enter</kbd> 翻牌',
    playing: () => state === 'play' || state === 'peek',
    start: (m, lv) => start(lv),
  });
}
deal(1); menu();
window.MMT = { get state() { return state; }, get word() { return lastWord; }, faces: () => cards.map(c => c.face), get lock() { return lock; }, get level() { return level; }, get k() { return K; }, get swaps() { return swaps; },
  start: lv => start(lv), begin: () => begin(), flip: i => flip(cards[i]), done: () => cards.map(c => c.done), html: i => cards[i].el.querySelector('.f').innerHTML, count: LEVELS.length };
MG.loop(dt => {
  if (state === 'peek') { peekT -= dt; if (peekT <= 0) { state = 'play'; cards.forEach(q => q.el.classList.remove('up')); MG.sfx('flip'); } }
  if (state === 'play' && moves + open.length > 0) { time += dt; hud(); }
});
</script>
</body>
</html>
