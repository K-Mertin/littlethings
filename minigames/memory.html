<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>翻翻記憶</title>
<link rel="stylesheet" href="mini.css">
<style>
body.game{background:#9fd6a8}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;background:#bfe6c4 center/100% 100% no-repeat;overflow:hidden}
.mg-stage{z-index:1;gap:10px}
body.land .mg-stage{flex-direction:row}
body:not(.land) .mg-stage{flex-direction:column}
/* ---- side: the hero + the sticker album ---- */
#side{position:relative;flex:none;display:flex;gap:8px;min-width:0;min-height:0}
body.land #side{flex-direction:column;width:clamp(170px,21vw,290px);align-self:stretch}
body:not(.land) #side{flex-direction:row;height:clamp(100px,16vh,200px);align-self:stretch}
#heroBox{position:relative;flex:none;border-radius:20px;overflow:visible}
body.land #heroBox{height:38%}
body:not(.land) #heroBox{width:33%}
#heroBox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;will-change:transform;background:none;border:0;border-radius:0;box-shadow:none}
#heroBox{background:radial-gradient(ellipse at 50% 62%,rgba(255,255,255,.8),rgba(255,255,255,.35) 62%,rgba(255,255,255,.12));box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 6px 16px rgba(30,40,20,.12)}
#heroBox::before{content:"";position:absolute;left:8%;right:8%;bottom:4%;height:18%;border-radius:50%;background:radial-gradient(closest-side,var(--pod1,#fff6d8),var(--pod2,#e9c98a) 70%,rgba(0,0,0,0) 100%);opacity:.9}
#bubble{position:absolute;z-index:3;left:50%;top:2%;transform:translate(-50%,-6px) scale(.6);opacity:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s;white-space:nowrap;
  background:#fff;color:#4a3320;font:900 clamp(13px,2.2vmin,20px)/1.1 system-ui,"Noto Sans TC",sans-serif;padding:6px 11px;border-radius:999px;box-shadow:0 3px 0 rgba(90,60,30,.18),0 0 0 2px var(--rimL,#f0d7a0);pointer-events:none}
#bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
#bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
#album{position:relative;flex:1;min-width:0;min-height:0;border-radius:18px;padding:30px 9px 9px;
  background:radial-gradient(circle at 12px 12px,rgba(255,255,255,.7) 0 2px,transparent 2.5px) 0 0/22px 22px,linear-gradient(180deg,#fffaf0,#fbefd6);
  box-shadow:0 5px 0 var(--rimD,#d9b77a),0 10px 22px rgba(40,30,10,.22),inset 0 0 0 3px #fff,inset 0 0 0 5px var(--rimL,#f0d7a0)}
#album::before,#album::after{content:"";position:absolute;top:-7px;width:54px;height:18px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--tape1,#ffb3c7) 0 7px,var(--tape2,#ffd6e1) 7px 14px);box-shadow:0 2px 3px rgba(0,0,0,.12);opacity:.92}
#album::before{left:14px;transform:rotate(-6deg)}#album::after{right:14px;transform:rotate(5deg)}
#alh{position:absolute;left:10px;right:10px;top:7px;display:flex;justify-content:space-between;align-items:center;gap:6px;font:900 clamp(12px,1.9vmin,17px)/1.1 system-ui,"Noto Sans TC",sans-serif;color:#7a4f1c;white-space:nowrap;overflow:hidden}
#alh b{flex:none;background:var(--rimD,#d9b77a);color:#fff;border-radius:999px;padding:2px 8px}
#alh span{overflow:hidden;text-overflow:ellipsis}
#slots{display:grid;gap:var(--sg,5px);justify-content:center;align-content:center;height:100%}
.slot{position:relative;width:var(--ss);height:var(--ss);border-radius:22%;background:rgba(160,120,60,.08);box-shadow:inset 0 0 0 2px rgba(170,130,70,.28);display:flex;align-items:center;justify-content:center;overflow:hidden}
.slot::before{content:"?";font:900 calc(var(--ss) * .42)/1 system-ui,sans-serif;color:rgba(170,130,70,.3)}
.slot.full{background:#fff;box-shadow:0 2px 0 var(--rimD,#d9b77a),inset 0 0 0 2px var(--rimL,#f0d7a0);animation:slotin .45s cubic-bezier(.3,1.6,.5,1)}
.slot.full::before{display:none}
.slot.cheer{animation:slotjump .5s ease}
@keyframes slotin{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes slotjump{40%{transform:translateY(-22%) scale(1.12)}}
.mini{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:calc(var(--ss) * .62);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.mini svg.pic{width:88%;height:88%}
.mini b.num{font:900 calc(var(--ss) * .6)/1 system-ui,sans-serif;color:var(--c)}
.mini .snd svg{width:88%;height:88%}
.fly{position:fixed;z-index:12;pointer-events:none;border-radius:14px;background:#fffaf0;box-shadow:0 8px 18px rgba(40,30,10,.3),0 0 0 3px #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.fly svg.pic{width:84%;height:84%}
/* ---- the play table under the cards ---- */
#table{position:relative;flex:1;min-width:0;min-height:0;align-self:stretch;display:flex;align-items:center;justify-content:center;border-radius:26px;padding:14px;
  background:var(--mat);box-shadow:0 7px 0 var(--matD),0 16px 30px rgba(20,30,10,.3),inset 0 0 0 5px var(--matR),inset 0 0 0 7px rgba(0,0,0,.1),inset 0 12px 30px rgba(255,255,255,.18),inset 0 -14px 30px rgba(0,0,0,.14)}
#table::before{content:"";position:absolute;inset:10px;border-radius:19px;border:2.5px dashed var(--stitch,rgba(255,255,255,.55));pointer-events:none}
#fxc{position:fixed;inset:0;width:100%;height:100%;z-index:11;pointer-events:none;display:none}
#fxc.on{display:block}
#critc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#board{display:grid;gap:var(--gap);touch-action:manipulation;position:relative}
.card{position:relative;width:var(--cw,var(--cs));height:var(--ch,var(--cs));perspective:800px;cursor:pointer;border:0;padding:0;background:none;transition:transform .15s}
/* a soft shadow on the table under every card (it shrinks while the card is lifted) */
.card::before{content:"";position:absolute;left:6%;right:6%;bottom:-7px;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(20,40,20,.38),rgba(20,40,20,0));transition:transform .36s,opacity .36s;pointer-events:none}
.card.up::before,.card.done::before{transform:scale(.92)}
@media (hover:hover){.card:not(.up):not(.done):hover{transform:translateY(-3px)}}
.card .in{position:absolute;inset:0;transition:transform .42s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card.up:not(.done){animation:lift .42s ease}
@keyframes lift{45%{transform:translateY(-7%) scale(1.06)}}
.card .f,.card .b{position:absolute;inset:0;border-radius:calc(var(--cs) * .13);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* ---- back: quilted pattern + gold frame + medallion (filled in by the script) ---- */
.card .b{background-color:#3f7fd8;border:3px solid #fff;
  box-shadow:0 4px 0 #2a5fb0,0 6px 0 #1f4a8c,inset 0 0 0 calc(var(--cs) * .045) #3f7fd8,inset 0 0 0 calc(var(--cs) * .045 + 2px) #ffd46a,inset 0 0 0 calc(var(--cs) * .045 + 3.5px) rgba(31,74,140,.55),inset 0 -10px 18px rgba(20,40,110,.28)}
.card .b::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(140deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.08) 34%,rgba(255,255,255,0) 50%,rgba(0,20,60,.1) 100%)}
/* ---- face: cream paper, gold inner frame, corner flourishes, themed ground (filled in by the script) ---- */
.card .f{transform:rotateY(180deg);background-color:#fff8e8;border:3px solid #fff;
  box-shadow:0 4px 0 #e2c27a,0 6px 0 #b8954a,inset 0 0 0 calc(var(--cs) * .05) #fffaf0,inset 0 0 0 calc(var(--cs) * .05 + 1.5px) #e9c977,inset 0 -8px 16px rgba(150,110,40,.12);
  font-size:calc(var(--cs) * .54);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.card .f span{position:relative;z-index:1;filter:drop-shadow(0 calc(var(--cs) * .018) 1px rgba(80,50,10,.28));transform:translateY(-4%)}
.card .f span.sil{filter:brightness(0) invert(.16) sepia(1) saturate(3.2) hue-rotate(200deg) drop-shadow(0 calc(var(--cs) * .02) 2px rgba(20,10,60,.35));opacity:.92}
.card .f span.baby{font-size:.6em;transform:translateY(10%)}
.card .f span.baby i{position:absolute;right:-.55em;bottom:-.1em;font-style:normal;font-size:.55em;transform:rotate(18deg)}
.card .f b.num{position:relative;z-index:1;font:900 calc(var(--cs) * .6)/1 "Arial Rounded MT Bold","Nunito",system-ui,"Noto Sans TC",sans-serif;color:transparent;
  background:linear-gradient(180deg,rgba(255,255,255,.55) 0 22%,rgba(255,255,255,0) 46%,rgba(0,0,0,0) 70%,rgba(0,0,0,.14) 100%),var(--c);-webkit-background-clip:text;background-clip:text;
  -webkit-text-stroke:calc(var(--cs) * .012) var(--d);filter:drop-shadow(0 calc(var(--cs) * .022) 0 var(--d)) drop-shadow(0 calc(var(--cs) * .03) calc(var(--cs) * .02) rgba(60,30,0,.25));transform:translateY(-3%)}
.card .f svg.pic{position:relative;z-index:1;width:80%;height:80%;overflow:visible}
.card .f svg.pic.dots{width:84%;height:84%}
/* matched: minty paper, a golden glow and a green ribbon badge */
.card.done .f{background-color:#f1ffe9;box-shadow:0 4px 0 #6cc47e,0 6px 0 #3a9a52,inset 0 0 0 calc(var(--cs) * .05) #f6fff0,inset 0 0 0 calc(var(--cs) * .05 + 1.5px) #7fd28f,inset 0 0 calc(var(--cs) * .12) rgba(255,214,90,.55)}
.card.done .f::after{content:"";position:absolute;z-index:2;top:3%;right:3%;width:calc(var(--cs) * .24);height:calc(var(--cs) * .24);background:center/contain no-repeat;animation:badge .5s .15s cubic-bezier(.3,1.6,.5,1) both}
.card.done .f::before{content:"";position:absolute;z-index:3;inset:-20%;background:linear-gradient(105deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 60%);transform:translateX(-120%);animation:shine .8s .1s ease-out forwards;pointer-events:none}
.card.done{animation:yay .5s ease}
.card.done .in::after{content:"";position:absolute;inset:-14%;border-radius:50%;pointer-events:none;transform:rotateY(180deg);
  background:radial-gradient(circle,rgba(255,255,210,.95) 0%,rgba(255,236,140,.45) 35%,rgba(255,240,150,0) 65%);animation:glow .7s ease-out forwards}
.card.bad .f{background-color:#fff0ec;box-shadow:0 4px 0 #ec8a7e,0 6px 0 #c4564a,inset 0 0 0 calc(var(--cs) * .05) #fff5f2,inset 0 0 0 calc(var(--cs) * .05 + 1.5px) #f2a094}
.card.bad .in{animation:shake .3s ease}
.card:focus-visible{outline:3px solid #ffd25a;outline-offset:4px;border-radius:14px}
.spark{position:absolute;pointer-events:none;font:18px system-ui,sans-serif;color:#ffe066;text-shadow:0 0 6px #fff6b0,0 1px 0 #c98a00;animation:spark .7s ease-out forwards;z-index:5}
@keyframes yay{40%{transform:scale(1.14) rotate(-3deg)}70%{transform:scale(.97)}}
@keyframes glow{from{opacity:1;transform:rotateY(180deg) scale(.6)}to{opacity:0;transform:rotateY(180deg) scale(1.3)}}
@keyframes shine{to{transform:translateX(120%)}}
@keyframes badge{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes shake{20%,60%{translate:-4px 0}40%,80%{translate:4px 0}}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.card .in{transition:none}.card.done,.card.up,.card.bad .in,.spark,.card.done .f::before,.card.done .f::after{animation:none}}
.word{position:absolute;z-index:6;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap;font:900 clamp(20px,calc(var(--cs) * .32),34px) system-ui,"Noto Sans TC",sans-serif;color:#ffe066;
  -webkit-text-stroke:1.5px #7a4a00;paint-order:stroke fill;text-shadow:0 3px 0 #7a4a00,0 0 10px rgba(255,255,255,.7);animation:word .9s ease-out forwards}
.word.miss{color:#fff;-webkit-text-stroke:1.5px #3a6a9a;text-shadow:0 3px 0 #3a6a9a;font-size:clamp(16px,calc(var(--cs) * .24),26px)}
@keyframes word{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}35%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
@media (prefers-reduced-motion:reduce){.word{animation:none;opacity:1}}
/* 👓 大字模式: bigger words, thicker card edges, stronger contrast */
/* matched cards stay on the table as soft ghosts (their sticker is in the album) */
.card.gone .f{opacity:.45;filter:saturate(.5);transition:opacity .5s,filter .5s}
.card.gone::before{opacity:.3}
.card.gone{cursor:default}
.card .f .snd,.fly .snd,.mini .snd{position:relative;z-index:1;width:86%;height:86%;display:flex;align-items:center;justify-content:center}
.card .f .snd svg{width:100%;height:100%;overflow:visible}
.snd .wv path{opacity:0}
.snd.playing .wv path{animation:wave .45s ease-out 2}
.snd.playing .wv path:nth-child(n+3){animation-delay:.12s}
.snd.playing svg{animation:pulse .3s ease 3}
@keyframes wave{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
@keyframes pulse{50%{transform:scale(1.08)}}
.card .f span.food{font-size:.92em;transform:translateY(-6%)}
.card .f svg.pic.half{width:92%;height:92%}
.card .f i.mutei{position:absolute;z-index:2;right:8%;top:8%;font-style:normal;font-size:.3em}
html.mg-big .card .f{font-size:calc(var(--cs) * .6);border-width:4px}
html.mg-big .card .b{border-width:4px}
html.mg-big .card:not(.done):not(.bad) .f{box-shadow:0 4px 0 #c9a95a,0 6px 0 #8a6a2a,inset 0 0 0 calc(var(--cs) * .05) #fffaf0,inset 0 0 0 calc(var(--cs) * .05 + 2.5px) #c9a95a}
html.mg-big .word{font-size:clamp(26px,calc(var(--cs) * .38),44px);-webkit-text-stroke:2px #5a3500}
html.mg-big .word.miss{font-size:clamp(22px,calc(var(--cs) * .3),34px);-webkit-text-stroke:2px #1f4a7a}
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div><canvas id="critc" aria-hidden="true"></canvas><main class="mg-stage"><aside id="side" aria-hidden="true"><div id="heroBox"><canvas id="hero"></canvas><div id="bubble"></div></div><div id="album"><div id="alh"><span id="alname"></span><b id="alcount"></b></div><div id="slots"></div></div></aside><div id="table"><div id="board" role="grid" aria-label="翻牌"></div></div></main><canvas id="fxc" aria-hidden="true"></canvas>
<script src="mini.js"></script>
<script>
'use strict';
MG.init({ id: 'memory', title: '翻翻記憶', stats: ['level', 'moves', 'time'] });
// ===================== picture-book art (all drawn as inline SVG) =====================
const U = svg => `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
const SV = (vb, inner, extra = '') => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${extra}>${inner}</svg>`;
const r1 = n => Math.round(n * 10) / 10;
let seed = 1;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
// a smooth hill line through random points (quadratic curves through the midpoints)
function hillPath(w, h, y0, amp, n, sd) {
  seed = sd; const pts = [];
  for (let i = 0; i <= n; i++) pts.push([w * i / n, y0 + (rnd() - 0.5) * 2 * amp]);
  let d = `M-10 ${h + 10}L-10 ${r1(pts[0][1])}L${r1(pts[0][0])} ${r1(pts[0][1])}`;
  for (let i = 1; i < pts.length; i++) { const [px, py] = pts[i - 1], [qx, qy] = pts[i]; d += `Q${r1(px)} ${r1(py)} ${r1((px + qx) / 2)} ${r1((py + qy) / 2)}`; }
  const [lx, ly] = pts[pts.length - 1];
  return d + `L${r1(lx)} ${r1(ly)}L${w + 10} ${r1(ly)}L${w + 10} ${h + 10}Z`;
}
const hill = (w, h, y0, amp, n, sd, fill, top = '') => `<path d="${hillPath(w, h, y0, amp, n, sd)}" fill="${fill}"/>` + (top ? `<path d="${hillPath(w, h, y0, amp, n, sd)}" fill="none" stroke="${top}" stroke-width="3" opacity=".6" transform="translate(0 2)"/>` : '');
const cloud = (cx, cy, s, sh = '#d6e6f6') => {
  const d = 'M-58 12C-70 12-72-8-56-12C-58-30-34-38-22-26C-16-46 16-50 26-30C40-40 62-30 56-12C72-10 70 12 56 12Z';
  return `<g transform="translate(${r1(cx)} ${r1(cy)}) scale(${r1(s * 100) / 100})"><path d="${d}" fill="${sh}" transform="translate(3 5)"/><path d="${d}" fill="#fff"/><ellipse cx="-24" cy="-16" rx="16" ry="6" fill="#fff" opacity=".9"/></g>`;
};
const sun = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r * 2.4}" fill="url(#sunglow)"/>` +
  `<g stroke="#ffd65a" stroke-width="${r1(r * 0.16)}" stroke-linecap="round" opacity=".8">${[...Array(10)].map((_, i) => { const a = i / 10 * Math.PI * 2; return `<line x1="${r1(cx + Math.cos(a) * r * 1.3)}" y1="${r1(cy + Math.sin(a) * r * 1.3)}" x2="${r1(cx + Math.cos(a) * r * 1.65)}" y2="${r1(cy + Math.sin(a) * r * 1.65)}"/>`; }).join('')}</g>` +
  `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffd84a" stroke="#f0a92a" stroke-width="${r1(r * 0.08)}"/><circle cx="${r1(cx - r * 0.3)}" cy="${r1(cy - r * 0.3)}" r="${r1(r * 0.35)}" fill="#fff6c2" opacity=".8"/>`;
const flower = (x0, y0, s, c, cc = '#ffd23f') => `<g transform="translate(${r1(x0)} ${r1(y0)}) scale(${r1(s * 100) / 100})"><path d="M0 0Q2 12 0 22" stroke="#4e9a3e" stroke-width="2.4" fill="none"/>${[0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-6" rx="4.6" ry="6.4" fill="${c}" stroke="rgba(120,40,60,.25)" stroke-width="1" transform="rotate(${a})"/>`).join('')}<circle r="3.6" fill="${cc}" stroke="#d18a00" stroke-width="1"/></g>`;
const tuft = (x0, y0, s, c) => `<path d="M${r1(x0 - 7 * s)} ${r1(y0)}Q${r1(x0 - 6 * s)} ${r1(y0 - 9 * s)} ${r1(x0 - 9 * s)} ${r1(y0 - 15 * s)}Q${r1(x0 - 2 * s)} ${r1(y0 - 9 * s)} ${r1(x0)} ${r1(y0 - 18 * s)}Q${r1(x0 + 2 * s)} ${r1(y0 - 9 * s)} ${r1(x0 + 9 * s)} ${r1(y0 - 14 * s)}Q${r1(x0 + 5 * s)} ${r1(y0 - 7 * s)} ${r1(x0 + 7 * s)} ${r1(y0)}Z" fill="${c}"/>`;
const tree = (x0, y0, s, far = 0) => {
  const k = far ? ['#9cc9a0', '#b4d9b4', '#8fbf95'] : ['#3f9a4c', '#5cbc5c', '#2f7d3c'];
  return `<g transform="translate(${r1(x0)} ${r1(y0)}) scale(${r1(s * 100) / 100})"><ellipse cx="4" cy="2" rx="34" ry="7" fill="#000" opacity="${far ? 0 : 0.12}"/>` +
    `<path d="M-7 0Q-5-30-8-48L8-48Q5-30 8 0Z" fill="${far ? '#b9a58e' : '#9a6a3c'}"/><path d="M2 0Q4-30 2-48L8-48Q5-30 8 0Z" fill="${far ? '#a8937c' : '#7a4f2a'}"/>` +
    `<circle cx="-20" cy="-58" r="24" fill="${k[2]}"/><circle cx="20" cy="-56" r="24" fill="${k[2]}"/><circle cx="0" cy="-80" r="28" fill="${k[2]}"/>` +
    `<circle cx="-22" cy="-62" r="20" fill="${k[0]}"/><circle cx="16" cy="-62" r="20" fill="${k[0]}"/><circle cx="-2" cy="-84" r="24" fill="${k[0]}"/>` +
    `<circle cx="-10" cy="-92" r="10" fill="${k[1]}"/><circle cx="-26" cy="-68" r="7" fill="${k[1]}"/>${far ? '' : '<circle cx="12" cy="-70" r="3.5" fill="#ff6f6f"/><circle cx="-14" cy="-56" r="3.5" fill="#ff6f6f"/><circle cx="4" cy="-96" r="3.5" fill="#ff6f6f"/>'}</g>`;
};
const butterfly = (x0, y0, s, c) => `<g transform="translate(${r1(x0)} ${r1(y0)}) scale(${s}) rotate(-12)"><ellipse cx="-6" cy="-4" rx="7" ry="9" fill="${c}" stroke="rgba(90,40,90,.4)" transform="rotate(-25 -6 -4)"/><ellipse cx="6" cy="-4" rx="7" ry="9" fill="${c}" stroke="rgba(90,40,90,.4)" transform="rotate(25 6 -4)"/><ellipse cx="-5" cy="6" rx="4.5" ry="5.5" fill="${c}" opacity=".85"/><ellipse cx="5" cy="6" rx="4.5" ry="5.5" fill="${c}" opacity=".85"/><rect x="-1.4" y="-9" width="2.8" height="18" rx="1.4" fill="#5a3a5a"/></g>`;

  const gap = Math.round(Math.max(5, Math.min(16, Math.min(aw, ah) * (n > 30 ? 0.012 : 0.018))));

  let best = null;
  for (let c = 2; c <= n; c++) {
    const r = Math.ceil(n / c); if (r * c - n >= c) continue;
    let cw = (aw - gap * (c - 1)) / c, ch = (ah - gap * (r - 1)) / r;
    ch = Math.min(ch, cw * 1.4); cw = Math.min(cw, ch * 1.4);

  board.style.setProperty('--cw', best.cw + 'px');
  board.style.setProperty('--ch', best.ch + 'px');

// the sticker album: one slot for every kind of card, as big as they fit
function layoutAlbum() {

  const n = Math.max(1, slotEls.length), gap = aw < 160 || ah < 90 ? 4 : 6; let best = null;
  for (let c = 1; c <= n; c++) { const r = Math.ceil(n / c), sz = Math.min((aw - gap * (c - 1)) / c, (ah - gap * (r - 1)) / r); if (!best || sz > best.sz) best = { sz, c }; }
  const ss = Math.max(10, Math.min(Math.floor(best.sz), 120));
  slotsEl.style.setProperty('--ss', ss + 'px'); slotsEl.style.setProperty('--sg', gap + 'px');

function sizeHero() { const r = heroC.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); heroC.width = Math.max(1, Math.round(r.width * d)); heroC.height = Math.max(1, Math.round(r.height * d)); heroC._d = d; }
addEventListener('resize', layout);
let sceneT = 0; addEventListener('resize', () => { clearTimeout(sceneT); sceneT = setTimeout(() => paintScene(board.dataset.th || 'meadow'), 150); });

// ---------- the hero beside the board: watches the cards and reacts ----------

let bubT = 0;

  if (text) { bubble.textContent = text; bubble.classList.add('on'); clearTimeout(bubT); bubT = setTimeout(() => bubble.classList.remove('on'), dur * 1000 + 250); }
}
function lookAt(el) {

let heroAcc = 1;
function drawHero(dt, t, amb) {
  // redraw ~30×/s while it moves, on the shared ambient tick while it just breathes (keeps tablets cool)

  if (!(amb || (busy && heroAcc >= 0.033))) return;
  dt = heroAcc; heroAcc = 0;

  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, W, H);

  if (state === 'play' && hero.idle > 14 && hero.mood === 'happy') heroSay('sleep', 'Zzz… 💤', 99);
  hero.jump = Math.max(0, hero.jump - dt * 2);

  const r = Math.max(12, Math.min(W * 0.3, H * 0.31));
  const hop = hero.win ? Math.abs(Math.sin(t * 5)) * r * 0.45 : Math.sin(hero.jump * Math.PI) * r * 0.55;
  const sq = hero.mood === 'sleep' ? 0.06 + Math.sin(t * 1.6) * 0.03 : hop > 1 ? -0.06 : Math.sin(t * 2.6) * 0.03;

// ---------- matched pairs fly into the album ----------
function updateAlbumHead() { document.getElementById('alcount').textContent = `${matched}/${groupsN}`; }

  grp.forEach((q, j) => {

    Object.assign(f.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px', fontSize: Math.min(r.width, r.height) * 0.54 + 'px' });

    const dx = sr.left + sr.width / 2 - (r.left + r.width / 2), dy = sr.top + sr.height / 2 - (r.top + r.height / 2), sc = sr.width / Math.max(r.width, r.height);

    if (!f.animate) { done(); return; }
    const an = f.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx * 0.45}px,${dy * 0.45 - 50}px) scale(${(1 + sc) * 0.6}) rotate(${j ? 12 : -12}deg)`, opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(${sc})`, opacity: j ? 0 : 1 }],

}

function deal(lv) {
  level = lv; L = LEVELS[lv - 1]; K = L.k || 2; groupsN = L.n;
  const gs = groups(L); groupsN = gs.length;

  const muted = sndMuted();

  document.getElementById('alname').textContent = L.name;

function hud() { MG.stat('level', `第 ${level} 關`); MG.stat('moves', `${moves} 步`); MG.stat('time', `⏱ ${fmt(time)}`); }
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function flip(c) {
  if (state !== 'play' || lock || c.up || c.done) return;
  c.up = true; c.el.classList.add('up'); c.el.setAttribute('aria-label', c.label);

  moves++; hud();

      word(grp[0].el, grp[grp.length - 1].el, wd);
      heroSay(st >= 3 ? 'wink' : 'love', st >= 2 ? `🔥 ×${st}` : MG.pick(['Yay! 💖', 'Yes! ✨', 'Got it! ⭐']), 1.2); hero.jump = 1;
      setTimeout(() => toAlbum(grp, alb), 420);

// 🎠 one whole row turns one step (the last card goes round to the front); rows take turns, odd rows go the other way
function rideStep(cb) {

  const ns = dir > 0 ? [seg[c - 1], ...seg.slice(0, c - 1)] : [...seg.slice(1), seg[0]];
  cards.splice(r * c, c, ...ns);
  for (const q of cards) board.append(q.el);
  MG.sfx('whoosh'); heroSay('wow', '🎠 Whee!', 0.9);
  const wrap = dir > 0 ? ns[0] : ns[c - 1];

    const a = before.get(q), b = q.el.getBoundingClientRect();
    if (!q.el.animate) continue;

}
function sparks(el) {
  const r = el.getBoundingClientRect(), br = board.getBoundingClientRect();

    const sp = document.createElement('span'); sp.className = 'spark'; sp.textContent = i % 2 ? '✦' : '★';
    const a = i / 6 * Math.PI * 2, d = r.width * 0.6;
    sp.style.left = (r.left - br.left + r.width / 2 - 8) + 'px'; sp.style.top = (r.top - br.top + r.height / 2 - 10) + 'px';

// a short English + emoji word that pops up between the two cards

const fxc = document.getElementById('fxc'), fxg = fxc.getContext('2d'); let fxOn = 0;
function celebrate() {
  const d = Math.min(2, devicePixelRatio || 1); fxc.width = Math.round(innerWidth * d); fxc.height = Math.round(innerHeight * d); fxc._d = d;
  const T = TH[curTh], cols = [T.b[0], T.b[1], T.ring, '#fff', '#ffd23f', '#ff7aa2'];
  for (let i = 0; i < 7; i++) setTimeout(() => MG.fx.burst(innerWidth * (0.12 + Math.random() * 0.76), innerHeight * (0.2 + Math.random() * 0.45), { n: 26, colors: cols, speed: 360, up: 170, size: 7, life: 1.7, grav: 420, shape: i % 2 ? 'star' : 'sq' }), i * 150);
  fxOn = 4; fxc.classList.add('on');

}
function win() {
  state = 'over'; hero.win = true; heroSay('wink', 'Yay! 🎉', 4); setTimeout(celebrate, 650);
  const rec = MG.record(recKey(level), Math.round(time * 10) / 10, true);
  const mv = MG.record(movesKey(level), moves, true);
  const done = MG.store.get('memory.done', []); if (!done.includes(level)) { done.push(level); MG.store.set('memory.done', done); }
  const lv = level;
  setTimeout(() => {
    if (state !== 'over' || level !== lv) return;
    MG.sfx('win'); setTimeout(() => MG.sfx('yay'), 250);
    const nx = LEVELS[level];
    MG.panel({
      title: `第 ${level} 關完成！`,
      html: `<div class="big">${fmt(time)}</div><p>${L.name}　${moves} 步</p>` +
        (rec.isNew ? `<p class="new">最快紀錄！^_^</p>` : `<p>最快：${fmt(rec.best)}</p>`) + (mv.isNew && !rec.isNew ? `<p class="new">最少步數紀錄！</p>` : '') +
        (nx ? `<p>下一關：${nx.name}</p>` : '<p>全部 40 關都過了，你是記憶大師！^_^</p>'),
      buttons: [...(nx ? [{ label: '下一關', on: () => { MG.store.set('memory.pickLevel', level + 1); start(level + 1); } }] : []), { label: '再玩一次', alt: !!nx, on: () => start(level) }, { label: '選關卡', alt: true, on: menu }],
    });

}
function begin() {
  MG.hide();
  if (L.peek) {   // 👀 every card shows its face for a moment, then they all turn over
    state = 'peek'; peekT = 1.6 + cards.length * 0.13;
    cards.forEach(q => q.el.classList.add('up')); MG.sfx('whoosh'); MG.toast('👀 Look!', 1200); heroSay('wow', '👀 Look!', peekT);
  } else state = 'play';
}
function start(lv) {
  deal(lv); MG.hide();
  // the first time a new way to play shows up, explain it once
  const fresh = flagsOf(L).filter(f => !MG.store.get('memory.seen.' + f, false));
  if (fresh.length) {
    state = 'intro'; fresh.forEach(f => MG.store.set('memory.seen.' + f, true));
    MG.panel({ title: fresh.map(f => NEWS[f][0]).join('＋'), html: fresh.map(f => `<p>${NEWS[f][1]}</p>`).join(''), buttons: [{ label: '開始', on: begin }] });
  } else begin();

function menu() {

  MG.choose({

    html: `<p>翻開兩張牌，一樣的就配對成功。用最少的步數、最快的時間全部找完！不限時間，慢慢翻 ^_^</p><p>40 關裡有 🐶 動物、🚗 交通工具、🍎 食物、🐠 海洋、🦖 恐龍，還有 👀 先偷看、🔢 數字和點點、🌑 找影子、🍼 媽媽和寶寶、🔷 形狀顏色、🔀 會換位置、🍀 三張一樣！</p><p>新玩法：🥕 動物愛吃什麼、🏠 動物的家、🎵 聽聲音配對、✂️ 拼半張圖、🎠 旋轉木馬，最後還有 🏆 大結局！配對成功的牌會飛進旁邊的貼紙本喔。</p>`,
    levels: { count: LEVELS.length, max: LEVELS.length, label: n => `${LEVELS[n - 1].name}・${LEVELS[n - 1].n * (LEVELS[n - 1].k || 2)} 張${done.includes(n) ? ' ✓' : ''}${MG.best(recKey(n)) != null ? '・最快 ' + fmt(MG.best(recKey(n))) : ''}`, short: n => lvShort(n) + (done.includes(n) ? '<small>✓</small>' : '') },
    keys: '點牌翻開　鍵盤可用 <kbd>Tab</kbd> 移動、<kbd>Enter</kbd> 翻牌',
    playing: () => state === 'play' || state === 'peek',
    start: (m, lv) => start(lv),

}
deal(1); menu();
window.MMT = { get th() { return curTh; }, get rides() { return rides; }, get cols() { return gridCols; }, album: () => slotEls.filter(x => x.classList.contains('full')).length, get hero() { return hero.mood; },
  get state() { return state; }, get word() { return lastWord; }, faces: () => cards.map(c => c.face), get lock() { return lock; }, get level() { return level; }, get k() { return K; }, get swaps() { return swaps; },
  start: lv => start(lv), begin: () => begin(), flip: i => flip(cards[i]), done: () => cards.map(c => c.done), html: i => cards[i].el.querySelector('.f').innerHTML, count: LEVELS.length };
MG.loop((dt, t) => {
  if (state === 'peek') { peekT -= dt; if (peekT <= 0) { state = 'play'; cards.forEach(q => q.el.classList.remove('up')); MG.sfx('flip'); } }
  if (state === 'play' && moves + open.length > 0) { time += dt; hud(); }
  // ambient things (hero breathing, critters) share one ~12 fps tick so the screen only updates when needed
  ambAcc += dt; const amb = ambAcc >= 0.08; if (amb) ambAcc = 0;
  drawHero(dt, t, amb); if (amb) drawCritters(dt, t);
  if (fxOn > 0) { fxOn -= dt; MG.fx.step(dt); const d = fxc._d || 1; fxg.setTransform(d, 0, 0, d, 0, 0); fxg.clearRect(0, 0, fxc.width / d, fxc.height / d); if (fxOn > 0) MG.fx.draw(fxg); else { MG.fx.clear(); fxc.classList.remove('on'); } }
});
