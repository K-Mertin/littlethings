<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>彈彈球大冒險 · Bounce Quest</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/offline/offline.js" data-game="bounce" defer></script>
<meta name="theme-color" content="#4fb0ff">
<style>
:root{
  --ink:#2b2340; --mute:#6d6787; --panel:#fffaf0; --line:rgba(43,35,64,.14);
  --red:#ef4b3f; --gold:#ffc23d; --mint:#3fcf8e; --blue:#4a9dff; --violet:#9b6bff;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#4fb0ff;color:var(--ink);font-family:var(--sans);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
[hidden]{display:none!important}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;background:rgba(255,255,255,.88);
  box-shadow:0 3px 0 rgba(43,35,64,.15),inset 0 -2px 0 rgba(43,35,64,.06);font-weight:900;font-size:17px;white-space:nowrap}
.chip .t{font-size:13px;color:var(--mute);font-weight:800}
.ring-ic{width:19px;height:19px;border-radius:50%;border:4px solid var(--gold);box-shadow:inset 0 0 0 1px #b27a00,0 0 0 1px #b27a00}
.star-ic{color:var(--gold);font-size:20px;line-height:1;text-shadow:0 1px 0 #c98a00}
.sp{flex:1}
.hb{width:44px;height:44px;border-radius:15px;background:rgba(255,255,255,.88);box-shadow:0 3px 0 rgba(43,35,64,.15);font-size:20px;display:grid;place-items:center;text-decoration:none}
.hb:active{transform:translateY(2px);box-shadow:none}

/* 觸控按鈕 */
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  padding:0 calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));pointer-events:none;z-index:3}
.touch.playing #pad{display:flex}
#pad .grp{display:flex;gap:14px;pointer-events:auto}
.tb{width:86px;height:86px;border-radius:26px;background:rgba(255,255,255,.5);border:3px solid rgba(255,255,255,.85);
  display:grid;place-items:center;font-size:36px;font-weight:900;color:var(--ink);box-shadow:0 4px 0 rgba(43,35,64,.18);touch-action:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.tb.on{background:rgba(255,255,255,.9);transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,64,.18)}
.tb.jump{width:104px;height:104px;border-radius:50%;background:rgba(239,75,63,.55);color:#fff}
.tb.jump.on{background:rgba(239,75,63,.85)}

/* 畫面（選關、過關、暫停） */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(18px + var(--sat)) 16px calc(18px + var(--sab));z-index:5;overflow:auto}
#menu{background:linear-gradient(180deg,rgba(29,22,54,.25),rgba(29,22,54,.55));justify-content:flex-start}
#menu .inner{display:flex;flex-direction:column;align-items:center;gap:14px;margin:auto 0;width:100%}
.scr.dim{background:rgba(29,22,54,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.logo{display:flex;align-items:center;gap:14px}
.logo .ball{width:64px;height:64px;border-radius:50%;flex:none;position:relative;
  background:radial-gradient(circle at 32% 28%,#ffd0c8 0,#ff5a4c 30%,#d3352a 75%,#8f1f18 100%);box-shadow:0 8px 0 rgba(29,22,54,.3);animation:hop 1.4s ease-in-out infinite}
.logo .ball::before,.logo .ball::after{content:'';position:absolute;top:22px;width:11px;height:15px;border-radius:50%;background:#fff;box-shadow:inset 3px 2px 0 1px #2b2340}
.logo .ball::before{left:21px}.logo .ball::after{left:37px}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.06,.94)}45%{transform:translateY(-18px) scale(.96,1.04)}}
.title{font-size:clamp(34px,6.5vw,62px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 4px 0 #e0463b,0 8px 0 rgba(29,22,54,.35);line-height:1.05}
.title small{display:block;font-size:.34em;letter-spacing:6px;color:#ffe9a8;text-shadow:0 2px 0 rgba(29,22,54,.4);margin-top:6px}
.total{font-weight:900;color:#fff;background:rgba(29,22,54,.45);padding:5px 14px;border-radius:999px;font-size:15px;color:#ffd84a}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,200px));gap:14px;width:100%;max-width:880px;justify-content:center}
.world{display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.22);border-radius:24px;padding:10px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.wh{display:flex;align-items:center;gap:9px;color:#fff;padding:2px 4px 4px}
.wh b{width:32px;height:32px;border-radius:11px;background:var(--wc);display:grid;place-items:center;font-size:18px;box-shadow:0 3px 0 rgba(29,22,54,.3)}
.wh span{font-weight:900;font-size:16px;line-height:1.1;text-shadow:0 2px 0 rgba(29,22,54,.35)}
.wh small{display:block;font-size:10px;letter-spacing:2px;opacity:.8;font-weight:700}
.lv{position:relative;background:var(--panel);border-radius:18px;padding:10px 10px 9px;box-shadow:0 4px 0 rgba(29,22,54,.25);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(29,22,54,.25)}
.lv b{grid-row:span 2;width:46px;height:46px;border-radius:14px;background:var(--wc);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.lv span{font-size:15px;font-weight:900}
.lv i{font-style:normal;color:var(--gold);font-size:16px;letter-spacing:1px;text-shadow:0 1px 0 #c98a00}
.lv i .no{color:#ddd5c4;text-shadow:none}
.lv.cur{outline:3px solid #ffd84a;outline-offset:2px}
.lv.lock{background:#e6e0d3;color:#9a94a8;box-shadow:0 4px 0 rgba(29,22,54,.15)}
.lv.lock b{background:#c9c2b4;font-size:20px}
.card{background:var(--panel);border-radius:28px;padding:24px 26px;box-shadow:0 8px 0 rgba(29,22,54,.3);display:flex;flex-direction:column;align-items:center;gap:12px;min-width:280px;max-width:92vw}
.card h2{margin:0;font-size:32px;font-weight:900}
.bigstars{font-size:50px;letter-spacing:6px;line-height:1}
.bigstars span{display:inline-block;color:#e3dccb}
.bigstars .on{color:var(--gold);text-shadow:0 3px 0 #c98a00;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars .on:nth-child(2){animation-delay:.15s}.bigstars .on:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
.stats{display:flex;gap:10px;font-size:14px;color:var(--mute);font-weight:800}
.stats span{background:rgba(43,35,64,.06);padding:4px 11px;border-radius:999px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{height:50px;padding:0 22px;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(43,35,64,.18);font-weight:900;font-size:17px}
.btn.go{background:var(--red);color:#fff;box-shadow:0 4px 0 #b8322a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,64,.18)}
.home{position:fixed;left:calc(12px + var(--sal));top:calc(10px + var(--sat));z-index:6}
.keys{font-size:13px;color:#fff;text-shadow:0 1px 0 rgba(29,22,54,.5);text-align:center;line-height:1.7;opacity:.9}
.touch .keys{display:none}
@media (max-width:900px){ .levels{grid-template-columns:repeat(2,minmax(0,260px))} }
@media (max-height:560px) and (min-width:700px){ .levels{grid-template-columns:repeat(4,minmax(0,200px))} .logo .ball{width:44px;height:44px} .logo .ball::before,.logo .ball::after{top:14px;width:8px;height:11px}.logo .ball::before{left:13px}.logo .ball::after{left:25px} .title{font-size:30px} .scr{gap:10px} .lv{padding:7px 8px} .lv b{width:38px;height:38px;font-size:15px} .lv span{font-size:13px} .world{padding:7px;gap:6px} }
@media (max-width:420px){ .levels{grid-template-columns:1fr} .title{font-size:30px} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="chip"><span class="t" id="hudName">1-1</span></div>
  <div class="chip" id="hudRings"><span class="ring-ic"></span><span id="ringTxt">0/0</span></div>
  <div class="chip"><span class="star-ic">★</span><span id="starTxt">0/3</span></div>
  <div class="sp"></div>
  <button class="hb" id="bSound" title="聲音">🔊</button>
  <button class="hb" id="bRestart" title="重來這關（R）">↻</button>
  <button class="hb" id="bPause" title="暫停（Esc）">⏸</button>
</div>

<div id="pad">
  <div class="grp"><button class="tb" data-k="left">◀</button><button class="tb" data-k="right">▶</button></div>
  <div class="grp"><button class="tb jump" data-k="jump">⤒</button></div>
</div>

<!-- 選關 -->
<div class="scr" id="menu">
  <a class="hb home" href="../index.html" title="回大廳">🏠</a>
  <div class="inner">
    <div class="logo"><div class="ball"></div><div class="title">彈彈球大冒險<small>BOUNCE QUEST</small></div></div>
    <div class="total" id="totalStars">★ 0</div>
    <div class="levels" id="levels"></div>
    <div class="keys">← → 滾動　空白鍵／↑ 跳（按住跳更高）　R 重來　Esc 暫停　Enter 開始</div>
  </div>
</div>

<!-- 過關 -->
<div class="scr dim" id="win" hidden>
  <div class="card">
    <h2 id="winTitle">過關！</h2>
    <div class="bigstars" id="winStars"></div>
    <div class="stats" id="winStats"></div>
    <div class="row">
      <button class="btn" id="wMenu">選關</button>
      <button class="btn" id="wAgain">再玩一次</button>
      <button class="btn go" id="wNext">下一關 ▶</button>
    </div>
  </div>
</div>

<!-- 暫停 -->
<div class="scr dim" id="pause" hidden>
  <div class="card">
    <h2>休息一下</h2>
    <div class="row">
      <button class="btn" id="pMenu">選關</button>
      <button class="btn" id="pRestart">重來這關</button>
      <button class="btn go" id="pResume">繼續 ▶</button>
    </div>
  </div>
</div>

<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
