<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>彈彈球大冒險 · Bounce Quest</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><script src="/offline/offline.js" data-game="bounce" defer></script>
<meta name="theme-color" content="#7cc7ff">
<style>
:root{
  --ink:#2b2340; --mute:#6d6787; --panel:#fffaf0; --line:rgba(43,35,64,.14);
  --red:#ef4b3f; --gold:#ffc23d; --mint:#3fcf8e; --blue:#4a9dff; --violet:#9b6bff;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#7cc7ff;color:var(--ink);font-family:var(--sans);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#cv{position:fixed;inset:0;display:block;width:100%;height:100%}
[hidden]{display:none!important}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(8px + var(--sat)) calc(10px + var(--sar)) 0 calc(10px + var(--sal));pointer-events:none;z-index:3}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.82);
  box-shadow:0 2px 0 rgba(43,35,64,.12);font-weight:800;font-size:17px;white-space:nowrap}
.chip .t{font-size:13px;color:var(--mute);font-weight:700}
.ring-ic{width:18px;height:18px;border-radius:50%;border:4px solid var(--gold)}
.star-ic{color:var(--gold);font-size:19px;line-height:1}
.sp{flex:1}
.hb{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.82);box-shadow:0 2px 0 rgba(43,35,64,.12);font-size:20px;display:grid;place-items:center}
.hb:active{transform:translateY(2px);box-shadow:none}

/* 觸控按鈕 */
#pad{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;
  padding:0 calc(18px + var(--sar)) calc(18px + var(--sab)) calc(18px + var(--sal));pointer-events:none;z-index:3}
.touch.playing #pad{display:flex}
#pad .grp{display:flex;gap:14px;pointer-events:auto}
.tb{width:86px;height:86px;border-radius:26px;background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.85);
  display:grid;place-items:center;font-size:36px;font-weight:900;color:var(--ink);box-shadow:0 4px 0 rgba(43,35,64,.18);touch-action:none}
.tb.on{background:rgba(255,255,255,.9);transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,64,.18)}
.tb.jump{width:104px;height:104px;border-radius:50%;background:rgba(239,75,63,.55);color:#fff}
.tb.jump.on{background:rgba(239,75,63,.85)}

/* 畫面（選關、過關、暫停） */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;z-index:5;
  background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.35),rgba(124,199,255,.0) 70%)}
.scr.dim{background:rgba(43,35,64,.45)}
.title{font-size:clamp(34px,7vw,64px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 4px 0 #e0463b,0 8px 0 rgba(43,35,64,.25);text-align:center;line-height:1.1}
.title small{display:block;font-size:.36em;letter-spacing:4px;color:#fff;text-shadow:0 2px 0 rgba(43,35,64,.3);margin-top:6px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,170px));gap:14px;width:100%;max-width:560px;justify-content:center}
.lv{position:relative;background:var(--panel);border-radius:22px;padding:14px 10px 12px;box-shadow:0 5px 0 rgba(43,35,64,.18);display:flex;flex-direction:column;align-items:center;gap:4px}
.lv:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,35,64,.18)}
.lv b{font-size:32px;line-height:1;color:var(--red)}
.lv span{font-size:15px;font-weight:800}
.lv i{font-style:normal;color:var(--gold);font-size:18px;letter-spacing:2px}
.lv i .no{color:#d9d3c4}
.lv.lock{background:#e9e4d8;color:#9a94a8}
.lv.lock b{color:var(--mute)}
.card{background:var(--panel);border-radius:28px;padding:24px 26px;box-shadow:0 8px 0 rgba(43,35,64,.2);display:flex;flex-direction:column;align-items:center;gap:12px;min-width:280px;max-width:92vw}
.card h2{margin:0;font-size:30px;font-weight:900}
.bigstars{font-size:46px;letter-spacing:6px;color:var(--gold)}
.bigstars .no{color:#e3dccb}
.stats{display:flex;gap:10px;font-size:14px;color:var(--mute);font-weight:700}
.stats span{background:rgba(43,35,64,.06);padding:4px 10px;border-radius:999px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{height:50px;padding:0 22px;border-radius:16px;background:#fff;box-shadow:0 4px 0 rgba(43,35,64,.18);font-weight:900;font-size:17px}
.btn.go{background:var(--red);color:#fff;box-shadow:0 4px 0 #b8322a}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,35,64,.18)}
.home{position:fixed;left:calc(12px + var(--sal));top:calc(10px + var(--sat));z-index:6}
.keys{font-size:13px;color:#fff;text-shadow:0 1px 0 rgba(43,35,64,.4);text-align:center;line-height:1.7}
.touch .keys{display:none}
@media (max-height:520px){ .levels{grid-template-columns:repeat(6,minmax(0,120px));max-width:none} .lv b{font-size:26px} .title{font-size:34px} .scr{gap:12px} }
@media (max-width:440px){ .levels{grid-template-columns:repeat(2,minmax(0,160px))} }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>
  <div class="chip"><span class="t" id="hudName">1</span></div>
  <div class="chip" id="hudRings"><span class="ring-ic"></span><span id="ringTxt">0/0</span></div>
  <div class="chip"><span class="star-ic">★</span><span id="starTxt">0/3</span></div>
  <div class="sp"></div>
  <button class="hb" id="bSound" title="聲音">🔊</button>
  <button class="hb" id="bRestart" title="重來這關（R）">↻</button>
  <button class="hb" id="bPause" title="暫停（Esc）">⏸</button>
</div>

<div id="pad">
  <div class="grp"><button class="tb" data-k="left">◀</button><button class="tb" data-k="right">▶</button></div>
  <div class="grp"><button class="tb jump" data-k="jump">⤒</button></div>
</div>

<!-- 選關 -->
<div class="scr" id="menu">
  <a class="hb home" href="../index.html" title="回大廳">🏠</a>
  <div class="title">彈彈球大冒險<small>BOUNCE QUEST</small></div>
  <div class="levels" id="levels"></div>
  <div class="keys">← → 滾動　空白鍵／↑ 跳　R 重來　Esc 暫停</div>
</div>

<!-- 過關 -->
<div class="scr dim" id="win" hidden>
  <div class="card">
    <h2>過關！</h2>
    <div class="bigstars" id="winStars"></div>
    <div class="stats" id="winStats"></div>
    <div class="row">
      <button class="btn" id="wMenu">選關</button>
      <button class="btn" id="wAgain">再玩一次</button>
      <button class="btn go" id="wNext">下一關 ▶</button>
    </div>
  </div>
</div>

<!-- 暫停 -->
<div class="scr dim" id="pause" hidden>
  <div class="card">
    <h2>休息一下</h2>
    <div class="row">
      <button class="btn" id="pMenu">選關</button>
      <button class="btn" id="pRestart">重來這關</button>
      <button class="btn go" id="pResume">繼續 ▶</button>
    </div>
  </div>
</div>

<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
