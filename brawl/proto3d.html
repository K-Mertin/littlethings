<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1f3a">
<title>3D 原型・小夥伴大作戰</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--ink:#1c1a2e;--paper:#fff6e6;--red:#ff4d3d;--sun:#ffcc33;--blue:#3fa9ff;--mint:#38d39f;--mute:#a9a6c2;--line:rgba(255,255,255,.14);--sans:"Noto Sans TC",system-ui,sans-serif;--pop:"Bangers","Noto Sans TC",system-ui,sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1f3a;color:var(--paper);font-family:var(--sans);-webkit-user-select:none;user-select:none;touch-action:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block}
#game{display:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.top{position:fixed;z-index:6;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
.top button{padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:rgba(28,26,46,.8);font-weight:700;font-size:14px}
.top button[aria-pressed="true"]{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.top a{padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:rgba(28,26,46,.8);font-weight:700;font-size:14px;color:var(--paper);text-decoration:none}
.panel{position:fixed;z-index:6;top:calc(52px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));width:min(280px,44vw);background:rgba(28,26,46,.8);border:2px solid var(--sun);border-radius:14px;padding:8px 10px}
.panel b{font-size:15px}.bar{height:10px;border:2px solid var(--ink);background:rgba(0,0,0,.45);border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%}
.foes{position:fixed;z-index:6;top:calc(52px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));width:min(180px,34vw);display:flex;flex-direction:column;gap:4px}
.foes>div{background:rgba(28,26,46,.75);border-radius:10px;padding:4px 8px;font-size:12px}
.note{position:fixed;z-index:6;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font-size:12px;color:var(--mute);background:rgba(28,26,46,.7);padding:4px 10px;border-radius:10px;white-space:nowrap}
.cine{position:fixed;z-index:7;left:0;right:0;top:58%;padding:10px 0;background:linear-gradient(90deg,transparent,rgba(255,170,0,.85) 20%,rgba(255,170,0,.85) 80%,transparent);text-align:center;font:900 52px var(--sans);color:#fff27a;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;pointer-events:none;transform:skewY(-3deg)}
.msg{position:fixed;z-index:7;inset:0;display:grid;place-items:center;pointer-events:none;font:900 54px var(--sans);color:var(--sun);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
#touch{position:fixed;inset:0;z-index:5;pointer-events:none}
.stickZone{position:absolute;left:0;bottom:0;width:50%;height:62%;pointer-events:auto;touch-action:none}
.tpad.R .stickZone{left:0}
.stickBase{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.28);
  left:calc(110px + env(safe-area-inset-left,0px));top:calc(100% - 100px - env(safe-area-inset-bottom,0px));transition:opacity .2s}
.stickKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.stickBase.run{border-color:var(--sun)}
.stickBase.run .stickKnob{background:var(--sun)}
.pad{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:250px;height:250px;pointer-events:none}
/* two players on one tablet: 1P on the left half, 2P on the right half, sticks on the outer edges */
.tpad.compact .stickZone{width:24%;height:70%}
.tpad.compact .stickBase{width:110px;height:110px;margin:-55px 0 0 -55px;left:calc(80px + env(safe-area-inset-left,0px));top:calc(100% - 86px - env(safe-area-inset-bottom,0px))}
.tpad.compact.R .stickZone{left:auto;right:0}
.tpad.compact.R .stickBase{left:calc(100% - 80px - env(safe-area-inset-right,0px))}
.tpad.compact .pad{width:210px;height:220px}
.tpad.compact.L .pad{right:auto;left:calc(24% + 4px)}
.tpad.compact.R .pad{right:calc(24% + 4px)}
.tpad.compact .stickBase{border-color:rgba(255,204,51,.55)}
.tpad.compact.R .stickBase{border-color:rgba(63,169,255,.6)}
.ptag{position:absolute;bottom:200px;font:900 14px var(--sans);padding:2px 10px;border-radius:999px;color:#1c1a2e;pointer-events:none}
.tpad.L .ptag{left:6px}.tpad.R .ptag{right:6px}
.ptag.p1{background:#ffcc33}.ptag.p2{background:#3fa9ff}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;
  background:rgba(28,26,46,.5);border:3px solid rgba(255,255,255,.4);box-shadow:0 3px 0 rgba(0,0,0,.3);font-size:19px;line-height:1}
.tb.on{transform:scale(.92);background:rgba(255,255,255,.35)}
.tb[data-b="atk"]{background:rgba(255,77,61,.6);border-color:#ffb3a9;font-size:26px}
.tb[data-b="jmp"]{background:rgba(63,169,255,.55);border-color:#b5dcff}
.tb[data-b="def"]{background:rgba(56,211,159,.5);border-color:#b2f0da}
.tb[data-b="item"]{background:rgba(176,122,255,.5);border-color:#dcc6ff;font-size:16px}
.compact .tb{font-size:16px}.compact .tb[data-b="atk"]{font-size:22px}
.tb.sk{font-size:12px;flex-direction:column;background:rgba(255,204,51,.42);border-color:#ffe59a;text-align:center;display:flex;justify-content:center;align-items:center;gap:1px}
.compact .tb.sk{font-size:10px}
.tb.sk small{font-size:10px;font-weight:700;opacity:.85}
.tb.sk.off{filter:grayscale(1);opacity:.45}
.tb.sk.ult{background:rgba(255,170,0,.5);border-color:#ffe08a}
.tb.sk.ult.ready{animation:ultGlow .6s ease-in-out infinite alternate}
@keyframes ultGlow{from{box-shadow:0 0 0 rgba(255,220,80,0)}to{box-shadow:0 0 18px 6px rgba(255,220,80,.9);background:rgba(255,200,40,.85)}}
</style>
</head>

CHARS.kuma = Object.assign({}, CHARS.gan, { name: '熊寶', en: 'Kuma', look: mkLook({ style: 'bear', skin: '#e3a85c', hair: '#b07a3d', belly: '#ffe2b0', shirt: '#3a8f5c', pants: '#5a4632', shoe: '#3a2a20', belt: '#ffcc33', build: 'big', eye: '#3a2a1a', emblem: 'power', emblemCol: '#ffcc33' }) });

<script type="module">
import * as THREE from 'three';

/* ------------------------------ renderer and scene ------------------------------ */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 16 / 9, 10, 5000);
const hemi = new THREE.HemisphereLight(0xfff6e6, 0x6a6080, 1.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-200, 500, 400); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -700, right: 700, top: 400, bottom: -300, near: 10, far: 1500 }); sun.shadow.bias = -0.0008;

/* toon shading: three flat bands of light, plus a black inverted hull for the outline */
const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 175, 175, 175, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1c1a2e, side: THREE.BackSide });

/* ------------------------------ building a character from simple shapes ------------------------------ */
function makeMat(col, list) { const m = new THREE.MeshToonMaterial({ color: new THREE.Color(col), gradientMap: grad }); list.push(m); return m; }
function part(geo, mat, sx, sy, sz, outline = 0.7) {

}
function buildFighter(f) {
  const L = f.look, mats = [], M = c => makeMat(c, mats), R = HR;
  const root = new THREE.Group(), inner = new THREE.Group(), body = new THREE.Group();
  root.add(inner); inner.add(body);
  const big = L.build === 'big', th = big ? 22 : BODY_H, tw = big ? 15 : L.build === 'slim' ? 11 : 12;
  /* torso: an egg, shirt on top and trousers below */
  const torso = new THREE.Group(); body.add(torso);
  const top = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.62), M(L.shirt)); top.scale.set(tw, th / 2 + 4, tw * 0.85); top.position.y = th / 2; top.castShadow = true;
  const bot = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 10, 0, Math.PI * 2, Math.PI * 0.62, Math.PI * 0.38), M(L.animal ? L.shirt : L.pants)); bot.scale.copy(top.scale); bot.position.y = th / 2; bot.castShadow = true;
  const hull = new THREE.Mesh(SPH, outlineMat); hull.scale.set(tw + 0.9, th / 2 + 4.9, tw * 0.85 + 0.9); hull.position.y = th / 2;
  torso.add(top, bot, hull);
  if (L.belt || L.trim) { const b = new THREE.Mesh(CYL, M(L.belt || L.trim)); b.scale.set(tw * 0.97, 2.4, tw * 0.83); b.position.y = L.belt ? 5 : th * 0.6 + 2; torso.add(b); }
  if (L.emblem) { const e = part(SPH, M(L.emblemCol || '#fff6e6'), 3.2, 3.2, 1, 0.5); e.position.set(tw * 0.55, th * 0.62, tw * 0.6); torso.add(e); }

  const head = new THREE.Group(); body.add(head);
  const skin = L.fur || L.skin;
  head.add(part(SPH, M(skin), R, R, R, 0.9));
  buildHair(head, L, M);
  buildFace(head, L, M);

  const fistR = big ? 7 : 6, gloveCol = L.glove || skin;
  const handN = part(SPH, M(gloveCol), fistR, fistR, fistR), handF = part(SPH, M(L.glove ? shade(L.glove, -0.2) : L.skinD || skin), fistR, fistR, fistR);
  const footN = part(SPH, M(L.shoe), big ? 9.5 : 8.5, 5.2, 6.2), footF = part(SPH, M(shade(L.shoe, -0.2)), big ? 9.5 : 8.5, 5.2, 6.2);
  body.add(handN, handF, footN, footF);
  if (L.scarf) { const s = part(BOX, M(L.scarf), 22, 4, 6, 0.6); torso.add(s); s.position.set(-10, th + 2, 0); s.rotation.z = 0.25; f._scarf = s; }
  if (L.tail === 'long' || L.tail === 'ringed') { const t = part(SPH, M(L.fur || L.shirt), 14, 4, 4); t.position.set(-16, 6, 0); t.rotation.z = 0.6; torso.add(t); }

}
function buildHair(head, L, M) {
  const R = HR, hc = L.hair, s = L.style;
  const cap = (extra = 1.5, start = 0, len = Math.PI * 0.55) => { const g = new THREE.SphereGeometry(1, 24, 16, 0, Math.PI * 2, start, len); const m = new THREE.Mesh(g, M(hc)); m.scale.setScalar(R + extra); m.castShadow = true; const o = new THREE.Mesh(g, outlineMat); o.scale.setScalar(1.06); m.add(o); return m; };
  if (s === 'spiky') {
    const c = cap(1.4); c.rotation.z = 0.35; head.add(c);
    for (let i = 0; i < 7; i++) { const a = -0.3 + i * 0.42, k = part(CONE, M(hc), 5, 12, 5, 0.6); k.position.set(-Math.sin(a) * (R + 2) - 2, Math.cos(a) * (R + 2), (i % 2 ? 4 : -4)); k.rotation.z = a + 0.2; head.add(k); }
    const band = new THREE.Mesh(TOR, M(L.acc)); band.scale.setScalar(R + 0.6); band.rotation.x = Math.PI / 2; band.rotation.z = 0.1; band.position.y = 3; head.add(band);
    for (const z of [-3, 3]) { const t = part(BOX, M(L.acc), 14, 3, 2, 0.5); t.position.set(-R - 6, 2, z); t.rotation.z = -0.3 + z * 0.04; head.add(t); }
  } else if (s === 'long' || s === 'witch') {
    head.add(cap(1.6, 0, Math.PI * 0.5));
    const back = part(SPH, M(shade(hc, -0.08)), 9, 17, 13); back.position.set(-6, -6, 0); head.add(back);
    if (s === 'long') { const clip = part(SPH, M(L.acc), 3.5, 3.5, 3.5, 0.5); clip.position.set(-2, R - 1, 7); head.add(clip); }
    if (s === 'witch') {
      const brim = part(CYL, M(shade(L.acc, -0.15)), 21, 1.4, 21, 0.6); brim.position.set(-1, R - 2, 0); brim.rotation.z = 0.15; head.add(brim);
      const hat = part(CONE, M(L.acc), 12, 30, 12, 0.7); hat.position.set(-4, R + 13, 0); hat.rotation.z = 0.32; head.add(hat);
      const band = part(CYL, M(L.trim), 12.2, 3, 12.2, 0); band.position.set(-1.5, R + 0.5, 0); band.rotation.z = 0.25; head.add(band);
      const star = part(SPH, M('#ffd23f'), 3, 3, 1.5, 0.5); star.position.set(2, R + 8, 8); head.add(star);
    }
  } else if (s === 'bear' || s === 'boar') {
    for (const z of [-8, 8]) { const e = part(SPH, M(L.fur || L.skin), 5, 5, 3, 0.6); e.position.set(-2, R - 1, z); head.add(e); const ei = part(SPH, M(L.belly || '#f0c8a0'), 2.6, 2.6, 1.5, 0); ei.position.set(-0.5, R - 1, z); head.add(ei); }
    const snout = part(SPH, M(s === 'boar' ? '#d89a74' : '#e8c8a0'), 6, 5, 6, 0.6); snout.position.set(R - 2, -3, 0); head.add(snout);
    const nose = part(SPH, M('#2b2018'), 2.4, 1.8, 3, 0); nose.position.set(R + 3.6, -1.5, 0); head.add(nose);
    if (s === 'boar') for (const z of [-4, 4]) { const t = part(CONE, M('#fff6e6'), 1.5, 5, 1.5, 0.4); t.position.set(R + 1, -7, z); t.rotation.z = -0.4; head.add(t); }
    if (s === 'boar') for (let i = 0; i < 4; i++) { const k = part(CONE, M(L.hair), 3, 8, 3, 0.4); k.position.set(-4 - i * 3, R + 1 - i, 0); k.rotation.z = 0.5 + i * 0.2; head.add(k); }
  } else if (s === 'hood') {
    const h = cap(2.2, 0, Math.PI * 0.62); head.add(h);
  } else if (s !== 'dog' && s !== 'dummy') head.add(cap(1.4));
}
function buildFace(head, L, M) {
  const R = HR;
  for (const z of [-1, 1]) {
    const dir = new THREE.Vector3(0.86, 0.02, z * 0.42).normalize(), p = dir.clone().multiplyScalar(R * 0.98), yaw = -Math.atan2(dir.z, dir.x);
    const eye = new THREE.Group(); eye.position.copy(p); eye.rotation.y = yaw; head.add(eye);
    const white = new THREE.Mesh(SPH, new THREE.MeshBasicMaterial({ color: 0xffffff })); white.scale.set(1.1, 4, 2.9); eye.add(white);
    const iris = new THREE.Mesh(SPH, new THREE.MeshBasicMaterial({ color: new THREE.Color(L.eye || '#1c1a2e') })); iris.scale.set(1.2, 3.1, 2.2); iris.position.x = 0.3; eye.add(iris);
    const pupil = new THREE.Mesh(SPH, new THREE.MeshBasicMaterial({ color: 0x1c1a2e })); pupil.scale.set(1.25, 1.8, 1.2); pupil.position.set(0.5, 0.1, 0); eye.add(pupil);
    const hi = new THREE.Mesh(SPH, new THREE.MeshBasicMaterial({ color: 0xffffff })); hi.scale.set(1.3, 0.9, 0.9); hi.position.set(0.8, 1.2, 0.7); eye.add(hi);
    const ring = new THREE.Mesh(SPH, outlineMat); ring.scale.set(1.0, 4.6, 3.5); ring.position.x = -0.2; eye.add(ring);
    const brow = new THREE.Mesh(BOX, new THREE.MeshBasicMaterial({ color: 0x1c1a2e })); brow.scale.set(1, 1.3, 4.2); brow.position.set(0.2, 6, 0); brow.rotation.x = L.angry ? -z * 0.35 : 0; eye.add(brow);
    if (!L.animal) { const blush = new THREE.Mesh(SPH, new THREE.MeshBasicMaterial({ color: 0xff8a96, transparent: true, opacity: 0.55 })); const bp = new THREE.Vector3(0.75, -0.32, z * 0.58).normalize().multiplyScalar(R * 0.97); blush.position.copy(bp); blush.rotation.y = -Math.atan2(bp.z, bp.x); blush.scale.set(0.6, 1.6, 2.6); head.add(blush); }

}

/* ------------------------------ posing: the same skeleton maths as the 2D game ------------------------------ */
const V = (x, y) => ({ x, y });
function poseFighter(rig, f) {
  const L = f.look, P = f.state === 'frozen' ? (f.frozenPose || pose(f)) : pose(f), big = L.build === 'big', R = HR, th = rig.th;
  if (f.state !== 'frozen') f.lastPose = P;
  const hip = V(0, -LIMB * 2 - 6 + P.by);
  const reach = (bend, k) => 1 + k * clamp(1 - Math.abs(bend) / 1.4, 0, 1);
  const leg = (a, side) => { const n = LIMB * (a[0] > 0.9 ? reach(a[1], 0.5) : 1), k = V(hip.x + side * 4 + Math.sin(a[0]) * n, hip.y + Math.cos(a[0]) * n), s = a[0] - a[1]; return { ft: V(k.x + Math.sin(s) * n, k.y + Math.cos(s) * n), s }; };
  const top = V(hip.x + Math.sin(P.lean) * th, hip.y - Math.cos(P.lean) * th);
  const sh = V(lerp(hip.x, top.x, 0.72), lerp(hip.y, top.y, 0.72));
  const arm = a => { const n = LIMB * reach(a[1], 0.7), e = V(sh.x + Math.sin(a[0]) * n, sh.y + Math.cos(a[0]) * n), s2 = a[0] + a[1]; return V(e.x + Math.sin(s2) * n, e.y + Math.cos(s2) * n); };
  const ha = P.lean + P.ht, head = V(top.x + Math.sin(ha) * (R + 3), top.y - Math.cos(ha) * (R + 3));

  rig.torso.position.set(hip.x, -hip.y, 0); rig.torso.rotation.z = -P.lean;
  rig.head.position.set(head.x, -head.y, 0); rig.head.rotation.z = -ha;
  const hn = arm(P.ar), hf = arm(P.al); rig.handN.position.set(hn.x, -hn.y, 9); rig.handF.position.set(hf.x, -hf.y, -9);
  const fn = leg(P.lr, 1), ff = leg(P.ll, -1);
  rig.footN.position.set(fn.ft.x + 3, -fn.ft.y + 1.5, 5); rig.footN.rotation.z = fn.s * 0.3;

  if (P.rot) { rig.inner.position.set(0, P.rc - P.drop, 0); rig.inner.rotation.z = -P.rot; rig.body.position.y = -P.rc; }
  else { rig.inner.position.set(0, 0, 0); rig.inner.rotation.z = 0; rig.body.position.y = 0; }

}

/* ------------------------------ the stage: the 2D background painted onto planes ------------------------------ */
let stageObjs = [];
function buildStage() {
  stageObjs.forEach(o => scene.remove(o)); stageObjs = [];
  const width = Math.ceil(W.maxX + 400), cvs = document.createElement('canvas'); cvs.width = Math.min(8192, width); cvs.height = 540;
  const k = cvs.width / width, c = cvs.getContext('2d');
  const saveCam = W.camX, saveWv = Wv; W.camX = 0; Wv = width;
  c.setTransform(k, 0, 0, 1, 0, 0); (THEMES[W.theme] || drawRoof)(c);
  W.camX = saveCam; Wv = saveWv;
  // back wall: everything above the floor
  const wallTex = new THREE.CanvasTexture(cvs); wallTex.colorSpace = THREE.SRGBColorSpace; wallTex.repeat.set(1, FLOOR_TOP / 540); wallTex.offset.set(0, 1 - FLOOR_TOP / 540);

  // floor: the strip the fighters walk on, laid flat

  floor.rotation.x = -Math.PI / 2; floor.position.set(width / 2, 0, -40 + 105); floor.receiveShadow = true; scene.add(floor); stageObjs.push(floor);
  // the ground keeps going towards the camera in the colour of the floor's front edge
  const px = c.getImageData(Math.floor(cvs.width / 2), FLOOR_TOP + 205, 1, 1).data;
  const front = new THREE.Mesh(new THREE.PlaneGeometry(width + 2000, 1200), new THREE.MeshToonMaterial({ color: new THREE.Color(`rgb(${px[0]},${px[1]},${px[2]})`).convertSRGBToLinear(), gradientMap: grad }));
  front.rotation.x = -Math.PI / 2; front.position.set(width / 2, -0.5, 65 + 600); front.receiveShadow = true; scene.add(front); stageObjs.push(front);
  scene.background = new THREE.Color(W.theme === 'market' ? 0x1b1f3a : 0x9fd3ff);
  hemi.intensity = W.theme === 'market' ? 0.9 : 1.25; sun.intensity = W.theme === 'market' ? 1.0 : 1.6;
}

/* ------------------------------ syncing the game state into the 3D scene ------------------------------ */
const camPos = new THREE.Vector3(480, 180, 520), camLook = new THREE.Vector3(480, 48, 70);
const rigs = new Map(), projMeshes = new Map(), itemMeshes = new Map(), sprites = new Map();
const PCOL = { fire: 0xff8a2f, ice: 0xbfe9ff, star: 0xc9ced8, bolt: 0xffe14a, tornado: 0xcfefff, mstar: 0xffd23f, spell: 0xb48cff, bubble: 0x9fe3ff, phoenix: 0xff7a2f, wave: 0x3fa9ff, bigtornado: 0xcfefff, meteor: 0x8a5a4a, boulder: 0x9a8f86, rock: 0x8e8a98, bone: 0xfff6e6, ink: 0x2b1f3a, bun: 0xfff6e6, fruit: 0xff5a4a, animal: 0xe8b878, ball: 0xff7aa8, arrow: 0xa0662f };

  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 256; const c = cv.getContext('2d');
  if (burst) { c.translate(128, 128); c.beginPath(); for (let i = 0; i < 20; i++) { const a = i * Math.PI * 2 / 20, r = i & 1 ? 62 : 110; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fillStyle = col; c.fill(); c.lineWidth = 8; c.strokeStyle = '#1c1a2e'; c.stroke(); c.translate(-128, -128); col = '#ff4d3d'; }
  c.font = `900 ${size}px "Noto Sans TC",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineWidth = 10; c.strokeStyle = '#1c1a2e'; c.strokeText(txt, 128, 132); c.fillStyle = col; c.fillText(txt, 128, 132);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true })); s.renderOrder = 10; return s;
}
function sync() {
  // fighters
  for (const f of W.fighters) {
    let rig = rigs.get(f);
    if (!rig) { rig = buildFighter(f); rigs.set(f, rig); scene.add(rig.root); }
    const vis = !f.invisible && !(f.state === 'dead' && f.st > 100);
    rig.root.visible = vis; if (!vis) continue;
    poseFighter(rig, f);
    const sz = f.def.size || 1;
    rig.root.position.set(f.x, f.y, f.z); rig.root.scale.set(f.face * sz, sz, sz); rig.root.rotation.y = -0.45 * f.face;
    const flash = f.whiteT > 0 ? 0.9 : f.flash > 0 ? 0.45 : f.auraT > 0 ? 0.25 * f.auraT / 22 : 0;
    for (const m of rig.mats) m.emissive.setRGB(flash, flash * (f.auraT > 0 && !f.flash ? 0.8 : 1), flash * (f.auraT > 0 && !f.flash ? 0.3 : 1));
    rig.root.traverse(o => { if (o.material && o.material.transparent === false && f.invul > 0 && f.state !== 'skill') o.visible = true; });
  }
  for (const [f, rig] of rigs) if (!W.fighters.includes(f)) { scene.remove(rig.root); rigs.delete(f); }
  // projectiles
  for (const p of W.projs) {
    let m = projMeshes.get(p);
    if (!m) { const r = Math.max(6, (p.r || 10) * (p.kind === 'wave' ? 1.5 : 1)); m = new THREE.Mesh(SPH, new THREE.MeshToonMaterial({ color: PCOL[p.kind] || 0xffffff, gradientMap: grad, emissive: PCOL[p.kind] || 0xffffff, emissiveIntensity: 0.45, transparent: p.kind === 'bubble' || p.kind === 'tornado' || p.kind === 'bigtornado', opacity: 0.7 })); m.scale.set(r, p.kind === 'wave' || p.kind === 'bigtornado' ? r * 2 : r, r); m.castShadow = true; projMeshes.set(p, m); scene.add(m); }
    m.position.set(p.x, p.kind === 'wave' || p.kind === 'bigtornado' ? m.scale.y * 0.8 : p.y, p.z); m.rotation.y += 0.2;
  }
  for (const [p, m] of projMeshes) if (!W.projs.includes(p)) { scene.remove(m); projMeshes.delete(p); }
  // items lying around
  for (const it of W.items) {
    let m = itemMeshes.get(it);
    if (!m) { const T = ITEMS[it.kind]; m = it.kind === 'stick' || it.kind === 'umbrella' ? part(CYL, new THREE.MeshToonMaterial({ color: it.kind === 'stick' ? 0xb07a3d : 0x3fa9ff, gradientMap: grad }), 2.5, 40, 2.5) : part(SPH, new THREE.MeshToonMaterial({ color: T.type === 'food' ? 0xffd9a0 : 0x9a9aa8, gradientMap: grad }), 8, 8, 8); if (it.kind === 'stick' || it.kind === 'umbrella') m.rotation.z = Math.PI / 2; itemMeshes.set(it, m); scene.add(m); }
    if (it.holder) { const r = rigs.get(it.holder); if (r) { const v = new THREE.Vector3(); r.handN.getWorldPosition(v); m.position.copy(v); m.rotation.z = -0.6 * it.holder.face; } }
    else { m.position.set(it.x, it.y + 6, it.z); if (it.kind === 'stick' || it.kind === 'umbrella') m.rotation.z = Math.PI / 2 + (it.spin || 0); }
  }
  for (const [it, m] of itemMeshes) if (!W.items.includes(it)) { scene.remove(m); itemMeshes.delete(it); }
  // comic bursts, damage numbers, move names
  for (const p of W.parts) {
    if (p.kind !== 'burst' && p.kind !== 'text' && p.kind !== 'callout') continue;
    let s = sprites.get(p);
    if (!s) { s = p.kind === 'burst' ? textSprite(p.word, p.col || '#fff27a', 80, true) : textSprite(p.txt + (p.kind === 'callout' ? '！' : ''), p.col || '#fff', p.kind === 'callout' ? 48 : 60); sprites.set(p, s); scene.add(s); }
    const k = p.t / p.life, sz = p.kind === 'burst' ? (p.r || 30) * 2.4 * (p.t < 3 ? 0.6 + p.t * 0.2 : 1.2 - k * 0.45) : p.kind === 'callout' ? 150 : 60;
    s.scale.set(sz, sz, 1); s.position.set(p.x, p.y + (p.kind === 'text' ? k * 20 : 0), p.z + 20); s.material.opacity = Math.min(1, (1 - k) * 2);
  }
  for (const [p, s] of sprites) if (!W.parts.includes(p)) { scene.remove(s); s.material.map.dispose(); sprites.delete(p); }
  // camera follows the players, with the game's screen shake
  const cx = clamp(humanCenter(), Wv / 2, Math.max(Wv / 2, W.maxX - Wv / 2)) , sh = W.shake || 0;
  // normal view, or a close-up swing around the hero during an ultimate's cut-in
  const want = new THREE.Vector3(cx, 180, 520), look = new THREE.Vector3(cx, 48, 70);
  if (W.cine) { const f = W.cine.f, k = Math.min(1, W.cine.t / 14), a = -0.6 * f.face + W.cine.t * 0.012 * f.face; want.set(f.x + Math.sin(a) * 150, f.y + 70, f.z + Math.cos(a) * 150); look.set(f.x, f.y + 40, f.z); want.lerp(new THREE.Vector3(cx, 180, 520), 1 - k); }
  camPos.lerp(want, W.cine ? 0.35 : 0.2); camLook.lerp(look, W.cine ? 0.35 : 0.2);
  camera.position.set(camPos.x + (Math.random() - 0.5) * sh, camPos.y + (Math.random() - 0.5) * sh * 0.6, camPos.z);
  camera.lookAt(camLook);
  $('cine').hidden = !W.cine; if (W.cine) $('cineName').textContent = W.cine.name + '！';
  sun.position.set(cx - 250, 520, 420); sun.target.position.set(cx, 0, 80);
}

/* ------------------------------ HUD ------------------------------ */
const $ = id => document.getElementById(id);
function hud() {
  const P = W.player; $('pName').textContent = P.def.name + (P.ult >= ULT_MAX ? '　★ 大絕招 OK（按 O）' : '');
  $('pHp').style.width = (100 * Math.max(0, P.hp) / P.maxHp) + '%'; $('pMp').style.width = (100 * P.mp / P.maxMp) + '%'; $('pUlt').style.width = (100 * P.ult / ULT_MAX) + '%';
  $('foes').innerHTML = W.fighters.filter(f => f.team !== P.team && !f.dead).map(f => `<div>${f.def.name}<div class="bar" style="height:7px"><i style="background:#ff4d3d;width:${100 * Math.max(0, f.hp) / f.maxHp}%"></i></div></div>`).join('');
}

/* ------------------------------ match setup and main loop ------------------------------ */
const HEROLIST = [['rex', '阿烈'], ['yuki', '小雪'], ['moon', '小月'], ['kuma', '熊寶']], ARENA = [['park', '公園'], ['roof', '頂樓'], ['market', '夜市']];
let hero = 'rex', arena = 'park';
function start() {
  for (const [, r] of rigs) scene.remove(r.root); rigs.clear();
  for (const [, m] of projMeshes) scene.remove(m); projMeshes.clear(); for (const [, m] of itemMeshes) scene.remove(m); itemMeshes.clear(); for (const [, s] of sprites) scene.remove(s); sprites.clear();
  newMatch({ mode: 'battle', players: 1, heroes: [hero], foes: 0, diff: 1, team: 'team', lives: 1, time: 0, arena });
  W.fighters.splice(1);                                     // replace the computer heroes with monsters
  [['boar', 160, 50], ['boar', 240, 120], ['bear', 330, 80]].forEach(([id, dx, z]) => { const m = new Fighter(id, 2, W.player.x + dx, z, new AICtl()); m.face = -1; W.fighters.push(m); });
  W.player.ult = 100; W.player.mp = 500; W.msg = null; running = true; paused = false;
  buildStage(); $('msg').hidden = true;
  if (isTouch) { $('touch').hidden = false; Touch.pads.forEach(p => p.setSkills(W.player)); }
  renderBar();
}
function renderBar() {
  $('heroBar').innerHTML = HEROLIST.map(([id, n]) => `<button data-h="${id}" aria-pressed="${id === hero}">${n}</button>`).join('') + '<span style="width:8px"></span>' +
    ARENA.map(([id, n]) => `<button data-a="${id}" aria-pressed="${id === arena}">${n}</button>`).join('') + '<a href="index.html">回 2D 版</a>';
  $('heroBar').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { hero = b.dataset.h; start(); });
  $('heroBar').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { arena = b.dataset.a; start(); });
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 1.2 ? 62 : 38; camera.updateProjectionMatrix(); Wv = 960; }
addEventListener('resize', resize);
isTouch = matchMedia('(pointer:coarse)').matches; if (isTouch) $('note').textContent = '3D 原型：左邊搖桿移動，右邊按鈕攻擊、跳、防、必殺技';
addEventListener('pointerdown', () => Sound.init(), { once: true }); addEventListener('keydown', () => Sound.init(), { once: true });
Keyboard.init(); resize(); start();
let acc = 0, last = performance.now(), skillT = 0;
function frame(now) {
  const dt = Math.min(100, now - last); last = now; acc += dt;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { if (!W.over) step(); else if (++W.overT > 120) start(); acc -= 1000 / 60; n++; }
  if (W.over && !$('msg').hidden === false) { $('msg').textContent = W.player.dead ? '倒下了…' : '勝利！'; $('msg').hidden = false; }
  if (isTouch && ++skillT % 20 === 0) Touch.pads.forEach(p => p.setSkills(W.player));
  sync(); hud(); renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__p3 = { get W() { return W; }, start, setHero(h) { hero = h; start(); }, setArena(a) { arena = a; start(); } };
</script>
