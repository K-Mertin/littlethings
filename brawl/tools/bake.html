<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>小夥伴大作戰：捏角色烘焙器</title>
<style>body{margin:0;background:#2a2f55;color:#fff;font:14px sans-serif}#out{display:flex;flex-wrap:wrap;gap:8px;padding:8px}#out div{background:#3a4070;padding:6px;border-radius:8px;text-align:center}#out img{display:block;image-rendering:auto}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head><body><canvas id="game" hidden></canvas><div id="out"></div>
<script src="../js/core.js"></script><script src="../js/materials.js"></script><script src="../js/draw.js"></script><script src="../js/game.js"></script><script src="../js/magic.js"></script><script src="../js/looks.js"></script>
<script type="module">
/* Sculpted ("clay") versions of the fighters' parts, built in three.js the same way as
   Cobble Keep's characters, then rendered once from the game's 3/4 side view into
   small sprites. The game itself stays 2D: it places these sprites with the same
   skeleton it always used, and still draws eyes, brows and mouth on top in 2D so
   every expression keeps working. Run this page (or tools/bake.js) to re-bake. */
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const SC = 4;                                   // sprite pixels per game unit
const CAM_A = 0.42;                             // camera turned this far towards the face
const C = c => new THREE.Color(c);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
const pm = new THREE.PMREMGenerator(renderer), ENV = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const scene = new THREE.Scene(); scene.environment = ENV;
scene.add(new THREE.HemisphereLight('#fff6ea', '#7a6a8a', 0.9));
const key = new THREE.DirectionalLight('#fff3e0', 2.1); key.position.set(-0.9, 1.5, 1.2); scene.add(key);
const rim = new THREE.DirectionalLight('#ffffff', 1.3); rim.position.set(1.2, 0.5, -1.4); scene.add(rim);
const fill = new THREE.DirectionalLight('#c8d8ff', 0.6); fill.position.set(1, -0.4, 1); scene.add(fill);

/* ---------- materials ---------- */
const memo = f => { const m = new Map(); return (...a) => { const k = a.join('|'); if (!m.has(k)) m.set(k, f(...a)); return m.get(k); }; };
const clay = memo((c, r = 0.5) => new THREE.MeshPhysicalMaterial({ color: C(c), roughness: r, sheen: 0.6, sheenRoughness: 0.5, sheenColor: C('#ffffff'), clearcoat: 0.15, clearcoatRoughness: 0.6, envMapIntensity: 0.6 }));
const skinM = memo(c => new THREE.MeshPhysicalMaterial({ color: C(c), roughness: 0.48, sheen: 0.5, sheenColor: C('#ffd8c8'), clearcoat: 0.25, clearcoatRoughness: 0.45, envMapIntensity: 0.55 }));
const glossy = memo(c => new THREE.MeshPhysicalMaterial({ color: C(c), roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.15, envMapIntensity: 0.9 }));
const metal = memo(c => new THREE.MeshStandardMaterial({ color: C(c), roughness: 0.3, metalness: 0.85, envMapIntensity: 1.4 }));
function knit() { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 64, 64); for (let y = 0; y < 64; y += 4) for (let x = 0; x < 64; x += 4) { g.fillStyle = ((x + y) >> 2) & 1 ? '#9a9a9a' : '#6a6a6a'; g.fillRect(x, y, 4, 4); } const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(10, 5); return t; }
const KNIT = knit();
function hairTex() { const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128; const g = cv.getContext('2d'); g.fillStyle = '#808080'; g.fillRect(0, 0, 128, 128); for (let i = 0; i < 160; i++) { g.strokeStyle = Math.random() > 0.5 ? '#a8a8a8' : '#5a5a5a'; g.globalAlpha = 0.6; g.lineWidth = 1 + Math.random() * 1.5; const x = Math.random() * 128; g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + 6, 40, x - 6, 80, x + 3, 128); g.stroke(); } const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }
const HAIRB = hairTex();
const hairM = memo(c => new THREE.MeshPhysicalMaterial({ color: C(c), roughness: 0.42, bumpMap: HAIRB, bumpScale: 1.2, sheen: 0.9, sheenRoughness: 0.35, sheenColor: C('#ffffff'), clearcoat: 0.35, clearcoatRoughness: 0.3, envMapIntensity: 0.7 }));
const clothTex = (paint) => { const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256; const g = cv.getContext('2d'); paint(g, 512, 256); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

/* ---------- geometry helpers ---------- */
const SEG = 48;
function sculpt(geo, f) { const p = geo.attributes.position, v = new THREE.Vector3(); for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); f(v); p.setXYZ(i, v.x, v.y, v.z); } geo.computeVertexNormals(); return geo; }
const sph = (r = 1, s = SEG) => new THREE.SphereGeometry(r, s, Math.round(s * 0.75));
function mesh(geo, mat, x = 0, y = 0, z = 0, sx = 1, sy = 1, sz = 1, rx = 0, ry = 0, rz = 0) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.set(rx, ry, rz); return m; }
/* 2D game coords (x forward, y DOWN) → 3D (x forward, y UP); z is depth towards the camera side */
const P = (x, y, z = 0) => new THREE.Vector3(x, -y, z);
function cone(r, h, mat, base, dir, seg = 24) { // a horn / spike from base along dir
  const g = new THREE.ConeGeometry(r, h, seg, 6); g.translate(0, h / 2, 0); sculpt(g, v => { const k = v.y / h; v.x *= 1 + 0.25 * Math.sin(k * Math.PI); v.z *= 1 + 0.25 * Math.sin(k * Math.PI); });
  const m = new THREE.Mesh(g, mat); m.position.copy(base); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize()); return m;
}
function tube(pts, r, mat, taper = 1) { const curve = new THREE.CatmullRomCurve3(pts); const g = new THREE.TubeGeometry(curve, 48, r, 16, false); if (taper !== 1) { const p = g.attributes.position, v = new THREE.Vector3(), n = g.parameters.tubularSegments + 1, rs = g.parameters.radialSegments + 1; for (let i = 0; i < n; i++) { const c = curve.getPoint(i / (n - 1)), k = 1 + (taper - 1) * i / (n - 1); for (let j = 0; j < rs; j++) { const idx = i * rs + j; v.fromBufferAttribute(p, idx).sub(c).multiplyScalar(k).add(c); p.setXYZ(idx, v.x, v.y, v.z); } } g.computeVertexNormals(); } return new THREE.Mesh(g, mat); }
const R = 13;
/* a cap of hair over the top and back of the head; tilt pushes it back so the face stays clear */
function hairCap(g, mat, r = R + 1.2, len = 1.2, tilt = 0.45) { const geo = new THREE.SphereGeometry(r, 48, 24, 0, Math.PI * 2, 0, len); const m = new THREE.Mesh(geo, mat); m.rotation.z = tilt; m.position.set(-0.6, 0.6, 0); g.add(m); return m; }
const dirFromAngle = (a, up = 0) => new THREE.Vector3(Math.cos(a), Math.sin(a), up); // in the XY plane

/* ---------- parts ---------- */
function headBase(L, g, col) { g.add(mesh(sph(R), skinM(col || L.skin), 0, 0, 0, 1, 1, 0.96)); }
function earKid(L, g) { g.add(mesh(sph(1), skinM(L.skin), -1.5, -1, 9.5, 3, 4, 2)); g.add(mesh(sph(1), skinM(L.skin), -1.5, -1, -9.5, 3, 4, 2)); }
function bandAround(g, col, y, w = 4, rz = 0, extra = 0.5) { const rr = Math.sqrt(R * R - y * y) + extra; const t = new THREE.TorusGeometry(rr, 1.5, 16, 64); const m = mesh(t, clay(col, 0.6), 0, 0, 0, 1, 1, w / 3); const gr = new THREE.Group(); gr.rotation.z = rz; m.rotation.x = Math.PI / 2; m.position.y = y; gr.add(m); g.add(gr); return m; }
const HEADS = {
  spiky(L, g) { // 阿烈: spiky hair + headband
    headBase(L, g); earKid(L, g);
    const hm = hairM(L.hair);
    hairCap(g, hm, R + 1.2, 1.25, 0.5); // hair cap (top and back)
    [[2.15, 0, 13, 4.6], [1.85, 4, 15, 4.8], [1.55, -3, 16, 5], [1.25, 3, 17, 5], [0.95, -2, 16, 4.6], [0.7, 2, 13, 4], [2.45, -4, 12, 4.2], [2.7, 3, 10, 3.6], [1.75, 8, 11, 3.6], [1.35, -8, 11, 3.6], [1.05, 8, 10, 3.4]].forEach(([a, z, h, r]) => {
      const base = new THREE.Vector3(Math.cos(a) * (R - 2), Math.sin(a) * (R - 2) + 1, z * 0.8), dir = new THREE.Vector3(Math.cos(a) - 0.25, Math.sin(a) + 0.15, z * 0.05);
      g.add(cone(r, h, hm, base, dir));
    });
    for (const [x, z] of [[8, 3], [10, -2], [6, -6]]) g.add(cone(2.6, 6, hm, new THREE.Vector3(x, 6, z), new THREE.Vector3(1, -0.6, 0))); // fringe
    bandAround(g, L.acc, 6.5, 4.6, 0.3, 0.9);
  },
  witch(L, g) { // 小月: long hair, pointed hat
    headBase(L, g); earKid(L, g);
    const hm = hairM(L.hair);
    hairCap(g, hm, R + 1.3, 1.3, 0.55);
    const back = sculpt(sph(1), v => { const k = (1 - v.y) / 2; v.x -= k * 0.35; v.z *= 1 + k * 0.25; }); g.add(mesh(back, hm, -8, -8, -1, 8, 16, 8.5)); // long hair down the back
    g.add(mesh(sph(1), hm, 0, -8, -10.5, 3.4, 10, 2.6)); g.add(mesh(sph(1), hm, -7, -6, 8.5, 3, 8.5, 2.2)); // side locks (the near one sits behind the face)
    for (const [x, y, z, s] of [[9, 7.5, 2, 4], [10.5, 4.5, -3, 3.5], [7, 9, -6, 3.5], [6, 9.5, 6, 3.2]]) g.add(mesh(sph(1), hm, x, y, z, s, s * 0.8, s)); // bangs
    const hat = new THREE.Group(); hat.position.set(-1, 9, 0); hat.rotation.z = 0.28; g.add(hat);
    const brim = new THREE.CylinderGeometry(19, 19, 1.6, 64); sculpt(brim, v => { const r = Math.hypot(v.x, v.z); v.y += Math.pow(r / 19, 3) * 2.4 * (v.x < 0 ? 1 : 0.6); }); hat.add(mesh(brim, clay(shade(L.acc, -0.12), 0.55), 0, 0, 0));
    const cg = new THREE.ConeGeometry(11, 30, 48, 24, true); cg.translate(0, 15, 0); sculpt(cg, v => { const k = v.y / 30; v.x -= Math.pow(k, 2.2) * 10; v.y -= Math.pow(k, 3) * 4; });
    const cm = clay(L.acc, 0.55); cm.side = THREE.DoubleSide; hat.add(mesh(cg, cm, 0, 0.5, 0));
    hat.add(mesh(new THREE.CylinderGeometry(11.2, 11.6, 3.6, 48), clay(L.trim, 0.4), 0, 2.2, 0));
    const star = new THREE.Shape(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 + Math.PI / 2, r = i & 1 ? 1.8 : 4; i ? star.lineTo(Math.cos(a) * r, Math.sin(a) * r) : star.moveTo(Math.cos(a) * r, Math.sin(a) * r); }
    const sg = new THREE.ExtrudeGeometry(star, { depth: 1.2, bevelEnabled: true, bevelSize: 0.6, bevelThickness: 0.6, bevelSegments: 3 }); sg.center();
    hat.add(mesh(sg, metal('#ffd23f'), 4, 12, 8.5, 1, 1, 1, 0, 0.5, 0.2));
  },
  pangolin(L, g) { // 阿甲: scaled cap, long snout, headband
    headBase(L, g, L.fur);
    const sc = clay(shade(L.fur, -0.08), 0.42);
    for (let row = 0; row < 4; row++) { const lat = 1.15 - row * 0.32, n = 7 - row; for (let k = 0; k < n; k++) { const lon = (k / (n - 1) - 0.5) * 2.4 - 0.35 * row; const v = new THREE.Vector3(Math.cos(lat) * Math.cos(lon) * -1 + 0.2, Math.sin(lat), Math.cos(lat) * Math.sin(lon) * 1.1).normalize();
      const s = mesh(sph(1, 24), row % 2 ? sc : clay(shade(L.fur, -0.2), 0.38), v.x * (R + 1.2), v.y * (R + 1.2) + 0.5, v.z * (R + 1.2), 5.8, 2.2, 5.2); s.lookAt(s.position.clone().multiplyScalar(2)); s.rotateX(Math.PI / 2); g.add(s); } }
    const sn = sculpt(sph(1), v => { if (v.x > 0) { v.x *= 1 + v.x * 0.9; v.y *= 1 - v.x * 0.35; } }); g.add(mesh(sn, skinM(L.skin), 9, -5.5, 0, 9, 4.6, 5.2, 0, 0, -0.12));
    g.add(mesh(sph(1), glossy('#3a2a30'), 25, -5, 0, 2.2, 1.9, 2.2));
    for (const z of [-9, 9]) g.add(mesh(sph(1), skinM(L.skin), -3, 2, z, 3, 3.6, 1.6));
    bandAround(g, L.band, 7.5, 4, 0.35, 1.6);
  }
};
function body(L) { // the egg: shirt over pants, trim and belt as painted bands
  const big = L.build === 'big', th = big ? 22 : 19, tw = big ? 15 : L.build === 'slim' ? 11 : 12, ry = th / 2 + 4;
  const v = y2 => Math.acos(Math.max(-1, Math.min(1, -(y2 + th / 2) / ry))) / Math.PI; // 2D y (hip-local) → texture v
  const tex = clothTex((g, W, H) => {
    g.fillStyle = L.shirt; g.fillRect(0, 0, W, H);
    if (!L.animal) { g.fillStyle = L.pants; g.fillRect(0, v(-3) * H, W, H); }
    if (L.trim) { g.fillStyle = L.trim; g.fillRect(0, v(-th * 0.62) * H, W, (v(-th * 0.62 + 3) - v(-th * 0.62)) * H); }
    if (L.belt) { g.fillStyle = L.belt; g.fillRect(0, v(-6) * H, W, (v(-2.5) - v(-6)) * H); }
    if (L.belly) { g.fillStyle = L.belly; g.beginPath(); g.ellipse(W * 0.5, H * 0.5, W * 0.12, H * 0.3, 0, 0, 7); g.fill(); }
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, v(-3) * H); g.lineTo(W, v(-3) * H); g.stroke();
  });
  const m = new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.82, bumpMap: KNIT, bumpScale: 0.35, sheen: 0.7, sheenRoughness: 0.6, sheenColor: C('#ffffff'), envMapIntensity: 0.45 });
  const g = new THREE.Group(); g.add(mesh(sph(1, 64), m, 0, 0, 0, tw, ry, tw * 0.9));
  // collar
  const col = new THREE.TorusGeometry(5.2, 1.2, 12, 40); g.add(mesh(col, clay(shade(L.shirt, -0.12), 0.7), 1.5, ry - 3, 0, 1, 1, 0.8, Math.PI / 2 + 0.25, 0, -0.15));
  return { g, ox: 0, oy: -th / 2 };
}
function fist(L, big) {
  const r = big ? 7 : 6, mat = L.glove ? (L.beast ? skinM(L.glove) : clay(L.glove, 0.45)) : skinM(L.skin), g = new THREE.Group();
  g.add(mesh(sph(r), mat, 0, 0, 0, 1, 0.95, 0.9));
  for (let i = 0; i < 4; i++) g.add(mesh(sph(1, 20), mat, r * 0.62, r * (0.5 - i * 0.33), r * 0.35, r * 0.34, r * 0.22, r * 0.34)); // knuckles
  g.add(mesh(sph(1, 20), mat, r * 0.2, r * 0.15, r * 0.82, r * 0.42, r * 0.28, r * 0.25, 0, 0, -0.5)); // thumb
  if (L.wrap) g.add(mesh(new THREE.CylinderGeometry(r * 0.95, r * 0.95, r * 0.7, 32), clay(L.wrap, 0.75), -r * 0.45, 0, 0, 1, 1, 1, 0, 0, Math.PI / 2));
  return { g };
}
function shoe(L, big) {
  const rx = big ? 9.5 : 8.5, g = new THREE.Group();
  const up = sculpt(sph(1), v => { if (v.y < 0) v.y *= 0.4; v.x += v.y > 0 ? -v.y * 0.25 : 0; });
  g.add(mesh(up, glossy(L.shoe), 0, 0.5, 0, rx, 5.6, 5));
  g.add(mesh(new THREE.CylinderGeometry(1, 1, 1, 40), clay(L.sole || shade(L.shoe, -0.45), 0.8), 0, -3.2, 0, rx * 1.02, 2.2, 5.2));
  const st = L.stripe || L.trim || L.acc; if (st) { const t = tube([P(-rx * 0.55, -0.5, 4.2), P(-rx * 0.05, -3.4, 5), P(rx * 0.45, -0.8, 4.6)], 0.8, clay(st, 0.5)); g.add(t); }
  g.add(mesh(sph(1, 16), clay('#fff6e6', 0.6), rx * 0.1, 3.8, 1, 2.6, 0.8, 2.2)); // laces
  return { g };
}

/* ---------- render one part to a sprite ---------- */
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -200, 200);
function shot(group, half, ox = 0, oy = 0) { // half = half-size of the frame in game units; (ox,oy) = part origin in 2D game coords
  const S = Math.round(half * 2 * SC); renderer.setSize(S, S);
  const d = new THREE.Vector3(Math.sin(CAM_A), 0.16, Math.cos(CAM_A)).normalize();
  const tgt = new THREE.Vector3(ox, -oy, 0); cam.position.copy(tgt).addScaledVector(d, 100); cam.up.set(0, 1, 0); cam.lookAt(tgt);
  cam.left = -half; cam.right = half; cam.top = half; cam.bottom = -half; cam.updateProjectionMatrix();
  scene.add(group); renderer.render(scene, cam); scene.remove(group);
  // ink outline around the silhouette, like the rest of the game
  const cv = document.createElement('canvas'); cv.width = cv.height = S; const g = cv.getContext('2d');
  const sil = document.createElement('canvas'); sil.width = sil.height = S; const sg = sil.getContext('2d'); sg.drawImage(renderer.domElement, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#1c1a2e'; sg.fillRect(0, 0, S, S);
  const o = 1.15 * SC; for (let a = 0; a < 16; a++) g.drawImage(sil, Math.cos(a / 16 * Math.PI * 2) * o, Math.sin(a / 16 * Math.PI * 2) * o);
  g.drawImage(renderer.domElement, 0, 0);
  return { url: cv.toDataURL('image/png'), half, cv };
}
function bake(id, L) {
  const big = L.build === 'big', out = { id, sc: SC, parts: {} };
  const h = new THREE.Group(); HEADS[L.style](L, h); out.parts.head = shot(h, L.style === 'witch' ? 34 : 26);
  const b = body(L); out.parts.body = shot(b.g, 20);
  out.parts.fist = shot(fist(L, big).g, 10);
  out.parts.shoe = shot(shoe(L, big).g, 13);
  return out;
}
const JOBS = [['rex', CHARS.rex.look], ['moon', CHARS.moon.look], ['jia', BEASTS.jia.look]];
const res = {};
for (const [id, L] of JOBS) {
  res[id] = bake(id, L);
  const d = document.createElement('div'); d.innerHTML = `<b>${id}</b>`; for (const k in res[id].parts) { const im = new Image(); im.src = res[id].parts[k].url; im.width = res[id].parts[k].cv.width / 2; d.appendChild(im); } out.appendChild(d);
}
window.BAKED = Object.fromEntries(Object.entries(res).map(([id, r]) => [id, { sc: r.sc, parts: Object.fromEntries(Object.entries(r.parts).map(([k, p]) => [k, { url: p.url, half: p.half }])) }]));
window.__done = true;
</script></body></html>
