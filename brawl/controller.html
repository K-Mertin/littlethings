<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b1f3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>手把・小夥伴大作戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#1c1a2e; --paper:#fff6e6; --red:#ff4d3d; --sun:#ffcc33; --blue:#3fa9ff; --mint:#38d39f; --mute:#a9a6c2;
  --panel:rgba(28,26,46,.92); --line:rgba(255,255,255,.14); --me:#ffcc33;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1b1f3a;color:var(--paper);font-family:var(--sans);overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px));overflow:auto;touch-action:pan-y}
.title{font-weight:900;font-size:clamp(28px,8vw,44px);letter-spacing:.08em;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--red);margin:0;text-align:center}
.sub{color:var(--mute);font-size:14px;text-align:center;margin:0;max-width:420px;line-height:1.6}
.go{font-weight:900;font-size:22px;letter-spacing:.1em;padding:12px 34px;border-radius:16px;background:var(--red);color:#fff;box-shadow:0 5px 0 #a8261b}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a8261b}
.ghost{padding:9px 16px;border-radius:12px;border:2px solid var(--line);font-weight:700;font-size:14px}
input{background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:20px;font-weight:700;text-align:center;width:min(260px,80vw);-webkit-user-select:text;user-select:text}
.tag{display:inline-block;font-weight:900;padding:2px 10px;border-radius:999px;color:var(--ink);background:var(--me)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;width:min(640px,100%)}
.hero{position:relative;border:2px solid var(--line);border-radius:14px;padding:4px 4px 6px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center}
.hero img{width:84px;height:77px}
.hero b{font-size:15px}
.hero[aria-pressed="true"]{border-color:var(--me);background:rgba(255,204,51,.14)}
.hero.locked{opacity:.35}
.hero .who{position:absolute;top:3px;left:4px;font-size:10px;font-weight:900;color:var(--ink);background:#fff6e6;border-radius:8px;padding:0 5px}
.others{font-size:13px;color:var(--mute);text-align:center}
.field{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:13px;font-weight:700}
#room{font-family:"Bangers",var(--sans);letter-spacing:.2em;text-transform:uppercase;width:min(200px,60vw);color:var(--sun)}
.roomline{margin:0;color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center}.roomline b{color:var(--sun);letter-spacing:.12em}.roomline .ghost{padding:4px 10px;font-size:12px}
.status{color:#ffb35c;font-size:14px;text-align:center;min-height:1em}

/* ---------- the pad ----------
   The phone only holds buttons (the picture is on the big screen), so nothing has to hug the edges:
   the info card sits a little below the top, the stick rests left of centre and the buttons right of centre. */
#pad{position:fixed;inset:0;touch-action:none}
.hud{position:absolute;top:calc(max(10px, 5vh) + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(560px,64vw);
  display:flex;align-items:center;gap:10px;pointer-events:none;background:rgba(28,26,46,.75);border:2px solid var(--line);border-radius:16px;padding:8px 14px}
.hud .name{font-weight:900;font-size:16px;white-space:nowrap}
.bars{flex:1;display:flex;flex-direction:column;gap:4px}
.bar{position:relative;height:14px;border:2px solid var(--ink);background:rgba(0,0,0,.45);border-radius:4px;overflow:hidden}
.bar.mp{height:10px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .15s}
.bar.mp i{background:var(--blue)}
.bar s{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.7)}
.hearts{color:#ff5a7a;font-size:15px;white-space:nowrap}
#pauseBtn{position:absolute;top:calc(max(10px, 5vh) + env(safe-area-inset-top,0px));right:calc(max(12px, 3vw) + env(safe-area-inset-right,0px));width:48px;height:44px;border-radius:12px;background:rgba(28,26,46,.7);border:2px solid var(--line);font-weight:900}
/* the stick: touch anywhere on the left half; at rest it waits left of centre */
.stickZone{position:absolute;left:0;top:0;bottom:0;width:50%}
.stickBase{position:absolute;width:160px;height:160px;margin:-80px 0 0 -80px;left:50%;top:60%;
  border-radius:50%;background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.25)}
.stickBase.run{border-color:var(--sun)}
.stickKnob{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:rgba(255,246,230,.85);border:3px solid var(--ink)}
/* buttons: one block right of centre — skills | 防 跳 | 攻 */
.btns{position:absolute;left:75%;top:60%;transform:translate(-50%,-50%);width:min(44vw,360px);aspect-ratio:1.25;pointer-events:none}
.b{pointer-events:auto;position:absolute;border-radius:50%;border:3px solid var(--ink);font-weight:900;font-size:26px;color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.b.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35);filter:brightness(1.15)}
.b.atk{width:36%;aspect-ratio:1;right:0;top:57%;margin-top:-18%;background:var(--red);color:#fff}
.b.def{width:27%;aspect-ratio:1;left:34%;top:4%;background:var(--blue)}
.b.jmp{width:27%;aspect-ratio:1;left:34%;bottom:4%;background:var(--mint)}
.b.sk{width:30%;height:26%;left:0;border-radius:14px;background:var(--sun);font-size:14px;line-height:1.1;text-align:center;padding:2px}
.b.sk small{display:block;font-size:10px;opacity:.75}
.b.sk.low{filter:grayscale(.8) brightness(.6)}
.b.sk.ult{background:linear-gradient(to top,#ffb800 var(--fill,0%),#5a4a2a var(--fill,0%));color:#fff6e6;text-shadow:0 1px 2px #000}
.b.sk.ult.low{filter:none}
.b.sk.ult.ready{background:#ffcc33;color:var(--ink);text-shadow:none;animation:ultGlow .6s ease-in-out infinite alternate}
@keyframes ultGlow{from{box-shadow:0 4px 0 rgba(0,0,0,.35)}to{box-shadow:0 0 22px 8px rgba(255,220,80,.95)}}
.b.s3{top:5%}.b.s2{top:37%}.b.s1{top:69%}
.b.item{width:21%;aspect-ratio:1;right:7%;top:0;background:#b07aff;color:#fff;font-size:18px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.b.item small{font-size:10px;font-weight:700;opacity:.9}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(10px, 5vh) + 70px + env(safe-area-inset-top,0px));color:var(--mute);font-size:12px;pointer-events:none;text-align:center;white-space:nowrap}
.out{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:28px;color:var(--mute);pointer-events:none;background:rgba(14,12,28,.4)}
/* story lines mirrored from the big screen: any phone can turn the page */
.pstory{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));background:var(--panel);border:3px solid var(--sun);border-radius:20px;
  padding:14px 18px;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center;z-index:3}
.pstory b{color:var(--sun);font-size:17px}.pstory p{margin:6px 0 12px;font-size:18px;line-height:1.5}
.pstory .row{display:flex;gap:10px;justify-content:center;align-items:center}
@media (orientation:portrait){
  .hud{width:calc(100% - 90px);left:12px;transform:none;flex-wrap:wrap}
  .stickBase{top:72%;width:140px;height:140px;margin:-70px 0 0 -70px}
  .btns{left:70%;top:76%;width:min(50vw,320px)}
  /* standing phone: the three skills become a row above 防 跳 攻 */
  .b.sk{top:-40%;width:31%;height:30%;font-size:12px;white-space:nowrap;letter-spacing:-.02em}
  .b.s3{left:0}.b.s2{left:34.5%}.b.s1{left:69%}
  .b.item{width:27%;right:6%;top:0;font-size:16px}
  .b.item small{display:none}
  .b.def{left:6%;top:2%;width:30%}.b.jmp{left:6%;bottom:2%;width:30%}
  .b.atk{width:42%;top:66%;margin-top:-21%}
  .hint{top:calc(max(10px, 5vh) + 90px + env(safe-area-inset-top,0px))}
}
</style>
</head>
<body>

<div class="page" id="join">
  <p class="title">小夥伴大作戰</p>
  <p class="sub">這支手機會變成手把。</p>
  <label class="field">房間號碼<input id="room" maxlength="5" placeholder="看大螢幕" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
  <label class="field">你的名字<input id="name" maxlength="8" placeholder="名字" autocomplete="off"></label>
  <p class="sub" style="font-size:12px">房間號碼要和大螢幕上的一樣。</p>
  <button class="go" id="joinBtn">加入！</button>
  <p class="status" id="joinStatus"></p>
</div>

<div class="page" id="pick" hidden>
  <p style="margin:0;font-size:18px"><span class="tag" id="pickTag">1P</span> <b id="pickName"></b> 選一個角色</p>
  <div class="heroes" id="heroes"></div>
  <p class="others" id="others"></p>
  <p class="roomline">房間 <b class="roomCode"></b> <button class="ghost leave">換房間</button></p>
  <button class="go" id="startBtn">大家都好了，開始！</button>
  <p class="sub" style="font-size:12px">也可以在大螢幕上按開始。</p>
</div>

<div class="page" id="wait" hidden>
  <p class="title" id="waitTitle">看大螢幕！</p>
  <p class="sub" id="waitSub"></p>
  <button class="go" id="nextStageBtn" hidden>下一關 ▶</button>
  <button class="go" id="againBtn" hidden>再來一場</button>
  <p class="status" id="waitStatus"></p>
  <p class="roomline">房間 <b class="roomCode"></b> <button class="ghost leave">換房間</button></p>
</div>

<div id="pad" hidden>
  <div class="hud"><span class="tag" id="padTag">1P</span><span class="name" id="padName"></span>
    <div class="bars"><div class="bar"><i id="hpBar" style="width:100%"></i></div><div class="bar mp" id="mpWrap"><i id="mpBar" style="width:50%"></i></div></div>
    <span class="hearts" id="hearts"></span></div>
  <button id="pauseBtn" aria-label="暫停">II</button>
  <div class="hint" id="padHint">左邊拖曳移動，推到底跑步</div>
  <div class="stickZone" id="stickZone"><div class="stickBase" id="stickBase"><div class="stickKnob" id="knob"></div></div></div>
  <div class="btns">
    <button class="b sk s1" data-k="3"></button><button class="b sk s2" data-k="4"></button><button class="b sk s3" data-k="5"></button>
    <button class="b item" data-k="6" id="itemBtn">撿</button><button class="b def" data-k="2">防</button><button class="b jmp" data-k="1">跳</button><button class="b atk" data-k="0">攻</button>
  </div>
  <div class="out" id="outMsg" hidden>出局了，等下一場</div>
  <div class="pstory" id="pStory" hidden>
    <b id="psName"></b><p id="psText"></p>
    <div class="row"><button class="go" id="psNext">下一句 ▶</button><button class="ghost" id="psSkip">跳過</button></div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), LOCAL = Q.get('net') === 'local';
let ROOM = (Q.get('room') || '').toUpperCase();
const cleanRoom = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
const PEER_JS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const store = { get(k, d) { try { const v = localStorage.getItem('buddybattle.pad.' + k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('buddybattle.pad.' + k, v); } catch (e) {} } };
/* one id per tab (survives a reload, so a phone that drops out gets its seat back) */
let cid = null; try { cid = sessionStorage.getItem('buddybattle.pad.cid'); } catch (e) {}
if (!cid) { cid = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('buddybattle.pad.cid', cid); } catch (e) {} }
const show = id => ['join', 'pick', 'wait', 'pad'].forEach(p => $(p).hidden = p !== id);
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------------- connection ---------------- */
const Net = {
  conn: null, bc: null, me: null, ok: false,
  send(d) {
    if (this.bc) this.bc.postMessage({ to: 'host', from: this.me, d });
    else if (this.conn && this.conn.open) try { this.conn.send(d); } catch (e) {}
  },
  hello() {
    this.send({ t: 'hello', cid, name: $('name').value.trim() });
    clearTimeout(this.helloT);
    this.helloT = setTimeout(() => { if (mode === 'join' && (this.ok || this.peer)) status('房間 ' + ROOM + ' 沒有回應。請確認大螢幕上的房間號碼，改好再按加入。'); }, 5000);
  },
  async start() {
    if (LOCAL) {
      this.me = cid + '-' + Math.random().toString(36).slice(2, 6);
      this.bc = new BroadcastChannel('buddybattle-' + ROOM);
      this.bc.onmessage = e => { const m = e.data; if (m.to === this.me || m.to === '*') onMsg(m.d); };
      this.ok = true; status(''); this.hello(); return;
    }
    await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = PEER_JS; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    this.peer = new Peer({ debug: 0 });
    this.peer.on('open', () => this.connect());
    this.peer.on('error', e => {
      if (e.type === 'peer-unavailable') { this.leave(); show('join'); status('找不到房間 ' + ROOM + '。請確認大螢幕上的房間號碼，改好再按加入。'); $('room').focus(); return; }
      status('連線有問題，重試中…'); setTimeout(() => this.peer && this.connect(), 2500);
    });
    this.peer.on('disconnected', () => setTimeout(() => this.peer && !this.peer.destroyed && this.peer.reconnect(), 1000));
  },
  /* drop the connection (to switch rooms) */
  leave() {
    if (this.ok) this.send({ t: 'bye' });
    if (this.bc) { this.bc.close(); this.bc = null; }
    const p = this.peer; this.peer = null; this.conn = null; if (p && !p.destroyed) p.destroy();
    this.ok = false; mode = 'join';
  },
  connect() {
    if (!this.peer) return;
    if (this.conn && this.conn.open) return;
    const c = this.conn = this.peer.connect('buddybattle-' + ROOM, { reliable: true });
    c.on('open', () => { this.ok = true; status(''); this.hello(); });
    c.on('data', d => onMsg(d));
    c.on('close', () => { if (this.conn !== c || !this.peer) return; this.ok = false; status('斷線了，重新連線中…'); setTimeout(() => this.connect(), 1500); });
  }
};
function status(t) { ['joinStatus', 'waitStatus'].forEach(id => $(id).textContent = t); }

/* ---------------- messages from the big screen ---------------- */
let me = { slot: 0, col: '#ffcc33', hero: null, name: '' }, heroes = [], skills = [], maxMp = 500, lastHp = null, mode = 'join';
function setMe(d) {
  me = { ...me, slot: d.slot, col: d.col, hero: d.hero, name: d.name };
  document.documentElement.style.setProperty('--me', d.col);
  ['pickTag', 'padTag'].forEach(id => $(id).textContent = (d.slot + 1) + 'P');
  $('pickName').textContent = d.name; $('padName').textContent = d.name;
}
function onMsg(d) {
  if (!d || !d.t) return;
  if (d.t === 'who') return Net.hello();
  if (d.t === 'full') { show('join'); return status('已經有 4 個人了，下一場再加入吧。'); }
  if (d.t === 'busy') { show('join'); return status('正在打，這場結束後再按一次加入。'); }
  if (d.t === 'closed') { show('join'); return status('大螢幕把房間關掉了。'); }
  if (d.t === 'welcome') { heroes = d.heroes; return; }
  if (d.t === 'lobby') { setMe(d); mode = 'lobby'; $('pStory').hidden = true; drawHeroes(d.players); show('pick'); return; }
  if (d.t === 'play') { setMe(d); mode = 'play'; skills = d.skills; maxMp = d.maxMp; lastHp = null; setupSkills(); show('pad'); $('outMsg').hidden = true; vib(60); return; }
  if (d.t === 'result') { setMe(d); mode = 'result'; $('pStory').hidden = true; $('waitTitle').textContent = d.title || '比賽結束'; $('waitSub').textContent = d.next ? '要繼續下一關嗎？' : '要再打一場嗎？'; $('nextStageBtn').hidden = !d.next; $('againBtn').hidden = false; $('againBtn').className = d.next ? 'ghost' : 'go'; show('wait'); releaseAll(); return; }
  if (d.t === 'story') { $('pStory').hidden = !d.on; if (d.on) { $('psName').textContent = d.name; $('psText').textContent = d.text; $('psNext').textContent = d.last ? '開始 ▶' : '下一句 ▶'; releaseAll(); } return; }
  if (d.t === 'hud') {
    $('hpBar').style.width = (100 * d.hp / d.max) + '%';
    $('hpBar').style.background = d.hp / d.max < 0.3 ? '#ff7a3d' : '';
    $('mpBar').style.width = (100 * d.mp / maxMp) + '%';
    $('hearts').textContent = d.lives > 4 ? '♥×' + d.lives : '♥'.repeat(Math.max(0, d.lives));
    document.querySelectorAll('.b.sk').forEach((b, i) => { const s = skills[i]; if (!s) return; const ready = s.ult ? (d.ult || 0) >= 100 : d.mp >= s.cost; b.classList.toggle('low', !ready); if (s.ult) { b.classList.toggle('ready', ready); b.style.setProperty('--fill', (d.ult || 0) + '%'); if (ready && !b.dataset.was) vib([30, 40, 30]); b.dataset.was = ready ? '1' : ''; } });
    if (lastHp !== null && d.hp < lastHp) vib(d.hp <= 0 ? 200 : 35);
    lastHp = d.hp; $('outMsg').hidden = !d.out;
    $('itemBtn').innerHTML = d.it ? `丟<small>${esc(d.it)}</small>` : '撿';
  }
}
function drawHeroes(players) {
  const box = $('heroes'); box.innerHTML = '';
  heroes.forEach(h => {
    const b = document.createElement('button'); b.className = 'hero' + (h.locked ? ' locked' : ''); b.setAttribute('aria-pressed', h.id === me.hero);
    const others = players.filter((p, i) => i !== me.slot && p.hero === h.id).map(p => p.name);
    b.innerHTML = `<img src="${h.img}" alt=""><b>${h.name}</b>${others.length ? `<span class="who">${others.map(esc).join('、')}</span>` : ''}${h.locked ? '<small>🔒</small>' : ''}`;
    b.onclick = () => { if (h.locked) return; me.hero = h.id; Net.send({ t: 'hero', id: h.id }); box.querySelectorAll('.hero').forEach(x => x.setAttribute('aria-pressed', x === b)); vib(15); };
    box.appendChild(b);
  });
  $('others').textContent = players.length > 1 ? '已加入：' + players.map((p, i) => `${i + 1}P ${p.name}`).join('、') : '等其他人加入…';
}
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }
function setupSkills() {
  document.querySelectorAll('.b.sk').forEach((b, i) => { const s = skills[i]; b.hidden = !s; if (s) { b.innerHTML = `${s.name}<small>${s.ult ? '大絕招' : '氣 ' + s.cost}</small>`; b.classList.toggle('ult', !!s.ult); } });
  const mw = $('mpWrap'); mw.querySelectorAll('s').forEach(x => x.remove());
  skills.forEach(s => { if (!s || s.ult) return; const t = document.createElement('s'); t.style.left = (100 * s.cost / maxMp) + '%'; mw.appendChild(t); });
}

/* ---------------- the pad ---------------- */
const st = { t: 'in', mx: 0, mz: 0, run: false, def: false, c: [0, 0, 0, 0, 0, 0, 0] };
let dirty = false, lastSend = 0;
function push() { dirty = true; const now = performance.now(); if (now - lastSend > 30) flush(); }
function flush() { lastSend = performance.now(); dirty = false; if (mode === 'play') Net.send(st); }
setInterval(() => { if (mode === 'play' && (dirty || performance.now() - lastSend > 150)) flush(); }, 50);
setInterval(() => { if (mode !== 'play' && Net.ok) Net.send({ t: 'ping' }); }, 1500);

const zone = $('stickZone'), base = $('stickBase'), knob = $('knob');
let pid = null, ox = 0, oy = 0; const R = 56;
function move(e) {
  let dx = e.clientX - ox, dy = e.clientY - oy; const m = Math.hypot(dx, dy);
  if (m > R) { dx *= R / m; dy *= R / m; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const x = dx / R, y = dy / R;
  st.mx = Math.abs(x) < 0.22 ? 0 : +x.toFixed(2); st.mz = Math.abs(y) < 0.3 ? 0 : +y.toFixed(2);
  const run = Math.abs(x) > 0.9 && m >= R * 0.95; if (run && !st.run) vib(10); st.run = run;
  base.classList.toggle('run', st.run); push();
}
zone.addEventListener('pointerdown', e => {
  if (pid !== null) return; e.preventDefault(); pid = e.pointerId; zone.setPointerCapture(pid);
  const r = zone.getBoundingClientRect(); base.style.left = (e.clientX - r.left) + 'px'; base.style.top = (e.clientY - r.top) + 'px';
  ox = e.clientX; oy = e.clientY; move(e); $('padHint').hidden = true;
});
zone.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
const endStick = e => { if (e && e.pointerId !== pid) return; pid = null; st.mx = st.mz = 0; st.run = false; knob.style.transform = ''; base.classList.remove('run'); base.style.left = base.style.top = ''; push(); };
zone.addEventListener('pointerup', endStick); zone.addEventListener('pointercancel', endStick);
document.querySelectorAll('.b').forEach(b => {
  const k = +b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); st.c[k]++; if (k === 2) st.def = true; b.classList.add('on'); vib(8); push(); });
  const up = () => { if (k === 2) st.def = false; b.classList.remove('on'); push(); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
function releaseAll() { endStick(); st.def = false; document.querySelectorAll('.b.on').forEach(b => b.classList.remove('on')); }
$('pauseBtn').onclick = () => Net.send({ t: 'pause' });
$('startBtn').onclick = () => Net.send({ t: 'start' });
$('psNext').onclick = () => { Net.send({ t: 'storyNext' }); vib(10); };
$('psSkip').onclick = () => { Net.send({ t: 'storySkip' }); vib(10); };
$('pStory').addEventListener('pointerdown', e => { if (e.target.tagName !== 'BUTTON') { Net.send({ t: 'storyNext' }); vib(10); } });
$('nextStageBtn').onclick = () => { Net.send({ t: 'next' }); $('nextStageBtn').hidden = $('againBtn').hidden = true; $('waitSub').textContent = '下一關開始…'; };
$('againBtn').onclick = () => { Net.send({ t: 'start' }); $('againBtn').hidden = $('nextStageBtn').hidden = true; $('waitSub').textContent = '等大家…'; };

/* keep the screen awake while playing */
let lock = null;
async function wake() { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); if (Net.ok) Net.hello(); } });

/* ---------------- join ---------------- */
$('name').value = store.get('name', '');
$('room').value = ROOM;
$('room').addEventListener('input', () => { $('room').value = cleanRoom($('room').value); });
const showRoom = () => document.querySelectorAll('.roomCode').forEach(b => b.textContent = ROOM);
document.querySelectorAll('.leave').forEach(b => b.onclick = () => { Net.leave(); show('join'); status(''); $('room').focus(); });
if (!ROOM) status('輸入大螢幕上的房間號碼，或用相機掃大螢幕上的 QR code。');
$('joinBtn').onclick = async () => {
  const r = cleanRoom($('room').value);
  if (r.length < 5) { status('房間號碼是 5 個字，看大螢幕上的「房間」。'); $('room').focus(); return; }
  if (r !== ROOM || !Net.ok) { if (Net.peer || Net.bc) Net.leave(); ROOM = r; }
  const u = new URL(location.href); u.searchParams.set('room', ROOM); history.replaceState(null, '', u); showRoom();
  const n = $('name').value.trim() || '玩家'; $('name').value = n; store.set('name', n);
  wake();
  try { if (document.documentElement.requestFullscreen && matchMedia('(pointer:coarse)').matches) await document.documentElement.requestFullscreen(); } catch (e) {}
  try { screen.orientation && screen.orientation.lock && await screen.orientation.lock('landscape'); } catch (e) {}
  if (Net.ok) return Net.hello();
  status('連線中…'); $('joinBtn').disabled = true;
  try { await Net.start(); } catch (e) { status('連不上連線伺服器，請確定手機有網路。'); $('joinBtn').disabled = false; return; }
  $('joinBtn').disabled = false;
};
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
$('room').addEventListener('keydown', e => { if (e.key === 'Enter') $('name').focus(); });
showRoom();
addEventListener('pagehide', () => Net.send({ t: 'bye' }));
</script>
</body>
