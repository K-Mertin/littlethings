<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>遊戲大廳 · Game Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#101214; --panel:#181b1f; --line:#2a2f35; --ink:#e7e4dc; --mute:#8e949b;
  --torch:#f2a93b; --amber:#f3bb4f; --blue:#8fd0ff;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --pixel:"Silkscreen",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 15% -10%,rgba(242,169,59,.08),transparent 60%),
  radial-gradient(900px 500px at 90% 110%,rgba(143,208,255,.07),transparent 60%),var(--bg)}
main{max-width:1040px;margin:0 auto;padding:48px 16px 56px}
header{margin-bottom:36px}
.eyebrow{font-family:var(--pixel);font-size:12px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase;margin:0 0 8px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(34px,7vw,56px);letter-spacing:.12em;margin:0;line-height:1.1}
.lede{color:var(--mute);margin:10px 0 0;max-width:48ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px}
a.game{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;overflow:hidden;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
a.game:hover,a.game:focus-visible{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 12px 32px rgba(0,0,0,.45);outline:none}
a.game:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.shot{position:relative;aspect-ratio:16/9;background:#000;border-bottom:1px solid var(--line);overflow:hidden}
.shot canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.key{position:absolute;top:10px;right:10px;font-family:var(--pixel);font-size:11px;color:var(--ink);background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:2px 7px}
.body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.genre{font-size:12px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h2{margin:0;font-size:26px;line-height:1.2}
.ck h2{font-family:var(--pixel);font-weight:700;letter-spacing:.02em}
.zj h2{font-family:var(--serif);font-weight:900;letter-spacing:.14em}
.body p{margin:0;color:var(--mute);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--mute)}
.play{margin-top:auto;padding-top:10px;font-weight:500;color:var(--accent)}
.ck{--accent:var(--torch)} .zj{--accent:var(--blue)}
footer{margin-top:40px;color:var(--mute);font-size:12px}
kbd{font-family:var(--pixel);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px}
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">MK · Game Hall</p>
    <h1>遊戲大廳</h1>
    <p class="lede">選一款遊戲開始。兩款都直接在瀏覽器執行，不需要安裝。</p>
  </header>

  <section class="grid" aria-label="遊戲列表">
    <a class="game ck" href="cobblekeep/index.html">
      <div class="shot"><canvas id="ckShot" width="160" height="90" aria-hidden="true"></canvas><span class="key">1</span></div>
      <div class="body">
        <span class="genre">First-person shooter</span>
        <h2>Cobble Keep</h2>
        <p>DOOM 風格的第一人稱射擊，方塊像素材質。找到紅鑰匙，拉下出口開關。</p>
        <div class="tags"><span>Level 1 · The Undercroft</span><span>鍵盤＋滑鼠</span><span>English</span></div>
        <span class="play">進入遊戲 →</span>
      </div>
    </a>
    <a class="game zj" href="zijia/index.html">
      <div class="shot"><canvas id="zjShot" width="640" height="360" aria-hidden="true"></canvas><span class="key">2</span></div>
      <div class="body">
        <span class="genre">戰棋 · Tactics RPG</span>
        <h2>字甲戰線</h2>
        <p>以漢字為機體、符號為地形的機器人戰棋。15 章、三條路線、五種結局與轉職系統。</p>
        <div class="tags"><span>15 章</span><span>5 種結局</span><span>自動存檔</span><span>繁體中文</span></div>
        <span class="play">進入遊戲 →</span>
      </div>
    </a>
  </section>

  <footer>按 <kbd>1</kbd> 或 <kbd>2</kbd> 直接進入。遊戲內可隨時返回大廳。</footer>
</main>
<script>
// Keyboard shortcuts
addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '1') location.href = 'cobblekeep/index.html';
  if (e.key === '2') location.href = 'zijia/index.html';
});

// Cobble Keep preview: a tiny pixel corridor
(function(){
  const c = document.getElementById('ckShot'), x = c.getContext('2d'), W = 160, H = 90;
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const stone = ['#5f5a54','#6b655e','#4f4b46','#77716a'];
  for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) {
    const cx = Math.abs(i - W/2), cy = y - H/2;
    let col;
    if (cy > 0 && cy * 2.2 > cx * .55) { const d = cy/(H/2); col = `rgb(${60*d+20|0},${42*d+14|0},${30*d+10|0})`; }        // plank floor
    else if (cy < 0 && -cy * 2.2 > cx * .55) { col = '#2a2522'; }                                                             // ceiling
    else { col = stone[(r()*4)|0]; if (((i>>3)+(y>>3))%5===0) col='#4d6a33'; }                                               // mossy cobble
    x.fillStyle = col; x.fillRect(i, y, 1, 1);
  }
  // end-of-corridor lava glow and door
  x.fillStyle = '#1a0f0a'; x.fillRect(66, 26, 28, 38);
  const g = x.createRadialGradient(80, 58, 2, 80, 58, 30); g.addColorStop(0,'rgba(255,91,31,.9)'); g.addColorStop(1,'rgba(255,91,31,0)');
  x.fillStyle = g; x.fillRect(50, 30, 60, 40);
  // torch
  x.fillStyle = '#6b4a2a'; x.fillRect(30, 40, 3, 10); x.fillStyle = '#f2a93b'; x.fillRect(29, 36, 5, 5); x.fillStyle = '#ffe28a'; x.fillRect(30, 37, 3, 2);
  // weapon
  x.fillStyle = '#3b3f45'; x.fillRect(74, 74, 12, 16); x.fillStyle = '#8fd0ff'; x.fillRect(77, 72, 6, 4); x.fillStyle = '#5c636b'; x.fillRect(72, 82, 16, 8);
  // crosshair
  x.fillStyle = '#ecdfc2'; x.fillRect(79, 44, 2, 1); x.fillRect(79, 46, 2, 1);
})();

// 字甲戰線 preview: a text-symbol battle map
function drawZJ(){
  const c = document.getElementById('zjShot'), x = c.getContext('2d'), W = 640, H = 360, cs = 40;
  x.fillStyle = '#14191e'; x.fillRect(0, 0, W, H);
  const map = [
    '　　　＾＾　　　～～～　　　　　',
    '　甲　＾　　　　～～　　敵　　　',
    '　　　　　森森　　　　　　　砲　',
    '　隼　　　森　　　＃＃　　兵　　',
    '　　蓮　　　　　　＃　　　　　　',
    '　　　鐵　　　　　　　　將　　　',
    '　　　　　　～～　　　　　　兵　',
    '　　　　　～～～～　　　　　　　',
    '　　　　　　　　　　　　　　　　'];
  const mv = new Set(['1,1','1,2','1,3','2,2','2,3','2,4','3,1','3,2','3,3','4,2','4,3','0,2','0,3','3,4']);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let r = 0; r < map.length; r++) for (let q = 0; q < 16; q++) {
    const ch = map[r][q], X = q*cs, Y = r*cs;
    x.strokeStyle = '#1f272e'; x.strokeRect(X+.5, Y+.5, cs-1, cs-1);
    if (mv.has(q+','+r)) { x.fillStyle = 'rgba(86,156,255,.28)'; x.fillRect(X+1, Y+1, cs-2, cs-2); }
    if (ch === '　') continue;
    const terrain = { '＾':'#6d7780', '～':'#3f7fb3', '森':'#5f9a62', '＃':'#8a7a62' };
    if (terrain[ch]) { x.fillStyle = terrain[ch]; x.font = '500 20px "Noto Sans TC",sans-serif'; x.fillText(ch === '森' ? '♣' : ch === '＃' ? '▦' : ch === '＾' ? '▲' : '≈', X+cs/2, Y+cs/2+1); continue; }
    const foe = '敵砲兵將'.includes(ch);
    x.fillStyle = foe ? '#461d1b' : '#153250'; x.strokeStyle = foe ? '#903c34' : '#2f6c9f'; x.lineWidth = 2;
    x.fillRect(X+4, Y+4, cs-8, cs-8); x.strokeRect(X+4, Y+4, cs-8, cs-8); x.lineWidth = 1;
    x.fillStyle = foe ? '#ff8f7e' : '#8fd0ff'; x.font = '900 22px "Noto Serif TC",serif'; x.fillText(ch, X+cs/2, Y+cs/2+1);
  }
  x.strokeStyle = '#f3bb4f'; x.lineWidth = 3; x.strokeRect(1*cs+2, 3*cs+2, cs-4, cs-4);
}
drawZJ();
if (document.fonts) document.fonts.ready.then(drawZJ); // redraw once the web fonts arrive
</script>
</body>
</html>
