<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff4df">
<title>大家一起玩 · 多人遊戲專區</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#fff4df; --ink:#2b2340; --mute:#7a6f8f; --panel:#ffffff; --line:#f0dfbf; --sun:#ffbf1f; --red:#ff4f58;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --round:"Fredoka","Noto Sans TC","PingFang TC",system-ui,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit}

/* ---------- lobby ---------- */
#lobby{min-height:100vh;padding:16px clamp(16px,3vw,40px) 110px;
  background:radial-gradient(circle at 12% 8%,#ffe3b0 0 120px,transparent 121px),radial-gradient(circle at 92% 30%,#ffd6e6 0 90px,transparent 91px),radial-gradient(circle at 70% 96%,#d5f0ff 0 140px,transparent 141px),var(--bg)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1500px;margin:0 auto 14px}
.back{font-weight:700;font-size:15px;text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--panel);box-shadow:0 2px 0 var(--line)}
.ttl{flex:1;min-width:220px}
.eyebrow{margin:0;font-family:var(--round);font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
h1{margin:0;font-weight:900;font-size:clamp(34px,5vw,56px);letter-spacing:.08em;line-height:1.1;color:var(--ink);text-shadow:3px 3px 0 var(--sun)}
.mode{display:flex;background:var(--panel);border-radius:999px;padding:5px;box-shadow:0 3px 0 var(--line)}
.mode button{padding:10px 20px;border-radius:999px;font-weight:900;font-size:18px;color:var(--mute)}
.mode button[aria-pressed="true"]{background:var(--ink);color:#fff}
#sound{width:48px;height:48px;border-radius:50%;background:var(--panel);font-size:22px;box-shadow:0 3px 0 var(--line)}
.row{display:grid;grid-template-columns:minmax(250px,310px) 1fr;gap:20px;max-width:1500px;margin:0 auto;align-items:start}
.right{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--panel);border-radius:28px;box-shadow:0 4px 0 var(--line),0 18px 40px rgba(120,80,20,.08);padding:20px}
.join{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.join img{width:min(220px,100%);aspect-ratio:1;image-rendering:pixelated;border-radius:14px;border:6px solid #fff;box-shadow:0 0 0 3px var(--ink)}
.join .qrwrap{width:min(220px,100%);aspect-ratio:1;display:grid;place-items:center}
.join .big{margin:10px 0 0;font-weight:900;font-size:22px}
.join .code{margin:0;font-size:15px;color:var(--mute)}
.join .code b{font-family:var(--round);font-size:34px;letter-spacing:.14em;color:var(--ink);vertical-align:middle}
.url{margin:0;font-size:12px;color:var(--mute);word-break:break-all}
#status{margin:4px 0 0;font-size:14px;color:#a06200}
#status.bad{color:#d0303c}
.small{font-size:13px;font-weight:700;color:var(--mute);padding:6px 12px;border-radius:999px;border:2px solid var(--line)}
.yardBox{display:flex;flex-direction:column;gap:12px;min-width:0}
.yhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.yhead>b{font-size:20px;font-weight:900}
#chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 12px 3px 3px;border-radius:999px;background:#fff;border:3px solid var(--pc);font-weight:700;font-size:15px}
.chip img{width:34px;height:34px}
.chip i{font-style:normal;font-size:13px}
.chip u{text-decoration:none;margin-left:2px;color:var(--mute);cursor:pointer}
.chip.off{opacity:.45}
#yard{width:100%;height:clamp(110px,18vh,220px);border-radius:20px;display:block;background:#9fdc7c}
.yfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.ghead{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 10px}
.games h2{margin:0;font-size:22px;font-weight:900}
.ghead .ext{font-weight:700;font-size:15px;text-decoration:none;padding:6px 14px;border-radius:999px;background:#2b2340;color:#fff6e6}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--panel);border-radius:22px;overflow:hidden;
  box-shadow:0 4px 0 var(--line);border:4px solid transparent;transition:transform .12s,border-color .12s;text-decoration:none}
.card:hover{transform:translateY(-3px)}
.card[aria-pressed="true"]{border-color:var(--gc);box-shadow:0 6px 0 var(--gc)}
.card{flex-direction:row;align-items:center}
.card canvas{width:38%;flex:none;aspect-ratio:16/9;display:block;border-radius:12px;margin:6px 0 6px 6px}
.card .num{position:absolute;top:11px;left:11px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.9);font-family:var(--round);font-weight:700;display:grid;place-items:center;font-size:15px}
.cbody{display:flex;flex-direction:column;gap:1px;padding:6px 10px 6px 10px;min-width:0}
.cbody b{font-size:17px;font-weight:900;white-space:nowrap}
.cbody small{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--mute);line-height:1.45}
.cbody em{font-style:normal;font-size:12px;font-weight:700;color:var(--gc)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap;
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(255,244,223,.94);backdrop-filter:blur(6px);border-top:2px solid var(--line);z-index:5}
.notes{display:flex;flex-direction:column;gap:2px;max-width:46ch}
#modeNote,#teamNote{margin:0;font-size:14px;color:var(--mute)}
#teamNote{color:#5b5bd6;font-weight:700}
#teamNote:empty{display:none}
.mode.small2 button{font-size:15px;padding:8px 14px}
.start{--gc:var(--red);font-weight:900;font-size:24px;letter-spacing:.06em;padding:14px 34px;border-radius:20px;background:var(--gc);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.start:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.keys{font-size:12px;color:var(--mute)}
@media (pointer:coarse){.keys{display:none}}
#soundGate{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;font-weight:900;font-size:20px;padding:12px 26px;border-radius:999px;background:#2b2340;color:#fff;box-shadow:0 6px 0 #ffbf1f,0 12px 30px rgba(0,0,0,.25);animation:gate 1.2s ease-in-out infinite alternate}
@keyframes gate{to{transform:translateX(-50%) scale(1.06)}}
#hint{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;font-weight:700;padding:12px 20px;border-radius:16px;transition:.25s;z-index:6;max-width:90vw;text-align:center}
#hint.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){ .row{grid-template-columns:1fr} .bar{gap:8px} #modeNote{font-size:13px;text-align:center} .start{font-size:20px;padding:12px 22px} }

/* ---------- game stage ---------- */
#stage{position:fixed;inset:0;background:#222}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.over{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,35,64,.45);padding:16px}
.sheet{background:#fffaf0;border-radius:32px;padding:26px clamp(20px,4vw,48px) 28px;width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;
  box-shadow:0 10px 0 var(--gc,#ffbf1f),0 30px 80px rgba(0,0,0,.35);text-align:center;border:5px solid var(--gc,#ffbf1f)}
.sheet h2{margin:0;font-size:clamp(32px,5.4vw,60px);font-weight:900;letter-spacing:.06em;line-height:1.2;text-wrap:balance}
.sheet .tag{display:inline-block;margin-top:6px;padding:4px 16px;border-radius:999px;background:var(--ink);color:#fff;font-weight:900;font-size:18px}
#inIcon{font-size:64px;line-height:1}
#inRules{text-align:left;margin:18px auto 10px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;max-width:640px}
#inRules li{font-size:clamp(18px,2.4vw,26px);font-weight:700;padding:8px 16px 8px 52px;position:relative;background:#fff;border-radius:16px}
#inRules li::before{content:"★";position:absolute;left:16px;color:var(--gc)}
#inBtn{font-size:15px;color:var(--mute);margin:4px 0 0}
#inBtn b{color:var(--ink)}
#inCount{font-family:var(--round);font-weight:700;font-size:96px;line-height:1;color:var(--gc);min-height:96px;margin-top:8px}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.btn2{font-weight:900;font-size:20px;padding:12px 26px;border-radius:18px;background:#fff;border:3px solid var(--ink)}
.btn2.main{background:var(--gc,#ff4f58);color:#fff;border-color:transparent;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#reStars{font-size:56px;letter-spacing:.1em;margin:6px 0 0}
#reSub{margin:6px 0 0;font-size:20px;color:var(--mute);font-weight:700}
#reRows{list-style:none;margin:18px auto 0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:620px}
#reRows li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:6px 16px 6px 10px;border:3px solid var(--pc);font-size:20px}
#reRows .rk{font-size:30px;width:44px;font-family:var(--round);font-weight:700}
#reRows img{width:52px;height:52px}
#reRows b{font-weight:900}
#reRows .ln{margin-left:auto;color:var(--mute);font-weight:700}
#reRows i{font-style:normal;font-size:16px}
.hintkeys{font-size:13px;color:var(--mute);margin:10px 0 0}
</style>
</head>
<body>

<div id="lobby">
  <header class="top">
    <a class="back" href="../index.html">← 遊戲大廳</a>
    <div class="ttl"><p class="eyebrow">多人遊戲專區 · Party</p><h1>大家一起玩</h1></div>
    <div class="mode" role="group" aria-label="模式"><button id="modeKid" aria-pressed="true">🧒 小朋友</button><button id="modeAdult" aria-pressed="false">🧑 大人</button></div>
    <button id="sound" aria-label="聲音開關">🔊</button>
  </header>
  <div class="row">
    <section class="panel join" aria-label="加入房間">
      <div class="qrwrap"><img id="qr" alt="加入房間的 QR code" hidden></div>
      <p class="big">📱 用手機掃一下就加入</p>
      <p class="code">房間 <b id="roomCode">…</b></p>
      <p class="url" id="roomUrl"></p>
      <p id="status" hidden></p>
      <button class="small" id="newRoom">換號碼</button>
    </section>
    <div class="right">
      <section class="panel yardBox" aria-label="玩家">
        <div class="yhead"><b id="count">等大家加入</b><div id="chips"></div></div>
        <canvas id="yard"></canvas>
        <div class="yfoot"><button class="small" id="addKb">＋ 鍵盤玩家</button><span>第一個加入的手機是 👑 房主，可以選遊戲、開始、退出，也能把房主交給別人。分隊時點鍵盤玩家可以換隊。在手機上點你的動物，它會在這裡叫一聲。</span></div>
      </section>
      <section class="games" aria-label="遊戲">
        <div class="ghead"><h2>選一個遊戲</h2><a class="ext" href="../brawl/index.html" title="會另外開房間，手機要再掃一次">也可以玩：👊 小夥伴大作戰（1–4 人）→</a></div>
        <div id="cards"></div>
      </section>
    </div>
  </div>
  <footer class="bar">
    <div class="mode small2" role="group" aria-label="分隊"><button id="teamOff" aria-pressed="true">各自比</button><button id="teamOn" aria-pressed="false">☀️🌙 分隊</button></div>
    <div class="notes"><p id="modeNote"></p><p id="teamNote"></p></div>
    <button class="start" id="start">開始玩 <span id="startName"></span> ▶</button>
    <span class="keys">鍵盤：Enter 開始・1–9 選遊戲・M 換模式・T 分隊</span>
  </footer>
  <div id="hint" role="status"></div>
</div>

<button id="soundGate" hidden>🔇 點這裡打開聲音和音樂</button>
<div id="stage" hidden>
  <canvas id="cv"></canvas>
  <div class="over" id="intro" hidden>
    <div class="sheet">
      <div id="inIcon"></div>
      <h2 id="inName"></h2>
      <span class="tag" id="inMode"></span>
      <ul id="inRules"></ul>
      <p id="inBtn"></p>
      <div id="inCount"></div>
      <button class="small" id="inSkip">看懂了，快開始</button>
    </div>
  </div>
  <div class="over" id="result" hidden>
    <div class="sheet">
      <h2 id="reTitle"></h2>
      <p id="reStars"></p>
      <p id="reSub"></p>
      <ol id="reRows"></ol>
      <div class="btnrow"><button class="btn2 main" id="reAgain">再玩一次</button><button class="btn2" id="reMenu">換遊戲</button></div>
      <p class="hintkeys">👑 房主的手機也可以按。鍵盤：Enter 再玩一次・Esc 換遊戲</p>
    </div>
  </div>
  <div class="over" id="pause" hidden>
    <div class="sheet" style="--gc:#ffbf1f">
      <h2>暫停</h2>
      <div class="btnrow"><button class="btn2 main" id="pResume">繼續玩</button><button class="btn2" id="pQuit">結束這局</button></div>
      <p class="hintkeys">鍵盤 P 或 Esc 暫停／繼續</p>
    </div>
  </div>
</div>

<script src="qrcode.js"></script>
<script src="critter.js"></script>
<script src="core.js"></script>
<script src="games/bumper.js"></script>
<script src="games/paint.js"></script>
<script src="games/fruit.js"></script>
<script src="games/sheep.js"></script>
<script src="games/tag.js"></script>
<script src="games/snow.js"></script>
<script src="games/fire.js"></script>
<script src="games/dodge.js"></script>
<script src="games/soccer.js"></script>
<script src="games/chairs.js"></script>
<script src="games/cake.js"></script>
<script src="games/race.js"></script>
<script>init();</script>
</body>
</html>
