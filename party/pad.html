<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff4df">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>手把・大家一起玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#fff4df; --ink:#2b2340; --mute:#7a6f8f; --line:#f0dfbf; --me:#ff4f58; --med:#b8262f; --gc:#ff7a45;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --round:"Fredoka","Noto Sans TC",system-ui,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:auto;touch-action:pan-y;
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.page.center{justify-content:center}
.title{margin:0;font-weight:900;font-size:clamp(30px,9vw,46px);letter-spacing:.08em;text-shadow:3px 3px 0 #ffbf1f;text-align:center}
.sub{margin:0;color:var(--mute);font-size:15px;text-align:center;max-width:420px;line-height:1.6}
.field{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mute);font-size:14px;font-weight:700}
input{background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;font-size:22px;font-weight:700;text-align:center;width:min(260px,80vw);-webkit-user-select:text;user-select:text}
#room{font-family:var(--round);letter-spacing:.2em;text-transform:uppercase}
.go{font-weight:900;font-size:22px;letter-spacing:.08em;padding:13px 36px;border-radius:18px;background:var(--me);color:#fff;box-shadow:0 5px 0 var(--med)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--med)}
.ghost{padding:8px 14px;border-radius:12px;border:2px solid var(--line);font-weight:700;font-size:14px;background:#fff}
.status{color:#c0392b;font-size:15px;text-align:center;min-height:1.2em;margin:0;max-width:420px}
.roomline{margin:0;color:var(--mute);font-size:13px;display:flex;gap:8px;align-items:center}
.roomline b{color:var(--ink);font-family:var(--round);letter-spacing:.12em}

/* lobby */
.me{display:flex;align-items:center;gap:12px;background:#fff;border-radius:24px;padding:8px 16px 8px 8px;border:4px solid var(--me);width:min(460px,100%)}
.me canvas{width:84px;height:84px;flex:none}
.me .who{flex:1;min-width:0}
.me .who b{display:block;font-size:22px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .who small{display:block;color:var(--mute);font-size:13px}
.me .who .tip{font-size:11px;opacity:.8}
.looks{display:flex;flex-direction:column;gap:6px;flex:none}
.lk{font-size:13px;font-weight:700;padding:6px 10px;border-radius:12px;background:#fff;border:2px solid var(--line);display:flex;align-items:center;gap:6px;white-space:nowrap}
.lk i{width:14px;height:14px;border-radius:50%;background:var(--me);box-shadow:0 0 0 2px var(--med)}
.me canvas{cursor:pointer;transition:transform .1s}
.me canvas.say{transform:translateY(-8px) scale(1.06)}
.me .tip{color:var(--ink)!important;font-weight:700}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;border:2px solid var(--line)}
.seg button{padding:8px 18px;border-radius:999px;font-weight:900;font-size:16px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.gcat{grid-column:1/-1;margin:6px 0 -2px;font-weight:900;font-size:15px;color:var(--mute)}
.glist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(460px,100%)}
.gbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:18px;background:#fff;border:4px solid transparent;box-shadow:0 3px 0 var(--line)}
.gbtn b{font-size:18px;font-weight:900}
.gbtn small{font-size:12px;color:var(--mute);line-height:1.35}
.gbtn[aria-pressed="true"]{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.plist{font-size:13px;color:var(--mute);text-align:center;margin:0}

/* the pad */
#pad{position:fixed;inset:0;touch-action:none;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--gc) 26%,var(--bg)) 0,var(--bg) 70%)}
.hud{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:#fff;border:3px solid var(--me);border-radius:18px;padding:6px 14px 6px 8px;max-width:calc(100% - 150px);pointer-events:none}
.hud canvas{width:40px;height:40px;flex:none}
.hud .gname{font-weight:900;font-size:15px;white-space:nowrap}
.hud .score{font-family:var(--round);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:52px;height:48px;border-radius:14px;background:#fff;border:3px solid var(--line);font-weight:900;font-size:18px}
/* two equal halves: stick in the middle of the left half, button in the middle of the right half */
.stickZone{position:absolute;left:0;top:0;bottom:0;width:50%}
.stickBase{position:absolute;--s:min(170px,40vh,40vw);width:var(--s);height:var(--s);left:50%;top:56%;transform:translate(-50%,-50%);border-radius:50%;background:rgba(43,35,64,.07);border:4px dashed rgba(43,35,64,.25)}
.stickKnob{position:absolute;left:50%;top:50%;width:48%;height:48%;margin:-24% 0 0 -24%;border-radius:50%;background:var(--me);border:4px solid var(--med);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.bigBtn{position:absolute;left:75%;top:56%;transform:translate(-50%,-50%);width:min(190px,46vh,40vw);aspect-ratio:1;border-radius:50%;background:var(--gc);color:#fff;
  border:6px solid rgba(0,0,0,.18);box-shadow:0 8px 0 rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;touch-action:none}
.bigBtn .ic{font-size:clamp(30px,8vmin,58px);line-height:1}
.bigBtn .lb{font-weight:900;font-size:clamp(18px,5vmin,26px);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.bigBtn.on{transform:translate(-50%,-46%);box-shadow:0 3px 0 rgba(0,0,0,.22);filter:brightness(1.1)}
.bigBtn.wait{filter:grayscale(.7) brightness(.85)}
.kid .bigBtn{width:min(220px,52vh,44vw)}
.kid .stickBase{--s:min(200px,46vh,44vw)}
.same{margin:0 0 6px;padding:8px 14px;border-radius:12px;background:#fff4d6;color:#7a4b00;font-weight:800;font-size:14px;line-height:1.5;text-align:center}
@media (max-height:480px){#join .same{font-size:12px;padding:4px 10px;margin:0}#join .same br{display:none}#join .sub{display:none}}
.hint{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mute);font-size:13px;pointer-events:none}
.introCover{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:900;padding:8px 18px;border-radius:14px;font-size:16px;pointer-events:none;white-space:nowrap}
/* standing phone: button on top, stick below, both centred */
@media (orientation:portrait){
  .stickZone{width:100%;top:52%;bottom:0}
  .stickBase{left:50%;top:50%;--s:min(200px,56vw,36vh)}
  .kid .stickBase{--s:min(230px,62vw,40vh)}
  .bigBtn{left:50%;top:33%;width:min(190px,50vw,30vh)}
  .kid .bigBtn{width:min(220px,58vw,34vh)}
}
.leadNote{margin:0;font-size:15px;font-weight:700;color:var(--ink);background:#fff;border:2px dashed var(--line);border-radius:14px;padding:8px 14px;text-align:center;max-width:420px}
.leadNote:empty{display:none}
.notLead .gbtn{pointer-events:none;opacity:.75}
.notLead .gbtn[aria-pressed="true"]{opacity:1}
.notLead .seg{pointer-events:none;opacity:.6}
.pauseBox{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(255,244,223,.98);touch-action:manipulation}
.pauseBox b{font-size:30px;font-weight:900}
.pauseBox #pauseLead{display:flex;flex-direction:column;gap:12px;align-items:center}
.pauseBox p{margin:0;color:var(--mute);font-size:17px;font-weight:700}
.crown{font-style:normal}
.segs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.segs .seg button{padding:7px 12px;font-size:15px}
.myTeam{font-weight:900;font-size:18px;padding:10px 18px;border-radius:16px;color:#fff;background:var(--tc,#ff9a1f);box-shadow:0 4px 0 rgba(0,0,0,.2)}
.myTeam small{font-weight:700;font-size:13px;opacity:.9;margin-left:6px}
.handover{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.handover #handList{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.handover button{padding:6px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;font-size:14px}
/* other pad layouts a game can ask for: big choice buttons, a drawing board, or one giant tap button */
.layer{position:absolute;left:0;right:0;top:calc(70px + env(safe-area-inset-top,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 14px;touch-action:none}
.lprompt{margin:0;font-weight:900;font-size:clamp(18px,5vmin,28px);text-align:center;color:var(--ink)}
.lprompt:empty{display:none}
.cgrid{flex:1;width:100%;max-width:900px;display:grid;grid-template-columns:repeat(var(--cols,2),1fr);gap:12px;align-content:stretch}
.copt{border-radius:22px;background:var(--oc,#fff);color:#fff;font-weight:900;font-size:clamp(20px,6vmin,40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  box-shadow:0 6px 0 rgba(0,0,0,.2);border:5px solid transparent;text-shadow:0 2px 0 rgba(0,0,0,.2);padding:6px;line-height:1.15;min-height:64px}
.copt .ci{font-size:clamp(28px,9vmin,64px);line-height:1}
.copt:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.copt.chosen{border-color:#fff;outline:5px solid var(--ink)}
.copt.right{background:#22c26a!important;border-color:#fff}
.copt.wrong{background:#9aa0ad!important;opacity:.7}
.copt.off{opacity:.35}
.cgrid.locked .copt:not(.chosen):not(.right){opacity:.45}
.dwrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:0}
#drawCv{background:#fff;border-radius:16px;box-shadow:0 0 0 4px var(--line);touch-action:none;max-width:100%;max-height:100%;aspect-ratio:4/3}
.dtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.dtools button{width:44px;height:44px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.dtools button[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink)}
.dtools .clr{width:auto;border-radius:14px;padding:0 14px;background:#fff;font-weight:900}
#pad.tapmode .stickZone,#pad.tapmode .hint{display:none}
#pad.tapmode .bigBtn{left:50%;top:58%;width:min(68vmin,420px)}
#pad.tapmode .bigBtn .ic{font-size:clamp(48px,16vmin,110px)}
#pad.tapmode .bigBtn .lb{font-size:clamp(26px,7vmin,44px)}
.tapPrompt{position:absolute;left:0;right:0;top:calc(68px + env(safe-area-inset-top,0px));text-align:center;margin:0;font-weight:900;font-size:clamp(16px,4.5vmin,24px);pointer-events:none}
#pad.altmode .stickZone,#pad.altmode .bigBtn,#pad.altmode .hint{display:none}
/* result */
.rank{font-family:var(--round);font-weight:700;font-size:64px;line-height:1;margin:0}
.rtitle{margin:0;font-weight:900;font-size:24px;text-align:center}
.rline{margin:0;font-size:18px;color:var(--mute);font-weight:700;white-space:pre-line;text-align:center}
</style>
</head>
<body>

<div class="page center" id="join">
  <p class="title">大家一起玩</p>
  <p class="sub">這支手機會變成手把。</p>
  <p class="same">👀 遊戲畫面在大螢幕（電視或電腦）上，<br>請和大家在同一個空間，一起看著大螢幕玩。</p>
  <label class="field">房間號碼<input id="room" maxlength="5" placeholder="看大螢幕" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
  <label class="field">你的名字<input id="name" maxlength="8" placeholder="名字" autocomplete="off"></label>
  <button class="go" id="joinBtn">加入！</button>
  <p class="status" id="joinStatus"></p>
</div>

<div class="page" id="lobby" hidden>
  <div class="me">
    <canvas id="meCv" width="168" height="168" aria-label="我的角色，點一下會叫"></canvas>
    <div class="who"><b id="meName"></b><small id="meSub"></small><small class="tip">點你的動物，它會在大螢幕上叫一聲！</small></div>
    <div class="looks"><button class="lk" id="aniBtn">🔄 換動物</button><button class="lk" id="colBtn"><i></i> 換顏色</button></div>
  </div>
  <div class="segs"><div class="seg" role="group" aria-label="模式"><button id="mKid" aria-pressed="true">🧒 小朋友</button><button id="mAdult" aria-pressed="false">🧑 大人</button></div>
  <div class="seg" role="group" aria-label="分隊" id="tSeg"><button id="tOff" aria-pressed="true">各自比</button><button id="tOn" aria-pressed="false">☀️🌙 分隊</button></div></div>
  <button class="myTeam" id="myTeam" hidden></button>
  <div class="glist" id="glist"></div>
  <p class="leadNote" id="leadNote"></p>
  <button class="go" id="startBtn">開始！</button>
  <p class="plist" id="plist"></p>
  <div class="handover" id="handover" hidden><span>把 👑 房主交給：</span><div id="handList"></div></div>
  <p class="roomline">房間 <b class="roomCode"></b> <button class="ghost leave">換房間</button></p>
</div>

<div class="page center" id="wait" hidden>
  <p class="title" style="font-size:32px">等一下下</p>
  <p class="sub" id="waitMsg"></p>
  <p class="status" id="waitStatus"></p>
  <p class="roomline">房間 <b class="roomCode"></b> <button class="ghost leave">換房間</button></p>
</div>

<div class="page center" id="result" hidden>
  <p class="rank" id="rRank"></p>
  <p class="rtitle" id="rTitle"></p>
  <p class="rline" id="rLine"></p>
  <button class="go" id="againBtn">再玩一次</button>
  <button class="ghost" id="menuBtn" style="font-size:18px;padding:10px 22px">換遊戲</button>
  <p class="leadNote" id="resNote"></p>
</div>

<div id="pad" hidden>
  <div class="hud"><canvas id="hudCv" width="80" height="80"></canvas><span class="gname" id="gName"></span><span class="score" id="hudText"></span></div>
  <button id="pauseBtn" aria-label="暫停">II</button>
  <div class="stickZone" id="stickZone"><div class="stickBase" id="stickBase"><div class="stickKnob" id="knob"></div></div></div>
  <button class="bigBtn" id="bigBtn"><span class="ic" id="bIc"></span><span class="lb" id="bLb"></span></button>
  <div class="pauseBox" id="pauseBox" hidden>
    <b>⏸ 暫停中</b>
    <div id="pauseLead"><button class="go" id="resumeBtn">繼續玩</button><button class="ghost" id="quitBtn">退出，回去選遊戲</button></div>
    <p id="pauseOther">等 👑 房主繼續…</p>
  </div>
  <p class="tapPrompt" id="tapPrompt" hidden></p>
  <div class="layer" id="choiceBox" hidden><p class="lprompt" id="cPrompt"></p><div class="cgrid" id="cGrid"></div></div>
  <div class="layer" id="drawBox" hidden>
    <p class="lprompt" id="dPrompt"></p>
    <div class="dwrap" id="dWrap"><canvas id="drawCv" width="800" height="600"></canvas></div>
    <div class="dtools" id="dTools"></div>
  </div>
  <div class="introCover" id="introCover" hidden>看大螢幕，馬上開始！</div>
  <div class="hint" id="padHint">按住拖曳就能走路・大按鈕是特別動作</div>
</div>

<script src="critter.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), LOCAL = Q.get('net') === 'local';
let ROOM = (Q.get('room') || '').toUpperCase();
const cleanRoom = s => String(s).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
const PEER_JS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const store = { get(k, d) { try { const v = localStorage.getItem('mwparty.pad.' + k); return v == null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('mwparty.pad.' + k, v); } catch (e) { } } };
let cid = null; try { cid = sessionStorage.getItem('mwparty.pad.cid'); } catch (e) { }
if (!cid) { cid = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('mwparty.pad.cid', cid); } catch (e) { } }
const TEAMS_PAD = [{ n: '太陽隊', icon: '☀️', c: '#ff9a1f' }, { n: '月亮隊', icon: '🌙', c: '#5b5bd6' }];
const PAGES = ['join', 'lobby', 'wait', 'result', 'pad'];
const show = id => PAGES.forEach(p => $(p).hidden = p !== id);
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };
function esc(s) { return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }

/* ---------------- connection ---------------- */
const Net = {
  conn: null, bc: null, me: null, ok: false, peer: null,
  send(d) {
    if (this.bc) this.bc.postMessage({ to: 'host', from: this.me, d });
    else if (this.conn && this.conn.open) try { this.conn.send(d); } catch (e) { }
  },
  hello() {
    this.send({ t: 'hello', cid, name: $('name').value.trim(), animal: +store.get('animal', -1) >= 0 ? +store.get('animal', 0) : undefined });
    clearTimeout(this.helloT);
    this.helloT = setTimeout(() => { if (mode === 'join' && (this.ok || this.peer)) status('房間 ' + ROOM + ' 沒有回應。請確認大螢幕上的房間號碼，再按一次加入。'); }, 5000);
  },
  async start() {
    if (LOCAL) {
      this.me = cid + '-' + Math.random().toString(36).slice(2, 6);
      this.bc = new BroadcastChannel('mwparty-' + ROOM);
      this.bc.onmessage = e => { const m = e.data; if (m.to === this.me || m.to === '*') onMsg(m.d); };
      this.ok = true; status(''); this.hello(); return;
    }
    await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = PEER_JS; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
    this.peer = new Peer({ debug: 0 });
    this.peer.on('open', () => this.connect());
    this.peer.on('error', e => {
      if (e.type === 'peer-unavailable') { this.leave(); show('join'); status('找不到房間 ' + ROOM + '。請確認大螢幕上的房間號碼。'); return; }
      status('連線有問題，重試中…'); setTimeout(() => this.peer && this.connect(), 2500);
    });
    this.peer.on('disconnected', () => setTimeout(() => this.peer && !this.peer.destroyed && this.peer.reconnect(), 1000));
  },
  leave() {
    if (this.ok) this.send({ t: 'bye' });
    if (this.bc) { this.bc.close(); this.bc = null; }
    const p = this.peer; this.peer = null; this.conn = null; if (p && !p.destroyed) p.destroy();
    this.ok = false; mode = 'join';
  },
  connect() {
    if (!this.peer) return;
    if (this.conn && this.conn.open) return;
    const c = this.conn = this.peer.connect('mwparty-' + ROOM, { reliable: true });
    c.on('open', () => { this.ok = true; status(''); this.hello(); });
    c.on('data', d => onMsg(d));
    c.on('close', () => { if (this.conn !== c || !this.peer) return; this.ok = false; status('斷線了，重新連線中…'); setTimeout(() => this.connect(), 1500); });
  }
};
function status(t) { ['joinStatus', 'waitStatus'].forEach(id => $(id).textContent = t); }

/* ---------------- messages from the big screen ---------------- */
let me = { col: 0, animal: 0, name: '' }, mode = 'join', kid = true, gameSel = null, ready = true;
function setMe(y) {
  me = y; const C = PARTY_COLORS[y.col];
  document.documentElement.style.setProperty('--me', C.c); document.documentElement.style.setProperty('--med', C.d);
  $('meName').textContent = (y.lead ? '👑 ' : '') + y.name; $('meSub').textContent = PARTY_COLORS[y.col].n + '色' + PARTY_ANIMALS[y.animal].n + (y.trophies ? '　🏆 × ' + y.trophies : '');
  const draw = (cv, r) => { const g = cv.getContext('2d'); g.clearRect(0, 0, cv.width, cv.height); drawCritter(g, cv.width / 2, cv.height * 0.58, cv.width * r, y.col, y.animal, { noShadow: true, happy: mode === 'result' }); };
  draw($('meCv'), 0.3); draw($('hudCv'), 0.3);
  store.set('animal', y.animal);
}
function setKid(k) { kid = k; $('mKid').setAttribute('aria-pressed', k); $('mAdult').setAttribute('aria-pressed', !k); $('pad').classList.toggle('kid', k); }
function onMsg(d) {
  if (!d || !d.t) return;
  if (d.you) setMe(d.you);
  if (typeof d.kid === 'boolean') setKid(d.kid);
  switch (d.t) {
    case 'who': return Net.hello();
    case 'full': show('join'); return status('已經有 6 個人了，等有人離開再加入。');
    case 'closed': show('join'); return status('大螢幕把房間關掉了。');
    case 'lobby': {
      mode = 'lobby'; releaseAll(); gameSel = d.game;
      $('glist').innerHTML = (d.cats || [{ id: undefined, n: '' }]).map(c => { const gs = d.games.filter(g => c.id === undefined || g.cat === c.id); return gs.length ? (c.n ? `<p class="gcat">${esc(c.n)}</p>` : '') + gs.map(g => `<button class="gbtn" data-id="${g.id}" style="--c:${g.col}" aria-pressed="${g.id === d.game}"><b>${g.icon} ${esc(g.name)}</b><small>${esc(g.blurb)}</small></button>`).join('') : ''; }).join('');
      $('glist').querySelectorAll('.gbtn').forEach(b => b.onclick = () => { Net.send({ t: 'pick', id: b.dataset.id }); PadSfx.blip(700); vib(10); });
      $('plist').textContent = d.players.length > 1 ? '一起玩：' + d.players.map(p => p.name).join('、') : '等其他人加入，也可以自己先玩';
      const lead = !!d.you.lead; $('lobby').classList.toggle('notLead', !lead); $('startBtn').hidden = !lead;
      $('tOff').setAttribute('aria-pressed', !d.teams); $('tOn').setAttribute('aria-pressed', !!d.teams);
      const T = TEAMS_PAD[d.you.team || 0]; $('myTeam').hidden = !d.teams;
      $('myTeam').style.setProperty('--tc', T.c); $('myTeam').innerHTML = `我是 ${T.icon} ${T.n}<small>點這裡換隊</small>`;
      if (d.teams) $('plist').innerHTML = [0, 1].map(t => TEAMS_PAD[t].icon + ' ' + TEAMS_PAD[t].n + '：' + (d.players.filter(p => (p.team || 0) === t).map(p => esc(p.name)).join('、') || '還沒有人')).join('<br>');
      const others = d.players.map((p, i) => ({ ...p, i })).filter(p => !p.lead && p.online && p.i !== d.you.slot);
      $('handover').hidden = !lead || !others.length;
      $('handList').innerHTML = others.map(p => `<button data-i="${p.i}">${esc(p.name)}</button>`).join('');
      $('handList').querySelectorAll('button').forEach(b => b.onclick = () => { if (confirm('把房主交給「' + b.textContent + '」？')) { Net.send({ t: 'lead', slot: +b.dataset.i }); PadSfx.blip(800); } });
      $('leadNote').textContent = lead ? '👑 你是房主：選遊戲、選模式，大家準備好就按開始' : '👑 房主「' + d.leadName + '」會選遊戲和開始，先點你的動物打招呼吧！';
      setMe(d.you); show('lobby'); return;
    }
    case 'wait': mode = 'wait'; releaseAll(); $('waitMsg').textContent = d.msg; show('wait'); return;
    case 'pad': {
      const enter = mode !== 'pad'; mode = 'pad';
      document.documentElement.style.setProperty('--gc', d.gcol);
      $('gName').textContent = d.icon + ' ' + d.name + (d.teamPlay ? '・' + TEAMS_PAD[d.you.team || 0].icon + TEAMS_PAD[d.you.team || 0].n : ''); $('bIc').textContent = d.btn.icon; $('bLb').textContent = d.btn.label;
      $('introCover').hidden = !d.intro;
      $('pauseBtn').hidden = !d.you.lead;
      $('pauseBox').hidden = !d.paused; $('pauseLead').hidden = !d.you.lead; $('pauseOther').hidden = !!d.you.lead;
      if (d.paused) releaseAll();
      if (enter) { releaseAll(); vib(60); $('padHint').hidden = false; }
      applyLayout(d.L || null);
      show('pad'); return;
    }
    case 'layout': applyLayout(d.L); return;
    case 'hud': $('hudText').textContent = d.s; ready = !!d.r; $('bigBtn').classList.toggle('wait', !ready); if (d.s.indexOf('準備') < 0) $('introCover').hidden = true; return;
    case 'buzz': vib(d.ms); return;
    case 'result': {
      mode = 'result'; releaseAll();
      $('rRank').textContent = d.team ? '⭐'.repeat(d.stars) + '☆'.repeat(3 - d.stars) : d.win > -9 ? (d.win < 0 ? '🤝' : d.you.team === d.win ? '🏆' : '👏') : d.n > 1 ? (['', '🥇', '🥈', '🥉'][d.rank] || '第 ' + d.rank + ' 名') : '👏';
      $('rTitle').textContent = d.title; $('rLine').textContent = (d.sub ? d.sub + '\n' : '') + d.line;
      $('againBtn').hidden = $('menuBtn').hidden = !d.you.lead;
      $('resNote').textContent = d.you.lead ? '' : '等 👑 房主「' + d.leadName + '」決定要再玩還是換遊戲';
      setMe(d.you); show('result'); if (d.rank === 1 && d.n > 1) vib([80, 60, 80]); return;
    }
  }
}

/* ---------------- small sounds on the phone itself ---------------- */
const PadSfx = {
  ctx: null,
  ensure() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) { } },
  tone(f, d, type, v, f2) {
    this.ensure(); const c = this.ctx; if (!c) return; const t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || 0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.03);
  },
  blip(f) { this.tone(f || 600, 0.08, 'triangle', 0.1); },
  say(a) { const f = [700, 360, 900, 220, 300, 520][a || 0]; this.tone(f, 0.22, 'square', 0.07, f * 0.8); },
  btn() { this.tone(440, 0.06, 'triangle', 0.08, 660); }
};
document.addEventListener('pointerdown', () => PadSfx.ensure(), { capture: true });

/* ---------------- the pad ---------------- */
const st = { t: 'in', x: 0, y: 0, c: [0, 0, 0], h: [0, 0, 0] };
let dirty = false, lastSend = 0;
function push() { dirty = true; if (performance.now() - lastSend > 16) flush(); }
function flush() { lastSend = performance.now(); dirty = false; if (mode === 'pad') Net.send(st); }
setInterval(() => { if (mode === 'pad' && (dirty || performance.now() - lastSend > 150)) flush(); }, 33);
setInterval(() => { if (mode !== 'pad' && Net.ok) Net.send({ t: 'ping' }); }, 1500);

const zone = $('stickZone'), base = $('stickBase'), knob = $('knob');
let pid = null, ox = 0, oy = 0;
function move(e) {
  const R = base.offsetWidth * 0.36;
  let dx = e.clientX - ox, dy = e.clientY - oy; const m = Math.hypot(dx, dy);
  if (m > R) { dx *= R / m; dy *= R / m; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  st.x = +(dx / R).toFixed(2); st.y = +(dy / R).toFixed(2); push();
}
zone.addEventListener('pointerdown', e => {
  if (pid !== null) return; e.preventDefault(); pid = e.pointerId; zone.setPointerCapture(pid);
  const r = zone.getBoundingClientRect(); base.style.left = (e.clientX - r.left) + 'px'; base.style.top = (e.clientY - r.top) + 'px';
  ox = e.clientX; oy = e.clientY; move(e); $('padHint').hidden = true;
});
zone.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
const endStick = e => { if (e && e.pointerId !== undefined && e.pointerId !== pid) return; pid = null; st.x = st.y = 0; knob.style.transform = ''; base.style.left = base.style.top = ''; push(); };
zone.addEventListener('pointerup', endStick); zone.addEventListener('pointercancel', endStick);
const bb = $('bigBtn');
bb.addEventListener('pointerdown', e => { e.preventDefault(); try { bb.setPointerCapture(e.pointerId); } catch (x) { } st.c[0]++; st.h[0] = 1; bb.classList.add('on'); vib(ready ? 15 : 5); if (ready) PadSfx.btn(); push(); });
const up = () => { st.h[0] = 0; bb.classList.remove('on'); push(); };
bb.addEventListener('pointerup', up); bb.addEventListener('pointercancel', up); bb.addEventListener('lostpointercapture', up);
bb.addEventListener('contextmenu', e => e.preventDefault());
function releaseAll() { endStick(); st.h = [0, 0, 0]; bb.classList.remove('on'); }
$('pauseBtn').onclick = () => { Net.send({ t: 'pause' }); PadSfx.blip(500); };
$('resumeBtn').onclick = () => { Net.send({ t: 'pause' }); PadSfx.blip(700); };
$('quitBtn').onclick = () => { Net.send({ t: 'quit' }); PadSfx.blip(400); };

/* ---------------- layouts the game can switch the phone to ---------------- */
let layoutKey = '', drawId = null, drawCol = 0, drawing = false, strokeN = 0, pend = [];
const DRAW_COLS = ['#2b2340', '#ff4f58', '#2f8cff', '#22c26a', '#ffbf1f', '#9b5cff', '#ffffff'];
const dcv = $('drawCv'), dg = dcv.getContext('2d');
function applyLayout(L) {
  const key = JSON.stringify(L || null); if (key === layoutKey) return; layoutKey = key;
  const type = L ? L.type : 'stick', pad = $('pad');
  pad.classList.toggle('tapmode', type === 'tap'); pad.classList.toggle('altmode', type === 'choices' || type === 'draw');
  $('choiceBox').hidden = type !== 'choices'; $('drawBox').hidden = type !== 'draw';
  $('tapPrompt').hidden = type !== 'tap' || !L.prompt; if (type === 'tap') $('tapPrompt').textContent = L.prompt || '';
  if (type !== 'stick') releaseAll();
  if (type === 'tap' && L.btn) { $('bIc').textContent = L.btn.icon || ''; $('bLb').textContent = L.btn.label || ''; }
  if (type === 'choices') {
    $('cPrompt').textContent = L.prompt || '';
    const grid = $('cGrid'); grid.style.setProperty('--cols', L.cols || (L.options.length > 4 ? 3 : 2)); grid.classList.toggle('locked', !!L.locked);
    grid.innerHTML = L.options.map(o => `<button class="copt ${o.state || ''}" data-id="${esc(o.id)}" style="--oc:${o.col || '#5b5bd6'}">${o.icon ? `<span class="ci">${esc(o.icon)}</span>` : ''}<span>${esc(o.label || '')}</span></button>`).join('');
    grid.querySelectorAll('.copt').forEach(b => b.addEventListener('pointerdown', e => {
      e.preventDefault(); if (L.locked || b.classList.contains('off')) return;
      grid.querySelectorAll('.copt').forEach(x => x.classList.toggle('chosen', x === b));
      Net.send({ t: 'choose', id: b.dataset.id }); PadSfx.blip(720); vib(25);
    }));
  }
  if (type === 'draw') {
    $('dPrompt').textContent = L.prompt || '';
    if (L.id !== drawId) { drawId = L.id; dg.fillStyle = '#fff'; dg.fillRect(0, 0, dcv.width, dcv.height); }
    dcv.style.pointerEvents = L.canDraw ? 'auto' : 'none'; dcv.style.opacity = L.canDraw ? 1 : 0.5;
    $('dTools').hidden = !L.canDraw;
    $('dTools').innerHTML = DRAW_COLS.map((c, i) => `<button data-c="${i}" style="background:${c}" aria-pressed="${i === drawCol}" aria-label="顏色"></button>`).join('') + '<button class="clr" id="dClr">🧽 全部擦掉</button>';
    $('dTools').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { drawCol = +b.dataset.c; $('dTools').querySelectorAll('[data-c]').forEach(x => x.setAttribute('aria-pressed', x === b)); PadSfx.blip(600); });
    $('dClr').onclick = () => { dg.fillStyle = '#fff'; dg.fillRect(0, 0, dcv.width, dcv.height); Net.send({ t: 'drawClear' }); vib(20); };
  }
}
function dpos(e) { const r = dcv.getBoundingClientRect(); return [clamp01((e.clientX - r.left) / r.width), clamp01((e.clientY - r.top) / r.height)]; }
function clamp01(v) { return Math.max(0, Math.min(1, +v.toFixed(3))); }
let lastPt = null;
function dline(a, b) { dg.strokeStyle = DRAW_COLS[drawCol]; dg.lineWidth = drawCol === 6 ? 40 : 12; dg.lineCap = dg.lineJoin = 'round'; dg.beginPath(); dg.moveTo(a[0] * dcv.width, a[1] * dcv.height); dg.lineTo(b[0] * dcv.width, b[1] * dcv.height); dg.stroke(); }
dcv.addEventListener('pointerdown', e => { e.preventDefault(); dcv.setPointerCapture(e.pointerId); drawing = true; strokeN++; lastPt = dpos(e); pend = [lastPt[0], lastPt[1]]; dline(lastPt, lastPt); });
dcv.addEventListener('pointermove', e => { if (!drawing) return; const p = dpos(e); dline(lastPt, p); lastPt = p; pend.push(p[0], p[1]); });
const dEnd = () => { if (!drawing) return; drawing = false; flushDraw(); };
dcv.addEventListener('pointerup', dEnd); dcv.addEventListener('pointercancel', dEnd);
function flushDraw() { if (pend.length >= 2) { Net.send({ t: 'draw', s: strokeN, c: drawCol, p: pend }); pend = drawing ? pend.slice(-2) : []; } }
setInterval(() => { if (drawing) flushDraw(); }, 50);

/* ---------------- lobby buttons ---------------- */
$('meCv').addEventListener('pointerdown', () => { Net.send({ t: 'say' }); PadSfx.say(me.animal); vib(20); const c = $('meCv'); c.classList.add('say'); setTimeout(() => c.classList.remove('say'), 160); });
$('aniBtn').onclick = () => { Net.send({ t: 'look', animal: (me.animal + 1) % 6 }); PadSfx.blip(660); vib(10); };
$('colBtn').onclick = () => { Net.send({ t: 'look', col: 'next' }); PadSfx.blip(780); vib(10); };
$('tOff').onclick = () => { Net.send({ t: 'teams', on: false }); vib(10); };
$('tOn').onclick = () => { Net.send({ t: 'teams', on: true }); vib(10); };
$('myTeam').onclick = () => { Net.send({ t: 'team', team: 1 - (me.team || 0) }); PadSfx.blip(720); vib(15); };
$('mKid').onclick = () => { Net.send({ t: 'mode', kid: true }); vib(10); };
$('mAdult').onclick = () => { Net.send({ t: 'mode', kid: false }); vib(10); };
$('startBtn').onclick = () => { Net.send({ t: 'start' }); vib(20); };
$('againBtn').onclick = () => { Net.send({ t: 'start' }); vib(20); };
$('menuBtn').onclick = () => { Net.send({ t: 'menu' }); vib(10); };

/* keep the screen awake while playing */
let lock = null;
async function wake() { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) { } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) { wake(); if (Net.ok) Net.hello(); } });

/* ---------------- join ---------------- */
$('name').value = store.get('name', '');
$('room').value = ROOM;
$('room').addEventListener('input', () => { $('room').value = cleanRoom($('room').value); });
const showRoom = () => document.querySelectorAll('.roomCode').forEach(b => b.textContent = ROOM);
document.querySelectorAll('.leave').forEach(b => b.onclick = () => { Net.leave(); show('join'); status(''); });
if (!ROOM) status('輸入大螢幕上的房間號碼，或用相機掃大螢幕上的 QR code。');
$('joinBtn').onclick = async () => {
  const r = cleanRoom($('room').value);
  if (r.length < 5) { status('房間號碼是 5 個字，看大螢幕上的「房間」。'); $('room').focus(); return; }
  if (r !== ROOM || !Net.ok) { if (Net.peer || Net.bc) Net.leave(); ROOM = r; }
  const u = new URL(location.href); u.searchParams.set('room', ROOM); history.replaceState(null, '', u); showRoom();
  const n = $('name').value.trim() || '玩家'; $('name').value = n; store.set('name', n);
  wake();
  try { if (document.documentElement.requestFullscreen && matchMedia('(pointer:coarse)').matches) await document.documentElement.requestFullscreen(); } catch (e) { }
  if (Net.ok) return Net.hello();
  status('連線中…'); $('joinBtn').disabled = true;
  try { await Net.start(); } catch (e) { status('連不上連線伺服器，請確定手機有網路。'); $('joinBtn').disabled = false; return; }
  $('joinBtn').disabled = false;
};
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('joinBtn').click(); });
$('room').addEventListener('keydown', e => { if (e.key === 'Enter') $('name').focus(); });
if (ROOM && store.get('name', '')) setTimeout(() => $('name').focus(), 50);
showRoom();
addEventListener('pagehide', () => Net.send({ t: 'bye' }));
</script>
</body>
