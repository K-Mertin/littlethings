<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#22305a">
<title>Sunny Circuit Controller</title>
<style>
  :root{--ink:#22305a;--ink-2:#6a7596;--bg:#fff8ee;--line:#e6dccb;--red:#ff5a4e;--sun:#ffc23a;--round:'Fredoka','Nunito',system-ui,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;overflow:hidden;background:#1d2747;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;touch-action:none;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.18)}
  .dot{width:12px;height:12px;border-radius:50%;background:#ff5a4a;flex:none;box-shadow:0 0 0 3px rgba(255,90,74,.25)}
  .dot.ok{background:#3ccf63;box-shadow:0 0 0 3px rgba(60,207,99,.25)}
  #stat{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  #race{font-weight:800;font-size:14px;color:#ffd36a;white-space:nowrap;font-variant-numeric:tabular-nums}
  header button{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:18px;width:42px;height:38px;border-radius:10px;flex:none}
  main{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;min-height:0}
  .zone{position:relative;border-radius:22px;background:rgba(255,255,255,.06);min-height:0;overflow:hidden}
  /* steering */
  #steer{display:flex;align-items:center;justify-content:center}
  #wheel{width:min(62%,60vh);aspect-ratio:1;transition:transform .05s linear}
  #stickTrack{position:absolute;left:8%;right:8%;top:50%;height:16px;margin-top:-8px;border-radius:8px;background:rgba(255,255,255,.12)}
  #knob{position:absolute;top:50%;left:50%;width:min(110px,26vw);aspect-ratio:1;margin:calc(min(110px,26vw)/-2) 0 0 calc(min(110px,26vw)/-2);border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#c9d3ec);box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:none}
  #steerHint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.55);pointer-events:none}
  #centerBtn{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.14);border:0;color:#fff;font-weight:800;border-radius:10px;padding:8px 12px;font-size:13px}
  #steerBar{position:absolute;left:12%;right:12%;top:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.12)}
  #steerBar i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:#ffd36a;left:50%;margin-left:-6px}
  /* buttons */
  #btns{display:grid;grid-template-columns:1fr 1.25fr;grid-template-rows:1fr 1fr;gap:10px;padding:10px;background:transparent}
  .pb{border:0;border-radius:20px;font-family:var(--round);font-weight:800;font-size:clamp(16px,4vw,26px);letter-spacing:.04em;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.28);transition:transform .04s}
  .pb small{font-size:11px;font-weight:700;opacity:.8;letter-spacing:.06em}
  .pb.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.28);filter:brightness(1.15)}
  #drift{grid-column:1/3;background:linear-gradient(#ff9a3c,#f0731f);position:relative;overflow:hidden}
  #drift .charge{position:absolute;left:0;bottom:0;height:7px;width:0;background:#fff;opacity:.85;transition:width .15s,background .15s}
  #brake{background:linear-gradient(#5d6b8a,#465374)}
  #gas{background:linear-gradient(#3ccf63,#2aa84d)}
  #gas.auto{background:linear-gradient(#2f8f4c,#277a40)}
  /* overlays */
  .ov{position:fixed;inset:0;background:rgba(15,21,42,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:5}
  .ov[hidden]{display:none}
  .ov h1{font-family:var(--round);margin:0;font-size:28px}
  .ov p{margin:0;color:#c8d0e6;font-weight:600;max-width:440px;line-height:1.45}
  .big{border:0;border-radius:16px;background:var(--red);color:#fff;font-weight:800;font-size:20px;padding:14px 28px;box-shadow:0 5px 0 #b8362d}
  .alt{border:2px solid rgba(255,255,255,.3);border-radius:14px;background:transparent;color:#fff;font-weight:800;font-size:15px;padding:10px 18px}
  .seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .seg button{border:2px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px}
  .seg button[aria-pressed="true"]{background:#fff;color:var(--ink);border-color:#fff}
  .row{display:flex;flex-direction:column;gap:6px;align-items:center}
  .lbl{font-size:12px;font-weight:800;letter-spacing:.08em;color:#9aa6c6;text-transform:uppercase}
  #startOv{background:rgba(15,21,42,.55);pointer-events:none}
  #startOv .big{pointer-events:auto}
  #rotate{position:fixed;left:0;right:0;bottom:0;padding:6px;text-align:center;font-size:12px;font-weight:700;background:rgba(255,194,58,.18);color:#ffd36a;z-index:4}
  @media (orientation:portrait){
    main{grid-template-columns:1fr;grid-template-rows:1fr 1.1fr}
  }
  @media (orientation:landscape){ #rotate{display:none} }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot" id="dot"></span><span id="stat">Connecting…</span>
    <span id="race"></span>
    <button id="camBtn" aria-label="Change camera">🎥</button>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
    <button id="setBtn" aria-label="Settings">⚙️</button>
  </header>
  <main>
    <div class="zone" id="steer">
      <div id="steerBar"><i id="steerDot"></i></div>
      <svg id="wheel" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" stroke="#e8edf9" stroke-width="9"/>
        <circle cx="50" cy="50" r="44" fill="none" stroke="#ff5a4e" stroke-width="9" stroke-dasharray="10 266" stroke-dashoffset="5" transform="rotate(-90 50 50)"/>
        <path d="M8 52 Q50 40 92 52 M50 58 L50 93" stroke="#e8edf9" stroke-width="8" fill="none" stroke-linecap="round"/>
        <circle cx="50" cy="54" r="11" fill="#22305a" stroke="#e8edf9" stroke-width="4"/>
      </svg>
      <div id="stickTrack" hidden></div><div id="knob" hidden></div>
      <button id="centerBtn">Center</button>
      <div id="steerHint"></div>
    </div>
    <div class="zone" id="btns">
      <button class="pb" id="drift">DRIFT<small>hold in corners · tap at the green light for a perfect start</small><span class="charge" id="charge"></span></button>
      <button class="pb" id="brake">BRAKE<small>and reverse</small></button>
      <button class="pb" id="gas">GAS<small id="gasNote"></small></button>
    </div>
  </main>
</div>
<div id="rotate">Turn your phone sideways for the best grip</div>

<div class="ov" id="startOv" hidden><button class="big" id="startBtn">▶ Race!</button></div>

<div class="ov" id="setup">
  <h1>Sunny Circuit</h1>
  <p id="setupMsg">Choose how to steer. You can change it later with ⚙️.</p>
  <div class="row"><span class="lbl">Steering</span>
    <div class="seg" id="modeSeg"><button data-m="tilt">Tilt the phone</button><button data-m="stick">On-screen stick</button></div></div>
  <div class="row"><span class="lbl">Gas</span>
    <div class="seg" id="gasSeg"><button data-g="1">Automatic</button><button data-g="0">Hold GAS</button></div></div>
  <div class="row" id="tiltOpts"><span class="lbl">Tilt</span>
    <div class="seg" id="sensSeg"><button data-s="35">Gentle</button><button data-s="26">Normal</button><button data-s="18">Sharp</button></div>
    <div class="seg"><button id="invBtn">Reverse tilt direction</button></div></div>
  <button class="big" id="goBtn">Connect</button>
</div>

<div class="ov" id="lostOv" hidden>
  <h1>Connection lost</h1>
  <p id="lostMsg">The game paused. Make sure the computer is still showing Sunny Circuit.</p>
  <button class="big" id="retryBtn">Reconnect</button>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const PEER_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/+esm';
const code = (location.hash || '').slice(1).replace(/[^a-z0-9]/gi, ''), hostId = 'sunnycircuit-' + code;
const local = new URLSearchParams(location.search).has('local');      // two tabs of one browser, for testing
const store = { get(k, d) { try { const v = localStorage.getItem('scpad.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem('scpad.' + k, JSON.stringify(v)); } catch {} } };
const opt = { mode: store.get('mode', 'tilt'), auto: store.get('auto', 1), sens: store.get('sens', 26), inv: store.get('inv', false) };
const inp = { steer: 0, gas: 0, brake: 0, drift: 0 };
let conn = null, bc = null, peer = null, linked = false, lastHost = 0, hostState = '';

/* ---------- setup screen ---------- */
function paintSetup() {
  document.querySelectorAll('#modeSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === opt.mode));
  document.querySelectorAll('#gasSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.g === opt.auto));
  document.querySelectorAll('#sensSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === opt.sens));
  $('invBtn').setAttribute('aria-pressed', opt.inv);
  $('tiltOpts').hidden = opt.mode !== 'tilt';
  $('goBtn').textContent = linked ? 'Back to the race' : 'Connect';
}
document.querySelectorAll('#modeSeg button').forEach(b => b.onclick = () => { opt.mode = b.dataset.m; store.set('mode', opt.mode); paintSetup(); });
document.querySelectorAll('#gasSeg button').forEach(b => b.onclick = () => { opt.auto = +b.dataset.g; store.set('auto', opt.auto); paintSetup(); });
document.querySelectorAll('#sensSeg button').forEach(b => b.onclick = () => { opt.sens = +b.dataset.s; store.set('sens', opt.sens); paintSetup(); });
$('invBtn').onclick = () => { opt.inv = !opt.inv; store.set('inv', opt.inv); paintSetup(); };
$('setBtn').onclick = () => { paintSetup(); $('setup').hidden = false; };
$('goBtn').onclick = async () => {
  if (opt.mode === 'tilt') await startTilt();
  applyMode(); $('setup').hidden = true;
  wake(); try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); screen.orientation?.lock?.('landscape').catch(() => {}); } catch {}
  if (!linked) connect();
};
if (!code) { $('setupMsg').textContent = 'Open this page by scanning the QR code shown on the computer (Menu → Use your phone as the controller).'; $('goBtn').hidden = true; }
paintSetup();

/* ---------- steering: tilt ---------- */
let tiltOn = false, tiltRaw = 0, tiltCenter = null;
async function startTilt() {
  try { if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) { const r = await DeviceMotionEvent.requestPermission(); if (r !== 'granted') throw 0; } }
  catch { opt.mode = 'stick'; store.set('mode', 'stick'); alert('Motion sensors are not allowed, so the on-screen stick is used instead.'); return; }
  if (tiltOn) return; tiltOn = true;
  addEventListener('devicemotion', e => {
    const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
    const a = ((screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0) * Math.PI / 180;
    const sx = g.x * Math.cos(a) - g.y * Math.sin(a), sy = g.x * Math.sin(a) + g.y * Math.cos(a);   // gravity in screen coordinates
    tiltRaw = Math.atan2(sx, sy) * 180 / Math.PI;
    if (tiltCenter == null) tiltCenter = tiltRaw;
  });
}
const wrap = d => ((d + 540) % 360) - 180;
$('centerBtn').onclick = () => { tiltCenter = tiltRaw; buzz(15); };

/* ---------- steering: stick ---------- */
let stickId = null, stickX = 0;
const steerZone = $('steer');
steerZone.addEventListener('pointerdown', e => {
  if (opt.mode !== 'stick' || e.target === $('centerBtn')) return;
  stickId = e.pointerId; try { steerZone.setPointerCapture(e.pointerId); } catch {} stickMove(e);
});
steerZone.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
const stickEnd = e => { if (e.pointerId === stickId) { stickId = null; stickX = 0; } };
steerZone.addEventListener('pointerup', stickEnd); steerZone.addEventListener('pointercancel', stickEnd);
function stickMove(e) { const r = steerZone.getBoundingClientRect(); stickX = clamp((e.clientX - (r.left + r.width / 2)) / (r.width * 0.36), -1, 1); }
function applyMode() {
  const tilt = opt.mode === 'tilt';
  $('wheel').style.display = tilt ? '' : 'none'; $('centerBtn').hidden = !tilt;
  $('stickTrack').hidden = $('knob').hidden = tilt;
  $('steerHint').textContent = tilt ? 'Tilt the phone like a steering wheel · Center resets straight ahead' : 'Slide left and right to steer';
  $('gas').classList.toggle('auto', !!opt.auto); $('gasNote').textContent = opt.auto ? 'automatic' : 'hold';
}

/* ---------- buttons (multi-touch) ---------- */
for (const id of ['gas', 'brake', 'drift']) {
  const b = $(id), held = new Set();
  const on = e => { e.preventDefault(); held.add(e.pointerId); try { b.setPointerCapture(e.pointerId); } catch {} inp[id] = 1; b.classList.add('on'); buzz(8); send(); };
  const off = e => { held.delete(e.pointerId); if (!held.size) { inp[id] = 0; b.classList.remove('on'); send(); } };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
}
$('pauseBtn').onclick = () => { sendRaw({ t: 'btn', b: 'pause' }); buzz(10); };
$('camBtn').onclick = () => { sendRaw({ t: 'btn', b: 'cam' }); buzz(10); };
$('startBtn').onclick = () => { sendRaw({ t: 'btn', b: 'start' }); buzz(20); };
addEventListener('contextmenu', e => e.preventDefault());

/* ---------- feedback ---------- */
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch {} }
let wakeLock = null;
async function wake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });

/* ---------- link ---------- */
function setStat(ok, text) { $('dot').classList.toggle('ok', ok); $('stat').textContent = text; }
function sendRaw(m) {
  if (conn && conn.open) try { conn.send(m); } catch {}
  else if (bc) bc.postMessage(m);
}
function send() {
  let steer = 0;
  if (opt.mode === 'tilt' && tiltOn && tiltCenter != null) { const d = wrap(tiltRaw - tiltCenter) * (opt.inv ? 1 : -1); steer = Math.abs(d) < 2 ? 0 : clamp((d - Math.sign(d) * 2) / opt.sens, -1, 1); }
  else steer = stickX;
  inp.steer = Math.round(steer * 100) / 100;
  sendRaw({ t: 'in', steer: inp.steer, gas: opt.auto ? (inp.brake ? 0 : 1) : inp.gas, brake: inp.brake, drift: inp.drift, auto: opt.auto });
}
function onHost(m) {
  if (!m || typeof m !== 'object') return;
  lastHost = performance.now();
  if (!linked) { linked = true; setStat(true, 'Connected'); $('lostOv').hidden = true; }
  if (m.t === 'fx') {
    if (m.k === 'crash') buzz(Math.min(120, 20 + m.v * 5));
    else if (m.k === 'boost') buzz(m.v === 2 ? [30, 40, 60] : [25, 30, 25]);
    else if (m.k === 'pad') buzz(40);
  } else if (m.t === 'st') {
    hostState = m.state;
    $('race').textContent = m.state === 'race' || m.state === 'finished' ? `P${m.pos}/${m.of} · L${m.lap}/${m.laps} · ${m.kmh} km/h` : m.track || '';
    setStat(true, m.state === 'menu' ? 'Connected · in the menu' : m.state === 'paused' ? 'Paused' : m.state === 'results' ? 'Race over' : 'Racing');
    const so = $('startOv'); so.hidden = !(m.state === 'menu' || m.state === 'results' || m.state === 'paused');
    $('startBtn').textContent = m.state === 'results' ? '▶ Race again' : m.state === 'paused' ? '▶ Resume' : '▶ Race!';
    const ch = $('charge'); ch.style.width = m.drift ? (m.drift === 2 ? 100 : m.drift === 1 ? 55 : 20) + '%' : '0';
    ch.style.background = m.drift === 2 ? '#ffe08a' : m.drift === 1 ? '#7fd6ff' : '#ffffff';
  } else if (m.t === 'welcome') setStat(true, 'Connected · ' + (m.track || ''));
  else if (m.t === 'bye') lost('The computer disconnected the phone.');
}
function lost(msg) {
  if (!linked) return; linked = false; conn = null;
  setStat(false, 'Disconnected'); $('lostMsg').textContent = msg || 'The game paused. Make sure the computer is still showing Sunny Circuit.'; $('lostOv').hidden = false;
}
async function connect() {
  setStat(false, 'Connecting…');
  if (local) { bc = new BroadcastChannel(hostId); bc.onmessage = e => onHost(e.data); sendRaw({ t: 'hello', name: 'Test tab' }); return; }
  try {
    const m = await import(PEER_URL), Peer = m.Peer || m.default;
    if (!peer || peer.destroyed) {
      peer = new Peer();
      peer.on('error', e => setStat(false, e.type === 'peer-unavailable' ? 'Game not found: scan the QR code again' : 'Connection problem: ' + e.type));
      await new Promise((res, rej) => { peer.on('open', res); setTimeout(() => rej(new Error('timeout')), 12000); });
    }
    conn = peer.connect(hostId, { serialization: 'json' });
    conn.on('open', () => { conn.send({ t: 'hello', name: /iPhone|iPad/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android phone' : 'phone' }); });
    conn.on('data', onHost);
    conn.on('close', () => lost());
  } catch { setStat(false, 'Could not reach the pairing service: check the internet connection'); }
}
$('retryBtn').onclick = () => { $('lostOv').hidden = true; connect(); };

/* ---------- loop: send input 30 times a second, draw the steering ---------- */
setInterval(() => { if (linked || local) send(); if (linked && performance.now() - lastHost > 3000) lost(); }, 33);
(function draw() {
  requestAnimationFrame(draw);
  $('wheel').style.transform = `rotate(${inp.steer * 90}deg)`;
  $('steerDot').style.left = (50 + inp.steer * 50) + '%';
  $('knob').style.transform = `translateX(${stickX * steerZone.clientWidth * 0.36}px)`;
})();
applyMode();
</script>
</body>
</html>
