<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#bfe9ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ABC Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --sky1:#bfe9ff; --sky2:#f2fbff; --ink:#2b3a4f; --mute:#6b7a8f; --line:#d6e4f0; --card:#ffffff;
  --orange:#ff8a3d; --blue:#3d9bff; --green:#2fbf68; --pink:#ff5c9a; --purple:#8a63ff; --teal:#14b5ad; --yellow:#ffd23f; --red:#f2545b;
  --ui:"Fredoka","Baloo 2","Nunito",system-ui,sans-serif;
  --abc:"Andika","Fredoka",system-ui,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);
  font-family:var(--ui);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- top bar ---------- */
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px 4px}
.bar h1{margin:0;font-size:clamp(22px,4.2vmin,38px);font-weight:700;letter-spacing:.02em}
.grow{flex:1}
.ico{min-width:64px;height:64px;border:none;border-radius:20px;background:var(--card);font-size:30px;line-height:1;
  box-shadow:0 5px 0 rgba(43,58,79,.14);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;
  font-family:var(--emoji),var(--ui);transition:transform .08s}
.ico:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,58,79,.14)}
.ico.sm{min-width:56px;height:56px;font-size:24px;border-radius:18px}
.ico b{font-family:var(--ui);font-size:22px}
.gear{position:relative;opacity:.55}
.gear svg{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);pointer-events:none}
.gear circle{fill:none;opacity:0;stroke:var(--purple);stroke-width:5;stroke-dasharray:0 400;stroke-linecap:round}
.gear.holding circle{opacity:1;transition:stroke-dasharray 2s linear;stroke-dasharray:400 400}
.prog{display:flex;gap:8px}
.prog i{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #cfe0ee}
@media (max-width:520px){.bar{gap:6px;padding:8px 10px 4px}.prog{gap:4px}.prog i{width:10px;height:10px;border-width:2px}.bar h1{font-size:20px}}
.slots.many .slot{max-width:calc((100vw - 80px) / 5);font-size:clamp(34px,10vmin,96px)}
.prog i.on{background:var(--yellow);border-color:#f2b600}
[hidden]{display:none!important}

/* ---------- screens ---------- */
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none;padding:8px 16px;overflow:hidden}
.screen.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Pip ---------- */
.pipbar{flex:0 0 auto;display:flex;align-items:flex-end;gap:12px;padding:0 16px 10px;height:clamp(92px,18vmin,160px)}
#pip{flex:0 0 auto;height:100%;aspect-ratio:1;border:none;background:none;padding:0}
#pip svg,.bigpip svg{width:100%;height:100%;overflow:visible}
.pipsvg .head{transform-origin:60px 80px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2px) rotate(-2deg)}}
.pipsvg .m-open{display:none;transform-origin:60px 75px}
.talking .pipsvg .m-open{display:block;animation:mouth .18s ease-in-out infinite alternate}
.talking .pipsvg .m-closed{display:none}
@keyframes mouth{from{transform:scaleY(.35)}to{transform:scaleY(1.05)}}
.hop{animation:hop .45s ease}
@keyframes hop{40%{transform:translateY(-14px)}}
.bubble{position:relative;align-self:center;max-width:min(70vw,760px);background:#fff;border-radius:22px;padding:12px 20px;
  font-size:clamp(18px,3.4vmin,30px);font-weight:600;box-shadow:0 5px 0 rgba(43,58,79,.1);opacity:0;transform:scale(.9);
  transition:opacity .2s,transform .2s;transform-origin:left center}
.bubble.on{opacity:1;transform:none}
.bubble::before{content:"";position:absolute;left:-14px;bottom:18px;border:10px solid transparent;border-right:16px solid #fff;border-left:0}
.bubble small{display:block;font-family:var(--zh);font-weight:500;font-size:.7em;color:var(--mute);margin-top:2px}

/* ---------- start ---------- */
#start{flex-direction:column;align-items:center;justify-content:center;gap:2vmin;text-align:center}
.bigpip{width:min(42vmin,300px);aspect-ratio:1}
.logo{margin:0;font-size:clamp(44px,11vmin,110px);line-height:1;font-weight:700;letter-spacing:.02em}
.logo span:nth-child(1){color:var(--red)} .logo span:nth-child(2){color:var(--orange)} .logo span:nth-child(3){color:var(--blue)}
.sub{margin:0;font-family:var(--zh);color:var(--mute);font-size:clamp(16px,3vmin,24px)}
.play{border:none;border-radius:999px;background:var(--green);color:#fff;font-size:clamp(28px,6vmin,52px);font-weight:700;
  padding:.35em 1.4em;box-shadow:0 8px 0 #1f9150;margin-top:1vmin;animation:pulse 1.8s ease-in-out infinite}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #1f9150}
@keyframes pulse{50%{transform:scale(1.05)}}
.hall{position:absolute;top:16px;left:16px;color:var(--mute);font-family:var(--zh);font-size:15px;text-decoration:none;padding:10px}

/* ---------- home ---------- */
#home{align-items:center;justify-content:center}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(12px,2.6vmin,28px);width:min(100%,1100px);height:min(100%,640px)}
@media (orientation:portrait){.tiles{grid-template-columns:repeat(3,1fr);height:min(100%,900px)}}
.tile{font-size:clamp(20px,4vmin,40px)!important}
/* ---------- challenge ---------- */
#challenge{align-items:center;justify-content:center}
#chPacks{grid-template-columns:repeat(4,1fr)}
@media (orientation:portrait){#chPacks{grid-template-columns:repeat(2,1fr)}}
.rword{font-family:var(--abc);font-size:clamp(64px,17vmin,170px);line-height:1.1;background:#fff;border-radius:32px;padding:.05em .45em .12em;
  box-shadow:0 6px 0 rgba(43,58,79,.1);color:var(--ink);letter-spacing:.04em}
#rdCards .card .e,#lsCards .card .e{font-family:var(--emoji);font-size:clamp(60px,13vmin,130px)}
#rdCards .card,#lsCards .card{width:clamp(110px,22vmin,220px)}
.sline{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(6px,1.4vmin,14px);max-width:96%}
.wslot{min-width:clamp(56px,11vmin,110px);height:clamp(48px,9.5vmin,92px);border-radius:16px;border:4px dashed #b9cde0;background:rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;padding:0 .3em;font-family:var(--abc);font-size:clamp(26px,5.6vmin,54px);color:var(--ink)}
.wslot.full{border-style:solid;border-color:var(--green);background:#fff}
.wslot.lit{background:var(--yellow)}
.wtile{border:none;border-radius:18px;background:var(--c);color:#fff;font-family:var(--abc);font-size:clamp(26px,5.6vmin,54px);line-height:1;
  padding:.22em .5em .3em;box-shadow:0 6px 0 var(--d);min-height:56px}
.wtile:active{transform:translateY(4px)}
.wtile.used{visibility:hidden}
#stPic{font-size:clamp(56px,14vmin,140px)}
.shp{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4%;width:100%;height:100%}
#lsEar{font-size:clamp(56px,13vmin,130px)}
.tile{border:none;border-radius:28px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vmin;
  box-shadow:0 8px 0 var(--d);font-weight:700;font-size:clamp(22px,4.6vmin,44px);min-height:0;padding:8px;transition:transform .08s}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 var(--d)}
.tile .e{font-family:var(--emoji);font-size:1.9em;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}

/* ---------- phonics & blends ---------- */
#phonics,#blendPick,#pairLesson{align-items:center;justify-content:center}
.lbtn.heard{outline:4px solid #ffd23f;outline-offset:-4px}
.lbtn.go{background:var(--purple);color:#fff;font-family:var(--emoji),var(--ui);font-size:clamp(26px,5vmin,48px)}
.lbtn.go small{font-family:var(--ui);font-size:.36em;margin-top:4px}
.ear{border:none;background:#fff;border-radius:32px;box-shadow:0 6px 0 rgba(43,58,79,.1);font-family:var(--emoji);font-size:clamp(70px,18vmin,180px);line-height:1;padding:.12em .3em}
.ear small{display:block;font-family:var(--abc);font-size:.24em;color:var(--purple);font-weight:700;margin-top:.1em;min-height:1.2em}
.pairs .pack b{font-family:var(--abc);font-size:1.8em;line-height:1.1;color:var(--purple)}
.pairs .pack small{font-size:.55em;color:var(--mute);font-weight:500;font-family:var(--abc)}
.pl{display:flex;flex-direction:column;align-items:center;gap:2.4vmin;width:100%}
.pl .eq{font-family:var(--abc);font-weight:700;font-size:clamp(48px,11vmin,110px);line-height:1;display:flex;gap:.3em;align-items:center;cursor:pointer}
.pl .eq span{color:var(--blue)} .pl .eq i{font-style:normal;color:var(--mute);font-size:.6em}
.pl .eq b{color:var(--purple)}
div.ltile{display:flex;align-items:center;justify-content:center}
.ltile.lit{background:var(--yellow)!important;color:var(--ink);box-shadow:0 6px 0 #d4ab00;transform:translateY(-6px)}
.bub.pair{font-size:clamp(44px,9vmin,90px)}

/* ---------- letter grid ---------- */
#tracePick{align-items:center;justify-content:center}
.lgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(8px,1.6vmin,16px);width:min(100%,1000px);max-height:100%}
@media (orientation:portrait){.lgrid{grid-template-columns:repeat(5,1fr)}}
.lbtn{border:none;border-radius:20px;background:#fff;box-shadow:0 5px 0 rgba(43,58,79,.12);aspect-ratio:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-family:var(--abc);font-size:clamp(28px,6.4vmin,60px);line-height:1;color:var(--lc);min-height:64px;padding:0}
.lbtn .st{font-family:var(--ui);font-size:.32em;letter-spacing:.06em;color:#f2b600;margin-top:4px}
.lbtn:active{transform:translateY(3px)}

/* ---------- trace ---------- */
#trace{gap:16px}
.tside{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vmin;width:clamp(120px,22vmin,220px)}
.tword{background:#fff;border-radius:24px;padding:10px;width:100%;text-align:center;box-shadow:0 5px 0 rgba(43,58,79,.1)}
.tword .emo{font-family:var(--emoji);font-size:clamp(48px,11vmin,110px);line-height:1.15}
.tword .tw{font-family:var(--abc);font-size:clamp(22px,4.4vmin,40px);font-weight:700}
.stages{display:flex;gap:8px;font-size:clamp(24px,4.6vmin,40px);color:#d8e2ec}
.stages .on{color:#f2b600}
.tbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tbox{flex:1;position:relative;background:#fff;border-radius:28px;box-shadow:0 6px 0 rgba(43,58,79,.1);min-width:0;touch-action:none}
.tbox canvas{position:absolute;inset:0;touch-action:none}
@media (orientation:portrait){
  #trace{flex-direction:column}
  .tside{width:100%;flex-direction:row;justify-content:space-between}
  .tword{width:auto;display:flex;align-items:center;gap:10px;padding:6px 14px}
  .tword .emo{font-size:clamp(40px,8vmin,80px)}
}

/* ---------- quiz (sounds / spell) ---------- */
.quiz{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.6vmin}
.pic{border:none;background:#fff;border-radius:32px;box-shadow:0 6px 0 rgba(43,58,79,.1);font-family:var(--emoji);
  font-size:clamp(70px,20vmin,200px);line-height:1;padding:.12em .3em;min-width:1.6em}
.pic small{display:block;font-family:var(--abc);font-size:.22em;color:var(--ink);font-weight:700;margin-top:.15em;min-height:1.2em}
.choices{display:flex;gap:clamp(14px,4vmin,48px)}
.bub{width:clamp(96px,20vmin,190px);aspect-ratio:1;border-radius:50%;border:none;background:var(--c,#fff);color:#fff;
  font-family:var(--abc);font-size:clamp(56px,12vmin,120px);line-height:1;box-shadow:0 7px 0 var(--d,#ccc);padding:0 0 .08em}
.bub:active{transform:translateY(4px)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.1);filter:brightness(1.15) drop-shadow(0 0 14px #ffd23f)}}
.right{animation:yay .6s ease}
@keyframes yay{40%{transform:scale(1.22) rotate(-6deg)}}
.slots{display:flex;gap:clamp(10px,2vmin,20px)}
.slot{width:clamp(80px,15vmin,140px);aspect-ratio:1;border-radius:22px;border:4px dashed #b9cde0;background:rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;font-family:var(--abc);font-size:clamp(50px,10vmin,96px);color:rgba(43,58,79,.16)}
.slot.full{border-style:solid;border-color:var(--green);background:#fff;color:var(--ink)}
.slot.lit{background:var(--yellow);color:var(--ink)}
.tilesRow{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2vmin,20px)}
.ltile{width:clamp(76px,13vmin,124px);aspect-ratio:1;border:none;border-radius:22px;background:var(--c);color:#fff;font-family:var(--abc);
  font-size:clamp(46px,8.5vmin,84px);line-height:1;box-shadow:0 6px 0 var(--d);padding:0 0 .08em}
.ltile.used{visibility:hidden}

/* ---------- packs / cards ---------- */
#matchPick,#talkPick,#match{align-items:center;justify-content:center}
.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,2.4vmin,24px);width:min(100%,1000px)}
@media (orientation:portrait){.packs{grid-template-columns:repeat(2,1fr)}}
.pack{border:none;border-radius:26px;background:#fff;box-shadow:0 6px 0 rgba(43,58,79,.12);padding:2vmin 8px;display:flex;flex-direction:column;
  align-items:center;gap:.4vmin;font-size:clamp(20px,3.8vmin,34px);font-weight:700;min-height:64px;position:relative}
.pack .e{font-family:var(--emoji);font-size:2em;line-height:1.15}
.pack .done{position:absolute;top:8px;right:12px;font-size:.8em;color:var(--green)}
.cards{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3vmin,36px)}
.card{width:clamp(130px,26vmin,260px);aspect-ratio:1;border:none;border-radius:30px;background:#fff;box-shadow:0 7px 0 rgba(43,58,79,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;position:relative}
.card:active{transform:translateY(4px)}
.card .e{font-family:var(--emoji);font-size:clamp(60px,13vmin,130px);line-height:1.1}
.card .sw{width:58%;aspect-ratio:1;border-radius:50%;border:4px solid rgba(0,0,0,.12)}
.card .num{font-family:var(--abc);font-weight:700;font-size:clamp(60px,13vmin,130px);line-height:1}
.card .dots{font-size:clamp(12px,2.2vmin,20px);letter-spacing:2px;color:var(--orange);max-width:90%;text-align:center;line-height:1}
.card .lab{font-family:var(--abc);font-weight:700;font-size:clamp(18px,3.4vmin,32px);min-height:1.2em;line-height:1.2}
.card .lab.hide{visibility:hidden}
.mpic{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(150px,30vmin,280px);aspect-ratio:1;padding:6px}
.mpic[hidden]{display:none}
.mpic .e{font-size:clamp(80px,19vmin,180px)!important}
.mpic .sw{width:70%;aspect-ratio:1;border-radius:50%;border:4px solid rgba(0,0,0,.12)}
.mpic .num{font-family:var(--abc);font-weight:700;font-size:clamp(60px,14vmin,130px);line-height:1}
.mpic .dots{font-family:var(--ui);font-size:clamp(14px,2.6vmin,24px);letter-spacing:2px;color:var(--orange);max-width:90%;text-align:center;line-height:1}
.mpic .shp{width:80%;height:80%}
.card.word{aspect-ratio:auto;height:clamp(84px,15vmin,150px)}
.wtxt{font-family:var(--abc);font-weight:700;font-size:clamp(28px,6.4vmin,60px);line-height:1.1;text-align:center;color:var(--ink)}
.wtxt.long{font-size:clamp(20px,4.4vmin,42px)}
#packs{grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.6vmin,18px)}
#packs .pack{font-size:clamp(14px,2.6vmin,24px);padding:1.2vmin 6px;border-radius:20px}
@media (orientation:portrait){#packs{grid-template-columns:repeat(3,1fr)}}
#matchPick{overflow-y:auto}

/* ---------- talk ---------- */
#talk{align-items:center;justify-content:center}
.talk{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vmin;position:relative}
.tpic{font-family:var(--emoji);font-size:clamp(46px,11vmin,110px);line-height:1.1;text-align:center;min-height:0;max-width:90%}
.tpic:empty{display:none}
.opts .card{width:clamp(120px,21vmin,220px)}
.opts .card .e{font-size:clamp(48px,9vmin,96px)}
.opts .card .lab{font-size:clamp(16px,2.9vmin,28px);text-align:center}
/* where is it: animal in / on / next to the box */
.wh{display:inline-flex;flex-direction:column;align-items:center;font-family:var(--emoji);line-height:1}
.wh .a{position:relative;z-index:1}.wh .b{position:relative;z-index:2}
.wh.in .a{font-size:.6em;margin-bottom:-.62em;z-index:1}.wh.in .b{z-index:2}
.wh.on .a{margin-bottom:-.12em;z-index:3}
.wh.next{flex-direction:row;align-items:flex-end;gap:.08em}.wh.next .a{font-size:.8em}
.wh.sm{font-size:clamp(34px,6.5vmin,70px)}
.tpic .wh{font-size:1.2em}
#scenes{grid-template-columns:repeat(5,1fr);gap:clamp(8px,1.6vmin,18px)}
#scenes .pack{font-size:clamp(15px,2.8vmin,26px);padding:1.4vmin 6px;border-radius:20px}
@media (orientation:portrait){#scenes{grid-template-columns:repeat(3,1fr)}}
#talkPick{overflow-y:auto}
.mic{width:clamp(80px,14vmin,120px);aspect-ratio:1;border-radius:50%;border:none;background:var(--purple);color:#fff;font-family:var(--emoji);
  font-size:clamp(36px,6.4vmin,58px);box-shadow:0 7px 0 #5f3fd0}
.mic.listening{background:var(--red);box-shadow:0 7px 0 #b8323a;animation:pulse .8s ease-in-out infinite}
.mic:disabled{opacity:.4}

/* ---------- island ---------- */
#island{padding:8px 16px}
.board{flex:1;position:relative;border-radius:28px;overflow:hidden;touch-action:none;
  background:
   radial-gradient(ellipse 46% 34% at 50% 64%,#8fd46a 0 60%,#ffe2a3 61% 74%,transparent 75%),
   radial-gradient(ellipse 30% 9% at 50% 92%,rgba(255,255,255,.35),transparent 70%),
   linear-gradient(180deg,#9fe0ff 0 22%,#5cc8e8 22.2% 100%)}
.board::before{content:"☁️";position:absolute;top:3%;left:12%;font-family:var(--emoji);font-size:clamp(30px,7vmin,64px);opacity:.9}
.board::after{content:"🌞";position:absolute;top:2%;right:8%;font-family:var(--emoji);font-size:clamp(34px,8vmin,72px)}
.stk{position:absolute;transform:translate(-50%,-50%) rotate(var(--r,0deg));font-family:var(--emoji);font-size:clamp(40px,8.5vmin,84px);line-height:1;
  cursor:grab;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15));touch-action:none;padding:4px}
.stk.drag{cursor:grabbing;transform:translate(-50%,-50%) scale(1.2);z-index:9}
.stk.bounce{animation:sbounce .5s}
@keyframes sbounce{40%{transform:translate(-50%,-62%) rotate(var(--r,0deg)) scale(1.15)}}
.empty{position:absolute;inset:auto 0 12% 0;text-align:center;font-size:clamp(20px,4vmin,34px);color:#fff;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.2)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,50,80,.45);z-index:50;padding:16px}
.overlay.on{display:flex}
.panel{background:#fff;border-radius:32px;padding:clamp(18px,4vmin,40px);text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.12);max-width:min(560px,100%)}
.panel h2{margin:.2em 0;font-size:clamp(26px,5vmin,44px)}
.bigstk{font-family:var(--emoji);font-size:clamp(100px,24vmin,200px);line-height:1.1;animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border:none;border-radius:22px;background:var(--c,var(--green));color:#fff;font-size:clamp(22px,4vmin,32px);font-weight:700;min-height:64px;
  padding:0 26px;box-shadow:0 6px 0 var(--d,#1f9150);font-family:var(--emoji),var(--ui)}
.btn:active{transform:translateY(4px)}
.confetti{position:fixed;pointer-events:none;font-family:var(--emoji);font-size:34px;z-index:60;animation:fall 1.4s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}

/* parent area: plain, readable, Traditional Chinese */
.parent{font-family:var(--zh);text-align:left;max-width:min(720px,100%);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text;touch-action:pan-y}
.parent h2{font-family:var(--zh);font-size:24px;margin:0 0 6px}
.parent h3{font-size:17px;margin:18px 0 6px;color:var(--purple)}
.parent p,.parent li,.parent label{font-size:15px;line-height:1.6}
.parent .note{color:var(--mute);font-size:13px}
.parent .set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.parent select,.parent input[type=range]{font-size:15px;min-height:40px;max-width:55%}
.parent input[type=checkbox]{width:26px;height:26px}
.parent .pbtn{border:1px solid var(--line);background:#f6f9fc;border-radius:12px;padding:10px 16px;font-size:15px;font-family:var(--zh);min-height:44px}
.parent .pbtn.warn{color:var(--red)}
.parent a.pbtn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.lrep{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.lrep span{background:#f6f9fc;border-radius:10px;text-align:center;padding:4px 0;font-family:var(--abc);font-size:20px}
.lrep span em{display:block;font-style:normal;font-family:var(--ui);font-size:11px;color:#f2b600}
.gateq{font-size:clamp(34px,7vmin,56px);font-weight:700;margin:10px 0}
.gatea{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gatea button{min-height:64px;border:1px solid var(--line);border-radius:16px;background:#f6f9fc;font-size:26px;font-weight:700}
/* short landscape screens (phones): more columns so all letters fit */
@media (orientation:landscape) and (max-height:520px){.lgrid{grid-template-columns:repeat(10,1fr);gap:6px;width:min(100%,760px)}.lgrid .lbtn{min-height:0;border-radius:14px;font-size:clamp(22px,7vmin,40px)}}
</style>
</head>
<body>
<div id="app">

    <section class="screen" id="tracePick"><div class="lgrid" id="lgrid"></div></section>

        <div class="stages" id="tStages"></div>
        <div class="tbtns">
          <button class="ico" id="tHear" aria-label="Hear">🔊</button>

          <button class="ico" id="tClear" aria-label="Start over">🔄</button>

    <section class="screen" id="sounds"><div class="quiz"><button class="pic" id="sPic"></button><div class="choices" id="sCh"></div></div></section>

    <section class="screen" id="challenge"><div class="packs" id="chPacks"></div></section>
    <section class="screen" id="read"><div class="quiz"><div class="rword" id="rdWord"></div><div class="cards" id="rdCards"></div></div></section>
    <section class="screen" id="sent"><div class="quiz"><button class="pic" id="stPic"></button><div class="sline" id="stLine"></div><div class="tilesRow" id="stTiles"></div></div></section>
    <section class="screen" id="listen"><div class="quiz"><button class="ear" id="lsEar">👂</button><div class="cards" id="lsCards"></div></div></section>
    <section class="screen" id="island"><div class="board" id="board"></div></section>
  </main>

  <footer class="pipbar" id="pipbar">
    <button id="pip" aria-label="Pip: say it again"></button>
    <div class="bubble" id="bubble"></div>
  </footer>
</div>

<div class="overlay" id="rewardOv">
  <div class="panel">
    <div class="bigstk" id="rwStk"></div>
    <h2 id="rwWord"></h2>
    <div class="row"><button class="btn" id="rwOk" style="--c:var(--green);--d:#1f9150">✔️ OK</button><button class="btn" id="rwIsland" style="--c:var(--teal);--d:#0d847e">🏝️</button></div>
  </div>
</div>
<div class="overlay" id="breakOv">
  <div class="panel">
    <div class="bigstk">😴</div>
    <h2>Time for a break!</h2>
    <p class="sub">休息一下，讓眼睛休息吧！</p>
    <div class="row"><button class="btn" id="brOk">✔️ OK</button></div>
  </div>
</div>
<div class="overlay" id="voiceOv">
  <div class="panel parent" style="text-align:center">
    <div class="bigstk" style="font-size:80px">🔇</div>
    <h2>Pip 沒辦法說話</h2>
    <p>這個瀏覽器不能播放語音（例如 Claude App 內建的瀏覽器）。音效可以聽到，但 Pip 的聲音出不來。</p>
    <p>請改用 <b>Chrome</b>（電腦或 Android 平板）、Safari 或 Edge 打開這個遊戲。</p>
    <p class="note">Android 平板如果還是沒聲音：到「設定 → 系統 → 語言 → 文字轉語音輸出」，選「Google 語音服務」並下載英文語音，再確認媒體音量有開。</p>
    <div class="row"><button class="pbtn" id="voiceRetry">再試一次</button><button class="btn" id="voiceOk" style="font-family:var(--zh)">知道了</button></div>
  </div>
</div>
<div class="overlay" id="gateOv">

    <h2>家長區</h2>

    <div class="gatea" id="gateA"></div>
    <div class="row"><button class="pbtn" id="gateX">取消</button></div>
  </div>
</div>
<div class="overlay" id="parentOv"><div class="panel parent" id="parentP"></div></div>

function stopDemo() { if (TR.demo) { TR.demo = null; reqDraw(); } }
function demo() {
  stopDemo();

  const per = 1300, total = TR.strokes.length * per + 250;

    if (TR.demo !== d || d.strokes !== TR.strokes) { if (TR.demo === d) TR.demo = null; return; }

  const weak = pool.filter(l => S.sounds[l] && S.sounds[l].miss > S.sounds[l].ok).slice(0, 2);
  const rest = shuffle(pool.filter(l => !weak.includes(l)));

function talkStep(step, f) {

async function talkChoose(o, b, f, tapped) {

  SFX.pop(); if (b) { b.classList.remove('right'); void b.offsetWidth; b.classList.add('right'); }

  if (tapped) { await say([{ t: o.t, pitch: 1.45 }], '🧒 ' + o.t); if (!live(f)) return; }
  const step = KT.step;
  if (o.set) Object.assign(KT.ctx, o.set);

    <div class="set"><label for="pMic">聊天時可以用說的（麥克風）${recOK ? '' : '<br><span class="note">這個瀏覽器不支援語音辨識，只能點圖片。</span>'}</label><input type="checkbox" id="pMic" ${st.mic ? 'checked' : ''} ${recOK ? '' : 'disabled'}></div>
    <div class="set"><label for="pBreak">休息提醒</label><select id="pBreak">${[0, 10, 15, 20, 30].map(m => `<option value="${m}" ${st.breakMin === m ? 'selected' : ''}>${m ? m + ' 分鐘' : '關閉'}</option>`).join('')}</select></div>
    <p class="note">語音辨識由瀏覽器提供（Android 的 Chrome 會把聲音送到 Google 處理）。遊戲本身不錄音、不儲存任何聲音或對話內容。</p>
    <div class="row" style="justify-content:flex-start">
      <button class="pbtn" id="pTest">測試聲音</button>
      <button class="pbtn" id="pFull">全螢幕</button>
      <a class="pbtn" href="../index.html">回遊戲大廳</a>
      <button class="pbtn warn" id="pReset">清除所有進度</button>
    </div>
    <div class="row"><button class="btn" id="pClose" style="font-family:var(--zh)">完成</button></div>`;
  $('#pGhost').onchange = e => { st.ghost = e.target.checked; save(); };
  $('#pRate').oninput = e => { st.rate = +e.target.value; save(); };
  $('#pVoice').onchange = e => { st.voice = e.target.value; save(); TTS.load(); };
  $('#pMic').onchange = e => { st.mic = e.target.checked; save(); };
  $('#pBreak').onchange = e => { st.breakMin = +e.target.value; save(); };
  $('#pTest').onclick = () => say('Hello! I am Pip. A, B, C!');
  $('#pFull').onclick = () => { const d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(() => {}); };
  $('#pReset').onclick = () => {
    if (!confirm('確定要清除所有進度和貼紙嗎？（設定會保留）')) return;
    const keep = S.settings; S = DEF(); S.settings = keep; save(); $('#parentOv').classList.remove('on'); go('home');
  };
  $('#pClose').onclick = () => { $('#parentOv').classList.remove('on'); if (cur === 'tracePick' || cur === 'home' || cur === 'island') go(cur); };
  $('#parentOv').classList.add('on');
}

/* ---------------- play time & breaks ---------------- */
let sessionMs = 0;
setInterval(() => {
  if (document.hidden || cur === 'start' || cur == null) return;
  if (S.play.day !== today()) S.play = { day: today(), ms: 0 };
  S.play.ms += 5000; sessionMs += 5000;
  if (sessionMs % 30000 === 0) save();
  const lim = S.settings.breakMin * 60000;
  if (lim && sessionMs >= lim && !$('#breakOv').classList.contains('on') && !$('#rewardOv').classList.contains('on')) {
    sessionMs = 0; TTS.cancel(); Rec.stop();
    $('#breakOv').classList.add('on');
    say(['Time for a break! Rest your eyes. See you later!', { zh: '休息一下，讓眼睛休息吧！' }]);
  }
}, 5000);
$('#brOk').onclick = () => { $('#breakOv').classList.remove('on'); go('home'); };
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); TTS.cancel(); Rec.stop(); } });

/* ---------------- boot ---------------- */
addEventListener('contextmenu', e => e.preventDefault());
// the writing box changes size with orientation and when the side panel's content loads
if (window.ResizeObserver) new ResizeObserver(() => { if (cur === 'trace') trResize(); }).observe($('#tbox'));
addEventListener('resize', () => { if (cur === 'trace') trResize(); });
TR.cv = $('#tcv'); TR.cx = TR.cv.getContext('2d');
TR.cv.addEventListener('pointerdown', trDown);
TR.cv.addEventListener('pointermove', trMove);
TR.cv.addEventListener('pointerup', trUp);
TR.cv.addEventListener('pointercancel', trUp);
Pip.init();
go('start');
</script>
</body>
</html>
