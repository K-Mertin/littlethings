<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABC Island 發音錄音</title>
<style>
:root{--ink:#223;--mute:#6b7a8c;--card:#fff;--bg:#f4f8fc;--pu:#8a63ff;--red:#f2545b;--green:#2fbf68}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:2;background:#fff;box-shadow:0 2px 0 #e3eaf2;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:19px;margin:0;flex:1 1 220px}
#prog{font-weight:700;color:var(--pu)}
main{max-width:860px;margin:0 auto;padding:14px 16px 60px}
.tips{background:#fff;border-radius:14px;padding:12px 16px;line-height:1.6;font-size:14px;box-shadow:0 2px 0 #e3eaf2}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:14px}
.it{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 2px 0 #e3eaf2;display:flex;flex-direction:column;gap:8px;border:3px solid transparent}
.it.done{border-color:#bfe9cf}.it.rec{border-color:var(--red)}
.top{display:flex;align-items:baseline;gap:10px}.k{font-size:34px;font-weight:700;color:var(--pu);min-width:52px}
.w{font-size:15px;color:var(--mute)}.hint{font-size:13px;line-height:1.5;color:#445}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{border:none;border-radius:12px;padding:10px 14px;font-size:15px;background:#e6ecf3;color:var(--ink);cursor:pointer}
button.rec{background:var(--red);color:#fff}button.play{background:var(--green);color:#fff}button:disabled{opacity:.4}
button.big{background:var(--pu);color:#fff;font-weight:700}
.st{font-size:13px;color:var(--mute);align-self:center}
</style></head><body>
<header><h1>ABC Island 自然發音錄音</h1><span id="prog"></span><button class="big" id="dl">下載全部錄音（zip）</button></header>
<main>
<div class="tips">
<b>怎麼錄：</b>找安靜的地方，手機或電腦都可以（第一次會問麥克風權限，請允許）。每個音按「● 錄音」→ 唸一次 → 按「■ 停止」（4 秒會自動停），再按「▶ 聽」確認，不滿意就重錄。<br>
<b>訣竅：</b>b d g k p t c ch j 這些短音要<b>短而乾淨</b>，不要加「ㄜ」；s f m n l v z sh th r 這些可以<b>拉長約 1 秒</b>。前後留一點安靜沒關係，我會剪掉。<br>
錄音存在這個瀏覽器裡（重新整理不會不見）。全部錄完按上面的「下載」，會存成一個 <b>abc-my-sounds.zip</b> 到「下載」資料夾，跟 Claude 說一聲就好。
</div>
<div class="grid" id="grid"></div>
</main>

const $ = s => document.querySelector(s);
// ---- tiny IndexedDB store, so recordings survive a reload
const dbp = new Promise((ok, no) => { const r = indexedDB.open('abc-rec', 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const db = async (mode, fn) => { const d = await dbp; return new Promise((ok, no) => { const t = d.transaction('s', mode), s = t.objectStore('s'), r = fn(s); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); }); };
const put = (k, v) => db('readwrite', s => s.put(v, k)), get = k => db('readonly', s => s.get(k));
const REC = {};
function prog() { const n = ITEMS.filter(([k]) => REC[k]).length; $('#prog').textContent = `已錄 ${n} / ${ITEMS.length}`; }
let mr = null, cur = null, stream = null, timer = 0;
const mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
const ext = m => m.includes('mp4') ? 'm4a' : m.includes('ogg') ? 'ogg' : 'webm';
function card([k, w, hint]) {
  const el = document.createElement('div'); el.className = 'it'; el.id = 'it_' + k;
  el.innerHTML = `<div class="top"><span class="k">${k}</span><span class="w">例字：${w}</span></div><div class="hint">${hint}</div>
    <div class="row"><button class="ex">▶ 例字</button><button class="rec">● 錄音</button><button class="play" disabled>▶ 聽</button><span class="st"></span></div>`;
  const ex = new Audio('data:audio/mp4;base64,' + EX[k]);
  el.querySelector('.ex').onclick = () => { ex.currentTime = 0; ex.play(); };
  el.querySelector('.rec').onclick = () => (cur === k ? stop() : start(k));
  el.querySelector('.play').onclick = () => { if (REC[k]) new Audio(URL.createObjectURL(REC[k])).play(); };
  return el;
}
function mark(k) {
  const el = $('#it_' + k); if (!el) return;
  el.classList.toggle('done', !!REC[k]); el.classList.toggle('rec', cur === k);
  el.querySelector('.rec').textContent = cur === k ? '■ 停止' : (REC[k] ? '● 重錄' : '● 錄音');
  el.querySelector('.play').disabled = !REC[k];
  el.querySelector('.st').textContent = cur === k ? '錄音中…' : (REC[k] ? '✓ 已錄' : '');
}
async function start(k) {
  if (cur) stop();
  try { stream = stream || await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { alert('沒有麥克風權限：請在瀏覽器網址列旁允許麥克風，再試一次。'); return; }
  const chunks = []; mr = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined); cur = k;
  mr.ondataavailable = e => e.data.size && chunks.push(e.data);
  mr.onstop = async () => { const b = new Blob(chunks, { type: mr.mimeType || mime }); REC[k] = b; await put(k, b); cur = null; mark(k); prog(); };
  mr.start(); mark(k);
  clearTimeout(timer); timer = setTimeout(() => { if (cur === k) stop(); }, 4000);
}
function stop() { clearTimeout(timer); if (mr && mr.state !== 'inactive') mr.stop(); }
// ---- zip (stored, no compression)
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
async function zip(files) {
  const parts = [], cen = []; let off = 0;
  for (const [name, blob] of files) {
    const data = new Uint8Array(await blob.arrayBuffer()), nm = new TextEncoder().encode(name), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, nm.length, true);
    parts.push(h, nm, data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
    cen.push(c, nm); off += 30 + nm.length + data.length;
  }
  const size = cen.reduce((s, x) => s + x.byteLength, 0);
  const e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, size, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...cen, e], { type: 'application/zip' });
}
$('#dl').onclick = async () => {
  const files = ITEMS.filter(([k]) => REC[k]).map(([k]) => [`${k}.${ext(REC[k].type || mime)}`, REC[k]]);
  if (!files.length) { alert('還沒有錄音喔。'); return; }
  if (files.length < ITEMS.length && !confirm(`只錄了 ${files.length} / ${ITEMS.length} 個，還是要下載嗎？`)) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(await zip(files)); a.download = 'abc-my-sounds.zip'; a.click();
};
(async () => {
  const g = $('#grid'); for (const it of ITEMS) g.appendChild(card(it));
  for (const [k] of ITEMS) { try { const b = await get(k); if (b) REC[k] = b; } catch (e) {} mark(k); }
  prog();
  if (!window.MediaRecorder) alert('這個瀏覽器不能錄音，請改用 Chrome 或 Safari。');
})();
</script></body></html>
