<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>象棋殘局 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#f43f5e;--accent-ink:#e11d48;--accent-soft:#fff1f3}
.tb-btn.primary{box-shadow:0 4px 12px rgba(244,63,94,.35)}
/* 目錄 */
#menu{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.mwrap{max-width:1040px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch;margin-bottom:22px}
.hero .intro{flex:1 1 320px;background:linear-gradient(120deg,#fff1f3,#fff7e6);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:.06em;color:#e11d48}
.hero p{margin:8px 0 0;color:var(--mute);font-size:15px;max-width:46ch}
.prog{margin-top:14px;font-size:13px;font-weight:700;color:#e11d48}
.bar{height:8px;border-radius:99px;background:#fff;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f43f5e,#f59e0b);border-radius:99px}
.daily{flex:0 1 300px;min-width:240px;background:var(--panel);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;text-align:left;font:inherit;color:inherit}
.daily:hover{transform:translateY(-3px);border-color:#fda4af}
.daily .tag{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,#f43f5e,#f59e0b);border-radius:99px;padding:2px 10px}
.daily b{font-size:20px;font-weight:900}
.daily span{font-size:13px;color:var(--mute)}
.daily .ok{color:#10b981;font-weight:700}
.set{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.set h3{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.set h3::before{content:"";width:8px;height:22px;border-radius:4px;background:var(--c,#f43f5e)}
.set .d{color:var(--mute);font-size:13px}
.set .cnt{margin-left:auto;font-size:13px;font-weight:700;color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.tile{appearance:none;border:0;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile b{font-size:20px;font-weight:900;line-height:1}
.tile s{text-decoration:none;font-size:12px;letter-spacing:1px;color:#e5e7eb}
.tile s.on{color:#f59e0b}
.tile.done{background:color-mix(in srgb,var(--c) 10%,#fff)}
.tile.done b{color:var(--c)}
.tile.lock{opacity:.4;cursor:default;transform:none}
.lockmsg{font-size:13px;color:var(--mute);margin:-2px 0 8px}
/* 解題畫面 */
#play{flex:1;min-height:0;display:none;align-items:center;justify-content:center;gap:20px;padding:12px;position:relative}
body.playing #menu{display:none}
body.playing #play{display:flex}
#cv{display:block;touch-action:none;border-radius:20px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(201,139,74,.25);flex:none}
.side{width:290px;flex:none;display:flex;flex-direction:column;gap:12px;align-self:center}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.pz-t{font-size:13px;font-weight:700;color:#e11d48;letter-spacing:.06em}
.pz-h{font-size:22px;font-weight:900;margin:2px 0 4px}
.pz-g{font-size:14px;color:var(--mute)}
.pz-left{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pz-left i{width:26px;height:26px;border-radius:50%;background:#ffe4e6;color:#e11d48;font-style:normal;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.pz-left i.used{background:#f43f5e;color:#fff}
.msg{font-size:15px;font-weight:500;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
.msg.good{color:#059669}.msg.bad{color:#e11d48}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .tb-btn{min-height:44px}
.acts .wide{grid-column:1/-1}
body.narrow #play{flex-direction:column;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:center}
body.narrow .side{width:100%;max-width:560px;gap:6px;display:contents}
body.narrow .card.info{order:0;width:100%;max-width:560px;padding:8px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body.narrow .pz-h{font-size:17px;margin:0}
body.narrow .pz-g{font-size:12px;flex-basis:100%}
body.narrow .pz-left{margin:0 0 0 auto}
body.narrow .pz-left i{width:22px;height:22px;font-size:12px}
body.narrow #cv{order:1}
body.narrow .msg{order:2;min-height:28px;font-size:14px;width:100%;max-width:560px;padding:4px 10px;border-radius:12px}
body.narrow .acts{order:3;width:100%;max-width:560px;grid-template-columns:repeat(4,1fr);gap:6px}
body.narrow .acts .wide{grid-column:auto}
body.narrow .acts .tb-btn{min-height:40px;padding:6px 4px;font-size:13px}
.think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f43f5e;margin-left:6px;animation:xqp 1s infinite}
@keyframes xqp{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-height:520px){
  body:not(.narrow) .side{gap:8px;max-height:100%}
  body:not(.narrow) .card{padding:8px 12px;border-radius:14px}
  body:not(.narrow) .pz-h{font-size:18px;margin:0}
  body:not(.narrow) .pz-left{margin-top:4px}
  body:not(.narrow) .pz-left i{width:22px;height:22px}
  body:not(.narrow) .msg{min-height:0;font-size:13px}
  body:not(.narrow) .acts .tb-btn{min-height:36px;padding:5px 8px}
}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html" id="back">← 棋牌</a>
  <h1 class="tb-title">象棋殘局</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bMenu" hidden>題目列表</button>
  <button class="tb-btn" id="bRule">玩法</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<div id="menu"><div class="mwrap" id="mwrap"></div></div>
<main id="play">
  <canvas id="cv" aria-label="殘局棋盤"></canvas>
  <div class="side">
    <div class="card info"><div class="pz-t" id="pzT"></div><div class="pz-h" id="pzH"></div><div class="pz-g" id="pzG"></div><div class="pz-left" id="pzL"></div></div>
    <div class="card msg" id="msg"></div>
    <div class="acts">
      <button class="tb-btn" id="bRetry">重來</button>
      <button class="tb-btn" id="bHint">提示</button>
      <button class="tb-btn" id="bSol">看解答</button>
      <button class="tb-btn primary" id="bNext">下一題</button>
    </div>
  </div>
</main>
<script src="common.js"></script>
<script src="xq-logic.js"></script>
<script src="xq-puzzles.js"></script>
<script>
'use strict';
const L = {}; XQLOGIC(L); const X = L.X;
const AI = TB.worker(XQLOGIC);
const NAMES = ['', '帥', '仕', '相', '傌', '俥', '炮', '兵', '', '將', '士', '象', '馬', '車', '包', '卒'];
const CODE = { K: 1, A: 2, B: 3, N: 4, R: 5, C: 6, P: 7, k: 9, a: 10, b: 11, n: 12, r: 13, c: 14, p: 15 };
const CN = '零一二三四五六七八九', FW = '０１２３４５６７８９';
const SETC = ['#f43f5e', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'];
const decode = s => s.split('').map(ch => CODE[ch] || 0);
const $ = id => document.getElementById(id);
let stars = TB.store.get('xqp:stars', {});   // id → 1..3
let P = null;   // 目前題目 {si, pi, id, daily, n, board, side, line, left, plies:[], mistakes, hinted, solved, failed}
let sel = -1, targets = [], hint = 0, busy = false, anim = null, drag = null, showing = false;

// ---------------- 目錄 ----------------
const total = XQP.reduce((a, s) => a + s.list.length, 0);
function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function dailyPick() {
  const k = todayKey(); let h = 2166136261; for (const ch of k) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  // 週一到週日難度慢慢升高
  const dow = (new Date().getDay() + 6) % 7, si = Math.min(4, [0, 1, 1, 2, 2, 3, 4][dow]);
  return { si, pi: h % XQP[si].list.length };
}
function unlocked(si) { if (si === 0) return true; const prev = XQP[si - 1]; const done = prev.list.filter((_, i) => stars[(si - 1) + '-' + i]).length; return done >= Math.min(6, prev.list.length); }
function renderMenu() {
  const done = Object.keys(stars).length, st = Object.values(stars).reduce((a, b) => a + b, 0);
  const dp = dailyPick(), dd = TB.store.get('xqp:daily', {}), streak = TB.store.get('xqp:streak', { n: 0, last: '' });
  const dDone = !!dd[todayKey()];
  let h = `<div class="hero"><div class="intro"><h2>象棋殘局</h2><p>紅方先走，在限定步數內把黑將將死。二步以上的題目每一步都必須「將軍」，是象棋排局最經典的連將殺。</p>
    <div class="prog">完成 ${done} / ${total} 題 · ★ ${st} / ${total * 3}</div><div class="bar"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div></div>
    <button class="daily" id="daily"><span class="tag">每日一題 · ${todayKey().slice(5).replace('-', '/')}</span><b>${XQP[dp.si].name} 第 ${dp.pi + 1} 題</b>
    <span>${dDone ? '<span class="ok">✓ 今天已解開</span>' : '每天換一題，週一簡單、週末最難'}</span><span>連續解題：${streak.n} 天</span></button></div>`;
  XQP.forEach((s, si) => {
    const c = SETC[si], ok = unlocked(si), n = s.list.filter((_, i) => stars[si + '-' + i]).length;
    h += `<div class="set" style="--c:${c}"><h3>${s.name}</h3><span class="d">${s.desc}</span><span class="cnt">${n} / ${s.list.length}</span></div>`;
    if (!ok) h += `<div class="lockmsg">🔒 先解開「${XQP[si - 1].name}」6 題就能挑戰</div>`;
    h += `<div class="tiles" style="--c:${c}">`;
    s.list.forEach((_, pi) => {
      const v = stars[si + '-' + pi] || 0;
      h += `<button class="tile${v ? ' done' : ''}${ok ? '' : ' lock'}" data-s="${si}" data-p="${pi}"${ok ? '' : ' disabled'}><b>${pi + 1}</b><s class="${v ? 'on' : ''}">${'★'.repeat(v)}${'☆'.repeat(3 - v)}</s></button>`;
    });
    h += '</div>';
  });
  $('mwrap').innerHTML = h;
  $('daily').onclick = () => start(dp.si, dp.pi, true);
  $('mwrap').querySelectorAll('.tile:not(.lock)').forEach(b => b.onclick = () => start(+b.dataset.s, +b.dataset.p));
}
function showMenu() {
  document.body.classList.remove('playing'); $('bMenu').hidden = true; $('back').hidden = false;
  if (busy) { AI.kill(); busy = false; }
  P = null; renderMenu(); TB.store.del('xqp:cur');
}

// ---------------- 解題 ----------------
function start(si, pi, daily) {
  const [b, line] = XQP[si].list[pi];
  P = { si, pi, id: si + '-' + pi, daily: !!daily, n: XQP[si].n, start: decode(b), line, mistakes: 0, hinted: false };
  TB.store.set('xqp:cur', { si, pi, daily: !!daily });
  document.body.classList.add('playing'); $('bMenu').hidden = false; $('back').hidden = true;
  reset(); layout();
}
function reset() {
  if (busy) { AI.kill(); busy = false; }
  P.board = P.start.slice(); P.side = 0; P.left = P.n; P.plies = []; P.solved = false; P.failed = false;
  sel = -1; targets = []; hint = 0; anim = null; showing = false;
  setMsg(P.n === 1 ? '找出一步將死的棋。' : '每一步都要將軍，' + P.n + ' 步內將死黑將。');
  render();
}
function setMsg(t, cls) { const m = $('msg'); m.innerHTML = t; m.className = 'card msg' + (cls ? ' ' + cls : ''); }
function notation(b, m) {
  const from = m >> 7, to = m & 127, p = b[from], t = p & 7, red = p < 8;
  const fr = (from / 9) | 0, fc = from % 9, tr = (to / 9) | 0, tc = to % 9;
  const num = n => red ? CN[n] : FW[n], file = c => red ? 9 - c : c + 1;
  let head; const same = []; for (let r = 0; r < 10; r++) if (b[r * 9 + fc] === p) same.push(r);
  if (same.length >= 2) { const ord = red ? same.slice().sort((a, c) => a - c) : same.slice().sort((a, c) => c - a); const i = ord.indexOf(fr); head = (ord.length === 2 ? ['前', '後'][i] : ['前', '中', '後'][i] || CN[i + 1]) + NAMES[p]; }
  else head = NAMES[p] + num(file(fc));
  const fwd = red ? tr < fr : tr > fr;
  if (tr === fr) return head + '平' + num(file(tc));
  return head + (fwd ? '進' : '退') + ((t === X.N || t === X.B || t === X.A) ? num(file(tc)) : num(Math.abs(tr - fr)));
}
function doMove(m, quiet) {
  const from = m >> 7, to = m & 127, cap = P.board[to];
  P.plies.push({ m, txt: notation(P.board, m) });
  if (!quiet) { anim = { p: P.board[from], from, to, cap, t0: performance.now() }; TB.sfx(cap ? 'capture' : 'place'); }
  P.board[to] = P.board[from]; P.board[from] = 0; P.side ^= 1;
}
function blackHasMoves() { X.init(P.board, 1); return X.legal().length > 0; }
function playerMove(m) {
  X.init(P.board, 0); X.make(m); const chk = X.inCheck(1); X.unmake();
  if (!chk) { // 不是將軍：不算數，退回
    P.mistakes++; TB.sfx('bad');
    setMsg(P.n === 1 ? '這步沒有將軍，一步殺一定要將軍喔。' : '這一題每一步都要將軍！再想想。', 'bad');
    sel = -1; targets = []; render(); return;
  }
  hint = 0; sel = -1; targets = [];
  doMove(m); P.left--; render(); loop();
  if (!blackHasMoves()) { setTimeout(solved, 420); return; }
  TB.sfx('check');
  if (P.left <= 0) { setTimeout(() => fail('將軍了，可是黑將還能逃。'), 420); return; }
  busy = true; setMsg('黑方應將中<span class="think"></span>');
  const plen = P.plies.length;
  AI.ask({ cmd: 'defend', board: P.board.slice(), side: 1, n: P.left }).then(res => {
    setTimeout(() => {
      busy = false;
      if (!P || P.plies.length !== plen) return;
      if (res.len > P.left) { doMove(res.move); render(); loop(); setTimeout(() => fail('黑方走「' + P.plies[P.plies.length - 1].txt + '」就解圍了。'), 300); return; }
      doMove(res.move); render(); loop();
      setMsg('黑方走「' + P.plies[P.plies.length - 1].txt + '」。還剩 ' + P.left + ' 步，繼續將軍！');
    }, 350);
  }).catch(() => { busy = false; render(); });
}
function solved() {
  P.solved = true;
  const s = P.hinted ? 1 : P.mistakes ? 2 : 3;
  const old = stars[P.id] || 0; if (s > old) { stars[P.id] = s; TB.store.set('xqp:stars', stars); }
  TB.bump('xq-puzzle', 'played'); TB.bump('xq-puzzle', 'won');
  let extra = '';
  if (P.daily) {
    const k = todayKey(), dd = TB.store.get('xqp:daily', {});
    if (!dd[k]) {
      dd[k] = s; TB.store.set('xqp:daily', dd);
      const st = TB.store.get('xqp:streak', { n: 0, last: '' });
      const y = new Date(Date.now() - 864e5), yk = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
      st.n = st.last === yk ? st.n + 1 : 1; st.last = k; TB.store.set('xqp:streak', st);
      extra = '<p>每日一題完成！連續 ' + st.n + ' 天。</p>';
    }
  }
  const line = P.plies.map((x, i) => (i % 2 ? '' : (i / 2 + 1) + '. ') + x.txt).join('　');
  setMsg('殺！' + '★'.repeat(s) + '☆'.repeat(3 - s), 'good'); render();
  TB.sfx('win');
  TB.dialog({ title: '將死了！', html: '<p style="font-size:28px;color:#f59e0b;margin:4px 0">' + '★'.repeat(s) + '<span style="color:#e5e7eb">' + '★'.repeat(3 - s) + '</span></p><p>' + line + '</p>' + extra +
    (s < 3 ? '<p style="font-size:13px">' + (P.hinted ? '用了提示只拿 1 顆星。' : '走錯 ' + P.mistakes + ' 次，拿 2 顆星。') + '不看提示、不走錯就有 3 顆星。</p>' : ''),
    buttons: [{ label: '看棋盤', value: 0 }, { label: nextLabel(), primary: true, value: 1 }] }).then(v => { if (v === 1) next(); });
}
function fail(why) {
  P.failed = true; P.mistakes++; TB.sfx('lose');
  setMsg(why + ' 按「重來」再試一次。', 'bad'); render();
}
function nextLabel() { return P && P.daily ? '回題目列表' : '下一題'; }
function next() {
  if (!P || P.daily) { showMenu(); return; }
  let si = P.si, pi = P.pi + 1;
  if (pi >= XQP[si].list.length) { si++; pi = 0; }
  if (si >= XQP.length || !unlocked(si)) { showMenu(); TB.toast(si >= XQP.length ? '全部題目都看過了！' : '再多解幾題就能開下一組'); return; }
  start(si, pi);
}
function showSolution() {
  if (busy || showing) return;
  P.hinted = true; reset(); P.hinted = true; showing = true;
  setMsg('解答示範中…'); render();
  let i = 0;
  const stepFn = () => {
    if (!P || !showing) return;
    if (i >= P.line.length) { showing = false; setMsg('這就是解法。按「重來」自己走一次（用過提示只拿 1 顆星）。'); render(); return; }
    doMove(P.line[i]); if (i % 2 === 0) { P.left--; TB.sfx('check'); }
    i++; render(); loop();
    setMsg('解答：' + P.plies.map(x => x.txt).join('、'));
    setTimeout(stepFn, 1100);
  };
  setTimeout(stepFn, 500);
}
function doHint() {
  if (busy || showing || P.solved || P.failed || P.side !== 0) return;
  P.hinted = true; busy = true; render();
  const plen = P.plies.length;
  AI.ask({ cmd: 'mate', board: P.board.slice(), side: 0, n: P.left }).then(r => {
    busy = false; if (!P || P.plies.length !== plen) return;
    if (r.moves && r.moves.length) { hint = r.moves[0]; setMsg('提示：' + notation(P.board, hint) + '（用了提示只拿 1 顆星）'); TB.sfx('select'); }
    render();
  }).catch(() => { busy = false; render(); });
}

// ---------------- 畫面 ----------------
const cv = $('cv'), g = cv.getContext('2d'), play = $('play');
let U = 40, DPR = 1, OX = 0, OY = 0;
function layout() {
  if (!P) return;
  const W = play.clientWidth, H = play.clientHeight;
  const narrow = W < 720 || W < H * 1.05;
  document.body.classList.toggle('narrow', narrow);
  let aw, ah;
  if (narrow) {
    const used = $('pzT').closest('.card').offsetHeight + $('msg').offsetHeight + document.querySelector('.acts').offsetHeight + 16 + 24;
    aw = W - 16; ah = H - used;
  } else { aw = W - 24 - 290 - 20; ah = H - 24; }
  U = Math.max(18, Math.floor(Math.min(aw / 10, ah / 11)));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = U * 10 + 'px'; cv.style.height = U * 11 + 'px';
  cv.width = Math.round(U * 10 * DPR); cv.height = Math.round(U * 11 * DPR);
  OX = U; OY = U; draw();
}
const sq2xy = sq => [OX + (sq % 9) * U, OY + ((sq / 9) | 0) * U];
function xy2sq(x, y) {
  const c = Math.round((x - OX) / U), r = Math.round((y - OY) / U);
  if (c < 0 || c > 8 || r < 0 || r > 9) return -1;
  const dx = x - (OX + c * U), dy = y - (OY + r * U);

function canTouch() { return P && !P.solved && !P.failed && !busy && !anim && !showing && P.side === 0; }
