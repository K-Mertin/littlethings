<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>圍棋死活 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#14b8a6;--accent-ink:#0f766e;--accent-soft:#f0fdfa}
.tb-btn.primary{box-shadow:0 4px 12px rgba(20,184,166,.35)}
/* 目錄 */
#menu{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.mwrap{max-width:1040px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch;margin-bottom:22px}
.hero .intro{flex:1 1 320px;background:linear-gradient(120deg,#ccfbf1,#fef3c7);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:.06em;color:#0f766e}
.hero p{margin:8px 0 0;color:var(--mute);font-size:15px;max-width:46ch}
.prog{margin-top:14px;font-size:13px;font-weight:700;color:#0f766e}
.bar{height:8px;border-radius:99px;background:#fff;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#14b8a6,#f59e0b);border-radius:99px}
.daily{flex:0 1 300px;min-width:240px;background:var(--panel);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;text-align:left;font:inherit;color:inherit}
.daily:hover{transform:translateY(-3px);border-color:#5eead4}
.daily .tag{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,#14b8a6,#f59e0b);border-radius:99px;padding:2px 10px}
.daily b{font-size:20px;font-weight:900}
.daily span{font-size:13px;color:var(--mute)}
.daily .ok{color:#10b981;font-weight:700}
.set{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.set h3{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.set h3::before{content:"";width:8px;height:22px;border-radius:4px;background:var(--c,#14b8a6)}
.set .d{color:var(--mute);font-size:13px}
.set .cnt{margin-left:auto;font-size:13px;font-weight:700;color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.tile{appearance:none;border:0;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile b{font-size:20px;font-weight:900;line-height:1}
.tile s{text-decoration:none;font-size:12px;letter-spacing:1px;color:#e5e7eb}
.tile s.on{color:#f59e0b}
.tile.done{background:color-mix(in srgb,var(--c) 10%,#fff)}
.tile.done b{color:var(--c)}
.tile.lock{opacity:.4;cursor:default;transform:none}
.lockmsg{font-size:13px;color:var(--mute);margin:-2px 0 8px}
/* 解題畫面 */
#play{flex:1;min-height:0;display:none;align-items:center;justify-content:center;gap:20px;padding:12px;position:relative}
body.playing #menu{display:none}
body.playing #play{display:flex}
#cv{display:block;touch-action:none;border-radius:20px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(180,120,30,.22);flex:none}
.side{width:290px;flex:none;display:flex;flex-direction:column;gap:12px;align-self:center}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.pz-t{font-size:13px;font-weight:700;color:#0f766e;letter-spacing:.06em}
.pz-h{font-size:22px;font-weight:900;margin:2px 0 4px}
.pz-g{font-size:14px;color:var(--mute)}
.pz-left{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pz-left i{width:26px;height:26px;border-radius:50%;background:#ffe4e6;color:#0f766e;font-style:normal;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.pz-left i.used{background:#14b8a6;color:#fff}
.msg{font-size:15px;font-weight:500;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
.msg.good{color:#059669}.msg.bad{color:#0f766e}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .tb-btn{min-height:44px}
.acts .wide{grid-column:1/-1}
body.narrow #play{flex-direction:column;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:center}
body.narrow .side{width:100%;max-width:560px;gap:6px;display:contents}
body.narrow .card.info{order:0;width:100%;max-width:560px;padding:8px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body.narrow .pz-h{font-size:17px;margin:0}
body.narrow .pz-g{font-size:12px;flex-basis:100%}
body.narrow .pz-left{margin:0 0 0 auto}
body.narrow .pz-left i{width:22px;height:22px;font-size:12px}
body.narrow #cv{order:1}
body.narrow .msg{order:2;min-height:28px;font-size:14px;width:100%;max-width:560px;padding:4px 10px;border-radius:12px}
body.narrow .acts{order:3;width:100%;max-width:560px;grid-template-columns:repeat(4,1fr);gap:6px}
body.narrow .acts .wide{grid-column:auto}
body.narrow .acts .tb-btn{min-height:40px;padding:6px 4px;font-size:13px}
.think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#14b8a6;margin-left:6px;animation:xqp 1s infinite}
@keyframes xqp{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-height:520px){
  body:not(.narrow) .side{gap:8px;max-height:100%}
  body:not(.narrow) .card{padding:8px 12px;border-radius:14px}
  body:not(.narrow) .pz-h{font-size:18px;margin:0}
  body:not(.narrow) .pz-left{margin-top:4px}
  body:not(.narrow) .pz-left i{width:22px;height:22px}
  body:not(.narrow) .msg{min-height:0;font-size:13px}
  body:not(.narrow) .acts .tb-btn{min-height:36px;padding:5px 8px}
}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}}
.goalc{display:inline-flex;align-items:center;gap:6px}
.goalc i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #e11d48;box-sizing:border-box}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html" id="back">← 棋牌</a>
  <h1 class="tb-title">圍棋死活</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bMenu" hidden>題目列表</button>
  <button class="tb-btn" id="bRule">玩法</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<div id="menu"><div class="mwrap" id="mwrap"></div></div>
<main id="play">
  <canvas id="cv" aria-label="死活題棋盤"></canvas>
  <div class="side">
    <div class="card info"><div class="pz-t" id="pzT"></div><div class="pz-h" id="pzH"></div><div class="pz-g" id="pzG"></div><div class="pz-left" id="pzL"></div></div>
    <div class="card msg" id="msg"></div>
    <div class="acts">
      <button class="tb-btn" id="bRetry">重來</button>
      <button class="tb-btn" id="bHint">提示</button>
      <button class="tb-btn" id="bSol">看解答</button>
      <button class="tb-btn primary" id="bNext">下一題</button>
    </div>
  </div>
</main>
<script src="common.js"></script>
<script src="go-puzzles.js"></script>
<script>
'use strict';
// 圍棋死活題：題目與解答樹在 go-puzzles.js（由 tools/go-puzzle-check.mjs 驗證後產生）
const N = 9, COLS = 'ABCDEFGHJ';
const SETC = ['#14b8a6', '#3b82f6', '#8b5cf6', '#f43f5e'];
const GOALTXT = { capture: '吃掉白棋', save: '救出黑棋', kill: '殺死白棋', live: '讓黑棋活', };
const $ = id => document.getElementById(id);
let stars = TB.store.get('gop:stars', {});
let P = null, hint = -1, busy = false, anim = null, showing = false, timer = 0;

// ---------------- 規則 ----------------
const NB = []; for (let p = 0; p < 81; p++) { const r = (p / N) | 0, c = p % N, a = []; if (r) a.push(p - N); if (r < N - 1) a.push(p + N); if (c) a.push(p - 1); if (c < N - 1) a.push(p + 1); NB.push(a); }
function group(b, p) { const col = b[p], st = [p], seen = new Set([p]); let libs = 0; const L = new Set(); while (st.length) { const q = st.pop(); for (const n of NB[q]) { if (!b[n]) L.add(n); else if (b[n] === col && !seen.has(n)) { seen.add(n); st.push(n); } } } return { stones: [...seen], libs: L.size }; }
function play(b, ko, p, col) {
  if (p < 0) return { b: b.slice(), ko: -1, caps: [] };
  if (b[p] || p === ko) return null;
  const nb = b.slice(); nb[p] = col; const caps = [];
  for (const n of NB[p]) if (nb[n] === 3 - col) { const g = group(nb, n); if (!g.libs) for (const s of g.stones) { nb[s] = 0; caps.push(s); } }
  const me = group(nb, p); if (!me.libs) return null;
  return { b: nb, ko: caps.length === 1 && me.stones.length === 1 && me.libs === 1 ? caps[0] : -1, caps };
}
const name = p => COLS[p % N] + (N - ((p / N) | 0));

// ---------------- 目錄 ----------------
const total = GOP.reduce((a, s) => a + s.list.length, 0);
const dkey = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function todayKey() { return dkey(new Date()); }
function dailyPick() {
  const k = todayKey(); let h = 2166136261; for (const ch of k) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const dow = (new Date().getDay() + 6) % 7, si = [0, 0, 1, 1, 2, 2, 3][dow];   // 週一最簡單、週末最難
  return { si, pi: h % GOP[si].list.length };
}
function unlocked(si) { if (si === 0) return true; const prev = GOP[si - 1]; return prev.list.filter((_, i) => stars[(si - 1) + '-' + i]).length >= Math.min(6, prev.list.length); }
function renderMenu() {
  const done = Object.keys(stars).length, st = Object.values(stars).reduce((a, b) => a + b, 0);
  const dp = dailyPick(), dd = TB.store.get('gop:daily', {}), streak = TB.store.get('gop:streak', { n: 0, last: '' });
  const dDone = !!dd[todayKey()];
  let h = `<div class="hero"><div class="intro"><h2>圍棋死活</h2><p>一律黑先。吃掉白棋、救出黑棋、點眼殺棋、做眼活棋——白棋會自動應對，想好再下。</p>
    <div class="prog">完成 ${done} / ${total} 題 · ★ ${st} / ${total * 3}</div><div class="bar"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div></div>
    <button class="daily" id="daily"><span class="tag">每日一題 · ${todayKey().slice(5).replace('-', '/')}</span><b>${GOP[dp.si].name} 第 ${dp.pi + 1} 題</b>
    <span>${dDone ? '<span class="ok">✓ 今天已解開</span>' : '每天換一題，週一簡單、週末最難'}</span><span>連續解題：${streak.n} 天</span></button></div>`;
  GOP.forEach((s, si) => {
    const c = SETC[si], ok = unlocked(si), n = s.list.filter((_, i) => stars[si + '-' + i]).length;
    h += `<div class="set" style="--c:${c}"><h3>${s.name}</h3><span class="d">${s.desc}</span><span class="cnt">${n} / ${s.list.length}</span></div>`;
    if (!ok) h += `<div class="lockmsg">🔒 先解開「${GOP[si - 1].name}」6 題就能挑戰</div>`;
    h += `<div class="tiles" style="--c:${c}">`;
    s.list.forEach((_, pi) => {
      const v = stars[si + '-' + pi] || 0;
      h += `<button class="tile${v ? ' done' : ''}${ok ? '' : ' lock'}" data-s="${si}" data-p="${pi}"${ok ? '' : ' disabled'}><b>${pi + 1}</b><s class="${v ? 'on' : ''}">${'★'.repeat(v)}${'☆'.repeat(3 - v)}</s></button>`;
    });
    h += '</div>';
  });
  $('mwrap').innerHTML = h;
  $('daily').onclick = () => start(dp.si, dp.pi, true);
  $('mwrap').querySelectorAll('.tile:not(.lock)').forEach(b => b.onclick = () => start(+b.dataset.s, +b.dataset.p));
}
function showMenu() {
  clearTimeout(timer); document.body.classList.remove('playing'); $('bMenu').hidden = true; $('back').hidden = false;
  P = null; busy = false; showing = false; renderMenu(); TB.store.del('gop:cur');
}

// ---------------- 解題 ----------------
function start(si, pi, daily) {
  const z = GOP[si].list[pi];
  P = { si, pi, id: si + '-' + pi, daily: !!daily, z, start: [...z.b].map(Number), mistakes: 0, hinted: false };
  TB.store.set('gop:cur', { si, pi, daily: !!daily });
  document.body.classList.add('playing'); $('bMenu').hidden = false; $('back').hidden = true;
  reset(); layout();
}
function reset() {
  clearTimeout(timer);
  P.b = P.start.slice(); P.ko = -1; P.node = P.z.tr; P.used = 0; P.solved = false; P.failed = false; P.last = -1; P.hist = [];
  hint = -1; busy = false; anim = null; showing = false;
  setMsg(intro()); render();
}
function intro() { const z = P.z; return '黑先 · ' + GOALTXT[z.g] + (z.k > 1 ? '（' + z.k + ' 手內）' : '') + '。'; }
function setMsg(t, cls) { const m = $('msg'); m.innerHTML = t; m.className = 'card msg' + (cls ? ' ' + cls : ''); }
function put(p, col) {
  const r = play(P.b, P.ko, p, col); if (!r) return false;
  P.b = r.b; P.ko = r.ko; P.last = p; P.hist.push(p);
  if (p >= 0) { anim = { p, t0: performance.now(), caps: r.caps }; TB.sfx(r.caps.length ? 'capture' : 'place'); loop(); }
  return true;
}
const FAILTXT = { capture: '白棋逃出去了。', kill: '白棋做出兩隻眼，活了。', live: '黑棋做不出兩隻眼，被殺了。', save: '黑棋還是被吃掉了。' };
function playerMove(p) {
  const node = P.node, ok = node.ok[p];
  if (ok) {
    put(p, 1); P.used++; hint = -1;
    if (ok.end) { render(); timer = setTimeout(solved, 450); return; }
    busy = true; setMsg('白棋應對中<span class="think"></span>'); render();
    timer = setTimeout(() => {
      busy = false; if (!P) return;
      if (ok.r === -1) { P.hist.push(-1); setMsg('白棋放棄應對（脫先）。繼續！'); }
      else { put(ok.r, 2); setMsg('白棋下在 ' + name(ok.r) + '。繼續！'); }
      if (ok.end) { render(); timer = setTimeout(solved, 450); return; }
      P.node = ok.n; render();
    }, 500);
    return;
  }
  if (!play(P.b, P.ko, p, 1)) { TB.sfx('bad'); TB.toast('這裡不能下（沒有氣或是打劫）'); return; }
  P.mistakes++; TB.sfx('bad');
  if (node.bad[p] != null) {
    put(p, 1); busy = true; render();
    const rep = node.bad[p];
    timer = setTimeout(() => {
      busy = false; if (!P) return;
      if (rep >= 0) put(rep, 2);
      P.failed = true; TB.sfx('lose');
      setMsg((rep >= 0 ? '白棋下 ' + name(rep) + '，' : '') + FAILTXT[P.z.g] + ' 按「重來」再試一次。', 'bad'); render();
    }, 500);
  } else {
    setMsg('這手幫不上忙，再想想。<br><span style="font-size:13px;color:var(--mute)">提示：' + P.z.h + '</span>', 'bad'); render();
  }
}
function solved() {
  if (!P) return;
  P.solved = true;
  const s = P.hinted ? 1 : P.mistakes ? 2 : 3;
  const old = stars[P.id] || 0; if (s > old) { stars[P.id] = s; TB.store.set('gop:stars', stars); }
  TB.bump('go-puzzle', 'played'); TB.bump('go-puzzle', 'won');
  let extra = '';
  if (P.daily) {
    const k = todayKey(), dd = TB.store.get('gop:daily', {});
    if (!dd[k]) {
      dd[k] = s; TB.store.set('gop:daily', dd);
      const st = TB.store.get('gop:streak', { n: 0, last: '' }), yk = dkey(new Date(Date.now() - 864e5));
      st.n = st.last === yk ? st.n + 1 : 1; st.last = k; TB.store.set('gop:streak', st);
      extra = '<p>每日一題完成！連續 ' + st.n + ' 天。</p>';
    }
  }
  const DONE = { capture: '吃掉了！', save: '逃出來了！', kill: '殺死了！', live: '活了！' };
  setMsg(DONE[P.z.g] + ' ' + '★'.repeat(s) + '☆'.repeat(3 - s), 'good'); render(); TB.sfx('win');
  TB.dialog({ title: DONE[P.z.g], html: '<p style="font-size:28px;color:#f59e0b;margin:4px 0">' + '★'.repeat(s) + '<span style="color:#e5e7eb">' + '★'.repeat(3 - s) + '</span></p><p>' + P.hist.map(p => p < 0 ? '脫先' : name(p)).join(' → ') + '</p>' + extra +
    (s < 3 ? '<p style="font-size:13px">' + (P.hinted ? '用了提示只拿 1 顆星。' : '下錯 ' + P.mistakes + ' 次，拿 2 顆星。') + '不看提示、不下錯就有 3 顆星。</p>' : ''),
    buttons: [{ label: '看棋盤', value: 0 }, { label: nextLabel(), primary: true, value: 1 }] }).then(v => { if (v === 1) next(); });
}
function nextLabel() { return P && P.daily ? '回題目列表' : '下一題'; }
function next() {
  if (!P || P.daily) { showMenu(); return; }
  let si = P.si, pi = P.pi + 1;
  if (pi >= GOP[si].list.length) { si++; pi = 0; }
  if (si >= GOP.length || !unlocked(si)) { showMenu(); TB.toast(si >= GOP.length ? '全部題目都看過了！' : '再多解幾題就能開下一組'); return; }
  start(si, pi);
}
function showSolution() {
  if (busy || showing || !P) return;
  const h = P.mistakes; reset(); P.hinted = true; P.mistakes = h; showing = true;
  setMsg('解答示範中…'); render();
  let node = P.z.tr;
  const step = () => {
    if (!P || !showing) return;
    const m = +Object.keys(node.ok)[0], v = node.ok[m];
    put(m, 1); render();
    timer = setTimeout(() => {
      if (!P || !showing) return;
      if (v.r != null) { if (v.r >= 0) put(v.r, 2); else P.hist.push(-1); }
      render();
      if (v.n) { node = v.n; timer = setTimeout(step, 800); }
      else { showing = false; setMsg('解答：' + P.hist.map(p => p < 0 ? '脫先' : name(p)).join(' → ') + '。按「重來」自己下一次（用過提示只拿 1 顆星）。'); render(); }
    }, 800);
  };
  timer = setTimeout(step, 500);
}
function doHint() {
  if (!P || busy || showing || P.solved || P.failed) return;
  P.hinted = true; hint = +Object.keys(P.node.ok)[0];
  setMsg('提示：' + P.z.h + '<br><span style="font-size:13px;color:var(--mute)">（藍圈是正解的位置，用了提示只拿 1 顆星）</span>'); TB.sfx('select'); render();
}

// ---------------- 畫面 ----------------
const cv = $('cv'), g = cv.getContext('2d'), play_ = $('play');
let U = 40, DPR = 1, OX = 0, OY = 0;
function view() { const [r1, c0, c1] = P.z.v; return { r0: 0, r1, c0, c1, rows: r1 + 1, cols: c1 - c0 + 1 }; }
function layout() {
  if (!P) return;
  const W = play_.clientWidth, H = play_.clientHeight, v = view();
  const narrow = W < 720 || W < H * 1.05;
  document.body.classList.toggle('narrow', narrow);
  let aw, ah;
  if (narrow) {
    const used = $('pzT').closest('.card').offsetHeight + $('msg').offsetHeight + document.querySelector('.acts').offsetHeight + 16 + 24;
    aw = W - 16; ah = H - used;
  } else { aw = W - 24 - 290 - 20; ah = H - 24; }
  U = Math.max(22, Math.floor(Math.min(aw / (v.cols + 0.9), ah / (v.rows + 0.9), 104)));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.round(U * (v.cols + 0.9)), h = Math.round(U * (v.rows + 0.9));
  cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  OX = U * 0.95 - v.c0 * U; OY = U * 0.95;
  draw();
}
const pxy = p => [OX + (p % N) * U, OY + ((p / N) | 0) * U];
function xy2p(x, y) {
  const v = view(), c = Math.round((x - OX) / U), r = Math.round((y - OY) / U);
  if (c < v.c0 || c > v.c1 || r < 0 || r > v.r1) return -1;
  const dx = x - (OX + c * U), dy = y - (OY + r * U); if (dx * dx + dy * dy > (U * 0.5) ** 2) return -1;
  return r * N + c;
}
function stone(x, y, col, alpha) {
  const r = U * 0.47;
  g.save(); if (alpha != null) g.globalAlpha = alpha;
  g.shadowColor = 'rgba(120,72,10,.32)'; g.shadowBlur = r * 0.3; g.shadowOffsetY = r * 0.14;
  g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fillStyle = col === 1 ? '#111827' : '#e5e7eb'; g.fill(); g.shadowColor = 'transparent';
  const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.08, x, y, r);
  if (col === 1) { gr.addColorStop(0, '#525c6b'); gr.addColorStop(0.4, '#1f2937'); gr.addColorStop(1, '#0b1220'); }
  else { gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.7, '#f8fafc'); gr.addColorStop(1, '#dbe1ea'); }
  g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fillStyle = gr; g.fill();
  g.restore();
}
function draw() {
  if (!P) return;
  const v = view(), w = cv.width / DPR, h = cv.height / DPR;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, '#fdebbd'); gr.addColorStop(1, '#f8d993');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  // 格線：沒到棋盤邊的那幾側畫長一點，表示棋盤還有延伸
  const ext = U * 0.45;
  g.strokeStyle = 'rgba(161,98,7,.8)'; g.lineWidth = Math.max(1, U * 0.03); g.beginPath();
  for (let r = 0; r <= v.r1; r++) { const y = OY + r * U; g.moveTo(OX + v.c0 * U - (v.c0 > 0 ? ext : 0), y); g.lineTo(OX + v.c1 * U + (v.c1 < 8 ? ext : 0), y); }
  for (let c = v.c0; c <= v.c1; c++) { const x = OX + c * U; g.moveTo(x, OY); g.lineTo(x, OY + v.r1 * U + (v.r1 < 8 ? ext : 0)); }
  g.stroke();
  // 棋盤邊（粗線）
  g.lineWidth = Math.max(2, U * 0.06); g.beginPath();
  g.moveTo(OX + v.c0 * U - (v.c0 > 0 ? ext : 0), OY); g.lineTo(OX + v.c1 * U + (v.c1 < 8 ? ext : 0), OY);
  if (v.c0 === 0) { g.moveTo(OX, OY); g.lineTo(OX, OY + v.r1 * U + (v.r1 < 8 ? ext : 0)); }
  if (v.c1 === 8) { g.moveTo(OX + 8 * U, OY); g.lineTo(OX + 8 * U, OY + v.r1 * U + (v.r1 < 8 ? ext : 0)); }
  g.stroke();
  g.fillStyle = 'rgba(161,98,7,.85)';
  for (const [r, c] of [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]]) if (r <= v.r1 && c >= v.c0 && c <= v.c1) { g.beginPath(); g.arc(OX + c * U, OY + r * U, U * 0.08, 0, 7); g.fill(); }
  const ap = anim ? Math.min(1, (performance.now() - anim.t0) / 220) : 1;
  for (let p = 0; p < 81; p++) {
    if (!P.b[p]) continue;
    const [x, y] = pxy(p);
    if (anim && anim.p === p) { const s = 1.25 - 0.25 * ap; g.save(); g.translate(x, y); g.scale(s, s); g.translate(-x, -y); stone(x, y, P.b[p], 0.4 + 0.6 * ap); g.restore(); }
    else stone(x, y, P.b[p]);
  }
  if (anim) for (const p of anim.caps) { const [x, y] = pxy(p); stone(x, y, P.b[anim.p] === 1 ? 2 : 1, 1 - ap); }
  // 目標棋子：紅色小圈
  if (P.b[P.z.t]) { const [x, y] = pxy(P.z.t); g.beginPath(); g.arc(x, y, U * 0.17, 0, 7); g.lineWidth = U * 0.06; g.strokeStyle = '#e11d48'; g.stroke(); }
  // 最後一手
  if (P.last >= 0 && P.b[P.last] && P.last !== P.z.t) { const [x, y] = pxy(P.last); g.beginPath(); g.arc(x, y, U * 0.12, 0, 7); g.fillStyle = '#14b8a6'; g.fill(); }
  if (hint >= 0) { const [x, y] = pxy(hint); g.beginPath(); g.arc(x, y, U * 0.42, 0, 7); g.lineWidth = U * 0.08; g.strokeStyle = 'rgba(59,130,246,.9)'; g.stroke(); }
  if (anim && ap >= 1) anim = null;
}
function loop() { draw(); if (anim) requestAnimationFrame(loop); }
function render() {
  if (!P) return;
  const s = GOP[P.si];
  $('pzT').textContent = P.daily ? '每日一題 · ' + todayKey() : s.name;
  $('pzH').textContent = (P.daily ? s.name + ' ' : '第 ') + (P.pi + 1) + (P.daily ? '' : ' 題') + '　' + (stars[P.id] ? '★'.repeat(stars[P.id]) : '');
  $('pzG').innerHTML = '<span class="goalc">黑先 · ' + GOALTXT[P.z.g] + '<i title="目標棋子"></i></span>';
  let l = ''; for (let i = 0; i < P.z.k; i++) l += '<i class="' + (i < P.used ? 'used' : '') + '">' + (i + 1) + '</i>';
  $('pzL').innerHTML = l;
  $('bHint').disabled = busy || showing || P.solved || P.failed;
  $('bSol').disabled = busy || showing;
  $('bNext').textContent = nextLabel();
  draw();
}

// ---------------- 操作 ----------------
function canTouch() { return P && !P.solved && !P.failed && !busy && !anim && !showing; }
cv.addEventListener('pointerdown', e => {
  if (!P) return;
  if (P.failed) { TB.toast('按「重來」再試一次'); return; }
  if (!canTouch()) return;
  const r = cv.getBoundingClientRect(), p = xy2p(e.clientX - r.left, e.clientY - r.top);
  if (p < 0) return;
  if (P.b[p]) { TB.sfx('bad'); return; }
  playerMove(p);
});
$('bRetry').onclick = () => { if (!P) return; TB.sfx('click'); const h = P.hinted, m = P.mistakes; reset(); P.hinted = h; P.mistakes = m; };
$('bHint').onclick = doHint;
$('bSol').onclick = showSolution;
$('bNext').onclick = next;
$('bMenu').onclick = showMenu;
$('bRule').onclick = () => TB.dialog({ title: '死活題玩法', html: `<div class="tb-rules">
  <h4>目標</h4><p>每一題都是黑先。題目上方會寫要做什麼，紅色小圈標的是目標棋子：</p>
  <ul><li><b>吃掉白棋</b>：把圈起來的白棋提掉</li><li><b>救出黑棋</b>：讓圈起來的黑棋長到三口氣以上、逃出去</li><li><b>殺死白棋</b>：讓白棋做不出兩隻眼</li><li><b>讓黑棋活</b>：做出兩隻眼</li></ul>
  <p>你下一手之後，白棋會自動找最頑強的應對。下錯了，白棋會示範為什麼不行。</p>
  <h4>星星</h4><ul><li>★★★ 一次就解開</li><li>★★ 中途下錯</li><li>★ 用了提示或看了解答</li></ul>
  <h4>每日一題</h4><p>每天會從題庫挑一題，週一最簡單、週末最難。每天都解開可以累積連續天數。</p>
  <h4>解鎖</h4><p>每一組解開 6 題，就能挑戰下一組。不會下圍棋？先去 <a href="go-learn.html">圍棋教室</a>。</p>
  <p style="font-size:12px">每一題都用程式逐題驗證過：正解有效、白棋的應手合法、錯的下法會被反擊。</p></div>`, buttons: [{ label: '知道了', primary: true }] });
addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(play_);
const cur = TB.store.get('gop:cur', null);
if (cur && GOP[cur.si] && GOP[cur.si].list[cur.pi]) start(cur.si, cur.pi, cur.daily); else renderMenu();
</script>
</body>
</html>
