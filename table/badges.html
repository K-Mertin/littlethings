<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb">
<title>成就 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#f59e0b;--accent-ink:#b45309;--accent-soft:#fef3c7}
html,body{height:auto}
body{min-height:100vh;background:
  radial-gradient(600px 380px at 0% 0%,rgba(245,158,11,.14),transparent 70%),
  radial-gradient(600px 380px at 100% 0%,rgba(236,72,153,.10),transparent 70%),var(--bg)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 56px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
h1{font-weight:900;font-size:clamp(30px,6vw,46px);margin:0;line-height:1.1;display:inline-block;
  background:linear-gradient(90deg,#d97706,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.sum{display:flex;align-items:center;gap:14px;margin:14px 0 6px;flex-wrap:wrap}
.sum .n{font-size:15px;color:var(--mute)}.sum .n b{font-size:26px;color:var(--ink);font-weight:900}
.bar{flex:1;min-width:180px;height:12px;border-radius:999px;background:#fde68a55;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#f59e0b,#ec4899);transition:width .6s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 4px;margin:10px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;border:0;background:#fff;box-shadow:var(--shadow);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--mute);cursor:pointer;white-space:nowrap;min-height:40px}
.tabs button[aria-pressed=true]{background:var(--ink);color:#fff}
h2{font-size:18px;font-weight:900;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 small{font-size:13px;color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.b{appearance:none;border:0;text-align:left;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s;font:inherit;color:inherit}
.b:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.b .ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;
  background:radial-gradient(circle at 35% 30%,#fff7d6,#fcd34d 60%,#f59e0b);box-shadow:0 0 0 4px #fff,0 0 0 6px #fbbf24,0 6px 14px rgba(245,158,11,.35)}
.b .nm{font-weight:900;font-size:15px;text-align:center}
.b .ds{font-size:12px;color:var(--mute);text-align:center;line-height:1.4;min-height:2.8em}
.b .pg{width:100%;height:6px;border-radius:999px;background:#eef1f6;overflow:hidden}
.b .pg i{display:block;height:100%;background:#cbd5e1;border-radius:999px}
.b .pt{font-size:11px;color:var(--mute)}
.b.no .ic{background:#eef1f6;box-shadow:0 0 0 4px #fff,0 0 0 6px #e5e7eb;filter:grayscale(1);opacity:.55}
.b.no .nm{color:#6b7280}
.b .dt{position:absolute;top:8px;right:10px;font-size:11px;color:#b45309;font-weight:700}
.dlg-ic{font-size:56px;text-align:center;margin:4px 0 6px}
footer{margin-top:34px;color:var(--mute);font-size:12px}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.b .ic{width:56px;height:56px;font-size:28px}}
</style>
</head>
<body>
<main>
  <div class="top"><a class="tb-back" href="index.html">← 棋牌</a></div>
  <h1>成就徽章</h1>
  <div class="sum"><span class="n">已取得 <b id="got">0</b> / <span id="tot">0</span></span><div class="bar"><i id="bar" style="width:0"></i></div></div>
  <div class="tabs" id="tabs"></div>
  <div id="wall"></div>
  <footer>徽章依照這台裝置裡的戰績自動判斷，換裝置不會跟著過去。</footer>
</main>
<script src="common.js"></script>
<script src="badges.js"></script>
<script>
'use strict';
const esc = TB.esc;
let filter = TB.store.get('badges:filter', '全部');
function render() {
  const { list } = TBBadges.evaluate();
  const got = list.filter(b => b.ok).length;
  document.getElementById('got').textContent = got;
  document.getElementById('tot').textContent = list.length;
  document.getElementById('bar').style.width = (got / list.length * 100).toFixed(1) + '%';
  const groups = ['全部'].concat(TBBadges.groups);
  if (!groups.includes(filter)) filter = '全部';
  document.getElementById('tabs').innerHTML = groups.map(g => {
    const n = g === '全部' ? got : list.filter(b => b.g === g && b.ok).length, t = g === '全部' ? list.length : list.filter(b => b.g === g).length;
    return '<button data-g="' + g + '" aria-pressed="' + (g === filter) + '">' + g + ' ' + n + '/' + t + '</button>';
  }).join('');
  let h = '';
  TBBadges.groups.forEach(g => {
    if (filter !== '全部' && filter !== g) return;
    const items = list.filter(b => b.g === g);
    // 已取得的排前面
    items.sort((a, b) => (b.ok - a.ok) || ((b.cur / b.tgt) - (a.cur / a.tgt)));
    h += '<h2>' + g + ' <small>' + items.filter(b => b.ok).length + ' / ' + items.length + '</small></h2><div class="grid">' +
      items.map(b => {
        const pct = Math.min(100, b.cur / b.tgt * 100);
        return '<button class="b' + (b.ok ? '' : ' no') + '" data-id="' + b.id + '">' +
          (b.ok && b.date ? '<span class="dt">' + esc(b.date.slice(5).replace('-', '/')) + '</span>' : '') +
          '<span class="ic">' + esc(b.i) + '</span><span class="nm">' + esc(b.n) + '</span><span class="ds">' + esc(b.d) + '</span>' +
          (b.ok ? '' : (b.tgt > 1 ? '<span class="pg"><i style="width:' + pct.toFixed(0) + '%"></i></span><span class="pt">' + b.cur + ' / ' + b.tgt + '</span>' : '<span class="pt">還沒達成</span>')) +
          '</button>';
      }).join('') + '</div>';
  });
  document.getElementById('wall').innerHTML = h;
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.g; TB.store.set('badges:filter', filter); TB.sfx('click'); render();
});
document.getElementById('wall').addEventListener('click', e => {
  const el = e.target.closest('.b'); if (!el) return;
  const { list } = TBBadges.evaluate(), b = list.find(x => x.id === el.dataset.id); if (!b) return;
  TB.sfx('click');
  TB.dialog({ title: b.n, html: '<div class="dlg-ic">' + esc(b.i) + '</div><p style="text-align:center">' + esc(b.d) + '</p>' +
    (b.ok ? '<p style="text-align:center;color:#b45309;font-weight:700">🏅 ' + (b.date ? esc(b.date) + ' 取得' : '已取得') + '</p>'
          : '<p style="text-align:center">目前進度：<b>' + b.cur + ' / ' + b.tgt + '</b></p>'),
    buttons: [{ label: '好', primary: true }] });
});
render();
addEventListener('pageshow', render);
</script>
</body>
</html>
