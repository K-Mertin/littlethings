<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>象棋教室 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#f97316;--accent-ink:#c2410c;--accent-soft:#fff4ec}
.tb-btn.primary{box-shadow:0 4px 12px rgba(249,115,22,.35)}
.tb-main{display:block;padding:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#toc{overflow:auto;-webkit-overflow-scrolling:touch}
.toc-in{max-width:1000px;margin:0 auto;padding:24px 16px calc(48px + env(safe-area-inset-bottom))}
.toc-hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;background:linear-gradient(135deg,#fff4ec,#fff1f3);border-radius:24px;padding:22px}
.toc-hero h2{font-weight:900;font-size:clamp(28px,6vw,40px);letter-spacing:.04em;margin:0;background:linear-gradient(90deg,#f97316,#f43f5e);-webkit-background-clip:text;background-clip:text;color:transparent}
.toc-hero p{margin:6px 0 0;color:var(--mute);max-width:52ch}
.toc-sum{margin-left:auto;font-size:14px;font-weight:700;color:var(--accent-ink);white-space:nowrap;min-width:200px}
.toc-prog{height:10px;border-radius:99px;background:#fff;margin-top:8px;overflow:hidden;box-shadow:inset 0 0 0 1px #fed7aa}
.toc-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f97316,#f43f5e)}
.toc-ch{--cc:#f97316;margin:28px 0 12px;font-weight:900;font-size:18px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.toc-ch::before{content:"";width:10px;height:22px;border-radius:99px;background:var(--cc)}
.c0{--cc:#f97316}.c1{--cc:#f43f5e}.c2{--cc:#8b5cf6}.c3{--cc:#0ea5e9}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.lc{display:flex;gap:14px;align-items:center;text-align:left;width:100%;appearance:none;border:2px solid transparent;background:var(--panel);border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;font:inherit;color:inherit}
.lc:hover{border-color:var(--cc);transform:translateY(-2px)}
.lc .num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;background:var(--cc);color:#fff}
.lc.done .num{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--cc)}
.lc .tx{flex:1;min-width:0}
.lc b{display:block;font-size:17px}
.lc span{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.lc .stars{flex:none;font-size:16px;letter-spacing:1px;color:#f59e0b}
.lc .stars i{font-style:normal;color:#e5e7eb}
/* 上課 */
.ls{display:grid;grid-template-columns:minmax(300px,400px) 1fr;height:100%}
.pnl{display:flex;flex-direction:column;background:var(--panel);box-shadow:4px 0 24px rgba(17,24,39,.06);min-height:0;position:relative;z-index:1}
.pnl-scroll{flex:1;min-height:0;overflow:auto;padding:22px 22px 12px}
.ls-ch{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.ls-title{font-weight:900;font-size:26px;letter-spacing:.03em;margin:2px 0 10px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.dots i{width:10px;height:10px;border-radius:50%;background:#e5e7eb}
.dots i.q{border-radius:3px}
.dots i.on{background:var(--accent)}
.dots i.ok{background:var(--green)}
.ls-text{font-size:18px;line-height:1.75}
.ls-text b{color:var(--accent-ink)}
.ls-text ul{margin:6px 0;padding-left:22px}
.ls-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 12px;margin-bottom:8px}
.fb{margin-top:14px;border-radius:14px;padding:11px 15px;font-size:16px;line-height:1.6;display:none}
.fb.on{display:block;animation:tbpop .2s}
.fb.ok{background:#e7f9f1;color:#065f46;box-shadow:inset 4px 0 0 #10b981}
.fb.bad{background:#fff0f2;color:#9f1239;box-shadow:inset 4px 0 0 #f43f5e}
.fb.info{background:#eef6ff;color:#1e3a8a;box-shadow:inset 4px 0 0 #3b82f6}
.nav{flex:none;display:flex;gap:10px;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.nav .tb-btn{min-height:46px;font-size:16px;padding:8px 18px}
.nav .tb-btn.primary{flex:1}
.bwrap{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:14px}
#cv{display:block;touch-action:none;border-radius:20px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(201,139,74,.25)}
.done-card{text-align:center;padding:18px 4px}
.done-card .big{font-size:48px;letter-spacing:6px;color:#f59e0b;margin:8px 0}
.done-card .big i{font-style:normal;color:#e5e7eb}
.done-card h3{font-weight:900;font-size:26px;margin:4px 0}
/* 直向：棋盤在上、說明在下 */
@media (max-aspect-ratio:1/1){
  .ls{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .bwrap{order:-1;padding:8px;height:min(60vh,calc(100vw * 1.1 + 16px))}
  .pnl{box-shadow:0 -4px 24px rgba(17,24,39,.06)}
  .pnl-scroll{padding:12px 16px 8px}
  .ls-title{font-size:20px;margin:0 0 6px}
  .ls-text{font-size:16px;line-height:1.65}
  .dots{margin-bottom:8px}
  .nav{padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
  .nav .tb-btn{min-height:42px}
}
@media (max-height:500px) and (min-aspect-ratio:1/1){
  .pnl-scroll{padding:12px 16px 6px}.ls-title{font-size:20px;margin:0 0 4px}.ls-text{font-size:15px;line-height:1.6}.dots{margin-bottom:6px}
  .nav{padding:6px 16px calc(8px + env(safe-area-inset-bottom))}.nav .tb-btn{min-height:38px;padding:6px 14px}
  .ls{grid-template-columns:minmax(280px,1fr) auto}
}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html" id="back">← 棋牌</a>
  <h1 class="tb-title">象棋教室</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bToc" hidden>課程目錄</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<main class="tb-main">
  <div class="view on" id="toc"><div class="toc-in" id="tocIn"></div></div>
  <div class="view" id="lesson">
    <div class="ls">
      <div class="pnl">
        <div class="pnl-scroll" id="pnl"></div>
        <div class="nav"><button class="tb-btn" id="bPrev">上一步</button><button class="tb-btn" id="bHelp">提示</button><button class="tb-btn primary" id="bNext">下一步</button></div>
      </div>
      <div class="bwrap" id="bwrap"><canvas id="cv" aria-label="象棋棋盤"></canvas></div>
    </div>
  </div>
</main>
<script src="common.js"></script>
<script src="xq-logic.js"></script>
<script src="xq-lessons.js"></script>
<script>
'use strict';
const L0 = {}; XQLOGIC(L0); const X = L0.X;
const AI = TB.worker(XQLOGIC);
const NAMES = ['', '帥', '仕', '相', '傌', '俥', '炮', '兵', '', '將', '士', '象', '馬', '車', '包', '卒'];
const CODE = { K: 1, A: 2, B: 3, N: 4, R: 5, C: 6, P: 7, k: 9, a: 10, b: 11, n: 12, r: 13, c: 14, p: 15 };
const CN = '零一二三四五六七八九', FW = '０１２３４５６７８９';
const $ = id => document.getElementById(id);
const START = (() => {
  const b = new Array(90).fill(0), back = [5, 4, 3, 2, 1, 2, 3, 4, 5];
  for (let c = 0; c < 9; c++) { b[c] = back[c] + 8; b[81 + c] = back[c]; }
  b[19] = b[25] = 14; b[64] = b[70] = 6;
  for (let c = 0; c < 9; c += 2) { b[27 + c] = 15; b[54 + c] = 7; }
  return b;
})();
function parsePos(s) {
  if (s === 'start') return START.slice();
  if (s.length === 90 && !s.includes(' ')) return s.split('').map(ch => CODE[ch] || 0);
  const b = new Array(90).fill(0);
  for (const t of s.trim().split(/\s+/)) b[+t[1] * 9 + +t[2]] = CODE[t[0]];
  return b;
}
const LESSONS = []; XQL.forEach((c, ci) => c.lessons.forEach(l => LESSONS.push(Object.assign({ ci, chName: c.ch }, l))));
let done = TB.store.get('xql:done', {});
let cur = null;   // {li, si, mistakes, hinted, stepOk:[]}
let S = null;     // 目前步驟的盤面狀態 {board, side, found:Set, wrong:Set, sel, targets, plies, left, solved, failed, busy, hint, marks}

// ---------------- 目錄 ----------------
function renderToc() {
  const n = LESSONS.length, d = LESSONS.filter(l => done[l.id]).length, st = Object.values(done).reduce((a, b) => a + b, 0);
  let h = `<div class="toc-hero"><div><h2>象棋教室</h2><p>從每顆棋子怎麼走開始，一路學到將軍、將死和經典殺法。每一課都有互動練習，大約 3～5 分鐘。</p></div>
    <div class="toc-sum">完成 ${d} / ${n} 課 · ★ ${st} / ${n * 3}<div class="toc-prog"><i style="width:${(d / n * 100).toFixed(1)}%"></i></div></div></div>`;
  let k = 0;
  XQL.forEach((c, ci) => {
    h += `<div class="toc-ch c${ci}">${c.ch}</div><div class="toc-grid c${ci}">`;
    c.lessons.forEach(l => {
      k++; const s = done[l.id] || 0;
      h += `<button class="lc${s ? ' done' : ''}" data-id="${l.id}"><span class="num">${k}</span><span class="tx"><b>${l.name}</b><span>${l.sub}</span></span><span class="stars">${'★'.repeat(s)}<i>${'★'.repeat(3 - s)}</i></span></button>`;
    });
    h += '</div>';
  });
  $('tocIn').innerHTML = h;
  $('tocIn').querySelectorAll('.lc').forEach(b => b.onclick = () => { TB.sfx('click'); openLesson(LESSONS.findIndex(l => l.id === b.dataset.id)); });
}
function showToc() {
  if (S && S.busy) AI.kill();
  cur = null; S = null; TB.store.del('xql:cur');
  $('toc').classList.add('on'); $('lesson').classList.remove('on'); $('bToc').hidden = true; $('back').hidden = false;
  renderToc();
}

// ---------------- 上課 ----------------
function openLesson(li, si) {
  cur = { li, si: si || 0, mistakes: 0, hinted: false, stepOk: [] };
  $('toc').classList.remove('on'); $('lesson').classList.add('on'); $('bToc').hidden = false; $('back').hidden = true;
  loadStep();
}
const lesson = () => LESSONS[cur.li], step = () => lesson().steps[cur.si];
const isQ = st => st.t !== 'text';
function loadStep() {
  if (S && S.busy) AI.kill();
  const st = step();
  TB.store.set('xql:cur', { li: cur.li, si: cur.si });
  S = { board: parsePos(st.pos), side: 0, found: new Set(), wrong: new Set(), sel: -1, targets: [], plies: [], left: st.n || 0, solved: !isQ(st), failed: false, busy: false, hint: 0, marks: st.marks || [], li: 0 };
  if (cur.stepOk[cur.si]) S.solved = true;
  const hb = $('bHelp'); hb.textContent = '提示'; if (typeof helpFn === 'function') hb.onclick = helpFn;
  if (st.t === 'targets') { X.init(S.board, 0); S.need = new Set(X.legal().filter(m => (m >> 7) === st.sq).map(m => m & 127)); S.sel = st.sq; if (cur.stepOk[cur.si]) S.found = new Set(S.need); }
  renderPanel(); layout();
}
function feedback(kind, html) { const f = $('fb'); if (!f) return; f.className = 'fb on ' + kind; f.innerHTML = html; }
function renderPanel() {
  const l = lesson(), st = step();
  let dots = ''; l.steps.forEach((s, i) => dots += `<i class="${isQ(s) ? 'q' : ''}${cur.stepOk[i] ? ' ok' : i === cur.si ? ' on' : ''}"></i>`);
  let h = `<div class="ls-ch">${l.chName}</div><div class="ls-title">${l.name}</div><div class="dots">${dots}</div>`;
  if (st.t !== 'text') h += `<span class="ls-tag">${{ tap: '點點看', targets: '找出所有走法', move: '走走看', mate: st.n === 1 ? '一步殺' : st.n + ' 步連將殺', line: '跟著走' }[st.t]}</span>`;
  h += `<div class="ls-text">${st.t === 'text' ? st.h : st.q}</div><div class="fb" id="fb"></div>`;
  $('pnl').innerHTML = h;
  if (S.solved && isQ(st)) feedback('ok', '✓ ' + (st.ok || '完成！'));
  else if (st.t === 'targets') feedback('info', '已找到 ' + S.found.size + ' / ' + S.need.size + ' 個');
  else if (st.t === 'mate' && st.n > 1) feedback('info', '紅先。每一步都要將軍，' + st.n + ' 步內將死。');
  else if (st.t === 'line') feedback('info', st.notes[0]);
  updNav();
}
function updNav() {
  const st = step(), last = cur.si === lesson().steps.length - 1;
  $('bPrev').disabled = cur.si === 0;
  $('bHelp').hidden = !isQ(st) || st.t === 'tap';
  $('bHelp').disabled = S.solved || S.busy;
  $('bNext').disabled = !S.solved;
  $('bNext').textContent = last ? '完成這一課' : isQ(st) && !S.solved ? '先完成練習' : '下一步';
}
function okStep(msg) {
  S.solved = true; cur.stepOk[cur.si] = true; TB.sfx('win');
  feedback('ok', '✓ ' + (msg || step().ok || '答對了！')); renderDots(); updNav(); draw();
}
function renderDots() { const ds = $('pnl').querySelectorAll('.dots i'); ds.forEach((d, i) => { d.classList.toggle('ok', !!cur.stepOk[i]); d.classList.toggle('on', i === cur.si && !cur.stepOk[i]); }); }
function miss(msg) { cur.mistakes++; TB.sfx('bad'); feedback('bad', msg); }
function finishLesson() {
  const l = lesson(), s = cur.hinted ? 1 : cur.mistakes > 2 ? 2 : cur.mistakes ? 2 : 3;
  if ((done[l.id] || 0) < s) { done[l.id] = s; TB.store.set('xql:done', done); }
  TB.bump('xq-learn', 'played'); TB.sfx('win');
  const nextL = LESSONS[cur.li + 1];
  $('pnl').innerHTML = `<div class="done-card"><div class="ls-ch">${l.chName}</div><h3>「${l.name}」完成！</h3><div class="big">${'★'.repeat(s)}<i>${'★'.repeat(3 - s)}</i></div>
    <p style="color:var(--mute)">${s === 3 ? '全部一次答對，太厲害了！' : cur.hinted ? '用了提示拿 1 顆星，再挑戰一次拿滿三顆星吧。' : '有幾題走錯，再練一次就能拿滿三顆星。'}</p>
    ${nextL ? `<p>下一課：<b>${nextL.name}</b></p>` : '<p>全部課程都上完了！去「象棋殘局」挑戰更多題目吧。</p>'}</div>`;
  $('bPrev').disabled = false; $('bHelp').hidden = true; $('bNext').disabled = false;
  $('bNext').textContent = nextL ? '下一課' : '回目錄';
  cur.finished = true;
}
$('bNext').onclick = () => {
  TB.sfx('click');
  if (cur.finished) { if (LESSONS[cur.li + 1]) openLesson(cur.li + 1); else showToc(); return; }
  if (!S.solved) return;
  if (cur.si < lesson().steps.length - 1) { cur.si++; loadStep(); } else finishLesson();
};
$('bPrev').onclick = () => { TB.sfx('click'); if (cur.finished) { cur.finished = false; loadStep(); return; } if (cur.si > 0) { cur.si--; loadStep(); } };
$('bToc').onclick = () => { TB.sfx('click'); showToc(); };
$('bHelp').onclick = () => {
  const st = step(); if (S.solved || S.busy) return;
  cur.hinted = true; TB.sfx('select');
  if (st.t === 'targets') { const left = [...S.need].filter(x => !S.found.has(x)); S.hintSq = left[0]; feedback('info', '提示：看看發亮的那一點。（用了提示這課只拿 1 顆星）'); draw(); return; }
  if (st.t === 'line') { const k = S.plies.length; S.hint = st.moves[k][0] << 7 | st.moves[k][1]; draw(); feedback('info', '照箭頭走。'); return; }
  if (st.t === 'mate') {
    if (S.plies.every((p, i) => p.m === st.line[i])) { S.hint = st.line[S.plies.length]; draw(); feedback('info', '提示：' + notation(S.board, S.hint) + '（用了提示這課只拿 1 顆星）'); return; }
    S.busy = true; updNav();
    AI.ask({ cmd: 'mate', board: S.board.slice(), side: 0, n: S.left }).then(r => { S.busy = false; if (r.moves && r.moves.length) { S.hint = r.moves[0]; feedback('info', '提示：' + notation(S.board, S.hint)); } updNav(); draw(); });
    return;
  }
  if (st.t === 'move') {
    X.init(S.board, 0);
    const m = X.legal().find(m => moveOk(st, m));
    if (m) { S.hint = m; draw(); feedback('info', '提示：' + notation(S.board, m)); }
  }
};

function notation(b, m) {
  const from = m >> 7, to = m & 127, p = b[from], t = p & 7, red = p < 8;
  const fr = (from / 9) | 0, fc = from % 9, tr = (to / 9) | 0, tc = to % 9;
  const num = n => red ? CN[n] : FW[n], file = c => red ? 9 - c : c + 1;
  let head; const same = []; for (let r = 0; r < 10; r++) if (b[r * 9 + fc] === p) same.push(r);
  if (same.length >= 2) { const ord = red ? same.slice().sort((a, c) => a - c) : same.slice().sort((a, c) => c - a); head = (['前', '後'][ord.indexOf(fr)] || '中') + NAMES[p]; }
  else head = NAMES[p] + num(file(fc));
  const fwd = red ? tr < fr : tr > fr;
  if (tr === fr) return head + '平' + num(file(tc));
  return head + (fwd ? '進' : '退') + ((t === 4 || t === 3 || t === 2) ? num(file(tc)) : num(Math.abs(tr - fr)));
}
function moveOk(st, m) {
  const to = m & 127;
  if (st.goal === 'capture') return to === st.sq;
  if (st.goal === 'to') return to === st.sq;
  if (st.goal === 'check') { X.init(S.board, 0); X.make(m); const c = X.inCheck(1); X.unmake(); return c; }
  return true;
}
function doMove(m, quiet) {
  const from = m >> 7, to = m & 127, cap = S.board[to];
  S.plies.push({ m, txt: notation(S.board, m) });
  if (!quiet) { S.anim = { p: S.board[from], from, to, cap, t0: performance.now() }; TB.sfx(cap ? 'capture' : 'place'); }
  S.board[to] = S.board[from]; S.board[from] = 0; S.side ^= 1; S.hint = 0;
  loop();
}
function playerMove(m) {
  const st = step(); S.sel = -1; S.targets = [];
  if (st.t === 'move') {
    if (!moveOk(st, m)) { miss(st.goal === 'check' ? '這步沒有將軍喔，再試一次。' : '不是這步喔，再找找看。'); draw(); return; }
    doMove(m); S.side = 0; okStep(); return;
  }
  if (st.t === 'line') {
    const k = S.plies.length, exp = st.moves[k][0] << 7 | st.moves[k][1];
    if (m !== exp) { miss('這一課先照著標準走法：' + notation(S.board, exp) + '。按「提示」會畫出箭頭。'); draw(); return; }
    doMove(m);
    if (k + 1 >= st.moves.length) { okStep(); return; }
    S.busy = true; updNav();
    setTimeout(() => {
      if (!S) return;
      const rep = st.moves[k + 1]; const rm = rep[0] << 7 | rep[1]; const txt = notation(S.board, rm);
      doMove(rm); S.busy = false;
      if (k + 2 >= st.moves.length) { okStep(); return; }
      feedback('info', '黑方走「' + txt + '」。' + (st.notes[(k + 2) / 2] || '')); updNav();
    }, 650);
    return;
  }
  if (st.t === 'mate') {
    X.init(S.board, 0); X.make(m); const chk = X.inCheck(1); X.unmake();
    if (st.n > 1 && !chk) { miss('這一題每一步都要將軍！'); draw(); return; }
    doMove(m); S.left--;
    X.init(S.board, 1);
    if (!X.legal().length) { okStep('將死了！' + (step().n > 1 ? '' : '')); return; }
    if (S.left <= 0) { cur.mistakes++; TB.sfx('lose'); S.failed = true; feedback('bad', '黑將還能逃。按「重來」再試一次。'); setRetry(); return; }
    TB.sfx('check'); S.busy = true; updNav(); feedback('info', '黑方應將中…');
    AI.ask({ cmd: 'defend', board: S.board.slice(), side: 1, n: S.left }).then(res => {
      setTimeout(() => {
        if (!S) return; S.busy = false;
        const txt = notation(S.board, res.move); doMove(res.move);
        if (res.len > S.left) { cur.mistakes++; S.failed = true; TB.sfx('lose'); feedback('bad', '黑方走「' + txt + '」就逃掉了。按「重來」再試一次。'); setRetry(); return; }
        feedback('info', '黑方走「' + txt + '」。還剩 ' + S.left + ' 步，繼續將軍！'); updNav();
      }, 350);
    });
  }
}
function setRetry() {
  updNav(); const b = $('bHelp'); b.hidden = false; b.disabled = false; b.textContent = '重來';
  b.onclick = () => { b.textContent = '提示'; b.onclick = helpFn; loadStep(); };
}
var helpFn = $('bHelp').onclick;

// ---------------- 畫面 ----------------
const cv = $('cv'), g = cv.getContext('2d'), bwrap = $('bwrap');
let U = 40, DPR = 1, OX = 0, OY = 0;
function layout() {
  if (!S) return;
  const W = bwrap.clientWidth - 16, H = bwrap.clientHeight - 16;
  U = Math.max(18, Math.floor(Math.min(W / 10, H / 11)));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = U * 10 + 'px'; cv.style.height = U * 11 + 'px';
  cv.width = Math.round(U * 10 * DPR); cv.height = Math.round(U * 11 * DPR);
  OX = U; OY = U; draw();
}
const sq2xy = sq => [OX + (sq % 9) * U, OY + ((sq / 9) | 0) * U];
function xy2sq(x, y) {
  const c = Math.round((x - OX) / U), r = Math.round((y - OY) / U);
  if (c < 0 || c > 8 || r < 0 || r > 9) return -1;
  const dx = x - (OX + c * U), dy = y - (OY + r * U);
  if (dx * dx + dy * dy > (U * 0.55) ** 2) return -1;
  return r * 9 + c;
}
function drawBoard() {
  const w = cv.width / DPR, h = cv.height / DPR;
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#fff7e6'); gr.addColorStop(1, '#ffeccb'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#c98b4a'; g.lineCap = 'square';
  g.fillStyle = 'rgba(56,189,248,.13)'; g.fillRect(OX, OY + 4 * U, 8 * U, U);
  g.lineWidth = Math.max(2, U * 0.06); g.beginPath(); g.roundRect ? g.roundRect(OX - U * 0.2, OY - U * 0.2, 8.4 * U, 9.4 * U, U * 0.12) : g.rect(OX - U * 0.2, OY - U * 0.2, 8.4 * U, 9.4 * U); g.stroke();
  g.lineWidth = Math.max(1, U * 0.035); g.beginPath();
  for (let r = 0; r < 10; r++) { g.moveTo(OX, OY + r * U); g.lineTo(OX + 8 * U, OY + r * U); }
  for (let c = 0; c < 9; c++) { if (c === 0 || c === 8) { g.moveTo(OX + c * U, OY); g.lineTo(OX + c * U, OY + 9 * U); } else { g.moveTo(OX + c * U, OY); g.lineTo(OX + c * U, OY + 4 * U); g.moveTo(OX + c * U, OY + 5 * U); g.lineTo(OX + c * U, OY + 9 * U); } }
  g.moveTo(OX + 3 * U, OY); g.lineTo(OX + 5 * U, OY + 2 * U); g.moveTo(OX + 5 * U, OY); g.lineTo(OX + 3 * U, OY + 2 * U);
  g.moveTo(OX + 3 * U, OY + 7 * U); g.lineTo(OX + 5 * U, OY + 9 * U); g.moveTo(OX + 5 * U, OY + 7 * U); g.lineTo(OX + 3 * U, OY + 9 * U);
  g.stroke();
  g.fillStyle = 'rgba(14,165,233,.75)'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 ' + Math.round(U * 0.46) + 'px "Noto Sans TC","Noto Sans CJK TC","PingFang TC",sans-serif';
  const ry = OY + 4.5 * U; g.fillText('楚', OX + 1.4 * U, ry); g.fillText('河', OX + 2.6 * U, ry); g.fillText('漢', OX + 5.4 * U, ry); g.fillText('界', OX + 6.6 * U, ry);
  g.font = '700 ' + Math.round(U * 0.26) + 'px "Noto Sans TC","Noto Sans CJK TC",sans-serif'; g.fillStyle = 'rgba(160,110,60,.75)';
  for (let c = 0; c < 9; c++) { const x = OX + c * U; g.fillText(String(c + 1), x, OY - U * 0.62); g.fillText(CN[9 - c], x, OY + 9 * U + U * 0.62); }
}
function drawPiece(p, x, y, opt) {
  opt = opt || {};
  const r = U * 0.45, red = p < 8, col = red ? '#f43f5e' : '#1e293b', cy = y - (opt.lift ? U * 0.08 : 0);
  g.save(); if (opt.alpha != null) g.globalAlpha = opt.alpha;
  g.shadowColor = red ? 'rgba(244,63,94,.28)' : 'rgba(30,41,59,.28)'; g.shadowBlur = U * (opt.lift ? 0.4 : 0.16); g.shadowOffsetY = U * (opt.lift ? 0.18 : 0.07);
  g.beginPath(); g.arc(x, cy, r, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill(); g.shadowColor = 'transparent';
  g.beginPath(); g.arc(x, cy, r - U * 0.045, 0, Math.PI * 2); g.lineWidth = U * 0.09; g.strokeStyle = col; g.stroke();
  g.beginPath(); g.arc(x, cy, r * 0.7, 0, Math.PI * 2); g.lineWidth = U * 0.02; g.strokeStyle = red ? 'rgba(244,63,94,.35)' : 'rgba(30,41,59,.3)'; g.stroke();
  g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 ' + Math.round(U * 0.46) + 'px "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
  g.fillText(NAMES[p], x, cy + U * 0.02);
  if (opt.ring) { g.beginPath(); g.arc(x, cy, r + U * 0.07, 0, Math.PI * 2); g.lineWidth = U * 0.06; g.strokeStyle = opt.ring; g.stroke(); }
  g.restore();
}
function dot(sq, color, rr) { const [x, y] = sq2xy(sq); g.beginPath(); g.arc(x, y, U * (rr || 0.17), 0, 7); g.fillStyle = color; g.fill(); }
function ring(sq, color) { const [x, y] = sq2xy(sq); g.save(); g.beginPath(); g.arc(x, y, U * 0.5, 0, 7); g.lineWidth = U * 0.07; g.strokeStyle = color; g.setLineDash([U * .12, U * .08]); g.stroke(); g.restore(); }
function arrow(m, color) {
  const [fx, fy] = sq2xy(m >> 7), [tx, ty] = sq2xy(m & 127);
  g.save(); g.strokeStyle = g.fillStyle = color; g.lineWidth = U * 0.12; g.lineCap = 'round';
  const ang = Math.atan2(ty - fy, tx - fx), ex = tx - Math.cos(ang) * U * 0.3, ey = ty - Math.sin(ang) * U * 0.3;
  g.beginPath(); g.moveTo(fx, fy); g.lineTo(ex, ey); g.stroke();
  g.beginPath(); g.moveTo(tx, ty); g.lineTo(ex - Math.cos(ang - 0.5) * U * 0.3, ey - Math.sin(ang - 0.5) * U * 0.3); g.lineTo(ex - Math.cos(ang + 0.5) * U * 0.3, ey - Math.sin(ang + 0.5) * U * 0.3); g.closePath(); g.fill(); g.restore();
}
function draw() {
  if (!S) return;
  const st = step();
  g.setTransform(DPR, 0, 0, DPR, 0, 0); drawBoard();
  const t = performance.now(), pulse = 0.55 + 0.45 * Math.sin(t / 260);
  for (const m of S.marks) { const [x, y] = sq2xy(m); g.save(); g.globalAlpha = .35; g.fillStyle = '#f97316'; g.beginPath(); g.arc(x, y, U * 0.42, 0, 7); g.fill(); g.restore(); }
  const lm = S.plies[S.plies.length - 1];
  if (lm) { const [x, y] = sq2xy(lm.m & 127); g.save(); g.strokeStyle = '#6366f1'; g.lineWidth = U * 0.05; g.strokeRect(x - U * .5, y - U * .5, U, U); g.restore(); }
  X.init(S.board, S.side); const chk = X.inCheck(S.side);
  let ap = 0; if (S.anim) { ap = Math.min(1, (t - S.anim.t0) / 220); if (ap >= 1) S.anim = null; }
  for (let sq = 0; sq < 90; sq++) {
    const p = S.board[sq]; if (!p) continue;
    if (S.anim && sq === S.anim.to) continue;
    if (S.drag && S.drag.moved && sq === S.drag.sq) continue;
    const [x, y] = sq2xy(sq);
    if (chk && (p & 7) === 1 && (p < 8 ? 0 : 1) === S.side) { g.save(); const gl = g.createRadialGradient(x, y, U * .3, x, y, U * .8); gl.addColorStop(0, 'rgba(244,63,94,.75)'); gl.addColorStop(1, 'rgba(244,63,94,0)'); g.fillStyle = gl; g.beginPath(); g.arc(x, y, U * .8, 0, 7); g.fill(); g.restore(); }
    drawPiece(p, x, y, { lift: sq === S.sel && !S.drag, ring: sq === S.sel ? '#f59e0b' : null });
  }
  if (st.t === 'targets') {
    for (const q of S.found) S.board[q] ? ring(q, '#10b981') : dot(q, '#10b981', 0.2);
    for (const q of S.wrong) dot(q, 'rgba(244,63,94,.8)', 0.14);
    if (S.hintSq != null && !S.found.has(S.hintSq)) { const [x, y] = sq2xy(S.hintSq); g.save(); g.globalAlpha = pulse; g.strokeStyle = '#f59e0b'; g.lineWidth = U * 0.08; g.beginPath(); g.arc(x, y, U * 0.32, 0, 7); g.stroke(); g.restore(); }
  } else {
    for (const q of S.targets) S.board[q] ? ring(q, 'rgba(244,63,94,.95)') : dot(q, 'rgba(16,185,129,.85)', 0.15);
  }
  if (S.hint) arrow(S.hint, 'rgba(16,185,129,.9)');
  if (S.anim) {
    const [fx, fy] = sq2xy(S.anim.from), [tx, ty] = sq2xy(S.anim.to), e = 1 - Math.pow(1 - ap, 3);
    if (S.anim.cap) drawPiece(S.anim.cap, tx, ty, { alpha: 1 - ap });
    drawPiece(S.anim.p, fx + (tx - fx) * e, fy + (ty - fy) * e, { lift: ap < 1 });
  }
  if (S.drag && S.drag.moved) drawPiece(S.board[S.drag.sq], S.drag.x, S.drag.y - U * 0.15, { lift: true });
  if (S.anim || (st.t === 'targets' && S.hintSq != null && !S.solved)) requestAnimationFrame(draw);
}
function loop() { draw(); }

// ---------------- 操作 ----------------
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function canMove() { const st = step(); return S && !S.solved && !S.failed && !S.busy && !S.anim && S.side === 0 && (st.t === 'move' || st.t === 'mate' || st.t === 'line'); }
cv.addEventListener('pointerdown', e => {
  if (!S) return;
  const st = step(), [x, y] = evPos(e), sq = xy2sq(x, y);
  if (sq < 0) return;
  if (st.t === 'tap') {
    if (S.solved) return;
    if (st.ans.includes(sq)) { S.marks = [sq]; okStep(); } else { miss('不是這裡喔，再找找看。'); }
    return;
  }
  if (st.t === 'targets') {
    if (S.solved || sq === st.sq) return;
    if (S.need.has(sq)) { if (!S.found.has(sq)) { S.found.add(sq); TB.sfx('select'); S.wrong.delete(sq); } }
    else { if (!S.wrong.has(sq)) { S.wrong.add(sq); miss(whyNot(st, sq)); } }
    if (S.found.size === S.need.size) okStep(); else if (!S.wrong.has(sq)) feedback('info', '已找到 ' + S.found.size + ' / ' + S.need.size + ' 個');
    draw(); return;
  }
  if (!canMove()) return;
  const p = S.board[sq];
  if (S.sel >= 0 && S.targets.includes(sq)) { playerMove(S.sel << 7 | sq); return; }
  if (p && p < 8) {
    X.init(S.board, 0); S.sel = sq; S.targets = X.legal().filter(m => (m >> 7) === sq).map(m => m & 127); TB.sfx('select');
    S.drag = { sq, x, y, x0: x, y0: y, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    draw();
  } else if (S.sel >= 0) { S.sel = -1; S.targets = []; draw(); }
});
cv.addEventListener('pointermove', e => {
  if (!S || !S.drag) return;
  const [x, y] = evPos(e); S.drag.x = x; S.drag.y = y;
  if (!S.drag.moved && Math.hypot(x - S.drag.x0, y - S.drag.y0) > U * 0.25) S.drag.moved = true;
  if (S.drag.moved) draw();
});
cv.addEventListener('pointerup', e => {
  if (!S || !S.drag) return;
  const d = S.drag; S.drag = null;
  if (d.moved) { const [x, y] = evPos(e), sq = xy2sq(x, y); if (sq >= 0 && sq !== d.sq && S.targets.includes(sq)) { playerMove(d.sq << 7 | sq); return; } }
  draw();
});
cv.addEventListener('pointercancel', () => { if (S) { S.drag = null; draw(); } });
function whyNot(st, sq) {
  const p = S.board[st.sq], t = p & 7, fr = (st.sq / 9) | 0, fc = st.sq % 9, tr = (sq / 9) | 0, tc = sq % 9;
  if (S.board[sq] && S.board[sq] < 8) return '那裡是自己的棋子，不能走過去。';
  if (t === 1 && Math.abs(tr - fr) + Math.abs(tc - fc) === 1 && tc >= 3 && tc <= 5 && tr >= 7) return '那一步會跟黑將面對面（王不見王），不行喔。';
  if (t === 3 && Math.abs(tr - fr) === 2 && Math.abs(tc - fc) === 2) return '田字中間被擋住了（塞象眼）。';
  if (t === 4 && Math.abs(tr - fr) * Math.abs(tc - fc) === 2) return '那個方向被蹩馬腳了。';
  if (t === 7 && fr >= 5 && tr === fr) return '兵還沒過河，不能橫走。';
  return '這顆棋子走不到那裡喔。';
}

addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(bwrap);
renderToc();
const sv = TB.store.get('xql:cur', null);
if (sv && LESSONS[sv.li] && LESSONS[sv.li].steps[sv.si]) openLesson(sv.li, sv.si);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
</script>
