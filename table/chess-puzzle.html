<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>西洋棋殺棋 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#3b82f6;--accent-ink:#2563eb;--accent-soft:#eff6ff}
.tb-btn.primary{box-shadow:0 4px 12px rgba(59,130,246,.35)}
/* 目錄 */
#menu{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.mwrap{max-width:1040px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-wrap:wrap;gap:18px;align-items:stretch;margin-bottom:22px}
.hero .intro{flex:1 1 320px;background:linear-gradient(120deg,#eff6ff,#ede9fe);border-radius:22px;padding:22px 24px;box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:clamp(28px,5vw,40px);font-weight:900;letter-spacing:.06em;color:#2563eb}
.hero p{margin:8px 0 0;color:var(--mute);font-size:15px;max-width:46ch}
.prog{margin-top:14px;font-size:13px;font-weight:700;color:#2563eb}
.bar{height:8px;border-radius:99px;background:#fff;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:99px}
.daily{flex:0 1 300px;min-width:240px;background:var(--panel);border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s;text-align:left;font:inherit;color:inherit}
.daily:hover{transform:translateY(-3px);border-color:#93c5fd}
.daily .tag{align-self:flex-start;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(90deg,#3b82f6,#8b5cf6);border-radius:99px;padding:2px 10px}
.daily b{font-size:20px;font-weight:900}
.daily span{font-size:13px;color:var(--mute)}
.daily .ok{color:#10b981;font-weight:700}
.set{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.set h3{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.set h3::before{content:"";width:8px;height:22px;border-radius:4px;background:var(--c,#f43f5e)}
.set .d{color:var(--mute);font-size:13px}
.set .cnt{margin-left:auto;font-size:13px;font-weight:700;color:var(--c)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.tile{appearance:none;border:0;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile b{font-size:20px;font-weight:900;line-height:1}
.tile s{text-decoration:none;font-size:12px;letter-spacing:1px;color:#e5e7eb}
.tile s.on{color:#f59e0b}
.tile.done{background:color-mix(in srgb,var(--c) 10%,#fff)}
.tile.done b{color:var(--c)}
.tile.lock{opacity:.4;cursor:default;transform:none}
.lockmsg{font-size:13px;color:var(--mute);margin:-2px 0 8px}
/* 解題畫面 */
#play{flex:1;min-height:0;display:none;align-items:center;justify-content:center;gap:20px;padding:12px;position:relative}
body.playing #menu{display:none}
body.playing #play{display:flex}
#cv{display:block;touch-action:none;border-radius:20px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(59,130,246,.22);flex:none}
.side{width:290px;flex:none;display:flex;flex-direction:column;gap:12px;align-self:center}
.card{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.pz-t{font-size:13px;font-weight:700;color:#2563eb;letter-spacing:.06em}
.pz-h{font-size:22px;font-weight:900;margin:2px 0 4px}
.pz-g{font-size:14px;color:var(--mute)}
.pz-left{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pz-left i{width:26px;height:26px;border-radius:50%;background:#dbeafe;color:#2563eb;font-style:normal;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.pz-left i.used{background:#3b82f6;color:#fff}
.msg{font-size:15px;font-weight:500;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
.msg.good{color:#059669}.msg.bad{color:#e11d48}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts .tb-btn{min-height:44px}
.acts .wide{grid-column:1/-1}
body.narrow #play{flex-direction:column;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:center}
body.narrow .side{width:100%;max-width:560px;gap:6px;display:contents}
body.narrow .card.info{order:0;width:100%;max-width:560px;padding:8px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
body.narrow .pz-h{font-size:17px;margin:0}
body.narrow .pz-g{font-size:12px;flex-basis:100%}
body.narrow .pz-left{margin:0 0 0 auto}
body.narrow .pz-left i{width:22px;height:22px;font-size:12px}
body.narrow #cv{order:1}
body.narrow .msg{order:2;min-height:28px;font-size:14px;width:100%;max-width:560px;padding:4px 10px;border-radius:12px}
body.narrow .acts{order:3;width:100%;max-width:560px;grid-template-columns:repeat(4,1fr);gap:6px}
body.narrow .acts .wide{grid-column:auto}
body.narrow .acts .tb-btn{min-height:40px;padding:6px 4px;font-size:13px}
.think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b82f6;margin-left:6px;animation:xqp 1s infinite}
@keyframes xqp{0%,100%{opacity:.25}50%{opacity:1}}
@media (max-height:520px){
  body:not(.narrow) .side{gap:8px;max-height:100%}
  body:not(.narrow) .card{padding:8px 12px;border-radius:14px}
  body:not(.narrow) .pz-h{font-size:18px;margin:0}
  body:not(.narrow) .pz-left{margin-top:4px}
  body:not(.narrow) .pz-left i{width:22px;height:22px}
  body:not(.narrow) .msg{min-height:0;font-size:13px}
  body:not(.narrow) .acts .tb-btn{min-height:36px;padding:5px 8px}
}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}}
.cs-promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cs-promo button{appearance:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700}
.cs-promo svg{width:44px;height:44px}
#cv{border-radius:16px}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html" id="back">← 棋牌</a>
  <h1 class="tb-title">西洋棋殺棋</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bMenu" hidden>題目列表</button>
  <button class="tb-btn" id="bRule">玩法</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<div id="menu"><div class="mwrap" id="mwrap"></div></div>
<main id="play">
  <canvas id="cv" aria-label="西洋棋棋盤"></canvas>
  <div class="side">
    <div class="card info"><div class="pz-t" id="pzT"></div><div class="pz-h" id="pzH"></div><div class="pz-g" id="pzG"></div><div class="pz-left" id="pzL"></div></div>
    <div class="card msg" id="msg"></div>
    <div class="acts">
      <button class="tb-btn" id="bRetry">重來</button>
      <button class="tb-btn" id="bHint">提示</button>
      <button class="tb-btn" id="bSol">看解答</button>
      <button class="tb-btn primary" id="bNext">下一題</button>
    </div>
  </div>
</main>
<script src="common.js"></script>
<script src="chess-logic.js"></script>
<script src="chess-puzzles.js"></script>
<script>
'use strict';
const L = {}; CHLOGIC(L); const X = L.X;
const AI = TB.worker(CHLOGIC);
const PNAME = ['', '士兵', '騎士', '主教', '城堡', '皇后', '國王'];
const LET = ['', '', 'N', 'B', 'R', 'Q', 'K'];
// 棋子造型：100×100 的 SVG 路徑（自己畫的簡潔現代風）
const BASE = 'M24 74h52a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-52a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4Z';
const SHAPE = {
  1: { body: ['M62 28A12 12 0 1 1 38 28A12 12 0 1 1 62 28Z', 'M39 46Q50 38 61 46L66 74L34 74Z', BASE] },
  2: { body: ['M32 74C31 60 40 54 44 49L33 52C26 53 23 46 27 41L44 25L46 13L54 21C69 24 77 40 72 74Z', BASE], dot: [54, 32, 3] },
  3: { body: ['M55 14A5 5 0 1 1 45 14A5 5 0 1 1 55 14Z', 'M50 20C68 32 66 52 59 60L41 60C34 52 32 32 50 20Z', 'M38 60h24v6h-24Z', 'M40 66L60 66L64 74L36 74Z', BASE], line: 'M55 33L45 45' },
  4: { body: ['M33 46L67 46L69 74L31 74Z', 'M28 18h9v8h7.5v-8h11v8h7.5v-8h9v28h-44Z', BASE], line: 'M33 46h34' },
  5: { body: ['M30 74L22 32L37 54L38 26L47 52L50 22L53 52L62 26L63 54L78 32L70 74Z',
    'M26 30A4 4 0 1 1 18 30A4 4 0 1 1 26 30Z', 'M42 24A4 4 0 1 1 34 24A4 4 0 1 1 42 24Z', 'M54 19A4 4 0 1 1 46 19A4 4 0 1 1 54 19Z', 'M66 24A4 4 0 1 1 58 24A4 4 0 1 1 66 24Z', 'M82 30A4 4 0 1 1 74 30A4 4 0 1 1 82 30Z', BASE], line: 'M30 64Q50 58 70 64' },
  6: { body: ['M47 8h6v7h7v6h-7v9h-6v-9h-7v-6h7Z', 'M30 74L25 44C35 34 65 34 75 44L70 74Z', BASE], line: 'M28 60Q50 54 72 60' },
};
const PATHS = {}; for (const t in SHAPE) PATHS[t] = { body: SHAPE[t].body.map(d => new Path2D(d)), line: SHAPE[t].line ? new Path2D(SHAPE[t].line) : null };
function pieceSVG(p) {
  const t = p & 7, black = p >> 3, s = SHAPE[t];
  const fill = black ? '#1e293b' : '#fff', stroke = black ? '#0f172a' : '#1e293b', detail = black ? '#fff' : '#1e293b';
  return '<svg viewBox="0 0 100 100">' + s.body.map(d => `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>`).join('') +
    (s.line ? `<path d="${s.line}" fill="none" stroke="${detail}" stroke-width="3.5" stroke-linecap="round"/>` : '') +
    (s.dot ? `<circle cx="${s.dot[0]}" cy="${s.dot[1]}" r="${s.dot[2]}" fill="${detail}"/>` : '') + '</svg>';
}

const SETC = ['#3b82f6', '#8b5cf6', '#f43f5e'];
const $ = id => document.getElementById(id);
const PFX = 'chp';
let stars = TB.store.get(PFX + ':stars', {});
let P = null;   // {si, pi, id, daily, n, fen, line, st, left, plies, mistakes, hinted, solved, failed}
let sel = -1, targets = [], hint = 0, busy = false, anim = null, drag = null, showing = false;
const toSq = i => (i >> 3) * 16 + (i & 7);

// ---------------- 目錄 ----------------
const total = CHP.reduce((a, s) => a + s.list.length, 0);
function dkey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function todayKey() { return dkey(new Date()); }
function dailyPick() {
  const k = todayKey() + 'chess'; let h = 2166136261; for (const ch of k) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const dow = (new Date().getDay() + 6) % 7, si = [0, 0, 1, 1, 1, 2, 2][dow];
  return { si, pi: h % CHP[si].list.length };
}
function unlocked(si) { if (si === 0) return true; const prev = CHP[si - 1]; return prev.list.filter((_, i) => stars[(si - 1) + '-' + i]).length >= Math.min(6, prev.list.length); }
function renderMenu() {
  const done = Object.keys(stars).length, st = Object.values(stars).reduce((a, b) => a + b, 0);
  const dp = dailyPick(), dd = TB.store.get(PFX + ':daily', {}), streak = TB.store.get(PFX + ':streak', { n: 0, last: '' });
  const dDone = !!dd[todayKey()];
  let h = `<div class="hero"><div class="intro"><h2>西洋棋殺棋</h2><p>白方先走，在限定步數內將死黑王。黑方會選最難殺的應法；兩步殺的第一步常常不是將軍，而是一步安靜的妙著。</p>
    <div class="prog">完成 ${done} / ${total} 題 · ★ ${st} / ${total * 3}</div><div class="bar"><i style="width:${(done / total * 100).toFixed(1)}%"></i></div></div>
    <button class="daily" id="daily"><span class="tag">每日一題 · ${todayKey().slice(5).replace('-', '/')}</span><b>${CHP[dp.si].name} 第 ${dp.pi + 1} 題</b>
    <span>${dDone ? '<span class="ok">✓ 今天已解開</span>' : '每天換一題，週一簡單、週末最難'}</span><span>連續解題：${streak.n} 天</span></button></div>`;
  CHP.forEach((s, si) => {
    const c = SETC[si], ok = unlocked(si), n = s.list.filter((_, i) => stars[si + '-' + i]).length;
    h += `<div class="set" style="--c:${c}"><h3>${s.name}</h3><span class="d">${s.desc}</span><span class="cnt">${n} / ${s.list.length}</span></div>`;
    if (!ok) h += `<div class="lockmsg">🔒 先解開「${CHP[si - 1].name}」6 題就能挑戰</div>`;
    h += `<div class="tiles" style="--c:${c}">`;
    s.list.forEach((_, pi) => {
      const v = stars[si + '-' + pi] || 0;
      h += `<button class="tile${v ? ' done' : ''}${ok ? '' : ' lock'}" data-s="${si}" data-p="${pi}"${ok ? '' : ' disabled'}><b>${pi + 1}</b><s class="${v ? 'on' : ''}">${'★'.repeat(v)}${'☆'.repeat(3 - v)}</s></button>`;
    });
    h += '</div>';
  });
  $('mwrap').innerHTML = h;
  $('daily').onclick = () => start(dp.si, dp.pi, true);
  $('mwrap').querySelectorAll('.tile:not(.lock)').forEach(b => b.onclick = () => start(+b.dataset.s, +b.dataset.p));
}
function showMenu() {
  document.body.classList.remove('playing'); $('bMenu').hidden = true; $('back').hidden = false;
  if (busy) { AI.kill(); busy = false; }
  showing = false; P = null; renderMenu(); TB.store.del(PFX + ':cur');
}

// ---------------- 解題 ----------------
function start(si, pi, daily) {
  const [fen, line] = CHP[si].list[pi];
  P = { si, pi, id: si + '-' + pi, daily: !!daily, n: CHP[si].n, fen: fen + ' w - - 0 1', line, mistakes: 0, hinted: false };
  TB.store.set(PFX + ':cur', { si, pi, daily: !!daily });
  document.body.classList.add('playing'); $('bMenu').hidden = false; $('back').hidden = true;
  reset(); layout();
}
function reset() {
  if (busy) { AI.kill(); busy = false; }
  X.init(X.fen(P.fen)); P.left = P.n; P.plies = []; P.solved = false; P.failed = false;
  sel = -1; targets = []; hint = 0; anim = null; showing = false;
  setMsg(P.n === 1 ? '找出一步將死的棋。' : '白先，' + P.n + ' 步內將死黑王。');
  render();
}
function setMsg(t, cls) { const m = $('msg'); m.innerHTML = t; m.className = 'card msg' + (cls ? ' ' + cls : ''); }
function san(m) {
  const f = m & 127, to = (m >> 7) & 127, pr = m >> 14, p = X.board[f], t = p & 7;
  const sqn = s => String.fromCharCode(97 + (s & 7)) + ((s >> 4) + 1);
  let s;
  if (t === X.K && Math.abs(to - f) === 2) s = to > f ? 'O-O' : 'O-O-O';
  else {
    const cap = X.board[to] || (t === X.P && (f & 7) !== (to & 7));
    if (t === X.P) s = (cap ? String.fromCharCode(97 + (f & 7)) + 'x' : '') + sqn(to) + (pr ? '=' + LET[pr] : '');
    else {
      const others = X.legal().filter(o => o !== m && ((o >> 7) & 127) === to && (X.board[o & 127] & 7) === t && (o & 127) !== f);
      let dis = '';
      if (others.length) {
        const sameFile = others.some(o => ((o & 127) & 7) === (f & 7)), sameRank = others.some(o => ((o & 127) >> 4) === (f >> 4));
        dis = !sameFile ? String.fromCharCode(97 + (f & 7)) : !sameRank ? String((f >> 4) + 1) : sqn(f);
      }
      s = LET[t] + dis + (cap ? 'x' : '') + sqn(to);
    }
  }
  X.make(m); if (X.inCheck(X.side)) s += X.legal().length ? '+' : '#'; X.unmake();
  return s;
}
function doMove(m, quiet) {
  const f = m & 127, to = (m >> 7) & 127;
  const txt = san(m), cap = X.board[to], p = X.board[f];
  P.plies.push({ m, txt });
  if (!quiet) { anim = { p, from: f, to, cap, castle: (p & 7) === X.K && Math.abs(to - f) === 2, t0: performance.now() }; TB.sfx(cap ? 'capture' : 'place'); }
  X.make(m);
}
function playerMove(m) {
  hint = 0; sel = -1; targets = [];
  doMove(m); P.left--; render(); loop();
  const lm = X.legal(), chk = X.inCheck(1);
  if (!lm.length && chk) { setTimeout(solved, 420); return; }
  if (!lm.length) { setTimeout(() => fail('糟糕，黑王沒被將軍卻無路可走，這是「逼和」。'), 420); return; }
  if (chk) TB.sfx('check');
  if (P.left <= 0) { setTimeout(() => fail(chk ? '將軍了，可是黑王還能逃。' : '這步沒有將死黑王。'), 420); return; }
  busy = true; setMsg('黑方思考中<span class="think"></span>'); render();
  const plen = P.plies.length, st = X.state();
  AI.ask(Object.assign({ cmd: 'defend', n: P.left }, st)).then(res => {
    setTimeout(() => {
      busy = false;
      if (!P || P.plies.length !== plen) return;
      const escape = res.len > P.left;
      doMove(res.move); render(); loop();
      const t = P.plies[P.plies.length - 1].txt;
      if (escape) { setTimeout(() => fail('黑方走 ' + t + ' 就化解了。'), 300); return; }
      setMsg('黑方走 <b>' + t + '</b>。還剩 ' + P.left + ' 步！');
    }, 350);
  }).catch(() => { busy = false; render(); });
}
function solved() {
  P.solved = true;
  const s = P.hinted ? 1 : P.mistakes ? 2 : 3;
  const old = stars[P.id] || 0; if (s > old) { stars[P.id] = s; TB.store.set(PFX + ':stars', stars); }
  TB.bump('chess-puzzle', 'played'); TB.bump('chess-puzzle', 'won');
  let extra = '';
  if (P.daily) {
    const k = todayKey(), dd = TB.store.get(PFX + ':daily', {});
    if (!dd[k]) {
      dd[k] = s; TB.store.set(PFX + ':daily', dd);
      const st = TB.store.get(PFX + ':streak', { n: 0, last: '' });
      st.n = st.last === dkey(new Date(Date.now() - 864e5)) ? st.n + 1 : 1; st.last = k; TB.store.set(PFX + ':streak', st);
      extra = '<p>每日一題完成！連續 ' + st.n + ' 天。</p>';
    }
  }
  const line = P.plies.map((x, i) => (i % 2 ? '' : (i / 2 + 1) + '. ') + x.txt).join('　');
  setMsg('將死！' + '★'.repeat(s) + '☆'.repeat(3 - s), 'good'); render();
  TB.sfx('win');
  TB.dialog({ title: '將死了！', html: '<p style="font-size:28px;color:#f59e0b;margin:4px 0">' + '★'.repeat(s) + '<span style="color:#e5e7eb">' + '★'.repeat(3 - s) + '</span></p><p>' + line + '</p>' + extra +
    (s < 3 ? '<p style="font-size:13px">' + (P.hinted ? '用了提示只拿 1 顆星。' : '走錯 ' + P.mistakes + ' 次，拿 2 顆星。') + '不看提示、不走錯就有 3 顆星。</p>' : ''),
    buttons: [{ label: '看棋盤', value: 0 }, { label: nextLabel(), primary: true, value: 1 }] }).then(v => { if (v === 1) next(); });
}
function fail(why) { P.failed = true; P.mistakes++; TB.sfx('lose'); setMsg(why + ' 按「重來」再試一次。', 'bad'); render(); }
function nextLabel() { return P && P.daily ? '回題目列表' : '下一題'; }
function next() {
  if (!P || P.daily) { showMenu(); return; }
  let si = P.si, pi = P.pi + 1;
  if (pi >= CHP[si].list.length) { si++; pi = 0; }
  if (si >= CHP.length || !unlocked(si)) { showMenu(); TB.toast(si >= CHP.length ? '全部題目都看過了！' : '再多解幾題就能開下一組'); return; }
  start(si, pi);
}
function showSolution() {
  if (busy || showing) return;
  reset(); P.hinted = true; showing = true; setMsg('解答示範中…'); render();
  let i = 0;
  const stepFn = () => {
    if (!P || !showing) return;
    if (i >= P.line.length) { showing = false; setMsg('這就是解法。按「重來」自己走一次（用過提示只拿 1 顆星）。'); render(); return; }
    doMove(P.line[i]); if (i % 2 === 0) P.left--;
    if (X.inCheck(X.side)) TB.sfx('check');
    i++; render(); loop();
    setMsg('解答：' + P.plies.map(x => x.txt).join('　'));
    setTimeout(stepFn, 1100);
  };
  setTimeout(stepFn, 500);
}
function doHint() {
  if (busy || showing || P.solved || P.failed || X.side !== 0) return;
  P.hinted = true;
  const k = P.plies.length;
  if (P.plies.every((x, i) => x.m === P.line[i])) { hint = P.line[k]; setMsg('提示：' + san(hint) + '（用了提示只拿 1 顆星）'); TB.sfx('select'); render(); return; }
  busy = true; render();
  AI.ask(Object.assign({ cmd: 'mate', n: P.left, limit: 600000 }, X.state())).then(r => {
    busy = false; if (!P || P.plies.length !== k) return;
    if (r.moves && r.moves.length) { hint = r.moves[0]; setMsg('提示：' + san(hint) + '（用了提示只拿 1 顆星）'); TB.sfx('select'); }
    render();
  }).catch(() => { busy = false; render(); });
}

// ---------------- 畫面 ----------------
const cv = $('cv'), g = cv.getContext('2d'), play = $('play');
let U = 40, DPR = 1;
function layout() {
  if (!P) return;
  const W = play.clientWidth, H = play.clientHeight;
  const narrow = W < 720 || W < H * 1.05;
  document.body.classList.toggle('narrow', narrow);
  let aw, ah;
  if (narrow) { const used = $('pzT').closest('.card').offsetHeight + $('msg').offsetHeight + document.querySelector('.acts').offsetHeight + 16 + 24; aw = W - 16; ah = H - used; }
  else { aw = W - 24 - 290 - 20; ah = H - 24; }
  U = Math.max(24, Math.floor(Math.min(aw, ah) / 8));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = cv.style.height = U * 8 + 'px';
  cv.width = cv.height = Math.round(U * 8 * DPR);
  draw();
}
function sq2xy(sq) { const f = sq & 7, r = sq >> 4; return [f * U + U / 2, (7 - r) * U + U / 2]; }
function xy2sq(x, y) { const f = Math.floor(x / U), r = 7 - Math.floor(y / U); if (f < 0 || f > 7 || r < 0 || r > 7) return -1; return r * 16 + f; }
const LIGHT = '#eef5ff', DARK = '#9cc3f5';
function drawBoard() {
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { g.fillStyle = (r + f) & 1 ? DARK : LIGHT; g.fillRect(f * U, r * U, U, U); }
  g.font = '700 ' + Math.max(9, Math.round(U * 0.2)) + 'px "Noto Sans TC",sans-serif';
  for (let i = 0; i < 8; i++) {
    g.fillStyle = (7 + i) & 1 ? LIGHT : '#2563eb'; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
    g.fillText(String.fromCharCode(97 + i), i * U + U - U * 0.07, 8 * U - U * 0.07);
    g.fillStyle = i & 1 ? LIGHT : '#2563eb'; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(String(8 - i), U * 0.07, i * U + U * 0.06);
  }
}
function drawPiece(p, x, y, opt) {
  opt = opt || {};
  const t = p & 7, black = p >> 3, s = U / 100 * (opt.lift ? 1.08 : 1);
  g.save(); if (opt.alpha != null) g.globalAlpha = opt.alpha;
  g.translate(x - 50 * s, y - 50 * s - (opt.lift ? U * 0.08 : 0)); g.scale(s, s);
  g.shadowColor = 'rgba(15,23,42,.28)'; g.shadowBlur = opt.lift ? 14 : 5; g.shadowOffsetY = opt.lift ? 8 : 3;
  g.lineJoin = 'round'; g.lineWidth = 4;
  const fill = black ? '#1e293b' : '#ffffff', stroke = black ? '#0f172a' : '#1e293b';
  for (const pth of PATHS[t].body) { g.fillStyle = fill; g.fill(pth); }
  g.shadowColor = 'transparent'; g.strokeStyle = stroke; for (const pth of PATHS[t].body) g.stroke(pth);
  const det = black ? '#ffffff' : '#1e293b';
  if (PATHS[t].line) { g.strokeStyle = det; g.lineWidth = 3.5; g.lineCap = 'round'; g.stroke(PATHS[t].line); }
  if (SHAPE[t].dot) { g.fillStyle = det; g.beginPath(); g.arc(SHAPE[t].dot[0], SHAPE[t].dot[1], SHAPE[t].dot[2], 0, 7); g.fill(); }
  g.restore();
}
function shade(sq, color) { const [x, y] = sq2xy(sq); g.fillStyle = color; g.fillRect(x - U / 2, y - U / 2, U, U); }
function findKing(c) { for (let i = 0; i < 64; i++) { const sq = toSq(i); if (X.board[sq] === c * 8 + X.K) return sq; } return 0; }
function draw() {
  if (!P) return;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); drawBoard();
  const lm = P.plies[P.plies.length - 1];
  if (lm) { shade((lm.m >> 7) & 127, 'rgba(250,204,21,.42)'); shade(lm.m & 127, 'rgba(250,204,21,.55)'); }
  if (sel >= 0) shade(sel, 'rgba(59,130,246,.45)');
  let ap = 0; if (anim) { ap = Math.min(1, (performance.now() - anim.t0) / 220); if (ap >= 1) anim = null; }
  if (X.inCheck(X.side)) {
    const [x, y] = sq2xy(findKing(X.side));
    const gl = g.createRadialGradient(x, y, U * .1, x, y, U * .62); gl.addColorStop(0, 'rgba(244,63,94,.95)'); gl.addColorStop(1, 'rgba(244,63,94,0)');
    g.fillStyle = gl; g.fillRect(x - U / 2, y - U / 2, U, U);
  }
  if (hint) { shade(hint & 127, 'rgba(16,185,129,.55)'); shade((hint >> 7) & 127, 'rgba(16,185,129,.4)'); }
  let rookHide = -1, rookAnim = null;
  if (anim && anim.castle) { const to = anim.to, f = anim.from; const rf = to > f ? f + 3 : f - 4, rt = to > f ? f + 1 : f - 1; rookHide = rt; rookAnim = [rf, rt]; }
  for (let i = 0; i < 64; i++) {
    const sq = toSq(i), p = X.board[sq]; if (!p) continue;
    if (anim && (sq === anim.to || sq === rookHide)) continue;
    if (drag && drag.moved && sq === drag.sq) continue;
    const [x, y] = sq2xy(sq); drawPiece(p, x, y, { lift: sq === sel && !drag });
  }
  for (const t of targets) {
    const [x, y] = sq2xy(t);
    if (X.board[t] || ((X.board[sel] & 7) === X.P && (t & 7) !== (sel & 7))) { g.save(); g.beginPath(); g.arc(x, y, U * 0.46, 0, 7); g.lineWidth = U * 0.08; g.strokeStyle = 'rgba(37,99,235,.7)'; g.stroke(); g.restore(); }
    else { g.beginPath(); g.arc(x, y, U * 0.15, 0, 7); g.fillStyle = 'rgba(37,99,235,.55)'; g.fill(); }
  }
  if (anim) {
    const e = 1 - Math.pow(1 - ap, 3), [fx, fy] = sq2xy(anim.from), [tx, ty] = sq2xy(anim.to);
    if (anim.cap) drawPiece(anim.cap, tx, ty, { alpha: 1 - ap });
    if (rookAnim) { const [a, b] = rookAnim, [ax, ay] = sq2xy(a), [bx, by] = sq2xy(b); drawPiece(X.board[b], ax + (bx - ax) * e, ay + (by - ay) * e); }
    drawPiece(X.board[anim.to] || anim.p, fx + (tx - fx) * e, fy + (ty - fy) * e, { lift: ap < 1 });
  }
  if (drag && drag.moved) drawPiece(X.board[drag.sq], drag.x, drag.y - U * 0.12, { lift: true });
}
function loop() { draw(); if (anim) requestAnimationFrame(loop); }
function render() {
  if (!P) return;
  const s = CHP[P.si];
  $('pzT').textContent = P.daily ? '每日一題 · ' + todayKey() : s.name;
  $('pzH').textContent = (P.daily ? s.name + ' ' : '第 ') + (P.pi + 1) + (P.daily ? '' : ' 題') + '　' + (stars[P.id] ? '★'.repeat(stars[P.id]) : '');
  $('pzG').textContent = '白先 · ' + (P.n === 1 ? '一步殺' : P.n + ' 步內將死');
  let l = ''; for (let i = 0; i < P.n; i++) l += '<i class="' + (i < P.n - P.left ? 'used' : '') + '">' + (i + 1) + '</i>';
  $('pzL').innerHTML = l;
  $('bHint').disabled = busy || showing || P.solved || P.failed || X.side !== 0;
  $('bSol').disabled = busy || showing;
  $('bNext').textContent = nextLabel();
  draw();
}

// ---------------- 操作 ----------------
function canTouch() { return P && !P.solved && !P.failed && !busy && !anim && !showing && X.side === 0; }
function movesFrom(sq) { return X.legal().filter(m => (m & 127) === sq); }
function pickTargets(sq) { return [...new Set(movesFrom(sq).map(m => (m >> 7) & 127))]; }
function tryMove(from, to) {
  if (!targets.includes(to)) return false;
  const ms = movesFrom(from).filter(m => ((m >> 7) & 127) === to);
  sel = -1; targets = [];
  if (ms.length > 1) {
    draw();
    TB.dialog({ title: '兵升變', dismiss: false, html: '<p>要變成哪一種棋子？</p><div class="cs-promo">' +
      [5, 4, 3, 2].map(t => '<button data-t="' + t + '">' + pieceSVG(t) + PNAME[t] + '</button>').join('') + '</div>', buttons: [] });
    document.querySelector('.cs-promo').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      TB.closeDialog(); TB.sfx('click'); playerMove(ms.find(m => (m >> 14) === +b.dataset.t));
    });
  } else playerMove(ms[0]);
  return true;
}
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (!canTouch()) { if (P && P.failed) TB.toast('按「重來」再試一次'); return; }
  const [x, y] = evPos(e), sq = xy2sq(x, y);
  if (sq < 0) return;
  const p = X.board[sq];
  if (sel >= 0 && targets.includes(sq)) { tryMove(sel, sq); return; }
  if (p && (p >> 3) === 0) {
    sel = sq; targets = pickTargets(sq); TB.sfx('select');
    drag = { sq, x, y, x0: x, y0: y, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    draw();
  } else if (sel >= 0) { sel = -1; targets = []; draw(); }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const [x, y] = evPos(e); drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.x0, y - drag.y0) > U * 0.25) drag.moved = true;
  if (drag.moved) draw();
});
cv.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) { const [x, y] = evPos(e), sq = xy2sq(x, y); if (sq >= 0 && sq !== d.sq && targets.includes(sq)) { tryMove(d.sq, sq); return; } }
  draw();
});
cv.addEventListener('pointercancel', () => { drag = null; draw(); });
$('bRetry').onclick = () => { if (!P) return; TB.sfx('click'); const h = P.hinted, m = P.mistakes; reset(); P.hinted = h; P.mistakes = m; };
$('bHint').onclick = doHint;
$('bSol').onclick = showSolution;
$('bNext').onclick = next;
$('bMenu').onclick = showMenu;
$('bRule').onclick = () => TB.dialog({ title: '殺棋玩法', html: `<div class="tb-rules">
  <h4>目標</h4><p>每一題都是白方先走。在題目規定的步數內將死黑王（黑王被將軍而且怎麼走都逃不掉）就過關。</p>
  <h4>小心逼和</h4><p>如果黑王沒有被將軍、卻已經沒有任何合法步，就是「逼和」，算失敗。</p>
  <h4>黑方會抵抗</h4><p>黑方每一步都會選最難殺的應法。只要你的走法在步數內真的能殺，就算不是題目原本的解答也會過關。</p>
  <h4>星星</h4><ul><li>★★★ 一次就解開</li><li>★★ 中途走錯</li><li>★ 用了提示或看了解答</li></ul>
  <h4>每日一題</h4><p>每天會從題庫挑一題，週一最簡單、週末最難。</p>
  <p style="font-size:12px">題目由電腦產生，並用程式逐題驗證：保證有解、第一步只有一種，而且沒有更快的殺法。</p></div>`, buttons: [{ label: '知道了', primary: true }] });

addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(play);
const cur = TB.store.get(PFX + ':cur', null);
if (cur && CHP[cur.si] && CHP[cur.si].list[cur.pi]) start(cur.si, cur.pi, cur.daily); else renderMenu();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
</script>
</body>
