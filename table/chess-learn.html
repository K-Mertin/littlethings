<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>西洋棋教室 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#3b82f6;--accent-ink:#2563eb;--accent-soft:#eff6ff}
.tb-btn.primary{box-shadow:0 4px 12px rgba(59,130,246,.35)}
.tb-main{display:block;padding:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#toc{overflow:auto;-webkit-overflow-scrolling:touch}
.toc-in{max-width:1000px;margin:0 auto;padding:24px 16px calc(48px + env(safe-area-inset-bottom))}
.toc-hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;background:linear-gradient(135deg,#eff6ff,#f5f3ff);border-radius:24px;padding:22px}
.toc-hero h2{font-weight:900;font-size:clamp(28px,6vw,40px);letter-spacing:.04em;margin:0;background:linear-gradient(90deg,#2563eb,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.toc-hero p{margin:6px 0 0;color:var(--mute);max-width:52ch}
.toc-sum{margin-left:auto;font-size:14px;font-weight:700;color:var(--accent-ink);white-space:nowrap;min-width:200px}
.toc-prog{height:10px;border-radius:99px;background:#fff;margin-top:8px;overflow:hidden;box-shadow:inset 0 0 0 1px #bfdbfe}
.toc-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.toc-ch{--cc:#3b82f6;margin:28px 0 12px;font-weight:900;font-size:18px;letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.toc-ch::before{content:"";width:10px;height:22px;border-radius:99px;background:var(--cc)}
.c0{--cc:#3b82f6}.c1{--cc:#8b5cf6}.c2{--cc:#f43f5e}.c3{--cc:#f59e0b}.c4{--cc:#10b981}.c5{--cc:#0ea5e9}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.lc{display:flex;gap:14px;align-items:center;text-align:left;width:100%;appearance:none;border:2px solid transparent;background:var(--panel);border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s;font:inherit;color:inherit}
.lc:hover{border-color:var(--cc);transform:translateY(-2px)}
.lc .num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;background:var(--cc);color:#fff}
.lc.done .num{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--cc)}
.lc .tx{flex:1;min-width:0}
.lc b{display:block;font-size:17px}
.lc span{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.lc .stars{flex:none;font-size:16px;letter-spacing:1px;color:#f59e0b}
.lc .stars i{font-style:normal;color:#e5e7eb}
.grad{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px}
.grad a{text-decoration:none}
/* 上課 */
.ls{display:grid;grid-template-columns:minmax(300px,400px) 1fr;height:100%}
.pnl{display:flex;flex-direction:column;background:var(--panel);box-shadow:4px 0 24px rgba(17,24,39,.06);min-height:0;position:relative;z-index:1}
.pnl-scroll{flex:1;min-height:0;overflow:auto;padding:22px 22px 12px}
.ls-ch{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.ls-title{font-weight:900;font-size:26px;letter-spacing:.03em;margin:2px 0 10px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.dots i{width:10px;height:10px;border-radius:50%;background:#e5e7eb}
.dots i.q{border-radius:3px}
.dots i.on{background:var(--accent)}
.dots i.ok{background:var(--green)}
.ls-text{font-size:18px;line-height:1.75}
.ls-text b{color:var(--accent-ink)}
.ls-text ul{margin:6px 0;padding-left:22px}
.ls-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 12px;margin-bottom:8px}
.fb{margin-top:14px;border-radius:14px;padding:11px 15px;font-size:16px;line-height:1.6;display:none}
.fb.on{display:block;animation:tbpop .2s}
.fb.ok{background:#e7f9f1;color:#065f46;box-shadow:inset 4px 0 0 #10b981}
.fb.bad{background:#fff0f2;color:#9f1239;box-shadow:inset 4px 0 0 #f43f5e}
.fb.info{background:#eef6ff;color:#1e3a8a;box-shadow:inset 4px 0 0 #3b82f6}
.nav{flex:none;display:flex;gap:10px;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.nav .tb-btn{min-height:46px;font-size:16px;padding:8px 18px}
.nav .tb-btn.primary{flex:1}
.bwrap{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:14px}
#cv{display:block;touch-action:none;border-radius:16px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(59,130,246,.22)}
.done-card{text-align:center;padding:18px 4px}
.done-card .big{font-size:48px;letter-spacing:6px;color:#f59e0b;margin:8px 0}
.done-card .big i{font-style:normal;color:#e5e7eb}
.done-card h3{font-weight:900;font-size:26px;margin:4px 0}
.done-card .links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.done-card .links a{text-decoration:none}
/* 直向：棋盤在上、說明在下 */
@media (max-aspect-ratio:1/1){
  .ls{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .bwrap{order:-1;padding:8px;height:min(56vh,calc(100vw + 16px))}
  .pnl{box-shadow:0 -4px 24px rgba(17,24,39,.06)}
  .pnl-scroll{padding:12px 16px 8px}
  .ls-title{font-size:20px;margin:0 0 6px}
  .ls-text{font-size:16px;line-height:1.65}
  .dots{margin-bottom:8px}
  .nav{padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
  .nav .tb-btn{min-height:42px}
}
@media (max-height:500px) and (min-aspect-ratio:1/1){
  .pnl-scroll{padding:12px 16px 6px}.ls-title{font-size:20px;margin:0 0 4px}.ls-text{font-size:15px;line-height:1.6}.dots{margin-bottom:6px}
  .nav{padding:6px 16px calc(8px + env(safe-area-inset-bottom))}.nav .tb-btn{min-height:38px;padding:6px 14px}
  .ls{grid-template-columns:minmax(280px,1fr) auto}
}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html" id="back">← 棋牌</a>
  <h1 class="tb-title">西洋棋教室</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bToc" hidden>課程目錄</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<main class="tb-main">
  <div class="view on" id="toc"><div class="toc-in" id="tocIn"></div></div>
  <div class="view" id="lesson">
    <div class="ls">
      <div class="pnl">
        <div class="pnl-scroll" id="pnl"></div>
        <div class="nav"><button class="tb-btn" id="bPrev">上一步</button><button class="tb-btn" id="bHelp">提示</button><button class="tb-btn primary" id="bNext">下一步</button></div>
      </div>
      <div class="bwrap" id="bwrap"><canvas id="cv" aria-label="西洋棋盤"></canvas></div>
    </div>
  </div>
</main>
<script src="common.js"></script>
<script src="chess-logic.js"></script>
<script src="chess-lessons.js"></script>
<script>
'use strict';
const L0 = {}; CHLOGIC(L0); const X = L0.X;
const AI = TB.worker(CHLOGIC);
const PNAME = ['', '士兵', '騎士', '主教', '城堡', '皇后', '國王'];
const $ = id => document.getElementById(id);
const toSq = i => (i >> 3) * 16 + (i & 7);
// 棋子造型（和西洋棋、殺棋頁同一套）
const BASE = 'M24 74h52a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-52a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4Z';
const SHAPE = {
  1: { body: ['M62 28A12 12 0 1 1 38 28A12 12 0 1 1 62 28Z', 'M39 46Q50 38 61 46L66 74L34 74Z', BASE] },
  2: { body: ['M32 74C31 60 40 54 44 49L33 52C26 53 23 46 27 41L44 25L46 13L54 21C69 24 77 40 72 74Z', BASE], dot: [54, 32, 3] },
  3: { body: ['M55 14A5 5 0 1 1 45 14A5 5 0 1 1 55 14Z', 'M50 20C68 32 66 52 59 60L41 60C34 52 32 32 50 20Z', 'M38 60h24v6h-24Z', 'M40 66L60 66L64 74L36 74Z', BASE], line: 'M55 33L45 45' },
  4: { body: ['M33 46L67 46L69 74L31 74Z', 'M28 18h9v8h7.5v-8h11v8h7.5v-8h9v28h-44Z', BASE], line: 'M33 46h34' },
  5: { body: ['M30 74L22 32L37 54L38 26L47 52L50 22L53 52L62 26L63 54L78 32L70 74Z',
    'M26 30A4 4 0 1 1 18 30A4 4 0 1 1 26 30Z', 'M42 24A4 4 0 1 1 34 24A4 4 0 1 1 42 24Z', 'M54 19A4 4 0 1 1 46 19A4 4 0 1 1 54 19Z', 'M66 24A4 4 0 1 1 58 24A4 4 0 1 1 66 24Z', 'M82 30A4 4 0 1 1 74 30A4 4 0 1 1 82 30Z', BASE], line: 'M30 64Q50 58 70 64' },
  6: { body: ['M47 8h6v7h7v6h-7v9h-6v-9h-7v-6h7Z', 'M30 74L25 44C35 34 65 34 75 44L70 74Z', BASE], line: 'M28 60Q50 54 72 60' },
};
const PATHS = {}; for (const t in SHAPE) PATHS[t] = { body: SHAPE[t].body.map(d => new Path2D(d)), line: SHAPE[t].line ? new Path2D(SHAPE[t].line) : null };

const LESSONS = []; CHL.forEach((c, ci) => c.lessons.forEach(l => LESSONS.push(Object.assign({ ci, chName: c.ch }, l))));
let done = TB.store.get('chl:done', {});
let cur = null;   // {li, si, mistakes, hinted, stepOk:[]}
let S = null;     // 目前步驟：{o(局面), found, wrong, sel, targets, plies, left, solved, failed, busy, hint, marks, arrows}

// ---------------- 目錄 ----------------
function renderToc() {
  const n = LESSONS.length, d = LESSONS.filter(l => done[l.id]).length, st = Object.values(done).reduce((a, b) => a + b, 0);
  let h = `<div class="toc-hero"><div><h2>西洋棋教室</h2><p>從每顆棋子怎麼走開始，學到入堡、升變、將死和常見戰術。每一課都有互動練習，大約 3～5 分鐘。</p></div>
    <div class="toc-sum">完成 ${d} / ${n} 課 · ★ ${st} / ${n * 3}<div class="toc-prog"><i style="width:${(d / n * 100).toFixed(1)}%"></i></div></div></div>`;
  let k = 0;
  CHL.forEach((c, ci) => {
    h += `<div class="toc-ch c${ci}">${c.ch}</div><div class="toc-grid c${ci}">`;
    c.lessons.forEach(l => {
      k++; const s = done[l.id] || 0;
      h += `<button class="lc${s ? ' done' : ''}" data-id="${l.id}"><span class="num">${k}</span><span class="tx"><b>${l.name}</b><span>${l.sub}</span></span><span class="stars">${'★'.repeat(s)}<i>${'★'.repeat(3 - s)}</i></span></button>`;
    });
    h += '</div>';
  });
  h += `<div class="grad"><a class="tb-btn" href="chess.html">♟ 跟電腦下西洋棋</a><a class="tb-btn" href="chess-puzzle.html">🎯 西洋棋殺棋</a></div>`;
  $('tocIn').innerHTML = h;
  $('tocIn').querySelectorAll('.lc').forEach(b => b.onclick = () => { TB.sfx('click'); openLesson(LESSONS.findIndex(l => l.id === b.dataset.id)); });
}
function showToc() {
  if (S && S.busy) AI.kill();
  cur = null; S = null; TB.store.del('chl:cur');
  $('toc').classList.add('on'); $('lesson').classList.remove('on'); $('bToc').hidden = true; $('back').hidden = false;
  renderToc();
}

// ---------------- 上課 ----------------
function openLesson(li, si) {
  cur = { li, si: si || 0, mistakes: 0, hinted: false, stepOk: [] };
  $('toc').classList.remove('on'); $('lesson').classList.add('on'); $('bToc').hidden = false; $('back').hidden = true;
  loadStep();
}
const lesson = () => LESSONS[cur.li], step = () => lesson().steps[cur.si];
const isQ = st => st.t !== 'text';
const sqs = a => (a || []).map(chlSq);
function loadStep() {
  if (S && S.busy) AI.kill();
  const st = step();
  TB.store.set('chl:cur', { li: cur.li, si: cur.si });
  S = { o: chlParse(st, X.fen), found: new Set(), wrong: new Set(), sel: -1, targets: [], plies: [], left: st.n || 0, solved: !isQ(st), failed: false, busy: false, hint: 0,
    marks: sqs(st.marks), arrows: (st.arrows || []).map(a => [chlSq(a[0]), chlSq(a[1])]) };
  X.init(S.o);
  if (cur.stepOk[cur.si]) S.solved = true;
  const hb = $('bHelp'); hb.textContent = '提示'; hb.onclick = helpFn;
  if (st.t === 'targets') {
    S.sel = chlSq(st.sq); S.need = new Set(X.legal().filter(m => chlFrom(m) === S.sel).map(chlTo));
    if (cur.stepOk[cur.si]) S.found = new Set(S.need);
  }
  renderPanel(); layout();
}
function feedback(kind, html) { const f = $('fb'); if (!f) return; f.className = 'fb on ' + kind; f.innerHTML = html; }
function renderPanel() {
  const l = lesson(), st = step();
  let dots = ''; l.steps.forEach((s, i) => dots += `<i class="${isQ(s) ? 'q' : ''}${cur.stepOk[i] ? ' ok' : i === cur.si ? ' on' : ''}"></i>`);
  let h = `<div class="ls-ch">${l.chName}</div><div class="ls-title">${l.name}</div><div class="dots">${dots}</div>`;
  if (st.t !== 'text') h += `<span class="ls-tag">${{ tap: '點點看', targets: '找出所有走法', move: '走走看', mate: st.n === 1 ? '一步將死' : st.n + ' 步將死', line: '跟著走' }[st.t]}</span>`;
  h += `<div class="ls-text">${st.t === 'text' ? st.h : st.q}</div><div class="fb" id="fb"></div>`;
  $('pnl').innerHTML = h;
  if (S.solved && isQ(st)) feedback('ok', '✓ ' + (st.ok || '完成！'));
  else if (st.t === 'targets') feedback('info', '已找到 ' + S.found.size + ' / ' + S.need.size + ' 格');
  else if (st.t === 'mate' && st.n > 1) feedback('info', '白先，' + st.n + ' 步內將死黑王。黑方會盡量逃。');
  else if (st.t === 'line') feedback('info', st.notes[0]);
  updNav();
}
function updNav() {
  const st = step(), last = cur.si === lesson().steps.length - 1;
  $('bPrev').disabled = cur.si === 0;
  $('bHelp').hidden = !isQ(st) || st.t === 'tap';
  $('bHelp').disabled = S.solved || S.busy;
  $('bNext').disabled = !S.solved;
  $('bNext').textContent = last ? '完成這一課' : isQ(st) && !S.solved ? '先完成練習' : '下一步';
}
function okStep(msg) {
  S.solved = true; cur.stepOk[cur.si] = true; TB.sfx('win');
  feedback('ok', '✓ ' + (msg || step().ok || '答對了！')); renderDots(); updNav(); draw();
}
function renderDots() { const ds = $('pnl').querySelectorAll('.dots i'); ds.forEach((d, i) => { d.classList.toggle('ok', !!cur.stepOk[i]); d.classList.toggle('on', i === cur.si && !cur.stepOk[i]); }); }
function miss(msg) { cur.mistakes++; TB.sfx('bad'); feedback('bad', msg); }
function finishLesson() {
  const l = lesson(), s = cur.hinted ? 1 : cur.mistakes ? 2 : 3;
  if ((done[l.id] || 0) < s) { done[l.id] = s; TB.store.set('chl:done', done); }
  TB.bump('chess-learn', 'played'); TB.sfx('win');
  const nextL = LESSONS[cur.li + 1];
  $('pnl').innerHTML = `<div class="done-card"><div class="ls-ch">${l.chName}</div><h3>「${l.name}」完成！</h3><div class="big">${'★'.repeat(s)}<i>${'★'.repeat(3 - s)}</i></div>
    <p style="color:var(--mute)">${s === 3 ? '全部一次答對，太厲害了！' : cur.hinted ? '用了提示拿 1 顆星，再挑戰一次拿滿三顆星吧。' : '有幾題走錯，再練一次就能拿滿三顆星。'}</p>
    ${nextL ? `<p>下一課：<b>${nextL.name}</b></p>` : '<p>🎓 全部課程都上完了，恭喜畢業！</p><div class="links"><a class="tb-btn primary" href="chess.html">跟電腦下一盤</a><a class="tb-btn" href="chess-puzzle.html">挑戰西洋棋殺棋</a></div>'}</div>`;
  $('bPrev').disabled = false; $('bHelp').hidden = true; $('bNext').disabled = false;
  $('bNext').textContent = nextL ? '下一課' : '回目錄';
  cur.finished = true;
}
$('bNext').onclick = () => {
  TB.sfx('click');
  if (cur.finished) { if (LESSONS[cur.li + 1]) openLesson(cur.li + 1); else showToc(); return; }
  if (!S.solved) return;
  if (cur.si < lesson().steps.length - 1) { cur.si++; loadStep(); } else finishLesson();
};
$('bPrev').onclick = () => { TB.sfx('click'); if (cur.finished) { cur.finished = false; loadStep(); return; } if (cur.si > 0) { cur.si--; loadStep(); } };
$('bToc').onclick = () => { TB.sfx('click'); showToc(); };
function helpFn() {
  const st = step(); if (!S || S.solved || S.busy) return;
  cur.hinted = true; TB.sfx('select');
  X.init(S.o);
  if (st.t === 'targets') { const left = [...S.need].filter(x => !S.found.has(x)); S.hintSq = left[0]; feedback('info', '提示：看看發亮的那一格。（用了提示這課只拿 1 顆星）'); draw(); return; }
  if (st.t === 'line') { const k = S.plies.length; S.hint = X.legal().find(m => chlUci(m).startsWith(st.moves[k])); draw(); feedback('info', '照箭頭走。'); return; }
  if (st.t === 'mate') {
    S.busy = true; updNav();
    AI.ask(Object.assign({ cmd: 'mate', n: S.left, limit: 600000 }, S.o)).then(r => {
      if (!S) return; S.busy = false;
      if (r.moves && r.moves.length) { S.hint = r.moves[0]; X.init(S.o); feedback('info', '提示：' + desc(S.hint) + '（用了提示這課只拿 1 顆星）'); }
      updNav(); draw();
    });
    return;
  }
  if (st.t === 'move') {
    const m = X.legal().find(m => chlGoalOk(X, st, m));
    if (m) { S.hint = m; draw(); feedback('info', '提示：' + desc(m) + '（用了提示這課只拿 1 顆星）'); }
  }
}
// 用中文描述一步棋（X 必須是走之前的局面）
function desc(m) {
  const f = chlFrom(m), to = chlTo(m), p = X.board[f], t = p & 7, cap = X.board[to];
  if (t === X.K && Math.abs((to & 7) - (f & 7)) === 2) return (to > f ? '王翼' : '后翼') + '入堡';
  return PNAME[t] + ' ' + chlName(f) + ' → ' + chlName(to) + (cap ? '（吃' + PNAME[cap & 7] + '）' : '') + (chlPr(m) ? '（升變）' : '');
}
// 玩家走子時：同一格有多種升變，預設選皇后
function pickMove(from, to) {
  X.init(S.o);
  const ms = X.legal().filter(m => chlFrom(m) === from && chlTo(m) === to);
  return ms.find(m => chlPr(m) === X.Q) || ms[0] || 0;
}
function applyMove(m, quiet) {
  X.init(S.o);
  const f = chlFrom(m), to = chlTo(m), p = X.board[f];
  let cap = X.board[to]; if ((p & 7) === X.P && (f & 7) !== (to & 7) && !cap) cap = X.board[to + (X.side ? 16 : -16)];
  const txt = desc(m);
  S.plies.push({ m, txt });
  if (!quiet) { S.anim = { p, from: f, to, cap, castle: (p & 7) === X.K && Math.abs((to & 7) - (f & 7)) === 2, t0: performance.now() }; TB.sfx(cap ? 'capture' : 'place'); }
  X.make(m); S.o = X.state(); S.hint = 0;
  loop();
  return txt;
}
function playerMove(m) {
  const st = step(); S.sel = -1; S.targets = [];
  X.init(S.o);
  if (st.t === 'move') {
    if (!chlGoalOk(X, st, m)) { miss(wrongMove(st, m)); draw(); return; }
    applyMove(m); okStep(); return;
  }
  if (st.t === 'line') {
    const k = S.plies.length;
    if (!chlUci(m).startsWith(st.moves[k])) { X.init(S.o); const exp = X.legal().find(x => chlUci(x).startsWith(st.moves[k])); miss('這一課先照著標準走法：' + desc(exp) + '。按「提示」會畫出箭頭。'); draw(); return; }
    applyMove(m);
    if (k + 1 >= st.moves.length) { okStep(); return; }
    S.busy = true; updNav();
    setTimeout(() => {
      if (!S) return;
      X.init(S.o); const rm = X.legal().find(x => chlUci(x).startsWith(st.moves[k + 1]));
      const txt = applyMove(rm); S.busy = false;
      if (k + 2 >= st.moves.length) { okStep(); return; }
      feedback('info', '黑方走「' + txt + '」。' + (st.notes[(k + 2) / 2] || '')); updNav();
    }, 650);
    return;
  }
  if (st.t === 'mate') {
    applyMove(m); S.left--;
    X.init(S.o);
    const lm = X.legal();
    if (!lm.length) {
      if (X.inCheck(X.side)) { okStep('將死了！' + (st.ok || '')); return; }
      cur.mistakes++; TB.sfx('lose'); S.failed = true; feedback('bad', '糟糕，黑王沒有被將軍、又不能動——這是<b>逼和</b>，算平手！按「重來」再試一次。'); setRetry(); return;
    }
    if (S.left <= 0) { cur.mistakes++; TB.sfx('lose'); S.failed = true; feedback('bad', X.inCheck(X.side) ? '將軍了，可是黑王還能逃。按「重來」再試一次。' : '這步沒有將死黑王。按「重來」再試一次。'); setRetry(); return; }
    if (X.inCheck(X.side)) TB.sfx('check');
    S.busy = true; updNav(); feedback('info', '黑方思考中…');
    AI.ask(Object.assign({ cmd: 'defend', n: S.left }, S.o)).then(res => {
      setTimeout(() => {
        if (!S) return; S.busy = false;
        const txt = applyMove(res.move);
        if (res.len > S.left) { cur.mistakes++; S.failed = true; TB.sfx('lose'); feedback('bad', '黑方走「' + txt + '」就逃掉了。按「重來」再試一次。'); setRetry(); return; }
        feedback('info', '黑方走「' + txt + '」。還剩 ' + S.left + ' 步，繼續！'); updNav();
      }, 350);
    });
  }
}
function wrongMove(st, m) {
  const f = chlFrom(m), t = X.board[f] & 7;
  switch (st.goal) {
    case 'capture': return '不是這步喔，要' + (st.sq ? '吃掉 ' + st.sq + ' 的棋子' : '吃子') + '。';
    case 'check': return '這步沒有將軍喔，再試一次。';
    case 'castle': return '入堡要拖<b>國王</b>往城堡那邊走兩格。';
    case 'ep': return '提示：用士兵斜斜走到黑兵<b>後面</b>那一格。';
    case 'promo': return '把士兵走到最後一列就能升變。';
    case 'king': return t === X.K ? '這一格不安全喔。' : '這次要讓<b>國王</b>逃走。';
    case 'block': return t === X.K ? '這次不要逃，用別的棋子<b>擋</b>在中間。' : '這步擋不住將軍喔。';
  }
  return '不是這步喔，再想想看。';
}
function setRetry() {
  updNav(); const b = $('bHelp'); b.hidden = false; b.disabled = false; b.textContent = '重來';
  b.onclick = () => { b.textContent = '提示'; b.onclick = helpFn; loadStep(); };
}

// ---------------- 畫面 ----------------
const cv = $('cv'), g = cv.getContext('2d'), bwrap = $('bwrap');
let U = 40, DPR = 1;
function layout() {
  if (!S) return;
  const W = bwrap.clientWidth - 16, H = bwrap.clientHeight - 16;
  U = Math.max(24, Math.floor(Math.min(W, H) / 8));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = cv.style.height = U * 8 + 'px';
  cv.width = cv.height = Math.round(U * 8 * DPR);
  draw();
}
function sq2xy(sq) { const f = sq & 7, r = sq >> 4; return [f * U + U / 2, (7 - r) * U + U / 2]; }
function xy2sq(x, y) { const f = Math.floor(x / U), r = 7 - Math.floor(y / U); if (f < 0 || f > 7 || r < 0 || r > 7) return -1; return r * 16 + f; }
const LIGHT = '#eef5ff', DARK = '#9cc3f5';
function drawBoard() {
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { g.fillStyle = (r + f) & 1 ? DARK : LIGHT; g.fillRect(f * U, r * U, U, U); }
  g.font = '700 ' + Math.max(10, Math.round(U * 0.22)) + 'px "Noto Sans TC",sans-serif';
  for (let i = 0; i < 8; i++) {
    g.fillStyle = (7 + i) & 1 ? LIGHT : '#2563eb'; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
    g.fillText(String.fromCharCode(97 + i), i * U + U - U * 0.07, 8 * U - U * 0.07);
    g.fillStyle = i & 1 ? LIGHT : '#2563eb'; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(String(8 - i), U * 0.07, i * U + U * 0.06);
  }
}
function drawPiece(p, x, y, opt) {
  opt = opt || {};
  const t = p & 7, black = p >> 3, s = U / 100 * (opt.lift ? 1.08 : 1);
  g.save(); if (opt.alpha != null) g.globalAlpha = opt.alpha;
  g.translate(x - 50 * s, y - 50 * s - (opt.lift ? U * 0.08 : 0)); g.scale(s, s);
  g.shadowColor = 'rgba(15,23,42,.28)'; g.shadowBlur = opt.lift ? 14 : 5; g.shadowOffsetY = opt.lift ? 8 : 3;
  g.lineJoin = 'round'; g.lineWidth = 4;
  const fill = black ? '#1e293b' : '#ffffff', stroke = black ? '#0f172a' : '#1e293b';
  for (const pth of PATHS[t].body) { g.fillStyle = fill; g.fill(pth); }
  g.shadowColor = 'transparent'; g.strokeStyle = stroke; for (const pth of PATHS[t].body) g.stroke(pth);
  const det = black ? '#ffffff' : '#1e293b';
  if (PATHS[t].line) { g.strokeStyle = det; g.lineWidth = 3.5; g.lineCap = 'round'; g.stroke(PATHS[t].line); }
  if (SHAPE[t].dot) { g.fillStyle = det; g.beginPath(); g.arc(SHAPE[t].dot[0], SHAPE[t].dot[1], SHAPE[t].dot[2], 0, 7); g.fill(); }
  g.restore();
}
function shade(sq, color) { const [x, y] = sq2xy(sq); g.fillStyle = color; g.fillRect(x - U / 2, y - U / 2, U, U); }
function dot(sq, color, rr) { const [x, y] = sq2xy(sq); g.beginPath(); g.arc(x, y, U * (rr || 0.16), 0, 7); g.fillStyle = color; g.fill(); }
function ring(sq, color) { const [x, y] = sq2xy(sq); g.save(); g.beginPath(); g.arc(x, y, U * 0.46, 0, 7); g.lineWidth = U * 0.08; g.strokeStyle = color; g.stroke(); g.restore(); }
function arrow(f, to, color) {
  const [fx, fy] = sq2xy(f), [tx, ty] = sq2xy(to);
  g.save(); g.strokeStyle = g.fillStyle = color; g.lineWidth = U * 0.14; g.lineCap = 'round';
  const ang = Math.atan2(ty - fy, tx - fx), ex = tx - Math.cos(ang) * U * 0.32, ey = ty - Math.sin(ang) * U * 0.32;
  g.beginPath(); g.moveTo(fx, fy); g.lineTo(ex, ey); g.stroke();
  g.beginPath(); g.moveTo(tx, ty); g.lineTo(ex - Math.cos(ang - 0.5) * U * 0.32, ey - Math.sin(ang - 0.5) * U * 0.32); g.lineTo(ex - Math.cos(ang + 0.5) * U * 0.32, ey - Math.sin(ang + 0.5) * U * 0.32); g.closePath(); g.fill(); g.restore();
}
function findKing(o, c) { for (let i = 0; i < 64; i++) if (o.board[i] === c * 8 + 6) return toSq(i); return -1; }
function draw() {
  if (!S) return;
  const st = step(), o = S.o;
  g.setTransform(DPR, 0, 0, DPR, 0, 0); drawBoard();
  const t = performance.now(), pulse = 0.55 + 0.45 * Math.sin(t / 260);
  for (const m of S.marks) shade(m, 'rgba(249,115,22,.38)');
  const lm = S.plies[S.plies.length - 1];
  if (lm) { shade(chlFrom(lm.m), 'rgba(250,204,21,.42)'); shade(chlTo(lm.m), 'rgba(250,204,21,.55)'); }
  if (S.sel >= 0 && st.t !== 'targets') shade(S.sel, 'rgba(59,130,246,.45)');
  if (st.t === 'targets') shade(S.sel, 'rgba(245,158,11,.45)');
  X.init(o);
  if (X.inCheck(o.side)) {
    const ks = findKing(o, o.side); if (ks >= 0) { const [x, y] = sq2xy(ks);
      const gl = g.createRadialGradient(x, y, U * .1, x, y, U * .62); gl.addColorStop(0, 'rgba(244,63,94,.95)'); gl.addColorStop(1, 'rgba(244,63,94,0)');
      g.fillStyle = gl; g.fillRect(x - U / 2, y - U / 2, U, U); }
  }
  if (S.hint) { shade(chlFrom(S.hint), 'rgba(16,185,129,.4)'); shade(chlTo(S.hint), 'rgba(16,185,129,.55)'); }
  let ap = 0; if (S.anim) { ap = Math.min(1, (t - S.anim.t0) / 220); if (ap >= 1) S.anim = null; }
  let rookHide = -1, rookAnim = null;
  if (S.anim && S.anim.castle) { const to = S.anim.to, f = S.anim.from; const rf = to > f ? f + 3 : f - 4, rt = to > f ? f + 1 : f - 1; rookHide = rt; rookAnim = [rf, rt]; }
  for (let i = 0; i < 64; i++) {
    const sq = toSq(i), p = o.board[i]; if (!p) continue;
    if (S.anim && (sq === S.anim.to || sq === rookHide)) continue;
    if (S.drag && S.drag.moved && sq === S.drag.sq) continue;
    const [x, y] = sq2xy(sq); drawPiece(p, x, y, { lift: sq === S.sel && st.t !== 'targets' && !S.drag });
  }
  if (st.t === 'targets') {
    for (const q of S.found) o.board[(q >> 4) * 8 + (q & 7)] ? ring(q, '#10b981') : dot(q, '#10b981', 0.2);
    for (const q of S.wrong) dot(q, 'rgba(244,63,94,.8)', 0.13);
    if (S.hintSq != null && !S.found.has(S.hintSq)) { const [x, y] = sq2xy(S.hintSq); g.save(); g.globalAlpha = pulse; g.strokeStyle = '#f59e0b'; g.lineWidth = U * 0.08; g.beginPath(); g.arc(x, y, U * 0.3, 0, 7); g.stroke(); g.restore(); }
  } else {
    for (const q of S.targets) { const occ = o.board[(q >> 4) * 8 + (q & 7)] || ((o.board[(S.sel >> 4) * 8 + (S.sel & 7)] & 7) === 1 && (q & 7) !== (S.sel & 7)); occ ? ring(q, 'rgba(37,99,235,.7)') : dot(q, 'rgba(37,99,235,.55)'); }
  }
  for (const [a, b] of S.arrows) arrow(a, b, 'rgba(249,115,22,.85)');
  if (S.hint) arrow(chlFrom(S.hint), chlTo(S.hint), 'rgba(16,185,129,.9)');
  if (S.anim) {
    const e = 1 - Math.pow(1 - ap, 3), [fx, fy] = sq2xy(S.anim.from), [tx, ty] = sq2xy(S.anim.to);
    if (S.anim.cap) drawPiece(S.anim.cap, tx, ty, { alpha: 1 - ap });
    if (rookAnim) { const [a, b] = rookAnim, [ax, ay] = sq2xy(a), [bx, by] = sq2xy(b); drawPiece(o.board[(b >> 4) * 8 + (b & 7)], ax + (bx - ax) * e, ay + (by - ay) * e); }
    drawPiece(o.board[(S.anim.to >> 4) * 8 + (S.anim.to & 7)] || S.anim.p, fx + (tx - fx) * e, fy + (ty - fy) * e, { lift: ap < 1 });
  }
  if (S.drag && S.drag.moved) drawPiece(o.board[(S.drag.sq >> 4) * 8 + (S.drag.sq & 7)], S.drag.x, S.drag.y - U * 0.12, { lift: true });
  if (S.anim || (st.t === 'targets' && S.hintSq != null && !S.solved)) requestAnimationFrame(draw);
}
function loop() { draw(); }

// ---------------- 操作 ----------------
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
const pieceAt = sq => S.o.board[(sq >> 4) * 8 + (sq & 7)];
function canMove() { const st = step(); return S && !S.solved && !S.failed && !S.busy && !S.anim && S.o.side === 0 && (st.t === 'move' || st.t === 'mate' || st.t === 'line'); }
cv.addEventListener('pointerdown', e => {
  if (!S) return;
  const st = step(), [x, y] = evPos(e), sq = xy2sq(x, y);
  if (sq < 0) return;
  if (st.t === 'tap') {
    if (S.solved) return;
    if (st.ans.map(chlSq).includes(sq)) { S.marks = [sq]; okStep(); } else { S.marks = [sq]; miss('這是 <b>' + chlName(sq) + '</b>，不是 ' + st.ans[0] + ' 喔。先找字母（行），再找數字（列）。'); draw(); }
    return;
  }
  if (st.t === 'targets') {
    if (S.solved || sq === S.sel) return;
    if (S.need.has(sq)) { if (!S.found.has(sq)) { S.found.add(sq); TB.sfx('select'); S.wrong.delete(sq); } }
    else { if (!S.wrong.has(sq)) { S.wrong.add(sq); miss(whyNot(st, sq)); } }
    if (S.found.size === S.need.size) okStep(); else if (!S.wrong.has(sq)) feedback('info', '已找到 ' + S.found.size + ' / ' + S.need.size + ' 格');
    draw(); return;
  }
  if (!canMove()) return;
  const p = pieceAt(sq);
  if (S.sel >= 0 && S.targets.includes(sq)) { const m = pickMove(S.sel, sq); if (m) playerMove(m); return; }
  if (p && p < 8) {
    X.init(S.o); S.sel = sq; S.targets = [...new Set(X.legal().filter(m => chlFrom(m) === sq).map(chlTo))]; TB.sfx('select');
    S.drag = { sq, x, y, x0: x, y0: y, moved: false }; try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    draw();
  } else if (S.sel >= 0) { S.sel = -1; S.targets = []; draw(); }
});
cv.addEventListener('pointermove', e => {
  if (!S || !S.drag) return;
  const [x, y] = evPos(e); S.drag.x = x; S.drag.y = y;
  if (!S.drag.moved && Math.hypot(x - S.drag.x0, y - S.drag.y0) > U * 0.25) S.drag.moved = true;
  if (S.drag.moved) draw();
});
cv.addEventListener('pointerup', e => {
  if (!S || !S.drag) return;
  const d = S.drag; S.drag = null;
  if (d.moved) { const [x, y] = evPos(e), sq = xy2sq(x, y); if (sq >= 0 && sq !== d.sq && S.targets.includes(sq)) { const m = pickMove(d.sq, sq); if (m) { playerMove(m); return; } } }
  draw();
});
cv.addEventListener('pointercancel', () => { if (S) { S.drag = null; draw(); } });
function whyNot(st, sq) {
  const from = S.sel, p = pieceAt(from), t = p & 7, q = pieceAt(sq);
  const fr = from >> 4, fc = from & 7, tr = sq >> 4, tc = sq & 7, dr = tr - fr, dc = tc - fc;
  if (q && (q >> 3) === (p >> 3)) return '那裡是自己的棋子，不能走過去。';
  if (t === 6 && Math.abs(dr) <= 1 && Math.abs(dc) <= 1) return '那一格會被對方吃掉，國王不能走進危險的地方。';
  if (t === 2) return '騎士要走 L 形：直走兩格再轉彎一格。';
  if (t === 1) return '士兵只能往前走，吃東西才斜著走。';
  if ((t === 4 || t === 5) && (dr === 0 || dc === 0) || (t === 3 || t === 5) && Math.abs(dr) === Math.abs(dc)) return '那個方向中間有棋子擋住了。';
  if (t === 3) return '主教只能走斜線。';
  if (t === 4) return '城堡只能直走或橫走。';
  return '這顆棋子走不到那裡喔。';
}

addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(bwrap);
renderToc();
const sv = TB.store.get('chl:cur', null);
if (sv && LESSONS[sv.li] && LESSONS[sv.li].steps[sv.si]) openLesson(sv.li, sv.si);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
</script>
</body>
