<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>數獨 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--accent:#6366f1;--accent-ink:#4338ca;--accent-soft:#eef0ff}
.tb-main{padding:10px 10px calc(10px + env(safe-area-inset-bottom));align-items:stretch}
.wrap{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px}
.hud{display:flex;align-items:center;gap:8px;width:var(--bw);flex:none;font-size:14px;order:-1}
.hud .chip{background:var(--panel);border-radius:999px;padding:5px 12px;box-shadow:var(--shadow);font-weight:700;white-space:nowrap}
.hud .chip small{font-weight:500;color:var(--mute);margin-right:5px}
.hud .sp{flex:1}
.hud .tm{font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.board{width:var(--bw);height:var(--bw);flex:none;display:grid;background:var(--panel);border-radius:16px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 16px 40px rgba(99,102,241,.18);
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;border:3px solid #312e81}
.c{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.58);font-weight:500;color:var(--accent-ink);cursor:pointer;
  border-right:1px solid #dfe3ee;border-bottom:1px solid #dfe3ee;background:#fff;transition:background .12s}
.c.br{border-right:2.5px solid #312e81}.c.bb{border-bottom:2.5px solid #312e81}
.c.g{color:#111827;font-weight:700}
.c.peer{background:#f1f3ff}
.c.same{background:#dfe2ff}
.c.sel{background:#c7cbff}
.c.bad{color:#f43f5e}
.c.bad.sel,.c.bad.same{color:#e11d48}
.c.hint{animation:hint 1.4s ease}
@keyframes hint{0%,60%{background:#fde68a}100%{}}
.c.win{animation:win .7s ease both}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(.82);background:#c7d2fe}100%{transform:scale(1)}}
.c.pop{animation:pop .2s ease}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.notes{position:absolute;inset:6%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:calc(var(--cs)*.24);font-weight:500;color:#6b7280;line-height:1}
.notes.six{grid-template-rows:repeat(2,1fr)}
.notes span{display:flex;align-items:center;justify-content:center}
.notes span.hl{color:#fff;background:var(--accent);border-radius:4px}
.pad{width:var(--bw);flex:none;display:flex;flex-direction:column;gap:8px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tools button{appearance:none;border:0;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:500;color:var(--mute);min-height:52px;position:relative}
.tools button i{font-style:normal;font-size:20px;line-height:1.2;color:var(--ink)}
.tools button.on{background:var(--accent);color:#fff}.tools button.on i{color:#fff}
.tools button .badge{position:absolute;top:4px;right:8px;font-size:10px;font-weight:700;background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.tools button.on .badge{background:#fff}
.tools button:active,.nums button:active{transform:scale(.95)}
.nums{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.nums.six{grid-template-columns:repeat(6,1fr)}
.nums button{appearance:none;border:0;background:var(--panel);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;font-size:clamp(20px,calc(var(--bw)/14),30px);font-weight:700;color:var(--accent-ink);
  padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.nums button small{font-size:11px;font-weight:500;color:var(--mute)}
.nums button.done{opacity:.3}
.nums.note button{color:var(--mute);font-weight:500}
@media (min-aspect-ratio:5/4){
  .wrap{flex-direction:row;justify-content:center;align-items:center;gap:22px}
  .side{display:flex;flex-direction:column;gap:12px;width:min(320px,34vw)}
  .side .hud,.side .pad{width:100%}
  .side .nums{grid-template-columns:repeat(3,1fr)}
  .side .nums button{font-size:28px;padding:10px 0 6px}
  .side .tools button{min-height:58px}
}
.side{display:contents}
@media (min-aspect-ratio:5/4){.side{display:flex}}

<script src="common.js"></script>
<script>
'use strict';
// ======================================================================
// 數獨核心：解題、計算解的個數、產生題目、依技巧評難度、找提示。
// 同一份程式在主畫面（提示）和 Web Worker（產生題目）兩邊都用。
// 盤面是長度 n*n 的陣列，0 = 空格；n = 9（3x3 宮）或 6（2 列 x 3 行的宮）。
// ======================================================================
function SUDOKU(self) {
  const geo = {};
  function G(n) {
    if (geo[n]) return geo[n];
    const br = n === 9 ? 3 : 2, bc = 3, N = n * n, FULL = (1 << n) - 1;
    const rowOf = [], colOf = [], boxOf = [];
    for (let i = 0; i < N; i++) { const r = i / n | 0, c = i % n; rowOf[i] = r; colOf[i] = c; boxOf[i] = (r / br | 0) * (n / bc) + (c / bc | 0); }
    const units = []; // 0..n-1 列, n..2n-1 行, 2n..3n-1 宮
    for (let u = 0; u < 3 * n; u++) units.push([]);
    for (let i = 0; i < N; i++) { units[rowOf[i]].push(i); units[n + colOf[i]].push(i); units[2 * n + boxOf[i]].push(i); }
    const peers = [];
    for (let i = 0; i < N; i++) { const s = new Set([...units[rowOf[i]], ...units[n + colOf[i]], ...units[2 * n + boxOf[i]]]); s.delete(i); peers.push([...s]); }
    return (geo[n] = { n, br, bc, N, FULL, rowOf, colOf, boxOf, units, peers });
  }
  const pc = m => { let c = 0; while (m) { m &= m - 1; c++; } return c; };
  const bitN = m => 31 - Math.clz32(m) + 1; // 單一位元 → 數字
  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

  // 回溯：計算解的個數（到 limit 為止），或隨機找一個解
  function search(g0, n, limit, random) {
    const { N, FULL, rowOf, colOf, boxOf } = G(n);
    const a = g0.slice(), rm = new Int32Array(n), cm = new Int32Array(n), bm = new Int32Array(n);
    for (let i = 0; i < N; i++) if (a[i]) { const b = 1 << (a[i] - 1); if ((rm[rowOf[i]] | cm[colOf[i]] | bm[boxOf[i]]) & b) return { count: 0 }; rm[rowOf[i]] |= b; cm[colOf[i]] |= b; bm[boxOf[i]] |= b; }
    const empties = []; for (let i = 0; i < N; i++) if (!a[i]) empties.push(i);
    let count = 0, sol = null;
    (function rec() {
      let best = -1, bestM = 0, bestC = 99;
      for (const i of empties) if (!a[i]) {
        const m = FULL & ~(rm[rowOf[i]] | cm[colOf[i]] | bm[boxOf[i]]), c = pc(m);
        if (c < bestC) { best = i; bestM = m; bestC = c; if (c <= 1) break; }
      }
      if (best < 0) { count++; if (!sol) sol = a.slice(); return; }
      if (!bestC) return;
      const ds = []; for (let d = 0; d < n; d++) if (bestM & (1 << d)) ds.push(d);
      if (random) shuffle(ds);
      const r = rowOf[best], c = colOf[best], b = boxOf[best];
      for (const d of ds) {
        const bit = 1 << d; a[best] = d + 1; rm[r] |= bit; cm[c] |= bit; bm[b] |= bit;
        rec();
        a[best] = 0; rm[r] &= ~bit; cm[c] &= ~bit; bm[b] &= ~bit;
        if (count >= limit) return;
      }
    })();
    return { count, sol };
  }
  const countSol = (g, n) => search(g, n, 2, false).count;
  const solve = (g, n) => search(g, n, 1, false).sol;

  // 依人類技巧解題：1 = 唯一候選／唯一位置；2 = 區塊排除、數對；3 = 隱性數對、三鏈數、X 翼
  function rate(g0, n) {
    const { N, FULL, units, peers, rowOf, colOf, boxOf } = G(n);
    const a = g0.slice(), cand = new Int32Array(N);
    for (let i = 0; i < N; i++) cand[i] = a[i] ? 0 : FULL;
    for (let i = 0; i < N; i++) if (a[i]) for (const p of peers[i]) cand[p] &= ~(1 << (a[i] - 1));
    let left = 0; for (let i = 0; i < N; i++) if (!a[i]) left++;
    let level = 1;
    const place = (i, d) => { a[i] = d; cand[i] = 0; left--; const b = 1 << (d - 1); for (const p of peers[i]) cand[p] &= ~b; };
    function singles() {
      let prog = false;
      for (let i = 0; i < N; i++) if (!a[i] && pc(cand[i]) === 1) { place(i, bitN(cand[i])); prog = true; }
      for (const u of units) for (let d = 0; d < n; d++) {
        const b = 1 << d; let only = -1, k = 0;
        for (const i of u) { if (a[i] === d + 1) { k = 9; break; } if (cand[i] & b) { only = i; k++; } }
        if (k === 1) { place(only, d + 1); prog = true; }
      }
      return prog;
    }
    function elim(cells, mask) { let ch = false; for (const i of cells) if (cand[i] & mask) { cand[i] &= ~mask; ch = true; } return ch; }
    function level2() {
      let ch = false;
      // 區塊排除：宮內某數字只在同一列／行 → 同列／行宮外刪掉；列／行內某數字只在同一宮 → 宮內其他格刪掉
      for (let b = 0; b < n; b++) {
        const box = units[2 * n + b];
        for (let d = 0; d < n; d++) {
          const bit = 1 << d, cs = box.filter(i => cand[i] & bit); if (cs.length < 2) continue;
          if (cs.every(i => rowOf[i] === rowOf[cs[0]])) ch = elim(units[rowOf[cs[0]]].filter(i => boxOf[i] !== b), bit) || ch;
          if (cs.every(i => colOf[i] === colOf[cs[0]])) ch = elim(units[n + colOf[cs[0]]].filter(i => boxOf[i] !== b), bit) || ch;
        }
      }
      for (let u = 0; u < 2 * n; u++) for (let d = 0; d < n; d++) {
        const bit = 1 << d, cs = units[u].filter(i => cand[i] & bit); if (cs.length < 2) continue;
        if (cs.every(i => boxOf[i] === boxOf[cs[0]])) ch = elim(units[2 * n + boxOf[cs[0]]].filter(i => !cs.includes(i)), bit) || ch;
      }
      // 顯性數對
      for (const u of units) {
        const two = u.filter(i => !a[i] && pc(cand[i]) === 2);
        for (let x = 0; x < two.length; x++) for (let y = x + 1; y < two.length; y++) if (cand[two[x]] === cand[two[y]])
          ch = elim(u.filter(i => i !== two[x] && i !== two[y]), cand[two[x]]) || ch;
      }
      return ch;
    }
    function level3() {
      let ch = false;
      for (const u of units) {
        // 隱性數對：兩個數字只出現在同樣兩格
        const pos = []; for (let d = 0; d < n; d++) pos.push(u.filter(i => cand[i] & (1 << d)));
        for (let x = 0; x < n; x++) for (let y = x + 1; y < n; y++) {
          if (pos[x].length === 2 && pos[y].length === 2 && pos[x][0] === pos[y][0] && pos[x][1] === pos[y][1]) {
            const keep = (1 << x) | (1 << y);
            for (const i of pos[x]) if (cand[i] & ~keep) { cand[i] &= keep; ch = true; }
          }
        }
        // 顯性三鏈數
        const em = u.filter(i => !a[i] && pc(cand[i]) >= 2 && pc(cand[i]) <= 3);
        for (let x = 0; x < em.length; x++) for (let y = x + 1; y < em.length; y++) for (let z = y + 1; z < em.length; z++) {
          const m = cand[em[x]] | cand[em[y]] | cand[em[z]];
          if (pc(m) === 3) ch = elim(u.filter(i => i !== em[x] && i !== em[y] && i !== em[z]), m) || ch;
        }
      }
      // X 翼（列與行）
      for (let d = 0; d < n; d++) {
        const bit = 1 << d;
        for (const off of [0, n]) {
          const other = off ? 0 : n, lines = [];
          for (let u = 0; u < n; u++) { const cs = units[off + u].filter(i => cand[i] & bit); if (cs.length === 2) lines.push(cs); }
          const key = i => off ? rowOf[i] : colOf[i];
          for (let x = 0; x < lines.length; x++) for (let y = x + 1; y < lines.length; y++) {
            const A = lines[x], B = lines[y];
            if (key(A[0]) === key(B[0]) && key(A[1]) === key(B[1])) {
              for (const k of [key(A[0]), key(A[1])]) ch = elim(units[other + k].filter(i => !A.includes(i) && !B.includes(i)), bit) || ch;
            }
          }
        }
      }
      return ch;
    }
    for (let guard = 0; guard < 500 && left > 0; guard++) {
      if (singles()) continue;
      if (level2()) { level = Math.max(level, 2); continue; }
      if (level3()) { level = Math.max(level, 3); continue; }
      break;
    }
    return { solved: left === 0, level };
  }

  // 產生題目：level 0 入門(6x6) 1 簡單 2 普通 3 困難 4 專家
  function generate(n, lv) {
    const { N } = G(n), t0 = Date.now();
    const target = n === 6 ? 14 : [0, 38, 30, 0, 0][lv];
    let best = null;
    for (let tries = 0; tries < 400; tries++) {
      const sol = search(new Array(N).fill(0), n, 1, true).sol;
      const p = sol.slice();
      let clues = N;
      for (const i of shuffle([...Array(N).keys()])) {
        if (target && clues <= target) break;
        const v = p[i]; p[i] = 0;
        if (countSol(p, n) !== 1) p[i] = v; else clues--;
      }
      const r = rate(p, n);
      const want = n === 6 ? 1 : [0, 1, 1, 2, 3][lv];
      const score = r.solved ? r.level : 0;
      if (r.solved && r.level === want) return { puzzle: p, solution: sol, level: r.level, clues, ms: Date.now() - t0 };
      // 時間到了就拿最接近的（但一定要能用技巧解開，不用猜）
      if (r.solved && (!best || Math.abs(score - want) < Math.abs(best.level - want) || (score === best.level && clues < best.clues))) best = { puzzle: p, solution: sol, level: r.level, clues };
      if (Date.now() - t0 > 2500 && best) break;
    }
    best.ms = Date.now() - t0; return best;
  }

  // 提示：從目前盤面（只看填對的格子）找一步唯一候選或唯一位置，附上理由
  function hint(g, n) {
    const { N, FULL, units, peers } = G(n);
    const cand = new Int32Array(N);
    for (let i = 0; i < N; i++) cand[i] = g[i] ? 0 : FULL;
    for (let i = 0; i < N; i++) if (g[i]) for (const p of peers[i]) cand[p] &= ~(1 << (g[i] - 1));
    for (let i = 0; i < N; i++) if (!g[i] && pc(cand[i]) === 1) return { i, d: bitN(cand[i]), why: 'cell' };
    const names = ['列', '行', '宮'];
    for (let u = 0; u < units.length; u++) for (let d = 0; d < n; d++) {
      const b = 1 << d; let only = -1, k = 0, has = false;
      for (const i of units[u]) { if (g[i] === d + 1) { has = true; break; } if (cand[i] & b) { only = i; k++; } }
      if (!has && k === 1) return { i: only, d: d + 1, why: names[u / n | 0], k: u % n + 1 };
    }
    return null;
  }

  const api = { G, search, countSol, solve, rate, generate, hint };
  if (self) self.onmessage = e => { const m = e.data; if (m.type === 'gen') return generate(m.n, m.lv); return null; };
  return api;
}

// ======================================================================
// 畫面
// ======================================================================
const SD = SUDOKU(null);
const GEN = TB.worker(SUDOKU);
const LV = [['0', '入門 6×6'], ['1', '簡單'], ['2', '普通'], ['3', '困難'], ['4', '專家']];
const LVNAME = { 0: '入門', 1: '簡單', 2: '普通', 3: '困難', 4: '專家' };
const $ = id => document.getElementById(id);
const board = $('board'), numsEl = $('nums');
let pref = Object.assign({ check: true, lv: 2 }, TB.store.get('sudoku:pref', {}));
let S = null;       // {n, lv, puzzle, solution, val, notes, time, mis, done, counted}
let sel = -1, noteMode = false, hist = [], timer = 0, cells = [];

function save() { if (S) TB.store.set('sudoku:game', S); }
function fmt(t) { t = Math.floor(t); const h = t / 3600 | 0, m = (t / 60 | 0) % 60, s = t % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0'); }

function build() {
  const n = S.n, { br, bc } = SD.G(n);
  board.style.gridTemplateColumns = `repeat(${n},1fr)`; board.style.gridTemplateRows = `repeat(${n},1fr)`;
  board.innerHTML = ''; cells = [];
  for (let i = 0; i < n * n; i++) {
    const r = i / n | 0, c = i % n, el = document.createElement('div');
    el.className = 'c' + ((c + 1) % bc === 0 && c < n - 1 ? ' br' : '') + ((r + 1) % br === 0 && r < n - 1 ? ' bb' : '');
    el.dataset.i = i; board.appendChild(el); cells.push(el);
  }
  numsEl.className = 'nums' + (n === 6 ? ' six' : '');
  numsEl.innerHTML = '';
  for (let d = 1; d <= n; d++) { const b = document.createElement('button'); b.dataset.d = d; b.innerHTML = d + '<small></small>'; numsEl.appendChild(b); }
  fit(); render();
}
function fit() {
  if (!S) return;
  const main = $('main'), W = main.clientWidth - 20, H = main.clientHeight - 20;
  const wide = matchMedia("(min-aspect-ratio:5/4)").matches;
  let bw;
  if (wide) bw = Math.min(H, W - Math.min(320, W * 0.34) - 22);
  else { const padH = 52 + 8 + 60 + 10 + 34 + 10; bw = Math.min(W, H - padH); }
  bw = Math.max(220, Math.floor(bw / S.n) * S.n + 6);
  document.body.style.setProperty('--bw', bw + 'px');
  document.body.style.setProperty('--cs', ((bw - 6) / S.n) + 'px');
}
function render() {
  if (!S) return;
  const n = S.n, { rowOf, colOf, boxOf } = SD.G(n);
  const sv = sel >= 0 ? S.val[sel] : 0;
  for (let i = 0; i < n * n; i++) {
    const el = cells[i], v = S.val[i], given = !!S.puzzle[i];
    let cls = 'c' + ((i % n + 1) % SD.G(n).bc === 0 && i % n < n - 1 ? ' br' : '') + (((i / n | 0) + 1) % SD.G(n).br === 0 && (i / n | 0) < n - 1 ? ' bb' : '');
    if (given) cls += ' g';
    if (sel >= 0) {
      if (i === sel) cls += ' sel';
      else if (sv && v === sv) cls += ' same';
      else if (rowOf[i] === rowOf[sel] || colOf[i] === colOf[sel] || boxOf[i] === boxOf[sel]) cls += ' peer';
    }
    if (v && !given && pref.check && v !== S.solution[i]) cls += ' bad';
    if (el.className.replace(/ (pop|hint|win)/g, '') !== cls) el.className = cls + (el.classList.contains('pop') ? ' pop' : '') + (el.classList.contains('hint') ? ' hint' : '');
    let html = '';
    if (v) html = String(v);
    else if (S.notes[i]) {
      html = '<div class="notes' + (n === 6 ? ' six' : '') + '">';
      for (let d = 1; d <= n; d++) html += '<span' + (sv === d && (S.notes[i] & (1 << (d - 1))) ? ' class="hl"' : '') + '>' + (S.notes[i] & (1 << (d - 1)) ? d : '') + '</span>';
      html += '</div>';
    }
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
  }
  // 數字鍵：剩幾個
  const cnt = new Array(n + 1).fill(0);
  for (let i = 0; i < n * n; i++) if (S.val[i] && S.val[i] === S.solution[i]) cnt[S.val[i]]++;
  numsEl.querySelectorAll('button').forEach(b => { const d = +b.dataset.d, left = n - cnt[d]; b.classList.toggle('done', left <= 0); b.querySelector('small').textContent = left > 0 ? left : '✓'; });
  numsEl.classList.toggle('note', noteMode);
  $('tNote').classList.toggle('on', noteMode); $('noteB').textContent = noteMode ? '開' : '關';
  $('lv').textContent = (S.n === 6 ? '入門 6×6' : LVNAME[S.lv]);
  $('mis').hidden = !pref.check; $('misN').textContent = S.mis;
  $('tm').textContent = fmt(S.time);
}
function snap() { hist.push(JSON.stringify({ v: S.val, o: S.notes, m: S.mis })); if (hist.length > 300) hist.shift(); }
function count() { if (!S.counted) { S.counted = true; TB.bump('sudoku', 'played'); TB.bump('sudoku:' + S.lv, 'played'); } }
function input(d) {
  if (!S || S.done || sel < 0 || S.puzzle[sel]) { if (sel < 0 && S && !S.done) TB.toast('先點一個格子'); return; }
  const n = S.n, bit = 1 << (d - 1), { peers } = SD.G(n);
  if (noteMode) {
    if (S.val[sel]) return;
    snap(); S.notes[sel] ^= bit; TB.sfx('click');
  } else {
    if (S.val[sel] === d) return;
    snap(); count();
    S.val[sel] = d; S.notes[sel] = 0;
    // 填對時自動把同列同行同宮的筆記刪掉
    if (d === S.solution[sel]) for (const p of peers[sel]) S.notes[p] &= ~bit;
    if (pref.check && d !== S.solution[sel]) { S.mis++; TB.sfx('bad'); } else TB.sfx('place');
    cells[sel].classList.remove('pop'); void cells[sel].offsetWidth; cells[sel].classList.add('pop');
  }
  save(); render(); checkDone();
}
function erase() {
  if (!S || S.done || sel < 0 || S.puzzle[sel]) return;
  if (!S.val[sel] && !S.notes[sel]) return;
  snap(); S.val[sel] = 0; S.notes[sel] = 0; TB.sfx('flip'); save(); render();
}
function undo() {
  if (!S || S.done) return;
  const h = hist.pop(); if (!h) { TB.toast('沒有可以復原的步'); return; }
  const o = JSON.parse(h); S.val = o.v; S.notes = o.o; S.mis = o.m; TB.sfx('flip'); save(); render();
}
function doHint() {
  if (!S || S.done) return;
  const n = S.n;
  // 先找填錯的格子
  for (let i = 0; i < n * n; i++) if (S.val[i] && S.val[i] !== S.solution[i]) {
    sel = i; render(); flash(i); TB.toast('這一格填錯了，先擦掉再想想', 2400); return;
  }
  const g = S.val.slice(), h = SD.hint(g, n);
  let i, d, msg;
  if (h) {
    i = h.i; d = h.d;
    const r = (i / n | 0) + 1, c = i % n + 1;
    msg = h.why === 'cell' ? `第 ${r} 列第 ${c} 格：同列、同行、同宮已經用掉其他數字，只剩 ${d} 能放`
      : `第 ${h.k} ${h.why}只剩這一格能放 ${d}`;
  } else {
    // 需要進階技巧：直接揭曉候選最少的格子
    let best = -1, bc = 99;
    const { peers, FULL } = SD.G(n);
    for (let k = 0; k < n * n; k++) if (!g[k]) { let m = FULL; for (const p of peers[k]) if (g[p]) m &= ~(1 << (g[p] - 1)); let c = 0; while (m) { m &= m - 1; c++; } if (c < bc) { bc = c; best = k; } }
    i = best; d = S.solution[i]; msg = `這一步要用到進階技巧，直接幫你填上 ${d}`;
  }
  snap(); count(); S.val[i] = d; S.notes[i] = 0;
  for (const p of SD.G(n).peers[i]) S.notes[p] &= ~(1 << (d - 1));
  S.hints = (S.hints || 0) + 1;
  sel = i; TB.sfx('select'); save(); render(); flash(i); TB.toast('💡 ' + msg, 3600); checkDone();
}
function flash(i) { const el = cells[i]; el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint'); setTimeout(() => el.classList.remove('hint'), 1500); }
function checkDone() {
  const n = S.n;
  for (let i = 0; i < n * n; i++) if (S.val[i] !== S.solution[i]) return;
  S.done = true; save(); stopTimer();
  TB.bump('sudoku', 'won'); TB.bump('sudoku:' + S.lv, 'won');
  const key = 'sudoku:best:' + S.lv, best = TB.store.get(key, null), rec = best == null || S.time < best;
  if (rec) TB.store.set(key, S.time);
  sel = -1; render();
  cells.forEach((el, i) => { const r = i / n | 0, c = i % n; setTimeout(() => { el.classList.remove('win'); void el.offsetWidth; el.classList.add('win'); }, (r + c) * 45); });
  TB.sfx('win');
  setTimeout(() => TB.dialog({ title: rec ? '🏆 新紀錄！' : '🎉 完成了！',
    html: TB.statsHtml([['這局時間', fmt(S.time)], ['最佳紀錄', fmt(rec ? S.time : best)], ['錯誤', pref.check ? S.mis : '—'], ['提示', S.hints || 0]]) + '<p>' + (S.n === 6 ? '入門 6×6' : LVNAME[S.lv] + '難度') + '完成！</p>',
    buttons: [{ label: '看盤面' }, { label: '再來一題', primary: true, onClick: () => { setTimeout(() => newDialog(), 0); } }] }), (2 * n) * 45 + 500);
}
function startTimer() { stopTimer(); timer = setInterval(() => { if (!S || S.done || document.hidden || document.querySelector('.tb-over')) return; S.time++; $('tm').textContent = fmt(S.time); if (S.time % 5 === 0) save(); }, 1000); }
function stopTimer() { clearInterval(timer); timer = 0; }

let genToken = 0;
async function newGame(lv) {
  lv = +lv; pref.lv = lv; TB.store.set('sudoku:pref', pref);
  const n = lv === 0 ? 6 : 9, my = ++genToken;
  stopTimer();
  board.innerHTML = '<div style="grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:15px">出題中…</div>';
  let r;
  try { r = await GEN.ask({ type: 'gen', n, lv }); } catch (e) { r = SD.generate(n, lv); }
  if (my !== genToken) return;
  S = { n, lv, puzzle: r.puzzle, solution: r.solution, val: r.puzzle.slice(), notes: new Array(n * n).fill(0), time: 0, mis: 0, hints: 0, done: false, counted: false };
  hist = []; sel = -1; noteMode = false; save(); build(); startTimer(); TB.sfx('deal');
}
function newDialog() {
  return TB.dialog({ title: '新題目',
    html: '<p>把 1～9 填進空格，讓每一列、每一行、每一宮都剛好各出現一次。</p>' +
      TB.seg('難度', 'lv', LV, pref.lv) +
      TB.seg('填錯時標紅色', 'check', [['1', '要'], ['0', '不要']], pref.check ? '1' : '0'),
    buttons: (S ? [{ label: '取消', value: null }] : []).concat([{ label: '開始', primary: true, onClick: d => {
      pref.check = TB.segVal(d, 'check') === '1'; TB.store.set('sudoku:pref', pref);
      setTimeout(() => newGame(TB.segVal(d, 'lv')), 0);
    } }]),
    dismiss: !!S,
  });
}

// ---- 輸入 ----
board.addEventListener('pointerdown', e => {
  const el = e.target.closest('.c'); if (!el || !S) return;
  sel = +el.dataset.i; TB.sfx('click'); render();
});
numsEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) input(+b.dataset.d); });
$('tUndo').onclick = undo; $('tErase').onclick = erase; $('tHint').onclick = doHint;
$('tNote').onclick = () => { noteMode = !noteMode; TB.sfx('click'); render(); };
$('bNew').onclick = () => newDialog();
$('bInfo').onclick = () => {
  const s = TB.stats('sudoku'), b = k => { const v = TB.store.get('sudoku:best:' + k, null); return v == null ? '—' : fmt(v); };
  TB.dialog({ title: '數獨', html: TB.statsHtml([['完成', s.won || 0], ['入門', b(0)], ['簡單', b(1)], ['普通', b(2)], ['困難', b(3)], ['專家', b(4)]]) +
    TB.seg('填錯時標紅色', 'check', [['1', '要'], ['0', '不要']], pref.check ? '1' : '0') +
    '<div class="tb-rules"><h4>怎麼玩</h4><ul><li>每一列、每一行、每一個粗框的「宮」，都要剛好放進 1～9 各一次（入門 6×6 是 1～6）。</li><li>黑色粗體是題目給的數字，不能改；藍色是你填的。</li><li>每一題都只有一個答案，而且只靠推理就能解開，不用猜。</li></ul>' +
    '<h4>操作</h4><ul><li>點一個格子，再點下方的數字填進去。電腦也可以直接按鍵盤 1～9，方向鍵移動，Backspace 擦掉，N 切換筆記。</li><li><b>筆記</b>：打開後點數字會變成小字的候選數，方便記下「這格可能是哪些」。</li><li><b>提示</b>：幫你填一格並說明理由；有填錯的格子會先指出來。</li><li>點一個數字的格子，盤面上相同的數字會一起亮起來。</li></ul>' +
    '<h4>小技巧</h4><ul><li>先找「某一宮只剩一格能放某數字」的地方。</li><li>某一格的同列、同行、同宮已經用掉八個數字，剩下那個就是答案。</li></ul></div>',
    buttons: [{ label: '好', primary: true, onClick: d => { pref.check = TB.segVal(d, 'check') === '1'; TB.store.set('sudoku:pref', pref); render(); } }] });
};
addEventListener('keydown', e => {
  if (!S || document.querySelector('.tb-over')) return;
  if ((e.key === 'z' || e.key === 'Z') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undo(); return; }
  const n = S.n;
  if (/^[1-9]$/.test(e.key) && +e.key <= n) { input(+e.key); return; }
  if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') { erase(); return; }
  if (e.key === 'n' || e.key === 'N') { noteMode = !noteMode; render(); return; }
  const mv = { ArrowUp: -n, ArrowDown: n, ArrowLeft: -1, ArrowRight: 1 }[e.key];
  if (mv) { e.preventDefault(); if (sel < 0) sel = 0; else { const r = sel / n | 0, c = sel % n; if (mv === -1 && c > 0 || mv === 1 && c < n - 1 || mv === -n && r > 0 || mv === n && r < n - 1) sel += mv; } render(); }
});
new ResizeObserver(() => fit()).observe($('main'));

(function start() {
  const sv = TB.store.get('sudoku:game', null);
  if (sv && sv.solution && sv.val && !sv.done && (sv.n === 9 || sv.n === 6) && sv.val.length === sv.n * sv.n) {
    S = sv; S.notes = S.notes || new Array(S.n * S.n).fill(0); build(); startTimer(); TB.toast('接續上一題');
  } else newDialog();
})();
</script>
</body>
</html>
