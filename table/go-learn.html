<head>

<style>
.tb-main{display:block;padding:0;overflow:hidden}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* ---------- 目錄 ---------- */
:root{--accent:#ec4899;--accent-ink:#be185d;--accent-soft:#fdf0f7}
.tb-btn.primary{box-shadow:0 4px 12px rgba(236,72,153,.35)}
#toc{overflow:auto;-webkit-overflow-scrolling:touch}
.toc-in{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
.toc-hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:8px;background:linear-gradient(135deg,#fdf2f8,#eef2ff);border-radius:24px;padding:22px 22px 20px}
.toc-hero h2{font-weight:900;font-size:clamp(28px,6vw,40px);letter-spacing:.04em;margin:0;background:linear-gradient(90deg,#ec4899,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.toc-hero p{margin:6px 0 0;color:var(--mute);max-width:52ch}
.toc-sum{margin-left:auto;font-size:14px;font-weight:700;color:var(--accent-ink);white-space:nowrap;min-width:200px}
.toc-prog{height:10px;border-radius:99px;background:#fff;margin-top:8px;overflow:hidden;box-shadow:inset 0 0 0 1px #f3d4e5}
.toc-prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ec4899,#f59e0b)}
.toc-ch{--cc:#ec4899;margin:28px 0 12px;font-weight:900;font-size:18px;letter-spacing:.04em;color:var(--ink);display:flex;align-items:center;gap:10px}
.toc-ch::before{content:"";width:10px;height:22px;border-radius:99px;background:var(--cc)}
.toc-ch.c0,.toc-grid.c0{--cc:#ec4899}.toc-ch.c1,.toc-grid.c1{--cc:#8b5cf6}.toc-ch.c2,.toc-grid.c2{--cc:#0ea5e9}.toc-ch.c3,.toc-grid.c3{--cc:#10b981}.toc-ch.c4,.toc-grid.c4{--cc:#f59e0b}
.toc-grid{--cc:#ec4899;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.lc{display:flex;gap:14px;align-items:center;text-align:left;width:100%;appearance:none;border:2px solid transparent;background:var(--panel);border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s,border-color .12s,box-shadow .12s}
.lc:hover,.lc:focus-visible{border-color:var(--cc);transform:translateY(-2px);box-shadow:var(--shadow-lg);outline:none}
.lc .num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:19px;background:var(--cc);color:#fff;box-shadow:0 4px 10px rgba(17,24,39,.15)}
.lc.done .num{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--cc)}
.lc .tx{flex:1;min-width:0}
.lc b{display:block;font-size:17px;color:var(--ink)}
.lc span{display:block;font-size:13px;color:var(--mute);line-height:1.4}
.lc .stars{flex:none;font-size:16px;letter-spacing:1px;color:#f59e0b}
.lc .stars i{font-style:normal;color:#e5e7eb}
.lc.lock{opacity:.7}
.lc .note{color:var(--accent-ink)}
/* ---------- 課程 / 遊戲 ---------- */
.ls{display:grid;grid-template-columns:minmax(300px,410px) 1fr;height:100%;gap:0}
.pnl{display:flex;flex-direction:column;background:var(--panel);box-shadow:4px 0 24px rgba(17,24,39,.06);min-height:0;position:relative;z-index:1}
.pnl-scroll{flex:1;min-height:0;overflow:auto;padding:22px 22px 12px}
.ls-ch{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--accent)}
.ls-title{font-weight:900;font-size:26px;letter-spacing:.03em;margin:2px 0 10px}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.dots i{width:10px;height:10px;border-radius:50%;background:#e5e7eb}
.dots i.on{background:var(--accent)}
.dots i.q{border-radius:3px}
.dots i.ok{background:var(--green)}
.ls-text{font-size:18px;line-height:1.75;color:var(--ink)}
.ls-text b{color:var(--accent-ink)}
.ls-text .sym{color:var(--accent-ink);font-weight:700}
.ls-tag{display:inline-block;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 12px;margin-bottom:8px}
.fb{margin-top:14px;border-radius:14px;padding:11px 15px;font-size:16px;line-height:1.6;display:none}
.fb.on{display:block;animation:tbpop .2s}
.fb.ok{background:#e7f9f1;color:#065f46;box-shadow:inset 4px 0 0 #10b981}
.fb.bad{background:#fff0f2;color:#9f1239;box-shadow:inset 4px 0 0 #f43f5e}
.fb.info{background:#eef6ff;color:#1e3a8a;box-shadow:inset 4px 0 0 #3b82f6}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opts button{appearance:none;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:500;cursor:pointer;min-height:48px;transition:border-color .12s,background .12s}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:#10b981;background:#e7f9f1;color:#065f46}
.opts button.wrong{border-color:#f43f5e;background:#fff0f2;color:#9f1239}
.opts button:disabled{cursor:default}
.nav{flex:none;display:flex;gap:10px;padding:12px 22px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.nav .tb-btn{min-height:46px;font-size:16px;padding:8px 18px}
.nav .grow{flex:1}
.nav .tb-btn.primary{flex:1}
.bwrap{position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:14px}
.bwrap svg{display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 14px 26px rgba(161,98,7,.18)) drop-shadow(0 2px 4px rgba(17,24,39,.08))}
.done-card{text-align:center;padding:18px 4px}
.done-card .big{font-size:48px;letter-spacing:6px;color:#f59e0b;margin:8px 0}
.done-card .big i{font-style:normal;color:#e5e7eb}
.done-card h3{font-weight:900;font-size:26px;letter-spacing:.04em;margin:4px 0}
.cap-score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cap-score div{background:var(--panel2);border:2px solid transparent;border-radius:16px;padding:10px;text-align:center}
.cap-score div.turn{border-color:var(--accent);background:var(--accent-soft)}
.cap-score b{display:block;font-size:30px;font-weight:900;color:var(--accent-ink);line-height:1.2}
.cap-score span{font-size:13px;color:var(--mute)}
.stn{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:4px}
.stn.b{background:radial-gradient(circle at 35% 30%,#4b5563,#111827)}
.stn.w{background:radial-gradient(circle at 35% 30%,#fff,#dbe1ea);box-shadow:inset 0 0 0 1px #d1d5db}
.link-btn{display:inline-block;text-decoration:none}
/* 棋盤 SVG 動畫 */
.st.drop{animation:drop .22s ease-out;transform-box:fill-box;transform-origin:center}
.st.fade{animation:fadeout .45s forwards;transform-box:fill-box;transform-origin:center}
@keyframes drop{from{transform:scale(1.25);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes fadeout{to{opacity:0;transform:scale(.6)}}
.lib{animation:pop .3s backwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.15);opacity:.6}}
.flashx{animation:fadeout .9s .3s forwards;transform-box:fill-box;transform-origin:center}

@media (max-width:760px), (max-aspect-ratio:1/1){
  .ls{display:flex;flex-direction:column}
  .pnl{display:contents}
  .pnl-scroll{order:0;flex:0 1 auto;max-height:46%;padding:12px 16px 10px;background:var(--panel);box-shadow:0 4px 18px rgba(17,24,39,.06);position:relative;z-index:1}
  .bwrap{order:1}
  .nav{order:2;background:var(--panel)}
  .ls-title{font-size:21px;margin:0 0 6px}
  .ls-text{font-size:16.5px;line-height:1.65}
  .dots{margin-bottom:8px}
  .nav{padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
  .nav .tb-btn{min-height:44px}
  .bwrap{flex:1;padding:8px}
  .opts{flex-direction:row;flex-wrap:wrap}
  .opts button{flex:1 1 40%;text-align:center;font-size:16px;padding:10px}
  .fb{margin-top:10px;font-size:15px;padding:8px 12px}
  .cap-score{margin:8px 0}
  .cap-score b{font-size:24px}
}
</style>

<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html">← 棋牌</a>

  <span class="tb-sp"></span>

<main class="tb-main">
  <section id="toc" class="view" aria-label="課程目錄"></section>

    <div class="ls">
      <div class="pnl">
        <div class="pnl-scroll" id="pnl"></div>
        <div class="nav" id="nav"></div>

    </div>

<script src="common.js"></script>
<script>
'use strict';
// =====================================================================
// 圍棋規則（提子、氣、自殺禁入、打劫）
// 棋盤是一維陣列：index = y * n + x；0 空、1 黑、2 白
// =====================================================================
function Go(n) {
  this.n = n; this.b = new Int8Array(n * n); this.ko = -1; this.caps = [0, 0, 0];
  this.nbr = [];
  for (let i = 0; i < n * n; i++) {
    const x = i % n, y = i / n | 0, a = [];
    if (x > 0) a.push(i - 1); if (x < n - 1) a.push(i + 1);
    if (y > 0) a.push(i - n); if (y < n - 1) a.push(i + n);
    this.nbr.push(a);
  }
}
Go.prototype.clone = function () { const g = new Go(this.n); g.b.set(this.b); g.ko = this.ko; g.caps = this.caps.slice(); return g; };
Go.prototype.group = function (i) {
  const c = this.b[i], seen = new Set([i]), st = [i], stones = [], libs = new Set();
  while (st.length) {
    const j = st.pop(); stones.push(j);
    for (const k of this.nbr[j]) { const v = this.b[k]; if (v === 0) libs.add(k); else if (v === c && !seen.has(k)) { seen.add(k); st.push(k); } }
  }
  return { stones, libs };
};
/** 下一手：回傳 {ok, cap:[被提的位置], why:'occupied'|'ko'|'suicide'} */
Go.prototype.play = function (i, c) {
  if (this.b[i]) return { ok: false, why: 'occupied' };
  if (i === this.ko) return { ok: false, why: 'ko' };
  const o = 3 - c; this.b[i] = c; const cap = [];
  for (const k of this.nbr[i]) {
    if (this.b[k] === o) { const g = this.group(k); if (g.libs.size === 0) for (const s of g.stones) { if (this.b[s]) { this.b[s] = 0; cap.push(s); } } }
  }
  const me = this.group(i);
  if (me.libs.size === 0) { this.b[i] = 0; return { ok: false, why: 'suicide' }; }
  this.ko = (cap.length === 1 && me.stones.length === 1 && me.libs.size === 1) ? cap[0] : -1;
  this.caps[c] += cap.length;
  return { ok: true, cap };
};
Go.prototype.legal = function (i, c) { return this.clone().play(i, c).ok; };
/** 數子：棋子＋只被單一顏色圍住的空點 */
Go.prototype.area = function () {
  const n = this.n, res = [0, 0, 0], seen = new Uint8Array(n * n), terr = [];
  for (let i = 0; i < n * n; i++) {
    if (this.b[i]) { res[this.b[i]]++; continue; }
    if (seen[i]) continue;
    const reg = [], st = [i]; let touch = 0; seen[i] = 1;
    while (st.length) { const j = st.pop(); reg.push(j); for (const k of this.nbr[j]) { const v = this.b[k]; if (v) touch |= v; else if (!seen[k]) { seen[k] = 1; st.push(k); } } }
    if (touch === 1 || touch === 2) { res[touch] += reg.length; for (const j of reg) terr.push([j, touch]); }
  }
  return { b: res[1], w: res[2], terr };
};

// ---- 座標：a1 = 左上角；字母是直行（左→右），數字是橫列（上→下）
const P = (s, n) => (s.charCodeAt(0) - 97) + (parseInt(s.slice(1), 10) - 1) * n;
const S = (i, n) => String.fromCharCode(97 + i % n) + ((i / n | 0) + 1);
const L = s => (s ? String(s).trim().split(/[\s,]+/).filter(Boolean) : []);
const C = { B: 1, W: 2 };
function setup(s) {
  const g = new Go(s.n || 7);
  for (const p of L(s.B)) g.b[P(p, g.n)] = 1;
  for (const p of L(s.W)) g.b[P(p, g.n)] = 2;
  if (s.ko) g.ko = P(s.ko, g.n);
  return g;
}
/** 'B d5, W c3' → [[1,'d5'],[2,'c3']] */
const moves = s => L(s.replace(/,/g, ' ')).reduce((a, t, i, arr) => { if (i % 2 === 0) a.push([C[t], arr[i + 1]]); return a; }, []);

// =====================================================================
// 課程內容
// s = 擺盤 {n, B, W, ko}；mk = 標記 {tri, cir, sq, x, lab, libs, terr, arr}
// 步驟：{t 講解, s 重新擺盤, add, play 動畫著手, mk}
// 練習：type pt（點一個位置：ans 或 goal）、libs（點出所有氣）、choice（選擇題）、seq（多步題，含對方應手）、chase（征子）
// =====================================================================
const CH = ['基本規則', '吃子技巧', '死活與連接', '終局與布局'];
const KO_SHAPE = { n: 7, B: 'c2 b3 c4', W: 'd2 c3 e3 d4' };
const WALL = { n: 7, B: 'd1 d2 d3 d4 d5 d6 d7', W: 'e1 e2 e3 e4 e5 e6 e7' };
const SNAP = { n: 7, B: 'e6 e7 f5', W: 'f6 f7 g5' };
const NET = { n: 7, B: 'c4 d3 e3 c5', W: 'd4' };
const ST3 = { n: 7, W: 'a2 b2 c2 d2 d1', B: 'a3 b3 c3 d3 e3 e2 e1' };
const BENT3 = { n: 7, W: 'c1 c2 b2 b3 a3', B: 'd1 d2 c3 b4 a4' };
const ST4 = { n: 7, W: 'a2 b2 c2 d2 e2 e1', B: 'a3 b3 c3 d3 e3 f3 f2 f1' };
const SQ4 = { n: 7, W: 'c1 c2 c3 b3 a3', B: 'd1 d2 d3 c4 b4 a4' };
const BULKY5 = { n: 7, W: 'd1 d2 c2 c3 b3 a3', B: 'e1 e2 d3 c4 b4 a4' };
const EYE1 = { n: 7, B: 'a6 b6 b7', W: 'a5 b5 c6 c7' };
const EYE2 = { n: 7, B: 'a6 b6 c6 d6 d7 b7', W: 'a5 b5 c5 d5 e6 e7' };
const FALSE_EYE = { n: 7, B: 'b7 c6 d7', W: 'b6 d6' };
const sqr = (cols, rows) => { const a = []; for (const r of rows) for (const c of cols) a.push(c + r); return a; };

const LESSONS = [
{ id: 1, ch: 0, title: '認識棋盤與棋子', desc: '交叉點、黑先、輪流下',
  steps: [
    { s: { n: 9 }, t: '圍棋的棋盤是由直線和橫線交織成的。正式比賽用 19 路的大棋盤，我們先用小一點的 <b>9 路</b>棋盤來學。' },
    { t: '棋子要下在線和線的<b>交叉點</b>上，不是下在格子裡面。', mk: { cir: ['c3', 'g7', 'h2', 'b8'] }, play: 'B e5' },
    { t: '<b>黑棋先下</b>，然後白、黑輪流，一次只下<b>一顆</b>。', play: 'W c4, B g3, W f6' },
    { t: '棋子下了就<b>不能移動</b>。只有被對方「吃掉」的時候，才會從棋盤上拿走。' },
    { s: { n: 9 }, t: '棋盤上的小黑點叫<b>星位</b>，只是幫你找位置的記號，下在哪裡都可以。', mk: { cir: ['c3', 'g3', 'c7', 'g7', 'e5'] } },
    { t: '注意看：<b>角</b>上的點只連著 2 條線，<b>邊</b>上的點連著 3 條，<b>中間</b>的點連著 4 條。這個差別等一下會很重要！', mk: { lab: { a1: '2', e1: '3', e5: '4' } } },
  ],
  quiz: [
    { type: 'pt', s: { n: 9 }, goal: 'any', q: '換你下了：在任何一個交叉點下一顆黑棋。', hint: '點在線和線交叉的地方。', ok: '很好！棋子就是下在交叉點上。' },
    { type: 'pt', s: { n: 9 }, ans: ['e5'], q: '請下在棋盤<b>正中央</b>的那一點。', hint: '正中央就是星位裡最中間的那個小黑點。', ok: '答對了！正中央這一點叫做<b>天元</b>。' },
    { type: 'pt', s: { n: 9 }, ans: ['a1', 'i1', 'a9', 'i9'], q: '請下在任何一個<b>角</b>上。', hint: '角就是棋盤四個最邊邊的轉角點。', ok: '沒錯，角上的點只連著兩條線。' },
    { type: 'choice', s: { n: 9, B: 'e5 c3', W: 'g7' }, q: '棋子下好以後，可以把它移到別的地方嗎？', opts: ['可以', '不行'], ans: 1, ok: '對！圍棋的棋子下了就不能移動。' },
  ] },
{ id: 2, ch: 0, title: '氣', desc: '棋子旁邊的空點',
  steps: [
    { s: { n: 7, B: 'd4' }, t: '一顆棋子的上、下、左、右，用直線連著的空交叉點，就是它的<b>氣</b>。', mk: { libs: 'd4' } },
    { t: '在中間的棋子，有 <b>4 口氣</b>。', mk: { libs: 'd4' } },
    { s: { n: 7, B: 'd7' }, t: '在邊上的棋子只有 <b>3 口氣</b>，因為外面已經沒有線了。', mk: { libs: 'd7' } },
    { s: { n: 7, B: 'a7' }, t: '在角上的棋子只剩 <b>2 口氣</b>。', mk: { libs: 'a7' } },
    { s: { n: 7, B: 'd4', W: 'd3' }, t: '如果旁邊被對方的棋子佔住，那裡就不是氣了。這顆黑棋只剩 3 口氣。', mk: { libs: 'd4' } },
    { t: '斜斜的位置（<span class="sym">✕</span>）<b>不算</b>氣喔！只有上下左右才算。', mk: { x: ['c3', 'e3', 'c5', 'e5'] } },
  ],
  quiz: [
    { type: 'libs', s: { n: 7, B: 'd4' }, tgt: 'd4', q: '點出這顆黑棋<b>所有</b>的氣。', hint: '氣是上下左右、直線相連的空點。' },
    { type: 'libs', s: { n: 7, B: 'a4', W: 'a3' }, tgt: 'a4', q: '這顆黑棋在邊上，旁邊還有白棋。點出它所有的氣。', hint: '被白棋佔住的地方不算，棋盤外面也沒有氣。' },
    { type: 'libs', s: { n: 7, B: 'c3', W: 'c2 b3' }, tgt: 'c3', q: '點出這顆黑棋所有的氣。', hint: '上面和左邊都被白棋擋住了。' },
    { type: 'choice', s: { n: 7, B: 'a1', W: 'b1' }, auto: { libs: 'a1' }, q: '角上這顆黑棋還有幾口氣？', opts: ['0', '1', '2', '3'], ok: '對，只剩 1 口氣，很危險！' },
  ] },
{ id: 3, ch: 0, title: '提子', desc: '把氣堵滿就吃掉',
  steps: [

// ---------- 棋盤繪製 ----------
const CELL = 60, M = 46;

}

}
function render() {

    '<radialGradient id="gW" cx=".36" cy=".32" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f8fafc"/><stop offset="1" stop-color="#dbe1ea"/></radialGradient>' +
    '<linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdebbd"/><stop offset="1" stop-color="#f8d993"/></linearGradient>' +
    '<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".004 .09" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .28  0 0 0 0 .1  0 0 0 .55 0"/></filter>' +
    '<marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker>' +
    '</defs>';

  // 線
  let d = '';
  for (let k = 0; k < n; k++) { const p = M + k * CELL; d += 'M' + M + ' ' + p + 'H' + (M + CELL * (n - 1)) + 'M' + p + ' ' + M + 'V' + (M + CELL * (n - 1)); }
  h += '<path d="' + d + '" stroke="#a16207" stroke-width="1.6" fill="none" opacity=".75"/>';
  h += '<rect x="' + M + '" y="' + M + '" width="' + CELL * (n - 1) + '" height="' + CELL * (n - 1) + '" stroke="#a16207" stroke-width="3" fill="none" opacity=".75"/>';
  for (const s of stars(n)) { const [x, y] = XY(P(s, n), n); h += '<circle cx="' + x + '" cy="' + y + '" r="5" fill="#a16207"/>'; }
  // 地
  if (mk.terr) { for (const [i, c] of g.area().terr) { const [x, y] = XY(i, n); h += '<rect x="' + (x - 11) + '" y="' + (y - 11) + '" width="22" height="22" rx="3" fill="' + (c === 1 ? '#1f2937' : '#ffffff') + '" opacity=".9" stroke="#14b8a6" stroke-width="2"/>'; } }
  if (mk.sq) for (const s of mk.sq) { const i = P(s, n), [x, y] = XY(i, n); if (!g.b[i]) h += '<rect x="' + (x - 13) + '" y="' + (y - 13) + '" width="26" height="26" rx="4" fill="#3b82f6" opacity=".45"/>'; }
  // 棋子

  if (mk.cir) for (const s of mk.cir) { const i = P(s, n), [x, y] = XY(i, n); h += '<circle class="pulse" cx="' + x + '" cy="' + y + '" r="' + (g.b[i] ? 13 : 16) + '" fill="' + (g.b[i] ? 'none' : 'rgba(59,130,246,.22)') + '" stroke="' + (g.b[i] ? (g.b[i] === 1 ? '#fff' : '#3b82f6') : '#3b82f6') + '" stroke-width="4"/>'; }
  if (mk.x) for (const s of mk.x) { const i = P(s, n), [x, y] = XY(i, n); h += '<path d="M' + (x - 12) + ' ' + (y - 12) + 'L' + (x + 12) + ' ' + (y + 12) + 'M' + (x + 12) + ' ' + (y - 12) + 'L' + (x - 12) + ' ' + (y + 12) + '" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>'; }
  if (mk.lab) for (const s in mk.lab) { const i = P(s, n), [x, y] = XY(i, n); h += (g.b[i] ? '' : '<circle cx="' + x + '" cy="' + y + '" r="17" fill="#3b82f6"/>') + '<text x="' + x + '" y="' + (y + 8) + '" text-anchor="middle" font-size="24" font-weight="700" font-family="Noto Sans TC,sans-serif" fill="' + (g.b[i] ? ink(i) : '#fff') + '">' + mk.lab[s] + '</text>'; }

    if (f.k === 'ok') h += '<circle cx="' + x + '" cy="' + y + '" r="24" fill="none" stroke="#10b981" stroke-width="6"/>';
    if (f.k === 'lib') h += '<g class="lib"><circle cx="' + x + '" cy="' + y + '" r="16" fill="#10b981" stroke="#fff" stroke-width="2.5"/><text x="' + x + '" y="' + (y + 7) + '" text-anchor="middle" font-size="21" font-weight="700" font-family="Noto Sans TC,sans-serif" fill="#fff">' + f.t + '</text></g>';
  }
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + W);

function fit() {
  const r = $('bwrap').getBoundingClientRect();

  const w = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight), h = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const s = Math.max(160, Math.floor(Math.min(w, h)));

}

function ptFromEvent(e) {
  const g = view.g; if (!g) return -1;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const m = svg.getScreenCTM(); if (!m) return -1;
  const p = pt.matrixTransform(m.inverse());
  const x = Math.round((p.x - M) / CELL), y = Math.round((p.y - M) / CELL);
  if (x < 0 || y < 0 || x >= g.n || y >= g.n) return -1;
  if (Math.hypot(p.x - (M + x * CELL), p.y - (M + y * CELL)) > CELL * 0.62) return -1;

svg.addEventListener('pointermove', e => {

// ---------- 動畫：依序下子 ----------
let animTok = 0;

function applyMove(g, i, c, animate) {
  const r = g.play(i, c);

  view.last = i;
  if (animate) {
    view.drop = i; view.fade = r.cap.map(j => [j, 3 - c]);

  }

}
async function animPlays(list, speed) {
  const tok = ++animTok;

    await sleep(speed || 520);
    if (tok !== animTok) return false;
    applyMove(view.g, P(s, view.g.n), c, true); render();
  }
  await sleep(300);
  if (tok !== animTok) return false;
  view.fade = []; return true;
}

  const h = location.hash.slice(1);

  if ((m = /^l(\d+)$/.exec(h)) && LESSONS.find(l => l.id === +m[1])) { show('ls'); openLesson(+m[1]); }
  else if (h === 'cap') { show('ls'); openCap(); }
  else if (h === 'grad') { show('ls'); openGrad(); }

}
addEventListener('hashchange', route);

// ---------- 課程 ----------
const cur = { L: null, mode: 'step', si: 0, qi: 0, miss: 0, q: null, qs: null };
function openLesson(id) {

  showStep(0, true);
}
function head() {
  const l = cur.L;
  const dots = l.steps.map((_, k) => '<i class="' + (cur.mode === 'step' && k <= cur.si || cur.mode !== 'step' ? 'on' : '') + '"></i>').join('') +
    l.quiz.map((_, k) => '<i class="q ' + (cur.mode === 'done' || (cur.mode === 'quiz' && (k < cur.qi || (k === cur.qi && cur.qs && cur.qs.solved))) ? 'ok' : (cur.mode === 'quiz' && k === cur.qi ? 'on' : '')) + '"></i>').join('');
  return '<div class="ls-ch">第 ' + l.id + ' 課 · ' + CH[l.ch] + '</div><div class="ls-title">' + l.title + '</div><div class="dots" aria-hidden="true">' + dots + '</div>';
}
/** 計算第 k 步開始前（未播放動畫）的盤面 */
function stateAt(k) {

    const st = cur.L.steps[j];
    if (st.s) { g = setup(st.s); last = -1; }
    if (!g) g = setup({ n: 7 });
    if (j < k && st.play) for (const [c, s] of moves(st.play)) { const i = P(s, g.n); g.play(i, c); last = i; }

}
async function showStep(k, animate) {
  cur.mode = 'step'; cur.si = k; onBoard = null; view.ghostOn = false;
  const st = cur.L.steps[k];
  const { g, last } = stateAt(k);
  view.g = g; view.last = last; view.fade = []; view.fx = [];
  const isLast = k === cur.L.steps.length - 1;
  pnl.innerHTML = head() + '<div class="ls-text">' + st.t + '</div>';
  nav.innerHTML = '<button class="tb-btn" id="bPrev"' + (k ? '' : ' disabled') + '>← 上一步</button>' +
    '<button class="tb-btn primary" id="bNext">' + (isLast ? '開始練習 →' : '下一步 →') + '</button>';
  $('bPrev').onclick = () => { TB.sfx('click'); showStep(k - 1, false); };
  $('bNext').onclick = () => { TB.sfx('click'); if (isLast) startQuiz(0); else showStep(k + 1, true); };
  pnl.scrollTop = 0;
  if (st.play && animate) {
    view.mk = {}; render();
    const ok = await animPlays(moves(st.play), st.speed);
    if (!ok) return;
    view.mk = st.mk || {}; render();
  } else {
    if (st.play) for (const [c, s] of moves(st.play)) applyMove(g, P(s, g.n), c, false);
    view.mk = st.mk || {}; render();
  }
}

// ---------- 練習 ----------
function colorOf(q) { return C[q.to || 'B']; }

}
function quizPrompt(q) {

}

function feedback(kind, html) {

}
function wrong(i, msg) {

function solved(msg) {

/** 判斷一手是否符合題目目標 */
function goalOK(q, g, i) {
  const c = colorOf(q), n = g.n;
  if (q.ans) return q.ans.includes(S(i, n));

  const t = g.clone(), r = t.play(i, c);
  if (!r.ok) return false;
  switch (q.goal) {
    case 'any': return true;
    case 'capture': return r.cap.length >= (q.min || 1);
    case 'atari': { const ti = P(q.tgt, n); return t.b[ti] === 3 - c && t.group(ti).libs.size === 1; }

  const r = g.clone().play(i, c);

}
async function quizClick(i) {

    view.fx = [{ i, k: 'ok' }]; view.mk = {}; render();

    (s === 3 ? '全部一次答對，太厲害了！' : s === 2 ? '只錯了一兩次，很棒！' : '多練習幾次會更熟練喔。') + '</p>' +
    (firstTime && l.id === 5 ? '<p style="color:var(--accent-ink);font-weight:700">「吃子遊戲」打開了！可以在目錄的實戰練習找到。</p>' : '') + '</div>';

}

function capClick(i) {

  if (!r.ok) { TB.sfx('bad'); view.fx = [{ i, k: 'bad' }]; render(); view.fx = []; capPanel(r.why === 'ko' ? '這是打劫，要先在別的地方下一手。' : '那裡是禁入點，不能下。', 'bad'); return; }

  cap.busy = false;

  cap.passes = 0;

/** 回傳顏色 c 只剩一口氣的棋塊代表點 */
function atariGroups(g, c) {
  const res = [], seen = new Set();

  return res;
}

  for (let i = 0; i < g.n * g.n; i++) { if (g.b[i]) continue; let near = false; for (const k of g.nbr[i]) if (g.b[k] === 3 - c) { near = true; break; } if (!near) continue; const r = g.clone().play(i, c); if (r.ok && r.cap.length > best) best = r.cap.length; }

}
function capAI(g, lvl) {

  const careless = !lvl && Math.random() < 0.3;

    if (g.b[i]) continue;

    if (g.nbr[i].every(k => g.b[k] === me)) continue;
    const t = g.clone(), r = t.play(i, me);
    if (!r.ok) continue;
    let s = Math.random() * (lvl ? 40 : 260);
    if (careless) { let near = 0; for (const k of g.nbr[i]) if (g.b[k]) near++; s += near * 100; if (t.group(i).libs.size === 1) s -= 500; if (s > bestS) { bestS = s; best = i; } continue; }
    if (r.cap.length) s += 1000 * r.cap.length + (g.caps[me] + r.cap.length >= target ? 100000 : 0);
    const mine = t.group(i);
    if (mine.libs.size === 1) s -= 900 * mine.stones.length;
    else if (mine.libs.size === 2) s -= lvl ? 120 : 30;
    // 救自己被叫吃的棋
    for (const a of myAtari) if (t.b[a] === me && t.group(a).libs.size >= 2) s += 700 * g.group(a).stones.length + (t.group(a).libs.size >= 3 ? 200 : 0);
    // 叫吃對方
    for (const k of g.nbr[i]) if (t.b[k] === op) { const gl = t.group(k).libs.size; if (gl === 1) s += 260 + 60 * t.group(k).stones.length; else if (gl === 2) s += lvl ? 50 : 20; }
    // 靠近棋子
    let near = 0; for (const k of g.nbr[i]) if (g.b[k]) near++;
    s += near * 12;
    const x = i % n, y = i / n | 0; if (x === 0 || y === 0 || x === n - 1 || y === n - 1) s -= 25;
    if (lvl) { // 看一步：對方下一手能提幾顆
      const oc = bestCapture(t, op);
      s -= oc * 950;
      if (g.caps[op] + oc >= target) s -= 50000;
    }
    if (s > bestS) { bestS = s; best = i; }
  }
  return best;
}

// ---------- 畢業 ----------
function openGrad() {
  animTok++;
  const dn = doneCount(), total = LESSONS.length, st = Object.values(prog.done).reduce((a, b) => a + b, 0);
  const g = new Go(9);
  // 畫一個「囍」不如畫一個笑臉 :)
  for (const s of ['c3', 'g3', 'b6', 'c7', 'd7', 'e7', 'f7', 'g7', 'h6']) g.b[P(s, 9)] = 1;
  for (const s of ['e5']) g.b[P(s, 9)] = 2;
  view.g = g; view.last = -1; view.mk = {}; view.fx = []; view.fade = []; view.ghostOn = false; onBoard = null; render();
  pnl.innerHTML = '<div class="ls-ch">圍棋教室</div><div class="ls-title">畢業 🎓</div>' +
    (dn >= total
      ? '<div class="done-card"><div class="big">★ ' + st + '</div><h3>恭喜畢業！</h3></div><div class="ls-text">你已經學會圍棋的規則和基本技巧：氣、提子、叫吃、打劫、征子、做眼、死活、數地，還有布局。<br><br>接下來最好的練習，就是<b>真的下一盤</b>。去 9 路棋盤跟電腦對下吧！輸了也沒關係，每一盤都會讓你更強。</div>'
      : '<div class="ls-text">你已經完成 <b>' + dn + ' / ' + total + '</b> 課。把全部的課學完就可以畢業喔！<br><br>不過如果你等不及了，也可以先去 9 路棋盤跟電腦下下看。</div>') + '<div class="ls-text" style="margin-top:10px">想多練習吃子和死活？試試 <a href="go-puzzle.html" style="color:#db2777;font-weight:700">圍棋死活題 →</a>（每天還有一題每日一題）</div>';
  nav.innerHTML = '<button class="tb-btn" id="bToc">回目錄</button><a class="tb-btn primary link-btn" href="go.html" style="text-align:center;line-height:30px">去下 9 路棋 →</a>';
  $('bToc').onclick = () => { TB.sfx('click'); location.hash = ''; };
}

// ---------- 測試用介面（不影響遊戲）----------
window.__GL = {
  LESSONS, Go, P, S, setup, cur, view, prog,
  /** 回傳目前練習題的一個正確答案：{pt:'d4'} 或 {opt:k} */
  solve() {
    const q = cur.q, g = view.g, n = g.n;
    if (q.type === 'choice') return { opt: choiceAnswer(q, g) };
    if (q.type === 'libs') { const l = cur.qs.libs.find(i => !cur.qs.found.has(i)); return { pt: S(l, n) }; }
    if (q.type === 'seq') return { pt: q.steps[cur.qs.seq].ans[0] };
    if (q.type === 'chase') { const ti = P(q.tgt, n); for (let i = 0; i < n * n; i++) { const r = chaseEval(g, i, ti, colorOf(q)); if (r.k === 'win') return { pt: S(i, n) }; } for (let i = 0; i < n * n; i++) if (chaseEval(g, i, ti, colorOf(q)).k === 'ok') return { pt: S(i, n) }; return null; }
    for (let i = 0; i < n * n; i++) if (goalOK(q, g, i)) return { pt: S(i, n) };
    return null;
  },
  /** 找一個錯誤答案 */
  wrongPt() {
    const q = cur.q, g = view.g, n = g.n;
    for (let i = 0; i < n * n; i++) {
      if (q.type === 'libs') { if (!cur.qs.libs.includes(i) && !g.b[i]) return S(i, n); continue; }
      if (q.type === 'seq') { if (!q.steps[cur.qs.seq].ans.includes(S(i, n)) && !g.b[i]) return S(i, n); continue; }
      if (q.type === 'chase') { if (chaseEval(g, i, P(q.tgt, n), colorOf(q)).k === 'bad' && !g.b[i]) return S(i, n); continue; }
      if (!g.b[i] && !goalOK(q, g, i)) return S(i, n);
    }
    return null;
  },
  /** 棋盤某點在螢幕上的位置 */
  client(s) {
    const n = view.g.n, i = P(s, n), [x, y] = XY(i, n), m = svg.getScreenCTM(), pt = svg.createSVGPoint(); pt.x = x; pt.y = y;
    const p = pt.matrixTransform(m); return { x: p.x, y: p.y };
  },
  capAI,
};

route();
