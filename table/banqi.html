<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>暗棋 · 棋牌桌遊</title>

<style>
:root{--accent:#f97316;--accent-ink:#ea580c;--accent-soft:#fff7ed}
.tb-main{flex-direction:row;align-items:center;justify-content:center;gap:20px}
body.narrow .tb-main{flex-direction:column;justify-content:flex-start;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#cv{display:block;touch-action:none;border-radius:20px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(249,115,22,.22);flex:none}
.bq-side{width:270px;flex:none;align-self:stretch;max-height:100%;display:flex;flex-direction:column;gap:12px;min-height:0;padding:4px 0}
body.narrow .bq-side{width:100%;max-width:560px;align-self:center;gap:6px;padding:0}
.bq-status{font-size:16px;font-weight:500;text-align:center;padding:10px 12px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);min-height:44px}
body.narrow .bq-status{font-size:14px;padding:6px 10px;min-height:0;border-radius:12px}
.bq-status b.r{color:#f43f5e}.bq-status b.k{color:#1e293b}.bq-status b.o{color:#ea580c}
.bq-pl{display:flex;flex-direction:column;gap:8px}
body.narrow .bq-pl{flex-direction:row;gap:6px}
.bq-p{border:2px solid transparent;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 12px;flex:1;min-width:0;transition:border-color .2s}
body.narrow .bq-p{padding:5px 9px;border-radius:12px}
.bq-p.on{border-color:#f97316;background:#fff8f1}
.bq-p .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.narrow .bq-p .nm{font-size:12px;gap:5px}
.bq-dot{width:14px;height:14px;border-radius:50%;flex:none;border:3px solid #cbd5e1;background:#fff}
.bq-dot.r{border-color:#f43f5e}.bq-dot.k{border-color:#1e293b}
.bq-cap{display:flex;flex-wrap:wrap;gap:3px;min-height:22px;margin-top:6px}
body.narrow .bq-cap{min-height:18px;margin-top:3px}
.bq-cap i{font-style:normal;font-weight:900;font-size:12px;width:22px;height:22px;line-height:18px;text-align:center;border-radius:50%;background:#fff;border:2px solid;flex:none;box-shadow:0 1px 2px rgba(17,24,39,.12)}
body.narrow .bq-cap i{width:17px;height:17px;font-size:10px;line-height:13px;border-width:1.5px}
.bq-cap i.r{color:#f43f5e;border-color:#f43f5e}.bq-cap i.k{color:#1e293b;border-color:#1e293b}
.bq-log{flex:1;min-height:60px;overflow:auto;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 8px;font-size:14px}
.bq-log h4{margin:0 4px 6px;font-size:12px;color:var(--mute);letter-spacing:.08em;font-weight:700}
.bq-log ol{margin:0;padding:0;list-style:none;font-weight:500}
.bq-log li{padding:3px 8px;border-radius:8px;display:flex;gap:8px}
.bq-log li:nth-child(odd){background:var(--panel2)}
.bq-log li span:first-child{color:var(--mute);font-size:12px;min-width:22px;align-self:center}
.bq-log .r{color:#f43f5e;font-weight:700}.bq-log .k{color:#1e293b;font-weight:700}
.bq-log li.cur{background:#ffedd5}
body.narrow .bq-log{display:none}
body.narrow.mv .bq-log{display:block;width:100%;max-width:560px;flex:1 1 0;min-height:0;align-self:center;padding:8px 6px;font-size:13px}
body.narrow.mv .bq-last{display:none}
.bq-last{display:none;font-weight:700;font-size:14px;color:var(--mute);text-align:center;min-height:1.5em}
body.narrow .bq-last{display:block}
.bq-think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f97316;margin-left:6px;animation:bqp 1s infinite}
.bq-left{font-size:12px;color:var(--mute);text-align:center}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}.tb-title{margin:0 2px;flex:none}}
@media (max-width:350px){.tb-title{display:none}}
@keyframes bqp{0%,100%{opacity:.25}50%{opacity:1}}
</style>

<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html">← 棋牌</a>
  <h1 class="tb-title">暗棋</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bNew">新局</button>
  <button class="tb-btn" id="bUndo">悔棋</button>

</header>
<main class="tb-main" id="main">
  <aside class="bq-side" id="side">
    <div class="bq-status" id="status"></div>
    <div class="bq-pl">
      <div class="bq-p" id="pTop"><div class="nm"></div><div class="bq-cap"></div></div>
      <div class="bq-p" id="pBot"><div class="nm"></div><div class="bq-cap"></div></div>

    <div class="bq-log" id="logBox"><h4>對局紀錄</h4><ol id="log"></ol></div>
  </aside>
  <canvas id="cv" aria-label="暗棋棋盤"></canvas>
  <div class="bq-last" id="last"></div>
</main>
<script src="common.js"></script>
<script>
'use strict';
function LOGIC(self) {
  // 4×8 棋盤，i = r*8 + c。棋子 = 顏色*8 + 種類；紅 0、黑 1。
  // 種類：1 帥將 2 仕士 3 相象 4 俥車 5 傌馬 6 炮包 7 兵卒
  const KG = 1, AD = 2, EL = 3, RK = 4, HS = 5, CN = 6, PN = 7;
  const RANK = [0, 7, 6, 5, 4, 3, 2, 1];
  const COUNT = [0, 1, 2, 2, 2, 2, 2, 5];
  const VAL = [0, 60, 40, 25, 18, 12, 30, 8];
  const FLIP = 1024;
  const col = p => p >> 3, typ = p => p & 7;
  function canEat(p, q) {
    const a = typ(p), b = typ(q);
    if (a === CN) return true;            // 炮跳吃，任何子都可以
    if (a === KG && b === PN) return false;
    if (a === PN && b === KG) return true;
    return RANK[a] >= RANK[b];
  }
  const NB = []; // 鄰格
  for (let i = 0; i < 32; i++) { const r = i >> 3, c = i & 7, l = []; if (r > 0) l.push(i - 8); if (r < 3) l.push(i + 8); if (c > 0) l.push(i - 1); if (c < 7) l.push(i + 1); NB.push(l); }
  const DIRS = [[-1, 0], [1, 0], [0, -1], [0, 1]];
  // board：已翻開的子（蓋著的是 0），hid：1 = 蓋著
  function gen(board, hid, c, out, capsOnly) {
    out = out || [];
    for (let i = 0; i < 32; i++) {
      const p = board[i]; if (!p || hid[i] || col(p) !== c) continue;
      if (typ(p) === CN) {
        if (!capsOnly) for (const j of NB[i]) if (!board[j] && !hid[j]) out.push(i * 32 + j);
        const r0 = i >> 3, c0 = i & 7;
        for (const [dr, dc] of DIRS) {
          let r = r0 + dr, cc = c0 + dc, screen = false;
          while (r >= 0 && r < 4 && cc >= 0 && cc < 8) {
            const j = r * 8 + cc, occ = board[j] || hid[j];
            if (occ) {
              if (!screen) screen = true;
              else { if (!hid[j] && col(board[j]) !== c) out.push(i * 32 + j); break; }
            }
            r += dr; cc += dc;
          }
        }
      } else {
        for (const j of NB[i]) {
          if (hid[j]) continue;
          const q = board[j];
          if (!q) { if (!capsOnly) out.push(i * 32 + j); }
          else if (col(q) !== c && canEat(p, q)) out.push(i * 32 + j);
        }
      }
    }
    if (!capsOnly) for (let i = 0; i < 32; i++) if (hid[i]) out.push(FLIP + i);
    return out;
  }

  // ---------------- 電腦 ----------------
  let B, H, POOL, nodes, deadline, stop;
  function pieceVal(p, kAlive) {
    const t = typ(p);
    if (t === PN) return VAL[PN] + (kAlive[col(p) ^ 1] ? 6 : 0);
    if (t === KG) return VAL[KG] - (kAlive[col(p) ^ 1] ? 0 : 0);
    return VAL[t];
  }
  function kingsAlive() {
    const k = [0, 0];
    for (let i = 0; i < 32; i++) if (B[i] && !H[i] && typ(B[i]) === KG) k[col(B[i])] = 1;
    if (POOL[KG]) k[0] = 1; if (POOL[8 + KG]) k[1] = 1;
    return k;
  }
  function material(c) {
    const k = kingsAlive(); let s = 0;
    for (let i = 0; i < 32; i++) { const p = B[i]; if (p && !H[i]) s += (col(p) === c ? 1 : -1) * pieceVal(p, k); }
    for (let p = 1; p < 16; p++) if (POOL[p]) s += (col(p) === c ? 1 : -1) * POOL[p] * pieceVal(p, k) * 0.9;
    return s;
  }
  // 誰能吃到什麼：最大的一口
  function bestBite(c) {
    let best = 0; const l = gen(B, H, c, [], true);
    for (const m of l) { const v = VAL[typ(B[m & 31])]; if (v > best) best = v; }
    return best;
  }
  function staticEval(c) {
    // 輪到 c：c 可以先吃一口，對手的威脅打折
    return material(c) + 0.85 * bestBite(c) - 0.35 * bestBite(c ^ 1);
  }
  function quiesce(c, alpha, beta, d) {
    if ((++nodes & 1023) === 0 && Date.now() > deadline) stop = true;
    const sp = material(c) - 0.3 * bestBite(c ^ 1);
    if (d <= 0 || stop) return sp;
    if (sp >= beta) return sp;
    if (sp > alpha) alpha = sp;
    const l = gen(B, H, c, [], true);
    l.sort((a, b) => VAL[typ(B[b & 31])] - VAL[typ(B[a & 31])]);
    for (const m of l) {
      const a = m >> 5, b = m & 31, q = B[b];
      B[b] = B[a]; B[a] = 0;
      const s = -quiesce(c ^ 1, -beta, -alpha, d - 1);
      B[a] = B[b]; B[b] = q;
      if (s >= beta) return s;
      if (s > alpha) alpha = s;
    }
    return alpha;
  }
  function poolTotal() { let n = 0; for (let p = 1; p < 16; p++) n += POOL[p]; return n; }
  // 翻開位置 s 的期望值（對 c 來說）
  function flipValue(s, c, depth, root) {
    const tot = poolTotal(); if (!tot) return -1e9;
    let v = 0; H[s] = 0;
    for (let p = 1; p < 16; p++) {
      const n = POOL[p]; if (!n) continue;
      B[s] = p; POOL[p]--;
      const x = (depth > 0 && root) ? -search(c ^ 1, depth - 1, false) : -staticEval(c ^ 1);
      POOL[p]++;
      v += n * x;
      if (stop) break;
    }
    B[s] = 0; H[s] = 1;
    return v / tot;
  }
  function search(c, depth, root) {
    if ((++nodes & 1023) === 0 && Date.now() > deadline) stop = true;
    if (stop) return 0;
    if (depth <= 0) return quiesce(c, -1e9, 1e9, 4);
    const l = gen(B, H, c, []);
    if (!l.length) return -500;
    // 沒有子（含蓋著的）就輸
    let mine = 0; for (let i = 0; i < 32; i++) if (B[i] && !H[i] && col(B[i]) === c) mine++;
    for (let p = c * 8 + 1; p < c * 8 + 8; p++) mine += POOL[p];
    if (!mine) return -500;
    let best = -1e9;
    for (const m of l) {
      let v;
      if (m >= FLIP) v = flipValue(m - FLIP, c, depth, root && depth >= 2);
      else {
        const a = m >> 5, b = m & 31, q = B[b];
        B[b] = B[a]; B[a] = 0;
        let oppLeft = 0; for (let i = 0; i < 32; i++) if (B[i] && !H[i] && col(B[i]) !== c) oppLeft++;
        for (let p = (c ^ 1) * 8 + 1; p < (c ^ 1) * 8 + 8; p++) oppLeft += POOL[p];
        v = oppLeft ? -search(c ^ 1, depth - 1, false) : 500;
        B[a] = B[b]; B[b] = q;
      }
      if (v > best) best = v;
      if (stop) break;
    }
    return best;
  }
  function think(o) {
    B = Int8Array.from(o.board); H = Int8Array.from(o.hid); POOL = Int8Array.from(o.pool);
    nodes = 0; stop = false; const t0 = Date.now(); deadline = t0 + (o.time || 2500);
    const c = o.color, l = gen(B, H, c, []);
    if (!l.length) return { move: -1 };
    // 還沒決定顏色（第一手）：隨便翻
    if (c < 0) return { move: FLIP + Math.floor(Math.random() * 32) };
    const scoreAll = depth => {
      const res = [];
      for (const m of l) {
        let v;
        if (m >= FLIP) v = flipValue(m - FLIP, c, depth, depth >= 2);
        else {
          const a = m >> 5, b = m & 31, q = B[b];
          B[b] = B[a]; B[a] = 0;
          let oppLeft = 0; for (let i = 0; i < 32; i++) if (B[i] && !H[i] && col(B[i]) !== c) oppLeft++;
          for (let p = (c ^ 1) * 8 + 1; p < (c ^ 1) * 8 + 8; p++) oppLeft += POOL[p];
          v = oppLeft ? -search(c ^ 1, depth - 1, false) : 500;
          B[a] = B[b]; B[b] = q;
        }
        if (stop) return null;
        res.push([m, v]);
      }
      return res;
    };
    let scored = null;
    for (let d = 1; d <= (o.depth || 2); d++) {
      const r = scoreAll(d);
      if (!r) break;
      scored = r;
      if (Date.now() - t0 > (o.time || 2500) * 0.35) break;
    }
    if (!scored) { stop = false; deadline = Date.now() + 1e9; scored = scoreAll(1); }
    const noise = o.noise || 0;
    let best = scored[0][0], bv = -1e18;
    for (const [m, v] of scored) {
      const x = v + (Math.random() * 2 - 1) * (noise + 0.5);
      if (x > bv) { bv = x; best = m; }
    }
    if (o.randomRate && Math.random() < o.randomRate) best = l[Math.floor(Math.random() * l.length)];
    return { move: best, nodes };
  }
  self.X = { KG, AD, EL, RK, HS, CN, PN, RANK, COUNT, VAL, FLIP, canEat, gen, col, typ };
  self.onmessage = e => think(e.data);
}


// ======================================================================
// 主畫面
// ======================================================================
const L = {}; LOGIC(L); const X = L.X;
const AI = TB.worker(LOGIC);
const GAME = 'banqi';
const LEVELS = [
  { name: '簡單', depth: 1, noise: 22, randomRate: 0.2 },
  { name: '普通', depth: 2, noise: 3 },
  { name: '困難', depth: 3, time: 2200 },
];
const NAMES = ['', '帥', '仕', '相', '俥', '傌', '炮', '兵', '', '將', '士', '象', '車', '馬', '包', '卒'];
const CNAME = ['紅', '黑'];
const QUIET_LIMIT = 50;

let settings = Object.assign({ mode: 'ai', level: 2, first: 'me' }, TB.store.get('banqi:settings', {}));
// G：layout（真正的棋子）、board（目前看得到的子；蓋著的那格放真正的子）、hid、player（0 先手 1 後手）、
//    colorOf[player]（翻第一顆之前是 -1）、moves[{m,cap,p}]、quiet、over
let G = null;
let sel = -1, targets = [], hint = -1, thinking = false, anim = null;

const human = () => settings.first === 'me' ? 0 : 1;           // 對電腦時，人是幾號玩家
const curColor = () => G.colorOf[G.player];
function aiTurn() { return settings.mode === 'ai' && !G.over && G.player !== human(); }
function shuffleLayout() {
  const a = []; for (let c = 0; c < 2; c++) for (let t = 1; t <= 7; t++) for (let k = 0; k < X.COUNT[t]; k++) a.push(c * 8 + t);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fresh(layout) {
  G = { layout: layout.slice(), board: layout.slice(), hid: new Array(32).fill(1), player: 0, colorOf: [-1, -1], moves: [], quiet: 0, over: null };
}
function newGame() {
  fresh(shuffleLayout());
  sel = -1; targets = []; hint = -1; anim = null;
  save(); render(); maybeAI();
}
function save() { TB.store.set('banqi:game', { settings, layout: G.layout, moves: G.moves.map(x => x.m), over: G.over }); }
function load() {
  const s = TB.store.get('banqi:game', null);
  if (!s || !Array.isArray(s.layout) || s.layout.length !== 32 || !Array.isArray(s.moves)) return false;
  try {
    settings = Object.assign(settings, s.settings || {});
    fresh(s.layout);
    for (const m of s.moves) { if (!legal().includes(m)) throw 0; applyMove(m, true); }
    G.over = s.over || null;
    return true;
  } catch (e) { return false; }
}
// 看得到的盤面（蓋著的是 0）
function visible() { return G.board.map((p, i) => G.hid[i] ? 0 : p); }
function legal() {
  const c = curColor();
  if (c < 0) { const l = []; for (let i = 0; i < 32; i++) if (G.hid[i]) l.push(X.FLIP + i); return l; }
  return X.gen(visible(), G.hid, c, []);
}
function piecesLeft(c) { let n = 0; for (let i = 0; i < 32; i++) if (G.board[i] && X.col(G.board[i]) === c) n++; return n; }
function describe(m) {
  if (m >= X.FLIP) { const p = G.board[m - X.FLIP]; return { html: '翻開 <span class="' + (X.col(p) ? 'k' : 'r') + '">' + NAMES[p] + '</span>', txt: '翻開' + CNAME[X.col(p)] + NAMES[p] }; }
  const a = m >> 5, b = m & 31, p = G.board[a], q = G.board[b];
  const cls = x => X.col(x) ? 'k' : 'r';
  if (q) return { html: '<span class="' + cls(p) + '">' + NAMES[p] + '</span> 吃 <span class="' + cls(q) + '">' + NAMES[q] + '</span>', txt: NAMES[p] + '吃' + NAMES[q] };
  const d = b - a, dir = d === -8 ? '上' : d === 8 ? '下' : d === -1 ? '左' : d === 1 ? '右' : '';
  return { html: '<span class="' + cls(p) + '">' + NAMES[p] + '</span> 往' + dir + '走', txt: NAMES[p] + '往' + dir + '走' };
}
function applyMove(m, quiet) {
  const d = describe(m);
  let cap = 0, p;
  if (m >= X.FLIP) {
    const s = m - X.FLIP; G.hid[s] = 0; p = G.board[s];
    if (G.colorOf[G.player] < 0) { G.colorOf[G.player] = X.col(p); G.colorOf[G.player ^ 1] = X.col(p) ^ 1; }
    G.quiet = 0;
    if (!quiet) { anim = { kind: 'flip', s, p, t0: performance.now() }; TB.sfx('flip'); }
  } else {
    const a = m >> 5, b = m & 31; p = G.board[a]; cap = G.board[b];
    G.board[b] = p; G.board[a] = 0;
    G.quiet = cap ? 0 : G.quiet + 1;
    if (!quiet) { anim = { kind: 'move', from: a, to: b, p, cap, t0: performance.now() }; TB.sfx(cap ? 'capture' : 'place'); }
  }
  G.moves.push({ m, cap, p, html: d.html, txt: d.txt, by: G.player });
  G.player ^= 1;
  checkEnd(quiet);
}
function checkEnd(quiet) {
  let over = null;
  const moverColor = G.colorOf[G.player ^ 1], c = curColor();
  if (c >= 0) {
    if (!piecesLeft(c)) over = { winner: G.player ^ 1, why: CNAME[c] + '方的棋子全部被吃光' };
    else if (!legal().length) over = { winner: G.player ^ 1, why: CNAME[c] + '方已經無棋可走' };
    else if (G.quiet >= QUIET_LIMIT) over = { winner: -1, why: '雙方連續 ' + QUIET_LIMIT + ' 步沒有吃子也沒有翻棋' };
  }
  G.over = over;
  if (over && !quiet) finish();
  void moverColor;
}
function finish() {
  const o = G.over, ai = settings.mode === 'ai', me = human();
  TB.bump(GAME, 'played');
  if (o.winner === -1) TB.bump(GAME, 'draw');
  else if (ai && o.winner === me) { TB.bump(GAME, 'won'); TB.bump(GAME, 'won-lv' + settings.level); }
  save();
  const eloRes = ai ? TB.elo.update(GAME, settings.level - 1, LEVELS.length, o.winner === -1 ? 0.5 : o.winner === me ? 1 : 0) : null;
  let title, snd;
  const cn = w => CNAME[G.colorOf[w]] + '方';
  if (o.winner === -1) { title = '和局'; snd = 'draw'; }
  else if (ai) { title = o.winner === me ? '你贏了！' : '電腦贏了'; snd = o.winner === me ? 'win' : 'lose'; }
  else { title = cn(o.winner) + '勝'; snd = 'win'; }
  setTimeout(() => {
    TB.sfx(snd);
    TB.dialog({ title, html: '<p>' + o.why + (o.winner >= 0 ? '，' + cn(o.winner) + '獲勝。' : '。') + '</p><p>共 ' + G.moves.length + ' 步。</p>' + (eloRes ? TB.elo.html(eloRes) : ''),
      buttons: [{ label: '看棋盤', value: 0 }, { label: '再來一局', primary: true, value: 1 }] })
      .then(v => { if (v === 1) newGame(); });
  }, 500);
}
function aiInput(extra) {
  const pool = new Array(16).fill(0);
  for (let i = 0; i < 32; i++) if (G.hid[i]) pool[G.board[i]]++;
  return Object.assign({ board: visible(), hid: G.hid.slice(), pool, color: curColor() }, extra);
}
function maybeAI() {
  render();
  if (!aiTurn() || thinking) return;
  thinking = true; render();
  const lv = LEVELS[settings.level - 1] || LEVELS[1];
  const startLen = G.moves.length, t0 = performance.now();
  AI.ask(aiInput({ depth: lv.depth, time: lv.time, noise: lv.noise, randomRate: lv.randomRate })).then(res => {
    const wait = Math.max(0, 450 - (performance.now() - t0));
    setTimeout(() => {
      thinking = false;
      if (!G || G.over || G.moves.length !== startLen || !res || res.move < 0) { render(); return; }
      let m = res.move;
      if (!legal().includes(m)) { const l = legal(); m = l[Math.floor(Math.random() * l.length)]; }
      hint = -1; applyMove(m); save(); render(); loop();
      if (!G.over) setTimeout(maybeAI, 700);
    }, wait);
  }).catch(() => { thinking = false; render(); });
}

// ---------------- 畫面配置 ----------------
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const main = document.getElementById('main');
let U = 60, DPR = 1, VERT = false, PAD = 10;
function layout() {
  const W = main.clientWidth, H = main.clientHeight;
  const narrow = W < 720 || W < H * 1.05;
  document.body.classList.toggle('narrow', narrow);
  const side = document.getElementById('side'), last = document.getElementById('last'), box = document.getElementById('logBox');
  if (narrow) { if (box.parentNode !== main) main.insertBefore(box, last); }
  else if (box.parentNode !== side) side.appendChild(box);
  document.body.classList.remove('mv');
  let aw, ah;
  if (narrow) { aw = W - 16; ah = H - 16 - side.offsetHeight - last.offsetHeight - 16; }
  else { aw = W - 24 - 270 - 18; ah = H - 24; }
  // 直向窄螢幕：棋盤轉成 4 欄 × 8 列
  VERT = narrow && ah > aw * 1.1;
  const cols = VERT ? 4 : 8, rows = VERT ? 8 : 4;
  U = Math.max(30, Math.floor(Math.min((aw - 20) / cols, (ah - 20) / rows, 110)));
  PAD = Math.round(U * 0.16);
  if (narrow && H - 16 - side.offsetHeight - (rows * U + PAD * 2) - 16 >= 90) document.body.classList.add('mv');
  DPR = Math.min(3, window.devicePixelRatio || 1);
  const w = cols * U + PAD * 2, h = rows * U + PAD * 2;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  draw();
}
function cell2xy(i) { const r = i >> 3, c = i & 7; return VERT ? [PAD + (3 - r) * U + U / 2, PAD + c * U + U / 2] : [PAD + c * U + U / 2, PAD + r * U + U / 2]; }
function xy2cell(x, y) {
  const a = Math.floor((x - PAD) / U), b = Math.floor((y - PAD) / U);
  let r, c;
  if (VERT) { if (a < 0 || a > 3 || b < 0 || b > 7) return -1; r = 3 - a; c = b; }
  else { if (a < 0 || a > 7 || b < 0 || b > 3) return -1; r = b; c = a; }
  return r * 8 + c;
}
function drawBoard() {
  const w = cv.width / DPR, h = cv.height / DPR;
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#fff7e6'); gr.addColorStop(1, '#ffedd0');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 32; i++) {
    const [x, y] = cell2xy(i);
    g.fillStyle = ((i >> 3) + (i & 7)) & 1 ? 'rgba(249,115,22,.07)' : 'rgba(255,255,255,.55)';
    g.beginPath(); g.roundRect ? g.roundRect(x - U / 2 + 2, y - U / 2 + 2, U - 4, U - 4, U * 0.16) : g.rect(x - U / 2 + 2, y - U / 2 + 2, U - 4, U - 4); g.fill();
  }
  g.strokeStyle = 'rgba(234,88,12,.22)'; g.lineWidth = 1.5;
  g.beginPath(); g.roundRect ? g.roundRect(PAD - 2, PAD - 2, w - PAD * 2 + 4, h - PAD * 2 + 4, U * 0.2) : g.rect(PAD - 2, PAD - 2, w - PAD * 2 + 4, h - PAD * 2 + 4); g.stroke();
}
function drawBack(x, y, sx, opt) {
  const r = U * 0.4; opt = opt || {};
  g.save(); g.translate(x, y - (opt.lift ? U * 0.06 : 0)); g.scale(sx, 1);
  g.shadowColor = 'rgba(234,88,12,.35)'; g.shadowBlur = U * 0.14; g.shadowOffsetY = U * 0.06;
  const gr = g.createLinearGradient(-r, -r, r, r); gr.addColorStop(0, '#fdba74'); gr.addColorStop(.55, '#f97316'); gr.addColorStop(1, '#ea580c');
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fillStyle = gr; g.fill();
  g.shadowColor = 'transparent';
  g.beginPath(); g.arc(0, 0, r * 0.74, 0, 7); g.lineWidth = U * 0.025; g.strokeStyle = 'rgba(255,255,255,.75)'; g.stroke();
  g.beginPath(); for (let k = 0; k < 4; k++) { const a = k * Math.PI / 2; g.moveTo(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2); g.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5); }
  g.lineWidth = U * 0.03; g.lineCap = 'round'; g.strokeStyle = 'rgba(255,255,255,.65)'; g.stroke();
  g.beginPath(); g.arc(0, 0, r * 0.1, 0, 7); g.fillStyle = 'rgba(255,255,255,.85)'; g.fill();
  if (opt.ring) { g.beginPath(); g.arc(0, 0, r + U * 0.06, 0, 7); g.lineWidth = U * 0.05; g.strokeStyle = opt.ring; g.stroke(); }
  g.restore();
}
function drawPiece(p, x, y, opt) {
  opt = opt || {};
  const r = U * 0.4, red = X.col(p) === 0, col = red ? '#f43f5e' : '#1e293b';
  const lift = opt.lift ? U * 0.07 : 0, cy = y - lift, sx = opt.sx == null ? 1 : opt.sx;
  g.save();
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  g.translate(x, cy); g.scale(sx, 1);
  g.shadowColor = red ? 'rgba(244,63,94,.28)' : 'rgba(30,41,59,.28)'; g.shadowBlur = U * (opt.lift ? 0.35 : 0.14); g.shadowOffsetY = U * (opt.lift ? 0.15 : 0.06);
  g.beginPath(); g.arc(0, 0, r, 0, 7); g.fillStyle = '#fff'; g.fill();
  g.shadowColor = 'transparent';
  g.beginPath(); g.arc(0, 0, r - U * 0.04, 0, 7); g.lineWidth = U * 0.08; g.strokeStyle = col; g.stroke();
  g.beginPath(); g.arc(0, 0, r * 0.7, 0, 7); g.lineWidth = U * 0.018; g.strokeStyle = red ? 'rgba(244,63,94,.35)' : 'rgba(30,41,59,.3)'; g.stroke();
  g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 ' + Math.round(U * 0.4) + 'px "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
  g.fillText(NAMES[p], 0, U * 0.02);
  if (opt.ring) { g.beginPath(); g.arc(0, 0, r + U * 0.06, 0, 7); g.lineWidth = U * 0.05; g.strokeStyle = opt.ring; g.stroke(); }
  g.restore();
}
function draw() {
  if (!G) return;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBoard();
  const lm = G.moves[G.moves.length - 1];
  const mark = (i, a) => { const [x, y] = cell2xy(i); g.save(); g.strokeStyle = 'rgba(99,102,241,' + a + ')'; g.lineWidth = Math.max(2, U * 0.045); g.beginPath(); g.roundRect ? g.roundRect(x - U / 2 + 3, y - U / 2 + 3, U - 6, U - 6, U * 0.16) : g.rect(x - U / 2 + 3, y - U / 2 + 3, U - 6, U - 6); g.stroke(); g.restore(); };
  if (lm) { if (lm.m >= X.FLIP) mark(lm.m - X.FLIP, 1); else { mark(lm.m >> 5, .4); mark(lm.m & 31, 1); } }
  let ap = 0; if (anim) { ap = Math.min(1, (performance.now() - anim.t0) / (anim.kind === 'flip' ? 360 : 220)); if (ap >= 1) anim = null; }
  for (let i = 0; i < 32; i++) {
    const p = G.board[i]; if (!p) continue;
    if (anim && ((anim.kind === 'flip' && i === anim.s) || (anim.kind === 'move' && i === anim.to))) continue;
    const [x, y] = cell2xy(i);
    if (G.hid[i]) drawBack(x, y, 1, { ring: hint >= X.FLIP && hint - X.FLIP === i ? '#10b981' : null });
    else drawPiece(p, x, y, { lift: i === sel, ring: i === sel ? '#f59e0b' : null });
  }
  if (hint >= 0 && hint < X.FLIP) {
    const [fx, fy] = cell2xy(hint >> 5), [tx, ty] = cell2xy(hint & 31);
    g.save(); g.strokeStyle = 'rgba(16,185,129,.9)'; g.fillStyle = 'rgba(16,185,129,.9)'; g.lineWidth = U * 0.1; g.lineCap = 'round';
    const ang = Math.atan2(ty - fy, tx - fx), ex = tx - Math.cos(ang) * U * 0.28, ey = ty - Math.sin(ang) * U * 0.28;
    g.beginPath(); g.moveTo(fx, fy); g.lineTo(ex, ey); g.stroke();
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(ex - Math.cos(ang - 0.5) * U * 0.26, ey - Math.sin(ang - 0.5) * U * 0.26); g.lineTo(ex - Math.cos(ang + 0.5) * U * 0.26, ey - Math.sin(ang + 0.5) * U * 0.26); g.closePath(); g.fill();
    g.restore();
  }
  for (const t of targets) {
    const [x, y] = cell2xy(t);
    if (G.board[t] && !G.hid[t]) { g.save(); g.beginPath(); g.arc(x, y, U * 0.46, 0, 7); g.lineWidth = U * 0.06; g.strokeStyle = 'rgba(244,63,94,.95)'; g.setLineDash([U * .1, U * .07]); g.stroke(); g.restore(); }
    else { g.beginPath(); g.arc(x, y, U * 0.13, 0, 7); g.fillStyle = 'rgba(16,185,129,.85)'; g.fill(); }
  }
  if (anim) {
    if (anim.kind === 'flip') {
      const [x, y] = cell2xy(anim.s), lift = Math.sin(ap * Math.PI);
      const sx = Math.abs(Math.cos(ap * Math.PI));
      if (ap < 0.5) drawBack(x, y - lift * U * 0.12, Math.max(0.02, sx));
      else drawPiece(anim.p, x, y - lift * U * 0.12, { sx: Math.max(0.02, sx) });
    } else {
      const [fx, fy] = cell2xy(anim.from), [tx, ty] = cell2xy(anim.to), e = 1 - Math.pow(1 - ap, 3);
      if (anim.cap) drawPiece(anim.cap, tx, ty, { alpha: 1 - ap });
      drawPiece(anim.p, fx + (tx - fx) * e, fy + (ty - fy) * e, { lift: ap < 1 });
    }
  }
}
function loop() { draw(); if (anim) requestAnimationFrame(loop); }

// ---------------- 側欄 ----------------
function render() {
  if (!G) return;
  const st = document.getElementById('status');
  const lv = LEVELS[settings.level - 1] || LEVELS[1];
  const cname = c => c < 0 ? '' : '<b class="' + (c ? 'k' : 'r') + '">' + CNAME[c] + '方</b>';
  const pname = pl => settings.mode === 'ai' ? (pl === human() ? '你' : '電腦') : (pl === 0 ? '先手' : '後手');
  if (G.over) {
    const o = G.over;
    st.innerHTML = o.winner === -1 ? '和局・' + o.why : cname(G.colorOf[o.winner]) + ' 勝・' + o.why;
  } else if (thinking) st.innerHTML = '電腦（' + lv.name + '）思考中<span class="bq-think"></span>';
  else if (curColor() < 0) st.innerHTML = '<b class="o">' + pname(G.player) + '</b>先翻一顆棋，翻到的顏色就是' + (settings.mode === 'ai' && G.player === human() ? '你' : '他') + '的顏色';
  else {
    let s = '輪到 ' + cname(curColor()) + '（' + pname(G.player) + '）';
    if (G.quiet >= QUIET_LIMIT - 10) s += '<br><small style="color:#ea580c">再 ' + (QUIET_LIMIT - G.quiet) + ' 步沒吃子或翻棋就和局</small>';
    st.innerHTML = s;
  }
  // 玩家卡：下面是自己（對電腦）／先手
  const botPl = settings.mode === 'ai' ? human() : 0, topPl = botPl ^ 1;
  for (const [id, pl] of [['pTop', topPl], ['pBot', botPl]]) {
    const el = document.getElementById(id), c = G.colorOf[pl];
    el.classList.toggle('on', !G.over && G.player === pl);
    const nm = settings.mode === 'ai' ? (pl === human() ? '你' : '電腦 ' + lv.name) : (pl === 0 ? '先手' : '後手');
    el.querySelector('.nm').innerHTML = '<span class="bq-dot ' + (c < 0 ? '' : c ? 'k' : 'r') + '"></span>' + (c < 0 ? '' : CNAME[c] + '方・') + nm;
    const caps = G.moves.filter(mv => mv.cap && mv.by === pl).map(mv => mv.cap).sort((a, b) => X.RANK[b & 7] - X.RANK[a & 7]);
    el.querySelector('.bq-cap').innerHTML = caps.map(p => '<i class="' + (X.col(p) ? 'k' : 'r') + '">' + NAMES[p] + '</i>').join('');
  }
  const ol = document.getElementById('log');
  ol.innerHTML = G.moves.map((mv, i) => '<li' + (i === G.moves.length - 1 ? ' class="cur"' : '') + '><span>' + (i + 1) + '.</span><span>' + mv.html + '</span></li>').join('');
  const box = document.getElementById('logBox'); box.scrollTop = box.scrollHeight;
  let hidden = 0; for (let i = 0; i < 32; i++) if (G.hid[i]) hidden++;
  const lmv = G.moves[G.moves.length - 1];
  document.getElementById('last').textContent = lmv ? '第 ' + G.moves.length + ' 步：' + lmv.txt + (hidden ? '・還有 ' + hidden + ' 顆蓋著' : '') : '先翻一顆棋開始';
  document.getElementById('bUndo').disabled = settings.mode === 'ai' ? !G.moves.some(m => m.by === human()) : !G.moves.length;
  document.getElementById('bHint').disabled = !!G.over || aiTurn() || thinking;
  draw();
}

// ---------------- 操作 ----------------
function canTouch() { return G && !G.over && !thinking && !anim && !aiTurn(); }
function play(m) {
  sel = -1; targets = []; hint = -1;
  applyMove(m); save(); render(); loop();
  if (!G.over) setTimeout(maybeAI, 400);
}
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (!canTouch()) return;
  const [x, y] = evPos(e), i = xy2cell(x, y);
  if (i < 0) { sel = -1; targets = []; draw(); return; }
  const lm = legal();
  if (sel >= 0 && targets.includes(i)) { play(sel * 32 + i); return; }
  if (G.hid[i]) { if (lm.includes(X.FLIP + i)) play(X.FLIP + i); return; }
  const p = G.board[i];
  if (p && X.col(p) === curColor()) {
    sel = i; targets = lm.filter(m => m < X.FLIP && (m >> 5) === i).map(m => m & 31);
    TB.sfx(targets.length ? 'select' : 'bad'); draw();
  } else { if (sel >= 0 && p) TB.sfx('bad'); sel = -1; targets = []; draw(); }
});

document.getElementById('bNew').onclick = () => {
  const html = TB.seg('對手', 'mode', [['ai', '電腦'], ['pvp', '兩人同一台']], settings.mode) +
    TB.seg('電腦強度', 'level', LEVELS.map((l, i) => [i + 1, l.name]), settings.level) + TB.elo.hint(GAME, LEVELS.map(l => l.name)) +
    TB.seg('誰先翻', 'first', [['me', '我先'], ['ai', '電腦先']], settings.first) +
    '<p style="font-size:13px">32 顆棋子全部蓋著、隨機排列。第一個翻棋的人，翻到什麼顏色就執那一色。</p>';
  TB.dialog({ title: '新的一局', html, buttons: [{ label: '取消', value: 0 }, {
    label: '開始', primary: true, value: 1, onClick: dlg => {
      settings = { mode: TB.segVal(dlg, 'mode'), level: +TB.segVal(dlg, 'level'), first: TB.segVal(dlg, 'first') };
      TB.store.set('banqi:settings', settings);
    } }] }).then(v => { if (v === 1) { if (thinking) { AI.kill(); thinking = false; } newGame(); } });
};
document.getElementById('bUndo').onclick = () => {
  if (!G.moves.length) return;
  if (thinking) { AI.kill(); thinking = false; }
  let keep = G.moves.length - 1;
  if (settings.mode === 'ai') { const me = human(); while (keep > 0 && G.moves[keep].by !== me) keep--; if (G.moves[keep].by !== me) return; }
  const ms = G.moves.slice(0, keep).map(x => x.m), lay = G.layout;
  fresh(lay);
  for (const m of ms) applyMove(m, true);
  G.over = null; sel = -1; targets = []; hint = -1; anim = null;
  TB.sfx('click'); save(); render(); maybeAI();
};
document.getElementById('bHint').onclick = () => {
  if (!canTouch()) return;
  const b = document.getElementById('bHint'); b.disabled = true; b.textContent = '想想…';
  const len = G.moves.length;
  AI.ask(aiInput({ depth: 2, time: 1200 })).then(res => {
    b.textContent = '提示';
    if (G.moves.length !== len || res.move < 0 || !legal().includes(res.move)) { render(); return; }
    hint = res.move; sel = -1; targets = []; TB.sfx('select');
    TB.toast(res.move >= X.FLIP ? '建議：翻開綠圈那一顆' : '建議：' + describe(res.move).txt); render();
  }).catch(() => { b.textContent = '提示'; render(); });
};
document.getElementById('bInfo').onclick = () => {
  const s = TB.stats(GAME), p = s.played || 0, w = s.won || 0;
  TB.dialog({ title: '暗棋', html: TB.statsHtml([['已下', p], ['贏電腦', w], ['和局', s.draw || 0], ['勝率', p ? Math.round(w / p * 100) + '%' : '—'], ...TB.elo.stat(GAME)]) +
    `<div class="tb-rules">
    <h4>開始</h4><p>32 顆象棋棋子全部蓋著，隨機排在 4×8 的格子裡。先手翻開第一顆，翻到紅色就執紅方、翻到黑色就執黑方，對手執另一色。</p>
    <h4>每一步可以</h4><ul><li><b>翻開</b>任何一顆蓋著的棋子（翻到哪一色都算，翻完就換人）。</li>
    <li><b>移動</b>自己一顆已翻開的棋子，上下左右走一格（不能斜走）。</li>
    <li><b>吃子</b>：走到相鄰的敵方棋子上把它吃掉。</li></ul>
    <h4>大小</h4><p>帥/將 ＞ 仕/士 ＞ 相/象 ＞ 俥/車 ＞ 傌/馬 ＞ 炮/包 ＞ 兵/卒。大的可以吃小的，同樣大小也可以互吃。</p><ul>
    <li><b>兵/卒可以吃帥/將</b>，但帥/將不能吃兵/卒。</li>
    <li><b>炮/包</b>：平常也是走一格，但吃子時要像象棋一樣「隔一顆子跳吃」，中間剛好隔一顆（蓋著的也算），跳過去的距離不限。炮可以吃任何大小的子。</li>
    <li>只能吃<b>已經翻開</b>的棋子，蓋著的不能吃。</li></ul>
    <h4>勝負</h4><ul><li>把對方的棋子全部吃光，或對方輪到時沒有棋可以走（不能翻也不能動），就贏了。</li>
    <li>雙方合計連續 ${QUIET_LIMIT} 步沒有吃子也沒有翻棋，算和局。</li></ul>
    <h4>操作</h4><p>點蓋著的棋子就翻開；點自己的棋子，綠點是可以走的地方，紅色虛線圈是可以吃的子。棋局會自動保存。</p>
    </div>`, buttons: [{ label: '關閉', primary: true }] });
};

addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(main);
if (!load()) newGame();
else { layout(); render(); maybeAI(); }
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
</script>
</body>
</html>
