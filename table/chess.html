<!doctype html>
<html lang="zh-Hant">
<head>

<title>西洋棋 · 棋牌桌遊</title>

<style>
:root{--accent:#3b82f6;--accent-ink:#2563eb;--accent-soft:#eff6ff}
.tb-main{flex-direction:row;align-items:center;justify-content:center;gap:20px}
body.narrow .tb-main{flex-direction:column;justify-content:flex-start;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#cv{display:block;touch-action:none;border-radius:18px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(59,130,246,.22);flex:none}
.cs-side{width:270px;flex:none;align-self:stretch;max-height:100%;display:flex;flex-direction:column;gap:12px;min-height:0;padding:4px 0}
body.narrow .cs-side{width:100%;max-width:560px;align-self:center;gap:6px;padding:0}
.cs-status{font-size:16px;font-weight:500;text-align:center;padding:10px 12px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);min-height:44px}
body.narrow .cs-status{font-size:14px;padding:6px 10px;min-height:0;border-radius:12px}
.cs-status .warn{color:#fff;background:#f43f5e;font-weight:700;padding:1px 10px;border-radius:999px}
.cs-pl{display:flex;flex-direction:column;gap:8px}
body.narrow .cs-pl{flex-direction:row;gap:6px}
.cs-p{border:2px solid transparent;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 12px;flex:1;min-width:0;transition:border-color .2s}
body.narrow .cs-p{padding:5px 9px;border-radius:12px}
.cs-p.on{border-color:#3b82f6;background:#f3f8ff}
.cs-p .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.narrow .cs-p .nm{font-size:12px;gap:5px}
.cs-dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #1e293b}
.cs-dot.w{background:#fff}.cs-dot.b{background:#1e293b}
.cs-cap{display:flex;flex-wrap:wrap;align-items:center;gap:0;min-height:22px;margin-top:4px}
body.narrow .cs-cap{min-height:18px;margin-top:2px}
.cs-cap svg{width:20px;height:20px;margin-right:-4px}
body.narrow .cs-cap svg{width:16px;height:16px}
.cs-cap b{margin-left:8px;font-size:12px;color:var(--mute);font-weight:700}
.cs-moves{flex:1;min-height:60px;overflow:auto;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 8px;font-size:14px}
.cs-moves h4{margin:0 4px 6px;font-size:12px;color:var(--mute);letter-spacing:.08em;font-weight:700}
.cs-moves ol{margin:0;padding:0;list-style:none;font-weight:700;font-variant-numeric:tabular-nums}
.cs-moves li{display:grid;grid-template-columns:30px 1fr 1fr;gap:4px;padding:3px 6px;border-radius:8px}
.cs-moves li:nth-child(odd){background:var(--panel2)}
.cs-moves li span:first-child{color:var(--mute);font-weight:400;font-size:12px;align-self:center}
.cs-moves .cur{background:#dbeafe;border-radius:6px}
body.narrow .cs-moves{display:none}
body.narrow.mv .cs-moves{display:block;width:100%;max-width:560px;flex:1 1 0;min-height:0;align-self:center;padding:8px 6px;font-size:13px}
body.narrow.mv .cs-last{display:none}
.cs-last{display:none;font-weight:700;font-size:14px;color:var(--mute);text-align:center;min-height:1.5em}
body.narrow .cs-last{display:block}
.cs-think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b82f6;margin-left:6px;animation:csp 1s infinite}
.cs-promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cs-promo button{appearance:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700}
.cs-promo button:hover{border-color:#3b82f6;background:#eff6ff}
.cs-promo svg{width:44px;height:44px}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}.tb-title{margin:0 2px;flex:none}}
@media (max-width:350px){.tb-title{display:none}}
@keyframes csp{0%,100%{opacity:.25}50%{opacity:1}}
</style>

<body class="tb">
<header class="tb-bar">

<script src="common.js"></script>
<script>
'use strict';
function LOGIC(self) {
  // 0x88 棋盤：sq = rank*16 + file，rank 0 = 第 1 橫列（白方底線）
  // 棋子：白 1..6（兵馬象車后王），黑 = 白 + 8
  const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
  const VAL = [0, 100, 320, 330, 500, 900, 0];
  const T = s => s.trim().split(/[\s,]+/).map(Number);
  const PST = [];
  PST[P] = T(`0 0 0 0 0 0 0 0  50 50 50 50 50 50 50 50  10 10 20 30 30 20 10 10  5 5 10 25 25 10 5 5
    0 0 0 20 20 0 0 0  5 -5 -10 0 0 -10 -5 5  5 10 10 -20 -20 10 10 5  0 0 0 0 0 0 0 0`);
  PST[N] = T(`-50 -40 -30 -30 -30 -30 -40 -50  -40 -20 0 0 0 0 -20 -40  -30 0 10 15 15 10 0 -30  -30 5 15 20 20 15 5 -30
    -30 0 15 20 20 15 0 -30  -30 5 10 15 15 10 5 -30  -40 -20 0 5 5 0 -20 -40  -50 -40 -30 -30 -30 -30 -40 -50`);
  PST[B] = T(`-20 -10 -10 -10 -10 -10 -10 -20  -10 0 0 0 0 0 0 -10  -10 0 5 10 10 5 0 -10  -10 5 5 10 10 5 5 -10
    -10 0 10 10 10 10 0 -10  -10 10 10 10 10 10 10 -10  -10 5 0 0 0 0 5 -10  -20 -10 -10 -10 -10 -10 -10 -20`);
  PST[R] = T(`0 0 0 0 0 0 0 0  5 10 10 10 10 10 10 5  -5 0 0 0 0 0 0 -5  -5 0 0 0 0 0 0 -5
    -5 0 0 0 0 0 0 -5  -5 0 0 0 0 0 0 -5  -5 0 0 0 0 0 0 -5  0 0 0 5 5 0 0 0`);
  PST[Q] = T(`-20 -10 -10 -5 -5 -10 -10 -20  -10 0 0 0 0 0 0 -10  -10 0 5 5 5 5 0 -10  -5 0 5 5 5 5 0 -5
    0 0 5 5 5 5 0 -5  -10 5 5 5 5 5 0 -10  -10 0 5 0 0 0 0 -10  -20 -10 -10 -5 -5 -10 -10 -20`);
  PST[K] = T(`-30 -40 -40 -50 -50 -40 -40 -30  -30 -40 -40 -50 -50 -40 -40 -30  -30 -40 -40 -50 -50 -40 -40 -30  -30 -40 -40 -50 -50 -40 -40 -30
    -20 -30 -30 -40 -40 -30 -30 -20  -10 -20 -20 -20 -20 -20 -20 -10  20 20 0 0 0 0 20 20  20 30 10 0 0 10 30 20`);
  const KEG = T(`-50 -40 -30 -20 -20 -30 -40 -50  -30 -20 -10 0 0 -10 -20 -30  -30 -10 20 30 30 20 -10 -30  -30 -10 30 40 40 30 -10 -30
    -30 -10 30 40 40 30 -10 -30  -30 -10 20 30 30 20 -10 -30  -30 -30 0 0 0 0 -30 -30  -50 -30 -30 -30 -30 -30 -30 -50`);
  const PH = [0, 0, 1, 1, 2, 4, 0];

  const board = new Int8Array(128);
  let side = 0, castle = 0, ep = -1, half = 0, h1 = 0, h2 = 0;
  const ksq = [4, 116];
  let seed = 0x1F2E3D4C;
  function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
  const Z1 = new Int32Array(16 * 128), Z2 = new Int32Array(16 * 128);
  for (let i = 0; i < Z1.length; i++) { Z1[i] = rnd(); Z2[i] = rnd(); }
  const ZS1 = rnd(), ZS2 = rnd();
  const ZC1 = new Int32Array(16), ZC2 = new Int32Array(16); for (let i = 0; i < 16; i++) { ZC1[i] = rnd(); ZC2[i] = rnd(); }
  const ZE1 = new Int32Array(8), ZE2 = new Int32Array(8); for (let i = 0; i < 8; i++) { ZE1[i] = rnd(); ZE2[i] = rnd(); }
  const CR = new Int8Array(128).fill(15); CR[0] = 13; CR[7] = 14; CR[4] = 12; CR[112] = 7; CR[119] = 11; CR[116] = 3;
  const KN = [33, 31, 18, 14, -33, -31, -18, -14], KG = [1, -1, 16, -16, 15, 17, -15, -17];
  const BD = [15, 17, -15, -17], RD = [1, -1, 16, -16];

  // 吃過路兵只有在真的能吃時才算進局面（重複局面判斷用）
  function epKey() {
    if (ep < 0) return -1;
    const pw = side * 8 + P, back = side ? 16 : -16; // 能吃的兵站在 ep 的後面一排左右
    const a = ep + back - 1, b = ep + back + 1;
    if ((!(a & 0x88) && board[a] === pw) || (!(b & 0x88) && board[b] === pw)) return ep & 7;
    return -1;
  }
  function rehash() {
    h1 = 0; h2 = 0;
    for (let sq = 0; sq < 128; sq++) { if (sq & 0x88) continue; const p = board[sq]; if (p) { h1 ^= Z1[p * 128 + sq]; h2 ^= Z2[p * 128 + sq]; } }
    if (side) { h1 ^= ZS1; h2 ^= ZS2; }
    h1 ^= ZC1[castle]; h2 ^= ZC2[castle];
    const e = epKey(); if (e >= 0) { h1 ^= ZE1[e]; h2 ^= ZE2[e]; }
  }
  function init(o) {
    board.fill(0);
    for (let i = 0; i < 64; i++) board[(i >> 3) * 16 + (i & 7)] = o.board[i];
    side = o.side; castle = o.castle; ep = o.ep; half = o.half || 0;
    for (let sq = 0; sq < 128; sq++) if (!(sq & 0x88) && (board[sq] & 7) === K) ksq[board[sq] >> 3] = sq;
    rehash(); up = 0;
  }
  function attacked(sq, by) {
    if (by === 0) { if ((!((sq - 15) & 0x88) && board[sq - 15] === 1) || (!((sq - 17) & 0x88) && board[sq - 17] === 1)) return true; }
    else { if ((!((sq + 15) & 0x88) && board[sq + 15] === 9) || (!((sq + 17) & 0x88) && board[sq + 17] === 9)) return true; }
    const kn = by * 8 + N, kg = by * 8 + K, bq = by * 8 + Q, bb = by * 8 + B, br = by * 8 + R;
    for (const d of KN) { const t = sq + d; if (!(t & 0x88) && board[t] === kn) return true; }
    for (const d of KG) { const t = sq + d; if (!(t & 0x88) && board[t] === kg) return true; }
    for (const d of BD) { let t = sq + d; while (!(t & 0x88)) { const q = board[t]; if (q) { if (q === bb || q === bq) return true; break; } t += d; } }
    for (const d of RD) { let t = sq + d; while (!(t & 0x88)) { const q = board[t]; if (q) { if (q === br || q === bq) return true; break; } t += d; } }
    return false;
  }
  const inCheck = c => attacked(ksq[c], c ^ 1);
  const mv = (f, t, pr) => f | (t << 7) | ((pr || 0) << 14);
  function gen(list, caps) {
    const me = side;
    for (let sq = 0; sq < 128; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = board[sq]; if (!p || (p >> 3) !== me) continue;
      const t = p & 7;
      if (t === P) {
        const dir = me ? -16 : 16, last = me ? 0 : 7, start = me ? 6 : 1;
        const one = sq + dir;
        if (!(one & 0x88) && !board[one]) {
          if ((one >> 4) === last) { list.push(mv(sq, one, Q)); if (!caps) { list.push(mv(sq, one, R)); list.push(mv(sq, one, B)); list.push(mv(sq, one, N)); } }
          else if (!caps) { list.push(mv(sq, one)); const two = one + dir; if ((sq >> 4) === start && !board[two]) list.push(mv(sq, two)); }
        }
        for (const d of [dir - 1, dir + 1]) {
          const to = sq + d; if (to & 0x88) continue;
          const q = board[to];
          if ((q && (q >> 3) !== me) || to === ep) {
            if ((to >> 4) === last) { list.push(mv(sq, to, Q)); if (!caps) { list.push(mv(sq, to, R)); list.push(mv(sq, to, B)); list.push(mv(sq, to, N)); } }
            else list.push(mv(sq, to));
          }
        }
      } else if (t === N || t === K) {
        for (const d of (t === N ? KN : KG)) {
          const to = sq + d; if (to & 0x88) continue;
          const q = board[to];
          if (q ? (q >> 3) !== me : !caps) list.push(mv(sq, to));
        }
        if (t === K && !caps) {
          const o = me ? 112 : 0, en = me ^ 1;
          if (sq === o + 4) {
            if ((castle & (me ? 4 : 1)) && !board[o + 5] && !board[o + 6] && board[o + 7] === me * 8 + R && !attacked(o + 4, en) && !attacked(o + 5, en) && !attacked(o + 6, en)) list.push(mv(sq, o + 6));
            if ((castle & (me ? 8 : 2)) && !board[o + 3] && !board[o + 2] && !board[o + 1] && board[o] === me * 8 + R && !attacked(o + 4, en) && !attacked(o + 3, en) && !attacked(o + 2, en)) list.push(mv(sq, o + 2));
          }
        }
      } else {
        const ds = t === B ? BD : t === R ? RD : KG;
        for (const d of ds) {
          let to = sq + d;
          while (!(to & 0x88)) {
            const q = board[to];
            if (q) { if ((q >> 3) !== me) list.push(mv(sq, to)); break; }
            if (!caps) list.push(mv(sq, to));
            to += d;
          }
        }
      }
    }
    return list;
  }
  // 復原用的堆疊
  const U = []; let up = 0;
  function make(m) {
    const f = m & 127, to = (m >> 7) & 127, pr = m >> 14, p = board[f], t = p & 7;
    let cap = board[to], csq = to;
    if (t === P && to === ep && !cap) { csq = to + (side ? 16 : -16); cap = board[csq]; }
    U[up++] = [m, cap, csq, castle, ep, half, h1, h2];
    const oe = epKey();
    if (oe >= 0) { h1 ^= ZE1[oe]; h2 ^= ZE2[oe]; }
    h1 ^= ZC1[castle]; h2 ^= ZC2[castle];
    if (cap) { board[csq] = 0; h1 ^= Z1[cap * 128 + csq]; h2 ^= Z2[cap * 128 + csq]; }
    board[f] = 0; h1 ^= Z1[p * 128 + f]; h2 ^= Z2[p * 128 + f];
    const np = pr ? side * 8 + pr : p;
    board[to] = np; h1 ^= Z1[np * 128 + to]; h2 ^= Z2[np * 128 + to];
    if (t === K) {
      ksq[side] = to;
      if (to - f === 2 || f - to === 2) {
        const rf = to > f ? f + 3 : f - 4, rt = to > f ? f + 1 : f - 1, rp = side * 8 + R;
        board[rf] = 0; board[rt] = rp;
        h1 ^= Z1[rp * 128 + rf] ^ Z1[rp * 128 + rt]; h2 ^= Z2[rp * 128 + rf] ^ Z2[rp * 128 + rt];
      }
    }
    castle &= CR[f] & CR[to];
    ep = (t === P && (to - f === 32 || f - to === 32)) ? (f + to) >> 1 : -1;
    half = (t === P || cap) ? 0 : half + 1;
    side ^= 1; h1 ^= ZS1; h2 ^= ZS2;
    h1 ^= ZC1[castle]; h2 ^= ZC2[castle];
    const ne = epKey(); if (ne >= 0) { h1 ^= ZE1[ne]; h2 ^= ZE2[ne]; }
  }
  function unmake() {
    const [m, cap, csq, c0, e0, hf, a, b] = U[--up];
    side ^= 1;
    const f = m & 127, to = (m >> 7) & 127, pr = m >> 14;
    const np = board[to], p = pr ? side * 8 + P : np;
    board[f] = p; board[to] = 0;
    if (cap) board[csq] = cap;
    if ((p & 7) === K) {
      ksq[side] = f;
      if (to - f === 2 || f - to === 2) {
        const rf = to > f ? f + 3 : f - 4, rt = to > f ? f + 1 : f - 1;
        board[rf] = board[rt]; board[rt] = 0;
      }
    }
    castle = c0; ep = e0; half = hf; h1 = a; h2 = b;
  }
  function legal() {
    const out = [], l = gen([], false);
    for (const m of l) { make(m); if (!inCheck(side ^ 1)) out.push(m); unmake(); }
    return out;
  }
  function perft(d) {
    if (!d) return 1;
    const l = gen([], false); let n = 0;
    for (const m of l) { make(m); if (!inCheck(side ^ 1)) n += perft(d - 1); unmake(); }
    return n;
  }
  function insufficient() {
    const pcs = [];
    for (let sq = 0; sq < 128; sq++) { if (sq & 0x88) continue; const p = board[sq]; if (p && (p & 7) !== K) pcs.push([p, sq]); }
    if (!pcs.length) return true;
    if (pcs.some(([p]) => [P, R, Q].includes(p & 7))) return false;
    if (pcs.length === 1) return true; // 王＋單馬或單象
    // 只剩同色格的象
    if (pcs.every(([p]) => (p & 7) === B)) { const c = pcs.map(([, sq]) => ((sq >> 4) + (sq & 7)) & 1); return c.every(x => x === c[0]); }
    return false;
  }

  // ---------------- 評估 ----------------
  function evaluate() {
    let mg = 0, ph = 0, kw = 0, kb = 0;
    let s = 0;
    for (let sq = 0; sq < 128; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = board[sq]; if (!p) continue;
      const t = p & 7, c = p >> 3, r = sq >> 4, f = sq & 7;
      const i = c ? r * 8 + f : (7 - r) * 8 + f;
      ph += PH[t];
      if (t === K) { if (c) kb = i; else kw = i; continue; }
      const v = VAL[t] + PST[t][i];
      s += c ? -v : v;
    }
    const pp = Math.min(24, ph);
    const kv = i => (PST[K][i] * pp + KEG[i] * (24 - pp)) / 24;
    s += kv(kw) - kv(kb);
    return (side ? -s : s) + 10;
  }

  // ---------------- 搜尋 ----------------
  const MATE = 30000, INF = 32000;
  const TTN = 1 << 20; let TTK, TTS, TTD, TTF, TTM;
  const killers = new Int32Array(256), hist = new Int32Array(1 << 14);
  const HH1 = new Int32Array(1200), HH2 = new Int32Array(1200); let hp = 0;
  let stop = false, deadline = 0, nodes = 0;
  const hidx = m => (m & 127) << 7 | ((m >> 7) & 127);
  function quiesce(alpha, beta, ply) {
    if ((++nodes & 2047) === 0 && Date.now() > deadline) stop = true;
    if (stop) return 0;
    const sp = evaluate();
    if (sp >= beta) return sp;
    if (sp > alpha) alpha = sp;
    if (ply > 60) return sp;
    const l = gen([], true);
    const key = l.map(m => { const q = board[(m >> 7) & 127]; return (q ? VAL[q & 7] * 10 : 800) - VAL[board[m & 127] & 7] / 10 + (m >> 14 ? 9000 : 0); });
    const ord = l.map((_, i) => i).sort((a, b) => key[b] - key[a]);
    for (const i of ord) {
      const m = l[i]; make(m);
      if (inCheck(side ^ 1)) { unmake(); continue; }
      const s = -quiesce(-beta, -alpha, ply + 1); unmake();
      if (stop) return 0;
      if (s >= beta) return s;
      if (s > alpha) alpha = s;
    }
    return alpha;
  }
  function search(depth, alpha, beta, ply) {
    if ((++nodes & 2047) === 0 && Date.now() > deadline) stop = true;
    if (stop) return 0;
    if (ply && half >= 100) return 0;
    if (ply) { for (let i = hp - 2; i >= 0 && i >= hp - half - 1; i -= 2) if (HH1[i] === h1 && HH2[i] === h2) return 0; }
    const inC = inCheck(side);
    if (inC) depth++;
    if (depth <= 0) return quiesce(alpha, beta, ply);
    const ti = h1 & (TTN - 1);
    let ttMove = 0;
    if (TTK[ti] === h2) {
      ttMove = TTM[ti];
      if (ply && TTD[ti] >= depth) {
        const s = TTS[ti], f = TTF[ti];
        if (f === 0 || (f === 1 && s >= beta) || (f === 2 && s <= alpha)) return s;
      }
    }
    // 空著裁剪
    if (ply && !inC && depth >= 3 && beta < MATE - 300) {
      let big = false; for (let sq = 0; sq < 128 && !big; sq++) { if (sq & 0x88) continue; const p = board[sq]; if (p && (p >> 3) === side && (p & 7) > P && (p & 7) < K) big = true; }
      if (big && evaluate() >= beta) {
        const oe = ep, oh1 = h1, oh2 = h2, ek = epKey();

  if (drag && drag.moved) drawPiece(X.board[drag.sq], drag.x, drag.y - U * 0.12, { lift: true });
}
function findKing(c) { for (let i = 0; i < 64; i++) { const sq = toSq(i); if (X.board[sq] === c * 8 + X.K) return sq; } return 0; }
function loop() { draw(); if (anim) requestAnimationFrame(loop); }

// ---------------- 側欄 ----------------
function render() {
  if (!G) return;
  const st = document.getElementById('status');
  const who = s => s === 0 ? '<b>白方</b>' : '<b>黑方</b>';
  const lv = LEVELS[settings.level - 1] || LEVELS[1];
  const chk = !G.over && X.inCheck(X.side);
  if (G.over) st.innerHTML = G.over.winner === -1 ? '和局・' + G.over.why : who(G.over.winner) + ' 勝・' + G.over.why;
  else if (thinking) st.innerHTML = '電腦（' + lv.name + '）思考中<span class="cs-think"></span>';
  else {
    let s = '輪到 ' + who(X.side);
    if (settings.mode === 'ai' && X.side === humanColor()) s += '（你）';
    if (chk) s += '　<span class="warn">將軍！</span>';
    st.innerHTML = s;
  }
  const topSide = flipped() ? 0 : 1, botSide = 1 - topSide;
  const label = s => { const nm = s === 0 ? '白方' : '黑方'; return settings.mode === 'pvp' ? nm : nm + (s === humanColor() ? '・你' : '・電腦 ' + lv.name); };
  // 子力差
  let mat = 0; const VAL = [0, 1, 3, 3, 5, 9, 0];
  for (let i = 0; i < 64; i++) { const p = X.board[toSq(i)]; if (p) mat += (p >> 3 ? -1 : 1) * VAL[p & 7]; }
  for (const [id, s] of [['pTop', topSide], ['pBot', botSide]]) {
    const el = document.getElementById(id);
    el.classList.toggle('on', !G.over && X.side === s);
    el.querySelector('.nm').innerHTML = '<span class="cs-dot ' + (s === 0 ? 'w' : 'b') + '"></span>' + label(s);
    const caps = G.moves.filter((mv, i) => mv.cap && (i % 2) === s).map(mv => mv.cap).sort((a, b) => VAL[b & 7] - VAL[a & 7] || (b & 7) - (a & 7));
    const adv = s === 0 ? mat : -mat;
    el.querySelector('.cs-cap').innerHTML = caps.map(pieceSVG).join('') + (adv > 0 ? '<b>+' + adv + '</b>' : '');
  }
  const ol = document.getElementById('moves');
  let h = '';
  for (let i = 0; i < G.moves.length; i += 2) {
    const a = G.moves[i], b = G.moves[i + 1], last = G.moves.length - 1;
    h += '<li><span>' + (i / 2 + 1) + '.</span><span' + (i === last ? ' class="cur"' : '') + '>' + a.san + '</span><span' + (b && i + 1 === last ? ' class="cur"' : '') + '>' + (b ? b.san : '') + '</span></li>';
  }
  ol.innerHTML = h; const box = document.getElementById('movesBox'); box.scrollTop = box.scrollHeight;
  const lmv = G.moves[G.moves.length - 1];
  document.getElementById('last').textContent = lmv ? '第 ' + Math.ceil(G.moves.length / 2) + ' 回合：' + lmv.san : '白方先走';
  document.getElementById('bUndo').disabled = settings.mode === 'ai' ? G.moves.length < (settings.color === 'w' ? 1 : 2) : !G.moves.length;
  document.getElementById('bHint').disabled = !!G.over || aiTurn() || thinking;
  draw();
}

// ---------------- 操作 ----------------
function canTouch() { return G && !G.over && !thinking && !anim && !aiTurn(); }
function movesFrom(sq) { return X.legal().filter(m => (m & 127) === sq); }
function pickTargets(sq) { return [...new Set(movesFrom(sq).map(m => (m >> 7) & 127))]; }
function tryMove(from, to) {
  if (!targets.includes(to)) return false;
  const ms = movesFrom(from).filter(m => ((m >> 7) & 127) === to);
  sel = -1; targets = []; hint = 0;
  const go = m => { applyMove(m); save(); render(); loop(); if (!G.over) setTimeout(maybeAI, 220); };
  if (ms.length > 1) { // 升變
    draw();
    const c = X.side * 8;
    TB.dialog({ title: '兵升變', dismiss: false, html: '<p>士兵走到底線了，要變成哪一種棋子？</p><div class="cs-promo">' +
      [5, 4, 3, 2].map(t => '<button data-t="' + t + '">' + pieceSVG(c + t) + PNAME[t] + '</button>').join('') + '</div>', buttons: [] });
    document.querySelector('.cs-promo').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      TB.closeDialog(); TB.sfx('click');
      go(ms.find(m => (m >> 14) === +b.dataset.t));
    });
  } else go(ms[0]);
  return true;
}
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (!canTouch()) return;
  const [x, y] = evPos(e), sq = xy2sq(x, y);
  if (sq < 0) return;
  const p = X.board[sq];
  if (sel >= 0 && targets.includes(sq)) { tryMove(sel, sq); return; }
  if (p && (p >> 3) === X.side) {
    sel = sq; targets = pickTargets(sq); TB.sfx('select');
    drag = { sq, x, y, x0: x, y0: y, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    draw();
  } else if (sel >= 0) { if (p) TB.sfx('bad'); sel = -1; targets = []; draw(); }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const [x, y] = evPos(e); drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.x0, y - drag.y0) > U * 0.25) drag.moved = true;
  if (drag.moved) draw();
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    const [x, y] = evPos(e), sq = xy2sq(x, y);
    if (sq >= 0 && sq !== d.sq && targets.includes(sq)) { tryMove(d.sq, sq); return; }
    if (sq !== d.sq && sq >= 0) TB.sfx('bad');
  }
  draw();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; draw(); });

document.getElementById('bNew').onclick = () => {
  const html = TB.seg('對手', 'mode', [['ai', '電腦'], ['pvp', '兩人同一台']], settings.mode) +
    TB.seg('電腦棋力', 'level', LEVELS.map((l, i) => [i + 1, l.name]), settings.level) +
    TB.seg('我執', 'color', [['w', '白方（先走）'], ['b', '黑方']], settings.color) +
    '<p style="font-size:13px">入門常常走錯，適合剛學西洋棋的小朋友；大師每步大約想 3 秒。</p>';
  TB.dialog({ title: '新的一局', html, buttons: [{ label: '取消', value: 0 }, {
    label: '開始', primary: true, value: 1, onClick: dlg => {
      settings = { mode: TB.segVal(dlg, 'mode'), level: +TB.segVal(dlg, 'level'), color: TB.segVal(dlg, 'color') };
      TB.store.set('chess:settings', settings);
    } }] }).then(v => { if (v === 1) { if (thinking) { AI.kill(); thinking = false; } newGame(); } });
};
document.getElementById('bUndo').onclick = () => {
  if (!G.moves.length) return;
  if (thinking) { AI.kill(); thinking = false; }
  let n = 1;
  if (settings.mode === 'ai') { const me = humanColor(), len = G.moves.length; n = 0; do { n++; } while (len - n > 0 && (len - n) % 2 !== me); }
  const keep = G.moves.slice(0, G.moves.length - n).map(x => x.m);
  G = { moves: [], hashes: [], over: null }; resetPos();
  for (const m of keep) applyMove(m, true);
  G.over = null; sel = -1; targets = []; hint = 0; anim = null;
  TB.sfx('click'); save(); render(); maybeAI();
};
document.getElementById('bHint').onclick = () => {
  if (!canTouch()) return;
  const b = document.getElementById('bHint'); b.disabled = true; b.textContent = '想想…';
  const len = G.moves.length;
  AI.ask(Object.assign(X.state(), { hist: G.hashes.slice(0, -1).slice(-200), depth: 8, time: 900 })).then(res => {
    b.textContent = '提示';
    if (G.moves.length !== len || !res.move) { render(); return; }
    hint = res.move; sel = -1; targets = []; TB.sfx('select');
    TB.toast('建議：' + san(res.move)); render();
  }).catch(() => { b.textContent = '提示'; render(); });
};
document.getElementById('bInfo').onclick = () => {
  const s = TB.stats(GAME), p = s.played || 0, w = s.won || 0;
  const lvl = LEVELS.map((l, i) => s['won-lv' + (i + 1)] ? l.name + ' ' + s['won-lv' + (i + 1)] + ' 勝' : '').filter(Boolean).join('、');
  TB.dialog({ title: '西洋棋', html: TB.statsHtml([['已下', p], ['贏電腦', w], ['和局', s.draw || 0], ['勝率', p ? Math.round(w / p * 100) + '%' : '—']]) +
    (lvl ? '<p style="font-size:13px">' + lvl + '</p>' : '') +
    `<div class="tb-rules">
    <h4>目標</h4><p>把對方的「國王」將死（國王被攻擊、而且怎麼走都躲不掉）就贏了。白方先走。</p>
    <h4>棋子走法</h4><ul>
    <li><b>國王</b>：往任何方向走一格，不能走到會被吃的地方。</li>
    <li><b>皇后</b>：直線或斜線走任意格。</li>
    <li><b>城堡</b>：直線走任意格。</li>
    <li><b>主教</b>：斜線走任意格，所以一輩子都待在同一種顏色的格子。</li>
    <li><b>騎士</b>：走 L 字（直走兩格再橫走一格），可以跳過其他棋子。</li>
    <li><b>士兵</b>：往前走一格，第一步可以走兩格；吃子時是斜前方一格。</li></ul>
    <h4>特殊走法</h4><ul>
    <li><b>入堡</b>：國王和城堡都還沒動過、中間沒有棋子、國王沒有被將軍，而且國王經過的格子不會被攻擊時，國王往城堡方向走兩格，城堡跳到國王的另一邊。點國王，再點它右邊或左邊兩格就可以。</li>
    <li><b>吃過路兵</b>：對方的士兵第一步走兩格、剛好停在你的士兵旁邊時，你可以在下一步斜走到它「經過」的那一格把它吃掉。</li>
    <li><b>升變</b>：士兵走到對面底線，可以變成皇后、城堡、主教或騎士（通常選皇后）。</li></ul>
    <h4>和局</h4><ul>
    <li><b>逼和</b>：輪到的一方沒有被將軍，但已經沒有任何合法的走法。</li>
    <li>同一局面出現三次、連續 50 回合沒有吃子也沒有動士兵、或雙方都不夠子將死對方（例如只剩兩個國王）。</li></ul>
    <h4>棋譜記法</h4><p>例如 e4 是士兵走到 e4，Nf3 是騎士走到 f3，Bxc6 是主教在 c6 吃子；N 騎士、B 主教、R 城堡、Q 皇后、K 國王，x 表示吃子，+ 是將軍，# 是將死，O-O 是短入堡、O-O-O 是長入堡。</p>
    <h4>操作</h4><p>點一下自己的棋子，藍點是可以走的地方，藍色圈是可以吃的子；也可以直接拖曳。走錯可以按「悔棋」，不知道怎麼走可以按「提示」。棋局會自動保存。</p>
    </div>`, buttons: [{ label: '關閉', primary: true }] });
};

addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(main);
if (!load()) newGame();
else { layout(); render(); maybeAI(); }
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => layout());
</script>
</body>
</html>
