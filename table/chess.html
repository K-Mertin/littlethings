<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>西洋棋 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#3b82f6;--accent-ink:#2563eb;--accent-soft:#eff6ff}
.tb-main{flex-direction:row;align-items:center;justify-content:center;gap:20px}
body.narrow .tb-main{flex-direction:column;justify-content:flex-start;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#cv{display:block;touch-action:none;border-radius:18px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(59,130,246,.22);flex:none}
.cs-side{width:270px;flex:none;align-self:stretch;max-height:100%;display:flex;flex-direction:column;gap:12px;min-height:0;padding:4px 0}
body.narrow .cs-side{width:100%;max-width:560px;align-self:center;gap:6px;padding:0}
.cs-status{font-size:16px;font-weight:500;text-align:center;padding:10px 12px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);min-height:44px}
body.narrow .cs-status{font-size:14px;padding:6px 10px;min-height:0;border-radius:12px}
.cs-status .warn{color:#fff;background:#f43f5e;font-weight:700;padding:1px 10px;border-radius:999px}
.cs-pl{display:flex;flex-direction:column;gap:8px}
body.narrow .cs-pl{flex-direction:row;gap:6px}
.cs-p{border:2px solid transparent;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 12px;flex:1;min-width:0;transition:border-color .2s}
body.narrow .cs-p{padding:5px 9px;border-radius:12px}
.cs-p.on{border-color:#3b82f6;background:#f3f8ff}
.cs-p .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.narrow .cs-p .nm{font-size:12px;gap:5px}
.cs-dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #1e293b}
.cs-dot.w{background:#fff}.cs-dot.b{background:#1e293b}
.cs-cap{display:flex;flex-wrap:wrap;align-items:center;gap:0;min-height:22px;margin-top:4px}
body.narrow .cs-cap{min-height:18px;margin-top:2px}
.cs-cap svg{width:20px;height:20px;margin-right:-4px}
body.narrow .cs-cap svg{width:16px;height:16px}
.cs-cap b{margin-left:8px;font-size:12px;color:var(--mute);font-weight:700}
.cs-moves{flex:1;min-height:60px;overflow:auto;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 8px;font-size:14px}
.cs-moves h4{margin:0 4px 6px;font-size:12px;color:var(--mute);letter-spacing:.08em;font-weight:700}
.cs-moves ol{margin:0;padding:0;list-style:none;font-weight:700;font-variant-numeric:tabular-nums}
.cs-moves li{display:grid;grid-template-columns:30px 1fr 1fr;gap:4px;padding:3px 6px;border-radius:8px}
.cs-moves li:nth-child(odd){background:var(--panel2)}
.cs-moves li span:first-child{color:var(--mute);font-weight:400;font-size:12px;align-self:center}
.cs-moves .cur{background:#dbeafe;border-radius:6px}
body.narrow .cs-moves{display:none}
body.narrow.mv .cs-moves{display:block;width:100%;max-width:560px;flex:1 1 0;min-height:0;align-self:center;padding:8px 6px;font-size:13px}
body.narrow.mv .cs-last{display:none}
.cs-last{display:none;font-weight:700;font-size:14px;color:var(--mute);text-align:center;min-height:1.5em}
body.narrow .cs-last{display:block}
.cs-think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3b82f6;margin-left:6px;animation:csp 1s infinite}
.cs-promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.cs-promo button{appearance:none;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700}
.cs-promo button:hover{border-color:#3b82f6;background:#eff6ff}
.cs-promo svg{width:44px;height:44px}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}.tb-title{margin:0 2px;flex:none}}
@media (max-width:420px){.tb-title{display:none}}
/* 覆盤 */
.rv{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 8px}
.rv[hidden]{display:none}
body.narrow .rv{padding:6px 8px;gap:4px;border-radius:12px}
body.narrow.rvon .cs-pl{display:none}
.rv-sum{font-size:13px;color:var(--mute);line-height:1.5}
.rv-sum b{color:var(--ink)}
.rv-sum .g{color:#059669}.rv-sum .i{color:#ca8a04}.rv-sum .m{color:#ea580c}.rv-sum .x{color:#dc2626}
.rv canvas{width:100%;height:60px;display:block;border-radius:10px;cursor:pointer;touch-action:none}
body.narrow .rv canvas{height:46px}
.rv-ctl{display:flex;align-items:center;gap:4px}
.rv-ctl button{appearance:none;border:0;background:var(--panel2);border-radius:10px;min-width:36px;min-height:40px;font-size:16px;cursor:pointer}
.rv-ctl button:hover{background:#e6eaf2}
.rv-ctl button:disabled{opacity:.35;cursor:default}
.rv-ctl span{flex:1;text-align:center;white-space:nowrap;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.rv-note{font-size:14px;line-height:1.5;min-height:3em;padding:6px 10px;border-radius:10px;background:var(--panel2)}
body.narrow .rv-note{font-size:13px;min-height:2.6em;padding:4px 8px}
.rv-note b{font-weight:900}
.rv-note.good{background:#ecfdf5}.rv-note.inacc{background:#fefce8}.rv-note.mist{background:#fff7ed}.rv-note.blun{background:#fef2f2}
.rv-prog{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.rv-prog i{flex:1;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;position:relative}
.rv-prog i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:#6366f1;border-radius:99px;transition:width .2s}
.rv-prog[hidden]{display:none}
.cs-moves li span[data-i]{cursor:pointer;border-radius:6px;padding:0 2px}
.cs-moves li span[data-i]:hover{background:#eef2ff}
.cs-moves sup{font-size:11px;font-weight:900;margin-left:2px}
.sy-good{color:#059669;opacity:.55}.sy-inacc{color:#ca8a04}.sy-mist{color:#ea580c}.sy-blun{color:#dc2626}
body.rvon #cv{cursor:grab}
@keyframes csp{0%,100%{opacity:.25}50%{opacity:1}}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html">← 棋牌</a>
  <h1 class="tb-title">西洋棋</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bNew">新局</button>
  <button class="tb-btn" id="bUndo">悔棋</button>
  <button class="tb-btn" id="bHint">提示</button>
  <button class="tb-btn" id="bReview">覆盤</button>
  <button class="tb-btn" id="bInfo"><span class="tb-hide-s">規則・</span>戰績</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<main class="tb-main" id="main">
  <aside class="cs-side" id="side">
    <div class="cs-status" id="status"></div>
    <div class="rv" id="rv" hidden>
      <div class="rv-sum" id="rvSum"></div>
      <canvas id="rvCurve" aria-label="形勢曲線"></canvas>
      <div class="rv-ctl"><button data-a="first" aria-label="第一手">⏮</button><button data-a="prev" aria-label="上一手">◀</button><span id="rvPos"></span><button data-a="next" aria-label="下一手">▶</button><button data-a="last" aria-label="最後一手">⏭</button></div>
      <div class="rv-note" id="rvNote"></div>
      <div class="rv-prog" id="rvProg"><span id="rvProgT"></span><i id="rvProgB"></i></div>
    </div>
    <div class="cs-pl">
      <div class="cs-p" id="pTop"><div class="nm"></div><div class="cs-cap"></div></div>
      <div class="cs-p" id="pBot"><div class="nm"></div><div class="cs-cap"></div></div>
    </div>
    <div class="cs-moves" id="movesBox"><h4>棋譜</h4><ol id="moves"></ol></div>
  </aside>
  <canvas id="cv" aria-label="西洋棋棋盤"></canvas>
  <div class="cs-last" id="last"></div>
</main>
<script src="common.js"></script>
<script src="chess-logic.js"></script>
<script>
'use strict';
const LOGIC = CHLOGIC;
// ======================================================================
// 主畫面
// ======================================================================
const L = {}; LOGIC(L); const X = L.X;
const AI = TB.worker(LOGIC);
const GAME = 'chess';
const LEVELS = [
  { name: '入門', depth: 1, noise: 320 },
  { name: '初級', depth: 2, noise: 90 },
  { name: '中級', depth: 4, time: 500 },
  { name: '高級', depth: 8, time: 1500 },
  { name: '大師', depth: 40, time: 3000 },
];
const START = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const PNAME = ['', '士兵', '騎士', '主教', '城堡', '皇后', '國王'];
const LET = ['', '', 'N', 'B', 'R', 'Q', 'K'];
// 棋子造型：100×100 的 SVG 路徑（自己畫的簡潔現代風）
const BASE = 'M24 74h52a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-52a4 4 0 0 1-4-4v-6a4 4 0 0 1 4-4Z';
const SHAPE = {
  1: { body: ['M62 28A12 12 0 1 1 38 28A12 12 0 1 1 62 28Z', 'M39 46Q50 38 61 46L66 74L34 74Z', BASE] },
  2: { body: ['M32 74C31 60 40 54 44 49L33 52C26 53 23 46 27 41L44 25L46 13L54 21C69 24 77 40 72 74Z', BASE], dot: [54, 32, 3] },
  3: { body: ['M55 14A5 5 0 1 1 45 14A5 5 0 1 1 55 14Z', 'M50 20C68 32 66 52 59 60L41 60C34 52 32 32 50 20Z', 'M38 60h24v6h-24Z', 'M40 66L60 66L64 74L36 74Z', BASE], line: 'M55 33L45 45' },
  4: { body: ['M33 46L67 46L69 74L31 74Z', 'M28 18h9v8h7.5v-8h11v8h7.5v-8h9v28h-44Z', BASE], line: 'M33 46h34' },
  5: { body: ['M30 74L22 32L37 54L38 26L47 52L50 22L53 52L62 26L63 54L78 32L70 74Z',
    'M26 30A4 4 0 1 1 18 30A4 4 0 1 1 26 30Z', 'M42 24A4 4 0 1 1 34 24A4 4 0 1 1 42 24Z', 'M54 19A4 4 0 1 1 46 19A4 4 0 1 1 54 19Z', 'M66 24A4 4 0 1 1 58 24A4 4 0 1 1 66 24Z', 'M82 30A4 4 0 1 1 74 30A4 4 0 1 1 82 30Z', BASE], line: 'M30 64Q50 58 70 64' },
  6: { body: ['M47 8h6v7h7v6h-7v9h-6v-9h-7v-6h7Z', 'M30 74L25 44C35 34 65 34 75 44L70 74Z', BASE], line: 'M28 60Q50 54 72 60' },
};
const PATHS = {}; for (const t in SHAPE) PATHS[t] = { body: SHAPE[t].body.map(d => new Path2D(d)), line: SHAPE[t].line ? new Path2D(SHAPE[t].line) : null };
function pieceSVG(p) {
  const t = p & 7, black = p >> 3, s = SHAPE[t];
  const fill = black ? '#1e293b' : '#fff', stroke = black ? '#0f172a' : '#1e293b', detail = black ? '#fff' : '#1e293b';
  return '<svg viewBox="0 0 100 100">' + s.body.map(d => `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="4" stroke-linejoin="round"/>`).join('') +
    (s.line ? `<path d="${s.line}" fill="none" stroke="${detail}" stroke-width="3.5" stroke-linecap="round"/>` : '') +
    (s.dot ? `<circle cx="${s.dot[0]}" cy="${s.dot[1]}" r="${s.dot[2]}" fill="${detail}"/>` : '') + '</svg>';
}

let settings = Object.assign({ mode: 'ai', level: 2, color: 'w' }, TB.store.get('chess:settings', {}));
let G = null;   // {moves:[{m,san,cap}], hashes:[], over}
let sel = -1, targets = [], hint = 0, thinking = false, anim = null, drag = null;
let R = null;   // 覆盤中：見下方「覆盤」

const humanColor = () => settings.color === 'w' ? 0 : 1;
function aiTurn() { return settings.mode === 'ai' && !G.over && X.side !== humanColor(); }
function flipped() { return R ? R.flip : settings.mode === 'ai' && settings.color === 'b'; }

function resetPos() { X.init(X.fen(START)); G.hashes = [X.hash()]; }
function newGame() {
  if (R) exitReview(true);
  G = { moves: [], hashes: [], over: null };
  resetPos();
  sel = -1; targets = []; hint = 0; anim = null;
  save(); render(); maybeAI();
}
function save() { TB.store.set('chess:game', { settings, moves: G.moves.map(x => x.m), over: G.over }); }
function load() {
  const s = TB.store.get('chess:game', null);
  if (!s || !Array.isArray(s.moves)) return false;
  try {
    settings = Object.assign(settings, s.settings || {});
    G = { moves: [], hashes: [], over: null }; resetPos();
    for (const m of s.moves) { if (!X.legal().includes(m)) throw 0; applyMove(m, true); }
    G.over = s.over || null;
    return true;
  } catch (e) { return false; }
}
// 標準代數記譜（在走之前呼叫）
function san(m) {
  const f = m & 127, to = (m >> 7) & 127, pr = m >> 14, p = X.board[f], t = p & 7;
  const sqn = s => String.fromCharCode(97 + (s & 7)) + ((s >> 4) + 1);
  let s;
  if (t === X.K && Math.abs(to - f) === 2) s = to > f ? 'O-O' : 'O-O-O';
  else {
    const cap = X.board[to] || (t === X.P && (f & 7) !== (to & 7));
    if (t === X.P) s = (cap ? String.fromCharCode(97 + (f & 7)) + 'x' : '') + sqn(to) + (pr ? '=' + LET[pr] : '');
    else {
      const others = X.legal().filter(o => o !== m && ((o >> 7) & 127) === to && (X.board[o & 127] & 7) === t && (o & 127) !== f);
      let dis = '';
      if (others.length) {
        const sameFile = others.some(o => ((o & 127) & 7) === (f & 7)), sameRank = others.some(o => ((o & 127) >> 4) === (f >> 4));
        if (!sameFile) dis = String.fromCharCode(97 + (f & 7));
        else if (!sameRank) dis = String((f >> 4) + 1);
        else dis = sqn(f);
      }
      s = LET[t] + dis + (cap ? 'x' : '') + sqn(to);
    }
  }
  X.make(m);
  if (X.inCheck(X.side)) s += X.legal().length ? '+' : '#';
  X.unmake();
  return s;
}
function applyMove(m, quiet) {
  const txt = san(m);
  const f = m & 127, to = (m >> 7) & 127, p = X.board[f];
  let cap = X.board[to];
  if (!cap && (p & 7) === X.P && (f & 7) !== (to & 7)) cap = X.side ? 1 : 9;
  X.make(m);
  G.moves.push({ m, san: txt, cap, p }); G.hashes.push(X.hash());
  if (!quiet) { anim = { p, from: f, to, cap, t0: performance.now(), castle: (p & 7) === X.K && Math.abs(to - f) === 2 }; TB.sfx(cap ? 'capture' : 'place'); }
  checkEnd(quiet);
}
function checkEnd(quiet) {
  const lm = X.legal(), chk = X.inCheck(X.side);
  let over = null;
  if (!lm.length) over = chk ? { winner: X.side ^ 1, why: '將死' } : { winner: -1, why: '逼和（沒有被將軍、但已經無棋可走）' };
  else if (X.half >= 100) over = { winner: -1, why: '連續 50 回合沒有吃子也沒有動兵' };
  else if (X.insufficient()) over = { winner: -1, why: '雙方子力都不足以將死對方' };
  else {
    const [a, b] = G.hashes[G.hashes.length - 1];
    if (G.hashes.filter(h => h[0] === a && h[1] === b).length >= 3) over = { winner: -1, why: '同一局面出現三次' };
  }
  if (!quiet && chk && !over) TB.sfx('check');
  G.over = over;
  if (over && !quiet) finish();
}
function finish() {
  const o = G.over, ai = settings.mode === 'ai', me = humanColor();
  TB.bump(GAME, 'played');
  TB.store.set('chess:lastgame', { moves: G.moves.map(x => x.m), settings, over: o });
  if (o.winner === -1) TB.bump(GAME, 'draw');
  else if (ai && o.winner === me) { TB.bump(GAME, 'won'); TB.bump(GAME, 'won-lv' + settings.level); }
  save();
  const eloRes = ai ? TB.elo.update(GAME, settings.level - 1, LEVELS.length, o.winner === -1 ? 0.5 : o.winner === me ? 1 : 0) : null;
  let title, snd;
  if (o.winner === -1) { title = '和局'; snd = 'draw'; }
  else if (ai) { title = o.winner === me ? '你贏了！' : '電腦贏了'; snd = o.winner === me ? 'win' : 'lose'; }
  else { title = (o.winner === 0 ? '白方' : '黑方') + '勝'; snd = 'win'; }
  setTimeout(() => {
    TB.sfx(snd);
    TB.dialog({ title, html: '<p>' + o.why + (o.winner >= 0 ? '，' + (o.winner === 0 ? '白方' : '黑方') + '獲勝。' : '。') + '</p><p>共 ' + Math.ceil(G.moves.length / 2) + ' 回合。</p>' + (eloRes ? TB.elo.html(eloRes) : ''),
      buttons: [{ label: '看棋盤', value: 0 }, { label: '覆盤', value: 2 }, { label: '再來一局', primary: true, value: 1 }] })
      .then(v => { if (v === 1) newGame(); else if (v === 2) enterReview(); });
  }, 450);
}
function maybeAI() {
  render();
  if (!aiTurn() || thinking) return;
  thinking = true; render();
  const lv = LEVELS[settings.level - 1] || LEVELS[1];
  const startLen = G.moves.length, t0 = performance.now();
  AI.ask(Object.assign(X.state(), { hist: G.hashes.slice(0, -1).slice(-200), depth: lv.depth, time: lv.time, noise: lv.noise }))
    .then(res => {
      const wait = Math.max(0, 380 - (performance.now() - t0));
      setTimeout(() => {
        thinking = false;
        if (!G || G.over || G.moves.length !== startLen || !res || !res.move) { render(); return; }
        hint = 0; applyMove(res.move); save(); render(); loop();
      }, wait);
    }).catch(() => { thinking = false; render(); });
}

// ---------------- 畫面配置 ----------------
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const main = document.getElementById('main');
let U = 40, DPR = 1;
function layout() {
  const W = main.clientWidth, H = main.clientHeight;
  const narrow = W < 720 || W < H * 1.05;
  document.body.classList.toggle('narrow', narrow);
  const side = document.getElementById('side'), last = document.getElementById('last'), box = document.getElementById('movesBox');
  if (narrow) { if (box.parentNode !== main) main.insertBefore(box, last); }
  else if (box.parentNode !== side) side.appendChild(box);
  document.body.classList.remove('mv');
  let aw, ah;
  if (narrow) {
    aw = W - 16; ah = H - 16 - side.offsetHeight - last.offsetHeight - 16;
    U = Math.max(24, Math.floor(Math.min(aw, ah) / 8));
    if (H - 16 - side.offsetHeight - 8 * U - 16 >= 90) document.body.classList.add('mv');
  } else { aw = W - 24 - 270 - 18; ah = H - 24; U = Math.max(24, Math.floor(Math.min(aw, ah) / 8)); }
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = cv.style.height = U * 8 + 'px';
  cv.width = cv.height = Math.round(U * 8 * DPR);
  draw();
}
// 64 格索引 i = rank*8+file ↔ 0x88 sq
const toSq = i => (i >> 3) * 16 + (i & 7);
function sq2xy(sq) { let f = sq & 7, r = sq >> 4; if (flipped()) { f = 7 - f; r = 7 - r; } return [f * U + U / 2, (7 - r) * U + U / 2]; }
function xy2sq(x, y) {
  let f = Math.floor(x / U), r = 7 - Math.floor(y / U);
  if (f < 0 || f > 7 || r < 0 || r > 7) return -1;
  if (flipped()) { f = 7 - f; r = 7 - r; }
  return r * 16 + f;
}
const LIGHT = '#eef5ff', DARK = '#9cc3f5';
function drawBoard() {
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    g.fillStyle = (r + f) & 1 ? DARK : LIGHT;
    g.fillRect(f * U, r * U, U, U);
  }
  // 座標
  g.font = '700 ' + Math.max(9, Math.round(U * 0.2)) + 'px "Noto Sans TC",sans-serif';
  for (let i = 0; i < 8; i++) {
    const file = flipped() ? 7 - i : i, rank = flipped() ? i + 1 : 8 - i;
    g.fillStyle = (7 + i) & 1 ? LIGHT : '#2563eb'; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
    g.fillText(String.fromCharCode(97 + file), i * U + U - U * 0.07, 8 * U - U * 0.07);
    g.fillStyle = i & 1 ? LIGHT : '#2563eb'; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(String(rank), U * 0.07, i * U + U * 0.06);
  }
}
function drawPiece(p, x, y, opt) {
  opt = opt || {};
  const t = p & 7, black = p >> 3, s = U / 100 * (opt.lift ? 1.08 : 1);
  g.save();
  if (opt.alpha != null) g.globalAlpha = opt.alpha;

}
function enterReview() {

  TB.closeDialog();

  // 回放出每個局面

  X.init(X.fen(START));
  for (let i = 0; i <= src.moves.length; i++) {

  }

  R = { list, pos, hashes, idx: list.length, an: [], cls: [], bt: [], done: 0, gen: (R ? R.gen : 0) + 1, over: src.over || null,

  document.body.classList.add('rvon');

}

  const head = '第 ' + Math.ceil(k / 2) + ' 回合　' + who + ' <b>' + mv.txt + '</b>';

function rvGo(i) {

  i = Math.max(0, Math.min(R.list.length, i));

}
function renderReview() {
  if (!R) return;

  // 摘要
  const sides = R.me >= 0 ? [R.me] : [0, 1];
  const cnt = s => { const o = { good: 0, inacc: 0, mist: 0, blun: 0 }; R.cls.forEach((c, k) => { if (c && o[c.c] != null && R.list[k - 1].mover === s) o[c.c]++; }); return o; };
  document.getElementById('rvSum').innerHTML = sides.map(s => {
    const o = cnt(s), nm = (R.me >= 0 ? '你（' : '') + (s === 0 ? '白方' : '黑方') + (R.me >= 0 ? '）' : '');
    return '<b>' + nm + '</b>　<span class="g">好棋 ' + o.good + '</span>・<span class="i">緩著 ' + o.inacc + '</span>・<span class="m">失誤 ' + o.mist + '</span>・<span class="x">大失誤 ' + o.blun + '</span>';
  }).join('<br>');

  btn('next').disabled = btn('last').disabled = R.idx === R.list.length;

  document.getElementById('rvProgT').textContent = '分析中 ' + Math.min(R.done, R.list.length) + '/' + R.list.length;
  document.getElementById('rvProgB').style.setProperty('--p', Math.round(R.done / R.pos.length * 100) + '%');

  const VAL = [0, 1, 3, 3, 5, 9, 0]; let mat = 0;
  for (const p of R.pos[R.idx].board) if (p) mat += (p >> 3 ? -1 : 1) * VAL[p & 7];
  for (const [id, s] of [['pTop', topSide], ['pBot', botSide]]) {
    const el = document.getElementById(id);

    el.querySelector('.nm').innerHTML = '<span class="cs-dot ' + (s === 0 ? 'w' : 'b') + '"></span>' + label(s);
    const caps = R.list.slice(0, R.idx).filter(mv => mv.cap && mv.mover === s).map(mv => mv.cap).sort((a, b) => VAL[b & 7] - VAL[a & 7] || (b & 7) - (a & 7));
    const adv = s === 0 ? mat : -mat;
    el.querySelector('.cs-cap').innerHTML = caps.map(pieceSVG).join('') + (adv > 0 ? '<b>+' + adv + '</b>' : '');
  }
  // 棋譜（可點）
  const sym = k => { const c = R.cls[k]; return c && RV_CLS[c.c] && RV_CLS[c.c][0] ? '<sup class="sy-' + c.c + '">' + RV_CLS[c.c][0] + '</sup>' : ''; };
  let h = '';
  for (let i = 0; i < R.list.length; i += 2) {
    const a = R.list[i], b = R.list[i + 1];
    h += '<li><span>' + (i / 2 + 1) + '.</span><span data-i="' + (i + 1) + '"' + (R.idx === i + 1 ? ' class="cur"' : '') + '>' + a.txt + sym(i + 1) + '</span>' +
      (b ? '<span data-i="' + (i + 2) + '"' + (R.idx === i + 2 ? ' class="cur"' : '') + '>' + b.txt + sym(i + 2) + '</span>' : '<span></span>') + '</li>';
  }
  const ol = document.getElementById('moves'); ol.innerHTML = h;
  const cur = ol.querySelector('.cur'), box = document.getElementById('movesBox');
  if (cur) { const r1 = cur.getBoundingClientRect(), r2 = box.getBoundingClientRect(); if (r1.top < r2.top + 24 || r1.bottom > r2.bottom - 4) box.scrollTop += r1.top - r2.top - r2.height / 2; }
  else if (!R.idx) box.scrollTop = 0;
  const mv = R.list[R.idx - 1];
  document.getElementById('last').textContent = mv ? '第 ' + Math.ceil(R.idx / 2) + ' 回合：' + mv.txt : '開局';
  document.getElementById('bUndo').disabled = true;

}
function rvCurve() {
  const c = document.getElementById('rvCurve'), w = c.clientWidth, h = c.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(3, window.devicePixelRatio || 1);

  x.clearRect(0, 0, w, h); x.fillStyle = '#f8fafc'; x.fillRect(0, 0, w, h);
  const M = Math.max(1, R.list.length), X0 = 4, W0 = w - 8, px = i => X0 + i / M * W0;
  const red = i => { const a = R.an[i]; if (!a || a.s == null) return null; return rvWp(R.pos[i].side === 0 ? a.s : -a.s); };
  const pts = []; for (let i = 0; i < R.pos.length; i++) { const v = red(i); if (v != null) pts.push([px(i), 4 + (1 - v) * (h - 8)]); }
  const mid = h / 2;
  if (pts.length > 1) {
    for (const [col, clipTop] of [['rgba(59,130,246,.2)', true], ['rgba(30,41,59,.18)', false]]) {
      x.save(); x.beginPath(); clipTop ? x.rect(0, 0, w, mid) : x.rect(0, mid, w, h - mid); x.clip();
      x.beginPath(); x.moveTo(pts[0][0], mid); for (const [a, b] of pts) x.lineTo(a, b); x.lineTo(pts[pts.length - 1][0], mid); x.closePath(); x.fillStyle = col; x.fill(); x.restore();
    }
    x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.strokeStyle = '#6366f1'; x.lineWidth = 2; x.lineJoin = 'round'; x.stroke();
  }
  x.strokeStyle = 'rgba(100,116,139,.35)'; x.lineWidth = 1; x.setLineDash([3, 3]); x.beginPath(); x.moveTo(0, mid); x.lineTo(w, mid); x.stroke(); x.setLineDash([]);
  R.cls.forEach((cl, k) => {
    if (!cl || (cl.c !== 'mist' && cl.c !== 'blun')) return;
    const v = red(k); if (v == null) return;
    x.beginPath(); x.arc(px(k), 4 + (1 - v) * (h - 8), cl.c === 'blun' ? 4 : 3, 0, 7); x.fillStyle = cl.c === 'blun' ? '#dc2626' : '#ea580c'; x.fill();

  x.strokeStyle = '#111827'; x.lineWidth = 2; x.beginPath(); x.moveTo(px(R.idx), 0); x.lineTo(px(R.idx), h); x.stroke();
}
function drawArrow(m, col) {

  const ang = Math.atan2(ty - fy, tx - fx), hl = U * 0.36, ex = tx - Math.cos(ang) * hl * 0.8, ey = ty - Math.sin(ang) * hl * 0.8;
  g.beginPath(); g.moveTo(fx, fy); g.lineTo(ex, ey); g.stroke();
  g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx - Math.cos(ang - 0.5) * hl, ty - Math.sin(ang - 0.5) * hl); g.lineTo(tx - Math.cos(ang + 0.5) * hl, ty - Math.sin(ang + 0.5) * hl); g.closePath(); g.fill();
  g.restore();
}
function drawReview() {
  drawBoard();
  const P = R.pos[R.idx], b = P.board, mv = R.list[R.idx - 1];
  if (mv) { shade(mv.m & 127, 'rgba(250,204,21,.42)'); shade((mv.m >> 7) & 127, 'rgba(250,204,21,.55)'); }
  if (P.chk) for (let i = 0; i < 64; i++) if (b[i] === P.side * 8 + X.K) {
    const [x, y] = sq2xy(toSq(i));
    const gl = g.createRadialGradient(x, y, U * .1, x, y, U * .62); gl.addColorStop(0, 'rgba(244,63,94,.95)'); gl.addColorStop(1, 'rgba(244,63,94,0)');

    const A = R.an[R.idx - 1], cl = R.cls[R.idx];
    if (A && A.best && A.best !== mv.m && cl && cl.c !== 'good' && cl.c !== 'forced') drawArrow(A.best, 'rgba(37,99,235,.9)');

      g.lineWidth = Math.max(1.5, U * 0.03); g.strokeStyle = '#fff'; g.stroke();
      g.fillStyle = '#fff'; g.font = '900 ' + Math.round(U * (RV_CLS[cl.c][0].length > 1 ? 0.2 : 0.24)) + 'px "Noto Sans TC",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(RV_CLS[cl.c][0], bx, by + 1); g.restore();
    }

}
// 操作
document.getElementById('bReview').onclick = () => { if (R) exitReview(); else enterReview(); };
document.querySelector('.rv-ctl').addEventListener('click', e => {

  const a = b.dataset.a; rvGo(a === 'first' ? 0 : a === 'prev' ? R.idx - 1 : a === 'next' ? R.idx + 1 : R.list.length);
});
document.getElementById('moves').addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t && R) rvGo(+t.dataset.i); });
document.getElementById('rvCurve').addEventListener('pointerdown', e => {

addEventListener('keydown', e => {

{ // 棋盤上左右滑

}
