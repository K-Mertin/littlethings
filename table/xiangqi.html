<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<title>象棋 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--accent:#f43f5e;--accent-ink:#e11d48;--accent-soft:#fff1f3}
.tb-btn.primary{box-shadow:0 4px 12px rgba(244,63,94,.35)}
.tb-main{flex-direction:row;align-items:center;justify-content:center;gap:20px}
body.narrow .tb-main{flex-direction:column;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#cv{display:block;touch-action:none;border-radius:20px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(201,139,74,.25);flex:none}
.xq-side{width:270px;flex:none;align-self:stretch;max-height:100%;display:flex;flex-direction:column;gap:12px;min-height:0;padding:4px 0}
body.narrow .xq-side{width:100%;max-width:560px;align-self:center;gap:6px;padding:0}
.xq-status{font-size:16px;font-weight:500;text-align:center;padding:10px 12px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);min-height:44px}
body.narrow .xq-status{font-size:14px;padding:6px 10px;min-height:0;border-radius:12px}
.xq-status b.r{color:#f43f5e}.xq-status b.k{color:#1e293b}
.xq-status .warn{color:#fff;background:#f43f5e;font-weight:700;padding:1px 10px;border-radius:999px;animation:xqw .8s ease-in-out infinite alternate}
.xq-pl{display:flex;flex-direction:column;gap:8px}
body.narrow .xq-pl{flex-direction:row;gap:6px}
.xq-p{border:2px solid transparent;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 12px;flex:1;min-width:0;transition:border-color .2s}
body.narrow .xq-p{padding:5px 9px;border-radius:12px}
.xq-p.on{border-color:#f43f5e;background:#fff5f6}
.xq-p .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.narrow .xq-p .nm{font-size:12px;gap:5px}
.xq-dot{width:14px;height:14px;border-radius:50%;flex:none;border:3px solid;background:#fff}
.xq-dot.r{border-color:#f43f5e}.xq-dot.k{border-color:#1e293b}
.xq-cap{display:flex;flex-wrap:wrap;gap:3px;min-height:22px;margin-top:6px}
body.narrow .xq-cap{min-height:18px;margin-top:3px}
.xq-cap i{font-style:normal;font-weight:900;font-size:12px;width:22px;height:22px;line-height:18px;text-align:center;border-radius:50%;background:#fff;border:2px solid;flex:none;box-shadow:0 1px 2px rgba(17,24,39,.12)}
body.narrow .xq-cap i{width:17px;height:17px;font-size:10px;line-height:13px;border-width:1.5px}
.xq-cap i.r{color:#f43f5e;border-color:#f43f5e}.xq-cap i.k{color:#1e293b;border-color:#1e293b}
.xq-moves{flex:1;min-height:60px;overflow:auto;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 8px;font-size:14px}
.xq-moves h4{margin:0 4px 6px;font-size:12px;color:var(--mute);letter-spacing:.08em;font-weight:700}
.xq-moves ol{margin:0;padding:0;list-style:none;font-weight:700}
.xq-moves li{display:grid;grid-template-columns:30px 1fr 1fr;gap:4px;padding:3px 6px;border-radius:8px}
.xq-moves li:nth-child(odd){background:var(--panel2)}
.xq-moves li span:first-child{color:var(--mute);font-weight:400;font-size:12px;align-self:center}
.xq-moves .r{color:#f43f5e}
.xq-moves .cur{background:#ffe4e8;border-radius:6px}
body.narrow .xq-moves{display:none}
body.narrow .tb-main{justify-content:flex-start}
body.narrow.mv .xq-moves{display:block;width:100%;max-width:560px;flex:1 1 0;min-height:0;align-self:center;padding:8px 6px;font-size:13px}
body.narrow.mv .xq-last{display:none}
.xq-last{display:none;font-weight:700;font-size:14px;color:var(--mute);text-align:center;min-height:1.5em}
body.narrow .xq-last{display:block}
.xq-think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f43f5e;margin-left:6px;animation:xqp 1s infinite}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}.tb-title{margin:0 2px;flex:none}}
@media (max-width:420px){.tb-title{display:none}}
/* 覆盤 */
.rv{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:10px 10px 8px}
.rv[hidden]{display:none}
body.narrow .rv{padding:6px 8px;gap:4px;border-radius:12px}
body.narrow.rvon .xq-pl{display:none}
.rv-sum{font-size:13px;color:var(--mute);line-height:1.5}
.rv-sum b{color:var(--ink)}
.rv-sum .g{color:#059669}.rv-sum .i{color:#ca8a04}.rv-sum .m{color:#ea580c}.rv-sum .x{color:#dc2626}
.rv canvas{width:100%;height:60px;display:block;border-radius:10px;cursor:pointer;touch-action:none}
body.narrow .rv canvas{height:46px}
.rv-ctl{display:flex;align-items:center;gap:4px}
.rv-ctl button{appearance:none;border:0;background:var(--panel2);border-radius:10px;min-width:36px;min-height:40px;font-size:16px;cursor:pointer}
.rv-ctl button:hover{background:#e6eaf2}
.rv-ctl button:disabled{opacity:.35;cursor:default}
.rv-ctl span{flex:1;text-align:center;white-space:nowrap;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.rv-note{font-size:14px;line-height:1.5;min-height:3em;padding:6px 10px;border-radius:10px;background:var(--panel2)}
body.narrow .rv-note{font-size:13px;min-height:2.6em;padding:4px 8px}
.rv-note b{font-weight:900}
.rv-note.good{background:#ecfdf5}.rv-note.inacc{background:#fefce8}.rv-note.mist{background:#fff7ed}.rv-note.blun{background:#fef2f2}
.rv-prog{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:8px}
.rv-prog i{flex:1;height:6px;border-radius:99px;background:var(--panel2);overflow:hidden;position:relative}
.rv-prog i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:#6366f1;border-radius:99px;transition:width .2s}
.rv-prog[hidden]{display:none}
.xq-moves li span[data-i]{cursor:pointer;border-radius:6px;padding:0 2px}
.xq-moves li span[data-i]:hover{background:#eef2ff}
.xq-moves sup{font-size:11px;font-weight:900;margin-left:2px}
.sy-good{color:#059669;opacity:.55}.sy-inacc{color:#ca8a04}.sy-mist{color:#ea580c}.sy-blun{color:#dc2626}
body.rvon #cv{cursor:grab}
@keyframes xqp{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes xqw{from{box-shadow:0 0 0 0 rgba(244,63,94,.5)}to{box-shadow:0 0 0 6px rgba(244,63,94,0)}}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html">← 棋牌</a>
  <h1 class="tb-title">象棋</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bNew">新局</button>
  <button class="tb-btn" id="bUndo">悔棋</button>
  <button class="tb-btn" id="bHint">提示</button>
  <button class="tb-btn" id="bReview">覆盤</button>
  <button class="tb-btn" id="bInfo"><span class="tb-hide-s">規則・</span>戰績</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<main class="tb-main" id="main">
  <aside class="xq-side" id="side">
    <div class="xq-status" id="status"></div>
    <div class="rv" id="rv" hidden>
      <div class="rv-sum" id="rvSum"></div>
      <canvas id="rvCurve" aria-label="形勢曲線"></canvas>
      <div class="rv-ctl"><button data-a="first" aria-label="第一手">⏮</button><button data-a="prev" aria-label="上一手">◀</button><span id="rvPos"></span><button data-a="next" aria-label="下一手">▶</button><button data-a="last" aria-label="最後一手">⏭</button></div>
      <div class="rv-note" id="rvNote"></div>
      <div class="rv-prog" id="rvProg"><span id="rvProgT"></span><i id="rvProgB"></i></div>
    </div>
    <div class="xq-pl">
      <div class="xq-p" id="pTop"><div class="nm"></div><div class="xq-cap"></div></div>
      <div class="xq-p" id="pBot"><div class="nm"></div><div class="xq-cap"></div></div>
    </div>
    <div class="xq-moves" id="movesBox"><h4>棋譜</h4><ol id="moves"></ol></div>
  </aside>
  <canvas id="cv" aria-label="象棋棋盤"></canvas>
  <div class="xq-last" id="last"></div>
</main>
<script src="common.js"></script>
<script src="xq-logic.js"></script>
<script src="online.js"></script>
<script>
'use strict';
const LOGIC = XQLOGIC;
// ======================================================================
// 主畫面
// ======================================================================
const L = {}; LOGIC(L); const X = L.X;
const AI = TB.worker(LOGIC);
const GAME = 'xiangqi';
const LEVELS = [
  { name: '入門', depth: 1, noise: 260 },
  { name: '初級', depth: 2, noise: 90 },
  { name: '中級', depth: 4, time: 700 },
  { name: '高級', depth: 8, time: 1600 },
  { name: '大師', depth: 24, time: 3000 },
];
const NAMES = ['', '帥', '仕', '相', '傌', '俥', '炮', '兵', '', '將', '士', '象', '馬', '車', '包', '卒'];
const SHORT = ['', '帥', '仕', '相', '傌', '俥', '炮', '兵', '', '將', '士', '象', '馬', '車', '包', '卒'];
const RANK = [9, 9, 4, 3, 2, 0, 1, 5];
const CN = '零一二三四五六七八九', FW = '０１２３４５６７８９';
const START = (() => {
  const b = new Array(90).fill(0), back = [5, 4, 3, 2, 1, 2, 3, 4, 5];
  for (let c = 0; c < 9; c++) { b[c] = back[c] + 8; b[81 + c] = back[c]; }
  b[2 * 9 + 1] = b[2 * 9 + 7] = 14; b[7 * 9 + 1] = b[7 * 9 + 7] = 6;
  for (let c = 0; c < 9; c += 2) { b[3 * 9 + c] = 15; b[6 * 9 + c] = 7; }
  return b;
})();

let settings = Object.assign({ mode: 'ai', level: 2, color: 'r' }, TB.store.get('xiangqi:settings', {}));
let G = null;        // {board:Array, side, moves:[{m,cap,txt}], hashes:[[h1,h2]], over:null|{...}}
let sel = -1, targets = [], hint = 0, thinking = false, anim = null, drag = null;
let R = null;        // 覆盤中：見下方「覆盤」

function humanSide() { return settings.mode === 'pvp' ? G.side : (settings.color === 'r' ? 0 : 1); }
const ON = () => settings.mode === 'online' && typeof ONL !== 'undefined' && ONL.active;
function aiTurn() { return settings.mode === 'ai' && !G.over && G.side !== (settings.color === 'r' ? 0 : 1); }
function flipped() { return R ? R.flip : (settings.mode === 'ai' || settings.mode === 'online') && settings.color === 'b'; }

function newGame() {
  if (R) exitReview(true);
  G = { board: START.slice(), side: 0, moves: [], hashes: [], over: null };
  X.init(G.board, 0); G.hashes.push(X.hash());
  sel = -1; targets = []; hint = 0; anim = null;
  save(); render(); maybeAI();
}
function save() { if (settings.mode === 'online') return; TB.store.set('xiangqi:game', { settings, moves: G.moves.map(x => x.m), over: G.over }); }
function load() {
  const s = TB.store.get('xiangqi:game', null);
  if (!s || !Array.isArray(s.moves)) return false;
  try {
    settings = Object.assign(settings, s.settings || {});
    G = { board: START.slice(), side: 0, moves: [], hashes: [], over: null };
    X.init(G.board, 0); G.hashes.push(X.hash());
    for (const m of s.moves) { if (!X.legal().includes(m)) throw 0; applyMove(m, true); }
    G.over = s.over || null;
    return true;
  } catch (e) { return false; }
}

// 中文記譜（在走之前呼叫）
function notation(m, bd) {
  const b = bd || G.board, from = m >> 7, to = m & 127, p = b[from], t = p & 7, red = p < 8;
  const fr = (from / 9) | 0, fc = from % 9, tr = (to / 9) | 0, tc = to % 9;
  const num = n => red ? CN[n] : FW[n];
  const file = c => red ? 9 - c : c + 1;
  let head;
  const same = []; for (let r = 0; r < 10; r++) if (b[r * 9 + fc] === p) same.push(r);
  if (same.length >= 2) {
    const ord = red ? same.slice().sort((a, b) => a - b) : same.slice().sort((a, b) => b - a);
    const i = ord.indexOf(fr), n = ord.length;
    const tag = n === 2 ? ['前', '後'][i] : n === 3 ? ['前', '中', '後'][i] : CN[i + 1];
    head = tag + SHORT[p];
  } else head = SHORT[p] + num(file(fc));
  const fwd = red ? tr < fr : tr > fr;
  let act, tgt;
  if (tr === fr) { act = '平'; tgt = num(file(tc)); }
  else { act = fwd ? '進' : '退'; tgt = (t === X.N || t === X.B || t === X.A) ? num(file(tc)) : num(Math.abs(tr - fr)); }
  return head + act + tgt;
}
function applyMove(m, quiet) {
  const txt = notation(m);
  const from = m >> 7, to = m & 127, cap = G.board[to];
  X.init(G.board, G.side); X.make(m);
  G.board[to] = G.board[from]; G.board[from] = 0; G.side ^= 1;
  G.moves.push({ m, cap, txt }); G.hashes.push(X.hash());
  if (!quiet) {
    anim = { p: G.board[to], from, to, cap, t0: performance.now() };
    TB.sfx(cap ? 'capture' : 'place');
  }
  checkEnd(quiet);
}
// ---------------- 長將／長捉 ----------------
// 由開局回放出每一步之前的盤面：boards[j] = 第 j 步走之前
function replayBoards(moves) {
  const b = START.slice(), out = [b.slice()];
  for (const m of moves) { b[m & 127] = b[m >> 7]; b[m >> 7] = 0; out.push(b.slice()); }
  return out;
}
const SIDE_NAME = ['紅方', '黑方'];
/** 分析第 i0 步到最後這段重複循環，回傳 null（沒人違規或雙方都違規）或 { loser, kind } */
function repVerdict(moves, boards, i0) {
  const foul = [null, null];
  for (const s of [0, 1]) {
    let n = 0, checks = 0, ok = true, tgt = null;
    for (let j = i0; j < moves.length; j++) {
      if (j % 2 !== s) continue; // 紅方先走，第 j 步由 j%2 那方走
      n++;
      X.init(boards[j], s);
      const c = X.classify(moves[j]);
      if (c.check) { checks++; continue; }
      if (!c.chase.length) { ok = false; break; }
      tgt = tgt ? tgt.filter(x => c.chase.includes(x)) : c.chase.slice();
      if (!tgt.length) { ok = false; break; }
    }
    if (!n || !ok) continue;
    foul[s] = checks === n ? '長將' : checks === 0 ? '長捉' : '一將一捉';
  }
  X.init(G.board, G.side);
  if (foul[0] && !foul[1]) return { loser: 0, kind: foul[0] };
  if (foul[1] && !foul[0]) return { loser: 1, kind: foul[1] };
  return null;
}
function sameIdx(hashes, h) { const r = []; hashes.forEach((x, i) => { if (x[0] === h[0] && x[1] === h[1]) r.push(i); }); return r; }
/** side 這一方走了會「第三次重複而且自己違規判負」的步（給電腦和提示避開） */
function foulMoves(side) {
  if (G.over) return [];
  X.init(G.board, side);
  const cand = [];
  for (const m of X.legal()) { X.make(m); const h = X.hash(); X.unmake(); const idx = sameIdx(G.hashes, h); if (idx.length >= 2) cand.push([m, idx[idx.length - 2]]); }
  if (!cand.length) return [];
  const moves0 = G.moves.map(x => x.m), boards = replayBoards(moves0), out = [];
  for (const [m, i0] of cand) { const v = repVerdict(moves0.concat(m), boards, i0); if (v && v.loser === side) out.push(m); }
  X.init(G.board, G.side);
  return out;
}

function checkEnd(quiet) {
  X.init(G.board, G.side);
  const lm = X.legal(), chk = X.inCheck(G.side);
  let over = null;
  if (!lm.length) over = { winner: G.side ^ 1, why: chk ? '將死' : '困斃' };
  else {
    const idx = sameIdx(G.hashes, G.hashes[G.hashes.length - 1]);
    G.warn = null;
    if (idx.length >= 3) {
      const moves = G.moves.map(x => x.m), v = repVerdict(moves, replayBoards(moves), idx[idx.length - 3]);
      over = v ? { winner: v.loser ^ 1, why: SIDE_NAME[v.loser] + v.kind + '，判負' } : { winner: -1, why: '同一局面重複三次' };
    } else if (idx.length === 2) {
      const moves = G.moves.map(x => x.m), v = repVerdict(moves, replayBoards(moves), idx[0]);
      if (v) G.warn = v;
    }
    if (!over) {
      let n = 0; for (let i = G.moves.length - 1; i >= 0 && !G.moves[i].cap; i--) n++;
      if (n >= 120) over = { winner: -1, why: '連續 60 回合沒有吃子' };
      else if (!G.board.some(p => p && [4, 5, 6, 7].includes(p & 7))) over = { winner: -1, why: '雙方都沒有能過河攻擊的棋子' };
    }
  }
  if (!quiet && chk && !over) TB.sfx('check');
  if (over && !quiet) { G.over = over; finish(); }
  else if (over) G.over = over;
}
function finish() {
  const o = G.over, ai = settings.mode === 'ai', me = settings.color === 'r' ? 0 : 1;
  if (settings.mode === 'online') { // 線上對局：結果視窗、戰績由 online.js 處理；留一份棋譜給覆盤
    TB.store.set('xiangqi:lastgame', { moves: G.moves.map(x => x.m), settings, over: o }); return;
  }
  TB.bump(GAME, 'played');
  TB.store.set('xiangqi:lastgame', { moves: G.moves.map(x => x.m), settings, over: o });
  if (o.winner === -1) TB.bump(GAME, 'draw');
  else if (ai && o.winner === me) { TB.bump(GAME, 'won'); TB.bump(GAME, 'won-lv' + settings.level); }
  save();
  const eloRes = ai ? TB.elo.update(GAME, settings.level - 1, LEVELS.length, o.winner === -1 ? 0.5 : o.winner === me ? 1 : 0) : null;
  let title, snd;
  if (o.winner === -1) { title = '和局'; snd = 'draw'; }
  else if (ai) { title = o.winner === me ? '你贏了！' : '電腦贏了'; snd = o.winner === me ? 'win' : 'lose'; }
  else { title = (o.winner === 0 ? '紅方' : '黑方') + '勝'; snd = 'win'; }
  setTimeout(() => {
    TB.sfx(snd);
    TB.dialog({ title, html: '<p>' + o.why + (o.winner >= 0 ? '，' + (o.winner === 0 ? '紅方' : '黑方') + '獲勝。' : '。') + '</p><p>共 ' + Math.ceil(G.moves.length / 2) + ' 回合。</p>' + (eloRes ? TB.elo.html(eloRes) : ''),
      buttons: [{ label: '看棋盤', value: 0 }, { label: '覆盤', value: 2 }, { label: '再來一局', primary: true, value: 1 }] })
      .then(v => { if (v === 1) newGame(); else if (v === 2) enterReview(); });
  }, 450);
}

function maybeAI() {
  render();
  if (!aiTurn() || thinking) return;
  thinking = true; render();
  const lv = LEVELS[settings.level - 1] || LEVELS[2];
  const startLen = G.moves.length, t0 = performance.now();
  AI.ask({ board: G.board.slice(), side: G.side, hist: G.hashes.slice(0, -1).slice(-200), depth: lv.depth, time: lv.time, noise: lv.noise, avoid: foulMoves(G.side) })
    .then(res => {
      const wait = Math.max(0, 380 - (performance.now() - t0));
      setTimeout(() => {
        thinking = false;
        if (!G || G.over || G.moves.length !== startLen || !res || !res.move) { render(); return; }
        hint = 0; applyMove(res.move); save(); render(); loop();
      }, wait);
    }).catch(() => { thinking = false; render(); });
}

// ---------------- 畫面配置 ----------------
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const main = document.getElementById('main');
let U = 40, DPR = 1, OX = 0, OY = 0, grainCache = null;
function layout() {
  const W = main.clientWidth, H = main.clientHeight;
  const narrow = W < 720 || W < H * 1.05;
  document.body.classList.toggle('narrow', narrow);
  let aw, ah;
  const side = document.getElementById('side'), last = document.getElementById('last'), box = document.getElementById('movesBox');
  // 窄螢幕：棋譜移到棋盤下方，用掉多出來的高度（不再上下留白）
  if (narrow) { if (box.parentNode !== main) main.insertBefore(box, last); }
  else if (box.parentNode !== side) side.appendChild(box);
  document.body.classList.remove('mv');
  if (narrow) {

  game: 'xiangqi', title: '象棋',
  seatName: s => s === 0 ? '紅方' : '黑方',
  firstNote: s => s === 0 ? '（先走）' : '',
  getState: () => ({ moves: G.moves.map(x => x.m), over: G.over }),
  setState(st, info) {
    if (R) exitReview(true);
    if (thinking) { AI.kill(); thinking = false; }
    settings = { mode: 'online', level: settings.level || 2, color: ONL.mySeat === 1 ? 'b' : 'r' };
    const prev = G ? G.moves.length : 0;
    rebuildFrom(st.moves || []);
    G.over = st.over || null;
    sel = -1; targets = []; hint = 0; anim = null;
    const last = G.moves[G.moves.length - 1];
    if (info && info.fresh && G.moves.length === prev + 1 && last) {
      anim = { p: G.board[last.m & 127], from: last.m >> 7, to: last.m & 127, cap: last.cap, t0: performance.now() };
      TB.sfx(last.cap ? 'capture' : 'place');
      X.init(G.board, G.side); if (!G.over && X.inCheck(G.side)) TB.sfx('check');
    }
    layout(); render(); if (anim) loop();
  },
  newState(hostSeat) {
    if (R) exitReview(true);
    if (thinking) { AI.kill(); thinking = false; }
    settings = { mode: 'online', level: settings.level || 2, color: hostSeat === 1 ? 'b' : 'r' };
    rebuildFrom([]); sel = -1; targets = []; hint = 0; anim = null; layout(); render();
  },
  hostMove(seat, m) {
    if (!G || G.over || G.side !== seat) return false;
    X.init(G.board, G.side); if (!X.legal().includes(m)) return false;
    applyMove(m); render(); loop(); return true;
  },
  undoFor(seat) {
    const len = G.moves.length; let n = 0;
    do { n++; } while (len - n > 0 && (len - n) % 2 !== seat);
    if ((len - n) % 2 !== seat) return;
    rebuildFrom(G.moves.slice(0, len - n).map(x => x.m)); sel = -1; targets = []; hint = 0; anim = null;
    TB.sfx('click'); render();
  },
  forceOver(w, why) { G.over = { winner: w, why }; finish(); render(); },
  overInfo: () => G && G.over ? { winner: G.over.winner, why: G.over.why + (G.over.winner >= 0 ? '，' + (G.over.winner === 0 ? '紅方' : '黑方') + '獲勝。' : '。') } : null,
  turnSeat: () => G && !G.over ? G.side : -1,
  moveCount: () => G ? G.moves.length : 0,
  review: () => enterReview(),
  onChange: () => { if (G && !R) render(); },
  onLeave() { settings = offlineSettings(); if (!load()) newGame(); else { layout(); render(); maybeAI(); } },
});

if (ONL.resume()) { if (!G) { settings = Object.assign({}, settings, { mode: 'online' }); rebuildFrom([]); } layout(); render(); }
else if (!load()) newGame();
else { layout(); render(); maybeAI(); }
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { grainCache = null; layout(); });
</script>
</body>
</html>
