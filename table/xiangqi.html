<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f6fb">
<title>象棋 · 棋牌桌遊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="common.css">
<style>
:root{--accent:#f43f5e;--accent-ink:#e11d48;--accent-soft:#fff1f3}
.tb-btn.primary{box-shadow:0 4px 12px rgba(244,63,94,.35)}
.tb-main{flex-direction:row;align-items:center;justify-content:center;gap:20px}
body.narrow .tb-main{flex-direction:column;gap:8px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#cv{display:block;touch-action:none;border-radius:20px;box-shadow:0 2px 6px rgba(17,24,39,.06),0 18px 40px rgba(201,139,74,.25);flex:none}
.xq-side{width:270px;flex:none;align-self:stretch;max-height:100%;display:flex;flex-direction:column;gap:12px;min-height:0;padding:4px 0}
body.narrow .xq-side{width:100%;max-width:560px;align-self:center;gap:6px;padding:0}
.xq-status{font-size:16px;font-weight:500;text-align:center;padding:10px 12px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);min-height:44px}
body.narrow .xq-status{font-size:14px;padding:6px 10px;min-height:0;border-radius:12px}
.xq-status b.r{color:#f43f5e}.xq-status b.k{color:#1e293b}
.xq-status .warn{color:#fff;background:#f43f5e;font-weight:700;padding:1px 10px;border-radius:999px;animation:xqw .8s ease-in-out infinite alternate}
.xq-pl{display:flex;flex-direction:column;gap:8px}
body.narrow .xq-pl{flex-direction:row;gap:6px}
.xq-p{border:2px solid transparent;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 12px;flex:1;min-width:0;transition:border-color .2s}
body.narrow .xq-p{padding:5px 9px;border-radius:12px}
.xq-p.on{border-color:#f43f5e;background:#fff5f6}
.xq-p .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.narrow .xq-p .nm{font-size:12px;gap:5px}
.xq-dot{width:14px;height:14px;border-radius:50%;flex:none;border:3px solid;background:#fff}
.xq-dot.r{border-color:#f43f5e}.xq-dot.k{border-color:#1e293b}
.xq-cap{display:flex;flex-wrap:wrap;gap:3px;min-height:22px;margin-top:6px}
body.narrow .xq-cap{min-height:18px;margin-top:3px}
.xq-cap i{font-style:normal;font-weight:900;font-size:12px;width:22px;height:22px;line-height:18px;text-align:center;border-radius:50%;background:#fff;border:2px solid;flex:none;box-shadow:0 1px 2px rgba(17,24,39,.12)}
body.narrow .xq-cap i{width:17px;height:17px;font-size:10px;line-height:13px;border-width:1.5px}
.xq-cap i.r{color:#f43f5e;border-color:#f43f5e}.xq-cap i.k{color:#1e293b;border-color:#1e293b}
.xq-moves{flex:1;min-height:60px;overflow:auto;border-radius:16px;background:var(--panel);box-shadow:var(--shadow);padding:10px 8px;font-size:14px}
.xq-moves h4{margin:0 4px 6px;font-size:12px;color:var(--mute);letter-spacing:.08em;font-weight:700}
.xq-moves ol{margin:0;padding:0;list-style:none;font-weight:700}
.xq-moves li{display:grid;grid-template-columns:30px 1fr 1fr;gap:4px;padding:3px 6px;border-radius:8px}
.xq-moves li:nth-child(odd){background:var(--panel2)}
.xq-moves li span:first-child{color:var(--mute);font-weight:400;font-size:12px;align-self:center}
.xq-moves .r{color:#f43f5e}
.xq-moves .cur{background:#ffe4e8;border-radius:6px}
body.narrow .xq-moves{display:none}
body.narrow .tb-main{justify-content:flex-start}
body.narrow.mv .xq-moves{display:block;width:100%;max-width:560px;flex:1 1 0;min-height:0;align-self:center;padding:8px 6px;font-size:13px}
body.narrow.mv .xq-last{display:none}
.xq-last{display:none;font-weight:700;font-size:14px;color:var(--mute);text-align:center;min-height:1.5em}
body.narrow .xq-last{display:block}
.xq-think{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f43f5e;margin-left:6px;animation:xqp 1s infinite}
@media (max-width:430px){.tb-bar{gap:4px;padding:0 6px}.tb-bar .tb-btn{padding:6px 8px}.tb-title{margin:0 2px;flex:none}}
@media (max-width:350px){.tb-title{display:none}}
@keyframes xqp{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes xqw{from{box-shadow:0 0 0 0 rgba(244,63,94,.5)}to{box-shadow:0 0 0 6px rgba(244,63,94,0)}}
</style>
</head>
<body class="tb">
<header class="tb-bar">
  <a class="tb-back" href="index.html">← 棋牌</a>
  <h1 class="tb-title">象棋</h1>
  <span class="tb-sp"></span>
  <button class="tb-btn" id="bNew">新局</button>
  <button class="tb-btn" id="bUndo">悔棋</button>
  <button class="tb-btn" id="bHint">提示</button>
  <button class="tb-btn" id="bInfo"><span class="tb-hide-s">規則・</span>戰績</button>
  <button class="tb-btn icon" id="tb-mute"></button>
</header>
<main class="tb-main" id="main">
  <aside class="xq-side" id="side">
    <div class="xq-status" id="status"></div>
    <div class="xq-pl">
      <div class="xq-p" id="pTop"><div class="nm"></div><div class="xq-cap"></div></div>
      <div class="xq-p" id="pBot"><div class="nm"></div><div class="xq-cap"></div></div>
    </div>
    <div class="xq-moves" id="movesBox"><h4>棋譜</h4><ol id="moves"></ol></div>
  </aside>
  <canvas id="cv" aria-label="象棋棋盤"></canvas>
  <div class="xq-last" id="last"></div>
</main>
<script src="common.js"></script>
<script src="xq-logic.js"></script>
<script>
'use strict';
const LOGIC = XQLOGIC;
// ======================================================================
// 主畫面
// ======================================================================
const L = {}; LOGIC(L); const X = L.X;
const AI = TB.worker(LOGIC);
const GAME = 'xiangqi';
const LEVELS = [
  { name: '入門', depth: 1, noise: 260 },
  { name: '初級', depth: 2, noise: 90 },
  { name: '中級', depth: 4, time: 700 },
  { name: '高級', depth: 8, time: 1600 },
  { name: '大師', depth: 24, time: 3000 },
];
const NAMES = ['', '帥', '仕', '相', '傌', '俥', '炮', '兵', '', '將', '士', '象', '馬', '車', '包', '卒'];
const SHORT = ['', '帥', '仕', '相', '傌', '俥', '炮', '兵', '', '將', '士', '象', '馬', '車', '包', '卒'];
const RANK = [9, 9, 4, 3, 2, 0, 1, 5];
const CN = '零一二三四五六七八九', FW = '０１２３４５６７８９';
const START = (() => {
  const b = new Array(90).fill(0), back = [5, 4, 3, 2, 1, 2, 3, 4, 5];
  for (let c = 0; c < 9; c++) { b[c] = back[c] + 8; b[81 + c] = back[c]; }
  b[2 * 9 + 1] = b[2 * 9 + 7] = 14; b[7 * 9 + 1] = b[7 * 9 + 7] = 6;
  for (let c = 0; c < 9; c += 2) { b[3 * 9 + c] = 15; b[6 * 9 + c] = 7; }
  return b;
})();

let settings = Object.assign({ mode: 'ai', level: 2, color: 'r' }, TB.store.get('xiangqi:settings', {}));
let G = null;        // {board:Array, side, moves:[{m,cap,txt}], hashes:[[h1,h2]], over:null|{...}}
let sel = -1, targets = [], hint = 0, thinking = false, anim = null, drag = null;

function humanSide() { return settings.mode === 'pvp' ? G.side : (settings.color === 'r' ? 0 : 1); }
function aiTurn() { return settings.mode === 'ai' && !G.over && G.side !== (settings.color === 'r' ? 0 : 1); }
function flipped() { return settings.mode === 'ai' && settings.color === 'b'; }

function newGame() {
  G = { board: START.slice(), side: 0, moves: [], hashes: [], over: null };
  X.init(G.board, 0); G.hashes.push(X.hash());
  sel = -1; targets = []; hint = 0; anim = null;
  save(); render(); maybeAI();
}
function save() { TB.store.set('xiangqi:game', { settings, moves: G.moves.map(x => x.m), over: G.over }); }
function load() {
  const s = TB.store.get('xiangqi:game', null);
  if (!s || !Array.isArray(s.moves)) return false;
  try {
    settings = Object.assign(settings, s.settings || {});
    G = { board: START.slice(), side: 0, moves: [], hashes: [], over: null };
    X.init(G.board, 0); G.hashes.push(X.hash());
    for (const m of s.moves) { if (!X.legal().includes(m)) throw 0; applyMove(m, true); }
    G.over = s.over || null;
    return true;
  } catch (e) { return false; }
}

// 中文記譜（在走之前呼叫）
function notation(m) {
  const b = G.board, from = m >> 7, to = m & 127, p = b[from], t = p & 7, red = p < 8;
  const fr = (from / 9) | 0, fc = from % 9, tr = (to / 9) | 0, tc = to % 9;
  const num = n => red ? CN[n] : FW[n];
  const file = c => red ? 9 - c : c + 1;
  let head;
  const same = []; for (let r = 0; r < 10; r++) if (b[r * 9 + fc] === p) same.push(r);
  if (same.length >= 2) {
    const ord = red ? same.slice().sort((a, b) => a - b) : same.slice().sort((a, b) => b - a);
    const i = ord.indexOf(fr), n = ord.length;
    const tag = n === 2 ? ['前', '後'][i] : n === 3 ? ['前', '中', '後'][i] : CN[i + 1];
    head = tag + SHORT[p];
  } else head = SHORT[p] + num(file(fc));
  const fwd = red ? tr < fr : tr > fr;
  let act, tgt;
  if (tr === fr) { act = '平'; tgt = num(file(tc)); }
  else { act = fwd ? '進' : '退'; tgt = (t === X.N || t === X.B || t === X.A) ? num(file(tc)) : num(Math.abs(tr - fr)); }
  return head + act + tgt;
}
function applyMove(m, quiet) {
  const txt = notation(m);
  const from = m >> 7, to = m & 127, cap = G.board[to];
  X.init(G.board, G.side); X.make(m);
  G.board[to] = G.board[from]; G.board[from] = 0; G.side ^= 1;
  G.moves.push({ m, cap, txt }); G.hashes.push(X.hash());
  if (!quiet) {
    anim = { p: G.board[to], from, to, cap, t0: performance.now() };
    TB.sfx(cap ? 'capture' : 'place');
  }
  checkEnd(quiet);
}
function checkEnd(quiet) {
  X.init(G.board, G.side);
  const lm = X.legal(), chk = X.inCheck(G.side);
  let over = null;
  if (!lm.length) over = { winner: G.side ^ 1, why: chk ? '將死' : '困斃' };
  else {
    const [a, b] = G.hashes[G.hashes.length - 1];
    if (G.hashes.filter(h => h[0] === a && h[1] === b).length >= 3) over = { winner: -1, why: '同一局面重複三次' };
    else {
      let n = 0; for (let i = G.moves.length - 1; i >= 0 && !G.moves[i].cap; i--) n++;
      if (n >= 120) over = { winner: -1, why: '連續 60 回合沒有吃子' };
      else if (!G.board.some(p => p && [4, 5, 6, 7].includes(p & 7))) over = { winner: -1, why: '雙方都沒有能過河攻擊的棋子' };
    }
  }
  if (!quiet && chk && !over) TB.sfx('check');
  if (over && !quiet) { G.over = over; finish(); }
  else if (over) G.over = over;
}
function finish() {
  const o = G.over, ai = settings.mode === 'ai', me = settings.color === 'r' ? 0 : 1;
  TB.bump(GAME, 'played');
  if (o.winner === -1) TB.bump(GAME, 'draw');
  else if (ai && o.winner === me) { TB.bump(GAME, 'won'); TB.bump(GAME, 'won-lv' + settings.level); }
  save();
  let title, snd;
  if (o.winner === -1) { title = '和局'; snd = 'draw'; }
  else if (ai) { title = o.winner === me ? '你贏了！' : '電腦贏了'; snd = o.winner === me ? 'win' : 'lose'; }
  else { title = (o.winner === 0 ? '紅方' : '黑方') + '勝'; snd = 'win'; }
  setTimeout(() => {
    TB.sfx(snd);
    TB.dialog({ title, html: '<p>' + o.why + (o.winner >= 0 ? '，' + (o.winner === 0 ? '紅方' : '黑方') + '獲勝。' : '。') + '</p><p>共 ' + Math.ceil(G.moves.length / 2) + ' 回合。</p>',
      buttons: [{ label: '看棋盤', value: 0 }, { label: '再來一局', primary: true, value: 1 }] })
      .then(v => { if (v === 1) newGame(); });
  }, 450);
}

function maybeAI() {
  render();
  if (!aiTurn() || thinking) return;
  thinking = true; render();
  const lv = LEVELS[settings.level - 1] || LEVELS[2];
  const startLen = G.moves.length, t0 = performance.now();
  AI.ask({ board: G.board.slice(), side: G.side, hist: G.hashes.slice(0, -1).slice(-200), depth: lv.depth, time: lv.time, noise: lv.noise })
    .then(res => {
      const wait = Math.max(0, 380 - (performance.now() - t0));
      setTimeout(() => {
        thinking = false;
        if (!G || G.over || G.moves.length !== startLen || !res || !res.move) { render(); return; }
        hint = 0; applyMove(res.move); save(); render(); loop();
      }, wait);
    }).catch(() => { thinking = false; render(); });
}

// ---------------- 畫面配置 ----------------
const cv = document.getElementById('cv'), g = cv.getContext('2d');
const main = document.getElementById('main');
let U = 40, DPR = 1, OX = 0, OY = 0, grainCache = null;
function layout() {
  const W = main.clientWidth, H = main.clientHeight;
  const narrow = W < 720 || W < H * 1.05;
  document.body.classList.toggle('narrow', narrow);
  let aw, ah;
  const side = document.getElementById('side'), last = document.getElementById('last'), box = document.getElementById('movesBox');
  // 窄螢幕：棋譜移到棋盤下方，用掉多出來的高度（不再上下留白）
  if (narrow) { if (box.parentNode !== main) main.insertBefore(box, last); }
  else if (box.parentNode !== side) side.appendChild(box);
  document.body.classList.remove('mv');
  if (narrow) {
    aw = W - 16; ah = H - 16 - side.offsetHeight - last.offsetHeight - 16;
    U = Math.max(18, Math.floor(Math.min(aw / 10, ah / 11)));
    if (H - 16 - side.offsetHeight - 11 * U - 16 >= 90) document.body.classList.add('mv');
  } else { aw = W - 24 - 270 - 18; ah = H - 24; }
  U = Math.max(18, Math.floor(Math.min(aw / 10, ah / 11)));
  DPR = Math.min(3, window.devicePixelRatio || 1);
  cv.style.width = U * 10 + 'px'; cv.style.height = U * 11 + 'px';
  cv.width = Math.round(U * 10 * DPR); cv.height = Math.round(U * 11 * DPR);
  OX = U; OY = U; grainCache = null;
  draw();
}
const sq2xy = sq => { let r = (sq / 9) | 0, c = sq % 9; if (flipped()) { r = 9 - r; c = 8 - c; } return [OX + c * U, OY + r * U]; };
function xy2sq(x, y) {
  let c = Math.round((x - OX) / U), r = Math.round((y - OY) / U);
  if (c < 0 || c > 8 || r < 0 || r > 9) return -1;
  const dx = x - (OX + c * U), dy = y - (OY + r * U);
  if (dx * dx + dy * dy > (U * 0.52) ** 2) return -1;
  if (flipped()) { r = 9 - r; c = 8 - c; }
  return r * 9 + c;
}

function woodLayer() {
  if (grainCache) return grainCache;
  const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height;
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const gr = x.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#fff7e6'); gr.addColorStop(1, '#ffeccb');
  x.fillStyle = gr; x.fillRect(0, 0, w, h);
  // 河道：淡淡的天藍色帶
  return grainCache = c;
}

function drawBoard() {
  g.drawImage(woodLayer(), 0, 0, cv.width / DPR, cv.height / DPR);
  const ink = '#c98b4a';
  g.strokeStyle = ink; g.lineCap = 'square';
  // 外框
  g.fillStyle = 'rgba(56,189,248,.13)'; g.fillRect(OX, OY + 4 * U, 8 * U, U);
  g.lineWidth = Math.max(2, U * 0.06); g.beginPath(); g.roundRect ? g.roundRect(OX - U * 0.2, OY - U * 0.2, 8 * U + U * 0.4, 9 * U + U * 0.4, U * 0.12) : g.rect(OX - U * 0.2, OY - U * 0.2, 8 * U + U * 0.4, 9 * U + U * 0.4); g.stroke();
  g.lineWidth = Math.max(1, U * 0.035);
  g.beginPath();
  for (let r = 0; r < 10; r++) { g.moveTo(OX, OY + r * U); g.lineTo(OX + 8 * U, OY + r * U); }
  for (let c = 0; c < 9; c++) {
    if (c === 0 || c === 8) { g.moveTo(OX + c * U, OY); g.lineTo(OX + c * U, OY + 9 * U); }
    else { g.moveTo(OX + c * U, OY); g.lineTo(OX + c * U, OY + 4 * U); g.moveTo(OX + c * U, OY + 5 * U); g.lineTo(OX + c * U, OY + 9 * U); }
  }
  // 九宮
  g.moveTo(OX + 3 * U, OY); g.lineTo(OX + 5 * U, OY + 2 * U); g.moveTo(OX + 5 * U, OY); g.lineTo(OX + 3 * U, OY + 2 * U);
  g.moveTo(OX + 3 * U, OY + 7 * U); g.lineTo(OX + 5 * U, OY + 9 * U); g.moveTo(OX + 5 * U, OY + 7 * U); g.lineTo(OX + 3 * U, OY + 9 * U);
  g.stroke();
  // 炮位、兵位的角標
  const marks = [[2, 1], [2, 7], [7, 1], [7, 7], [3, 0], [3, 2], [3, 4], [3, 6], [3, 8], [6, 0], [6, 2], [6, 4], [6, 6], [6, 8]];
  const a = U * 0.1, l = U * 0.2;
  g.beginPath();
  for (const [r, c] of marks) {
    const x = OX + c * U, y = OY + r * U;
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      if ((c === 0 && sx < 0) || (c === 8 && sx > 0)) continue;
      g.moveTo(x + sx * a, y + sy * (a + l)); g.lineTo(x + sx * a, y + sy * a); g.lineTo(x + sx * (a + l), y + sy * a);
    }
  }
  g.lineWidth = Math.max(1, U * 0.03); g.stroke();
  // 楚河 漢界
  g.fillStyle = 'rgba(14,165,233,.75)'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 ' + Math.round(U * 0.46) + 'px "Noto Sans TC","Noto Sans CJK TC","PingFang TC",sans-serif';
  const ry = OY + 4.5 * U;
  const L1 = flipped() ? ['漢', '界'] : ['楚', '河'], R1 = flipped() ? ['楚', '河'] : ['漢', '界'];
  g.fillText(L1[0], OX + 1.4 * U, ry); g.fillText(L1[1], OX + 2.6 * U, ry);
  g.fillText(R1[0], OX + 5.4 * U, ry); g.fillText(R1[1], OX + 6.6 * U, ry);
  // 路數
  g.font = '700 ' + Math.round(U * 0.26) + 'px "Noto Sans TC","Noto Sans CJK TC",sans-serif'; g.fillStyle = 'rgba(160,110,60,.75)';
  for (let c = 0; c < 9; c++) {
    const x = OX + c * U, bc = flipped() ? 8 - c : c;
    const redTxt = CN[9 - bc], blkTxt = String(bc + 1);
    g.fillText(flipped() ? redTxt : blkTxt, x, OY - U * 0.62);
    g.fillText(flipped() ? blkTxt : redTxt, x, OY + 9 * U + U * 0.62);
  }
}

function drawPiece(p, x, y, opt) {
  opt = opt || {};
  const r = U * 0.45, red = p < 8, col = red ? '#f43f5e' : '#1e293b';
  const lift = opt.lift ? U * 0.08 : 0, cy = y - lift;
  g.save();
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  // 陰影＋白色底
  g.shadowColor = red ? 'rgba(244,63,94,.28)' : 'rgba(30,41,59,.28)'; g.shadowBlur = U * (opt.lift ? 0.4 : 0.16); g.shadowOffsetY = U * (opt.lift ? 0.18 : 0.07);
  g.beginPath(); g.arc(x, cy, r, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill();
  g.shadowColor = 'transparent';
  // 粗彩色外圈
  g.beginPath(); g.arc(x, cy, r - U * 0.045, 0, Math.PI * 2); g.lineWidth = U * 0.09; g.strokeStyle = col; g.stroke();
  // 內圈淡色
  g.beginPath(); g.arc(x, cy, r * 0.7, 0, Math.PI * 2); g.lineWidth = U * 0.02; g.strokeStyle = red ? 'rgba(244,63,94,.35)' : 'rgba(30,41,59,.3)'; g.stroke();
  g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '900 ' + Math.round(U * 0.46) + 'px "Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif';
  g.fillText(NAMES[p], x, cy + U * 0.02);
  if (opt.ring) { g.beginPath(); g.arc(x, cy, r + U * 0.07, 0, Math.PI * 2); g.lineWidth = U * 0.06; g.strokeStyle = opt.ring; g.stroke(); }
  g.restore();
}
function corners(x, y, color) {
  const a = U * 0.47, l = U * 0.14;
  g.strokeStyle = color; g.lineWidth = Math.max(2, U * 0.05); g.beginPath();
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) { g.moveTo(x + sx * a, y + sy * (a - l)); g.lineTo(x + sx * a, y + sy * a); g.lineTo(x + sx * (a - l), y + sy * a); }
  g.stroke();
}

function draw() {
  if (!G) return;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawBoard();
  const lm = G.moves[G.moves.length - 1];
  if (lm) { const [fx, fy] = sq2xy(lm.m >> 7), [tx, ty] = sq2xy(lm.m & 127); corners(fx, fy, 'rgba(99,102,241,.45)'); corners(tx, ty, '#6366f1'); }
  // 將軍時帥/將發紅光
  X.init(G.board, G.side);
  const chk = !G.over && X.inCheck(G.side);
  let now = performance.now(), ap = 0;
  if (anim) { ap = Math.min(1, (now - anim.t0) / 200); if (ap >= 1) anim = null; }
  for (let sq = 0; sq < 90; sq++) {
    const p = G.board[sq]; if (!p) continue;
    if (anim && sq === anim.to) continue;
    if (drag && drag.moved && sq === drag.sq) continue;
    const [x, y] = sq2xy(sq);
    if (chk && (p & 7) === 1 && (p < 8 ? 0 : 1) === G.side) {
      g.save(); const gl = g.createRadialGradient(x, y, U * .3, x, y, U * .8); gl.addColorStop(0, 'rgba(244,63,94,.75)'); gl.addColorStop(1, 'rgba(244,63,94,0)'); g.fillStyle = gl; g.beginPath(); g.arc(x, y, U * .8, 0, 7); g.fill(); g.restore();
    }
    drawPiece(p, x, y, { lift: sq === sel && !drag, ring: sq === sel ? '#f59e0b' : null });
  }
  if (hint) {
    const [fx, fy] = sq2xy(hint >> 7), [tx, ty] = sq2xy(hint & 127);
    g.save(); g.beginPath(); g.arc(tx, ty, U * 0.5, 0, 7); g.lineWidth = U * 0.08; g.strokeStyle = 'rgba(16,185,129,.95)'; g.stroke(); g.globalAlpha = .85; g.strokeStyle = 'rgba(16,185,129,.9)'; g.fillStyle = 'rgba(16,185,129,.9)'; g.lineWidth = U * 0.12; g.lineCap = 'round';
    const ang = Math.atan2(ty - fy, tx - fx), ex = tx - Math.cos(ang) * U * 0.3, ey = ty - Math.sin(ang) * U * 0.3;
    g.beginPath(); g.moveTo(fx, fy); g.lineTo(ex, ey); g.stroke();
    g.beginPath(); g.moveTo(tx, ty); g.lineTo(ex - Math.cos(ang - 0.5) * U * 0.3, ey - Math.sin(ang - 0.5) * U * 0.3); g.lineTo(ex - Math.cos(ang + 0.5) * U * 0.3, ey - Math.sin(ang + 0.5) * U * 0.3); g.closePath(); g.fill();
    g.restore();
  }
  // 可走的點
  for (const t of targets) {
    const [x, y] = sq2xy(t);
    if (G.board[t]) { g.save(); g.beginPath(); g.arc(x, y, U * 0.5, 0, 7); g.lineWidth = U * 0.07; g.strokeStyle = 'rgba(244,63,94,.95)'; g.setLineDash([U * .12, U * .08]); g.stroke(); g.restore(); }
    else { g.beginPath(); g.arc(x, y, U * 0.15, 0, 7); g.fillStyle = 'rgba(16,185,129,.85)'; g.fill(); }
  }
  if (anim) {
    const [fx, fy] = sq2xy(anim.from), [tx, ty] = sq2xy(anim.to), e = 1 - Math.pow(1 - ap, 3);
    if (anim.cap) drawPiece(anim.cap, tx, ty, { alpha: 1 - ap });
    drawPiece(anim.p, fx + (tx - fx) * e, fy + (ty - fy) * e, { lift: ap < 1 });
  }
  if (drag && drag.moved) drawPiece(G.board[drag.sq], drag.x, drag.y - U * 0.15, { lift: true });
}
function loop() { draw(); if (anim) requestAnimationFrame(loop); }

// ---------------- 側欄 ----------------
function render() {
  if (!G) return;
  const st = document.getElementById('status');
  const who = s => s === 0 ? '<b class="r">紅方</b>' : '<b class="k">黑方</b>';
  const lv = LEVELS[settings.level - 1];
  X.init(G.board, G.side); const chk = !G.over && X.inCheck(G.side);
  if (G.over) {
    const o = G.over;
    st.innerHTML = o.winner === -1 ? '和局・' + o.why : who(o.winner) + ' 勝・' + o.why;
  } else if (thinking) st.innerHTML = '電腦（' + lv.name + '）思考中<span class="xq-think"></span>';
  else {
    let s = '輪到 ' + who(G.side);
    if (settings.mode === 'ai') s += G.side === humanSide() ? '（你）' : '';
    if (chk) s += '　<span class="warn">將軍！</span>';
    st.innerHTML = s;
  }
  // 玩家欄：上面是畫面上方那一方
  const topSide = flipped() ? 0 : 1, botSide = 1 - topSide;
  const label = s => {
    const nm = s === 0 ? '紅方' : '黑方';
    if (settings.mode === 'pvp') return nm;
    return nm + (s === (settings.color === 'r' ? 0 : 1) ? '・你' : '・電腦 ' + lv.name);
  };
  for (const [id, s] of [['pTop', topSide], ['pBot', botSide]]) {
    const el = document.getElementById(id);
    el.classList.toggle('on', !G.over && G.side === s);
    el.querySelector('.nm').innerHTML = '<span class="xq-dot ' + (s === 0 ? 'r' : 'k') + '"></span>' + label(s);
    // 這一方吃掉的子
    const caps = G.moves.filter((mv, i) => mv.cap && (i % 2 === 0 ? 0 : 1) === s).map(mv => mv.cap).sort((a, b) => RANK[a & 7] - RANK[b & 7]);
    el.querySelector('.xq-cap').innerHTML = caps.map(p => '<i class="' + (p < 8 ? 'r' : 'k') + '">' + NAMES[p] + '</i>').join('');
  }
  // 棋譜
  const ol = document.getElementById('moves');
  let h = '';
  for (let i = 0; i < G.moves.length; i += 2) {
    const a = G.moves[i], b = G.moves[i + 1], last = G.moves.length - 1;
    h += '<li><span>' + (i / 2 + 1) + '.</span><span class="r' + (i === last ? ' cur' : '') + '">' + a.txt + '</span><span' + (b && i + 1 === last ? ' class="cur"' : '') + '>' + (b ? b.txt : '') + '</span></li>';
  }
  ol.innerHTML = h; const box = document.getElementById('movesBox'); box.scrollTop = box.scrollHeight;
  const lastEl = document.getElementById('last');
  const lmv = G.moves[G.moves.length - 1];
  lastEl.textContent = lmv ? '第 ' + Math.ceil(G.moves.length / 2) + ' 回合：' + lmv.txt : '紅方先走';
  document.getElementById('bUndo').disabled = settings.mode === 'ai' ? G.moves.length < (settings.color === 'r' ? 1 : 2) : !G.moves.length;
  document.getElementById('bHint').disabled = !!G.over || aiTurn() || thinking;
  draw();
}

// ---------------- 操作 ----------------
function canTouch() { return G && !G.over && !thinking && !anim && !aiTurn(); }
function pickTargets(sq) {
  X.init(G.board, G.side);
  return X.legal().filter(m => (m >> 7) === sq).map(m => m & 127);
}
function tryMove(from, to) {
  if (!targets.includes(to)) return false;
  sel = -1; targets = []; hint = 0;
  applyMove(from << 7 | to); save(); render(); loop();
  if (!G.over) setTimeout(maybeAI, 220);
  return true;
}
function evPos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener('pointerdown', e => {
  if (!canTouch()) return;
  const [x, y] = evPos(e), sq = xy2sq(x, y);
  if (sq < 0) { if (sel >= 0) { sel = -1; targets = []; draw(); } return; }
  const p = G.board[sq];
  if (sel >= 0 && targets.includes(sq)) { tryMove(sel, sq); return; }
  if (p && (p < 8 ? 0 : 1) === G.side) {
    sel = sq; targets = pickTargets(sq); TB.sfx('select');
    drag = { sq, x, y, x0: x, y0: y, moved: false };
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    draw();
  } else if (sel >= 0) { if (p) TB.sfx('bad'); sel = -1; targets = []; draw(); }
});
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const [x, y] = evPos(e); drag.x = x; drag.y = y;
  if (!drag.moved && Math.hypot(x - drag.x0, y - drag.y0) > U * 0.25) drag.moved = true;
  if (drag.moved) draw();
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    const [x, y] = evPos(e), sq = xy2sq(x, y);
    if (sq >= 0 && sq !== d.sq && targets.includes(sq)) { tryMove(d.sq, sq); return; }
    if (sq !== d.sq && sq >= 0) TB.sfx('bad');
  }
  draw();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', () => { drag = null; draw(); });

document.getElementById('bNew').onclick = () => {
  const html = TB.seg('對手', 'mode', [['ai', '電腦'], ['pvp', '兩人同一台']], settings.mode) +
    TB.seg('電腦棋力', 'level', LEVELS.map((l, i) => [i + 1, l.name]), settings.level) +
    TB.seg('我執', 'color', [['r', '紅方（先走）'], ['b', '黑方']], settings.color) +
    '<p style="font-size:13px">入門會常常走錯，適合剛學象棋的小朋友；大師每步大約想 3 秒。</p>';
  TB.dialog({ title: '新的一局', html, buttons: [{ label: '取消', value: 0 }, {
    label: '開始', primary: true, value: 1, onClick: dlg => {
      settings = { mode: TB.segVal(dlg, 'mode'), level: +TB.segVal(dlg, 'level'), color: TB.segVal(dlg, 'color') };
      TB.store.set('xiangqi:settings', settings);
    } }] }).then(v => { if (v === 1) { if (thinking) { AI.kill(); thinking = false; } newGame(); } });
};
document.getElementById('bUndo').onclick = () => {
  if (!G.moves.length) return;
  if (thinking) { AI.kill(); thinking = false; }
  let n = 1;
  if (settings.mode === 'ai') {
    const me = settings.color === 'r' ? 0 : 1, len = G.moves.length;
    n = 0;
    do { n++; } while (len - n > 0 && (len - n) % 2 !== me);
  }
  if (!n) return;
  const keep = G.moves.slice(0, G.moves.length - n).map(x => x.m);
  G = { board: START.slice(), side: 0, moves: [], hashes: [], over: null };
  X.init(G.board, 0); G.hashes.push(X.hash());
  for (const m of keep) applyMove(m, true);
  G.over = null; sel = -1; targets = []; hint = 0; anim = null;
  TB.sfx('click'); save(); render(); maybeAI();
};
document.getElementById('bHint').onclick = () => {
  if (!canTouch()) return;
  const b = document.getElementById('bHint'); b.disabled = true; b.textContent = '想想…';
  const len = G.moves.length;
  AI.ask({ board: G.board.slice(), side: G.side, hist: G.hashes.slice(0, -1).slice(-200), depth: 6, time: 900 }).then(res => {
    b.textContent = '提示';
    if (G.moves.length !== len || !res.move) { render(); return; }
    hint = res.move; sel = -1; targets = []; TB.sfx('select');
    TB.toast('建議：' + notation(res.move)); render();
  }).catch(() => { b.textContent = '提示'; render(); });
};
document.getElementById('bInfo').onclick = () => {
  const s = TB.stats(GAME), p = s.played || 0, w = s.won || 0;
  const lvl = LEVELS.map((l, i) => s['won-lv' + (i + 1)] ? l.name + ' ' + s['won-lv' + (i + 1)] + ' 勝' : '').filter(Boolean).join('、');
  TB.dialog({ title: '象棋', html: TB.statsHtml([['已下', p], ['贏電腦', w], ['和局', s.draw || 0], ['勝率', p ? Math.round(w / p * 100) + '%' : '—']]) +
    (lvl ? '<p style="font-size:13px">' + lvl + '</p>' : '') +
    `<div class="tb-rules">
    <h4>目標</h4><p>把對方的「將／帥」將死（對方怎麼走都會被吃）就贏了。對方無棋可走（困斃）也算贏。紅方先走。</p>
    <h4>棋子走法</h4><ul>
    <li><b>帥／將</b>：在九宮裡直走或橫走一格。兩個王不能在同一條直線上直接面對面（中間要有子）。</li>
    <li><b>仕／士</b>：在九宮裡斜走一格。</li>
    <li><b>相／象</b>：斜走兩格（田字），中間有子擋住就不能走（塞象眼），不能過河。</li>
    <li><b>馬</b>：走日字，先直走一格再斜走一格；直走的那一格有子就不能走（蹩馬腳）。</li>
    <li><b>俥／車</b>：直線走任意格，不能跳過棋子。</li>
    <li><b>炮／包</b>：不吃子時跟車一樣走；吃子時中間必須剛好隔一個子（炮架）。</li>
    <li><b>兵／卒</b>：只能往前一格；過河之後也可以左右走，但永遠不能後退。</li></ul>
    <h4>和局（本遊戲的簡化規則）</h4><ul>
    <li>同一個局面出現三次（例如雙方來回重複走）。正式比賽的「長將判負」等細則這裡不判，都算和局。</li>
    <li>連續 60 回合雙方都沒有吃子。</li>
    <li>雙方都沒有車、馬、炮、兵卒這些能過河進攻的子。</li></ul>
    <h4>操作</h4><p>點一下自己的棋子，綠點是可以走的地方，紅色虛線圈是可以吃的子；也可以直接拖曳。走錯可以按「悔棋」，不知道怎麼走可以按「提示」。對電腦時，棋局會自動保存，關掉網頁再回來可以接著下。</p>
    <h4>棋譜記法</h4><p>例如「炮二平五」：紅方從右數第二路的炮，橫走到第五路。「進」是往前、「退」是往後；紅方用國字一到九，黑方用數字１到９，都從自己的右手邊數起。</p>
    </div>`, buttons: [{ label: '關閉', primary: true }] });
};

addEventListener('resize', () => layout());
if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(main);
if (!load()) newGame();
else { layout(); render(); maybeAI(); }
layout();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { grainCache = null; layout(); });
</script>
</body>
</html>
