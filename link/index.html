<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#eef4ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>連線一起玩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#eef4ff; --bg2:#dfe9ff; --card:#fff; --ink:#1f2346; --mute:#6b7196; --line:#d5def5;
  --pri:#5b5bf7; --prid:#3a36c4; --acc:#ff7a45; --accd:#c2502a; --ok:#22c26a; --bad:#ef4444;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --round:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --top:calc(46px + env(safe-area-inset-top,0px));
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{background:radial-gradient(1200px 600px at 10% -10%,#fff 0,transparent 60%),radial-gradient(900px 500px at 110% 110%,#ffe9dc 0,transparent 60%),var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.page{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) calc(14px + env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.title{margin:6px 0 0;font-weight:900;font-size:clamp(32px,10vw,50px);letter-spacing:.06em;text-align:center;line-height:1.1;
  color:var(--ink);text-shadow:3px 3px 0 #ffd166}
.eyebrow{margin:0;text-align:center;font-family:var(--round);font-weight:700;color:var(--pri);letter-spacing:.2em;font-size:12px}
.sub{margin:0;color:var(--mute);font-size:14px;text-align:center;line-height:1.6}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 2px 0 var(--line),0 10px 30px rgba(60,70,140,.08)}
.card h2{margin:0 0 10px;font-size:17px;font-weight:900}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.txt{background:#f6f8ff;border:3px solid var(--line);border-radius:14px;padding:10px 12px;font-size:20px;font-weight:700;width:100%;
  -webkit-user-select:text;user-select:text;outline:none}
input.txt:focus{border-color:var(--pri)}
#joinCode{font-family:var(--round);letter-spacing:.25em;text-transform:uppercase;text-align:center;font-size:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:18px;padding:13px 18px;border-radius:16px;
  background:var(--pri);color:#fff;box-shadow:0 5px 0 var(--prid);min-height:52px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--prid)}
.btn.acc{background:var(--acc);box-shadow:0 5px 0 var(--accd)}
.btn.acc:active{box-shadow:0 2px 0 var(--accd)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{font-size:14px;padding:8px 12px;min-height:38px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.animals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.animals button{aspect-ratio:1;border-radius:14px;background:#f6f8ff;border:3px solid transparent;display:grid;place-items:center;padding:2px}
.animals button.on{border-color:var(--pri);background:#eef0ff}
.animals img{width:100%;height:100%;object-fit:contain}
.seg{display:inline-flex;background:#eef1fb;border-radius:14px;padding:4px;gap:4px}
.seg button{padding:8px 14px;border-radius:10px;font-weight:900;font-size:15px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.status{color:var(--bad);font-size:14px;text-align:center;min-height:1.2em;margin:0;font-weight:700}
.note{background:#fff7e0;color:#7a5200;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.6;font-weight:700}
.back{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:5;
  background:#fff;border-radius:12px;padding:7px 11px;font-weight:700;font-size:14px;box-shadow:0 2px 0 var(--line);color:var(--ink);text-decoration:none}

/* lobby */
.roomBar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.roomCode{font-family:var(--round);font-weight:700;font-size:30px;letter-spacing:.18em;line-height:1}
.roomCode small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:0;color:var(--mute);font-weight:700;margin-bottom:4px}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{display:flex;align-items:center;gap:6px;background:#f6f8ff;border-radius:999px;padding:4px 10px 4px 4px;font-weight:700;font-size:14px;border:2px solid transparent;position:relative}
.pl img{width:34px;height:34px}
.pl.me{border-color:var(--pri)}
.pl.off{opacity:.45}
.pl .tr{font-size:12px;color:#b77900}
.pl .crown{position:absolute;left:-2px;top:-10px;font-size:15px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{border-radius:18px;background:#f6f8ff;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;border:3px solid transparent;position:relative;min-height:112px}
.gcard.on{border-color:var(--acc);background:#fff4ee}
.gcard .ic{font-size:30px;line-height:1}
.gcard .nm{font-weight:900;font-size:16px}
.gcard .bl{font-size:12.5px;color:var(--mute);line-height:1.45}
.gcard .pp{font-size:11.5px;font-weight:700;color:var(--pri)}
.gsel{display:flex;gap:12px;align-items:center}
.gsel .ic{font-size:44px}
.wait{color:var(--mute);font-weight:700;text-align:center;font-size:15px;padding:6px}
.share{display:flex;gap:8px;flex-wrap:wrap}

/* table (big screen) lobby */
body.table .wrap{max-width:1500px}
.tlobby{display:grid;grid-template-columns:360px 1fr;gap:20px;align-items:start}
.tlobby .qr{width:100%;aspect-ratio:1;image-rendering:pixelated;border-radius:16px;border:6px solid #fff;box-shadow:0 0 0 3px var(--ink)}
.tlobby .roomCode{font-size:56px;text-align:center}
.tlobby .players .pl{font-size:20px;padding:6px 16px 6px 6px}
.tlobby .players .pl img{width:54px;height:54px}
.tlobby .gsel .ic{font-size:80px}
.tlobby .gsel .nm{font-size:36px;font-weight:900}
@media (max-width:820px){.tlobby{grid-template-columns:1fr}}

/* top bar during games */
#bar{position:fixed;left:0;right:0;top:0;height:var(--top);padding:calc(6px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-right,0px)) 6px calc(8px + env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:8px;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 1px 0 var(--line)}
#bar .gname{font-weight:900;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .meChip{display:flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
#bar .meChip img{width:26px;height:26px}
#bar button{background:#f1f3fb;border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.bad{background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
#stage{position:fixed;left:0;right:0;bottom:0;top:var(--top);overflow:hidden}
#menu{position:fixed;right:10px;top:calc(var(--top) + 6px);z-index:30;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:180px}
#menu button{padding:10px 12px;border-radius:10px;font-weight:700;text-align:left;background:#f6f8ff}

/* overlays */
.ovl{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(31,35,70,.45)}
.ovl .box{background:#fff;border-radius:24px;padding:20px;max-width:520px;width:100%;max-height:100%;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ovl .big{font-size:56px;line-height:1}
.ovl h2{margin:8px 0;font-size:26px;font-weight:900}
.rules{text-align:left;margin:10px 0;padding:0 0 0 20px;line-height:1.7;font-size:15.5px}
.count{font-family:var(--round);font-weight:700;font-size:40px;color:var(--acc)}
#netMsg{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;background:#1f2346;color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
#toast{position:fixed;left:50%;top:calc(var(--top) + 12px);transform:translateX(-50%);z-index:50;background:#fff;color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:900;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
.res{display:flex;flex-direction:column;gap:8px;margin:12px 0;text-align:left}
.res .r{display:flex;align-items:center;gap:10px;background:#f6f8ff;border-radius:14px;padding:6px 10px}
.res .r.win{background:#fff4d6}
.res .r .rk{font-family:var(--round);font-weight:700;font-size:22px;width:28px;text-align:center}
.res .r img{width:40px;height:40px}
.res .r .nm{font-weight:900}
.res .r .ln{color:var(--mute);font-size:13.5px}
body.table .ovl .box{max-width:900px}
body.table .res .r{font-size:22px}
</style>
</head>
<body>
<a class="back" href="../" id="backHall">← 遊戲大廳</a>

<!-- home: name + animal, then create or join -->
<div class="page" id="home">
  <div class="wrap">
    <p class="eyebrow">連線遊戲專區 · ONLINE</p>
    <h1 class="title">連線一起玩</h1>
    <p class="sub">每個人的手機都有自己的畫面：自己的手牌、自己的身分、自己的視角。<br>在同一個空間或各自在家都能玩。</p>
    <section class="card" id="profCard">
      <h2>你是誰？</h2>
      <input class="txt" id="name" maxlength="8" placeholder="你的名字" autocomplete="off">
      <div class="animals" id="animals" style="margin-top:10px"></div>
    </section>
    <section class="card" id="joinCard">
      <h2>加入朋友的房間</h2>
      <div class="row" style="flex-wrap:nowrap">
        <input class="txt" id="joinCode" maxlength="5" placeholder="房號" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button class="btn" id="joinBtn" style="flex:none">加入</button>
      </div>
      <button class="btn ghost small" id="joinTableBtn" style="margin-top:10px">📺 用這台當大螢幕加入</button>
    </section>
    <section class="card">
      <h2>自己開一個房間</h2>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn acc wide" id="createBtn">🎮 開新房間（我也要玩）</button>
        <button class="btn ghost wide" id="tableBtn">📺 這台當大螢幕（電視・電腦）</button>
      </div>
      <p class="sub" style="margin-top:10px;text-align:left">開好房間後，把房號或連結傳給大家。大螢幕不是必要的，只是給大家一起看的公共畫面。</p>
    </section>
    <p class="status" id="homeStatus"></p>
  </div>
</div>

<!-- lobby -->
<div class="page" id="lobby" hidden>
  <div class="wrap" id="lobbyWrap"></div>
</div>

<!-- in-game -->
<div id="bar" hidden>
  <span class="dot" id="netDot"></span>
  <span class="gname" id="barName"></span>
  <span class="meChip" id="barMe"></span>
  <button id="barSound" aria-label="聲音">🔊</button>
  <button id="barMenu">⋯</button>
</div>
<div id="stage" hidden></div>
<div id="menu" hidden></div>

<div class="ovl" id="intro" hidden><div class="box" id="introBox"></div></div>
<div class="ovl" id="result" hidden><div class="box" id="resultBox"></div></div>
<div id="toast" hidden></div>
<div id="netMsg" hidden></div>

<script src="../party/critter.js"></script>
<script src="../party/qrcode.js"></script>
<script src="net.js"></script>
<script src="core.js"></script>
<script src="games/cards.js"></script>
<script src="games/spy.js"></script>
<script src="games/snake.js"></script>
<script src="games/race.js"></script>
<script src="games/telephone.js"></script>
<script src="games/ship.js"></script>
<script src="games/fog.js"></script>
<script src="games/treasure.js"></script>
<script>App.boot();</script>
</body>
</html>
