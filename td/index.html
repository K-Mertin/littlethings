<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>守塔奇兵 · Tower Keepers</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#141a2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#141a2e; --panel:rgba(22,27,50,.94); --panel2:#252d52; --panel3:#2f3966; --line:rgba(255,255,255,.12); --ink:#f6f1e7; --mute:#a9b0c8;
  --gold:#ffc94a; --gold2:#ff9f2e; --red:#ff5d6c; --mint:#4fe0a5; --blue:#6fc3ff; --violet:#b48bff;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --round:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:default}
#app{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
#probe{position:absolute;visibility:hidden;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
[hidden]{display:none!important}

/* ── 遊戲中 HUD ── */
.ui{position:absolute;display:none}
.playing .ui{display:flex}
#hud{left:0;top:0;align-items:center;gap:8px;padding:0 10px;padding-top:var(--sat);z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 8px;border-radius:999px;background:rgba(12,14,28,.62);border:1px solid var(--line);
  font-family:var(--round);font-weight:700;font-size:17px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.chip small{font-family:var(--sans);font-size:11px;color:var(--mute);font-weight:500}
.chip .ic{width:18px;height:18px;flex:none}
.chip.lives b{color:#ffd0d5}
.chip.gold b{color:#ffe08a}
.chip.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.12)}}
.chip.hurt{animation:hurt .4s}
@keyframes hurt{30%{background:rgba(255,60,80,.6)}}
.grow{flex:1}
.hb{height:34px;min-width:42px;padding:0 10px;border-radius:12px;background:rgba(12,14,28,.62);border:1px solid var(--line);font-family:var(--round);font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hb:hover{background:rgba(40,46,80,.8)}
.hb.on{background:var(--gold);color:#3a2300;border-color:var(--gold)}
.hb svg{width:16px;height:16px}

/* ── 右側 / 下方面板 ── */
#panel{flex-direction:column;gap:8px;padding:10px;background:var(--panel);border-left:1px solid var(--line);z-index:3;overflow:hidden;
  box-shadow:-10px 0 30px rgba(0,0,0,.3)}
.portrait #panel{border-left:0;border-top:1px solid var(--line);padding:7px 8px calc(7px + var(--sab));gap:6px;box-shadow:0 -10px 30px rgba(0,0,0,.3)}
.landscape #panel{padding-top:calc(10px + var(--sat));padding-right:calc(10px + var(--sar));padding-bottom:calc(10px + var(--sab))}
#pTop{display:flex;align-items:center;gap:6px;flex:none}
.skill{position:relative;width:46px;height:46px;flex:none;border-radius:14px;background:linear-gradient(180deg,#3a2f5e,#2a2346);border:1px solid rgba(255,255,255,.18);overflow:hidden}
.skill img{width:34px;height:34px;display:block;margin:auto}
.skill .cd{position:absolute;inset:0;background:rgba(8,8,20,.72);transform-origin:bottom;transform:scaleY(var(--cd,0))}
.skill .cdn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--round);font-weight:700;font-size:15px;text-shadow:0 1px 2px #000}
.skill kbd{position:absolute;right:3px;bottom:1px;font-family:var(--round);font-size:10px;color:var(--mute)}
.skill.aim{box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,180,60,.6)}
.skill.locked{opacity:.3}
.skill.ready{box-shadow:0 0 0 1px rgba(255,220,120,.5),0 0 10px rgba(255,180,60,.25)}
#pv{flex:1;min-width:0;display:flex;align-items:center;gap:4px;overflow:hidden;padding:4px 6px;border-radius:12px;background:rgba(0,0,0,.22);height:46px}
#pv .lb{font-size:11px;color:var(--mute);line-height:1.15;flex:none;margin-right:2px}
#pv .lb b{display:block;font-family:var(--round);font-size:14px;color:var(--ink)}
.en{display:flex;align-items:center;flex:none;position:relative;border-radius:8px}
.en img{width:30px;height:30px}
.en span{font-family:var(--round);font-weight:700;font-size:12px;margin-left:-4px;color:#fff;text-shadow:0 1px 2px #000}
.en.boss{background:rgba(255,80,80,.25)}
.en.new::after{content:'新';position:absolute;top:-3px;left:-2px;font-size:9px;background:var(--red);color:#fff;border-radius:6px;padding:0 3px;line-height:13px}
.next{flex:none;height:46px;min-width:76px;padding:0 10px;border-radius:14px;font-weight:900;font-size:15px;line-height:1.1;
  background:linear-gradient(180deg,#ff8a5a,#e5484d);color:#fff;box-shadow:0 3px 0 #9a2430;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.next small{display:block;font-size:11px;font-weight:700;opacity:.92}
.next.go{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 3px 0 #9a2430,0 0 18px rgba(255,120,80,.7)}}
.next:disabled{background:#3a4166;box-shadow:0 3px 0 #22284a;color:var(--mute);animation:none}
.next:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #9a2430}
#tip{flex:none;font-size:12.5px;line-height:1.45;color:#dfe3f0;min-height:1.45em;padding:0 2px}
#tip b{color:var(--gold)}
#tip .warn{color:#ff9aa4}
.portrait #tip{font-size:11.5px;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 商店 */
#shop{display:grid;grid-template-columns:1fr 1fr;gap:7px;overflow-y:auto;align-content:start;flex:1;min-height:0}
.portrait #shop{display:flex;gap:5px;overflow-x:auto;overflow-y:hidden;flex:1}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px 5px;border-radius:14px;
  background:linear-gradient(180deg,var(--panel3),var(--panel2));border:1px solid var(--line);min-height:92px;transition:transform .08s}
.portrait .tb{flex:1 1 0;min-width:0;min-height:0;padding:3px 2px;border-radius:12px}
.tb img{width:54px;height:54px;margin-top:-4px}
.portrait .tb img{width:clamp(34px,10vw,48px);height:clamp(34px,10vw,48px)}
.tb .nm{font-size:13px;font-weight:700;white-space:nowrap}
.portrait .tb .nm{font-size:11px}
.tb .pr{display:flex;align-items:center;gap:3px;font-family:var(--round);font-weight:700;font-size:14px;color:#ffe08a}
.portrait .tb .pr{font-size:12px}
.tb .pr i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffc94a 50%,#c98a1a);display:inline-block}
.tb kbd{position:absolute;top:4px;left:7px;font-family:var(--round);font-size:10px;color:var(--mute)}
.touch .tb kbd,.touch .skill kbd,.touch .kb{display:none}
.tb.poor .pr{color:#ff8a94}
.tb.poor img{filter:saturate(.4) brightness(.8)}
.tb.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset,0 0 16px rgba(255,200,80,.35);background:linear-gradient(180deg,#4a4270,#352f5a)}
.tb.locked{opacity:.38}
.tb.locked .pr{color:var(--mute);font-family:var(--sans);font-size:11px}
.tb:not(.locked):hover{transform:translateY(-1px)}

/* 塔的資訊 */
#info{display:flex;flex-direction:column;gap:7px;flex:1;min-height:0;overflow-y:auto}
.portrait #info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);grid-template-rows:auto auto auto;gap:5px 8px;overflow:hidden;align-content:start}
.portrait .ti-head{grid-column:1;grid-row:1}
.portrait .ti-stats{grid-column:1/3;grid-row:2}
.ti-head{display:flex;align-items:center;gap:8px}
.ti-head img{width:48px;height:48px;flex:none;margin:-4px 0}
.portrait .ti-head img{width:38px;height:38px}
.ti-name{flex:1;min-width:0}
.ti-name b{font-size:16px;font-weight:900;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti-name span{font-size:11.5px;color:var(--mute)}
.ti-x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);font-size:15px;flex:none}
.ti-stats{display:flex;flex-wrap:wrap;gap:4px}
.ti-stats span{font-size:11.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:#dfe3f0;white-space:nowrap}
.ti-stats span b{font-family:var(--round);font-weight:600;color:#fff}
.ti-ups{display:flex;flex-direction:column;gap:6px}
.portrait .ti-ups{grid-column:2;grid-row:1;flex-direction:column;gap:5px}
.portrait .ti-ups.two{flex-direction:row}
.up{position:relative;text-align:left;padding:8px 10px;border-radius:12px;background:linear-gradient(180deg,#3b6a4e,#2c5240);border:1px solid rgba(140,255,190,.25);display:flex;flex-direction:column;gap:1px}
.portrait .up{flex:1;padding:5px 7px;min-width:0}
.up b{font-size:14px;font-weight:900}
.portrait .up b{font-size:12.5px}
.up small{font-size:11.5px;color:#d8f5e3;line-height:1.35}
.portrait .up small{font-size:10.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.up .pr{position:absolute;right:9px;top:7px;font-family:var(--round);font-weight:700;color:#ffe08a;font-size:14px}
.portrait .up .pr{right:7px;top:4px;font-size:12.5px}
.portrait .up small{-webkit-line-clamp:1}
.portrait .ti-ups.two .up small{-webkit-line-clamp:2}
.portrait .ti-stats{min-height:22px}
.portrait .ti-stats span{font-size:11px;padding:2px 6px}
.up.spec{background:linear-gradient(180deg,#4c3f7a,#382e5e);border-color:rgba(200,170,255,.3)}
.up.poor{filter:saturate(.35);opacity:.75}
.up.poor .pr{color:#ff8a94}
.up:not(.poor):hover{filter:brightness(1.1)}
.maxed{font-size:12px;color:var(--mute);padding:8px;border-radius:12px;background:rgba(255,255,255,.05);text-align:center}
.ti-row{display:flex;gap:6px;align-items:stretch}
.portrait .ti-row{grid-column:1/3;grid-row:3}
.modes{display:flex;flex:1;background:rgba(0,0,0,.25);border-radius:10px;padding:2px;gap:2px}
.modes button{flex:1;font-size:12px;padding:5px 0;border-radius:8px;color:var(--mute);white-space:nowrap}
.portrait .modes button{font-size:11px;padding:4px 0}
.modes button.on{background:var(--blue);color:#06233a;font-weight:700}
.sell{padding:0 10px;border-radius:10px;background:rgba(255,93,108,.16);border:1px solid rgba(255,93,108,.35);color:#ffc1c7;font-size:12.5px;white-space:nowrap;min-height:30px}
.sell b{font-family:var(--round);color:#ffe08a}
.ti-note{font-size:11.5px;color:var(--mute);line-height:1.4}
.portrait .ti-note{display:none}

/* ── 選單層 ── */
.ov{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;overflow-y:auto;
  padding:calc(16px + var(--sat)) calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal))}
.ov.dim{background:rgba(10,12,26,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);justify-content:center}
.card{width:min(100%,460px);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px}
.ov h2{margin:0;font-weight:900;font-size:26px;letter-spacing:.06em;text-align:center}
.sub{margin:0;color:var(--mute);font-size:13.5px;line-height:1.6;text-align:center}
.big{width:100%;padding:14px 0;border-radius:16px;font-size:20px;font-weight:900;letter-spacing:.2em;
  background:linear-gradient(180deg,#ffd86a,#ff9f2e);color:#3a1d00;box-shadow:0 4px 0 #a2520d,0 10px 24px rgba(255,150,40,.3)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #a2520d}
.big:disabled{filter:grayscale(1);opacity:.5}
.btn{flex:1;padding:11px 0;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:15px;font-weight:700;text-decoration:none;color:var(--ink);text-align:center;display:block}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.alt{background:linear-gradient(180deg,#5b4aa0,#43367a);border-color:rgba(200,170,255,.35)}
.row{display:flex;gap:8px;width:100%}
.tog{flex:1;padding:9px 0;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:13.5px}
.tog b{margin-left:.35em;color:var(--mute)}
.tog.on b{color:var(--mint)}
.hall{color:var(--mute);text-decoration:none;font-size:13px;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35)}
.hall:hover{color:var(--ink)}

#ovTitle{justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 35%,rgba(10,12,30,.15),rgba(10,12,30,.7) 75%)}
.logo{text-align:center;margin-bottom:6px}
.logo small{display:block;font-family:var(--round);font-weight:600;font-size:12px;letter-spacing:.4em;color:#ffe9b0;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.logo h1{margin:4px 0 0;font-weight:900;font-size:clamp(52px,13vw,92px);letter-spacing:.12em;margin-right:-.12em;line-height:1.05;
  background:linear-gradient(180deg,#fff 0%,#ffe9a0 40%,#ffb340 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #8a3a00) drop-shadow(0 8px 18px rgba(0,0,0,.55))}
.logo .en2{margin:6px 0 0;font-family:var(--round);font-weight:700;font-size:clamp(16px,4vw,22px);letter-spacing:.38em;margin-right:-.38em;color:#bfe6ff;text-shadow:0 2px 0 #1b3b6a,0 4px 12px rgba(0,0,0,.6)}
.tmenu{width:min(100%,380px);display:flex;flex-direction:column;gap:10px;align-items:center}
.starline{font-family:var(--round);font-weight:700;font-size:16px;color:#ffe08a;background:rgba(0,0,0,.4);padding:4px 14px;border-radius:999px;border:1px solid var(--line)}

/* 選關 */
.bar{width:100%;max-width:1100px;display:flex;align-items:center;gap:10px;margin-bottom:12px;flex:none}
.bar h2{flex:1;text-align:left;font-size:22px}
.back{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:14px;white-space:nowrap}
#ovLevels,#ovMeta{background:radial-gradient(1000px 600px at 20% 0%,rgba(111,195,255,.12),transparent 60%),radial-gradient(800px 600px at 90% 100%,rgba(255,201,74,.1),transparent 60%),rgba(16,20,38,.94)}
.lvgrid{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding-bottom:20px}
.lv{position:relative;border-radius:18px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);text-align:left;display:flex;flex-direction:column;transition:transform .12s}
.lv:not(.locked):hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.lv canvas{display:block;width:100%!important;height:auto!important;aspect-ratio:16/10;background:#0005}
.lv .meta{padding:9px 12px 11px;display:flex;align-items:center;gap:8px}
.lv .num{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3a2300;font-family:var(--round);font-weight:700;display:grid;place-items:center;flex:none}
.lv .nm{flex:1;min-width:0}
.lv .nm b{display:block;font-size:16px;font-weight:900}
.lv .nm small{font-family:var(--round);font-size:10.5px;letter-spacing:.18em;color:var(--mute)}
.stars{font-size:18px;letter-spacing:1px;color:#4a5170;white-space:nowrap}
.stars .on{color:#ffd34a;text-shadow:0 0 8px rgba(255,200,60,.5)}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:rgba(255,93,108,.2);color:#ffb3bb;white-space:nowrap}
.tag.inf{background:rgba(111,195,255,.18);color:#bfe6ff}
.lv .badges{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.lv.locked canvas{filter:grayscale(1) brightness(.45)}
.lv.locked::after{content:'尚未解鎖';position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.6);color:#cfd5e8}
.lv.locked .num{background:#4a5170;color:#aab}

/* 關卡簡報 */
#ovBrief .card{width:min(100%,520px)}
.brief-thumb{border-radius:14px;overflow:hidden;line-height:0}
.brief-thumb canvas{width:100%!important;height:auto!important}
.bt{display:flex;align-items:baseline;gap:10px}
.bt h2{text-align:left}
.bt small{font-family:var(--round);letter-spacing:.2em;color:var(--mute);font-size:12px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-weight:700}
.seg button.on{background:var(--gold);color:#3a2300;border-color:var(--gold)}
.seg button[data-d=hard].on{background:#ff6b5a;border-color:#ff6b5a;color:#fff}
.seg button[data-d=easy].on{background:var(--mint);border-color:var(--mint);color:#063322}
.foes{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.foes img{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.05)}
.lbl{font-size:12px;color:var(--mute);margin:0}

/* 天賦樹 */
.mgrid{width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-bottom:20px}
@media (max-width:820px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.mgrid{grid-template-columns:1fr}}
.mcol h3{margin:0 0 8px;font-size:13px;letter-spacing:.3em;color:var(--mute);font-weight:700}
.mcol{display:flex;flex-direction:column;gap:8px}
.mn{position:relative;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:left}
.mn b{font-size:14.5px}
.mn .pips{display:flex;gap:3px;position:absolute;right:12px;top:13px}
.mn .pips i{width:9px;height:9px;border-radius:50%;background:#3d4570}
.mn .pips i.on{background:var(--gold);box-shadow:0 0 6px rgba(255,200,60,.6)}
.mn small{font-size:12px;color:#cfd5e8;line-height:1.4}
.mn .cost{align-self:flex-start;margin-top:3px;padding:4px 12px;border-radius:999px;background:var(--gold);color:#3a2300;font-weight:900;font-family:var(--round);font-size:13px}
.mn .cost:disabled{background:#3d4570;color:var(--mute)}
.mn.maxed{border-color:rgba(255,201,74,.45);background:linear-gradient(180deg,#3a3560,#2d2a4d)}
.mn.lock{opacity:.5}
.mn.req::before{content:'';position:absolute;left:22px;top:-9px;width:2px;height:9px;background:var(--line)}

/* 結算 */
.bigstars{display:flex;justify-content:center;gap:10px;font-size:54px;line-height:1}
.bigstars span{color:#3d4570;transform:scale(.4);opacity:0;transition:transform .35s cubic-bezier(.3,1.8,.5,1),opacity .2s}
.bigstars span.show{transform:scale(1);opacity:1}
.bigstars span.on{color:#ffd34a;text-shadow:0 0 18px rgba(255,200,60,.65),0 3px 0 #a26a00}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--mute)}

/* ── 精緻化：標題 ── */
.crest{width:clamp(70px,16vw,104px);height:auto;display:block;margin:0 auto 4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:crest 4s ease-in-out infinite}

#ovTitle{background:radial-gradient(ellipse at 50% 40%,rgba(10,12,30,.05),rgba(10,12,30,.55) 70%,rgba(10,12,30,.8))}

.chip{background:linear-gradient(180deg,rgba(40,30,20,.78),rgba(18,14,10,.78));border:1.5px solid rgba(255,214,120,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 8px rgba(0,0,0,.35)}
.hb{background:linear-gradient(180deg,rgba(40,30,20,.78),rgba(18,14,10,.78));border:1.5px solid rgba(255,214,120,.4)}

  background:radial-gradient(circle at 35% 30%,#fff3c0,#f2c14e 55%,#c88a1e);border:3px solid #5a3200;box-shadow:0 4px 0 #3a2000,0 8px 14px rgba(0,0,0,.45);transition:transform .15s}

.wn-lbl{display:flex;flex-direction:column;align-items:center;background:rgba(30,20,10,.72);border:1px solid rgba(255,214,120,.4);border-radius:10px;padding:2px 8px 3px;white-space:nowrap}

/* ── 圖鑑 ── */
#ovCodex{background:radial-gradient(1000px 600px at 20% 0%,rgba(111,195,255,.12),transparent 60%),rgba(16,20,38,.96)}

.bigstars span.on{animation:starpop .5s cubic-bezier(.3,1.8,.5,1)}

.mvp{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:14px;background:rgba(255,201,74,.1);border:1px solid rgba(255,201,74,.35)}

.stats{grid-template-columns:repeat(3,1fr)}

.chal{display:flex;flex-direction:column;gap:6px}
.chal-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ch-b{position:relative;text-align:left;padding:7px 8px 7px;border-radius:12px;background:linear-gradient(180deg,#5a3a2a,#3e2820);border:1px solid rgba(255,180,120,.3);display:flex;flex-direction:column;gap:2px}

  background:linear-gradient(180deg,rgba(60,40,10,.95),rgba(30,20,8,.95));border:2px solid #ffd36b;box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:none;max-width:92vw}

.wn-lbl b{font-size:15px;letter-spacing:.04em}
.wn-lbl .stars{font-size:14px}
.wn-lbl em{font-size:12px;font-weight:700;padding:0 6px;border-radius:999px;margin-top:1px;background:rgba(255,93,108,.18)}
.wn-lbl em.inf{background:rgba(111,195,255,.2)}
.wn-lbl em.ch{background:rgba(255,180,100,.18)}
@media (max-width:560px){.wn-lbl b{font-size:13.5px}.wn-lbl em{font-size:11px}.wn-lbl .stars{font-size:13px}}
@media (max-aspect-ratio:1/1){.wmap{flex:none;min-height:1180px}}
.portrait #info.hinfo .hs-t small{-webkit-line-clamp:1}
.portrait #info.hinfo .hbar{height:14px}.portrait #info.hinfo .hbar span{font-size:10px;line-height:13px}.portrait #info.hinfo .hbar.xp{height:11px}.portrait #info.hinfo .hbar.xp span{font-size:9px;line-height:10px}
.portrait #info.hinfo .ti-head img{width:34px;height:34px}
</style>
</head>
<body>
<div id="app">
  <div id="probe"></div>
  <canvas id="cv"></canvas>

  <div id="hud" class="ui">
    <div class="chip lives" id="cLives"><svg class="ic" viewBox="0 0 24 24"><path fill="#ff5d6c" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4h2c.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/><path fill="#ffa3ac" d="M7 7.2c-1.5.2-2.4 1.6-2.2 3 .1.5.8.5.9 0 .2-.9.8-1.6 1.7-1.9.6-.2.3-1.2-.4-1.1z"/></svg><b id="hLives">20</b></div>
    <div class="chip gold" id="cGold"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#c98a1a"/><circle cx="12" cy="11" r="9" fill="#ffc94a"/><circle cx="12" cy="11" r="6" fill="none" stroke="#e5a52a" stroke-width="2"/><circle cx="9" cy="7.5" r="2" fill="#fff3b0"/></svg><b id="hGold">0</b></div>
    <div class="chip wave"><small>波次</small><b id="hWave">0/10</b></div>
    <div class="grow"></div>
    <button class="hb" id="bSpeed" aria-label="遊戲速度">1×</button>
    <button class="hb" id="bPause" aria-label="暫停"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.6" height="12" rx="1" fill="currentColor"/><rect x="9.4" y="2" width="3.6" height="12" rx="1" fill="currentColor"/></svg></button>
  </div>

  <div id="panel" class="ui">
    <div id="pTop">
      <button class="skill" id="skMeteor" aria-label="隕石"><img alt=""><div class="cd"></div><div class="cdn"></div><kbd>Q</kbd></button>
      <button class="skill" id="skFreeze" aria-label="冰封"><img alt=""><div class="cd"></div><div class="cdn"></div><kbd>W</kbd></button>
      <button class="skill herob" id="skHero" aria-label="英雄" hidden><img alt=""><div class="cdn"></div><kbd>H</kbd></button>
      <div id="pv"></div>
      <button class="next" id="bNext">開始</button>
    </div>
    <div id="tip"></div>
    <div id="shop"></div>
    <div id="info" hidden></div>
  </div>

  <section id="ovTitle" class="ov">
    <div class="logo">
      <svg class="crest" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f7ff0"/><stop offset="1" stop-color="#23439a"/></linearGradient><linearGradient id="cgo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d8902a"/></linearGradient></defs>
        <g stroke="#3a2210" stroke-width="3" stroke-linecap="round"><line x1="14" y1="100" x2="100" y2="14"/><line x1="106" y1="100" x2="20" y2="14"/></g>
        <path d="M14 100l-6 10 12-4zM106 100l6 10-12-4z" fill="#e8e2d0"/><path d="M100 14l8-6-2 10zM20 14l-8-6 2 10z" fill="#d8dde6"/>
        <path d="M60 10l38 13v30c0 28-17 45-38 57C39 98 22 81 22 53V23z" fill="url(#cgo)" stroke="#5a3200" stroke-width="3"/>
        <path d="M60 19l30 10v24c0 23-13 37-30 47C43 90 30 76 30 53V29z" fill="url(#cg)"/>
        <path d="M44 82V52h-4v-9h7v5h5v-5h6v5h4v-5h6v5h5v-5h7v9h-4v30z" fill="#e8e2d2" stroke="#3a2a40" stroke-width="2"/><path d="M55 82V70a5 5 0 0110 0v12z" fill="#5a3a22"/><path d="M60 30v12" stroke="#3a2a40" stroke-width="2"/><path d="M60 30l10 3-10 3z" fill="#ff5d4a"/></svg>
      <small>MW · TOWER DEFENSE</small><h1>守塔奇兵</h1><p class="en2">TOWER KEEPERS</p></div>
    <div class="starline" id="tStars">★ 0</div>
    <div class="tmenu">
      <button class="big" id="tPlay">開始冒險</button>
      <div class="row"><button class="btn alt" id="tMeta">天賦樹</button><button class="btn alt2" id="tCodex">圖鑑</button><button class="btn" id="tHelp">怎麼玩</button></div>
      <div class="row"><button class="tog" data-opt="music">音樂<b>開</b></button><button class="tog" data-opt="sfx">音效<b>開</b></button></div>
      <a class="hall" href="../index.html">← 大廳</a>
    </div>
  </section>

  <section id="ovLevels" class="ov" hidden>
    <div class="bar"><button class="back" data-go="title">← 返回</button><h2>選擇關卡</h2><span class="starline" id="lStars">★ 0</span><button class="back" id="lCodex">圖鑑</button><button class="back" data-go="meta">天賦樹</button></div>
    <div class="wmap" id="wmap"></div>
  </section>

  <section id="ovBrief" class="ov dim" hidden>
    <div class="card">
      <div class="brief-thumb" id="bThumb"></div>
      <div class="bt"><h2 id="bName"></h2><small id="bEn"></small></div>
      <p class="sub" style="text-align:left" id="bStory"></p>
      <p class="lbl" id="bInfo"></p>
      <div class="foes" id="bFoes"></div>
      <p class="lbl">難度</p>
      <div class="seg" id="bDiff"><button data-d="easy">簡單</button><button data-d="normal">普通</button><button data-d="hard">困難</button></div>
      <p class="sub" style="text-align:left;min-height:1.6em" id="bDiffNote"></p>
      <button class="big" id="bGo">出 征</button>
      <button class="btn alt" id="bEndless">無盡模式</button>
      <div class="chal" id="bChal"></div>
      <button class="btn" id="bBack">返回</button>
    </div>
  </section>

  <section id="ovMeta" class="ov" hidden>
    <div class="bar"><button class="back" id="mBack">← 返回</button><h2>天賦樹</h2><span class="starline" id="mStars">★ 0</span><button class="back" id="mReset">重置</button></div>
    <p class="sub" style="max-width:700px;margin-bottom:12px">過關得到的星星可以在這裡換成永久加成。每關最多 3 顆星，困難過關再加 2 顆，三個關卡挑戰各 1 顆，無盡模式每撐過 10 波再 1 顆（每張地圖最多 5 顆）。重置會把星星全部退回。</p>
    <div class="mgrid" id="mGrid"></div>
  </section>

  <section id="ovPause" class="ov dim" hidden>
    <div class="card">
      <h2>暫停</h2>
      <p class="sub" id="pInfo"></p>
      <button class="big" id="pResume">繼 續</button>
      <div class="row"><button class="btn" id="pRestart">重新開始</button><button class="btn" id="pQuit">選關</button></div>
      <div class="row"><button class="tog" data-opt="music">音樂<b>開</b></button><button class="tog" data-opt="sfx">音效<b>開</b></button></div>
      <div class="row"><button class="btn" id="pHelp">怎麼玩</button><a class="btn" href="../index.html">← 大廳</a></div>
    </div>
  </section>

  <section id="ovResult" class="ov dim" hidden>
    <div class="card">
      <div class="r-head"><div class="r-rays"></div><img id="rArt" alt=""><h2 id="rTitle">勝利！</h2></div>
      <p class="sub" id="rSub"></p>
      <div class="bigstars" id="rStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="stats" id="rStats"></div>
      <div class="mvp" id="rMvp" hidden></div>
      <div class="reward" id="rReward"></div>
      <div class="unlock" id="rUnlock" hidden></div>
      <button class="big" id="rNext">下一關</button>
      <div class="row"><button class="btn" id="rRetry">再玩一次</button><button class="btn" id="rLevels">選關</button></div>
    </div>
  </section>

  <section id="ovCodex" class="ov" hidden>
    <div class="bar"><button class="back" id="cxBack">← 返回</button><h2>圖鑑</h2><span class="starline" id="cxCount"></span></div>
    <div class="cx-tabs" id="cxTabs"><button data-tab="tower" class="on">防禦塔</button><button data-tab="enemy">敵人</button><button data-tab="ach">成就</button></div>
    <div class="cx-grid" id="cxBody"></div>
  </section>

  <div id="achToast" class="ach-toast" hidden></div>

  <section id="ovHelp" class="ov dim" hidden>
    <div class="card help" id="helpBody"></div>
  </section>
</div>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/waves.js"></script>
<script src="js/sim.js"></script>
<script src="js/hero.js"></script>
<script src="js/bot.js"></script>
<script src="js/gfx.js"></script>
<script src="js/art.js"></script>
<script src="js/rig.js"></script>
<script src="js/beasts.js"></script>
<script src="js/beasts2.js"></script>
<script src="js/bosses.js"></script>
<script src="js/heroart.js"></script>
<script src="js/crew.js"></script>
<script src="js/terrain.js"></script>
<script src="js/fx.js"></script>
<script src="js/render.js"></script>
<script src="js/menus.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
